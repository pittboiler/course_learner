<svg viewBox="0 0 770 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="11">An intrinsic field stands the solar wind off; an induced one lets it press onto the atmosphere.</text>
  <text x="150.0" y="52.0" fill="#8a8a8a" font-size="11.5">intrinsic magnetosphere  (Earth, the giants)</text>
  <line x1="58.0" y1="96.0" x2="79.0" y2="96.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="84.0,96.0 79.0,98.2 79.0,93.8" fill="#8a8a8a"/>
  <line x1="58.0" y1="118.0" x2="79.0" y2="118.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="84.0,118.0 79.0,120.2 79.0,115.8" fill="#8a8a8a"/>
  <line x1="58.0" y1="140.0" x2="79.0" y2="140.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="84.0,140.0 79.0,142.2 79.0,137.8" fill="#8a8a8a"/>
  <line x1="58.0" y1="162.0" x2="79.0" y2="162.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="84.0,162.0 79.0,164.2 79.0,159.8" fill="#8a8a8a"/>
  <line x1="58.0" y1="184.0" x2="79.0" y2="184.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="84.0,184.0 79.0,186.2 79.0,181.8" fill="#8a8a8a"/>
  <text x="52.0" y="88.0" fill="#8a8a8a" font-size="10">solar wind</text>
  <circle cx="210.0" cy="150.0" r="20.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.6" opacity="0.25"/>
  <text x="210.0" y="154.0" fill="#8a8a8a" font-size="10" text-anchor="middle"></text>
  <path d="M 138,150 A 72,86 0 0 1 330,66" fill="none" stroke="#e0645c" stroke-width="2.0"/>
  <path d="M 138,150 A 72,86 0 0 0 330,234" fill="none" stroke="#e0645c" stroke-width="2.0"/>
  <line x1="330.0" y1="66.0" x2="360.0" y2="62.0" stroke="#e0645c" stroke-width="2.0"/>
  <line x1="330.0" y1="234.0" x2="360.0" y2="238.0" stroke="#e0645c" stroke-width="2.0"/>
  <text x="132.0" y="142.0" fill="#e0645c" font-size="10" text-anchor="end">magnetopause</text>
  <text x="132.0" y="158.0" fill="#e0645c" font-size="10" text-anchor="end">R_mp &#8776; 10 R&#8853;</text>
  <path d="M 110,150 A 100,116 0 0 1 360,38" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M 110,150 A 100,116 0 0 0 360,262" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="106.0" y="120.0" fill="#8a8a8a" font-size="10" text-anchor="end">bow shock</text>
  <path d="M 176,150 A 34,40.8 0 0 1 223.6,112.6" fill="none" stroke="#4a90d9" stroke-width="1.2"/>
  <path d="M 176,150 A 34,40.8 0 0 0 223.6,187.4" fill="none" stroke="#4a90d9" stroke-width="1.2"/>
  <path d="M 160,150 A 50,60.0 0 0 1 230.0,95.0" fill="none" stroke="#4a90d9" stroke-width="1.2"/>
  <path d="M 160,150 A 50,60.0 0 0 0 230.0,205.0" fill="none" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="244.0" y="220.0" fill="#8a8a8a" font-size="10">tail</text>
  <text x="70.0" y="262.0" fill="#8a8a8a" font-size="10.5">The atmosphere never touches the solar wind &#8212;</text>
  <text x="70.0" y="278.0" fill="#8a8a8a" font-size="10.5">but the polar caps are OPEN field lines, and ions</text>
  <text x="70.0" y="294.0" fill="#8a8a8a" font-size="10.5">escape freely along them (the polar wind).</text>
  <text x="70.0" y="316.0" fill="#e0645c" font-size="10.5">Shielding is partial, not total.</text>
  <text x="500.0" y="52.0" fill="#8a8a8a" font-size="11.5">induced magnetosphere  (Venus, Mars, comets)</text>
  <line x1="432.0" y1="96.0" x2="453.0" y2="96.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="458.0,96.0 453.0,98.2 453.0,93.8" fill="#8a8a8a"/>
  <line x1="432.0" y1="118.0" x2="453.0" y2="118.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="458.0,118.0 453.0,120.2 453.0,115.8" fill="#8a8a8a"/>
  <line x1="432.0" y1="140.0" x2="453.0" y2="140.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="458.0,140.0 453.0,142.2 453.0,137.8" fill="#8a8a8a"/>
  <line x1="432.0" y1="162.0" x2="453.0" y2="162.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="458.0,162.0 453.0,164.2 453.0,159.8" fill="#8a8a8a"/>
  <line x1="432.0" y1="184.0" x2="453.0" y2="184.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="458.0,184.0 453.0,186.2 453.0,181.8" fill="#8a8a8a"/>
  <circle cx="580.0" cy="150.0" r="22.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.6" opacity="0.22"/>
  <circle cx="580.0" cy="150.0" r="31.0" fill="none" stroke="#4a90d9" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="616.0" y="120.0" fill="#4a90d9" font-size="10">ionosphere</text>
  <path d="M 460,98 Q 546,118.8 578,117.75999999999999 T 700,72.0" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <path d="M 460,116 Q 546,129.6 578,128.92000000000002 T 700,99.0" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <path d="M 460,184 Q 546,170.4 578,171.07999999999998 T 700,201.0" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <path d="M 460,202 Q 546,181.2 578,182.24 T 700,228.0" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <path d="M 460,136 Q 540,120 547,150" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <path d="M 460,164 Q 540,180 547,150" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="540.0" y="80.0" fill="#4a90d9" font-size="10" text-anchor="middle">the interplanetary field DRAPES</text>
  <text x="540.0" y="94.0" fill="#4a90d9" font-size="10" text-anchor="middle">around the conducting ionosphere</text>
  <text x="440.0" y="262.0" fill="#8a8a8a" font-size="10.5">The obstacle is the ionosphere itself, only a few</text>
  <text x="440.0" y="278.0" fill="#8a8a8a" font-size="10.5">hundred km up. The wind scours it directly:</text>
  <text x="440.0" y="294.0" fill="#8a8a8a" font-size="10.5">sputtering, ion pickup, charge exchange.</text>
  <text x="440.0" y="316.0" fill="#e0645c" font-size="10.5">And the SAME induction, driven by a moon&#8217;s</text>
  <text x="440.0" y="332.0" fill="#e0645c" font-size="10.5">rotating primary, is the ocean detector of 5.3.</text>
  <text x="70.0" y="362.0" fill="#8a8a8a" font-size="10.5">magnetopause standoff, in planetary radii (pressure balance B&#178;/2&#956;&#8320; = &#961;v&#178;):</text>
  <line x1="190.0" y1="384.0" x2="200.1" y2="384.0" stroke="#e0645c" stroke-width="6"/>
  <text x="184.0" y="388.0" fill="#8a8a8a" font-size="10" text-anchor="end">Mercury</text>
  <text x="206.1" y="388.0" fill="#8a8a8a" font-size="10">1.2</text>
  <line x1="190.0" y1="399.0" x2="258.0" y2="399.0" stroke="#4a90d9" stroke-width="6"/>
  <text x="184.0" y="403.0" fill="#8a8a8a" font-size="10" text-anchor="end">Earth</text>
  <text x="264.0" y="403.0" fill="#8a8a8a" font-size="10">8.1</text>
  <line x1="190.0" y1="414.0" x2="450.4" y2="414.0" stroke="#4a90d9" stroke-width="6"/>
  <text x="184.0" y="418.0" fill="#8a8a8a" font-size="10" text-anchor="end">Jupiter</text>
  <text x="456.4" y="418.0" fill="#8a8a8a" font-size="10">31</text>
  <text x="470.0" y="392.0" fill="#8a8a8a" font-size="10">Mercury&#8217;s magnetopause is barely off the ground &#8212; the solar wind</text>
  <text x="470.0" y="406.0" fill="#8a8a8a" font-size="10">reaches its surface. Jupiter&#8217;s is inflated well beyond this estimate</text>
  <text x="470.0" y="420.0" fill="#8a8a8a" font-size="10">by plasma from Io, which pressurises it from the inside.</text>
</svg>
