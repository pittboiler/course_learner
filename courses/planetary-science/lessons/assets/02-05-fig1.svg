<svg viewBox="0 0 770 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="11">The same convecting mantle writes two completely different surfaces, depending on whether the lid can break.</text>
  <text x="200.0" y="52.0" fill="#8a8a8a" font-size="12" text-anchor="middle" font-weight="bold">mobile lid  (Earth)</text>
  <text x="200.0" y="68.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">the lithosphere is broken into plates that recycle</text>
  <rect x="20.0" y="80.0" width="360.0" height="220.0" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="580.0" y="52.0" fill="#8a8a8a" font-size="12" text-anchor="middle" font-weight="bold">stagnant lid  (Mars, Venus, the Moon)</text>
  <text x="580.0" y="68.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">one unbroken shell; the mantle convects underneath it</text>
  <rect x="400.0" y="80.0" width="360.0" height="220.0" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="30.0" y1="150.0" x2="370.0" y2="150.0" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="116.0" y="112.0" fill="#8a8a8a" font-size="10" text-anchor="middle">spreading ridge</text>
  <polygon points="100.0,150.0 116.0,136.0 132.0,150.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.35"/>
  <line x1="100.0" y1="128.0" x2="77.0" y2="128.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="72.0,128.0 77.0,125.8 77.0,130.2" fill="#8a8a8a"/>
  <line x1="132.0" y1="128.0" x2="155.0" y2="128.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="160.0,128.0 155.0,130.2 155.0,125.8" fill="#8a8a8a"/>
  <rect x="30.0" y="150.0" width="150.0" height="16.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.6" opacity="0.18"/>
  <rect x="180.0" y="150.0" width="120.0" height="16.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.6" opacity="0.18"/>
  <text x="90.0" y="162.0" fill="#4a90d9" font-size="10" text-anchor="middle">plate</text>
  <path d="M 300.0,158.0 L 320.0,190.0 L 332.0,245.0 L 338.0,290.0" fill="none" stroke="#4a90d9" stroke-width="7"/>
  <text x="320.0" y="180.0" fill="#4a90d9" font-size="10">cold slab</text>
  <text x="320.0" y="194.0" fill="#4a90d9" font-size="10">sinks</text>
  <polygon points="286.0,150.0 296.0,134.0 306.0,150.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.45"/>
  <text x="270.0" y="126.0" fill="#e0645c" font-size="10" text-anchor="middle">arc volcanoes</text>
  <line x1="90.0" y1="270.0" x2="90.0" y2="215.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="90.0,210.0 92.2,215.0 87.8,215.0" fill="#8a8a8a"/>
  <line x1="170.0" y1="270.0" x2="170.0" y2="215.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="170.0,210.0 172.2,215.0 167.8,215.0" fill="#8a8a8a"/>
  <line x1="240.0" y1="270.0" x2="240.0" y2="215.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="240.0,210.0 242.2,215.0 237.8,215.0" fill="#8a8a8a"/>
  <text x="200.0" y="284.0" fill="#8a8a8a" font-size="10" text-anchor="middle">mantle convection</text>
  <text x="36.0" y="246.0" fill="#8a8a8a" font-size="10">heat escapes by</text>
  <text x="36.0" y="260.0" fill="#8a8a8a" font-size="10">recycling the lid itself</text>
  <line x1="410.0" y1="150.0" x2="750.0" y2="150.0" stroke="#8a8a8a" stroke-width="1.6"/>
  <rect x="410.0" y="150.0" width="340.0" height="30.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.6" opacity="0.18"/>
  <text x="470.0" y="170.0" fill="#4a90d9" font-size="10">rigid unbroken lid</text>
  <polygon points="580.0,150.0 650.0,98.0 720.0,150.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.6" opacity="0.35"/>
  <text x="650.0" y="88.0" fill="#e0645c" font-size="10" text-anchor="middle">one enormous shield volcano</text>
  <text x="650.0" y="74.0" fill="#e0645c" font-size="10" text-anchor="middle">(the hotspot never moves away)</text>
  <path d="M 650.0,290.0 L 650.0,180.0" fill="none" stroke="#e0645c" stroke-width="2.4"/>
  <text x="656.0" y="246.0" fill="#e0645c" font-size="10">mantle plume</text>
  <line x1="490.0" y1="280.0" x2="490.0" y2="221.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="490.0,216.0 492.2,221.0 487.8,221.0" fill="#8a8a8a"/>
  <line x1="560.0" y1="280.0" x2="560.0" y2="221.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="560.0,216.0 562.2,221.0 557.8,221.0" fill="#8a8a8a"/>
  <line x1="730.0" y1="280.0" x2="730.0" y2="221.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="730.0,216.0 732.2,221.0 727.8,221.0" fill="#8a8a8a"/>
  <text x="550.0" y="300.0" fill="#8a8a8a" font-size="10" text-anchor="middle">mantle still convects &#8212; but under a lid it cannot break</text>
  <text x="416.0" y="202.0" fill="#8a8a8a" font-size="10">heat escapes only by conduction</text>
  <text x="416.0" y="216.0" fill="#8a8a8a" font-size="10">through a thickening lid</text>
  <text x="30.0" y="330.0" fill="#8a8a8a" font-size="10.5">Mauna Loa: 9 km tall, on a plate that moves &#8212; so Hawaii is a CHAIN of volcanoes.</text>
  <text x="30.0" y="348.0" fill="#8a8a8a" font-size="10.5">Olympus Mons: 22 km tall, on a lid that does not &#8212; so Mars has ONE, built for three billion years.</text>
  <text x="30.0" y="372.0" fill="#e0645c" font-size="10.5">Scaling check: magma can push a column &#8733; 1/g, and 9 km &#215; (9.81/3.71) = 24 km. Mars gets 22.</text>
</svg>
