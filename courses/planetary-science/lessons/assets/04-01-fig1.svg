  <text x="113.0" y="263.5" fill="#8a8a8a" font-size="10.5" text-anchor="end">1</text>
  <line x1="116.0" y1="192.7" x2="120.0" y2="192.7" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="113.0" y="196.2" fill="#8a8a8a" font-size="10.5" text-anchor="end">10&#8315;&#178;</text>
  <line x1="116.0" y1="125.3" x2="120.0" y2="125.3" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="113.0" y="128.8" fill="#8a8a8a" font-size="10.5" text-anchor="end">10&#8315;&#8308;</text>
  <line x1="116.0" y1="58.0" x2="120.0" y2="58.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="113.0" y="61.5" fill="#8a8a8a" font-size="10.5" text-anchor="end">10&#8315;&#8310;</text>
  <text x="66.0" y="180.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">pressure</text>
  <text x="66.0" y="194.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">(bar)</text>
  <text x="66.0" y="208.0" fill="#8a8a8a" font-size="9.5" text-anchor="middle">&#8595; deeper</text>
