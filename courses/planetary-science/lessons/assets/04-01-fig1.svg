<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="11.5" font-style="italic">Every atmosphere has a troposphere; only those with a UV absorber have a stratosphere.</text>
