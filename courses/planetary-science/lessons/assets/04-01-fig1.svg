  <text x="523.7" y="318.1" fill="#e0645c" font-size="11" text-anchor="end">Venus</text>
  <text x="269.3" y="256.2" fill="#4a90d9" font-size="11">Earth</text>
  <text x="203.7" y="177.4" fill="#8a8a8a" font-size="11" text-anchor="end">Mars</text>
  <text x="150.8" y="275.6" fill="#e0645c" font-size="11">Titan</text>
  <text x="301.1" y="307.8" fill="#4a90d9" font-size="11">Jupiter</text>
  <circle cx="215.9" cy="226.3" r="3.5" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="0"/>
  <circle cx="126.1" cy="230.2" r="3.5" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="0"/>
  <circle cx="150.6" cy="226.3" r="3.5" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="0"/>
  <circle cx="223.9" cy="226.3" r="3.5" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="0"/>
  <text x="568.0" y="230.3" fill="#8a8a8a" font-size="10.5">&#8592; tropopauses</text>
  <text x="568.0" y="244.3" fill="#8a8a8a" font-size="9.5">(minimum temperature)</text>
  <text x="568.0" y="175.1" fill="#8a8a8a" font-size="10">above here the</text>
  <text x="568.0" y="189.1" fill="#8a8a8a" font-size="10">profiles that RISE</text>
  <text x="568.0" y="203.1" fill="#8a8a8a" font-size="10">have a UV absorber:</text>
  <text x="568.0" y="217.1" fill="#8a8a8a" font-size="10">O&#8323; on Earth, haze on</text>
  <text x="568.0" y="231.1" fill="#8a8a8a" font-size="10">Titan, CH&#8324; on Jupiter.</text>
  <text x="568.0" y="111.7" fill="#e0645c" font-size="10">Mars has none, so it</text>
  <text x="568.0" y="125.7" fill="#e0645c" font-size="10">just goes isothermal.</text>
  <text x="128.0" y="392.0" fill="#8a8a8a" font-size="10.5">Below the tropopause, convection enforces a lapse rate close to g/c_p:</text>
  <text x="128.0" y="408.0" fill="#8a8a8a" font-size="10.5">9.8 K/km on Earth, 9.9 on Venus, 4.8 on Mars, 1.9 on Jupiter, 1.3 on Titan.</text>
  <text x="128.0" y="424.0" fill="#8a8a8a" font-size="10.5">Same physics; the numbers differ by gravity and by what the air is made of.</text>
</svg>
