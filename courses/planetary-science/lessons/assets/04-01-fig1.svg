  <line x1="450.0" y1="330.0" x2="450.0" y2="334.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="450.0" y="347.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">600</text>
