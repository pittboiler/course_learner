<svg viewBox="0 0 770 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="11.5" font-style="italic">A resonance holds the eccentricity up; the eccentricity is what makes tides heat.</text>
  <text x="30.0" y="52.0" fill="#8a8a8a" font-size="11.5">a circular orbit heats nothing</text>
  <circle cx="175.0" cy="140.0" r="16.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.6" opacity="0.4"/>
  <circle cx="175.0" cy="140.0" r="72.0" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <ellipse cx="247.0" cy="140.0" rx="13.0" ry="9.0" fill="none" stroke="#4a90d9" stroke-width="1.6"/>
  <ellipse cx="175.0" cy="212.0" rx="13.0" ry="9.0" fill="none" stroke="#4a90d9" stroke-width="1.6"/>
  <ellipse cx="103.0" cy="140.0" rx="13.0" ry="9.0" fill="none" stroke="#4a90d9" stroke-width="1.6"/>
  <ellipse cx="175.0" cy="68.0" rx="13.0" ry="9.0" fill="none" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="175.0" y="240.0" fill="#8a8a8a" font-size="10" text-anchor="middle">same distance, same orientation:</text>
  <text x="175.0" y="254.0" fill="#8a8a8a" font-size="10" text-anchor="middle">the bulge never flexes.</text>
  <text x="30.0" y="282.0" fill="#e0645c" font-size="11.5">an eccentric orbit heats a lot</text>
  <circle cx="153.0" cy="336.0" r="14.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.6" opacity="0.4"/>
  <ellipse cx="175.0" cy="336.0" rx="86.0" ry="58.0" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <ellipse cx="261.0" cy="336.0" rx="17.0" ry="10.0" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <ellipse cx="89.0" cy="336.0" rx="11.0" ry="8.0" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="283.0" y="340.0" fill="#4a90d9" font-size="9.5">near:</text>
  <text x="283.0" y="352.0" fill="#4a90d9" font-size="9.5">big bulge</text>
  <text x="67.0" y="340.0" fill="#4a90d9" font-size="9.5" text-anchor="end">far: small</text>
  <text x="67.0" y="352.0" fill="#4a90d9" font-size="9.5" text-anchor="end">bulge</text>
  <text x="175.0" y="418.0" fill="#8a8a8a" font-size="10" text-anchor="middle">the bulge grows and shrinks every orbit;</text>
  <text x="175.0" y="432.0" fill="#8a8a8a" font-size="10" text-anchor="middle">the flexing dissipates energy as heat.</text>
  <text x="400.0" y="52.0" fill="#8a8a8a" font-size="11.5">the Laplace resonance: 1 : 2 : 4</text>
  <text x="412.0" y="96.0" fill="#8a8a8a" font-size="11" text-anchor="end">Io</text>
  <rect x="420.0" y="83.0" width="246.0" height="18.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.22"/>
  <text x="678.0" y="96.0" fill="#8a8a8a" font-size="10">1.769 d</text>
  <text x="412.0" y="134.0" fill="#8a8a8a" font-size="11" text-anchor="end">Europa</text>
  <rect x="420.0" y="121.0" width="121.0" height="18.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.22"/>
  <rect x="545.0" y="121.0" width="121.0" height="18.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.22"/>
  <text x="678.0" y="134.0" fill="#8a8a8a" font-size="10">3.551 d</text>
  <text x="412.0" y="172.0" fill="#8a8a8a" font-size="11" text-anchor="end">Ganymede</text>
  <rect x="420.0" y="159.0" width="58.5" height="18.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.22"/>
  <rect x="482.5" y="159.0" width="58.5" height="18.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.22"/>
  <rect x="545.0" y="159.0" width="58.5" height="18.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.22"/>
  <rect x="607.5" y="159.0" width="58.5" height="18.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.22"/>
  <text x="678.0" y="172.0" fill="#8a8a8a" font-size="10">7.155 d</text>
  <text x="418.0" y="214.0" fill="#8a8a8a" font-size="10.5">Io makes exactly 4 orbits while Ganymede makes 1.</text>
  <text x="418.0" y="232.0" fill="#e0645c" font-size="10.5">Measured: n&#8321; &#8722; 3n&#8322; + 2n&#8323; = 0 to 3 parts in 10&#8309;.</text>
  <text x="418.0" y="264.0" fill="#8a8a8a" font-size="10.5">Conjunctions always happen at the same orbital</text>
  <text x="418.0" y="282.0" fill="#8a8a8a" font-size="10.5">phase, so the tugs ADD instead of averaging out.</text>
  <text x="418.0" y="300.0" fill="#8a8a8a" font-size="10.5">That pumping is what keeps Io&#8217;s eccentricity at</text>
  <text x="418.0" y="318.0" fill="#8a8a8a" font-size="10.5">0.0041 against tidal damping that would erase it</text>
  <text x="418.0" y="336.0" fill="#8a8a8a" font-size="10.5">in a few thousand years.</text>
  <rect x="410.0" y="356.0" width="340.0" height="66.0" fill="none" stroke="#e0645c" stroke-width="1.4" rx="4"/>
  <text x="422.0" y="376.0" fill="#e0645c" font-size="10.5">Io radiates 104 TW &#8212; about 100&#215; Earth&#8217;s heat</text>
  <text x="422.0" y="394.0" fill="#e0645c" font-size="10.5">per unit volume. Break the resonance and Io</text>
  <text x="422.0" y="412.0" fill="#e0645c" font-size="10.5">circularises, and the volcanism stops.</text>
</svg>
