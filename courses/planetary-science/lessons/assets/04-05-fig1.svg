  <text x="500.0" y="336.0" fill="#8a8a8a" font-size="10.5">With today&#8217;s greenhouse, Earth stays below</text>
  <text x="500.0" y="352.0" fill="#8a8a8a" font-size="10.5">freezing for its first 2 Gyr &#8212; but the rocks</text>
  <text x="500.0" y="368.0" fill="#8a8a8a" font-size="10.5">say liquid water existed at 4.3 Ga.</text>
  <text x="500.0" y="390.0" fill="#e0645c" font-size="10.5">So the early greenhouse was STRONGER:</text>
  <text x="500.0" y="406.0" fill="#e0645c" font-size="10.5">more CO&#8322;, probably methane, lower albedo.</text>
  <text x="500.0" y="428.0" fill="#8a8a8a" font-size="10.5">The carbonate&#8211;silicate thermostat turned it</text>
