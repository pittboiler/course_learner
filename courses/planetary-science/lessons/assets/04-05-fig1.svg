<svg viewBox="0 0 770 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="11.5" font-style="italic">Sunlight destroys molecules, and what it builds from the pieces changes the climate.</text>
  <text x="30.0" y="52.0" fill="#8a8a8a" font-size="11.5">Titan: an irreversible chemical factory</text>
  <rect x="40.0" y="72.0" width="300.0" height="44.0" fill="none" stroke="#8a8a8a" stroke-width="1.4" rx="4"/>
  <text x="52.0" y="91.0" fill="#8a8a8a" font-size="11">N&#8322;  +  CH&#8324;</text>
  <text x="52.0" y="107.0" fill="#8a8a8a" font-size="9.5">1.5 bar, 5% methane</text>
  <rect x="40.0" y="140.0" width="300.0" height="44.0" fill="none" stroke="#4a90d9" stroke-width="1.4" rx="4"/>
  <text x="52.0" y="159.0" fill="#4a90d9" font-size="11">UV and magnetospheric electrons</text>
  <text x="52.0" y="175.0" fill="#8a8a8a" font-size="9.5">break both molecules apart</text>
  <rect x="40.0" y="208.0" width="300.0" height="44.0" fill="none" stroke="#4a90d9" stroke-width="1.4" rx="4"/>
  <text x="52.0" y="227.0" fill="#4a90d9" font-size="11">radicals: CH&#8323;, CH&#8322;, N, H</text>
  <rect x="40.0" y="268.0" width="300.0" height="44.0" fill="none" stroke="#4a90d9" stroke-width="1.4" rx="4"/>
  <text x="52.0" y="287.0" fill="#4a90d9" font-size="11">C&#8322;H&#8326;  C&#8322;H&#8322;  HCN  C&#8324;H&#8322;</text>
  <text x="52.0" y="303.0" fill="#8a8a8a" font-size="9.5">ethane, acetylene, nitriles</text>
  <rect x="40.0" y="336.0" width="300.0" height="44.0" fill="none" stroke="#e0645c" stroke-width="1.4" rx="4"/>
  <text x="52.0" y="355.0" fill="#e0645c" font-size="11">tholins &#8212; complex organic solids</text>
  <text x="52.0" y="371.0" fill="#8a8a8a" font-size="9.5">the orange haze; they RAIN OUT</text>
  <line x1="190.0" y1="116.0" x2="190.0" y2="130.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="190.0,136.0 187.3,130.0 192.7,130.0" fill="#8a8a8a"/>
  <line x1="190.0" y1="184.0" x2="190.0" y2="198.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="190.0,204.0 187.3,198.0 192.7,198.0" fill="#8a8a8a"/>
  <line x1="190.0" y1="252.0" x2="190.0" y2="266.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="190.0,272.0 187.3,266.0 192.7,266.0" fill="#8a8a8a"/>
  <line x1="190.0" y1="312.0" x2="190.0" y2="326.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="190.0,332.0 187.3,326.0 192.7,326.0" fill="#8a8a8a"/>
  <text x="352.0" y="96.0" fill="#e0645c" font-size="10">H&#8322; escapes</text>
  <line x1="346.0" y1="92.0" x2="363.6" y2="82.4" stroke="#e0645c" stroke-width="1.3"/>
  <polygon points="368.0,80.0 364.7,84.4 362.5,80.4" fill="#e0645c"/>
  <text x="352.0" y="358.0" fill="#e0645c" font-size="10">Nothing returns the</text>
  <text x="352.0" y="372.0" fill="#e0645c" font-size="10">methane. At the</text>
  <text x="352.0" y="386.0" fill="#e0645c" font-size="10">measured destruction</text>
  <text x="352.0" y="400.0" fill="#e0645c" font-size="10">rate the atmosphere</text>
  <text x="352.0" y="414.0" fill="#e0645c" font-size="10">runs dry in ~30 Myr,</text>
  <text x="352.0" y="428.0" fill="#e0645c" font-size="10">so there is a source.</text>
  <text x="500.0" y="52.0" fill="#8a8a8a" font-size="11.5">the faint young Sun</text>
