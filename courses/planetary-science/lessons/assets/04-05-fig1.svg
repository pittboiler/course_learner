  <text x="736.0" y="153.2" fill="#8a8a8a" font-size="10" text-anchor="end">273 K &#8212; water freezes</text>
  <rect x="500.0" y="80.0" width="72.0" height="220.0" fill="#e0645c" stroke="#e0645c" stroke-width="0" opacity="0.12"/>
