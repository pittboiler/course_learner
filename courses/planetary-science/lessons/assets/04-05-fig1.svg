  <text x="708.7" y="317.0" fill="#8a8a8a" font-size="10" text-anchor="middle">4</text>
  <text x="620.0" y="334.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">Gyr after Earth formed</text>
