  <text x="150.0" y="330.0" fill="#8a8a8a" font-size="10.5">Venus is COLDER at equilibrium than Earth &#8212; its clouds reflect 77%</text>
  <text x="150.0" y="346.0" fill="#8a8a8a" font-size="10.5">of the sunlight. It is hot entirely because of the 510 K greenhouse.</text>
  <text x="150.0" y="368.0" fill="#8a8a8a" font-size="10.5">Mars has almost no greenhouse at all: 6 mbar of CO&#8322; is optically thin.</text>
