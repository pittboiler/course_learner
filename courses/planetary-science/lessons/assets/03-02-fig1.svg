<svg viewBox="0 0 770 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="11">A shell floating on liquid flexes far more than a solid body &#8212; so tidal amplitude is an ocean detector.</text>
  <circle cx="150.0" cy="150.0" r="72.0" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <ellipse cx="150.0" cy="150.0" rx="74.5" ry="70.7" fill="none" stroke="#e0645c" stroke-width="2.0" stroke-dasharray="5 4"/>
  <circle cx="150.0" cy="150.0" r="39.6" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.2" opacity="0.16"/>
  <text x="150.0" y="154.0" fill="#8a8a8a" font-size="10" text-anchor="middle">rock</text>
  <text x="150.0" y="248.0" fill="#8a8a8a" font-size="11" text-anchor="middle">solid throughout</text>
  <text x="150.0" y="264.0" fill="#e0645c" font-size="11" text-anchor="middle">radial tide &#8776; 1 m</text>
  <circle cx="340.0" cy="150.0" r="72.0" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <ellipse cx="340.0" cy="150.0" rx="83.5" ry="66.2" fill="none" stroke="#e0645c" stroke-width="2.0" stroke-dasharray="5 4"/>
  <circle cx="340.0" cy="150.0" r="39.6" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.2" opacity="0.16"/>
  <text x="340.0" y="154.0" fill="#8a8a8a" font-size="10" text-anchor="middle">rock</text>
  <circle cx="340.0" cy="150.0" r="61.2" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.6" opacity="0.2"/>
  <text x="340.0" y="98.2" fill="#4a90d9" font-size="10" text-anchor="middle">ocean</text>
  <text x="340.0" y="248.0" fill="#8a8a8a" font-size="11" text-anchor="middle">ice shell on a global ocean</text>
  <text x="340.0" y="264.0" fill="#e0645c" font-size="11" text-anchor="middle">radial tide &#8776; 30 m</text>
  <line x1="150.0" y1="50.0" x2="150.0" y2="61.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="150.0,66.0 147.8,61.0 152.2,61.0" fill="#8a8a8a"/>
  <line x1="340.0" y1="50.0" x2="340.0" y2="61.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="340.0,66.0 337.8,61.0 342.2,61.0" fill="#8a8a8a"/>
  <text x="245.0" y="42.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">same tide-raising pull from Jupiter</text>
  <text x="60.0" y="262.0" fill="#8a8a8a" font-size="10.5">The ocean DECOUPLES the shell from the interior, so the shell</text>
  <text x="60.0" y="278.0" fill="#8a8a8a" font-size="10.5">deforms almost as a free-floating fluid would. Thirty times</text>
  <text x="60.0" y="294.0" fill="#8a8a8a" font-size="10.5">the amplitude, from the same forcing.</text>
  <text x="478.0" y="58.0" fill="#8a8a8a" font-size="11.5">tidal Love number k&#8322;</text>
  <line x1="478.0" y1="70.0" x2="478.0" y2="262.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="493.7" y1="262.0" x2="493.7" y2="266.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="493.7" y="280.0" fill="#8a8a8a" font-size="10" text-anchor="middle">0.02</text>
  <line x1="581.8" y1="262.0" x2="581.8" y2="266.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="581.8" y="280.0" fill="#8a8a8a" font-size="10" text-anchor="middle">0.1</text>
  <line x1="641.9" y1="262.0" x2="641.9" y2="266.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="641.9" y="280.0" fill="#8a8a8a" font-size="10" text-anchor="middle">0.3</text>
  <line x1="707.8" y1="262.0" x2="707.8" y2="266.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="707.8" y="280.0" fill="#8a8a8a" font-size="10" text-anchor="middle">1.0</text>
  <text x="609.0" y="297.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">k&#8322;  (log scale)</text>
  <line x1="478.0" y1="80.0" x2="493.7" y2="80.0" stroke="#8a8a8a" stroke-width="7"/>
  <text x="500.7" y="84.0" fill="#8a8a8a" font-size="10">0.02</text>
  <text x="478.0" y="67.0" fill="#8a8a8a" font-size="10">rigid rock, no ocean</text>
  <line x1="478.0" y1="112.0" x2="610.9" y2="112.0" stroke="#8a8a8a" stroke-width="7"/>
  <text x="617.9" y="116.0" fill="#8a8a8a" font-size="10">0.17</text>
  <text x="478.0" y="99.0" fill="#8a8a8a" font-size="10">Mars (liquid outer core)</text>
  <line x1="478.0" y1="144.0" x2="641.9" y2="144.0" stroke="#8a8a8a" stroke-width="7"/>
  <text x="648.9" y="148.0" fill="#8a8a8a" font-size="10">0.3</text>
  <text x="478.0" y="131.0" fill="#8a8a8a" font-size="10">Earth (solid, oceans on top)</text>
  <line x1="478.0" y1="176.0" x2="681.7" y2="176.0" stroke="#4a90d9" stroke-width="7"/>
  <text x="688.7" y="180.0" fill="#4a90d9" font-size="10">0.62</text>
  <text x="478.0" y="163.0" fill="#8a8a8a" font-size="10">Titan</text>
  <line x1="478.0" y1="208.0" x2="717.8" y2="208.0" stroke="#4a90d9" stroke-width="7"/>
  <text x="724.8" y="212.0" fill="#4a90d9" font-size="10">1.2</text>
  <text x="478.0" y="195.0" fill="#8a8a8a" font-size="10">Europa (if ocean)</text>
  <line x1="478.0" y1="240.0" x2="730.0" y2="240.0" stroke="#e0645c" stroke-width="7"/>
  <text x="737.0" y="244.0" fill="#e0645c" font-size="10">1.5</text>
  <text x="478.0" y="227.0" fill="#8a8a8a" font-size="10">a fluid body, no rigidity</text>
  <text x="478.0" y="320.0" fill="#4a90d9" font-size="10.5">Anything above about 0.3 for a small icy body</text>
  <text x="478.0" y="336.0" fill="#4a90d9" font-size="10.5">means a global liquid layer. There is no other way</text>
  <text x="478.0" y="352.0" fill="#4a90d9" font-size="10.5">to make a moon that soft.</text>
</svg>
