  <text x="556.0" y="138.0" fill="#e0645c" font-size="10.5">M_p sin i</text>
  <text x="444.0" y="153.0" fill="#8a8a8a" font-size="10">Jupiter 12.5 m/s; Earth 9 cm/s;</text>
  <text x="444.0" y="167.0" fill="#8a8a8a" font-size="10">hot Jupiter 141 m/s</text>
  <text x="444.0" y="196.0" fill="#4a90d9" font-size="11">astrometry</text>
  <text x="556.0" y="196.0" fill="#e0645c" font-size="10.5">M_p, and i</text>
  <text x="444.0" y="211.0" fill="#8a8a8a" font-size="10">Jupiter at 10 pc: 496 &#956;as;</text>
  <text x="444.0" y="225.0" fill="#8a8a8a" font-size="10">Earth at 10 pc: 0.3 &#956;as</text>
  <text x="444.0" y="254.0" fill="#4a90d9" font-size="11">direct imaging</text>
  <text x="556.0" y="254.0" fill="#e0645c" font-size="10.5">photons</text>
  <text x="444.0" y="269.0" fill="#8a8a8a" font-size="10">young, hot, wide-orbit giants only</text>
  <text x="444.0" y="298.0" fill="#4a90d9" font-size="11">microlensing</text>
  <text x="556.0" y="298.0" fill="#e0645c" font-size="10.5">M_p, one shot</text>
  <text x="444.0" y="313.0" fill="#8a8a8a" font-size="10">sensitive beyond the snow line;</text>
  <text x="444.0" y="327.0" fill="#8a8a8a" font-size="10">the event never repeats</text>
  <text x="444.0" y="356.0" fill="#4a90d9" font-size="11">timing (TTV)</text>
  <text x="556.0" y="356.0" fill="#e0645c" font-size="10.5">M_p from mutual tugs</text>
  <text x="444.0" y="371.0" fill="#8a8a8a" font-size="10">best in resonant chains</text>
  <text x="432.0" y="398.0" fill="#e0645c" font-size="10.5">Transit &#215; RV together give R and M, hence density,</text>
  <text x="432.0" y="414.0" fill="#e0645c" font-size="10.5">and only then composition (6.3).</text>
