  <text x="432.0" y="54.0" fill="#8a8a8a" font-size="11.5">what each method can reach</text>
  <text x="444.0" y="80.0" fill="#4a90d9" font-size="11">transit</text>
  <text x="556.0" y="80.0" fill="#e0645c" font-size="10.5">R_p / R&#8902;</text>
  <text x="444.0" y="95.0" fill="#8a8a8a" font-size="10">Jupiter/Sun 1.0%; Earth/Sun 84 ppm;</text>
  <text x="444.0" y="109.0" fill="#8a8a8a" font-size="10">Earth around a 0.2 R&#8902; M dwarf: 2100 ppm</text>
