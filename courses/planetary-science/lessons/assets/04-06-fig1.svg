  <text x="210.6" y="151.3" fill="#8a8a8a" font-size="10" text-anchor="end">early Mars?</text>
  <line x1="210.6" y1="166.2" x2="175.7" y2="242.2" stroke="#e0645c" stroke-width="1.6"/>
  <polygon points="172.8,248.5 172.8,240.9 178.5,243.5" fill="#e0645c"/>
  <text x="159.2" y="211.4" fill="#e0645c" font-size="10.5" text-anchor="middle">escape +</text>
  <text x="159.2" y="225.4" fill="#e0645c" font-size="10.5" text-anchor="middle">no recycling</text>
  <text x="600.0" y="120.0" fill="#8a8a8a" font-size="10">Mercury sits far off</text>
  <text x="600.0" y="134.0" fill="#8a8a8a" font-size="10">this plot: 10&#8315;&#185;&#8308; bar,</text>
  <text x="600.0" y="148.0" fill="#8a8a8a" font-size="10">no atmosphere at all.</text>
  <text x="600.0" y="180.0" fill="#4a90d9" font-size="10.5">Earth is the ONLY</text>
  <text x="600.0" y="194.0" fill="#4a90d9" font-size="10.5">one inside the field,</text>
  <text x="600.0" y="208.0" fill="#4a90d9" font-size="10.5">and it stays there</text>
  <text x="600.0" y="222.0" fill="#4a90d9" font-size="10.5">because plate tectonics</text>
  <text x="600.0" y="236.0" fill="#4a90d9" font-size="10.5">recycles its carbon.</text>
  <text x="112.0" y="396.0" fill="#8a8a8a" font-size="10.5">Venus is too close and lost its water to a runaway; Mars is too small and lost its air to space;</text>
  <text x="112.0" y="412.0" fill="#8a8a8a" font-size="10.5">Mercury never had either. Earth alone kept a thermostat &#8212; and the thermostat needs tectonics,</text>
  <text x="112.0" y="428.0" fill="#8a8a8a" font-size="10.5">which (2.5) may itself need the water.</text>
</svg>
