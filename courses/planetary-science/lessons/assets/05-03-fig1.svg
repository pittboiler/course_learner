<svg viewBox="0 0 770 450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="11.5" font-style="italic">Four bodies, four independent arguments &#8212; and no single one of them would be enough.</text>
  <circle cx="124.0" cy="140.0" r="39.8" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <circle cx="124.0" cy="140.0" r="39.3" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.3"/>
  <circle cx="124.0" cy="140.0" r="36.8" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" opacity="0.22"/>
  <text x="124.0" y="74.2" fill="#8a8a8a" font-size="12" text-anchor="middle" font-weight="bold">Europa</text>
  <text x="124.0" y="88.2" fill="#8a8a8a" font-size="9.5" text-anchor="middle">R = 1561 km</text>
  <text x="124.0" y="197.8" fill="#8a8a8a" font-size="9.5" text-anchor="middle">ice 20 km</text>
  <text x="124.0" y="210.8" fill="#4a90d9" font-size="9.5" text-anchor="middle">ocean ~100 km</text>
  <circle cx="292.0" cy="140.0" r="6.4" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <circle cx="292.0" cy="140.0" r="5.8" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.3"/>
  <circle cx="292.0" cy="140.0" r="4.9" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" opacity="0.22"/>
  <text x="292.0" y="107.6" fill="#8a8a8a" font-size="12" text-anchor="middle" font-weight="bold">Enceladus</text>
  <text x="292.0" y="121.6" fill="#8a8a8a" font-size="9.5" text-anchor="middle">R = 252 km</text>
  <text x="292.0" y="164.4" fill="#8a8a8a" font-size="9.5" text-anchor="middle">ice 25 km</text>
  <text x="292.0" y="177.4" fill="#4a90d9" font-size="9.5" text-anchor="middle">ocean ~35 km</text>
  <circle cx="460.0" cy="140.0" r="65.7" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <circle cx="460.0" cy="140.0" r="63.7" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.3"/>
  <circle cx="460.0" cy="140.0" r="57.3" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" opacity="0.22"/>
  <text x="460.0" y="48.3" fill="#8a8a8a" font-size="12" text-anchor="middle" font-weight="bold">Titan</text>
  <text x="460.0" y="62.3" fill="#8a8a8a" font-size="9.5" text-anchor="middle">R = 2575 km</text>
  <text x="460.0" y="223.7" fill="#8a8a8a" font-size="9.5" text-anchor="middle">ice 80 km</text>
  <text x="460.0" y="236.7" fill="#4a90d9" font-size="9.5" text-anchor="middle">ocean ~250 km</text>
  <circle cx="628.0" cy="140.0" r="67.2" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <circle cx="628.0" cy="140.0" r="64.1" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.3"/>
  <circle cx="628.0" cy="140.0" r="60.3" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" opacity="0.22"/>
  <text x="628.0" y="46.8" fill="#8a8a8a" font-size="12" text-anchor="middle" font-weight="bold">Ganymede</text>
  <text x="628.0" y="60.8" fill="#8a8a8a" font-size="9.5" text-anchor="middle">R = 2634 km</text>
  <text x="628.0" y="225.2" fill="#8a8a8a" font-size="9.5" text-anchor="middle">ice 120 km</text>
  <text x="628.0" y="238.2" fill="#4a90d9" font-size="9.5" text-anchor="middle">ocean ~150 km</text>
  <text x="58.0" y="236.0" fill="#8a8a8a" font-size="9.5">drawn to a common scale</text>
  <text x="40.0" y="268.0" fill="#8a8a8a" font-size="11.5">the evidence, and what each kind of argument can and cannot do</text>
  <text x="52.0" y="290.0" fill="#4a90d9" font-size="10.5">induced magnetic field</text>
  <text x="224.0" y="290.0" fill="#8a8a8a" font-size="10">Europa, Ganymede, Callisto</text>
  <text x="410.0" y="290.0" fill="#8a8a8a" font-size="10">proves a GLOBAL conducting layer; blind to fresh water</text>
  <text x="52.0" y="314.0" fill="#4a90d9" font-size="10.5">tidal Love number k&#8322;</text>
  <text x="224.0" y="314.0" fill="#8a8a8a" font-size="10">Titan (0.6)</text>
  <text x="410.0" y="314.0" fill="#8a8a8a" font-size="10">proves the shell is mechanically DECOUPLED</text>
  <text x="52.0" y="338.0" fill="#4a90d9" font-size="10.5">forced libration</text>
  <text x="224.0" y="338.0" fill="#8a8a8a" font-size="10">Enceladus (0.120&#176;, ~2&#215; rigid)</text>
  <text x="410.0" y="338.0" fill="#8a8a8a" font-size="10">same, via rotation rather than deformation</text>
  <text x="52.0" y="362.0" fill="#e0645c" font-size="10.5">erupting plumes</text>
  <text x="224.0" y="362.0" fill="#8a8a8a" font-size="10">Enceladus, probably Europa</text>
  <text x="410.0" y="362.0" fill="#8a8a8a" font-size="10">samples the water DIRECTLY &#8212; salts, silica, H&#8322;</text>
  <text x="52.0" y="386.0" fill="#8a8a8a" font-size="10.5">young, mobile surface</text>
  <text x="224.0" y="386.0" fill="#8a8a8a" font-size="10">Europa (40&#8211;90 Myr)</text>
  <text x="410.0" y="386.0" fill="#8a8a8a" font-size="10">suggestive only; warm solid ice can do this too</text>
  <text x="52.0" y="420.0" fill="#e0645c" font-size="10.5">Enceladus&#8217;s plume chemistry is the strongest single result: silica nanoparticles require</text>
  <text x="52.0" y="436.0" fill="#e0645c" font-size="10.5">water&#8211;rock contact above 90 &#176;C, and molecular hydrogen means chemical energy is available.</text>
</svg>
