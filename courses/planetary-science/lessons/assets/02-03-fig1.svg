  <text x="264.0" y="320.0" fill="#e0645c" font-size="10.5">0.0002</text>
  <line x1="190.0" y1="348.0" x2="214.2" y2="348.0" stroke="#e0645c" stroke-width="8"/>
  <text x="181.0" y="352.0" fill="#8a8a8a" font-size="11" text-anchor="end">Venus</text>
  <text x="222.2" y="352.0" fill="#e0645c" font-size="10.5">3e-05</text>
  <text x="608.0" y="60.0" fill="#4a90d9" font-size="10.5">active dynamo</text>
  <text x="608.0" y="284.0" fill="#e0645c" font-size="10.5">no dynamo now</text>
  <text x="88.0" y="352.0" fill="#8a8a8a" font-size="11">A dynamo needs all three:</text>
  <text x="98.0" y="370.0" fill="#8a8a8a" font-size="10.5">1. a fluid that conducts electricity</text>
  <text x="418.0" y="370.0" fill="#e0645c" font-size="10">Venus has one; Mars&#8217; is frozen</text>
  <text x="98.0" y="387.0" fill="#8a8a8a" font-size="10.5">2. convection to stir it</text>
  <text x="418.0" y="387.0" fill="#e0645c" font-size="10">Venus fails here</text>
  <text x="98.0" y="404.0" fill="#8a8a8a" font-size="10.5">3. rotation to organise the stirring</text>
  <text x="418.0" y="404.0" fill="#e0645c" font-size="10">slow rotators make weak fields</text>
