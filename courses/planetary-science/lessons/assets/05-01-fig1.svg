<svg viewBox="0 0 770 450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="10.8">Two ways to be a giant: one made of hydrogen, one made of hot ionic fluid &#8212; and their fields differ accordingly.</text>
  <text x="175.0" y="42.0" fill="#8a8a8a" font-size="12" text-anchor="middle" font-weight="bold">Jupiter / Saturn</text>
  <text x="175.0" y="58.0" fill="#8a8a8a" font-size="10" text-anchor="middle">hydrogen giants</text>
  <circle cx="175.0" cy="200.0" r="124.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.1"/>
  <circle cx="175.0" cy="200.0" r="96.7" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.26"/>
  <circle cx="175.0" cy="200.0" r="24.8" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.4"/>
  <text x="175.0" y="94.0" fill="#8a8a8a" font-size="10" text-anchor="middle">molecular H&#8322;</text>
  <text x="175.0" y="121.3" fill="#8a8a8a" font-size="10" text-anchor="middle">METALLIC hydrogen</text>
  <text x="175.0" y="135.3" fill="#8a8a8a" font-size="9.5" text-anchor="middle">(a liquid metal)</text>
  <text x="175.0" y="204.0" fill="#8a8a8a" font-size="10" text-anchor="middle">dilute core</text>
  <text x="175.0" y="218.0" fill="#8a8a8a" font-size="9.5" text-anchor="middle">7&#8211;25 M&#8853;</text>
  <line x1="175.0" y1="76.0" x2="321.0" y2="76.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2 3"/>
  <text x="325.0" y="80.0" fill="#8a8a8a" font-size="9.5">1 bar</text>
  <line x1="175.0" y1="103.3" x2="321.0" y2="103.3" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2 3"/>
  <text x="325.0" y="107.3" fill="#8a8a8a" font-size="9.5">~100 GPa, 6000 K</text>
  <text x="325.0" y="120.3" fill="#e0645c" font-size="9.5">hydrogen goes metallic</text>
  <line x1="175.0" y1="200.0" x2="321.0" y2="200.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2 3"/>
  <text x="325.0" y="204.0" fill="#8a8a8a" font-size="9.5">~4000 GPa centre</text>
  <text x="175.0" y="350.0" fill="#4a90d9" font-size="10" text-anchor="middle">Deep convecting metallic shell &#8594;</text>
  <text x="175.0" y="364.0" fill="#4a90d9" font-size="10" text-anchor="middle">a strong, clean DIPOLE, tilted 10&#176;.</text>
  <text x="175.0" y="384.0" fill="#e0645c" font-size="10" text-anchor="middle">In Saturn, cooler, helium becomes</text>
  <text x="175.0" y="398.0" fill="#e0645c" font-size="10" text-anchor="middle">immiscible and RAINS &#8212; which is why</text>
  <text x="175.0" y="412.0" fill="#e0645c" font-size="10" text-anchor="middle">it radiates 1.78&#215; what it absorbs.</text>
  <text x="560.0" y="42.0" fill="#8a8a8a" font-size="12" text-anchor="middle" font-weight="bold">Uranus / Neptune</text>
  <text x="560.0" y="58.0" fill="#8a8a8a" font-size="10" text-anchor="middle">ice giants</text>
  <circle cx="560.0" cy="200.0" r="124.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.1"/>
  <circle cx="560.0" cy="200.0" r="99.2" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.22"/>
  <circle cx="560.0" cy="200.0" r="24.8" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" opacity="0.3"/>
  <text x="560.0" y="94.0" fill="#8a8a8a" font-size="10" text-anchor="middle">H&#8322;/He envelope</text>
  <text x="560.0" y="118.8" fill="#8a8a8a" font-size="10" text-anchor="middle">hot ionic &#8220;ice&#8221;:</text>
  <text x="560.0" y="132.8" fill="#8a8a8a" font-size="10" text-anchor="middle">H&#8322;O, NH&#8323;, CH&#8324;</text>
  <text x="560.0" y="146.8" fill="#8a8a8a" font-size="9.5" text-anchor="middle">&#8212; a conducting fluid</text>
  <text x="560.0" y="204.0" fill="#8a8a8a" font-size="10" text-anchor="middle">rock</text>
  <text x="560.0" y="350.0" fill="#4a90d9" font-size="10" text-anchor="middle">The dynamo runs only in a THIN outer</text>
  <text x="560.0" y="364.0" fill="#4a90d9" font-size="10" text-anchor="middle">shell &#8212; deeper down the water goes</text>
  <text x="560.0" y="378.0" fill="#4a90d9" font-size="10" text-anchor="middle">SUPERIONIC: a rigid oxygen lattice with</text>
  <text x="560.0" y="392.0" fill="#4a90d9" font-size="10" text-anchor="middle">mobile protons, which cannot convect.</text>
  <text x="560.0" y="412.0" fill="#e0645c" font-size="10" text-anchor="middle">Thin shell &#8594; multipolar field, tilted 59&#176; and 47&#176;.</text>
</svg>
