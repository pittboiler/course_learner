<svg viewBox="0 0 770 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="11">The Moon holds most of the system&#8217;s spin &#8212; and running that spin backwards does not reach 4.5 Gyr.</text>
  <text x="30.0" y="58.0" fill="#8a8a8a" font-size="11.5">where the angular momentum is</text>
  <rect x="36.0" y="74.0" width="300.0" height="34.0" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <rect x="36.0" y="74.0" width="249.3" height="34.0" fill="#e0645c" stroke="#e0645c" stroke-width="0" opacity="0.35"/>
  <line x1="285.3" y1="74.0" x2="285.3" y2="108.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="160.6" y="95.0" fill="#e0645c" font-size="11" text-anchor="middle">Moon&#8217;s orbit  83%</text>
  <text x="310.6" y="95.0" fill="#8a8a8a" font-size="10" text-anchor="middle">Earth spin</text>
  <text x="310.6" y="107.0" fill="#8a8a8a" font-size="10" text-anchor="middle">17%</text>
  <text x="36.0" y="128.0" fill="#8a8a8a" font-size="10.5">but the Moon is only 1.2% of the mass.</text>
  <text x="36.0" y="146.0" fill="#8a8a8a" font-size="10.5">Total L = 3.4 &#215; 10&#179;&#8308; kg m&#178; s&#8315;&#185;.</text>
  <text x="36.0" y="168.0" fill="#8a8a8a" font-size="10.5">Put it ALL into Earth&#8217;s spin (C = 8.04 &#215; 10&#179;&#8311; kg m&#178;):</text>
  <text x="52.0" y="188.0" fill="#e0645c" font-size="11">&#969; = L/C = 4.23 &#215; 10&#8315;&#8308; s&#8315;&#185;  &#8594;  a 4.1-hour day.</text>
  <text x="36.0" y="212.0" fill="#8a8a8a" font-size="10.5">That is the state just after the impact, and it is</text>
  <text x="36.0" y="228.0" fill="#8a8a8a" font-size="10.5">near the limit at which Earth would fly apart.</text>
  <text x="36.0" y="250.0" fill="#8a8a8a" font-size="10.5">Any origin theory must supply this much spin &#8212;</text>
  <text x="36.0" y="266.0" fill="#8a8a8a" font-size="10.5">capture and co-formation cannot.</text>
  <text x="470.0" y="58.0" fill="#8a8a8a" font-size="11.5">Earth&#8211;Moon distance, run backwards</text>
