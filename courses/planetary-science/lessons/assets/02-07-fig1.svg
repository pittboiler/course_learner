  <text x="36.0" y="300.0" fill="#8a8a8a" font-size="10.5">The gap between the two curves is the timescale problem.</text>
  <text x="36.0" y="318.0" fill="#8a8a8a" font-size="10.5">Present tidal dissipation is anomalously high: today&#8217;s ocean</text>
  <text x="36.0" y="336.0" fill="#8a8a8a" font-size="10.5">basins sit near resonance with the semidiurnal tide. Averaged</text>
  <text x="36.0" y="354.0" fill="#8a8a8a" font-size="10.5">over Earth history it was lower, so the Moon receded more</text>
  <text x="36.0" y="372.0" fill="#8a8a8a" font-size="10.5">slowly and the 4.5-Gyr history fits after all.</text>
</svg>
