  <path d="M 167.7,299.0 L 170.3,297.8 L 172.9,296.6 L 175.5,295.5 L 178.2,294.3 L 180.8,293.1 L 183.4,291.9 L 186.0,290.7 L 188.6,289.5 L 191.2,288.3 L 193.8,287.1 L 196.4,285.9 L 199.0,284.7 L 201.6,283.5 L 204.2,282.3 L 206.8,281.1 L 209.4,280.0 L 212.0,278.8 L 214.6,277.6 L 217.2,276.4 L 219.8,275.2 L 222.4,274.0 L 225.0,272.8 L 227.6,271.6 L 230.3,270.4 L 232.9,269.2 L 235.5,268.0 L 238.1,266.8 L 240.7,265.6 L 243.3,264.5 L 245.9,263.3 L 248.5,262.1 L 251.1,260.9 L 253.7,259.7 L 256.3,258.5 L 258.9,257.3 L 261.5,256.1 L 264.1,254.9 L 266.7,253.7 L 269.3,252.5 L 271.9,251.3 L 274.5,250.2 L 277.1,249.0 L 279.7,247.8 L 282.4,246.6 L 285.0,245.4 L 287.6,244.2 L 290.2,243.0 L 292.8,241.8 L 295.4,240.6 L 298.0,239.4 L 300.6,238.2 L 303.2,237.0 L 305.8,235.8 L 308.4,234.7 L 311.0,233.5 L 313.6,232.3 L 316.2,231.1 L 318.8,229.9 L 321.4,228.7 L 324.0,227.5 L 326.6,226.3 L 329.2,225.1 L 331.8,223.9 L 334.5,222.7 L 337.1,221.5 L 339.7,220.4 L 342.3,219.2 L 344.9,218.0 L 347.5,216.8 L 350.1,215.6 L 352.7,214.4 L 355.3,213.2 L 357.9,212.0 L 360.5,210.8 L 363.1,209.6 L 365.7,208.4 L 368.3,207.2 L 370.9,206.0 L 373.5,204.9 L 376.1,203.7 L 378.7,202.5 L 381.3,201.3 L 383.9,200.1 L 386.6,198.9 L 389.2,197.7 L 391.8,196.5 L 394.4,195.3 L 397.0,194.1 L 399.6,192.9 L 402.2,191.7 L 404.8,190.6 L 407.4,189.4 L 410.0,188.2" fill="none" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="406.0" y="181.2" fill="#8a8a8a" font-size="10" text-anchor="end">marginal</text>
  <path d="M 326.6,299.6 L 329.2,298.4 L 331.8,297.2 L 334.5,296.0 L 337.1,294.8 L 339.7,293.6 L 342.3,292.4 L 344.9,291.2 L 347.5,290.0 L 350.1,288.9 L 352.7,287.7 L 355.3,286.5 L 357.9,285.3 L 360.5,284.1 L 363.1,282.9 L 365.7,281.7 L 368.3,280.5 L 370.9,279.3 L 373.5,278.1 L 376.1,276.9 L 378.7,275.7 L 381.3,274.6 L 383.9,273.4 L 386.6,272.2 L 389.2,271.0 L 391.8,269.8 L 394.4,268.6 L 397.0,267.4 L 399.6,266.2 L 402.2,265.0 L 404.8,263.8 L 407.4,262.6 L 410.0,261.4" fill="none" stroke="#e0645c" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="406.0" y="254.4" fill="#e0645c" font-size="10" text-anchor="end">out of reach</text>
  <circle cx="172.2" cy="105.5" r="6.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="0" opacity="0.8"/>
  <text x="182.2" y="109.5" fill="#4a90d9" font-size="10">hot Jupiters:</text>
  <text x="182.2" y="122.5" fill="#4a90d9" font-size="10">~20% of detections,</text>
  <text x="182.2" y="135.5" fill="#e0645c" font-size="10">~1% of planets</text>
  <circle cx="387.7" cy="275.6" r="6.0" fill="#e0645c" stroke="#e0645c" stroke-width="0" opacity="0.8"/>
  <text x="377.7" y="267.6" fill="#e0645c" font-size="10" text-anchor="end">Earth analogues:</text>
  <text x="377.7" y="280.6" fill="#e0645c" font-size="10" text-anchor="end">almost none detected</text>
  <text x="444.0" y="52.0" fill="#8a8a8a" font-size="11.5">the correction, term by term</text>
  <rect x="438.0" y="64.0" width="308.0" height="180.0" fill="none" stroke="#8a8a8a" stroke-width="1.2" rx="4"/>
  <text x="452.0" y="90.0" fill="#e0645c" font-size="13">f  =</text>
  <text x="496.0" y="84.0" fill="#8a8a8a" font-size="11">N_detected</text>
  <line x1="492.0" y1="92.0" x2="700.0" y2="92.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="496.0" y="110.0" fill="#8a8a8a" font-size="11">N&#8902;  &#215;  p_transit  &#215;  C</text>
  <text x="452.0" y="140.0" fill="#4a90d9" font-size="10.5">N&#8902;</text>
  <text x="492.0" y="140.0" fill="#8a8a8a" font-size="10">stars actually searchable, not surveyed</text>
  <text x="452.0" y="162.0" fill="#4a90d9" font-size="10.5">p_tr</text>
  <text x="492.0" y="162.0" fill="#8a8a8a" font-size="10">= R&#8902;/a  &#8212; geometry only; 0.47% at 1 AU</text>
  <text x="452.0" y="184.0" fill="#4a90d9" font-size="10.5">C</text>
  <text x="492.0" y="184.0" fill="#8a8a8a" font-size="10">detection efficiency: depends on radius AND</text>
  <text x="492.0" y="198.0" fill="#8a8a8a" font-size="10">period, so it must be applied bin by bin</text>
  <text x="452.0" y="224.0" fill="#e0645c" font-size="10.5">Every term is &lt; 1, so f is always LARGER</text>
  <text x="452.0" y="238.0" fill="#e0645c" font-size="10.5">than the raw fraction of stars with detections.</text>
  <text x="438.0" y="278.0" fill="#8a8a8a" font-size="10.5">worked: 20 detections, 150,000 stars, p = 0.530%</text>
  <text x="452.0" y="300.0" fill="#8a8a8a" font-size="10.5">raw:   20 / 150,000  =  0.013%</text>
  <text x="452.0" y="320.0" fill="#e0645c" font-size="11">debiased:  20 / (150,000 &#215; 0.00530)  =  2.5%</text>
  <text x="452.0" y="342.0" fill="#8a8a8a" font-size="10.5">a factor of 190 &#8212; and that is the geometry alone,</text>
  <text x="452.0" y="358.0" fill="#8a8a8a" font-size="10.5">before any completeness correction.</text>
  <text x="108.0" y="368.0" fill="#8a8a8a" font-size="10.5">Hot Jupiters were the first exoplanets found and looked ubiquitous. Debiased, they orbit about</text>
  <text x="108.0" y="386.0" fill="#8a8a8a" font-size="10.5">1 percent of Sun-like stars &#8212; rarer than Neptunes, rarer than super-Earths, rarer than almost</text>
  <text x="108.0" y="404.0" fill="#8a8a8a" font-size="10.5">everything. The discovery order was a map of detectability, not of nature.</text>
</svg>
