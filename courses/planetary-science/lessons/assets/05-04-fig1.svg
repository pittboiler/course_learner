<svg viewBox="0 0 770 410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="10.8">Rings live inside the Roche limit, and their edges and gaps are resonances with moons outside it.</text>
  <rect x="60.0" y="124.0" width="30.9" height="52.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.6" opacity="0.3"/>
  <text x="74.9" y="154.0" fill="#8a8a8a" font-size="11" text-anchor="end">Saturn</text>
  <rect x="112.2" y="128.0" width="24.4" height="44.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="0" opacity="0.1"/>
  <rect x="137.1" y="128.0" width="55.7" height="44.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="0" opacity="0.25"/>
  <text x="164.9" y="154.0" fill="#8a8a8a" font-size="11" text-anchor="middle">C</text>
  <rect x="192.7" y="128.0" width="82.1" height="44.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="0" opacity="0.6"/>
  <text x="233.8" y="154.0" fill="#8a8a8a" font-size="11" text-anchor="middle">B</text>
  <rect x="289.6" y="128.0" width="46.9" height="44.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="0" opacity="0.45"/>
  <text x="313.0" y="154.0" fill="#8a8a8a" font-size="11" text-anchor="middle">A</text>
  <rect x="347.4" y="128.0" width="1.5" height="44.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="0" opacity="0.3"/>
  <rect x="430.3" y="128.0" width="28.9" height="44.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="0" opacity="0.1"/>
  <rect x="475.3" y="128.0" width="224.7" height="44.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="0" opacity="0.06"/>
  <text x="587.6" y="154.0" fill="#8a8a8a" font-size="11" text-anchor="middle">E</text>
  <text x="290.9" y="120.0" fill="#8a8a8a" font-size="10" text-anchor="middle">Cassini</text>
  <text x="290.9" y="132.0" fill="#8a8a8a" font-size="10" text-anchor="middle">Division</text>
  <line x1="60.0" y1="214.0" x2="700.0" y2="214.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="90.0" y1="214.0" x2="90.0" y2="218.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="90.0" y="232.0" fill="#8a8a8a" font-size="10" text-anchor="middle">60</text>
  <line x1="218.4" y1="214.0" x2="218.4" y2="218.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="218.4" y="232.0" fill="#8a8a8a" font-size="10" text-anchor="middle">100</text>
  <line x1="346.8" y1="214.0" x2="346.8" y2="218.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="346.8" y="232.0" fill="#8a8a8a" font-size="10" text-anchor="middle">140</text>
  <line x1="475.3" y1="214.0" x2="475.3" y2="218.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="475.3" y="232.0" fill="#8a8a8a" font-size="10" text-anchor="middle">180</text>
  <line x1="603.7" y1="214.0" x2="603.7" y2="218.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="603.7" y="232.0" fill="#8a8a8a" font-size="10" text-anchor="middle">220</text>
  <text x="395.0" y="250.0" fill="#8a8a8a" font-size="11" text-anchor="middle">distance from Saturn&#8217;s centre (thousands of km)</text>
  <line x1="331.7" y1="98.0" x2="331.7" y2="214.0" stroke="#e0645c" stroke-width="2.0" stroke-dasharray="5 4"/>
  <text x="331.7" y="90.0" fill="#e0645c" font-size="10.5" text-anchor="middle">Roche limit 135,276 km</text>
  <text x="331.7" y="76.0" fill="#e0645c" font-size="10" text-anchor="middle">(fluid, icy satellite)</text>
  <line x1="325.7" y1="110.0" x2="287.6" y2="110.0" stroke="#e0645c" stroke-width="1.3"/>
  <polygon points="282.6,110.0 287.6,107.8 287.6,112.2" fill="#e0645c"/>
  <text x="276.6" y="114.0" fill="#e0645c" font-size="10" text-anchor="end">tides win: no moon can hold together</text>
  <circle cx="493.0" cy="150.0" r="4.5" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="0"/>
  <text x="493.0" y="172.0" fill="#8a8a8a" font-size="10" text-anchor="middle">Mimas</text>
  <circle cx="661.6" cy="150.0" r="4.5" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="0"/>
  <text x="661.6" y="172.0" fill="#8a8a8a" font-size="10" text-anchor="middle">Enceladus</text>
  <circle cx="326.2" cy="110.0" r="4.5" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="0"/>
  <text x="326.2" y="102.0" fill="#8a8a8a" font-size="10" text-anchor="middle">Pan</text>
  <circle cx="344.9" cy="110.0" r="4.5" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="0"/>
  <text x="344.9" y="102.0" fill="#8a8a8a" font-size="10" text-anchor="middle">Prometheus</text>
  <line x1="272.6" y1="214.0" x2="272.6" y2="242.0" stroke="#8a8a8a" stroke-width="1.0" stroke-dasharray="2 3"/>
  <line x1="493.0" y1="158.0" x2="493.0" y2="242.0" stroke="#8a8a8a" stroke-width="1.0" stroke-dasharray="2 3"/>
  <path d="M 272.6,242.0 L 493.0,242.0" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="382.8" y="258.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">2:1 resonance with Mimas &#8594; the Cassini Division</text>
  <text x="96.0" y="300.0" fill="#8a8a8a" font-size="10.5">The A ring&#8217;s outer edge sits 1500 km outside the Roche limit &#8212; an agreement to one percent from a</text>
  <text x="96.0" y="318.0" fill="#8a8a8a" font-size="10.5">formula with no free parameters. Inside it, tidal shear beats self-gravity, so debris cannot re-accrete;</text>
  <text x="96.0" y="336.0" fill="#8a8a8a" font-size="10.5">outside it, it does, which is why Saturn has moons there and rings here.</text>
  <text x="96.0" y="364.0" fill="#e0645c" font-size="10.5">Cassini&#8217;s gravity measurement puts the rings at only ~1.5 &#215; 10&#185;&#8313; kg &#8212; less than half of Mimas &#8212; and</text>
  <text x="96.0" y="382.0" fill="#e0645c" font-size="10.5">micrometeorite pollution rates suggest they are 10&#8211;100 Myr old, not primordial. That is still contested.</text>
</svg>
