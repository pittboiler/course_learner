  <text x="150.0" y="300.0" fill="#e0645c" font-size="10.5" text-anchor="middle">ONE Hadley cell, pole to pole</text>
  <text x="150.0" y="316.0" fill="#e0645c" font-size="10.5" text-anchor="middle">plus a superrotating atmosphere:</text>
  <text x="150.0" y="332.0" fill="#e0645c" font-size="10.5" text-anchor="middle">the air laps the planet in 4 days,</text>
  <text x="150.0" y="348.0" fill="#e0645c" font-size="10.5" text-anchor="middle">sixty times faster than the ground.</text>
  <text x="390.0" y="300.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">Hadley cell truncated near 30&#176;;</text>
  <text x="390.0" y="316.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">beyond it baroclinic eddies and</text>
  <text x="390.0" y="332.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">a mid-latitude jet do the transport.</text>
  <text x="630.0" y="300.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">Many narrow cells and jets, set by</text>
  <text x="630.0" y="316.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">the Rhines scale &#8212; about 17 for</text>
  <text x="630.0" y="332.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">Jupiter, and about 17 are observed.</text>
  <text x="56.0" y="382.0" fill="#8a8a8a" font-size="10.5">The controlling number is &#937;&#178;a&#178;, the rotational stiffness of the atmosphere:</text>
