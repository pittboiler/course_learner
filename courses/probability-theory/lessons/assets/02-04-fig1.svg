<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="72" y="30" fill="#8a8a8a" font-style="italic">Each spike has area 1 — taller and thinner as n grows, sliding into the y-axis.</text>

  <!-- axes -->
  <line x1="60" y1="300" x2="540" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="60" y1="42" x2="60" y2="322" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="540,300 530,295 530,305" fill="#8a8a8a"/>
  <polygon points="60,42 55,52 65,52" fill="#8a8a8a"/>
  <text x="546" y="305" fill="#8a8a8a">x</text>

  <!-- x ticks: 0, 1/4, 1/3, 1/2, 1 (pixel = 60 + 480*x) -->
  <text x="55" y="318" fill="#8a8a8a">0</text>
  <text x="533" y="318" fill="#8a8a8a">1</text>

  <!-- nested spikes: rect from x=0 to 1/n, height n (scaled 55 px per unit) -->
  <!-- n=1: [0,1] height 1, top y=245, right x=540 -->
  <rect x="60" y="245" width="480" height="55" fill="#4a90d9" fill-opacity="0.06" stroke="#8a8a8a" stroke-width="2"/>
  <text x="470" y="240" fill="#8a8a8a">n=1</text>

  <!-- n=2: [0,1/2] height 2, top y=190, right x=300 -->
  <rect x="60" y="190" width="240" height="110" fill="#4a90d9" fill-opacity="0.08" stroke="#4a90d9" stroke-width="2"/>
  <text x="248" y="185" fill="#4a90d9">n=2</text>

  <!-- n=3: [0,1/3] height 3, top y=135, right x=220 -->
  <rect x="60" y="135" width="160" height="165" fill="#4a90d9" fill-opacity="0.10" stroke="#4a90d9" stroke-width="2"/>
  <text x="168" y="130" fill="#4a90d9">n=3</text>

  <!-- n=4: [0,1/4] height 4, top y=80, right x=180 -->
  <rect x="60" y="80" width="120" height="220" fill="#e0645c" fill-opacity="0.14" stroke="#e0645c" stroke-width="2.5"/>
  <text x="128" y="74" fill="#e0645c">n=4</text>

  <!-- escaping-mass arrow up the axis -->
  <line x1="46" y1="230" x2="46" y2="70" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="4 4"/>
  <polygon points="46,58 41,70 51,70" fill="#e0645c"/>

  <!-- labels -->
  <text x="300" y="120" fill="#e0645c">height n → ∞,  width 1/n → 0</text>
  <text x="300" y="142" fill="#e0645c">area = 1 always</text>
  <text x="205" y="268" fill="#8a8a8a">For each fixed x &gt; 0, eventually 1/n &lt; x,</text>
  <text x="205" y="286" fill="#8a8a8a">so Xₙ(x) = 0 — the pointwise limit is 0.</text>
</svg>
