<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- shrinking +/- c/sqrt(n) fluctuation band around mu -->
  <path d="M 80 90 L 93 116 L 107 128 L 133 140 L 173 148 L 227 154 L 307 159 L 400 162 L 493 164 L 600 166
           L 600 194 L 493 196 L 400 198 L 307 201 L 227 206 L 173 212 L 133 220 L 107 232 L 93 244 L 80 270 Z"
        fill="#4a90d9" opacity="0.12"/>

  <!-- axes -->
  <line x1="60" y1="330" x2="620" y2="330" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="80" y1="20" x2="80" y2="330" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="620,330 610,325 610,335" fill="#8a8a8a"/>
  <polygon points="80,20 75,30 85,30" fill="#8a8a8a"/>
  <text x="608" y="350" fill="#8a8a8a">n</text>

  <!-- the true mean mu -->
  <line x1="80" y1="180" x2="600" y2="180" stroke="#e0645c" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="46" y="185" fill="#e0645c" font-style="italic">&#956;</text>

  <!-- running sample average: jagged early, settling onto mu -->
  <polyline points="80,100 90,150 100,132 112,165 125,140 140,195 158,160 178,150 200,168 226,158 255,185 285,170 315,176 350,172 385,183 420,177 455,181 495,178 535,182 575,179 600,180"
        fill="none" stroke="#3a3a3a" stroke-width="2"/>

  <!-- envelope label -->
  <text x="300" y="120" fill="#4a90d9">band &#177; c/&#8730;n (the CLT fluctuations, Lesson 4.5)</text>
  <line x1="298" y1="124" x2="235" y2="150" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- path label -->
  <text x="150" y="300" fill="#3a3a3a" font-style="italic">running average X&#772;&#8345; = (X&#8321;+&#8943;+X&#8345;)/n</text>

  <!-- caption -->
  <text x="80" y="18" fill="#8a8a8a" font-style="italic">The average of more and more i.i.d. copies settles onto the true mean &#956;.</text>
</svg>
