<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- value 0 line (also x-axis) at Y=280; value 1 gridline dashed at Y=80 -->
  <!-- coordinate map: value v -> X = 280 + 150 v ; prob p -> Y = 280 - 200 p -->

  <!-- title -->
  <text x="70" y="30" fill="#8a8a8a" font-style="italic">CDFs F_n march toward a limit F with a jump at x = 0.</text>

  <!-- axes -->
  <line x1="70" y1="280" x2="520" y2="280" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="120" y1="55" x2="120" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="520,280 510,275 510,285" fill="#8a8a8a"/>
  <polygon points="120,55 115,65 125,65" fill="#8a8a8a"/>
  <text x="524" y="285" fill="#8a8a8a">x</text>

  <!-- y = 1 gridline -->
  <line x1="120" y1="80" x2="500" y2="80" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="98" y="85" fill="#8a8a8a">1</text>
  <text x="106" y="296" fill="#8a8a8a">0</text>
  <text x="274" y="298" fill="#8a8a8a">0</text>

  <!-- limit F (red): step at x=0 (X=280), jump 0 -> 1 -->
  <line x1="120" y1="280" x2="280" y2="280" stroke="#e0645c" stroke-width="3"/>
  <line x1="280" y1="80"  x2="480" y2="80"  stroke="#e0645c" stroke-width="3"/>
  <line x1="280" y1="280" x2="280" y2="80"  stroke="#e0645c" stroke-width="1.4" stroke-dasharray="4 4"/>
  <circle cx="280" cy="80"  r="5" fill="#e0645c"/>
  <circle cx="280" cy="280" r="5" fill="#ffffff" stroke="#e0645c" stroke-width="2"/>

  <!-- approximant F_n, small n (step at x=1/2 -> X=355), faint -->
  <line x1="120" y1="280" x2="355" y2="280" stroke="#4a90d9" stroke-width="1.6" opacity="0.45"/>
  <line x1="355" y1="80"  x2="480" y2="80"  stroke="#4a90d9" stroke-width="1.6" opacity="0.45"/>
  <line x1="355" y1="280" x2="355" y2="80"  stroke="#4a90d9" stroke-width="1.2" opacity="0.45" stroke-dasharray="4 4"/>
  <circle cx="355" cy="80" r="4" fill="#4a90d9" opacity="0.45"/>

  <!-- approximant F_n, larger n (step at x=1/5 -> X=310) -->
  <line x1="120" y1="280" x2="310" y2="280" stroke="#4a90d9" stroke-width="2.6"/>
  <line x1="310" y1="80"  x2="480" y2="80"  stroke="#4a90d9" stroke-width="2.6"/>
  <line x1="310" y1="280" x2="310" y2="80"  stroke="#4a90d9" stroke-width="1.4" stroke-dasharray="4 4"/>
  <circle cx="310" cy="80"  r="5" fill="#4a90d9"/>
  <circle cx="310" cy="280" r="5" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>

  <!-- march arrow: steps move left toward the jump -->
  <line x1="352" y1="150" x2="315" y2="150" stroke="#4a90d9" stroke-width="1.6"/>
  <polygon points="308,150 318,145 318,155" fill="#4a90d9"/>
  <text x="330" y="140" fill="#4a90d9" text-anchor="middle">n → ∞</text>

  <!-- the gap at x = 0: F_n(0) = 0 but F(0) = 1 -->
  <line x1="280" y1="272" x2="280" y2="88" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="280,80 275,92 285,92" fill="#e0645c"/>
  <polygon points="280,280 275,268 285,268" fill="#e0645c"/>
  <circle cx="280" cy="280" r="5" fill="#ffffff" stroke="#e0645c" stroke-width="2"/>
  <text x="292" y="180" fill="#e0645c">gap at the jump:</text>
  <text x="292" y="200" fill="#e0645c">F_n(0)=0 &#8603; 1=F(0)</text>

  <!-- continuity-point note -->
  <text x="392" y="122" fill="#8a8a8a">at every x ≠ 0,</text>
  <text x="392" y="140" fill="#8a8a8a">F_n(x) → F(x) ✓</text>

  <!-- labels -->
  <text x="140" y="252" fill="#4a90d9">F_n</text>
  <text x="440" y="104" fill="#e0645c">F</text>
</svg>
