<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- absorbing barriers -->
  <line x1="70" y1="60" x2="560" y2="60" stroke="#e0645c" stroke-width="3"/>
  <line x1="70" y1="300" x2="560" y2="300" stroke="#e0645c" stroke-width="3"/>
  <text x="566" y="65" fill="#e0645c">N</text>
  <text x="566" y="305" fill="#e0645c">0</text>
  <text x="330" y="50" fill="#e0645c" font-style="italic">absorbing barrier — walk stops on contact</text>

  <!-- time axis -->
  <line x1="70" y1="300" x2="600" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="600,300 590,295 590,305" fill="#8a8a8a"/>
  <text x="596" y="322" fill="#8a8a8a">n (time)</text>

  <!-- position axis -->
  <line x1="70" y1="330" x2="70" y2="45" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,45 65,55 75,55" fill="#8a8a8a"/>
  <text x="30" y="215" fill="#8a8a8a">S_n</text>

  <!-- start level dashed -->
  <line x1="70" y1="140" x2="490" y2="140" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="44" y="145" fill="#8a8a8a">x</text>

  <!-- the +/-1 walk path -->
  <polyline points="70,140 100,100 130,140 160,180 190,140 220,100 250,140 280,180 310,220 340,180 370,220 400,260 430,220 460,260 490,300"
            fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- start point -->
  <circle cx="70" cy="140" r="5" fill="#4a90d9"/>
  <text x="60" y="128" fill="#4a90d9">S_0 = x</text>

  <!-- hitting point -->
  <circle cx="490" cy="300" r="6" fill="#e0645c"/>
  <line x1="490" y1="300" x2="490" y2="330" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="470" y="345" fill="#e0645c">n = T</text>
  <text x="500" y="292" fill="#e0645c">S_T = 0</text>
</svg>
