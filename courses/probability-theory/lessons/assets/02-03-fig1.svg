<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- ================= PANEL 1: RIEMANN (slice the domain) ================= -->
  <text x="60" y="30" fill="#8a8a8a" font-style="italic">Riemann: slice the domain (x-axis) into thin vertical strips</text>

  <!-- vertical strips under the curve -->
  <g fill="#4a90d9" opacity="0.20" stroke="#4a90d9" stroke-opacity="0.5" stroke-width="0.75">
    <rect x="60"  y="248" width="22" height="52"/>
    <rect x="86"  y="205" width="22" height="95"/>
    <rect x="112" y="158" width="22" height="142"/>
    <rect x="138" y="118" width="22" height="182"/>
    <rect x="164" y="95"  width="22" height="205"/>
    <rect x="190" y="92"  width="22" height="208"/>
    <rect x="216" y="118" width="22" height="182"/>
    <rect x="242" y="160" width="22" height="140"/>
    <rect x="268" y="205" width="22" height="95"/>
    <rect x="294" y="248" width="22" height="52"/>
  </g>

  <!-- axes -->
  <line x1="45" y1="300" x2="330" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="45" y1="55"  x2="45"  y2="315" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="333" y="304" fill="#8a8a8a">ω</text>

  <!-- the curve X -->
  <path d="M 60 248 L 86 205 L 112 158 L 138 118 L 164 95 L 190 92 L 216 118 L 242 160 L 268 205 L 294 248"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="196" y="82" fill="#4a90d9">X(ω)</text>

  <text x="60" y="335" fill="#8a8a8a">Σ  height × width  of each strip</text>

  <!-- ================= PANEL 2: LEBESGUE (slice the range) ================= -->
  <text x="400" y="30" fill="#8a8a8a" font-style="italic">Lebesgue: slice the range (values) into horizontal layers</text>

  <!-- region under the same curve -->
  <path d="M 400 300 L 400 248 L 426 205 L 452 158 L 478 118 L 504 95 L 530 92 L 556 118 L 582 160 L 608 205 L 634 248 L 634 300 Z"
        fill="#e0645c" opacity="0.14"/>

  <!-- horizontal layer separators -->
  <g stroke="#e0645c" stroke-width="0.9" stroke-dasharray="2 3" opacity="0.7">
    <line x1="400" y1="210" x2="634" y2="210"/>
    <line x1="400" y1="120" x2="634" y2="120"/>
  </g>

  <!-- highlighted level t and the set { X > t } -->
  <line x1="385" y1="165" x2="634" y2="165" stroke="#e0645c" stroke-width="2"/>
  <text x="360" y="169" fill="#e0645c">t</text>

  <!-- axes -->
  <line x1="400" y1="300" x2="670" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="400" y1="55"  x2="400" y2="315" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="673" y="304" fill="#8a8a8a">ω</text>

  <!-- the same curve X -->
  <path d="M 400 248 L 426 205 L 452 158 L 478 118 L 504 95 L 530 92 L 556 118 L 582 160 L 608 205 L 634 248"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>

  <!-- bracket marking { ω : X(ω) > t } on the axis -->
  <g stroke="#4a90d9" stroke-width="2" fill="none">
    <path d="M 445 306 L 445 314 L 588 314 L 588 306"/>
  </g>
  <text x="452" y="335" fill="#4a90d9">{ ω : X(ω) &gt; t } — measure it</text>
</svg>
