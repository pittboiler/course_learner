<svg viewBox="0 0 620 410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a90d9"/>
    </marker>
  </defs>

  <!-- caption -->
  <text x="24" y="26" fill="#8a8a8a" font-style="italic">Strength flows downhill: solid arrows are the valid implications; each reverse is blocked by a named counterexample.</text>

  <!-- two strong modes (top) -->
  <rect x="70" y="55" width="150" height="46" rx="6" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="145" y="76" fill="#4a90d9" text-anchor="middle">almost surely</text>
  <text x="145" y="93" fill="#8a8a8a" text-anchor="middle" font-size="12">Xₙ → X pointwise, prob 1</text>

  <rect x="400" y="55" width="150" height="46" rx="6" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="475" y="76" fill="#4a90d9" text-anchor="middle">in Lᵖ</text>
  <text x="475" y="93" fill="#8a8a8a" text-anchor="middle" font-size="12">E|Xₙ − X|ᵖ → 0</text>

  <!-- incomparable link between the two strong modes -->
  <line x1="220" y1="78" x2="400" y2="78" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="310" y="72" fill="#8a8a8a" text-anchor="middle" font-size="12">incomparable</text>
  <text x="310" y="90" fill="#e0645c" text-anchor="middle" font-size="11">neither ⇒ the other</text>

  <!-- hub -->
  <rect x="230" y="185" width="160" height="46" rx="6" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="310" y="206" fill="#4a90d9" text-anchor="middle">in probability</text>
  <text x="310" y="223" fill="#8a8a8a" text-anchor="middle" font-size="12">P(|Xₙ − X| &gt; ε) → 0</text>

  <!-- weakest -->
  <rect x="220" y="330" width="180" height="46" rx="6" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="310" y="351" fill="#8a8a8a" text-anchor="middle">in distribution</text>
  <text x="310" y="368" fill="#8a8a8a" text-anchor="middle" font-size="12">F_Xₙ(x) → F_X(x) at cont. pts</text>

  <!-- arrows: a.s. -> in prob, L^p -> in prob, in prob -> in dist -->
  <line x1="150" y1="101" x2="258" y2="182" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="101" x2="362" y2="182" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="231" x2="310" y2="327" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- counterexample tags on the blocked reverses -->
  <text x="70" y="150" fill="#e0645c" font-size="12">reverse fails:</text>
  <text x="70" y="166" fill="#e0645c" font-size="12">typewriter</text>
  <text x="440" y="150" fill="#e0645c" font-size="12">reverse fails:</text>
  <text x="440" y="166" fill="#e0645c" font-size="12">spike n·1₍₀,₁/ₙ₎</text>
  <text x="322" y="285" fill="#e0645c" font-size="12">reverse fails: independent copies</text>
</svg>
