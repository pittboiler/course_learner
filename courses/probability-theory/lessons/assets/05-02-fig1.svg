<svg viewBox="0 0 580 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- nested subspaces: L2(F) outer, L2(G2) middle, L2(G1) inner -->
  <rect x="30" y="70" width="520" height="300" rx="10" fill="#8a8a8a" opacity="0.08" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="42" y="90" fill="#8a8a8a" font-style="italic">L²(F)  — all square-integrable X</text>

  <rect x="70" y="150" width="440" height="200" rx="10" fill="#4a90d9" opacity="0.10" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="82" y="170" fill="#4a90d9" font-style="italic">L²(G₂)  — finer info</text>

  <rect x="110" y="230" width="360" height="110" rx="10" fill="#e0645c" opacity="0.12" stroke="#e0645c" stroke-width="1.5"/>
  <text x="122" y="250" fill="#e0645c" font-style="italic">L²(G₁) ⊆ L²(G₂)  — coarser info</text>

  <!-- the random variable X, outside all subspaces -->
  <circle cx="300" cy="45" r="5" fill="#8a8a8a"/>
  <text x="312" y="50" fill="#8a8a8a">X</text>

  <!-- arrowhead defs -->
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4a90d9"/>
    </marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#e0645c"/>
    </marker>
    <marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- step 1: project X onto L2(G2) -->
  <line x1="300" y1="52" x2="300" y2="196" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#ah)"/>
  <circle cx="300" cy="205" r="5" fill="#4a90d9"/>
  <text x="312" y="210" fill="#4a90d9">E[X | G₂]</text>

  <!-- step 2: project E[X|G2] onto L2(G1) -->
  <line x1="300" y1="212" x2="300" y2="286" stroke="#e0645c" stroke-width="2.5" marker-end="url(#ahr)"/>
  <circle cx="300" cy="295" r="5" fill="#e0645c"/>
  <text x="312" y="300" fill="#e0645c">E[ E[X|G₂] | G₁ ] = E[X | G₁]</text>

  <!-- one-step: project X straight onto L2(G1) -->
  <line x1="292" y1="50" x2="160" y2="288" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ahg)"/>
  <text x="150" y="150" fill="#8a8a8a" text-anchor="end">one step</text>
  <text x="150" y="167" fill="#8a8a8a" text-anchor="end" font-style="italic">straight to G₁</text>
  <line x1="150" y1="296" x2="291" y2="296" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- caption -->
  <text x="30" y="392" fill="#8a8a8a" font-style="italic">Tower rule: project onto G₂ then G₁ (solid), or straight onto G₁ (dashed) — same landing. The coarser subspace wins.</text>
</svg>
