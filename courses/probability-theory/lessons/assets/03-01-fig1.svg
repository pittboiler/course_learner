<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- ===================== LEFT: factorization as area ===================== -->
  <text x="60" y="26" fill="#8a8a8a" font-style="italic">Independence = the box factors: P(A∩B) = P(A)·P(B)</text>

  <!-- unit square: x 60..300, y 50..290  (240 x 240) -->
  <!-- A = left column (width P(A)=0.6 -> boundary x = 60 + 144 = 204) -->
  <!-- B = bottom row  (height P(B)=0.55 -> boundary y = 290 - 132 = 158) -->

  <!-- A column shading (blue, full height) -->
  <rect x="60" y="50" width="144" height="240" fill="#4a90d9" opacity="0.10"/>
  <!-- B row shading (red, full width) -->
  <rect x="60" y="158" width="240" height="132" fill="#e0645c" opacity="0.10"/>
  <!-- intersection A∩B (bottom-left) emphasized -->
  <rect x="60" y="158" width="144" height="132" fill="#4a90d9" opacity="0.22"/>
  <rect x="60" y="158" width="144" height="132" fill="none" stroke="#4a90d9" stroke-width="2"/>

  <!-- outer square -->
  <rect x="60" y="50" width="240" height="240" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- split lines -->
  <line x1="204" y1="50" x2="204" y2="290" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="60" y1="158" x2="300" y2="158" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- labels -->
  <text x="118" y="228" fill="#2f6db0" text-anchor="middle" font-size="13">A ∩ B</text>
  <text x="118" y="246" fill="#2f6db0" text-anchor="middle" font-size="12">= P(A)P(B)</text>

  <text x="132" y="308" fill="#4a90d9" text-anchor="middle">width = P(A)</text>
  <text x="252" y="308" fill="#8a8a8a" text-anchor="middle">P(Aᶜ)</text>
  <text x="52" y="228" fill="#e0645c" text-anchor="end" transform="rotate(-90 52 228)">height = P(B)</text>

  <text x="252" y="120" fill="#8a8a8a" text-anchor="middle" font-size="12">whole box</text>
  <text x="252" y="138" fill="#8a8a8a" text-anchor="middle" font-size="12">area = 1</text>

  <!-- ===================== RIGHT: pairwise but not mutual ===================== -->
  <text x="360" y="26" fill="#8a8a8a" font-style="italic">Two fair coins + their XOR: any two independent, all three not</text>

  <!-- 2x2 sample space, each outcome prob 1/4 -->
  <!-- grid x 400..520, y 60..180 ; cells 60x60 -->
  <!-- rows: top = coin1 H (event A); cols: left = coin2 H (event B) -->
  <rect x="400" y="60" width="120" height="120" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="460" y1="60" x2="460" y2="180" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="400" y1="120" x2="520" y2="120" stroke="#8a8a8a" stroke-width="1"/>

  <!-- C = XOR = 1 = {HT, TH}: the anti-diagonal, marked red -->
  <rect x="460" y="60" width="60" height="60" fill="#e0645c" opacity="0.20"/>
  <rect x="400" y="120" width="60" height="60" fill="#e0645c" opacity="0.20"/>

  <text x="430" y="94" fill="#8a8a8a" text-anchor="middle">HH</text>
  <text x="490" y="94" fill="#e0645c" text-anchor="middle">HT</text>
  <text x="430" y="154" fill="#e0645c" text-anchor="middle">TH</text>
  <text x="490" y="154" fill="#8a8a8a" text-anchor="middle">TT</text>

  <!-- edge labels -->
  <text x="380" y="94" fill="#4a90d9" text-anchor="middle" font-size="12">A</text>
  <text x="430" y="52" fill="#4a90d9" text-anchor="middle" font-size="12">B</text>
  <text x="530" y="66" fill="#e0645c" text-anchor="start" font-size="12">C = A⊕B</text>

  <!-- verdict -->
  <text x="360" y="212" fill="#8a8a8a" font-size="12.5">P(A)=P(B)=P(C)=½,   pairs: P(A∩B)=¼=½·½  ✓</text>
  <text x="360" y="232" fill="#e0645c" font-size="12.5">but A∩B∩C = ∅ :  P = 0 ≠ ⅛ = P(A)P(B)P(C)  ✗</text>
  <text x="360" y="256" fill="#8a8a8a" font-size="12" font-style="italic">(knowing A and B pins down C — so as a trio, dependent.)</text>
</svg>
