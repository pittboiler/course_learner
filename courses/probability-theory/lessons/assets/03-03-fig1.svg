<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- ===================== LEFT PANEL: nested tails closing onto limsup ===================== -->
  <text x="30" y="26" fill="#8a8a8a" font-style="italic">The tails U_n = ⋃_{k≥n} A_k shrink down onto {A_n i.o.}</text>

  <!-- nested rounded rectangles: U_1 ⊇ U_2 ⊇ U_3 ⊇ ... -->
  <rect x="30"  y="44"  width="250" height="290" rx="14" fill="#4a90d9" opacity="0.10" stroke="#4a90d9" stroke-width="1.5"/>
  <rect x="52"  y="70"  width="206" height="238" rx="12" fill="#4a90d9" opacity="0.13" stroke="#4a90d9" stroke-width="1.5"/>
  <rect x="74"  y="96"  width="162" height="186" rx="10" fill="#4a90d9" opacity="0.16" stroke="#4a90d9" stroke-width="1.5"/>
  <rect x="96"  y="122" width="118" height="134" rx="8"  fill="#4a90d9" opacity="0.20" stroke="#4a90d9" stroke-width="1.5"/>

  <!-- limsup core -->
  <ellipse cx="155" cy="189" rx="42" ry="34" fill="#e0645c" opacity="0.75"/>
  <text x="155" y="185" fill="#ffffff" text-anchor="middle" font-size="13">limsup</text>
  <text x="155" y="201" fill="#ffffff" text-anchor="middle" font-size="12">A_n i.o.</text>

  <!-- tail labels -->
  <text x="40"  y="62"  fill="#4a90d9" font-size="13">U₁</text>
  <text x="62"  y="88"  fill="#4a90d9" font-size="13">U₂</text>
  <text x="84"  y="114" fill="#4a90d9" font-size="13">U₃</text>
  <text x="106" y="140" fill="#4a90d9" font-size="13">U₄</text>
  <text x="30" y="358" fill="#8a8a8a" font-size="12">= ⋂ₙ Uₙ : the ω in infinitely many Aₙ</text>

  <!-- ===================== RIGHT PANEL: the dichotomy (independent events) ===================== -->
  <text x="330" y="26" fill="#8a8a8a" font-style="italic">For independent events, all-or-nothing:</text>

  <!-- CASE 1: sum diverges -> prob 1 -->
  <text x="330" y="70" fill="#333333" font-size="15">Σₙ ℙ(Aₙ) = ∞</text>
  <text x="330" y="90" fill="#8a8a8a" font-size="12">(independent)</text>
  <line x1="470" y1="72" x2="512" y2="72" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="512,72 502,67 502,77" fill="#8a8a8a"/>
  <rect x="522" y="52" width="88" height="34" rx="6" fill="#e0645c" opacity="0.85"/>
  <text x="566" y="74" fill="#ffffff" text-anchor="middle" font-size="15">ℙ = 1</text>
  <text x="522" y="104" fill="#8a8a8a" font-size="12">i.o. almost surely</text>

  <!-- divider -->
  <line x1="330" y1="150" x2="610" y2="150" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- CASE 2: sum converges -> prob 0 -->
  <text x="330" y="200" fill="#333333" font-size="15">Σₙ ℙ(Aₙ) &lt; ∞</text>
  <text x="330" y="220" fill="#8a8a8a" font-size="12">(no independence needed)</text>
  <line x1="470" y1="202" x2="512" y2="202" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="512,202 502,197 502,207" fill="#8a8a8a"/>
  <rect x="522" y="182" width="88" height="34" rx="6" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="566" y="204" fill="#4a90d9" text-anchor="middle" font-size="15">ℙ = 0</text>
  <text x="522" y="234" fill="#8a8a8a" font-size="12">finitely often a.s.</text>

  <!-- 0-1 law banner -->
  <rect x="330" y="272" width="280" height="80" rx="10" fill="#8a8a8a" opacity="0.10" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="470" y="298" fill="#333333" text-anchor="middle" font-size="14">Kolmogorov 0–1 law</text>
  <text x="470" y="320" fill="#8a8a8a" text-anchor="middle" font-size="12.5">every tail event of an independent</text>
  <text x="470" y="338" fill="#8a8a8a" text-anchor="middle" font-size="12.5">sequence has ℙ ∈ {0, 1}</text>
</svg>
