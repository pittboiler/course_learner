<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- ===================== TOP: pushforward pipeline ===================== -->
  <text x="24" y="28" fill="#8a8a8a" font-style="italic">X pushes P forward onto the line, producing the distribution μ_X.</text>

  <!-- sample space blob Ω with measure P -->
  <path d="M 70 70 C 60 45, 150 40, 175 62 C 210 55, 225 110, 195 128 C 205 158, 120 168, 92 150 C 55 152, 48 92, 70 70 Z"
        fill="#4a90d9" opacity="0.12" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="86" y="112" fill="#4a90d9" font-size="20" font-style="italic">Ω</text>
  <text x="112" y="86" fill="#8a8a8a" font-size="12">ℙ</text>
  <circle cx="120" cy="72" r="2.5" fill="#8a8a8a"/>
  <circle cx="150" cy="120" r="2.5" fill="#8a8a8a"/>
  <circle cx="95" cy="128" r="2.5" fill="#8a8a8a"/>
  <circle cx="165" cy="95" r="2.5" fill="#8a8a8a"/>

  <!-- arrow X -->
  <line x1="228" y1="105" x2="392" y2="105" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="392,105 380,100 380,110" fill="#8a8a8a"/>
  <text x="298" y="94" fill="#8a8a8a" font-style="italic">X</text>
  <text x="250" y="132" fill="#8a8a8a" font-size="12">ω ↦ X(ω)</text>

  <!-- real line ℝ carrying μ_X -->
  <line x1="400" y1="150" x2="620" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="620,150 610,145 610,155" fill="#8a8a8a"/>
  <text x="612" y="170" fill="#8a8a8a" font-style="italic">ℝ</text>
  <!-- density hump (continuous part of μ_X) -->
  <path d="M 410 150 C 440 150, 450 108, 475 108 C 500 108, 505 150, 525 150 Z"
        fill="#e0645c" opacity="0.20"/>
  <path d="M 410 150 C 440 150, 450 108, 475 108 C 500 108, 505 150, 525 150"
        fill="none" stroke="#e0645c" stroke-width="2"/>
  <!-- atom (point mass): a spike -->
  <line x1="560" y1="150" x2="560" y2="96" stroke="#e0645c" stroke-width="2.5"/>
  <circle cx="560" cy="96" r="4" fill="#e0645c"/>
  <text x="452" y="98" fill="#e0645c" font-size="12">μ_X</text>
  <text x="548" y="88" fill="#e0645c" font-size="11">atom</text>

  <!-- ===================== BOTTOM: the CDF F ===================== -->
  <!-- axes -->
  <line x1="100" y1="440" x2="620" y2="440" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="100" y1="250" x2="100" y2="450" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="620,440 610,435 610,445" fill="#8a8a8a"/>
  <polygon points="100,250 95,260 105,260" fill="#8a8a8a"/>
  <text x="612" y="458" fill="#8a8a8a" font-style="italic">x</text>
  <text x="70" y="256" fill="#8a8a8a" font-style="italic">F(x)</text>

  <!-- reference levels 0 and 1 -->
  <line x1="100" y1="270" x2="600" y2="270" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="80" y="274" fill="#8a8a8a" font-size="12">1</text>
  <text x="80" y="444" fill="#8a8a8a" font-size="12">0</text>

  <!-- curve: flat 0, smooth rise to 0.4, JUMP to 0.65, rise toward 1 -->
  <!-- flat at 0 -->
  <path d="M 100 440 L 210 440" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <!-- smooth rise 0 -> 0.4 (y 440 -> 372) up to jump point x=340 -->
  <path d="M 210 440 C 265 440, 285 380, 340 372" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <!-- left limit at jump: open circle at (340,372) -->
  <circle cx="340" cy="372" r="4.5" fill="#ffffff" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- jump up to 0.65 (y=316): filled dot (right-continuous value) -->
  <circle cx="340" cy="316" r="4.5" fill="#4a90d9"/>
  <!-- rise 0.65 -> ~0.98 -->
  <path d="M 340 316 C 400 306, 470 280, 560 272" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <!-- flat near 1 -->
  <path d="M 560 272 L 600 271" fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- jump annotation -->
  <line x1="340" y1="372" x2="340" y2="316" stroke="#e0645c" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="350" y="348" fill="#e0645c" font-size="12">jump = ℙ(X = x₀)</text>
  <!-- connector from atom above down to the jump -->
  <line x1="560" y1="102" x2="380" y2="316" stroke="#e0645c" stroke-width="1" stroke-dasharray="2 5" opacity="0.7"/>

  <text x="150" y="462" fill="#8a8a8a" font-style="italic" font-size="12">right-continuous · nondecreasing · runs 0 → 1</text>
</svg>
