<svg viewBox="0 0 520 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="520" height="400" fill="#ffffff"/>
  <!-- axes -->
  <line x1="60" y1="340" x2="470" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="60" y1="340" x2="60" y2="40" stroke="#1a1a1a" stroke-width="2"/>
  <!-- axis ticks / labels -->
  <line x1="460" y1="340" x2="460" y2="345" stroke="#1a1a1a" stroke-width="2"/>
  <text x="460" y="360" font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="60" y="360" font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="255" y="378" font-family="sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">value  v</text>
  <line x1="55" y1="40" x2="60" y2="40" stroke="#1a1a1a" stroke-width="2"/>
  <text x="48" y="45" font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">1</text>
  <text x="30" y="195" font-family="sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" transform="rotate(-90 30 195)">bid  b(v)</text>

  <!-- 45 degree truthful line: (60,340) to (460,40) -->
  <line x1="60" y1="340" x2="460" y2="40" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="430" y="60" font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">b = v  (truthful, 45°)</text>

  <!-- n=5 line, slope 4/5: (60,340) to (460, 340-0.8*300=100) -->
  <line x1="60" y1="340" x2="460" y2="100" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="466" y="102" font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">n = 5</text>
  <text x="466" y="116" font-family="sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">b = (4/5)v</text>

  <!-- n=2 line, slope 1/2: (60,340) to (460, 340-0.5*300=190) -->
  <line x1="60" y1="340" x2="460" y2="190" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="466" y="192" font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">n = 2</text>
  <text x="466" y="206" font-family="sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">b = (1/2)v</text>

  <!-- shading gap arrow at v=1 between truthful (40) and n=2 (190) -->
  <line x1="446" y1="46" x2="446" y2="184" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="360" y="270" font-family="sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">shading = gap below 45°</text>
  <text x="360" y="286" font-family="sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">grows as n shrinks</text>

  <!-- caption -->
  <text x="260" y="24" font-family="sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">First-price equilibrium bids under U[0,1]: fewer rivals, more shading</text>
</svg>
