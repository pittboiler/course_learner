<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="440" fill="#ffffff"/>

  <!-- title -->
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Entry-deterrence game: Nash vs. subgame perfect</text>

  <!-- SPE-path edges (thick green) -->
  <line x1="150" y1="80" x2="390" y2="190" stroke="#1f7a4d" stroke-width="6"/>
  <line x1="390" y1="190" x2="300" y2="350" stroke="#1f7a4d" stroke-width="6"/>

  <!-- Out edge (grey) -->
  <line x1="150" y1="80" x2="80" y2="350" stroke="#888888" stroke-width="2.5"/>
  <!-- Fight edge: non-credible threat (dashed red) -->
  <line x1="390" y1="190" x2="530" y2="350" stroke="#c0392b" stroke-width="3" stroke-dasharray="9 6"/>

  <!-- Entrant node -->
  <circle cx="150" cy="80" r="9" fill="#1a1a1a"/>
  <text x="150" y="66" text-anchor="middle" font-size="14" fill="#1a1a1a">Entrant</text>

  <!-- Incumbent node -->
  <circle cx="390" cy="190" r="9" fill="#1a1a1a"/>
  <text x="410" y="185" text-anchor="start" font-size="14" fill="#1a1a1a">Incumbent</text>

  <!-- edge labels -->
  <text x="98" y="215" text-anchor="middle" font-size="13" fill="#555555">Out</text>
  <text x="258" y="128" text-anchor="middle" font-size="13" fill="#1f7a4d" font-weight="bold">In</text>
  <text x="330" y="278" text-anchor="middle" font-size="13" fill="#1f7a4d" font-weight="bold">Accommodate</text>
  <text x="480" y="270" text-anchor="middle" font-size="13" fill="#c0392b">Fight</text>

  <!-- leaves -->
  <text x="80" y="372" text-anchor="middle" font-size="14" fill="#1a1a1a">(0, 2)</text>
  <!-- SPE outcome, circled -->
  <ellipse cx="300" cy="366" rx="34" ry="16" fill="none" stroke="#1f7a4d" stroke-width="2.5"/>
  <text x="300" y="372" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">(1, 1)</text>
  <text x="530" y="372" text-anchor="middle" font-size="14" fill="#1a1a1a">(-1, -1)</text>

  <!-- annotations -->
  <text x="300" y="404" text-anchor="middle" font-size="12.5" fill="#1f7a4d">backward-induction path = SPE</text>
  <text x="530" y="392" text-anchor="middle" font-size="12" fill="#c0392b">non-credible</text>
  <text x="530" y="407" text-anchor="middle" font-size="12" fill="#c0392b">threat (pruned)</text>

  <!-- payoff legend -->
  <text x="150" y="428" text-anchor="middle" font-size="11.5" fill="#555555">payoffs shown as (Entrant, Incumbent)</text>

  <!-- Nash-not-SPE callout -->
  <text x="80" y="392" text-anchor="middle" font-size="12" fill="#555555">(Out, Fight):</text>
  <text x="80" y="407" text-anchor="middle" font-size="12" fill="#555555">Nash, not SPE</text>
</svg>
