<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>

  <text x="380" y="26" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">An extensive-form game with imperfect information</text>

  <!-- ===== edges from root ===== -->
  <line x1="380" y1="60" x2="210" y2="188" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="380" y1="60" x2="550" y2="188" stroke="#1a1a1a" stroke-width="2"/>
  <text x="278" y="118" font-size="15" fill="#1a1a1a" text-anchor="middle" font-style="italic">L</text>
  <text x="482" y="118" font-size="15" fill="#1a1a1a" text-anchor="middle" font-style="italic">R</text>

  <!-- ===== edges from player-2 nodes ===== -->
  <line x1="210" y1="192" x2="110" y2="322" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="210" y1="192" x2="310" y2="322" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="550" y1="192" x2="450" y2="322" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="550" y1="192" x2="650" y2="322" stroke="#1a1a1a" stroke-width="2"/>
  <text x="150" y="262" font-size="15" fill="#1a1a1a" text-anchor="middle" font-style="italic">a</text>
  <text x="270" y="262" font-size="15" fill="#1a1a1a" text-anchor="middle" font-style="italic">b</text>
  <text x="490" y="262" font-size="15" fill="#1a1a1a" text-anchor="middle" font-style="italic">a</text>
  <text x="610" y="262" font-size="15" fill="#1a1a1a" text-anchor="middle" font-style="italic">b</text>

  <!-- ===== information set (dashed) linking the two player-2 nodes ===== -->
  <line x1="210" y1="190" x2="550" y2="190" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="380" y="182" font-size="12.5" fill="#1a1a1a" text-anchor="middle">information set of player 2</text>

  <!-- ===== nodes ===== -->
  <circle cx="380" cy="55" r="6.5" fill="#1a1a1a"/>
  <text x="380" y="46" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">1</text>

  <circle cx="210" cy="190" r="6.5" fill="#1a1a1a"/>
  <text x="196" y="182" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="550" cy="190" r="6.5" fill="#1a1a1a"/>
  <text x="564" y="182" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">2</text>

  <!-- ===== leaves / payoffs (player 1, player 2) ===== -->
  <text x="110" y="348" font-size="14.5" fill="#1a1a1a" text-anchor="middle">(2, 1)</text>
  <text x="310" y="348" font-size="14.5" fill="#1a1a1a" text-anchor="middle">(0, 0)</text>
  <text x="450" y="348" font-size="14.5" fill="#1a1a1a" text-anchor="middle">(0, 0)</text>
  <text x="650" y="348" font-size="14.5" fill="#1a1a1a" text-anchor="middle">(1, 2)</text>

  <text x="380" y="384" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-style="italic">Player 2 moves without knowing whether player 1 chose L or R &#8212; the two nodes are indistinguishable.</text>
</svg>
