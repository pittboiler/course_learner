<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="380" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#1f5fa8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="26" text-anchor="middle" font-size="15" fill="#1a1a1a" font-weight="bold">The revelation principle: two paths, one outcome</text>

  <!-- Types box (left) -->
  <rect x="20" y="150" width="120" height="72" rx="6" fill="#eef3fa" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="80" y="182" text-anchor="middle" font-size="13" fill="#1a1a1a">True types</text>
  <text x="80" y="202" text-anchor="middle" font-size="14" fill="#1a1a1a" font-style="italic">&#952; = (&#952;&#8321;,&#8230;,&#952;&#8345;)</text>

  <!-- Top path: strategies box -->
  <rect x="200" y="48" width="152" height="64" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="276" y="74" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Agents strategize:</text>
  <text x="276" y="94" text-anchor="middle" font-size="13" fill="#1a1a1a" font-style="italic">play &#963;*(&#952;)</text>

  <!-- Top path: mechanism box -->
  <rect x="392" y="48" width="168" height="64" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="476" y="74" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Arbitrary mechanism</text>
  <text x="476" y="94" text-anchor="middle" font-size="13" fill="#1a1a1a" font-style="italic">M = (M, g)</text>

  <!-- Bottom path: direct mechanism box -->
  <rect x="200" y="262" width="360" height="64" rx="6" fill="#f3f0e8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="380" y="288" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Truthful direct mechanism: report &#952;, and the box</text>
  <text x="380" y="308" text-anchor="middle" font-size="13" fill="#1a1a1a" font-style="italic">runs &#963;* for you &#8594; outcome f(&#952;)</text>

  <!-- Outcome box (right) -->
  <rect x="580" y="150" width="100" height="72" rx="6" fill="#eef3fa" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="630" y="182" text-anchor="middle" font-size="13" fill="#1a1a1a">Outcome</text>
  <text x="630" y="202" text-anchor="middle" font-size="14" fill="#1a1a1a" font-style="italic">f(&#952;)</text>

  <!-- Arrows: types -> top strategies -->
  <line x1="140" y1="166" x2="197" y2="86" stroke="#1f5fa8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- top strategies -> mechanism -->
  <line x1="352" y1="80" x2="389" y2="80" stroke="#1f5fa8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- mechanism -> outcome -->
  <line x1="560" y1="86" x2="616" y2="147" stroke="#1f5fa8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Arrows: types -> direct mechanism -->
  <line x1="140" y1="206" x2="197" y2="290" stroke="#1f5fa8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- direct mechanism -> outcome -->
  <line x1="560" y1="290" x2="616" y2="207" stroke="#1f5fa8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Path labels -->
  <text x="350" y="128" text-anchor="middle" font-size="11.5" fill="#7a3b12" font-style="italic">the real, complicated world</text>
  <text x="380" y="346" text-anchor="middle" font-size="11.5" fill="#7a3b12" font-style="italic">the equivalent truthful world &#8212; WLOG for analysis</text>

  <!-- equals note -->
  <text x="630" y="238" text-anchor="middle" font-size="11.5" fill="#1a1a1a">identical f(&#952;)</text>
</svg>
