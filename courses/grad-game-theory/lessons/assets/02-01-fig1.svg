<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
  <style>
    text { font-family: sans-serif; fill: #1a1a1a; }
    .lbl { font-size: 15px; }
    .ttl { font-size: 15px; font-weight: bold; }
    .sm { font-size: 12px; }
    .cell { font-size: 13px; }
    .hd { font-size: 13px; font-weight: bold; }
    .gone { fill: #b7b7b7; }
  </style>

  <text class="ttl" x="20" y="26">Iterated elimination of strictly dominated strategies</text>
  <text class="sm" x="20" y="46">payoffs (Row, Col); delete a strategy no belief can justify, then repeat</text>

  <!-- ================= STAGE 0: full 3x3 ================= -->
  <text class="hd" x="70" y="82">Stage 0: full game</text>
  <text class="hd" x="150" y="110">L</text>
  <text class="hd" x="210" y="110">C</text>
  <text class="hd" x="270" y="110">R</text>
  <text class="hd" x="70" y="145">T</text>
  <text class="hd" x="70" y="185">M</text>
  <text class="hd" x="70" y="225">B</text>
  <rect x="120" y="120" width="180" height="120" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="180" y1="120" x2="180" y2="240" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="240" y1="120" x2="240" y2="240" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="120" y1="160" x2="300" y2="160" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="120" y1="200" x2="300" y2="200" stroke="#1a1a1a" stroke-width="1"/>
  <!-- T row -->
  <text class="cell" x="132" y="145">4,4</text>
  <text class="cell" x="192" y="145">0,0</text>
  <text class="cell" x="252" y="145">1,1</text>
  <!-- M row -->
  <text class="cell" x="132" y="185">0,0</text>
  <text class="cell" x="192" y="185">4,4</text>
  <text class="cell" x="252" y="185">1,1</text>
  <!-- B row -->
  <text class="cell" x="132" y="225">1,3</text>
  <text class="cell" x="192" y="225">1,3</text>
  <text class="cell" x="252" y="225">3,1</text>

  <text class="sm" x="70" y="272">R is strictly dominated for Col by the</text>
  <text class="sm" x="70" y="290">mix ½L+½C (col payoffs 2,2,3 &gt; 1,1,1)</text>
  <text class="sm" x="70" y="308">— yet neither L nor C alone beats R.</text>

  <!-- arrow -->
  <line x1="322" y1="180" x2="366" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="366,180 354,175 354,185" fill="#1a1a1a"/>

  <!-- ================= STAGE 1: R deleted ================= -->
  <text class="hd" x="440" y="82">Stage 1: R gone → B falls</text>
  <text class="hd" x="520" y="110">L</text>
  <text class="hd" x="580" y="110">C</text>
  <text class="hd gone" x="640" y="110">R</text>
  <text class="hd" x="440" y="145">T</text>
  <text class="hd" x="440" y="185">M</text>
  <text class="hd gone" x="440" y="225">B</text>
  <rect x="490" y="120" width="120" height="120" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="550" y1="120" x2="550" y2="240" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="490" y1="160" x2="610" y2="160" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="490" y1="200" x2="610" y2="200" stroke="#1a1a1a" stroke-width="1"/>
  <!-- ghosted deleted R column -->
  <rect x="610" y="120" width="60" height="120" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <line x1="610" y1="120" x2="670" y2="240" stroke="#c0392b" stroke-width="2"/>
  <line x1="670" y1="120" x2="610" y2="240" stroke="#c0392b" stroke-width="2"/>
  <!-- ghosted deleted B row -->
  <line x1="490" y1="200" x2="610" y2="240" stroke="#c0392b" stroke-width="2"/>
  <line x1="610" y1="200" x2="490" y2="240" stroke="#c0392b" stroke-width="2"/>
  <!-- cells -->
  <text class="cell" x="502" y="145">4,4</text>
  <text class="cell" x="562" y="145">0,0</text>
  <text class="cell gone" x="622" y="145">1,1</text>
  <text class="cell" x="502" y="185">0,0</text>
  <text class="cell" x="562" y="185">4,4</text>
  <text class="cell gone" x="622" y="185">1,1</text>
  <text class="cell gone" x="502" y="225">1,3</text>
  <text class="cell gone" x="562" y="225">1,3</text>
  <text class="cell gone" x="622" y="225">3,1</text>

  <text class="sm" x="440" y="272">With R gone, B is dominated for Row by</text>
  <text class="sm" x="440" y="290">½T+½M (2,2 &gt; 1,1). Survivors: the 2×2</text>
  <text class="sm" x="440" y="308">block {T,M}×{L,C} — a coordination game.</text>
  <text class="sm" x="440" y="326">No further strict dominance = rationalizable set.</text>
</svg>
