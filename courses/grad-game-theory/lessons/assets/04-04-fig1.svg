<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <style>
    text { font-family: sans-serif; fill: #1a1a1a; }
    .lbl { font-size: 15px; }
    .sm { font-size: 13px; fill: #555555; }
    .bel { font-size: 15px; font-weight: bold; }
    .edge { stroke: #1a1a1a; stroke-width: 1.6; fill: none; }
    .iset { stroke: #777777; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    .node { fill: #1a1a1a; }
    .open { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.6; }
    .title { font-size: 16px; font-weight: bold; }
  </style>

  <text class="title" x="24" y="30">A signaling game: Nature picks a type, Sender messages, Receiver holds beliefs</text>

  <!-- Nature -->
  <circle class="node" cx="70" cy="235" r="6"/>
  <text class="lbl" x="40" y="258">Nature</text>

  <!-- Nature edges to type nodes -->
  <path class="edge" d="M70,235 L215,150"/>
  <path class="edge" d="M70,235 L215,340"/>
  <text class="sm" x="120" y="180">Friend  2/3</text>
  <text class="sm" x="120" y="305">Enemy  1/3</text>

  <!-- Type nodes -->
  <circle class="node" cx="222" cy="148" r="6"/>
  <text class="lbl" x="192" y="140">t = F</text>
  <circle class="node" cx="222" cy="342" r="6"/>
  <text class="lbl" x="192" y="365">t = E</text>

  <!-- Sender edges: G goes to upper receiver set, N goes to lower -->
  <path class="edge" d="M222,148 L455,95"/>
  <text class="lbl" x="320" y="108">G</text>
  <path class="edge" d="M222,148 L455,300"/>
  <text class="lbl" x="300" y="238">N</text>
  <path class="edge" d="M222,342 L455,175"/>
  <text class="lbl" x="330" y="268">G</text>
  <path class="edge" d="M222,342 L455,380"/>
  <text class="lbl" x="320" y="378">N</text>

  <!-- G information set (on-path) -->
  <circle class="open" cx="462" cy="95" r="6"/>
  <circle class="open" cx="462" cy="175" r="6"/>
  <path class="iset" d="M462,101 L462,169"/>
  <text class="bel" x="478" y="92">&#956; = 2/3</text>
  <text class="bel" x="478" y="192">1&#8722;&#956; = 1/3</text>
  <text class="sm" x="452" y="60">Receiver after G  (on&#8209;path: Bayes)</text>

  <!-- Receiver actions from G set -->
  <path class="edge" d="M468,133 L610,110"/>
  <path class="edge" d="M468,140 L610,158"/>
  <text class="lbl" x="560" y="106">A</text>
  <text class="lbl" x="560" y="170">R</text>
  <text class="sm" x="620" y="114">accept</text>
  <text class="sm" x="620" y="162">reject</text>
  <text class="sm" x="470" y="228">E[A] = 2&#956;&#8722;1 = 1/3 &gt; 0  &#8594;  Accept</text>

  <!-- N information set (off-path) -->
  <circle class="open" cx="462" cy="300" r="6"/>
  <circle class="open" cx="462" cy="380" r="6"/>
  <path class="iset" d="M462,306 L462,374"/>
  <text class="bel" x="478" y="297">&#957;</text>
  <text class="bel" x="478" y="397">1&#8722;&#957;</text>
  <text class="sm" x="452" y="270">Receiver after N  (off&#8209;path: &#957; free)</text>
  <text class="sm" x="470" y="432">&#957; &#8804; 1/2  &#8594;  Reject  (this is where refinements bite)</text>
</svg>
