<svg viewBox="0 0 520 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="520" height="400" fill="#ffffff"/>

  <!-- no-sale band: v in [0, 1/2], where psi < 0 -->
  <rect x="60" y="40" width="200" height="300" fill="#e8e8e8"/>
  <text x="160" y="315" font-family="sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">no sale</text>
  <text x="160" y="330" font-family="sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">(psi &lt; 0, withhold)</text>

  <!-- vertical value axis at v=0 -->
  <line x1="60" y1="40" x2="60" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <!-- horizontal psi=0 axis, drawn across at y=190 -->
  <line x1="60" y1="190" x2="470" y2="190" stroke="#1a1a1a" stroke-width="2"/>

  <!-- x ticks: v scale 0..1, x_pix = 60 + 400 v -->
  <text x="60" y="358" font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">0</text>
  <line x1="260" y1="190" x2="260" y2="196" stroke="#1a1a1a" stroke-width="2"/>
  <text x="260" y="358" font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">1/2</text>
  <line x1="460" y1="185" x2="460" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <text x="460" y="358" font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="255" y="378" font-family="sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">value  v</text>

  <!-- y ticks: psi scale -1..1, y_pix = 190 - 150 psi -->
  <line x1="55" y1="40" x2="60" y2="40" stroke="#1a1a1a" stroke-width="2"/>
  <text x="48" y="45" font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">1</text>
  <line x1="55" y1="340" x2="60" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <text x="48" y="345" font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">-1</text>
  <text x="30" y="120" font-family="sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" transform="rotate(-90 30 120)">virtual value  psi(v)</text>

  <!-- psi(v) = 2v - 1 : from (0,-1)->(60,340) to (1,1)->(460,40) -->
  <line x1="60" y1="340" x2="460" y2="40" stroke="#1a1a1a" stroke-width="3"/>
  <text x="410" y="72" font-family="sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end">psi(v) = 2v - 1</text>

  <!-- reserve crossing at (1/2, 0) -->
  <circle cx="260" cy="190" r="5" fill="#1a1a1a"/>
  <line x1="260" y1="190" x2="260" y2="40" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="272" y="150" font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">reserve r* = 1/2</text>
  <text x="272" y="166" font-family="sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">where psi = 0</text>

  <!-- sell region annotation -->
  <text x="370" y="230" font-family="sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">sell (psi &gt; 0)</text>

  <!-- caption -->
  <text x="260" y="24" font-family="sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Virtual valuation for U[0,1]: below the reserve, the seller withholds</text>
</svg>
