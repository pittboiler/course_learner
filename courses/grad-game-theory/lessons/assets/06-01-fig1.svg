<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="sans-serif">
  <rect x="0" y="0" width="600" height="460" fill="#ffffff"/>

  <!-- blocked corner regions: some player would get more than 1/2 -->
  <polygon points="300,60 200,230 400,230" fill="#f7dcdc"/>
  <polygon points="100,400 200,230 300,400" fill="#f7dcdc"/>
  <polygon points="500,400 400,230 300,400" fill="#f7dcdc"/>

  <!-- the core: the central (medial) triangle -->
  <polygon points="200,230 400,230 300,400" fill="#cfe3f7" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- imputation simplex outline -->
  <polygon points="300,60 100,400 500,400" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- coalition constraint lines (each cuts off one corner) -->
  <line x1="200" y1="230" x2="400" y2="230" stroke="#b03030" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="200" y1="230" x2="300" y2="400" stroke="#b03030" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="400" y1="230" x2="300" y2="400" stroke="#b03030" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- equal-split imputation -->
  <circle cx="300" cy="287" r="4" fill="#1a1a1a"/>
  <text x="316" y="291" font-size="12" fill="#1a1a1a" text-anchor="start">(⅓, ⅓, ⅓)</text>

  <!-- core label -->
  <text x="300" y="360" font-size="15" fill="#154a78" text-anchor="middle" font-weight="bold">CORE</text>

  <!-- corner (vertex) imputations -->
  <text x="300" y="46" font-size="13" fill="#1a1a1a" text-anchor="middle">x = (1, 0, 0)</text>
  <text x="92" y="414" font-size="13" fill="#1a1a1a" text-anchor="end">(0, 1, 0)</text>
  <text x="508" y="414" font-size="13" fill="#1a1a1a" text-anchor="start">(0, 0, 1)</text>

  <!-- blocked-region annotations -->
  <text x="300" y="160" font-size="12.5" fill="#8a2020" text-anchor="middle">x₁ &gt; ½</text>
  <text x="300" y="177" font-size="12.5" fill="#8a2020" text-anchor="middle">{2,3} blocks</text>

  <text x="205" y="340" font-size="12.5" fill="#8a2020" text-anchor="middle">x₂ &gt; ½</text>
  <text x="205" y="357" font-size="12.5" fill="#8a2020" text-anchor="middle">{1,3} blocks</text>

  <text x="398" y="340" font-size="12.5" fill="#8a2020" text-anchor="middle">x₃ &gt; ½</text>
  <text x="398" y="357" font-size="12.5" fill="#8a2020" text-anchor="middle">{1,2} blocks</text>

  <!-- constraint reading -->
  <text x="300" y="222" font-size="11.5" fill="#8a2020" text-anchor="middle">x₂+x₃ = v(23) = ½</text>

  <!-- caption -->
  <text x="300" y="440" font-size="12.5" fill="#1a1a1a" text-anchor="middle">Simplex: x₁+x₂+x₃ = v(N) = 1.   Pairs worth v(S) = ½.   Core = central shaded triangle.</text>
</svg>
