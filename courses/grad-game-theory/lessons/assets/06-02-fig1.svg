<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="470" fill="#ffffff"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="#1a1a1a" font-weight="bold">Shapley value = average marginal contribution over all 6 arrival orders</text>
  <text x="320" y="45" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Game: singletons 0, v(12)=v(13)=4, v(23)=0, v(123)=6</text>

  <!-- ===================== Table ===================== -->
  <!-- Header -->
  <text x="118" y="78" text-anchor="middle" font-size="12.5" fill="#1a1a1a" font-weight="bold">Arrival order</text>
  <text x="255" y="78" text-anchor="middle" font-size="12.5" fill="#1f5fa8" font-weight="bold">&#916; Player 1</text>
  <text x="330" y="78" text-anchor="middle" font-size="12.5" fill="#2e8b57" font-weight="bold">&#916; Player 2</text>
  <text x="405" y="78" text-anchor="middle" font-size="12.5" fill="#c0392b" font-weight="bold">&#916; Player 3</text>
  <line x1="40" y1="88" x2="450" y2="88" stroke="#1a1a1a" stroke-width="1.4"/>

  <!-- Rows -->
  <text x="118" y="112" text-anchor="middle" font-size="12.5" fill="#1a1a1a">1 &#8594; 2 &#8594; 3</text>
  <text x="255" y="112" text-anchor="middle" font-size="12.5" fill="#1a1a1a">0</text>
  <text x="330" y="112" text-anchor="middle" font-size="12.5" fill="#1a1a1a">4</text>
  <text x="405" y="112" text-anchor="middle" font-size="12.5" fill="#1a1a1a">2</text>

  <text x="118" y="140" text-anchor="middle" font-size="12.5" fill="#1a1a1a">1 &#8594; 3 &#8594; 2</text>
  <text x="255" y="140" text-anchor="middle" font-size="12.5" fill="#1a1a1a">0</text>
  <text x="330" y="140" text-anchor="middle" font-size="12.5" fill="#1a1a1a">2</text>
  <text x="405" y="140" text-anchor="middle" font-size="12.5" fill="#1a1a1a">4</text>

  <text x="118" y="168" text-anchor="middle" font-size="12.5" fill="#1a1a1a">2 &#8594; 1 &#8594; 3</text>
  <text x="255" y="168" text-anchor="middle" font-size="12.5" fill="#1a1a1a">4</text>
  <text x="330" y="168" text-anchor="middle" font-size="12.5" fill="#1a1a1a">0</text>
  <text x="405" y="168" text-anchor="middle" font-size="12.5" fill="#1a1a1a">2</text>

  <text x="118" y="196" text-anchor="middle" font-size="12.5" fill="#1a1a1a">2 &#8594; 3 &#8594; 1</text>
  <text x="255" y="196" text-anchor="middle" font-size="12.5" fill="#1a1a1a">6</text>
  <text x="330" y="196" text-anchor="middle" font-size="12.5" fill="#1a1a1a">0</text>
  <text x="405" y="196" text-anchor="middle" font-size="12.5" fill="#1a1a1a">0</text>

  <text x="118" y="224" text-anchor="middle" font-size="12.5" fill="#1a1a1a">3 &#8594; 1 &#8594; 2</text>
  <text x="255" y="224" text-anchor="middle" font-size="12.5" fill="#1a1a1a">4</text>
  <text x="330" y="224" text-anchor="middle" font-size="12.5" fill="#1a1a1a">2</text>
  <text x="405" y="224" text-anchor="middle" font-size="12.5" fill="#1a1a1a">0</text>

  <text x="118" y="252" text-anchor="middle" font-size="12.5" fill="#1a1a1a">3 &#8594; 2 &#8594; 1</text>
  <text x="255" y="252" text-anchor="middle" font-size="12.5" fill="#1a1a1a">6</text>
  <text x="330" y="252" text-anchor="middle" font-size="12.5" fill="#1a1a1a">0</text>
  <text x="405" y="252" text-anchor="middle" font-size="12.5" fill="#1a1a1a">0</text>

  <!-- Sum + average -->
  <line x1="40" y1="266" x2="450" y2="266" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="118" y="288" text-anchor="middle" font-size="12" fill="#1a1a1a" font-style="italic">sum / 6</text>
  <text x="255" y="288" text-anchor="middle" font-size="12" fill="#1a1a1a" font-style="italic">20/6</text>
  <text x="330" y="288" text-anchor="middle" font-size="12" fill="#1a1a1a" font-style="italic">8/6</text>
  <text x="405" y="288" text-anchor="middle" font-size="12" fill="#1a1a1a" font-style="italic">8/6</text>

  <text x="118" y="312" text-anchor="middle" font-size="12.5" fill="#1a1a1a" font-weight="bold">&#966; =</text>
  <text x="255" y="312" text-anchor="middle" font-size="12.5" fill="#1f5fa8" font-weight="bold">10/3 &#8776; 3.33</text>
  <text x="330" y="312" text-anchor="middle" font-size="12.5" fill="#2e8b57" font-weight="bold">4/3 &#8776; 1.33</text>
  <text x="405" y="312" text-anchor="middle" font-size="12.5" fill="#c0392b" font-weight="bold">4/3 &#8776; 1.33</text>

  <!-- ===================== Stacked bar ===================== -->
  <text x="545" y="72" text-anchor="middle" font-size="12.5" fill="#1a1a1a" font-weight="bold">v(N) = 6</text>
  <text x="545" y="88" text-anchor="middle" font-size="11.5" fill="#1a1a1a">split fairly</text>

  <!-- scale: 40 px per unit; bottom y=380, top y=140 -->
  <!-- Player 1: 10/3 = 133.3 px, y 246.7 .. 380? build top-down: p1 top -->
  <rect x="510" y="140" width="70" height="133.33" fill="#1f5fa8" fill-opacity="0.75" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="510" y="273.33" width="70" height="53.33" fill="#2e8b57" fill-opacity="0.75" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="510" y="326.67" width="70" height="53.33" fill="#c0392b" fill-opacity="0.75" stroke="#1a1a1a" stroke-width="1"/>

  <text x="545" y="212" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">&#966;&#8321; = 10/3</text>
  <text x="545" y="304" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">&#966;&#8322; = 4/3</text>
  <text x="545" y="357" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">&#966;&#8323; = 4/3</text>

  <!-- Caption -->
  <text x="320" y="410" text-anchor="middle" font-size="12" fill="#1a1a1a">Each column average is that player's Shapley value; the three add up to v(N) = 6 (efficiency).</text>
  <text x="320" y="430" text-anchor="middle" font-size="12" fill="#1a1a1a">Player 1 is the only gateway to value, so is pivotal in more orders &#8212; and earns more.</text>
  <text x="320" y="450" text-anchor="middle" font-size="11.5" fill="#1a1a1a" font-style="italic">Players 2 and 3 are interchangeable, so symmetry forces &#966;&#8322; = &#966;&#8323;.</text>
</svg>
