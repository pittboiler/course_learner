<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">A blocking pair versus a stable matching</text>
  <text x="380" y="52" text-anchor="middle" font-size="13" fill="#555555">Men M1–M3 and women W1–W3, each with strict preferences. Solid lines = who is matched to whom.</text>

  <!-- ===================== LEFT PANEL ===================== -->
  <text x="180" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Unstable matching</text>
  <text x="180" y="106" text-anchor="middle" font-size="12" fill="#555555">M2 and W1 both prefer each other — they defect</text>

  <!-- matched edges (drawn first, hidden under nodes) -->
  <line x1="90" y1="150" x2="270" y2="150" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="90" y1="240" x2="270" y2="330" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="90" y1="330" x2="270" y2="240" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- blocking pair -->
  <line x1="90" y1="240" x2="270" y2="150" stroke="#b00020" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="176" y="188" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b00020" transform="rotate(-26 176 188)">blocking pair</text>

  <!-- men nodes -->
  <circle cx="90" cy="150" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="90" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">M1</text>
  <circle cx="90" cy="240" r="22" fill="#f2f2f2" stroke="#b00020" stroke-width="3"/>
  <text x="90" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">M2</text>
  <circle cx="90" cy="330" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="90" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">M3</text>
  <!-- women nodes -->
  <circle cx="270" cy="150" r="22" fill="#f2f2f2" stroke="#b00020" stroke-width="3"/>
  <text x="270" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">W1</text>
  <circle cx="270" cy="240" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="270" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">W2</text>
  <circle cx="270" cy="330" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="270" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">W3</text>

  <!-- ===================== RIGHT PANEL ===================== -->
  <text x="580" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Stable matching (men propose)</text>
  <text x="580" y="106" text-anchor="middle" font-size="12" fill="#555555">No pair can both do better — Gale–Shapley output</text>

  <line x1="490" y1="150" x2="670" y2="150" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="490" y1="240" x2="670" y2="240" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="490" y1="330" x2="670" y2="330" stroke="#1a1a1a" stroke-width="2.5"/>

  <circle cx="490" cy="150" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="490" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">M1</text>
  <circle cx="490" cy="240" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="490" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">M2</text>
  <circle cx="490" cy="330" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="490" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">M3</text>
  <circle cx="670" cy="150" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="670" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">W1</text>
  <circle cx="670" cy="240" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="670" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">W2</text>
  <circle cx="670" cy="330" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="670" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">W3</text>

  <!-- divider -->
  <line x1="380" y1="120" x2="380" y2="370" stroke="#cccccc" stroke-width="1.5"/>

  <!-- Preference legend -->
  <text x="380" y="410" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">Preferences (favorite first)</text>
  <text x="380" y="432" text-anchor="middle" font-size="12" fill="#1a1a1a">M1: W1 &gt; W2 &gt; W3     M2: W2 &gt; W1 &gt; W3     M3: W1 &gt; W2 &gt; W3</text>
  <text x="380" y="452" text-anchor="middle" font-size="12" fill="#1a1a1a">W1: M2 &gt; M1 &gt; M3     W2: M1 &gt; M2 &gt; M3     W3: M1 &gt; M2 &gt; M3</text>
</svg>
