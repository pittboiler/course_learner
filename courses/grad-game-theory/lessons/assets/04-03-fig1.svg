<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="sans-serif">
  <rect x="0" y="0" width="560" height="440" fill="#ffffff"/>

  <text x="280" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">The envelope split: allocation fixes surplus and payment</text>
  <text x="280" y="48" text-anchor="middle" font-size="12.5" fill="#555">the rectangle v&#183;Q(v) is carved by the allocation curve Q into surplus U(v) and payment m(v)</text>

  <!-- shaded payment region (above curve, inside rectangle) : blue -->
  <path d="M 120,223 L 344,223 312,262 280,295 248,322 216,343 184,358 152,367 120,370 Z"
        fill="#cfe3fb" stroke="none"/>

  <!-- shaded surplus region (under curve to baseline) : green -->
  <path d="M 120,370 L 152,367 184,358 216,343 248,322 280,295 312,262 344,223 L 344,370 Z"
        fill="#c9ecd3" stroke="none"/>

  <!-- rectangle outline [0,v] x [0,Q(v)] -->
  <rect x="120" y="223" width="224" height="147" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- axes -->
  <line x1="120" y1="370" x2="470" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="120" y1="370" x2="120" y2="60"  stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="470" y="390" text-anchor="middle" font-size="13" fill="#1a1a1a">value  x</text>
  <text x="120" y="52"  text-anchor="middle" font-size="13" fill="#1a1a1a">Q(x) = Pr(win | x)</text>
  <text x="116" y="374" text-anchor="end" font-size="11" fill="#555">0</text>
  <text x="116" y="74"  text-anchor="end" font-size="11" fill="#555">1</text>
  <text x="344" y="386" text-anchor="middle" font-size="12" fill="#1a1a1a">v</text>
  <text x="440" y="386" text-anchor="middle" font-size="11" fill="#555">1</text>

  <!-- allocation curve Q(x) = x^{n-1} -->
  <polyline points="120,370 152,367 184,358 216,343 248,322 280,295 312,262 344,223 376,178 408,127 440,70"
            fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="452" y="66" font-size="12.5" font-weight="bold" fill="#1a1a1a">Q</text>

  <!-- guide lines to v and Q(v) -->
  <line x1="344" y1="370" x2="344" y2="223" stroke="#888" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="120" y1="223" x2="344" y2="223" stroke="#888" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="112" y="227" text-anchor="end" font-size="11" fill="#555">Q(v)</text>
  <circle cx="344" cy="223" r="4.5" fill="#1a1a1a"/>

  <!-- region labels -->
  <text x="205" y="300" font-size="14" font-weight="bold" fill="#0a7d33">U(v)</text>
  <text x="205" y="318" font-size="10.5" fill="#0a7d33">surplus = &#8747;&#8320;&#7515; Q</text>
  <text x="235" y="258" font-size="14" font-weight="bold" fill="#1f6feb">m(v)</text>
  <text x="222" y="205" font-size="10.5" fill="#1f6feb">payment = vQ(v) &#8722; &#8747;&#8320;&#7515; Q</text>

  <text x="280" y="425" text-anchor="middle" font-size="11.5" fill="#555">Same allocation Q &#8658; same green area &#8658; same blue area &#8658; same expected payment. The rules never enter.</text>
</svg>
