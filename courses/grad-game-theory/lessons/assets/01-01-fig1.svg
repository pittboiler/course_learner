<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="720" height="340" fill="#ffffff"/>
  <style>
    text { font-family: sans-serif; fill: #1a1a1a; }
    .lbl { font-size: 15px; }
    .ttl { font-size: 15px; font-weight: bold; }
    .sm { font-size: 12px; }
  </style>

  <!-- Panel A: convex vs non-convex -->
  <text class="ttl" x="20" y="26">Convex vs. non-convex</text>

  <!-- convex blob (ellipse) -->
  <ellipse cx="90" cy="120" rx="60" ry="50" fill="#dfeaff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="58" cy="98" r="3.5" fill="#1a1a1a"/>
  <circle cx="122" cy="142" r="3.5" fill="#1a1a1a"/>
  <line x1="58" y1="98" x2="122" y2="142" stroke="#1a1a1a" stroke-width="2"/>
  <text class="sm" x="46" y="92">x</text>
  <text class="sm" x="126" y="152">y</text>
  <text class="lbl" x="48" y="205">convex ✓</text>
  <text class="sm" x="18" y="223">segment stays inside</text>

  <!-- non-convex L-shape -->
  <polygon points="200,70 250,70 250,120 300,120 300,170 200,170"
           fill="#ffe1e1" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="238" cy="82" r="3.5" fill="#1a1a1a"/>
  <circle cx="288" cy="158" r="3.5" fill="#1a1a1a"/>
  <line x1="238" y1="82" x2="288" y2="158" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="sm" x="222" y="78">x</text>
  <text class="sm" x="292" y="168">y</text>
  <text class="lbl" x="205" y="205">non-convex ✗</text>
  <text class="sm" x="188" y="223">segment leaves it</text>

  <!-- divider -->
  <line x1="335" y1="14" x2="335" y2="326" stroke="#bbbbbb" stroke-width="1"/>

  <!-- Panel B: separating hyperplane -->
  <text class="ttl" x="355" y="26">Separating hyperplane</text>

  <ellipse cx="445" cy="130" rx="55" ry="46" fill="#dfeaff" stroke="#1a1a1a" stroke-width="2"/>
  <text class="lbl" x="425" y="135">A</text>
  <ellipse cx="618" cy="205" rx="55" ry="46" fill="#e3f5e3" stroke="#1a1a1a" stroke-width="2"/>
  <text class="lbl" x="610" y="210">B</text>

  <!-- separating line: a·x = c -->
  <line x1="498" y1="42" x2="582" y2="312" stroke="#c0392b" stroke-width="2.5"/>
  <text class="sm" x="508" y="60" fill="#c0392b">a·x = c</text>
  <!-- normal arrow a -->
  <line x1="536" y1="178" x2="588" y2="162" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="588,162 577,158 580,169" fill="#1a1a1a"/>
  <text class="sm" x="592" y="162">a</text>

  <text class="sm" x="355" y="306">A, B disjoint &amp; convex</text>
  <text class="sm" x="355" y="324">⇒ a line fits between them</text>
</svg>
