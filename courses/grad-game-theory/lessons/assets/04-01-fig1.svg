<svg viewBox="0 0 560 470" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="560" height="470" fill="#ffffff"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#1a1a1a" font-weight="bold">Harsanyi's move: Nature draws types, players see only their own</text>

  <!-- Nature node -->
  <circle cx="280" cy="62" r="7" fill="#1a1a1a"/>
  <text x="296" y="58" text-anchor="start" font-size="13" fill="#1a1a1a" font-weight="bold">Nature</text>
  <text x="296" y="73" text-anchor="start" font-size="11" fill="#1a1a1a">draws Player 2's type from the common prior</text>

  <!-- Branches from Nature to the two Player-1 nodes -->
  <line x1="280" y1="69" x2="165" y2="152" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="280" y1="69" x2="395" y2="152" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="200" y="108" text-anchor="middle" font-size="12" fill="#1a1a1a">type c  (prob 1/2)</text>
  <text x="360" y="108" text-anchor="middle" font-size="12" fill="#1a1a1a">type m  (prob 1/2)</text>

  <!-- Player 1's information set: dashed box grouping both P1 nodes -->
  <rect x="120" y="135" width="320" height="38" rx="16" fill="none" stroke="#1f5fa8" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="165" cy="154" r="6" fill="#1a1a1a"/>
  <circle cx="395" cy="154" r="6" fill="#1a1a1a"/>
  <text x="147" y="150" text-anchor="middle" font-size="12" fill="#1f5fa8" font-weight="bold">1</text>
  <text x="413" y="150" text-anchor="middle" font-size="12" fill="#1f5fa8" font-weight="bold">1</text>
  <text x="280" y="192" text-anchor="middle" font-size="11" fill="#1f5fa8">Player 1's information set — she cannot tell c from m, so she plays one action</text>

  <!-- Player 1 action branches down to Player 2 nodes -->
  <line x1="165" y1="160" x2="105" y2="262" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="165" y1="160" x2="225" y2="262" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="395" y1="160" x2="335" y2="262" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="395" y1="160" x2="455" y2="262" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="122" y="216" text-anchor="middle" font-size="11" fill="#1a1a1a">O</text>
  <text x="208" y="216" text-anchor="middle" font-size="11" fill="#1a1a1a">F</text>
  <text x="352" y="216" text-anchor="middle" font-size="11" fill="#1a1a1a">O</text>
  <text x="438" y="216" text-anchor="middle" font-size="11" fill="#1a1a1a">F</text>

  <!-- Player 2 nodes: solid, one info set each (P2 knows its type) -->
  <circle cx="105" cy="266" r="6" fill="none" stroke="#c0392b" stroke-width="2"/>
  <circle cx="225" cy="266" r="6" fill="none" stroke="#c0392b" stroke-width="2"/>
  <circle cx="335" cy="266" r="6" fill="none" stroke="#c0392b" stroke-width="2"/>
  <circle cx="455" cy="266" r="6" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="165" y="300" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">Player 2 knows: type c</text>
  <text x="165" y="316" text-anchor="middle" font-size="11" fill="#c0392b">(each node its own info set — picks O or F)</text>
  <text x="395" y="300" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">Player 2 knows: type m</text>
  <text x="395" y="316" text-anchor="middle" font-size="11" fill="#c0392b">(each node its own info set — picks O or F)</text>

  <!-- Strategy summary panel -->
  <line x1="40" y1="352" x2="520" y2="352" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="280" y="376" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="bold">A strategy is a plan for every type you might be:</text>
  <text x="280" y="396" text-anchor="middle" font-size="12" fill="#1a1a1a">Player 1: one action (she has a single type)   ·   Player 2: an action for c AND an action for m</text>
  <text x="280" y="420" text-anchor="middle" font-size="12" fill="#1a1a1a">Bayes–Nash equilibrium: every type best-responds in expectation over its belief about the other's type.</text>
  <text x="280" y="444" text-anchor="middle" font-size="11" fill="#1a1a1a">(General Harsanyi: Nature draws a type for every player at once; each sees only its own coordinate.)</text>
</svg>
