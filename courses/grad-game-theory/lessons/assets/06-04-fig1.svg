<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>

  <!-- title -->
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Replicator phase line: Hawk-Dove (V=2, C=6)</text>
  <text x="320" y="48" text-anchor="middle" font-size="12.5" fill="#555555">horizontal axis = p, the fraction of Hawks in the population</text>

  <!-- growth-rate curve region: zero-line at y=110 -->
  <line x1="80" y1="110" x2="560" y2="110" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="596" y="114" text-anchor="middle" font-size="11.5" fill="#888888">dp/dt = 0</text>

  <!-- growth-rate curve dp/dt = p(1-p)(1-3p) -->
  <polyline fill="none" stroke="#2a6fb0" stroke-width="2.5"
    points="80,110 128,98.7 176,98.5 224,106.2 240,110 272,118.6 320,132.5 368,144.6 416,151.6 464,150.3 512,137.5 560,110"/>
  <text x="150" y="82" text-anchor="middle" font-size="12.5" fill="#2a6fb0" font-weight="bold">dp/dt &gt; 0 (Hawks rare, invade)</text>
  <text x="452" y="176" text-anchor="middle" font-size="12.5" fill="#2a6fb0" font-weight="bold">dp/dt &lt; 0 (Hawks common, retreat)</text>

  <!-- phase line -->
  <line x1="80" y1="240" x2="560" y2="240" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- ticks -->
  <line x1="80" y1="234" x2="80" y2="246" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="240" y1="234" x2="240" y2="246" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="560" y1="234" x2="560" y2="246" stroke="#1a1a1a" stroke-width="2"/>

  <!-- flow arrows: toward p*=1/3 from both sides -->
  <polygon points="150,240 138,234 138,246" fill="#1f7a4d"/>
  <line x1="100" y1="240" x2="150" y2="240" stroke="#1f7a4d" stroke-width="2.5"/>
  <polygon points="330,240 342,234 342,246" fill="#c0392b"/>
  <line x1="330" y1="240" x2="440" y2="240" stroke="#c0392b" stroke-width="2.5"/>

  <!-- rest points -->
  <circle cx="80" cy="240" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="560" cy="240" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="240" cy="240" r="8" fill="#1a1a1a"/>

  <!-- rest-point labels -->
  <text x="80" y="272" text-anchor="middle" font-size="13" fill="#1a1a1a">p = 0</text>
  <text x="80" y="288" text-anchor="middle" font-size="11.5" fill="#888888">all Doves</text>
  <text x="80" y="303" text-anchor="middle" font-size="11.5" fill="#888888">(unstable)</text>

  <text x="560" y="272" text-anchor="middle" font-size="13" fill="#1a1a1a">p = 1</text>
  <text x="560" y="288" text-anchor="middle" font-size="11.5" fill="#888888">all Hawks</text>
  <text x="560" y="303" text-anchor="middle" font-size="11.5" fill="#888888">(unstable)</text>

  <text x="240" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">p* = V/C = 1/3</text>
  <text x="240" y="288" text-anchor="middle" font-size="11.5" fill="#1f7a4d" font-weight="bold">ESS: stable polymorphism</text>
  <text x="240" y="303" text-anchor="middle" font-size="11.5" fill="#1f7a4d">flow converges from both sides</text>

  <!-- bottom caption -->
  <text x="320" y="338" text-anchor="middle" font-size="12" fill="#555555">A single interior rest point attracts every starting mix: the population self-tunes to 1/3 Hawks.</text>
</svg>
