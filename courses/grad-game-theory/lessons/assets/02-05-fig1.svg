<svg viewBox="0 0 480 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="480" height="430" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#1f5fa8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="240" y="24" text-anchor="middle" font-size="15" fill="#1a1a1a" font-weight="bold">Chicken: the correlated-equilibrium payoff beats the mixed Nash</text>

  <!-- Axes: x = u1 in [0,8] mapped 70..370 ; y = u2 in [0,8] mapped 340..40 -->
  <line x1="70" y1="340" x2="370" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="70" y1="340" x2="70" y2="40" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- x ticks at u1 = 2,4,6,8 -->
  <line x1="145" y1="340" x2="145" y2="345" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="220" y1="340" x2="220" y2="345" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="295" y1="340" x2="295" y2="345" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="370" y1="340" x2="370" y2="345" stroke="#1a1a1a" stroke-width="1"/>
  <text x="145" y="358" text-anchor="middle" font-size="11" fill="#1a1a1a">2</text>
  <text x="220" y="358" text-anchor="middle" font-size="11" fill="#1a1a1a">4</text>
  <text x="295" y="358" text-anchor="middle" font-size="11" fill="#1a1a1a">6</text>
  <text x="370" y="358" text-anchor="middle" font-size="11" fill="#1a1a1a">8</text>
  <text x="70"  y="358" text-anchor="middle" font-size="11" fill="#1a1a1a">0</text>
  <text x="220" y="378" text-anchor="middle" font-size="13" fill="#1a1a1a">u1  (player 1 payoff)</text>

  <!-- y ticks at u2 = 2,4,6,8 -->
  <line x1="65" y1="265" x2="70" y2="265" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="65" y1="190" x2="70" y2="190" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="65" y1="115" x2="70" y2="115" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="65" y1="40"  x2="70" y2="40"  stroke="#1a1a1a" stroke-width="1"/>
  <text x="60" y="269" text-anchor="end" font-size="11" fill="#1a1a1a">2</text>
  <text x="60" y="194" text-anchor="end" font-size="11" fill="#1a1a1a">4</text>
  <text x="60" y="119" text-anchor="end" font-size="11" fill="#1a1a1a">6</text>
  <text x="60" y="44"  text-anchor="end" font-size="11" fill="#1a1a1a">8</text>
  <text x="24" y="190" text-anchor="middle" font-size="13" fill="#1a1a1a" transform="rotate(-90 24 190)">u2  (player 2 payoff)</text>

  <!-- Feasible payoff region: convex hull of (0,0),(7,2),(6,6),(2,7) -->
  <polygon points="70,340 332,265 295,115 145,78" fill="#e7f0e7" stroke="#6a9a6a" stroke-width="1"/>

  <!-- Pareto frontier (bold): (7,2)-(6,6)-(2,7) -->
  <path d="M332,265 L295,115 L145,78" fill="none" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Diagonal u1 = u2 -->
  <line x1="70" y1="340" x2="370" y2="40" stroke="#999999" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Improvement arrow: mixed NE -> CE -->
  <line x1="245" y1="165" x2="255" y2="155" stroke="#1f5fa8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Points -->
  <!-- pure NE (7,2) -->
  <circle cx="332" cy="265" r="5" fill="#1a1a1a"/>
  <text x="337" y="269" text-anchor="start" font-size="11" fill="#1a1a1a">pure NE (7,2)</text>
  <!-- pure NE (2,7) -->
  <circle cx="145" cy="78" r="5" fill="#1a1a1a"/>
  <text x="152" y="74" text-anchor="start" font-size="11" fill="#1a1a1a">pure NE (2,7)</text>
  <!-- cooperative (c,c) = (6,6) -->
  <circle cx="295" cy="115" r="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="301" y="112" text-anchor="start" font-size="11" fill="#1a1a1a">(c,c) = (6,6)</text>
  <!-- mixed NE (4.67,4.67) -->
  <circle cx="245" cy="165" r="5" fill="#c0392b"/>
  <text x="240" y="184" text-anchor="end" font-size="11" fill="#c0392b">mixed NE (4.67, 4.67)</text>
  <!-- CE (5,5) -->
  <circle cx="255" cy="152" r="5" fill="#1f5fa8"/>
  <text x="262" y="142" text-anchor="start" font-size="11" fill="#1f5fa8" font-weight="bold">CE (5, 5)</text>

  <!-- Caption -->
  <text x="240" y="404" text-anchor="middle" font-size="11" fill="#1a1a1a">Private recommendations reach (5,5): northeast of the mixed Nash, off the Nash set entirely.</text>
  <text x="240" y="420" text-anchor="middle" font-size="11" fill="#1a1a1a">Shaded = feasible payoffs; bold edge = Pareto frontier; dashed = the fair diagonal u1 = u2.</text>
</svg>
