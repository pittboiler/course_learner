<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>

  <text x="360" y="28" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Concave u = risk aversion: the chord (expected utility) lies below the curve</text>
  <text x="360" y="48" font-size="13" fill="#1a1a1a" text-anchor="middle">50–50 gamble on x=1 or x=9, with u(x)=&#8730;x</text>

  <!-- axes -->
  <line x1="70" y1="360" x2="690" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="70" y1="360" x2="70" y2="60" stroke="#1a1a1a" stroke-width="2"/>
  <text x="695" y="365" font-size="14" fill="#1a1a1a">x</text>
  <text x="52" y="72" font-size="14" fill="#1a1a1a">u</text>

  <!-- utility curve u = sqrt(x), x in [0,10] -->
  <polyline points="70,360 131,274.3 192,238.8 253,211.5 314,188.6 375,168.3 436,150.1 497,133.2 558,117.6 619,102.9 680,89"
            fill="none" stroke="#1a1a1a" stroke-width="2.6"/>
  <text x="628" y="96" font-size="14" font-style="italic" fill="#1a1a1a">u(x)</text>

  <!-- chord from (x1,u1) to (x2,u2): the expected utility of the gamble -->
  <line x1="131" y1="274.3" x2="619" y2="102.9" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="6 4"/>

  <!-- endpoint dots -->
  <circle cx="131" cy="274.3" r="4" fill="#1a1a1a"/>
  <circle cx="619" cy="102.9" r="4" fill="#1a1a1a"/>

  <!-- guide lines down to x-axis for x1, x2 -->
  <line x1="131" y1="274.3" x2="131" y2="360" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="619" y1="102.9" x2="619" y2="360" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="127" y="378" font-size="13" fill="#1a1a1a">x&#8321;=1</text>
  <text x="615" y="378" font-size="13" fill="#1a1a1a">x&#8322;=9</text>

  <!-- E[x] = 5: vertical line hitting chord (E[u]) and curve (u(E[x])) -->
  <line x1="375" y1="360" x2="375" y2="168.3" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="368" y="378" font-size="13" fill="#1a1a1a">E[x]=5</text>

  <!-- point on chord: E[u] = 2 -->
  <circle cx="375" cy="188.6" r="4" fill="#1a1a1a"/>
  <!-- point on curve: u(E[x]) = sqrt(5) -->
  <circle cx="375" cy="168.3" r="4" fill="#1a1a1a"/>

  <!-- Jensen gap bracket between the two points -->
  <text x="388" y="182" font-size="13" fill="#1a1a1a">u(E[x])=&#8730;5&#8776;2.24</text>
  <text x="388" y="203" font-size="13" fill="#1a1a1a">E[u(x)]=2</text>

  <!-- horizontal line at E[u] level from CE up-point to E[x] -->
  <line x1="314" y1="188.6" x2="375" y2="188.6" stroke="#1a1a1a" stroke-width="1.4"/>

  <!-- certainty equivalent CE = 4: drop from curve at u=2 -->
  <circle cx="314" cy="188.6" r="4" fill="#1a1a1a"/>
  <line x1="314" y1="188.6" x2="314" y2="360" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="300" y="378" font-size="13" fill="#1a1a1a">CE=4</text>

  <!-- risk premium bracket on axis between CE and E[x] -->
  <line x1="314" y1="340" x2="375" y2="340" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="314" y1="335" x2="314" y2="345" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="375" y1="335" x2="375" y2="345" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="344" y="332" font-size="12" fill="#1a1a1a" text-anchor="middle">&#960;=1</text>

  <text x="470" y="300" font-size="13" fill="#1a1a1a">Risk premium &#960; = E[x] &#8722; CE:</text>
  <text x="470" y="320" font-size="13" fill="#1a1a1a">what you'd pay to dodge the risk.</text>
</svg>
