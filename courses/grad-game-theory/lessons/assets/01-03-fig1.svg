<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>

  <!-- ============ LEFT PANEL: Brouwer (function) ============ -->
  <text x="180" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Brouwer: f : [0,1] &#8594; [0,1]</text>

  <!-- unit square -->
  <rect x="70" y="60" width="240" height="240" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- axis labels -->
  <text x="66" y="312" font-size="13" fill="#1a1a1a" text-anchor="end">0</text>
  <text x="310" y="318" font-size="13" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="62" y="66" font-size="13" fill="#1a1a1a" text-anchor="end">1</text>
  <text x="190" y="336" font-size="13" fill="#1a1a1a" text-anchor="middle">x</text>

  <!-- diagonal y = x (bottom-left to top-right of square) -->
  <line x1="70" y1="300" x2="310" y2="60" stroke="#888888" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="300" y="78" font-size="13" fill="#888888" text-anchor="end">y = x</text>

  <!-- curve f: starts above diagonal at left (high), ends below at right -->
  <!-- left edge x=70: f(0) high => y=90 (above diagonal which is y=300 there) -->
  <!-- right edge x=310: f(1) low => y=250 (below diagonal which is y=60 there) -->
  <path d="M 70 100 C 150 70, 170 250, 310 240" fill="none" stroke="#1a1a1a" stroke-width="2.6"/>
  <text x="96" y="118" font-size="13" fill="#1a1a1a">f</text>

  <!-- fixed point: intersection of curve and diagonal (approx) -->
  <circle cx="188" cy="182" r="5.5" fill="#1a1a1a"/>
  <line x1="188" y1="182" x2="188" y2="300" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="198" y="176" font-size="13.5" fill="#1a1a1a">f(x*) = x*</text>
  <text x="188" y="290" font-size="12" fill="#1a1a1a" text-anchor="middle"></text>

  <!-- caption -->
  <text x="190" y="362" font-size="12.5" fill="#1a1a1a" text-anchor="middle">continuous curve starts above, ends below &#8594; must cross</text>

  <!-- ============ RIGHT PANEL: Kakutani (correspondence) ============ -->
  <text x="575" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Kakutani: &#966; : [0,1] &#8649; [0,1]</text>

  <rect x="455" y="60" width="240" height="240" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="451" y="312" font-size="13" fill="#1a1a1a" text-anchor="end">0</text>
  <text x="695" y="318" font-size="13" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="447" y="66" font-size="13" fill="#1a1a1a" text-anchor="end">1</text>
  <text x="575" y="336" font-size="13" fill="#1a1a1a" text-anchor="middle">x</text>

  <!-- diagonal -->
  <line x1="455" y1="300" x2="695" y2="60" stroke="#888888" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="685" y="78" font-size="13" fill="#888888" text-anchor="end">y = x</text>

  <!-- "thick" correspondence graph: lower branch, vertical jump segment, upper branch -->
  <!-- lower branch (left of switch): a band near bottom -->
  <path d="M 455 262 L 560 250 L 560 232 L 455 244 Z" fill="#1a1a1a" fill-opacity="0.16" stroke="#1a1a1a" stroke-width="1.4"/>
  <!-- vertical connecting segment at switch x (the convex value that bridges) -->
  <rect x="560" y="120" width="16" height="130" fill="#1a1a1a" fill-opacity="0.28" stroke="#1a1a1a" stroke-width="1.4"/>
  <!-- upper branch (right of switch): band near top -->
  <path d="M 576 130 L 695 118 L 695 100 L 576 112 Z" fill="#1a1a1a" fill-opacity="0.16" stroke="#1a1a1a" stroke-width="1.4"/>

  <!-- fixed point where the thick vertical segment crosses the diagonal -->
  <!-- diagonal at x=568: fraction (568-455)/240=0.47 => y = 300 - 0.47*240 = 187 -->
  <circle cx="568" cy="187" r="5.5" fill="#1a1a1a"/>
  <text x="584" y="182" font-size="13.5" fill="#1a1a1a">x* &#8712; &#966;(x*)</text>
  <text x="530" y="150" font-size="12" fill="#1a1a1a" text-anchor="end">convex</text>
  <text x="530" y="164" font-size="12" fill="#1a1a1a" text-anchor="end">value</text>

  <text x="575" y="362" font-size="12.5" fill="#1a1a1a" text-anchor="middle">thick graph (convex values, closed) still crosses the diagonal</text>
</svg>
