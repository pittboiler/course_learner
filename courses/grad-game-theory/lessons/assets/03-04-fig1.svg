<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="470" fill="#ffffff"/>

  <!-- title -->
  <text x="360" y="26" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Everything the folk theorem can sustain</text>
  <text x="360" y="46" font-size="13" fill="#1a1a1a" text-anchor="middle">Feasible set = convex hull of stage payoffs; shaded = feasible AND above both minmax lines</text>

  <!-- axes: origin (90,400), scale 66 px per unit -->
  <line x1="90" y1="400" x2="480" y2="400" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="90" y1="400" x2="90" y2="55" stroke="#1a1a1a" stroke-width="2"/>
  <text x="486" y="405" font-size="13" fill="#1a1a1a">u₁</text>
  <text x="80" y="66" font-size="13" fill="#1a1a1a">u₂</text>

  <!-- x ticks -->
  <line x1="156" y1="400" x2="156" y2="406" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="152" y="420" font-size="11" fill="#1a1a1a">1</text>
  <line x1="222" y1="400" x2="222" y2="406" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="218" y="420" font-size="11" fill="#1a1a1a">2</text>
  <line x1="288" y1="400" x2="288" y2="406" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="284" y="420" font-size="11" fill="#1a1a1a">3</text>
  <line x1="354" y1="400" x2="354" y2="406" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="350" y="420" font-size="11" fill="#1a1a1a">4</text>
  <line x1="420" y1="400" x2="420" y2="406" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="416" y="420" font-size="11" fill="#1a1a1a">5</text>

  <!-- y ticks -->
  <line x1="84" y1="334" x2="90" y2="334" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="72" y="338" font-size="11" fill="#1a1a1a">1</text>
  <line x1="84" y1="268" x2="90" y2="268" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="72" y="272" font-size="11" fill="#1a1a1a">2</text>
  <line x1="84" y1="202" x2="90" y2="202" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="72" y="206" font-size="11" fill="#1a1a1a">3</text>
  <line x1="84" y1="136" x2="90" y2="136" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="72" y="140" font-size="11" fill="#1a1a1a">4</text>
  <line x1="84" y1="70" x2="90" y2="70" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="72" y="74" font-size="11" fill="#1a1a1a">5</text>

  <!-- feasible hull: B(0,5)=90,70  A(3,3)=288,202  C(5,0)=420,400  D(1,1)=156,334 -->
  <polygon points="90,70 288,202 420,400 156,334" fill="#1a1a1a" fill-opacity="0.05" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- shaded feasible + individually-rational region -->
  <polygon points="156,114 288,202 376,334 156,334" fill="#1a1a1a" fill-opacity="0.20" stroke="#1a1a1a" stroke-width="1"/>

  <!-- minmax lines -->
  <line x1="156" y1="400" x2="156" y2="70" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="160" y="86" font-size="11" fill="#1a1a1a">u₁ = minmax = 1</text>
  <line x1="90" y1="334" x2="440" y2="334" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="330" y="330" font-size="11" fill="#1a1a1a">u₂ = minmax = 1</text>

  <!-- stage payoff points -->
  <circle cx="90" cy="70" r="4" fill="#1a1a1a"/>
  <text x="98" y="66" font-size="12" fill="#1a1a1a">(0,5) = (C,D)</text>
  <circle cx="420" cy="400" r="4" fill="#1a1a1a"/>
  <text x="360" y="393" font-size="12" fill="#1a1a1a">(5,0) = (D,C)</text>

  <!-- cooperative point A -->
  <circle cx="288" cy="202" r="5" fill="#1a1a1a"/>
  <text x="296" y="198" font-size="12" font-weight="bold" fill="#1a1a1a">(3,3) cooperate</text>

  <!-- stage NE = minmax point D -->
  <circle cx="156" cy="334" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="163" y="352" font-size="12" fill="#1a1a1a">(1,1) stage NE = minmax</text>

  <!-- label the shaded region -->
  <text x="243" y="290" font-size="12" font-style="italic" fill="#1a1a1a" text-anchor="middle">sustainable</text>
  <text x="243" y="305" font-size="12" font-style="italic" fill="#1a1a1a" text-anchor="middle">payoffs</text>

  <!-- footer -->
  <text x="360" y="452" font-size="11.5" fill="#1a1a1a" text-anchor="middle">For δ near 1, every point in the shaded set is the average payoff of some equilibrium.</text>
</svg>
