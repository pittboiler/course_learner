  <text x="76.0" y="85.0" fill="#8a8a8a" font-size="11">S&#x27; -&gt; . E</text>
  <text x="76.0" y="100.0" fill="#8a8a8a" font-size="11">E -&gt; . E + T</text>
  <text x="76.0" y="115.0" fill="#8a8a8a" font-size="11">E -&gt; . T</text>
  <text x="76.0" y="130.0" fill="#8a8a8a" font-size="11">T -&gt; . n</text>
