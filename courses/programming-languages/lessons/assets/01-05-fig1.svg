<svg viewBox="0 0 660 370" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">LR(0) item automaton for E -&gt; E + T | T,  T -&gt; n</text>
