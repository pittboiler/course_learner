<svg viewBox="0 0 660 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">One algorithm, four knobs</text>
  <text x="70.0" y="72.0" fill="#4a90d9" font-size="12.5" font-weight="bold">direction</text>
  <text x="190.0" y="72.0" fill="#8a8a8a" font-size="11.5">forward (what reached here)  /  backward (what is needed later)</text>
  <text x="70.0" y="100.0" fill="#4a90d9" font-size="12.5" font-weight="bold">meet</text>
  <text x="190.0" y="100.0" fill="#8a8a8a" font-size="11.5">union = MAY (some path)  /  intersection = MUST (every path)</text>
  <text x="70.0" y="128.0" fill="#4a90d9" font-size="12.5" font-weight="bold">transfer</text>
  <text x="190.0" y="128.0" fill="#8a8a8a" font-size="11.5">OUT = gen u (IN - kill)</text>
  <text x="70.0" y="156.0" fill="#4a90d9" font-size="12.5" font-weight="bold">boundary</text>
  <text x="190.0" y="156.0" fill="#8a8a8a" font-size="11.5">the value at entry (forward) or exit (backward)</text>
  <line x1="60.0" y1="182.0" x2="600.0" y2="182.0" stroke="#8a8a8a" stroke-width="1.0" stroke-dasharray="4,4"/>
  <text x="90.0" y="214.0" fill="#e0645c" font-size="12.5">reaching definitions</text>
  <text x="300.0" y="214.0" fill="#8a8a8a" font-size="12">forward</text>
  <text x="420.0" y="214.0" fill="#8a8a8a" font-size="12">may (union)</text>
  <text x="90.0" y="242.0" fill="#e0645c" font-size="12.5">available expressions</text>
  <text x="300.0" y="242.0" fill="#8a8a8a" font-size="12">forward</text>
  <text x="420.0" y="242.0" fill="#8a8a8a" font-size="12">must (intersection)</text>
  <text x="90.0" y="270.0" fill="#e0645c" font-size="12.5">live variables</text>
  <text x="300.0" y="270.0" fill="#8a8a8a" font-size="12">backward</text>
  <text x="420.0" y="270.0" fill="#8a8a8a" font-size="12">may (union)</text>
  <text x="90.0" y="298.0" fill="#e0645c" font-size="12.5">very busy expressions</text>
  <text x="300.0" y="298.0" fill="#8a8a8a" font-size="12">backward</text>
  <text x="420.0" y="298.0" fill="#8a8a8a" font-size="12">must (intersection)</text>
  <text x="70.0" y="336.0" fill="#8a8a8a" font-size="11.5" font-style="italic">All four are the same loop. Termination: monotone transfer on a finite lattice.</text>
</svg>
