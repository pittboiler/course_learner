<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Progress and preservation: a well-typed term can never reach STUCK</text>
  <circle cx="90.0" cy="120.0" r="22" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="90.0" y="124.9" fill="#4a90d9" text-anchor="middle">t0</text>
  <text x="90.0" y="166.0" fill="#4a90d9" font-size="11" text-anchor="middle">well-typed</text>
  <circle cx="230.0" cy="120.0" r="22" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="230.0" y="124.9" fill="#4a90d9" text-anchor="middle">t1</text>
  <text x="230.0" y="166.0" fill="#4a90d9" font-size="11" text-anchor="middle">well-typed</text>
  <circle cx="370.0" cy="120.0" r="22" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="370.0" y="124.9" fill="#4a90d9" text-anchor="middle">t2</text>
  <text x="370.0" y="166.0" fill="#4a90d9" font-size="11" text-anchor="middle">well-typed</text>
  <circle cx="510.0" cy="120.0" r="22" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="510.0" y="124.9" fill="#4a90d9" text-anchor="middle">t3</text>
  <text x="510.0" y="166.0" fill="#4a90d9" font-size="11" text-anchor="middle">well-typed</text>
  <line x1="112.0" y1="120.0" x2="208.0" y2="120.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="160.0" y="108.0" fill="#8a8a8a" font-size="11" text-anchor="middle">step</text>
  <line x1="252.0" y1="120.0" x2="348.0" y2="120.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="300.0" y="108.0" fill="#8a8a8a" font-size="11" text-anchor="middle">step</text>
  <line x1="392.0" y1="120.0" x2="488.0" y2="120.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="440.0" y="108.0" fill="#8a8a8a" font-size="11" text-anchor="middle">step</text>
  <text x="600.0" y="125.0" fill="#e0645c" font-size="13">... value</text>
  <line x1="545.0" y1="120.0" x2="585.0" y2="120.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="585.0,120.0 574.0,115.0 574.0,125.0" fill="#8a8a8a"/>
  <rect x="300.0" y="206.0" width="150.0" height="44.0" fill="none" stroke="#e0645c" stroke-width="1.6" stroke-dasharray="5,4" rx="6"/>
  <text x="375.0" y="233.0" fill="#e0645c" font-size="13" text-anchor="middle">STUCK</text>
  <line x1="330.0" y1="188.0" x2="360.0" y2="212.0" stroke="#e0645c" stroke-width="1.6"/>
  <line x1="360.0" y1="188.0" x2="330.0" y2="212.0" stroke="#e0645c" stroke-width="1.6"/>
  <text x="70.0" y="268.0" fill="#8a8a8a" font-size="11.5">PROGRESS: a well-typed term is a value or can step (so it is not stuck now).</text>
  <text x="70.0" y="288.0" fill="#8a8a8a" font-size="11.5">PRESERVATION: the step lands on a well-typed term (so the argument repeats).</text>
</svg>
