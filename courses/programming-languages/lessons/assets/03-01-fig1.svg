<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Binding structure of  \x. \y. x (z y)</text>
  <text x="90.0" y="110.0" fill="#4a90d9" font-size="20">\x.</text>
  <text x="170.0" y="110.0" fill="#4a90d9" font-size="20">\y.</text>
  <text x="255.0" y="110.0" fill="#8a8a8a" font-size="20">x</text>
  <text x="300.0" y="110.0" fill="#8a8a8a" font-size="20">(</text>
  <text x="335.0" y="110.0" fill="#e0645c" font-size="20">z</text>
  <text x="400.0" y="110.0" fill="#8a8a8a" font-size="20">y</text>
  <text x="440.0" y="110.0" fill="#8a8a8a" font-size="20">)</text>
  <path d="M 100 96 C 110 50, 250 50, 260 96" fill="none" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="178.0" y="48.0" fill="#4a90d9" font-size="11.5" text-anchor="middle">binds</text>
  <path d="M 182 96 C 200 30, 390 30, 404 96" fill="none" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="295.0" y="28.0" fill="#4a90d9" font-size="11.5" text-anchor="middle">binds</text>
  <line x1="340.0" y1="142.0" x2="340.0" y2="124.0" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="340.0,124.0 335.0,135.0 345.0,135.0" fill="#e0645c"/>
  <text x="340.0" y="162.0" fill="#e0645c" font-size="12.5" text-anchor="middle">free</text>
  <text x="70.0" y="212.0" fill="#8a8a8a" font-size="12.5">FV = { z }.  The names x and y are internal: renaming either one</text>
  <text x="70.0" y="232.0" fill="#8a8a8a" font-size="12.5">changes nothing, which is what alpha-equivalence says. Renaming z</text>
  <text x="70.0" y="252.0" fill="#8a8a8a" font-size="12.5">changes the term, because z refers to something outside.</text>
  <text x="70.0" y="286.0" fill="#4a90d9" font-size="12.5">\a. \b. a (z b)  is the same term;  \x. \y. x (w y)  is not.</text>
</svg>
