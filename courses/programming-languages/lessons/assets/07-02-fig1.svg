<svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Dominance and where a phi-function goes</text>
  <circle cx="150.0" cy="90.0" r="24" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="150.0" y="94.9" fill="#4a90d9" text-anchor="middle">B0</text>
  <circle cx="150.0" cy="175.0" r="24" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="150.0" y="179.9" fill="#e0645c" text-anchor="middle">B1</text>
  <circle cx="150.0" cy="265.0" r="24" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="150.0" y="269.9" fill="#4a90d9" text-anchor="middle">B2</text>
  <circle cx="360.0" cy="175.0" r="24" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="360.0" y="179.9" fill="#4a90d9" text-anchor="middle">B3</text>
  <line x1="150.0" y1="114.0" x2="150.0" y2="151.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="150.0" y1="199.0" x2="150.0" y2="241.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M 174 258 C 236 240, 236 120, 174 112" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="246.0" y="190.0" fill="#8a8a8a" font-size="11">back edge</text>
  <line x1="174.0" y1="175.0" x2="336.0" y2="175.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="430.0" y="120.0" fill="#8a8a8a" font-size="12">dom(B1) = {B0, B1}</text>
  <text x="430.0" y="144.0" fill="#8a8a8a" font-size="12">idom(B1) = B0</text>
  <text x="430.0" y="168.0" fill="#e0645c" font-size="12">DF(B1) = {B1}</text>
  <text x="430.0" y="192.0" fill="#e0645c" font-size="12">DF(B2) = {B1}</text>
  <text x="430.0" y="216.0" fill="#8a8a8a" font-size="12">DF(B3) = {}</text>
  <text x="70.0" y="306.0" fill="#8a8a8a" font-size="11.5">i is defined in B0 and B2, and DF(B0) u DF(B2) = {B1}, so exactly one phi is needed:</text>
  <text x="90.0" y="330.0" fill="#4a90d9" font-size="13">B1:   i2  =  phi(i0 from B0,  i1 from B2)</text>
  <text x="70.0" y="354.0" fill="#e0645c" font-size="11.5" font-style="italic">A loop header is in its OWN dominance frontier -- that is what the back edge buys.</text>
</svg>
