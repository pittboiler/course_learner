<svg viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Small-step: one redex at a time, leftmost-innermost</text>
  <text x="70.0" y="78.0" fill="#4a90d9">(x + 3) * (4 - 1)</text>
  <line x1="285.0" y1="73.0" x2="320.0" y2="73.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="320.0,73.0 309.0,68.0 309.0,78.0" fill="#8a8a8a"/>
  <text x="330.0" y="78.0" fill="#8a8a8a" font-size="11.5">look up x</text>
  <text x="70.0" y="108.0" fill="#4a90d9">(2 + 3) * (4 - 1)</text>
  <line x1="285.0" y1="103.0" x2="320.0" y2="103.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="320.0,103.0 309.0,98.0 309.0,108.0" fill="#8a8a8a"/>
  <text x="330.0" y="108.0" fill="#8a8a8a" font-size="11.5">add</text>
  <text x="70.0" y="138.0" fill="#4a90d9">5 * (4 - 1)</text>
  <line x1="285.0" y1="133.0" x2="320.0" y2="133.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="320.0,133.0 309.0,128.0 309.0,138.0" fill="#8a8a8a"/>
  <text x="330.0" y="138.0" fill="#8a8a8a" font-size="11.5">subtract</text>
  <text x="70.0" y="168.0" fill="#4a90d9">5 * 3</text>
  <line x1="285.0" y1="163.0" x2="320.0" y2="163.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="320.0,163.0 309.0,158.0 309.0,168.0" fill="#8a8a8a"/>
  <text x="330.0" y="168.0" fill="#8a8a8a" font-size="11.5">multiply</text>
  <text x="70.0" y="198.0" fill="#e0645c">15</text>
  <line x1="60.0" y1="218.0" x2="600.0" y2="218.0" stroke="#8a8a8a" stroke-width="1.0" stroke-dasharray="4,4"/>
  <text x="70.0" y="244.0" fill="#8a8a8a" font-size="12">The step that licenses line 0 -&gt; line 1, as an inference:</text>
  <line x1="90.0" y1="262.0" x2="236.0" y2="262.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="95.0" y="257.0" fill="#8a8a8a" font-size="12">s(x) = 2</text>
  <text x="90.0" y="280.0" fill="#e0645c" font-size="12">&lt;x, s&gt;  -&gt;  &lt;2, s&gt;</text>
  <text x="260.0" y="270.0" fill="#8a8a8a" font-size="11">(VAR)</text>
</svg>
