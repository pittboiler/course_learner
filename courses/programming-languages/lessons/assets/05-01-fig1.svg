<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Every data type is built from two shapes</text>
  <text x="70.0" y="74.0" fill="#4a90d9" font-size="13" font-weight="bold">PRODUCT  (and)</text>
  <text x="70.0" y="100.0" fill="#8a8a8a" font-size="12.5">Point = { x : Nat,  y : Nat }</text>
  <text x="70.0" y="122.0" fill="#8a8a8a" font-size="11.5" font-style="italic">you have an x AND a y</text>
  <text x="70.0" y="144.0" fill="#e0645c" font-size="11.5">cardinality:  |Nat| x |Nat|</text>
  <text x="380.0" y="74.0" fill="#4a90d9" font-size="13" font-weight="bold">SUM  (or)</text>
  <text x="380.0" y="100.0" fill="#8a8a8a" font-size="12.5">Shape = Circle Nat | Rect Nat Nat</text>
  <text x="380.0" y="122.0" fill="#8a8a8a" font-size="11.5" font-style="italic">you have a Circle OR a Rect</text>
  <text x="380.0" y="144.0" fill="#e0645c" font-size="11.5">cardinality:  |Nat| + |Nat|^2</text>
  <line x1="60.0" y1="176.0" x2="600.0" y2="176.0" stroke="#8a8a8a" stroke-width="1.0" stroke-dasharray="4,4"/>
  <text x="70.0" y="206.0" fill="#8a8a8a" font-size="12.5">Recursive sums give you everything else:</text>
  <text x="100.0" y="234.0" fill="#4a90d9" font-size="13">List a  =  Nil  |  Cons a (List a)</text>
  <text x="100.0" y="258.0" fill="#4a90d9" font-size="13">Tree a  =  Leaf  |  Node (Tree a) a (Tree a)</text>
  <text x="100.0" y="282.0" fill="#4a90d9" font-size="13">Option a  =  None  |  Some a</text>
  <text x="70.0" y="312.0" fill="#8a8a8a" font-size="11.5" font-style="italic">A sum forces the consumer to say what it does in every case: that is exhaustiveness.</text>
</svg>
