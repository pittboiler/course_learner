<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Mark and sweep on the boss heap: root A, live chain with a cycle</text>
  <circle cx="140.0" cy="120.0" r="22" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="140.0" y="124.9" fill="#4a90d9" text-anchor="middle">A</text>
  <circle cx="280.0" cy="120.0" r="22" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="280.0" y="124.9" fill="#4a90d9" text-anchor="middle">B</text>
  <circle cx="280.0" cy="210.0" r="22" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="280.0" y="214.9" fill="#4a90d9" text-anchor="middle">C</text>
  <circle cx="470.0" cy="120.0" r="22" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="470.0" y="124.9" fill="#e0645c" text-anchor="middle">D</text>
  <circle cx="470.0" cy="210.0" r="22" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="470.0" y="214.9" fill="#e0645c" text-anchor="middle">E</text>
  <circle cx="590.0" cy="165.0" r="22" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="590.0" y="169.9" fill="#e0645c" text-anchor="middle">F</text>
  <line x1="80.0" y1="120.0" x2="112.0" y2="120.0" stroke="#8a8a8a" stroke-width="1.6"/>
  <polygon points="112.0,120.0 101.0,115.0 101.0,125.0" fill="#8a8a8a"/>
  <text x="70.0" y="104.0" fill="#8a8a8a" font-size="11">root</text>
  <line x1="162.0" y1="120.0" x2="258.0" y2="120.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="280.0" y1="142.0" x2="280.0" y2="188.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="280.0" y1="188.0" x2="280.0" y2="142.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="470.0" y1="142.0" x2="470.0" y2="188.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="470.0" y1="188.0" x2="470.0" y2="142.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="200.0" y="264.0" fill="#4a90d9" font-size="12.5" text-anchor="middle">MARKED live: A, B, C</text>
  <text x="490.0" y="264.0" fill="#e0645c" font-size="12.5" text-anchor="middle">SWEPT: D, E, F</text>
  <text x="70.0" y="300.0" fill="#8a8a8a" font-size="11.5">The live set contains its own cycle (B and C) and tracing handles it: reachability,</text>
  <text x="70.0" y="322.0" fill="#8a8a8a" font-size="11.5">not counting, is the criterion. F has refcount 0 and is the only thing counting frees.</text>
</svg>
