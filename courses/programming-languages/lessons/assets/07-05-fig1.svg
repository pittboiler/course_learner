<svg viewBox="0 0 660 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">The sign domain: a finite lattice standing in for the integers</text>
  <circle cx="330.0" cy="84.0" r="20" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="330.0" y="88.9" fill="#e0645c" text-anchor="middle">T</text>
  <circle cx="180.0" cy="180.0" r="26" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="180.0" y="184.9" fill="#4a90d9" text-anchor="middle">neg</text>
  <circle cx="330.0" cy="180.0" r="26" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="330.0" y="184.9" fill="#4a90d9" text-anchor="middle">zero</text>
  <circle cx="480.0" cy="180.0" r="26" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="480.0" y="184.9" fill="#4a90d9" text-anchor="middle">pos</text>
  <circle cx="330.0" cy="276.0" r="20" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="330.0" y="280.9" fill="#e0645c" text-anchor="middle">_|_</text>
  <line x1="311.5" y1="95.9" x2="198.5" y2="168.1" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="198.5" y1="191.9" x2="311.5" y2="264.1" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="330.0" y1="106.0" x2="330.0" y2="158.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="330.0" y1="202.0" x2="330.0" y2="254.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="348.5" y1="95.9" x2="461.5" y2="168.1" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="461.5" y1="191.9" x2="348.5" y2="264.1" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="560.0" y="84.0" fill="#8a8a8a" font-size="11">could be anything</text>
  <text x="560.0" y="276.0" fill="#8a8a8a" font-size="11">unreachable</text>
  <text x="70.0" y="320.0" fill="#8a8a8a" font-size="11.5">Three values plus top and bottom: finite, so iteration must terminate. neg x neg = pos is</text>
  <text x="70.0" y="340.0" fill="#8a8a8a" font-size="11.5">exact; neg + pos = T is where precision is lost, and losing it upward is what keeps it sound.</text>
</svg>
