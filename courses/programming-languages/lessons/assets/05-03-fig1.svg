<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">An existential type is what a module hides</text>
  <rect x="90.0" y="70.0" width="240.0" height="160.0" fill="none" stroke="#4a90d9" stroke-width="1.6" rx="6"/>
  <text x="210.0" y="96.0" fill="#4a90d9" font-size="12" text-anchor="middle">inside the module</text>
  <text x="110.0" y="128.0" fill="#8a8a8a" font-size="12">type Counter = Nat</text>
  <text x="110.0" y="152.0" fill="#8a8a8a" font-size="12">new  = 0</text>
  <text x="110.0" y="176.0" fill="#8a8a8a" font-size="12">tick = \c. c + 1</text>
  <text x="110.0" y="200.0" fill="#8a8a8a" font-size="12">read = \c. c</text>
  <rect x="370.0" y="70.0" width="240.0" height="160.0" fill="none" stroke="#e0645c" stroke-width="1.6" stroke-dasharray="5,4" rx="6"/>
  <text x="490.0" y="96.0" fill="#e0645c" font-size="12" text-anchor="middle">what a client sees</text>
  <text x="390.0" y="128.0" fill="#8a8a8a" font-size="12">exists C.</text>
  <text x="405.0" y="152.0" fill="#8a8a8a" font-size="12">{ new  : C,</text>
  <text x="405.0" y="176.0" fill="#8a8a8a" font-size="12">tick : C -&gt; C,</text>
  <text x="405.0" y="200.0" fill="#8a8a8a" font-size="12">read : C -&gt; Nat }</text>
  <line x1="334.0" y1="150.0" x2="366.0" y2="150.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="366.0,150.0 355.0,145.0 355.0,155.0" fill="#8a8a8a"/>
  <text x="70.0" y="264.0" fill="#8a8a8a" font-size="12">The client knows a C exists and cannot learn that it is Nat -- so it cannot</text>
  <text x="70.0" y="284.0" fill="#8a8a8a" font-size="12">write  read 7,  and the implementer is free to change Nat to anything else.</text>
  <text x="70.0" y="312.0" fill="#4a90d9" font-size="12" font-style="italic">Abstraction stops being a convention and becomes a theorem.</text>
</svg>
