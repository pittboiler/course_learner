<svg viewBox="0 0 660 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Boss 7(a): four passes on five instructions</text>
  <text x="90.0" y="78.0" fill="#4a90d9" font-size="12" text-anchor="middle">lowered</text>
  <text x="230.0" y="78.0" fill="#4a90d9" font-size="12" text-anchor="middle">fold</text>
  <text x="370.0" y="78.0" fill="#4a90d9" font-size="12" text-anchor="middle">propagate</text>
  <text x="510.0" y="78.0" fill="#4a90d9" font-size="12" text-anchor="middle">DCE</text>
  <text x="90.0" y="112.0" fill="#8a8a8a" font-size="12" text-anchor="middle">t1 = 3 + 4</text>
  <text x="230.0" y="112.0" fill="#8a8a8a" font-size="12" text-anchor="middle">t1 = 7</text>
  <text x="370.0" y="112.0" fill="#8a8a8a" font-size="12" text-anchor="middle">t1 = 7</text>
  <text x="90.0" y="144.0" fill="#8a8a8a" font-size="12" text-anchor="middle">x = t1</text>
  <text x="230.0" y="144.0" fill="#8a8a8a" font-size="12" text-anchor="middle">x = t1</text>
  <text x="370.0" y="144.0" fill="#8a8a8a" font-size="12" text-anchor="middle">x = 7</text>
  <text x="90.0" y="176.0" fill="#8a8a8a" font-size="12" text-anchor="middle">t2 = x * 2</text>
  <text x="230.0" y="176.0" fill="#8a8a8a" font-size="12" text-anchor="middle">t2 = x * 2</text>
  <text x="370.0" y="176.0" fill="#8a8a8a" font-size="12" text-anchor="middle">t2 = 14</text>
  <text x="90.0" y="208.0" fill="#8a8a8a" font-size="12" text-anchor="middle">y = t2</text>
  <text x="230.0" y="208.0" fill="#8a8a8a" font-size="12" text-anchor="middle">y = t2</text>
  <text x="370.0" y="208.0" fill="#8a8a8a" font-size="12" text-anchor="middle">y = 14</text>
  <text x="90.0" y="240.0" fill="#8a8a8a" font-size="12" text-anchor="middle">return y</text>
  <text x="230.0" y="240.0" fill="#8a8a8a" font-size="12" text-anchor="middle">return y</text>
  <text x="370.0" y="240.0" fill="#8a8a8a" font-size="12" text-anchor="middle">return 14</text>
  <text x="510.0" y="240.0" fill="#8a8a8a" font-size="12" text-anchor="middle">return 14</text>
  <line x1="60.0" y1="286.0" x2="600.0" y2="286.0" stroke="#8a8a8a" stroke-width="1.0" stroke-dasharray="4,4"/>
  <text x="70.0" y="312.0" fill="#8a8a8a" font-size="11.5">Constant folding needs no analysis. Propagation needs reaching definitions.</text>
  <text x="70.0" y="334.0" fill="#8a8a8a" font-size="11.5">Dead-code elimination needs liveness -- and removes all four remaining lines.</text>
</svg>
