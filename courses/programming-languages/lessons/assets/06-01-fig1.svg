<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">A closure is code plus the environment its free variables need</text>
  <rect x="90.0" y="68.0" width="220.0" height="120.0" fill="none" stroke="#4a90d9" stroke-width="1.6" rx="6"/>
  <text x="200.0" y="92.0" fill="#4a90d9" font-size="12" text-anchor="middle">code</text>
  <text x="110.0" y="122.0" fill="#8a8a8a">\y.  x + y</text>
  <text x="110.0" y="152.0" fill="#e0645c" font-size="11.5">free variable: x</text>
  <rect x="370.0" y="68.0" width="220.0" height="120.0" fill="none" stroke="#4a90d9" stroke-width="1.6" rx="6"/>
  <text x="480.0" y="92.0" fill="#4a90d9" font-size="12" text-anchor="middle">captured environment</text>
  <text x="390.0" y="122.0" fill="#8a8a8a">x  -&gt;  10</text>
  <text x="390.0" y="152.0" fill="#8a8a8a" font-size="11.5" font-style="italic">and nothing else</text>
  <line x1="314.0" y1="128.0" x2="366.0" y2="128.0" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="340.0" y="118.0" fill="#8a8a8a" font-size="15" text-anchor="middle">+</text>
  <line x1="60.0" y1="214.0" x2="600.0" y2="214.0" stroke="#8a8a8a" stroke-width="1.0" stroke-dasharray="4,4"/>
  <text x="70.0" y="242.0" fill="#8a8a8a" font-size="12">What is captured is exactly FV(body). The question a language must answer:</text>
  <text x="70.0" y="266.0" fill="#e0645c" font-size="12.5">does the closure capture the VARIABLE or its VALUE at capture time?</text>
  <text x="70.0" y="298.0" fill="#8a8a8a" font-size="11.5" font-style="italic">Capture the variable and a loop counter is shared by every closure it makes.</text>
</svg>
