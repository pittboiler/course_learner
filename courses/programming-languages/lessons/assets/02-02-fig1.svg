<svg viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Big-step: one derivation tree whose root is the whole evaluation</text>
  <text x="60.0" y="66.0" fill="#e0645c">&lt;(x + 3) * (4 - 1), s&gt;  =&gt;  15</text>
  <line x1="60.0" y1="80.0" x2="420.0" y2="80.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="430.0" y="74.0" fill="#8a8a8a" font-size="11.5">(MUL)</text>
  <text x="80.0" y="112.0" fill="#4a90d9" font-size="13">&lt;x + 3, s&gt; =&gt; 5</text>
  <text x="300.0" y="112.0" fill="#4a90d9" font-size="13">&lt;4 - 1, s&gt; =&gt; 3</text>
  <line x1="80.0" y1="126.0" x2="240.0" y2="126.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="248.0" y="120.0" fill="#8a8a8a" font-size="11">(ADD)</text>
  <line x1="300.0" y1="126.0" x2="450.0" y2="126.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="458.0" y="120.0" fill="#8a8a8a" font-size="11">(SUB)</text>
  <text x="96.0" y="156.0" fill="#8a8a8a" font-size="12.5">&lt;x, s&gt; =&gt; 2</text>
  <text x="210.0" y="156.0" fill="#8a8a8a" font-size="12.5">&lt;3, s&gt; =&gt; 3</text>
  <text x="312.0" y="156.0" fill="#8a8a8a" font-size="12.5">&lt;4, s&gt; =&gt; 4</text>
  <text x="424.0" y="156.0" fill="#8a8a8a" font-size="12.5">&lt;1, s&gt; =&gt; 1</text>
  <line x1="96.0" y1="168.0" x2="186.0" y2="168.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <line x1="210.0" y1="168.0" x2="300.0" y2="168.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <line x1="312.0" y1="168.0" x2="402.0" y2="168.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <line x1="424.0" y1="168.0" x2="514.0" y2="168.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <text x="96.0" y="190.0" fill="#8a8a8a" font-size="11.5">s(x) = 2</text>
  <text x="210.0" y="190.0" fill="#8a8a8a" font-size="11.5">(NUM)</text>
  <text x="312.0" y="190.0" fill="#8a8a8a" font-size="11.5">(NUM)</text>
  <text x="424.0" y="190.0" fill="#8a8a8a" font-size="11.5">(NUM)</text>
  <text x="60.0" y="242.0" fill="#8a8a8a" font-size="11.5" font-style="italic">There is no sequence of intermediate expressions here, and no way to ask</text>
  <text x="60.0" y="260.0" fill="#8a8a8a" font-size="11.5" font-style="italic">what the program looked like &quot;halfway through&quot; - that is exactly what</text>
  <text x="60.0" y="278.0" fill="#8a8a8a" font-size="11.5" font-style="italic">big-step trades away, and why it cannot distinguish looping from stuck.</text>
</svg>
