<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Where the quantifier may stand</text>
  <text x="70.0" y="72.0" fill="#4a90d9" font-size="12.5">Hindley-Milner: PRENEX only, quantifiers at the outside</text>
  <text x="100.0" y="102.0" fill="#8a8a8a" font-size="13.5">forall a.  a -&gt; a</text>
  <text x="300.0" y="102.0" fill="#4a90d9" font-size="11.5">legal -- inference decidable</text>
  <text x="100.0" y="128.0" fill="#8a8a8a" font-size="13.5">(forall a. a -&gt; a) -&gt; Nat</text>
  <text x="300.0" y="128.0" fill="#e0645c" font-size="11.5">NOT a HM type</text>
  <line x1="60.0" y1="152.0" x2="600.0" y2="152.0" stroke="#8a8a8a" stroke-width="1.0" stroke-dasharray="4,4"/>
  <text x="70.0" y="180.0" fill="#4a90d9" font-size="12.5">System F: quantifiers anywhere, explicit type abstraction</text>
  <text x="100.0" y="210.0" fill="#8a8a8a" font-size="13.5">forall a.  a -&gt; a</text>
  <text x="300.0" y="210.0" fill="#4a90d9" font-size="11.5">legal</text>
  <text x="100.0" y="236.0" fill="#8a8a8a" font-size="13.5">(forall a. a -&gt; a) -&gt; Nat</text>
  <text x="300.0" y="236.0" fill="#4a90d9" font-size="11.5">legal -- rank 2</text>
  <text x="300.0" y="258.0" fill="#e0645c" font-size="11.5">but inference is UNDECIDABLE</text>
  <line x1="60.0" y1="282.0" x2="600.0" y2="282.0" stroke="#8a8a8a" stroke-width="1.0" stroke-dasharray="4,4"/>
  <text x="70.0" y="308.0" fill="#8a8a8a" font-size="12">The bargain: HM gives up expressiveness to keep principal types and</text>
  <text x="70.0" y="326.0" fill="#8a8a8a" font-size="12">annotation-free inference. Real languages let you opt back in, by writing the type.</text>
</svg>
