<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">A continuation is the rest of the computation, made a value</text>
  <text x="70.0" y="74.0" fill="#8a8a8a" font-size="12.5">evaluating   3 + (4 * f 5)   -- while f runs, what is left over?</text>
  <text x="100.0" y="112.0" fill="#4a90d9">k  =  \v.  3 + (4 * v)</text>
  <text x="340.0" y="112.0" fill="#4a90d9" font-size="11.5">the continuation of  f 5</text>
  <line x1="60.0" y1="140.0" x2="600.0" y2="140.0" stroke="#8a8a8a" stroke-width="1.0" stroke-dasharray="4,4"/>
  <text x="70.0" y="168.0" fill="#8a8a8a" font-size="12.5" font-weight="bold">direct style</text>
  <text x="90.0" y="194.0" fill="#8a8a8a" font-size="13">f x  =  x + 1</text>
  <text x="360.0" y="168.0" fill="#8a8a8a" font-size="12.5" font-weight="bold">continuation-passing style</text>
  <text x="380.0" y="194.0" fill="#8a8a8a" font-size="13">f x k  =  k (x + 1)</text>
  <text x="70.0" y="236.0" fill="#8a8a8a" font-size="12">In CPS no function returns: each one calls its continuation instead. Every call</text>
  <text x="70.0" y="258.0" fill="#8a8a8a" font-size="12">is then a tail call, so the stack stops growing -- the control stack has become</text>
  <text x="70.0" y="280.0" fill="#8a8a8a" font-size="12">an ordinary chain of closures on the heap.</text>
  <text x="70.0" y="312.0" fill="#e0645c" font-size="12" font-style="italic">Exceptions, generators and async are all &quot;call a different continuation&quot;.</text>
</svg>
