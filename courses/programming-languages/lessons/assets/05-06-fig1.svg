<svg viewBox="0 0 660 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Aliasing XOR mutation: the rule a borrow checker enforces</text>
  <text x="70.0" y="74.0" fill="#4a90d9" font-size="12.5" font-weight="bold">allowed</text>
  <text x="90.0" y="102.0" fill="#8a8a8a" font-size="12.5">many shared borrows  &amp;T, &amp;T, &amp;T</text>
  <text x="400.0" y="102.0" fill="#8a8a8a" font-size="11">read-only: no writer to race with</text>
  <text x="90.0" y="128.0" fill="#8a8a8a" font-size="12.5">exactly one mutable borrow  &amp;mut T</text>
  <text x="400.0" y="128.0" fill="#8a8a8a" font-size="11">a writer, but no other reader</text>
  <line x1="60.0" y1="152.0" x2="600.0" y2="152.0" stroke="#8a8a8a" stroke-width="1.0" stroke-dasharray="4,4"/>
  <text x="70.0" y="180.0" fill="#e0645c" font-size="12.5" font-weight="bold">rejected</text>
  <text x="90.0" y="208.0" fill="#8a8a8a" font-size="12.5">&amp;mut T  together with  &amp;T</text>
  <text x="400.0" y="208.0" fill="#e0645c" font-size="11">a writer and a reader at once</text>
  <text x="90.0" y="234.0" fill="#8a8a8a" font-size="12.5">two  &amp;mut T</text>
  <text x="400.0" y="234.0" fill="#e0645c" font-size="11">two writers</text>
  <line x1="60.0" y1="258.0" x2="600.0" y2="258.0" stroke="#8a8a8a" stroke-width="1.0" stroke-dasharray="4,4"/>
  <text x="70.0" y="288.0" fill="#8a8a8a" font-size="12">One rule rules out iterator invalidation, use-after-free, and data races -</text>
  <text x="70.0" y="308.0" fill="#8a8a8a" font-size="12">three bugs that look unrelated until you see they are all aliasing plus mutation.</text>
</svg>
