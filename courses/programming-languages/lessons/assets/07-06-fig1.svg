<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Register allocation is graph colouring on the interference graph</text>
  <line x1="181.8" y1="107.3" x2="298.2" y2="92.7" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="341.6" y1="94.3" x2="448.4" y2="115.7" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="173.2" y1="127.6" x2="236.8" y2="212.4" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="310.2" y1="109.7" x2="259.8" y2="210.3" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="460.9" y1="140.0" x2="429.1" y2="210.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="272.0" y1="230.0" x2="398.0" y2="230.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="160.0" cy="110.0" r="22" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="160.0" y="114.9" fill="#4a90d9" text-anchor="middle">a</text>
  <circle cx="320.0" cy="90.0" r="22" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="320.0" y="94.9" fill="#e0645c" text-anchor="middle">b</text>
  <circle cx="470.0" cy="120.0" r="22" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="470.0" y="124.9" fill="#4a90d9" text-anchor="middle">c</text>
  <circle cx="250.0" cy="230.0" r="22" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="250.0" y="234.9" fill="#e0645c" text-anchor="middle">d</text>
  <circle cx="420.0" cy="230.0" r="22" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="420.0" y="234.9" fill="#8a8a8a" text-anchor="middle">e</text>
  <text x="70.0" y="292.0" fill="#8a8a8a" font-size="11.5">Two variables interfere when both are live at the same point. A k-colouring assigns</text>
  <text x="70.0" y="312.0" fill="#8a8a8a" font-size="11.5">k registers with no two interfering variables sharing one; if none exists, something spills</text>
  <text x="70.0" y="332.0" fill="#8a8a8a" font-size="11.5">to memory -- and choosing what to spill is the whole art.</text>
</svg>
