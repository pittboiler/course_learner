<svg viewBox="0 0 660 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Two maps, not one: names to locations, locations to values</text>
  <rect x="90.0" y="78.0" width="200.0" height="130.0" fill="none" stroke="#4a90d9" stroke-width="1.6" rx="6"/>
  <text x="190.0" y="102.0" fill="#4a90d9" font-size="12" text-anchor="middle">environment</text>
  <text x="110.0" y="134.0" fill="#8a8a8a" font-size="13">a  -&gt;  loc 1</text>
  <text x="110.0" y="160.0" fill="#8a8a8a" font-size="13">b  -&gt;  loc 1</text>
  <text x="110.0" y="186.0" fill="#8a8a8a" font-size="13">c  -&gt;  loc 2</text>
  <rect x="400.0" y="78.0" width="200.0" height="130.0" fill="none" stroke="#e0645c" stroke-width="1.6" rx="6"/>
  <text x="500.0" y="102.0" fill="#e0645c" font-size="12" text-anchor="middle">store</text>
  <text x="420.0" y="134.0" fill="#8a8a8a" font-size="13">loc 1  -&gt;  7</text>
  <text x="420.0" y="172.0" fill="#8a8a8a" font-size="13">loc 2  -&gt;  0</text>
  <line x1="294.0" y1="134.0" x2="396.0" y2="134.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="396.0,134.0 385.0,129.0 385.0,139.0" fill="#8a8a8a"/>
  <line x1="294.0" y1="160.0" x2="396.0" y2="138.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="396.0,138.0 384.2,135.4 386.3,145.2" fill="#8a8a8a"/>
  <line x1="294.0" y1="186.0" x2="396.0" y2="172.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="396.0,172.0 384.4,168.5 385.8,178.4" fill="#8a8a8a"/>
  <text x="70.0" y="252.0" fill="#8a8a8a" font-size="12">a and b name the SAME location, so assigning through a changes b.</text>
  <text x="70.0" y="276.0" fill="#8a8a8a" font-size="12">That is aliasing, and it is invisible in the environment alone.</text>
  <text x="70.0" y="312.0" fill="#4a90d9" font-size="12" font-style="italic">Binding is scoped and immutable; the store is global and mutable.</text>
</svg>
