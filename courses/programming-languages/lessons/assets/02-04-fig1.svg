<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">A proof outline: assertions interleaved with the code</text>
  <text x="70.0" y="64.0" fill="#e0645c" font-size="12.5">{ x &gt;= 0  and  y &gt; 0 }</text>
  <text x="70.0" y="86.0" fill="#4a90d9" font-size="12.5">q := 0;</text>
  <text x="70.0" y="108.0" fill="#e0645c" font-size="12.5">{ x = 0*y + x  and  x &gt;= 0 }</text>
  <text x="70.0" y="130.0" fill="#4a90d9" font-size="12.5">r := x;</text>
  <text x="70.0" y="152.0" fill="#e0645c" font-size="12.5">{ INV }</text>
  <text x="70.0" y="174.0" fill="#4a90d9" font-size="12.5">while r &gt;= y do</text>
  <text x="70.0" y="196.0" fill="#e0645c" font-size="12.5">  { INV  and  r &gt;= y }</text>
  <text x="70.0" y="218.0" fill="#4a90d9" font-size="12.5">  r := r - y;</text>
  <text x="70.0" y="240.0" fill="#4a90d9" font-size="12.5">  q := q + 1</text>
  <text x="70.0" y="262.0" fill="#e0645c" font-size="12.5">  { INV }</text>
  <text x="70.0" y="284.0" fill="#e0645c" font-size="12.5">{ INV  and  not (r &gt;= y) }</text>
  <text x="70.0" y="306.0" fill="#e0645c" font-size="12.5">{ x = q*y + r  and  0 &lt;= r &lt; y }</text>
  <line x1="60.0" y1="326.0" x2="600.0" y2="326.0" stroke="#8a8a8a" stroke-width="1.0" stroke-dasharray="4,4"/>
  <text x="70.0" y="318.0" fill="#8a8a8a" font-size="12.5">INV  is   x = q*y + r   and   r &gt;= 0</text>
</svg>
