<svg viewBox="0 0 660 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Recursive descent on n + n * n: one function per nonterminal</text>
  <line x1="46.0" y1="49.0" x2="46.0" y2="62.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="46.0" y1="62.0" x2="54.0" y2="62.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="60.0" y="62.0" fill="#4a90d9" font-size="12.5">E()</text>
  <line x1="98.0" y1="73.0" x2="98.0" y2="86.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="98.0" y1="86.0" x2="106.0" y2="86.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="112.0" y="86.0" fill="#e0645c" font-size="12.5">T()</text>
  <line x1="150.0" y1="97.0" x2="150.0" y2="110.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="150.0" y1="110.0" x2="158.0" y2="110.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="164.0" y="110.0" fill="#4a90d9" font-size="12.5">F()  consumes n</text>
  <line x1="150.0" y1="121.0" x2="150.0" y2="134.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="150.0" y1="134.0" x2="158.0" y2="134.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="164.0" y="134.0" fill="#4a90d9" font-size="12.5">T&#x27;()  sees &#x27;+&#x27;, not &#x27;*&#x27;  -&gt; return</text>
  <line x1="98.0" y1="145.0" x2="98.0" y2="158.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="98.0" y1="158.0" x2="106.0" y2="158.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="112.0" y="158.0" fill="#e0645c" font-size="12.5">E&#x27;()  sees &#x27;+&#x27;  -&gt; consume, then T()</text>
  <line x1="150.0" y1="169.0" x2="150.0" y2="182.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="150.0" y1="182.0" x2="158.0" y2="182.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="164.0" y="182.0" fill="#4a90d9" font-size="12.5">T()</text>
  <line x1="202.0" y1="193.0" x2="202.0" y2="206.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="202.0" y1="206.0" x2="210.0" y2="206.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="216.0" y="206.0" fill="#e0645c" font-size="12.5">F()  consumes n</text>
  <line x1="202.0" y1="217.0" x2="202.0" y2="230.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="202.0" y1="230.0" x2="210.0" y2="230.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="216.0" y="230.0" fill="#e0645c" font-size="12.5">T&#x27;()  sees &#x27;*&#x27;  -&gt; consume, then F()</text>
  <line x1="254.0" y1="241.0" x2="254.0" y2="254.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="254.0" y1="254.0" x2="262.0" y2="254.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="268.0" y="254.0" fill="#4a90d9" font-size="12.5">F()  consumes n</text>
  <line x1="254.0" y1="265.0" x2="254.0" y2="278.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="254.0" y1="278.0" x2="262.0" y2="278.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="268.0" y="278.0" fill="#4a90d9" font-size="12.5">T&#x27;()  sees end  -&gt; return</text>
  <line x1="98.0" y1="289.0" x2="98.0" y2="302.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="98.0" y1="302.0" x2="106.0" y2="302.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="112.0" y="302.0" fill="#e0645c" font-size="12.5">E&#x27;()  sees end  -&gt; return</text>
  <text x="60.0" y="318.0" fill="#8a8a8a" font-size="11.5" font-style="italic">Each return happens exactly when the lookahead leaves that level&#x27;s FIRST set.</text>
</svg>
