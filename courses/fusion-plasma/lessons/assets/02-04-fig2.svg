<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Resistivity lets field lines reconnect at a rational surface, tearing smooth flux surfaces into islands.</text>

  <!-- intact flux surfaces above -->
  <path d="M 60 70 Q 310 58, 560 70" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M 60 95 Q 310 84, 560 95" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- intact flux surfaces below -->
  <path d="M 60 230 Q 310 242, 560 230" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M 60 205 Q 310 216, 560 205" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- rational surface q = 2 (dashed) -->
  <line x1="60" y1="150" x2="560" y2="150" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="470" y="144" fill="#8a8a8a">rational surface</text>

  <!-- central magnetic island (cat's-eye separatrix, coral) -->
  <path d="M 210 150 Q 320 100, 430 150 Q 320 200, 210 150 Z" fill="#e0645c" opacity="0.12" stroke="#e0645c" stroke-width="2"/>
  <!-- inner nested island contour -->
  <path d="M 250 150 Q 320 122, 390 150 Q 320 178, 250 150 Z" fill="none" stroke="#e0645c" stroke-width="1.3"/>
  <!-- O-point -->
  <circle cx="320" cy="150" r="3.5" fill="#e0645c"/>
  <text x="308" y="138" fill="#e0645c">O</text>
  <!-- X-points at the tips -->
  <line x1="204" y1="144" x2="216" y2="156" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="204" y1="156" x2="216" y2="144" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="424" y1="144" x2="436" y2="156" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="424" y1="156" x2="436" y2="144" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="176" y="154" fill="#8a8a8a">X</text>
  <text x="444" y="154" fill="#8a8a8a">X</text>

  <!-- partial islands at the edges to suggest the chain -->
  <path d="M 60 150 Q 120 118, 190 150 Q 120 182, 60 150" fill="#e0645c" opacity="0.10" stroke="#e0645c" stroke-width="1.5"/>
  <path d="M 450 150 Q 520 118, 560 150" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <path d="M 450 150 Q 520 182, 560 150" fill="none" stroke="#e0645c" stroke-width="1.5"/>

  <!-- island width marker -->
  <line x1="320" y1="100" x2="320" y2="200" stroke="#e0645c" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="326" y="96" fill="#e0645c">w</text>

  <text x="250" y="284" fill="#e0645c">magnetic island (width w)</text>
</svg>
