<svg viewBox="0 0 640 285" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Central (hot-spot) ignition: implode a tiny D-T capsule, light a central spark, then let the burn spread outward.</text>

  <!-- ===== Panel 1: ablation implodes the shell ===== -->
  <!-- inward drive arrows (coral) -->
  <line x1="192" y1="160" x2="168" y2="160" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="168,160 178,155.5 178,164.5" fill="#e0645c"/>
  <line x1="168" y1="218" x2="151" y2="201" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="151,201 154.9,211.3 161.3,204.9" fill="#e0645c"/>
  <line x1="110" y1="242" x2="110" y2="218" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="110,218 105.5,228 114.5,228" fill="#e0645c"/>
  <line x1="52" y1="218" x2="69" y2="201" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="69,201 58.7,204.9 65.1,211.3" fill="#e0645c"/>
  <line x1="28" y1="160" x2="52" y2="160" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="52,160 42,164.5 42,155.5" fill="#e0645c"/>
  <line x1="52" y1="102" x2="69" y2="119" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="69,119 65.1,108.7 58.7,115.1" fill="#e0645c"/>
  <line x1="110" y1="78" x2="110" y2="102" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="110,102 114.5,92 105.5,92" fill="#e0645c"/>
  <line x1="168" y1="102" x2="151" y2="119" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="151,119 161.3,115.1 154.9,108.7" fill="#e0645c"/>
  <!-- ablator shell + fuel -->
  <circle cx="110" cy="160" r="52" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="110" cy="160" r="38" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="110" y="164" fill="#4a90d9" text-anchor="middle">D-T</text>
  <text x="110" y="256" fill="#8a8a8a" text-anchor="middle">1. Drive ablates &#38; implodes shell</text>

  <!-- between-panel arrow -->
  <line x1="205" y1="160" x2="227" y2="160" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="227,160 219,155 219,165" fill="#8a8a8a"/>

  <!-- ===== Panel 2: hot spot ignites ===== -->
  <circle cx="320" cy="160" r="26" fill="#4a90d9" fill-opacity="0.28" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="320" cy="160" r="11" fill="#e0645c" fill-opacity="0.4" stroke="#e0645c" stroke-width="2"/>
  <text x="320" y="120" fill="#e0645c" text-anchor="middle" font-size="11">hot spot</text>
  <text x="320" y="256" fill="#8a8a8a" text-anchor="middle">2. Central hot spot ignites</text>

  <!-- between-panel arrow -->
  <line x1="415" y1="160" x2="437" y2="160" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="437,160 429,155 429,165" fill="#8a8a8a"/>

  <!-- ===== Panel 3: burn sweeps outward ===== -->
  <circle cx="530" cy="160" r="32" fill="#4a90d9" fill-opacity="0.18" stroke="#4a90d9" stroke-width="1.5"/>
  <circle cx="530" cy="160" r="17" fill="#e0645c" fill-opacity="0.4" stroke="#e0645c" stroke-width="2"/>
  <!-- outward burn-front arrows -->
  <line x1="548" y1="160" x2="560" y2="160" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="560,160 552,156 552,164" fill="#e0645c"/>
  <line x1="542.7" y1="172.7" x2="551.2" y2="181.2" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="551.2,181.2 542.8,178.4 548.4,172.8" fill="#e0645c"/>
  <line x1="530" y1="178" x2="530" y2="190" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="530,190 526,182 534,182" fill="#e0645c"/>
  <line x1="517.3" y1="172.7" x2="508.8" y2="181.2" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="508.8,181.2 511.6,172.8 517.2,178.4" fill="#e0645c"/>
  <line x1="512" y1="160" x2="500" y2="160" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="500,160 508,164 508,156" fill="#e0645c"/>
  <line x1="517.3" y1="147.3" x2="508.8" y2="138.8" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="508.8,138.8 517.2,141.6 511.6,147.2" fill="#e0645c"/>
  <line x1="530" y1="142" x2="530" y2="130" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="530,130 534,138 526,138" fill="#e0645c"/>
  <line x1="542.7" y1="147.3" x2="551.2" y2="138.8" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="551.2,138.8 548.4,147.2 542.8,141.6" fill="#e0645c"/>
  <text x="530" y="256" fill="#8a8a8a" text-anchor="middle">3. Burn sweeps into cold fuel</text>
</svg>
