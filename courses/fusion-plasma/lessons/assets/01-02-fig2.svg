<svg viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Falling thermal tail &#215; rising tunneling = a narrow Gamow peak, well above the mean.</text>

  <!-- axes -->
  <line x1="70" y1="272" x2="595" y2="272" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="595,272 585,267 585,277" fill="#8a8a8a"/>
  <text x="575" y="290" fill="#8a8a8a">E &#8594;</text>
  <line x1="70" y1="285" x2="70" y2="48" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,48 65,58 75,58" fill="#8a8a8a"/>
  <text x="18" y="58" fill="#8a8a8a">rate</text>

  <!-- Maxwell-Boltzmann tail (falls): e^(-E/kT) -->
  <path d="M 75 58 L 100 82 L 130 112 L 165 152 L 210 192 L 270 227 L 340 251 L 410 262"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="300" y="205" fill="#4a90d9">thermal tail</text>

  <!-- tunneling probability (rises): e^(-sqrt(E_G/E)) -->
  <path d="M 78 270 L 100 262 L 130 246 L 170 216 L 220 178 L 290 134 L 370 100 L 470 74 L 565 58"
        fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="452" y="98" fill="#8a8a8a">tunneling &#8593;</text>

  <!-- Gamow peak (product) -->
  <path d="M 120 270 L 150 244 L 180 168 L 205 108 L 228 88 L 252 112 L 288 176 L 335 232 L 385 264"
        fill="none" stroke="#e0645c" stroke-width="3"/>
  <text x="228" y="72" fill="#e0645c" text-anchor="middle">Gamow peak</text>

  <!-- mean thermal marker -->
  <line x1="121" y1="272" x2="121" y2="250" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="121" y="288" fill="#8a8a8a" text-anchor="middle">&#8776; kT</text>

  <!-- E0 marker -->
  <line x1="228" y1="272" x2="228" y2="92" stroke="#e0645c" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="240" y="256" fill="#e0645c">E&#8320; &#8776; 30 keV</text>

  <!-- barrier far to the right -->
  <text x="470" y="256" fill="#8a8a8a">barrier &#8594;</text>
</svg>
