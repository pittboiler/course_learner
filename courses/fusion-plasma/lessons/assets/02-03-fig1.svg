<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Coils make a toroidal field; the plasma current adds a poloidal field; their sum is a helix &#8212; q counts toroidal laps per poloidal lap.</text>

  <!-- ============ PANEL A: poloidal cross-section ============ -->
  <text x="30" y="46" fill="#8a8a8a">A. One cross-section of the plasma</text>

  <!-- flux surface (plasma boundary) -->
  <circle cx="150" cy="178" r="86" fill="#4a90d9" fill-opacity="0.06" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="118" y="278" fill="#4a90d9">flux surface</text>

  <!-- Bt out of page: blue circle-dot symbols -->
  <g stroke="#4a90d9" stroke-width="1.5" fill="none">
    <circle cx="98" cy="150" r="9"/><circle cx="202" cy="150" r="9"/>
    <circle cx="98" cy="210" r="9"/><circle cx="202" cy="210" r="9"/>
    <circle cx="150" cy="112" r="9"/>
  </g>
  <g fill="#4a90d9">
    <circle cx="98" cy="150" r="2.4"/><circle cx="202" cy="150" r="2.4"/>
    <circle cx="98" cy="210" r="2.4"/><circle cx="202" cy="210" r="2.4"/>
    <circle cx="150" cy="112" r="2.4"/>
  </g>
  <text x="212" y="126" fill="#4a90d9">B</text>
  <text x="221" y="130" fill="#4a90d9" font-size="10">t</text>
  <text x="212" y="142" fill="#4a90d9" font-size="11">(out)</text>

  <!-- Bp poloidal field: coral dashed circle with circulation arrows -->
  <circle cx="150" cy="178" r="58" fill="none" stroke="#e0645c" stroke-width="1.6" stroke-dasharray="5 5"/>
  <polygon points="150,120 143,131 157,131" fill="#e0645c"/>
  <polygon points="150,236 157,225 143,225" fill="#e0645c"/>
  <text x="158" y="164" fill="#e0645c">B</text>
  <text x="167" y="168" fill="#e0645c" font-size="10">p</text>

  <!-- Ip into page at center: coral circle with X -->
  <circle cx="150" cy="178" r="13" fill="#e0645c" fill-opacity="0.15" stroke="#e0645c" stroke-width="1.8"/>
  <line x1="141" y1="169" x2="159" y2="187" stroke="#e0645c" stroke-width="1.8"/>
  <line x1="159" y1="169" x2="141" y2="187" stroke="#e0645c" stroke-width="1.8"/>
  <text x="120" y="196" fill="#e0645c" font-size="11">I</text>
  <text x="126" y="200" fill="#e0645c" font-size="9">p</text>
  <text x="131" y="196" fill="#e0645c" font-size="11">(in)</text>

  <!-- ============ PANEL B: straightened tube + helix ============ -->
  <text x="330" y="46" fill="#8a8a8a">B. Follow one field line along the tube</text>

  <!-- cylinder (a flux surface, straightened out) -->
  <line x1="330" y1="120" x2="600" y2="120" stroke="#4a90d9" stroke-width="1.5" opacity="0.6"/>
  <line x1="330" y1="250" x2="600" y2="250" stroke="#4a90d9" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="330" cy="185" rx="16" ry="65" fill="#4a90d9" fill-opacity="0.05" stroke="#4a90d9" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="600" cy="185" rx="16" ry="65" fill="none" stroke="#4a90d9" stroke-width="1.5" opacity="0.6"/>

  <!-- helical field line (coral) -->
  <polyline fill="none" stroke="#e0645c" stroke-width="2.6"
    points="330.0,185 341.2,149.6 352.5,135 363.8,149.6 375.0,185 386.2,220.4 397.5,235 408.8,220.4 420.0,185 431.2,149.6 442.5,135 453.8,149.6 465.0,185 476.2,220.4 487.5,235 498.8,220.4 510.0,185 521.2,149.6 532.5,135 543.8,149.6 555.0,185 566.2,220.4 577.5,235 588.8,220.4 600.0,185"/>
  <polygon points="600,185 590,180 590,190" fill="#e0645c"/>

  <!-- one poloidal lap bracket (one period: x 330 to 420) -->
  <line x1="330" y1="270" x2="420" y2="270" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="330,270 339,266 339,274" fill="#8a8a8a"/>
  <polygon points="420,270 411,266 411,274" fill="#8a8a8a"/>
  <text x="333" y="288" fill="#8a8a8a" font-size="11">1 poloidal lap</text>

  <!-- toroidal direction label -->
  <line x1="452" y1="270" x2="598" y2="270" stroke="#4a90d9" stroke-width="1.2"/>
  <polygon points="598,270 589,266 589,274" fill="#4a90d9"/>
  <text x="470" y="288" fill="#4a90d9" font-size="11">toroidal (the long way)</text>
</svg>
