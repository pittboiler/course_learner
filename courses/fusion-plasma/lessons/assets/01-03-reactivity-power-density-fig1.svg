<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="60" y="22" fill="#8a8a8a" font-style="italic">Reactivity &#10216;&#963;v&#10217; vs temperature (log&#8211;log). D&#8211;T wins big at reachable temperatures.</text>

  <!-- ===== axes ===== -->
  <!-- y axis -->
  <line x1="70" y1="360" x2="70" y2="46" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,46 65,58 75,58" fill="#8a8a8a"/>
  <!-- x axis -->
  <line x1="70" y1="360" x2="600" y2="360" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="600,360 588,355 588,365" fill="#8a8a8a"/>

  <!-- y decade ticks and labels -->
  <line x1="66" y1="360" x2="70" y2="360" stroke="#8a8a8a" stroke-width="1"/>
  <text x="26" y="364" fill="#8a8a8a">10&#8315;&#178;&#8311;</text>
  <line x1="66" y1="256.7" x2="70" y2="256.7" stroke="#8a8a8a" stroke-width="1"/>
  <text x="26" y="260.7" fill="#8a8a8a">10&#8315;&#178;&#8309;</text>
  <line x1="66" y1="153.3" x2="70" y2="153.3" stroke="#8a8a8a" stroke-width="1"/>
  <text x="26" y="157.3" fill="#8a8a8a">10&#8315;&#178;&#179;</text>
  <line x1="66" y1="50" x2="70" y2="50" stroke="#8a8a8a" stroke-width="1"/>
  <text x="26" y="54" fill="#8a8a8a">10&#8315;&#178;&#185;</text>
  <text x="20" y="205" fill="#8a8a8a" transform="rotate(-90 20 205)">&#10216;&#963;v&#10217;&#160;&#160;(m&#179;/s)</text>

  <!-- x decade ticks and labels -->
  <line x1="70" y1="360" x2="70" y2="364" stroke="#8a8a8a" stroke-width="1"/>
  <text x="63" y="378" fill="#8a8a8a">1</text>
  <line x1="243.3" y1="360" x2="243.3" y2="364" stroke="#8a8a8a" stroke-width="1"/>
  <text x="233" y="378" fill="#8a8a8a">10</text>
  <line x1="416.6" y1="360" x2="416.6" y2="364" stroke="#8a8a8a" stroke-width="1"/>
  <text x="403" y="378" fill="#8a8a8a">100</text>
  <line x1="590" y1="360" x2="590" y2="364" stroke="#8a8a8a" stroke-width="1"/>
  <text x="574" y="378" fill="#8a8a8a">1000</text>
  <text x="300" y="398" fill="#8a8a8a">T&#160;&#160;(keV)</text>

  <!-- ===== operating region ~15 keV ===== -->
  <rect x="258" y="46" width="32" height="314" fill="#e0645c" opacity="0.12"/>
  <line x1="273.8" y1="360" x2="273.8" y2="46" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="238" y="342" fill="#e0645c">~15 keV</text>
  <text x="236" y="356" fill="#e0645c">operate</text>

  <!-- broad optimum bracket 15-70 keV -->
  <line x1="273.8" y1="40" x2="389.7" y2="40" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="273.8" y1="40" x2="273.8" y2="48" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="389.7" y1="40" x2="389.7" y2="48" stroke="#e0645c" stroke-width="1.5"/>
  <text x="286" y="34" fill="#e0645c">broad optimum (~15&#8211;70 keV, peak ~65)</text>

  <!-- ===== D-T curve (primary, blue) ===== -->
  <path d="M 70 319.7 L 122.2 231.9 L 191.1 147.4 L 243.3 99.5 L 273.8 80.2 L 295.5 69.5 L 347.6 55.0 L 384.2 53.1 L 416.6 55.0 L 468.8 59.7 L 537.7 66.0 L 590 71.1"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="392" y="66" fill="#4a90d9" font-weight="bold">D&#8211;T</text>

  <!-- operating point marker: 15 keV, 2.6e-22 -->
  <circle cx="273.8" cy="80.2" r="4.5" fill="#e0645c"/>
  <text x="150" y="86" fill="#e0645c">2.6&#215;10&#8315;&#178;&#178; m&#179;/s</text>

  <!-- ===== D-D curve (contrast, grey) ===== -->
  <path d="M 191.1 247.4 L 243.3 200.9 L 273.8 180.2 L 295.5 167.8 L 347.6 137.8 L 416.6 109.7 L 468.8 91.1 L 537.7 77.0 L 590 71.6"
        fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="540" y="90" fill="#8a8a8a">D&#8211;D</text>

  <!-- ===== D-3He curve (contrast, grey) ===== -->
  <path d="M 243.3 292.8 L 273.8 247.4 L 295.5 220.5 L 347.6 161.3 L 416.6 104.0 L 468.8 86.1 L 537.7 81.1 L 590 86.1"
        fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="452" y="118" fill="#8a8a8a">D&#8211;&#179;He</text>
</svg>
