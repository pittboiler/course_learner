<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Two nuclei must climb a Coulomb wall hundreds of keV high &#8212; but at ~10 keV they tunnel through it.</text>

  <!-- V = 0 axis (r increasing to the right) -->
  <line x1="70" y1="234" x2="590" y2="234" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <polygon points="590,234 580,229 580,239" fill="#8a8a8a"/>
  <text x="566" y="252" fill="#8a8a8a">r &#8594;</text>
  <text x="44" y="238" fill="#8a8a8a">0</text>

  <!-- energy axis -->
  <line x1="70" y1="345" x2="70" y2="48" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,48 65,58 75,58" fill="#8a8a8a"/>
  <text x="52" y="58" fill="#8a8a8a">V</text>

  <!-- potential-energy curve: deep nuclear well -> Coulomb barrier -> 1/r tail -->
  <path d="M 90 336 L 100 334 L 112 315 L 122 270 L 132 200 L 142 130 L 155 60 L 172 92 L 195 128 L 225 160 L 270 188 L 330 208 L 400 222 L 480 230 L 570 234"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- barrier-top label -->
  <text x="150" y="46" fill="#e0645c" text-anchor="middle">Coulomb barrier</text>
  <text x="196" y="72" fill="#8a8a8a">V(r) = Z&#8321;Z&#8322;e&#178;/4&#960;&#949;&#8320;r</text>

  <!-- nuclear well label -->
  <text x="96" y="352" fill="#4a90d9" text-anchor="middle">nuclear well</text>

  <!-- thermal energy line (~10 keV, far below the barrier top) -->
  <line x1="90" y1="214" x2="470" y2="214" stroke="#e0645c" stroke-width="1.5"/>
  <text x="476" y="218" fill="#e0645c">&#8776; 10 keV (thermal)</text>

  <!-- tunneling arrow through the barrier, at the thermal level -->
  <line x1="360" y1="214" x2="132" y2="214" stroke="#e0645c" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="132,214 143,209 143,219" fill="#e0645c"/>
  <text x="238" y="205" fill="#e0645c" text-anchor="middle">tunneling</text>

  <!-- classical turning point marker -->
  <circle cx="360" cy="214" r="3.5" fill="#8a8a8a"/>
  <text x="366" y="232" fill="#8a8a8a">turning point</text>

  <!-- barrier-height double arrow -->
  <line x1="155" y1="234" x2="155" y2="64" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
