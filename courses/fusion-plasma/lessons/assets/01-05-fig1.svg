<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="60" y="24" fill="#8a8a8a" font-style="italic">The milestone ladder: more gain Q means alphas do more of the heating &#8212; ignition is the ceiling f&#945;=1.</text>

  <!-- axes -->
  <line x1="70" y1="320" x2="600" y2="320" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="600,320 590,315 590,325" fill="#8a8a8a"/>
  <text x="470" y="360" fill="#8a8a8a">fusion gain Q &#8594;</text>
  <line x1="70" y1="320" x2="70" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,52 65,62 75,62" fill="#8a8a8a"/>
  <text x="24" y="200" fill="#8a8a8a" transform="rotate(-90 24 200)">heating from alphas&#160;&#160;f&#945;</text>

  <!-- y ticks -->
  <text x="52" y="325" fill="#8a8a8a" text-anchor="end">0</text>
  <line x1="66" y1="190" x2="70" y2="190" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="52" y="195" fill="#8a8a8a" text-anchor="end">&#189;</text>
  <line x1="66" y1="60" x2="70" y2="60" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="52" y="65" fill="#8a8a8a" text-anchor="end">1</text>

  <!-- x ticks -->
  <line x1="156.7" y1="320" x2="156.7" y2="324" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="156.7" y="338" fill="#8a8a8a" text-anchor="middle">5</text>
  <line x1="243.3" y1="320" x2="243.3" y2="324" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="243.3" y="338" fill="#8a8a8a" text-anchor="middle">10</text>
  <line x1="416.7" y1="320" x2="416.7" y2="324" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="416.7" y="338" fill="#8a8a8a" text-anchor="middle">20</text>
  <line x1="590" y1="320" x2="590" y2="324" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="590" y="338" fill="#8a8a8a" text-anchor="middle">30</text>

  <!-- ignition asymptote -->
  <line x1="70" y1="60" x2="600" y2="60" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="360" y="52" fill="#e0645c">ignition: Q &#8594; &#8734;, f&#945; &#8594; 1 (alphas alone sustain it)</text>

  <!-- the f_alpha = Q/(Q+5) curve -->
  <path d="M 70 320 L 87.3 276.6 L 104.7 245.6 L 122 222.5 L 139.3 204.5 L 156.7 190 L 191.3 168.4 L 243.3 146.6 L 295.3 132.3 L 347.3 121.9 L 416.7 112 L 503.3 103.4 L 590 97.2"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- half line guide -->
  <line x1="70" y1="190" x2="156.7" y2="190" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- milestone: Q=1 breakeven -->
  <line x1="87.3" y1="320" x2="87.3" y2="276.6" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="87.3" cy="276.6" r="5" fill="#e0645c"/>
  <text x="96" y="272" fill="#e0645c">Q=1 breakeven</text>
  <text x="96" y="288" fill="#8a8a8a">(P_fus = P_heat)</text>

  <!-- milestone: Q=5 alphas match external -->
  <line x1="156.7" y1="320" x2="156.7" y2="190" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="156.7" cy="190" r="5" fill="#e0645c"/>
  <text x="166" y="186" fill="#e0645c">Q&#8776;5: alphas = external</text>

  <!-- milestone: Q=10 burning plasma -->
  <line x1="243.3" y1="320" x2="243.3" y2="146.6" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="243.3" cy="146.6" r="5" fill="#e0645c"/>
  <text x="252" y="142" fill="#e0645c">Q=10 burning plasma (ITER)</text>
  <text x="252" y="158" fill="#8a8a8a">f&#945; = &#8532;</text>
</svg>
