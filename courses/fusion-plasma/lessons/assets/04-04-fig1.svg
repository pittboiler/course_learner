<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="320" y="22" fill="#8a8a8a" font-style="italic" text-anchor="middle">Two ways to squeeze a capsule: hit it with beams, or convert the beams to an X&#8211;ray bath first.</text>

  <!-- panel titles -->
  <text x="160" y="52" fill="#4a90d9" font-size="16" text-anchor="middle">Direct drive</text>
  <text x="478" y="52" fill="#4a90d9" font-size="16" text-anchor="middle">Indirect drive (NIF)</text>

  <!-- divider -->
  <line x1="320" y1="66" x2="320" y2="320" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- ================= LEFT: direct drive ================= -->
  <!-- laser beams: coral triangles converging on the capsule -->
  <polygon points="189,205 248,211 248,199" fill="#e0645c" opacity="0.85"/>
  <polygon points="180.5,225.5 217.9,271.4 226.4,263.0" fill="#e0645c" opacity="0.85"/>
  <polygon points="160,234 154,293 166,293" fill="#e0645c" opacity="0.85"/>
  <polygon points="139.5,225.5 93.6,263.0 102.0,271.4" fill="#e0645c" opacity="0.85"/>
  <polygon points="131,205 72,199 72,211" fill="#e0645c" opacity="0.85"/>
  <polygon points="139.5,184.5 102.0,138.6 93.6,147.0" fill="#e0645c" opacity="0.85"/>
  <polygon points="160,176 166,117 154,117" fill="#e0645c" opacity="0.85"/>
  <polygon points="180.5,184.5 226.4,147.0 217.9,138.6" fill="#e0645c" opacity="0.85"/>

  <!-- capsule -->
  <circle cx="160" cy="205" r="26" fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="2"/>
  <text x="160" y="210" fill="#4a90d9" text-anchor="middle">D-T</text>

  <text x="255" y="128" fill="#e0645c" text-anchor="middle">laser</text>
  <text x="160" y="312" fill="#8a8a8a" text-anchor="middle">beams strike the fuel capsule directly</text>

  <!-- ================= RIGHT: indirect drive ================= -->
  <!-- hohlraum walls (grey), open at both ends (laser entrance holes) -->
  <line x1="430" y1="165" x2="520" y2="165" stroke="#8a8a8a" stroke-width="4"/>
  <line x1="430" y1="245" x2="520" y2="245" stroke="#8a8a8a" stroke-width="4"/>
  <line x1="432" y1="165" x2="432" y2="180" stroke="#8a8a8a" stroke-width="4"/>
  <line x1="432" y1="230" x2="432" y2="245" stroke="#8a8a8a" stroke-width="4"/>
  <line x1="518" y1="165" x2="518" y2="180" stroke="#8a8a8a" stroke-width="4"/>
  <line x1="518" y1="230" x2="518" y2="245" stroke="#8a8a8a" stroke-width="4"/>

  <!-- laser beams entering through the end holes, striking the inner wall -->
  <line x1="388" y1="207" x2="452" y2="175" stroke="#e0645c" stroke-width="2"/>
  <polygon points="452,175 446.2,183.5 441.7,174.5" fill="#e0645c"/>
  <line x1="388" y1="203" x2="452" y2="235" stroke="#e0645c" stroke-width="2"/>
  <polygon points="452,235 441.7,235.5 446.2,226.5" fill="#e0645c"/>
  <line x1="562" y1="207" x2="498" y2="175" stroke="#e0645c" stroke-width="2"/>
  <polygon points="498,175 508.3,174.5 503.8,183.5" fill="#e0645c"/>
  <line x1="562" y1="203" x2="498" y2="235" stroke="#e0645c" stroke-width="2"/>
  <polygon points="498,235 503.8,226.5 508.3,235.5" fill="#e0645c"/>

  <!-- X-rays: coral dashes converging on the capsule from all sides -->
  <line x1="513" y1="205" x2="498" y2="205" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="2 3"/>
  <line x1="437" y1="205" x2="452" y2="205" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="2 3"/>
  <line x1="475" y1="167" x2="475" y2="182" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="2 3"/>
  <line x1="475" y1="243" x2="475" y2="228" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="2 3"/>
  <line x1="501.9" y1="178.1" x2="491.3" y2="188.7" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="2 3"/>
  <line x1="448.1" y1="178.1" x2="458.7" y2="188.7" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="2 3"/>
  <line x1="501.9" y1="231.9" x2="491.3" y2="221.3" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="2 3"/>
  <line x1="448.1" y1="231.9" x2="458.7" y2="221.3" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="2 3"/>

  <!-- capsule inside the hohlraum -->
  <circle cx="475" cy="205" r="18" fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="2"/>

  <text x="478" y="158" fill="#8a8a8a" text-anchor="middle">gold hohlraum wall (Au)</text>
  <text x="368" y="200" fill="#e0645c" text-anchor="middle">laser</text>
  <text x="478" y="285" fill="#e0645c" text-anchor="middle">X-rays bathe the capsule</text>
</svg>
