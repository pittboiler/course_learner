<svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">A plain torus separates charges and self-ejects; a helical twist lets each particle sample top &#38; bottom, cancelling the drift.</text>

  <!-- ============ LEFT PANEL: plain torus fails ============ -->
  <text x="120" y="48" fill="#8a8a8a" font-weight="bold">Plain toroidal field</text>

  <!-- torus axis (major radius) -->
  <line x1="48" y1="70" x2="48" y2="320" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="18" y="205" fill="#8a8a8a" transform="rotate(-90 18 205)">torus axis (R)</text>
  <text x="300" y="300" fill="#8a8a8a">outboard &#8594;</text>

  <!-- plasma cross-section -->
  <circle cx="210" cy="195" r="72" fill="#8a8a8a" opacity="0.10" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- toroidal field into the page -->
  <circle cx="162" cy="195" r="8" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <line x1="156.3" y1="189.3" x2="167.7" y2="200.7" stroke="#8a8a8a" stroke-width="1.3"/>
  <line x1="167.7" y1="189.3" x2="156.3" y2="200.7" stroke="#8a8a8a" stroke-width="1.3"/>
  <circle cx="258" cy="195" r="8" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <line x1="252.3" y1="189.3" x2="263.7" y2="200.7" stroke="#8a8a8a" stroke-width="1.3"/>
  <line x1="263.7" y1="189.3" x2="252.3" y2="200.7" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="150" y="232" fill="#8a8a8a">B_t into page</text>

  <!-- positive charges at top -->
  <text x="180" y="150" fill="#e0645c" font-size="17" font-weight="bold">+</text>
  <text x="205" y="143" fill="#e0645c" font-size="17" font-weight="bold">+</text>
  <text x="230" y="150" fill="#e0645c" font-size="17" font-weight="bold">+</text>
  <!-- negative charges at bottom -->
  <text x="182" y="258" fill="#e0645c" font-size="17" font-weight="bold">&#8722;</text>
  <text x="206" y="264" fill="#e0645c" font-size="17" font-weight="bold">&#8722;</text>
  <text x="230" y="258" fill="#e0645c" font-size="17" font-weight="bold">&#8722;</text>

  <!-- ion drift up (left) -->
  <line x1="120" y1="230" x2="120" y2="165" stroke="#e0645c" stroke-width="2"/>
  <polygon points="120,160 115,171 125,171" fill="#e0645c"/>
  <text x="78" y="200" fill="#e0645c">ions &#8593;</text>
  <!-- electron drift down (right) -->
  <line x1="300" y1="160" x2="300" y2="225" stroke="#e0645c" stroke-width="2"/>
  <polygon points="300,230 295,219 305,219" fill="#e0645c"/>
  <text x="308" y="200" fill="#e0645c">e&#8722; &#8595;</text>

  <!-- E field (top + to bottom -) -->
  <line x1="210" y1="163" x2="210" y2="227" stroke="#e0645c" stroke-width="1.6" stroke-dasharray="5 4"/>
  <polygon points="210,232 205,221 215,221" fill="#e0645c"/>
  <text x="216" y="196" fill="#e0645c" font-style="italic">E</text>

  <!-- E x B drift outward -->
  <line x1="284" y1="195" x2="382" y2="195" stroke="#e0645c" stroke-width="3"/>
  <polygon points="388,195 375,189 375,201" fill="#e0645c"/>
  <text x="300" y="185" fill="#e0645c" font-weight="bold">E&#215;B drift</text>
  <text x="316" y="262" fill="#e0645c">&#8594; into the wall</text>

  <!-- ============ RIGHT PANEL: the twist fixes it ============ -->
  <text x="470" y="48" fill="#4a90d9" font-weight="bold">Add a poloidal twist</text>

  <!-- unrolled torus surface -->
  <rect x="452" y="120" width="180" height="130" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="470" y="272" fill="#8a8a8a">toroidal angle (long way) &#8594;</text>
  <text x="446" y="118" fill="#8a8a8a" text-anchor="end">top</text>
  <text x="446" y="252" fill="#8a8a8a" text-anchor="end">bottom</text>
  <text x="440" y="190" fill="#8a8a8a" transform="rotate(-90 440 190)">poloidal &#8597;</text>

  <!-- helical field line: wraps top->bottom as it goes around -->
  <line x1="452" y1="250" x2="542" y2="120" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="542" y1="250" x2="632" y2="120" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="632,120 621,124 627,133" fill="#4a90d9"/>
  <!-- particle samples top and bottom -->
  <circle cx="497" cy="185" r="4.5" fill="#e0645c"/>
  <circle cx="587" cy="185" r="4.5" fill="#e0645c"/>
  <text x="500" y="176" fill="#e0645c">samples both</text>

  <text x="452" y="300" fill="#8a8a8a">field line = helical &#8594; up-drift cancels down-drift</text>
  <text x="452" y="320" fill="#4a90d9">rotational transform &#953; ; safety factor q = 1/&#953;</text>
</svg>
