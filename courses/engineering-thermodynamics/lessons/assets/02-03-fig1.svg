<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Everything crossing the boundary, counted once. Each stream carries u AND flow work pv &#8594; enthalpy h.</text>

  <!-- control volume box -->
  <rect x="230" y="120" width="180" height="120" rx="8" fill="#4a90d9" fill-opacity="0.08" stroke="#4a90d9" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="320" y="176" fill="#4a90d9" text-anchor="middle" font-weight="bold">Control</text>
  <text x="320" y="196" fill="#4a90d9" text-anchor="middle" font-weight="bold">volume</text>
  <text x="320" y="234" fill="#8a8a8a" text-anchor="middle" font-size="12">steady: dm/dt = 0, dE/dt = 0</text>

  <!-- inlet stream (blue) -->
  <line x1="96" y1="150" x2="230" y2="150" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="230,150 218,144 218,156" fill="#4a90d9"/>
  <circle cx="230" cy="150" r="4" fill="#4a90d9"/>
  <text x="96" y="138" fill="#4a90d9">&#7745;&#8321;, h&#8321;, V&#8321;, z&#8321;</text>
  <text x="120" y="172" fill="#8a8a8a" font-size="12" font-style="italic">pushed in: +p&#8321;v&#8321;</text>

  <!-- outlet stream (coral) -->
  <line x1="410" y1="210" x2="548" y2="210" stroke="#e0645c" stroke-width="3"/>
  <polygon points="548,210 536,204 536,216" fill="#e0645c"/>
  <circle cx="410" cy="210" r="4" fill="#e0645c"/>
  <text x="452" y="198" fill="#e0645c">&#7745;&#8322;, h&#8322;, V&#8322;, z&#8322;</text>
  <text x="452" y="232" fill="#8a8a8a" font-size="12" font-style="italic">pushes out: &#8722;p&#8322;v&#8322;</text>

  <!-- heat in (grey) from below -->
  <line x1="290" y1="308" x2="290" y2="240" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="290,240 284,252 296,252" fill="#8a8a8a"/>
  <text x="270" y="326" fill="#8a8a8a">Q&#775; in</text>

  <!-- shaft work out (grey) upward -->
  <line x1="360" y1="120" x2="360" y2="56" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="360,56 354,68 366,68" fill="#8a8a8a"/>
  <text x="336" y="48" fill="#8a8a8a">W&#775; shaft</text>
</svg>
