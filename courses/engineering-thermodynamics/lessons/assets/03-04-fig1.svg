<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">h&#8722;s view of a turbine: the ideal drop 1&#8594;2s is vertical (s constant); the real path 1&#8594;2a slants right, so less work.</text>

  <!-- axes -->
  <line x1="70" y1="290" x2="560" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="560,290 550,285 550,295" fill="#8a8a8a"/>
  <text x="566" y="295" fill="#8a8a8a">s</text>
  <line x1="70" y1="290" x2="70" y2="60" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,60 65,70 75,70" fill="#8a8a8a"/>
  <text x="56" y="68" fill="#8a8a8a">h</text>

  <!-- saturation dome -->
  <path d="M 150 272 Q 250 118 340 118 Q 430 118 458 272" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="2 4"/>
  <text x="150" y="288" fill="#8a8a8a" font-size="12">wet region (under the dome)</text>

  <!-- ideal path: 1 straight down to 2s (constant s) -->
  <line x1="250" y1="95" x2="250" y2="250" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="250,250 245,240 255,240" fill="#4a90d9"/>

  <!-- actual path: 1 down-right to 2a (s increases) -->
  <path d="M 250 95 Q 300 165 335 225" fill="none" stroke="#e0645c" stroke-width="3"/>
  <polygon points="335,225 326,219 331,229" fill="#e0645c"/>

  <!-- state points -->
  <circle cx="250" cy="95" r="4" fill="#8a8a8a"/>
  <text x="228" y="90" fill="#8a8a8a">1</text>
  <circle cx="250" cy="250" r="4" fill="#4a90d9"/>
  <text x="224" y="255" fill="#4a90d9">2s</text>
  <circle cx="335" cy="225" r="4" fill="#e0645c"/>
  <text x="342" y="230" fill="#e0645c">2a</text>

  <!-- horizontal guide lines to the right brackets -->
  <line x1="250" y1="95" x2="530" y2="95" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="335" y1="225" x2="505" y2="225" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="250" y1="250" x2="530" y2="250" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- actual work bracket (coral): h1 to h2a -->
  <line x1="500" y1="95" x2="500" y2="225" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="496" y1="95" x2="504" y2="95" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="496" y1="225" x2="504" y2="225" stroke="#e0645c" stroke-width="1.5"/>
  <text x="470" y="160" fill="#e0645c">w_a</text>

  <!-- ideal work bracket (blue): h1 to h2s -->
  <line x1="530" y1="95" x2="530" y2="250" stroke="#4a90d9" stroke-width="1.5"/>
  <line x1="526" y1="95" x2="534" y2="95" stroke="#4a90d9" stroke-width="1.5"/>
  <line x1="526" y1="250" x2="534" y2="250" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="536" y="178" fill="#4a90d9">w_s</text>

  <!-- lost work: gap between 2a and 2s levels -->
  <line x1="405" y1="225" x2="405" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="401" y1="225" x2="409" y2="225" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="401" y1="250" x2="409" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="412" y="245" fill="#8a8a8a" font-size="12">lost</text>

  <text x="250" y="315" fill="#8a8a8a" font-size="12" text-anchor="middle">both exits sit at the same pressure p&#8322;</text>
</svg>
