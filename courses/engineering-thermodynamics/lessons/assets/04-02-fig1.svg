<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Same compression stroke; the heat-addition leg (coral) differs: Otto adds heat at constant volume, Diesel at constant pressure.</text>
  <text x="30" y="42" fill="#8a8a8a" font-style="italic">The area enclosed by each loop is the net work per cycle.</text>

  <!-- ================= LEFT: OTTO ================= -->
  <text x="150" y="72" fill="#4a90d9" font-weight="bold" text-anchor="middle">Otto (spark ignition)</text>

  <!-- axes -->
  <line x1="60" y1="330" x2="60" y2="90" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="60,90 55,100 65,100" fill="#8a8a8a"/>
  <text x="46" y="98" fill="#8a8a8a">p</text>
  <line x1="60" y1="330" x2="300" y2="330" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="300,330 290,325 290,335" fill="#8a8a8a"/>
  <text x="300" y="348" fill="#8a8a8a">V</text>

  <!-- V ticks: V2 (small) and V1 (large) -->
  <line x1="90" y1="330" x2="90" y2="335" stroke="#8a8a8a" stroke-width="1"/>
  <text x="82" y="349" fill="#8a8a8a" font-size="12">V2</text>
  <line x1="270" y1="330" x2="270" y2="335" stroke="#8a8a8a" stroke-width="1"/>
  <text x="262" y="349" fill="#8a8a8a" font-size="12">V1</text>

  <!-- cycle loop -->
  <!-- 1-2 isentropic compression -->
  <path d="M 270 300 Q 150 285 90 210" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- 2-3 constant volume heat addition (highlighted) -->
  <line x1="90" y1="210" x2="90" y2="110" stroke="#e0645c" stroke-width="3"/>
  <!-- 3-4 isentropic expansion -->
  <path d="M 90 110 Q 175 175 270 235" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- 4-1 constant volume heat rejection -->
  <line x1="270" y1="235" x2="270" y2="300" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- state points -->
  <circle cx="270" cy="300" r="3.5" fill="#8a8a8a"/>
  <text x="277" y="312" fill="#8a8a8a">1</text>
  <circle cx="90" cy="210" r="3.5" fill="#8a8a8a"/>
  <text x="70" y="208" fill="#8a8a8a">2</text>
  <circle cx="90" cy="110" r="3.5" fill="#8a8a8a"/>
  <text x="70" y="108" fill="#8a8a8a">3</text>
  <circle cx="270" cy="235" r="3.5" fill="#8a8a8a"/>
  <text x="277" y="234" fill="#8a8a8a">4</text>

  <!-- q_in label -->
  <text x="98" y="160" fill="#e0645c" font-size="12">q_in</text>
  <text x="98" y="174" fill="#e0645c" font-size="11">const V</text>

  <!-- ================= RIGHT: DIESEL ================= -->
  <text x="490" y="72" fill="#4a90d9" font-weight="bold" text-anchor="middle">Diesel (compression ignition)</text>

  <!-- axes -->
  <line x1="390" y1="330" x2="390" y2="90" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="390,90 385,100 395,100" fill="#8a8a8a"/>
  <text x="376" y="98" fill="#8a8a8a">p</text>
  <line x1="390" y1="330" x2="630" y2="330" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="630,330 620,325 620,335" fill="#8a8a8a"/>
  <text x="630" y="348" fill="#8a8a8a">V</text>

  <!-- V ticks: V2, V3, V1 -->
  <line x1="420" y1="330" x2="420" y2="335" stroke="#8a8a8a" stroke-width="1"/>
  <text x="412" y="349" fill="#8a8a8a" font-size="12">V2</text>
  <line x1="480" y1="330" x2="480" y2="335" stroke="#8a8a8a" stroke-width="1"/>
  <text x="472" y="349" fill="#8a8a8a" font-size="12">V3</text>
  <line x1="600" y1="330" x2="600" y2="335" stroke="#8a8a8a" stroke-width="1"/>
  <text x="592" y="349" fill="#8a8a8a" font-size="12">V1</text>

  <!-- cycle loop -->
  <!-- 1-2 isentropic compression -->
  <path d="M 600 300 Q 480 285 420 110" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- 2-3 constant pressure heat addition (highlighted) -->
  <line x1="420" y1="110" x2="480" y2="110" stroke="#e0645c" stroke-width="3"/>
  <!-- 3-4 isentropic expansion -->
  <path d="M 480 110 Q 545 195 600 240" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- 4-1 constant volume heat rejection -->
  <line x1="600" y1="240" x2="600" y2="300" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- state points -->
  <circle cx="600" cy="300" r="3.5" fill="#8a8a8a"/>
  <text x="607" y="312" fill="#8a8a8a">1</text>
  <circle cx="420" cy="110" r="3.5" fill="#8a8a8a"/>
  <text x="400" y="108" fill="#8a8a8a">2</text>
  <circle cx="480" cy="110" r="3.5" fill="#8a8a8a"/>
  <text x="485" y="104" fill="#8a8a8a">3</text>
  <circle cx="600" cy="240" r="3.5" fill="#8a8a8a"/>
  <text x="607" y="240" fill="#8a8a8a">4</text>

  <!-- q_in label -->
  <text x="424" y="98" fill="#e0645c" font-size="12">q_in (const p)</text>
</svg>
