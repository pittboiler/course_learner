<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Inside the dome, a state sits on the f-to-g line; quality x is the fraction of the way across.</text>

  <!-- axes -->
  <line x1="70" y1="290" x2="575" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="575,290 565,285 565,295" fill="#8a8a8a"/>
  <text x="560" y="312" fill="#8a8a8a">v</text>
  <line x1="70" y1="290" x2="70" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,55 65,65 75,65" fill="#8a8a8a"/>
  <text x="52" y="66" fill="#8a8a8a">T</text>

  <!-- vapor dome -->
  <path d="M 150 285 C 175 200 260 105 305 82 C 350 105 470 200 520 285"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="256" y="76" fill="#4a90d9">critical point</text>
  <circle cx="305" cy="82" r="3.5" fill="#4a90d9"/>
  <text x="96" y="150" fill="#4a90d9">sat. liquid</text>
  <text x="96" y="168" fill="#4a90d9">line (f)</text>
  <text x="486" y="150" fill="#4a90d9">sat. vapor</text>
  <text x="486" y="168" fill="#4a90d9">line (g)</text>

  <!-- isotherm inside the dome: f to g -->
  <line x1="196" y1="210" x2="465" y2="210" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="360" y="203" fill="#8a8a8a">T = const</text>

  <!-- endpoints f and g -->
  <circle cx="196" cy="210" r="4" fill="#4a90d9"/>
  <text x="180" y="230" fill="#4a90d9">f</text>
  <circle cx="465" cy="210" r="4" fill="#4a90d9"/>
  <text x="468" y="230" fill="#4a90d9">g</text>

  <!-- state point at x = 0.6 of the way from f to g -->
  <circle cx="357" cy="210" r="5" fill="#e0645c"/>
  <text x="349" y="196" fill="#e0645c">state</text>

  <!-- f-to-state segment highlighted (this is x times the full width) -->
  <line x1="196" y1="248" x2="357" y2="248" stroke="#e0645c" stroke-width="2"/>
  <line x1="196" y1="242" x2="196" y2="254" stroke="#e0645c" stroke-width="1"/>
  <line x1="357" y1="242" x2="357" y2="254" stroke="#e0645c" stroke-width="1"/>
  <text x="250" y="268" fill="#e0645c">x</text>

  <!-- full f-to-g width -->
  <line x1="196" y1="266" x2="465" y2="266" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="465" y1="242" x2="465" y2="272" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="300" y="286" fill="#8a8a8a">1 (full width, f to g)</text>
</svg>
