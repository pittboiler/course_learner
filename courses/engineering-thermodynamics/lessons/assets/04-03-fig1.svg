<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="34" y="22" fill="#8a8a8a" font-style="italic">Brayton on T&#8211;s: two isentropes (vertical) between two isobars (rising curves) &#8212; and why the shaft is greedy.</text>

  <!-- ===== left: T-s diagram ===== -->
  <!-- axes -->
  <line x1="60" y1="290" x2="60" y2="60" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="60,60 55,70 65,70" fill="#8a8a8a"/>
  <text x="46" y="70" fill="#8a8a8a">T</text>
  <line x1="60" y1="290" x2="320" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="320,290 310,285 310,295" fill="#8a8a8a"/>
  <text x="312" y="308" fill="#8a8a8a">s</text>

  <!-- lower isobar p1 (through 1 and 4) -->
  <path d="M 100 250 Q 180 235 270 205" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="228" y="232" fill="#8a8a8a">p&#8321; (low)</text>
  <!-- upper isobar p2 (through 2 and 3) -->
  <path d="M 100 155 Q 180 138 270 100" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="150" y="120" fill="#8a8a8a">p&#8322; (high)</text>

  <!-- isentrope 1->2 compression -->
  <line x1="100" y1="250" x2="100" y2="155" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- isentrope 3->4 expansion -->
  <line x1="270" y1="100" x2="270" y2="205" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- heat labels -->
  <text x="150" y="88" fill="#e0645c">q_in (2&#8594;3)</text>
  <text x="150" y="272" fill="#e0645c">q_out (4&#8594;1)</text>

  <!-- state points -->
  <circle cx="100" cy="250" r="4" fill="#e0645c"/>
  <text x="84" y="266" fill="#e0645c">1</text>
  <circle cx="100" cy="155" r="4" fill="#e0645c"/>
  <text x="82" y="152" fill="#e0645c">2</text>
  <circle cx="270" cy="100" r="4" fill="#e0645c"/>
  <text x="276" y="98" fill="#e0645c">3</text>
  <circle cx="270" cy="205" r="4" fill="#e0645c"/>
  <text x="276" y="210" fill="#e0645c">4</text>

  <!-- ===== right: engine schematic ===== -->
  <!-- combustor -->
  <rect x="452" y="66" width="56" height="34" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="463" y="88" fill="#4a90d9">comb.</text>
  <!-- q_in into combustor -->
  <line x1="480" y1="40" x2="480" y2="64" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="480,66 475,56 485,56" fill="#e0645c"/>
  <text x="488" y="52" fill="#e0645c">q_in</text>

  <!-- compressor (narrows left to right) -->
  <polygon points="400,150 442,166 442,196 400,212" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="398" y="238" fill="#8a8a8a">compressor</text>
  <!-- turbine (widens left to right) -->
  <polygon points="518,166 560,150 560,212 518,196" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="516" y="238" fill="#8a8a8a">turbine</text>

  <!-- air in (state 1) -->
  <line x1="366" y1="181" x2="398" y2="181" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="400,181 390,176 390,186" fill="#8a8a8a"/>
  <text x="360" y="172" fill="#8a8a8a">air (1)</text>
  <!-- compressor -> combustor (state 2) -->
  <path d="M 442 168 L 458 120 L 462 100" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="462,100 456,108 466,110" fill="#8a8a8a"/>
  <text x="430" y="128" fill="#8a8a8a">2</text>
  <!-- combustor -> turbine (state 3) -->
  <path d="M 498 100 L 502 120 L 518 168" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="518,168 508,166 514,158" fill="#8a8a8a"/>
  <text x="506" y="128" fill="#8a8a8a">3</text>
  <!-- exhaust (state 4) -->
  <line x1="560" y1="181" x2="596" y2="181" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="598,181 588,176 588,186" fill="#8a8a8a"/>
  <text x="566" y="172" fill="#8a8a8a">exhaust (4)</text>

  <!-- shaft: turbine feeds compressor (back-work) -->
  <line x1="442" y1="270" x2="560" y2="270" stroke="#e0645c" stroke-width="2"/>
  <line x1="442" y1="196" x2="442" y2="270" stroke="#e0645c" stroke-width="2"/>
  <line x1="560" y1="196" x2="560" y2="270" stroke="#e0645c" stroke-width="2"/>
  <polygon points="442,270 452,265 452,275" fill="#e0645c"/>
  <text x="452" y="290" fill="#e0645c">shaft: w_comp feeds back (back-work)</text>
</svg>
