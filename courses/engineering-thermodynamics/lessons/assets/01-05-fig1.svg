<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Boundary work is the area under the process path on a p&#8211;V diagram &#8212; so the route, not just the endpoints, sets W.</text>

  <!-- ===== left: area under one process curve = work ===== -->
  <text x="86" y="52" fill="#8a8a8a">W = area under the path</text>

  <!-- V axis -->
  <line x1="70" y1="290" x2="300" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="300,290 290,285 290,295" fill="#8a8a8a"/>
  <text x="304" y="295" fill="#8a8a8a">V</text>
  <!-- p axis -->
  <line x1="70" y1="290" x2="70" y2="80" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,80 65,90 75,90" fill="#8a8a8a"/>
  <text x="54" y="86" fill="#8a8a8a">p</text>

  <!-- shaded area under the curve -->
  <path d="M 110 290 L 110 130 Q 190 150 270 225 L 270 290 Z" fill="#4a90d9" opacity="0.15"/>

  <!-- process curve -->
  <path d="M 110 130 Q 190 150 270 225" fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- state points -->
  <circle cx="110" cy="130" r="4" fill="#e0645c"/>
  <circle cx="270" cy="225" r="4" fill="#e0645c"/>
  <text x="98" y="124" fill="#e0645c">1</text>
  <text x="278" y="238" fill="#e0645c">2</text>

  <!-- V ticks -->
  <line x1="110" y1="290" x2="110" y2="295" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="270" y1="290" x2="270" y2="295" stroke="#8a8a8a" stroke-width="1"/>
  <text x="103" y="308" fill="#8a8a8a">V&#8321;</text>
  <text x="263" y="308" fill="#8a8a8a">V&#8322;</text>

  <!-- W label -->
  <text x="128" y="262" fill="#e0645c">W = &#8747;p dV</text>

  <!-- ===== right: two paths, same endpoints, different area ===== -->
  <text x="404" y="52" fill="#8a8a8a">Two paths, same 1 and 2</text>

  <!-- V axis -->
  <line x1="380" y1="290" x2="610" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="610,290 600,285 600,295" fill="#8a8a8a"/>
  <text x="614" y="295" fill="#8a8a8a">V</text>
  <!-- p axis -->
  <line x1="380" y1="290" x2="380" y2="80" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="380,80 375,90 385,90" fill="#8a8a8a"/>
  <text x="364" y="86" fill="#8a8a8a">p</text>

  <!-- path A: expand at high p, then drop p (large area) -->
  <path d="M 430 120 L 560 120 L 560 235" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="486" y="112" fill="#4a90d9">path A (more W)</text>

  <!-- path B: drop p first, then expand at low p (small area) -->
  <path d="M 430 120 L 430 235 L 560 235" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <text x="470" y="256" fill="#e0645c">path B (less W)</text>

  <!-- state points -->
  <circle cx="430" cy="120" r="4" fill="#8a8a8a"/>
  <circle cx="560" cy="235" r="4" fill="#8a8a8a"/>
  <text x="416" y="115" fill="#8a8a8a">1</text>
  <text x="566" y="248" fill="#8a8a8a">2</text>
</svg>
