<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#e0645c"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="70" y1="60" x2="70" y2="390" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="70" y1="390" x2="610" y2="390" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,52 66,64 74,64" fill="#8a8a8a"/>
  <polygon points="618,390 606,386 606,394" fill="#8a8a8a"/>
  <text x="44" y="64" fill="#8a8a8a" font-size="17" font-style="italic">T</text>
  <text x="612" y="410" fill="#8a8a8a" font-size="17" font-style="italic">v</text>
  <text x="150" y="412" fill="#8a8a8a" font-size="12">specific volume (m&#179;/kg, log-ish)</text>

  <!-- vapor dome -->
  <path d="M 150 360 C 172 250, 205 135, 300 78" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <path d="M 300 78 C 400 135, 460 250, 500 360" fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- critical point -->
  <circle cx="300" cy="78" r="4.5" fill="#4a90d9"/>
  <text x="290" y="66" fill="#4a90d9" font-size="12.5" text-anchor="middle">critical point</text>

  <!-- dome region + line labels -->
  <text x="308" y="235" fill="#8a8a8a" font-size="12.5" text-anchor="middle">two-phase</text>
  <text x="308" y="251" fill="#8a8a8a" font-size="12.5" text-anchor="middle">(liquid + vapor)</text>
  <text x="150" y="150" fill="#4a90d9" font-size="11.5" text-anchor="end">sat. liquid</text>
  <text x="150" y="164" fill="#4a90d9" font-size="11.5" text-anchor="end">line</text>
  <text x="452" y="150" fill="#4a90d9" font-size="11.5">sat. vapor</text>
  <text x="452" y="164" fill="#4a90d9" font-size="11.5">line</text>

  <!-- region labels -->
  <text x="112" y="330" fill="#8a8a8a" font-size="12.5" text-anchor="middle">compressed</text>
  <text x="112" y="346" fill="#8a8a8a" font-size="12.5" text-anchor="middle">liquid</text>
  <text x="548" y="300" fill="#8a8a8a" font-size="12.5" text-anchor="middle">superheated</text>
  <text x="548" y="316" fill="#8a8a8a" font-size="12.5" text-anchor="middle">vapor</text>

  <!-- constant-pressure heating path -->
  <path d="M 176 360 C 179 315, 181 278, 183 258 L 452 258 C 492 240, 552 178, 592 120"
        fill="none" stroke="#e0645c" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- state points on the path -->
  <circle cx="182" cy="300" r="4" fill="#e0645c"/>
  <text x="168" y="304" fill="#e0645c" font-size="11.5" text-anchor="end">1</text>
  <circle cx="183" cy="258" r="4.5" fill="#e0645c"/>
  <text x="176" y="248" fill="#e0645c" font-size="12.5" text-anchor="end">f</text>
  <circle cx="452" cy="258" r="4.5" fill="#e0645c"/>
  <text x="462" y="248" fill="#e0645c" font-size="12.5">g</text>
  <circle cx="540" cy="170" r="4" fill="#e0645c"/>
  <text x="552" y="168" fill="#e0645c" font-size="11.5">5</text>

  <!-- plateau annotation -->
  <text x="300" y="278" fill="#e0645c" font-size="11.5" text-anchor="middle">boiling: T fixed at T_sat</text>
  <text x="150" y="360" fill="#e0645c" font-size="11" text-anchor="end">const. p</text>

  <!-- T_sat gridline tick -->
  <line x1="66" y1="258" x2="70" y2="258" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="60" y="262" fill="#8a8a8a" font-size="11" text-anchor="end">T_sat</text>

  <text x="70" y="432" fill="#8a8a8a" font-size="11">T&#8211;v diagram: constant-pressure heating 1 &#8594; f &#8594; g &#8594; 5 crosses the vapor dome.</text>
</svg>
