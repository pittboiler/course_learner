<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Two ways to draw a boundary: a closed system holds fixed matter (energy in, no mass); a control volume lets mass flow through.</text>

  <!-- ===== left: closed system, piston-cylinder ===== -->
  <text x="60" y="52" fill="#8a8a8a">Closed system (control mass)</text>

  <!-- cylinder walls -->
  <line x1="70" y1="120" x2="70" y2="290" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="190" y1="120" x2="190" y2="290" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="70" y1="290" x2="190" y2="290" stroke="#8a8a8a" stroke-width="2"/>

  <!-- gas region (fixed mass) -->
  <rect x="70" y="200" width="120" height="90" fill="#4a90d9" opacity="0.13"/>
  <text x="104" y="252" fill="#4a90d9">fixed mass m</text>

  <!-- system boundary (moves with piston face) -->
  <rect x="70" y="200" width="120" height="90" fill="none" stroke="#e0645c" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- piston -->
  <rect x="72" y="184" width="116" height="16" fill="#8a8a8a" opacity="0.35" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="130" y1="184" x2="130" y2="150" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="112" y1="150" x2="148" y2="150" stroke="#8a8a8a" stroke-width="2"/>

  <!-- moving boundary arrows (piston can travel up/down) -->
  <line x1="220" y1="176" x2="220" y2="208" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="220,170 216,180 224,180" fill="#8a8a8a"/>
  <polygon points="220,214 216,204 224,204" fill="#8a8a8a"/>
  <text x="228" y="196" fill="#8a8a8a">moving</text>
  <text x="228" y="212" fill="#8a8a8a">boundary</text>

  <!-- heat in (energy crosses, mass does not) -->
  <line x1="100" y1="320" x2="100" y2="292" stroke="#e0645c" stroke-width="2"/>
  <polygon points="100,290 95,300 105,300" fill="#e0645c"/>
  <text x="60" y="334" fill="#e0645c">heat Q in (no mass)</text>

  <!-- ===== right: control volume, turbine ===== -->
  <text x="400" y="52" fill="#8a8a8a">Control volume (open system)</text>

  <!-- turbine trapezoid -->
  <polygon points="420,150 560,120 560,270 420,240" fill="#4a90d9" opacity="0.13" stroke="#4a90d9" stroke-width="2"/>
  <text x="458" y="200" fill="#4a90d9">turbine</text>

  <!-- control surface (dashed boundary enclosing turbine) -->
  <rect x="400" y="108" width="180" height="176" fill="none" stroke="#e0645c" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- mass in arrow (crosses boundary) -->
  <line x1="360" y1="168" x2="418" y2="168" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="424,168 412,163 412,173" fill="#e0645c"/>
  <text x="342" y="158" fill="#e0645c">mass in</text>

  <!-- mass out arrow (crosses boundary) -->
  <line x1="562" y1="222" x2="618" y2="222" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="624,222 612,217 612,227" fill="#e0645c"/>
  <text x="588" y="212" fill="#e0645c">mass out</text>

  <!-- shaft work out -->
  <line x1="490" y1="118" x2="490" y2="90" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="490,86 486,96 494,96" fill="#4a90d9"/>
  <text x="452" y="82" fill="#4a90d9">shaft work out</text>
</svg>
