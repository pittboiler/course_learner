<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">On a p&#8211;h diagram the vapor-compression cycle is almost a rectangle: up (compress), left (condense), down (throttle), right (evaporate).</text>

  <!-- x axis: enthalpy -->
  <line x1="60" y1="288" x2="562" y2="288" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="562,288 552,283 552,293" fill="#8a8a8a"/>
  <text x="540" y="308" fill="#8a8a8a">h &#8594;</text>
  <!-- y axis: pressure -->
  <line x1="60" y1="288" x2="60" y2="54" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="60,54 55,64 65,64" fill="#8a8a8a"/>
  <text x="46" y="64" fill="#8a8a8a">p</text>

  <!-- vapor dome (saturated liquid up to critical, then saturated vapor down) -->
  <path d="M 205 278 C 238 205, 278 135, 300 102 C 324 135, 372 212, 432 278"
        fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="300" cy="102" r="3" fill="#8a8a8a"/>
  <text x="256" y="96" fill="#8a8a8a" font-size="12">critical pt</text>
  <text x="150" y="200" fill="#8a8a8a" font-size="12">liquid</text>
  <text x="248" y="240" fill="#8a8a8a" font-size="12">liquid + vapor</text>
  <text x="452" y="200" fill="#8a8a8a" font-size="12">vapor</text>

  <!-- pressure levels (dashed) -->
  <line x1="66" y1="130" x2="470" y2="130" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="66" y="124" fill="#8a8a8a" font-size="12">800 kPa (condenser)</text>
  <line x1="66" y1="232" x2="470" y2="232" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="66" y="248" fill="#8a8a8a" font-size="12">120 kPa (evaporator)</text>

  <!-- the cycle: 1 -> 2 -> 3 -> 4 -> 1 -->
  <path d="M 418 232 L 432 130 L 272 130 L 272 232 Z"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- state points -->
  <circle cx="418" cy="232" r="4" fill="#4a90d9"/>
  <text x="424" y="228" fill="#4a90d9">1</text>
  <circle cx="432" cy="130" r="4" fill="#4a90d9"/>
  <text x="438" y="126" fill="#4a90d9">2</text>
  <circle cx="272" cy="130" r="4" fill="#4a90d9"/>
  <text x="256" y="126" fill="#4a90d9">3</text>
  <circle cx="272" cy="232" r="4" fill="#4a90d9"/>
  <text x="256" y="248" fill="#4a90d9">4</text>

  <!-- q_H rejected at condenser (top, arrow out/up) -->
  <line x1="352" y1="130" x2="352" y2="98" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="352,96 347,106 357,106" fill="#e0645c"/>
  <text x="360" y="108" fill="#e0645c">q_H out</text>

  <!-- q_L absorbed at evaporator (bottom, arrow in/up) -->
  <line x1="345" y1="264" x2="345" y2="234" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="345,232 340,242 350,242" fill="#e0645c"/>
  <text x="352" y="278" fill="#e0645c">q_L in (cooling)</text>

  <!-- w_in at compressor -->
  <line x1="470" y1="205" x2="470" y2="160" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="470,158 465,168 475,168" fill="#e0645c"/>
  <text x="478" y="188" fill="#e0645c">w_in</text>
</svg>
