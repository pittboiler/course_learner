<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#e0645c"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="80" y1="55" x2="80" y2="390" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="80" y1="390" x2="610" y2="390" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="80,47 76,59 84,59" fill="#8a8a8a"/>
  <polygon points="618,390 606,386 606,394" fill="#8a8a8a"/>
  <text x="54" y="60" fill="#8a8a8a" font-size="17" font-style="italic">T</text>
  <text x="614" y="410" fill="#8a8a8a" font-size="17" font-style="italic">s</text>
  <text x="470" y="412" fill="#8a8a8a" font-size="12">specific entropy (kJ/kg&#183;K)</text>

  <!-- Q_H shading under the top isotherm, down to T = 0 -->
  <rect x="235" y="165" width="165" height="225" fill="#e0645c" opacity="0.13"/>
  <text x="317" y="360" fill="#e0645c" font-size="12.5" text-anchor="middle">Q_H = T_H &#916;s</text>
  <text x="317" y="376" fill="#e0645c" font-size="11" text-anchor="middle">(area under top isotherm)</text>

  <!-- vapor dome -->
  <path d="M 150 360 C 178 250, 235 130, 305 98" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <path d="M 305 98 C 390 140, 452 255, 488 360" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="305" cy="98" r="4.5" fill="#4a90d9"/>
  <text x="305" y="88" fill="#4a90d9" font-size="12" text-anchor="middle">critical point</text>
  <text x="200" y="205" fill="#4a90d9" font-size="11.5" text-anchor="end">sat. liquid</text>
  <text x="452" y="205" fill="#4a90d9" font-size="11.5">sat. vapor</text>
  <text x="360" y="300" fill="#8a8a8a" font-size="12" text-anchor="middle">vapor dome</text>

  <!-- Carnot cycle: two isotherms + two isentropes = a rectangle -->
  <line x1="235" y1="165" x2="400" y2="165" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="235" y1="290" x2="400" y2="290" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="235" y1="165" x2="235" y2="290" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="400" y1="165" x2="400" y2="290" stroke="#e0645c" stroke-width="2.5"/>

  <!-- direction arrows around the loop -->
  <line x1="300" y1="165" x2="345" y2="165" stroke="#e0645c" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="345" y1="290" x2="300" y2="290" stroke="#e0645c" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- net work label inside the rectangle -->
  <text x="317" y="223" fill="#e0645c" font-size="12" text-anchor="middle">W_net =</text>
  <text x="317" y="240" fill="#e0645c" font-size="12" text-anchor="middle">enclosed area</text>

  <!-- isotherm / isentrope callouts -->
  <text x="230" y="158" fill="#e0645c" font-size="11" text-anchor="end">T_H (heat in)</text>
  <text x="405" y="305" fill="#e0645c" font-size="11">T_L (heat out)</text>

  <!-- temperature ticks -->
  <line x1="76" y1="165" x2="80" y2="165" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="70" y="169" fill="#8a8a8a" font-size="11" text-anchor="end">T_H</text>
  <line x1="76" y1="290" x2="80" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="70" y="294" fill="#8a8a8a" font-size="11" text-anchor="end">T_L</text>

  <!-- entropy ticks + delta-s bracket -->
  <line x1="235" y1="390" x2="235" y2="394" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="235" y="407" fill="#8a8a8a" font-size="11" text-anchor="middle">s_1</text>
  <line x1="400" y1="390" x2="400" y2="394" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="400" y="407" fill="#8a8a8a" font-size="11" text-anchor="middle">s_2</text>

  <text x="80" y="432" fill="#8a8a8a" font-size="11">On T&#8211;s axes a Carnot cycle is a rectangle: area under a reversible path is heat; the enclosed area is net work.</text>
</svg>
