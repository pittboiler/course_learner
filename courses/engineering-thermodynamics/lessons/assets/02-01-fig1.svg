<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Energy that crosses the boundary is booked: heat in minus work out equals what stays stored inside.</text>

  <!-- ===== left: the system with energy streams ===== -->

  <!-- W out arrow (leaves the top) -->
  <line x1="130" y1="150" x2="130" y2="104" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="130,98 124,110 136,110" fill="#e0645c"/>
  <text x="146" y="112" fill="#e0645c">W out = 40 kJ</text>

  <!-- system box (stores internal energy) -->
  <rect x="70" y="150" width="120" height="110" fill="#4a90d9" opacity="0.13"/>
  <rect x="70" y="150" width="120" height="110" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="98" y="198" fill="#4a90d9">system</text>
  <text x="82" y="222" fill="#4a90d9">&#916;U = +60 kJ</text>

  <!-- Q in arrow (enters the bottom) -->
  <line x1="130" y1="308" x2="130" y2="262" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="130,256 124,268 136,268" fill="#e0645c"/>
  <text x="146" y="292" fill="#e0645c">Q in = 100 kJ</text>

  <!-- ===== right: the accounting bars ===== -->

  <!-- baseline -->
  <line x1="360" y1="300" x2="600" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- Q bar: 100 kJ at 2 px/kJ = 200 px tall -->
  <rect x="380" y="100" width="70" height="200" fill="#e0645c" opacity="0.30"/>
  <rect x="380" y="100" width="70" height="200" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="392" y="90" fill="#e0645c">Q = 100</text>
  <text x="404" y="318" fill="#8a8a8a">in</text>

  <!-- equals sign -->
  <text x="468" y="206" fill="#8a8a8a" font-size="22">=</text>

  <!-- stacked bar: DeltaU = 60 (blue, bottom 120 px) + W = 40 (coral, top 80 px) -->
  <rect x="510" y="180" width="70" height="120" fill="#4a90d9" opacity="0.30"/>
  <rect x="510" y="180" width="70" height="120" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="519" y="246" fill="#4a90d9">&#916;U = 60</text>

  <rect x="510" y="100" width="70" height="80" fill="#e0645c" opacity="0.30"/>
  <rect x="510" y="100" width="70" height="80" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="522" y="146" fill="#e0645c">W = 40</text>

  <text x="516" y="318" fill="#8a8a8a">stored + out</text>
</svg>
