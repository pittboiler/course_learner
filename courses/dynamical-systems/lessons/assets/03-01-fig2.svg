<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="300" fill="#ffffff"/>
  <defs>
    <marker id="up" markerWidth="12" markerHeight="12" refX="5" refY="2" orient="0">
      <path d="M0,8 L5,0 L10,8 Z" fill="#111111"/>
    </marker>
    <marker id="dn" markerWidth="12" markerHeight="12" refX="5" refY="6" orient="0">
      <path d="M0,0 L5,8 L10,0 Z" fill="#111111"/>
    </marker>
  </defs>

  <text x="280" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Phase line of  x&#775; = &#956; + x&#178;   (arrows = flow direction)</text>

  <!-- ===== Column 1: mu < 0  (x=120) : two fixed points ===== -->
  <line x1="120" y1="255" x2="120" y2="55" stroke="#111111" stroke-width="1.3"/>
  <text x="120" y="278" text-anchor="middle" font-size="13" fill="#111111">&#956; &lt; 0</text>
  <!-- fixed points at x*=+/-0.707 -> y = 150 -/+ 63.6 -->
  <!-- upper f.p. (unstable, open circle) at y=86 -->
  <circle cx="120" cy="86" r="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
  <!-- lower f.p. (stable, filled) at y=214 -->
  <circle cx="120" cy="214" r="6" fill="#1a6feb" stroke="#1a6feb"/>
  <!-- flow arrows: above upper -> up (away); between -> down (toward lower); below lower -> up (toward lower) -->
  <line x1="120" y1="78" x2="120" y2="62" stroke="#111111" stroke-width="1.6" marker-end="url(#up)"/>
  <line x1="120" y1="140" x2="120" y2="156" stroke="#111111" stroke-width="1.6" marker-end="url(#dn)"/>
  <line x1="120" y1="248" x2="120" y2="232" stroke="#111111" stroke-width="1.6" marker-end="url(#up)"/>

  <!-- ===== Column 2: mu = 0  (x=300) : one half-stable point ===== -->
  <line x1="300" y1="255" x2="300" y2="55" stroke="#111111" stroke-width="1.3"/>
  <text x="300" y="278" text-anchor="middle" font-size="13" fill="#111111">&#956; = 0</text>
  <!-- single f.p. at x*=0 -> y=150 : semi-stable (half filled) -->
  <path d="M300,144 a6,6 0 0,1 0,12 Z" fill="#1a6feb"/>
  <path d="M300,144 a6,6 0 0,0 0,12 Z" fill="#ffffff"/>
  <circle cx="300" cy="150" r="6" fill="none" stroke="#7a3fa0" stroke-width="1.6"/>
  <!-- flow: everywhere upward (xdot=x^2>=0) -->
  <line x1="300" y1="142" x2="300" y2="122" stroke="#111111" stroke-width="1.6" marker-end="url(#up)"/>
  <line x1="300" y1="238" x2="300" y2="218" stroke="#111111" stroke-width="1.6" marker-end="url(#up)"/>
  <text x="300" y="248" text-anchor="middle" font-size="10.5" fill="#7a3fa0">half-stable</text>

  <!-- ===== Column 3: mu > 0  (x=480) : no fixed point ===== -->
  <line x1="480" y1="255" x2="480" y2="55" stroke="#111111" stroke-width="1.3"/>
  <text x="480" y="278" text-anchor="middle" font-size="13" fill="#111111">&#956; &gt; 0</text>
  <!-- no fixed point: flow always upward -->
  <line x1="480" y1="235" x2="480" y2="215" stroke="#111111" stroke-width="1.6" marker-end="url(#up)"/>
  <line x1="480" y1="175" x2="480" y2="155" stroke="#111111" stroke-width="1.6" marker-end="url(#up)"/>
  <line x1="480" y1="115" x2="480" y2="95" stroke="#111111" stroke-width="1.6" marker-end="url(#up)"/>
  <text x="480" y="248" text-anchor="middle" font-size="10.5" fill="#333333">no fixed point</text>

  <text x="280" y="298" text-anchor="middle" font-size="10.5" fill="#555555">filled = stable &#160;&#160; open = unstable &#160;&#160; the two points merge at &#956;=0 and annihilate</text>
</svg>
