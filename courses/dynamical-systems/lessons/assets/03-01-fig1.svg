<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="340" fill="#ffffff"/>
  <defs>
    <marker id="ax" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
  </defs>

  <!-- ================= Panel A: saddle-node ================= -->
  <text x="180" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Saddle-node:  x&#775; = &#956; + x&#178;</text>

  <!-- axes: mu=0 at x=250, x*=0 at y=185 -->
  <line x1="45" y1="185" x2="330" y2="185" stroke="#111111" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="250" y1="315" x2="250" y2="45" stroke="#111111" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="335" y="189" font-size="13" fill="#111111">&#956;</text>
  <text x="256" y="52" font-size="13" fill="#111111">x*</text>
  <text x="255" y="200" font-size="11" fill="#555555">0</text>

  <!-- lower branch (x*<0): STABLE, solid -->
  <path d="M250,185 L242.1,207.5 L218.3,230 L178.7,252.5 L123.3,275 L61.5,294.8"
        fill="none" stroke="#1a6feb" stroke-width="2.6"/>
  <!-- upper branch (x*>0): UNSTABLE, dashed -->
  <path d="M250,185 L242.1,162.5 L218.3,140 L178.7,117.5 L123.3,95 L61.5,75.2"
        fill="none" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="6 5"/>

  <text x="95" y="290" font-size="11" fill="#1a6feb">stable</text>
  <text x="95" y="88" font-size="11" fill="#c0392b">unstable</text>
  <text x="150" y="330" text-anchor="middle" font-size="11.5" fill="#333333">two f.p. for &#956;&lt;0, collide at 0, none for &#956;&gt;0</text>

  <!-- ================= Panel B: transcritical ================= -->
  <text x="545" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Transcritical:  x&#775; = &#956;x &#8722; x&#178;</text>

  <!-- axes: mu=0 at x=545, x*=0 at y=185 -->
  <line x1="405" y1="185" x2="695" y2="185" stroke="#111111" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="545" y1="315" x2="545" y2="45" stroke="#111111" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="700" y="189" font-size="13" fill="#111111">&#956;</text>
  <text x="551" y="52" font-size="13" fill="#111111">x*</text>
  <text x="550" y="200" font-size="11" fill="#555555">0</text>

  <!-- horizontal branch x*=0 : stable for mu<0 (solid), unstable for mu>0 (dashed) -->
  <line x1="410" y1="185" x2="545" y2="185" stroke="#1a6feb" stroke-width="2.6"/>
  <line x1="545" y1="185" x2="680" y2="185" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="6 5"/>
  <!-- diagonal branch x*=mu : unstable for mu<0 (dashed), stable for mu>0 (solid) -->
  <line x1="428" y1="302" x2="545" y2="185" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="6 5"/>
  <line x1="545" y1="185" x2="662" y2="68" stroke="#1a6feb" stroke-width="2.6"/>

  <text x="452" y="178" font-size="11" fill="#1a6feb">x*=0 stable</text>
  <text x="590" y="178" font-size="11" fill="#c0392b">x*=0 unstable</text>
  <text x="590" y="98" font-size="11" fill="#1a6feb">x*=&#956;</text>
  <text x="545" y="330" text-anchor="middle" font-size="11.5" fill="#333333">branches cross &amp; swap stability; neither vanishes</text>
</svg>
