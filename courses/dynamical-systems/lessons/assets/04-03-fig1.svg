<svg viewBox="0 0 660 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="660" height="420" fill="#ffffff"/>

  <!-- =============== TITLES =============== -->
  <text x="30" y="34" font-size="15" fill="#111111" font-weight="bold">One baker step: stretch, cut, and stack back into the square</text>
  <text x="30" y="222" font-size="15" fill="#111111" font-weight="bold">Iterate: the vertical cross-section becomes ever finer layering (fractal)</text>

  <!-- =============== ROW 1: one baker step =============== -->

  <!-- Panel A: original square, split left/right -->
  <rect x="40" y="60"  width="50" height="100" fill="#f4a259"/>
  <rect x="90" y="60"  width="50" height="100" fill="#5b8def"/>
  <rect x="40" y="60"  width="100" height="100" fill="none" stroke="#111111" stroke-width="1.5"/>
  <text x="62" y="178" font-size="12" fill="#111111">start</text>

  <!-- arrow: stretch -->
  <line x1="150" y1="110" x2="192" y2="110" stroke="#111111" stroke-width="1.6"/>
  <polygon points="192,105 202,110 192,115" fill="#111111"/>
  <text x="146" y="98" font-size="11" fill="#111111">stretch &#215;2 wide,</text>
  <text x="150" y="132" font-size="11" fill="#111111">squash &#189; tall</text>

  <!-- Panel B: stretched bar (2 wide, 0.5 tall) -->
  <rect x="212" y="85" width="80" height="50" fill="#f4a259"/>
  <rect x="292" y="85" width="80" height="50" fill="#5b8def"/>
  <rect x="212" y="85" width="160" height="50" fill="none" stroke="#111111" stroke-width="1.5"/>
  <line x1="292" y1="80" x2="292" y2="140" stroke="#111111" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="278" y="76" font-size="11" fill="#111111">cut</text>

  <!-- arrow: cut + stack -->
  <line x1="382" y1="110" x2="424" y2="110" stroke="#111111" stroke-width="1.6"/>
  <polygon points="424,105 434,110 424,115" fill="#111111"/>
  <text x="380" y="98" font-size="11" fill="#111111">stack right</text>
  <text x="380" y="132" font-size="11" fill="#111111">half on top</text>

  <!-- Panel C: square with 2 layers -->
  <rect x="444" y="110" width="100" height="50" fill="#f4a259"/>
  <rect x="444" y="60"  width="100" height="50" fill="#5b8def"/>
  <rect x="444" y="60"  width="100" height="100" fill="none" stroke="#111111" stroke-width="1.5"/>
  <text x="452" y="178" font-size="12" fill="#111111">2 layers</text>

  <!-- =============== ROW 2: iteration builds layers =============== -->

  <!-- 2 layers -->
  <rect x="60"  y="290" width="100" height="50" fill="#f4a259"/>
  <rect x="60"  y="240" width="100" height="50" fill="#5b8def"/>
  <rect x="60"  y="240" width="100" height="100" fill="none" stroke="#111111" stroke-width="1.5"/>
  <text x="88"  y="358" font-size="12" fill="#111111">n = 1</text>

  <!-- arrow -->
  <line x1="172" y1="290" x2="220" y2="290" stroke="#111111" stroke-width="1.6"/>
  <polygon points="220,285 230,290 220,295" fill="#111111"/>

  <!-- 4 layers (alternating, from bottom: O B O B) -->
  <rect x="270" y="315" width="100" height="25" fill="#f4a259"/>
  <rect x="270" y="290" width="100" height="25" fill="#5b8def"/>
  <rect x="270" y="265" width="100" height="25" fill="#f4a259"/>
  <rect x="270" y="240" width="100" height="25" fill="#5b8def"/>
  <rect x="270" y="240" width="100" height="100" fill="none" stroke="#111111" stroke-width="1.5"/>
  <text x="298" y="358" font-size="12" fill="#111111">n = 2</text>

  <!-- arrow -->
  <line x1="382" y1="290" x2="430" y2="290" stroke="#111111" stroke-width="1.6"/>
  <polygon points="430,285 440,290 430,295" fill="#111111"/>

  <!-- 8 layers -->
  <rect x="480" y="327.5" width="100" height="12.5" fill="#f4a259"/>
  <rect x="480" y="315"   width="100" height="12.5" fill="#5b8def"/>
  <rect x="480" y="302.5" width="100" height="12.5" fill="#f4a259"/>
  <rect x="480" y="290"   width="100" height="12.5" fill="#5b8def"/>
  <rect x="480" y="277.5" width="100" height="12.5" fill="#f4a259"/>
  <rect x="480" y="265"   width="100" height="12.5" fill="#5b8def"/>
  <rect x="480" y="252.5" width="100" height="12.5" fill="#f4a259"/>
  <rect x="480" y="240"   width="100" height="12.5" fill="#5b8def"/>
  <rect x="480" y="240" width="100" height="100" fill="none" stroke="#111111" stroke-width="1.5"/>
  <text x="508" y="358" font-size="12" fill="#111111">n = 3</text>

  <text x="60" y="388" font-size="12" fill="#555555">Area is preserved by each panel here; a dissipative flow also &#8722; contracts total volume, so the layers thin toward a zero-volume fractal set.</text>
</svg>
