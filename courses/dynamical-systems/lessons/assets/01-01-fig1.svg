<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="520" height="340" fill="#ffffff"/>

  <!-- axes -->
  <line x1="55" y1="200" x2="470" y2="200" stroke="#111111" stroke-width="1.5"/>
  <line x1="260" y1="95" x2="260" y2="300" stroke="#999999" stroke-width="1"/>
  <text x="474" y="205" font-size="15" fill="#111111" font-style="italic">x</text>
  <text x="266" y="106" font-size="15" fill="#555555" font-style="italic">f(x)</text>

  <!-- graph of f(x) = x - x^3 -->
  <polyline fill="none" stroke="#1d4ed8" stroke-width="2.5"
    points="71,117 92,160 120,200 148,222 179,229 204,225 232,214 260,200 288,186 316,175 341,171 372,178 400,200 428,240 449,283"/>
  <text x="300" y="150" font-size="14" fill="#1d4ed8" font-style="italic">f(x) = x - x&#179;</text>

  <!-- flow arrows on the phase line (y = 200) -->
  <!-- x < -1 : flow right (toward -1) -->
  <line x1="78" y1="200" x2="102" y2="200" stroke="#b91c1c" stroke-width="2"/>
  <polygon points="102,194 114,200 102,206" fill="#b91c1c"/>
  <!-- -1 < x < 0 : flow left (toward -1) -->
  <line x1="202" y1="200" x2="178" y2="200" stroke="#b91c1c" stroke-width="2"/>
  <polygon points="178,194 166,200 178,206" fill="#b91c1c"/>
  <!-- 0 < x < 1 : flow right (toward 1) -->
  <line x1="312" y1="200" x2="336" y2="200" stroke="#b91c1c" stroke-width="2"/>
  <polygon points="336,194 348,200 336,206" fill="#b91c1c"/>
  <!-- x > 1 : flow left (toward 1) -->
  <line x1="448" y1="200" x2="424" y2="200" stroke="#b91c1c" stroke-width="2"/>
  <polygon points="424,194 412,200 424,206" fill="#b91c1c"/>

  <!-- fixed points: stable = filled, unstable = open -->
  <circle cx="120" cy="200" r="6" fill="#111111"/>
  <circle cx="260" cy="200" r="6" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <circle cx="400" cy="200" r="6" fill="#111111"/>

  <text x="103" y="228" font-size="13" fill="#111111">x*=&#8722;1</text>
  <text x="248" y="228" font-size="13" fill="#111111">x*=0</text>
  <text x="388" y="228" font-size="13" fill="#111111">x*=1</text>

  <text x="86" y="252" font-size="11" fill="#166534">stable</text>
  <text x="235" y="252" font-size="11" fill="#b91c1c">unstable</text>
  <text x="372" y="252" font-size="11" fill="#166534">stable</text>
</svg>
