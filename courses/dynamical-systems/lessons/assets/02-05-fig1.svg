<svg viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ahRed" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#c0392b"/>
    </marker>
    <marker id="ahBlue" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#1f6fb2"/>
    </marker>
    <marker id="ahGrey" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#555555"/>
    </marker>
  </defs>

  <!-- ================= LEFT: SADDLE ================= -->
  <text x="170" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Saddle</text>
  <text x="170" y="54" text-anchor="middle" font-size="13" fill="#333333">field turns once CLOCKWISE</text>

  <!-- traversal loop C (grey dashed) -->
  <circle cx="170" cy="200" r="90" fill="none" stroke="#777777" stroke-width="1.6" stroke-dasharray="5 4"/>
  <!-- CCW traversal indicator arc -->
  <path d="M 245 151 A 92 92 0 0 0 200 118" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#ahGrey)"/>
  <text x="250" y="128" font-size="11" fill="#555555">traverse C ↺</text>
  <!-- fixed point -->
  <circle cx="170" cy="200" r="4.5" fill="#111111"/>

  <!-- field arrows: f=(x,-y), tail on circle, screen dir (cos,sin) -->
  <line x1="260" y1="200" x2="294" y2="200" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ahRed)"/>
  <line x1="233.6" y1="136.4" x2="257.6" y2="160.4" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ahRed)"/>
  <line x1="170" y1="110" x2="170" y2="144" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ahRed)"/>
  <line x1="106.4" y1="136.4" x2="82.4" y2="160.4" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ahRed)"/>
  <line x1="80" y1="200" x2="46" y2="200" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ahRed)"/>
  <line x1="106.4" y1="263.6" x2="82.4" y2="239.6" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ahRed)"/>
  <line x1="170" y1="290" x2="170" y2="256" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ahRed)"/>
  <line x1="233.6" y1="263.6" x2="257.6" y2="239.6" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ahRed)"/>

  <text x="170" y="410" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">index = &#8722;1</text>

  <!-- ================= RIGHT: NODE / SPIRAL / CENTER ================= -->
  <text x="500" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Node / spiral / center</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#333333">field turns once COUNTERCLOCKWISE</text>

  <circle cx="500" cy="200" r="90" fill="none" stroke="#777777" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M 575 151 A 92 92 0 0 0 530 118" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#ahGrey)"/>
  <text x="580" y="128" font-size="11" fill="#555555">traverse C ↺</text>
  <circle cx="500" cy="200" r="4.5" fill="#111111"/>

  <!-- field arrows: f=(x,y) radial-out, screen dir (cos,-sin) -->
  <line x1="590" y1="200" x2="624" y2="200" stroke="#1f6fb2" stroke-width="2.4" marker-end="url(#ahBlue)"/>
  <line x1="563.6" y1="136.4" x2="587.6" y2="112.4" stroke="#1f6fb2" stroke-width="2.4" marker-end="url(#ahBlue)"/>
  <line x1="500" y1="110" x2="500" y2="76" stroke="#1f6fb2" stroke-width="2.4" marker-end="url(#ahBlue)"/>
  <line x1="436.4" y1="136.4" x2="412.4" y2="112.4" stroke="#1f6fb2" stroke-width="2.4" marker-end="url(#ahBlue)"/>
  <line x1="410" y1="200" x2="376" y2="200" stroke="#1f6fb2" stroke-width="2.4" marker-end="url(#ahBlue)"/>
  <line x1="436.4" y1="263.6" x2="412.4" y2="287.6" stroke="#1f6fb2" stroke-width="2.4" marker-end="url(#ahBlue)"/>
  <line x1="500" y1="290" x2="500" y2="324" stroke="#1f6fb2" stroke-width="2.4" marker-end="url(#ahBlue)"/>
  <line x1="563.6" y1="263.6" x2="587.6" y2="287.6" stroke="#1f6fb2" stroke-width="2.4" marker-end="url(#ahBlue)"/>

  <text x="500" y="410" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f6fb2">index = +1</text>
</svg>
