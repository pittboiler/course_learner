<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="480" fill="#ffffff"/>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b91c1c"/>
    </marker>
    <marker id="ak" markerWidth="12" markerHeight="12" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- panel frames -->
  <rect x="35" y="45" width="230" height="165" rx="6" fill="none" stroke="#dddddd" stroke-width="1"/>
  <rect x="375" y="45" width="230" height="165" rx="6" fill="none" stroke="#dddddd" stroke-width="1"/>
  <rect x="35" y="255" width="230" height="175" rx="6" fill="none" stroke="#dddddd" stroke-width="1"/>
  <rect x="375" y="255" width="230" height="175" rx="6" fill="none" stroke="#dddddd" stroke-width="1"/>

  <!-- row headings -->
  <text x="35" y="30" font-size="15" fill="#166534" font-weight="bold">Structurally STABLE  —  a saddle (hyperbolic)</text>
  <text x="35" y="245" font-size="15" fill="#b91c1c" font-weight="bold">Structurally UNSTABLE  —  a center (non-hyperbolic)</text>

  <!-- ============ Panel A: saddle, center (150,120) ============ -->
  <line x1="60" y1="120" x2="240" y2="120" stroke="#111111" stroke-width="1"/>
  <line x1="150" y1="55" x2="150" y2="195" stroke="#111111" stroke-width="1"/>
  <!-- trajectory branches -->
  <path d="M165,58 C165,105 175,112 232,112" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M165,182 C165,135 175,128 232,128" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M135,58 C135,105 125,112 68,112" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M135,182 C135,135 125,128 68,128" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/>
  <!-- inward arrows along stable manifold -->
  <line x1="150" y1="58" x2="150" y2="90" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="150" y1="182" x2="150" y2="150" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ar)"/>
  <circle cx="150" cy="120" r="5" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="150" y="205" font-size="13" fill="#111111" text-anchor="middle">saddle</text>

  <!-- ============ Panel B: perturbed saddle, tilted, center (490,128) ============ -->
  <g transform="rotate(9 490 128)">
    <line x1="400" y1="128" x2="580" y2="128" stroke="#111111" stroke-width="1"/>
    <line x1="490" y1="63" x2="490" y2="203" stroke="#111111" stroke-width="1"/>
    <path d="M505,66 C505,113 515,120 572,120" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M505,190 C505,143 515,136 572,136" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M475,66 C475,113 465,120 408,120" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M475,190 C475,143 465,136 408,136" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="490" y1="66" x2="490" y2="98" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="490" y1="190" x2="490" y2="158" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ar)"/>
    <circle cx="490" cy="128" r="5" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  </g>
  <text x="490" y="205" font-size="13" fill="#111111" text-anchor="middle">still a saddle (just tilted/shifted)</text>

  <!-- perturb arrow, top row -->
  <line x1="278" y1="123" x2="360" y2="123" stroke="#111111" stroke-width="1.5" marker-end="url(#ak)"/>
  <text x="319" y="114" font-size="12" fill="#111111" text-anchor="middle">perturb</text>

  <!-- ============ Panel C: center, center (150,340) ============ -->
  <ellipse cx="150" cy="340" rx="30" ry="22" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <ellipse cx="150" cy="340" rx="55" ry="40" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <ellipse cx="150" cy="340" rx="80" ry="58" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <!-- rotation arrows (closed orbits) -->
  <line x1="162" y1="300" x2="138" y2="300" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="138" y1="380" x2="162" y2="380" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ar)"/>
  <circle cx="150" cy="340" r="5" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="150" y="425" font-size="13" fill="#111111" text-anchor="middle">center: closed orbits</text>

  <!-- ============ Panel D: stable spiral, center (490,340) ============ -->
  <path d="M570,340 A70,70 0 0 0 430,340 A52,52 0 0 0 534,340 A38,38 0 0 0 458,340 A27,27 0 0 0 512,340 A18,18 0 0 0 476,340 A11,11 0 0 0 498,340 A6,6 0 0 0 486,340"
        fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="490" cy="340" r="5" fill="#111111"/>
  <text x="490" y="425" font-size="13" fill="#111111" text-anchor="middle">spiral: orbits decay inward</text>

  <!-- perturb arrow, bottom row -->
  <line x1="278" y1="343" x2="360" y2="343" stroke="#111111" stroke-width="1.5" marker-end="url(#ak)"/>
  <text x="319" y="334" font-size="12" fill="#111111" text-anchor="middle">perturb</text>
  <text x="319" y="360" font-size="11" fill="#b91c1c" text-anchor="middle">topology</text>
  <text x="319" y="373" font-size="11" fill="#b91c1c" text-anchor="middle">changed!</text>
</svg>
