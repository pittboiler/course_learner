<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="380" fill="#ffffff"/>

  <!-- title -->
  <text x="280" y="28" font-size="15" fill="#111111" text-anchor="middle">Supercritical pitchfork:  &#7819; = &#956;x &#8722; x&#179;</text>

  <!-- mu-axis -->
  <line x1="60" y1="190" x2="525" y2="190" stroke="#111111" stroke-width="1.5"/>
  <polygon points="525,190 515,185 515,195" fill="#111111"/>
  <text x="530" y="195" font-size="15" fill="#111111" font-style="italic">&#956;</text>

  <!-- x*-axis -->
  <line x1="280" y1="52" x2="280" y2="340" stroke="#999999" stroke-width="1"/>
  <text x="286" y="52" font-size="14" fill="#555555" font-style="italic">x*</text>
  <text x="255" y="205" font-size="12" fill="#555555">0</text>

  <!-- x*=0 branch: stable for mu<0 (solid green) -->
  <line x1="80" y1="190" x2="280" y2="190" stroke="#15803d" stroke-width="2.6"/>
  <!-- x*=0 branch: unstable for mu>0 (dashed red) -->
  <line x1="280" y1="190" x2="505" y2="190" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="7 5"/>

  <!-- upper stable branch x* = +sqrt(mu) -->
  <polyline fill="none" stroke="#15803d" stroke-width="2.6"
    points="280,190 285.3,170.8 301.3,151.6 327.9,132.4 365.2,113.2 413.2,94 456.2,79.6 505.1,65.2"/>
  <!-- lower stable branch x* = -sqrt(mu) -->
  <polyline fill="none" stroke="#15803d" stroke-width="2.6"
    points="280,190 285.3,209.2 301.3,228.4 327.9,247.6 365.2,266.8 413.2,286 456.2,300.4 505.1,314.8"/>

  <!-- flow arrows (mu>0 slice): pushed away from x*=0 toward the stable branches -->
  <line x1="432" y1="150" x2="432" y2="114" stroke="#777777" stroke-width="1.6"/>
  <polygon points="432,110 427,120 437,120" fill="#777777"/>
  <line x1="432" y1="230" x2="432" y2="266" stroke="#777777" stroke-width="1.6"/>
  <polygon points="432,270 427,260 437,260" fill="#777777"/>

  <!-- branch labels -->
  <text x="452" y="58" font-size="13" fill="#15803d">x* = +&#8730;&#956;  (stable)</text>
  <text x="452" y="328" font-size="13" fill="#15803d">x* = &#8722;&#8730;&#956;  (stable)</text>
  <text x="120" y="180" font-size="12" fill="#15803d">x*=0 stable</text>
  <text x="322" y="182" font-size="12" fill="#b91c1c">x*=0 unstable</text>

  <!-- legend -->
  <line x1="70" y1="300" x2="105" y2="300" stroke="#15803d" stroke-width="2.6"/>
  <text x="110" y="304" font-size="12" fill="#111111">solid = stable</text>
  <line x1="70" y1="322" x2="105" y2="322" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="110" y="326" font-size="12" fill="#111111">dashed = unstable</text>
</svg>
