  <polygon points="188.7,264.1 197.4,258.8 198.8,265.8" fill="#b91c1c"/>
  <polygon points="164.1,114.4 154.2,117.4 154.7,110.2" fill="#b91c1c"/>

  <!-- stable fixed point (filled) -->
  <circle cx="165" cy="180" r="5.5" fill="#111111"/>

  <text x="165" y="300" font-size="13" fill="#111111" text-anchor="middle">&#956; &lt; 0</text>
  <text x="165" y="318" font-size="12" fill="#166534" text-anchor="middle">stable spiral &#8594; rest</text>

  <!-- arrow between panels -->
  <line x1="292" y1="180" x2="348" y2="180" stroke="#111111" stroke-width="1.5"/>
  <polygon points="348,174 360,180 348,186" fill="#111111"/>
  <text x="320" y="172" font-size="12" fill="#111111" text-anchor="middle">&#956; &#8593;</text>

  <!-- ================= RIGHT PANEL: mu > 0 ================= -->
  <line x1="395" y1="180" x2="590" y2="180" stroke="#cccccc" stroke-width="1"/>
  <line x1="490" y1="95" x2="490" y2="272" stroke="#cccccc" stroke-width="1"/>
  <text x="592" y="184" font-size="12" fill="#999999" font-style="italic">x</text>
  <text x="494" y="104" font-size="12" fill="#999999" font-style="italic">y</text>

  <!-- stable limit cycle (green, bold) radius 64 -->
  <circle cx="490" cy="180" r="64" fill="none" stroke="#166534" stroke-width="3"/>
  <polygon points="502,116 492,112 492,120" fill="#166534"/>

  <!-- unstable outward spiral onto the cycle -->
  <polyline fill="none" stroke="#1d4ed8" stroke-width="2"
    points="496.0,180.0 496.5,181.0 496.8,182.2 496.9,183.4 496.7,184.7 496.3,186.1 495.6,187.4 494.7,188.7 493.5,189.8 492.1,190.8 490.4,191.5 488.6,192.0 486.6,192.2 484.5,192.0 482.5,191.5 480.4,190.7 478.5,189.4 476.7,187.8 475.1,185.9 473.9,183.7 472.9,181.2 472.4,178.5 472.3,175.7 472.6,172.8 473.5,170.0 474.8,167.2 476.5,164.6 478.7,162.3 481.4,160.2 484.4,158.6 487.6,157.5 491.1,156.8 494.8,156.7 498.5,157.2 502.1,158.3 505.7,159.9 509.0,162.2 511.9,165.0 514.4,168.3 516.5,172.0 517.9,176.1 518.8,180.4 518.9,184.9 518.4,189.4 517.1,193.9 515.1,198.2 512.4,202.2 509.1,205.8 505.1,208.9 500.7,211.4 495.9,213.3 490.7,214.3 485.4,214.6 480.0,214.0 474.7,212.6 469.6,210.3 464.8,207.2 460.5,203.4 456.8,198.9 453.7,193.8 451.5,188.2 450.2,182.2 449.7,176.1 450.3,169.8 451.8,163.6 454.3,157.7 457.7,152.1 462.0,147.1 467.1,142.7 472.8,139.1 479.1,136.4 485.9,134.7 492.9,134.1 500.0,134.5 507.0,136.1 513.8,138.7 520.2,142.4 526.0,147.1 531.1,152.7 535.3,159.1 538.5,166.1 540.6,173.6 541.5,181.4 541.3,189.4 539.7,197.3 537.0,205.0 533.1,212.2 528.0,218.8 522.0,224.6 515.0,229.5 507.3,233.3"/>
  <polygon points="471.8,175.3 477.2,184.0 470.1,185.4" fill="#1d4ed8"/>
  <polygon points="514.6,199.4 515.3,189.1 521.9,192.2" fill="#1d4ed8"/>

  <!-- attraction from outside the cycle -->
  <line x1="490" y1="92" x2="490" y2="106" stroke="#166534" stroke-width="1.5"/>
  <polygon points="490,114 486,104 494,104" fill="#166534"/>

  <!-- unstable fixed point (open) -->
  <circle cx="490" cy="180" r="5.5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>

  <text x="490" y="300" font-size="13" fill="#111111" text-anchor="middle">&#956; &gt; 0</text>
  <text x="490" y="318" font-size="12" fill="#166534" text-anchor="middle">stable cycle, radius &#8776; &#8730;&#956;</text>
  <text x="490" y="334" font-size="11" fill="#1d4ed8" text-anchor="middle">(spiral now repels)</text>
</svg>
