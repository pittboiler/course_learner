<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>

  <!-- title -->
  <text x="320" y="30" font-size="16" fill="#111111" text-anchor="middle" font-weight="bold">A Hopf bifurcation: a limit cycle born as &#956; crosses 0</text>

