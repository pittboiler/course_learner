  <line x1="165" y1="95" x2="165" y2="272" stroke="#cccccc" stroke-width="1"/>
  <text x="272" y="184" font-size="12" fill="#999999" font-style="italic">x</text>
  <text x="169" y="104" font-size="12" fill="#999999" font-style="italic">y</text>

