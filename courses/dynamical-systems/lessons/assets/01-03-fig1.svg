<svg viewBox="0 0 720 540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="540" fill="#ffffff"/>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#111111"/>
    </marker>
    <marker id="axh" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#111111"/>
    </marker>
  </defs>

  <!-- region fills: upper half = node (green), then blue parabola interior on top, lower half = saddle (salmon) -->
  <rect x="60" y="100" width="600" height="240" fill="#e6f4ea"/>
  <rect x="60" y="340" width="600" height="170" fill="#fdecea"/>
  <path d="M160,100 L185,156 L210,205 L235,246 L260,280 L285,306 L310,325 L335,336 L360,340 L385,336 L410,325 L435,306 L460,280 L485,246 L510,205 L535,156 L560,100 Z"
        fill="#e7f0fb"/>

  <!-- parabola tau^2 = 4 Delta -->
  <path d="M160,100 L185,156 L210,205 L235,246 L260,280 L285,306 L310,325 L335,336 L360,340 L385,336 L410,325 L435,306 L460,280 L485,246 L510,205 L535,156 L560,100"
        fill="none" stroke="#1a5fb4" stroke-width="2.5"/>

  <!-- axes -->
  <line x1="60" y1="340" x2="668" y2="340" stroke="#111111" stroke-width="1.8" marker-end="url(#axh)"/>
  <line x1="360" y1="512" x2="360" y2="92" stroke="#111111" stroke-width="1.8" marker-end="url(#axh)"/>
  <text x="676" y="345" font-size="18" font-style="italic" fill="#111111">&#964;</text>
  <text x="368" y="104" font-size="18" font-style="italic" fill="#111111">&#916;</text>
  <text x="344" y="360" font-size="13" fill="#555555">0</text>

  <!-- parabola label -->
  <text x="566" y="118" font-size="14" font-style="italic" fill="#1a5fb4">&#964;&#178; = 4&#916;</text>

  <!-- ===== icons ===== -->

  <!-- stable node (top-left): arrows inward -->
  <g stroke="#111111" stroke-width="1.6" fill="none">
    <line x1="120" y1="175" x2="120" y2="200" marker-end="url(#ah)"/>
    <line x1="120" y1="245" x2="120" y2="220" marker-end="url(#ah)"/>
    <line x1="93" y1="210" x2="113" y2="210" marker-end="url(#ah)"/>
    <line x1="147" y1="210" x2="127" y2="210" marker-end="url(#ah)"/>
  </g>
  <circle cx="120" cy="210" r="2.4" fill="#111111"/>
  <text x="120" y="150" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">Stable node</text>
  <text x="120" y="272" font-size="12" text-anchor="middle" fill="#333333">&#964;&lt;0, &#964;&#178;&gt;4&#916;</text>

  <!-- unstable node (top-right): arrows outward -->
  <g stroke="#111111" stroke-width="1.6" fill="none">
    <line x1="600" y1="203" x2="600" y2="180" marker-end="url(#ah)"/>
    <line x1="600" y1="217" x2="600" y2="240" marker-end="url(#ah)"/>
    <line x1="593" y1="210" x2="573" y2="210" marker-end="url(#ah)"/>
    <line x1="607" y1="210" x2="627" y2="210" marker-end="url(#ah)"/>
  </g>
  <circle cx="600" cy="210" r="2.4" fill="#111111"/>
  <text x="600" y="150" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">Unstable node</text>
  <text x="600" y="272" font-size="12" text-anchor="middle" fill="#333333">&#964;&gt;0, &#964;&#178;&gt;4&#916;</text>

  <!-- stable spiral (inside parabola, left): coil inward -->
  <path d="M326,240 L300,262 L281,240 L300,225 L311,240 L300,248 L296,240"
        fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="300" y="200" font-size="14" text-anchor="middle" fill="#111111" font-weight="bold">Stable</text>
  <text x="300" y="216" font-size="14" text-anchor="middle" fill="#111111" font-weight="bold">spiral</text>

  <!-- unstable spiral (inside parabola, right): coil outward -->
  <path d="M416,240 L420,248 L431,240 L420,225 L401,240 L420,262 L446,240"
        fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="420" y="200" font-size="14" text-anchor="middle" fill="#111111" font-weight="bold">Unstable</text>
  <text x="420" y="216" font-size="14" text-anchor="middle" fill="#111111" font-weight="bold">spiral</text>

  <!-- center (on Delta axis, top): closed loop -->
  <ellipse cx="360" cy="140" rx="24" ry="16" fill="none" stroke="#111111" stroke-width="1.6"/>
  <path d="M348,128 L338,132" stroke="#111111" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="360" y="180" font-size="14" text-anchor="middle" fill="#111111" font-weight="bold">Center (&#964;=0)</text>

  <!-- saddle (lower half): out horizontal, in vertical -->
  <g stroke="#111111" stroke-width="1.6" fill="none">
    <line x1="222" y1="440" x2="200" y2="440" marker-end="url(#ah)"/>
    <line x1="278" y1="440" x2="300" y2="440" marker-end="url(#ah)"/>
    <line x1="250" y1="412" x2="250" y2="432" marker-end="url(#ah)"/>
    <line x1="250" y1="468" x2="250" y2="448" marker-end="url(#ah)"/>
  </g>
  <circle cx="250" cy="440" r="2.4" fill="#111111"/>
  <text x="360" y="498" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Saddle  (&#916; &lt; 0)</text>

  <!-- boundary annotations -->
  <text x="628" y="332" font-size="12" fill="#c0392b">&#916;=0</text>
</svg>
