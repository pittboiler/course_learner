<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ax4" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Separation of two nearby trajectories</text>

  <!-- axes -->
  <line x1="70" y1="340" x2="690" y2="340" stroke="#111111" stroke-width="1.6" marker-end="url(#ax4)"/>
  <line x1="70" y1="360" x2="70" y2="40" stroke="#111111" stroke-width="1.6" marker-end="url(#ax4)"/>
  <text x="688" y="360" text-anchor="end" font-size="13" fill="#111111">t  (time)</text>
  <text transform="rotate(-90 26 200)" x="26" y="200" text-anchor="middle" font-size="13" fill="#111111">ln &#8741;&#948;(t)&#8741;</text>

  <!-- saturation line (attractor size) -->
  <line x1="70" y1="60" x2="680" y2="60" stroke="#888888" stroke-width="1.4" stroke-dasharray="5 5"/>
  <text x="676" y="53" text-anchor="end" font-size="11.5" fill="#555555">separation saturates at attractor size</text>

  <!-- fitted straight line: slope = lambda_1 -->
  <line x1="70" y1="340" x2="520" y2="95" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="300" y="185" font-size="12.5" fill="#c0392b" font-weight="bold" transform="rotate(-28 300 185)">fitted slope = &#955;&#8321;  &gt; 0</text>

  <!-- noisy separation data (blue) -->
  <polyline fill="none" stroke="#1a6feb" stroke-width="2.4"
    points="70,340 115,310 160,298 205,262 250,250 295,212 340,200 385,164 430,152 475,120 520,78 565,64 610,58 655,62"/>
  <!-- data dots -->
  <g fill="#1a6feb">
    <circle cx="70" cy="340" r="3"/><circle cx="115" cy="310" r="3"/><circle cx="160" cy="298" r="3"/>
    <circle cx="205" cy="262" r="3"/><circle cx="250" cy="250" r="3"/><circle cx="295" cy="212" r="3"/>
    <circle cx="340" cy="200" r="3"/><circle cx="385" cy="164" r="3"/><circle cx="430" cy="152" r="3"/>
    <circle cx="475" cy="120" r="3"/><circle cx="520" cy="78" r="3"/><circle cx="565" cy="64" r="3"/>
    <circle cx="610" cy="58" r="3"/><circle cx="655" cy="62" r="3"/>
  </g>

  <!-- ln|delta_0| marker -->
  <line x1="60" y1="340" x2="70" y2="340" stroke="#111111" stroke-width="1.4"/>
  <text x="56" y="344" text-anchor="end" font-size="11.5" fill="#333333">ln&#8741;&#948;&#8320;&#8741;</text>

  <!-- region labels -->
  <text x="230" y="322" text-anchor="middle" font-size="11.5" fill="#333333">exponential growth: slope = &#955;&#8321;</text>
  <text x="600" y="90" text-anchor="middle" font-size="11.5" fill="#333333">plateau (can't exceed attractor)</text>
</svg>
