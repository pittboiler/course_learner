<svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Two films in series: p&#8321; falls across the gas film, jumps at the equilibrium interface, then c&#8321; falls across the liquid film.</text>

  <!-- ===== left panel: the two-film profile ===== -->
  <!-- baseline (position axis) -->
  <line x1="60" y1="310" x2="340" y2="310" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- gas-side vertical axis -->
  <line x1="60" y1="310" x2="60" y2="70" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="42" y="80" fill="#4a90d9">p&#8321;</text>
  <!-- liquid-side vertical axis -->
  <line x1="330" y1="310" x2="330" y2="70" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="336" y="80" fill="#e0645c">c&#8321;</text>

  <!-- film boundaries (dashed) -->
  <line x1="125" y1="310" x2="125" y2="75" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="285" y1="310" x2="285" y2="75" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- interface -->
  <line x1="205" y1="320" x2="205" y2="75" stroke="#e0645c" stroke-width="2"/>
  <text x="176" y="336" fill="#e0645c">interface</text>

  <!-- region labels -->
  <text x="72" y="300" fill="#8a8a8a">bulk gas</text>
  <text x="130" y="300" fill="#8a8a8a">gas film</text>
  <text x="212" y="300" fill="#8a8a8a">liq. film</text>
  <text x="288" y="300" fill="#8a8a8a">bulk liq.</text>

  <!-- gas-side profile (blue): flat in bulk, drops across gas film -->
  <path d="M 60 100 L 125 100 L 205 158" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <circle cx="60" cy="100" r="3" fill="#4a90d9"/>
  <circle cx="205" cy="158" r="3.5" fill="#4a90d9"/>
  <text x="70" y="93" fill="#4a90d9">p&#8321; (bulk)</text>
  <text x="150" y="150" fill="#4a90d9">p&#8321;,i</text>

  <!-- Henry jump at the interface (grey connector) -->
  <line x1="205" y1="158" x2="205" y2="192" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- liquid-side profile (coral): drops across liquid film, flat in bulk -->
  <path d="M 205 192 L 285 250 L 330 250" fill="none" stroke="#e0645c" stroke-width="3"/>
  <circle cx="205" cy="192" r="3.5" fill="#e0645c"/>
  <circle cx="330" cy="250" r="3" fill="#e0645c"/>
  <text x="212" y="188" fill="#e0645c">c&#8321;,i</text>
  <text x="292" y="243" fill="#e0645c">c&#8321; (bulk)</text>

  <!-- flux arrow across the top -->
  <line x1="70" y1="55" x2="320" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="320,55 311,51 311,59" fill="#8a8a8a"/>
  <text x="182" y="49" fill="#8a8a8a">N&#8321;</text>

  <!-- Henry note -->
  <text x="60" y="352" fill="#8a8a8a" font-style="italic">at interface: no resistance, equilibrium p&#8321;,i = H c&#8321;,i</text>

  <!-- ===== right panel: series-resistance analogue ===== -->
  <text x="420" y="80" fill="#8a8a8a" font-style="italic">series resistance</text>

  <!-- wire + terminals -->
  <circle cx="410" cy="150" r="3.5" fill="#4a90d9"/>
  <text x="392" y="140" fill="#4a90d9">p&#8321;</text>
  <line x1="410" y1="150" x2="440" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- resistor 1: gas film -->
  <rect x="440" y="135" width="60" height="30" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="454" y="154" fill="#4a90d9">1/k_G</text>
  <line x1="500" y1="150" x2="530" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- middle node -->
  <circle cx="530" cy="150" r="3.5" fill="#8a8a8a"/>
  <text x="512" y="140" fill="#8a8a8a">p&#8321;,i</text>
  <line x1="530" y1="150" x2="560" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- resistor 2: liquid film -->
  <rect x="560" y="135" width="60" height="30" fill="#e0645c" opacity="0.15" stroke="#e0645c" stroke-width="2"/>
  <text x="574" y="154" fill="#e0645c">H/k_L</text>
  <line x1="620" y1="150" x2="640" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="640" cy="150" r="3.5" fill="#e0645c"/>
  <text x="620" y="140" fill="#e0645c">p&#8321;*</text>

  <!-- current arrow -->
  <line x1="420" y1="185" x2="630" y2="185" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="630,185 621,181 621,189" fill="#8a8a8a"/>
  <text x="515" y="179" fill="#8a8a8a">N&#8321;</text>

  <!-- total -->
  <text x="410" y="228" fill="#8a8a8a">driving force p&#8321; &#8722; p&#8321;*</text>
  <text x="410" y="250" fill="#8a8a8a">1/K_G = 1/k_G + H/k_L</text>
</svg>
