<svg viewBox="0 0 760 410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="16">
  <text x="24" y="26" fill="#8a8a8a" font-style="italic" font-size="13">Measure each equation of change in the problem's own units. What is left multiplying each term is a dimensionless group.</text>

  <text x="24" y="70" fill="#4a90d9" font-weight="bold" font-size="13">MOMENTUM &#8212; Navier&#8211;Stokes</text>
  <text x="24" y="106" fill="#8a8a8a">Dv*/Dt*  =  &#8722;&#8711;*p*  +</text>
  <ellipse cx="272" cy="100" rx="34" ry="18" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="247" y="106" fill="#4a90d9" font-weight="bold">1/Re</text>
  <text x="316" y="106" fill="#8a8a8a">&#8711;*&#178;v*   +</text>
  <ellipse cx="452" cy="100" rx="40" ry="18" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="420" y="106" fill="#e0645c" font-weight="bold">1/Fr&#178;</text>
  <text x="500" y="106" fill="#8a8a8a">g*</text>
  <line x1="272" y1="118" x2="272" y2="136" stroke="#4a90d9" stroke-width="1"/>
  <text x="214" y="150" fill="#8a8a8a" font-size="12">inertia &#247; viscous</text>
  <line x1="452" y1="118" x2="452" y2="136" stroke="#e0645c" stroke-width="1"/>
  <text x="398" y="150" fill="#8a8a8a" font-size="12">inertia &#247; gravity</text>

  <text x="24" y="196" fill="#4a90d9" font-weight="bold" font-size="13">HEAT &#8212; energy</text>
  <text x="24" y="232" fill="#8a8a8a">DT*/Dt*  =</text>
  <ellipse cx="204" cy="226" rx="34" ry="18" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="180" y="232" fill="#4a90d9" font-weight="bold">1/Pe</text>
  <text x="248" y="232" fill="#8a8a8a">&#8711;*&#178;T*   +   (Br/Pe)&#934;*</text>
  <line x1="204" y1="244" x2="204" y2="262" stroke="#4a90d9" stroke-width="1"/>
  <text x="128" y="276" fill="#8a8a8a" font-size="12">convection &#247; conduction,   Pe = Re&#183;Pr</text>

  <text x="24" y="322" fill="#4a90d9" font-weight="bold" font-size="13">MASS &#8212; species</text>
  <text x="24" y="358" fill="#8a8a8a">Dc*/Dt*  =</text>
  <ellipse cx="212" cy="352" rx="42" ry="18" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="176" y="358" fill="#4a90d9" font-weight="bold">1/Pe<tspan font-size="11" dy="4">m</tspan></text>
  <text x="262" y="358" fill="#8a8a8a">&#8711;*&#178;c*</text>
  <line x1="212" y1="370" x2="212" y2="388" stroke="#4a90d9" stroke-width="1"/>
  <text x="128" y="402" fill="#8a8a8a" font-size="12">convection &#247; diffusion,   Pe<tspan font-size="11" dy="4">m</tspan><tspan font-size="12" dy="-4"> = Re&#183;Sc</tspan></text>

  <line x1="560" y1="180" x2="560" y2="392" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 5"/>
  <text x="584" y="206" fill="#8a8a8a" font-size="12" font-weight="bold">also lurking:</text>
  <text x="584" y="230" fill="#e0645c" font-size="12">Gr = g&#946;&#916;T L&#179;/&#957;&#178;</text>
  <text x="584" y="250" fill="#8a8a8a" font-size="11">buoyancy term, coeff Gr/Re&#178;</text>
  <text x="584" y="280" fill="#e0645c" font-size="12">Ra = Gr&#183;Pr</text>
  <text x="584" y="300" fill="#8a8a8a" font-size="11">Fr = V/&#8730;(gL)</text>
  <text x="584" y="320" fill="#8a8a8a" font-size="11">Br = &#956;V&#178;/(k&#916;T)</text>
  <text x="584" y="352" fill="#8a8a8a" font-size="11" font-style="italic">same groups &#8594;</text>
  <text x="584" y="368" fill="#8a8a8a" font-size="11" font-style="italic">same dimensionless</text>
  <text x="584" y="384" fill="#8a8a8a" font-size="11" font-style="italic">solution</text>
</svg>
