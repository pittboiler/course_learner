<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">At high Re, viscosity is trapped in a thin layer &#948;(x) &#8733; &#8730;x near the wall; outside it the flow slides by inviscidly.</text>

  <!-- free-stream label -->
  <text x="360" y="60" fill="#4a90d9">free stream: U&#8734; uniform (inviscid)</text>

  <!-- free-stream approach arrows -->
  <line x1="24" y1="100" x2="60" y2="100" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="60,100 51,96 51,104" fill="#4a90d9"/>
  <line x1="24" y1="135" x2="60" y2="135" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="60,135 51,131 51,139" fill="#4a90d9"/>
  <line x1="24" y1="170" x2="60" y2="170" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="60,170 51,166 51,174" fill="#4a90d9"/>
  <line x1="24" y1="205" x2="60" y2="205" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="60,205 51,201 51,209" fill="#4a90d9"/>
  <text x="20" y="88" fill="#4a90d9">U&#8734;</text>

  <!-- plate -->
  <line x1="80" y1="250" x2="612" y2="250" stroke="#8a8a8a" stroke-width="2.5"/>
  <line x1="88" y1="250" x2="80" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="112" y1="250" x2="104" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="136" y1="250" x2="128" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="160" y1="250" x2="152" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="184" y1="250" x2="176" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="208" y1="250" x2="200" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="232" y1="250" x2="224" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="256" y1="250" x2="248" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="280" y1="250" x2="272" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="304" y1="250" x2="296" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="328" y1="250" x2="320" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="352" y1="250" x2="344" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="376" y1="250" x2="368" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="400" y1="250" x2="392" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="424" y1="250" x2="416" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="448" y1="250" x2="440" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="472" y1="250" x2="464" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="496" y1="250" x2="488" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="520" y1="250" x2="512" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="544" y1="250" x2="536" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="568" y1="250" x2="560" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="592" y1="250" x2="584" y2="260" stroke="#8a8a8a" stroke-width="1"/>
  <text x="70" y="278" fill="#8a8a8a">leading edge</text>

  <!-- x axis along plate -->
  <line x1="80" y1="290" x2="600" y2="290" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="600,290 591,286 591,294" fill="#8a8a8a"/>
  <text x="586" y="308" fill="#8a8a8a">x</text>

  <!-- boundary-layer edge: delta(x) proportional to sqrt(x) -->
  <path d="M 80 250 L 120 225 L 160 214.7 L 200 206.8 L 240 200.1 L 280 194.2 L 320 188.9 L 360 184 L 400 179.4 L 440 175.1 L 480 171.1 L 520 167.2 L 560 163.5 L 600 160"
        fill="none" stroke="#e0645c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="300" y="150" fill="#e0645c">boundary-layer edge &#948;(x) &#8733; &#8730;x</text>

  <!-- velocity profile at a station x=430 -->
  <line x1="430" y1="250" x2="430" y2="176" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="430" y1="234" x2="443" y2="234" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="443,234 435,231 435,237" fill="#4a90d9"/>
  <line x1="430" y1="218" x2="455" y2="218" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="455,218 447,215 447,221" fill="#4a90d9"/>
  <line x1="430" y1="202" x2="466" y2="202" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="466,202 458,199 458,205" fill="#4a90d9"/>
  <line x1="430" y1="188" x2="476" y2="188" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="476,188 468,185 468,191" fill="#4a90d9"/>
  <line x1="430" y1="176" x2="482" y2="176" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="482,176 474,173 474,179" fill="#4a90d9"/>
  <path d="M 430 250 L 443 234 L 455 218 L 466 202 L 476 188 L 482 176" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="486" y="205" fill="#4a90d9">v&#8339;(y): 0 at wall &#8594; U&#8734;</text>

  <!-- delta bracket at x=560 -->
  <line x1="560" y1="250" x2="560" y2="163.5" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="560,163.5 556,172 564,172" fill="#e0645c"/>
  <polygon points="560,250 556,241 564,241" fill="#e0645c"/>
  <text x="566" y="210" fill="#e0645c">&#948;</text>

  <!-- wall shear marker -->
  <line x1="430" y1="250" x2="410" y2="250" stroke="#e0645c" stroke-width="3"/>
  <text x="150" y="240" fill="#e0645c">&#964;&#8339; = &#956;(&#8706;v&#8339;/&#8706;y) at wall (no-slip)</text>
  <line x1="240" y1="244" x2="415" y2="250" stroke="#e0645c" stroke-width="0.8" stroke-dasharray="2 3"/>
</svg>
