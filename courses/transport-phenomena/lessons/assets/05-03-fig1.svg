<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#4a90d9"/>
    </marker>
    <marker id="coral" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#e0645c"/>
    </marker>
    <marker id="grey" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <text x="24" y="26" font-size="14" fill="#8a8a8a">Wet-bulb energy balance on the water film</text>

  <rect x="70" y="60" width="26" height="270" fill="#8a8a8a" opacity="0.45"/>
  <rect x="96" y="60" width="16" height="270" fill="#4a90d9" opacity="0.55"/>
  <text x="40" y="200" font-size="12" fill="#8a8a8a" transform="rotate(-90 40 200)">solid / wick</text>
  <text x="118" y="352" font-size="12" fill="#4a90d9">water film</text>

  <text x="128" y="86" font-size="14" fill="#e0645c">surface at T</text>
  <text x="212" y="90" font-size="11" fill="#e0645c">w</text>
  <text x="128" y="104" font-size="12" fill="#e0645c">(cool)</text>

  <text x="470" y="82" font-size="14" fill="#8a8a8a">air stream</text>
  <text x="470" y="102" font-size="13" fill="#8a8a8a">T</text>
  <text x="482" y="106" font-size="10" fill="#8a8a8a">&#8734;</text>
  <text x="492" y="102" font-size="13" fill="#8a8a8a">(warm, dry)</text>
  <text x="470" y="122" font-size="13" fill="#8a8a8a">c</text>
  <text x="480" y="126" font-size="10" fill="#8a8a8a">A&#8734;</text>
  <text x="494" y="122" font-size="13" fill="#8a8a8a">&#8776; 0</text>

  <line x1="430" y1="150" x2="500" y2="150" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#grey)"/>
  <line x1="430" y1="180" x2="500" y2="180" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#grey)"/>
  <line x1="430" y1="210" x2="500" y2="210" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#grey)"/>

  <line x1="360" y1="150" x2="126" y2="150" stroke="#4a90d9" stroke-width="2.6" marker-end="url(#blue)"/>
  <text x="230" y="142" font-size="13" fill="#4a90d9">heat IN:  q = h ( T</text>
  <text x="352" y="146" font-size="10" fill="#4a90d9">&#8734;</text>
  <text x="360" y="142" font-size="13" fill="#4a90d9">&#8722; T</text>
  <text x="392" y="146" font-size="10" fill="#4a90d9">w</text>
  <text x="398" y="142" font-size="13" fill="#4a90d9">)</text>

  <line x1="126" y1="230" x2="360" y2="230" stroke="#e0645c" stroke-width="2.6" marker-end="url(#coral)"/>
  <text x="150" y="256" font-size="13" fill="#e0645c">vapor + latent heat OUT:  &#955; k</text>
  <text x="400" y="260" font-size="10" fill="#e0645c">c</text>
  <text x="408" y="256" font-size="13" fill="#e0645c">( c</text>
  <text x="428" y="260" font-size="10" fill="#e0645c">A,s</text>
  <text x="444" y="256" font-size="13" fill="#e0645c">&#8722; c</text>
  <text x="474" y="260" font-size="10" fill="#e0645c">A&#8734;</text>
  <text x="486" y="256" font-size="13" fill="#e0645c">)</text>

  <rect x="150" y="300" width="330" height="46" fill="#8a8a8a" opacity="0.12"/>
  <text x="164" y="322" font-size="14" fill="#8a8a8a">steady state:  h ( T</text>
  <text x="316" y="326" font-size="10" fill="#8a8a8a">&#8734;</text>
  <text x="324" y="322" font-size="14" fill="#8a8a8a">&#8722; T</text>
  <text x="356" y="326" font-size="10" fill="#8a8a8a">w</text>
  <text x="362" y="322" font-size="14" fill="#8a8a8a">) = &#955; k</text>
  <text x="410" y="326" font-size="10" fill="#8a8a8a">c</text>
  <text x="418" y="322" font-size="14" fill="#8a8a8a">&#916;c</text>
  <text x="164" y="340" font-size="12" fill="#8a8a8a">convective gain  =  latent loss</text>
</svg>
