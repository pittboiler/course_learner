<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Same erfc front, pushed deeper: concentration penetrates a semi-infinite medium as t grows.</text>

  <!-- axes -->
  <line x1="70" y1="250" x2="590" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="590,250 580,245 580,255" fill="#8a8a8a"/>
  <text x="556" y="272" fill="#8a8a8a">x (depth)</text>

  <line x1="70" y1="250" x2="70" y2="50" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,50 65,60 75,60" fill="#8a8a8a"/>
  <text x="42" y="46" fill="#8a8a8a">cA</text>

  <!-- surface value and bulk value guides -->
  <line x1="70" y1="60" x2="590" y2="60" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="18" y="64" fill="#8a8a8a">cA,s</text>
  <text x="22" y="254" fill="#8a8a8a">cA0</text>

  <!-- t1 (earliest, shallow front) -->
  <path d="M 70 60 L 110 149.3 L 150 210.4 L 190 238.7 L 230 247.7 L 270 249.7 L 310 250"
        fill="none" stroke="#4a90d9" stroke-width="2" opacity="0.45"/>
  <text x="150" y="205" fill="#4a90d9" opacity="0.7">t1</text>

  <!-- t2 (middle) -->
  <path d="M 70 60 L 110 115.9 L 150 164.3 L 190 201.0 L 230 225.0 L 270 238.7 L 310 245.5 L 350 248.2 L 390 249.5 L 430 250"
        fill="none" stroke="#4a90d9" stroke-width="2.4" opacity="0.72"/>
  <text x="238" y="220" fill="#4a90d9" opacity="0.85">t2</text>

  <!-- t3 (latest, deepest front) -->
  <path d="M 70 60 L 110 97.2 L 150 131.6 L 190 162.4 L 230 188.8 L 270 208.4 L 310 223.3 L 350 233.8 L 390 240.8 L 430 244.9 L 470 247.4 L 510 248.7 L 550 249.4"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="392" y="232" fill="#4a90d9">t3</text>

  <!-- penetration-depth ticks (delta ~ sqrt(D t)) marching right -->
  <line x1="115" y1="250" x2="115" y2="286" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="145" y1="250" x2="145" y2="292" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="185" y1="250" x2="185" y2="298" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="115" y1="294" x2="185" y2="294" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="185,294 176,290 176,298" fill="#e0645c"/>
  <text x="196" y="299" fill="#e0645c">&#948; ~ (D t) to the 1/2 power</text>
</svg>
