<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="34" y="24" fill="#8a8a8a" font-style="italic">Same shell, two shapes: shear &#964; runs linear (zero at center, max at the wall); velocity bows into a parabola.</text>

  <!-- ============ LEFT: tube, shear + velocity vs r ============ -->

  <!-- r axis (vertical, r=0 at center) -->
  <line x1="100" y1="330" x2="100" y2="86" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="100,86 95,96 105,96" fill="#8a8a8a"/>
  <text x="88" y="86" fill="#8a8a8a">r</text>

  <!-- pipe walls (top r=R, bottom r=-R) -->
  <line x1="100" y1="110" x2="330" y2="110" stroke="#8a8a8a" stroke-width="3"/>
  <line x1="100" y1="310" x2="330" y2="310" stroke="#8a8a8a" stroke-width="3"/>
  <text x="70" y="115" fill="#8a8a8a">R</text>
  <text x="70" y="215" fill="#8a8a8a">0</text>
  <text x="62" y="315" fill="#8a8a8a">&#8722;R</text>

  <!-- centerline -->
  <line x1="100" y1="210" x2="330" y2="210" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- shear stress: coral, linear, zero at center, max at each wall -->
  <line x1="100" y1="210" x2="165" y2="110" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="100" y1="210" x2="165" y2="310" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="165,110 154,113 160,121" fill="#e0645c"/>
  <text x="140" y="150" fill="#e0645c">&#964;</text>
  <text x="120" y="96" fill="#e0645c" font-size="12">&#964;</text>
  <text x="128" y="96" fill="#e0645c" font-size="9">w</text>

  <!-- velocity profile: blue parabola, max at center -->
  <path d="M 100 110 L 178 135 L 235 160 L 269 185 L 280 210 L 269 235 L 235 260 L 178 285 L 100 310"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <!-- a few velocity arrows -->
  <line x1="100" y1="160" x2="235" y2="160" stroke="#4a90d9" stroke-width="1.5" opacity="0.6"/>
  <polygon points="235,160 225,155 225,165" fill="#4a90d9" opacity="0.6"/>
  <line x1="100" y1="210" x2="280" y2="210" stroke="#4a90d9" stroke-width="1.5" opacity="0.6"/>
  <polygon points="280,210 270,205 270,215" fill="#4a90d9" opacity="0.6"/>
  <line x1="100" y1="260" x2="235" y2="260" stroke="#4a90d9" stroke-width="1.5" opacity="0.6"/>
  <polygon points="235,260 225,255 225,265" fill="#4a90d9" opacity="0.6"/>
  <text x="238" y="205" fill="#4a90d9">v</text>
  <text x="247" y="205" fill="#4a90d9" font-size="9">z</text>
  <text x="252" y="205" fill="#4a90d9">(r)</text>

  <text x="120" y="350" fill="#8a8a8a" font-size="12">round tube: &#964; linear, v parabolic</text>

  <!-- ============ RIGHT: annulus cross-section ============ -->

  <!-- outer wall r=R -->
  <circle cx="540" cy="210" r="92" fill="none" stroke="#8a8a8a" stroke-width="2.5"/>
  <!-- inner rod r=kappa R -->
  <circle cx="540" cy="210" r="40" fill="#8a8a8a" opacity="0.15" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="527" y="215" fill="#8a8a8a" font-size="12">rod</text>

  <!-- radial line to label radii -->
  <line x1="540" y1="210" x2="632" y2="210" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="556" y="204" fill="#8a8a8a" font-size="12">&#954;R</text>
  <text x="620" y="204" fill="#8a8a8a" font-size="12">R</text>

  <!-- off-center velocity hump along the top radius (inner wall -> outer wall) -->
  <path d="M 580 150 Q 605 118 620 150" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <line x1="580" y1="170" x2="580" y2="150" stroke="#4a90d9" stroke-width="1.5"/>
  <line x1="632" y1="170" x2="620" y2="150" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="588" y="112" fill="#4a90d9" font-size="12">v</text>
  <text x="596" y="112" fill="#4a90d9" font-size="9">z</text>

  <!-- peak marker: interior radius, coral -->
  <line x1="605" y1="118" x2="605" y2="210" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle cx="605" cy="210" r="3.5" fill="#e0645c"/>
  <text x="612" y="248" fill="#e0645c" font-size="12">peak at</text>
  <text x="612" y="264" fill="#e0645c" font-size="12">interior r</text>

  <text x="470" y="350" fill="#8a8a8a" font-size="12">annulus: peak sits between the walls</text>
</svg>
