<svg viewBox="0 0 760 372" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Left: concentration profiles across a catalyst slab, nearly flat for small Thiele modulus and steeply starved at the center for large modulus. Right: effectiveness factor versus Thiele modulus on log-log axes, a plateau at one rolling off as one over phi.</title>

  <!-- ===================== PANEL A: concentration profiles ===================== -->
  <text x="205" y="24" text-anchor="middle" font-size="14" fill="#8a8a8a">c&#8321;(x)/c&#8321;,&#8347; across the slab</text>

  <!-- plot frame -->
  <line x1="70" y1="40" x2="70" y2="280" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="70" y1="280" x2="340" y2="280" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- surface value gridline at c/cs = 1 -->
  <line x1="70" y1="60" x2="340" y2="60" stroke="#8a8a8a" stroke-width="0.7" stroke-dasharray="3,3"/>
  <text x="64" y="64" text-anchor="end" font-size="11" fill="#8a8a8a">1</text>
  <text x="64" y="284" text-anchor="end" font-size="11" fill="#8a8a8a">0</text>

  <!-- x ticks: center and two surfaces -->
  <text x="205" y="296" text-anchor="middle" font-size="11" fill="#8a8a8a">center</text>
  <text x="70" y="296" text-anchor="middle" font-size="11" fill="#8a8a8a">&#8722;L</text>
  <text x="340" y="296" text-anchor="middle" font-size="11" fill="#8a8a8a">+L</text>
  <line x1="205" y1="280" x2="205" y2="285" stroke="#8a8a8a" stroke-width="1"/>
  <text x="205" y="316" text-anchor="middle" font-size="12" fill="#8a8a8a">x  (surfaces held at c&#8321;,&#8347;)</text>

  <!-- small phi profile: nearly flat, whole pellet active -->
  <polyline points="70,60 103.75,71 137.5,78.7 171.25,83.4 205,84.9 238.75,83.4 272.5,78.7 306.25,71 340,60"
            fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="205" y="102" text-anchor="middle" font-size="12" fill="#4a90d9">&#966; &#8804; 1  (active core)</text>

  <!-- large phi profile: steep, starved dead core -->
  <polyline points="70,60 103.75,175.2 137.5,228.6 171.25,251.7 205,258.2 238.75,251.7 272.5,228.6 306.25,175.2 340,60"
            fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <text x="205" y="248" text-anchor="middle" font-size="12" fill="#e0645c">&#966; &#8811; 1  (starved core)</text>

  <!-- ===================== PANEL B: effectiveness factor ===================== -->
  <text x="580" y="24" text-anchor="middle" font-size="14" fill="#8a8a8a">&#951; = tanh &#966; / &#966;   (log-log)</text>

  <!-- plot frame -->
  <line x1="440" y1="40" x2="440" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="440" y1="290" x2="720" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- y ticks: eta = 1, 0.1 -->
  <line x1="437" y1="50" x2="440" y2="50" stroke="#8a8a8a" stroke-width="1"/>
  <text x="433" y="54" text-anchor="end" font-size="11" fill="#8a8a8a">1</text>
  <line x1="437" y1="200" x2="440" y2="200" stroke="#8a8a8a" stroke-width="1"/>
  <text x="433" y="204" text-anchor="end" font-size="11" fill="#8a8a8a">0.1</text>
  <text x="410" y="165" text-anchor="middle" font-size="12" fill="#8a8a8a" transform="rotate(-90 410 165)">&#951;</text>

  <!-- x ticks: phi = 0.1, 1, 10 -->
  <line x1="440" y1="290" x2="440" y2="293" stroke="#8a8a8a" stroke-width="1"/>
  <text x="440" y="306" text-anchor="middle" font-size="11" fill="#8a8a8a">0.1</text>
  <line x1="552" y1="290" x2="552" y2="293" stroke="#8a8a8a" stroke-width="1"/>
  <text x="552" y="306" text-anchor="middle" font-size="11" fill="#8a8a8a">1</text>
  <line x1="664" y1="290" x2="664" y2="293" stroke="#8a8a8a" stroke-width="1"/>
  <text x="664" y="306" text-anchor="middle" font-size="11" fill="#8a8a8a">10</text>
  <text x="580" y="324" text-anchor="middle" font-size="12" fill="#8a8a8a">&#966; = L &#8730;(k&#8321;/D&#8337;)</text>

  <!-- 1/phi asymptote -->
  <line x1="552" y1="50" x2="717.4" y2="271.6" stroke="#e0645c" stroke-width="1.6" stroke-dasharray="5,4"/>
  <text x="700" y="200" text-anchor="end" font-size="12" fill="#e0645c">&#951; &#8776; 1/&#966;</text>

  <!-- eta curve -->
  <polyline points="440,50.2 473.7,50.86 493.4,51.9 518.3,55.1 552,67.7 585.7,97.5 605.4,121.9 630.3,154.8 664,200 697.7,245.2 717.4,271.6"
            fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- regime labels -->
  <text x="486" y="72" text-anchor="middle" font-size="11" fill="#8a8a8a">reaction-limited</text>
  <text x="486" y="86" text-anchor="middle" font-size="11" fill="#8a8a8a">(&#951; &#8594; 1)</text>
  <text x="660" y="176" text-anchor="middle" font-size="11" fill="#8a8a8a">diffusion-limited</text>

  <!-- caption -->
  <text x="380" y="360" text-anchor="middle" font-size="12" fill="#8a8a8a">Small &#966;: pellet works everywhere.  Large &#966;: only a surface skin reacts, interior is dead weight.</text>
</svg>
