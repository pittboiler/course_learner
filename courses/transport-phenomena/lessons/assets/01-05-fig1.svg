<svg viewBox="0 0 660 410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">One molecular mechanism gives a gas &#957;&#8776;&#945;&#8776;D (all ratios &#8776;1); a liquid smears momentum far faster than heat or mass.</text>

  <!-- ===== GAS number line ===== -->
  <text x="40" y="70" fill="#4a90d9" font-weight="bold">GASES (air)</text>
  <line x1="90" y1="95" x2="460" y2="95" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="460,95 450,90 450,100" fill="#8a8a8a"/>

  <!-- decade ticks -->
  <line x1="90" y1="91" x2="90" y2="99" stroke="#8a8a8a" stroke-width="1"/>
  <text x="82" y="115" fill="#8a8a8a">0.1</text>
  <line x1="180" y1="88" x2="180" y2="102" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="176" y="118" fill="#8a8a8a">1</text>
  <line x1="270" y1="91" x2="270" y2="99" stroke="#8a8a8a" stroke-width="1"/>
  <text x="262" y="115" fill="#8a8a8a">10</text>
  <line x1="360" y1="91" x2="360" y2="99" stroke="#8a8a8a" stroke-width="1"/>
  <text x="348" y="115" fill="#8a8a8a">100</text>
  <line x1="450" y1="91" x2="450" y2="99" stroke="#8a8a8a" stroke-width="1"/>
  <text x="436" y="115" fill="#8a8a8a">1000</text>

  <!-- clustered gas markers near value 1 -->
  <circle cx="160" cy="95" r="4" fill="#4a90d9"/>
  <text x="148" y="82" fill="#4a90d9">Sc</text>
  <circle cx="166" cy="95" r="4" fill="#4a90d9"/>
  <text x="175" y="82" fill="#4a90d9">Pr</text>
  <circle cx="174" cy="95" r="4" fill="#4a90d9"/>
  <text x="198" y="82" fill="#4a90d9">Le</text>
  <text x="230" y="99" fill="#8a8a8a">&#8592; all clustered at &#8776;1</text>

  <!-- ===== LIQUID number line ===== -->
  <text x="40" y="160" fill="#e0645c" font-weight="bold">LIQUIDS (water)</text>
  <line x1="90" y1="185" x2="460" y2="185" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="460,185 450,180 450,190" fill="#8a8a8a"/>
  <line x1="90" y1="181" x2="90" y2="189" stroke="#8a8a8a" stroke-width="1"/>
  <text x="82" y="205" fill="#8a8a8a">0.1</text>
  <line x1="180" y1="178" x2="180" y2="192" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="176" y="208" fill="#8a8a8a">1</text>
  <line x1="270" y1="181" x2="270" y2="189" stroke="#8a8a8a" stroke-width="1"/>
  <text x="262" y="205" fill="#8a8a8a">10</text>
  <line x1="360" y1="181" x2="360" y2="189" stroke="#8a8a8a" stroke-width="1"/>
  <text x="348" y="205" fill="#8a8a8a">100</text>
  <line x1="450" y1="181" x2="450" y2="189" stroke="#8a8a8a" stroke-width="1"/>
  <text x="436" y="205" fill="#8a8a8a">1000</text>

  <circle cx="256" cy="185" r="4" fill="#e0645c"/>
  <text x="246" y="172" fill="#e0645c">Pr&#8776;7</text>
  <circle cx="450" cy="185" r="4" fill="#e0645c"/>
  <text x="410" y="172" fill="#e0645c">Sc&#8776;1000</text>
  <text x="120" y="172" fill="#8a8a8a" font-style="italic">momentum races ahead &#8594;</text>

  <!-- ===== boundary-layer consequence, gas ===== -->
  <text x="60" y="252" fill="#8a8a8a" font-weight="bold">Gas: the three layers coincide</text>
  <!-- plate -->
  <line x1="60" y1="380" x2="300" y2="380" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="66" y1="386" x2="60" y2="380" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="90" y1="386" x2="84" y2="380" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="114" y1="386" x2="108" y2="380" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="138" y1="386" x2="132" y2="380" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="162" y1="386" x2="156" y2="380" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="186" y1="386" x2="180" y2="380" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="210" y1="386" x2="204" y2="380" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="234" y1="386" x2="228" y2="380" stroke="#8a8a8a" stroke-width="1"/>
  <!-- three near-coincident BL edges -->
  <path d="M 70 380 Q 190 300 290 296" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <path d="M 70 380 Q 190 306 290 302" fill="none" stroke="#e0645c" stroke-width="2" stroke-dasharray="5 3"/>
  <path d="M 70 380 Q 190 312 290 308" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="2 3"/>
  <text x="298" y="300" fill="#4a90d9">&#948;</text>
  <text x="298" y="313" fill="#8a8a8a">&#8776; &#948;T &#8776; &#948;c</text>

  <!-- ===== boundary-layer consequence, liquid ===== -->
  <text x="380" y="252" fill="#8a8a8a" font-weight="bold">Liquid: thin heat / mass sublayers</text>
  <line x1="380" y1="380" x2="620" y2="380" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="386" y1="386" x2="380" y2="380" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="410" y1="386" x2="404" y2="380" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="434" y1="386" x2="428" y2="380" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="458" y1="386" x2="452" y2="380" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="482" y1="386" x2="476" y2="380" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="506" y1="386" x2="500" y2="380" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="530" y1="386" x2="524" y2="380" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="554" y1="386" x2="548" y2="380" stroke="#8a8a8a" stroke-width="1"/>
  <!-- thick momentum BL -->
  <path d="M 390 380 Q 510 288 610 282" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="612" y="286" fill="#4a90d9">&#948;</text>
  <!-- thin thermal BL -->
  <path d="M 390 380 Q 470 345 560 342" fill="none" stroke="#e0645c" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="564" y="345" fill="#e0645c">&#948;T</text>
  <!-- very thin concentration BL -->
  <path d="M 390 380 Q 450 366 520 364" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="2 3"/>
  <text x="524" y="368" fill="#8a8a8a">&#948;c</text>
</svg>
