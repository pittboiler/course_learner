<svg viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Same plate, same flow: heat and mass ride inside the momentum layer, each pulled thinner by its Pr or Sc.</text>

  <!-- ===================== LIQUID PANEL ===================== -->
  <text x="60" y="52" fill="#e0645c" font-weight="bold">LIQUID (water): Pr, Sc &#8805; 1</text>

  <!-- incoming free stream arrows and labels -->
  <line x1="42" y1="150" x2="92" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="92,150 84,146 84,154" fill="#8a8a8a"/>
  <text x="30" y="145" fill="#4a90d9">U&#8734;</text>
  <line x1="42" y1="205" x2="92" y2="205" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="92,205 84,201 84,209" fill="#8a8a8a"/>
  <text x="30" y="200" fill="#e0645c">T&#8734;</text>
  <line x1="42" y1="260" x2="92" y2="260" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="92,260 84,256 84,264" fill="#8a8a8a"/>
  <text x="26" y="255" fill="#8a8a8a">c&#8734;</text>

  <!-- plate -->
  <line x1="100" y1="345" x2="450" y2="345" stroke="#8a8a8a" stroke-width="2.5"/>
  <line x1="106" y1="352" x2="100" y2="345" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="134" y1="352" x2="128" y2="345" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="162" y1="352" x2="156" y2="345" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="190" y1="352" x2="184" y2="345" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="218" y1="352" x2="212" y2="345" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="246" y1="352" x2="240" y2="345" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="274" y1="352" x2="268" y2="345" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="302" y1="352" x2="296" y2="345" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="330" y1="352" x2="324" y2="345" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="358" y1="352" x2="352" y2="345" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="386" y1="352" x2="380" y2="345" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="414" y1="352" x2="408" y2="345" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="442" y1="352" x2="436" y2="345" stroke="#8a8a8a" stroke-width="1"/>
  <text x="250" y="375" fill="#8a8a8a">plate, distance x &#8594;</text>

  <!-- momentum boundary layer (thickest) -->
  <path d="M 100 345 Q 270 175 450 155" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="456" y="158" fill="#4a90d9">&#948; (spreads with &#957;)</text>

  <!-- thermal boundary layer -->
  <path d="M 100 345 Q 270 250 450 238" fill="none" stroke="#e0645c" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="456" y="241" fill="#e0645c">&#948;T (spreads with &#945;)</text>

  <!-- concentration boundary layer (thinnest) -->
  <path d="M 100 345 Q 270 305 450 298" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="2 3"/>
  <text x="456" y="301" fill="#8a8a8a">&#948;c (spreads with D)</text>

  <!-- ordering note -->
  <text x="150" y="405" fill="#8a8a8a" font-style="italic">&#948; &gt; &#948;T &gt; &#948;c &#160;&#160; ( &#948;/&#948;T &#8776; Pr^(1/3), &#160; &#948;/&#948;c &#8776; Sc^(1/3) )</text>

  <!-- ===================== GAS INSET ===================== -->
  <rect x="500" y="330" width="188" height="92" fill="none" stroke="#8a8a8a" stroke-width="1" rx="4"/>
  <text x="512" y="348" fill="#4a90d9" font-weight="bold" font-size="12">GAS (air): Pr, Sc &#8776; 1</text>
  <line x1="512" y1="405" x2="676" y2="405" stroke="#8a8a8a" stroke-width="2"/>
  <path d="M 520 405 Q 600 372 672 368" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <path d="M 520 405 Q 600 376 672 372" fill="none" stroke="#e0645c" stroke-width="1.8" stroke-dasharray="6 3"/>
  <path d="M 520 405 Q 600 380 672 376" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="2 3"/>
  <text x="560" y="392" fill="#8a8a8a" font-size="12">&#948; &#8776; &#948;T &#8776; &#948;c</text>
</svg>
