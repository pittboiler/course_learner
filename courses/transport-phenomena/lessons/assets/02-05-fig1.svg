<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <text x="20" y="24" fill="#8a8a8a" font-style="italic">The energy equation of change, term by term. Blue = already in the heat equation; coral = new when the fluid moves.</text>

  <!-- ===== equation row (y ~ 90) ===== -->

  <!-- storage box (blue) -->
  <rect x="20" y="66" width="120" height="48" rx="4" fill="#4a90d9" opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="80" y="96" fill="#4a90d9" text-anchor="middle">&#961;c<tspan font-size="11" dy="4">p</tspan><tspan dy="-4"> &#8706;T/&#8706;t</tspan></text>

  <text x="150" y="97" fill="#8a8a8a" text-anchor="middle">+</text>

  <!-- convection box (coral) -->
  <rect x="164" y="66" width="128" height="48" rx="4" fill="#e0645c" opacity="0.12" stroke="#e0645c" stroke-width="2"/>
  <text x="228" y="96" fill="#e0645c" text-anchor="middle">&#961;c<tspan font-size="11" dy="4">p</tspan><tspan dy="-4"> </tspan><tspan font-weight="bold">v</tspan>&#183;&#8711;T</text>

  <text x="308" y="97" fill="#8a8a8a" text-anchor="middle">=</text>

  <!-- conduction box (blue) -->
  <rect x="322" y="66" width="96" height="48" rx="4" fill="#4a90d9" opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="370" y="96" fill="#4a90d9" text-anchor="middle">k&#8711;<tspan dy="-5" font-size="11">2</tspan><tspan dy="5">T</tspan></text>

  <text x="428" y="97" fill="#8a8a8a" text-anchor="middle">+</text>

  <!-- dissipation box (coral) -->
  <rect x="442" y="66" width="96" height="48" rx="4" fill="#e0645c" opacity="0.12" stroke="#e0645c" stroke-width="2"/>
  <text x="490" y="96" fill="#e0645c" text-anchor="middle">&#956;&#934;<tspan font-size="11" dy="4">v</tspan></text>

  <text x="548" y="97" fill="#8a8a8a" text-anchor="middle">+</text>

  <!-- generation box (blue) -->
  <rect x="562" y="66" width="96" height="48" rx="4" fill="#4a90d9" opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="610" y="90" fill="#4a90d9" text-anchor="middle" font-size="12">&#183;</text>
  <text x="610" y="100" fill="#4a90d9" text-anchor="middle">q</text>

  <!-- ===== labels under each term ===== -->
  <text x="80"  y="136" fill="#8a8a8a" text-anchor="middle" font-size="12">storage</text>
  <text x="80"  y="151" fill="#8a8a8a" text-anchor="middle" font-size="12">(heating up)</text>

  <text x="228" y="136" fill="#8a8a8a" text-anchor="middle" font-size="12">convection</text>
  <text x="228" y="151" fill="#8a8a8a" text-anchor="middle" font-size="12">(carried by flow)</text>

  <text x="370" y="136" fill="#8a8a8a" text-anchor="middle" font-size="12">conduction</text>
  <text x="370" y="151" fill="#8a8a8a" text-anchor="middle" font-size="12">(Fourier)</text>

  <text x="490" y="136" fill="#8a8a8a" text-anchor="middle" font-size="12">viscous</text>
  <text x="490" y="151" fill="#8a8a8a" text-anchor="middle" font-size="12">dissipation</text>

  <text x="610" y="136" fill="#8a8a8a" text-anchor="middle" font-size="12">generation</text>
  <text x="610" y="151" fill="#8a8a8a" text-anchor="middle" font-size="12">(reaction, etc.)</text>

  <!-- ===== brace: the two LHS terms are the substantial derivative ===== -->
  <path d="M 20 172 L 20 180 L 148 180 L 148 188 L 148 180 L 292 180 L 292 172"
        fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="156" y="204" fill="#8a8a8a" text-anchor="middle" font-size="13">&#961;c<tspan font-size="10" dy="3">p</tspan><tspan dy="-3"> DT/Dt &#8212; the substantial (following-the-fluid) derivative</tspan></text>

  <!-- ===== recover the heat equation ===== -->
  <text x="20" y="252" fill="#8a8a8a" font-size="13">Set the coral terms to zero &#8212; no flow (</text>
  <text x="299" y="252" fill="#e0645c" font-size="13"><tspan font-weight="bold">v</tspan>=0</text>
  <text x="331" y="252" fill="#8a8a8a" font-size="13">) and no frictional heating &#8212; and the blue terms alone are</text>

  <text x="20" y="284" fill="#4a90d9" font-size="15">&#961;c<tspan font-size="11" dy="4">p</tspan><tspan dy="-4"> &#8706;T/&#8706;t = k&#8711;</tspan><tspan dy="-5" font-size="11">2</tspan><tspan dy="5">T + </tspan></text>
  <text x="190" y="278" fill="#4a90d9" font-size="12">&#183;</text>
  <text x="190" y="288" fill="#4a90d9" font-size="15">q</text>
  <text x="210" y="284" fill="#8a8a8a" font-size="13" font-style="italic">&#8212; exactly the heat-transfer heat equation (Lesson 1.2).</text>

  <text x="20" y="320" fill="#8a8a8a" font-size="13">The energy equation of change is that same law with two extra terms switched on the moment the medium is a moving fluid.</text>
</svg>
