<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">A molecule flies a free distance &#955; carrying its layer's momentum, then collides and hands it on &#8212; that is transport.</text>

  <!-- velocity profile axis (left) -->
  <line x1="70" y1="300" x2="70" y2="72" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,72 65,82 75,82" fill="#8a8a8a"/>
  <text x="56" y="70" fill="#8a8a8a">y</text>

  <!-- velocity arrows: v_x grows with height -->
  <line x1="70" y1="280" x2="90" y2="280" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="90,280 84,277 84,283" fill="#4a90d9"/>
  <line x1="70" y1="240" x2="104" y2="240" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="104,240 98,237 98,243" fill="#4a90d9"/>
  <line x1="70" y1="200" x2="118" y2="200" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="118,200 112,197 112,203" fill="#4a90d9"/>
  <line x1="70" y1="160" x2="132" y2="160" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="132,160 126,157 126,163" fill="#4a90d9"/>
  <line x1="70" y1="120" x2="146" y2="120" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="146,120 140,117 140,123" fill="#4a90d9"/>
  <text x="92" y="316" fill="#4a90d9">v_x(y)</text>

  <!-- two collision layers -->
  <line x1="250" y1="120" x2="520" y2="120" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="250" y1="270" x2="520" y2="270" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="360" y="112" fill="#8a8a8a">fast layer (high v_x)</text>
  <text x="360" y="286" fill="#8a8a8a">slow layer (low v_x)</text>

  <!-- the free flight of length lambda -->
  <line x1="315" y1="120" x2="393" y2="268" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="395,270 383,263 390,255" fill="#e0645c"/>
  <circle cx="315" cy="120" r="6" fill="#4a90d9"/>
  <circle cx="395" cy="270" r="5" fill="#4a90d9"/>
  <!-- mean speed label with overbar -->
  <text x="332" y="205" fill="#e0645c">c</text>
  <line x1="331" y1="194" x2="340" y2="194" stroke="#e0645c" stroke-width="1.5"/>
  <text x="344" y="205" fill="#e0645c">, one free flight</text>

  <!-- collision burst at lower layer -->
  <line x1="395" y1="270" x2="408" y2="264" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="395" y1="270" x2="411" y2="273" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="395" y1="270" x2="406" y2="282" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="395" y1="270" x2="388" y2="284" stroke="#e0645c" stroke-width="1.5"/>

  <!-- faint random-walk continuation -->
  <path d="M 395 270 L 452 178 L 494 246 L 516 192" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="2 4" opacity="0.7"/>

  <!-- lambda bracket -->
  <line x1="548" y1="120" x2="548" y2="270" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="548,120 543,131 553,131" fill="#e0645c"/>
  <polygon points="548,270 543,259 553,259" fill="#e0645c"/>
  <text x="558" y="200" fill="#e0645c">&#955;</text>

  <!-- takeaway -->
  <text x="250" y="316" fill="#8a8a8a" font-style="italic">momentum diffuses down the gradient &#8594; shear stress &#964;_yx</text>
</svg>
