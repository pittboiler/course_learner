<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="20" y="24" fill="#8a8a8a" font-style="italic">Two limits of the same law N_A = x_A(N_A+N_B) + J_A*: the bulk term lives or dies.</text>

  <text x="30" y="58" fill="#8a8a8a" font-weight="bold">Equimolar counterdiffusion</text>
  <text x="30" y="76" fill="#8a8a8a">N_B = &#8722;N_A</text>

  <text x="360" y="58" fill="#8a8a8a" font-weight="bold">Diffusion through stagnant B</text>
  <text x="360" y="76" fill="#8a8a8a">N_B = 0</text>

  <line x1="40" y1="110" x2="300" y2="110" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="40" y1="210" x2="300" y2="210" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="34" y="234" fill="#8a8a8a">high x_A</text>
  <text x="250" y="234" fill="#8a8a8a">low x_A</text>

  <line x1="70" y1="135" x2="180" y2="135" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="180,135 170,130 170,140" fill="#4a90d9"/>
  <text x="120" y="128" fill="#4a90d9">A</text>
  <line x1="130" y1="160" x2="240" y2="160" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="240,160 230,155 230,165" fill="#4a90d9"/>

  <line x1="260" y1="185" x2="150" y2="185" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="150,185 160,180 160,190" fill="#e0645c"/>
  <text x="200" y="200" fill="#e0645c">B</text>
  <line x1="200" y1="160" x2="90" y2="160" stroke="#e0645c" stroke-width="2.5" opacity="0.55"/>
  <polygon points="90,160 100,155 100,165" fill="#e0645c" opacity="0.55"/>

  <text x="52" y="266" fill="#8a8a8a">A and B cross equally &#8594; net molar flow = 0</text>
  <text x="90" y="288" fill="#e0645c" font-weight="bold">v* = 0, bulk term vanishes</text>

  <line x1="370" y1="110" x2="610" y2="110" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="370" y1="210" x2="610" y2="210" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="364" y="234" fill="#8a8a8a">liquid A</text>
  <text x="560" y="234" fill="#8a8a8a">still air</text>

  <line x1="400" y1="132" x2="560" y2="132" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="560,132 550,127 550,137" fill="#4a90d9"/>
  <text x="470" y="125" fill="#4a90d9">A</text>
  <line x1="400" y1="152" x2="560" y2="152" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="560,152 550,147 550,157" fill="#4a90d9"/>

  <circle cx="430" cy="178" r="4" fill="#e0645c"/>
  <circle cx="475" cy="184" r="4" fill="#e0645c"/>
  <circle cx="520" cy="176" r="4" fill="#e0645c"/>
  <circle cx="560" cy="184" r="4" fill="#e0645c"/>
  <text x="440" y="202" fill="#e0645c">B stationary</text>

  <line x1="390" y1="296" x2="590" y2="296" stroke="#8a8a8a" stroke-width="3"/>
  <polygon points="590,296 578,290 578,302" fill="#8a8a8a"/>
  <text x="380" y="270" fill="#8a8a8a">B blocked &#8594; A drags bulk along</text>
  <text x="420" y="290" fill="#8a8a8a" font-weight="bold">net bulk drift (Stefan flow)</text>
</svg>
