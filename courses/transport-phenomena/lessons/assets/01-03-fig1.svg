<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="24" y="24" fill="#8a8a8a" font-style="italic">Three fluxes, one mold: flux = &#8722;(diffusivity, m&#178;/s) &#215; gradient of the "concentration" it carries.</text>

  <line x1="245" y1="44" x2="245" y2="300" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 5"/>
  <line x1="480" y1="44" x2="480" y2="300" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 5"/>

  <text x="70" y="66" fill="#4a90d9" font-weight="bold">MOMENTUM</text>
  <text x="315" y="66" fill="#4a90d9" font-weight="bold">HEAT</text>
  <text x="540" y="66" fill="#4a90d9" font-weight="bold">MASS</text>

  <text x="24" y="104" fill="#8a8a8a" font-size="13">flux of</text>
  <text x="80" y="104" fill="#4a90d9">&#964;<tspan font-size="10" dy="4">yx</tspan></text>
  <text x="264" y="104" fill="#8a8a8a" font-size="13">flux of</text>
  <text x="318" y="104" fill="#4a90d9">q<tspan font-size="10" dy="-6">&#8243;</tspan><tspan font-size="10" dy="10">y</tspan></text>
  <text x="500" y="104" fill="#8a8a8a" font-size="13">flux of</text>
  <text x="556" y="104" fill="#4a90d9">J<tspan font-size="10" dy="-6">*</tspan><tspan font-size="10" dy="10">A</tspan></text>

  <text x="24" y="146" fill="#e0645c">= &#8722;&#957;</text>
  <text x="70" y="146" fill="#8a8a8a">d(&#961;v<tspan font-size="10" dy="4">x</tspan><tspan font-size="14" dy="-4">)/dy</tspan></text>
  <text x="264" y="146" fill="#e0645c">= &#8722;&#945;</text>
  <text x="310" y="146" fill="#8a8a8a">d(&#961;c<tspan font-size="10" dy="4">p</tspan><tspan font-size="14" dy="-4">T)/dy</tspan></text>
  <text x="500" y="146" fill="#e0645c">= &#8722;D<tspan font-size="10" dy="4">AB</tspan></text>
  <text x="556" y="146" fill="#8a8a8a">d(c<tspan font-size="10" dy="4">A</tspan><tspan font-size="14" dy="-4">)/dy</tspan></text>

  <text x="24" y="182" fill="#8a8a8a" font-size="13">diffusivity &#957; (m&#178;/s)</text>
  <text x="264" y="182" fill="#8a8a8a" font-size="13">diffusivity &#945; = k/&#961;c<tspan font-size="10" dy="4">p</tspan></text>
  <text x="500" y="182" fill="#8a8a8a" font-size="13">diffusivity D<tspan font-size="10" dy="4">AB</tspan></text>

  <text x="24" y="204" fill="#8a8a8a" font-size="13">carries &#961;v<tspan font-size="10" dy="4">x</tspan><tspan font-size="13" dy="-4">: momentum/vol</tspan></text>
  <text x="264" y="204" fill="#8a8a8a" font-size="13">carries &#961;c<tspan font-size="10" dy="4">p</tspan><tspan font-size="13" dy="-4">T: heat/vol</tspan></text>
  <text x="500" y="204" fill="#8a8a8a" font-size="13">carries c<tspan font-size="10" dy="4">A</tspan><tspan font-size="13" dy="-4">: moles/vol</tspan></text>

  <line x1="40" y1="284" x2="200" y2="234" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="280" y1="284" x2="440" y2="234" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="516" y1="284" x2="676" y2="234" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="120" y1="240" x2="120" y2="300" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="120,300 116,291 124,291" fill="#e0645c"/>
  <line x1="360" y1="240" x2="360" y2="300" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="360,300 356,291 364,291" fill="#e0645c"/>
  <line x1="596" y1="240" x2="596" y2="300" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="596,300 592,291 604,291" fill="#e0645c"/>

  <text x="24" y="326" fill="#8a8a8a" font-size="13">high</text>
  <text x="180" y="326" fill="#8a8a8a" font-size="13">low</text>
  <text x="264" y="326" fill="#8a8a8a" font-size="13">high</text>
  <text x="420" y="326" fill="#8a8a8a" font-size="13">low</text>
  <text x="500" y="326" fill="#8a8a8a" font-size="13">high</text>
  <text x="656" y="326" fill="#8a8a8a" font-size="13">low</text>
  <text x="70" y="348" fill="#e0645c" font-size="13">flux points down each gradient</text>
  <text x="500" y="348" fill="#8a8a8a" font-size="13">&#957;, &#945;, D<tspan font-size="10" dy="4">AB</tspan><tspan font-size="13" dy="-4"> all &#8776; 10&#8722;&#8309; m&#178;/s (gas)</tspan></text>
</svg>
