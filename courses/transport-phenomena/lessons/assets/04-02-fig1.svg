<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">A evaporates and diffuses up a stagnant B film; its own drift (Stefan flow) bends the profile from a line into a log.</text>

  <!-- ===== left: the Arnold / Stefan cell ===== -->

  <!-- flowing stream at the top -->
  <text x="96" y="60" fill="#8a8a8a">flowing stream, x</text>
  <text x="220" y="60" fill="#8a8a8a">A2</text>
  <text x="240" y="60" fill="#8a8a8a">&#8776; 0</text>
  <line x1="105" y1="80" x2="205" y2="80" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="205,80 196,76 196,84" fill="#8a8a8a"/>

  <!-- tube walls -->
  <line x1="100" y1="72" x2="100" y2="294" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="210" y1="72" x2="210" y2="294" stroke="#8a8a8a" stroke-width="2"/>

  <!-- liquid A pool -->
  <rect x="101" y="256" width="108" height="38" fill="#4a90d9" opacity="0.22"/>
  <text x="128" y="280" fill="#4a90d9">liquid A</text>

  <!-- liquid surface = station 1 -->
  <line x1="100" y1="256" x2="210" y2="256" stroke="#e0645c" stroke-width="2"/>
  <text x="216" y="252" fill="#e0645c">surface: x</text>
  <text x="286" y="252" fill="#e0645c">A1</text>

  <!-- film thickness marker -->
  <line x1="82" y1="94" x2="82" y2="256" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="82,94 78,104 86,104" fill="#8a8a8a"/>
  <polygon points="82,256 78,246 86,246" fill="#8a8a8a"/>
  <line x1="82" y1="94" x2="100" y2="94" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="64" y="179" fill="#8a8a8a">&#948;</text>

  <!-- stagnant B note -->
  <text x="110" y="120" fill="#8a8a8a" font-size="12">stagnant B: N</text>
  <text x="192" y="120" fill="#8a8a8a" font-size="12">B</text>
  <text x="200" y="120" fill="#8a8a8a" font-size="12">= 0</text>

  <!-- Stefan drift arrow -->
  <line x1="155" y1="250" x2="155" y2="100" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="155,100 149,112 161,112" fill="#e0645c"/>
  <text x="162" y="180" fill="#e0645c">N</text>
  <text x="174" y="184" fill="#e0645c" font-size="11">A</text>
  <text x="162" y="198" fill="#e0645c" font-size="12">drift</text>

  <!-- ===== right: concentration profile ===== -->

  <!-- height axis -->
  <line x1="390" y1="294" x2="390" y2="70" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="390,70 385,80 395,80" fill="#8a8a8a"/>
  <text x="382" y="66" fill="#8a8a8a">z</text>
  <line x1="384" y1="90" x2="390" y2="90" stroke="#8a8a8a" stroke-width="1"/>
  <text x="372" y="94" fill="#8a8a8a">&#948;</text>
  <text x="368" y="285" fill="#8a8a8a">0</text>

  <!-- mole-fraction axis -->
  <line x1="384" y1="280" x2="562" y2="280" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="562,280 552,275 552,285" fill="#8a8a8a"/>
  <text x="548" y="298" fill="#8a8a8a">x</text>
  <text x="558" y="302" fill="#8a8a8a" font-size="11">A</text>

  <!-- naive linear profile -->
  <line x1="540" y1="280" x2="415" y2="90" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="426" y="132" fill="#8a8a8a" font-size="12">linear</text>
  <text x="418" y="148" fill="#8a8a8a" font-size="12">(naive Fick)</text>

  <!-- actual log profile -->
  <path d="M 540 280 L 512 232 L 483 185 L 450 138 L 415 90" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="486" y="228" fill="#4a90d9">log</text>
  <text x="470" y="244" fill="#4a90d9">(Stefan)</text>

  <!-- endpoint markers -->
  <circle cx="540" cy="280" r="4" fill="#e0645c"/>
  <text x="516" y="272" fill="#e0645c" font-size="12">x</text>
  <text x="524" y="276" fill="#e0645c" font-size="10">A1</text>
  <circle cx="415" cy="90" r="4" fill="#e0645c"/>
  <text x="420" y="86" fill="#e0645c" font-size="12">x</text>
  <text x="428" y="90" fill="#e0645c" font-size="10">A2</text>
</svg>
