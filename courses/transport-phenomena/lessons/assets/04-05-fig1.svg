<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="24" y="22" fill="#8a8a8a" font-style="italic">Three pictures of the same interface. They agree on the order of k_c but disagree on how it scales with D &#8212; and that is how experiments tell them apart.</text>

  <!-- ==================== PANEL A: FILM ==================== -->
  <text x="60" y="58" fill="#e0645c" font-weight="bold">FILM (Whitman)</text>
  <text x="40" y="76" fill="#8a8a8a" font-size="12">a stagnant layer of thickness &#948;</text>

  <!-- interface wall -->
  <line x1="70" y1="92" x2="70" y2="300" stroke="#e0645c" stroke-width="2.5"/>
  <!-- film region shading via light hatch lines -->
  <line x1="70" y1="300" x2="160" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="160" y1="92" x2="160" y2="300" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- linear concentration profile -->
  <path d="M 70 104 L 160 262 L 232 262" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="46" y="104" fill="#4a90d9" font-size="12">c_s</text>
  <text x="196" y="256" fill="#4a90d9" font-size="12">c&#8734;</text>
  <!-- delta bracket -->
  <line x1="70" y1="312" x2="160" y2="312" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="308" x2="70" y2="316" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="160" y1="308" x2="160" y2="316" stroke="#8a8a8a" stroke-width="1"/>
  <text x="108" y="328" fill="#8a8a8a" font-size="12">&#948;</text>
  <!-- result -->
  <text x="40" y="366" fill="#8a8a8a" font-size="13">k_c = D / &#948;</text>
  <text x="40" y="392" fill="#e0645c" font-weight="bold" font-size="14">k_c &#8733; D</text>

  <!-- ==================== PANEL B: PENETRATION ==================== -->
  <text x="290" y="58" fill="#e0645c" font-weight="bold">PENETRATION (Higbie)</text>
  <text x="278" y="76" fill="#8a8a8a" font-size="12">one element, contact time t_c</text>

  <!-- interface wall -->
  <line x1="300" y1="92" x2="300" y2="300" stroke="#e0645c" stroke-width="2.5"/>
  <!-- fluid element box -->
  <rect x="300" y="118" width="86" height="150" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3" rx="4"/>
  <text x="316" y="286" fill="#8a8a8a" font-size="11">surface element</text>
  <!-- erfc transient profile penetrating in -->
  <path d="M 300 104 Q 316 250 386 258 L 458 258" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="276" y="104" fill="#4a90d9" font-size="12">c_s</text>
  <text x="422" y="252" fill="#4a90d9" font-size="12">c&#8734;</text>
  <!-- penetration depth arrow ~ sqrt(D t) -->
  <line x1="300" y1="330" x2="360" y2="330" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="360,330 352,326 352,334" fill="#8a8a8a"/>
  <text x="300" y="346" fill="#8a8a8a" font-size="11">depth grows as (D t)^&#189;</text>
  <!-- result -->
  <text x="278" y="392" fill="#e0645c" font-weight="bold" font-size="14">k_c &#8733; D^&#189;</text>

  <!-- ==================== PANEL C: SURFACE RENEWAL ==================== -->
  <text x="512" y="58" fill="#e0645c" font-weight="bold">RENEWAL (Danckwerts)</text>
  <text x="500" y="76" fill="#8a8a8a" font-size="12">elements swapped at rate s</text>

  <!-- interface wall -->
  <line x1="520" y1="92" x2="520" y2="300" stroke="#e0645c" stroke-width="2.5"/>
  <!-- three stacked elements at the surface -->
  <rect x="520" y="104" width="46" height="52" fill="none" stroke="#4a90d9" stroke-width="1.8" rx="3"/>
  <rect x="520" y="160" width="46" height="52" fill="none" stroke="#4a90d9" stroke-width="1.8" rx="3"/>
  <rect x="520" y="216" width="46" height="52" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="3 3" rx="3"/>
  <!-- old element leaving to bulk -->
  <path d="M 566 242 Q 626 250 648 300" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="648,300 642,290 652,292" fill="#8a8a8a"/>
  <text x="600" y="272" fill="#8a8a8a" font-size="11">old, aged</text>
  <!-- fresh element arriving from bulk -->
  <path d="M 648 150 Q 620 128 566 130" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="566,130 576,125 574,135" fill="#e0645c"/>
  <text x="596" y="146" fill="#e0645c" font-size="11">fresh, c&#8734;</text>
  <!-- result -->
  <text x="500" y="366" fill="#8a8a8a" font-size="13">k_c = (D s)^&#189;</text>
  <text x="500" y="392" fill="#e0645c" font-weight="bold" font-size="14">k_c &#8733; D^&#189;</text>

  <!-- bottom note -->
  <text x="150" y="420" fill="#8a8a8a" font-style="italic" font-size="12">Real turbulent interfaces measure k_c &#8733; D^0.5 to D^0.7 &#8212; the renewal picture, not the film picture.</text>
</svg>
