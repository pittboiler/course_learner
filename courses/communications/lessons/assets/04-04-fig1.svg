  <text x="30" y="248" fill="#8a8a8a" font-size="12">add &#8211; compare &#8211; select, at one state</text>
  <circle cx="70" cy="276" r="4" fill="#8a8a8a"/>
  <circle cx="70" cy="330" r="4" fill="#8a8a8a"/>
  <circle cx="230" cy="300" r="5" fill="#4a90d9"/>
  <line x1="70" y1="276" x2="230" y2="300" stroke="#4a90d9" stroke-width="2.2"/>
  <line x1="70" y1="330" x2="230" y2="300" stroke="#e0645c" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="20" y="272" fill="#8a8a8a" font-size="10">3</text>
  <text x="20" y="334" fill="#8a8a8a" font-size="10">1</text>
  <text x="112" y="276" fill="#4a90d9" font-size="10">+0 = 3 &#10003; keep</text>
  <text x="112" y="340" fill="#e0645c" font-size="10">+2 = 3 &#8230; tie or worse &#8594; discard</text>
  <text x="242" y="304" fill="#4a90d9" font-size="10">survivor</text>
  <text x="30" y="366" fill="#8a8a8a" font-size="10">Discarding is safe: everything downstream depends only on the state,</text>
  <text x="30" y="379" fill="#8a8a8a" font-size="10">not on how you reached it. That is why the search stays linear.</text>
</svg>