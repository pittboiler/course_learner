<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Signal power is fixed by the transmitter; noise power is whatever your filter lets in.</text>

  <!-- LEFT: narrow receiver -->
  <text x="30" y="48" fill="#8a8a8a" font-size="12">A. Receiver matched to the signal: B = W</text>
  <rect x="120" y="150" width="90" height="60" fill="#e0645c" fill-opacity="0.18" stroke="none"/>
  <line x1="40" y1="210" x2="300" y2="210" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="40" y1="190" x2="300" y2="190" stroke="#e0645c" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="42" y="184" fill="#e0645c" font-size="10">N&#8320;/2 (white)</text>
  <rect x="120" y="150" width="90" height="60" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="214" y="146" fill="#8a8a8a" font-size="10">filter |H|&#178;</text>
  <polygon points="140,210 165,165 190,210" fill="#4a90d9" fill-opacity="0.30" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="146" y="232" fill="#4a90d9" font-size="10">signal</text>
  <text x="292" y="228" fill="#8a8a8a" font-size="11">f</text>
  <line x1="120" y1="252" x2="210" y2="252" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="120,252 129,248 129,256" fill="#8a8a8a"/>
  <polygon points="210,252 201,248 201,256" fill="#8a8a8a"/>
  <text x="152" y="268" fill="#8a8a8a" font-size="11">B</text>
  <text x="60" y="296" fill="#e0645c" font-size="11">noise in = N&#8320;B</text>

  <!-- RIGHT: wide receiver -->
  <text x="370" y="48" fill="#8a8a8a" font-size="12">B. Receiver three times too wide: same signal, 3&#215; the noise</text>
  <rect x="400" y="150" width="210" height="60" fill="#e0645c" fill-opacity="0.18" stroke="none"/>
  <line x1="370" y1="210" x2="640" y2="210" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="370" y1="190" x2="640" y2="190" stroke="#e0645c" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="400" y="150" width="210" height="60" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="480,210 505,165 530,210" fill="#4a90d9" fill-opacity="0.30" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="486" y="232" fill="#4a90d9" font-size="10">signal</text>
  <text x="632" y="228" fill="#8a8a8a" font-size="11">f</text>
  <line x1="400" y1="252" x2="610" y2="252" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="400,252 409,248 409,256" fill="#8a8a8a"/>
  <polygon points="610,252 601,248 601,256" fill="#8a8a8a"/>
  <text x="494" y="268" fill="#8a8a8a" font-size="11">3B</text>
  <text x="410" y="296" fill="#e0645c" font-size="11">noise in = 3N&#8320;B &#8212; 4.8 dB worse SNR, no extra signal</text>
</svg>
