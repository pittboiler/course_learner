<svg viewBox="0 0 660 433" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">Copies apart &#8594; recoverable. Copies overlapping &#8594; gone. Copies drooping &#8594; equalize.</text>

  <!-- A -->
  <text x="20" y="44" fill="#8a8a8a" font-size="12">A. f&#8347; &gt; 2W: a guard band opens up for the reconstruction filter</text>
  <line x1="30" y1="120" x2="645" y2="120" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="60,120 105,78 150,120" fill="#8a8a8a" fill-opacity="0.15" stroke="#8a8a8a" stroke-width="1.8"/>
  <polygon points="270,120 315,78 360,120" fill="#4a90d9" fill-opacity="0.22" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="480,120 525,78 570,120" fill="#8a8a8a" fill-opacity="0.15" stroke="#8a8a8a" stroke-width="1.8"/>
  <rect x="250" y="70" width="130" height="50" fill="none" stroke="#e0645c" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="386" y="80" fill="#e0645c" font-size="10">reconstruction LPF</text>
  <line x1="360" y1="110" x2="480" y2="110" stroke="#e0645c" stroke-width="1.3"/>
  <polygon points="360,110 369,106 369,114" fill="#e0645c"/>
  <polygon points="480,110 471,106 471,114" fill="#e0645c"/>
  <text x="382" y="103" fill="#e0645c" font-size="10">guard band f&#8347; &#8722; 2W</text>
  <text x="308" y="138" fill="#8a8a8a" font-size="11">0</text>
  <text x="514" y="138" fill="#8a8a8a" font-size="11">f&#8347;</text>

  <!-- B -->
  <text x="20" y="188" fill="#8a8a8a" font-size="12">B. f&#8347; &lt; 2W: the copies add where they overlap &#8212; no filter can unmix a sum</text>
  <line x1="30" y1="270" x2="645" y2="270" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="150,270 210,222 270,270" fill="#8a8a8a" fill-opacity="0.15" stroke="#8a8a8a" stroke-width="1.8"/>
  <polygon points="255,270 315,222 375,270" fill="#4a90d9" fill-opacity="0.22" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="360,270 420,222 480,270" fill="#8a8a8a" fill-opacity="0.15" stroke="#8a8a8a" stroke-width="1.8"/>
  <polygon points="255,270 262,264 270,270" fill="#e0645c" fill-opacity="0.55" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="360,270 368,264 375,270" fill="#e0645c" fill-opacity="0.55" stroke="#e0645c" stroke-width="1.5"/>
  <text x="404" y="290" fill="#e0645c" font-size="10">aliasing &#8212; permanent</text>
  <line x1="400" y1="284" x2="374" y2="271" stroke="#e0645c" stroke-width="1"/>
  <text x="308" y="290" fill="#8a8a8a" font-size="11">0</text>

  <!-- C -->
  <text x="20" y="330" fill="#8a8a8a" font-size="12">C. flat-top hold: a sinc envelope droops across every copy, baseband included</text>
  <line x1="30" y1="410" x2="645" y2="410" stroke="#8a8a8a" stroke-width="1.2"/>
  <path d="M60,352 C160,352 210,362 315,368 C420,376 480,396 600,404" fill="none" stroke="#e0645c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="470" y="350" fill="#e0645c" font-size="10">sinc(f&#964;) envelope</text>
  <polygon points="270,410 315,370 360,410" fill="#4a90d9" fill-opacity="0.22" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="480,410 525,392 570,410" fill="#8a8a8a" fill-opacity="0.15" stroke="#8a8a8a" stroke-width="1.8"/>
  <polygon points="60,410 105,356 150,410" fill="#8a8a8a" fill-opacity="0.15" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="308" y="428" fill="#8a8a8a" font-size="11">0</text>
</svg>
