<svg viewBox="0 0 660 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Short memory &#8660; wide spectrum. Each row is one process, seen two ways.</text>
  <text x="90" y="46" fill="#8a8a8a" font-size="12">autocorrelation R(&#964;)</text>
  <text x="430" y="46" fill="#8a8a8a" font-size="12">power spectral density S(f)</text>

  <!-- ROW 1: white -->
  <line x1="30" y1="120" x2="290" y2="120" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="160" y1="120" x2="160" y2="70" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="160,70 155,82 165,82" fill="#4a90d9"/>
  <text x="168" y="76" fill="#4a90d9" font-size="11">impulse</text>
  <text x="152" y="136" fill="#8a8a8a" font-size="11">0</text>
  <text x="284" y="138" fill="#8a8a8a" font-size="11">&#964;</text>

  <line x1="370" y1="120" x2="640" y2="120" stroke="#8a8a8a" stroke-width="1.2"/>
  <rect x="380" y="82" width="250" height="38" fill="#4a90d9" fill-opacity="0.20" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="634" y="138" fill="#8a8a8a" font-size="11">f</text>
  <text x="20" y="100" fill="#e0645c" font-size="11">white</text>

  <!-- ROW 2: medium -->
  <line x1="30" y1="250" x2="290" y2="250" stroke="#8a8a8a" stroke-width="1.2"/>
  <path d="M60,250 C120,250 135,200 160,200 C185,200 200,250 260,250" fill="#4a90d9" fill-opacity="0.16" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="152" y="266" fill="#8a8a8a" font-size="11">0</text>
  <text x="284" y="268" fill="#8a8a8a" font-size="11">&#964;</text>

  <line x1="370" y1="250" x2="640" y2="250" stroke="#8a8a8a" stroke-width="1.2"/>
  <path d="M400,250 C450,250 460,190 505,190 C550,190 560,250 610,250" fill="#4a90d9" fill-opacity="0.16" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="634" y="268" fill="#8a8a8a" font-size="11">f</text>
  <text x="20" y="230" fill="#e0645c" font-size="11">band-<tspan x="20" dy="14">limited</tspan></text>

  <!-- ROW 3: slow -->
  <line x1="30" y1="390" x2="290" y2="390" stroke="#8a8a8a" stroke-width="1.2"/>
  <path d="M40,390 C90,390 100,300 160,300 C220,300 230,390 280,390" fill="#4a90d9" fill-opacity="0.16" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="152" y="406" fill="#8a8a8a" font-size="11">0</text>
  <text x="284" y="408" fill="#8a8a8a" font-size="11">&#964;</text>

  <line x1="370" y1="390" x2="640" y2="390" stroke="#8a8a8a" stroke-width="1.2"/>
  <path d="M470,390 C495,390 498,310 505,310 C512,310 515,390 540,390" fill="#4a90d9" fill-opacity="0.16" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="634" y="408" fill="#8a8a8a" font-size="11">f</text>
  <text x="20" y="370" fill="#e0645c" font-size="11">slow /<tspan x="20" dy="14">narrowband</tspan></text>

  <!-- arrows -->
  <line x1="300" y1="105" x2="358" y2="105" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <polygon points="358,105 348,101 348,109" fill="#8a8a8a"/>
  <text x="302" y="96" fill="#8a8a8a" font-size="10">FT</text>
  <line x1="300" y1="235" x2="358" y2="235" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <polygon points="358,235 348,231 348,239" fill="#8a8a8a"/>
  <line x1="300" y1="375" x2="358" y2="375" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <polygon points="358,375 348,371 348,379" fill="#8a8a8a"/>
</svg>
