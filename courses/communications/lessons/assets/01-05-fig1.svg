<svg viewBox="0 0 660 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">Four ways to spend spectrum on one message (positive frequencies only).</text>

  <!-- Row 1: message -->
  <text x="20" y="46" fill="#8a8a8a" font-size="12">M(f): baseband message, width W</text>
  <line x1="60" y1="100" x2="640" y2="100" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="70,100 70,64 155,100" fill="#4a90d9" fill-opacity="0.25" stroke="#4a90d9" stroke-width="2"/>
  <line x1="70" y1="100" x2="70" y2="108" stroke="#8a8a8a"/>
  <line x1="155" y1="100" x2="155" y2="108" stroke="#8a8a8a"/>
  <text x="64" y="120" fill="#8a8a8a" font-size="11">0</text>
  <text x="150" y="120" fill="#8a8a8a" font-size="11">W</text>
  <text x="640" y="120" fill="#8a8a8a" font-size="11">f</text>

  <!-- Row 2: DSB -->
  <text x="20" y="160" fill="#8a8a8a" font-size="12">DSB-SC: both sidebands, B = 2W. The shaded one is redundant.</text>
  <line x1="60" y1="212" x2="640" y2="212" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="330,212 415,176 415,212" fill="#4a90d9" fill-opacity="0.25" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="330,212 245,176 245,212" fill="#e0645c" fill-opacity="0.20" stroke="#e0645c" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="330" y1="212" x2="330" y2="222" stroke="#8a8a8a"/>
  <text x="318" y="234" fill="#8a8a8a" font-size="11">f<tspan font-size="9" dy="3">c</tspan></text>
  <text x="352" y="172" fill="#4a90d9" font-size="10">USB</text>
  <text x="252" y="172" fill="#e0645c" font-size="10">LSB (mirror)</text>

  <!-- Row 3: SSB -->
  <text x="20" y="268" fill="#8a8a8a" font-size="12">SSB: keep one sideband, B = W. Half the bandwidth, half the power, same SNR.</text>
  <line x1="60" y1="320" x2="640" y2="320" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="330,320 415,284 415,320" fill="#4a90d9" fill-opacity="0.25" stroke="#4a90d9" stroke-width="2"/>
  <line x1="330" y1="320" x2="330" y2="330" stroke="#8a8a8a"/>
  <text x="318" y="342" fill="#8a8a8a" font-size="11">f<tspan font-size="9" dy="3">c</tspan></text>
  <line x1="330" y1="304" x2="415" y2="304" stroke="#e0645c" stroke-width="1.3"/>
  <polygon points="330,304 339,300 339,308" fill="#e0645c"/>
  <polygon points="415,304 406,300 406,308" fill="#e0645c"/>
  <text x="422" y="308" fill="#e0645c" font-size="11">W</text>

  <!-- Row 4: VSB -->
  <text x="20" y="368" fill="#8a8a8a" font-size="12">VSB: a vestige survives; the two wedges are complementary, so they sum to flat.</text>
  <line x1="60" y1="410" x2="640" y2="410" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="360,410 415,386 415,410" fill="#4a90d9" fill-opacity="0.25" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="330,410 360,386 360,410" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="300,410 330,410 330,386" fill="#e0645c" fill-opacity="0.20" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="330" y1="410" x2="330" y2="418" stroke="#8a8a8a"/>
  <text x="318" y="404" fill="#8a8a8a" font-size="10">f<tspan font-size="9" dy="3">c</tspan></text>
  <text x="424" y="392" fill="#8a8a8a" font-size="10">B = W + f<tspan font-size="9" dy="3">v</tspan></text>
  <text x="222" y="404" fill="#e0645c" font-size="10">vestige</text>
</svg>
