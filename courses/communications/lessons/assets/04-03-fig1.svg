<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">Correction is sphere packing in Hamming space; the syndrome names the broken sphere.</text>

  <!-- LEFT: spheres -->
  <text x="30" y="44" fill="#8a8a8a" font-size="12">non-overlapping spheres &#8594; unambiguous</text>
  <circle cx="90" cy="115" r="38" fill="#4a90d9" fill-opacity="0.10" stroke="#4a90d9" stroke-width="1.6" stroke-dasharray="4 3"/>
  <circle cx="210" cy="115" r="38" fill="#4a90d9" fill-opacity="0.10" stroke="#4a90d9" stroke-width="1.6" stroke-dasharray="4 3"/>
  <circle cx="90" cy="115" r="4.5" fill="#4a90d9"/>
  <circle cx="210" cy="115" r="4.5" fill="#4a90d9"/>
  <circle cx="108" cy="100" r="3" fill="#e0645c"/>
  <line x1="108" y1="100" x2="90" y2="115" stroke="#e0645c" stroke-width="1.3"/>
  <text x="112" y="94" fill="#e0645c" font-size="10">received &#8594; snaps here</text>
  <line x1="90" y1="152" x2="210" y2="152" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="90,152 99,148 99,156" fill="#8a8a8a"/>
  <polygon points="210,152 201,148 201,156" fill="#8a8a8a"/>
  <text x="138" y="167" fill="#8a8a8a" font-size="10">d<tspan font-size="8" dy="2">min</tspan><tspan font-size="10" dy="-2"> &#8805; 2t+1</tspan></text>

  <text x="30" y="200" fill="#8a8a8a" font-size="12">overlapping &#8594; ambiguous</text>
  <circle cx="110" cy="255" r="38" fill="#e0645c" fill-opacity="0.10" stroke="#e0645c" stroke-width="1.6" stroke-dasharray="4 3"/>
  <circle cx="170" cy="255" r="38" fill="#e0645c" fill-opacity="0.10" stroke="#e0645c" stroke-width="1.6" stroke-dasharray="4 3"/>
  <circle cx="110" cy="255" r="4.5" fill="#4a90d9"/>
  <circle cx="170" cy="255" r="4.5" fill="#4a90d9"/>
  <circle cx="140" cy="255" r="3" fill="#e0645c"/>
  <text x="196" y="258" fill="#e0645c" font-size="10">which centre?</text>

  <!-- RIGHT: (7,4) Venn -->
  <text x="380" y="44" fill="#8a8a8a" font-size="12">the (7,4) Hamming code, drawn</text>
  <circle cx="470" cy="140" r="66" fill="#4a90d9" fill-opacity="0.10" stroke="#4a90d9" stroke-width="1.6"/>
  <circle cx="530" cy="140" r="66" fill="#4a90d9" fill-opacity="0.10" stroke="#4a90d9" stroke-width="1.6"/>
  <circle cx="500" cy="192" r="66" fill="#4a90d9" fill-opacity="0.10" stroke="#4a90d9" stroke-width="1.6"/>

  <text x="495" y="130" fill="#e0645c" font-size="12">d&#8324;</text>
  <text x="495" y="105" fill="#8a8a8a" font-size="12">d&#8321;</text>
  <text x="466" y="172" fill="#8a8a8a" font-size="12">d&#8322;</text>
  <text x="524" y="172" fill="#8a8a8a" font-size="12">d&#8323;</text>
  <text x="428" y="112" fill="#8a8a8a" font-size="12">p&#8321;</text>
  <text x="562" y="112" fill="#8a8a8a" font-size="12">p&#8322;</text>
  <text x="494" y="240" fill="#8a8a8a" font-size="12">p&#8323;</text>

  <text x="380" y="278" fill="#8a8a8a" font-size="10">each circle&#8217;s bits sum to even. Flip one bit and</text>
  <text x="380" y="291" fill="#8a8a8a" font-size="10">the set of circles that fail names it uniquely &#8212;</text>
  <text x="380" y="304" fill="#8a8a8a" font-size="10">that set is the syndrome.</text>
</svg>
