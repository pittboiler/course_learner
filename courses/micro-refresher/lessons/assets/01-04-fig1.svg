<svg viewBox="0 0 580 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="60" y="26" fill="#8a8a8a" font-style="italic">An own-price fall (p₁↓) pivots the budget line out. Substitution A→B slides along the</text>
  <text x="60" y="44" fill="#8a8a8a" font-style="italic">original curve to the new slope; income B→C shifts parallel to the higher curve.</text>

  <!-- axes -->
  <line x1="65" y1="305" x2="545" y2="305" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="65" y1="305" x2="65" y2="58" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="545,305 535,300 535,310" fill="#8a8a8a"/>
  <polygon points="65,58 60,68 70,68" fill="#8a8a8a"/>
  <text x="538" y="325" fill="#8a8a8a">x₁</text>
  <text x="44" y="70" fill="#8a8a8a">x₂</text>

  <!-- original budget line B0: (0,100)->(50,0) -->
  <line x1="65" y1="65" x2="265" y2="305" stroke="#5a5a5a" stroke-width="2"/>
  <text x="92" y="80" fill="#5a5a5a">B₀ (slope −p₁/p₂)</text>

  <!-- new budget line B1: (0,100)->(100,0) -->
  <line x1="65" y1="65" x2="465" y2="305" stroke="#5a5a5a" stroke-width="2.5"/>
  <text x="392" y="300" fill="#5a5a5a">B₁</text>

  <!-- compensated budget line (dashed), parallel to B1, tangent to IC0: x1+x2=70.7 -->
  <line x1="65" y1="135.3" x2="347.8" y2="305" stroke="#cc8844" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="300" y="150" fill="#cc8844">compensated</text>

  <!-- IC0: u = 1250, x2 = 1250/x1 (through A and B) -->
  <path d="M 125 105 L 145 155 L 165 185 L 185 205 L 206.4 220.1 L 225 230 L 265 245 L 305 255 L 345 262.1"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="112" y="100" fill="#4a90d9">IC₀</text>

  <!-- IC1: u = 2500, x2 = 2500/x1 (through C) -->
  <path d="M 185 105 L 205 133.6 L 225 155 L 265 185 L 305 205 L 345 219.3 L 385 230 L 425 238.3 L 465 245"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="470" y="243" fill="#4a90d9">IC₁</text>

  <!-- droplines to the decomposition axis -->
  <line x1="165" y1="185" x2="165" y2="322" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="206.4" y1="220.1" x2="206.4" y2="322" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="265" y1="185" x2="265" y2="322" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- optima -->
  <circle cx="165" cy="185" r="4.5" fill="#e0645c"/>
  <text x="148" y="180" fill="#e0645c">A</text>
  <circle cx="206.4" cy="220.1" r="4.5" fill="#e0645c"/>
  <text x="210" y="236" fill="#e0645c">B</text>
  <circle cx="265" cy="185" r="4.5" fill="#e0645c"/>
  <text x="270" y="181" fill="#e0645c">C</text>

  <!-- substitution effect bracket on axis -->
  <line x1="165" y1="329" x2="206.4" y2="329" stroke="#e0645c" stroke-width="2"/>
  <polygon points="165,329 173,325 173,333" fill="#e0645c"/>
  <polygon points="206.4,329 198.4,325 198.4,333" fill="#e0645c"/>
  <text x="120" y="350" fill="#e0645c">substitution</text>

  <!-- income effect bracket on axis -->
  <line x1="206.4" y1="329" x2="265" y2="329" stroke="#3a8a5a" stroke-width="2"/>
  <polygon points="206.4,329 214.4,325 214.4,333" fill="#3a8a5a"/>
  <polygon points="265,329 257,325 257,333" fill="#3a8a5a"/>
  <text x="212" y="350" fill="#3a8a5a">income</text>

  <!-- total label -->
  <text x="300" y="350" fill="#8a8a8a">(total = Δx₁)</text>
</svg>
