<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="60" y="26" fill="#8a8a8a" font-style="italic" font-size="13">Concave u: the chord lies below the curve; that gap is the price of risk.</text>

  <!-- axes -->
  <line x1="40" y1="300" x2="548" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="60" y1="40" x2="60" y2="322" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="548,300 538,295 538,305" fill="#8a8a8a"/>
  <polygon points="60,40 55,50 65,50" fill="#8a8a8a"/>
  <text x="540" y="292" fill="#8a8a8a">x</text>
  <text x="42" y="52" fill="#8a8a8a">u</text>

  <!-- droplines from the two outcomes down to the axis -->
  <line x1="120" y1="244" x2="120" y2="300" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="504" y1="76"  x2="504" y2="300" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- chord between (x1,u(x1)) and (x2,u(x2)) -->
  <line x1="120" y1="244" x2="504" y2="76" stroke="#e0645c" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- concave utility curve u(x) -->
  <path d="M 60 295.5 L 120 244 L 200 196.2 L 312 144.8 L 420 104 L 504 76 L 540 64.7"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- horizontal level line at height E[u]: from the CE point on the curve to the chord midpoint -->
  <line x1="276" y1="160" x2="312" y2="160" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- verticals marking CE and E[x] on the axis -->
  <line x1="276" y1="160" x2="276" y2="300" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="312" y1="144.8" x2="312" y2="300" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- the Jensen gap: short bracket between u(E[x]) on the curve and E[u] on the chord -->
  <line x1="330" y1="144.8" x2="330" y2="160" stroke="#c0392b" stroke-width="2"/>
  <line x1="326" y1="144.8" x2="334" y2="144.8" stroke="#c0392b" stroke-width="2"/>
  <line x1="326" y1="160"   x2="334" y2="160"   stroke="#c0392b" stroke-width="2"/>

  <!-- endpoints of the gamble -->
  <circle cx="120" cy="244" r="4.5" fill="#4a90d9"/>
  <circle cx="504" cy="76"  r="4.5" fill="#4a90d9"/>
  <!-- u(E[x]) on the curve, E[u] on the chord -->
  <circle cx="312" cy="144.8" r="4.5" fill="#4a90d9"/>
  <circle cx="312" cy="160" r="4.5" fill="#e0645c"/>
  <!-- CE point on the curve (same height as E[u]) -->
  <circle cx="276" cy="160" r="4.5" fill="#e0645c"/>

  <!-- curve / chord labels -->
  <text x="446" y="98" fill="#4a90d9">u(x)</text>
  <text x="150" y="188" fill="#e0645c">chord</text>

  <!-- gap labels -->
  <text x="150" y="120" fill="#4a90d9">u(𝔼[x])  (on the curve)</text>
  <line x1="214" y1="126" x2="308" y2="144" stroke="#4a90d9" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="340" y="156" fill="#e0645c">𝔼[u(x)]  (on the chord)</text>
  <text x="340" y="140" fill="#c0392b" font-size="12">Jensen gap</text>

  <!-- axis annotations -->
  <text x="108" y="318" fill="#8a8a8a">x₁</text>
  <text x="498" y="318" fill="#8a8a8a">x₂</text>
  <text x="250" y="332" fill="#e0645c">CE</text>
  <text x="300" y="332" fill="#8a8a8a">𝔼[x]</text>

  <!-- risk-premium brace on the axis between CE and E[x] -->
  <line x1="276" y1="308" x2="312" y2="308" stroke="#c0392b" stroke-width="2"/>
  <line x1="276" y1="304" x2="276" y2="312" stroke="#c0392b" stroke-width="2"/>
  <line x1="312" y1="304" x2="312" y2="312" stroke="#c0392b" stroke-width="2"/>
  <text x="360" y="312" fill="#c0392b" font-size="12">π = 𝔼[x] − CE  (risk premium)</text>
</svg>
