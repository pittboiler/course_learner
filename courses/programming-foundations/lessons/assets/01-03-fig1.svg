  <rect x="586.0" y="306.0" width="124.0" height="19.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="648.0" y="319.5" fill="#444444" font-size="10.5" text-anchor="middle">fib(2)</text>
  <rect x="586.0" y="326.0" width="124.0" height="19.0" rx="0" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="648.0" y="339.5" fill="#4a90d9" font-size="10.5" text-anchor="middle">fib(1)</text>
  <text x="648.0" y="358.0" fill="#4a90d9" font-size="10" text-anchor="middle">depth 5 = n frames</text>
  <text x="24.0" y="392.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">Time is the number of nodes in the tree.  Space is the longest root-to-leaf path — the two are wildly different here,</text>
  <text x="24.0" y="408.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">and forgetting the second is how a correct recursion still crashes with a stack overflow.</text>
</svg>
