  <text x="560.0" y="170.0" fill="#d1495b" font-size="10.5" text-anchor="start">computed on the left</text>
  <text x="24.0" y="352.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">15 calls for fib(5).  In general 2·F(n+1) − 1 calls —</text>
  <text x="24.0" y="368.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">exponential, because nothing is remembered.</text>
