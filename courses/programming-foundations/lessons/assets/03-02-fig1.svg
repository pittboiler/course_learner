<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <text x="24.0" y="22.0" fill="#8a8a8a" font-size="12" text-anchor="start" font-style="italic">A rotation is a local rewiring that shortens the tree and leaves the sorted order untouched.</text>
  <text x="180.0" y="58.0" fill="#444444" font-size="11.5" text-anchor="middle">before  —  right-heavy at x</text>
  <line x1="146.0" y1="104.0" x2="224.0" y2="142.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <line x1="224.0" y1="158.0" x2="180.0" y2="196.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <line x1="238.0" y1="158.0" x2="290.0" y2="196.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <line x1="134.0" y1="104.0" x2="96.0" y2="196.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <circle cx="140.0" cy="96.0" r="15.0" fill="#faf9f6" stroke="#444444" stroke-width="1.6"/>
  <text x="140.0" y="100.0" fill="#444444" font-size="11" text-anchor="middle">x</text>
  <circle cx="231.0" cy="150.0" r="15.0" fill="#faf9f6" stroke="#444444" stroke-width="1.6"/>
  <text x="231.0" y="154.0" fill="#444444" font-size="11" text-anchor="middle">y</text>
  <path d="M 96,196 L 79.0,226 L 113.0,226 Z" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="96.0" y="218.0" fill="#8a8a8a" font-size="10" text-anchor="middle">A</text>
  <path d="M 180,196 L 163.0,226 L 197.0,226 Z" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="180.0" y="218.0" fill="#8a8a8a" font-size="10" text-anchor="middle">B</text>
  <path d="M 290,196 L 273.0,226 L 307.0,226 Z" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="290.0" y="218.0" fill="#8a8a8a" font-size="10" text-anchor="middle">C</text>
  <text x="180.0" y="250.0" fill="#d1495b" font-size="10.5" text-anchor="middle">height 3 on the right spine</text>
  <line x1="360.0" y1="150.0" x2="415.8" y2="150.0" stroke="#4a90d9" stroke-width="1.4"/>
  <polygon points="420.0,150.0 415.6,152.3 415.6,147.7" fill="#4a90d9"/>
  <text x="390.0" y="140.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">rotate left</text>
  <text x="580.0" y="58.0" fill="#444444" font-size="11.5" text-anchor="middle">after</text>
  <line x1="574.0" y1="104.0" x2="520.0" y2="142.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <line x1="514.0" y1="158.0" x2="476.0" y2="196.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <line x1="526.0" y1="158.0" x2="562.0" y2="196.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <line x1="590.0" y1="106.0" x2="678.0" y2="190.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <circle cx="580.0" cy="96.0" r="15.0" fill="#faf9f6" stroke="#444444" stroke-width="1.6"/>
  <text x="580.0" y="100.0" fill="#444444" font-size="11" text-anchor="middle">y</text>
  <circle cx="520.0" cy="150.0" r="15.0" fill="#faf9f6" stroke="#444444" stroke-width="1.6"/>
  <text x="520.0" y="154.0" fill="#444444" font-size="11" text-anchor="middle">x</text>
  <path d="M 476,196 L 459.0,226 L 493.0,226 Z" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="476.0" y="218.0" fill="#8a8a8a" font-size="10" text-anchor="middle">A</text>
  <path d="M 562,196 L 545.0,226 L 579.0,226 Z" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="562.0" y="218.0" fill="#8a8a8a" font-size="10" text-anchor="middle">B</text>
  <path d="M 690,196 L 673.0,226 L 707.0,226 Z" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="690.0" y="218.0" fill="#8a8a8a" font-size="10" text-anchor="middle">C</text>
  <text x="580.0" y="250.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">one level shorter</text>
  <text x="24.0" y="300.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">In-order walk before:   A · x · B · y · C</text>
  <text x="266.0" y="300.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">In-order walk after:   A · x · B · y · C</text>
  <text x="500.0" y="300.0" fill="#4a90d9" font-size="10.5" text-anchor="start">—  identical, so the BST property survives.</text>
  <line x1="24.0" y1="324.0" x2="736.0" y2="324.0" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="265.0" y="340.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">scheme</text>
  <text x="435.0" y="340.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">height guarantee</text>
  <text x="605.0" y="340.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">at n = 10⁶</text>
  <rect x="180.0" y="348.0" width="170.0" height="25.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="265.0" y="364.5" fill="#444444" font-size="10.5" text-anchor="middle">perfectly balanced</text>
  <rect x="350.0" y="348.0" width="170.0" height="25.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="435.0" y="364.5" fill="#444444" font-size="10.5" text-anchor="middle">⌊log₂ n⌋</text>
  <rect x="520.0" y="348.0" width="170.0" height="25.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="605.0" y="364.5" fill="#444444" font-size="10.5" text-anchor="middle">19</text>
  <rect x="180.0" y="373.0" width="170.0" height="25.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="265.0" y="389.5" fill="#444444" font-size="10.5" text-anchor="middle">AVL</text>
  <rect x="350.0" y="373.0" width="170.0" height="25.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="435.0" y="389.5" fill="#444444" font-size="10.5" text-anchor="middle">≤ 1.44 log₂ n</text>
  <rect x="520.0" y="373.0" width="170.0" height="25.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="605.0" y="389.5" fill="#444444" font-size="10.5" text-anchor="middle">≈ 28</text>
  <rect x="180.0" y="398.0" width="170.0" height="25.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="265.0" y="414.5" fill="#444444" font-size="10.5" text-anchor="middle">red-black</text>
  <rect x="350.0" y="398.0" width="170.0" height="25.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="435.0" y="414.5" fill="#444444" font-size="10.5" text-anchor="middle">≤ 2 log₂ n</text>
  <rect x="520.0" y="398.0" width="170.0" height="25.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="605.0" y="414.5" fill="#444444" font-size="10.5" text-anchor="middle">≈ 40</text>
  <rect x="180.0" y="423.0" width="170.0" height="25.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="265.0" y="439.5" fill="#444444" font-size="10.5" text-anchor="middle">plain BST, sorted input</text>
  <rect x="350.0" y="423.0" width="170.0" height="25.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="435.0" y="439.5" fill="#444444" font-size="10.5" text-anchor="middle">n − 1</text>
  <rect x="520.0" y="423.0" width="170.0" height="25.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="605.0" y="439.5" fill="#444444" font-size="10.5" text-anchor="middle">999,999</text>
</svg>
