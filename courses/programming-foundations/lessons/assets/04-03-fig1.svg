  <text x="736.0" y="72.0" fill="#8a8a8a" font-size="10.5" text-anchor="end">node label = the running sum</text>
  <text x="736.0" y="90.0" fill="#d1495b" font-size="10.5" text-anchor="end">red = pruned, sum already past 9</text>
  <text x="736.0" y="108.0" fill="#4a90d9" font-size="10.5" text-anchor="end">blue = a solution</text>
  <text x="24.0" y="368.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">Two solutions: {3, 4, 2} and {7, 2}. The search visits 23 nodes; without the “sum &gt; target” check it would visit all 31.</text>
  <text x="24.0" y="384.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">Pruning is a constant-factor win here — but on 8-queens it cuts 16.7 million placements down to 2,057 nodes explored.</text>
  <text x="24.0" y="412.0" fill="#d1495b" font-size="10.5" text-anchor="start">What it never does is change the complexity class. Backtracking is exponential search with the hopeless branches</text>
  <text x="24.0" y="428.0" fill="#d1495b" font-size="10.5" text-anchor="start">abandoned sooner; the tree is smaller, not polynomial.</text>
