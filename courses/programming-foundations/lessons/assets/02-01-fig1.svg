<svg viewBox="0 0 760 450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <text x="24.0" y="22.0" fill="#8a8a8a" font-size="12" text-anchor="start" font-style="italic">One interface, two implementations — and the cost vector is the entire difference.</text>
  <rect x="266.0" y="48.0" width="228.0" height="110.0" rx="8" fill="none" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="380.0" y="70.0" fill="#4a90d9" font-size="12.5" text-anchor="middle">List  (the ADT)</text>
  <text x="380.0" y="92.0" fill="#444444" font-size="10.5" text-anchor="middle">get(i)</text>
  <text x="380.0" y="109.0" fill="#444444" font-size="10.5" text-anchor="middle">insert(i, x)</text>
  <text x="380.0" y="126.0" fill="#444444" font-size="10.5" text-anchor="middle">remove(i)</text>
  <text x="380.0" y="143.0" fill="#444444" font-size="10.5" text-anchor="middle">size()</text>
  <text x="380.0" y="176.0" fill="#8a8a8a" font-size="10" text-anchor="middle">what it promises</text>
  <line x1="300.0" y1="190.0" x2="184.0" y2="222.9" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="180.0,224.0 183.6,220.5 184.9,225.1" fill="#8a8a8a"/>
  <line x1="460.0" y1="190.0" x2="576.0" y2="222.9" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="580.0,224.0 575.1,225.1 576.4,220.5" fill="#8a8a8a"/>
  <text x="178.0" y="244.0" fill="#444444" font-size="11.5" text-anchor="middle">backed by an array</text>
  <rect x="48.0" y="258.0" width="130.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="113.0" y="275.0" fill="#444444" font-size="10" text-anchor="middle">get(i)</text>
  <rect x="178.0" y="258.0" width="130.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="243.0" y="275.0" fill="#444444" font-size="10" text-anchor="middle">Θ(1)</text>
  <rect x="48.0" y="284.0" width="130.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="113.0" y="301.0" fill="#444444" font-size="10" text-anchor="middle">insert at front</text>
  <rect x="178.0" y="284.0" width="130.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="243.0" y="301.0" fill="#444444" font-size="10" text-anchor="middle">Θ(n)</text>
  <rect x="48.0" y="310.0" width="130.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="113.0" y="327.0" fill="#444444" font-size="10" text-anchor="middle">insert at back</text>
  <rect x="178.0" y="310.0" width="130.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="243.0" y="327.0" fill="#444444" font-size="10" text-anchor="middle">Θ(1) amortized</text>
  <rect x="48.0" y="336.0" width="130.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="113.0" y="353.0" fill="#444444" font-size="10" text-anchor="middle">remove(i)</text>
  <rect x="178.0" y="336.0" width="130.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="243.0" y="353.0" fill="#444444" font-size="10" text-anchor="middle">Θ(n)</text>
  <rect x="48.0" y="362.0" width="130.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="113.0" y="379.0" fill="#444444" font-size="10" text-anchor="middle">memory / item</text>
  <rect x="178.0" y="362.0" width="130.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="243.0" y="379.0" fill="#444444" font-size="10" text-anchor="middle">1 slot</text>
  <text x="582.0" y="244.0" fill="#444444" font-size="11.5" text-anchor="middle">backed by a linked list</text>
  <rect x="452.0" y="258.0" width="130.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="517.0" y="275.0" fill="#444444" font-size="10" text-anchor="middle">get(i)</text>
  <rect x="582.0" y="258.0" width="130.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="647.0" y="275.0" fill="#444444" font-size="10" text-anchor="middle">Θ(n)</text>
  <rect x="452.0" y="284.0" width="130.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="517.0" y="301.0" fill="#444444" font-size="10" text-anchor="middle">insert at front</text>
  <rect x="582.0" y="284.0" width="130.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="647.0" y="301.0" fill="#444444" font-size="10" text-anchor="middle">Θ(1)</text>
  <rect x="452.0" y="310.0" width="130.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="517.0" y="327.0" fill="#444444" font-size="10" text-anchor="middle">insert at back</text>
  <rect x="582.0" y="310.0" width="130.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="647.0" y="327.0" fill="#444444" font-size="10" text-anchor="middle">Θ(1) with a tail</text>
  <rect x="452.0" y="336.0" width="130.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="517.0" y="353.0" fill="#444444" font-size="10" text-anchor="middle">remove(i)</text>
  <rect x="582.0" y="336.0" width="130.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="647.0" y="353.0" fill="#444444" font-size="10" text-anchor="middle">Θ(n) to find, Θ(1) to unlink</text>
  <rect x="452.0" y="362.0" width="130.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="517.0" y="379.0" fill="#444444" font-size="10" text-anchor="middle">memory / item</text>
  <rect x="582.0" y="362.0" width="130.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="647.0" y="379.0" fill="#444444" font-size="10" text-anchor="middle">1 slot + 1 pointer</text>
  <text x="24.0" y="414.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">The ADT says nothing about cost — that is the point. Swapping the implementation cannot break a caller's correctness,</text>
  <text x="24.0" y="430.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">only its speed. Which is why choosing one is a design decision you make from the access pattern, not from taste.</text>
</svg>
