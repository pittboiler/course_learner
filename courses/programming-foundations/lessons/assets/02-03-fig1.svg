<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <text x="24.0" y="22.0" fill="#8a8a8a" font-size="12" text-anchor="start" font-style="italic">Insertion and deletion are three pointer writes — but only once you are standing on the right node.</text>
  <text x="24.0" y="72.0" fill="#444444" font-size="11" text-anchor="start">insert x between b and c</text>
  <rect x="230.0" y="96.0" width="64.0" height="30.0" rx="4" fill="none" stroke="#444444" stroke-width="1.4"/>
  <line x1="274.0" y1="96.0" x2="274.0" y2="126.0" stroke="#444444" stroke-width="1.0"/>
  <text x="252.0" y="116.0" fill="#444444" font-size="11.5" text-anchor="middle">b</text>
  <rect x="390.0" y="96.0" width="64.0" height="30.0" rx="4" fill="none" stroke="#444444" stroke-width="1.4"/>
  <line x1="434.0" y1="96.0" x2="434.0" y2="126.0" stroke="#444444" stroke-width="1.0"/>
  <text x="412.0" y="116.0" fill="#444444" font-size="11.5" text-anchor="middle">c</text>
  <rect x="550.0" y="96.0" width="64.0" height="30.0" rx="4" fill="none" stroke="#444444" stroke-width="1.4"/>
  <line x1="594.0" y1="96.0" x2="594.0" y2="126.0" stroke="#444444" stroke-width="1.0"/>
  <text x="572.0" y="116.0" fill="#444444" font-size="11.5" text-anchor="middle">d</text>
  <line x1="284.0" y1="111.0" x2="382.8" y2="111.0" stroke="#444444" stroke-width="1.4"/>
  <polygon points="387.0,111.0 382.6,113.3 382.6,108.7" fill="#444444"/>
  <line x1="444.0" y1="111.0" x2="542.8" y2="111.0" stroke="#444444" stroke-width="1.4"/>
  <polygon points="547.0,111.0 542.6,113.3 542.6,108.7" fill="#444444"/>
  <rect x="300.0" y="166.0" width="64.0" height="30.0" rx="4" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <line x1="344.0" y1="166.0" x2="344.0" y2="196.0" stroke="#4a90d9" stroke-width="1.0"/>
  <text x="322.0" y="186.0" fill="#4a90d9" font-size="11.5" text-anchor="middle">x</text>
  <line x1="310.0" y1="166.0" x2="300.6" y2="160.2" stroke="#4a90d9" stroke-width="1.4"/>
  <polygon points="297.0,158.0 302.0,158.3 299.5,162.3" fill="#4a90d9"/>
  <path d="M 284,117 Q 300,146 300,158" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="300.0,164.0 297.7,159.6 302.3,159.6" fill="#4a90d9"/>
  <path d="M 354,181 Q 400,166 400,130" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="400.0,126.0 402.3,130.4 397.7,130.4" fill="#4a90d9"/>
  <text x="230.0" y="214.0" fill="#4a90d9" font-size="10.5" text-anchor="start">1.  x.next ← b.next        2.  b.next ← x        —  Θ(1), two writes and no shifting.</text>
  <line x1="24.0" y1="242.0" x2="736.0" y2="242.0" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="24.0" y="278.0" fill="#444444" font-size="11" text-anchor="start">delete c</text>
  <rect x="230.0" y="300.0" width="64.0" height="30.0" rx="4" fill="none" stroke="#444444" stroke-width="1.4"/>
  <line x1="274.0" y1="300.0" x2="274.0" y2="330.0" stroke="#444444" stroke-width="1.0"/>
  <text x="252.0" y="320.0" fill="#444444" font-size="11.5" text-anchor="middle">b</text>
  <rect x="390.0" y="300.0" width="64.0" height="30.0" rx="4" fill="none" stroke="#d1495b" stroke-width="1.4"/>
  <line x1="434.0" y1="300.0" x2="434.0" y2="330.0" stroke="#d1495b" stroke-width="1.0"/>
  <text x="412.0" y="320.0" fill="#d1495b" font-size="11.5" text-anchor="middle">c</text>
  <rect x="550.0" y="300.0" width="64.0" height="30.0" rx="4" fill="none" stroke="#444444" stroke-width="1.4"/>
  <line x1="594.0" y1="300.0" x2="594.0" y2="330.0" stroke="#444444" stroke-width="1.0"/>
  <text x="572.0" y="320.0" fill="#444444" font-size="11.5" text-anchor="middle">d</text>
  <line x1="284.0" y1="315.0" x2="382.8" y2="315.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4,3"/>
  <polygon points="387.0,315.0 382.6,317.3 382.6,312.7" fill="#8a8a8a"/>
  <line x1="444.0" y1="315.0" x2="542.8" y2="315.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4,3"/>
  <polygon points="547.0,315.0 542.6,317.3 542.6,312.7" fill="#8a8a8a"/>
  <path d="M 284,311 Q 400,262 546,308" fill="none" stroke="#4a90d9" stroke-width="1.6"/>
  <polygon points="550.0,311.0 545.4,309.1 549.0,306.1" fill="#4a90d9"/>
  <text x="700.0" y="270.0" fill="#4a90d9" font-size="10.5" text-anchor="end">b.next ← c.next</text>
  <text x="24.0" y="382.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">To unlink c you need b — and a singly linked list gives you no way back. That is why a lone reference to a node is</text>
  <text x="24.0" y="398.0" fill="#d1495b" font-size="10.5" text-anchor="start">enough to delete in Θ(1) only in a doubly linked list; in a singly linked one you must first walk from the head, Θ(n).</text>
</svg>
