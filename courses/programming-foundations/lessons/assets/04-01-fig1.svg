  <text x="24.0" y="382.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">11 comparisons here. On already-sorted input it makes n − 1 = 5 and stops early; on reversed input, n(n−1)/2 = 15.</text>
  <text x="24.0" y="398.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">Selection sort makes 15 on all three, because it scans the whole remaining tail whatever the data looks like.</text>
  <text x="24.0" y="422.0" fill="#d1495b" font-size="11" text-anchor="start">Adaptivity is the difference, and it never shows up in the Θ(n²) label.</text>
