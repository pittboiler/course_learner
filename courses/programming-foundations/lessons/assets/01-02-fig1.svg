<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <text x="24.0" y="22.0" fill="#8a8a8a" font-size="12" text-anchor="start" font-style="italic">A loop invariant is a claim that survives every iteration — and that, plus the exit test, gives you the answer.</text>
  <rect x="90.0" y="80.0" width="580.0" height="40.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.1"/>
  <text x="380.0" y="105.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">not looked at yet</text>
  <text x="80.0" y="105.0" fill="#444444" font-size="11.5" text-anchor="end">before</text>
  <text x="680.0" y="105.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">i = 0</text>
  <rect x="90.0" y="170.0" width="580.0" height="40.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.1"/>
  <rect x="90.0" y="170.0" width="230.0" height="40.0" rx="0" fill="none" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="205.0" y="195.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">already scanned</text>
  <text x="495.0" y="195.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">not looked at yet</text>
  <line x1="320.0" y1="162.0" x2="320.0" y2="218.0" stroke="#d1495b" stroke-width="1.6"/>
  <text x="320.0" y="156.0" fill="#d1495b" font-size="11" text-anchor="middle">i</text>
  <text x="80.0" y="195.0" fill="#444444" font-size="11.5" text-anchor="end">during</text>
  <text x="680.0" y="195.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">0 &lt; i &lt; n</text>
  <rect x="90.0" y="260.0" width="580.0" height="40.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.1"/>
  <rect x="90.0" y="260.0" width="580.0" height="40.0" rx="0" fill="none" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="380.0" y="285.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">already scanned</text>
  <text x="80.0" y="285.0" fill="#444444" font-size="11.5" text-anchor="end">after</text>
  <text x="680.0" y="285.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">i = n</text>
  <text x="380.0" y="62.0" fill="#4a90d9" font-size="12" text-anchor="middle">invariant:  best  is the answer for  a[0 .. i−1]</text>
  <text x="24.0" y="330.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">Initialization — true when i = 0: the empty-prefix answer is 0, which is what best holds.</text>
  <text x="24.0" y="346.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">Maintenance — one more element is scanned and best is updated, so it is again the answer for the longer prefix.</text>
  <text x="24.0" y="362.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">Termination — the loop exits at i = n, so the invariant now says best is the answer for the whole array.</text>
  <text x="24.0" y="386.0" fill="#d1495b" font-size="11" text-anchor="start">All three are needed.  Two out of three proves nothing — and the one people skip is initialization.</text>
</svg>
