  <text x="415.0" y="338.0" fill="#8a8a8a" font-size="10" text-anchor="middle">append number</text>
  <text x="118.0" y="156.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">cost of this append (element writes)</text>
  <text x="24.0" y="368.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">The spikes are the copies. They double in height but halve in frequency, so the total over n appends is n − 1 copies:</text>
  <text x="24.0" y="384.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">1 + 2 + 4 + ⋯ + n/2 &lt; n.  Grow by a fixed amount instead and the same sum becomes n²/2c — quadratic, for any c.</text>
  <text x="24.0" y="410.0" fill="#4a90d9" font-size="11" text-anchor="start">Factor, not amount. That is the whole rule.</text>
