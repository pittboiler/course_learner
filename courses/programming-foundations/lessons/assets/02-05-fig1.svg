<svg viewBox="0 0 760 450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <text x="24.0" y="22.0" fill="#8a8a8a" font-size="12" text-anchor="start" font-style="italic">A hash table is an array you index by arithmetic on the key — and a plan for when two keys collide.</text>
  <text x="70.0" y="62.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">keys</text>
  <text x="70.0" y="84.0" fill="#444444" font-size="11" text-anchor="middle">"ada"</text>
  <text x="70.0" y="108.0" fill="#444444" font-size="11" text-anchor="middle">"grace"</text>
  <text x="70.0" y="132.0" fill="#444444" font-size="11" text-anchor="middle">"alan"</text>
  <text x="70.0" y="156.0" fill="#444444" font-size="11" text-anchor="middle">"edsger"</text>
  <text x="70.0" y="180.0" fill="#444444" font-size="11" text-anchor="middle">"barbara"</text>
  <text x="196.0" y="62.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">h(key) mod 6</text>
  <text x="196.0" y="120.0" fill="#8a8a8a" font-size="14" text-anchor="middle">↓</text>
