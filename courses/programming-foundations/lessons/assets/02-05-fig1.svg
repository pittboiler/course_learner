  <rect x="300.0" y="122.0" width="44.0" height="32.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="322.0" y="143.0" fill="#8a8a8a" font-size="11" text-anchor="middle">1</text>
  <rect x="300.0" y="168.0" width="44.0" height="32.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="322.0" y="189.0" fill="#8a8a8a" font-size="11" text-anchor="middle">2</text>
  <rect x="300.0" y="214.0" width="44.0" height="32.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="322.0" y="235.0" fill="#8a8a8a" font-size="11" text-anchor="middle">3</text>
  <rect x="300.0" y="260.0" width="44.0" height="32.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="322.0" y="281.0" fill="#8a8a8a" font-size="11" text-anchor="middle">4</text>
  <rect x="300.0" y="306.0" width="44.0" height="32.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="322.0" y="327.0" fill="#8a8a8a" font-size="11" text-anchor="middle">5</text>
  <line x1="344.0" y1="138.0" x2="361.8" y2="138.0" stroke="#4a90d9" stroke-width="1.4"/>
  <polygon points="366.0,138.0 361.6,140.3 361.6,135.7" fill="#4a90d9"/>
  <rect x="366.0" y="124.0" width="74.0" height="28.0" rx="4" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="403.0" y="143.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">ada</text>
  <line x1="440.0" y1="138.0" x2="457.8" y2="138.0" stroke="#4a90d9" stroke-width="1.4"/>
  <polygon points="462.0,138.0 457.6,140.3 457.6,135.7" fill="#4a90d9"/>
  <rect x="462.0" y="124.0" width="74.0" height="28.0" rx="4" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="499.0" y="143.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">alan</text>
  <line x1="536.0" y1="138.0" x2="553.8" y2="138.0" stroke="#4a90d9" stroke-width="1.4"/>
  <polygon points="558.0,138.0 553.6,140.3 553.6,135.7" fill="#4a90d9"/>
  <rect x="558.0" y="124.0" width="74.0" height="28.0" rx="4" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="595.0" y="143.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">barbara</text>
  <line x1="344.0" y1="230.0" x2="361.8" y2="230.0" stroke="#4a90d9" stroke-width="1.4"/>
  <polygon points="366.0,230.0 361.6,232.3 361.6,227.7" fill="#4a90d9"/>
  <rect x="366.0" y="216.0" width="74.0" height="28.0" rx="4" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="403.0" y="235.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">grace</text>
  <line x1="344.0" y1="276.0" x2="361.8" y2="276.0" stroke="#4a90d9" stroke-width="1.4"/>
  <polygon points="366.0,276.0 361.6,278.3 361.6,273.7" fill="#4a90d9"/>
  <rect x="366.0" y="262.0" width="74.0" height="28.0" rx="4" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="403.0" y="281.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">edsger</text>
  <text x="736.0" y="114.0" fill="#d1495b" font-size="10.5" text-anchor="end">three keys, one bucket — a collision chain</text>
  <text x="24.0" y="368.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">Load factor α = items / buckets. With chaining, the expected chain length is α, so a lookup costs 1 + α probes —</text>
  <text x="24.0" y="384.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">constant, as long as you resize to hold α bounded. That “expected” is over the hash function, not over the keys.</text>
  <text x="331.0" y="396.0" fill="#8a8a8a" font-size="8.5" text-anchor="middle">α=0.5 chain</text>
  <text x="393.0" y="396.0" fill="#8a8a8a" font-size="8.5" text-anchor="middle">α=0.5 probe</text>
  <text x="455.0" y="396.0" fill="#8a8a8a" font-size="8.5" text-anchor="middle">α=0.75 chain</text>
  <text x="517.0" y="396.0" fill="#8a8a8a" font-size="8.5" text-anchor="middle">α=0.75 probe</text>
  <text x="579.0" y="396.0" fill="#8a8a8a" font-size="8.5" text-anchor="middle">α=1 chain</text>
  <text x="641.0" y="396.0" fill="#8a8a8a" font-size="8.5" text-anchor="middle">α=1 probe</text>
  <rect x="300.0" y="404.0" width="62.0" height="24.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="331.0" y="420.0" fill="#444444" font-size="10" text-anchor="middle">1.5</text>
  <rect x="362.0" y="404.0" width="62.0" height="24.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="393.0" y="420.0" fill="#444444" font-size="10" text-anchor="middle">2.5</text>
  <rect x="424.0" y="404.0" width="62.0" height="24.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="455.0" y="420.0" fill="#444444" font-size="10" text-anchor="middle">1.75</text>
  <rect x="486.0" y="404.0" width="62.0" height="24.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="517.0" y="420.0" fill="#444444" font-size="10" text-anchor="middle">8.5</text>
  <rect x="548.0" y="404.0" width="62.0" height="24.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="579.0" y="420.0" fill="#444444" font-size="10" text-anchor="middle">2.0</text>
  <rect x="610.0" y="404.0" width="62.0" height="24.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="641.0" y="420.0" fill="#444444" font-size="10" text-anchor="middle">∞</text>
  <text x="24.0" y="412.0" fill="#8a8a8a" font-size="10" text-anchor="start">expected probes,</text>
  <text x="24.0" y="426.0" fill="#8a8a8a" font-size="10" text-anchor="start">unsuccessful search:</text>
  <text x="24.0" y="446.0" fill="#8a8a8a" font-size="10" text-anchor="start">(chaining / linear probing)</text>
</svg>
