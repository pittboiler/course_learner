<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <text x="24.0" y="22.0" fill="#8a8a8a" font-size="12" text-anchor="start" font-style="italic">A queue in an array only works if the array is allowed to wrap.</text>
  <rect x="178.0" y="74.0" width="44.0" height="32.0" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="200.0" y="52.0" fill="#8a8a8a" font-size="10" text-anchor="middle">0</text>
  <rect x="255.8" y="106.2" width="44.0" height="32.0" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="307.5" y="96.5" fill="#8a8a8a" font-size="10" text-anchor="middle">1</text>
  <rect x="288.0" y="184.0" width="44.0" height="32.0" rx="4" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="310.0" y="205.0" fill="#4a90d9" font-size="12" text-anchor="middle">c</text>
  <text x="352.0" y="204.0" fill="#8a8a8a" font-size="10" text-anchor="middle">2</text>
  <rect x="255.8" y="261.8" width="44.0" height="32.0" rx="4" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="277.8" y="282.8" fill="#4a90d9" font-size="12" text-anchor="middle">d</text>
  <text x="307.5" y="311.5" fill="#8a8a8a" font-size="10" text-anchor="middle">3</text>
  <rect x="178.0" y="294.0" width="44.0" height="32.0" rx="4" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="200.0" y="315.0" fill="#4a90d9" font-size="12" text-anchor="middle">e</text>
  <text x="200.0" y="356.0" fill="#8a8a8a" font-size="10" text-anchor="middle">4</text>
  <rect x="100.2" y="261.8" width="44.0" height="32.0" rx="4" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="122.2" y="282.8" fill="#4a90d9" font-size="12" text-anchor="middle">f</text>
  <text x="92.5" y="311.5" fill="#8a8a8a" font-size="10" text-anchor="middle">5</text>
  <rect x="68.0" y="184.0" width="44.0" height="32.0" rx="4" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="90.0" y="205.0" fill="#4a90d9" font-size="12" text-anchor="middle">g</text>
  <text x="48.0" y="204.0" fill="#8a8a8a" font-size="10" text-anchor="middle">6</text>
  <rect x="100.2" y="106.2" width="44.0" height="32.0" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="92.5" y="96.5" fill="#8a8a8a" font-size="10" text-anchor="middle">7</text>
  <text x="258.0" y="204.0" fill="#d1495b" font-size="10.5" text-anchor="middle">head</text>
  <text x="159.0" y="163.0" fill="#d1495b" font-size="10.5" text-anchor="middle">tail</text>
  <text x="200.0" y="205.0" fill="#8a8a8a" font-size="11" text-anchor="middle">capacity 8</text>
  <text x="200.0" y="222.0" fill="#8a8a8a" font-size="11" text-anchor="middle">size 5</text>
  <text x="430.0" y="70.0" fill="#444444" font-size="11" text-anchor="start">enqueue:   a[tail] ← x ;   tail ← (tail + 1) mod 8</text>
  <text x="430.0" y="92.0" fill="#444444" font-size="11" text-anchor="start">dequeue:   x ← a[head] ; head ← (head + 1) mod 8</text>
  <text x="430.0" y="120.0" fill="#4a90d9" font-size="10.5" text-anchor="start">Both are Θ(1). The mod is what buys it —</text>
  <text x="430.0" y="136.0" fill="#4a90d9" font-size="10.5" text-anchor="start">without wrapping you either shift every</text>
  <text x="430.0" y="152.0" fill="#4a90d9" font-size="10.5" text-anchor="start">element down on each dequeue (Θ(n)),</text>
  <text x="430.0" y="168.0" fill="#4a90d9" font-size="10.5" text-anchor="start">or run off the end of a half-empty array.</text>
  <text x="430.0" y="206.0" fill="#d1495b" font-size="10.5" text-anchor="start">Full and empty both give head = tail,</text>
  <text x="430.0" y="222.0" fill="#d1495b" font-size="10.5" text-anchor="start">so a separate size counter (or one</text>
  <text x="430.0" y="238.0" fill="#d1495b" font-size="10.5" text-anchor="start">deliberately wasted slot) is required.</text>
  <text x="430.0" y="254.0" fill="#d1495b" font-size="10.5" text-anchor="start">Getting this wrong is the classic</text>
  <text x="430.0" y="270.0" fill="#d1495b" font-size="10.5" text-anchor="start">ring-buffer bug.</text>
  <line x1="24.0" y1="330.0" x2="736.0" y2="330.0" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="250.0" y="346.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">operation</text>
  <text x="450.0" y="346.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">array-backed</text>
  <text x="650.0" y="346.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">list-backed</text>
  <rect x="150.0" y="354.0" width="200.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="250.0" y="371.0" fill="#444444" font-size="10.5" text-anchor="middle">push / pop</text>
  <rect x="350.0" y="354.0" width="200.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="450.0" y="371.0" fill="#444444" font-size="10.5" text-anchor="middle">Θ(1)</text>
  <rect x="550.0" y="354.0" width="200.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="650.0" y="371.0" fill="#444444" font-size="10.5" text-anchor="middle">Θ(1)</text>
  <rect x="150.0" y="380.0" width="200.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="250.0" y="397.0" fill="#444444" font-size="10.5" text-anchor="middle">enqueue / dequeue</text>
  <rect x="350.0" y="380.0" width="200.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="450.0" y="397.0" fill="#444444" font-size="10.5" text-anchor="middle">Θ(n) naive, Θ(1) circular</text>
  <rect x="550.0" y="380.0" width="200.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="650.0" y="397.0" fill="#444444" font-size="10.5" text-anchor="middle">Θ(1)</text>
</svg>
