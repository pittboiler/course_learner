<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <text x="24.0" y="22.0" fill="#8a8a8a" font-size="12" text-anchor="start" font-style="italic">Count what the innermost line does, keep the term that wins, drop the constants.</text>
  <text x="270.0" y="82.0" fill="#8a8a8a" font-size="11" text-anchor="middle">loop</text>
  <text x="450.0" y="82.0" fill="#8a8a8a" font-size="11" text-anchor="middle">exact count</text>
  <text x="630.0" y="82.0" fill="#8a8a8a" font-size="11" text-anchor="middle">class</text>
  <text x="170.0" y="111.0" fill="#8a8a8a" font-size="11" text-anchor="end"></text>
  <rect x="180.0" y="90.0" width="180.0" height="34.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="270.0" y="111.0" fill="#444444" font-size="10.5" text-anchor="middle">for i in 0..n−1:  s += a[i]</text>
  <rect x="360.0" y="90.0" width="180.0" height="34.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="450.0" y="111.0" fill="#444444" font-size="10.5" text-anchor="middle">n</text>
  <rect x="540.0" y="90.0" width="180.0" height="34.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="630.0" y="111.0" fill="#444444" font-size="10.5" text-anchor="middle">Θ(n)</text>
  <text x="170.0" y="145.0" fill="#8a8a8a" font-size="11" text-anchor="end"></text>
  <rect x="180.0" y="124.0" width="180.0" height="34.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="270.0" y="145.0" fill="#444444" font-size="10.5" text-anchor="middle">for i in 0..n−1:  for j in 0..n−1:  …</text>
  <rect x="360.0" y="124.0" width="180.0" height="34.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="450.0" y="145.0" fill="#444444" font-size="10.5" text-anchor="middle">n · n = n²</text>
  <rect x="540.0" y="124.0" width="180.0" height="34.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="630.0" y="145.0" fill="#444444" font-size="10.5" text-anchor="middle">Θ(n²)</text>
  <text x="170.0" y="179.0" fill="#8a8a8a" font-size="11" text-anchor="end"></text>
  <rect x="180.0" y="158.0" width="180.0" height="34.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="270.0" y="179.0" fill="#444444" font-size="10.5" text-anchor="middle">for i in 0..n−1:  for j in 0..i−1:  …</text>
  <rect x="360.0" y="158.0" width="180.0" height="34.0" rx="0" fill="none" stroke="#4a90d9" stroke-width="1.7"/>
  <text x="450.0" y="179.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">n(n−1)/2</text>
  <rect x="540.0" y="158.0" width="180.0" height="34.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="630.0" y="179.0" fill="#444444" font-size="10.5" text-anchor="middle">Θ(n²)</text>
  <text x="170.0" y="213.0" fill="#8a8a8a" font-size="11" text-anchor="end"></text>
  <rect x="180.0" y="192.0" width="180.0" height="34.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="270.0" y="213.0" fill="#444444" font-size="10.5" text-anchor="middle">while n &gt; 1:  n = n / 2</text>
  <rect x="360.0" y="192.0" width="180.0" height="34.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="450.0" y="213.0" fill="#444444" font-size="10.5" text-anchor="middle">⌊log₂ n⌋ + 1</text>
  <rect x="540.0" y="192.0" width="180.0" height="34.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="630.0" y="213.0" fill="#444444" font-size="10.5" text-anchor="middle">Θ(log n)</text>
  <text x="170.0" y="247.0" fill="#8a8a8a" font-size="11" text-anchor="end"></text>
  <rect x="180.0" y="226.0" width="180.0" height="34.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="270.0" y="247.0" fill="#444444" font-size="10.5" text-anchor="middle">for i in 0..n−1:  while m &gt; 1: m = m/2</text>
  <rect x="360.0" y="226.0" width="180.0" height="34.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="450.0" y="247.0" fill="#444444" font-size="10.5" text-anchor="middle">n log₂ n</text>
  <rect x="540.0" y="226.0" width="180.0" height="34.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="630.0" y="247.0" fill="#444444" font-size="10.5" text-anchor="middle">Θ(n log n)</text>
  <text x="180.0" y="300.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">The third row is the one people get wrong: the inner loop runs 0, 1, 2, …, n−1 times,</text>
  <text x="180.0" y="316.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">not n times — but the half is a constant, so it is Θ(n²) all the same.</text>
  <line x1="24.0" y1="340.0" x2="736.0" y2="340.0" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="24.0" y="362.0" fill="#8a8a8a" font-size="11" text-anchor="start">At a billion operations per second:</text>
  <text x="282.5" y="372.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle"></text>
  <text x="407.5" y="372.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">n</text>
  <text x="532.5" y="372.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">n log₂ n</text>
  <text x="657.5" y="372.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">n²</text>
  <rect x="220.0" y="380.0" width="125.0" height="24.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="282.5" y="396.0" fill="#444444" font-size="10.5" text-anchor="middle">n = 1,000</text>
  <rect x="345.0" y="380.0" width="125.0" height="24.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="407.5" y="396.0" fill="#444444" font-size="10.5" text-anchor="middle">1 µs</text>
  <rect x="470.0" y="380.0" width="125.0" height="24.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="532.5" y="396.0" fill="#444444" font-size="10.5" text-anchor="middle">10 µs</text>
  <rect x="595.0" y="380.0" width="125.0" height="24.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="657.5" y="396.0" fill="#444444" font-size="10.5" text-anchor="middle">1 ms</text>
  <rect x="220.0" y="404.0" width="125.0" height="24.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="282.5" y="420.0" fill="#444444" font-size="10.5" text-anchor="middle">n = 10⁶</text>
  <rect x="345.0" y="404.0" width="125.0" height="24.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="407.5" y="420.0" fill="#444444" font-size="10.5" text-anchor="middle">1 ms</text>
  <rect x="470.0" y="404.0" width="125.0" height="24.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="532.5" y="420.0" fill="#444444" font-size="10.5" text-anchor="middle">20 ms</text>
  <rect x="595.0" y="404.0" width="125.0" height="24.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="657.5" y="420.0" fill="#444444" font-size="10.5" text-anchor="middle">17 minutes</text>
  <rect x="220.0" y="428.0" width="125.0" height="24.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="282.5" y="444.0" fill="#444444" font-size="10.5" text-anchor="middle">n = 10⁹</text>
  <rect x="345.0" y="428.0" width="125.0" height="24.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="407.5" y="444.0" fill="#444444" font-size="10.5" text-anchor="middle">1 s</text>
  <rect x="470.0" y="428.0" width="125.0" height="24.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="532.5" y="444.0" fill="#444444" font-size="10.5" text-anchor="middle">30 s</text>
  <rect x="595.0" y="428.0" width="125.0" height="24.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="657.5" y="444.0" fill="#444444" font-size="10.5" text-anchor="middle">30 years</text>
</svg>
