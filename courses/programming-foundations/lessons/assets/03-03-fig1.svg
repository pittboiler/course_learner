  <text x="24.0" y="382.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">Heap property: every parent ≤ both children. That is much weaker than a BST — 3 and 2 sit on the same level out of</text>
  <text x="24.0" y="398.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">order and nothing is wrong. It buys exactly one thing: the minimum is at index 0, always, in Θ(1).</text>
  <text x="24.0" y="424.0" fill="#4a90d9" font-size="11" text-anchor="start">Insert sifts up, extract-min sifts down — each walks one root-to-leaf path, so both are Θ(log n).</text>
