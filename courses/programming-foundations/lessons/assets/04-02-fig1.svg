  <text x="24.0" y="428.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">Same graph, same loop — the only difference is whether the bag is a queue or a stack. BFS's numbers are hop-distances</text>
  <text x="24.0" y="444.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">from A; DFS's order is a record of where the search wandered, and carries no distance meaning at all.</text>
