<svg viewBox="0 0 700.0 400.0" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="11.5" text-anchor="start" font-style="italic">Three disjoint blocks, three different estimands: only the last one is an honest estimate of risk.</text>
  <rect x="40.0" y="48.0" width="372.0" height="44.0" fill="#4a90d9" stroke="#8a8a8a" stroke-width="1.0" fill-opacity="0.1"/>
  <rect x="412.0" y="48.0" width="124.0" height="44.0" fill="#4a90d9" stroke="#8a8a8a" stroke-width="1.0" fill-opacity="0.18"/>
  <rect x="536.0" y="48.0" width="124.0" height="44.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.6" fill-opacity="0.14"/>
  <text x="226.0" y="67.0" fill="#4a90d9" font-size="12.5" text-anchor="middle" font-weight="bold">TRAIN</text>
  <text x="226.0" y="83.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">60 percent</text>
  <text x="474.0" y="67.0" fill="#4a90d9" font-size="11.5" text-anchor="middle" font-weight="bold">VALIDATION</text>
  <text x="474.0" y="83.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">20 percent</text>
  <text x="598.0" y="67.0" fill="#e0645c" font-size="12.5" text-anchor="middle" font-weight="bold">TEST</text>
  <text x="598.0" y="83.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">20 percent</text>
  <line x1="226.0" y1="96.0" x2="226.0" y2="196.0" stroke="#4a90d9" stroke-width="1.4"/>
  <line x1="226.0" y1="196.0" x2="223.6" y2="190.5" stroke="#4a90d9" stroke-width="1.4"/>
  <line x1="226.0" y1="196.0" x2="228.4" y2="190.5" stroke="#4a90d9" stroke-width="1.4"/>
  <line x1="474.0" y1="96.0" x2="474.0" y2="196.0" stroke="#4a90d9" stroke-width="1.4"/>
  <line x1="474.0" y1="196.0" x2="471.6" y2="190.5" stroke="#4a90d9" stroke-width="1.4"/>
  <line x1="474.0" y1="196.0" x2="476.4" y2="190.5" stroke="#4a90d9" stroke-width="1.4"/>
  <line x1="598.0" y1="96.0" x2="598.0" y2="196.0" stroke="#e0645c" stroke-width="1.8"/>
  <line x1="598.0" y1="196.0" x2="595.6" y2="190.5" stroke="#e0645c" stroke-width="1.8"/>
  <line x1="598.0" y1="196.0" x2="600.4" y2="190.5" stroke="#e0645c" stroke-width="1.8"/>
  <text x="234.0" y="150.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">used k times, freely</text>
  <text x="480.0" y="135.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">k looks</text>
  <text x="604.0" y="168.0" fill="#e0645c" font-size="10.5" text-anchor="start">once, at</text>
  <text x="604.0" y="181.0" fill="#e0645c" font-size="10.5" text-anchor="start">the end</text>
  <rect x="45.0" y="200.0" width="362.0" height="46.0" fill="none" stroke="#4a90d9" stroke-width="1.0" rx="4"/>
  <rect x="415.0" y="200.0" width="118.0" height="46.0" fill="none" stroke="#4a90d9" stroke-width="1.0" rx="4"/>
  <rect x="541.0" y="200.0" width="114.0" height="46.0" fill="none" stroke="#e0645c" stroke-width="1.6" rx="4"/>
  <text x="226.0" y="228.0" fill="#4a90d9" font-size="12.5" text-anchor="middle">Fit every candidate</text>
  <text x="474.0" y="228.0" fill="#4a90d9" font-size="12.5" text-anchor="middle">Pick a winner</text>
  <text x="598.0" y="228.0" fill="#e0645c" font-size="12.5" text-anchor="middle">Report</text>
  <text x="226.0" y="268.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">training error: not an estimate of risk</text>
  <text x="226.0" y="282.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">at all, because h was chosen using it</text>
