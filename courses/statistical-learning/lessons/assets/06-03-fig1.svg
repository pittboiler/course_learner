  <text x="318.0" y="223.0" fill="#e0645c" font-size="10" text-anchor="start">fixed point</text>
  <text x="147.8" y="209.0" fill="#4a90d9" font-size="10.5" text-anchor="end">E-step</text>
  <text x="187.5" y="124.0" fill="#e0645c" font-size="10.5" text-anchor="middle">M-step</text>
  <text x="435.2" y="307.4" fill="#8a8a8a" font-size="10" text-anchor="middle">tight curve: q = p(z given x, theta)</text>
  <text x="546.0" y="96.0" fill="#4a90d9" font-size="10.5" text-anchor="start">E-step (vertical):</text>
  <text x="546.0" y="111.0" fill="#8a8a8a" font-size="10" text-anchor="start">max over q, closing</text>
  <text x="546.0" y="125.0" fill="#8a8a8a" font-size="10" text-anchor="start">the KL gap</text>
  <text x="546.0" y="156.0" fill="#e0645c" font-size="10.5" text-anchor="start">M-step (horizontal):</text>
  <text x="546.0" y="171.0" fill="#8a8a8a" font-size="10" text-anchor="start">max over theta,</text>
  <text x="546.0" y="185.0" fill="#8a8a8a" font-size="10" text-anchor="start">which reopens it</text>
  <text x="546.0" y="216.0" fill="#8a8a8a" font-size="10" text-anchor="start">dashed: level sets</text>
  <text x="546.0" y="230.0" fill="#8a8a8a" font-size="10" text-anchor="start">of the ELBO</text>
  <text x="546.0" y="261.0" fill="#8a8a8a" font-size="10" text-anchor="start">Restricting q to a</text>
  <text x="546.0" y="275.0" fill="#8a8a8a" font-size="10" text-anchor="start">family bends the</text>
  <text x="546.0" y="289.0" fill="#8a8a8a" font-size="10" text-anchor="start">solid curve off the</text>
  <text x="546.0" y="303.0" fill="#8a8a8a" font-size="10" text-anchor="start">ridge. That is</text>
  <text x="546.0" y="317.0" fill="#8a8a8a" font-size="10" text-anchor="start">variational EM.</text>
