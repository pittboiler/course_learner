<svg viewBox="0 0 700.0 380.0" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="11.5" text-anchor="start" font-style="italic">Every f splits into a part the data can see and a part it cannot.</text>
  <polygon points="50.0,300.0 360.0,300.0 425.0,222.0 115.0,222.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" fill-opacity="0.1"/>
  <text x="52.0" y="324.0" fill="#4a90d9" font-size="11.5" text-anchor="start">span of K(., x1), ..., K(., xn)  --  dimension at most n</text>
  <line x1="145.0" y1="272.0" x2="240.0" y2="240.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="240.0" y1="240.0" x2="235.6" y2="244.1" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="240.0" y1="240.0" x2="234.0" y2="239.4" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="145.0" y1="272.0" x2="222.0" y2="292.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="222.0" y1="292.0" x2="216.1" y2="293.0" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="222.0" y1="292.0" x2="217.3" y2="288.3" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="236.0" y="234.0" fill="#8a8a8a" font-size="10.5" text-anchor="end">K(., x1)</text>
  <text x="226.0" y="296.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">K(., xn)</text>
  <circle cx="145.0" cy="272.0" r="3.0" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="135.0" y="277.0" fill="#8a8a8a" font-size="11" text-anchor="end">0</text>
  <line x1="145.0" y1="272.0" x2="285.0" y2="100.0" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="145.0" y1="272.0" x2="285.0" y2="254.0" stroke="#4a90d9" stroke-width="2.0"/>
  <line x1="285.0" y1="100.0" x2="285.0" y2="254.0" stroke="#e0645c" stroke-width="2.0"/>
  <path d="M 271.0 251.0 L 271.0 237.0 L 285.0 237.0" fill="none" stroke="#8a8a8a" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="285.0" cy="100.0" r="4.2" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4"/>
  <circle cx="285.0" cy="254.0" r="4.2" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="295.0" y="102.0" fill="#8a8a8a" font-size="13" text-anchor="start" font-style="italic">f</text>
  <text x="295.0" y="180.0" fill="#e0645c" font-size="12" text-anchor="start">f-perp</text>
  <text x="296.0" y="267.0" fill="#4a90d9" font-size="12" text-anchor="start">f-parallel</text>
  <text x="445.0" y="96.0" fill="#8a8a8a" font-size="11.5" text-anchor="start" font-weight="bold">Pythagoras in the RKHS:</text>
  <text x="445.0" y="114.0" fill="#8a8a8a" font-size="11.5" text-anchor="start">|f|^2 = |f-par|^2 + |f-perp|^2</text>
  <text x="445.0" y="142.0" fill="#e0645c" font-size="11.5" text-anchor="start" font-weight="bold">Reproducing property:</text>
  <text x="445.0" y="160.0" fill="#e0645c" font-size="11.5" text-anchor="start">f-perp is orthogonal to each</text>
  <text x="445.0" y="178.0" fill="#e0645c" font-size="11.5" text-anchor="start">K(., xi), so f-perp(xi) = 0.</text>
  <text x="445.0" y="206.0" fill="#8a8a8a" font-size="11.5" text-anchor="start">The loss sees only f(x1..xn),</text>
  <text x="445.0" y="224.0" fill="#8a8a8a" font-size="11.5" text-anchor="start">so deleting f-perp costs it</text>
  <text x="445.0" y="242.0" fill="#8a8a8a" font-size="11.5" text-anchor="start">nothing.</text>
  <text x="445.0" y="270.0" fill="#4a90d9" font-size="11.5" text-anchor="start" font-weight="bold">The penalty strictly falls.</text>
  <text x="445.0" y="288.0" fill="#4a90d9" font-size="11.5" text-anchor="start">So every minimiser lies in</text>
  <text x="445.0" y="306.0" fill="#4a90d9" font-size="11.5" text-anchor="start">the blue plane.</text>
  <text x="52.0" y="352.0" fill="#e0645c" font-size="11.5" text-anchor="start" font-style="italic">f-perp: invisible to the data, pure cost in norm.</text>
</svg>
