<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">A regulatory chain X to Y to Z: correlation adds a false X-Z edge, partial correlation removes it</text>
  <text x="180.0" y="62.0" fill="#8a8a8a" font-size="13.5" text-anchor="middle" font-weight="bold">correlation network, threshold 0.5</text>
  <line x1="73.8" y1="260.4" x2="166.2" y2="129.6" stroke="#8a8a8a" stroke-width="2.6"/>
  <text x="92.2" y="179.4" fill="#8a8a8a" text-anchor="middle" font-weight="bold">r = 0.80</text>
  <line x1="193.8" y1="129.6" x2="286.2" y2="260.4" stroke="#8a8a8a" stroke-width="2.6"/>
  <text x="267.8" y="179.4" fill="#8a8a8a" text-anchor="middle" font-weight="bold">r = 0.70</text>
  <line x1="84.0" y1="280.0" x2="276.0" y2="280.0" stroke="#e0645c" stroke-width="2.6" stroke-dasharray="6,4"/>
  <text x="180.0" y="308.0" fill="#e0645c" text-anchor="middle" font-weight="bold">r = 0.56</text>
  <circle cx="60.0" cy="280.0" r="22" fill="none" stroke="#4a90d9" stroke-width="2.2"/>
  <text x="60.0" y="286.0" fill="#4a90d9" font-size="16" text-anchor="middle" font-weight="bold">X</text>
  <circle cx="180.0" cy="110.0" r="22" fill="none" stroke="#4a90d9" stroke-width="2.2"/>
  <text x="180.0" y="116.0" fill="#4a90d9" font-size="16" text-anchor="middle" font-weight="bold">Y</text>
  <circle cx="300.0" cy="280.0" r="22" fill="none" stroke="#4a90d9" stroke-width="2.2"/>
  <text x="300.0" y="286.0" fill="#4a90d9" font-size="16" text-anchor="middle" font-weight="bold">Z</text>
  <text x="580.0" y="62.0" fill="#8a8a8a" font-size="13.5" text-anchor="middle" font-weight="bold">partial correlation network</text>
  <line x1="473.8" y1="260.4" x2="566.2" y2="129.6" stroke="#8a8a8a" stroke-width="2.6"/>
  <text x="492.2" y="179.4" fill="#8a8a8a" text-anchor="middle" font-weight="bold">0.69</text>
  <line x1="593.8" y1="129.6" x2="686.2" y2="260.4" stroke="#8a8a8a" stroke-width="2.6"/>
  <text x="667.8" y="179.4" fill="#8a8a8a" text-anchor="middle" font-weight="bold">0.51</text>
  <circle cx="460.0" cy="280.0" r="22" fill="none" stroke="#4a90d9" stroke-width="2.2"/>
  <text x="460.0" y="286.0" fill="#4a90d9" font-size="16" text-anchor="middle" font-weight="bold">X</text>
  <circle cx="580.0" cy="110.0" r="22" fill="none" stroke="#4a90d9" stroke-width="2.2"/>
  <text x="580.0" y="116.0" fill="#4a90d9" font-size="16" text-anchor="middle" font-weight="bold">Y</text>
  <circle cx="700.0" cy="280.0" r="22" fill="none" stroke="#4a90d9" stroke-width="2.2"/>
  <text x="700.0" y="286.0" fill="#4a90d9" font-size="16" text-anchor="middle" font-weight="bold">Z</text>
  <text x="580.0" y="330.0" fill="#e0645c" font-size="12.5" text-anchor="middle">X-Z given Y: (0.56 - 0.80 x 0.70) / ... = 0</text>
  <text x="180.0" y="360.0" fill="#e0645c" font-size="12.5" text-anchor="middle">0.56 is exactly 0.80 x 0.70: all of X-Z runs through Y</text>
</svg>
