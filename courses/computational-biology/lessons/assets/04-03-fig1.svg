<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">De Bruijn graph of the 3-mers of ATGGCGTGCA: nodes are 2-mers, each 3-mer is an edge</text>
  <line x1="116.0" y1="220.0" x2="232.0" y2="220.0" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="232.0,220.0 222.1,215.5 222.1,224.5" fill="#4a90d9"/>
  <text x="175.0" y="238.0" fill="#e0645c" text-anchor="middle" font-weight="bold">ATG</text>
  <line x1="279.8" y1="203.2" x2="368.6" y2="128.1" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="368.6,128.1 358.2,131.0 364.0,137.9" fill="#4a90d9"/>
  <text x="334.0" y="179.7" fill="#e0645c" text-anchor="middle" font-weight="bold">TGG</text>
  <line x1="409.8" y1="126.8" x2="498.6" y2="201.9" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="498.6,201.9 494.0,192.1 488.2,199.0" fill="#4a90d9"/>
  <text x="446.0" y="179.7" fill="#e0645c" text-anchor="middle" font-weight="bold">GGC</text>
  <line x1="520.0" y1="246.0" x2="520.0" y2="322.0" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="520.0,322.0 524.5,312.1 515.5,312.1" fill="#4a90d9"/>
  <text x="506.0" y="289.0" fill="#e0645c" text-anchor="middle" font-weight="bold">GCG</text>
  <line x1="494.0" y1="350.0" x2="288.0" y2="350.0" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="288.0,350.0 297.9,354.5 297.9,345.5" fill="#4a90d9"/>
  <text x="390.0" y="340.0" fill="#e0645c" text-anchor="middle" font-weight="bold">CGT</text>
  <line x1="260.0" y1="324.0" x2="260.0" y2="248.0" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="260.0,248.0 255.5,257.9 264.5,257.9" fill="#4a90d9"/>
  <text x="274.0" y="289.0" fill="#e0645c" text-anchor="middle" font-weight="bold">GTG</text>
  <line x1="286.0" y1="220.0" x2="492.0" y2="220.0" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="492.0,220.0 482.1,215.5 482.1,224.5" fill="#4a90d9"/>
  <text x="390.0" y="238.0" fill="#e0645c" text-anchor="middle" font-weight="bold">TGC</text>
  <line x1="546.0" y1="220.0" x2="672.0" y2="220.0" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="672.0,220.0 662.1,215.5 662.1,224.5" fill="#4a90d9"/>
  <text x="610.0" y="238.0" fill="#e0645c" text-anchor="middle" font-weight="bold">GCA</text>
  <circle cx="90.0" cy="220.0" r="26" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="90.0" y="225.0" fill="#8a8a8a" font-size="14" text-anchor="middle" font-weight="bold">AT</text>
  <circle cx="260.0" cy="220.0" r="26" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="260.0" y="225.0" fill="#8a8a8a" font-size="14" text-anchor="middle" font-weight="bold">TG</text>
  <circle cx="390.0" cy="110.0" r="26" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="390.0" y="115.0" fill="#8a8a8a" font-size="14" text-anchor="middle" font-weight="bold">GG</text>
  <circle cx="520.0" cy="220.0" r="26" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="520.0" y="225.0" fill="#8a8a8a" font-size="14" text-anchor="middle" font-weight="bold">GC</text>
  <circle cx="700.0" cy="220.0" r="26" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="700.0" y="225.0" fill="#8a8a8a" font-size="14" text-anchor="middle" font-weight="bold">CA</text>
  <circle cx="520.0" cy="350.0" r="26" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="520.0" y="355.0" fill="#8a8a8a" font-size="14" text-anchor="middle" font-weight="bold">CG</text>
  <circle cx="260.0" cy="350.0" r="26" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="260.0" y="355.0" fill="#8a8a8a" font-size="14" text-anchor="middle" font-weight="bold">GT</text>
  <text x="90.0" y="266.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">0 in, 1 out</text>
  <text x="700.0" y="266.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">1 in, 0 out</text>
  <text x="242.0" y="184.0" fill="#8a8a8a" font-size="11.5" text-anchor="end">2 in, 2 out</text>
  <text x="538.0" y="184.0" fill="#8a8a8a" font-size="11.5">2 in, 2 out</text>
  <text x="600.0" y="60.0" fill="#8a8a8a" font-size="12.5" text-anchor="middle">two Eulerian paths, two genomes:</text>
  <text x="600.0" y="80.0" fill="#4a90d9" font-size="12.5" text-anchor="middle">ATGGCGTGCA: through GG first</text>
  <text x="600.0" y="100.0" fill="#4a90d9" font-size="12.5" text-anchor="middle">ATGCGTGGCA: through TGC first</text>
  <text x="400.0" y="420.0" fill="#8a8a8a" font-size="12" text-anchor="middle">TG and GC each occur twice in the genome: a repeat longer than k - 1 creates the ambiguity</text>
</svg>
