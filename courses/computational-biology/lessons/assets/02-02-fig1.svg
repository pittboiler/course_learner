  <text x="736.0" y="274.0" fill="#4a90d9" font-size="14" font-weight="bold">D</text>
  <text x="554.0" y="136.0" fill="#8a8a8a" font-size="11.5" text-anchor="end">1</text>
  <text x="508.0" y="210.0" fill="#8a8a8a" font-size="11.5" text-anchor="end">4</text>
  <text x="650.0" y="136.0" fill="#8a8a8a" font-size="11.5">1</text>
  <text x="692.0" y="210.0" fill="#8a8a8a" font-size="11.5">4</text>
  <text x="600.0" y="162.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">1</text>
  <text x="600.0" y="300.0" fill="#4a90d9" font-size="12.5" text-anchor="middle">true: A with B, C with D</text>
  <text x="600.0" y="334.0" fill="#e0645c" font-size="12.5" text-anchor="middle">closest pair is A, C at distance 3</text>
  <text x="600.0" y="356.0" fill="#e0645c" font-size="12.5" text-anchor="middle" font-weight="bold">so UPGMA first joins A with C</text>
  <text x="600.0" y="386.0" fill="#8a8a8a" font-size="12" text-anchor="middle">short branches look related</text>
  <text x="600.0" y="404.0" fill="#8a8a8a" font-size="12" text-anchor="middle">because they both changed little</text>
</svg>
