  <text x="32.0" y="364.0" fill="#8a8a8a" font-size="11.5" text-anchor="end">0</text>
  <line x1="36.0" y1="300.0" x2="40.0" y2="300.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="32.0" y="304.0" fill="#8a8a8a" font-size="11.5" text-anchor="end">1</text>
