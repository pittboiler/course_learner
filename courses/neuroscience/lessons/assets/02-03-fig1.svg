<line x1="65" y1="145" x2="70" y2="145" stroke="#333"/><text x="61" y="149" text-anchor="end">10</text>
<line x1="65" y1="102.5" x2="70" y2="102.5" stroke="#333"/><text x="61" y="106" text-anchor="end">15</text>
<line x1="65" y1="60" x2="70" y2="60" stroke="#333"/><text x="61" y="64" text-anchor="end">20</text>
</g>
