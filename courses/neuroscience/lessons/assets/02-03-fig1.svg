<text x="458" y="211" font-size="10" text-anchor="end" fill="#333">8 mV local</text>

<polygon points="466,104 456,99 456,109" fill="#1a6fb5"/>
<text x="458" y="101" font-size="10.5" text-anchor="end" fill="#1a6fb5">D 500 &#181;m</text>
<text x="458" y="114" font-size="10" text-anchor="end" fill="#333">8 mV local</text>

<circle cx="493" cy="152" r="5.5" fill="#d1495b"/>
<text x="503" y="149" font-size="10.5" fill="#d1495b">shunt on the path</text>
<text x="503" y="162" font-size="10" fill="#333">blocks D, spares P</text>

<text x="503" y="88" font-size="10.5" fill="#333">&#955; = 500 &#181;m: D sits one &#955; out</text>

<line x1="640" y1="228" x2="790" y2="228" stroke="#333" stroke-width="1.2"/>
<rect x="662" y="146" width="30" height="82" fill="#1a6fb5"/>
<rect x="732" y="191" width="30" height="37" fill="#1a6fb5" opacity="0.55"/>
<text x="677" y="140" font-size="11" text-anchor="middle" fill="#111">6.6 mV</text>
<text x="747" y="185" font-size="11" text-anchor="middle" fill="#111">2.9 mV</text>
<text x="677" y="242" font-size="10.5" text-anchor="middle" fill="#333">from P</text>
<text x="747" y="242" font-size="10.5" text-anchor="middle" fill="#333">from D</text>
<text x="700" y="118" font-size="10.5" text-anchor="middle" fill="#333">EPSP measured at the soma</text>

<text x="685" y="262" font-size="10" text-anchor="middle" fill="#d1495b">fast EPSP peaks attenuate 2 to 4x more</text>

<text x="30" y="316" font-size="13.5" font-weight="bold">(c) Linear, sublinear, and shunted summation</text>

<rect x="90" y="330" width="390" height="170" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>
