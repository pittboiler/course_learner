<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 545" width="820" height="545" role="img" aria-label="Three panels on synaptic integration: temporal summation traces, electrotonic distance on a dendrite, and linear versus sublinear versus shunted summation curves.">
<rect width="820" height="545" fill="#ffffff"/>
<g font-family="Helvetica,Arial,sans-serif" fill="#111">

