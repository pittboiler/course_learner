<text x="300" y="200" font-size="10.5" fill="#1a6fb5" text-anchor="end">30 Hz: plateaus at 9.0 mV</text>


<text x="430" y="28" font-size="13.5" font-weight="bold">(b) Electrotonic distance, not synapse count</text>

<line x1="480" y1="228" x2="480" y2="80" stroke="#333" stroke-width="3"/>
