<g font-size="10.5" fill="#333">
<text x="510" y="418">Synapses needed to fire: 5 predicted,</text>
<text x="510" y="433">6 actually, 11 once the shunt is on &#8212;</text>
<text x="510" y="448">and the shunt moves the voltage by 0 mV.</text>
<text x="510" y="472">g_leak = 10 nS at &#8722;65 mV; 0.5 nS per</text>
<text x="510" y="487">synapse at 0 mV; threshold &#8722;50 mV.</text>
</g>

