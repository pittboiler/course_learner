<path d="M 540 415 A 40 40 0 0 0 511.7 426.7" fill="none" stroke="#333" stroke-width="1.1"/>
<text x="514" y="410" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">&#952;</text>

<line x1="457" y1="483" x2="563" y2="377" stroke="#8fa8c0" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="447" y="497" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8fa8c0" text-anchor="middle">wavefront</text>

<line x1="421.4" y1="391.4" x2="481" y2="451" stroke="#1a6fb5" stroke-width="1.8"/>
<path d="M 485 455 l -8.5 0.5 l 4 -8 z" fill="#1a6fb5"/>
<line x1="509" y1="346.2" x2="551.4" y2="388.6" stroke="#1a6fb5" stroke-width="1.8"/>

<line x1="551.4" y1="388.6" x2="578.9" y2="416.1" stroke="#d1495b" stroke-width="3.4"/>
<path d="M 578.9 416.1 A 55 55 0 0 1 595 455" fill="none" stroke="#d1495b" stroke-width="3.4"/>

<line x1="612" y1="392" x2="571" y2="401" stroke="#333" stroke-width="0.9"/>
<text x="616" y="396" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#d1495b">r sin &#952;</text>
<line x1="628" y1="440" x2="598" y2="435" stroke="#333" stroke-width="0.9"/>
<text x="632" y="444" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#d1495b">r&#952; (creep)</text>

<text x="470" y="530" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111" text-anchor="middle">near ear</text>
<text x="622" y="530" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111" text-anchor="middle">far ear</text>

<text x="405" y="562" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333" text-anchor="middle">The extra path has two parts: a straight run r sin &#952; and a creep r&#952; around the head.</text>

</svg>
