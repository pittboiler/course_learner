<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="Panel a draws a neuron with a dendritic tree, soma, axon hillock, myelinated axon and presynaptic terminals. A blue bar under the dendrites and soma marks graded, analogue, decremental signalling; a coral bar under the axon marks all-or-none, digital, regenerative signalling; the boundary between them sits at the axon hillock, which is labelled as the decision point with the highest density of voltage-gated sodium channels. Panel b, aligned directly beneath, redraws any patch of that membrane as an equivalent circuit: an injected current, a membrane capacitance, and a leak conductance in series with its own battery, all in parallel between an outside rail and an inside rail, with the membrane voltage marked across them and the RC time constant given as tau equals R times C.">
<rect width="800" height="560" fill="#ffffff"/>

<text x="20" y="24" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#111">(a) collect &#8594; integrate &#8594; decide &#8594; transmit</text>
