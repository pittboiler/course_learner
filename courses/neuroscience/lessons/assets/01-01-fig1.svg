<text x="502" y="264.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-weight="bold" fill="#ffffff">ALL-OR-NONE &#183; DIGITAL &#183; REGENERATIVE</text>
<text x="440" y="288" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-style="italic" fill="#333">morphology is a computational specification, not decoration</text>

