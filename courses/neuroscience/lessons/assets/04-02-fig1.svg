<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Panel a is a taxonomy tree of long-term memory. The root splits into declarative memory, which splits into episodic memory supported by hippocampus and medial temporal lobe and semantic memory supported by medial temporal lobe then neocortex, and non-declarative memory, which splits into procedural learning supported by striatum and cerebellum, priming supported by neocortex, conditioning supported by amygdala and cerebellum, and habituation supported by reflex pathways. The declarative branch is drawn in coral to mark what H.M. could no longer form; the non-declarative branch is drawn in green to mark what he learned normally without any recollection of learning it. Panel b plots two curves against the age of a memory on a logarithmic time axis running from hours to decades. Hippocampal dependence starts at its maximum and decays toward zero; neocortical representation starts at zero and rises toward a plateau. The curves cross a little before the one-week mark, and a dashed line marks that crossover as the point where the memory becomes hippocampus-independent. Beneath the axis a band shows the consequence: memories formed shortly before a bilateral medial temporal lesion are lost, while memories formed long before it are spared, which is the temporally graded retrograde amnesia.">
<rect width="800" height="600" fill="#ffffff"/>

<text x="20" y="36" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#111">(a) &#8220;memory&#8221; is a taxonomy, and one lesion cuts it in half</text>
<rect x="20" y="44" width="760" height="252" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>

<rect x="330" y="56" width="140" height="24" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
<text x="400" y="72" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111" text-anchor="middle">long-term memory</text>

<path d="M 400 80 L 400 92 M 210 92 L 560 92 M 210 92 L 210 104 M 560 92 L 560 104" fill="none" stroke="#333" stroke-width="1.2"/>

<rect x="150" y="104" width="120" height="24" rx="4" fill="#fbeced" stroke="#d1495b" stroke-width="1.6"/>
<text x="210" y="120" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b" text-anchor="middle">declarative</text>

<rect x="480" y="104" width="160" height="24" rx="4" fill="#e8f4ec" stroke="#2e8b57" stroke-width="1.6"/>
<text x="560" y="120" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#2e8b57" text-anchor="middle">non-declarative</text>

<path d="M 210 128 L 210 148 M 130 148 L 275 148 M 130 148 L 130 160 M 275 148 L 275 160" fill="none" stroke="#d1495b" stroke-width="1.2"/>
<path d="M 560 128 L 560 148 M 415 148 L 718 148 M 415 148 L 415 160 M 512 148 L 512 160 M 612 148 L 612 160 M 718 148 L 718 160" fill="none" stroke="#2e8b57" stroke-width="1.2"/>

<rect x="82" y="160" width="96" height="22" rx="4" fill="#fbeced" stroke="#d1495b" stroke-width="1.4"/>
<text x="130" y="175" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111" text-anchor="middle">episodic</text>
<text x="130" y="196" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b7d99" text-anchor="middle">hippocampus,</text>
<text x="130" y="207" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b7d99" text-anchor="middle">medial temporal lobe</text>

<rect x="227" y="160" width="96" height="22" rx="4" fill="#fbeced" stroke="#d1495b" stroke-width="1.4"/>
<text x="275" y="175" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111" text-anchor="middle">semantic</text>
<text x="275" y="196" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b7d99" text-anchor="middle">MTL at first,</text>
<text x="275" y="207" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b7d99" text-anchor="middle">then neocortex</text>

<rect x="369" y="160" width="92" height="22" rx="4" fill="#e8f4ec" stroke="#2e8b57" stroke-width="1.4"/>
<text x="415" y="175" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111" text-anchor="middle">procedural</text>
<text x="415" y="196" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b7d99" text-anchor="middle">striatum,</text>
<text x="415" y="207" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b7d99" text-anchor="middle">cerebellum</text>

<rect x="476" y="160" width="72" height="22" rx="4" fill="#e8f4ec" stroke="#2e8b57" stroke-width="1.4"/>
<text x="512" y="175" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111" text-anchor="middle">priming</text>
<text x="512" y="196" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b7d99" text-anchor="middle">neocortex</text>

<rect x="558" y="160" width="108" height="22" rx="4" fill="#e8f4ec" stroke="#2e8b57" stroke-width="1.4"/>
<text x="612" y="175" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111" text-anchor="middle">conditioning</text>
<text x="612" y="196" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b7d99" text-anchor="middle">amygdala (emotional),</text>
<text x="612" y="207" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b7d99" text-anchor="middle">cerebellum (motor)</text>

<rect x="670" y="160" width="96" height="22" rx="4" fill="#e8f4ec" stroke="#2e8b57" stroke-width="1.4"/>
<text x="718" y="175" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111" text-anchor="middle">habituation</text>
<text x="718" y="196" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b7d99" text-anchor="middle">reflex pathways</text>

<rect x="40" y="220" width="14" height="11" fill="#fbeced" stroke="#d1495b" stroke-width="1.4"/>
<text x="60" y="229" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#d1495b">H.M.: could no longer form new ones</text>
<rect x="300" y="220" width="14" height="11" fill="#e8f4ec" stroke="#2e8b57" stroke-width="1.4"/>
<text x="320" y="229" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#2e8b57">H.M.: learned normally, with no recollection of ever having learned</text>

<text x="40" y="252" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">Two systems the tree does not show, both intact in H.M.: working memory (seconds, actively maintained) and</text>
<text x="40" y="265" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">remote declarative memory from childhood &#8212; so the hippocampus is needed to form declarative memories, not to hold them.</text>
<text x="40" y="284" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-style="italic" fill="#5b7d99">One lesion, cutting cleanly along a boundary nobody had a reason to draw beforehand.</text>

<text x="20" y="318" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#111">(b) systems consolidation predicts a graded retrograde amnesia</text>
<rect x="20" y="326" width="760" height="266" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>

