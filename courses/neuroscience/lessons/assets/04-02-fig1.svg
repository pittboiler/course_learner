<text x="84" y="360" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="end">max</text>
<text x="84" y="504" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="end">0</text>
<text x="96" y="345" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b7d99">contribution to recalling that memory</text>

<line x1="261" y1="352" x2="261" y2="500" stroke="#8fa8c0" stroke-width="1" stroke-dasharray="3,3"/>
<circle cx="261" cy="440" r="3.2" fill="#111"/>
<text x="269" y="372" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#111">crossover: the memory becomes</text>
<text x="269" y="383" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#111">hippocampus-independent</text>

<polyline points="90,360.0 166.3,403.8 242.5,433.9 318.8,454.5 395.0,468.8 471.3,478.5 547.5,485.2 623.8,489.9 700.0,493.0" fill="none" stroke="#d1495b" stroke-width="2.4" stroke-linejoin="round"/>
<text x="215" y="402" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#d1495b">hippocampal dependence</text>

<polyline points="90,500.0 166.3,469.0 242.5,444.9 318.8,426.1 395.0,411.5 471.3,400.1 547.5,391.2 623.8,384.3 700.0,378.9" fill="none" stroke="#1a6fb5" stroke-width="2.4" stroke-linejoin="round"/>
<text x="500" y="372" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#1a6fb5">neocortical representation</text>

