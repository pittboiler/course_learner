<text x="480" y="556" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#2e8b57" text-anchor="middle">spared</text>
<text x="90" y="578" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">effect of a bilateral medial-temporal lesion on memories formed at each age &#8212; the temporal gradient, measured</text>
