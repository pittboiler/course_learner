<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-label="Panel a is the equivalent circuit of two electrically coupled neurons: a junctional resistance links the two cell bodies, and each cell has its own membrane resistance and membrane capacitance to ground, so the pair forms a resistive divider loaded by a capacitor. The coupling coefficient is the divider ratio, about seven percent for the values shown, and the postsynaptic resistance and capacitance together give a coupling time constant of about nine milliseconds and a cutoff near seventeen hertz. Panel b shows the consequence. The presynaptic trace is a tall narrow action potential of one hundred millivolts lasting one millisecond followed by a shallow afterhyperpolarization of ten millivolts lasting one hundred milliseconds. The postsynaptic trace, plotted on a hundredfold expanded voltage scale, shows a tiny spikelet of seven tenths of a millivolt and a long trough of the same depth, so the brief large spike and the slow small afterhyperpolarization produce equal deflections, and the time integral of the postsynaptic response is net hyperpolarizing.">
<rect width="800" height="640" fill="#ffffff"/>

<text x="20" y="24" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#111">(a) two coupled cells are a resistive divider with a capacitive load</text>
<rect x="20" y="34" width="760" height="250" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>

<text x="110" y="72" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b7d99" text-anchor="middle">presynaptic cell</text>
<text x="310" y="72" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b7d99" text-anchor="middle">postsynaptic cell</text>

<line x1="110" y1="115" x2="180" y2="115" stroke="#111" stroke-width="1.6"/>
<line x1="240" y1="115" x2="310" y2="115" stroke="#111" stroke-width="1.6"/>
<rect x="180" y="103" width="60" height="24" fill="#ffffff" stroke="#1a6fb5" stroke-width="2.2"/>
<text x="210" y="96" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a6fb5" text-anchor="middle">R<tspan font-size="8" dy="2.5">j</tspan></text>
<circle cx="110" cy="115" r="3.2" fill="#111"/>
<circle cx="310" cy="115" r="3.2" fill="#111"/>
<text x="98" y="112" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111" text-anchor="end">V<tspan font-size="8" dy="2.5">1</tspan></text>
<text x="322" y="112" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">V<tspan font-size="8" dy="2.5">2</tspan></text>

<line x1="110" y1="115" x2="110" y2="160" stroke="#111" stroke-width="1.6"/>
<line x1="78" y1="160" x2="142" y2="160" stroke="#111" stroke-width="1.6"/>
<line x1="78" y1="160" x2="78" y2="178" stroke="#111" stroke-width="1.6"/>
<rect x="66" y="178" width="24" height="38" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
<line x1="78" y1="216" x2="78" y2="248" stroke="#111" stroke-width="1.6"/>
<line x1="142" y1="160" x2="142" y2="190" stroke="#111" stroke-width="1.6"/>
<line x1="128" y1="190" x2="156" y2="190" stroke="#111" stroke-width="1.8"/>
<line x1="128" y1="198" x2="156" y2="198" stroke="#111" stroke-width="1.8"/>
<line x1="142" y1="198" x2="142" y2="248" stroke="#111" stroke-width="1.6"/>
<line x1="78" y1="248" x2="142" y2="248" stroke="#111" stroke-width="1.6"/>
<line x1="110" y1="248" x2="110" y2="254" stroke="#111" stroke-width="1.6"/>
<line x1="88" y1="254" x2="132" y2="254" stroke="#111" stroke-width="1.8"/>
<line x1="96" y1="260" x2="124" y2="260" stroke="#111" stroke-width="1.5"/>
<line x1="104" y1="266" x2="116" y2="266" stroke="#111" stroke-width="1.2"/>
<text x="60" y="201" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111" text-anchor="end">R<tspan font-size="8" dy="2.5">1</tspan></text>
<text x="162" y="198" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">C<tspan font-size="8" dy="2.5">1</tspan></text>

<line x1="310" y1="115" x2="310" y2="160" stroke="#111" stroke-width="1.6"/>
<line x1="278" y1="160" x2="342" y2="160" stroke="#111" stroke-width="1.6"/>
<line x1="278" y1="160" x2="278" y2="178" stroke="#111" stroke-width="1.6"/>
<rect x="266" y="178" width="24" height="38" fill="#ffffff" stroke="#d1495b" stroke-width="1.8"/>
<line x1="278" y1="216" x2="278" y2="248" stroke="#111" stroke-width="1.6"/>
<line x1="342" y1="160" x2="342" y2="190" stroke="#111" stroke-width="1.6"/>
<line x1="328" y1="190" x2="356" y2="190" stroke="#d1495b" stroke-width="2"/>
<line x1="328" y1="198" x2="356" y2="198" stroke="#d1495b" stroke-width="2"/>
<line x1="342" y1="198" x2="342" y2="248" stroke="#111" stroke-width="1.6"/>
<line x1="278" y1="248" x2="342" y2="248" stroke="#111" stroke-width="1.6"/>
<line x1="310" y1="248" x2="310" y2="254" stroke="#111" stroke-width="1.6"/>
<line x1="288" y1="254" x2="332" y2="254" stroke="#111" stroke-width="1.8"/>
<line x1="296" y1="260" x2="324" y2="260" stroke="#111" stroke-width="1.5"/>
<line x1="304" y1="266" x2="316" y2="266" stroke="#111" stroke-width="1.2"/>
<text x="260" y="201" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b" text-anchor="end">R<tspan font-size="8" dy="2.5">2</tspan></text>
<text x="362" y="198" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b">C<tspan font-size="8" dy="2.5">2</tspan></text>

<text x="430" y="96" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">R<tspan font-size="8" dy="2.5">j</tspan><tspan dy="-2.5"> = 2 G&#937;   (g</tspan><tspan font-size="8" dy="2.5">j</tspan><tspan dy="-2.5"> = 0.5 nS)</tspan></text>
<text x="430" y="114" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">R<tspan font-size="8" dy="2.5">2</tspan><tspan dy="-2.5"> = 150 M&#937;   C</tspan><tspan font-size="8" dy="2.5">2</tspan><tspan dy="-2.5"> = 67 pF   &#964;</tspan><tspan font-size="8" dy="2.5">m</tspan><tspan dy="-2.5"> = 10 ms</tspan></text>

<line x1="430" y1="128" x2="700" y2="128" stroke="#8fa8c0" stroke-width="1"/>

<text x="430" y="150" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a6fb5">coupling coefficient: a resistive divider</text>
<text x="430" y="170" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111">k = V<tspan font-size="8" dy="2.5">2</tspan><tspan dy="-2.5">/V</tspan><tspan font-size="8" dy="2.5">1</tspan><tspan dy="-2.5"> = R</tspan><tspan font-size="8" dy="2.5">2</tspan><tspan dy="-2.5">/(R</tspan><tspan font-size="8" dy="2.5">j</tspan><tspan dy="-2.5"> + R</tspan><tspan font-size="8" dy="2.5">2</tspan><tspan dy="-2.5">) = g</tspan><tspan font-size="8" dy="2.5">j</tspan><tspan dy="-2.5">/(g</tspan><tspan font-size="8" dy="2.5">j</tspan><tspan dy="-2.5"> + g</tspan><tspan font-size="8" dy="2.5">2</tspan><tspan dy="-2.5">)</tspan></text>
<text x="446" y="188" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111">= 150/(2000 + 150) = 0.070</text>

<text x="430" y="216" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b">the postsynaptic RC makes it a low-pass filter</text>
<text x="430" y="236" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111">&#964;<tspan font-size="8" dy="2.5">c</tspan><tspan dy="-2.5"> = R</tspan><tspan font-size="8" dy="2.5">j</tspan><tspan dy="-2.5">R</tspan><tspan font-size="8" dy="2.5">2</tspan><tspan dy="-2.5">/(R</tspan><tspan font-size="8" dy="2.5">j</tspan><tspan dy="-2.5"> + R</tspan><tspan font-size="8" dy="2.5">2</tspan><tspan dy="-2.5">) &#215; C</tspan><tspan font-size="8" dy="2.5">2</tspan><tspan dy="-2.5"> = 9.3 ms</tspan></text>
<text x="430" y="254" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111">f<tspan font-size="8" dy="2.5">c</tspan><tspan dy="-2.5"> = 1/(2&#960;&#964;</tspan><tspan font-size="8" dy="2.5">c</tspan><tspan dy="-2.5">) = 17 Hz</tspan></text>
<text x="430" y="276" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111">k &lt; 1 always: a gap junction can only attenuate.</text>

<text x="20" y="312" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#111">(b) the spike does not transfer; the afterhyperpolarization does</text>
<rect x="20" y="322" width="760" height="300" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>

<text x="90" y="348" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111">presynaptic cell</text>
<line x1="90" y1="430" x2="730" y2="430" stroke="#8fa8c0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="70" y1="360" x2="70" y2="430" stroke="#333" stroke-width="1.4"/>
<line x1="66" y1="360" x2="74" y2="360" stroke="#333" stroke-width="1.4"/>
<line x1="66" y1="430" x2="74" y2="430" stroke="#333" stroke-width="1.4"/>
<text x="62" y="398" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="end">100 mV</text>

<polygon points="132,430 137,437 437,437 500,432 534,430" fill="#d1495b" fill-opacity="0.14"/>
<polygon points="128,430 130,360 132,430" fill="#1a6fb5" fill-opacity="0.35"/>
<polyline points="90,430 128,430 130,360 132,430 137,437 437,437 500,432 534,430 730,430" fill="none" stroke="#1a6fb5" stroke-width="2" stroke-linejoin="round"/>
<text x="142" y="366" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a6fb5">spike: 100 mV for 1 ms  (area 100 mV&#183;ms)</text>
<text x="300" y="454" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b">afterhyperpolarization: 10 mV for 100 ms  (area &#8722;1000 mV&#183;ms)</text>

<text x="90" y="482" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111">postsynaptic cell &#8212; voltage scale expanded 100&#215;</text>
<line x1="90" y1="540" x2="730" y2="540" stroke="#8fa8c0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="70" y1="495" x2="70" y2="540" stroke="#333" stroke-width="1.4"/>
<line x1="66" y1="495" x2="74" y2="495" stroke="#333" stroke-width="1.4"/>
<line x1="66" y1="540" x2="74" y2="540" stroke="#333" stroke-width="1.4"/>
<text x="62" y="522" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="end">1 mV</text>

<polyline points="90,540 130,540 134,508 150,530 170,547 210,563 250,569 310,571 410,572 534,572 570,552 610,544 670,541 730,540" fill="none" stroke="#2e8b57" stroke-width="2.2" stroke-linejoin="round"/>
<circle cx="134" cy="508" r="3" fill="#2e8b57"/>
<circle cx="470" cy="572" r="3" fill="#2e8b57"/>
<text x="144" y="504" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#2e8b57">spikelet 0.71 mV = 0.7% of the spike</text>
<text x="380" y="590" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#2e8b57">0.70 mV = 7.0% of the afterhyperpolarization</text>

<text x="470" y="506" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">the filter preserves area: &#8747;V<tspan font-size="8" dy="2.5">2</tspan><tspan dy="-2.5"> dt = k &#8747;V</tspan><tspan font-size="8" dy="2.5">1</tspan><tspan dy="-2.5"> dt</tspan></text>
<text x="470" y="522" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#111">= 0.070 &#215; (&#8722;900) = &#8722;63 mV&#183;ms</text>
<text x="470" y="538" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#d1495b">net transfer is inhibitory</text>

