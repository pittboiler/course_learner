<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="Panel a plots postsynaptic current against membrane voltage for two glutamate receptors. The AMPA receptor gives a straight line through zero current at zero millivolts, so its inward current shrinks steadily as the cell depolarizes. The NMDA receptor gives an N-shaped curve: near minus eighty millivolts almost no current flows because magnesium plugs the pore, the inward current then grows as the cell depolarizes and reaches its largest inward value near minus twenty-six millivolts before falling back to zero at zero millivolts and turning outward. The rising inward limb is the region of negative slope conductance, and it is what makes the receptor a coincidence detector. Panel b compares three response time courses on a logarithmic time axis running from one millisecond to about three hours. The ionotropic response is a narrow spike lasting a few milliseconds, the metabotropic response is a broad hump lasting from a tenth of a second to ten seconds, and the gene expression response is a very broad rise spanning minutes to hours.">
<rect width="800" height="560" fill="#ffffff"/>

<text x="20" y="24" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#111">(a) the current&#8211;voltage relation is the receptor&#8217;s signature</text>
<rect x="20" y="34" width="760" height="266" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>

<line x1="160.4" y1="60" x2="160.4" y2="280" stroke="#8fa8c0" stroke-width="1" stroke-dasharray="3,3"/>
<text x="164" y="73" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b7d99">rest, &#8722;65 mV</text>

<line x1="90" y1="189.4" x2="470" y2="189.4" stroke="#333" stroke-width="1.4"/>
<line x1="343.3" y1="60" x2="343.3" y2="280" stroke="#333" stroke-width="1.4"/>
<text x="478" y="193" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111">V (mV)</text>
<text x="350" y="68" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111">I</text>
<text x="118.1" y="181" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">&#8722;80</text>
<text x="230.7" y="181" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">&#8722;40</text>
<text x="455.9" y="203" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">+40</text>
<text x="96" y="76" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b7d99">outward</text>
<text x="96" y="276" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b7d99">inward</text>

<line x1="90" y1="270.9" x2="470" y2="148.6" stroke="#1a6fb5" stroke-width="2.4"/>
<text x="98" y="262" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#1a6fb5">AMPA</text>

<polyline points="90,193.1 118.1,195.5 146.3,199.2 174.4,204.6 202.6,211.5 230.7,218.9 258.9,223.9 270.1,224.3 287.0,222.3 315.1,210.7 343.3,189.4 371.5,161.2 399.6,129.5 427.8,96.3 455.9,62.9" fill="none" stroke="#d1495b" stroke-width="2.4" stroke-linejoin="round"/>
<text x="252" y="240" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#d1495b">NMDA</text>
<circle cx="270.1" cy="224.3" r="3" fill="#d1495b"/>
<text x="278" y="248" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#d1495b">peak inward near &#8722;26 mV</text>

<path d="M 118 268 L 262 268" stroke="#2e8b57" stroke-width="1.2" fill="none"/>
<path d="M 262 268 L 254 264 M 262 268 L 254 272" stroke="#2e8b57" stroke-width="1.2" fill="none"/>
<text x="118" y="288" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#2e8b57">negative slope: depolarizing makes NMDA current bigger</text>

<text x="492" y="80" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a6fb5">AMPA receptor</text>
<text x="492" y="97" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">linear, reverses near 0 mV;</text>
<text x="492" y="112" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">drive falls as the cell depolarizes</text>
<text x="492" y="140" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b">NMDA receptor</text>
<text x="492" y="157" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">Mg&#178;&#8314; plugs the pore when hyperpolarized</text>
<text x="492" y="172" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">unblocked fraction: 4% at &#8722;70 mV,</text>
<text x="492" y="187" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">36% at &#8722;30 mV, 78% at 0 mV</text>
<text x="492" y="212" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111">&#8594; conducts only if glutamate is bound</text>
<text x="504" y="227" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111">AND the cell is already depolarized</text>
<text x="492" y="248" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5b7d99">the block is a pore plug, not a voltage sensor</text>

<text x="20" y="322" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#111">(b) the same transmitter, three timescales &#8212; log time axis</text>
