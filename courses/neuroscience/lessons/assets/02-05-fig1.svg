<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="820" height="600" role="img" aria-label="Panel a shows a retina and a tectum drawn as vertical bars carrying opposing smooth gradients, EphA receptor rising from nasal to temporal in the retina and ephrin-A ligand rising from anterior to posterior in the tectum, with three axons crossing so that the temporal, high-EphA axon terminates anterior where ephrin is low and the nasal, low-EphA axon terminates posterior where ephrin is high. Panel b contrasts an initial exuberant projection in which axons from both eyes contact the whole target territory with the refined outcome in which correlated within-eye inputs have segregated into alternating stripes and the rest have been pruned.">
<rect width="820" height="600" fill="#ffffff"/>
<defs>
<linearGradient id="ephA" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#e2edf7"/>
<stop offset="1" stop-color="#1a6fb5"/>
</linearGradient>
<linearGradient id="ephrinA" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fbe3e6"/>
<stop offset="1" stop-color="#d1495b"/>
</linearGradient>
<marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
<path d="M0 0 L6 3 L0 6 z" fill="#333333"/>
</marker>
</defs>

<text x="14" y="24" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">(a) Chemoaffinity &#8212; two opposing gradients build a topographic map</text>

<text x="92" y="60" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="middle">RETINA</text>
<rect x="70" y="70" width="44" height="190" fill="url(#ephA)" stroke="#333333" stroke-width="1"/>
<text x="62" y="80" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333" text-anchor="end">nasal</text>
<text x="62" y="258" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333" text-anchor="end">temporal</text>
<text x="40" y="165" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a6fb5" text-anchor="middle" transform="rotate(-90 40 165)">EphA: low &#8594; high</text>

<text x="642" y="60" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="middle">TECTUM</text>
<rect x="620" y="70" width="44" height="190" fill="url(#ephrinA)" stroke="#333333" stroke-width="1"/>
<text x="672" y="80" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333">anterior</text>
<text x="672" y="258" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333">posterior</text>
<text x="742" y="165" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b" text-anchor="middle" transform="rotate(-90 742 165)">ephrin-A: low &#8594; high</text>

<path d="M114 95 C 300 95, 434 235, 614 235" fill="none" stroke="#2e8b57" stroke-width="2" marker-end="url(#ah)"/>
<path d="M114 165 L 614 165" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<path d="M114 235 C 300 235, 434 95, 614 95" fill="none" stroke="#d1495b" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="114" cy="95" r="3.5" fill="#2e8b57"/>
<circle cx="114" cy="165" r="3.5" fill="#333333"/>
<circle cx="114" cy="235" r="3.5" fill="#d1495b"/>
<text x="122" y="88" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#2e8b57">nasal axon (low EphA)</text>
<text x="122" y="158" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333">central axon</text>
<text x="122" y="252" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b">temporal axon (high EphA)</text>

<text x="410" y="292" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111111" text-anchor="middle">High EphA is repelled by high ephrin-A, so the temporal axon stops anterior and the nasal axon runs on to the posterior end.</text>
<text x="410" y="309" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="middle">A relative code: two smooth gradients read against each other, and no axon needs a unique address.</text>

<line x1="14" y1="330" x2="806" y2="330" stroke="#8fa8c0" stroke-width="1"/>

<text x="14" y="356" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">(b) Activity-dependent refinement &#8212; exuberance first, then pruning</text>

<text x="215" y="382" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="middle">BEFORE</text>
<ellipse cx="130" cy="408" rx="30" ry="14" fill="#dce9f5" stroke="#1a6fb5" stroke-width="1.5"/>
<text x="130" y="412" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" text-anchor="middle">L eye</text>
<ellipse cx="300" cy="408" rx="30" ry="14" fill="#fbe3e6" stroke="#d1495b" stroke-width="1.5"/>
<text x="300" y="412" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" text-anchor="middle">R eye</text>
<path d="M130 422 L 90 470" fill="none" stroke="#1a6fb5" stroke-width="1.4"/>
<path d="M130 422 L 150 470" fill="none" stroke="#1a6fb5" stroke-width="1.4"/>
<path d="M130 422 L 220 470" fill="none" stroke="#1a6fb5" stroke-width="1.4"/>
<path d="M130 422 L 290 470" fill="none" stroke="#1a6fb5" stroke-width="1.4"/>
<path d="M300 422 L 110 470" fill="none" stroke="#d1495b" stroke-width="1.4"/>
<path d="M300 422 L 180 470" fill="none" stroke="#d1495b" stroke-width="1.4"/>
<path d="M300 422 L 250 470" fill="none" stroke="#d1495b" stroke-width="1.4"/>
<path d="M300 422 L 330 470" fill="none" stroke="#d1495b" stroke-width="1.4"/>
<rect x="70" y="470" width="290" height="30" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>
<text x="215" y="489" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" text-anchor="middle">L and R terminals intermingled everywhere</text>
<text x="215" y="518" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333" text-anchor="middle">each axon contacts the whole territory</text>

<text x="595" y="382" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="middle">AFTER</text>
<ellipse cx="510" cy="408" rx="30" ry="14" fill="#dce9f5" stroke="#1a6fb5" stroke-width="1.5"/>
<text x="510" y="412" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" text-anchor="middle">L eye</text>
<ellipse cx="680" cy="408" rx="30" ry="14" fill="#fbe3e6" stroke="#d1495b" stroke-width="1.5"/>
<text x="680" y="412" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111" text-anchor="middle">R eye</text>
<path d="M510 422 L 486 470" fill="none" stroke="#1a6fb5" stroke-width="2"/>
<path d="M510 422 L 631 470" fill="none" stroke="#1a6fb5" stroke-width="2"/>
<path d="M680 422 L 559 470" fill="none" stroke="#d1495b" stroke-width="2"/>
<path d="M680 422 L 704 470" fill="none" stroke="#d1495b" stroke-width="2"/>
<rect x="450" y="470" width="72.5" height="30" fill="#dce9f5" stroke="#8fa8c0" stroke-width="1"/>
<rect x="522.5" y="470" width="72.5" height="30" fill="#fbe3e6" stroke="#8fa8c0" stroke-width="1"/>
<rect x="595" y="470" width="72.5" height="30" fill="#dce9f5" stroke="#8fa8c0" stroke-width="1"/>
<rect x="667.5" y="470" width="72.5" height="30" fill="#fbe3e6" stroke="#8fa8c0" stroke-width="1"/>
<text x="486" y="490" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a6fb5" text-anchor="middle">L</text>
<text x="559" y="490" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b" text-anchor="middle">R</text>
<text x="631" y="490" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a6fb5" text-anchor="middle">L</text>
<text x="704" y="490" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b" text-anchor="middle">R</text>
<text x="595" y="518" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333" text-anchor="middle">segregated stripes; the losing branches are withdrawn</text>

<text x="410" y="552" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="middle">Rule: inputs whose activity correlates with the postsynaptic cell are kept and strengthened; the rest are pruned.</text>
<text x="410" y="570" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111111" text-anchor="middle">Retinal waves supply the correlation before the eyes open &#8212; correlated within an eye, uncorrelated between eyes.</text>
<text x="410" y="588" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333" text-anchor="middle">Gradients deliver the axon to the right neighbourhood; activity chooses among the partners it finds there.</text>
</svg>
