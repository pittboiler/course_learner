<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Two panels. Left, the spike-timing-dependent plasticity window: weight change plotted against the interval between the postsynaptic and presynaptic spike, with a tall narrow potentiation lobe for presynaptic-first pairings and a shallower, wider depression lobe for postsynaptic-first pairings. Right, the calcium rule: weight change against the size of the postsynaptic calcium transient, flat at low calcium, negative in an intermediate band, positive above a higher threshold, with a dashed copy of the same curve shifted to the right showing the sliding threshold.">
<rect width="800" height="420" fill="#ffffff"/>
<defs>
<marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
<path d="M0,0 L9,3.5 L0,7 z" fill="#333"/>
</marker>
</defs>

