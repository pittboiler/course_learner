<text x="414" y="200" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#111" text-anchor="middle" transform="rotate(-90 414 200)">&#916;w</text>

<text x="40" y="378" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">Presynaptic spike first &#8594; glutamate is bound when the backpropagating spike arrives &#8594; large Ca&#178;&#8314; &#8594; LTP.</text>
<text x="40" y="396" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">Reverse the order &#8594; the depolarization has passed &#8594; modest Ca&#178;&#8314; &#8594; LTD. One mechanism, both signs.</text>
</svg>
