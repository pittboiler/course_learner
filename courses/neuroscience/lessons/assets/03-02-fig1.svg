<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650" role="img" aria-label="Panel a shows an ON-centre retinal ganglion cell receptive field drawn as two concentric circles, an excitatory centre with total weight plus eight and an inhibitory surround annulus with total weight minus eight. Beneath it the same weights are drawn as a bar profile across seven sampled positions, minus two, minus two, plus two, plus four, plus two, minus two, minus two, which sums to zero. To the right, three stimuli are shown as small square patches with the receptive field outline dashed on top, together with the cell's response drawn as a horizontal bar. A bright spot filling only the centre gives a response of plus eighty. Uniform full-field illumination gives exactly zero at any intensity. A light-dark edge placed across the field gives plus forty. The panel notes that the direct-current gain is exactly zero, so the cell reports contrast rather than luminance. Panel b shows four small centre-surround inputs arranged along a line tilted sixty degrees from horizontal, each sending an arrow to a single simple cell, with an oriented bar stimulus drawn at the same angle. To the right is the resulting orientation tuning curve, a bell-shaped curve of firing rate against bar orientation in degrees from the preferred angle, peaked at zero and about forty degrees wide at half height.">
<rect width="800" height="650" fill="#ffffff"/>

<text x="20" y="26" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#111">(a) an ON-centre receptive field: blind to uniform light, loud at contrast</text>
<rect x="20" y="34" width="760" height="300" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>

