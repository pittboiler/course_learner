  <line x1="60.0" y1="300.0" x2="654.0" y2="300.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="60.0" y="326.0" fill="#8a8a8a" font-size="11">x = don&#x27;t care: no register is written, so it makes no difference what the mux selects.</text>
  <text x="60.0" y="346.0" fill="#8a8a8a" font-size="11">Every 1 is a wire pulled high for the whole cycle. The control unit is pure combinational logic.</text>
  <text x="60.0" y="84.0" fill="#8a8a8a" font-size="11.5">one row per instruction class:</text>
