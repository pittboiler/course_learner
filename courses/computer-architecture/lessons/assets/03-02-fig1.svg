  <text x="536.0" y="178.0" fill="#e0645c" font-size="12" text-anchor="middle" font-weight="bold">1</text>
  <text x="618.0" y="178.0" fill="#8a8a8a" font-size="12" text-anchor="middle">0</text>
  <text x="108.0" y="216.0" fill="#4a90d9" font-size="12" text-anchor="middle">sw</text>
  <text x="199.0" y="216.0" fill="#8a8a8a" font-size="12" text-anchor="middle">0</text>
  <text x="279.0" y="216.0" fill="#e0645c" font-size="12" text-anchor="middle" font-weight="bold">1</text>
  <text x="358.0" y="216.0" fill="#8a8a8a" font-size="12" text-anchor="middle">0</text>
