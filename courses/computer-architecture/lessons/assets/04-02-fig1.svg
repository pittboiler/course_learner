  <rect x="318.0" y="256.0" width="78.0" height="38.0" fill="none" stroke="#4a90d9" stroke-width="1.2" rx="3"/>
  <rect x="402.0" y="256.0" width="78.0" height="38.0" fill="none" stroke="#4a90d9" stroke-width="1.2" rx="3"/>
  <text x="590.0" y="92.0" fill="#e0645c" font-size="12" text-anchor="middle">fully assoc.</text>
  <text x="590.0" y="110.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">1 set, 8 ways</text>
  <rect x="516.0" y="124.0" width="38.0" height="82.0" fill="none" stroke="#e0645c" stroke-width="1.2" rx="3"/>
  <rect x="558.0" y="124.0" width="38.0" height="82.0" fill="none" stroke="#e0645c" stroke-width="1.2" rx="3"/>
  <rect x="600.0" y="124.0" width="38.0" height="82.0" fill="none" stroke="#e0645c" stroke-width="1.2" rx="3"/>
  <rect x="642.0" y="124.0" width="38.0" height="82.0" fill="none" stroke="#e0645c" stroke-width="1.2" rx="3"/>
  <rect x="516.0" y="212.0" width="38.0" height="82.0" fill="none" stroke="#e0645c" stroke-width="1.2" rx="3"/>
