  <text x="390.0" y="322.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">A block may go in exactly one set - but any way within that set.</text>
  <line x1="60.0" y1="340.0" x2="720.0" y2="340.0" stroke="#8a8a8a" stroke-width="1"/>
  <text x="80.0" y="362.0" fill="#8a8a8a" font-size="10.5">miss type</text>
  <text x="238.0" y="362.0" fill="#8a8a8a" font-size="10.5">cause</text>
  <text x="452.0" y="362.0" fill="#8a8a8a" font-size="10.5">what actually helps</text>
  <text x="80.0" y="386.0" fill="#e0645c" font-size="11">compulsory</text>
  <text x="238.0" y="386.0" fill="#8a8a8a" font-size="10.5">first ever touch</text>
  <text x="452.0" y="386.0" fill="#8a8a8a" font-size="10.5">bigger blocks, prefetching</text>
  <text x="80.0" y="404.0" fill="#4a90d9" font-size="11">capacity</text>
  <text x="238.0" y="404.0" fill="#8a8a8a" font-size="10.5">working set too big</text>
  <text x="452.0" y="404.0" fill="#8a8a8a" font-size="10.5">a bigger cache</text>
  <text x="80.0" y="422.0" fill="#8a8a8a" font-size="11">conflict</text>
  <text x="238.0" y="422.0" fill="#8a8a8a" font-size="10.5">many blocks, one set</text>
  <text x="452.0" y="422.0" fill="#8a8a8a" font-size="10.5">more associativity</text>
