  <text x="380.0" y="110.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">4 sets, 2 ways</text>
  <rect x="318.0" y="124.0" width="78.0" height="38.0" fill="none" stroke="#4a90d9" stroke-width="1.2" rx="3"/>
  <rect x="402.0" y="124.0" width="78.0" height="38.0" fill="none" stroke="#4a90d9" stroke-width="1.2" rx="3"/>
