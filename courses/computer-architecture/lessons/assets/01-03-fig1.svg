<svg viewBox="0 0 740 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Load/store discipline: arithmetic touches registers only; memory is reached by base + offset.</text>
  <rect x="60.0" y="90.0" width="150.0" height="150.0" fill="none" stroke="#4a90d9" stroke-width="1.6" rx="6"/>
  <text x="135.0" y="80.0" fill="#4a90d9" font-size="12" text-anchor="middle">register file</text>
  <text x="74.0" y="120.0" fill="#8a8a8a" font-size="11">x5 (t0)</text>
  <text x="196.0" y="120.0" fill="#8a8a8a" font-size="11" text-anchor="end">0x0000_1000</text>
  <line x1="70.0" y1="128.0" x2="200.0" y2="128.0" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="74.0" y="158.0" fill="#8a8a8a" font-size="11">x6 (t1)</text>
  <text x="196.0" y="158.0" fill="#8a8a8a" font-size="11" text-anchor="end">42</text>
  <line x1="70.0" y1="166.0" x2="200.0" y2="166.0" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="74.0" y="196.0" fill="#8a8a8a" font-size="11">x7 (t2)</text>
  <text x="196.0" y="196.0" fill="#8a8a8a" font-size="11" text-anchor="end">?</text>
  <line x1="70.0" y1="204.0" x2="200.0" y2="204.0" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="2 3"/>
  <rect x="470.0" y="74.0" width="190.0" height="240.0" fill="none" stroke="#e0645c" stroke-width="1.6" rx="6"/>
  <text x="565.0" y="64.0" fill="#e0645c" font-size="12" text-anchor="middle">memory (byte-addressed)</text>
  <text x="490.0" y="104.0" fill="#8a8a8a" font-size="11">0x1000</text>
  <text x="644.0" y="104.0" fill="#8a8a8a" font-size="11" text-anchor="end">11</text>
  <text x="490.0" y="146.0" fill="#8a8a8a" font-size="11">0x1004</text>
  <text x="644.0" y="146.0" fill="#8a8a8a" font-size="11" text-anchor="end">22</text>
  <rect x="478.0" y="168.0" width="174.0" height="30.0" fill="#e0645c" stroke="None" stroke-width="1.5" opacity="0.18"/>
  <text x="490.0" y="188.0" fill="#8a8a8a" font-size="11">0x1008</text>
  <text x="644.0" y="188.0" fill="#e0645c" font-size="11" text-anchor="end">33</text>
  <text x="490.0" y="230.0" fill="#8a8a8a" font-size="11">0x100C</text>
  <text x="644.0" y="230.0" fill="#8a8a8a" font-size="11" text-anchor="end">44</text>
  <text x="490.0" y="272.0" fill="#8a8a8a" font-size="11">0x1010</text>
  <text x="644.0" y="272.0" fill="#8a8a8a" font-size="11" text-anchor="end">55</text>
  <text x="565.0" y="332.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">each row is one 4-byte word</text>
  <rect x="246.0" y="152.0" width="196.0" height="54.0" fill="none" stroke="#8a8a8a" stroke-width="1.6" rx="6"/>
  <text x="344.0" y="176.0" fill="#8a8a8a" text-anchor="middle">lw  x7, 8(x5)</text>
  <text x="344.0" y="196.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">base + offset</text>
  <line x1="212.0" y1="168.0" x2="242.0" y2="168.0" stroke="#4a90d9" stroke-width="1.6"/>
  <polygon points="242.0,168.0 231.0,163.0 231.0,173.0" fill="#4a90d9"/>
  <text x="227.0" y="158.0" fill="#4a90d9" font-size="9.5" text-anchor="middle">base</text>
  <line x1="446.0" y1="180.0" x2="466.0" y2="180.0" stroke="#e0645c" stroke-width="1.6"/>
  <polygon points="466.0,180.0 455.0,175.0 455.0,185.0" fill="#e0645c"/>
  <text x="344.0" y="232.0" fill="#e0645c" font-size="11.5" text-anchor="middle">address = 0x1000 + 8 = 0x1008</text>
  <text x="344.0" y="250.0" fill="#4a90d9" font-size="11.5" text-anchor="middle">x7 &lt;- 33</text>
  <text x="370.0" y="300.0" fill="#8a8a8a" font-size="11" text-anchor="middle">Only lw and sw touch memory. add, sub, and, shift never do —</text>
  <text x="370.0" y="318.0" fill="#8a8a8a" font-size="11" text-anchor="middle">that restriction is what keeps the datapath simple enough to pipeline.</text>
</svg>
