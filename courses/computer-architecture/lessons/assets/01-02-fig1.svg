  <text x="634.0" y="283.0" fill="#8a8a8a" font-size="10.5">jal</text>
  <text x="64.0" y="318.0" fill="#8a8a8a" font-size="12">Read the design, not the table:</text>
  <text x="64.0" y="338.0" fill="#8a8a8a" font-size="11">rs1 and rs2 occupy the SAME bits in every format that has them, so the register file can</text>
  <text x="64.0" y="354.0" fill="#8a8a8a" font-size="11">start reading before the opcode is decoded. rd likewise. Only the immediate moves.</text>
  <text x="64.0" y="376.0" fill="#e0645c" font-size="11">S and B scatter their immediates precisely so the bits that DO overlap stay put.</text>
