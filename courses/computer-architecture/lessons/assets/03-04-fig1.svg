  <text x="379.0" y="158.0" fill="#e0645c" font-size="11">forward EX/MEM -&gt; EX: no stall</text>
  <text x="116.0" y="220.0" fill="#8a8a8a" font-size="11" text-anchor="end">lw  x1,0(x2)</text>
  <rect x="129.0" y="200.0" width="64.0" height="30.0" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" opacity="0.16" rx="4"/>
  <text x="161.0" y="220.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">IF</text>
  <rect x="199.0" y="200.0" width="64.0" height="30.0" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" opacity="0.16" rx="4"/>
