<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">The stack grows down. A frame is whatever one call needs to survive the calls it makes.</text>
  <text x="195.0" y="68.0" fill="#8a8a8a" font-size="11" text-anchor="middle">memory, high addresses at top</text>
  <rect x="90.0" y="86.0" width="210.0" height="52.0" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.5" opacity="0.13" rx="4"/>
  <text x="195.0" y="116.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">caller&#x27;s frame</text>
  <rect x="90.0" y="138.0" width="210.0" height="30.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.5" opacity="0.13" rx="4"/>
  <text x="195.0" y="157.0" fill="#e0645c" font-size="11.5" text-anchor="middle">saved ra</text>
  <rect x="90.0" y="168.0" width="210.0" height="30.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.5" opacity="0.13" rx="4"/>
  <text x="195.0" y="187.0" fill="#e0645c" font-size="11.5" text-anchor="middle">saved s1</text>
  <rect x="90.0" y="198.0" width="210.0" height="44.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" opacity="0.13" rx="4"/>
  <text x="195.0" y="224.0" fill="#4a90d9" font-size="11.5" text-anchor="middle">local array</text>
  <rect x="90.0" y="242.0" width="210.0" height="34.0" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.5" opacity="0.13" rx="4"/>
  <text x="195.0" y="263.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">(unused)</text>
  <line x1="74.0" y1="86.0" x2="74.0" y2="276.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="74.0,276.0 79.0,265.0 69.0,265.0" fill="#8a8a8a"/>
  <text x="66.0" y="182.0" fill="#8a8a8a" font-size="10.5" text-anchor="end">grows</text>
  <text x="66.0" y="196.0" fill="#8a8a8a" font-size="10.5" text-anchor="end">down</text>
  <text x="312.0" y="143.0" fill="#8a8a8a" font-size="10.5">sp + 8</text>
  <line x1="356.0" y1="240.0" x2="314.0" y2="240.0" stroke="#e0645c" stroke-width="1.6"/>
  <polygon points="314.0,240.0 325.0,245.0 325.0,235.0" fill="#e0645c"/>
  <text x="360.0" y="244.0" fill="#e0645c" font-size="12.5">sp</text>
  <text x="195.0" y="296.0" fill="#4a90d9" font-size="11.5" text-anchor="middle">this call&#x27;s frame</text>
  <text x="195.0" y="318.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">addi sp, sp, -16   on entry</text>
  <text x="195.0" y="336.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">addi sp, sp,  16   on exit</text>
  <line x1="400.0" y1="72.0" x2="400.0" y2="370.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="424.0" y="96.0" fill="#8a8a8a" font-size="12.5">Who saves what</text>
  <text x="424.0" y="124.0" fill="#8a8a8a" font-size="10.5">reg</text>
  <text x="492.0" y="124.0" fill="#8a8a8a" font-size="10.5">role</text>
  <text x="660.0" y="124.0" fill="#8a8a8a" font-size="10.5">saved by</text>
  <line x1="420.0" y1="132.0" x2="736.0" y2="132.0" stroke="#8a8a8a" stroke-width="1"/>
  <text x="424.0" y="156.0" fill="#e0645c" font-size="11.5">a0-a7</text>
  <text x="492.0" y="156.0" fill="#8a8a8a" font-size="11">arguments and returns</text>
  <text x="660.0" y="156.0" fill="#e0645c" font-size="11">caller</text>
  <text x="424.0" y="186.0" fill="#e0645c" font-size="11.5">t0-t6</text>
  <text x="492.0" y="186.0" fill="#8a8a8a" font-size="11">scratch</text>
  <text x="660.0" y="186.0" fill="#e0645c" font-size="11">caller</text>
  <text x="424.0" y="216.0" fill="#4a90d9" font-size="11.5">s0-s11</text>
  <text x="492.0" y="216.0" fill="#8a8a8a" font-size="11">must survive a call</text>
  <text x="660.0" y="216.0" fill="#4a90d9" font-size="11">callee</text>
  <text x="424.0" y="246.0" fill="#4a90d9" font-size="11.5">ra</text>
  <text x="492.0" y="246.0" fill="#8a8a8a" font-size="11">return address</text>
  <text x="660.0" y="246.0" fill="#4a90d9" font-size="11">callee*</text>
  <text x="424.0" y="276.0" fill="#4a90d9" font-size="11.5">sp</text>
  <text x="492.0" y="276.0" fill="#8a8a8a" font-size="11">stack pointer</text>
  <text x="660.0" y="276.0" fill="#4a90d9" font-size="11">callee</text>
  <text x="424.0" y="322.0" fill="#8a8a8a" font-size="10.5">* ra is callee-saved only if the callee</text>
  <text x="424.0" y="338.0" fill="#8a8a8a" font-size="10.5">itself calls something - a leaf function</text>
  <text x="424.0" y="354.0" fill="#8a8a8a" font-size="10.5">never has to spill it.</text>
</svg>
