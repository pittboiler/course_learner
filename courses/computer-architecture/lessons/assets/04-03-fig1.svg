<svg viewBox="0 0 790 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Every load goes through a translation. The TLB exists so that translation is not itself a memory access.</text>
  <rect x="70.0" y="90.0" width="350.0" height="30.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.6" opacity="0.14" rx="4"/>
  <text x="245.0" y="110.0" fill="#4a90d9" font-size="11" text-anchor="middle">virtual page number (20 bits)</text>
  <rect x="420.0" y="90.0" width="210.0" height="30.0" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.6" opacity="0.14" rx="4"/>
  <text x="525.0" y="110.0" fill="#8a8a8a" font-size="11" text-anchor="middle">page offset (12)</text>
  <text x="70.0" y="82.0" fill="#8a8a8a" font-size="10">31</text>
  <text x="630.0" y="82.0" fill="#8a8a8a" font-size="10" text-anchor="end">0</text>
  <text x="62.0" y="110.0" fill="#8a8a8a" font-size="12" text-anchor="end">VA</text>
  <line x1="245.0" y1="126.0" x2="245.0" y2="168.0" stroke="#4a90d9" stroke-width="1.6"/>
  <polygon points="245.0,168.0 250.0,157.0 240.0,157.0" fill="#4a90d9"/>
  <rect x="110.0" y="168.0" width="220.0" height="40.0" fill="none" stroke="#e0645c" stroke-width="1.8" rx="5"/>
  <text x="220.0" y="193.0" fill="#e0645c" font-size="11.5" text-anchor="middle">TLB  (translation cache)</text>
  <text x="257.0" y="150.0" fill="#4a90d9" font-size="10.5">translate</text>
  <line x1="525.0" y1="126.0" x2="525.0" y2="222.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="533.0" y="178.0" fill="#8a8a8a" font-size="10.5">offset passes</text>
  <text x="533.0" y="194.0" fill="#8a8a8a" font-size="10.5">through unchanged</text>
  <line x1="220.0" y1="208.0" x2="140.0" y2="222.0" stroke="#e0645c" stroke-width="1.6"/>
  <polygon points="140.0,222.0 151.7,225.0 150.0,215.2" fill="#e0645c"/>
  <rect x="70.0" y="228.0" width="350.0" height="30.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.6" opacity="0.14" rx="4"/>
  <text x="245.0" y="248.0" fill="#e0645c" font-size="11" text-anchor="middle">physical page number</text>
  <rect x="420.0" y="228.0" width="210.0" height="30.0" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.6" opacity="0.14" rx="4"/>
  <text x="525.0" y="248.0" fill="#8a8a8a" font-size="11" text-anchor="middle">page offset (12)</text>
  <text x="62.0" y="248.0" fill="#8a8a8a" font-size="12" text-anchor="end">PA</text>
  <line x1="60.0" y1="278.0" x2="730.0" y2="278.0" stroke="#8a8a8a" stroke-width="1"/>
  <text x="70.0" y="302.0" fill="#8a8a8a" font-size="11">4 KiB pages -&gt; 12 offset bits.  32-bit VA -&gt; 20-bit VPN -&gt; a flat page table would need 2^20 entries</text>
  <text x="70.0" y="322.0" fill="#8a8a8a" font-size="11">PER PROCESS - 4 MiB of tables for a program that might use 100 KiB. Hence multi-level tables.</text>
  <text x="70.0" y="352.0" fill="#e0645c" font-size="11.5">TLB hit: translation costs 1 cycle.   TLB miss: walk the page table, tens of cycles.</text>
  <text x="70.0" y="372.0" fill="#e0645c" font-size="11.5">Page fault: the page is not in memory at all - milliseconds, and the OS gets involved.</text>
</svg>
