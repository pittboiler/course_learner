<svg viewBox="0 0 740 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Shift-and-add: the same algorithm you learned for long multiplication, in base 2.</text>
  <text x="70.0" y="84.0" fill="#8a8a8a" font-size="13">13 x 11  =  1101 x 1011</text>
  <text x="80.0" y="116.0" fill="#8a8a8a" font-size="11">step</text>
  <text x="180.0" y="116.0" fill="#8a8a8a" font-size="11">action</text>
  <text x="360.0" y="116.0" fill="#8a8a8a" font-size="11">running product</text>
  <text x="520.0" y="116.0" fill="#8a8a8a" font-size="11">decimal</text>
  <line x1="76.0" y1="124.0" x2="600.0" y2="124.0" stroke="#8a8a8a" stroke-width="1"/>
  <text x="80.0" y="150.0" fill="#4a90d9" font-size="12">b0 = 1</text>
  <text x="180.0" y="150.0" fill="#4a90d9" font-size="12">add 1101 &lt;&lt; 0</text>
  <text x="360.0" y="150.0" fill="#4a90d9" font-size="12">0000 1101</text>
  <text x="520.0" y="150.0" fill="#4a90d9" font-size="12">13</text>
  <text x="80.0" y="190.0" fill="#4a90d9" font-size="12">b1 = 1</text>
  <text x="180.0" y="190.0" fill="#4a90d9" font-size="12">add 1101 &lt;&lt; 1</text>
  <text x="360.0" y="190.0" fill="#4a90d9" font-size="12">0010 0111</text>
  <text x="520.0" y="190.0" fill="#4a90d9" font-size="12">39</text>
  <text x="80.0" y="230.0" fill="#8a8a8a" font-size="12">b2 = 0</text>
  <text x="180.0" y="230.0" fill="#8a8a8a" font-size="12">add nothing</text>
  <text x="360.0" y="230.0" fill="#8a8a8a" font-size="12">0010 0111</text>
  <text x="520.0" y="230.0" fill="#8a8a8a" font-size="12">39</text>
  <text x="80.0" y="270.0" fill="#4a90d9" font-size="12">b3 = 1</text>
  <text x="180.0" y="270.0" fill="#4a90d9" font-size="12">add 1101 &lt;&lt; 3</text>
  <text x="360.0" y="270.0" fill="#e0645c" font-size="12">1000 1111</text>
  <text x="520.0" y="270.0" fill="#e0645c" font-size="12">143</text>
  <line x1="76.0" y1="320.0" x2="600.0" y2="320.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="360.0" y="344.0" fill="#e0645c" font-size="13">13 x 11 = 143</text>
  <text x="70.0" y="368.0" fill="#8a8a8a" font-size="11">Each 1 bit contributes a shifted copy. n bits means n add-or-skip steps.</text>
  <line x1="620.0" y1="100.0" x2="620.0" y2="360.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="640.0" y="132.0" fill="#8a8a8a" font-size="12">Why the product</text>
  <text x="640.0" y="150.0" fill="#8a8a8a" font-size="12">is double width:</text>
  <text x="640.0" y="180.0" fill="#8a8a8a" font-size="11">largest 4-bit x 4-bit</text>
  <text x="640.0" y="198.0" fill="#8a8a8a" font-size="11">is 15 x 15 = 225,</text>
  <text x="640.0" y="216.0" fill="#8a8a8a" font-size="11">which needs 8 bits.</text>
  <text x="640.0" y="250.0" fill="#e0645c" font-size="11.5">RISC-V splits it:</text>
  <text x="640.0" y="270.0" fill="#4a90d9" font-size="11">mul  -&gt; low 32</text>
  <text x="640.0" y="288.0" fill="#4a90d9" font-size="11">mulh -&gt; high 32</text>
  <text x="640.0" y="318.0" fill="#8a8a8a" font-size="11">Two instructions if</text>
  <text x="640.0" y="336.0" fill="#8a8a8a" font-size="11">you need all 64 bits.</text>
</svg>
