<svg viewBox="0 0 760 370" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">A loop is a backward branch. The immediate is a PC-relative distance, not an address.</text>
  <text x="64.0" y="86.0" fill="#8a8a8a" font-size="10.5">0x100</text>
  <text x="144.0" y="86.0" fill="#8a8a8a" font-size="12">  li   t1, 0</text>
  <text x="144.0" y="116.0" fill="#e0645c" font-size="12">loop:</text>
  <text x="64.0" y="146.0" fill="#8a8a8a" font-size="10.5">0x104</text>
  <text x="144.0" y="146.0" fill="#e0645c" font-size="12">  bge  t1, a1, done</text>
  <text x="64.0" y="176.0" fill="#8a8a8a" font-size="10.5">0x108</text>
  <text x="144.0" y="176.0" fill="#8a8a8a" font-size="12">  ...body...</text>
  <text x="64.0" y="206.0" fill="#8a8a8a" font-size="10.5">0x118</text>
  <text x="144.0" y="206.0" fill="#8a8a8a" font-size="12">  addi t1, t1, 1</text>
  <text x="64.0" y="236.0" fill="#8a8a8a" font-size="10.5">0x11C</text>
  <text x="144.0" y="236.0" fill="#e0645c" font-size="12">  j    loop</text>
  <text x="144.0" y="266.0" fill="#e0645c" font-size="12">done:</text>
  <line x1="364.0" y1="116.0" x2="394.0" y2="116.0" stroke="#e0645c" stroke-width="1.6"/>
  <line x1="394.0" y1="116.0" x2="394.0" y2="266.0" stroke="#e0645c" stroke-width="1.6"/>
  <line x1="394.0" y1="266.0" x2="364.0" y2="266.0" stroke="#e0645c" stroke-width="1.6"/>
  <polygon points="364.0,266.0 375.0,271.0 375.0,261.0" fill="#e0645c"/>
  <text x="402.0" y="196.0" fill="#e0645c" font-size="10.5">forward: +28</text>
  <line x1="312.0" y1="236.0" x2="336.0" y2="236.0" stroke="#4a90d9" stroke-width="1.6"/>
  <line x1="336.0" y1="236.0" x2="336.0" y2="116.0" stroke="#4a90d9" stroke-width="1.6"/>
  <line x1="336.0" y1="116.0" x2="312.0" y2="116.0" stroke="#4a90d9" stroke-width="1.6"/>
  <polygon points="312.0,116.0 323.0,121.0 323.0,111.0" fill="#4a90d9"/>
  <text x="256.0" y="178.0" fill="#4a90d9" font-size="10.5" text-anchor="end">backward:</text>
  <text x="256.0" y="193.0" fill="#4a90d9" font-size="10.5" text-anchor="end">-24</text>
  <line x1="470.0" y1="76.0" x2="470.0" y2="340.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="492.0" y="100.0" fill="#8a8a8a" font-size="12.5">Why PC-relative?</text>
  <text x="492.0" y="126.0" fill="#8a8a8a" font-size="11">The branch stores a DISTANCE, so the</text>
  <text x="492.0" y="144.0" fill="#8a8a8a" font-size="11">same code works wherever it is loaded.</text>
  <text x="492.0" y="172.0" fill="#e0645c" font-size="12">target = PC + immediate</text>
  <text x="492.0" y="200.0" fill="#8a8a8a" font-size="11">B-type gives 12 immediate bits, and the</text>
  <text x="492.0" y="218.0" fill="#8a8a8a" font-size="11">low bit is always 0 (instructions are</text>
  <text x="492.0" y="236.0" fill="#8a8a8a" font-size="11">even), so the range is about +/- 4 KiB.</text>
  <text x="492.0" y="266.0" fill="#8a8a8a" font-size="11">Need farther? Branch over a jump:</text>
  <text x="492.0" y="290.0" fill="#4a90d9" font-size="11">  beq  x1, x2, skip</text>
  <text x="492.0" y="308.0" fill="#4a90d9" font-size="11">  j    far_away</text>
  <text x="492.0" y="326.0" fill="#4a90d9" font-size="11">skip:</text>
</svg>
