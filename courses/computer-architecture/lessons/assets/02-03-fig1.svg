<svg viewBox="0 0 760 390" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">A float is three fields, and the exponent controls how far apart the neighbours are.</text>
  <rect x="70.0" y="96.0" width="18.8" height="32.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.6" opacity="0.14" rx="4"/>
  <text x="79.4" y="117.0" fill="#e0645c" font-size="11" text-anchor="middle">s</text>
  <rect x="88.8" y="96.0" width="150.0" height="32.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.6" opacity="0.14" rx="4"/>
  <text x="163.8" y="117.0" fill="#4a90d9" font-size="12" text-anchor="middle">exponent</text>
  <rect x="238.8" y="96.0" width="431.2" height="32.0" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.6" opacity="0.14" rx="4"/>
  <text x="454.4" y="117.0" fill="#8a8a8a" font-size="12" text-anchor="middle">mantissa</text>
  <text x="70.0" y="88.0" fill="#8a8a8a" font-size="10">31</text>
  <text x="670.0" y="88.0" fill="#8a8a8a" font-size="10" text-anchor="end">0</text>
  <text x="70.0" y="152.0" fill="#8a8a8a" font-size="12.5">value  =  (-1)^s  x  1.mantissa  x  2^(exponent - 127)</text>
  <text x="70.0" y="176.0" fill="#e0645c" font-size="11.5">-6.5  =  -1.101 x 2^2     s=1   exp=129=10000001   mant=101000...</text>
  <text x="70.0" y="196.0" fill="#e0645c" font-size="11.5">                                                    = 0xC0D00000</text>
  <line x1="70.0" y1="250.0" x2="690.0" y2="250.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <line x1="90.0" y1="244.0" x2="90.0" y2="256.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="90.0" y="272.0" fill="#8a8a8a" font-size="11" text-anchor="middle">0</text>
  <line x1="109.7" y1="247.0" x2="109.7" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="129.3" y1="247.0" x2="129.3" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="149.0" y1="247.0" x2="149.0" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="168.7" y1="247.0" x2="168.7" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="188.3" y1="247.0" x2="188.3" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="208.0" y1="244.0" x2="208.0" y2="256.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="208.0" y="272.0" fill="#8a8a8a" font-size="11" text-anchor="middle">1</text>
  <line x1="227.7" y1="247.0" x2="227.7" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="247.3" y1="247.0" x2="247.3" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="267.0" y1="247.0" x2="267.0" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="286.7" y1="247.0" x2="286.7" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="306.3" y1="247.0" x2="306.3" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="326.0" y1="244.0" x2="326.0" y2="256.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="326.0" y="272.0" fill="#8a8a8a" font-size="11" text-anchor="middle">2</text>
  <line x1="345.7" y1="247.0" x2="345.7" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="365.3" y1="247.0" x2="365.3" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="385.0" y1="247.0" x2="385.0" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="404.7" y1="247.0" x2="404.7" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="424.3" y1="247.0" x2="424.3" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="444.0" y1="244.0" x2="444.0" y2="256.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="444.0" y="272.0" fill="#8a8a8a" font-size="11" text-anchor="middle">4</text>
  <line x1="463.7" y1="247.0" x2="463.7" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="483.3" y1="247.0" x2="483.3" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="503.0" y1="247.0" x2="503.0" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="522.7" y1="247.0" x2="522.7" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="542.3" y1="247.0" x2="542.3" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="562.0" y1="244.0" x2="562.0" y2="256.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="562.0" y="272.0" fill="#8a8a8a" font-size="11" text-anchor="middle">8</text>
  <line x1="581.7" y1="247.0" x2="581.7" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="601.3" y1="247.0" x2="601.3" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="621.0" y1="247.0" x2="621.0" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="640.7" y1="247.0" x2="640.7" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="660.3" y1="247.0" x2="660.3" y2="253.0" stroke="#4a90d9" stroke-width="0.9"/>
  <line x1="680.0" y1="244.0" x2="680.0" y2="256.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="680.0" y="272.0" fill="#8a8a8a" font-size="11" text-anchor="middle">16</text>
  <text x="380.0" y="296.0" fill="#4a90d9" font-size="11.5" text-anchor="middle">Same number of representable values in EVERY doubling interval.</text>
  <text x="380.0" y="316.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">So the gap between neighbours doubles each time the exponent does.</text>
  <text x="380.0" y="346.0" fill="#e0645c" font-size="11.5" text-anchor="middle">At 2^24 the gap is 2, so 2^24 + 1 has nowhere to land and rounds back.</text>
  <text x="380.0" y="368.0" fill="#e0645c" font-size="11.5" text-anchor="middle">That is why float addition is not associative.</text>
</svg>
