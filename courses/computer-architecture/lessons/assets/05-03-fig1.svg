<svg viewBox="0 0 790 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Two cores, one variable, two private caches - and nothing keeping them in step.</text>
  <rect x="110.0" y="96.0" width="150.0" height="44.0" fill="none" stroke="#4a90d9" stroke-width="1.6" rx="5"/>
  <text x="185.0" y="124.0" fill="#4a90d9" font-size="12" text-anchor="middle">core 0</text>
  <rect x="110.0" y="158.0" width="150.0" height="44.0" fill="none" stroke="#8a8a8a" stroke-width="1.5" rx="5"/>
  <text x="185.0" y="178.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">private cache</text>
  <text x="185.0" y="194.0" fill="#8a8a8a" font-size="11" text-anchor="middle">x = 0</text>
  <line x1="185.0" y1="140.0" x2="185.0" y2="158.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <line x1="185.0" y1="202.0" x2="185.0" y2="232.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <rect x="330.0" y="96.0" width="150.0" height="44.0" fill="none" stroke="#4a90d9" stroke-width="1.6" rx="5"/>
  <text x="405.0" y="124.0" fill="#4a90d9" font-size="12" text-anchor="middle">core 1</text>
  <rect x="330.0" y="158.0" width="150.0" height="44.0" fill="none" stroke="#8a8a8a" stroke-width="1.5" rx="5"/>
  <text x="405.0" y="178.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">private cache</text>
  <text x="405.0" y="194.0" fill="#e0645c" font-size="11" text-anchor="middle">x = 0</text>
  <line x1="405.0" y1="140.0" x2="405.0" y2="158.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <line x1="405.0" y1="202.0" x2="405.0" y2="232.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <rect x="110.0" y="232.0" width="370.0" height="40.0" fill="none" stroke="#8a8a8a" stroke-width="1.6" rx="5"/>
  <text x="295.0" y="257.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">shared memory      x = 0</text>
  <text x="185.0" y="224.0" fill="#e0645c" font-size="10.5" text-anchor="middle">core 0 writes x = 1</text>
  <text x="295.0" y="294.0" fill="#e0645c" font-size="11.5" text-anchor="middle">Without a protocol, core 1 keeps reading its stale x = 0 forever.</text>
  <line x1="510.0" y1="90.0" x2="510.0" y2="330.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="534.0" y="116.0" fill="#8a8a8a" font-size="12.5">MSI states</text>
  <rect x="534.0" y="134.0" width="80.0" height="26.0" fill="none" stroke="#e0645c" stroke-width="1.5" rx="4"/>
  <text x="574.0" y="152.0" fill="#e0645c" font-size="11" text-anchor="middle">Modified</text>
  <text x="626.0" y="146.0" fill="#8a8a8a" font-size="10">this cache has the ONLY copy,</text>
  <text x="626.0" y="160.0" fill="#8a8a8a" font-size="10">and it is dirty</text>
  <rect x="534.0" y="192.0" width="80.0" height="26.0" fill="none" stroke="#4a90d9" stroke-width="1.5" rx="4"/>
  <text x="574.0" y="210.0" fill="#4a90d9" font-size="11" text-anchor="middle">Shared</text>
  <text x="626.0" y="204.0" fill="#8a8a8a" font-size="10">several caches may hold it,</text>
  <text x="626.0" y="218.0" fill="#8a8a8a" font-size="10">all clean</text>
  <rect x="534.0" y="250.0" width="80.0" height="26.0" fill="none" stroke="#8a8a8a" stroke-width="1.5" rx="4"/>
  <text x="574.0" y="268.0" fill="#8a8a8a" font-size="11" text-anchor="middle">Invalid</text>
  <text x="626.0" y="262.0" fill="#8a8a8a" font-size="10">this cache has nothing</text>
  <text x="626.0" y="276.0" fill="#8a8a8a" font-size="10">usable</text>
  <text x="534.0" y="336.0" fill="#e0645c" font-size="10.5">A write invalidates every other copy first.</text>
  <line x1="60.0" y1="352.0" x2="730.0" y2="352.0" stroke="#8a8a8a" stroke-width="1"/>
  <text x="70.0" y="378.0" fill="#8a8a8a" font-size="11">False sharing: two cores writing DIFFERENT variables in the SAME 64-byte block ping-pong the</text>
  <text x="70.0" y="398.0" fill="#8a8a8a" font-size="11">line between them. The program is correct and can be many times slower. Pad to a block boundary.</text>
</svg>
