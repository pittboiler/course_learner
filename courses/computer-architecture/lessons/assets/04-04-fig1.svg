<svg viewBox="0 0 760 390" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">The latency gap is not gradual - it spans eight orders of magnitude.</text>
  <rect x="210.0" y="110.0" width="40.0" height="26.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.5" opacity="0.2" rx="4"/>
  <text x="200.0" y="128.0" fill="#e0645c" font-size="11.5" text-anchor="end">register</text>
  <text x="258.0" y="128.0" fill="#e0645c" font-size="11">0.3 ns</text>
  <rect x="210.0" y="154.0" width="70.6" height="26.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.5" opacity="0.2" rx="4"/>
  <text x="200.0" y="172.0" fill="#e0645c" font-size="11.5" text-anchor="end">L1 cache</text>
  <text x="288.6" y="172.0" fill="#e0645c" font-size="11">1 ns</text>
  <rect x="210.0" y="198.0" width="105.8" height="26.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" opacity="0.2" rx="4"/>
  <text x="200.0" y="216.0" fill="#4a90d9" font-size="11.5" text-anchor="end">L2 cache</text>
  <text x="323.8" y="216.0" fill="#4a90d9" font-size="11">4 ns</text>
  <rect x="210.0" y="242.0" width="181.9" height="26.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" opacity="0.2" rx="4"/>
  <text x="200.0" y="260.0" fill="#4a90d9" font-size="11.5" text-anchor="end">main memory</text>
  <text x="399.9" y="260.0" fill="#4a90d9" font-size="11">80 ns</text>
  <rect x="210.0" y="286.0" width="363.0" height="26.0" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.5" opacity="0.2" rx="4"/>
  <text x="200.0" y="304.0" fill="#8a8a8a" font-size="11.5" text-anchor="end">SSD</text>
  <text x="581.0" y="304.0" fill="#8a8a8a" font-size="11">100 us</text>
  <rect x="210.0" y="330.0" width="480.0" height="26.0" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.5" opacity="0.2" rx="4"/>
  <text x="200.0" y="348.0" fill="#8a8a8a" font-size="11.5" text-anchor="end">hard disk</text>
  <text x="698.0" y="348.0" fill="#8a8a8a" font-size="11">10 ms</text>
  <text x="450.0" y="92.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">bar length is logarithmic</text>
  <text x="70.0" y="382.0" fill="#8a8a8a" font-size="11.5">Human scale: if a register access were 1 second, a disk seek would be about a year.</text>
  <text x="70.0" y="362.0" fill="#8a8a8a" font-size="11.5">DMA exists so the CPU does not spend those cycles waiting - the device moves the data itself.</text>
</svg>
