<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- origin -->
  <circle cx="70" cy="300" r="4" fill="#8a8a8a"/>
  <text x="52" y="316" fill="#8a8a8a">O</text>

  <!-- x-axis -->
  <line x1="70" y1="300" x2="330" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="330,300 320,295 320,305" fill="#8a8a8a"/>
  <text x="336" y="305" fill="#8a8a8a">x</text>

  <!-- wedge: radial edges at 20 and 60 degrees, outer arc R=240 -->
  <line x1="70" y1="300" x2="295.5" y2="217.9" stroke="#4a90d9" stroke-width="2"/>
  <line x1="70" y1="300" x2="190" y2="92.2" stroke="#4a90d9" stroke-width="2"/>
  <path d="M 295.5 217.9 A 240 240 0 0 0 190 92.2" fill="none" stroke="#4a90d9" stroke-width="2"/>

  <!-- highlighted polar rectangle: r in [140,180], theta in [33,45] deg -->
  <path d="M 187.4 223.8 L 221.0 202.0 A 180 180 0 0 0 197.3 172.7 L 169.0 201.0 A 140 140 0 0 1 187.4 223.8 Z"
        fill="#e0645c" opacity="0.22" stroke="#e0645c" stroke-width="1.5"/>

  <!-- radius line O -> inner corner, dashed, labelled r -->
  <line x1="70" y1="300" x2="187.4" y2="223.8" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="120" y="253" fill="#8a8a8a" font-style="italic">r</text>

  <!-- angle theta arc near origin -->
  <path d="M 115 300 A 45 45 0 0 0 107.7 275.5" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <text x="98" y="290" fill="#8a8a8a" font-style="italic">&#952;</text>

  <!-- side labels on the polar rectangle -->
  <text x="228" y="212" fill="#e0645c">dr</text>
  <text x="212" y="182" fill="#e0645c">r&#8201;d&#952;</text>

  <!-- caption -->
  <text x="70" y="38" fill="#8a8a8a" font-style="italic">A polar &#8220;rectangle&#8221; has sides dr and r&#8201;d&#952; &#8212; so dA = r&#8201;dr&#8201;d&#952;, not dr&#8201;d&#952;.</text>
</svg>
