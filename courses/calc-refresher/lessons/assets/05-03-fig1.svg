<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Tile a region with tiny loops: each interior edge is walked twice, oppositely — it cancels. Only the boundary C survives.</text>

  <!-- filled region -->
  <rect x="120" y="50" width="270" height="270" fill="#4a90d9" opacity="0.06"/>

  <!-- interior grid lines (the shared edges) -->
  <line x1="210" y1="50" x2="210" y2="320" stroke="#8a8a8a" stroke-width="1" opacity="0.5"/>
  <line x1="300" y1="50" x2="300" y2="320" stroke="#8a8a8a" stroke-width="1" opacity="0.5"/>
  <line x1="120" y1="140" x2="390" y2="140" stroke="#8a8a8a" stroke-width="1" opacity="0.5"/>
  <line x1="120" y1="230" x2="390" y2="230" stroke="#8a8a8a" stroke-width="1" opacity="0.5"/>

  <!-- 3x3 grid of counterclockwise loop arrows -->
  <!-- row 1 -->
  <circle cx="165" cy="95" r="28" fill="#4a90d9" opacity="0.10" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="157,67 165,63 165,71" fill="#4a90d9"/>
  <circle cx="255" cy="95" r="28" fill="#4a90d9" opacity="0.10" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="247,67 255,63 255,71" fill="#4a90d9"/>
  <circle cx="345" cy="95" r="28" fill="#4a90d9" opacity="0.10" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="337,67 345,63 345,71" fill="#4a90d9"/>
  <!-- row 2 -->
  <circle cx="165" cy="185" r="28" fill="#4a90d9" opacity="0.10" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="157,157 165,153 165,161" fill="#4a90d9"/>
  <circle cx="255" cy="185" r="28" fill="#4a90d9" opacity="0.10" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="247,157 255,153 255,161" fill="#4a90d9"/>
  <circle cx="345" cy="185" r="28" fill="#4a90d9" opacity="0.10" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="337,157 345,153 345,161" fill="#4a90d9"/>
  <!-- row 3 -->
  <circle cx="165" cy="275" r="28" fill="#4a90d9" opacity="0.10" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="157,247 165,243 165,251" fill="#4a90d9"/>
  <circle cx="255" cy="275" r="28" fill="#4a90d9" opacity="0.10" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="247,247 255,243 255,251" fill="#4a90d9"/>
  <circle cx="345" cy="275" r="28" fill="#4a90d9" opacity="0.10" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="337,247 345,243 345,251" fill="#4a90d9"/>

  <!-- highlight one shared interior edge: opposing arrows cancel -->
  <line x1="204" y1="80" x2="204" y2="110" stroke="#e0645c" stroke-width="2"/>
  <polygon points="204,114 200,106 208,106" fill="#e0645c"/>
  <line x1="216" y1="110" x2="216" y2="80" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="216,76 212,84 220,84" fill="#4a90d9"/>

  <!-- outer boundary survives: bold red loop with CCW arrowhead -->
  <rect x="120" y="50" width="270" height="270" fill="none" stroke="#e0645c" stroke-width="3.5"/>
  <polygon points="245,50 253,46 253,54" fill="#e0645c"/>

  <!-- annotations on the right -->
  <line x1="405" y1="95" x2="220" y2="95" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="410" y="90" fill="#8a8a8a">shared edge, walked</text>
  <text x="410" y="108" fill="#8a8a8a">up by one loop and</text>
  <text x="410" y="126" fill="#8a8a8a">down by its neighbor</text>
  <text x="410" y="144" fill="#8a8a8a">→ cancels</text>

  <text x="410" y="250" fill="#e0645c">boundary C</text>
  <text x="410" y="268" fill="#e0645c">is all that</text>
  <text x="410" y="286" fill="#e0645c">is left</text>
  <line x1="405" y1="262" x2="390" y2="240" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>

  <text x="150" y="345" fill="#4a90d9" font-style="italic">sum of tiny interior circulations</text>
</svg>
