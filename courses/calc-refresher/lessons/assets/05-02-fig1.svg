<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="field" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#4a90d9"/>
    </marker>
    <marker id="fbig" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <polygon points="0 0, 7.5 3.2, 0 6.4" fill="#4a90d9"/>
    </marker>
    <marker id="drhead" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <polygon points="0 0, 7.5 3.2, 0 6.4" fill="#e0645c"/>
    </marker>
    <marker id="chead" markerWidth="11" markerHeight="11" refX="7.5" refY="3.6" orient="auto">
      <polygon points="0 0, 8 3.6, 0 7.2" fill="#e0645c"/>
    </marker>
  </defs>

  <!-- background vector field F: gentle up-and-right flow -->
  <g stroke="#4a90d9" stroke-width="1.6" opacity="0.55" marker-end="url(#field)">
    <line x1="70"  y1="80"  x2="94"  y2="66"/>
    <line x1="150" y1="80"  x2="174" y2="66"/>
    <line x1="310" y1="80"  x2="334" y2="66"/>
    <line x1="390" y1="80"  x2="414" y2="66"/>
    <line x1="470" y1="80"  x2="494" y2="66"/>
    <line x1="70"  y1="160" x2="94"  y2="146"/>
    <line x1="150" y1="160" x2="174" y2="146"/>
    <line x1="390" y1="160" x2="414" y2="146"/>
    <line x1="470" y1="160" x2="494" y2="146"/>
    <line x1="70"  y1="240" x2="94"  y2="226"/>
    <line x1="150" y1="240" x2="174" y2="226"/>
    <line x1="230" y1="240" x2="254" y2="226"/>
    <line x1="390" y1="240" x2="414" y2="226"/>
    <line x1="470" y1="240" x2="494" y2="226"/>
    <line x1="70"  y1="310" x2="94"  y2="296"/>
    <line x1="150" y1="310" x2="174" y2="296"/>
    <line x1="310" y1="310" x2="334" y2="296"/>
    <line x1="470" y1="310" x2="494" y2="296"/>
  </g>

  <!-- the curve C, traversed A -> B -->
  <path d="M 90 290 C 200 250, 300 130, 460 96"
        fill="none" stroke="#e0645c" stroke-width="3" marker-end="url(#chead)"/>

  <!-- endpoints -->
  <circle cx="90" cy="290" r="5" fill="#e0645c"/>
  <text x="70" y="308" fill="#e0645c">A (start)</text>
  <text x="452" y="118" fill="#e0645c">B (end)</text>

  <!-- point P on the curve -->
  <circle cx="257" cy="190" r="4" fill="#8a8a8a"/>
  <text x="238" y="212" fill="#8a8a8a" font-style="italic">P</text>

  <!-- the field vector F at P (blue, bold) -->
  <line x1="257" y1="190" x2="314" y2="171" stroke="#4a90d9" stroke-width="3" marker-end="url(#fbig)"/>
  <text x="320" y="170" fill="#4a90d9">F</text>

  <!-- the tangent step dr along C (red, bold) -->
  <line x1="257" y1="190" x2="303" y2="160" stroke="#e0645c" stroke-width="3" marker-end="url(#drhead)"/>
  <text x="286" y="146" fill="#e0645c">d&#119955;</text>

  <!-- angle marker between F and dr -->
  <path d="M 289 172 A 34 34 0 0 0 292 178" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="300" y="186" fill="#8a8a8a" font-style="italic">&#952;</text>

  <!-- caption -->
  <text x="30" y="336" fill="#8a8a8a" font-style="italic">Each step along C contributes F&#183;d&#119955; = |F||d&#119955;|cos&#952; — the field's push in the direction you actually move.</text>
</svg>
