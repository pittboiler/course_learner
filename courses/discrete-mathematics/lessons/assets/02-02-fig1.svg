<svg viewBox="0 0 420 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Light card background -->
  <rect x="0" y="0" width="420" height="240" fill="#faf9f6"/>

  <!-- Title -->
  <text x="210" y="26" font-family="Georgia, serif" font-size="15" fill="#333333" text-anchor="middle" font-style="italic">A = {1,…,9} partitioned by  a ∼ b ⇔ 3 | (a−b)</text>

  <!-- Block [a]: remainder 0 -->
  <rect x="16" y="48" width="118" height="150" rx="10" fill="#3a6ea5" fill-opacity="0.13" stroke="#333333" stroke-width="1.6"/>
  <text x="75" y="72" font-family="Georgia, serif" font-size="18" fill="#333333" text-anchor="middle" font-style="italic">[a]</text>
  <circle cx="50" cy="108" r="14" fill="#3a6ea5" fill-opacity="0.30" stroke="#333333" stroke-width="1.4"/>
  <text x="50" y="113" font-family="Georgia, serif" font-size="14" fill="#333333" text-anchor="middle">3</text>
  <circle cx="100" cy="130" r="14" fill="#3a6ea5" fill-opacity="0.30" stroke="#333333" stroke-width="1.4"/>
  <text x="100" y="135" font-family="Georgia, serif" font-size="14" fill="#333333" text-anchor="middle">6</text>
  <circle cx="60" cy="166" r="14" fill="#3a6ea5" fill-opacity="0.30" stroke="#333333" stroke-width="1.4"/>
  <text x="60" y="171" font-family="Georgia, serif" font-size="14" fill="#333333" text-anchor="middle">9</text>

  <!-- Block [b]: remainder 1 -->
  <rect x="151" y="48" width="118" height="150" rx="10" fill="#a5533a" fill-opacity="0.13" stroke="#333333" stroke-width="1.6"/>
  <text x="210" y="72" font-family="Georgia, serif" font-size="18" fill="#333333" text-anchor="middle" font-style="italic">[b]</text>
  <circle cx="185" cy="108" r="14" fill="#a5533a" fill-opacity="0.30" stroke="#333333" stroke-width="1.4"/>
  <text x="185" y="113" font-family="Georgia, serif" font-size="14" fill="#333333" text-anchor="middle">1</text>
  <circle cx="235" cy="130" r="14" fill="#a5533a" fill-opacity="0.30" stroke="#333333" stroke-width="1.4"/>
  <text x="235" y="135" font-family="Georgia, serif" font-size="14" fill="#333333" text-anchor="middle">4</text>
  <circle cx="195" cy="166" r="14" fill="#a5533a" fill-opacity="0.30" stroke="#333333" stroke-width="1.4"/>
  <text x="195" y="171" font-family="Georgia, serif" font-size="14" fill="#333333" text-anchor="middle">7</text>

  <!-- Block [c]: remainder 2 -->
  <rect x="286" y="48" width="118" height="150" rx="10" fill="#4a7c59" fill-opacity="0.15" stroke="#333333" stroke-width="1.6"/>
  <text x="345" y="72" font-family="Georgia, serif" font-size="18" fill="#333333" text-anchor="middle" font-style="italic">[c]</text>
  <circle cx="320" cy="108" r="14" fill="#4a7c59" fill-opacity="0.32" stroke="#333333" stroke-width="1.4"/>
  <text x="320" y="113" font-family="Georgia, serif" font-size="14" fill="#333333" text-anchor="middle">2</text>
  <circle cx="370" cy="130" r="14" fill="#4a7c59" fill-opacity="0.32" stroke="#333333" stroke-width="1.4"/>
  <text x="370" y="135" font-family="Georgia, serif" font-size="14" fill="#333333" text-anchor="middle">5</text>
  <circle cx="330" cy="166" r="14" fill="#4a7c59" fill-opacity="0.32" stroke="#333333" stroke-width="1.4"/>
  <text x="330" y="171" font-family="Georgia, serif" font-size="14" fill="#333333" text-anchor="middle">8</text>

  <!-- Caption -->
  <text x="210" y="224" font-family="Georgia, serif" font-size="11.5" fill="#333333" text-anchor="middle" font-style="italic">Three disjoint blocks; every element lands in exactly one.</text>
</svg>
