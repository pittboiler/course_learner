<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#faf9f6"/>

  <!-- Edges: outer hexagon A-B-C-D-E-F-A + inner triangle A-C-E -->
  <g stroke="#333333" stroke-width="2.4" stroke-linecap="round">
    <!-- outer cycle -->
    <line x1="200" y1="45"  x2="300" y2="100"/>
    <line x1="300" y1="100" x2="300" y2="205"/>
    <line x1="300" y1="205" x2="200" y2="258"/>
    <line x1="200" y1="258" x2="100" y2="205"/>
    <line x1="100" y1="205" x2="100" y2="100"/>
    <line x1="100" y1="100" x2="200" y2="45"/>
    <!-- inner triangle -->
    <line x1="200" y1="45"  x2="300" y2="205"/>
    <line x1="300" y1="205" x2="100" y2="205"/>
    <line x1="100" y1="205" x2="200" y2="45"/>
  </g>

  <!-- Vertices -->
  <g fill="#d1495b" stroke="#333333" stroke-width="2">
    <circle cx="200" cy="45"  r="12"/>
    <circle cx="300" cy="100" r="12"/>
    <circle cx="300" cy="205" r="12"/>
    <circle cx="200" cy="258" r="12"/>
    <circle cx="100" cy="205" r="12"/>
    <circle cx="100" cy="100" r="12"/>
  </g>

  <!-- Vertex labels -->
  <g fill="#faf9f6" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="200" y="50">A</text>
    <text x="300" y="105">B</text>
    <text x="300" y="210">C</text>
    <text x="200" y="263">D</text>
    <text x="100" y="210">E</text>
    <text x="100" y="105">F</text>
  </g>

  <!-- Degree labels (deg v) -->
  <g fill="#333333" font-size="13" font-style="italic" text-anchor="middle">
    <text x="200" y="24">deg 4</text>
    <text x="336" y="96">deg 2</text>
    <text x="336" y="222">deg 4</text>
    <text x="200" y="285">deg 2</text>
    <text x="64"  y="222">deg 4</text>
    <text x="64"  y="96">deg 2</text>
  </g>
</svg>
