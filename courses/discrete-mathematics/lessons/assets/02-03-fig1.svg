<svg viewBox="0 0 460 260" xmlns="http://www.w3.org/2000/svg">
  <!-- Light card background -->
  <rect x="0" y="0" width="460" height="260" rx="8" fill="#faf9f6"/>

  <!-- ============ Panel 1: INJECTIVE, not surjective ============ -->
  <text x="75" y="26" font-family="Georgia, serif" font-size="12.5" fill="#3a6ea5" text-anchor="middle" font-weight="bold">injective</text>
  <text x="75" y="42" font-family="Georgia, serif" font-size="10.5" fill="#333333" text-anchor="middle" font-style="italic">not onto</text>

  <!-- Domain X (left ellipse) -->
  <ellipse cx="35" cy="145" rx="20" ry="65" fill="#3a6ea520" stroke="#333333" stroke-width="1.3"/>
  <!-- Codomain Y (right ellipse) -->
  <ellipse cx="115" cy="145" rx="20" ry="65" fill="#33333308" stroke="#333333" stroke-width="1.3"/>
  <text x="35" y="235" font-family="Georgia, serif" font-size="12" fill="#333333" text-anchor="middle" font-style="italic">X</text>
  <text x="115" y="235" font-family="Georgia, serif" font-size="12" fill="#333333" text-anchor="middle" font-style="italic">Y</text>

  <!-- domain dots -->
  <circle cx="35" cy="105" r="4" fill="#333333"/>
  <circle cx="35" cy="145" r="4" fill="#333333"/>
  <circle cx="35" cy="185" r="4" fill="#333333"/>
  <!-- codomain dots -->
  <circle cx="115" cy="95"  r="4" fill="#333333"/>
  <circle cx="115" cy="130" r="4" fill="#333333"/>
  <circle cx="115" cy="165" r="4" fill="#333333"/>
  <circle cx="115" cy="200" r="4" fill="#c05a2e"/>
  <!-- unhit target highlighted in orange -->

  <!-- arrows: distinct targets, one target unhit -->
  <line x1="41" y1="105" x2="109" y2="95"  stroke="#3a6ea5" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="41" y1="145" x2="109" y2="130" stroke="#3a6ea5" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="41" y1="185" x2="109" y2="165" stroke="#3a6ea5" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="115" y="222" font-family="Georgia, serif" font-size="9" fill="#c05a2e" text-anchor="middle" font-style="italic">unhit</text>

  <!-- ============ Panel 2: SURJECTIVE, not injective ============ -->
  <text x="230" y="26" font-family="Georgia, serif" font-size="12.5" fill="#7a3ea5" text-anchor="middle" font-weight="bold">surjective</text>
  <text x="230" y="42" font-family="Georgia, serif" font-size="10.5" fill="#333333" text-anchor="middle" font-style="italic">not one-to-one</text>

  <ellipse cx="190" cy="145" rx="20" ry="65" fill="#7a3ea520" stroke="#333333" stroke-width="1.3"/>
  <ellipse cx="270" cy="145" rx="20" ry="65" fill="#33333308" stroke="#333333" stroke-width="1.3"/>
  <text x="190" y="235" font-family="Georgia, serif" font-size="12" fill="#333333" text-anchor="middle" font-style="italic">X</text>
  <text x="270" y="235" font-family="Georgia, serif" font-size="12" fill="#333333" text-anchor="middle" font-style="italic">Y</text>

  <circle cx="190" cy="95"  r="4" fill="#333333"/>
  <circle cx="190" cy="130" r="4" fill="#333333"/>
  <circle cx="190" cy="165" r="4" fill="#333333"/>
  <circle cx="190" cy="200" r="4" fill="#333333"/>
  <circle cx="270" cy="115" r="4" fill="#333333"/>
  <circle cx="270" cy="175" r="4" fill="#333333"/>

  <!-- two arrows collide on top target -->
  <line x1="196" y1="95"  x2="264" y2="112" stroke="#7a3ea5" stroke-width="1.6" marker-end="url(#ah2)"/>
  <line x1="196" y1="130" x2="264" y2="117" stroke="#7a3ea5" stroke-width="1.6" marker-end="url(#ah2)"/>
  <line x1="196" y1="165" x2="264" y2="173" stroke="#7a3ea5" stroke-width="1.6" marker-end="url(#ah2)"/>
  <line x1="196" y1="200" x2="264" y2="178" stroke="#7a3ea5" stroke-width="1.6" marker-end="url(#ah2)"/>
  <text x="290" y="118" font-family="Georgia, serif" font-size="9" fill="#c05a2e" text-anchor="middle" font-style="italic">2→1</text>

  <!-- ============ Panel 3: BIJECTION ============ -->
  <text x="390" y="26" font-family="Georgia, serif" font-size="12.5" fill="#2e8b57" text-anchor="middle" font-weight="bold">bijection</text>
  <text x="390" y="42" font-family="Georgia, serif" font-size="10.5" fill="#333333" text-anchor="middle" font-style="italic">perfect pairing</text>

  <ellipse cx="350" cy="145" rx="20" ry="65" fill="#2e8b5720" stroke="#333333" stroke-width="1.3"/>
  <ellipse cx="430" cy="145" rx="20" ry="65" fill="#2e8b5710" stroke="#333333" stroke-width="1.3"/>
  <text x="350" y="235" font-family="Georgia, serif" font-size="12" fill="#333333" text-anchor="middle" font-style="italic">X</text>
  <text x="430" y="235" font-family="Georgia, serif" font-size="12" fill="#333333" text-anchor="middle" font-style="italic">Y</text>

  <circle cx="350" cy="105" r="4" fill="#333333"/>
  <circle cx="350" cy="145" r="4" fill="#333333"/>
  <circle cx="350" cy="185" r="4" fill="#333333"/>
  <circle cx="430" cy="105" r="4" fill="#333333"/>
  <circle cx="430" cy="145" r="4" fill="#333333"/>
  <circle cx="430" cy="185" r="4" fill="#333333"/>

  <line x1="356" y1="105" x2="424" y2="105" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#ah3)"/>
  <line x1="356" y1="145" x2="424" y2="145" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#ah3)"/>
  <line x1="356" y1="185" x2="424" y2="185" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#ah3)"/>

  <!-- arrowhead markers, one per accent color -->
  <defs>
    <marker id="ah" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3a6ea5"/>
    </marker>
    <marker id="ah2" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a3ea5"/>
    </marker>
    <marker id="ah3" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2e8b57"/>
    </marker>
  </defs>
</svg>
