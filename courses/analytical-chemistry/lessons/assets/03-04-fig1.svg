<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Standard addition: fit signal vs. added analyte, extrapolate to signal = 0; the x-intercept is &#8722;c&#8339;.</text>

  <!-- ===== axes ===== -->
  <!-- horizontal axis: added concentration (signal = 0 line) -->
  <line x1="120" y1="250" x2="525" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="525,250 515,245 515,255" fill="#8a8a8a"/>
  <text x="470" y="272" fill="#8a8a8a">c added</text>
  <!-- vertical axis: signal at c_added = 0 -->
  <line x1="250" y1="258" x2="250" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="250,55 245,65 255,65" fill="#8a8a8a"/>
  <text x="200" y="60" fill="#8a8a8a">signal</text>
  <text x="230" y="268" fill="#8a8a8a">0</text>

  <!-- ===== blue: fitted line through the spiked data ===== -->
  <line x1="250" y1="202" x2="505" y2="74.5" stroke="#4a90d9" stroke-width="3"/>

  <!-- data points (c = 0,2,4,6,8) -->
  <circle cx="250" cy="202" r="4.5" fill="#4a90d9"/>
  <circle cx="310" cy="172" r="4.5" fill="#4a90d9"/>
  <circle cx="370" cy="142" r="4.5" fill="#4a90d9"/>
  <circle cx="430" cy="112" r="4.5" fill="#4a90d9"/>
  <circle cx="490" cy="82"  r="4.5" fill="#4a90d9"/>

  <!-- label the intercept (unspiked reading) -->
  <line x1="250" y1="202" x2="238" y2="202" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="150" y="200" fill="#8a8a8a">S&#8321; (no spike)</text>

  <!-- ===== coral: backward extrapolation to the x-intercept ===== -->
  <line x1="250" y1="202" x2="154" y2="250" stroke="#e0645c" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="154" cy="250" r="4.5" fill="#e0645c"/>
  <!-- drop marker + label at x-intercept -->
  <line x1="154" y1="250" x2="154" y2="270" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="128" y="288" fill="#e0645c">&#8722;c&#8339;</text>
</svg>
