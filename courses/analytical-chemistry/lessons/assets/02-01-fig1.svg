<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">A titration curve is pH recomputed at every drop of base; the endpoint is where it leaps. Weak acid + strong base &#8594; four regions.</text>

  <!-- ===== axes ===== -->
  <line x1="70" y1="320" x2="578" y2="320" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="578,320 568,315 568,325" fill="#8a8a8a"/>
  <line x1="70" y1="320" x2="70" y2="34" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,34 65,44 75,44" fill="#8a8a8a"/>

  <!-- y ticks: pH 0, 7, 14 -->
  <text x="52" y="325" fill="#8a8a8a">0</text>
  <line x1="66" y1="180" x2="70" y2="180" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="52" y="185" fill="#8a8a8a">7</text>
  <text x="48" y="45" fill="#8a8a8a">14</text>
  <text x="40" y="150" fill="#8a8a8a" transform="rotate(-90 40 150)">pH</text>

  <!-- neutral reference line at pH 7 -->
  <line x1="70" y1="180" x2="575" y2="180" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 5"/>

  <!-- x-axis label -->
  <text x="300" y="348" fill="#8a8a8a">volume of NaOH added &#8594;</text>

  <!-- ===== indicator transition band (phenolphthalein, pH 8&#8211;10) ===== -->
  <rect x="70" y="120" width="505" height="40" fill="#e0645c" opacity="0.12"/>
  <text x="452" y="115" fill="#e0645c" font-size="12">indicator band (pH 8&#8211;10)</text>

  <!-- ===== titration curve (weak acid, K_a 1.8e-5, vs strong base) ===== -->
  <path d="M 70 262.6 L 94.5 244.2 L 119 237.2 L 192.5 225.2 L 266 213.2 L 290.5 206 L 310.1 191.4 L 312.6 185.2 L 315 145.6 L 317.5 106 L 319.9 100 L 339.5 86.4 L 364 80.8 L 413 75.6 L 511 70.8 L 560 69.6"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- half-equivalence marker: pH = pKa -->
  <line x1="192.5" y1="225.2" x2="70" y2="225.2" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="192.5" y1="225.2" x2="192.5" y2="320" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="192.5" cy="225.2" r="4" fill="#e0645c"/>
  <text x="80" y="220" fill="#e0645c" font-size="12">pK<tspan baseline-shift="sub" font-size="9">a</tspan></text>
  <text x="150" y="335" fill="#e0645c" font-size="12">&#189; V<tspan baseline-shift="sub" font-size="9">e</tspan></text>

  <!-- equivalence marker -->
  <line x1="315" y1="145.6" x2="315" y2="320" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="315" cy="145.6" r="4.5" fill="#e0645c"/>
  <text x="300" y="335" fill="#e0645c" font-size="12">V<tspan baseline-shift="sub" font-size="9">e</tspan></text>

  <!-- ===== region labels ===== -->
  <text x="78" y="278" fill="#8a8a8a" font-size="12">&#9312; weak acid</text>
  <text x="112" y="298" fill="#8a8a8a" font-size="12">&#9313; buffer region</text>
  <text x="330" y="140" fill="#e0645c" font-size="12">&#9314; equivalence, pH &#8776; 8.7</text>
  <text x="450" y="65" fill="#8a8a8a" font-size="12">&#9315; excess base</text>
</svg>
