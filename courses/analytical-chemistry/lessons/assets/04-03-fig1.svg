<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Reversed-phase HPLC: polar mobile phase, C18 stationary phase — nonpolar analyte lingers; a gradient ramp elutes it.</text>

  <!-- ================= left: reversed-phase column cartoon ================= -->
  <!-- column tube -->
  <rect x="55" y="55" width="70" height="320" rx="6" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="60" y="48" fill="#8a8a8a">column (packed C18 silica)</text>

  <!-- C18 particle beds (grey) -->
  <circle cx="75"  cy="95"  r="7" fill="#8a8a8a" opacity="0.30" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="95"  cy="110" r="7" fill="#8a8a8a" opacity="0.30" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="110" cy="95"  r="7" fill="#8a8a8a" opacity="0.30" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="78"  cy="150" r="7" fill="#8a8a8a" opacity="0.30" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="100" cy="165" r="7" fill="#8a8a8a" opacity="0.30" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="115" cy="150" r="7" fill="#8a8a8a" opacity="0.30" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="72"  cy="210" r="7" fill="#8a8a8a" opacity="0.30" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="94"  cy="225" r="7" fill="#8a8a8a" opacity="0.30" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="112" cy="210" r="7" fill="#8a8a8a" opacity="0.30" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="80"  cy="270" r="7" fill="#8a8a8a" opacity="0.30" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="102" cy="285" r="7" fill="#8a8a8a" opacity="0.30" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="115" cy="270" r="7" fill="#8a8a8a" opacity="0.30" stroke="#8a8a8a" stroke-width="1"/>
  <text x="130" y="205" fill="#8a8a8a">small particles</text>
  <text x="130" y="222" fill="#8a8a8a">= many plates</text>

  <!-- polar mobile phase flowing down (blue arrow) -->
  <line x1="90" y1="55" x2="90" y2="42" stroke="#4a90d9" stroke-width="2"/>
  <text x="98" y="40" fill="#4a90d9">polar mobile phase (water / MeOH)</text>
  <line x1="90" y1="375" x2="90" y2="393" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="90,393 85,383 95,383" fill="#4a90d9"/>
  <text x="60" y="408" fill="#4a90d9">to detector</text>

  <!-- polar analyte (moves fast, near bottom) -->
  <circle cx="90" cy="330" r="8" fill="#4a90d9" opacity="0.85"/>
  <text x="130" y="334" fill="#4a90d9">polar analyte — elutes early</text>

  <!-- nonpolar analyte (retained, sticks to C18, up high) -->
  <circle cx="90" cy="130" r="8" fill="#e0645c"/>
  <text x="130" y="120" fill="#e0645c">nonpolar analyte —</text>
  <text x="130" y="136" fill="#e0645c">sticks to C18, elutes late</text>

  <!-- ================= right top: gradient ramp ================= -->
  <text x="360" y="48" fill="#8a8a8a">gradient elution: % organic ramps up</text>
  <!-- axes -->
  <line x1="380" y1="150" x2="620" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="380" y1="150" x2="380" y2="60"  stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="345" y="70" fill="#8a8a8a">%org</text>
  <text x="600" y="168" fill="#8a8a8a">time</text>
  <!-- ramp (coral) -->
  <path d="M 380 138 L 420 138 L 560 78 L 620 78" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <text x="392" y="132" fill="#e0645c">weak</text>
  <text x="560" y="72" fill="#e0645c">strong</text>

  <!-- ================= right bottom: chromatogram ================= -->
  <text x="360" y="210" fill="#8a8a8a">resulting chromatogram</text>
  <!-- axes -->
  <line x1="380" y1="360" x2="620" y2="360" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="380" y1="360" x2="380" y2="235" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="345" y="245" fill="#8a8a8a">signal</text>
  <text x="590" y="378" fill="#8a8a8a">time</text>
  <!-- polar peak (early, blue) -->
  <path d="M 400 360 Q 420 360 430 300 Q 440 360 460 360" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="408" y="292" fill="#4a90d9">polar</text>
  <!-- nonpolar peak (late, coral) -->
  <path d="M 540 360 Q 560 360 570 270 Q 580 360 600 360" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <text x="546" y="262" fill="#e0645c">nonpolar</text>
</svg>
