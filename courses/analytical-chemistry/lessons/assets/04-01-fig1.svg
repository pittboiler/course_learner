<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Helvetica, Arial, sans-serif">
  <text x="20" y="22" font-size="13" font-style="italic" fill="#8a8a8a">A chromatogram: two Gaussian peaks with dead time, retention times, widths &amp; resolution — plus the van Deemter H&#8211;u curve (inset).</text>

  <!-- ===== main chromatogram ===== -->
  <!-- axes -->
  <line x1="80" y1="300" x2="512" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="80" y1="300" x2="80" y2="66" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="250" y="335" font-size="13" fill="#8a8a8a">time  &#8594;  (inject at t = 0)</text>
  <text x="30" y="180" font-size="13" fill="#8a8a8a" transform="rotate(-90 30 180)">detector signal</text>

  <!-- dead-time (unretained) peak at tM -->
  <polyline fill="none" stroke="#4a90d9" stroke-width="2"
    points="132,300 138,299 143,296 147,288 150,268 153,288 157,296 162,299 168,300"/>
  <line x1="150" y1="300" x2="150" y2="266" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="139" y="258" font-size="12" fill="#8a8a8a">t&#8341;</text>

  <!-- peak 1 -->
  <polyline fill="none" stroke="#4a90d9" stroke-width="2.2"
    points="212,299.9 224,299.6 236,297.8 245,293.4 254,283.1 263,263.5 272,233.3 281,196.7 290,164.7 299,150.2 302,150.6 308,159.6 317,188.7 326,225.4 335,257.7 344,279.7 353,291.8 362,297.2 371,299.2 386,299.9"/>
  <!-- peak 2 -->
  <polyline fill="none" stroke="#4a90d9" stroke-width="2.2"
    points="304,299.9 316,299.6 328,297.7 340,291.0 349,278.6 358,255.7 367,220.3 376,175.7 385,131.4 394,101.3 400,95.0 406,101.3 415,131.4 424,175.7 433,220.3 442,255.7 451,278.6 460,291.0 472,297.7 484,299.6 496,299.9"/>

  <!-- apex verticals -->
  <line x1="300" y1="300" x2="300" y2="150" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="400" y1="300" x2="400" y2="95" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="286" y="145" font-size="12" fill="#8a8a8a">t&#8341;&#8321;</text>
  <text x="387" y="90" font-size="12" fill="#8a8a8a">t&#8341;&#8322;</text>

  <!-- baseline width markers (w = 4&#963;, tangent lines to baseline) -->
  <line x1="256" y1="291" x2="344" y2="291" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="256" y1="287" x2="256" y2="295" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="344" y1="287" x2="344" y2="295" stroke="#8a8a8a" stroke-width="1"/>
  <text x="290" y="285" font-size="11" fill="#8a8a8a">w&#8321;</text>

  <line x1="352" y1="286" x2="448" y2="286" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="352" y1="282" x2="352" y2="290" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="448" y1="282" x2="448" y2="290" stroke="#8a8a8a" stroke-width="1"/>
  <text x="396" y="280" font-size="11" fill="#8a8a8a">w&#8322;</text>

  <!-- resolution: separation of apexes -->
  <line x1="300" y1="118" x2="400" y2="118" stroke="#e0645c" stroke-width="1.8"/>
  <polygon points="300,118 308,114 308,122" fill="#e0645c"/>
  <polygon points="400,118 392,114 392,122" fill="#e0645c"/>
  <text x="308" y="112" font-size="12" fill="#e0645c">&#916;t&#8341; = t&#8341;&#8322; &#8722; t&#8341;&#8321;   (resolution R&#8347;)</text>

  <!-- ===== van Deemter inset ===== -->
  <text x="556" y="44" font-size="12" fill="#8a8a8a">van Deemter:  H = A + B/u + Cu</text>
  <line x1="540" y1="172" x2="694" y2="172" stroke="#8a8a8a" stroke-width="1.3"/>
  <line x1="540" y1="172" x2="540" y2="50" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="600" y="192" font-size="12" fill="#8a8a8a">u  (flow rate) &#8594;</text>
  <text x="524" y="115" font-size="12" fill="#8a8a8a" transform="rotate(-90 524 115)">H</text>

  <!-- A term (constant) -->
  <line x1="540" y1="160.4" x2="694" y2="160.4" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="648" y="157" font-size="10" fill="#8a8a8a">A (eddy)</text>
  <!-- B/u term -->
  <polyline fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4,3"
    points="540,65.5 548,102.4 556,120.0 564,130.3 572,137.1 580,142.0 588,145.5 596,148.3 604,150.5 612,152.3 620,153.8 628,155.1 636,156.1 644,157.1 652,157.9 660,158.6 668,159.3 676,159.8 684,160.3 689,160.7"/>
  <text x="548" y="80" font-size="10" fill="#8a8a8a">B/u (diffusion)</text>
  <!-- Cu term -->
  <polyline fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4,3"
    points="540,163.7 556,156.8 572,149.9 588,143.0 604,136.1 620,129.2 636,122.3 652,115.4 668,108.5 684,101.6 689,99.3"/>
  <text x="622" y="112" font-size="10" fill="#8a8a8a">Cu (mass transf.)</text>
  <!-- total H curve -->
  <polyline fill="none" stroke="#4a90d9" stroke-width="2.2"
    points="540,49.5 545,75.1 550,89.0 556,97.2 561,102.3 566,105.5 572,107.4 577,108.5 582,108.9 585,109.0 588,108.9 593,108.5 598,107.9 604,107.0 611,105.3 619,103.4 627,101.2 635,98.8 643,96.3 651,93.7 659,91.0 667,88.1 675,85.3 683,82.3 689,80.3"/>
  <!-- minimum -->
  <line x1="585" y1="172" x2="585" y2="109" stroke="#e0645c" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="585" cy="109" r="3.5" fill="#e0645c"/>
  <text x="560" y="128" font-size="10" fill="#e0645c">H&#8344;&#8342;&#8345;  @ u&#8338;&#8345;&#8348;</text>
</svg>
