<svg viewBox="0 0 760 285" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Accuracy is where the average lands; precision is how tightly the shots cluster. Bias moves the cluster; scatter widens it.</text>

  <!-- ================= Board 1: accurate + precise ================= -->
  <circle cx="95" cy="130" r="58" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="95" cy="130" r="40" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="95" cy="130" r="22" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="95" cy="130" r="7"  fill="#4a90d9"/>
  <!-- tight cluster on the bullseye -->
  <circle cx="93"  cy="125" r="4" fill="#e0645c"/>
  <circle cx="100" cy="128" r="4" fill="#e0645c"/>
  <circle cx="95"  cy="134" r="4" fill="#e0645c"/>
  <circle cx="89"  cy="130" r="4" fill="#e0645c"/>
  <circle cx="98"  cy="122" r="4" fill="#e0645c"/>
  <text x="95" y="212" fill="#8a8a8a" text-anchor="middle">Accurate + precise</text>
  <text x="95" y="232" fill="#8a8a8a" font-size="12" text-anchor="middle">on target, tight</text>

  <!-- ================= Board 2: precise, not accurate ================= -->
  <circle cx="285" cy="130" r="58" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="285" cy="130" r="40" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="285" cy="130" r="22" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="285" cy="130" r="7"  fill="#4a90d9"/>
  <!-- tight cluster, shifted off-center (bias) -->
  <circle cx="253" cy="103" r="4" fill="#e0645c"/>
  <circle cx="260" cy="106" r="4" fill="#e0645c"/>
  <circle cx="255" cy="112" r="4" fill="#e0645c"/>
  <circle cx="262" cy="110" r="4" fill="#e0645c"/>
  <circle cx="257" cy="98"  r="4" fill="#e0645c"/>
  <text x="285" y="212" fill="#8a8a8a" text-anchor="middle">Precise, not accurate</text>
  <text x="285" y="232" fill="#8a8a8a" font-size="12" text-anchor="middle">tight, but biased (systematic)</text>

  <!-- ================= Board 3: accurate, not precise ================= -->
  <circle cx="475" cy="130" r="58" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="475" cy="130" r="40" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="475" cy="130" r="22" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="475" cy="130" r="7"  fill="#4a90d9"/>
  <!-- wide scatter, but centered on average -->
  <circle cx="452" cy="112" r="4" fill="#e0645c"/>
  <circle cx="500" cy="118" r="4" fill="#e0645c"/>
  <circle cx="478" cy="158" r="4" fill="#e0645c"/>
  <circle cx="458" cy="146" r="4" fill="#e0645c"/>
  <circle cx="497" cy="150" r="4" fill="#e0645c"/>
  <circle cx="472" cy="102" r="4" fill="#e0645c"/>
  <text x="475" y="212" fill="#8a8a8a" text-anchor="middle">Accurate, not precise</text>
  <text x="475" y="232" fill="#8a8a8a" font-size="12" text-anchor="middle">centered, scattered (random)</text>

  <!-- ================= Board 4: neither ================= -->
  <circle cx="665" cy="130" r="58" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="665" cy="130" r="40" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="665" cy="130" r="22" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="665" cy="130" r="7"  fill="#4a90d9"/>
  <!-- wide scatter, shifted off-center -->
  <circle cx="648" cy="152" r="4" fill="#e0645c"/>
  <circle cx="690" cy="142" r="4" fill="#e0645c"/>
  <circle cx="672" cy="170" r="4" fill="#e0645c"/>
  <circle cx="700" cy="160" r="4" fill="#e0645c"/>
  <circle cx="682" cy="132" r="4" fill="#e0645c"/>
  <circle cx="655" cy="138" r="4" fill="#e0645c"/>
  <text x="665" y="212" fill="#8a8a8a" text-anchor="middle">Neither</text>
  <text x="665" y="232" fill="#8a8a8a" font-size="12" text-anchor="middle">biased + scattered</text>
</svg>
