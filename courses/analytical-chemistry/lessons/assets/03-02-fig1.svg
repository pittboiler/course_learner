<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="24" fill="#8a8a8a" font-style="italic">One pair of atomic levels, three tricks: absorb the line (AAS), emit it (AES), or absorb-then-re-emit at 90&#176; (fluorescence).</text>

  <!-- ===== left: energy-level diagram ===== -->
  <!-- excited level -->
  <line x1="30" y1="100" x2="250" y2="100" stroke="#8a8a8a" stroke-width="2"/>
  <text x="30" y="90" fill="#8a8a8a">E&#8321;  excited state</text>
  <!-- ground level -->
  <line x1="30" y1="300" x2="250" y2="300" stroke="#8a8a8a" stroke-width="2"/>
  <text x="30" y="320" fill="#8a8a8a">E&#8320;  ground state</text>

  <!-- AAS: absorption up (blue) -->
  <line x1="70" y1="300" x2="70" y2="108" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="70,100 65,113 75,113" fill="#4a90d9"/>
  <text x="52" y="345" fill="#4a90d9">absorb</text>
  <text x="52" y="360" fill="#4a90d9">(AAS)</text>

  <!-- AES: emission down (coral) -->
  <line x1="130" y1="100" x2="130" y2="292" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="130,300 125,287 135,287" fill="#e0645c"/>
  <text x="112" y="345" fill="#e0645c">emit</text>
  <text x="112" y="360" fill="#e0645c">(AES)</text>

  <!-- Fluorescence: absorb up (blue) then re-emit down (coral) -->
  <line x1="195" y1="300" x2="195" y2="108" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="195,100 190,113 200,113" fill="#4a90d9"/>
  <line x1="220" y1="100" x2="220" y2="292" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="220,300 215,287 225,287" fill="#e0645c"/>
  <text x="182" y="345" fill="#8a8a8a">fluoresce</text>

  <!-- ===== right: instrument schematic ===== -->
  <text x="430" y="70" fill="#8a8a8a">atomizer breaks sample into free gas-phase atoms</text>

  <!-- source lamp -->
  <rect x="300" y="150" width="52" height="40" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="312" y="175" fill="#4a90d9">lamp</text>

  <!-- incident beam -->
  <line x1="352" y1="170" x2="438" y2="170" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="446,170 433,165 433,175" fill="#4a90d9"/>

  <!-- atomizer flame -->
  <path d="M 470 118 C 448 150 456 195 470 195 C 484 195 492 150 470 118 Z" fill="#e0645c" opacity="0.22" stroke="#e0645c" stroke-width="2"/>
  <text x="440" y="215" fill="#8a8a8a">atomizer</text>

  <!-- transmitted beam -->
  <line x1="494" y1="170" x2="556" y2="170" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="564,170 551,165 551,175" fill="#4a90d9"/>

  <!-- in-line detector -->
  <rect x="566" y="150" width="60" height="40" fill="#8a8a8a" opacity="0.15" stroke="#8a8a8a" stroke-width="2"/>
  <text x="576" y="167" fill="#8a8a8a">detector</text>
  <text x="580" y="183" fill="#8a8a8a">A / I</text>

  <!-- 90-degree fluorescence beam and detector -->
  <line x1="470" y1="150" x2="470" y2="292" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="470,300 465,287 475,287" fill="#e0645c"/>
  <rect x="436" y="302" width="72" height="38" fill="#e0645c" opacity="0.15" stroke="#e0645c" stroke-width="2"/>
  <text x="446" y="320" fill="#e0645c">90&#176; det.</text>
  <text x="447" y="335" fill="#e0645c">(fluor.)</text>
</svg>
