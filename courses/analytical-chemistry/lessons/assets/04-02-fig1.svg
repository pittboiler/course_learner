<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="20" fill="#8a8a8a" font-style="italic" font-size="12.5">An inert carrier gas sweeps a flash-vaporized sample through a heated capillary column to the detector; the oven temperature is ramped to spread a wide-boiling mixture.</text>

  <!-- ===== top row: instrument flow schematic (centerline y = 105) ===== -->

  <!-- carrier gas cylinder -->
  <rect x="30" y="75" width="34" height="64" rx="8" fill="#8a8a8a" opacity="0.18" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="42" y="66" width="10" height="12" fill="#8a8a8a" opacity="0.4"/>
  <text x="24" y="158" fill="#8a8a8a" font-size="12">carrier gas</text>
  <text x="20" y="172" fill="#8a8a8a" font-size="11">He / H&#8322; / N&#8322;</text>

  <!-- flow: cylinder -> injector (blue) -->
  <line x1="64" y1="105" x2="98" y2="105" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="100,105 91,101 91,109" fill="#4a90d9"/>

  <!-- injector -->
  <rect x="100" y="85" width="46" height="40" fill="#8a8a8a" opacity="0.15" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="98" y="140" fill="#8a8a8a" font-size="12">injector</text>
  <!-- sample injection arrow (blue) -->
  <line x1="123" y1="58" x2="123" y2="83" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="123,85 119,76 127,76" fill="#4a90d9"/>
  <text x="130" y="66" fill="#4a90d9" font-size="12">sample</text>

  <!-- flow: injector -> oven -->
  <line x1="146" y1="105" x2="178" y2="105" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- oven -->
  <rect x="180" y="62" width="150" height="88" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="222" y="78" fill="#8a8a8a" font-size="12">oven (heated)</text>
  <!-- capillary column: coil (blue) -->
  <path d="M 182 108 Q 197 130 212 108 Q 227 86 242 108 Q 257 130 272 108 Q 287 86 302 108 Q 317 130 328 108"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="205" y="145" fill="#8a8a8a" font-size="11">capillary column</text>

  <!-- flow: oven -> detector -->
  <line x1="330" y1="105" x2="362" y2="105" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="364,105 355,101 355,109" fill="#4a90d9"/>

  <!-- detector -->
  <rect x="364" y="85" width="58" height="40" fill="#8a8a8a" opacity="0.15" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="372" y="102" fill="#8a8a8a" font-size="12">detector</text>
  <text x="370" y="117" fill="#8a8a8a" font-size="11">FID / TCD</text>

  <!-- detector -> signal (coral) -->
  <line x1="422" y1="105" x2="470" y2="105" stroke="#e0645c" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="472,105 463,101 463,109" fill="#e0645c"/>
  <text x="478" y="102" fill="#e0645c" font-size="12">signal</text>

  <!-- ===== bottom-left: temperature program ramp inset ===== -->
  <line x1="75" y1="315" x2="75" y2="205" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="75,205 70,215 80,215" fill="#8a8a8a"/>
  <line x1="75" y1="315" x2="250" y2="315" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="250,315 240,310 240,320" fill="#8a8a8a"/>
  <text x="58" y="212" fill="#8a8a8a" font-size="12">T</text>
  <text x="215" y="330" fill="#8a8a8a" font-size="12">time</text>
  <!-- ramp: hold low, ramp up, hold high (coral) -->
  <path d="M 75 300 L 108 300 L 205 228 L 245 228" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <text x="88" y="345" fill="#8a8a8a" font-style="italic" font-size="11">temperature program</text>

  <!-- ===== bottom-right: chromatogram output ===== -->
  <line x1="345" y1="315" x2="345" y2="205" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="345,205 340,215 350,215" fill="#8a8a8a"/>
  <line x1="345" y1="315" x2="608" y2="315" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="608,315 598,310 598,320" fill="#8a8a8a"/>
  <text x="332" y="212" fill="#8a8a8a" font-size="12">signal</text>
  <text x="548" y="330" fill="#8a8a8a" font-size="12">time (t</text>
  <text x="586" y="333" fill="#8a8a8a" font-size="9">R</text>
  <text x="592" y="330" fill="#8a8a8a" font-size="12">)</text>
  <!-- peaks (coral): apex = baseline(315) - height -->
  <path d="M 355 315 L 372 315 Q 382 205 392 315 L 430 315 Q 442 175 454 315 L 506 315 Q 522 225 538 315 L 600 315"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <text x="400" y="345" fill="#8a8a8a" font-style="italic" font-size="11">chromatogram</text>
</svg>
