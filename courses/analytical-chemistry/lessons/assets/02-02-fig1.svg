<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Titrate a metal with EDTA: pM = &#8722;log[M] climbs, then jumps at the 1:1 equivalence point.</text>
  <text x="40" y="40" fill="#8a8a8a" font-style="italic">Raising the buffer pH lifts K&#8242;&#8320; and sharpens the break (inset).</text>

  <!-- ===== main axes ===== -->
  <!-- y axis (pM) -->
  <line x1="70" y1="260" x2="70" y2="66" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,66 65,76 75,76" fill="#8a8a8a"/>
  <text x="44" y="72" fill="#8a8a8a">pM</text>
  <!-- x axis (volume) -->
  <line x1="70" y1="260" x2="410" y2="260" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="410,260 400,255 400,265" fill="#8a8a8a"/>
  <text x="300" y="282" fill="#8a8a8a">volume of EDTA added</text>
  <text x="52" y="264" fill="#8a8a8a">0</text>

  <!-- pM gridline labels -->
  <text x="48" y="220" fill="#8a8a8a" font-size="11">2</text>
  <text x="48" y="148" fill="#8a8a8a" font-size="11">6</text>
  <text x="44" y="76" fill="#8a8a8a" font-size="11">10</text>

  <!-- equivalence volume marker -->
  <line x1="235" y1="260" x2="235" y2="70" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="205" y="276" fill="#8a8a8a" font-size="11">V(equiv)</text>

  <!-- the pM titration curve -->
  <path d="M 70 214 L 110 208.6 L 150 201.4 L 190 192.4 L 220 178 L 232 156.4 L 235 136.6 L 238 116.8 L 250 100.6 L 290 91.6 L 340 86.2 L 400 82.6"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- equivalence point highlight -->
  <circle cx="235" cy="136.6" r="5" fill="#e0645c"/>
  <text x="246" y="132" fill="#e0645c">equivalence point</text>
  <text x="246" y="148" fill="#e0645c" font-size="11">(indicator changes color)</text>

  <!-- ===== inset: pH / K'_f effect ===== -->
  <rect x="430" y="70" width="172" height="150" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <text x="438" y="86" fill="#8a8a8a" font-size="11" font-style="italic">effect of buffer pH</text>

  <!-- inset axes -->
  <line x1="446" y1="200" x2="446" y2="96" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="446" y1="200" x2="592" y2="200" stroke="#8a8a8a" stroke-width="1"/>
  <text x="426" y="150" fill="#8a8a8a" font-size="10" transform="rotate(-90 426 150)">pM</text>
  <text x="500" y="214" fill="#8a8a8a" font-size="10">volume</text>

  <!-- shared equivalence volume -->
  <line x1="518" y1="200" x2="518" y2="98" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="2 3"/>

  <!-- low-pH curve (shallow break, blue) -->
  <path d="M 448 185 L 470 180 L 495 173 L 512 165 L 518 158 L 528 151 L 550 146 L 588 143"
        fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="548" y="176" fill="#4a90d9" font-size="10">low pH</text>

  <!-- high-pH curve (sharp break, coral) -->
  <path d="M 448 190 L 480 186 L 510 181 L 516 165 L 519 128 L 522 108 L 540 103 L 588 101"
        fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="540" y="118" fill="#e0645c" font-size="10">high pH</text>
</svg>
