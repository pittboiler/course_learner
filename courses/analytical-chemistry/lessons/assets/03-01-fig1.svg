<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="60" y="24" fill="#8a8a8a" font-style="italic">Beer's law: A is linear in c through the origin — until high concentration bends the line down.</text>

  <!-- axes -->
  <line x1="70" y1="270" x2="575" y2="270" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="575,270 565,265 565,275" fill="#8a8a8a"/>
  <text x="500" y="292" fill="#8a8a8a">c  (concentration)</text>
  <line x1="70" y1="270" x2="70" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,55 65,65 75,65" fill="#8a8a8a"/>
  <text x="82" y="60" fill="#8a8a8a">A  (absorbance)</text>
  <text x="58" y="285" fill="#8a8a8a">0</text>

  <!-- ideal linear extrapolation (dashed blue) -->
  <line x1="70" y1="270" x2="540" y2="80" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.7"/>
  <text x="470" y="70" fill="#4a90d9" opacity="0.8" font-style="italic" font-size="12">ideal A = &#949;bc</text>

  <!-- solid linear fit through the standards -->
  <line x1="70" y1="270" x2="370" y2="148.7" stroke="#4a90d9" stroke-width="3"/>

  <!-- calibration standards (blue points on the line) -->
  <circle cx="130" cy="245.7" r="4.5" fill="#4a90d9"/>
  <circle cx="190" cy="221.5" r="4.5" fill="#4a90d9"/>
  <circle cx="250" cy="197.2" r="4.5" fill="#4a90d9"/>
  <circle cx="310" cy="173.0" r="4.5" fill="#4a90d9"/>
  <circle cx="370" cy="148.7" r="4.5" fill="#4a90d9"/>

  <!-- negative-deviation region (coral curve + points) -->
  <path d="M 370 148.7 Q 430 130 490 127 T 540 124" fill="none" stroke="#e0645c" stroke-width="3"/>
  <circle cx="430" cy="135.5" r="4.5" fill="#e0645c"/>
  <circle cx="490" cy="127.5" r="4.5" fill="#e0645c"/>
  <circle cx="540" cy="124.0" r="4.5" fill="#e0645c"/>
  <text x="405" y="105" fill="#e0645c" font-size="12">negative deviation</text>
  <text x="415" y="121" fill="#e0645c" font-size="12">(flattening)</text>

  <!-- linear range bracket -->
  <line x1="70" y1="300" x2="370" y2="300" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="296" x2="70" y2="304" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="370" y1="296" x2="370" y2="304" stroke="#8a8a8a" stroke-width="1"/>
  <text x="150" y="318" fill="#8a8a8a" font-size="12">linear dynamic range</text>

  <!-- unknown mapped through the fit line -->
  <line x1="70" y1="210" x2="218.4" y2="210" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line x1="218.4" y1="210" x2="218.4" y2="270" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle cx="218.4" cy="210" r="4" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="44" y="214" fill="#e0645c">A</text>
  <text x="52" y="221" fill="#e0645c" font-size="10">x</text>
  <text x="210" y="285" fill="#e0645c">c</text>
  <text x="218" y="292" fill="#e0645c" font-size="10">x</text>
</svg>
