<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
<text x="14" y="22" font-size="14" text-anchor="start" fill="#111111" font-weight="bold">Draper-style update, invented numbers: odds of theism T to indifference HI</text>
<rect x="250" y="48" width="225" height="36" rx="0" fill="#dbe8f5" stroke="#1a6fb5" stroke-width="1.5"/>
<rect x="475" y="48" width="225" height="36" rx="0" fill="#f6dde1" stroke="#d1495b" stroke-width="1.5"/>
<text x="14" y="64" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Prior 1:1</text>
<text x="14" y="80" font-size="12" text-anchor="start" fill="#333333">Draper's parity premise</text>
<text x="256" y="71" font-size="12" text-anchor="start" fill="#1a6fb5">T 50%</text>
<text x="694" y="71" font-size="12" text-anchor="end" fill="#d1495b">HI 50%</text>
<line x1="475" y1="90" x2="475" y2="116" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="485" y="108" font-size="12" text-anchor="start" fill="#333333">times 1/5 (the data O)</text>
<rect x="250" y="122" width="75" height="36" rx="0" fill="#dbe8f5" stroke="#1a6fb5" stroke-width="1.5"/>
<rect x="325" y="122" width="375" height="36" rx="0" fill="#f6dde1" stroke="#d1495b" stroke-width="1.5"/>
<text x="14" y="138" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Posterior 1:5</text>
<text x="14" y="154" font-size="12" text-anchor="start" fill="#333333">same prior, after O</text>
<text x="256" y="145" font-size="12" text-anchor="start" fill="#1a6fb5">T 17%</text>
<text x="694" y="145" font-size="12" text-anchor="end" fill="#d1495b">HI 83%</text>
<rect x="250" y="210" width="400" height="36" rx="0" fill="#dbe8f5" stroke="#1a6fb5" stroke-width="1.5"/>
<rect x="650" y="210" width="50" height="36" rx="0" fill="#f6dde1" stroke="#d1495b" stroke-width="1.5"/>
<text x="14" y="226" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Prior 8:1</text>
<text x="14" y="242" font-size="12" text-anchor="start" fill="#333333">after other evidence</text>
<text x="256" y="233" font-size="12" text-anchor="start" fill="#1a6fb5">T 89%</text>
<text x="694" y="233" font-size="12" text-anchor="end" fill="#d1495b">HI 11%</text>
<line x1="475" y1="252" x2="475" y2="278" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="485" y="270" font-size="12" text-anchor="start" fill="#333333">times 1/5 (the same O)</text>
<rect x="250" y="284" width="276.92" height="36" rx="0" fill="#dbe8f5" stroke="#1a6fb5" stroke-width="1.5"/>
<rect x="526.92" y="284" width="173.08" height="36" rx="0" fill="#f6dde1" stroke="#d1495b" stroke-width="1.5"/>
<text x="14" y="300" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Posterior 8:5</text>
<text x="14" y="316" font-size="12" text-anchor="start" fill="#333333">after other evidence and O</text>
<text x="256" y="307" font-size="12" text-anchor="start" fill="#1a6fb5">T 62%</text>
<text x="694" y="307" font-size="12" text-anchor="end" fill="#d1495b">HI 38%</text>
</svg>
