<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">An amphidromic system: the tide rotates about a node where the range is zero.</text>

  <circle cx="330" cy="175" r="50" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <circle cx="330" cy="175" r="100" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <circle cx="330" cy="175" r="150" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="5 4"/>

  <line x1="330" y1="175" x2="330.0" y2="25.0" stroke="#4a90d9" stroke-width="1.8"/><text x="322" y="14" fill="#4a90d9">0</text>
  <line x1="330" y1="175" x2="405.0" y2="45.1" stroke="#4a90d9" stroke-width="1.8"/><text x="410" y="34" fill="#4a90d9">1</text>
  <line x1="330" y1="175" x2="459.9" y2="100.0" stroke="#4a90d9" stroke-width="1.8"/><text x="472" y="95" fill="#4a90d9">2</text>
  <line x1="330" y1="175" x2="480.0" y2="175.0" stroke="#4a90d9" stroke-width="1.8"/><text x="490" y="179" fill="#4a90d9">3</text>
  <line x1="330" y1="175" x2="459.9" y2="250.0" stroke="#4a90d9" stroke-width="1.8"/><text x="472" y="263" fill="#4a90d9">4</text>
  <line x1="330" y1="175" x2="405.0" y2="304.9" stroke="#4a90d9" stroke-width="1.8"/><text x="410" y="322" fill="#4a90d9">5</text>
  <line x1="330" y1="175" x2="330.0" y2="325.0" stroke="#4a90d9" stroke-width="1.8"/><text x="322" y="344" fill="#4a90d9">6</text>
  <line x1="330" y1="175" x2="255.0" y2="304.9" stroke="#4a90d9" stroke-width="1.8"/><text x="242" y="322" fill="#4a90d9">7</text>
  <line x1="330" y1="175" x2="200.1" y2="250.0" stroke="#4a90d9" stroke-width="1.8"/><text x="180" y="263" fill="#4a90d9">8</text>
  <line x1="330" y1="175" x2="180.0" y2="175.0" stroke="#4a90d9" stroke-width="1.8"/><text x="158" y="179" fill="#4a90d9">9</text>
  <line x1="330" y1="175" x2="200.1" y2="100.0" stroke="#4a90d9" stroke-width="1.8"/><text x="178" y="95" fill="#4a90d9">10</text>
  <line x1="330" y1="175" x2="255.0" y2="45.1" stroke="#4a90d9" stroke-width="1.8"/><text x="240" y="34" fill="#4a90d9">11</text>

  <circle cx="330" cy="175" r="6" fill="#e0645c"/>
  <text x="342" y="168" fill="#e0645c">amphidromic point:</text>
  <text x="342" y="156" fill="#e0645c">range zero, all hours meet</text>

  <path d="M 400,110 A 90,90 0 0,0 340,90" fill="none" stroke="#e0645c" stroke-width="2.2"/>
  <polygon points="330,88 348,82 346,96" fill="#e0645c"/>
  <text x="386" y="130" fill="#e0645c">high water rotates</text>
  <text x="386" y="142" fill="#e0645c">anticlockwise in the</text>
  <text x="386" y="154" fill="#e0645c">northern hemisphere</text>

  <text x="520" y="230" fill="#8a8a8a">co-range lines:</text>
  <text x="520" y="243" fill="#8a8a8a">range grows outward</text>
  <text x="520" y="256" fill="#8a8a8a">0 m, 1 m, 2 m, 3 m</text>

  <text x="60" y="300" fill="#8a8a8a">blue lines are co-tidal:</text>
  <text x="60" y="313" fill="#8a8a8a">hours of high water,</text>
  <text x="60" y="326" fill="#8a8a8a">one full cycle in 12.42 h</text>

  <text x="60" y="80" fill="#8a8a8a">the tide is not a bulge</text>
  <text x="60" y="93" fill="#8a8a8a">following the moon &#8212;</text>
  <text x="60" y="106" fill="#8a8a8a">it is a wave going</text>
  <text x="60" y="119" fill="#8a8a8a">round a basin</text>
</svg>
