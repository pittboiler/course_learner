  <line x1="300" y1="250" x2="630" y2="250" stroke="#8a8a8a" stroke-width="2"/>
  <text x="638" y="158" fill="#8a8a8a">eastern</text>
  <text x="638" y="170" fill="#8a8a8a">boundary:</text>
  <text x="638" y="182" fill="#8a8a8a">no flow</text>
  <text x="638" y="194" fill="#8a8a8a">through it</text>
  <text x="336" y="50" fill="#8a8a8a">45 N</text>
  <text x="336" y="266" fill="#8a8a8a">15 N</text>

  <line x1="380" y1="215" x2="380" y2="238" stroke="#4a90d9" stroke-width="2"/>
