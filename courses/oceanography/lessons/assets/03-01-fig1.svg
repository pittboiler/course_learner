  <line x1="500" y1="164" x2="500" y2="238" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="500,246 495,234 505,234" fill="#4a90d9"/>
  <line x1="560" y1="180" x2="560" y2="238" stroke="#4a90d9" stroke-width="2"/>
