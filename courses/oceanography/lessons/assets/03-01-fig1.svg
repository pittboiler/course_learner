  <line x1="600" y1="215" x2="600" y2="238" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="600,246 595,234 605,234" fill="#4a90d9"/>

  <text x="380" y="140" fill="#4a90d9">Sverdrup interior:</text>
  <text x="380" y="128" fill="#4a90d9">10.3 m&#178; s&#8315;&#185; equatorward,</text>
  <text x="380" y="116" fill="#4a90d9">totalling 52 Sv</text>

  <line x1="308" y1="240" x2="308" y2="72" stroke="#e0645c" stroke-width="4"/>
  <polygon points="308,62 302,76 314,76" fill="#e0645c"/>
  <text x="304" y="98" fill="#e0645c">52 Sv</text>
  <text x="304" y="86" fill="#e0645c">must</text>
  <text x="304" y="74" fill="#e0645c">return</text>
  <text x="330" y="222" fill="#e0645c">but why here, and how narrow? Lesson 3.2.</text>
