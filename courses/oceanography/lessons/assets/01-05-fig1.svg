<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Mid-latitude seasonal cycle. Summer heat is trapped in a thin layer; winter cooling erases it.</text>

  <line x1="130" y1="55" x2="130" y2="255" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="130" y1="55" x2="640" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="330" y="40" fill="#8a8a8a">temperature (degrees C)</text>
  <text x="24" y="150" fill="#8a8a8a">depth (m)</text>

  <line x1="211.7" y1="49" x2="211.7" y2="55" stroke="#8a8a8a"/><text x="203" y="42" fill="#8a8a8a">12</text>
  <line x1="293.3" y1="49" x2="293.3" y2="55" stroke="#8a8a8a"/><text x="285" y="42" fill="#8a8a8a">14</text>
  <line x1="375" y1="49" x2="375" y2="55" stroke="#8a8a8a"/><text x="367" y="42" fill="#8a8a8a">16</text>
  <line x1="456.7" y1="49" x2="456.7" y2="55" stroke="#8a8a8a"/><text x="448" y="42" fill="#8a8a8a">18</text>
  <line x1="538.3" y1="49" x2="538.3" y2="55" stroke="#8a8a8a"/><text x="530" y="42" fill="#8a8a8a">20</text>
  <line x1="620" y1="49" x2="620" y2="55" stroke="#8a8a8a"/><text x="612" y="42" fill="#8a8a8a">22</text>

  <line x1="124" y1="55" x2="130" y2="55" stroke="#8a8a8a"/><text x="113" y="59" fill="#8a8a8a">0</text>
  <line x1="124" y1="103.8" x2="130" y2="103.8" stroke="#8a8a8a"/><text x="102" y="108" fill="#8a8a8a">50</text>
  <line x1="124" y1="152.5" x2="130" y2="152.5" stroke="#8a8a8a"/><text x="94" y="156" fill="#8a8a8a">100</text>
  <line x1="124" y1="201.2" x2="130" y2="201.2" stroke="#8a8a8a"/><text x="94" y="205" fill="#8a8a8a">150</text>
  <line x1="124" y1="250" x2="130" y2="250" stroke="#8a8a8a"/><text x="94" y="254" fill="#8a8a8a">200</text>

  <path d="M 252.5,55.0 L 252.5,201.2 L 236.2,220.8 L 203.5,250.0" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="182" y="70" fill="#4a90d9">February</text>

  <path d="M 301.5,55.0 L 301.5,94.0 L 260.7,113.5 L 252.5,201.2 L 236.2,220.8 L 203.5,250.0" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="306" y="68" fill="#8a8a8a">May</text>

  <path d="M 579.2,55.0 L 579.2,74.5 L 436.2,98.9 L 313.8,123.2 L 260.7,152.5 L 252.5,201.2 L 236.2,220.8 L 203.5,250.0" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <text x="546" y="70" fill="#e0645c">August</text>

  <path d="M 415.8,55.0 L 415.8,133.0 L 313.8,152.5 L 260.7,181.8 L 252.5,201.2 L 236.2,220.8 L 203.5,250.0" fill="none" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="420" y="70" fill="#8a8a8a">November</text>

  <line x1="571" y1="74.5" x2="588" y2="74.5" stroke="#e0645c" stroke-width="1.2"/>
  <text x="592" y="79" fill="#e0645c">20 m</text>
  <line x1="408" y1="133" x2="425" y2="133" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="429" y="137" fill="#8a8a8a">80 m</text>
  <line x1="245" y1="201.2" x2="262" y2="201.2" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="266" y="205" fill="#4a90d9">150 m: winter mixed layer reaches the permanent pycnocline</text>

  <text x="330" y="232" fill="#8a8a8a">all four profiles collapse onto the same curve below 150 m</text>
  <text x="330" y="246" fill="#8a8a8a">the season never reaches down here</text>
</svg>
