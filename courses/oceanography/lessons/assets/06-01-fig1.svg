<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">Outcropping isopycnals let deep water reach the surface without any mixing. Two cells share the window.</text>

  <line x1="100" y1="300" x2="650" y2="300" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="100" y1="56" x2="650" y2="56" stroke="#4a90d9" stroke-width="2"/>
  <text x="104" y="322" fill="#8a8a8a">65 S (Antarctica)</text>
  <text x="588" y="322" fill="#8a8a8a">40 S</text>
  <text x="48" y="60" fill="#8a8a8a">0</text>
  <text x="34" y="182" fill="#8a8a8a">2000</text>
  <text x="34" y="304" fill="#8a8a8a">4000 m</text>

  <path d="M 150,56 L 260,124 L 400,176 L 540,200 L 650,208" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M 210,56 L 330,152 L 470,222 L 600,250 L 650,254" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M 122,56 L 176,96 L 300,142 L 450,168 L 650,178" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="440" y="150" fill="#8a8a8a">outcropping isopycnals: the ocean&#8217;s window</text>

  <line x1="230" y1="34" x2="470" y2="34" stroke="#8a8a8a" stroke-width="3"/>
  <polygon points="482,34 466,28 466,40" fill="#8a8a8a"/>
  <text x="490" y="38" fill="#8a8a8a">westerlies</text>

  <path d="M 600,196 L 460,166 L 320,124 L 220,80 L 200,66 L 340,66 L 480,68 L 560,90 L 590,130" fill="none" stroke="#e0645c" stroke-width="2.6"/>
  <polygon points="594,142 583,127 596,124" fill="#e0645c"/>
  <text x="322" y="106" fill="#e0645c">UPPER CELL: deep water rises,</text>
  <text x="322" y="94" fill="#e0645c">flows north in the Ekman layer,</text>
  <text x="322" y="82" fill="#e0645c">subducts as AAIW and mode water</text>

  <path d="M 620,262 L 470,246 L 320,224 L 200,180 L 150,120 L 130,70 L 122,150 L 150,240 L 260,278 L 420,288 L 620,292" fill="none" stroke="#4a90d9" stroke-width="2.6"/>
  <polygon points="632,292 616,286 616,298" fill="#4a90d9"/>
  <text x="240" y="264" fill="#4a90d9">LOWER CELL: deep water rises, moves south,</text>
  <text x="240" y="252" fill="#4a90d9">is densified by brine rejection, sinks as AABW</text>

  <line x1="300" y1="46" x2="380" y2="46" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="392,46 376,40 376,52" fill="#4a90d9"/>
  <text x="398" y="50" fill="#4a90d9">Ekman, 28 Sv north</text>

  <line x1="420" y1="196" x2="330" y2="196" stroke="#e0645c" stroke-width="2.5" stroke-dasharray="7 4"/>
  <polygon points="318,196 334,190 334,202" fill="#e0645c"/>
  <text x="426" y="200" fill="#e0645c">eddies, 24 Sv south</text>
  <text x="426" y="214" fill="#e0645c">residual: only 4 Sv</text>
</svg>
