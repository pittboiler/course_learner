<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">The abyssal profile is exponential with a 1 km scale height. Where the mixing happens is the problem.</text>

  <line x1="120" y1="250" x2="340" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="120" y1="250" x2="120" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="176" y="284" fill="#8a8a8a">&#952; (C)</text>
  <text x="32" y="150" fill="#8a8a8a">depth (m)</text>

  <line x1="132.4" y1="250" x2="132.4" y2="256" stroke="#8a8a8a"/><text x="128" y="270" fill="#8a8a8a">1</text>
  <line x1="194.1" y1="250" x2="194.1" y2="256" stroke="#8a8a8a"/><text x="190" y="270" fill="#8a8a8a">2</text>
  <line x1="255.9" y1="250" x2="255.9" y2="256" stroke="#8a8a8a"/><text x="252" y="270" fill="#8a8a8a">3</text>
  <line x1="317.6" y1="250" x2="317.6" y2="256" stroke="#8a8a8a"/><text x="313" y="270" fill="#8a8a8a">4</text>

  <line x1="114" y1="60" x2="120" y2="60" stroke="#8a8a8a"/><text x="72" y="64" fill="#8a8a8a">1000</text>
  <line x1="114" y1="123.3" x2="120" y2="123.3" stroke="#8a8a8a"/><text x="72" y="127" fill="#8a8a8a">2000</text>
  <line x1="114" y1="186.7" x2="120" y2="186.7" stroke="#8a8a8a"/><text x="72" y="190" fill="#8a8a8a">3000</text>
  <line x1="114" y1="250" x2="120" y2="250" stroke="#8a8a8a"/><text x="72" y="254" fill="#8a8a8a">4000</text>

  <path d="M 317.3,60.0 L 298.5,66.3 L 281.5,72.7 L 266.1,79.0 L 252.2,85.3 L 239.6,91.7 L 228.3,98.0 L 218.0,104.3 L 208.6,110.7 L 200.2,117.0 L 192.6,123.3 L 185.7,129.7 L 179.4,136.0 L 173.8,142.3 L 168.6,148.7 L 164.0,155.0 L 159.8,161.3 L 156.0,167.7 L 152.6,174.0 L 149.5,180.3 L 146.7,186.7 L 144.2,193.0 L 141.9,199.3 L 139.8,205.7 L 137.9,212.0 L 136.2,218.3 L 134.7,224.7 L 133.3,231.0 L 132.0,237.3 L 130.9,243.7 L 129.8,250.0"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="146.7" y1="186.7" x2="146.7" y2="123.3" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="140" y1="123.3" x2="154" y2="123.3" stroke="#e0645c" stroke-width="1.2"/>
  <line x1="140" y1="186.7" x2="154" y2="186.7" stroke="#e0645c" stroke-width="1.2"/>
  <text x="160" y="160" fill="#e0645c">h = kappa / w = 1 km</text>

  <line x1="400" y1="250" x2="660" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M 400,250 L 430,244 L 450,250 L 470,240 L 490,250 L 500,246 L 520,250 L 540,206 L 555,180 L 570,206 L 585,250 L 610,244 L 630,250 L 660,246"
        fill="none" stroke="#8a8a8a" stroke-width="2.5"/>
  <line x1="400" y1="70" x2="660" y2="70" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="404" y="64" fill="#8a8a8a">2000 m</text>

  <text x="404" y="120" fill="#4a90d9">smooth abyssal plain:</text>
  <text x="404" y="132" fill="#4a90d9">kappa about 1e-5 m&#178; s&#8315;&#185;</text>

  <path d="M 548,190 Q 536,160 550,132 Q 564,104 552,80" fill="none" stroke="#e0645c" stroke-width="2"/>
  <path d="M 566,196 Q 578,166 564,138 Q 550,110 562,86" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="574" y="146" fill="#e0645c">internal waves</text>
  <text x="574" y="158" fill="#e0645c">generated over</text>
  <text x="574" y="170" fill="#e0645c">rough topography,</text>
  <text x="574" y="182" fill="#e0645c">breaking above it:</text>
  <text x="574" y="194" fill="#e0645c">kappa up to 1e-3</text>

  <text x="404" y="226" fill="#8a8a8a">the area-weighted mean can be 1e-4</text>
  <text x="404" y="238" fill="#8a8a8a">while almost everywhere is 1e-5</text>
</svg>
