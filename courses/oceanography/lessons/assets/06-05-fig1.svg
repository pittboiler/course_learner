<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">What each system reaches, in depth and in time. The gaps are where the arguments are.</text>

  <line x1="140" y1="250" x2="645" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="140" y1="250" x2="140" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="330" y="284" fill="#8a8a8a">repeat interval</text>
  <text x="40" y="150" fill="#8a8a8a">depth</text>

  <line x1="151.9" y1="250" x2="151.9" y2="256" stroke="#8a8a8a"/><text x="138" y="270" fill="#8a8a8a">1 h</text>
  <line x1="284.2" y1="250" x2="284.2" y2="256" stroke="#8a8a8a"/><text x="270" y="270" fill="#8a8a8a">1 d</text>
  <line x1="380.4" y1="250" x2="380.4" y2="256" stroke="#8a8a8a"/><text x="364" y="270" fill="#8a8a8a">10 d</text>
  <line x1="530.6" y1="250" x2="530.6" y2="256" stroke="#8a8a8a"/><text x="514" y="270" fill="#8a8a8a">1 yr</text>
  <line x1="626.8" y1="250" x2="626.8" y2="256" stroke="#8a8a8a"/><text x="610" y="270" fill="#8a8a8a">10 yr</text>

  <line x1="134" y1="60" x2="140" y2="60" stroke="#8a8a8a"/><text x="112" y="64" fill="#8a8a8a">0</text>
  <line x1="134" y1="123.3" x2="140" y2="123.3" stroke="#8a8a8a"/><text x="96" y="127" fill="#8a8a8a">2000</text>
  <line x1="134" y1="186.7" x2="140" y2="186.7" stroke="#8a8a8a"/><text x="96" y="190" fill="#8a8a8a">4000</text>
  <line x1="134" y1="250" x2="140" y2="250" stroke="#8a8a8a"/><text x="88" y="254" fill="#8a8a8a">6000 m</text>

  <rect x="151.9" y="60" width="132.4" height="158.3" fill="none" stroke="#e0645c" stroke-width="2.2"/>
  <text x="156" y="76" fill="#e0645c">moored arrays</text>
  <text x="156" y="88" fill="#e0645c">RAPID, OSNAP, TAO</text>
  <text x="156" y="204" fill="#e0645c">full depth, continuous,</text>
  <text x="156" y="216" fill="#e0645c">but only a few lines</text>

  <rect x="284.2" y="58" width="96.2" height="8" fill="none" stroke="#4a90d9" stroke-width="2.2"/>
  <text x="292" y="50" fill="#4a90d9">satellite altimetry: global, but the surface only</text>

  <rect x="365.5" y="60" width="30" height="63.3" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="400" y="96" fill="#4a90d9">Argo: global,</text>
  <text x="400" y="108" fill="#4a90d9">10-day, to 2000 m</text>

  <rect x="409.3" y="60" width="46" height="190" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="408" y="238" fill="#8a8a8a">Deep Argo</text>
  <text x="408" y="226" fill="#8a8a8a">(sparse)</text>

  <rect x="597.2" y="60" width="30" height="190" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="500" y="160" fill="#4a90d9">repeat hydrography:</text>
  <text x="500" y="172" fill="#4a90d9">full depth, full chemistry,</text>
  <text x="500" y="184" fill="#4a90d9">once a decade, along lines</text>

  <text x="196" y="128" fill="#8a8a8a">THE GAP</text>
  <text x="196" y="140" fill="#8a8a8a">deep ocean, globally,</text>
  <text x="196" y="152" fill="#8a8a8a">at monthly resolution:</text>
  <text x="196" y="164" fill="#8a8a8a">nothing covers it</text>
</svg>
