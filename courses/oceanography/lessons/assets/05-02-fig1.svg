<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Swell arriving from a storm 5000 km away. The slope gives the distance; the intercept gives the time.</text>

  <line x1="120" y1="255" x2="640" y2="255" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="120" y1="255" x2="120" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="330" y="288" fill="#8a8a8a">hours after the storm</text>
  <text x="34" y="146" fill="#8a8a8a">frequency</text>
  <text x="34" y="159" fill="#8a8a8a">(Hz)</text>

  <line x1="242.4" y1="255" x2="242.4" y2="261" stroke="#8a8a8a"/><text x="234" y="274" fill="#8a8a8a">48</text>
  <line x1="364.8" y1="255" x2="364.8" y2="261" stroke="#8a8a8a"/><text x="356" y="274" fill="#8a8a8a">96</text>
  <line x1="487.2" y1="255" x2="487.2" y2="261" stroke="#8a8a8a"/><text x="476" y="274" fill="#8a8a8a">144</text>
  <line x1="609.6" y1="255" x2="609.6" y2="261" stroke="#8a8a8a"/><text x="598" y="274" fill="#8a8a8a">192</text>

  <line x1="114" y1="190" x2="120" y2="190" stroke="#8a8a8a"/><text x="72" y="194" fill="#8a8a8a">0.04</text>
  <line x1="114" y1="157.5" x2="120" y2="157.5" stroke="#8a8a8a"/><text x="72" y="161" fill="#8a8a8a">0.06</text>
  <line x1="114" y1="125" x2="120" y2="125" stroke="#8a8a8a"/><text x="72" y="129" fill="#8a8a8a">0.08</text>
  <line x1="114" y1="92.5" x2="120" y2="92.5" stroke="#8a8a8a"/><text x="72" y="96" fill="#8a8a8a">0.10</text>

  <line x1="120" y1="255" x2="301.5" y2="190" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="301.5" y1="190" x2="573.7" y2="92.5" stroke="#4a90d9" stroke-width="3"/>

  <circle cx="422.6" cy="146.6" r="4.5" fill="#e0645c"/>
  <line x1="422.6" y1="146.6" x2="472" y2="172" stroke="#e0645c" stroke-width="1"/>
  <text x="404" y="188" fill="#e0645c">15 s swell: arrives at 119 h</text>

  <circle cx="497.9" cy="119.6" r="3.5" fill="#8a8a8a"/>
  <text x="502" y="112" fill="#8a8a8a">12 s at 148 h</text>
  <circle cx="346.8" cy="173.8" r="3.5" fill="#8a8a8a"/>
  <text x="286" y="212" fill="#8a8a8a">18 s at 99 h</text>

  <circle cx="120" cy="255" r="4.5" fill="#4a90d9"/>
  <text x="128" y="248" fill="#4a90d9">extrapolate to zero frequency:</text>
  <text x="128" y="236" fill="#4a90d9">the moment the storm blew</text>

  <text x="440" y="70" fill="#8a8a8a">slope = g / (4 pi D)</text>
  <text x="440" y="84" fill="#8a8a8a">so a longer record</text>
  <text x="440" y="98" fill="#8a8a8a">locates the storm</text>
</svg>
