<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Sea surface and isopycnals tilt opposite ways, so the pressure gradient dies with depth.</text>

  <line x1="110" y1="270" x2="640" y2="270" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="110" y1="270" x2="110" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="330" y="303" fill="#8a8a8a">north (equatorward on the left)</text>
  <text x="26" y="160" fill="#8a8a8a">depth</text>
  <text x="60" y="70" fill="#8a8a8a">0 m</text>
  <text x="46" y="274" fill="#8a8a8a">2500 m</text>
  <line x1="104" y1="228" x2="110" y2="228" stroke="#8a8a8a"/><text x="46" y="232" fill="#8a8a8a">2000 m</text>

  <path d="M 110,66 L 640,86" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="410" y="60" fill="#4a90d9">sea surface: 1.17 m higher on the warm side</text>

  <path d="M 110,108 L 640,92" fill="none" stroke="#e0645c" stroke-width="1.8"/>
  <path d="M 110,148 L 640,124" fill="none" stroke="#e0645c" stroke-width="1.8"/>
  <path d="M 110,188 L 640,158" fill="none" stroke="#e0645c" stroke-width="1.8"/>
  <path d="M 110,214 L 640,196" fill="none" stroke="#e0645c" stroke-width="1.8"/>
  <path d="M 110,228 L 640,228" fill="none" stroke="#e0645c" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="500" y="176" fill="#e0645c">isopycnals shoal</text>
  <text x="500" y="188" fill="#e0645c">toward the pole</text>
  <text x="330" y="243" fill="#e0645c">level of no motion: isopycnal flat, pressure gradient zero</text>

  <line x1="200" y1="70" x2="200" y2="270" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="188" y="288" fill="#8a8a8a">station A</text>
  <line x1="540" y1="82" x2="540" y2="270" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="524" y="288" fill="#8a8a8a">station B</text>
  <line x1="200" y1="282" x2="540" y2="282" stroke="#8a8a8a" stroke-width="1"/>
  <text x="326" y="279" fill="#8a8a8a">200 km</text>

  <circle cx="300" cy="100" r="9" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="300" cy="100" r="2.5" fill="#4a90d9"/>
  <text x="316" y="104" fill="#4a90d9">0.67 m s&#8315;&#185; out of the page at the surface</text>

  <circle cx="300" cy="160" r="6" fill="none" stroke="#4a90d9" stroke-width="1.6"/>
  <circle cx="300" cy="160" r="2" fill="#4a90d9"/>
  <text x="316" y="164" fill="#4a90d9">0.33 m s&#8315;&#185; at 1000 m</text>

  <circle cx="300" cy="228" r="3.5" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="316" y="232" fill="#8a8a8a">zero at 2000 m, by assumption</text>
</svg>
