<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Three pumps build the vertical carbon gradient, and one of them works backwards.</text>

  <line x1="120" y1="250" x2="310" y2="250" stroke="#8a8a8a" stroke-width="1.4"/>
  <line x1="120" y1="250" x2="120" y2="50" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="150" y="284" fill="#8a8a8a">&#956;mol kg&#8315;&#185;</text>
  <text x="42" y="150" fill="#8a8a8a">depth</text>
  <line x1="127.7" y1="250" x2="127.7" y2="256" stroke="#8a8a8a"/><text x="112" y="270" fill="#8a8a8a">2000</text>
  <line x1="204.3" y1="250" x2="204.3" y2="256" stroke="#8a8a8a"/><text x="189" y="270" fill="#8a8a8a">2200</text>
  <line x1="280.9" y1="250" x2="280.9" y2="256" stroke="#8a8a8a"/><text x="266" y="270" fill="#8a8a8a">2400</text>
  <line x1="114" y1="55" x2="120" y2="55" stroke="#8a8a8a"/><text x="98" y="59" fill="#8a8a8a">0</text>
  <line x1="114" y1="133" x2="120" y2="133" stroke="#8a8a8a"/><text x="80" y="137" fill="#8a8a8a">2000</text>
  <line x1="114" y1="250" x2="120" y2="250" stroke="#8a8a8a"/><text x="80" y="254" fill="#8a8a8a">5000</text>

  <path d="M 127.7,55.0 L 146.8,58.9 L 188.9,66.7 L 219.6,86.2 L 234.9,113.5 L 244.5,172.0 L 250.2,250.0"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="150" y="102" fill="#4a90d9">DIC</text>

  <path d="M 242.6,55.0 L 246.4,58.9 L 257.9,66.7 L 271.3,86.2 L 280.9,113.5 L 288.5,172.0 L 292.3,250.0"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <text x="262" y="102" fill="#e0645c">alkalinity</text>

  <line x1="380" y1="60" x2="660" y2="60" stroke="#4a90d9" stroke-width="2"/>
  <line x1="380" y1="250" x2="660" y2="250" stroke="#8a8a8a" stroke-width="2"/>
  <text x="382" y="52" fill="#8a8a8a">surface</text>
  <text x="382" y="266" fill="#8a8a8a">deep ocean</text>

  <line x1="410" y1="72" x2="410" y2="230" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="410,242 404,226 416,226" fill="#4a90d9"/>
  <text x="384" y="126" fill="#4a90d9">SOLUBILITY</text>
  <text x="384" y="138" fill="#4a90d9">cold water</text>
  <text x="384" y="150" fill="#4a90d9">dissolves</text>
  <text x="384" y="162" fill="#4a90d9">more, then</text>
  <text x="384" y="174" fill="#4a90d9">sinks</text>

  <line x1="512" y1="72" x2="512" y2="230" stroke="#4a90d9" stroke-width="4"/>
  <polygon points="512,242 505,226 519,226" fill="#4a90d9"/>
  <text x="486" y="126" fill="#4a90d9">SOFT TISSUE</text>
  <text x="486" y="138" fill="#4a90d9">organic</text>
  <text x="486" y="150" fill="#4a90d9">particles sink</text>
  <text x="486" y="162" fill="#4a90d9">and are</text>
  <text x="486" y="174" fill="#4a90d9">respired</text>
  <text x="486" y="192" fill="#4a90d9">lowers surface</text>
  <text x="486" y="204" fill="#4a90d9">pCO2 strongly</text>

  <line x1="614" y1="72" x2="614" y2="230" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="614,242 608,226 620,226" fill="#e0645c"/>
  <text x="586" y="126" fill="#e0645c">CARBONATE</text>
  <text x="586" y="138" fill="#e0645c">shells sink</text>
  <text x="586" y="150" fill="#e0645c">and dissolve</text>
  <text x="586" y="168" fill="#e0645c">removes 2 alk</text>
  <text x="586" y="180" fill="#e0645c">per 1 DIC, so it</text>
  <text x="586" y="192" fill="#e0645c">RAISES surface</text>
  <text x="586" y="204" fill="#e0645c">pCO2</text>
</svg>
