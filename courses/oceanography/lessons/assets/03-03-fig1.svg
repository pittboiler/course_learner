<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">The Gulf Stream triples its transport downstream, then loses it again. Sverdrup predicts none of this.</text>

  <line x1="130" y1="255" x2="640" y2="255" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="130" y1="255" x2="130" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="330" y="288" fill="#8a8a8a">longitude (degrees west)</text>
  <text x="34" y="150" fill="#8a8a8a">transport</text>
  <text x="34" y="163" fill="#8a8a8a">(Sv)</text>

  <line x1="159.4" y1="255" x2="159.4" y2="261" stroke="#8a8a8a"/><text x="151" y="274" fill="#8a8a8a">80</text>
  <line x1="232.9" y1="255" x2="232.9" y2="261" stroke="#8a8a8a"/><text x="225" y="274" fill="#8a8a8a">75</text>
  <line x1="306.5" y1="255" x2="306.5" y2="261" stroke="#8a8a8a"/><text x="298" y="274" fill="#8a8a8a">70</text>
  <line x1="380" y1="255" x2="380" y2="261" stroke="#8a8a8a"/><text x="372" y="274" fill="#8a8a8a">65</text>
  <line x1="453.5" y1="255" x2="453.5" y2="261" stroke="#8a8a8a"/><text x="445" y="274" fill="#8a8a8a">60</text>
  <line x1="527.1" y1="255" x2="527.1" y2="261" stroke="#8a8a8a"/><text x="519" y="274" fill="#8a8a8a">55</text>
  <line x1="600.6" y1="255" x2="600.6" y2="261" stroke="#8a8a8a"/><text x="592" y="274" fill="#8a8a8a">50</text>

  <line x1="124" y1="194.1" x2="130" y2="194.1" stroke="#8a8a8a"/><text x="108" y="198" fill="#8a8a8a">50</text>
  <line x1="124" y1="133.1" x2="130" y2="133.1" stroke="#8a8a8a"/><text x="102" y="137" fill="#8a8a8a">100</text>
  <line x1="124" y1="72.2" x2="130" y2="72.2" stroke="#8a8a8a"/><text x="102" y="76" fill="#8a8a8a">150</text>

  <line x1="130" y1="191.6" x2="640" y2="191.6" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="470" y="186" fill="#8a8a8a">Sverdrup prediction, about 52 Sv</text>

  <path d="M 159.4,216.0 L 203.5,188.0 L 232.9,140.4 L 277.1,117.3 L 335.9,100.2 L 394.7,84.4 L 453.5,72.2 L 512.4,80.7 L 571.2,111.2 L 600.6,133.1"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <circle cx="159.4" cy="216" r="4" fill="#e0645c"/>
  <text x="140" y="238" fill="#e0645c">Florida Strait</text>
  <text x="150" y="250" fill="#e0645c">32 Sv</text>

  <circle cx="232.9" cy="140.4" r="4" fill="#e0645c"/>
  <line x1="232.9" y1="140.4" x2="252" y2="118" stroke="#e0645c" stroke-width="1"/>
  <text x="216" y="112" fill="#e0645c">Cape Hatteras: separation, 94 Sv</text>

  <circle cx="453.5" cy="72.2" r="4" fill="#e0645c"/>
  <text x="410" y="64" fill="#e0645c">peak 150 Sv near 60 W</text>

  <text x="480" y="126" fill="#8a8a8a">rings shed;</text>
  <text x="480" y="138" fill="#8a8a8a">transport falls</text>

  <line x1="300" y1="168" x2="440" y2="168" stroke="#8a8a8a" stroke-width="1"/>
  <text x="278" y="163" fill="#8a8a8a">the gap is recirculation: water that loops back and rejoins</text>
</svg>
