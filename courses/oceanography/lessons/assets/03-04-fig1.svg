<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Same scale. The ocean&#8217;s deformation radius is thirty times smaller, so its cyclones are dots.</text>

  <circle cx="200" cy="160" r="125" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="200" cy="160" r="88" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="200" cy="160" r="50" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="150" y="46" fill="#8a8a8a">mid-latitude atmospheric cyclone</text>
  <text x="166" y="60" fill="#8a8a8a">2000 km across</text>

  <circle cx="200" cy="160" r="6.3" fill="#4a90d9"/>
  <line x1="206" y1="156" x2="290" y2="120" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="294" y="118" fill="#4a90d9">an ocean mesoscale eddy,</text>
  <text x="294" y="130" fill="#4a90d9">100 km across, drawn to the</text>
  <text x="294" y="142" fill="#4a90d9">same scale</text>

  <line x1="90" y1="300" x2="152.5" y2="300" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="90" y1="295" x2="90" y2="305" stroke="#8a8a8a"/>
  <line x1="152.5" y1="295" x2="152.5" y2="305" stroke="#8a8a8a"/>
  <text x="96" y="292" fill="#8a8a8a">500 km</text>

  <circle cx="540" cy="200" r="100" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="540" cy="200" r="62" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <circle cx="540" cy="200" r="26" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <circle cx="540" cy="200" r="4" fill="#4a90d9"/>
  <text x="466" y="80" fill="#4a90d9">the same eddy, magnified 20 times</text>

  <path d="M 540,100 A 100,100 0 0,1 632,163" fill="none" stroke="#e0645c" stroke-width="2"/>
  <polygon points="638,178 626,164 638,160" fill="#e0645c"/>
  <text x="546" y="120" fill="#e0645c">0.3 m s&#8315;&#185; rim speed</text>

  <line x1="440" y1="300" x2="540" y2="300" stroke="#4a90d9" stroke-width="2"/>
  <line x1="440" y1="295" x2="440" y2="305" stroke="#4a90d9"/>
  <line x1="540" y1="295" x2="540" y2="305" stroke="#4a90d9"/>
  <text x="452" y="292" fill="#4a90d9">50 km</text>

  <text x="330" y="240" fill="#8a8a8a">Ld atmosphere</text>
  <text x="330" y="252" fill="#8a8a8a">about 1000 km</text>
  <text x="330" y="270" fill="#8a8a8a">Ld ocean</text>
  <text x="330" y="282" fill="#8a8a8a">about 30 km</text>
</svg>
