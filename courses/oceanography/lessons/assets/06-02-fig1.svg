<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">Water leaves the winter mixed layer along an isopycnal and slides under the summer surface.</text>

  <line x1="100" y1="290" x2="650" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="100" y1="52" x2="650" y2="52" stroke="#4a90d9" stroke-width="2"/>
  <text x="104" y="312" fill="#8a8a8a">50 N (outcrop)</text>
  <text x="590" y="312" fill="#8a8a8a">15 N</text>
  <text x="52" y="56" fill="#8a8a8a">0</text>
  <text x="34" y="174" fill="#8a8a8a">500</text>
  <text x="30" y="294" fill="#8a8a8a">1000 m</text>

  <path d="M 100,152 L 200,134 L 320,110 L 450,86 L 560,70 L 650,62" fill="none" stroke="#8a8a8a" stroke-width="2.2" stroke-dasharray="7 4"/>
  <text x="104" y="168" fill="#8a8a8a">base of the WINTER mixed layer</text>

  <path d="M 100,72 L 220,66 L 380,62 L 520,60 L 650,60" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="380" y="76" fill="#8a8a8a">base of the summer mixed layer</text>

  <path d="M 118,52 L 190,120 L 300,170 L 440,204 L 650,222" fill="none" stroke="#e0645c" stroke-width="2.2"/>
  <path d="M 186,52 L 250,118 L 360,166 L 480,196 L 650,212" fill="none" stroke="#e0645c" stroke-width="2.2"/>
  <path d="M 268,52 L 330,110 L 430,152 L 540,178 L 650,190" fill="none" stroke="#e0645c" stroke-width="2.2"/>
  <path d="M 360,52 L 420,100 L 500,132 L 580,152 L 650,162" fill="none" stroke="#e0645c" stroke-width="2.2"/>
  <text x="516" y="238" fill="#e0645c">isopycnals</text>

  <circle cx="196" cy="126" r="5" fill="#4a90d9"/>
  <path d="M 196,126 L 300,176 L 440,210 L 600,226" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="614,227 597,220 599,232" fill="#4a90d9"/>
  <text x="212" y="112" fill="#4a90d9">a parcel leaves the winter mixed layer here</text>
  <text x="330" y="200" fill="#4a90d9">and travels equatorward, sealed beneath the summer surface</text>

  <path d="M 480,262 L 650,262 L 650,236 L 500,224 Z" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="360" y="272" fill="#8a8a8a">SHADOW ZONE: never ventilated,</text>
  <text x="360" y="284" fill="#8a8a8a">because no isopycnal here outcrops upstream</text>

  <line x1="140" y1="34" x2="140" y2="46" stroke="#e0645c" stroke-width="3"/>
  <polygon points="140,50 135,38 145,38" fill="#e0645c"/>
  <text x="152" y="44" fill="#e0645c">a warm anomaly at the outcrop is carried into the interior at 0.5 K</text>
</svg>
