<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">Two cells. The upper one is closed by Southern Ocean wind; the lower one by abyssal mixing.</text>

  <line x1="90" y1="292" x2="655" y2="292" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="90" y1="52" x2="655" y2="52" stroke="#4a90d9" stroke-width="2"/>
  <text x="94" y="316" fill="#8a8a8a">60 S</text>
  <text x="352" y="316" fill="#8a8a8a">equator</text>
  <text x="616" y="316" fill="#8a8a8a">60 N</text>
  <text x="48" y="56" fill="#8a8a8a">0</text>
  <text x="34" y="176" fill="#8a8a8a">2500</text>
  <text x="34" y="296" fill="#8a8a8a">5000 m</text>

  <path d="M 100,52 L 150,112 L 210,152 L 290,172 L 400,182 L 540,186" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <path d="M 128,52 L 178,142 L 240,196 L 330,220 L 450,228 L 560,230" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="150" y="76" fill="#8a8a8a">outcropping isopycnals</text>

  <path d="M 622,58 L 622,120 L 560,150 L 420,166 L 280,164 L 190,126 L 132,64 L 200,58 L 380,56 L 560,56"
        fill="none" stroke="#e0645c" stroke-width="2.6"/>
  <polygon points="600,55 584,50 584,62" fill="#e0645c"/>
  <text x="470" y="102" fill="#e0645c">UPPER CELL, about 17 Sv</text>
  <text x="470" y="116" fill="#e0645c">NADW forms in the north,</text>
  <text x="470" y="130" fill="#e0645c">rises adiabatically along</text>
  <text x="470" y="144" fill="#e0645c">outcropping isopycnals</text>
  <text x="470" y="158" fill="#e0645c">in the Southern Ocean</text>

  <circle cx="622" cy="60" r="4.5" fill="#e0645c"/>
  <text x="586" y="46" fill="#e0645c">sinking</text>

  <path d="M 108,58 L 112,180 L 160,250 L 300,268 L 460,272 L 580,268 L 590,230 L 500,214 L 340,208 L 210,206 L 150,196 L 116,120"
        fill="none" stroke="#4a90d9" stroke-width="2.6"/>
  <polygon points="118,140 108,126 124,122" fill="#4a90d9"/>
  <text x="230" y="288" fill="#4a90d9">AABW spreads north along the sea floor</text>
  <text x="300" y="250" fill="#4a90d9">LOWER CELL, about 20 Sv</text>

  <line x1="380" y1="266" x2="380" y2="222" stroke="#4a90d9" stroke-width="1.6"/>
  <polygon points="380,214 375,226 385,226" fill="#4a90d9"/>
  <line x1="440" y1="266" x2="440" y2="222" stroke="#4a90d9" stroke-width="1.6"/>
  <polygon points="440,214 435,226 445,226" fill="#4a90d9"/>
  <text x="360" y="238" fill="#4a90d9">rises by diapycnal mixing</text>

  <circle cx="108" cy="58" r="4.5" fill="#4a90d9"/>
  <text x="90" y="42" fill="#4a90d9">AABW forms</text>

  <line x1="150" y1="32" x2="260" y2="32" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="272,32 256,26 256,38" fill="#e0645c"/>
  <text x="278" y="36" fill="#e0645c">northward Ekman transport, 28 Sv, driven by the westerlies</text>
</svg>
