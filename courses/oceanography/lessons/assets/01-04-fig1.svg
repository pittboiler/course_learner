<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">A mid-latitude summer profile. The buoyancy frequency is the slope of the density curve.</text>

  <line x1="105" y1="250" x2="330" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="105" y1="250" x2="105" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="150" y="284" fill="#8a8a8a">potential density &#963;</text>
  <text x="24" y="150" fill="#8a8a8a">depth (m)</text>

  <line x1="118.4" y1="250" x2="118.4" y2="256" stroke="#8a8a8a"/><text x="110" y="270" fill="#8a8a8a">25</text>
  <line x1="185.6" y1="250" x2="185.6" y2="256" stroke="#8a8a8a"/><text x="177" y="270" fill="#8a8a8a">26</text>
  <line x1="252.8" y1="250" x2="252.8" y2="256" stroke="#8a8a8a"/><text x="244" y="270" fill="#8a8a8a">27</text>
  <line x1="320" y1="250" x2="320" y2="256" stroke="#8a8a8a"/><text x="312" y="270" fill="#8a8a8a">28</text>

  <line x1="99" y1="250" x2="105" y2="250" stroke="#8a8a8a"/><text x="88" y="254" fill="#8a8a8a">0</text>
  <line x1="99" y1="202.5" x2="105" y2="202.5" stroke="#8a8a8a"/><text x="66" y="206" fill="#8a8a8a">500</text>
  <line x1="99" y1="155" x2="105" y2="155" stroke="#8a8a8a"/><text x="60" y="159" fill="#8a8a8a">1000</text>
  <line x1="99" y1="107.5" x2="105" y2="107.5" stroke="#8a8a8a"/><text x="60" y="111" fill="#8a8a8a">1500</text>
  <line x1="99" y1="60" x2="105" y2="60" stroke="#8a8a8a"/><text x="60" y="64" fill="#8a8a8a">2000</text>

  <path d="M 118.4,250.0 L 118.4,247.2 L 121.8,244.3 L 158.8,242.4 L 185.6,240.5 L 202.4,238.6 L 213.8,235.8 L 225.9,231.0 L 238.0,221.5 L 246.1,212.0 L 259.5,193.0 L 273.0,174.0 L 283.0,155.0 L 298.5,107.5 L 306.6,60.0"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <line x1="112" y1="246.5" x2="336" y2="246.5" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="128" y="243" fill="#8a8a8a">mixed layer, 60 m</text>
  <text x="180" y="230" fill="#e0645c">seasonal thermocline</text>
  <text x="186" y="200" fill="#e0645c">permanent pycnocline</text>
  <text x="230" y="130" fill="#8a8a8a">weakly stratified abyss</text>

  <line x1="420" y1="250" x2="645" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="420" y1="250" x2="420" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="452" y="284" fill="#8a8a8a">N (cycles per hour)</text>

  <line x1="420" y1="250" x2="420" y2="256" stroke="#8a8a8a"/><text x="415" y="270" fill="#8a8a8a">0</text>
  <line x1="483.2" y1="250" x2="483.2" y2="256" stroke="#8a8a8a"/><text x="478" y="270" fill="#8a8a8a">5</text>
  <line x1="546.5" y1="250" x2="546.5" y2="256" stroke="#8a8a8a"/><text x="538" y="270" fill="#8a8a8a">10</text>
  <line x1="609.7" y1="250" x2="609.7" y2="256" stroke="#8a8a8a"/><text x="602" y="270" fill="#8a8a8a">15</text>

  <path d="M 420.0,248.6 L 448.9,245.7 L 537.4,243.3 L 520.2,241.4 L 499.2,239.6 L 473.3,237.2 L 462.5,233.4 L 450.0,226.2 L 444.5,216.8 L 442.4,202.5 L 442.4,183.5 L 439.4,164.5 L 435.2,131.2 L 431.0,83.8"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>

  <circle cx="537.4" cy="243.3" r="3.5" fill="#e0645c"/>
  <line x1="537.4" y1="243.3" x2="590" y2="222" stroke="#e0645c" stroke-width="1"/>
  <text x="536" y="218" fill="#e0645c">9.3 cph: 6.5 min period</text>

  <line x1="423.7" y1="250" x2="423.7" y2="55" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="428" y="72" fill="#8a8a8a">f at 45 degrees: 0.06 cph</text>
  <text x="428" y="86" fill="#8a8a8a">the internal-wave band</text>
  <text x="428" y="100" fill="#8a8a8a">lies between these two</text>
</svg>
