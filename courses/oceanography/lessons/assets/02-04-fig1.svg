<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">Easterlies and westerlies both push water toward 30 N. It has nowhere to go but down.</text>

  <text x="118" y="46" fill="#8a8a8a">15 N</text>
  <text x="336" y="46" fill="#8a8a8a">30 N</text>
  <text x="574" y="46" fill="#8a8a8a">45 N</text>

  <circle cx="180" cy="72" r="10" fill="none" stroke="#e0645c" stroke-width="2"/>
  <line x1="173" y1="65" x2="187" y2="79" stroke="#e0645c" stroke-width="2"/>
  <line x1="187" y1="65" x2="173" y2="79" stroke="#e0645c" stroke-width="2"/>
  <text x="120" y="94" fill="#e0645c">easterly trades</text>
  <text x="128" y="106" fill="#e0645c">into the page</text>

  <circle cx="520" cy="72" r="10" fill="none" stroke="#e0645c" stroke-width="2"/>
  <circle cx="520" cy="72" r="3" fill="#e0645c"/>
  <text x="484" y="94" fill="#e0645c">westerlies</text>
  <text x="474" y="106" fill="#e0645c">out of the page</text>

  <line x1="200" y1="132" x2="322" y2="132" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="334,132 318,126 318,138" fill="#4a90d9"/>
  <text x="196" y="124" fill="#4a90d9">Ekman transport, 90 degrees right</text>

  <line x1="500" y1="132" x2="378" y2="132" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="366,132 382,126 382,138" fill="#4a90d9"/>
  <text x="424" y="124" fill="#4a90d9">and here too</text>

  <path d="M 90,152 Q 350,142 610,152" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="500" y="140" fill="#8a8a8a">sea surface, up 1 m</text>

  <line x1="350" y1="160" x2="350" y2="208" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="350,220 343,204 357,204" fill="#4a90d9"/>
  <text x="360" y="188" fill="#4a90d9">Ekman pumping w, about 44 m per year downward</text>

  <path d="M 90,236 Q 350,296 610,236" fill="none" stroke="#e0645c" stroke-width="2.2"/>
  <path d="M 90,266 Q 350,314 610,266" fill="none" stroke="#e0645c" stroke-width="2.2"/>
  <text x="120" y="232" fill="#e0645c">thermocline, pushed down into a bowl</text>

  <text x="200" y="196" fill="#8a8a8a">converging Ekman layer</text>

  <line x1="90" y1="330" x2="610" y2="330" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="240" y="326" fill="#8a8a8a">the bowl of warm light water is the subtropical gyre</text>
</svg>
