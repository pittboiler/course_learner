<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Two routes to dense water: convect in the open, or make brine on a shelf and let it fall.</text>

  <line x1="60" y1="60" x2="330" y2="60" stroke="#4a90d9" stroke-width="2"/>
  <text x="86" y="46" fill="#8a8a8a">open-ocean convection</text>
  <text x="120" y="316" fill="#8a8a8a">Labrador Sea</text>

  <line x1="120" y1="46" x2="120" y2="26" stroke="#e0645c" stroke-width="2"/>
  <polygon points="120,18 115,32 125,32" fill="#e0645c"/>
  <line x1="180" y1="46" x2="180" y2="26" stroke="#e0645c" stroke-width="2"/>
  <polygon points="180,18 175,32 185,32" fill="#e0645c"/>
  <line x1="240" y1="46" x2="240" y2="26" stroke="#e0645c" stroke-width="2"/>
  <polygon points="240,18 235,32 245,32" fill="#e0645c"/>
  <text x="250" y="34" fill="#e0645c">buoyancy loss, 250 W m&#8315;&#178;</text>

  <path d="M 60,120 Q 195,88 330,120" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <path d="M 60,180 Q 195,140 330,180" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="66" y="112" fill="#8a8a8a">preconditioning: a cyclonic dome</text>
  <text x="66" y="196" fill="#8a8a8a">brings dense water near the surface</text>

  <line x1="150" y1="66" x2="150" y2="250" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="150,262 144,246 156,246" fill="#4a90d9"/>
  <line x1="180" y1="66" x2="180" y2="250" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="180,262 174,246 186,246" fill="#4a90d9"/>
  <line x1="210" y1="66" x2="210" y2="250" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="210,262 204,246 216,246" fill="#4a90d9"/>
  <text x="120" y="278" fill="#4a90d9">plumes 1 km wide reach 2000 m</text>

  <line x1="380" y1="60" x2="660" y2="60" stroke="#4a90d9" stroke-width="2"/>
  <text x="440" y="46" fill="#8a8a8a">shelf convection</text>
  <text x="430" y="316" fill="#8a8a8a">Weddell Sea</text>

  <line x1="380" y1="60" x2="520" y2="60" stroke="#8a8a8a" stroke-width="5"/>
  <text x="396" y="76" fill="#8a8a8a">sea ice forming</text>
  <line x1="440" y1="82" x2="440" y2="102" stroke="#e0645c" stroke-width="2"/>
  <polygon points="440,112 434,96 446,96" fill="#e0645c"/>
  <text x="450" y="100" fill="#e0645c">brine rejected</text>

  <path d="M 380,150 L 520,150 L 560,180 L 600,236 L 660,252" fill="none" stroke="#8a8a8a" stroke-width="3"/>
  <text x="386" y="144" fill="#8a8a8a">shelf, 400 m</text>
  <text x="576" y="200" fill="#8a8a8a">slope</text>

  <path d="M 480,140 L 530,168 L 572,206 L 620,240 L 656,248" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="662,249 646,242 648,254" fill="#4a90d9"/>
  <text x="466" y="128" fill="#4a90d9">dense plume descends the slope,</text>
  <text x="466" y="284" fill="#4a90d9">entraining ambient water as it goes</text>
</svg>
