<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="30" y="22" fill="#8a8a8a" font-style="italic" font-size="14">Two experiments, two pairs of numbers: (K_u, P_u) from the closed loop, (L, T) from the open loop. Each feeds its own Ziegler&#8211;Nichols table.</text>

  <!-- ============ PANEL A: ultimate gain test ============ -->
  <text x="55" y="48" fill="#8a8a8a" font-size="13" font-style="italic">(a) Closed loop: raise K_p until it rings forever</text>

  <!-- axes -->
  <line x1="55" y1="315" x2="55" y2="100" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="55,100 50,110 60,110" fill="#8a8a8a"/>
  <text x="30" y="110" fill="#8a8a8a" font-size="12">y(t)</text>
  <line x1="55" y1="315" x2="358" y2="315" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="358,315 348,310 348,320" fill="#8a8a8a"/>
  <text x="352" y="332" fill="#8a8a8a" font-size="12">t</text>

  <!-- setpoint -->
  <line x1="55" y1="180" x2="348" y2="180" stroke="#8a8a8a" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="330" y="174" fill="#8a8a8a" font-size="11">setpoint r</text>

  <!-- sustained oscillation -->
  <path d="M 60.0 180.0 L 65.0 158.3 L 70.0 140.9 L 75.0 131.3 L 80.0 131.3 L 85.0 140.9 L 90.0 158.3 L 95.0 180.0 L 100.0 201.7 L 105.0 219.1 L 110.0 228.7 L 115.0 228.7 L 120.0 219.1 L 125.0 201.7 L 130.0 180.0 L 135.0 158.3 L 140.0 140.9 L 145.0 131.3 L 150.0 131.3 L 155.0 140.9 L 160.0 158.3 L 165.0 180.0 L 170.0 201.7 L 175.0 219.1 L 180.0 228.7 L 185.0 228.7 L 190.0 219.1 L 195.0 201.7 L 200.0 180.0 L 205.0 158.3 L 210.0 140.9 L 215.0 131.3 L 220.0 131.3 L 225.0 140.9 L 230.0 158.3 L 235.0 180.0 L 240.0 201.7 L 245.0 219.1 L 250.0 228.7 L 255.0 228.7 L 260.0 219.1 L 265.0 201.7 L 270.0 180.0 L 275.0 158.3 L 280.0 140.9 L 285.0 131.3 L 290.0 131.3 L 295.0 140.9 L 300.0 158.3 L 305.0 180.0 L 310.0 201.7 L 315.0 219.1 L 320.0 228.7 L 325.0 228.7 L 330.0 219.1 L 335.0 201.7 L 340.0 180.0"
        fill="none" stroke="#4a90d9" stroke-width="2.6"/>

  <!-- envelope: constant amplitude -->
  <line x1="60" y1="130" x2="345" y2="130" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2 5" opacity="0.8"/>
  <line x1="60" y1="230" x2="345" y2="230" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="2 5" opacity="0.8"/>
  <text x="212" y="248" fill="#8a8a8a" font-size="11">amplitude neither grows nor decays</text>

  <!-- peak markers and the ultimate period -->
  <circle cx="77.5" cy="130" r="4" fill="#e0645c"/>
  <circle cx="147.5" cy="130" r="4" fill="#e0645c"/>
  <line x1="77.5" y1="126" x2="77.5" y2="96" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="147.5" y1="126" x2="147.5" y2="96" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="77.5" y1="100" x2="147.5" y2="100" stroke="#e0645c" stroke-width="1.6"/>
  <polygon points="77.5,100 87,96 87,104" fill="#e0645c"/>
  <polygon points="147.5,100 138,96 138,104" fill="#e0645c"/>
  <text x="152" y="95" fill="#e0645c" font-size="13">P_u = peak&#8211;to&#8211;peak time</text>

  <!-- gain callout -->
  <text x="66" y="290" fill="#e0645c" font-size="12">this K_p is K_u</text>

  <!-- instructions -->
  <text x="55" y="356" fill="#8a8a8a" font-size="12">1. set K_i = K_d = 0, controller on P only</text>
  <text x="55" y="373" fill="#8a8a8a" font-size="12">2. step the setpoint, raise K_p, repeat</text>
  <text x="55" y="390" fill="#8a8a8a" font-size="12">3. stop when the ringing holds steady; record K_u, P_u</text>

  <!-- ============ PANEL B: reaction curve ============ -->
  <text x="410" y="48" fill="#8a8a8a" font-size="13" font-style="italic">(b) Open loop: step the plant, draw the tangent</text>

  <!-- axes -->
  <line x1="410" y1="315" x2="410" y2="100" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="410,100 405,110 415,110" fill="#8a8a8a"/>
  <text x="386" y="110" fill="#8a8a8a" font-size="12">y(t)</text>
  <line x1="410" y1="315" x2="713" y2="315" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="713,315 703,310 703,320" fill="#8a8a8a"/>
  <text x="707" y="332" fill="#8a8a8a" font-size="12">t</text>

  <!-- initial and final levels -->
  <line x1="410" y1="260" x2="700" y2="260" stroke="#8a8a8a" stroke-width="1.1" stroke-dasharray="5 4"/>
  <line x1="410" y1="140" x2="700" y2="140" stroke="#8a8a8a" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="640" y="134" fill="#8a8a8a" font-size="11">final level</text>

  <!-- step instant -->
  <line x1="420" y1="315" x2="420" y2="112" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="424" y="122" fill="#8a8a8a" font-size="11">step of size &#916;u applied here</text>

  <!-- reaction curve -->
  <path d="M 420 260 L 450 260 L 460.0 256.8 L 470.0 249.2 L 480.0 239.2 L 490.0 228.3 L 500.0 217.4 L 510.0 206.9 L 520.0 197.3 L 530.0 188.7 L 540.0 181.1 L 550.0 174.5 L 560.0 168.8 L 570.0 163.9 L 590.0 156.3 L 610.0 151.0 L 630.0 147.3 L 650.0 144.9 L 670.0 143.2 L 690.0 142.1"
        fill="none" stroke="#4a90d9" stroke-width="2.6"/>

  <!-- tangent at the steepest point -->
  <line x1="455" y1="267" x2="578" y2="131" stroke="#e0645c" stroke-width="1.8" stroke-dasharray="7 4"/>
  <circle cx="490" cy="228.3" r="4" fill="#e0645c"/>
  <text x="497" y="219" fill="#e0645c" font-size="11">steepest point: slope R</text>

  <!-- where the tangent meets each level -->
  <circle cx="461.3" cy="260" r="3.2" fill="#e0645c"/>
  <circle cx="570" cy="140" r="3.2" fill="#e0645c"/>
  <line x1="461.3" y1="260" x2="461.3" y2="295" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="570" y1="140" x2="570" y2="295" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- L and T brackets -->
  <line x1="420" y1="290" x2="461.3" y2="290" stroke="#e0645c" stroke-width="1.6"/>
  <polygon points="420,290 429,286 429,294" fill="#e0645c"/>
  <polygon points="461.3,290 452,286 452,294" fill="#e0645c"/>
  <text x="432" y="306" fill="#e0645c" font-size="13">L</text>
  <line x1="461.3" y1="290" x2="570" y2="290" stroke="#e0645c" stroke-width="1.6"/>
  <polygon points="461.3,290 470,286 470,294" fill="#e0645c"/>
  <polygon points="570,290 561,286 561,294" fill="#e0645c"/>
  <text x="510" y="306" fill="#e0645c" font-size="13">T</text>

  <!-- delta y -->
  <line x1="700" y1="260" x2="700" y2="140" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="700,260 696,251 704,251" fill="#8a8a8a"/>
  <polygon points="700,140 696,149 704,149" fill="#8a8a8a"/>
  <text x="662" y="200" fill="#8a8a8a" font-size="12">&#916;y</text>

  <!-- instructions -->
  <text x="410" y="356" fill="#8a8a8a" font-size="12">1. controller in manual; step the plant input by &#916;u</text>
  <text x="410" y="373" fill="#8a8a8a" font-size="12">2. draw the tangent at the steepest point of the trace</text>
  <text x="410" y="390" fill="#8a8a8a" font-size="12">3. read L and T off the axis; K = &#916;y / &#916;u</text>
</svg>
