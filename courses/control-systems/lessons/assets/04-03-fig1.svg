<svg viewBox="0 0 787 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="46" y="22" fill="#8a8a8a" font-style="italic" font-size="14">Mirror images: lead buys phase at crossover and pays in gain; lag does the reverse.</text>

  <text x="60" y="46" fill="#4a90d9" font-size="14">LEAD&#160;&#160;(&#945; = 0.1, zero at 1/T, pole at 1/&#945;T)</text>
  <text x="420" y="46" fill="#4a90d9" font-size="14">LAG&#160;&#160;(&#946; = 10, pole at 1/&#946;T, zero at 1/T)</text>

  <!-- ================= LEAD: magnitude ================= -->
  <line x1="60" y1="142" x2="60" y2="62" stroke="#8a8a8a" stroke-width="1.4"/>
  <line x1="60" y1="130" x2="342" y2="130" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <polygon points="342,130 333,126 333,134" fill="#8a8a8a"/>
  <text x="26" y="134" fill="#8a8a8a" font-size="11">0 dB</text>
  <text x="20" y="74" fill="#8a8a8a" font-size="11">20 dB</text>
  <line x1="56" y1="70" x2="64" y2="70" stroke="#8a8a8a" stroke-width="1"/>

  <!-- corner frequency guides -->
  <line x1="150" y1="142" x2="150" y2="62" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="240" y1="142" x2="240" y2="62" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- true magnitude curve -->
  <path d="M 60 129.87 L 82.5 129.60 L 105 128.77 L 127.5 126.46 L 150 121.10 L 172.5 111.83 L 195 100.00 L 217.5 88.18 L 240 78.89 L 262.5 73.54 L 285 71.23 L 307.5 70.40 L 330 70.13"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="252" y="62" fill="#8a8a8a" font-size="11">HF gain up by 1/&#945;</text>

  <!-- omega_max boost marker -->
  <line x1="195" y1="130" x2="195" y2="100" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="195,100 191,109 199,109" fill="#e0645c"/>
  <polygon points="195,130 191,121 199,121" fill="#e0645c"/>
  <text x="120" y="107" fill="#e0645c" font-size="11">+10 dB</text>

  <!-- ================= LEAD: phase ================= -->
  <line x1="60" y1="286" x2="60" y2="174" stroke="#8a8a8a" stroke-width="1.4"/>
  <line x1="60" y1="228" x2="342" y2="228" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="342,228 333,224 333,232" fill="#8a8a8a"/>
  <text x="346" y="232" fill="#8a8a8a" font-size="11">&#969;</text>
  <text x="34" y="232" fill="#8a8a8a" font-size="11">0&#176;</text>
  <text x="26" y="184" fill="#8a8a8a" font-size="11">+60&#176;</text>
  <line x1="56" y1="180" x2="64" y2="180" stroke="#8a8a8a" stroke-width="1"/>

  <line x1="150" y1="286" x2="150" y2="174" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="240" y1="286" x2="240" y2="174" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <path d="M 60 223.89 L 82.5 220.75 L 105 215.41 L 127.5 207.09 L 150 196.57 L 172.5 187.55 L 195 184.08 L 217.5 187.55 L 240 196.57 L 262.5 207.09 L 285 215.41 L 307.5 220.75 L 330 223.89"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <line x1="195" y1="228" x2="195" y2="184.08" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="195" cy="184.08" r="4.5" fill="#e0645c"/>
  <text x="204" y="182" fill="#e0645c" font-size="12">&#966;max = 54.9&#176;</text>

  <!-- lead frequency labels -->
  <text x="138" y="302" fill="#8a8a8a" font-size="11">1/T</text>
  <text x="176" y="302" fill="#e0645c" font-size="11">&#969;max</text>
  <text x="226" y="302" fill="#8a8a8a" font-size="11">1/&#945;T</text>
  <text x="120" y="320" fill="#e0645c" font-size="11">&#969;max = geometric mean of the two corners &#8212; put it at the new &#969;gc</text>

  <!-- ================= LAG: magnitude ================= -->
  <line x1="420" y1="142" x2="420" y2="62" stroke="#8a8a8a" stroke-width="1.4"/>
  <line x1="420" y1="130" x2="702" y2="130" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <polygon points="702,130 693,126 693,134" fill="#8a8a8a"/>
  <text x="386" y="134" fill="#8a8a8a" font-size="11">0 dB</text>
  <text x="380" y="74" fill="#8a8a8a" font-size="11">20 dB</text>
  <line x1="416" y1="70" x2="424" y2="70" stroke="#8a8a8a" stroke-width="1"/>

  <line x1="510" y1="142" x2="510" y2="62" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="600" y1="142" x2="600" y2="62" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <path d="M 420 70.13 L 442.5 70.40 L 465 71.23 L 487.5 73.54 L 510 78.89 L 532.5 88.18 L 555 100.00 L 577.5 111.83 L 600 121.10 L 622.5 126.46 L 645 128.77 L 667.5 129.60 L 690 129.87"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- beta plateau marker -->
  <line x1="437" y1="130" x2="437" y2="70" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="437,70 433,79 441,79" fill="#e0645c"/>
  <polygon points="437,130 433,121 441,121" fill="#e0645c"/>
  <text x="444" y="104" fill="#e0645c" font-size="11">20 log &#946; = 20 dB of extra DC gain</text>

  <!-- ================= LAG: phase ================= -->
  <line x1="420" y1="286" x2="420" y2="174" stroke="#8a8a8a" stroke-width="1.4"/>
  <line x1="420" y1="228" x2="702" y2="228" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="702,228 693,224 693,232" fill="#8a8a8a"/>
  <text x="706" y="232" fill="#8a8a8a" font-size="11">&#969;</text>
  <text x="394" y="232" fill="#8a8a8a" font-size="11">0&#176;</text>
  <text x="380" y="280" fill="#8a8a8a" font-size="11">&#8722;60&#176;</text>
  <line x1="416" y1="276" x2="424" y2="276" stroke="#8a8a8a" stroke-width="1"/>

  <line x1="510" y1="286" x2="510" y2="174" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="600" y1="286" x2="600" y2="174" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <path d="M 420 232.11 L 442.5 235.25 L 465 240.59 L 487.5 248.91 L 510 259.43 L 532.5 268.45 L 555 271.92 L 577.5 268.45 L 600 259.43 L 622.5 248.91 L 645 240.59 L 667.5 235.25 L 690 232.11"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <circle cx="690" cy="232.11" r="4.5" fill="#e0645c"/>
  <text x="576" y="216" fill="#e0645c" font-size="12">a decade above the zero:</text>
  <text x="576" y="230" fill="#e0645c" font-size="12">only &#8722;5&#176; left here</text>
  <line x1="686" y1="226" x2="672" y2="220" stroke="#e0645c" stroke-width="1"/>

  <text x="496" y="302" fill="#8a8a8a" font-size="11">1/&#946;T</text>
  <text x="590" y="302" fill="#8a8a8a" font-size="11">1/T</text>
  <text x="628" y="302" fill="#e0645c" font-size="11">&#969;gc lives out here</text>
  <text x="452" y="320" fill="#e0645c" font-size="11">Park the pair far below crossover; only the gain ratio survives at DC</text>
</svg>
