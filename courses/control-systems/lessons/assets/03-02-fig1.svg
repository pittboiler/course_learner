<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="30" y="24" fill="#8a8a8a" font-style="italic" font-size="13">Spec first, locus second: the shaded region is every s that meets the spec, and the distances give K.</text>

  <!-- admissible region: inside the zeta wedge AND left of sigma = 0.5 -->
  <polygon points="529,228 529,174.3 467,66.9 285,66.9 285,228" fill="#e0645c" opacity="0.11"/>
  <polygon points="529,228 529,281.7 467,389.1 285,389.1 285,228" fill="#e0645c" opacity="0.11"/>

  <!-- axes -->
  <line x1="280" y1="228" x2="645" y2="228" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="645,228 635,224 635,232" fill="#8a8a8a"/>
  <text x="650" y="233" fill="#8a8a8a">&#963;</text>
  <line x1="560" y1="400" x2="560" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="560,52 556,62 564,62" fill="#8a8a8a"/>
  <text x="566" y="58" fill="#8a8a8a">j&#969;</text>

  <line x1="374" y1="224" x2="374" y2="232" stroke="#8a8a8a" stroke-width="1"/>
  <text x="368" y="258" fill="#8a8a8a" font-size="12">&#8722;3</text>
  <text x="568" y="250" fill="#8a8a8a" font-size="12">0</text>

  <!-- constant-zeta rays: the overshoot boundary -->
  <line x1="560" y1="228" x2="467" y2="66.9" stroke="#e0645c" stroke-width="1.7"/>
  <line x1="560" y1="228" x2="467" y2="389.1" stroke="#e0645c" stroke-width="1.7"/>
  <path d="M 530 228 A 30 30 0 0 1 545 202" fill="none" stroke="#e0645c" stroke-width="1.1"/>
  <text x="543" y="213" fill="#e0645c" font-size="12">&#946;</text>
  <text x="326" y="74" fill="#e0645c" font-size="12">&#950; = 0.5 ray, &#946; = 60&#176;</text>
  <line x1="450" y1="70" x2="466" y2="69" stroke="#e0645c" stroke-width="1"/>

  <!-- constant settling-time boundary -->
  <line x1="529" y1="67" x2="529" y2="389" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="7 5"/>
  <line x1="566" y1="86" x2="532" y2="80" stroke="#e0645c" stroke-width="1"/>
  <text x="570" y="92" fill="#e0645c" font-size="12">&#963; = 0.5</text>
  <text x="570" y="110" fill="#e0645c" font-size="12">(t</text>
  <text x="581" y="114" fill="#e0645c" font-size="10">s</text>
  <text x="587" y="110" fill="#e0645c" font-size="12">&#160;&#8804; 8 s)</text>

  <!-- open-loop poles -->
  <line x1="553" y1="221" x2="567" y2="235" stroke="#4a90d9" stroke-width="3"/>
  <line x1="567" y1="221" x2="553" y2="235" stroke="#4a90d9" stroke-width="3"/>
  <line x1="429" y1="221" x2="443" y2="235" stroke="#4a90d9" stroke-width="3"/>
  <line x1="443" y1="221" x2="429" y2="235" stroke="#4a90d9" stroke-width="3"/>
  <text x="428" y="258" fill="#4a90d9" font-size="12">&#8722;2</text>

  <!-- the locus -->
  <line x1="436" y1="228" x2="560" y2="228" stroke="#4a90d9" stroke-width="4"/>
  <line x1="498" y1="63" x2="498" y2="393" stroke="#4a90d9" stroke-width="4"/>
  <polygon points="524,228 534,223 534,233" fill="#4a90d9"/>
  <polygon points="472,228 462,223 462,233" fill="#4a90d9"/>
  <polygon points="498,150 493,160 503,160" fill="#4a90d9"/>
  <polygon points="498,320 493,310 503,310" fill="#4a90d9"/>
  <text x="300" y="300" fill="#4a90d9" font-size="12">locus, K: 0 &#8594; &#8734;</text>
  <line x1="440" y1="296" x2="494" y2="296" stroke="#4a90d9" stroke-width="1"/>

  <!-- distance from the design point to the pole at s = -2 -->
  <line x1="498" y1="120.6" x2="436" y2="228" stroke="#e0645c" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="441" y="182" fill="#e0645c" font-size="12">2</text>
  <text x="510" y="180" fill="#e0645c" font-size="12">2</text>

  <!-- design point -->
  <circle cx="498" cy="120.6" r="5.5" fill="#e0645c"/>
  <circle cx="498" cy="335.4" r="4" fill="#e0645c" opacity="0.55"/>
  <polyline points="418,158 470,140 491,124" fill="none" stroke="#e0645c" stroke-width="1"/>
  <text x="296" y="154" fill="#e0645c" font-size="12">s</text>
  <text x="303" y="158" fill="#e0645c" font-size="10">d</text>
  <text x="309" y="154" fill="#e0645c" font-size="12">&#160;= &#8722;1 + j1.732</text>
  <text x="296" y="172" fill="#e0645c" font-size="12">K = 2 &#215; 2 = 4</text>

  <!-- legends -->
  <text x="288" y="94" fill="#8a8a8a" font-size="12">L(s) = K / [ s(s+2) ]</text>
  <text x="288" y="368" fill="#e0645c" font-size="12">shaded = meets both specs</text>
  <text x="288" y="386" fill="#e0645c" font-size="12">&#950; &#8805; 0.5 and &#963; &#8805; 0.5</text>
</svg>
