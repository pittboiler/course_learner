<svg viewBox="0 0 480 392" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0645c"/>
    </marker>
  </defs>

  <text x="20" y="20" fill="#8a8a8a" font-style="italic" font-size="12">Innermost first. Coral marks the loop being collapsed next.</text>

  <!-- ================= STAGE 1: as given ================= -->
  <text x="20" y="48" fill="#8a8a8a" font-style="italic" font-size="11">as given</text>

  <text x="18" y="85" fill="#8a8a8a">R</text>
  <line x1="32" y1="80" x2="56" y2="80" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ag)"/>
  <circle cx="70" cy="80" r="12" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="52" y="73" fill="#8a8a8a" font-size="11">+</text>
  <text x="52" y="103" fill="#8a8a8a" font-size="11">&#8722;</text>
  <line x1="82" y1="80" x2="104" y2="80" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ag)"/>

  <rect x="106" y="62" width="54" height="36" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="133" y="85" text-anchor="middle" fill="#4a90d9">G<tspan font-size="9" dy="3">1</tspan></text>
  <line x1="160" y1="80" x2="184" y2="80" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ag)"/>

  <circle cx="196" cy="80" r="12" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="178" y="73" fill="#8a8a8a" font-size="11">+</text>
  <text x="178" y="103" fill="#8a8a8a" font-size="11">&#8722;</text>
  <line x1="208" y1="80" x2="232" y2="80" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ag)"/>

  <rect x="234" y="62" width="54" height="36" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="261" y="85" text-anchor="middle" fill="#4a90d9">G<tspan font-size="9" dy="3">2</tspan></text>
  <line x1="288" y1="80" x2="430" y2="80" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="436" y="85" fill="#8a8a8a">Y</text>

  <!-- inner loop, coral -->
  <circle cx="330" cy="80" r="3" fill="#e0645c"/>
  <line x1="330" y1="80" x2="330" y2="122" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="330" y1="122" x2="279" y2="122" stroke="#e0645c" stroke-width="1.5" marker-end="url(#ac)"/>
  <rect x="222" y="106" width="54" height="32" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="249" y="127" text-anchor="middle" fill="#e0645c">H<tspan font-size="9" dy="3">1</tspan></text>
  <line x1="222" y1="122" x2="196" y2="122" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="196" y1="122" x2="196" y2="95" stroke="#e0645c" stroke-width="1.5" marker-end="url(#ac)"/>

  <!-- outer loop, grey -->
  <circle cx="390" cy="80" r="3" fill="#8a8a8a"/>
  <line x1="390" y1="80" x2="390" y2="162" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="390" y1="162" x2="269" y2="162" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ag)"/>
  <rect x="212" y="146" width="54" height="32" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="239" y="167" text-anchor="middle" fill="#8a8a8a">H<tspan font-size="9" dy="3">2</tspan></text>
  <line x1="212" y1="162" x2="70" y2="162" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="70" y1="162" x2="70" y2="95" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- ================= STAGE 2: inner collapsed ================= -->
  <text x="20" y="198" fill="#8a8a8a" font-style="italic" font-size="11">inner loop collapsed</text>

  <text x="18" y="225" fill="#8a8a8a">R</text>
  <line x1="32" y1="220" x2="56" y2="220" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ag)"/>
  <circle cx="70" cy="220" r="12" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="52" y="213" fill="#8a8a8a" font-size="11">+</text>
  <text x="52" y="243" fill="#8a8a8a" font-size="11">&#8722;</text>
  <line x1="82" y1="220" x2="104" y2="220" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ag)"/>

  <rect x="106" y="202" width="54" height="36" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="133" y="225" text-anchor="middle" fill="#4a90d9">G<tspan font-size="9" dy="3">1</tspan></text>
  <line x1="160" y1="220" x2="200" y2="220" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ag)"/>

  <rect x="202" y="194" width="116" height="52" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="260" y="215" text-anchor="middle" fill="#4a90d9" font-size="12">G<tspan font-size="9" dy="3">2</tspan></text>
  <line x1="218" y1="221" x2="302" y2="221" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="260" y="239" text-anchor="middle" fill="#4a90d9" font-size="12">1 + G<tspan font-size="9" dy="3">2</tspan><tspan font-size="12" dy="-3">H</tspan><tspan font-size="9" dy="3">1</tspan></text>

  <line x1="318" y1="220" x2="430" y2="220" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="436" y="225" fill="#8a8a8a">Y</text>

  <circle cx="390" cy="220" r="3" fill="#e0645c"/>
  <line x1="390" y1="220" x2="390" y2="272" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="390" y1="272" x2="269" y2="272" stroke="#e0645c" stroke-width="1.5" marker-end="url(#ac)"/>
  <rect x="212" y="256" width="54" height="32" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="239" y="277" text-anchor="middle" fill="#e0645c">H<tspan font-size="9" dy="3">2</tspan></text>
  <line x1="212" y1="272" x2="70" y2="272" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="70" y1="272" x2="70" y2="235" stroke="#e0645c" stroke-width="1.5" marker-end="url(#ac)"/>

  <!-- ================= STAGE 3: one block ================= -->
  <text x="20" y="308" fill="#8a8a8a" font-style="italic" font-size="11">one block: T(s) = Y/R</text>

  <text x="18" y="345" fill="#8a8a8a">R</text>
  <line x1="32" y1="340" x2="88" y2="340" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ag)"/>
  <rect x="90" y="312" width="300" height="56" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="240" y="333" text-anchor="middle" fill="#e0645c" font-size="12">G<tspan font-size="9" dy="3">1</tspan><tspan font-size="12" dy="-3">G</tspan><tspan font-size="9" dy="3">2</tspan></text>
  <line x1="150" y1="339" x2="330" y2="339" stroke="#e0645c" stroke-width="1.2"/>
  <text x="240" y="357" text-anchor="middle" fill="#e0645c" font-size="12">1 + G<tspan font-size="9" dy="3">2</tspan><tspan font-size="12" dy="-3">H</tspan><tspan font-size="9" dy="3">1</tspan><tspan font-size="12" dy="-3"> + G</tspan><tspan font-size="9" dy="3">1</tspan><tspan font-size="12" dy="-3">G</tspan><tspan font-size="9" dy="3">2</tspan><tspan font-size="12" dy="-3">H</tspan><tspan font-size="9" dy="3">2</tspan></text>
  <line x1="390" y1="340" x2="430" y2="340" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="436" y="345" fill="#8a8a8a">Y</text>
</svg>
