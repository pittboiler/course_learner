<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">A pole&#8211;zero map is a picture of the plant: every &#215; hands the response one mode.</text>

  <!-- stable region shading -->
  <rect x="80" y="70" width="220" height="265" fill="#8a8a8a" opacity="0.10"/>
  <text x="90" y="90" fill="#8a8a8a" font-size="12" font-style="italic">stable region: Re{s} &lt; 0</text>

  <!-- real axis -->
  <line x1="80" y1="215" x2="425" y2="215" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="425,215 415,210 415,220" fill="#8a8a8a"/>
  <text x="430" y="220" fill="#8a8a8a">&#963;</text>

  <!-- imaginary axis -->
  <line x1="300" y1="340" x2="300" y2="62" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="300,62 295,72 305,72" fill="#8a8a8a"/>
  <text x="306" y="62" fill="#8a8a8a">j&#969;</text>

  <!-- real axis ticks -->
  <line x1="120" y1="211" x2="120" y2="219" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="180" y1="211" x2="180" y2="219" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="240" y1="211" x2="240" y2="219" stroke="#8a8a8a" stroke-width="1"/>
  <text x="113" y="234" fill="#8a8a8a" font-size="12">&#8722;3</text>
  <text x="173" y="234" fill="#8a8a8a" font-size="12">&#8722;2</text>
  <text x="246" y="234" fill="#8a8a8a" font-size="12">&#8722;1</text>

  <!-- imaginary axis ticks -->
  <line x1="296" y1="170" x2="304" y2="170" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="296" y1="125" x2="304" y2="125" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="296" y1="305" x2="304" y2="305" stroke="#8a8a8a" stroke-width="1"/>
  <text x="308" y="174" fill="#8a8a8a" font-size="12">j1</text>
  <text x="308" y="122" fill="#8a8a8a" font-size="12">j2</text>
  <text x="308" y="309" fill="#8a8a8a" font-size="12">&#8722;j2</text>

  <!-- poles: coral crosses -->
  <line x1="232" y1="207" x2="248" y2="223" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="232" y1="223" x2="248" y2="207" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="232" y1="117" x2="248" y2="133" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="232" y1="133" x2="248" y2="117" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="232" y1="297" x2="248" y2="313" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="232" y1="313" x2="248" y2="297" stroke="#e0645c" stroke-width="2.5"/>

  <!-- zero: blue circle -->
  <circle cx="120" cy="215" r="7" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="104" y="196" fill="#4a90d9" font-size="12">zero</text>

  <!-- ghost unstable pole -->
  <line x1="352" y1="207" x2="368" y2="223" stroke="#e0645c" stroke-width="2" stroke-dasharray="3 3" opacity="0.75"/>
  <line x1="352" y1="223" x2="368" y2="207" stroke="#e0645c" stroke-width="2" stroke-dasharray="3 3" opacity="0.75"/>
  <text x="330" y="190" fill="#e0645c" font-size="12" opacity="0.85">unstable half</text>

  <!-- plant label -->
  <text x="84" y="362" fill="#8a8a8a" font-size="13">G(s) = 2(s + 3) / [ (s + 1)(s&#178; + 2s + 5) ]</text>
  <text x="84" y="380" fill="#8a8a8a" font-size="12" font-style="italic">order 3 &#183; poles &#8722;1, &#8722;1 &#177; j2 &#183; zero &#8722;3 &#183; G(0) = 6/5</text>

  <!-- ===== inset waveforms ===== -->

  <!-- A: damped ring -->
  <text x="458" y="88" fill="#8a8a8a" font-size="12">poles at &#8722;1 &#177; j2  &#8594;  damped ring</text>
  <line x1="458" y1="127" x2="694" y2="127" stroke="#8a8a8a" stroke-width="1"/>
  <text x="698" y="131" fill="#8a8a8a" font-size="11">t</text>
  <path d="M 460 99.0 L 471.5 105.9 L 483 113.9 L 494.5 121.4 L 506 127.4 L 517.5 131.3 L 529 133.2 L 540.5 133.5 L 552 132.6 L 563.5 131.1 L 575 129.5 L 586.5 128.0 L 598 126.8 L 609.5 126.0 L 621 125.7 L 632.5 125.7 L 644 125.9 L 655.5 126.2 L 667 126.5 L 678.5 126.8 L 690 127.1"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>

  <!-- B: pure decay -->
  <text x="458" y="175" fill="#8a8a8a" font-size="12">pole at &#8722;1  &#8594;  pure decay</text>
  <line x1="458" y1="212" x2="694" y2="212" stroke="#8a8a8a" stroke-width="1"/>
  <text x="698" y="216" fill="#8a8a8a" font-size="11">t</text>
  <path d="M 460 184 L 483 193.2 L 506 199.4 L 529 203.6 L 552 206.3 L 575 208.2 L 598 209.5 L 621 210.3 L 644 210.9 L 667 211.2 L 690 211.5"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>

  <!-- C: runaway -->
  <text x="458" y="262" fill="#8a8a8a" font-size="12">a pole at +1  &#8594;  runaway growth</text>
  <line x1="458" y1="310" x2="694" y2="310" stroke="#8a8a8a" stroke-width="1"/>
  <text x="698" y="314" fill="#8a8a8a" font-size="11">t</text>
  <path d="M 460 305.4 L 483 304.4 L 506 303.1 L 529 301.6 L 552 299.8 L 575 297.5 L 598 294.7 L 621 291.3 L 644 287.2 L 667 282.2 L 690 276.0"
        fill="none" stroke="#e0645c" stroke-width="2.5" stroke-dasharray="5 3"/>

  <!-- zero note -->
  <text x="458" y="352" fill="#4a90d9" font-size="12">the zero at &#8722;3 draws no waveform &#8212;</text>
  <text x="458" y="370" fill="#4a90d9" font-size="12">it only reweights the three above.</text>
</svg>
