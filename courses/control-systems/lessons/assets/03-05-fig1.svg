<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">The Nyquist contour: up the jω axis, indented at s = 0, closed by a huge clockwise arc.</text>

  <!-- shaded enclosed region -->
  <path d="M 250 360 L 250 222 A 12 12 0 0 0 250 198 L 250 60 A 150 150 0 0 1 250 360 Z"
        fill="#4a90d9" opacity="0.09"/>

  <!-- real axis -->
  <line x1="60" y1="210" x2="486" y2="210" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="488,210 478,205 478,215" fill="#8a8a8a"/>
  <text x="492" y="215" fill="#8a8a8a">&#963;</text>

  <!-- imaginary axis -->
  <line x1="250" y1="404" x2="250" y2="46" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="250,44 245,54 255,54" fill="#8a8a8a"/>
  <text x="228" y="54" fill="#8a8a8a">j&#969;</text>

  <text x="66" y="60" fill="#8a8a8a" font-style="italic">s-plane</text>

  <!-- the contour -->
  <path d="M 250 360 L 250 222" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <path d="M 250 222 A 12 12 0 0 0 250 198" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <path d="M 250 198 L 250 60" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <path d="M 250 60 A 150 150 0 0 1 250 360" fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- direction arrowheads -->
  <polygon points="250,290 244,302 256,302" fill="#4a90d9"/>
  <polygon points="250,124 244,136 256,136" fill="#4a90d9"/>
  <polygon points="400,222 394,210 406,210" fill="#4a90d9"/>
  <polygon points="356,316 367.3,311.7 360.3,304.7" fill="#4a90d9"/>

  <!-- open-loop poles, left half-plane / origin -->
  <line x1="245" y1="205" x2="255" y2="215" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="255" y1="205" x2="245" y2="215" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="175" y1="205" x2="185" y2="215" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="185" y1="205" x2="175" y2="215" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="105" y1="205" x2="115" y2="215" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="115" y1="205" x2="105" y2="215" stroke="#8a8a8a" stroke-width="2"/>
  <text x="180" y="238" fill="#8a8a8a" text-anchor="middle" font-size="12">&#8722;2</text>
  <text x="110" y="238" fill="#8a8a8a" text-anchor="middle" font-size="12">&#8722;4</text>

  <!-- an RHP open-loop pole -->
  <line x1="325" y1="135" x2="337" y2="147" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="337" y1="135" x2="325" y2="147" stroke="#e0645c" stroke-width="2.5"/>
  <text x="346" y="138" fill="#e0645c" font-size="12">an open-loop pole in here</text>
  <text x="346" y="154" fill="#e0645c" font-size="12">is what P counts</text>

  <!-- indentation callout -->
  <line x1="268" y1="206" x2="326" y2="192" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="330" y="188" fill="#e0645c" font-size="12">indent right, radius &#949; &#8594; 0:</text>
  <text x="330" y="204" fill="#e0645c" font-size="12">the pole at s = 0 is left OUT</text>

  <!-- radius callout -->
  <line x1="250" y1="210" x2="356" y2="104" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="404" y="94" fill="#8a8a8a" font-size="12">R &#8594; &#8734;</text>

  <text x="66" y="330" fill="#8a8a8a" font-size="12">Travelling this way, the shaded</text>
  <text x="66" y="346" fill="#8a8a8a" font-size="12">interior stays on your RIGHT:</text>
  <text x="66" y="362" fill="#8a8a8a" font-size="12">the contour is CLOCKWISE.</text>

  <text x="30" y="424" fill="#8a8a8a" font-size="12">Every closed-loop pole with Re s &gt; 0 &#8212; i.e. every RHP zero of 1 + L(s) &#8212; is caught inside the shaded region.</text>
</svg>
