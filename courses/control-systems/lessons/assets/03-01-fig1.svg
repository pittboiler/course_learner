  <line x1="366.1" y1="228" x2="366.1" y2="250" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="366" y="264" fill="#e0645c" text-anchor="middle" font-size="12">breakaway &#8722;0.845, K = 3.08</text>

  <!-- jw crossings -->
  <circle cx="405" cy="91.9" r="5" fill="#e0645c"/>
  <circle cx="405" cy="352.1" r="5" fill="#e0645c"/>
  <text x="416" y="86" fill="#e0645c" font-size="12">K = 48</text>
  <text x="416" y="102" fill="#e0645c" font-size="12">&#969; = 2.83</text>
  <text x="416" y="356" fill="#e0645c" font-size="12">&#969; = &#8722;2.83</text>

  <text x="30" y="416" fill="#8a8a8a" font-size="11">&#215; = open&#8211;loop pole (K = 0) &#183; dashed = asymptotes &#183; arrows = increasing K</text>
</svg>
