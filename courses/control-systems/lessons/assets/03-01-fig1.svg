  <line x1="399" y1="228" x2="411" y2="216" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="307" y1="216" x2="319" y2="228" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="307" y1="228" x2="319" y2="216" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="215" y1="216" x2="227" y2="228" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="215" y1="228" x2="227" y2="216" stroke="#4a90d9" stroke-width="2.5"/>

