<svg viewBox="0 0 500 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="18" y="22" fill="#8a8a8a" font-style="italic" font-size="12">Branches leave the poles at K = 0, break away at &#8722;0.845, and cross j&#969; at K = 48.</text>

