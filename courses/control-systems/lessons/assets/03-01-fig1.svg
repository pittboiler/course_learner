  <text x="313" y="241" fill="#8a8a8a" text-anchor="middle" font-size="12">&#8722;2</text>
  <text x="221" y="241" fill="#8a8a8a" text-anchor="middle" font-size="12">&#8722;4</text>
  <text x="129" y="241" fill="#8a8a8a" text-anchor="middle" font-size="12">&#8722;6</text>

  <!-- asymptotes from the centroid at -2 -->
  <line x1="313" y1="222" x2="407.3" y2="58.7" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="7 5"/>
  <line x1="313" y1="222" x2="407.3" y2="385.3" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="7 5"/>
