  <path d="M 366.1 222 L 366.4 230.8 L 366.8 237.0 L 368.2 248.0 L 370.5 260.1 L 372.8 269.6 L 377.4 285.1 L 382.0 298.3 L 386.6 310.2 L 391.2 321.4 L 395.8 332.0 L 400.4 342.2 L 405.0 352.1 L 409.6 361.8 L 414.2 371.2 L 417.9 378.6 L 421.1 385.1"
