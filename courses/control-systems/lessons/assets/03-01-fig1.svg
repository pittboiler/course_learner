  <line x1="405" y1="398" x2="405" y2="48" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="405,48 400,58 410,58" fill="#8a8a8a"/>
  <text x="380" y="46" fill="#8a8a8a">j&#969;</text>

