<svg viewBox="0 0 460 205" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="bc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0645c"/>
    </marker>
  </defs>

  <text x="20" y="20" fill="#8a8a8a" font-style="italic" font-size="12">Same y either way: pushing the junction back past G costs a 1/G.</text>

  <!-- ===== left: junction after G ===== -->
  <text x="18" y="100" fill="#8a8a8a">u</text>
  <line x1="30" y1="95" x2="52" y2="95" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#bg)"/>
  <rect x="54" y="77" width="42" height="36" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="75" y="100" text-anchor="middle" fill="#4a90d9">G</text>
  <line x1="96" y1="95" x2="120" y2="95" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#bg)"/>
  <circle cx="134" cy="95" r="12" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="116" y="88" fill="#8a8a8a" font-size="11">+</text>
  <text x="116" y="118" fill="#8a8a8a" font-size="11">+</text>
  <line x1="146" y1="95" x2="186" y2="95" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#bg)"/>
  <text x="192" y="100" fill="#8a8a8a">y</text>
  <text x="129" y="168" fill="#e0645c">w</text>
  <line x1="134" y1="152" x2="134" y2="110" stroke="#e0645c" stroke-width="1.5" marker-end="url(#bc)"/>

  <text x="222" y="102" text-anchor="middle" fill="#8a8a8a" font-size="20">&#8801;</text>

  <!-- ===== right: junction before G, with 1/G ===== -->
  <text x="248" y="100" fill="#8a8a8a">u</text>
  <line x1="260" y1="95" x2="282" y2="95" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#bg)"/>
  <circle cx="296" cy="95" r="12" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="278" y="88" fill="#8a8a8a" font-size="11">+</text>
  <text x="278" y="118" fill="#8a8a8a" font-size="11">+</text>
  <line x1="308" y1="95" x2="332" y2="95" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#bg)"/>
  <rect x="334" y="77" width="42" height="36" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="355" y="100" text-anchor="middle" fill="#4a90d9">G</text>
  <line x1="376" y1="95" x2="416" y2="95" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#bg)"/>
  <text x="422" y="100" fill="#8a8a8a">y</text>

  <rect x="274" y="124" width="44" height="32" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="296" y="145" text-anchor="middle" fill="#e0645c">1/G</text>
  <line x1="296" y1="124" x2="296" y2="110" stroke="#e0645c" stroke-width="1.5" marker-end="url(#bc)"/>
  <line x1="296" y1="180" x2="296" y2="158" stroke="#e0645c" stroke-width="1.5" marker-end="url(#bc)"/>
  <text x="291" y="196" fill="#e0645c">w</text>
</svg>
