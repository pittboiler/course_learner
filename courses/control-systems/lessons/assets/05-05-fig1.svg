<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="32" y="22" fill="#8a8a8a" font-style="italic">z = e^(sT) folds the s-plane onto the z-plane: the left half becomes the unit disc, one strip at a time.</text>

  <!-- ================= LEFT: s-plane ================= -->
  <text x="138" y="50" fill="#8a8a8a" font-size="15">s-plane</text>

  <!-- left half-plane shading -->
  <rect x="55" y="70" width="120" height="260" fill="#4a90d9" opacity="0.10"/>
  <!-- primary strip -->
  <rect x="55" y="160" width="240" height="80" fill="#e0645c" opacity="0.13"/>

  <!-- adjacent strip boundaries -->
  <line x1="55" y1="80" x2="295" y2="80" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="55" y1="320" x2="295" y2="320" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- primary strip boundaries -->
  <line x1="55" y1="160" x2="295" y2="160" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="55" y1="240" x2="295" y2="240" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- axes -->
  <line x1="55" y1="200" x2="295" y2="200" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="295,200 285,195 285,205" fill="#8a8a8a"/>
  <text x="298" y="220" fill="#8a8a8a">&#963;</text>
  <line x1="175" y1="335" x2="175" y2="66" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="175,66 170,76 180,76" fill="#8a8a8a"/>
  <text x="156" y="62" fill="#8a8a8a">j&#969;</text>

  <!-- the jw segment that wraps once around the circle -->
  <line x1="175" y1="160" x2="175" y2="240" stroke="#e0645c" stroke-width="4"/>
  <text x="182" y="155" fill="#e0645c" font-size="12">+j&#960;/T</text>
  <text x="182" y="256" fill="#e0645c" font-size="12">&#8722;j&#960;/T</text>

  <!-- strip height marker -->
  <line x1="66" y1="160" x2="66" y2="240" stroke="#e0645c" stroke-width="1.2"/>
  <polygon points="66,160 62,169 70,169" fill="#e0645c"/>
  <polygon points="66,240 62,231 70,231" fill="#e0645c"/>
  <text x="72" y="186" fill="#e0645c" font-size="11">2&#960;/T</text>

  <text x="62" y="110" fill="#4a90d9" font-size="12">Re s &#60; 0</text>
  <text x="62" y="126" fill="#4a90d9" font-size="12">(stable)</text>

  <!-- a pole -->
  <line x1="122" y1="176" x2="134" y2="188" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="134" y1="176" x2="122" y2="188" stroke="#e0645c" stroke-width="2.5"/>
  <text x="92" y="180" fill="#e0645c" font-size="12">pole</text>

  <!-- ================= mapping arrow ================= -->
  <line x1="312" y1="200" x2="398" y2="200" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="398,200 388,195 388,205" fill="#8a8a8a"/>
  <text x="316" y="188" fill="#8a8a8a" font-size="13">z = e<tspan font-size="10" dy="-6">sT</tspan></text>

  <!-- ================= RIGHT: z-plane ================= -->
  <text x="470" y="50" fill="#8a8a8a" font-size="15">z-plane</text>

  <circle cx="500" cy="200" r="78" fill="#4a90d9" opacity="0.10"/>
  <circle cx="500" cy="200" r="78" fill="none" stroke="#e0645c" stroke-width="3"/>

  <line x1="405" y1="200" x2="605" y2="200" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="605,200 595,195 595,205" fill="#8a8a8a"/>
  <text x="580" y="222" fill="#8a8a8a" font-size="12">Re z</text>
  <line x1="500" y1="295" x2="500" y2="102" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="500,102 495,112 505,112" fill="#8a8a8a"/>
  <text x="508" y="106" fill="#8a8a8a" font-size="12">Im z</text>

  <text x="560" y="132" fill="#e0645c" font-size="12">|z| = 1</text>
  <text x="450" y="252" fill="#4a90d9" font-size="12">inside = stable</text>

  <!-- image of the pole -->
  <line x1="529" y1="169" x2="541" y2="181" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="541" y1="169" x2="529" y2="181" stroke="#e0645c" stroke-width="2.5"/>
  <text x="514" y="158" fill="#e0645c" font-size="12">image</text>

  <!-- footer -->
  <text x="32" y="362" fill="#8a8a8a" font-style="italic" font-size="12">Each strip of height 2&#960;/T maps onto the whole z-plane &#8212; the map is many-to-one, and that is exactly aliasing.</text>
</svg>
