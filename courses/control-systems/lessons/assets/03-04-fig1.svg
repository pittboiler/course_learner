<svg viewBox="0 0 620 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Both margins are distances to the critical point &#8722;1. Read them at DIFFERENT frequencies. Here L(s) = 12/(s(s+2)(s+4)).</text>

  <!-- ============ MAGNITUDE PLOT ============ -->
  <line x1="70" y1="70" x2="70" y2="210" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="70" y1="210" x2="500" y2="210" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- dB gridlines -->
  <line x1="70" y1="78.2" x2="500" y2="78.2" stroke="#8a8a8a" stroke-width="0.5" opacity="0.4"/>
  <line x1="70" y1="144.1" x2="500" y2="144.1" stroke="#8a8a8a" stroke-width="0.5" opacity="0.4"/>
  <line x1="70" y1="177.1" x2="500" y2="177.1" stroke="#8a8a8a" stroke-width="0.5" opacity="0.4"/>
  <text x="38" y="82" fill="#8a8a8a">+20</text>
  <text x="47" y="148" fill="#8a8a8a">&#8722;20</text>
  <text x="47" y="181" fill="#8a8a8a">&#8722;40</text>
  <text x="47" y="214" fill="#8a8a8a">&#8722;60</text>

  <!-- the 0 dB line: the line that defines gain crossover -->
  <line x1="70" y1="111.2" x2="500" y2="111.2" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="50" y="108" fill="#8a8a8a">0</text>
  <text x="505" y="115" fill="#8a8a8a">0 dB</text>
  <text x="20" y="140" fill="#8a8a8a" transform="rotate(-90 20 140)">|L| in dB</text>

  <!-- magnitude curve -->
  <path d="M 80.0 72.5 L 109.9 78.3 L 131.2 82.4 L 161.1 88.4 L 198.8 96.0 L 223.7 101.3 L 250.0 107.4 L 264.9 111.2 L 279.9 115.3 L 301.2 121.8 L 326.8 131.0 L 342.5 137.4 L 368.8 149.3 L 393.7 161.7 L 420.0 175.8 L 444.8 189.6 L 471.2 204.6"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- ============ PHASE PLOT ============ -->
  <line x1="70" y1="270" x2="70" y2="400" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="70" y1="400" x2="500" y2="400" stroke="#8a8a8a" stroke-width="1.5"/>

  <line x1="70" y1="273.5" x2="500" y2="273.5" stroke="#8a8a8a" stroke-width="0.5" opacity="0.4"/>
  <text x="40" y="277" fill="#8a8a8a">&#8722;90&#176;</text>
  <text x="34" y="404" fill="#8a8a8a">&#8722;270&#176;</text>
  <text x="20" y="345" fill="#8a8a8a" transform="rotate(-90 20 345)">&#8736;L</text>

  <!-- the -180 line: the line that defines phase crossover -->
  <line x1="70" y1="336.8" x2="500" y2="336.8" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="34" y="333" fill="#8a8a8a">&#8722;180&#176;</text>
  <text x="505" y="340" fill="#8a8a8a">&#8722;180&#176;</text>

  <!-- phase curve -->
  <path d="M 80.0 276.5 L 109.9 278.0 L 131.2 279.5 L 161.1 282.5 L 198.8 288.4 L 223.7 294.0 L 250.0 302.0 L 264.9 307.6 L 279.9 313.9 L 301.2 323.8 L 326.8 336.8 L 342.5 344.8 L 368.8 357.5 L 393.7 367.9 L 420.0 376.7 L 444.8 383.1 L 471.2 388.0"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- frequency ticks and labels on the bottom axis -->
  <line x1="80" y1="400" x2="80" y2="406" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="250" y1="400" x2="250" y2="406" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="420" y1="400" x2="420" y2="406" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="70" y="420" fill="#8a8a8a">0.1</text>
  <text x="245" y="420" fill="#8a8a8a">1</text>
  <text x="413" y="420" fill="#8a8a8a">10</text>
  <text x="440" y="420" fill="#8a8a8a">&#969; (rad/s, log scale)</text>

  <!-- ============ THE TWO CROSSOVERS ============ -->
  <!-- gain crossover: vertical from 0 dB point down through the phase plot -->
  <line x1="264.9" y1="111.2" x2="264.9" y2="307.6" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="264.9" cy="111.2" r="4" fill="#e0645c"/>
  <circle cx="264.9" cy="307.6" r="4" fill="#e0645c"/>
  <text x="178" y="88" fill="#e0645c">&#969;_gc = 1.22</text>
  <text x="207" y="252" fill="#e0645c">|L| = 1 here</text>

  <!-- phase crossover: vertical from -180 point up through the magnitude plot -->
  <line x1="326.8" y1="131.0" x2="326.8" y2="336.8" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="326.8" cy="131.0" r="4" fill="#e0645c"/>
  <circle cx="326.8" cy="336.8" r="4" fill="#e0645c"/>
  <text x="336" y="252" fill="#e0645c">&#969;_pc = 2.83</text>
  <text x="336" y="268" fill="#e0645c">&#8736;L = &#8722;180&#176; here</text>

  <!-- GAIN MARGIN: on the magnitude plot, at the phase crossover -->
  <line x1="326.8" y1="111.2" x2="326.8" y2="131.0" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="326.8,131.0 322.8,122.5 330.8,122.5" fill="#e0645c"/>
  <polygon points="326.8,111.2 322.8,119.7 330.8,119.7" fill="#e0645c"/>
  <text x="340" y="127" fill="#e0645c">GM = 12.0 dB</text>

  <!-- PHASE MARGIN: on the phase plot, at the gain crossover -->
  <line x1="264.9" y1="336.8" x2="264.9" y2="307.6" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="264.9,307.6 260.9,316.1 268.9,316.1" fill="#e0645c"/>
  <polygon points="264.9,336.8 260.9,328.3 268.9,328.3" fill="#e0645c"/>
  <text x="120" y="326" fill="#e0645c">PM = 41.5&#176;</text>
</svg>
