<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="24" y="22" fill="#8a8a8a" font-style="italic">Stability is a place: every closed-loop pole must live left of the jω axis, and gain moves them.</text>

  <!-- ================= PANEL A: the rule ================= -->
  <text x="34" y="52" fill="#8a8a8a" font-style="italic">The rule</text>

  <rect x="34" y="88" width="194" height="214" fill="#4a90d9" opacity="0.10"/>
  <rect x="228" y="88" width="94" height="214" fill="#e0645c" opacity="0.08"/>

  <!-- real axis -->
  <line x1="34" y1="195" x2="330" y2="195" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="332,195 322,190 322,200" fill="#8a8a8a"/>
  <text x="300" y="316" fill="#8a8a8a">&#963; = Re(s)</text>

  <!-- imaginary axis: the boundary -->
  <line x1="228" y1="86" x2="228" y2="304" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="228,84 223,94 233,94" fill="#e0645c"/>
  <text x="234" y="82" fill="#e0645c">j&#969;</text>
  <text x="222" y="292" fill="#e0645c" font-size="12" transform="rotate(-90 222 292)">marginal</text>

  <!-- a stable pole set -->
  <line x1="89" y1="149" x2="101" y2="161" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="89" y1="161" x2="101" y2="149" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="89" y1="229" x2="101" y2="241" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="89" y1="241" x2="101" y2="229" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="144" y1="189" x2="156" y2="201" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="144" y1="201" x2="156" y2="189" stroke="#8a8a8a" stroke-width="2"/>

  <text x="52" y="120" fill="#4a90d9">STABLE</text>
  <text x="52" y="274" fill="#8a8a8a" font-size="12">poles here = BIBO stable</text>

  <!-- an unstable pole -->
  <line x1="266" y1="154" x2="278" y2="166" stroke="#e0645c" stroke-width="2"/>
  <line x1="266" y1="166" x2="278" y2="154" stroke="#e0645c" stroke-width="2"/>

  <text x="238" y="120" fill="#e0645c">UNSTABLE</text>
  <text x="238" y="274" fill="#e0645c" font-size="12">one is enough</text>

  <!-- ================= PANEL B: the example ================= -->
  <text x="396" y="52" fill="#8a8a8a" font-style="italic">s&#179; + 6s&#178; + 8s + K = 0, three gains</text>

  <rect x="412" y="86" width="203" height="218" fill="#4a90d9" opacity="0.08"/>
  <rect x="615" y="86" width="43" height="218" fill="#e0645c" opacity="0.08"/>

  <!-- real axis -->
  <line x1="412" y1="195" x2="662" y2="195" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="664,195 654,190 654,200" fill="#8a8a8a"/>
  <!-- ticks -->
  <line x1="453" y1="191" x2="453" y2="199" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="507" y1="191" x2="507" y2="199" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="561" y1="191" x2="561" y2="199" stroke="#8a8a8a" stroke-width="1"/>
  <text x="445" y="316" fill="#8a8a8a" font-size="12">&#8722;6</text>
  <text x="499" y="316" fill="#8a8a8a" font-size="12">&#8722;4</text>
  <text x="553" y="316" fill="#8a8a8a" font-size="12">&#8722;2</text>
  <text x="619" y="316" fill="#8a8a8a" font-size="12">0</text>

  <!-- imaginary axis -->
  <line x1="615" y1="84" x2="615" y2="306" stroke="#e0645c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="588" y="80" fill="#8a8a8a">j&#969;</text>

  <!-- K = 10, grey -->
  <line x1="480.5" y1="189" x2="492.5" y2="201" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="480.5" y1="201" x2="492.5" y2="189" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="592.3" y1="153.6" x2="604.3" y2="165.6" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="592.3" y1="165.6" x2="604.3" y2="153.6" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="592.3" y1="224.4" x2="604.3" y2="236.4" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="592.3" y1="236.4" x2="604.3" y2="224.4" stroke="#8a8a8a" stroke-width="2"/>

  <!-- K = 48, blue -->
  <line x1="447" y1="189" x2="459" y2="201" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="447" y1="201" x2="459" y2="189" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="609" y1="112.6" x2="621" y2="124.6" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="609" y1="124.6" x2="621" y2="112.6" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="609" y1="265.4" x2="621" y2="277.4" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="609" y1="277.4" x2="621" y2="265.4" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="626" y="140" fill="#4a90d9" font-size="12">j2.83</text>

  <!-- K = 100, coral -->
  <line x1="421.9" y1="189" x2="433.9" y2="201" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="421.9" y1="201" x2="433.9" y2="189" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="621.5" y1="87.2" x2="633.5" y2="99.2" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="621.5" y1="99.2" x2="633.5" y2="87.2" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="621.5" y1="290.8" x2="633.5" y2="302.8" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="621.5" y1="302.8" x2="633.5" y2="290.8" stroke="#e0645c" stroke-width="2.5"/>

  <!-- migration arc for the upper complex pole -->
  <path d="M 594 158 Q 600 132 610 116 Q 617 104 622 96" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <polygon points="624,92 616,97 622,101" fill="#8a8a8a"/>
  <text x="536" y="122" fill="#8a8a8a" font-size="12" font-style="italic">K increases</text>

  <!-- legend -->
  <line x1="396" y1="65" x2="406" y2="75" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="396" y1="75" x2="406" y2="65" stroke="#8a8a8a" stroke-width="2"/>
  <text x="412" y="75" fill="#8a8a8a" font-size="12">K = 10 &#183; stable</text>
  <line x1="396" y1="83" x2="406" y2="93" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="396" y1="93" x2="406" y2="83" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="412" y="93" fill="#4a90d9" font-size="12">K = 48 &#183; on the axis</text>
  <line x1="396" y1="101" x2="406" y2="111" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="396" y1="111" x2="406" y2="101" stroke="#e0645c" stroke-width="2.5"/>
  <text x="412" y="111" fill="#e0645c" font-size="12">K = 100 &#183; unstable</text>
</svg>
