<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Same ramp input, three plants: the vertical gap between reference and output is the error.</text>

  <!-- axes -->
  <line x1="70" y1="290" x2="626" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="626,290 616,285.5 616,294.5" fill="#8a8a8a"/>
  <text x="630" y="295" fill="#8a8a8a">t</text>
  <line x1="70" y1="290" x2="70" y2="62" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,62 65.5,72 74.5,72" fill="#8a8a8a"/>
  <text x="50" y="70" fill="#8a8a8a">y</text>
  <text x="56" y="306" fill="#8a8a8a">0</text>

  <!-- type 2: rides the reference -->
  <path d="M 70 290 L 110 278.1 L 150 263.4 L 190 248.2 L 230 233.3 L 270 218.7 L 310 204.1 L 350 189.7 L 400 171.7 L 450 153.8 L 500 135.8 L 550 117.9 L 600 100.0"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- type 1: constant lag -->
  <path d="M 70 290 L 110 280.6 L 150 274.1 L 190 266.2 L 230 256.3 L 270 244.6 L 310 231.9 L 350 218.5 L 400 201.2 L 450 183.5 L 500 165.7 L 550 147.9 L 600 130.0"
        fill="none" stroke="#4a90d9" stroke-width="2.5" opacity="0.85"/>

  <!-- type 0: shallower slope, gap grows forever -->
  <path d="M 70 290 L 110 289.3 L 150 285.8 L 190 279.5 L 230 271.3 L 270 261.9 L 310 252.1 L 350 242.3 L 400 230.3 L 450 218.8 L 500 207.7 L 550 197.0 L 600 186.5"
        fill="none" stroke="#4a90d9" stroke-width="2.5" stroke-dasharray="8 5" opacity="0.7"/>

  <!-- reference ramp, drawn last so its dashes read on top of the type 2 curve -->
  <line x1="70" y1="290" x2="600" y2="100" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="132" y="200" fill="#8a8a8a">r(t) = t   (reference)</text>
  <line x1="252" y1="196" x2="300" y2="196" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="300" y1="196" x2="316" y2="206" stroke="#8a8a8a" stroke-width="1"/>

  <!-- coral marker: the frozen 1/Kv gap of the type 1 system -->
  <line x1="520" y1="128.7" x2="520" y2="158.7" stroke="#e0645c" stroke-width="2"/>
  <polygon points="520,128.7 516.5,136 523.5,136" fill="#e0645c"/>
  <polygon points="520,158.7 516.5,151.4 523.5,151.4" fill="#e0645c"/>
  <line x1="498" y1="117" x2="516" y2="131" stroke="#e0645c" stroke-width="1"/>
  <text x="494" y="114" fill="#e0645c" text-anchor="end">1/K</text>
  <text x="495" y="118" fill="#e0645c" font-size="10">v</text>

  <!-- right-hand curve labels -->
  <text x="606" y="104" fill="#4a90d9">type 2</text>
  <text x="606" y="134" fill="#4a90d9">type 1</text>
  <text x="606" y="190" fill="#4a90d9">type 0</text>

  <!-- bottom annotation -->
  <text x="30" y="330" fill="#8a8a8a" font-style="italic">type 0: gap widens forever &#183;  type 1: gap frozen at 1/Kv &#183;  type 2: gap closes to zero</text>
</svg>
