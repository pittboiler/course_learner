<svg viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="30" y="20" fill="#8a8a8a" font-style="italic">Nyquist of L(s) = 12/[s(s+2)(s+4)]: never wraps −1 and no RHP poles, so it is stable.</text>

  <!-- unit circle -->
  <circle cx="290" cy="250" r="105" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- axes -->
  <line x1="128" y1="250" x2="352" y2="250" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="354,250 344,245 344,255" fill="#8a8a8a"/>
  <text x="358" y="255" fill="#8a8a8a" font-size="12">Re L</text>
  <line x1="290" y1="424" x2="290" y2="76" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="290,74 285,84 295,84" fill="#8a8a8a"/>
  <text x="298" y="84" fill="#8a8a8a" font-size="12">Im L</text>

  <!-- low-frequency asymptote -->
  <line x1="171.9" y1="330" x2="171.9" y2="424" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- mirror image, omega &lt; 0 -->
  <path d="M 190.0 84.7 L 196.5 125.5 L 201.1 146.2 L 205.7 163.3 L 211.4 180.5 L 217.2 194.4 L 223.7 207.7 L 235.7 226.1 L 242.75 234.25 L 249.0 240.2 L 256.9 246.1 L 263.8 250.0 L 269.8 252.4 L 278.2 253.9 L 283.6 253.6 L 287.8 252.1 L 289.4 251.0 L 290 250"
        fill="none" stroke="#4a90d9" stroke-width="2" stroke-dasharray="6 5" opacity="0.75"/>
  <polygon points="223.7,207.7 233.9,214.2 225.5,219.6" fill="#4a90d9" opacity="0.75"/>

  <!-- the plot, omega &gt; 0 -->
  <path d="M 190.0 415.3 L 196.5 374.5 L 201.1 353.8 L 205.7 336.7 L 211.4 319.5 L 217.2 305.6 L 223.7 292.3 L 235.7 273.9 L 242.75 265.75 L 249.0 259.8 L 256.9 253.9 L 263.8 250.0 L 269.8 247.6 L 278.2 246.1 L 283.6 246.4 L 287.8 247.9 L 289.4 249.0 L 290 250"
        fill="none" stroke="#4a90d9" stroke-width="2.8"/>
  <polygon points="235.7,273.9 233.9,285.8 225.5,280.4" fill="#4a90d9"/>
  <polygon points="190,415.3 196.6,405.2 186.8,403.6" fill="#4a90d9"/>

  <!-- phase margin: radius to the unit-circle crossing, plus the angle arc -->
  <line x1="290" y1="250" x2="211.4" y2="319.6" stroke="#e0645c" stroke-width="1.4"/>
  <path d="M 185 250 A 105 105 0 0 0 211.4 319.6" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="196" y="296" fill="#e0645c" font-size="13">&#966;m</text>
  <circle cx="211.4" cy="319.6" r="3.5" fill="#e0645c"/>

  <!-- critical point and the real-axis crossing -->
  <circle cx="185" cy="250" r="5" fill="#e0645c"/>
  <text x="172" y="272" fill="#e0645c" font-size="13">&#8722;1</text>
  <circle cx="263.8" cy="250" r="3.5" fill="#e0645c"/>
  <text x="258" y="272" fill="#e0645c" font-size="12">&#8722;0.25</text>

  <!-- gain-margin span, drawn just above the real axis -->
  <line x1="185" y1="234" x2="263.8" y2="234" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="185,234 194,230 194,238" fill="#e0645c"/>
  <polygon points="263.8,234 254.8,230 254.8,238" fill="#e0645c"/>
  <text x="224" y="226" fill="#e0645c" text-anchor="middle" font-size="12">gain margin</text>

  <!-- legend -->
  <line x1="402" y1="118" x2="434" y2="118" stroke="#4a90d9" stroke-width="2.8"/>
  <text x="442" y="123" fill="#8a8a8a" font-size="12">L(j&#969;) for &#969; &gt; 0</text>
  <line x1="402" y1="142" x2="434" y2="142" stroke="#4a90d9" stroke-width="2" stroke-dasharray="6 5" opacity="0.75"/>
  <text x="442" y="147" fill="#8a8a8a" font-size="12">mirror image, &#969; &lt; 0</text>
  <line x1="402" y1="166" x2="434" y2="166" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="442" y="171" fill="#8a8a8a" font-size="12">unit circle, |L| = 1</text>
  <circle cx="418" cy="190" r="5" fill="#e0645c"/>
  <text x="442" y="195" fill="#8a8a8a" font-size="12">critical point &#8722;1</text>

  <!-- readings -->
  <text x="402" y="238" fill="#8a8a8a" font-size="12">Crosses the negative real axis at &#8722;0.25,</text>
  <text x="402" y="256" fill="#8a8a8a" font-size="12">at &#969; = 2&#8730;2 &#8776; 2.83 rad/s:</text>
  <text x="414" y="274" fill="#e0645c" font-size="12">GM = 1 / 0.25 = 4 = 12 dB</text>
  <text x="402" y="302" fill="#8a8a8a" font-size="12">Crosses |L| = 1 at &#969; &#8776; 1.22 rad/s:</text>
  <text x="414" y="320" fill="#e0645c" font-size="12">&#966;m &#8776; 41.5&#176;</text>
  <text x="402" y="348" fill="#8a8a8a" font-size="12">N = 0 encirclements, P = 0 RHP poles,</text>
  <text x="402" y="366" fill="#8a8a8a" font-size="12">so Z = N + P = 0. Stable.</text>

  <text x="30" y="446" fill="#8a8a8a" font-size="12">&#969; &#8594; 0: the tail dives to &#8722;j&#8734; along Re = &#8722;3K/32 = &#8722;1.125 &#8212; left of &#8722;1, yet still no encirclement.</text>
  <text x="30" y="462" fill="#8a8a8a" font-size="12">The two infinite ends rejoin through the big arc at |L| = &#8734; generated by the s = 0 indentation.</text>
</svg>
