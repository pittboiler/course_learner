<svg viewBox="0 0 660 250" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Unity feedback with a disturbance. Only integrators UPSTREAM of where d enters can reject it.</text>

  <!-- reference in -->
  <line x1="40" y1="120" x2="90" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="90,120 81,115.5 81,124.5" fill="#8a8a8a"/>
  <text x="40" y="110" fill="#8a8a8a">R(s)</text>

  <!-- summing junction 1 -->
  <circle cx="106" cy="120" r="16" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="84" y="112" fill="#8a8a8a" font-size="15">+</text>
  <text x="86" y="146" fill="#e0645c" font-size="15">&#8722;</text>

  <!-- error to controller -->
  <line x1="122" y1="120" x2="174" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="174,120 165,115.5 165,124.5" fill="#8a8a8a"/>
  <text x="132" y="110" fill="#8a8a8a">E(s)</text>

  <!-- controller block -->
  <rect x="176" y="98" width="78" height="44" fill="#4a90d9" opacity="0.12"/>
  <rect x="176" y="98" width="78" height="44" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="215" y="125" fill="#4a90d9" text-anchor="middle">Gc(s)</text>

  <!-- controller to summing junction 2 -->
  <line x1="254" y1="120" x2="294" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="294,120 285,115.5 285,124.5" fill="#8a8a8a"/>
  <text x="256" y="110" fill="#8a8a8a">U(s)</text>

  <!-- summing junction 2 (disturbance entry) -->
  <circle cx="310" cy="120" r="16" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="286" y="146" fill="#8a8a8a" font-size="15">+</text>
  <text x="318" y="102" fill="#e0645c" font-size="15">+</text>

  <!-- disturbance in -->
  <line x1="310" y1="52" x2="310" y2="104" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="310,104 305.5,95 314.5,95" fill="#e0645c"/>
  <text x="286" y="44" fill="#e0645c">D(s)</text>

  <!-- to plant -->
  <line x1="326" y1="120" x2="366" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="366,120 357,115.5 357,124.5" fill="#8a8a8a"/>

  <!-- plant block -->
  <rect x="368" y="98" width="78" height="44" fill="#4a90d9" opacity="0.12"/>
  <rect x="368" y="98" width="78" height="44" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="407" y="125" fill="#4a90d9" text-anchor="middle">G(s)</text>

  <!-- output -->
  <line x1="446" y1="120" x2="578" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="578,120 569,115.5 569,124.5" fill="#8a8a8a"/>
  <text x="584" y="125" fill="#8a8a8a">Y(s)</text>

  <!-- feedback path -->
  <circle cx="516" cy="120" r="3.5" fill="#e0645c"/>
  <path d="M 516 120 L 516 196 L 106 196 L 106 142" fill="none" stroke="#e0645c" stroke-width="1.8"/>
  <polygon points="106,140 101.5,149 110.5,149" fill="#e0645c"/>
  <text x="300" y="214" fill="#e0645c" text-anchor="middle" font-style="italic">unity feedback (H = 1)</text>
</svg>
