<svg viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="bc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0645c"/>
    </marker>
  </defs>

  <text x="20" y="18" fill="#8a8a8a" font-style="italic" font-size="12">One 2nd&#8211;order ODE becomes two coupled 1st&#8211;order ones &#8212; and the wiring is just two integrators in a row.</text>

  <!-- panel A: the algebra -->
  <text x="20" y="48" fill="#8a8a8a" font-style="italic" font-size="11">mass&#8211;spring&#8211;damper, m = 1, b = 3, k = 2</text>

  <text x="24" y="78" fill="#4a90d9" font-size="15">d</text>
  <text x="34" y="72" fill="#4a90d9" font-size="10">2</text>
  <text x="42" y="78" fill="#4a90d9" font-size="15">x/dt</text>
  <text x="79" y="72" fill="#4a90d9" font-size="10">2</text>
  <text x="88" y="78" fill="#4a90d9" font-size="15">+ 3 dx/dt + 2x = f</text>

  <line x1="238" y1="72" x2="286" y2="72" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#bg)"/>
  <text x="230" y="60" fill="#8a8a8a" font-size="11">pick states</text>
  <text x="232" y="92" fill="#8a8a8a" font-size="11">x<tspan font-size="9" dy="3">1</tspan><tspan font-size="11" dy="-3"> = x, x</tspan><tspan font-size="9" dy="3">2</tspan><tspan font-size="11" dy="-3"> = dx/dt</tspan></text>

  <text x="300" y="66" fill="#e0645c" font-size="15">dx<tspan font-size="10" dy="3">1</tspan><tspan font-size="15" dy="-3">/dt = x</tspan><tspan font-size="10" dy="3">2</tspan></text>
  <text x="300" y="92" fill="#e0645c" font-size="15">dx<tspan font-size="10" dy="3">2</tspan><tspan font-size="15" dy="-3">/dt = &#8722;2x</tspan><tspan font-size="10" dy="3">1</tspan><tspan font-size="15" dy="-3"> &#8722; 3x</tspan><tspan font-size="10" dy="3">2</tspan><tspan font-size="15" dy="-3"> + f</tspan></text>
  <text x="300" y="112" fill="#8a8a8a" font-size="11">position (spring energy) and velocity (kinetic energy)</text>

  <line x1="20" y1="134" x2="600" y2="134" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- panel B: integrator chain -->
  <text x="20" y="156" fill="#8a8a8a" font-style="italic" font-size="11">the same two equations, wired</text>

  <text x="16" y="200" fill="#8a8a8a">f</text>
  <line x1="28" y1="195" x2="54" y2="195" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#bg)"/>

  <circle cx="68" cy="195" r="12" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="52" y="189" fill="#8a8a8a" font-size="11">+</text>
  <text x="72" y="221" fill="#8a8a8a" font-size="11">+</text>
  <line x1="80" y1="195" x2="98" y2="195" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#bg)"/>

  <circle cx="112" cy="195" r="12" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="96" y="189" fill="#8a8a8a" font-size="11">+</text>
  <text x="116" y="221" fill="#8a8a8a" font-size="11">+</text>
  <line x1="124" y1="195" x2="150" y2="195" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#bg)"/>
  <text x="120" y="172" fill="#8a8a8a" font-size="11">dx<tspan font-size="9" dy="3">2</tspan><tspan font-size="11" dy="-3">/dt</tspan></text>

  <rect x="152" y="173" width="60" height="44" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="182" y="205" text-anchor="middle" fill="#4a90d9" font-size="24">&#8747;</text>

  <line x1="212" y1="195" x2="262" y2="195" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#bg)"/>
  <circle cx="232" cy="195" r="3" fill="#e0645c"/>
  <text x="222" y="170" fill="#8a8a8a" font-size="12">x<tspan font-size="9" dy="3">2</tspan></text>

  <rect x="264" y="173" width="60" height="44" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="294" y="205" text-anchor="middle" fill="#4a90d9" font-size="24">&#8747;</text>

  <line x1="324" y1="195" x2="420" y2="195" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#bg)"/>
  <circle cx="352" cy="195" r="3" fill="#e0645c"/>
  <text x="342" y="170" fill="#8a8a8a" font-size="12">x<tspan font-size="9" dy="3">1</tspan></text>
  <text x="426" y="200" fill="#8a8a8a">y = x<tspan font-size="9" dy="3">1</tspan><tspan font-size="13" dy="-3"> = x</tspan></text>

  <!-- feedback from x2 through gain -3 -->
  <line x1="232" y1="195" x2="232" y2="247" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="232" y1="247" x2="206" y2="247" stroke="#e0645c" stroke-width="1.5" marker-end="url(#bc)"/>
  <rect x="150" y="231" width="54" height="32" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="177" y="252" text-anchor="middle" fill="#e0645c">&#8722;3</text>
  <line x1="150" y1="247" x2="112" y2="247" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="112" y1="247" x2="112" y2="211" stroke="#e0645c" stroke-width="1.5" marker-end="url(#bc)"/>
  <text x="212" y="228" fill="#8a8a8a" font-size="11">damper</text>

  <!-- feedback from x1 through gain -2 -->
  <line x1="352" y1="195" x2="352" y2="291" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="352" y1="291" x2="206" y2="291" stroke="#e0645c" stroke-width="1.5" marker-end="url(#bc)"/>
  <rect x="150" y="275" width="54" height="32" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="177" y="296" text-anchor="middle" fill="#e0645c">&#8722;2</text>
  <line x1="150" y1="291" x2="68" y2="291" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="68" y1="291" x2="68" y2="211" stroke="#e0645c" stroke-width="1.5" marker-end="url(#bc)"/>
  <text x="358" y="284" fill="#8a8a8a" font-size="11">spring</text>

  <text x="426" y="253" fill="#8a8a8a" font-size="11">The two coral gains are the</text>
  <text x="426" y="269" fill="#8a8a8a" font-size="11">bottom row of A: &#8722;2, &#8722;3.</text>
</svg>
