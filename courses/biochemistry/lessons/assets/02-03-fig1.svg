<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- legend -->
  <line x1="30" y1="14" x2="48" y2="14" stroke="#8a8a8a" stroke-width="3"/>
  <text x="52" y="18" fill="#8a8a8a">control</text>
  <line x1="120" y1="14" x2="138" y2="14" stroke="#e0645c" stroke-width="3"/>
  <text x="142" y="18" fill="#e0645c">+ inhibitor</text>

  <!-- ===================== Panel A: Competitive ===================== -->
  <text x="120" y="40" fill="#8a8a8a" text-anchor="middle" font-size="14">Competitive</text>
  <!-- x-axis -->
  <line x1="30" y1="215" x2="210" y2="215" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="210,215 200,211 200,219" fill="#8a8a8a"/>
  <text x="188" y="232" fill="#8a8a8a" font-size="11">1/[S]</text>
  <!-- y-axis -->
  <line x1="100" y1="235" x2="100" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="100,52 96,62 104,62" fill="#8a8a8a"/>
  <text x="76" y="62" fill="#8a8a8a" font-size="11">1/v</text>
  <!-- control line -->
  <line x1="40" y1="215" x2="175" y2="24" stroke="#8a8a8a" stroke-width="2.5"/>
  <!-- inhibited line -->
  <line x1="70" y1="215" x2="140" y2="17" stroke="#e0645c" stroke-width="2.5"/>
  <!-- shared y-intercept -->
  <circle cx="100" cy="130" r="3.5" fill="#8a8a8a"/>
  <!-- diagnostic -->
  <text x="120" y="256" fill="#8a8a8a" text-anchor="middle" font-size="11">meet on 1/v axis:</text>
  <text x="120" y="270" fill="#8a8a8a" text-anchor="middle" font-size="11">Vmax same, Km rises</text>

  <!-- ===================== Panel B: Uncompetitive ===================== -->
  <text x="337" y="40" fill="#8a8a8a" text-anchor="middle" font-size="14">Uncompetitive</text>
  <!-- x-axis -->
  <line x1="245" y1="215" x2="430" y2="215" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="430,215 420,211 420,219" fill="#8a8a8a"/>
  <text x="408" y="232" fill="#8a8a8a" font-size="11">1/[S]</text>
  <!-- y-axis -->
  <line x1="340" y1="235" x2="340" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="340,52 336,62 344,62" fill="#8a8a8a"/>
  <text x="316" y="62" fill="#8a8a8a" font-size="11">1/v</text>
  <!-- control line -->
  <line x1="284" y1="215" x2="415" y2="62" stroke="#8a8a8a" stroke-width="2.5"/>
  <!-- inhibited line (parallel, shifted up) -->
  <line x1="250" y1="215" x2="405" y2="34" stroke="#e0645c" stroke-width="2.5"/>
  <!-- diagnostic -->
  <text x="337" y="256" fill="#8a8a8a" text-anchor="middle" font-size="11">parallel lines:</text>
  <text x="337" y="270" fill="#8a8a8a" text-anchor="middle" font-size="11">Km and Vmax both fall</text>

  <!-- ===================== Panel C: Mixed ===================== -->
  <text x="577" y="40" fill="#8a8a8a" text-anchor="middle" font-size="14">Mixed</text>
  <!-- x-axis -->
  <line x1="485" y1="215" x2="670" y2="215" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="670,215 660,211 660,219" fill="#8a8a8a"/>
  <text x="648" y="232" fill="#8a8a8a" font-size="11">1/[S]</text>
  <!-- y-axis -->
  <line x1="580" y1="235" x2="580" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="580,52 576,62 584,62" fill="#8a8a8a"/>
  <text x="556" y="62" fill="#8a8a8a" font-size="11">1/v</text>
  <!-- control line -->
  <line x1="528" y1="215" x2="645" y2="40" stroke="#8a8a8a" stroke-width="2.5"/>
  <!-- inhibited line (steeper, higher intercept) -->
  <line x1="535" y1="215" x2="620" y2="12" stroke="#e0645c" stroke-width="2.5"/>
  <!-- crossing point (left of y-axis) -->
  <circle cx="548" cy="184" r="3.5" fill="#e0645c"/>
  <!-- diagnostic -->
  <text x="577" y="256" fill="#8a8a8a" text-anchor="middle" font-size="11">cross left of 1/v axis:</text>
  <text x="577" y="270" fill="#8a8a8a" text-anchor="middle" font-size="11">Km and Vmax both change</text>
</svg>
