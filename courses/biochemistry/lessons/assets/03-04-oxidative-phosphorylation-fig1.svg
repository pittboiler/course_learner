<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Electrons (blue) fall from NADH to O2 through I&#8211;IV; that energy pumps H+ (coral) out; ATP synthase lets them back in.</text>

  <!-- ===== compartment labels ===== -->
  <text x="20" y="52" fill="#e0645c">Intermembrane space &#8212; high H+ (positive)</text>
  <text x="20" y="360" fill="#8a8a8a">Matrix &#8212; low H+ (ATP made here)</text>

  <!-- ===== inner membrane: two grey leaflets ===== -->
  <line x1="20" y1="150" x2="660" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="20" y1="235" x2="660" y2="235" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- ===== complexes (grey, embedded in membrane) ===== -->
  <rect x="65"  y="143" width="58" height="99" rx="6" fill="#8a8a8a" fill-opacity="0.16" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="88"  y="290" fill="#8a8a8a">I</text>
  <rect x="168" y="143" width="48" height="99" rx="6" fill="#8a8a8a" fill-opacity="0.16" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="186" y="290" fill="#8a8a8a">II</text>
  <rect x="272" y="143" width="58" height="99" rx="6" fill="#8a8a8a" fill-opacity="0.16" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="294" y="290" fill="#8a8a8a">III</text>
  <rect x="376" y="143" width="58" height="99" rx="6" fill="#8a8a8a" fill-opacity="0.16" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="400" y="290" fill="#8a8a8a">IV</text>

  <!-- ATP synthase (Complex V): channel + rotor knob in matrix -->
  <rect x="528" y="143" width="60" height="99" rx="6" fill="#8a8a8a" fill-opacity="0.16" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="558" cy="268" r="20" fill="#8a8a8a" fill-opacity="0.16" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="558" y1="242" x2="558" y2="252" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="512" y="325" fill="#8a8a8a">V &#8212; ATP synthase</text>

  <!-- ===== electron path (blue) ===== -->
  <!-- NADH into Complex I, out to Q -->
  <text x="24" y="278" fill="#4a90d9">NADH</text>
  <path d="M 52 268 L 94 244 L 94 190 L 236 206" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- succinate / FADH2 into Complex II, into Q (skips a pump) -->
  <text x="150" y="278" fill="#4a90d9">FADH2</text>
  <path d="M 192 262 L 192 200 L 236 206" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- mobile Q -->
  <circle cx="245" cy="206" r="11" fill="#4a90d9" fill-opacity="0.18" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="240" y="210" fill="#4a90d9">Q</text>
  <!-- Q into III, up to cyt c -->
  <path d="M 256 205 L 301 205 L 301 172 L 342 166" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- mobile cyt c -->
  <circle cx="353" cy="165" r="11" fill="#4a90d9" fill-opacity="0.18" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="349" y="169" fill="#4a90d9">c</text>
  <!-- cyt c into IV, down to O2 -->
  <path d="M 364 165 L 405 172 L 405 205 L 405 250" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="405,252 400,242 410,242" fill="#4a90d9"/>
  <text x="376" y="278" fill="#4a90d9">&#189; O2 &#8594; H2O</text>

  <!-- ===== protons pumped OUT (coral, up) at I, III, IV ===== -->
  <line x1="94"  y1="135" x2="94"  y2="98" stroke="#e0645c" stroke-width="2"/>
  <polygon points="94,96 89,106 99,106" fill="#e0645c"/>
  <text x="86" y="90" fill="#e0645c">H+</text>
  <line x1="301" y1="135" x2="301" y2="98" stroke="#e0645c" stroke-width="2"/>
  <polygon points="301,96 296,106 306,106" fill="#e0645c"/>
  <text x="293" y="90" fill="#e0645c">H+</text>
  <line x1="405" y1="135" x2="405" y2="98" stroke="#e0645c" stroke-width="2"/>
  <polygon points="405,96 400,106 410,106" fill="#e0645c"/>
  <text x="397" y="90" fill="#e0645c">H+</text>

  <!-- ===== protons return IN through ATP synthase (coral, down) ===== -->
  <line x1="558" y1="100" x2="558" y2="240" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="558,242 553,232 563,232" fill="#e0645c"/>
  <text x="550" y="90" fill="#e0645c">H+</text>
  <text x="600" y="272" fill="#8a8a8a">ADP + Pi</text>
  <text x="618" y="290" fill="#8a8a8a">&#8595;</text>
  <text x="612" y="308" fill="#e0645c">ATP</text>
</svg>
