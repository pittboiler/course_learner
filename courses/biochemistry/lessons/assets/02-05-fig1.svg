<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Alone, A&#8594;B climbs uphill (+15). Coupled to ATP hydrolysis, the same step runs downhill (&#8722;15.5).</text>

  <!-- free-energy axis -->
  <line x1="28" y1="290" x2="28" y2="58" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="28,58 23,70 33,70" fill="#8a8a8a"/>
  <text x="12" y="66" fill="#8a8a8a">G</text>

  <!-- ===== left panel: A to B alone ===== -->
  <text x="72" y="50" fill="#8a8a8a">A &#8594; B alone</text>
  <!-- A level -->
  <line x1="60" y1="258" x2="140" y2="258" stroke="#4a90d9" stroke-width="3"/>
  <text x="95" y="278" fill="#4a90d9">A</text>
  <!-- B level -->
  <line x1="190" y1="150" x2="270" y2="150" stroke="#e0645c" stroke-width="3"/>
  <text x="225" y="142" fill="#e0645c">B</text>
  <!-- connector -->
  <line x1="140" y1="258" x2="190" y2="258" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- uphill arrow -->
  <line x1="165" y1="258" x2="165" y2="150" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="165,150 161,162 169,162" fill="#e0645c"/>
  <text x="173" y="208" fill="#e0645c">&#916;G&#176;&#8242; = +15</text>

  <!-- ===== right panel: coupled ===== -->
  <text x="360" y="50" fill="#8a8a8a">coupled to ATP hydrolysis</text>
  <!-- start level -->
  <line x1="350" y1="118" x2="430" y2="118" stroke="#4a90d9" stroke-width="3"/>
  <text x="352" y="108" fill="#4a90d9">A + ATP</text>
  <!-- product level -->
  <line x1="490" y1="242" x2="580" y2="242" stroke="#4a90d9" stroke-width="3"/>
  <text x="482" y="262" fill="#4a90d9">B + ADP + Pi</text>
  <!-- connector -->
  <line x1="430" y1="118" x2="490" y2="118" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- downhill arrow -->
  <line x1="460" y1="118" x2="460" y2="242" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="460,242 456,230 464,230" fill="#4a90d9"/>
  <text x="468" y="186" fill="#4a90d9">&#916;G&#176;&#8242; = &#8722;15.5</text>
</svg>
