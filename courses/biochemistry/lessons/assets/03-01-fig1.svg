<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="18" y="20" fill="#8a8a8a" font-style="italic">D&#8211;glucose: the open&#8211;chain Fischer form (left) closes into the Haworth ring (right); C1 becomes the anomeric carbon &#8212; &#945; (OH down) or &#946; (OH up).</text>

  <!-- ===== Fischer (open chain) ===== -->
  <text x="90" y="46" fill="#e0645c" font-size="11">C1 &#8212; carbonyl</text>
  <text x="112" y="60" fill="#e0645c">CHO</text>
  <line x1="130" y1="66" x2="130" y2="248" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- C2: OH right, H left -->
  <line x1="104" y1="100" x2="156" y2="100" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="86" y="104" fill="#8a8a8a">H</text>
  <text x="159" y="104" fill="#8a8a8a">OH</text>

  <!-- C3: HO left, H right -->
  <line x1="104" y1="138" x2="156" y2="138" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="80" y="142" fill="#8a8a8a">HO</text>
  <text x="159" y="142" fill="#8a8a8a">H</text>

  <!-- C4: OH right, H left -->
  <line x1="104" y1="176" x2="156" y2="176" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="86" y="180" fill="#8a8a8a">H</text>
  <text x="159" y="180" fill="#8a8a8a">OH</text>

  <!-- C5: OH right, H left (D-config reference) -->
  <line x1="104" y1="214" x2="156" y2="214" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="86" y="218" fill="#8a8a8a">H</text>
  <text x="159" y="218" fill="#8a8a8a">OH</text>
  <text x="163" y="232" fill="#8a8a8a" font-size="10">C5 &#8594; D</text>

  <!-- C6 -->
  <text x="104" y="266" fill="#8a8a8a">CH2OH</text>

  <!-- ===== ring-closure arrow ===== -->
  <text x="228" y="120" fill="#8a8a8a" font-size="11">ring closure</text>
  <text x="214" y="134" fill="#8a8a8a" font-size="10">C1 aldehyde + C5 OH</text>
  <text x="238" y="146" fill="#8a8a8a" font-size="10">&#8594; hemiacetal</text>
  <path d="M 215 160 Q 285 178 350 160" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="350,160 340,157 342,166" fill="#8a8a8a"/>

  <!-- ===== Haworth (pyranose ring) ===== -->
  <!-- ring bonds -->
  <line x1="505" y1="112" x2="430" y2="112" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="430" y1="112" x2="392" y2="166" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="392" y1="166" x2="430" y2="220" stroke="#8a8a8a" stroke-width="3"/>
  <line x1="430" y1="220" x2="505" y2="220" stroke="#8a8a8a" stroke-width="3"/>
  <line x1="505" y1="220" x2="543" y2="166" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="543" y1="166" x2="505" y2="112" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- ring oxygen -->
  <text x="498" y="108" fill="#8a8a8a">O</text>

  <!-- C6 (CH2OH) up from C5 -->
  <line x1="430" y1="112" x2="430" y2="86" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="404" y="80" fill="#8a8a8a">CH2OH</text>
  <text x="418" y="126" fill="#8a8a8a" font-size="10">C5</text>

  <!-- C4 OH left -->
  <line x1="392" y1="166" x2="366" y2="166" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="338" y="170" fill="#8a8a8a">OH</text>

  <!-- C3 OH down -->
  <line x1="430" y1="220" x2="430" y2="246" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="420" y="260" fill="#8a8a8a">OH</text>

  <!-- C2 OH down -->
  <line x1="505" y1="220" x2="505" y2="246" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="495" y="260" fill="#8a8a8a">OH</text>

  <!-- C1 anomeric carbon (coral) -->
  <circle cx="543" cy="166" r="4" fill="#e0645c"/>
  <text x="548" y="182" fill="#e0645c" font-size="11">C1</text>
  <text x="470" y="196" fill="#e0645c" font-size="10">anomeric carbon</text>
  <line x1="512" y1="192" x2="538" y2="170" stroke="#e0645c" stroke-width="0.8"/>

  <!-- beta-OH up -->
  <line x1="543" y1="166" x2="543" y2="140" stroke="#e0645c" stroke-width="1.5"/>
  <text x="550" y="136" fill="#e0645c">OH (&#946;)</text>

  <!-- alpha-OH down -->
  <line x1="543" y1="166" x2="543" y2="200" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="550" y="212" fill="#e0645c">OH (&#945;)</text>
</svg>
