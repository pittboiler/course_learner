<svg viewBox="0 0 640 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- headers -->
  <text x="24" y="28" fill="#4a90d9" font-weight="bold">GLYCOLYSIS &#8595; (glucose &#8594; pyruvate)</text>
  <text x="616" y="28" fill="#e0645c" font-weight="bold" text-anchor="end">GLUCONEOGENESIS &#8593; (pyruvate &#8594; glucose)</text>
  <text x="320" y="46" fill="#8a8a8a" font-style="italic" text-anchor="middle">Two directions share the reversible steps; three irreversible steps get bypassed.</text>

  <!-- metabolite labels (center column) -->
  <text x="320" y="76" fill="#8a8a8a" font-weight="bold" text-anchor="middle">Glucose</text>
  <text x="320" y="150" fill="#8a8a8a" font-weight="bold" text-anchor="middle">Glucose 6-P</text>
  <text x="320" y="224" fill="#8a8a8a" font-weight="bold" text-anchor="middle">Fructose 6-P</text>
  <text x="320" y="298" fill="#8a8a8a" font-weight="bold" text-anchor="middle">Fructose 1,6-BP</text>
  <text x="320" y="390" fill="#8a8a8a" font-weight="bold" text-anchor="middle">PEP</text>
  <text x="320" y="464" fill="#8a8a8a" font-weight="bold" text-anchor="middle">Pyruvate</text>

  <!-- ===== Node A: Glucose <-> Glucose 6-P (irreversible) ===== -->
  <!-- glycolysis down (blue) -->
  <line x1="250" y1="86" x2="250" y2="132" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="250,132 245,123 255,123" fill="#4a90d9"/>
  <text x="242" y="107" fill="#4a90d9" text-anchor="end">hexokinase</text>
  <text x="242" y="122" fill="#4a90d9" text-anchor="end">(&#8722; ATP)</text>
  <!-- gluconeogenesis up (coral) -->
  <line x1="390" y1="132" x2="390" y2="86" stroke="#e0645c" stroke-width="2"/>
  <polygon points="390,86 385,95 395,95" fill="#e0645c"/>
  <text x="398" y="107" fill="#e0645c">glucose 6-phosphatase</text>
  <text x="398" y="122" fill="#e0645c">(bypass 3)</text>

  <!-- ===== reversible: G6P <-> F6P ===== -->
  <line x1="320" y1="160" x2="320" y2="206" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="320,160 315,169 325,169" fill="#8a8a8a"/>
  <polygon points="320,206 315,197 325,197" fill="#8a8a8a"/>
  <text x="332" y="187" fill="#8a8a8a">isomerase (reversible)</text>

  <!-- ===== Node B: Fructose 6-P <-> Fructose 1,6-BP (irreversible; the switch) ===== -->
  <!-- glycolysis down (blue) -->
  <line x1="250" y1="234" x2="250" y2="280" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="250,280 245,271 255,271" fill="#4a90d9"/>
  <text x="242" y="255" fill="#4a90d9" text-anchor="end">PFK-1</text>
  <text x="242" y="270" fill="#4a90d9" text-anchor="end">(&#8722; ATP)</text>
  <!-- gluconeogenesis up (coral) -->
  <line x1="390" y1="280" x2="390" y2="234" stroke="#e0645c" stroke-width="2"/>
  <polygon points="390,234 385,243 395,243" fill="#e0645c"/>
  <text x="398" y="255" fill="#e0645c">FBPase-1</text>
  <text x="398" y="270" fill="#e0645c">(bypass 2)</text>

  <!-- ===== reversible middle steps: F1,6BP ... PEP ===== -->
  <line x1="320" y1="312" x2="320" y2="376" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="320,312 315,321 325,321" fill="#8a8a8a"/>
  <polygon points="320,376 315,367 325,367" fill="#8a8a8a"/>
  <text x="332" y="348" fill="#8a8a8a">reversible steps (shared)</text>

  <!-- ===== Node C: PEP <-> Pyruvate (irreversible; two-reaction bypass) ===== -->
  <!-- glycolysis down (blue) -->
  <line x1="250" y1="400" x2="250" y2="446" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="250,446 245,437 255,437" fill="#4a90d9"/>
  <text x="242" y="421" fill="#4a90d9" text-anchor="end">pyruvate kinase</text>
  <text x="242" y="436" fill="#4a90d9" text-anchor="end">(+ ATP)</text>
  <!-- gluconeogenesis up (coral) -->
  <line x1="390" y1="446" x2="390" y2="400" stroke="#e0645c" stroke-width="2"/>
  <polygon points="390,400 385,409 395,409" fill="#e0645c"/>
  <text x="398" y="415" fill="#e0645c">pyruvate carboxylase +</text>
  <text x="398" y="430" fill="#e0645c">PEP carboxykinase</text>
  <text x="398" y="444" fill="#8a8a8a">(bypass 1: via OAA, &#8722;ATP&#8722;GTP)</text>

  <!-- ===== F-2,6-BP master switch box ===== -->
  <rect x="20" y="305" width="196" height="82" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="30" y="325" fill="#8a8a8a" font-weight="bold">F-2,6-BP: the master switch</text>
  <text x="30" y="344" fill="#4a90d9">+ activates PFK-1</text>
  <text x="30" y="360" fill="#e0645c">&#8722; inhibits FBPase-1</text>
  <text x="30" y="378" fill="#8a8a8a">insulin &#8593; it &#183; glucagon &#8595; it</text>
  <!-- dashed pointer from box up to node B -->
  <line x1="150" y1="305" x2="230" y2="258" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
</svg>
