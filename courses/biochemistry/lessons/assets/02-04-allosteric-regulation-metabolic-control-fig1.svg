<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Sigmoidal v vs [S]: an activator left-shifts the switch (toward R), an inhibitor right-shifts it (toward T).</text>

