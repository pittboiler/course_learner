<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">Three ways across: channels and carriers slide solute DOWN its gradient (blue, spontaneous); a pump burns ATP to force it UP (coral).</text>

  <!-- side labels -->
  <text x="20" y="52" fill="#8a8a8a">OUTSIDE &#8212; high concentration</text>
  <text x="20" y="312" fill="#8a8a8a">INSIDE &#8212; low concentration</text>

  <!-- ===== bilayer: two leaflets of phospholipid heads + tails ===== -->
  <!-- top leaflet heads (cy=150), tails down to y=180 -->
  <g stroke="#8a8a8a" stroke-width="1.4" fill="none">
    <circle cx="40" cy="150" r="7"/><line x1="40" y1="157" x2="40" y2="180"/>
    <circle cx="64" cy="150" r="7"/><line x1="64" y1="157" x2="64" y2="180"/>
    <circle cx="88" cy="150" r="7"/><line x1="88" y1="157" x2="88" y2="180"/>
    <circle cx="112" cy="150" r="7"/><line x1="112" y1="157" x2="112" y2="180"/>
    <circle cx="188" cy="150" r="7"/><line x1="188" y1="157" x2="188" y2="180"/>
    <circle cx="212" cy="150" r="7"/><line x1="212" y1="157" x2="212" y2="180"/>
    <circle cx="236" cy="150" r="7"/><line x1="236" y1="157" x2="236" y2="180"/>
    <circle cx="260" cy="150" r="7"/><line x1="260" y1="157" x2="260" y2="180"/>
    <circle cx="284" cy="150" r="7"/><line x1="284" y1="157" x2="284" y2="180"/>
    <circle cx="368" cy="150" r="7"/><line x1="368" y1="157" x2="368" y2="180"/>
    <circle cx="392" cy="150" r="7"/><line x1="392" y1="157" x2="392" y2="180"/>
    <circle cx="416" cy="150" r="7"/><line x1="416" y1="157" x2="416" y2="180"/>
    <circle cx="440" cy="150" r="7"/><line x1="440" y1="157" x2="440" y2="180"/>
    <circle cx="464" cy="150" r="7"/><line x1="464" y1="157" x2="464" y2="180"/>
    <circle cx="548" cy="150" r="7"/><line x1="548" y1="157" x2="548" y2="180"/>
    <circle cx="572" cy="150" r="7"/><line x1="572" y1="157" x2="572" y2="180"/>
    <circle cx="596" cy="150" r="7"/><line x1="596" y1="157" x2="596" y2="180"/>
    <circle cx="620" cy="150" r="7"/><line x1="620" y1="157" x2="620" y2="180"/>
  </g>
  <!-- bottom leaflet heads (cy=214), tails up to y=184 -->
  <g stroke="#8a8a8a" stroke-width="1.4" fill="none">
    <circle cx="40" cy="214" r="7"/><line x1="40" y1="207" x2="40" y2="184"/>
    <circle cx="64" cy="214" r="7"/><line x1="64" y1="207" x2="64" y2="184"/>
    <circle cx="88" cy="214" r="7"/><line x1="88" y1="207" x2="88" y2="184"/>
    <circle cx="112" cy="214" r="7"/><line x1="112" y1="207" x2="112" y2="184"/>
    <circle cx="188" cy="214" r="7"/><line x1="188" y1="207" x2="188" y2="184"/>
    <circle cx="212" cy="214" r="7"/><line x1="212" y1="207" x2="212" y2="184"/>
    <circle cx="236" cy="214" r="7"/><line x1="236" y1="207" x2="236" y2="184"/>
    <circle cx="260" cy="214" r="7"/><line x1="260" y1="207" x2="260" y2="184"/>
    <circle cx="284" cy="214" r="7"/><line x1="284" y1="207" x2="284" y2="184"/>
    <circle cx="368" cy="214" r="7"/><line x1="368" y1="207" x2="368" y2="184"/>
    <circle cx="392" cy="214" r="7"/><line x1="392" y1="207" x2="392" y2="184"/>
    <circle cx="416" cy="214" r="7"/><line x1="416" y1="207" x2="416" y2="184"/>
    <circle cx="440" cy="214" r="7"/><line x1="440" y1="207" x2="440" y2="184"/>
    <circle cx="464" cy="214" r="7"/><line x1="464" y1="207" x2="464" y2="184"/>
    <circle cx="548" cy="214" r="7"/><line x1="548" y1="207" x2="548" y2="184"/>
    <circle cx="572" cy="214" r="7"/><line x1="572" y1="207" x2="572" y2="184"/>
    <circle cx="596" cy="214" r="7"/><line x1="596" y1="207" x2="596" y2="184"/>
    <circle cx="620" cy="214" r="7"/><line x1="620" y1="207" x2="620" y2="184"/>
  </g>

  <!-- ===== solute dots: dense outside (top), sparse inside (bottom) ===== -->
  <g fill="#4a90d9">
    <circle cx="60" cy="82" r="4"/><circle cx="120" cy="66" r="4"/><circle cx="150" cy="104" r="4"/>
    <circle cx="210" cy="90" r="4"/><circle cx="260" cy="72" r="4"/><circle cx="300" cy="108" r="4"/>
    <circle cx="360" cy="80" r="4"/><circle cx="420" cy="66" r="4"/><circle cx="470" cy="100" r="4"/>
    <circle cx="590" cy="78" r="4"/><circle cx="95" cy="112" r="4"/><circle cx="330" cy="70" r="4"/>
    <!-- sparse inside -->
    <circle cx="110" cy="258" r="4"/><circle cx="300" cy="272" r="4"/><circle cx="200" cy="290" r="4"/>
  </g>

  <!-- ===== 1. CHANNEL (blue, pore between two walls) ===== -->
  <rect x="126" y="143" width="14" height="78" rx="5" fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="2"/>
  <rect x="160" y="143" width="14" height="78" rx="5" fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="2"/>
  <line x1="150" y1="120" x2="150" y2="244" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="150,248 145,236 155,236" fill="#4a90d9"/>
  <text x="150" y="334" fill="#8a8a8a" text-anchor="middle">channel</text>

  <!-- ===== 2. CARRIER (blue, gated box) ===== -->
  <path d="M 306 143 L 354 143 L 354 173 L 336 185 L 354 197 L 354 221 L 306 221 L 306 197 L 324 185 L 306 173 Z"
        fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="2"/>
  <line x1="330" y1="120" x2="330" y2="244" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="330,248 325,236 335,236" fill="#4a90d9"/>
  <text x="330" y="334" fill="#8a8a8a" text-anchor="middle">carrier</text>

  <!-- ===== 3. PUMP (coral, ATP-driven, moves UP) ===== -->
  <rect x="484" y="143" width="52" height="78" rx="10" fill="#e0645c" opacity="0.18" stroke="#e0645c" stroke-width="2"/>
  <text x="510" y="187" fill="#e0645c" text-anchor="middle" font-weight="bold">ATP</text>
  <line x1="510" y1="244" x2="510" y2="120" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="510,116 505,128 515,128" fill="#e0645c"/>
  <text x="510" y="334" fill="#8a8a8a" text-anchor="middle">pump (active)</text>
</svg>
