<svg viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Myoglobin holds on (hyperbola); hemoglobin's sigmoid dumps O&#8322; between lungs and tissue &#8212; the Bohr shift dumps even more.</text>

  <!-- axes -->
  <line x1="70" y1="250" x2="600" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="600,250 590,245 590,255" fill="#8a8a8a"/>
  <line x1="70" y1="250" x2="70" y2="46" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,46 65,56 75,56" fill="#8a8a8a"/>

  <!-- y ticks / labels -->
  <text x="40" y="255" fill="#8a8a8a">0</text>
  <line x1="66" y1="150" x2="70" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="30" y="155" fill="#8a8a8a">0.5</text>
  <line x1="66" y1="50" x2="70" y2="50" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="30" y="55" fill="#8a8a8a">1.0</text>
  <text x="14" y="150" fill="#8a8a8a" transform="rotate(-90 14 150)">Y (saturation)</text>

  <!-- x labels -->
  <text x="530" y="278" fill="#8a8a8a">pO&#8322; (torr)</text>

  <!-- Y=0.5 reference line (marks both P50 values) -->
  <line x1="70" y1="150" x2="270" y2="150" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- tissue marker at pO2=26 (x=200) -->
  <line x1="200" y1="250" x2="200" y2="150" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="176" y="266" fill="#8a8a8a">26</text>
  <text x="150" y="300" fill="#8a8a8a">tissue</text>

  <!-- lung marker at pO2=100 (x=570) -->
  <line x1="570" y1="250" x2="570" y2="54.5" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="558" y="266" fill="#8a8a8a">100</text>
  <text x="540" y="300" fill="#8a8a8a">lungs</text>

  <!-- P50(Hb)=40 marker under Bohr curve (x=270) -->
  <text x="258" y="266" fill="#8a8a8a">40</text>

  <!-- Myoglobin: hyperbolic (blue) -->
  <path d="M70,250 L75,197.4 L82.5,155.6 L95,121.8 L107.5,104.4 L120,93.8 L145,81.4 L170,74.6 L200,69.4 L245,64.8 L320,60.6 L420,57.6 L570,55.4"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="430" y="48" fill="#4a90d9" font-weight="bold">myoglobin</text>

  <!-- Hemoglobin: sigmoid (coral) -->
  <path d="M70,250 L95,248.0 L120,237.1 L145,214.7 L170,185.2 L200,150 L220,130.2 L245,110.6 L270,96.1 L320,77.6 L370,67.5 L470,58.2 L570,54.5"
        fill="none" stroke="#e0645c" stroke-width="3"/>
  <text x="372" y="86" fill="#e0645c" font-weight="bold">hemoglobin</text>

  <!-- Hemoglobin, Bohr right-shift (dashed coral) -->
  <path d="M70,250 L120,246.0 L170,224.9 L200,203.9 L220,188.2 L270,150 L320,119.8 L370,98.6 L470,75.1 L570,64.3"
        fill="none" stroke="#e0645c" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="452" y="98" fill="#e0645c">Hb + Bohr</text>

  <!-- Bohr shift arrow (right-shift at Y=0.5) -->
  <line x1="206" y1="150" x2="262" y2="150" stroke="#e0645c" stroke-width="2"/>
  <polygon points="270,150 258,145 258,155" fill="#e0645c"/>
  <text x="210" y="140" fill="#e0645c">Bohr: +CO&#8322;, +H&#8314;</text>

  <!-- P50 dots on the two curves at Y=0.5 -->
  <circle cx="200" cy="150" r="3.5" fill="#e0645c"/>
  <circle cx="270" cy="150" r="3.5" fill="#e0645c"/>
</svg>
