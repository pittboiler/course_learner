<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="60" y="22" fill="#8a8a8a" font-style="italic">Titrating glycine: two buffer plateaus at the two pK&#8320;'s, and pI sits at the steep midpoint between them.</text>

  <!-- y-axis (pH) -->
  <line x1="70" y1="340" x2="70" y2="36" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,36 65,46 75,46" fill="#8a8a8a"/>
  <text x="44" y="40" fill="#8a8a8a">pH</text>

  <!-- x-axis (equivalents of OH- added) -->
  <line x1="70" y1="340" x2="610" y2="340" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="610,340 600,335 600,345" fill="#8a8a8a"/>
  <text x="360" y="372" fill="#8a8a8a">OH&#8722; added (equivalents)</text>

  <!-- y ticks: pH 2,4,6,8,10,12 -->
  <line x1="66" y1="297.1" x2="70" y2="297.1" stroke="#8a8a8a" stroke-width="1"/>
  <text x="50" y="301" fill="#8a8a8a">2</text>
  <line x1="66" y1="254.3" x2="70" y2="254.3" stroke="#8a8a8a" stroke-width="1"/>
  <text x="50" y="258" fill="#8a8a8a">4</text>
  <line x1="66" y1="211.4" x2="70" y2="211.4" stroke="#8a8a8a" stroke-width="1"/>
  <text x="50" y="215" fill="#8a8a8a">6</text>
  <line x1="66" y1="168.6" x2="70" y2="168.6" stroke="#8a8a8a" stroke-width="1"/>
  <text x="50" y="172" fill="#8a8a8a">8</text>
  <line x1="66" y1="125.7" x2="70" y2="125.7" stroke="#8a8a8a" stroke-width="1"/>
  <text x="44" y="129" fill="#8a8a8a">10</text>
  <line x1="66" y1="82.9" x2="70" y2="82.9" stroke="#8a8a8a" stroke-width="1"/>
  <text x="44" y="86" fill="#8a8a8a">12</text>

  <!-- x ticks: 0, 0.5, 1, 1.5, 2 -->
  <line x1="70" y1="340" x2="70" y2="344" stroke="#8a8a8a" stroke-width="1"/>
  <text x="63" y="357" fill="#8a8a8a">0</text>
  <line x1="200" y1="340" x2="200" y2="344" stroke="#8a8a8a" stroke-width="1"/>
  <text x="188" y="357" fill="#8a8a8a">0.5</text>
  <line x1="330" y1="340" x2="330" y2="344" stroke="#8a8a8a" stroke-width="1"/>
  <text x="326" y="357" fill="#8a8a8a">1</text>
  <line x1="460" y1="340" x2="460" y2="344" stroke="#8a8a8a" stroke-width="1"/>
  <text x="448" y="357" fill="#8a8a8a">1.5</text>
  <line x1="590" y1="340" x2="590" y2="344" stroke="#8a8a8a" stroke-width="1"/>
  <text x="586" y="357" fill="#8a8a8a">2</text>

  <!-- guide lines at the three key pH values -->
  <line x1="70" y1="289.8" x2="200" y2="289.8" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="206" y="294" fill="#e0645c">pK&#8320;&#8321; = 2.34</text>
  <line x1="70" y1="212.1" x2="330" y2="212.1" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="336" y="216" fill="#e0645c">pI = 5.97</text>
  <line x1="70" y1="134.3" x2="460" y2="134.3" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="466" y="138" fill="#e0645c">pK&#8320;&#8322; = 9.60</text>

  <!-- vertical guides at the half-equivalence buffer centers and the pI point -->
  <line x1="200" y1="340" x2="200" y2="289.8" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="330" y1="340" x2="330" y2="212.1" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="460" y1="340" x2="460" y2="134.3" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- the titration curve -->
  <path d="M 70 318.6 L 96 310.2 L 135 300.1 L 200 289.8 L 265 279.6 L 304 269.5 L 330 212.1 L 356 154.6 L 395 144.5 L 460 134.3 L 525 124.0 L 564 113.9 L 590 97.8"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- dots at the two half-equivalence points and pI -->
  <circle cx="200" cy="289.8" r="3.5" fill="#e0645c"/>
  <circle cx="330" cy="212.1" r="3.5" fill="#e0645c"/>
  <circle cx="460" cy="134.3" r="3.5" fill="#e0645c"/>

  <!-- species labels along the curve -->
  <text x="96" y="332" fill="#4a90d9">cation, +1</text>
  <text x="250" y="205" fill="#4a90d9">zwitterion, 0</text>
  <text x="470" y="108" fill="#4a90d9">anion, &#8722;1</text>
</svg>
