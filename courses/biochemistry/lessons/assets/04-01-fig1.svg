<svg viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="20" fill="#8a8a8a" font-style="italic">Saturation shapes the chain: a cis C=C kinks it. A phospholipid swaps one tail for a polar head (coral).</text>

  <!-- ===== column 1: saturated fatty acid ===== -->
  <text x="62" y="66" fill="#8a8a8a">COOH</text>
  <polyline points="78,78 102,94 78,110 102,126 78,142 102,158 78,174 102,190 78,206"
            fill="none" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="90" y="234" fill="#8a8a8a" text-anchor="middle">Saturated (16:0)</text>
  <text x="90" y="252" fill="#8a8a8a" text-anchor="middle" font-size="12">straight &#8594; packs tight,</text>
  <text x="90" y="268" fill="#8a8a8a" text-anchor="middle" font-size="12">higher m.p.</text>

  <!-- ===== column 2: cis-unsaturated fatty acid ===== -->
  <text x="222" y="66" fill="#8a8a8a">COOH</text>
  <polyline points="238,78 262,94 238,110 262,126" fill="none" stroke="#8a8a8a" stroke-width="2.5"/>
  <!-- cis double bond (blue), two parallel strokes create the kink -->
  <line x1="262" y1="126" x2="280" y2="138" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="259" y1="130" x2="277" y2="142" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="288" y="120" fill="#4a90d9" font-size="12">cis C=C</text>
  <polyline points="280,138 306,148 298,170 324,180 316,200" fill="none" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="290" y="234" fill="#8a8a8a" text-anchor="middle">cis-Unsaturated (18:1)</text>
  <text x="290" y="252" fill="#8a8a8a" text-anchor="middle" font-size="12">kink &#8594; poor packing,</text>
  <text x="290" y="268" fill="#8a8a8a" text-anchor="middle" font-size="12">lower m.p., more fluid</text>

  <!-- ===== column 3: phospholipid ===== -->
  <circle cx="500" cy="72" r="15" fill="#e0645c" fill-opacity="0.22" stroke="#e0645c" stroke-width="2"/>
  <text x="500" y="77" fill="#e0645c" text-anchor="middle" font-size="13">P</text>
  <line x1="500" y1="87" x2="500" y2="94" stroke="#e0645c" stroke-width="2"/>
  <!-- tail A: saturated, straight -->
  <polyline points="491,96 479,112 491,128 479,144 491,160 479,176 491,192"
            fill="none" stroke="#8a8a8a" stroke-width="2.5"/>
  <!-- tail B: unsaturated, kinked -->
  <polyline points="509,96 521,112 509,128 521,144" fill="none" stroke="#8a8a8a" stroke-width="2.5"/>
  <line x1="521" y1="144" x2="539" y2="156" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="518" y1="148" x2="536" y2="160" stroke="#4a90d9" stroke-width="2.5"/>
  <polyline points="539,156 527,172 539,188 527,204" fill="none" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="500" y="234" fill="#e0645c" text-anchor="middle">Phospholipid</text>
  <text x="500" y="252" fill="#8a8a8a" text-anchor="middle" font-size="12">polar head + 2 tails</text>
  <text x="500" y="268" fill="#8a8a8a" text-anchor="middle" font-size="12">= amphipathic</text>
</svg>
