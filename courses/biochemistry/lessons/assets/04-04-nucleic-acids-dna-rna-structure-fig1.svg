<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Antiparallel strands: A=T holds with 2 H-bonds, G&#8801;C with 3. Blue = purine (A, G), coral = pyrimidine (C, T).</text>

  <!-- ===== left backbone: 5' (top) to 3' (bottom) ===== -->
  <line x1="95" y1="60" x2="95" y2="300" stroke="#8a8a8a" stroke-width="3"/>
  <polygon points="95,306 90,294 100,294" fill="#8a8a8a"/>
  <text x="80" y="52" fill="#8a8a8a">5&#8242;</text>
  <text x="80" y="326" fill="#8a8a8a">3&#8242;</text>

  <!-- ===== right backbone: 5' (bottom) to 3' (top) ===== -->
  <line x1="525" y1="60" x2="525" y2="300" stroke="#8a8a8a" stroke-width="3"/>
  <polygon points="525,54 520,66 530,66" fill="#8a8a8a"/>
  <text x="520" y="52" fill="#8a8a8a">3&#8242;</text>
  <text x="520" y="326" fill="#8a8a8a">5&#8242;</text>

  <!-- backbone label -->
  <text x="40" y="348" fill="#8a8a8a" font-size="12">sugar&#8211;phosphate backbone (each rung = one base pair)</text>

  <!-- ===== rung 1: A = T, 2 H-bonds ===== -->
  <line x1="95" y1="90" x2="115" y2="90" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="505" y1="90" x2="525" y2="90" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="115" y="72" width="150" height="36" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="185" y="95" fill="#4a90d9" text-anchor="middle">A</text>
  <rect x="355" y="72" width="150" height="36" fill="#e0645c" opacity="0.15" stroke="#e0645c" stroke-width="2"/>
  <text x="430" y="95" fill="#e0645c" text-anchor="middle">T</text>
  <line x1="268" y1="83" x2="352" y2="83" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="268" y1="97" x2="352" y2="97" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="560" y="95" fill="#e0645c" font-weight="bold">2</text>

  <!-- ===== rung 2: C = G, 3 H-bonds ===== -->
  <line x1="95" y1="150" x2="115" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="505" y1="150" x2="525" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="115" y="132" width="150" height="36" fill="#e0645c" opacity="0.15" stroke="#e0645c" stroke-width="2"/>
  <text x="185" y="155" fill="#e0645c" text-anchor="middle">C</text>
  <rect x="355" y="132" width="150" height="36" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="430" y="155" fill="#4a90d9" text-anchor="middle">G</text>
  <line x1="268" y1="141" x2="352" y2="141" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="268" y1="150" x2="352" y2="150" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="268" y1="159" x2="352" y2="159" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="560" y="155" fill="#e0645c" font-weight="bold">3</text>

  <!-- ===== rung 3: G = C, 3 H-bonds ===== -->
  <line x1="95" y1="210" x2="115" y2="210" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="505" y1="210" x2="525" y2="210" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="115" y="192" width="150" height="36" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="185" y="215" fill="#4a90d9" text-anchor="middle">G</text>
  <rect x="355" y="192" width="150" height="36" fill="#e0645c" opacity="0.15" stroke="#e0645c" stroke-width="2"/>
  <text x="430" y="215" fill="#e0645c" text-anchor="middle">C</text>
  <line x1="268" y1="201" x2="352" y2="201" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="268" y1="210" x2="352" y2="210" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="268" y1="219" x2="352" y2="219" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="560" y="215" fill="#e0645c" font-weight="bold">3</text>

  <!-- ===== rung 4: T = A, 2 H-bonds ===== -->
  <line x1="95" y1="270" x2="115" y2="270" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="505" y1="270" x2="525" y2="270" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="115" y="252" width="150" height="36" fill="#e0645c" opacity="0.15" stroke="#e0645c" stroke-width="2"/>
  <text x="185" y="275" fill="#e0645c" text-anchor="middle">T</text>
  <rect x="355" y="252" width="150" height="36" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="430" y="275" fill="#4a90d9" text-anchor="middle">A</text>
  <line x1="268" y1="263" x2="352" y2="263" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="268" y1="277" x2="352" y2="277" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="560" y="275" fill="#e0645c" font-weight="bold">2</text>
</svg>
