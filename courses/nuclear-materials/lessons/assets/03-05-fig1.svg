<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="24" y="26" fill="#8a8a8a" font-style="italic">A TRISO particle: five nested layers around a fuel kernel. The SiC shell is a tiny pressure vessel.</text>

  <!-- ===== nested layers, drawn outer to inner so each annulus shows ===== -->
  <!-- OPyC (outer pyrolytic carbon) -->
  <circle cx="185" cy="195" r="150" fill="#4a90d9" opacity="0.10" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- SiC shell (the pressure vessel) -->
  <circle cx="185" cy="195" r="128" fill="#e0645c" opacity="0.22" stroke="#e0645c" stroke-width="3"/>
  <!-- IPyC (inner pyrolytic carbon) -->
  <circle cx="185" cy="195" r="106" fill="#4a90d9" opacity="0.14" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- buffer (porous carbon) -->
  <circle cx="185" cy="195" r="84" fill="#8a8a8a" opacity="0.20" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- porosity hints in the buffer -->
  <circle cx="150" cy="150" r="3" fill="#8a8a8a" opacity="0.5"/>
  <circle cx="220" cy="150" r="3" fill="#8a8a8a" opacity="0.5"/>
  <circle cx="150" cy="240" r="3" fill="#8a8a8a" opacity="0.5"/>
  <circle cx="222" cy="238" r="3" fill="#8a8a8a" opacity="0.5"/>
  <!-- kernel (fuel) -->
  <circle cx="185" cy="195" r="50" fill="#4a90d9" opacity="0.42" stroke="#4a90d9" stroke-width="2"/>

  <!-- ===== leader lines + labels ===== -->
  <!-- OPyC : ring point upper-left -->
  <line x1="279" y1="78" x2="366" y2="72" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="279" cy="78" r="2.5" fill="#8a8a8a"/>
  <text x="372" y="70" fill="#8a8a8a">Outer PyC</text>
  <text x="372" y="86" fill="#8a8a8a" font-size="11">seals SiC, adds strength</text>

  <!-- SiC -->
  <line x1="296" y1="131" x2="366" y2="128" stroke="#e0645c" stroke-width="1"/>
  <circle cx="296" cy="131" r="2.5" fill="#e0645c"/>
  <text x="372" y="126" fill="#e0645c">SiC shell</text>
  <text x="372" y="142" fill="#e0645c" font-size="11">the pressure vessel</text>

  <!-- IPyC -->
  <line x1="291" y1="195" x2="366" y2="192" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="291" cy="195" r="2.5" fill="#8a8a8a"/>
  <text x="372" y="190" fill="#8a8a8a">Inner PyC</text>
  <text x="372" y="206" fill="#8a8a8a" font-size="11">gas seal, bonds SiC</text>

  <!-- buffer -->
  <line x1="258" y1="253" x2="366" y2="255" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="258" cy="253" r="2.5" fill="#8a8a8a"/>
  <text x="372" y="253" fill="#8a8a8a">Buffer</text>
  <text x="372" y="269" fill="#8a8a8a" font-size="11">porous C: soaks recoils &amp; gas</text>

  <!-- kernel -->
  <line x1="213" y1="236" x2="366" y2="315" stroke="#4a90d9" stroke-width="1"/>
  <circle cx="213" cy="236" r="2.5" fill="#4a90d9"/>
  <text x="372" y="313" fill="#4a90d9">Kernel</text>
  <text x="372" y="329" fill="#4a90d9" font-size="11">UO&#8322; or UCO fuel, ~0.5 mm</text>

  <!-- scale note -->
  <text x="24" y="348" fill="#8a8a8a" font-size="11">whole particle &#8776; 1 mm across; a fuel pebble packs thousands of these in graphite.</text>
</svg>
