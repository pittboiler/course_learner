<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">A neutron elastically knocks a lattice atom off its site, handing it recoil energy T; heavy targets receive only a small fraction (&#947; low).</text>

  <!-- ===== left panel: the knock-on collision ===== -->

  <!-- lattice atoms (grey), 3x3 grid; the struck one is left-middle -->
  <circle cx="140" cy="115" r="9" fill="#8a8a8a" opacity="0.35" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="200" cy="115" r="9" fill="#8a8a8a" opacity="0.35" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="260" cy="115" r="9" fill="#8a8a8a" opacity="0.35" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="200" cy="180" r="9" fill="#8a8a8a" opacity="0.35" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="260" cy="180" r="9" fill="#8a8a8a" opacity="0.35" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="140" cy="245" r="9" fill="#8a8a8a" opacity="0.35" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="200" cy="245" r="9" fill="#8a8a8a" opacity="0.35" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="260" cy="245" r="9" fill="#8a8a8a" opacity="0.35" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- vacated site (dashed) at left-middle -->
  <circle cx="140" cy="180" r="9" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="3 3"/>

  <!-- incoming neutron -->
  <circle cx="52" cy="180" r="6" fill="#4a90d9"/>
  <line x1="62" y1="180" x2="120" y2="180" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="122,180 112,175 112,185" fill="#4a90d9"/>
  <text x="60" y="168" fill="#4a90d9">n, energy E</text>

  <!-- recoiling atom (coral) knocked up-right, with T arrow -->
  <circle cx="182" cy="148" r="9" fill="#e0645c" opacity="0.85" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="150" y1="171" x2="188" y2="140" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="190,138 178,140 185,150" fill="#e0645c"/>
  <text x="196" y="138" fill="#e0645c">T</text>

  <!-- ===== right panel: energy-transfer efficiency curve ===== -->

  <!-- title of curve -->
  <text x="352" y="46" fill="#8a8a8a">&#947; = 4M&#8321;M&#8322; / (M&#8321;+M&#8322;)&#178;   (M&#8321; = 1, neutron)</text>

  <!-- axes -->
  <line x1="360" y1="60" x2="360" y2="205" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="360" y1="205" x2="600" y2="205" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="342" y="66" fill="#8a8a8a">1</text>
  <text x="330" y="137" fill="#8a8a8a">0.5</text>
  <text x="348" y="209" fill="#8a8a8a">0</text>
  <text x="404" y="228" fill="#8a8a8a">target mass M&#8322; (log scale)</text>

  <!-- efficiency curve: gamma vs log2(M2), M2 = 1..256 -->
  <path d="M 360 65 L 390 80 L 420 115 L 450 150 L 480 174 L 510 189 L 540 197 L 570 201 L 600 203"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- iron point highlighted (M2=56, gamma=0.069) -->
  <circle cx="534" cy="195" r="5" fill="#e0645c"/>
  <line x1="534" y1="195" x2="534" y2="205" stroke="#e0645c" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="512" y="184" fill="#e0645c">Fe: &#947; &#8776; 0.07</text>

  <!-- light-target note near peak -->
  <text x="366" y="80" fill="#8a8a8a">equal masses:</text>
  <text x="366" y="95" fill="#8a8a8a">&#947; = 1</text>
</svg>
