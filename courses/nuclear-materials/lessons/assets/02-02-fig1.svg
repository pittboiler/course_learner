<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="24" y="26" fill="#8a8a8a" font-style="italic">A dislocation drinks interstitials a few % faster than vacancies; the leftover vacancies feed a void.</text>

  <!-- divider -->
  <line x1="312" y1="52" x2="312" y2="330" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 5"/>

  <!-- ================= PANEL A: interstitial loop ================= -->

  <!-- upper straight planes -->
  <line x1="40" y1="80"  x2="272" y2="80"  stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="40" y1="115" x2="272" y2="115" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="40" y1="150" x2="272" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- plane above the disk, bowed up away from it -->
  <path d="M 40 172 L 100 172 Q 156 156 212 172 L 272 172" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- the inserted extra disk of atoms (interstitials) -->
  <line x1="120" y1="192" x2="192" y2="192" stroke="#4a90d9" stroke-width="4"/>
  <circle cx="130" cy="192" r="4" fill="#4a90d9"/>
  <circle cx="156" cy="192" r="4" fill="#4a90d9"/>
  <circle cx="182" cy="192" r="4" fill="#4a90d9"/>

  <!-- plane below the disk, bowed down away from it -->
  <path d="M 40 212 L 100 212 Q 156 228 212 212 L 272 212" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- lower straight plane -->
  <line x1="40" y1="247" x2="272" y2="247" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- loop edges marked (the dislocation bounding the disk) -->
  <text x="106" y="197" fill="#e0645c" font-size="15">&#8869;</text>
  <text x="196" y="197" fill="#e0645c" font-size="15">&#8869;</text>

  <!-- panel A labels -->
  <text x="98"  y="292" fill="#4a90d9">extra disk = interstitial loop</text>
  <text x="40"  y="312" fill="#8a8a8a" font-size="12">planes bow apart; the loop edge is a dislocation</text>

  <!-- ================= PANEL B: the dislocation bias ================= -->

  <!-- the dislocation line -->
  <line x1="450" y1="90" x2="450" y2="248" stroke="#8a8a8a" stroke-width="2.5"/>
  <!-- edge-dislocation tee -->
  <line x1="430" y1="170" x2="470" y2="170" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="454" y="266" fill="#8a8a8a">dislocation</text>

  <!-- interstitials biased IN (blue, many) -->
  <circle cx="356" cy="120" r="5" fill="#4a90d9"/>
  <circle cx="356" cy="165" r="5" fill="#4a90d9"/>
  <circle cx="356" cy="210" r="5" fill="#4a90d9"/>
  <circle cx="392" cy="98"  r="5" fill="#4a90d9"/>
  <line x1="364" y1="122" x2="434" y2="140" stroke="#4a90d9" stroke-width="1.8"/>
  <polygon points="434,140 424,138 428,147" fill="#4a90d9"/>
  <line x1="364" y1="165" x2="434" y2="165" stroke="#4a90d9" stroke-width="1.8"/>
  <polygon points="434,165 425,161 425,169" fill="#4a90d9"/>
  <line x1="364" y1="208" x2="434" y2="192" stroke="#4a90d9" stroke-width="1.8"/>
  <polygon points="434,192 424,192 428,201" fill="#4a90d9"/>
  <line x1="399" y1="104" x2="440" y2="150" stroke="#4a90d9" stroke-width="1.8"/>
  <polygon points="440,150 430,148 437,141" fill="#4a90d9"/>
  <text x="330" y="86" fill="#4a90d9">interstitials in (more)</text>

  <!-- vacancies: a couple to the dislocation, the excess to the void (coral, fewer) -->
  <circle cx="512" cy="132" r="5.5" fill="none" stroke="#e0645c" stroke-width="1.8"/>
  <circle cx="512" cy="214" r="5.5" fill="none" stroke="#e0645c" stroke-width="1.8"/>
  <line x1="504" y1="134" x2="468" y2="150" stroke="#e0645c" stroke-width="1.6" stroke-dasharray="4 3"/>
  <polygon points="468,150 478,148 474,157" fill="#e0645c"/>
  <line x1="504" y1="212" x2="468" y2="196" stroke="#e0645c" stroke-width="1.6" stroke-dasharray="4 3"/>
  <polygon points="468,196 478,196 474,205" fill="#e0645c"/>

  <!-- excess vacancies drift to the void -->
  <circle cx="536" cy="172" r="5.5" fill="none" stroke="#e0645c" stroke-width="1.8"/>
  <line x1="546" y1="172" x2="602" y2="172" stroke="#e0645c" stroke-width="1.8"/>
  <polygon points="602,172 592,168 592,176" fill="#e0645c"/>

  <!-- the void -->
  <circle cx="632" cy="172" r="26" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <text x="618" y="222" fill="#e0645c">void</text>
  <text x="500" y="256" fill="#e0645c" font-size="12">excess vacancies</text>
</svg>
