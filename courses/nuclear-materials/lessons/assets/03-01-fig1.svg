<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Fluorite (CaF2-type): U on an fcc lattice, O filling every tetrahedral hole &#8212; an open cage that soaks up fission products.</text>

  <!-- ===== cube edges ===== -->
  <!-- front square -->
  <polyline points="120,250 280,250 280,90 120,90 120,250" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- back square -->
  <polyline points="190,200 350,200 350,40 190,40 190,200" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- connectors -->
  <line x1="120" y1="250" x2="190" y2="200" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="280" y1="250" x2="350" y2="200" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="280" y1="90" x2="350" y2="40" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="120" y1="90" x2="190" y2="40" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- ===== O anions: 8 tetrahedral holes (inner cube) ===== -->
  <circle cx="177.5" cy="197.5" r="6" fill="#e0645c"/>
  <circle cx="257.5" cy="197.5" r="6" fill="#e0645c"/>
  <circle cx="177.5" cy="117.5" r="6" fill="#e0645c"/>
  <circle cx="257.5" cy="117.5" r="6" fill="#e0645c"/>
  <circle cx="212.5" cy="172.5" r="6" fill="#e0645c"/>
  <circle cx="292.5" cy="172.5" r="6" fill="#e0645c"/>
  <circle cx="212.5" cy="92.5" r="6" fill="#e0645c"/>
  <circle cx="292.5" cy="92.5" r="6" fill="#e0645c"/>

  <!-- ===== U cations: fcc (corners + face centers) ===== -->
  <!-- corners -->
  <circle cx="120" cy="250" r="9" fill="#4a90d9" fill-opacity="0.9"/>
  <circle cx="280" cy="250" r="9" fill="#4a90d9" fill-opacity="0.9"/>
  <circle cx="280" cy="90" r="9" fill="#4a90d9" fill-opacity="0.9"/>
  <circle cx="120" cy="90" r="9" fill="#4a90d9" fill-opacity="0.9"/>
  <circle cx="190" cy="200" r="9" fill="#4a90d9" fill-opacity="0.9"/>
  <circle cx="350" cy="200" r="9" fill="#4a90d9" fill-opacity="0.9"/>
  <circle cx="350" cy="40" r="9" fill="#4a90d9" fill-opacity="0.9"/>
  <circle cx="190" cy="40" r="9" fill="#4a90d9" fill-opacity="0.9"/>
  <!-- face centers -->
  <circle cx="200" cy="170" r="9" fill="#4a90d9" fill-opacity="0.9"/>
  <circle cx="270" cy="120" r="9" fill="#4a90d9" fill-opacity="0.9"/>
  <circle cx="155" cy="145" r="9" fill="#4a90d9" fill-opacity="0.9"/>
  <circle cx="315" cy="145" r="9" fill="#4a90d9" fill-opacity="0.9"/>
  <circle cx="235" cy="65" r="9" fill="#4a90d9" fill-opacity="0.9"/>
  <circle cx="235" cy="225" r="9" fill="#4a90d9" fill-opacity="0.9"/>

  <!-- one U-O cage highlighted: dashed tie from a face-center U to its 4 nearest O -->
  <line x1="200" y1="170" x2="177.5" y2="197.5" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="200" y1="170" x2="212.5" y2="172.5" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- ===== legend ===== -->
  <circle cx="150" cy="318" r="9" fill="#4a90d9" fill-opacity="0.9"/>
  <text x="167" y="323" fill="#8a8a8a">U cation &#8212; fcc lattice, 8-coordinate (cube of O)</text>
  <circle cx="150" cy="342" r="6" fill="#e0645c"/>
  <text x="167" y="347" fill="#8a8a8a">O anion &#8212; every tetrahedral hole, 4-coordinate</text>
</svg>
