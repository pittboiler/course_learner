<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">NRT counts every displacement; the cascade unmakes most of them before they can migrate.</text>

  <!-- ===== top bar: 100 NRT displacements ===== -->
  <text x="40" y="58" fill="#8a8a8a">Every NRT displacement (100%)</text>

  <!-- recombined segment (70%) -->
  <rect x="60" y="70" width="364" height="40" fill="#8a8a8a" opacity="0.22" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="150" y="95" fill="#8a8a8a">recombine in-cascade  ~70%</text>

  <!-- surviving segment (30%) -->
  <rect x="424" y="70" width="156" height="40" fill="#4a90d9" opacity="0.20" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="438" y="95" fill="#4a90d9">survive ~30%</text>

  <!-- scale ticks -->
  <text x="52" y="128" fill="#8a8a8a">0%</text>
  <text x="410" y="128" fill="#8a8a8a">70%</text>
  <text x="566" y="128" fill="#8a8a8a">100%</text>

  <!-- connector: blow up the surviving sliver ===== -->
  <line x1="424" y1="112" x2="300" y2="190" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="580" y1="112" x2="580" y2="190" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ===== bottom bar: the surviving 30%, expanded ===== -->
  <text x="40" y="182" fill="#8a8a8a">Of the survivors:</text>

  <!-- freely-migrating point defects -->
  <rect x="300" y="196" width="187" height="40" fill="#4a90d9" opacity="0.20" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="312" y="221" fill="#4a90d9">freely-migrating defects</text>

  <!-- in-cascade clusters -->
  <rect x="487" y="196" width="93" height="40" fill="#e0645c" opacity="0.18" stroke="#e0645c" stroke-width="1.5"/>
  <text x="500" y="216" fill="#e0645c">in-cascade</text>
  <text x="500" y="231" fill="#e0645c">clusters</text>

  <!-- fate arrows -->
  <line x1="393" y1="236" x2="393" y2="270" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="393,270 388,261 398,261" fill="#4a90d9"/>
  <text x="300" y="288" fill="#4a90d9">migrate to sinks &#8212; drive swelling,</text>
  <text x="300" y="304" fill="#4a90d9">hardening, segregation</text>

  <line x1="533" y1="236" x2="533" y2="270" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="533,270 528,261 538,261" fill="#e0645c"/>
  <text x="500" y="288" fill="#e0645c">loops, SFT</text>
  <text x="500" y="304" fill="#e0645c">born in place</text>
</svg>
