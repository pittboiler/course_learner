<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Same dose, two fates: austenitic (fcc) foams after incubation; F/M (bcc) stays nearly flat.</text>

  <!-- axes -->
  <line x1="80" y1="290" x2="580" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="580,290 570,285 570,295" fill="#8a8a8a"/>
  <line x1="80" y1="290" x2="80" y2="60" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="80,60 75,70 85,70" fill="#8a8a8a"/>

  <!-- axis labels -->
  <text x="360" y="322" fill="#8a8a8a" text-anchor="middle">dose (dpa)</text>
  <text x="34" y="150" fill="#8a8a8a" transform="rotate(-90 34 150)" text-anchor="middle">swelling &#916;V/V (%)</text>
  <text x="66" y="295" fill="#8a8a8a" text-anchor="end">0</text>
  <text x="560" y="308" fill="#8a8a8a" text-anchor="middle">100</text>

  <!-- incubation marker for austenitic (40 dpa) -->
  <line x1="272" y1="290" x2="272" y2="150" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="276" y="146" fill="#8a8a8a" font-size="12">incubation</text>
  <text x="276" y="160" fill="#8a8a8a" font-size="12">~40 dpa</text>

  <!-- austenitic swelling curve (blue): flat then ~1%/dpa -->
  <path d="M 80 289 L 262 288 Q 300 287 320 255 L 560 80"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="470" y="120" fill="#4a90d9">austenitic (fcc)</text>
  <text x="470" y="138" fill="#4a90d9" font-size="12">~1%/dpa</text>

  <!-- F/M swelling curve (coral): nearly flat, ~0.1%/dpa -->
  <path d="M 80 290 L 270 290 Q 350 289 560 258"
        fill="none" stroke="#e0645c" stroke-width="3"/>
  <text x="440" y="252" fill="#e0645c">F/M (bcc) ~0.1%/dpa</text>

  <!-- gap-at-100-dpa annotation -->
  <line x1="560" y1="80" x2="560" y2="258" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="588" y="172" fill="#8a8a8a" font-size="12" transform="rotate(90 588 172)" text-anchor="middle">~60% vs ~10%</text>
</svg>
