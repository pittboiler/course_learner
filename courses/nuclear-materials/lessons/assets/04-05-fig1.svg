<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Same dpa, very different damage: the 14 MeV spectrum breeds far more helium, and the wall also eats plasma heat and leaks tritium.</text>

  <!-- ============ Panel A: He/dpa comparison ============ -->
  <text x="60" y="52" fill="#8a8a8a">appm He per dpa</text>

  <!-- axis + baseline -->
  <line x1="80" y1="250" x2="80" y2="60" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="80" y1="250" x2="290" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- fission bar (~0.2, drawn at a visible minimum height) -->
  <rect x="108" y="244" width="44" height="6" fill="#8a8a8a" opacity="0.5" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="130" y="238" fill="#8a8a8a" text-anchor="middle">~0.1&#8211;0.3</text>
  <text x="130" y="268" fill="#8a8a8a" text-anchor="middle">fission</text>
  <text x="130" y="284" fill="#8a8a8a" text-anchor="middle">~2 MeV n</text>

  <!-- fusion bar (~12) -->
  <rect x="213" y="70" width="44" height="180" fill="#4a90d9" opacity="0.2" stroke="#4a90d9" stroke-width="2"/>
  <text x="235" y="62" fill="#4a90d9" text-anchor="middle">~10&#8211;15</text>
  <text x="235" y="268" fill="#4a90d9" text-anchor="middle">fusion</text>
  <text x="235" y="284" fill="#4a90d9" text-anchor="middle">14 MeV n</text>

  <!-- ratio callout -->
  <text x="168" y="150" fill="#e0645c" text-anchor="middle">~50&#8211;100&#215;</text>
  <text x="168" y="167" fill="#e0645c" text-anchor="middle">more He</text>

  <!-- ============ Panel B: first-wall load schematic ============ -->

  <!-- the wall -->
  <rect x="500" y="95" width="26" height="150" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="513" y="262" fill="#4a90d9" text-anchor="middle">first</text>
  <text x="513" y="277" fill="#4a90d9" text-anchor="middle">wall</text>

  <!-- plasma label -->
  <text x="372" y="88" fill="#8a8a8a">plasma</text>

  <!-- heat-flux arrow (coral) -->
  <line x1="360" y1="125" x2="496" y2="125" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="496,125 486,120 486,130" fill="#e0645c"/>
  <text x="360" y="118" fill="#e0645c">plasma heat flux</text>

  <!-- 14 MeV neutron arrow (blue) -->
  <line x1="360" y1="170" x2="496" y2="170" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="496,170 486,165 486,175" fill="#4a90d9"/>
  <text x="360" y="163" fill="#4a90d9">14 MeV neutrons</text>

  <!-- sputtering / erosion arrow (coral, bouncing back off wall face) -->
  <line x1="498" y1="215" x2="380" y2="230" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="380,230 391,228 388,220" fill="#e0645c"/>
  <text x="360" y="248" fill="#e0645c">sputtered atoms</text>

  <!-- tritium permeation through the wall (coral dashed) -->
  <line x1="512" y1="150" x2="600" y2="150" stroke="#e0645c" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="600,150 590,145 590,155" fill="#e0645c"/>
  <text x="548" y="143" fill="#e0645c">T permeation</text>
</svg>
