<svg viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Displacements vs PKA energy: dead below E_d, a linear ramp, then a plateau once energy leaks to electrons.</text>

  <!-- axes -->
  <line x1="70" y1="255" x2="575" y2="255" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="575,255 565,250 565,260" fill="#8a8a8a"/>
  <text x="540" y="278" fill="#8a8a8a">E<tspan baseline-shift="sub" font-size="10">PKA</tspan></text>
  <line x1="70" y1="255" x2="70" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,52 65,62 75,62" fill="#8a8a8a"/>
  <text x="44" y="60" fill="#8a8a8a">N<tspan baseline-shift="sub" font-size="10">d</tspan></text>
  <text x="55" y="260" fill="#8a8a8a">0</text>

  <!-- vertical guides -->
  <line x1="120" y1="255" x2="120" y2="243" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="155" y1="255" x2="155" y2="243" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="440" y1="255" x2="440" y2="95" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="108" y="278" fill="#8a8a8a">E<tspan baseline-shift="sub" font-size="10">d</tspan></text>
  <text x="139" y="292" fill="#8a8a8a">2E<tspan baseline-shift="sub" font-size="10">d</tspan></text>
  <text x="425" y="278" fill="#8a8a8a">E<tspan baseline-shift="sub" font-size="10">c</tspan></text>

  <!-- the K-P damage function (blue): zero, unit step, linear ramp -->
  <path d="M 70 255 L 120 255 L 120 243 L 155 243 L 440 95" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <!-- electronic-loss plateau (coral highlight) -->
  <path d="M 440 95 L 575 95" fill="none" stroke="#e0645c" stroke-width="3"/>

  <!-- region labels -->
  <text x="82" y="238" fill="#8a8a8a">N<tspan baseline-shift="sub" font-size="10">d</tspan> = 0</text>
  <text x="130" y="228" fill="#4a90d9">N<tspan baseline-shift="sub" font-size="10">d</tspan> = 1</text>
  <text x="250" y="150" fill="#4a90d9" transform="rotate(-27 250 150)">N<tspan baseline-shift="sub" font-size="10">d</tspan> = E<tspan baseline-shift="sub" font-size="10">dam</tspan> / 2E<tspan baseline-shift="sub" font-size="10">d</tspan></text>
  <text x="452" y="86" fill="#e0645c">extra energy &#8594; electrons, not atoms</text>
</svg>
