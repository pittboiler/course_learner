<svg viewBox="0 0 640 372" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Cold-work texture fixes where zirconium hydrides precipitate and how they lie in the wall.</text>

  <!-- ===== Panel A: hcp grain with basal texture ===== -->
  <text x="60" y="66" fill="#8a8a8a">hcp zirconium grain</text>

  <!-- basal plane (squashed hexagon) -->
  <polygon points="210,214 180,193 120,193 90,214 120,235 180,235"
           fill="#4a90d9" opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="92" y="262" fill="#4a90d9" font-size="12">basal plane (0001)</text>

  <!-- c-axis arrow -->
  <line x1="150" y1="214" x2="150" y2="112" stroke="#e0645c" stroke-width="2"/>
  <polygon points="150,112 145,124 155,124" fill="#e0645c"/>
  <text x="158" y="142" fill="#e0645c" font-size="12">c-axis</text>

  <!-- texture note -->
  <text x="40" y="300" fill="#8a8a8a" font-size="12">Cold-pilgering aligns the c-axis roughly radial,</text>
  <text x="40" y="318" fill="#8a8a8a" font-size="12">so basal planes lie flat in the tube wall.</text>

  <!-- ===== Panel B: cladding wall element ===== -->
  <text x="404" y="66" fill="#8a8a8a">cladding wall element</text>

  <!-- wall slab: horizontal = hoop, vertical = radial -->
  <rect x="380" y="112" width="180" height="148" fill="#8a8a8a" opacity="0.08" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- hoop stress arrows (tension, circumferential) -->
  <line x1="380" y1="186" x2="344" y2="186" stroke="#e0645c" stroke-width="2"/>
  <polygon points="344,186 356,181 356,191" fill="#e0645c"/>
  <line x1="560" y1="186" x2="596" y2="186" stroke="#e0645c" stroke-width="2"/>
  <polygon points="596,186 584,181 584,191" fill="#e0645c"/>
  <text x="346" y="174" fill="#e0645c" font-size="12">&#963;&#952;</text>
  <text x="566" y="174" fill="#e0645c" font-size="12">&#963;&#952;</text>

  <!-- circumferential hydride colony (blue, parallel to wall) -->
  <text x="404" y="140" fill="#4a90d9" font-size="12">circumferential</text>
  <line x1="406" y1="150" x2="462" y2="150" stroke="#4a90d9" stroke-width="3"/>
  <line x1="410" y1="157" x2="466" y2="157" stroke="#4a90d9" stroke-width="3"/>
  <line x1="406" y1="164" x2="462" y2="164" stroke="#4a90d9" stroke-width="3"/>

  <!-- radial hydride (coral, normal to hoop stress, opening) -->
  <text x="490" y="130" fill="#e0645c" font-size="12">radial</text>
  <line x1="508" y1="138" x2="508" y2="248" stroke="#e0645c" stroke-width="5"/>
  <line x1="502" y1="210" x2="490" y2="210" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="490,210 500,206 500,214" fill="#e0645c"/>
  <line x1="514" y1="210" x2="526" y2="210" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="526,210 516,206 516,214" fill="#e0645c"/>

  <!-- legend -->
  <text x="30" y="344" fill="#8a8a8a" font-size="12">Blue circumferential platelets lie parallel to the wall &#8212; the hoop stress runs in their plane &#8594; benign.</text>
  <text x="30" y="362" fill="#8a8a8a" font-size="12">The coral radial platelet sits normal to the hoop stress &#8594; it opens like a crack &#8594; embrittlement.</text>
</svg>
