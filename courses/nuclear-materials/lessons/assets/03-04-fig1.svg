<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">(a) Gas is born in grains, migrates to boundaries, interlinks into tunnels, then vents.</text>

  <!-- ================= PANEL (a): bubble evolution ================= -->
  <!-- vent arrow out of the top of the grain boundary -->
  <line x1="150" y1="70" x2="150" y2="34" stroke="#e0645c" stroke-width="2"/>
  <polygon points="150,28 145,40 155,40" fill="#e0645c"/>
  <text x="160" y="38" fill="#e0645c" font-size="12">release &#8594; plenum</text>

  <!-- grain cluster (two grains) -->
  <path d="M 70 118 Q 60 88 100 82 Q 150 74 190 86 Q 230 96 234 134 Q 244 178 208 212 Q 158 240 110 226 Q 66 214 62 178 Q 57 146 70 118 Z"
        fill="#4a90d9" opacity="0.06" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- internal grain boundary (highlighted) -->
  <path d="M 150 80 Q 138 112 152 142 Q 166 172 145 202 Q 139 216 150 232"
        fill="none" stroke="#e0645c" stroke-width="2" opacity="0.8"/>

  <!-- intra-granular bubbles (small, blue) -->
  <circle cx="100" cy="122" r="3" fill="#4a90d9"/>
  <circle cx="88" cy="160" r="3" fill="#4a90d9"/>
  <circle cx="116" cy="150" r="3" fill="#4a90d9"/>
  <circle cx="104" cy="192" r="3" fill="#4a90d9"/>
  <circle cx="126" cy="110" r="3" fill="#4a90d9"/>
  <circle cx="82" cy="142" r="3" fill="#4a90d9"/>
  <circle cx="185" cy="116" r="3" fill="#4a90d9"/>
  <circle cx="202" cy="152" r="3" fill="#4a90d9"/>
  <circle cx="190" cy="182" r="3" fill="#4a90d9"/>
  <circle cx="210" cy="130" r="3" fill="#4a90d9"/>
  <circle cx="176" cy="200" r="3" fill="#4a90d9"/>
  <circle cx="214" cy="166" r="3" fill="#4a90d9"/>

  <!-- inter-granular bubbles (larger, coral) on the boundary -->
  <circle cx="147" cy="98" r="5" fill="#e0645c" opacity="0.85"/>
  <circle cx="147" cy="130" r="6" fill="#e0645c" opacity="0.85"/>
  <circle cx="156" cy="158" r="6" fill="#e0645c" opacity="0.85"/>
  <circle cx="145" cy="186" r="6" fill="#e0645c" opacity="0.85"/>
  <circle cx="149" cy="212" r="5" fill="#e0645c" opacity="0.85"/>

  <!-- labels -->
  <text x="60" y="252" fill="#4a90d9" font-size="11">intra-granular</text>
  <text x="66" y="264" fill="#4a90d9" font-size="11">bubbles</text>
  <line x1="90" y1="196" x2="98" y2="245" stroke="#8a8a8a" stroke-width="0.8"/>
  <text x="176" y="252" fill="#e0645c" font-size="11">boundary bubbles</text>
  <text x="182" y="264" fill="#e0645c" font-size="11">link &#8594; tunnels</text>
  <line x1="156" y1="158" x2="200" y2="245" stroke="#8a8a8a" stroke-width="0.8"/>

  <!-- ================= PANEL (b): release fraction vs temperature ================= -->
  <text x="360" y="18" fill="#8a8a8a" font-style="italic">(b) Release fraction jumps once fuel passes the thermal threshold.</text>

  <!-- axes -->
  <line x1="392" y1="248" x2="622" y2="248" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="622,248 613,244 613,252" fill="#8a8a8a"/>
  <line x1="392" y1="248" x2="392" y2="60" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="392,60 388,69 396,69" fill="#8a8a8a"/>
  <text x="470" y="266" fill="#8a8a8a">fuel temperature</text>
  <text x="356" y="66" fill="#8a8a8a">f</text>
  <text x="360" y="252" fill="#8a8a8a" font-size="11">0</text>
  <text x="360" y="76" fill="#8a8a8a" font-size="11">1</text>

  <!-- threshold line ~1000 C -->
  <line x1="500" y1="248" x2="500" y2="70" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="472" y="86" fill="#8a8a8a" font-size="11">&#8776; 1000 &#176;C</text>

  <!-- release curve: flat athermal, sharp thermal rise -->
  <path d="M 394 243 L 450 242 L 500 239 C 520 233, 542 130, 575 96 C 590 84, 605 80, 616 78"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- region labels -->
  <text x="400" y="228" fill="#8a8a8a" font-size="11">athermal:</text>
  <text x="400" y="240" fill="#8a8a8a" font-size="11">recoil/knockout</text>
  <text x="520" y="150" fill="#e0645c" font-size="11">thermal:</text>
  <text x="520" y="163" fill="#e0645c" font-size="11">diffusion-driven</text>
</svg>
