<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="60" y="30" fill="#8a8a8a" font-style="italic">The level set xᵀAx = 1 is an ellipse; its axes ARE the eigenvectors.</text>

  <!-- background axes through the center (280,190) -->
  <line x1="60" y1="190" x2="500" y2="190" stroke="#8a8a8a" stroke-width="1" opacity="0.5"/>
  <line x1="280" y1="60" x2="280" y2="320" stroke="#8a8a8a" stroke-width="1" opacity="0.5"/>

  <!-- the ellipse: major axis (length 1) tilted 30deg up-right, minor axis (length 1/2) -->
  <ellipse cx="280" cy="190" rx="120" ry="60" transform="rotate(-30 280 190)"
           fill="#e0645c" opacity="0.14"/>
  <ellipse cx="280" cy="190" rx="120" ry="60" transform="rotate(-30 280 190)"
           fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- eigenvector q1 (long axis, small lambda_1): center to (383.9,130) -->
  <line x1="280" y1="190" x2="383.9" y2="130" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="383.9,130 372.6,130.5 379.0,139.8" fill="#4a90d9"/>
  <circle cx="280" cy="190" r="4" fill="#8a8a8a"/>

  <!-- eigenvector q2 (short axis, large lambda_2): center to (250,138) -->
  <line x1="280" y1="190" x2="250" y2="138" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="250,138 258.7,142.9 254.3,132.5" fill="#e0645c"/>

  <!-- dashed guide bracketing the long semi-axis length -->
  <line x1="383.9" y1="130" x2="399" y2="139" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- labels -->
  <text x="388" y="122" fill="#4a90d9">q₁  (semi-axis 1/√λ₁)</text>
  <text x="150" y="132" fill="#e0645c">q₂  (semi-axis 1/√λ₂)</text>

  <!-- note: smaller eigenvalue -> longer axis -->
  <text x="300" y="300" fill="#8a8a8a" font-style="italic">smaller λ  →  longer axis</text>
</svg>
