<svg viewBox="0 0 640 410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- Left: unit circle in the input plane with orthonormal v1, v2.
       Right: its image, an ellipse with semi-axes sigma1*u1, sigma2*u2.
       Bottom strip: the three stages  V^T (rotate) -> Sigma (stretch) -> U (rotate). -->

  <!-- ===== LEFT PANEL: input plane ===== -->
  <line x1="60" y1="150" x2="250" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="150" y1="60" x2="150" y2="245" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="150" cy="150" r="60" fill="#4a90d9" opacity="0.12"/>
  <circle cx="150" cy="150" r="60" fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- v1 along +x, v2 along +y (unit, orthonormal) -->
  <line x1="150" y1="150" x2="210" y2="150" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="210,150 201,146 201,154" fill="#4a90d9"/>
  <text x="214" y="167" fill="#4a90d9">v₁</text>
  <line x1="150" y1="150" x2="150" y2="90" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="150,90 146,99 154,99" fill="#4a90d9"/>
  <text x="156" y="88" fill="#4a90d9">v₂</text>
  <text x="96" y="238" fill="#8a8a8a" font-style="italic">unit circle</text>

  <!-- ===== BIG ARROW: A = U Σ Vᵀ ===== -->
  <line x1="258" y1="150" x2="363" y2="150" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="375,150 361,144 361,156" fill="#8a8a8a"/>
  <text x="278" y="140" fill="#8a8a8a">A = U Σ Vᵀ</text>

  <!-- ===== RIGHT PANEL: output plane ===== -->
  <line x1="380" y1="150" x2="600" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="490" y1="55" x2="490" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <ellipse cx="490" cy="150" rx="95" ry="42" fill="#e0645c" opacity="0.12"
           transform="rotate(-25 490 150)"/>
  <ellipse cx="490" cy="150" rx="95" ry="42" fill="none" stroke="#e0645c" stroke-width="2.5"
           transform="rotate(-25 490 150)"/>

  <!-- major semi-axis sigma1*u1 -->
  <line x1="490" y1="150" x2="576" y2="110" stroke="#e0645c" stroke-width="3"/>
  <polygon points="576,110 568,118 565,110" fill="#e0645c"/>
  <text x="580" y="107" fill="#e0645c">σ₁u₁</text>
  <!-- minor semi-axis sigma2*u2 -->
  <line x1="490" y1="150" x2="472" y2="112" stroke="#e0645c" stroke-width="3"/>
  <polygon points="472,112 480,119 473,123" fill="#e0645c"/>
  <text x="430" y="108" fill="#e0645c">σ₂u₂</text>
  <text x="430" y="238" fill="#8a8a8a" font-style="italic">image is an ellipse</text>

  <!-- ===== BOTTOM STRIP: three stages ===== -->
  <!-- S0: unit circle, marker at 12 o'clock -->
  <circle cx="80" cy="320" r="24" fill="#4a90d9" opacity="0.12"/>
  <circle cx="80" cy="320" r="24" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="80" cy="296" r="3.5" fill="#4a90d9"/>
  <!-- arrow Vᵀ -->
  <line x1="112" y1="320" x2="190" y2="320" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="200,320 188,315 188,325" fill="#8a8a8a"/>
  <text x="140" y="311" fill="#8a8a8a" font-style="italic">Vᵀ</text>

  <!-- S1: circle after rotation, marker rotated ~25° -->
  <circle cx="230" cy="320" r="24" fill="#4a90d9" opacity="0.12"/>
  <circle cx="230" cy="320" r="24" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="240" cy="298" r="3.5" fill="#4a90d9"/>
  <!-- arrow Σ -->
  <line x1="262" y1="320" x2="330" y2="320" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="340,320 328,315 328,325" fill="#8a8a8a"/>
  <text x="290" y="311" fill="#8a8a8a" font-style="italic">Σ</text>

  <!-- S2: axis-aligned ellipse -->
  <ellipse cx="380" cy="320" rx="38" ry="17" fill="#e0645c" opacity="0.12"/>
  <ellipse cx="380" cy="320" rx="38" ry="17" fill="none" stroke="#e0645c" stroke-width="2"/>
  <!-- arrow U -->
  <line x1="426" y1="320" x2="502" y2="320" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="512,320 500,315 500,325" fill="#8a8a8a"/>
  <text x="460" y="311" fill="#8a8a8a" font-style="italic">U</text>

  <!-- S3: rotated ellipse (final) -->
  <ellipse cx="558" cy="320" rx="38" ry="17" fill="#e0645c" opacity="0.12"
           transform="rotate(-25 558 320)"/>
  <ellipse cx="558" cy="320" rx="38" ry="17" fill="none" stroke="#e0645c" stroke-width="2"
           transform="rotate(-25 558 320)"/>

  <!-- caption -->
  <text x="60" y="392" fill="#8a8a8a" font-style="italic">Vᵀ rotates, Σ stretches the axes by σ₁ ≥ σ₂ ≥ 0, U rotates — so the unit circle</text>
  <text x="60" y="408" fill="#8a8a8a" font-style="italic">always lands as an ellipse whose semi-axes are the singular values σᵢ.</text>
</svg>
