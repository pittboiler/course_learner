<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ah-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#e0645c"/>
    </marker>
    <marker id="ah-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#4a90d9"/>
    </marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- ===== the plane = column space of A ===== -->
  <polygon points="90,270 350,270 470,200 210,200" fill="#4a90d9" opacity="0.15"/>
  <polygon points="90,270 350,270 470,200 210,200" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="440" y="258" fill="#4a90d9" font-style="italic">col(A) &#8212; everything you can reach</text>

  <!-- origin -->
  <circle cx="150" cy="248" r="4" fill="#8a8a8a"/>
  <text x="134" y="253" fill="#8a8a8a" font-size="12">O</text>

  <!-- b : the target, floating above the plane -->
  <line x1="150" y1="248" x2="330" y2="95" stroke="#e0645c" stroke-width="2.5" marker-end="url(#ah-red)"/>
  <circle cx="330" cy="95" r="4" fill="#e0645c"/>
  <text x="338" y="92" fill="#e0645c">b  (out of reach)</text>

  <!-- b-hat : the projection, foot in the plane -->
  <line x1="150" y1="248" x2="330" y2="222" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <circle cx="330" cy="222" r="4" fill="#4a90d9"/>
  <text x="336" y="239" fill="#4a90d9">b&#770; = P b  (closest point)</text>

  <!-- residual e = b - b-hat, perpendicular to the plane -->
  <line x1="330" y1="222" x2="330" y2="99" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="340" y="165" fill="#e0645c" font-size="12">e = b &#8722; b&#770;</text>

  <!-- right-angle mark where residual meets the plane -->
  <path d="M 330 222 L 330 206 L 312 210 L 312 226 Z" fill="none" stroke="#8a8a8a" stroke-width="1"/>

  <!-- caption -->
  <text x="280" y="335" fill="#8a8a8a" text-anchor="middle" font-style="italic">Closest point &#8660; perpendicular residual: e &#8869; col(A).</text>
</svg>
