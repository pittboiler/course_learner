<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#4a90d9"/>
    </marker>
    <marker id="ah-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#e0645c"/>
    </marker>
  </defs>

  <!-- ===== LEFT BOX: domain R^n ===== -->
  <text x="160" y="56" fill="#8a8a8a" text-anchor="middle" font-style="italic">domain &#8477;&#8319;</text>
  <rect x="70" y="70" width="180" height="140" fill="#4a90d9" opacity="0.15"/>
  <rect x="70" y="210" width="180" height="140" fill="#e0645c" opacity="0.15"/>
  <rect x="70" y="70" width="180" height="280" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- orthogonal-complement split -->
  <line x1="70" y1="210" x2="250" y2="210" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="240" y="205" fill="#8a8a8a" text-anchor="end" font-size="12">&#8869;</text>

  <text x="160" y="130" fill="#4a90d9" text-anchor="middle">row space  C(A&#7488;)</text>
  <text x="160" y="150" fill="#4a90d9" text-anchor="middle" font-size="12">dim = r</text>
  <text x="160" y="278" fill="#e0645c" text-anchor="middle">null space  N(A)</text>
  <text x="160" y="298" fill="#e0645c" text-anchor="middle" font-size="12">dim = n &#8722; r</text>

  <!-- ===== RIGHT BOX: codomain R^m ===== -->
  <text x="480" y="56" fill="#8a8a8a" text-anchor="middle" font-style="italic">codomain &#8477;&#7504;</text>
  <rect x="390" y="70" width="180" height="140" fill="#4a90d9" opacity="0.15"/>
  <rect x="390" y="210" width="180" height="140" fill="#e0645c" opacity="0.15"/>
  <rect x="390" y="70" width="180" height="280" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="390" y1="210" x2="570" y2="210" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="400" y="205" fill="#8a8a8a" font-size="12">&#8869;</text>

  <text x="480" y="130" fill="#4a90d9" text-anchor="middle">column space  C(A)</text>
  <text x="480" y="150" fill="#4a90d9" text-anchor="middle" font-size="12">dim = r</text>
  <text x="480" y="278" fill="#e0645c" text-anchor="middle">left null space  N(A&#7488;)</text>
  <text x="480" y="298" fill="#e0645c" text-anchor="middle" font-size="12">dim = m &#8722; r</text>

  <!-- ===== ARROWS ===== -->
  <!-- blue: row space -> column space (the invertible part) -->
  <line x1="252" y1="140" x2="386" y2="140" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="319" y="130" fill="#4a90d9" text-anchor="middle">A</text>
  <text x="319" y="115" fill="#8a8a8a" text-anchor="middle" font-size="11" font-style="italic">one-to-one, onto</text>

  <!-- the zero vector sits on the split of the codomain -->
  <circle cx="388" cy="210" r="4" fill="#8a8a8a"/>
  <text x="376" y="214" fill="#8a8a8a" text-anchor="end" font-size="12">0</text>

  <!-- red: null space -> 0 (crushed) -->
  <path d="M 252 280 Q 320 250 385 213" fill="none" stroke="#e0645c" stroke-width="2.5" stroke-dasharray="3 4" marker-end="url(#ah-red)"/>
  <text x="322" y="238" fill="#e0645c" text-anchor="middle" font-size="12">crushed &#8594; 0</text>

  <!-- caption -->
  <text x="320" y="410" fill="#8a8a8a" text-anchor="middle" font-style="italic">A maps the row space one-to-one onto the column space (both dim r) and flattens the null space to 0; each box splits into &#8869; complements.</text>
</svg>
