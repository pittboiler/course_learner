<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- the parallelogram spanned by a and b, with the right hand rule normal -->

  <!-- parallelogram: O(150,260) A(330,300) C(430,230) B(250,190) -->
  <polygon points="150,260 330,300 430,230 250,190" fill="#4a90d9" opacity="0.15"/>
  <polygon points="150,260 330,300 430,230 250,190" fill="none" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- vector a -->
  <line x1="150" y1="260" x2="330" y2="300" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="337,301 322,295 324,306" fill="#4a90d9"/>
  <text x="288" y="308" fill="#4a90d9" font-weight="bold">a</text>

  <!-- vector b -->
  <line x1="150" y1="260" x2="250" y2="190" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="257,185 242,189 249,199" fill="#4a90d9"/>
  <text x="178" y="216" fill="#4a90d9" font-weight="bold">b</text>

  <!-- angle arc between a and b -->
  <path d="M 194 270 A 45 45 0 0 0 187 234" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="200" y="255" fill="#8a8a8a" font-style="italic">&#952;</text>

  <!-- right hand sweep: from a around to b -->
  <path d="M 218 275 A 70 70 0 0 0 207 220" fill="none" stroke="#e0645c" stroke-width="1.6" stroke-dasharray="5 4"/>
  <polygon points="206,218 210,232 217,226" fill="#e0645c"/>

  <!-- height |b| sin(theta): perpendicular from the tip of b down to the line of a -->
  <line x1="250" y1="190" x2="231" y2="278" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="190" y="297" fill="#8a8a8a" font-size="12">height = |b| sin &#952;</text>

  <!-- area label -->
  <text x="300" y="232" fill="#4a90d9" font-size="13" font-weight="bold">area = |a &#215; b|</text>
  <text x="300" y="250" fill="#4a90d9" font-size="13">= |a||b| sin &#952;</text>

  <!-- the normal a x b -->
  <line x1="150" y1="260" x2="150" y2="100" stroke="#e0645c" stroke-width="3"/>
  <polygon points="150,89 144,104 156,104" fill="#e0645c"/>
  <text x="160" y="112" fill="#e0645c" font-weight="bold">a &#215; b</text>
  <text x="160" y="130" fill="#e0645c" font-size="12">perpendicular to both</text>

  <!-- right angle marks at the base of the normal -->
  <polyline points="150,246 164,249 161,263" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <polyline points="150,246 138,238 143,225" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>

  <!-- caption -->
  <text x="30" y="336" fill="#8a8a8a" font-size="12" font-style="italic">Right-hand rule: curl your fingers from a to b; your thumb points along a &#215; b.</text>
  <text x="30" y="356" fill="#8a8a8a" font-size="12" font-style="italic">Its length is the parallelogram's area. Flatten it (a parallel to b) and a &#215; b becomes 0.</text>
</svg>
