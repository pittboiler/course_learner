<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="30" fill="#8a8a8a" font-style="italic">The inner product reads off the angle:  u·v = ‖u‖‖v‖ cos θ.  Right angle ⇒ u·v = 0.</text>

  <!-- projection component of v onto u: highlighted segment O to foot -->
  <line x1="80" y1="290" x2="288.4" y2="234.85" stroke="#e0645c" stroke-width="6" opacity="0.18"/>

  <!-- u  (blue) -->
  <line x1="80" y1="290" x2="420" y2="200" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="420,200 408,209.4 405,197.8" fill="#4a90d9"/>
  <text x="428" y="203" fill="#4a90d9" font-style="italic">u</text>

  <!-- v  (red) -->
  <line x1="80" y1="290" x2="250" y2="90" stroke="#e0645c" stroke-width="3"/>
  <polygon points="250,90 245.5,104.6 236.3,96.8" fill="#e0645c"/>
  <text x="236" y="80" fill="#e0645c" font-style="italic">v</text>

  <!-- dashed perpendicular: drop from tip of v to its foot on u -->
  <line x1="250" y1="90" x2="288.4" y2="234.85" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- right-angle mark at the foot -->
  <path d="M 300 231.8 L 296.9 220.2 L 285.3 223.25" fill="none" stroke="#8a8a8a" stroke-width="1"/>

  <!-- angle arc theta at the origin, between v (inner) and u (outer) -->
  <path d="M 112.4 251.9 A 50 50 0 0 1 128.3 277.2" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="120" y="262" fill="#8a8a8a" font-style="italic">θ</text>

  <!-- origin -->
  <circle cx="80" cy="290" r="4" fill="#8a8a8a"/>
  <text x="62" y="306" fill="#8a8a8a">O</text>

  <!-- label the projection foot -->
  <text x="292" y="252" fill="#e0645c" font-style="italic" font-size="12">‖v‖ cos θ  (v's shadow on u)</text>
</svg>
