<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- Origin O = (90,300); 1 unit = 60 px. Matrix A = [[2,1],[1,2]].
       Eigenvector v = (1,1), Av = 3v = (3,3) — collinear on the line y = x.
       Non-eigen u = (2,0), Au = (4,2) — knocked up off the x-axis. -->

  <!-- dashed eigen-direction line y = x (the map's "grain") -->
  <line x1="60" y1="330" x2="315" y2="75" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- axes -->
  <line x1="30" y1="300" x2="540" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="90" y1="18" x2="90" y2="322" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="540,300 530,295 530,305" fill="#8a8a8a"/>
  <polygon points="90,18 85,28 95,28" fill="#8a8a8a"/>
  <text x="546" y="305" fill="#8a8a8a">x</text>
  <text x="80" y="16" fill="#8a8a8a">y</text>

  <!-- ON the eigen-line: Av = 3v (red, long) drawn first so blue v sits on top -->
  <line x1="90" y1="300" x2="270" y2="120" stroke="#e0645c" stroke-width="3"/>
  <polygon points="270,120 265,132 258,125" fill="#e0645c"/>
  <text x="276" y="116" fill="#e0645c">Av = 3v</text>

  <!-- eigenvector v = (1,1), blue, short -->
  <line x1="90" y1="300" x2="150" y2="240" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="150,240 145,252 138,245" fill="#4a90d9"/>
  <text x="128" y="270" fill="#4a90d9">v</text>

  <!-- non-eigen output Au = (4,2), red, turned OFF its line -->
  <line x1="90" y1="300" x2="330" y2="180" stroke="#e0645c" stroke-width="3"/>
  <polygon points="330,180 321,190 317,181" fill="#e0645c"/>
  <text x="336" y="176" fill="#e0645c">Au</text>

  <!-- non-eigen input u = (2,0), blue, along the x-axis -->
  <line x1="90" y1="300" x2="210" y2="300" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="210,300 198,295 198,305" fill="#4a90d9"/>
  <text x="160" y="293" fill="#4a90d9">u</text>

  <!-- little marks at the tips -->
  <circle cx="150" cy="240" r="3.5" fill="#4a90d9"/>
  <circle cx="270" cy="120" r="3.5" fill="#e0645c"/>

  <!-- caption -->
  <text x="70" y="40" fill="#8a8a8a" font-style="italic">A stretches v to 3v along its own line, but knocks u off the x-axis —</text>
  <text x="70" y="58" fill="#8a8a8a" font-style="italic">v is an eigenvector (grain of the map); u is not.</text>
</svg>
