<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Amplification 1/(1&#8211;g). A symmetric uncertainty in gain becomes a skewed uncertainty in warming.</text>

  <line x1="90" y1="250" x2="625" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="90" y1="250" x2="90" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="330" y="300" fill="#8a8a8a">total gain g</text>
  <text x="20" y="150" fill="#8a8a8a">amplification</text>

  <line x1="210" y1="250" x2="210" y2="256" stroke="#8a8a8a"/><text x="198" y="270" fill="#8a8a8a">0.2</text>
  <line x1="330" y1="250" x2="330" y2="256" stroke="#8a8a8a"/><text x="318" y="270" fill="#8a8a8a">0.4</text>
  <line x1="450" y1="250" x2="450" y2="256" stroke="#8a8a8a"/><text x="438" y="270" fill="#8a8a8a">0.6</text>
  <line x1="570" y1="250" x2="570" y2="256" stroke="#8a8a8a"/><text x="558" y="270" fill="#8a8a8a">0.8</text>
  <text x="86" y="270" fill="#8a8a8a">0</text>

  <text x="72" y="254" fill="#8a8a8a">1</text>
  <text x="72" y="222" fill="#8a8a8a">2</text>
  <text x="72" y="191" fill="#8a8a8a">3</text>
  <text x="72" y="159" fill="#8a8a8a">4</text>
  <text x="72" y="127" fill="#8a8a8a">5</text>
  <line x1="90" y1="218.3" x2="625" y2="218.3" stroke="#8a8a8a" stroke-width="0.6" stroke-dasharray="2 6"/>
  <line x1="90" y1="186.7" x2="625" y2="186.7" stroke="#8a8a8a" stroke-width="0.6" stroke-dasharray="2 6"/>
  <line x1="90" y1="155.0" x2="625" y2="155.0" stroke="#8a8a8a" stroke-width="0.6" stroke-dasharray="2 6"/>
  <line x1="90" y1="123.3" x2="625" y2="123.3" stroke="#8a8a8a" stroke-width="0.6" stroke-dasharray="2 6"/>

  <path d="M 90.0,250.0 L 150.0,246.5 L 210.0,242.1 L 270.0,236.4 L 330.0,228.9 L 366.0,223.0 L 402.0,215.7 L 438.0,206.3 L 468.0,196.1 L 492.0,185.7 L 516.0,172.5 L 540.0,155.0 L 558.0,137.7 L 570.0,123.3 L 582.0,105.7 L 594.0,83.8 L 600.0,70.6"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- runaway asymptote -->
  <line x1="615" y1="250" x2="615" y2="52" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="536" y="46" fill="#e0645c">g &#8594; 1: runaway</text>

  <!-- symmetric interval in g, asymmetric in amplification -->
  <line x1="390" y1="218.3" x2="390" y2="262" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="510" y1="176.1" x2="510" y2="262" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="450" y1="202.5" x2="450" y2="262" stroke="#e0645c" stroke-width="1.2"/>
  <line x1="390" y1="258" x2="510" y2="258" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="390,258 399,254 399,262" fill="#e0645c"/>
  <polygon points="510,258 501,254 501,262" fill="#e0645c"/>
  <text x="392" y="288" fill="#e0645c">g = 0.6 &#177; 0.1</text>

  <circle cx="390" cy="218.3" r="4" fill="#e0645c"/>
  <circle cx="450" cy="202.5" r="4" fill="#e0645c"/>
  <circle cx="510" cy="176.1" r="4" fill="#e0645c"/>
  <text x="336" y="214" fill="#e0645c" text-anchor="end">2.0</text>
  <text x="456" y="198" fill="#e0645c">2.5</text>
  <text x="516" y="172" fill="#e0645c">3.3</text>
  <text x="466" y="240" fill="#8a8a8a">&#8211;0.5 down, +0.8 up</text>
</svg>
