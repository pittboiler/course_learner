<svg viewBox="0 0 660 310" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Step forcing of 3.93 W m&#8315;&#178;. One box equilibrates in decades; two boxes are still climbing after 200 years.</text>

  <line x1="100" y1="250" x2="625" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="100" y1="250" x2="100" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="320" y="288" fill="#8a8a8a">years after the forcing is applied</text>
  <text x="18" y="140" fill="#8a8a8a">&#916;T (K)</text>

  <line x1="225" y1="250" x2="225" y2="256" stroke="#8a8a8a"/><text x="215" y="270" fill="#8a8a8a">50</text>
  <line x1="350" y1="250" x2="350" y2="256" stroke="#8a8a8a"/><text x="337" y="270" fill="#8a8a8a">100</text>
  <line x1="475" y1="250" x2="475" y2="256" stroke="#8a8a8a"/><text x="462" y="270" fill="#8a8a8a">150</text>
  <line x1="600" y1="250" x2="600" y2="256" stroke="#8a8a8a"/><text x="587" y="270" fill="#8a8a8a">200</text>
  <text x="90" y="270" fill="#8a8a8a">0</text>
  <text x="86" y="198" fill="#8a8a8a">1</text>
  <text x="86" y="142" fill="#8a8a8a">2</text>
  <text x="86" y="86" fill="#8a8a8a">3</text>

  <!-- ECS line -->
  <line x1="100" y1="81.1" x2="625" y2="81.1" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="504" y="76" fill="#8a8a8a">ECS = F/&#955; = 3.02 K</text>

  <path d="M 100.0,250.0 L 102.5,227.4 L 105.0,207.9 L 107.5,190.9 L 110.0,176.3 L 112.5,163.5 L 117.5,143.0 L 125.0,121.3 L 132.5,107.2 L 140.0,98.1 L 150.0,90.7 L 162.5,85.7 L 175.0,83.3 L 200.0,81.6 L 225.0,81.2 L 262.5,81.1 L 300.0,81.1 L 350.0,81.1 L 412.5,81.1 L 475.0,81.1 L 537.5,81.1 L 600.0,81.1"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <text x="196" y="106" fill="#e0645c">slab ocean, 70 m only</text>

  <path d="M 100.0,250.0 L 102.5,228.2 L 105.0,210.8 L 107.5,196.8 L 110.0,185.5 L 112.5,176.5 L 117.5,163.4 L 125.0,151.7 L 132.5,145.5 L 140.0,142.1 L 150.0,139.6 L 162.5,137.9 L 175.0,136.8 L 200.0,135.1 L 225.0,133.6 L 262.5,131.3 L 300.0,129.2 L 350.0,126.5 L 412.5,123.3 L 475.0,120.3 L 537.5,117.6 L 600.0,115.0"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="376" y="146" fill="#4a90d9">two layers: 70 m over a 1200 m deep ocean</text>

  <!-- committed warming gap -->
  <line x1="612" y1="81.1" x2="612" y2="115" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="612,81.1 608,90 616,90" fill="#8a8a8a"/>
  <polygon points="612,115 608,106 616,106" fill="#8a8a8a"/>
  <text x="462" y="302" fill="#8a8a8a">still committed after 200 yr: 0.6 K</text>
</svg>
