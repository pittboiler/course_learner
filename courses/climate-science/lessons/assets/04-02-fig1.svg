<svg viewBox="0 0 660 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Surface-ocean carbon, &#956;mol/kg. Total DIC creeps up; the carbonate ion collapses. That is the buffer at work.</text>

  <line x1="90" y1="250" x2="620" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="165" y="270" fill="#8a8a8a" text-anchor="middle">280 ppm</text>
  <text x="345" y="270" fill="#8a8a8a" text-anchor="middle">420 ppm</text>
  <text x="525" y="270" fill="#8a8a8a" text-anchor="middle">560 ppm</text>

  <!-- bar 1 -->
  <rect x="110" y="109.2" width="110" height="140.8" fill="#4a90d9" opacity="0.30" stroke="#4a90d9" stroke-width="1.4"/>
  <rect x="110" y="89.6" width="110" height="19.6" fill="#e0645c" opacity="0.45" stroke="#e0645c" stroke-width="1.4"/>
  <rect x="110" y="84.6" width="110" height="5" fill="#8a8a8a" opacity="0.6" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="165" y="186" fill="#4a90d9" text-anchor="middle">HCO&#8323;&#8315; 1721</text>
  <text x="165" y="104" fill="#e0645c" text-anchor="middle">CO&#8323;&#178;&#8315; 240</text>
  <text x="165" y="76" fill="#8a8a8a" text-anchor="middle">CO&#8322;* 9</text>
  <text x="165" y="60" fill="#8a8a8a" text-anchor="middle">DIC 1970</text>

  <!-- bar 2 -->
  <rect x="290" y="100.5" width="110" height="149.5" fill="#4a90d9" opacity="0.30" stroke="#4a90d9" stroke-width="1.4"/>
  <rect x="290" y="85.0" width="110" height="15.5" fill="#e0645c" opacity="0.45" stroke="#e0645c" stroke-width="1.4"/>
  <rect x="290" y="80.0" width="110" height="5" fill="#8a8a8a" opacity="0.6" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="345" y="186" fill="#4a90d9" text-anchor="middle">1827</text>
  <text x="345" y="98" fill="#e0645c" text-anchor="middle">190</text>
  <text x="345" y="72" fill="#8a8a8a" text-anchor="middle">13</text>
  <text x="345" y="56" fill="#8a8a8a" text-anchor="middle">DIC 2030</text>

  <!-- bar 3 -->
  <rect x="470" y="94.6" width="110" height="155.4" fill="#4a90d9" opacity="0.30" stroke="#4a90d9" stroke-width="1.4"/>
  <rect x="470" y="82.2" width="110" height="12.4" fill="#e0645c" opacity="0.45" stroke="#e0645c" stroke-width="1.4"/>
  <rect x="470" y="76.2" width="110" height="6" fill="#8a8a8a" opacity="0.6" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="525" y="186" fill="#4a90d9" text-anchor="middle">1900</text>
  <text x="525" y="93" fill="#e0645c" text-anchor="middle">152</text>
  <text x="525" y="68" fill="#8a8a8a" text-anchor="middle">18</text>
  <text x="525" y="52" fill="#8a8a8a" text-anchor="middle">DIC 2070</text>

  <!-- the reaction -->
  <text x="90" y="300" fill="#8a8a8a">CO&#8322; + H&#8322;O + CO&#8323;&#178;&#8315; &#8594; 2 HCO&#8323;&#8315;</text>
  <text x="300" y="300" fill="#e0645c">every CO&#8322; that enters destroys one carbonate ion</text>
  <text x="90" y="320" fill="#8a8a8a">DIC +5 percent, CO&#8323;&#178;&#8315; &#8211;37 percent, pCO&#8322; +100 percent</text>
</svg>
