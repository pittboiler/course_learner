<svg viewBox="0 0 660 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">Left: where the 3.7 mm a year comes from. Right: melting an ice sheet lowers sea level next to it.</text>

  <!-- LEFT: stacked budget -->
  <line x1="90" y1="270" x2="240" y2="270" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="164" y="290" fill="#8a8a8a" text-anchor="middle">2006&#8211;2018</text>
  <text x="164" y="306" fill="#8a8a8a" text-anchor="middle">3.7 mm per year</text>

  <rect x="120" y="200" width="90" height="70" fill="#4a90d9" opacity="0.40" stroke="#4a90d9" stroke-width="1.3"/>
  <text x="215" y="240" fill="#4a90d9">thermal expansion 1.4</text>
  <rect x="120" y="169" width="90" height="31" fill="#4a90d9" opacity="0.26" stroke="#4a90d9" stroke-width="1.3"/>
  <text x="215" y="190" fill="#4a90d9">glaciers 0.6</text>
  <rect x="120" y="137" width="90" height="32" fill="#e0645c" opacity="0.40" stroke="#e0645c" stroke-width="1.3"/>
  <text x="215" y="158" fill="#e0645c">Greenland 0.6</text>
  <rect x="120" y="118" width="90" height="19" fill="#e0645c" opacity="0.26" stroke="#e0645c" stroke-width="1.3"/>
  <text x="215" y="130" fill="#e0645c">Antarctica 0.4</text>
  <rect x="120" y="110" width="90" height="8" fill="#8a8a8a" opacity="0.4" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="215" y="112" fill="#8a8a8a">land water 0.2</text>

  <text x="88" y="96" fill="#8a8a8a">mm/yr</text>

  <!-- RIGHT: gravitational fingerprint -->
  <text x="380" y="52" fill="#8a8a8a">gravitational fingerprint of ice loss</text>

  <!-- ice sheet -->
  <path d="M 380 200 L 400 140 L 440 132 L 470 200 Z" fill="#4a90d9" opacity="0.25" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="392" y="176" fill="#4a90d9">ice sheet</text>
  <line x1="360" y1="200" x2="630" y2="200" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- relative sea level curve -->
  <path d="M 380,260 L 410,258 L 440,254 L 470,247 L 500,238 L 530,232 L 560,229 L 600,228 L 630,228"
        fill="none" stroke="#e0645c" stroke-width="3"/>
  <line x1="360" y1="243" x2="630" y2="243" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="360" y="240" fill="#8a8a8a" text-anchor="end">global</text>
  <text x="360" y="253" fill="#8a8a8a" text-anchor="end">mean</text>

  <text x="384" y="278" fill="#e0645c">falls here</text>
  <text x="556" y="222" fill="#e0645c">1.3&#215; global mean</text>
  <text x="386" y="300" fill="#8a8a8a">distance from the melting ice &#8594;</text>
</svg>
