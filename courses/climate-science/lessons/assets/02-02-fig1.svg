<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Warming per kelvin of global mean. Tropics warm top-heavy; poles warm bottom-heavy.</text>

  <line x1="100" y1="250" x2="600" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="100" y1="250" x2="100" y2="50" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="290" y="290" fill="#8a8a8a">local warming / global-mean warming</text>
  <text x="24" y="150" fill="#8a8a8a">height</text>
  <text x="30" y="166" fill="#8a8a8a">(km)</text>

  <line x1="231.4" y1="250" x2="231.4" y2="256" stroke="#8a8a8a"/><text x="227" y="270" fill="#8a8a8a">1</text>
  <line x1="362.8" y1="250" x2="362.8" y2="256" stroke="#8a8a8a"/><text x="358" y="270" fill="#8a8a8a">2</text>
  <line x1="494.2" y1="250" x2="494.2" y2="256" stroke="#8a8a8a"/><text x="490" y="270" fill="#8a8a8a">3</text>
  <text x="96" y="270" fill="#8a8a8a">0</text>

  <line x1="94" y1="201.2" x2="100" y2="201.2" stroke="#8a8a8a"/><text x="76" y="205" fill="#8a8a8a">4</text>
  <line x1="94" y1="152.5" x2="100" y2="152.5" stroke="#8a8a8a"/><text x="76" y="157" fill="#8a8a8a">8</text>
  <line x1="94" y1="103.7" x2="100" y2="103.7" stroke="#8a8a8a"/><text x="72" y="108" fill="#8a8a8a">12</text>
  <line x1="94" y1="55" x2="100" y2="55" stroke="#8a8a8a"/><text x="72" y="59" fill="#8a8a8a">16</text>

  <!-- uniform-warming reference -->
  <line x1="231.4" y1="250" x2="231.4" y2="60" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="146" y="74" fill="#8a8a8a">uniform</text>

  <!-- tropical profile -->
  <path d="M 231.4,250 L 251.1,225.6 L 277.4,201.2 L 310.2,176.9 L 343.1,152.5 L 362.8,128.1 L 349.7,103.7 L 257.7,79.3 L 152.6,61.1"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="370" y="128" fill="#4a90d9">tropics</text>
  <text x="370" y="144" fill="#4a90d9">(moist adiabat)</text>

  <!-- polar profile -->
  <path d="M 468.4,250 L 336.5,237.8 L 257.7,225.6 L 218.3,213.4 L 198.6,189.1 L 192.0,164.7 L 185.4,140.3 L 178.8,115.9 L 165.7,91.5"
        fill="none" stroke="#e0645c" stroke-width="3"/>
  <text x="474" y="244" fill="#e0645c">poles</text>

  <!-- annotations -->
  <text x="372" y="176" fill="#4a90d9">emits more &#8594;</text>
  <text x="372" y="192" fill="#4a90d9">negative lapse-rate feedback</text>
  <text x="330" y="306" fill="#e0645c">surface-trapped &#8594; positive lapse-rate feedback</text>
</svg>
