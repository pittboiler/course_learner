<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Same record, two fifteen-year windows: 0.08 K/decade and 0.27 K/decade. Neither is the trend.</text>

  <line x1="90" y1="255" x2="625" y2="255" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="90" y1="255" x2="90" y2="60" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="18" y="140" fill="#8a8a8a">&#916;T (K)</text>
  <text x="18" y="156" fill="#8a8a8a">vs 1850&#8211;1900</text>
  <text x="76" y="210" fill="#8a8a8a">0.5</text>
  <text x="76" y="149" fill="#8a8a8a">1.0</text>
  <text x="76" y="88" fill="#8a8a8a">1.5</text>
  <line x1="186" y1="255" x2="186" y2="261" stroke="#8a8a8a"/><text x="172" y="275" fill="#8a8a8a">1980</text>
  <line x1="283" y1="255" x2="283" y2="261" stroke="#8a8a8a"/><text x="269" y="275" fill="#8a8a8a">1990</text>
  <line x1="379" y1="255" x2="379" y2="261" stroke="#8a8a8a"/><text x="365" y="275" fill="#8a8a8a">2000</text>
  <line x1="475" y1="255" x2="475" y2="261" stroke="#8a8a8a"/><text x="461" y="275" fill="#8a8a8a">2010</text>
  <line x1="571" y1="255" x2="571" y2="261" stroke="#8a8a8a"/><text x="557" y="275" fill="#8a8a8a">2020</text>

  <path d="M 90,231 L 100,240 L 109,228 L 119,214 L 129,237 L 138,233 L 148,243 L 157,210 L 167,221 L 177,214 L 186,204 L 196,200 L 206,216 L 215,199 L 225,218 L 234,221 L 244,214 L 254,196 L 263,194 L 273,206 L 283,187 L 292,188 L 302,209 L 311,205 L 321,196 L 331,184 L 340,196 L 350,176 L 360,161 L 369,187 L 379,184 L 389,171 L 398,164 L 408,164 L 417,170 L 427,158 L 437,161 L 446,158 L 456,176 L 466,160 L 475,151 L 485,170 L 494,164 L 504,160 L 514,153 L 523,134 L 533,116 L 543,127 L 552,138 L 562,126 L 571,116 L 581,132 L 591,129 L 600,94 L 610,78"
        fill="none" stroke="#8a8a8a" stroke-width="1.6"/>

  <!-- 1992-2006 window: fast -->
  <rect x="302" y="60" width="135" height="195" fill="#4a90d9" opacity="0.10"/>
  <line x1="302" y1="202" x2="437" y2="156" stroke="#4a90d9" stroke-width="3"/>
  <text x="242" y="222" fill="#4a90d9">1992&#8211;2006:</text>
  <text x="242" y="236" fill="#4a90d9">0.27 K/decade</text>

  <!-- 1998-2012 window: slow -->
  <rect x="360" y="60" width="134" height="195" fill="#e0645c" opacity="0.10"/>
  <line x1="360" y1="173" x2="494" y2="160" stroke="#e0645c" stroke-width="3"/>
  <text x="500" y="186" fill="#e0645c">1998&#8211;2012:</text>
  <text x="500" y="200" fill="#e0645c">0.08 K/decade</text>

  <!-- full trend -->
  <line x1="90" y1="228" x2="610" y2="118" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="100" y="96" fill="#8a8a8a">1970&#8211;2024: 0.19 K/decade</text>

  <circle cx="360" cy="161" r="4" fill="#e0645c"/>
  <text x="316" y="150" fill="#e0645c">1998 El Ni&#241;o</text>
  <text x="248" y="308" fill="#8a8a8a">the two windows overlap by nine years</text>
</svg>
