  <text x="20" y="140" fill="#8a8a8a">fraction</text>
  <text x="24" y="156" fill="#8a8a8a">of DIC</text>
  <text x="82" y="74" fill="#8a8a8a">1</text>
  <text x="82" y="254" fill="#8a8a8a">0</text>
  <line x1="200" y1="250" x2="200" y2="256" stroke="#8a8a8a"/><text x="196" y="270" fill="#8a8a8a">6</text>
  <line x1="300" y1="250" x2="300" y2="256" stroke="#8a8a8a"/><text x="296" y="270" fill="#8a8a8a">7</text>
  <line x1="400" y1="250" x2="400" y2="256" stroke="#8a8a8a"/><text x="396" y="270" fill="#8a8a8a">8</text>
  <line x1="500" y1="250" x2="500" y2="256" stroke="#8a8a8a"/><text x="496" y="270" fill="#8a8a8a">9</text>
  <line x1="600" y1="250" x2="600" y2="256" stroke="#8a8a8a"/><text x="596" y="270" fill="#8a8a8a">10</text>

  <path d="M 100,92 L 140,117 L 180,154 L 220,194 L 260,223 L 300,238 L 340,245 L 380,248 L 420,249 L 460,250 L 500,250 L 560,250 L 600,250"
        fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="106" y="86" fill="#8a8a8a">CO&#8322;*</text>

  <path d="M 100,228 L 140,203 L 180,166 L 220,126 L 260,98 L 300,84 L 340,80 L 380,84 L 420,99 L 460,128 L 500,168 L 540,205 L 580,229 L 600,236"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="306" y="74" fill="#4a90d9">HCO&#8323;&#8315;</text>

  <path d="M 100,250 L 200,250 L 260,249 L 300,248 L 340,245 L 380,237 L 420,221 L 460,192 L 500,152 L 540,115 L 580,91 L 600,84"
        fill="none" stroke="#e0645c" stroke-width="3"/>
  <text x="560" y="76" fill="#e0645c">CO&#8323;&#178;&#8315;</text>

  <!-- ocean pH markers -->
  <line x1="417" y1="250" x2="417" y2="60" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="370" y1="250" x2="370" y2="60" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="417" cy="221" r="4" fill="#e0645c"/>
  <circle cx="405" cy="229" r="4" fill="#e0645c"/>
  <circle cx="370" cy="240" r="4" fill="#e0645c"/>
  <text x="424" y="70" fill="#8a8a8a">8.17 (1750)</text>
  <text x="300" y="70" fill="#8a8a8a">7.7 (2100, high)</text>

