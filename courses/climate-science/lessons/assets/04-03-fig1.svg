<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Seawater sits on the steep left flank of the carbonate curve: a small pH drop costs a lot of carbonate.</text>

  <line x1="100" y1="250" x2="620" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="100" y1="250" x2="100" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
