<svg viewBox="0 0 660 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">Effective radiative forcing, 1750 to 2019. Bars are best estimates; whiskers are 5 to 95 percent.</text>

  <!-- zero line -->
  <line x1="390" y1="34" x2="390" y2="284" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- x axis -->
  <line x1="290" y1="284" x2="640" y2="284" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="324" y1="284" x2="324" y2="290" stroke="#8a8a8a"/><text x="316" y="304" fill="#8a8a8a">&#8211;1</text>
  <line x1="390" y1="284" x2="390" y2="290" stroke="#8a8a8a"/><text x="386" y="304" fill="#8a8a8a">0</text>
  <line x1="456" y1="284" x2="456" y2="290" stroke="#8a8a8a"/><text x="452" y="304" fill="#8a8a8a">1</text>
  <line x1="522" y1="284" x2="522" y2="290" stroke="#8a8a8a"/><text x="518" y="304" fill="#8a8a8a">2</text>
  <line x1="588" y1="284" x2="588" y2="290" stroke="#8a8a8a"/><text x="584" y="304" fill="#8a8a8a">3</text>
  <text x="420" y="322" fill="#8a8a8a">W m&#8315;&#178;</text>

  <!-- CO2 -->
  <rect x="390" y="42" width="142.6" height="12" fill="#e0645c" opacity="0.35" stroke="#e0645c" stroke-width="1.3"/>
  <line x1="515.4" y1="48" x2="549.1" y2="48" stroke="#e0645c" stroke-width="1.3"/>
  <line x1="515.4" y1="44" x2="515.4" y2="52" stroke="#e0645c" stroke-width="1.3"/>
  <line x1="549.1" y1="44" x2="549.1" y2="52" stroke="#e0645c" stroke-width="1.3"/>
  <text x="285" y="52" fill="#8a8a8a" text-anchor="end">CO&#8322;  +2.16</text>

  <!-- CH4 -->
  <rect x="390" y="64" width="35.6" height="12" fill="#e0645c" opacity="0.35" stroke="#e0645c" stroke-width="1.3"/>
  <text x="285" y="74" fill="#8a8a8a" text-anchor="end">CH&#8324;  +0.54</text>

  <!-- Ozone -->
  <rect x="390" y="86" width="31.0" height="12" fill="#e0645c" opacity="0.35" stroke="#e0645c" stroke-width="1.3"/>
  <line x1="405.8" y1="92" x2="436.2" y2="92" stroke="#e0645c" stroke-width="1.3"/>
  <line x1="405.8" y1="88" x2="405.8" y2="96" stroke="#e0645c" stroke-width="1.3"/>
  <line x1="436.2" y1="88" x2="436.2" y2="96" stroke="#e0645c" stroke-width="1.3"/>
  <text x="285" y="96" fill="#8a8a8a" text-anchor="end">ozone  +0.47</text>

  <!-- halocarbons -->
  <rect x="390" y="108" width="27.1" height="12" fill="#e0645c" opacity="0.35" stroke="#e0645c" stroke-width="1.3"/>
  <text x="285" y="118" fill="#8a8a8a" text-anchor="end">halocarbons  +0.41</text>

  <!-- N2O -->
  <rect x="390" y="130" width="13.9" height="12" fill="#e0645c" opacity="0.35" stroke="#e0645c" stroke-width="1.3"/>
  <text x="285" y="140" fill="#8a8a8a" text-anchor="end">N&#8322;O  +0.21</text>

  <!-- aerosol-radiation -->
  <rect x="375.5" y="152" width="14.5" height="12" fill="#4a90d9" opacity="0.35" stroke="#4a90d9" stroke-width="1.3"/>
  <line x1="359.0" y1="158" x2="392.6" y2="158" stroke="#4a90d9" stroke-width="1.3"/>
  <line x1="359.0" y1="154" x2="359.0" y2="162" stroke="#4a90d9" stroke-width="1.3"/>
  <line x1="392.6" y1="154" x2="392.6" y2="162" stroke="#4a90d9" stroke-width="1.3"/>
  <text x="285" y="162" fill="#8a8a8a" text-anchor="end">aerosol&#8211;radiation  &#8211;0.22</text>

  <!-- aerosol-cloud -->
  <rect x="334.6" y="174" width="55.4" height="12" fill="#4a90d9" opacity="0.35" stroke="#4a90d9" stroke-width="1.3"/>
  <line x1="294.3" y1="180" x2="373.5" y2="180" stroke="#4a90d9" stroke-width="1.3"/>
  <line x1="294.3" y1="176" x2="294.3" y2="184" stroke="#4a90d9" stroke-width="1.3"/>
  <line x1="373.5" y1="176" x2="373.5" y2="184" stroke="#4a90d9" stroke-width="1.3"/>
  <text x="285" y="184" fill="#8a8a8a" text-anchor="end">aerosol&#8211;cloud  &#8211;0.84</text>

  <!-- land use -->
  <rect x="376.8" y="196" width="13.2" height="12" fill="#4a90d9" opacity="0.35" stroke="#4a90d9" stroke-width="1.3"/>
  <text x="285" y="206" fill="#8a8a8a" text-anchor="end">land-use albedo  &#8211;0.20</text>

  <!-- solar -->
  <rect x="390" y="218" width="1" height="12" fill="#8a8a8a" opacity="0.5" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="285" y="228" fill="#8a8a8a" text-anchor="end">solar  +0.01</text>

  <!-- total -->
  <line x1="290" y1="244" x2="640" y2="244" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 4"/>
  <rect x="390" y="252" width="179.5" height="14" fill="#e0645c" opacity="0.2" stroke="#e0645c" stroke-width="2"/>
  <line x1="519.4" y1="259" x2="619.7" y2="259" stroke="#e0645c" stroke-width="2"/>
  <line x1="519.4" y1="254" x2="519.4" y2="264" stroke="#e0645c" stroke-width="2"/>
  <line x1="619.7" y1="254" x2="619.7" y2="264" stroke="#e0645c" stroke-width="2"/>
  <text x="285" y="263" fill="#e0645c" text-anchor="end">total anthropogenic  +2.72</text>
</svg>
