  <text x="514" y="182" fill="#e0645c">ESM</text>
  <text x="514" y="196" fill="#8a8a8a">carbon feedbacks, TCRE</text>

  <circle cx="576" cy="216" r="6" fill="#4a90d9"/>
  <text x="588" y="212" fill="#4a90d9">km-scale</text>
