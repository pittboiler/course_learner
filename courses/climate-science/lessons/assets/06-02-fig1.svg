  <line x1="110" y1="250" x2="110" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="300" y="290" fill="#8a8a8a">process detail and spatial resolution &#8594;</text>
  <text x="18" y="130" fill="#8a8a8a">integration</text>
  <text x="24" y="146" fill="#8a8a8a">length</text>
  <text x="30" y="162" fill="#8a8a8a">(years)</text>

  <text x="72" y="82" fill="#8a8a8a">10&#8313;</text>
  <text x="72" y="116" fill="#8a8a8a">10&#8311;</text>
  <text x="72" y="150" fill="#8a8a8a">10&#8309;</text>
  <text x="72" y="185" fill="#8a8a8a">10&#179;</text>
  <text x="72" y="219" fill="#8a8a8a">10&#185;</text>
  <line x1="104" y1="77" x2="110" y2="77" stroke="#8a8a8a"/>
  <line x1="104" y1="112" x2="110" y2="112" stroke="#8a8a8a"/>
  <line x1="104" y1="146" x2="110" y2="146" stroke="#8a8a8a"/>
  <line x1="104" y1="181" x2="110" y2="181" stroke="#8a8a8a"/>
  <line x1="104" y1="215" x2="110" y2="215" stroke="#8a8a8a"/>

  <path d="M 159,77 C 250,100 350,150 576,216" fill="none" stroke="#4a90d9" stroke-width="2" stroke-dasharray="6 5"/>

  <circle cx="159" cy="77" r="6" fill="#4a90d9"/>
  <text x="170" y="72" fill="#4a90d9">energy-balance model</text>
  <text x="170" y="86" fill="#8a8a8a">equilibria, bistability, timescales</text>

  <circle cx="208" cy="112" r="6" fill="#4a90d9"/>
