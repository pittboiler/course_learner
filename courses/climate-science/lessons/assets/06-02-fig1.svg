<svg viewBox="0 0 660 310" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">You can have detail or you can have duration. Cost scales as the fourth power of resolution.</text>

