<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">Moisture races ahead of rainfall; the gap is circulation. Right: existing wet and dry zones intensify.</text>

  <!-- LEFT -->
  <line x1="90" y1="250" x2="335" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="90" y1="250" x2="90" y2="58" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="150" y="286" fill="#8a8a8a">global warming (K)</text>
  <text x="20" y="120" fill="#8a8a8a">percent</text>
  <text x="26" y="136" fill="#8a8a8a">change</text>
  <line x1="182" y1="250" x2="182" y2="256" stroke="#8a8a8a"/><text x="178" y="270" fill="#8a8a8a">2</text>
  <line x1="274" y1="250" x2="274" y2="256" stroke="#8a8a8a"/><text x="270" y="270" fill="#8a8a8a">4</text>
  <text x="72" y="209" fill="#8a8a8a">10</text>
  <text x="72" y="164" fill="#8a8a8a">20</text>
  <text x="72" y="119" fill="#8a8a8a">30</text>
  <text x="72" y="74" fill="#8a8a8a">40</text>

  <path d="M 90,250 L 136,218 L 182,185 L 228,149 L 274,110 L 320,69" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="196" y="112" fill="#4a90d9">column moisture</text>
  <text x="196" y="126" fill="#4a90d9">+7 percent per K</text>

  <path d="M 90,250 L 136,241 L 182,232 L 228,222 L 274,213 L 320,203" fill="none" stroke="#e0645c" stroke-width="3"/>
  <text x="150" y="198" fill="#e0645c">precipitation +2 per K</text>

  <line x1="228" y1="149" x2="228" y2="222" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="228,149 224,158 232,158" fill="#8a8a8a"/>
  <polygon points="228,222 224,213 232,213" fill="#8a8a8a"/>
  <text x="236" y="184" fill="#8a8a8a">the gap:</text>
  <text x="236" y="198" fill="#8a8a8a">&#8211;13 percent</text>
  <text x="236" y="212" fill="#8a8a8a">circulation</text>

  <!-- RIGHT -->
  <line x1="380" y1="165" x2="625" y2="165" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="380" y1="250" x2="380" y2="58" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="428" y="286" fill="#8a8a8a">change in P &#8211; E, by latitude</text>
  <text x="416" y="182" fill="#8a8a8a">60S</text>
  <text x="456" y="182" fill="#8a8a8a">30S</text>
  <text x="496" y="182" fill="#8a8a8a">EQ</text>
  <text x="536" y="182" fill="#8a8a8a">30N</text>
  <text x="576" y="182" fill="#8a8a8a">60N</text>

  <path d="M 380,161 L 400,149 L 420,129 L 440,121 L 460,201 L 480,185 L 500,101 L 520,189 L 540,205 L 560,129 L 580,125 L 600,145 L 620,161"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="486" y="90" fill="#4a90d9">ITCZ wetter</text>
  <text x="514" y="222" fill="#e0645c">subtropics drier</text>
  <line x1="540" y1="205" x2="540" y2="216" stroke="#e0645c" stroke-width="1"/>
  <line x1="460" y1="201" x2="512" y2="216" stroke="#e0645c" stroke-width="1"/>
  <text x="384" y="112" fill="#4a90d9">storm tracks wetter</text>
</svg>
