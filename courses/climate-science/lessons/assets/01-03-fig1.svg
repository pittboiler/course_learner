<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">A band whose wings fall off exponentially: each doubling widens the opaque core by the same amount.</text>

  <!-- axes -->
  <line x1="90" y1="250" x2="625" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="90" y1="250" x2="90" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="300" y="300" fill="#8a8a8a">wavenumber (cm&#8315;&#185;), CO&#8322; band centred at 667</text>
  <text x="20" y="150" fill="#8a8a8a">log&#8321;&#8320; &#964;</text>
  <text x="70" y="64" fill="#8a8a8a">4</text>
  <text x="70" y="216" fill="#8a8a8a">0</text>
  <text x="66" y="254" fill="#8a8a8a">&#8211;1</text>

  <!-- wavenumber ticks -->
  <line x1="177" y1="250" x2="177" y2="256" stroke="#8a8a8a"/><text x="163" y="270" fill="#8a8a8a">587</text>
  <line x1="350" y1="250" x2="350" y2="256" stroke="#8a8a8a"/><text x="336" y="270" fill="#8a8a8a">667</text>
  <line x1="523" y1="250" x2="523" y2="256" stroke="#8a8a8a"/><text x="509" y="270" fill="#8a8a8a">747</text>

  <!-- the band: log tau tent -->
  <path d="M 95.6,250 L 350,60 L 604.4,250" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="360" y="80" fill="#4a90d9">&#964;(&#957;) for present-day CO&#8322;</text>

  <!-- tau = 1 thresholds for 1x, 2x, 4x -->
  <line x1="90" y1="212" x2="625" y2="212" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="630" y="216" fill="#8a8a8a">&#964;=1</text>

  <!-- opaque-width bars -->
  <line x1="146.4" y1="212" x2="553.7" y2="212" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="131.2" y1="223.4" x2="568.8" y2="223.4" stroke="#e0645c" stroke-width="2.5" opacity="0.75"/>
  <line x1="115.8" y1="234.9" x2="584.2" y2="234.9" stroke="#e0645c" stroke-width="2.5" opacity="0.5"/>

  <text x="350" y="206" fill="#e0645c" text-anchor="middle">opaque width, 1&#215;</text>
  <text x="350" y="219" fill="#e0645c" text-anchor="middle" opacity="0.85">2&#215;</text>
  <text x="350" y="231" fill="#e0645c" text-anchor="middle" opacity="0.7">4&#215;</text>

  <!-- equal steps annotation -->
  <line x1="115.8" y1="245" x2="146.4" y2="245" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="115.8,245 123,241.5 123,248.5" fill="#e0645c"/>
  <polygon points="146.4,245 139,241.5 139,248.5" fill="#e0645c"/>
  <text x="98" y="288" fill="#e0645c">two equal steps</text>

  <!-- centre saturation note -->
  <line x1="350" y1="60" x2="350" y2="212" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="356" y="132" fill="#8a8a8a">core already opaque:</text>
  <text x="356" y="148" fill="#8a8a8a">adding gas does nothing here</text>
</svg>
