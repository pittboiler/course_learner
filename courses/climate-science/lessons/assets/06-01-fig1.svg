<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">One equation, three solutions: lose five percent of the sunlight, need thirty-four percent back.</text>

  <line x1="110" y1="255" x2="625" y2="255" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="110" y1="255" x2="110" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="300" y="298" fill="#8a8a8a">solar constant S (W m&#8315;&#178;)</text>
  <text x="18" y="140" fill="#8a8a8a">surface T</text>
  <text x="30" y="156" fill="#8a8a8a">(&#176;C)</text>
  <line x1="225" y1="255" x2="225" y2="261" stroke="#8a8a8a"/><text x="207" y="275" fill="#8a8a8a">1361</text>
  <line x1="324" y1="255" x2="324" y2="261" stroke="#8a8a8a"/><text x="306" y="275" fill="#8a8a8a">1500</text>
  <line x1="467" y1="255" x2="467" y2="261" stroke="#8a8a8a"/><text x="449" y="275" fill="#8a8a8a">1700</text>
  <text x="80" y="235" fill="#8a8a8a">&#8211;40</text>
  <text x="80" y="188" fill="#8a8a8a">&#8211;20</text>
  <text x="92" y="140" fill="#8a8a8a">0</text>
  <text x="86" y="93" fill="#8a8a8a">20</text>

  <path d="M 174,112 L 210,103 L 246,93 L 281,84 L 317,74 L 353,65" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="360" y="70" fill="#4a90d9">warm branch (ice-free) &#8212; stable</text>

  <path d="M 174,113 L 206,119 L 239,125 L 271,130 L 303,135 L 335,139 L 367,143 L 399,147 L 431,150 L 464,153 L 496,155 L 528,158 L 555,160"
        fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="330" y="128" fill="#8a8a8a">unstable branch</text>

  <path d="M 110,228 L 146,223 L 181,217 L 217,212 L 253,206 L 289,201 L 324,195 L 360,190 L 396,184 L 431,179 L 467,173 L 503,168 L 555,160"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="140" y="246" fill="#4a90d9">snowball branch &#8212; also stable</text>

  <circle cx="174" cy="112" r="5" fill="#e0645c"/>
  <text x="128" y="100" fill="#e0645c">fold</text>
  <text x="118" y="88" fill="#e0645c">S = 1290</text>
  <circle cx="555" cy="160" r="5" fill="#e0645c"/>
  <text x="562" y="152" fill="#e0645c">fold</text>
  <text x="562" y="140" fill="#e0645c">S = 1823</text>

  <circle cx="225" cy="99" r="5" fill="#8a8a8a"/>
  <text x="232" y="94" fill="#8a8a8a">today: 15.7 &#176;C</text>

  <line x1="174" y1="118" x2="174" y2="212" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="174,217 169,206 179,206" fill="#e0645c"/>
  <text x="180" y="180" fill="#e0645c">snowball</text>

  <line x1="555" y1="154" x2="555" y2="62" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="555,57 550,68 560,68" fill="#8a8a8a"/>
  <text x="500" y="96" fill="#8a8a8a">escape</text>
</svg>
