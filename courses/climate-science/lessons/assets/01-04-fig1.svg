<svg viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Four different numbers for the same doubling of CO&#8322;. The definition is not a detail.</text>

  <!-- axis -->
  <line x1="200" y1="240" x2="600" y2="240" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="200" y1="240" x2="200" y2="46" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="360" y="272" fill="#8a8a8a">forcing for 2&#215; CO&#8322; (W m&#8315;&#178;)</text>
  <line x1="288" y1="240" x2="288" y2="246" stroke="#8a8a8a"/><text x="283" y="260" fill="#8a8a8a">1</text>
  <line x1="376" y1="240" x2="376" y2="246" stroke="#8a8a8a"/><text x="371" y="260" fill="#8a8a8a">2</text>
  <line x1="464" y1="240" x2="464" y2="246" stroke="#8a8a8a"/><text x="459" y="260" fill="#8a8a8a">3</text>
  <line x1="552" y1="240" x2="552" y2="246" stroke="#8a8a8a"/><text x="547" y="260" fill="#8a8a8a">4</text>

  <!-- bars -->
  <rect x="200" y="58" width="246" height="26" fill="#8a8a8a" opacity="0.28" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="196" y="76" fill="#8a8a8a" text-anchor="end">instantaneous, TOA</text>
  <text x="454" y="76" fill="#8a8a8a">2.8</text>

  <rect x="200" y="98" width="361" height="26" fill="#8a8a8a" opacity="0.28" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="196" y="116" fill="#8a8a8a" text-anchor="end">instantaneous, tropopause</text>
  <text x="569" y="116" fill="#8a8a8a">4.1</text>

  <rect x="200" y="138" width="330" height="26" fill="#4a90d9" opacity="0.3" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="196" y="156" fill="#4a90d9" text-anchor="end">stratosphere-adjusted</text>
  <text x="538" y="156" fill="#4a90d9">3.75</text>

  <rect x="200" y="178" width="346" height="26" fill="#e0645c" opacity="0.3" stroke="#e0645c" stroke-width="1.5"/>
  <text x="196" y="196" fill="#e0645c" text-anchor="end">effective (ERF)</text>
  <text x="554" y="196" fill="#e0645c">3.93</text>

  <!-- what is allowed to move -->
  <text x="200" y="228" fill="#8a8a8a" font-style="italic">nothing moves &#8594; stratosphere relaxes &#8594; all rapid adjustments, SST held fixed</text>
</svg>
