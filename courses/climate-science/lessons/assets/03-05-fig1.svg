<svg viewBox="0 0 660 310" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">The fingerprint that settles it: a brighter Sun warms everything; greenhouse gases warm below and cool above.</text>

  <line x1="120" y1="250" x2="600" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="426.6" y1="250" x2="426.6" y2="55" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="300" y="288" fill="#8a8a8a">temperature trend (K per decade)</text>
  <text x="18" y="140" fill="#8a8a8a">altitude</text>
  <text x="24" y="156" fill="#8a8a8a">(km)</text>

  <line x1="153.9" y1="250" x2="153.9" y2="256" stroke="#8a8a8a"/><text x="139" y="270" fill="#8a8a8a">&#8211;0.8</text>
  <line x1="290.3" y1="250" x2="290.3" y2="256" stroke="#8a8a8a"/><text x="276" y="270" fill="#8a8a8a">&#8211;0.4</text>
  <text x="422" y="270" fill="#8a8a8a">0</text>
  <line x1="563" y1="250" x2="563" y2="256" stroke="#8a8a8a"/><text x="551" y="270" fill="#8a8a8a">0.4</text>

  <text x="100" y="254" fill="#8a8a8a">0</text>
  <text x="96" y="216" fill="#8a8a8a">10</text>
  <text x="96" y="178" fill="#8a8a8a">20</text>
  <text x="96" y="140" fill="#8a8a8a">30</text>
  <text x="96" y="102" fill="#8a8a8a">40</text>
  <text x="96" y="64" fill="#8a8a8a">50</text>

  <!-- tropopause -->
  <line x1="120" y1="193" x2="600" y2="193" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 6"/>
  <text x="124" y="188" fill="#8a8a8a">tropopause</text>

  <!-- GHG fingerprint -->
  <path d="M 494.7,250 L 508.4,231 L 528.8,212 L 522.0,204 L 443.6,193 L 341.4,182 L 307.4,166 L 273.3,136 L 205.2,98 L 153.9,68"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="160" y="60" fill="#4a90d9">greenhouse gases</text>

  <!-- Solar fingerprint -->
  <path d="M 457.3,250 L 460.7,231 L 464.1,212 L 460.7,197 L 457.3,182 L 460.7,155 L 467.5,117 L 477.7,79"
        fill="none" stroke="#e0645c" stroke-width="3"/>
  <text x="484" y="82" fill="#e0645c">a brighter Sun</text>

  <!-- Observations -->
  <circle cx="491.3" cy="250" r="4" fill="#8a8a8a"/>
  <circle cx="501.5" cy="231" r="4" fill="#8a8a8a"/>
  <circle cx="515.2" cy="212" r="4" fill="#8a8a8a"/>
  <circle cx="443.6" cy="193" r="4" fill="#8a8a8a"/>
  <circle cx="351.6" cy="182" r="4" fill="#8a8a8a"/>
  <circle cx="317.6" cy="166" r="4" fill="#8a8a8a"/>
  <circle cx="283.5" cy="136" r="4" fill="#8a8a8a"/>
  <circle cx="222.2" cy="98" r="4" fill="#8a8a8a"/>
  <text x="232" y="126" fill="#8a8a8a">observed</text>
</svg>
