<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="24" y="24" fill="#8a8a8a" font-style="italic" font-size="12">&#967; vs T: Curie &#8733; 1/T, Pauli flat, diamagnetism negative.</text>

  <!-- vertical chi axis -->
  <line x1="60" y1="252" x2="60" y2="66" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="60,66 55,76 65,76" fill="#8a8a8a"/>
  <text x="46" y="70" fill="#8a8a8a" font-style="italic">&#967;</text>

  <!-- horizontal T axis, drawn at chi = 0 -->
  <line x1="60" y1="210" x2="448" y2="210" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="448,210 438,205 438,215" fill="#8a8a8a"/>
  <text x="452" y="215" fill="#8a8a8a" font-style="italic">T</text>
  <text x="44" y="214" fill="#8a8a8a">0</text>

  <!-- Curie-law paramagnet: chi = C/T, diverging at low T (blue) -->
  <path d="M 87 124 L 95 143 L 106 160 L 121 173 L 143 183 L 172 190 L 216 196 L 283 200 L 356 203 L 430 204"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="104" y="112" fill="#4a90d9">Curie  &#967; = C/T</text>

  <!-- Pauli paramagnet: flat, T-independent, small positive (blue dashed) -->
  <line x1="80" y1="192" x2="430" y2="192" stroke="#4a90d9" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="300" y="186" fill="#4a90d9">Pauli (flat)</text>

  <!-- diamagnetism: small, negative, T-independent (coral) -->
  <line x1="80" y1="220" x2="430" y2="220" stroke="#e0645c" stroke-width="2.5"/>
  <text x="316" y="238" fill="#e0645c">diamagnetism  &#967; &lt; 0</text>
</svg>
