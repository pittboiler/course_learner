<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Each mode is a quantum oscillator: energy climbs in ħω rungs (left); temperature sets how many phonons ride it (right).</text>

  <!-- ===== left: energy ladder for one mode ===== -->

  <!-- energy axis -->
  <line x1="70" y1="290" x2="70" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,52 65,62 75,62" fill="#8a8a8a"/>
  <text x="46" y="60" fill="#8a8a8a">E</text>

  <!-- rungs at (n+1/2)ħω, spacing 45 px = ħω -->
  <!-- n = 0 -->
  <line x1="70" y1="250" x2="185" y2="250" stroke="#8a8a8a" stroke-width="2"/>
  <text x="192" y="255" fill="#8a8a8a">½ħω  (n=0)</text>
  <!-- n = 1 -->
  <line x1="70" y1="205" x2="185" y2="205" stroke="#8a8a8a" stroke-width="2"/>
  <text x="192" y="210" fill="#8a8a8a">3/2 ħω  (n=1)</text>
  <circle cx="128" cy="205" r="5" fill="#e0645c"/>
  <!-- n = 2 -->
  <line x1="70" y1="160" x2="185" y2="160" stroke="#8a8a8a" stroke-width="2"/>
  <text x="192" y="165" fill="#8a8a8a">5/2 ħω  (n=2)</text>
  <circle cx="116" cy="160" r="5" fill="#e0645c"/>
  <circle cx="140" cy="160" r="5" fill="#e0645c"/>
  <!-- n = 3 -->
  <line x1="70" y1="115" x2="185" y2="115" stroke="#8a8a8a" stroke-width="2"/>
  <text x="192" y="120" fill="#8a8a8a">7/2 ħω  (n=3)</text>
  <circle cx="104" cy="115" r="5" fill="#e0645c"/>
  <circle cx="128" cy="115" r="5" fill="#e0645c"/>
  <circle cx="152" cy="115" r="5" fill="#e0645c"/>

  <!-- one-quantum spacing bracket between n=1 and n=2 -->
  <line x1="55" y1="205" x2="55" y2="160" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="55,205 51,196 59,196" fill="#e0645c"/>
  <polygon points="55,160 51,169 59,169" fill="#e0645c"/>
  <text x="18" y="187" fill="#e0645c">ħω</text>
  <text x="90" y="308" fill="#e0645c" font-style="italic">each ● = one phonon</text>

  <!-- ===== right: Bose-Einstein occupation ===== -->

  <!-- axes -->
  <line x1="340" y1="280" x2="612" y2="280" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="612,280 602,275 602,285" fill="#8a8a8a"/>
  <text x="512" y="302" fill="#8a8a8a">ħω / k_B T</text>
  <line x1="340" y1="280" x2="340" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="340,52 335,62 345,62" fill="#8a8a8a"/>
  <text x="300" y="60" fill="#8a8a8a">⟨n⟩</text>

  <!-- x gridline at 1 (ħω = k_B T) -->
  <line x1="397.8" y1="280" x2="397.8" y2="70" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="384" y="296" fill="#8a8a8a">1</text>

  <!-- occupation curve  ⟨n⟩ = 1/(e^x - 1) -->
  <path d="M 368.9 64.3 L 374.7 109.7 L 380.5 142.0 L 386.2 165.8 L 397.8 198.5 L 412.3 223.8 L 426.7 239.8 L 455.6 258.1 L 484.5 267.5 L 513.4 272.7 L 542.3 275.6 L 571.2 277.4 L 600.1 278.4"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- annotations -->
  <text x="360" y="92" fill="#4a90d9" font-style="italic">soft modes:</text>
  <text x="360" y="108" fill="#4a90d9" font-style="italic">crowded</text>
  <text x="470" y="245" fill="#4a90d9" font-style="italic">stiff modes: frozen out</text>
</svg>
