<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="26" fill="#8a8a8a" font-style="italic">A shallow donor (just below E_c) drops an electron into the conduction band; a shallow acceptor (just above E_v) grabs one, leaving a hole.</text>

  <!-- energy axis -->
  <line x1="34" y1="300" x2="34" y2="60" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="34,60 29,72 39,72" fill="#8a8a8a"/>
  <text x="20" y="70" fill="#8a8a8a">E</text>

  <!-- ================= LEFT: n-type (donor) ================= -->
  <text x="60" y="52" fill="#4a90d9" font-weight="bold">n-type: donor</text>

  <!-- conduction band (shaded, above E_c) -->
  <rect x="60" y="70" width="230" height="40" fill="#4a90d9" opacity="0.15"/>
  <line x1="60" y1="110" x2="290" y2="110" stroke="#8a8a8a" stroke-width="2"/>
  <text x="294" y="115" fill="#8a8a8a">E_c</text>

  <!-- valence band (shaded, below E_v) -->
  <rect x="60" y="250" width="230" height="40" fill="#e0645c" opacity="0.15"/>
  <line x1="60" y1="250" x2="290" y2="250" stroke="#8a8a8a" stroke-width="2"/>
  <text x="294" y="255" fill="#8a8a8a">E_v</text>

  <!-- donor level: coral dashes just below E_c -->
  <line x1="120" y1="128" x2="210" y2="128" stroke="#e0645c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="120" y="146" fill="#e0645c">donor level</text>

  <!-- E_d gap marker -->
  <line x1="245" y1="110" x2="245" y2="128" stroke="#e0645c" stroke-width="1.2"/>
  <polygon points="245,110 241,118 249,118" fill="#e0645c"/>
  <polygon points="245,128 241,120 249,120" fill="#e0645c"/>
  <text x="252" y="124" fill="#e0645c">E_d</text>

  <!-- electron promoted: from donor up into conduction band -->
  <line x1="165" y1="126" x2="165" y2="92" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="165,88 161,98 169,98" fill="#4a90d9"/>
  <circle cx="165" cy="90" r="5" fill="#4a90d9"/>
  <text x="174" y="86" fill="#4a90d9">e⁻</text>
  <!-- left-behind ionized donor (+) -->
  <text x="150" y="133" fill="#8a8a8a" font-size="12">+</text>

  <!-- ================= RIGHT: p-type (acceptor) ================= -->
  <text x="360" y="52" fill="#e0645c" font-weight="bold">p-type: acceptor</text>

  <!-- conduction band -->
  <rect x="360" y="70" width="230" height="40" fill="#4a90d9" opacity="0.15"/>
  <line x1="360" y1="110" x2="590" y2="110" stroke="#8a8a8a" stroke-width="2"/>
  <text x="594" y="115" fill="#8a8a8a">E_c</text>

  <!-- valence band -->
  <rect x="360" y="250" width="230" height="40" fill="#e0645c" opacity="0.15"/>
  <line x1="360" y1="250" x2="590" y2="250" stroke="#8a8a8a" stroke-width="2"/>
  <text x="594" y="255" fill="#8a8a8a">E_v</text>

  <!-- acceptor level: coral dashes just above E_v -->
  <line x1="420" y1="232" x2="510" y2="232" stroke="#e0645c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="420" y="224" fill="#e0645c">acceptor level</text>

  <!-- E_a gap marker -->
  <line x1="545" y1="232" x2="545" y2="250" stroke="#e0645c" stroke-width="1.2"/>
  <polygon points="545,232 541,242 549,242" fill="#e0645c"/>
  <polygon points="545,250 541,240 549,240" fill="#e0645c"/>
  <text x="552" y="246" fill="#e0645c">E_a</text>

  <!-- electron grabbed up from valence band into acceptor level -->
  <line x1="465" y1="248" x2="465" y2="236" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="465,232 461,242 469,242" fill="#4a90d9"/>
  <circle cx="465" cy="232" r="5" fill="#4a90d9"/>
  <!-- hole left behind in valence band -->
  <circle cx="465" cy="270" r="5" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="474" y="275" fill="#e0645c">h⁺ (hole)</text>
</svg>
