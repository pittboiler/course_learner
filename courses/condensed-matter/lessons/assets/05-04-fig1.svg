<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">The Meissner effect: a superconductor expels the field (B = 0 inside); it survives only in a thin surface skin of depth λ_L.</text>

  <!-- ===== left: field lines bending around a superconducting sphere ===== -->

  <!-- superconductor sphere -->
  <circle cx="195" cy="180" r="70" fill="#e0645c" opacity="0.15"/>
  <circle cx="195" cy="180" r="70" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <!-- thin penetration skin (dashed blue ring just inside the surface) -->
  <circle cx="195" cy="180" r="61" fill="none" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="176" y="185" fill="#e0645c">B = 0</text>

  <!-- applied field lines (grey), flowing upward, deflected around the sphere -->
  <!-- far-left: straight -->
  <path d="M 60 300 L 60 50" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="60,45 55,56 65,56" fill="#8a8a8a"/>
  <!-- left, mild bow -->
  <path d="M 105 300 C 103 235, 96 210, 96 180 C 96 150, 103 125, 105 50" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="105,45 100,56 110,56" fill="#8a8a8a"/>
  <!-- left, strong bow around sphere -->
  <path d="M 148 300 C 148 258, 112 250, 112 180 C 112 110, 148 102, 148 50" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="148,45 143,56 153,56" fill="#8a8a8a"/>
  <!-- right, strong bow around sphere -->
  <path d="M 242 300 C 242 258, 278 250, 278 180 C 278 110, 242 102, 242 50" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="242,45 237,56 247,56" fill="#8a8a8a"/>
  <!-- right, mild bow -->
  <path d="M 285 300 C 287 235, 294 210, 294 180 C 294 150, 287 125, 285 50" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="285,45 280,56 290,56" fill="#8a8a8a"/>
  <!-- far-right: straight -->
  <path d="M 330 300 L 330 50" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="330,45 325,56 335,56" fill="#8a8a8a"/>

  <text x="30" y="290" fill="#8a8a8a">applied field H</text>

  <!-- ===== right: exponential decay of B into the surface ===== -->

  <!-- axes -->
  <line x1="450" y1="250" x2="640" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="640,250 630,245 630,255" fill="#8a8a8a"/>
  <line x1="450" y1="255" x2="450" y2="60" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="450,60 445,70 455,70" fill="#8a8a8a"/>
  <text x="437" y="72" fill="#8a8a8a">B</text>
  <text x="560" y="270" fill="#8a8a8a" font-style="italic">depth into surface</text>

  <!-- B(x) = B0 exp(-x / λ_L) -->
  <polyline points="450,80 460,117.6 470,146.9 480,169.7 490,187.5 500,201.3 510,212.1 520,220.5 530,227 550,236 570,241.5 590,244.9 610,246.6 630,248"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="456" y="96" fill="#4a90d9">B₀</text>

  <!-- mark λ_L where B has fallen to B0/e -->
  <line x1="490" y1="250" x2="490" y2="187.5" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line x1="450" y1="187.5" x2="490" y2="187.5" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="415" y="192" fill="#e0645c">B₀/e</text>
  <text x="480" y="268" fill="#e0645c">λ_L</text>
</svg>
