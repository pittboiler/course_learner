<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Integer quantum Hall effect: the Hall conductance locks onto integer multiples of e²/h (blue plateaus),</text>
  <text x="40" y="42" fill="#8a8a8a" font-style="italic">while the longitudinal resistance ρ_xx (coral) is zero on a plateau and spikes only where σ_xy jumps.</text>

  <!-- axes -->
  <line x1="80" y1="288" x2="590" y2="288" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="590,288 580,283 580,293" fill="#8a8a8a"/>
  <line x1="80" y1="296" x2="80" y2="70" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="80,70 75,80 85,80" fill="#8a8a8a"/>

  <!-- axis labels -->
  <text x="470" y="312" fill="#8a8a8a">magnetic field B  →</text>
  <text x="20" y="66" fill="#8a8a8a">σ_xy</text>
  <text x="14" y="82" fill="#8a8a8a">(e²/h)</text>

  <!-- y ticks / integer values -->
  <line x1="76" y1="232.5" x2="80" y2="232.5" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="237" fill="#8a8a8a">1</text>
  <line x1="76" y1="185" x2="80" y2="185" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="190" fill="#8a8a8a">2</text>
  <line x1="76" y1="137.5" x2="80" y2="137.5" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="142" fill="#8a8a8a">3</text>
  <line x1="76" y1="90" x2="80" y2="90" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="95" fill="#8a8a8a">4</text>

  <!-- faint plateau guide lines -->
  <line x1="80" y1="232.5" x2="560" y2="232.5" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="2 5" opacity="0.6"/>
  <line x1="80" y1="185" x2="560" y2="185" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="2 5" opacity="0.6"/>
  <line x1="80" y1="137.5" x2="560" y2="137.5" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="2 5" opacity="0.6"/>
  <line x1="80" y1="90" x2="560" y2="90" stroke="#8a8a8a" stroke-width="0.5" stroke-dasharray="2 5" opacity="0.6"/>

  <!-- sigma_xy staircase (read right-to-left as B grows: high field = low filling = low plateau) -->
  <path d="M 80 90 L 133 90 L 133 137.5 L 240 137.5 L 240 185 L 347 185 L 347 232.5 L 453 232.5 L 453 280 L 560 280"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="150" y="115" fill="#4a90d9">ν = 4</text>
  <text x="262" y="163" fill="#4a90d9">ν = 3</text>
  <text x="366" y="210" fill="#4a90d9">ν = 2</text>
  <text x="470" y="258" fill="#4a90d9">ν = 1</text>

  <!-- rho_xx: zero on plateaus, spikes at the transitions -->
  <path d="M 80 282 L 115 281 Q 133 214 151 281 L 222 281 Q 240 214 258 281 L 329 281 Q 347 214 365 281 L 435 281 Q 453 214 471 281 L 560 281"
        fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="150" y="205" fill="#e0645c">ρ_xx</text>
</svg>
