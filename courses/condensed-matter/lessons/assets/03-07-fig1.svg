<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Conduction is decided at the Fermi level: a partly filled band conducts; a filled band under a gap does not — unless the gap is small enough for heat to bridge it.</text>

  <!-- energy axis -->
  <line x1="28" y1="240" x2="28" y2="70" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="28,70 23,80 33,80" fill="#8a8a8a"/>
  <text x="14" y="80" fill="#8a8a8a">E</text>

  <!-- ===================== METAL ===================== -->
  <text x="140" y="58" fill="#8a8a8a" text-anchor="middle">METAL</text>
  <!-- single band, partially filled -->
  <rect x="80" y="95" width="120" height="115" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <!-- filled portion (up to E_F) -->
  <rect x="80" y="150" width="120" height="60" fill="#4a90d9" opacity="0.15"/>
  <line x1="80" y1="150" x2="200" y2="150" stroke="#4a90d9" stroke-width="2"/>
  <!-- Fermi level -->
  <line x1="66" y1="150" x2="214" y2="150" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="218" y="154" fill="#e0645c">E_F</text>
  <text x="140" y="290" fill="#8a8a8a" text-anchor="middle" font-style="italic">partially filled band</text>
  <text x="140" y="308" fill="#8a8a8a" text-anchor="middle" font-style="italic">g(E_F) ≠ 0</text>

  <!-- ===================== INSULATOR ===================== -->
  <text x="370" y="58" fill="#8a8a8a" text-anchor="middle">INSULATOR</text>
  <!-- conduction band (empty, coral) -->
  <rect x="310" y="91" width="120" height="42" fill="none" stroke="#e0645c" stroke-width="2"/>
  <!-- valence band (full, blue) -->
  <rect x="310" y="173" width="120" height="42" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <!-- large gap arrow -->
  <line x1="370" y1="133" x2="370" y2="173" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="370,133 366,142 374,142" fill="#e0645c"/>
  <polygon points="370,173 366,164 374,164" fill="#e0645c"/>
  <text x="378" y="157" fill="#e0645c">E_g (large)</text>
  <!-- Fermi level in gap -->
  <line x1="296" y1="153" x2="330" y2="153" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="266" y="157" fill="#e0645c">E_F</text>
  <text x="370" y="290" fill="#8a8a8a" text-anchor="middle" font-style="italic">full valence, empty conduction</text>
  <text x="370" y="308" fill="#8a8a8a" text-anchor="middle" font-style="italic">no carriers: g(E_F) = 0</text>

  <!-- ===================== SEMICONDUCTOR ===================== -->
  <text x="600" y="58" fill="#8a8a8a" text-anchor="middle">SEMICONDUCTOR</text>
  <!-- conduction band (mostly empty, coral) -->
  <rect x="540" y="105" width="120" height="42" fill="none" stroke="#e0645c" stroke-width="2"/>
  <!-- valence band (mostly full, blue) -->
  <rect x="540" y="163" width="120" height="42" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <!-- small gap arrow -->
  <line x1="600" y1="147" x2="600" y2="163" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="600,147 596,153 604,153" fill="#e0645c"/>
  <polygon points="600,163 596,157 604,157" fill="#e0645c"/>
  <text x="608" y="159" fill="#e0645c">E_g (small)</text>
  <!-- thermally promoted electrons (filled coral dots) near bottom of conduction band -->
  <circle cx="558" cy="141" r="4" fill="#e0645c"/>
  <circle cx="576" cy="141" r="4" fill="#e0645c"/>
  <circle cx="594" cy="141" r="4" fill="#e0645c"/>
  <!-- holes left behind (open circles) near top of valence band -->
  <circle cx="558" cy="169" r="4" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <circle cx="576" cy="169" r="4" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <circle cx="594" cy="169" r="4" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <!-- promotion arrow -->
  <line x1="636" y1="168" x2="636" y2="144" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="636,144 632,152 640,152" fill="#8a8a8a"/>
  <text x="642" y="162" fill="#8a8a8a" font-style="italic">kT</text>
  <text x="600" y="290" fill="#8a8a8a" text-anchor="middle" font-style="italic">small gap: a few electrons cross,</text>
  <text x="600" y="308" fill="#8a8a8a" text-anchor="middle" font-style="italic">leaving holes (○) behind</text>
</svg>
