<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Left: a Bravais lattice with primitive vectors and one primitive cell (blue). Right: the Wigner–Seitz cell (coral) around one point.</text>

  <!-- ===== left: lattice + primitive vectors + primitive cell ===== -->

  <!-- primitive cell (parallelogram O, O+a1, O+a1+a2, O+a2) -->
  <polygon points="70,240 130,240 154,186 94,186" fill="#4a90d9" opacity="0.15"/>
  <polygon points="70,240 130,240 154,186 94,186" fill="none" stroke="#4a90d9" stroke-width="1.5"/>

  <!-- lattice points (grey) -->
  <g fill="#8a8a8a">
    <circle cx="70"  cy="240" r="3.5"/><circle cx="130" cy="240" r="3.5"/><circle cx="190" cy="240" r="3.5"/><circle cx="250" cy="240" r="3.5"/>
    <circle cx="94"  cy="186" r="3.5"/><circle cx="154" cy="186" r="3.5"/><circle cx="214" cy="186" r="3.5"/><circle cx="274" cy="186" r="3.5"/>
    <circle cx="118" cy="132" r="3.5"/><circle cx="178" cy="132" r="3.5"/><circle cx="238" cy="132" r="3.5"/><circle cx="298" cy="132" r="3.5"/>
    <circle cx="142" cy="78"  r="3.5"/><circle cx="202" cy="78"  r="3.5"/><circle cx="262" cy="78"  r="3.5"/><circle cx="322" cy="78"  r="3.5"/>
  </g>

  <!-- primitive vectors a1, a2 (blue arrows from origin O=(70,240)) -->
  <line x1="70" y1="240" x2="130" y2="240" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="130,240 122,236 122,244" fill="#4a90d9"/>
  <text x="96" y="258" fill="#4a90d9" font-style="italic">a₁</text>

  <line x1="70" y1="240" x2="94" y2="186" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="94,186 93.6,196.7 86.3,193.5" fill="#4a90d9"/>
  <text x="62" y="206" fill="#4a90d9" font-style="italic">a₂</text>

  <text x="118" y="222" fill="#8a8a8a" font-style="italic" font-size="12">primitive cell</text>

  <!-- ===== right: Wigner–Seitz construction ===== -->

  <!-- dashed guides from centre P to nearest neighbours -->
  <g stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4">
    <line x1="490" y1="160" x2="550" y2="160"/>
    <line x1="490" y1="160" x2="430" y2="160"/>
    <line x1="490" y1="160" x2="514" y2="106"/>
    <line x1="490" y1="160" x2="466" y2="214"/>
    <line x1="490" y1="160" x2="526" y2="214"/>
    <line x1="490" y1="160" x2="454" y2="106"/>
  </g>

  <!-- Wigner–Seitz hexagon (perpendicular-bisector cell) -->
  <polygon points="520,141 484,125 460,141 460,179 496,195 520,179" fill="#e0645c" opacity="0.15"/>
  <polygon points="520,141 484,125 460,141 460,179 496,195 520,179" fill="none" stroke="#e0645c" stroke-width="2"/>

  <!-- neighbour lattice points (grey) -->
  <g fill="#8a8a8a">
    <circle cx="550" cy="160" r="3.5"/><circle cx="430" cy="160" r="3.5"/>
    <circle cx="514" cy="106" r="3.5"/><circle cx="466" cy="214" r="3.5"/>
    <circle cx="526" cy="214" r="3.5"/><circle cx="454" cy="106" r="3.5"/>
    <circle cx="574" cy="106" r="3.5"/><circle cx="406" cy="214" r="3.5"/>
  </g>

  <!-- central point (blue, highlighted) -->
  <circle cx="490" cy="160" r="4.5" fill="#4a90d9"/>

  <text x="438" y="252" fill="#8a8a8a" font-style="italic" font-size="12">Wigner–Seitz cell</text>
</svg>
