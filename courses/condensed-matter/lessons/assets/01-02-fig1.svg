<svg viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Left: the (111) plane cuts all three axes at intercept 1. Right: bcc (corner + body-center) and fcc (corner + face-centers).</text>

  <!-- ================= LEFT: cubic cell with (111) plane ================= -->
  <!-- cube edges (grey) -->
  <g stroke="#8a8a8a" stroke-width="1.5" fill="none">
    <line x1="60" y1="230" x2="150" y2="230"/>
    <line x1="60" y1="230" x2="100" y2="202"/>
    <line x1="60" y1="230" x2="60" y2="140"/>
    <line x1="150" y1="230" x2="190" y2="202"/>
    <line x1="150" y1="230" x2="150" y2="140"/>
    <line x1="100" y1="202" x2="190" y2="202"/>
    <line x1="100" y1="202" x2="100" y2="112"/>
    <line x1="60" y1="140" x2="150" y2="140"/>
    <line x1="60" y1="140" x2="100" y2="112"/>
    <line x1="190" y1="202" x2="190" y2="112"/>
    <line x1="150" y1="140" x2="190" y2="112"/>
    <line x1="100" y1="112" x2="190" y2="112"/>
  </g>

  <!-- (111) plane: triangle through the three unit intercepts -->
  <polygon points="150,230 100,202 60,140" fill="#e0645c" opacity="0.15"/>
  <polygon points="150,230 100,202 60,140" fill="none" stroke="#e0645c" stroke-width="2"/>
  <!-- intercept dots -->
  <circle cx="150" cy="230" r="3.5" fill="#e0645c"/>
  <circle cx="100" cy="202" r="3.5" fill="#e0645c"/>
  <circle cx="60" cy="140" r="3.5" fill="#e0645c"/>
  <text x="118" y="185" fill="#e0645c">(111)</text>

  <!-- axis arrows from origin (60,230) -->
  <line x1="60" y1="230" x2="168" y2="230" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="168,230 159,226 159,234" fill="#8a8a8a"/>
  <text x="172" y="235" fill="#8a8a8a">a</text>
  <line x1="60" y1="230" x2="112" y2="194" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="112,194 103,196 108,203" fill="#8a8a8a"/>
  <text x="116" y="193" fill="#8a8a8a">b</text>
  <line x1="60" y1="230" x2="60" y2="120" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="60,120 56,129 64,129" fill="#8a8a8a"/>
  <text x="50" y="118" fill="#8a8a8a">c</text>

  <text x="86" y="272" fill="#8a8a8a" font-style="italic">(111) plane</text>

  <!-- ================= MIDDLE: bcc ================= -->
  <g stroke="#8a8a8a" stroke-width="1.5" fill="none">
    <line x1="300" y1="210" x2="370" y2="210"/>
    <line x1="300" y1="210" x2="332" y2="188"/>
    <line x1="300" y1="210" x2="300" y2="140"/>
    <line x1="370" y1="210" x2="402" y2="188"/>
    <line x1="370" y1="210" x2="370" y2="140"/>
    <line x1="332" y1="188" x2="402" y2="188"/>
    <line x1="332" y1="188" x2="332" y2="118"/>
    <line x1="300" y1="140" x2="370" y2="140"/>
    <line x1="300" y1="140" x2="332" y2="118"/>
    <line x1="402" y1="188" x2="402" y2="118"/>
    <line x1="370" y1="140" x2="402" y2="118"/>
    <line x1="332" y1="118" x2="402" y2="118"/>
  </g>
  <!-- body-center guide line -->
  <line x1="300" y1="210" x2="402" y2="118" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- corner atoms -->
  <g fill="#4a90d9">
    <circle cx="300" cy="210" r="7"/><circle cx="370" cy="210" r="7"/>
    <circle cx="332" cy="188" r="7"/><circle cx="300" cy="140" r="7"/>
    <circle cx="402" cy="188" r="7"/><circle cx="370" cy="140" r="7"/>
    <circle cx="332" cy="118" r="7"/><circle cx="402" cy="118" r="7"/>
  </g>
  <!-- body center -->
  <circle cx="351" cy="164" r="8" fill="#4a90d9"/>
  <text x="330" y="272" fill="#8a8a8a" font-style="italic">bcc (2 atoms)</text>

  <!-- ================= RIGHT: fcc ================= -->
  <g stroke="#8a8a8a" stroke-width="1.5" fill="none">
    <line x1="490" y1="210" x2="560" y2="210"/>
    <line x1="490" y1="210" x2="522" y2="188"/>
    <line x1="490" y1="210" x2="490" y2="140"/>
    <line x1="560" y1="210" x2="592" y2="188"/>
    <line x1="560" y1="210" x2="560" y2="140"/>
    <line x1="522" y1="188" x2="592" y2="188"/>
    <line x1="522" y1="188" x2="522" y2="118"/>
    <line x1="490" y1="140" x2="560" y2="140"/>
    <line x1="490" y1="140" x2="522" y2="118"/>
    <line x1="592" y1="188" x2="592" y2="118"/>
    <line x1="560" y1="140" x2="592" y2="118"/>
    <line x1="522" y1="118" x2="592" y2="118"/>
  </g>
  <!-- corner atoms -->
  <g fill="#4a90d9">
    <circle cx="490" cy="210" r="7"/><circle cx="560" cy="210" r="7"/>
    <circle cx="522" cy="188" r="7"/><circle cx="490" cy="140" r="7"/>
    <circle cx="592" cy="188" r="7"/><circle cx="560" cy="140" r="7"/>
    <circle cx="522" cy="118" r="7"/><circle cx="592" cy="118" r="7"/>
  </g>
  <!-- face-center atoms (coral to distinguish the extra sites) -->
  <g fill="#e0645c">
    <circle cx="541" cy="199" r="7"/>
    <circle cx="541" cy="129" r="7"/>
    <circle cx="525" cy="175" r="7"/>
    <circle cx="557" cy="153" r="7"/>
    <circle cx="506" cy="164" r="7"/>
    <circle cx="576" cy="164" r="7"/>
  </g>
  <text x="520" y="272" fill="#8a8a8a" font-style="italic">fcc (4 atoms)</text>
</svg>
