<svg viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Superconducting density of states: a clean gap 2Δ about E_F, with states piled into coherence peaks at ±Δ.</text>

  <!-- axes -->
  <line x1="50" y1="255" x2="580" y2="255" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="580,255 570,250 570,260" fill="#8a8a8a"/>
  <text x="560" y="278" fill="#8a8a8a">E</text>
  <line x1="50" y1="255" x2="50" y2="60" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="50,60 45,70 55,70" fill="#8a8a8a"/>
  <text x="8" y="70" fill="#8a8a8a">g(E)</text>

  <!-- normal-metal DOS reference (flat, grey dashed) -->
  <line x1="55" y1="165" x2="575" y2="165" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="475" y="158" fill="#8a8a8a" font-style="italic">normal g(E)</text>

  <!-- E_F marker -->
  <line x1="310" y1="255" x2="310" y2="290" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="298" y="305" fill="#8a8a8a">E_F</text>

  <!-- shaded gap band (no states within 2Δ) -->
  <rect x="250" y="80" width="120" height="175" fill="#e0645c" opacity="0.15"/>

  <!-- BCS DOS: left branch (E < -Δ) -->
  <path d="M 250 255 L 249 82 L 244 98 L 236 116 L 220 133 L 190 150 L 130 159 L 60 162"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <!-- BCS DOS: right branch (E > +Δ) -->
  <path d="M 370 255 L 371 82 L 376 98 L 384 116 L 400 133 L 430 150 L 490 159 L 570 162"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- coherence peaks highlighted -->
  <circle cx="249" cy="82" r="4.5" fill="#e0645c"/>
  <circle cx="371" cy="82" r="4.5" fill="#e0645c"/>
  <text x="150" y="76" fill="#e0645c">coherence peak</text>
  <text x="392" y="76" fill="#e0645c">coherence peak</text>

  <!-- gap width marker 2Δ -->
  <line x1="250" y1="230" x2="370" y2="230" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="250,230 259,226 259,234" fill="#e0645c"/>
  <polygon points="370,230 361,226 361,234" fill="#e0645c"/>
  <text x="300" y="248" fill="#e0645c">2Δ</text>

  <!-- +/- Delta ticks -->
  <text x="238" y="273" fill="#8a8a8a">−Δ</text>
  <text x="360" y="273" fill="#8a8a8a">+Δ</text>
</svg>
