<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">A sharp atomic level (grey) broadens into a band of width 4t: E(k) = ε₀ − 2t cos(ka) across the Brillouin zone.</text>

  <!-- E axis -->
  <line x1="100" y1="258" x2="100" y2="72" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="100,72 95,82 105,82" fill="#8a8a8a"/>
  <text x="86" y="80" fill="#8a8a8a">E</text>

  <!-- k axis -->
  <line x1="70" y1="258" x2="560" y2="258" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="560,258 550,253 550,263" fill="#8a8a8a"/>
  <text x="564" y="263" fill="#8a8a8a">k</text>
  <!-- k ticks -->
  <line x1="120" y1="254" x2="120" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <text x="98" y="278" fill="#8a8a8a">−π/a</text>
  <line x1="320" y1="254" x2="320" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <text x="315" y="278" fill="#8a8a8a">0</text>
  <line x1="520" y1="254" x2="520" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <text x="504" y="278" fill="#8a8a8a">π/a</text>

  <!-- isolated atomic level (grey dashed reference at E = ε0) -->
  <line x1="40" y1="160" x2="100" y2="160" stroke="#8a8a8a" stroke-width="2"/>
  <text x="34" y="150" fill="#8a8a8a">isolated</text>
  <text x="40" y="180" fill="#8a8a8a">level</text>
  <line x1="100" y1="160" x2="520" y2="160" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="524" y="164" fill="#8a8a8a">ε₀</text>

  <!-- band top / bottom guide lines for the 4t bracket -->
  <line x1="120" y1="90" x2="580" y2="90" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="320" y1="230" x2="580" y2="230" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- the tight-binding cosine band  y = 160 + 70 cos(ka) -->
  <path d="M 120 90 L 140 93.4 L 160 103.4 L 180 118.8 L 200 138.4 L 220 160 L 240 181.6 L 260 201.2 L 280 216.6 L 300 226.6 L 320 230 L 340 226.6 L 360 216.6 L 380 201.2 L 400 181.6 L 420 160 L 440 138.4 L 460 118.8 L 480 103.4 L 500 93.4 L 520 90"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- bandwidth 4t bracket (coral) -->
  <line x1="570" y1="90" x2="570" y2="230" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="570,90 566,99 574,99" fill="#e0645c"/>
  <polygon points="570,230 566,221 574,221" fill="#e0645c"/>
  <text x="578" y="164" fill="#e0645c">4t</text>

  <!-- bonding (band bottom) -->
  <circle cx="320" cy="230" r="4" fill="#e0645c"/>
  <text x="286" y="248" fill="#e0645c">bonding</text>

  <!-- antibonding (band top) -->
  <circle cx="120" cy="90" r="4" fill="#e0645c"/>
  <circle cx="520" cy="90" r="4" fill="#e0645c"/>
  <text x="330" y="86" fill="#e0645c">antibonding (zone edge)</text>
</svg>
