<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Left: the free-electron parabola, filled up to E_F. Right: the same fill read off the density of states g(ε) ∝ √ε.</text>

  <!-- ================= LEFT: ε(k) parabola ================= -->

  <!-- k axis -->
  <line x1="40" y1="270" x2="320" y2="270" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="320,270 310,265 310,275" fill="#8a8a8a"/>
  <text x="324" y="275" fill="#8a8a8a">k</text>
  <!-- energy axis -->
  <line x1="170" y1="282" x2="170" y2="58" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="170,58 165,68 175,68" fill="#8a8a8a"/>
  <text x="150" y="66" fill="#8a8a8a">ε</text>
  <text x="152" y="285" fill="#8a8a8a">0</text>

  <!-- filled region: between E_F line (y=178) above and parabola arc below, from -k_F(82) to +k_F(258) -->
  <path d="M 82 178 L 258 178 L 246 201.7 L 228 230.2 L 210 251.1 L 192 264.3 L 170 270 L 148 264.3 L 130 251.1 L 112 230.2 L 94 201.7 Z" fill="#4a90d9" opacity="0.15"/>

  <!-- parabola ε = ħ²k²/2m, vertex (170,270) opening upward -->
  <path d="M 40 70 L 58 122 L 76 165.5 L 94 201.7 L 112 230.2 L 130 251.1 L 148 264.3 L 170 270 L 192 264.3 L 210 251.1 L 228 230.2 L 246 201.7 L 264 165.5 L 282 122 L 300 70"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- Fermi level line -->
  <line x1="40" y1="178" x2="300" y2="178" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="270" y="173" fill="#e0645c">E_F</text>

  <!-- k_F markers where parabola meets E_F (k = 170 ± 88 => 82 and 258) -->
  <line x1="82" y1="178" x2="82" y2="270" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="258" y1="178" x2="258" y2="270" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="62" y="286" fill="#e0645c">−k_F</text>
  <text x="244" y="286" fill="#e0645c">+k_F</text>

  <!-- ================= RIGHT: DOS g(ε) ================= -->

  <!-- ε axis (vertical, energy up) -->
  <line x1="400" y1="282" x2="400" y2="58" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="400,58 395,68 405,68" fill="#8a8a8a"/>
  <text x="384" y="66" fill="#8a8a8a">ε</text>
  <text x="382" y="285" fill="#8a8a8a">0</text>
  <!-- g axis (horizontal) -->
  <line x1="400" y1="270" x2="622" y2="270" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="622,270 612,265 612,275" fill="#8a8a8a"/>
  <text x="598" y="288" fill="#8a8a8a">g(ε)</text>

  <!-- filled portion up to E_F (coral shaded: T=0 Fermi-Dirac, fully occupied below E_F) -->
  <path d="M 400 270 L 456.8 250 L 480 230 L 498 210 L 513.5 190 L 521.8 178 L 400 178 Z" fill="#e0645c" opacity="0.15"/>

  <!-- g(ε) ∝ √ε curve, opening rightward -->
  <path d="M 400 270 L 456.8 250 L 480 230 L 498 210 L 513.5 190 L 521.8 178 L 527 170 L 539 150 L 550 130 L 560.6 110 L 570.4 90 L 579.6 70"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- Fermi level line -->
  <line x1="400" y1="178" x2="600" y2="178" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="558" y="173" fill="#e0645c">E_F</text>

  <!-- T=0 step annotations: occupied below, empty above -->
  <text x="415" y="245" fill="#e0645c">filled</text>
  <text x="430" y="128" fill="#8a8a8a">empty</text>
  <text x="512" y="250" fill="#4a90d9" font-style="italic">g ∝ √ε</text>
</svg>
