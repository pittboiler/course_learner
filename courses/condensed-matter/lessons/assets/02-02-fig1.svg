  <polyline fill="none" stroke="#4a90d9" stroke-width="2.5" points="70.0,218.5 75.0,218.6 80.0,218.9 85.0,219.4 90.0,220.1 95.0,221.0 100.0,222.2 105.0,223.4 110.0,224.9 115.0,226.5 120.0,228.3 125.0,230.2 130.0,232.3 135.0,234.5 140.0,236.8 145.0,239.3 150.0,241.8 155.0,244.4 160.0,247.2 165.0,250.0 170.0,252.9 175.0,255.8 180.0,258.9 185.0,262.0 190.0,265.2 195.0,268.4 200.0,271.7 205.0,275.0 210.0,278.4 215.0,281.8 220.0,285.3 225.0,288.8 230.0,292.4 235.0,295.9 240.0,299.6 245.0,303.2 250.0,306.9 255.0,310.6 260.0,314.3 265.0,318.0 270.0,321.8 275.0,325.5 280.0,329.3 285.0,333.1 290.0,337.0 295.0,340.8 300.0,344.6 305.0,348.5 310.0,352.3 315.0,356.1 320.0,360.0 325.0,356.1 330.0,352.3 335.0,348.5 340.0,344.6 345.0,340.8 350.0,337.0 355.0,333.1 360.0,329.3 365.0,325.5 370.0,321.8 375.0,318.0 380.0,314.3 385.0,310.6 390.0,306.9 395.0,303.2 400.0,299.6 405.0,295.9 410.0,292.4 415.0,288.8 420.0,285.3 425.0,281.8 430.0,278.4 435.0,275.0 440.0,271.7 445.0,268.4 450.0,265.2 455.0,262.0 460.0,258.9 465.0,255.8 470.0,252.9 475.0,250.0 480.0,247.2 485.0,244.4 490.0,241.8 495.0,239.3 500.0,236.8 505.0,234.5 510.0,232.3 515.0,230.2 520.0,228.3 525.0,226.5 530.0,224.9 535.0,223.4 540.0,222.2 545.0,221.0 550.0,220.1 555.0,219.4 560.0,218.9 565.0,218.6 570.0,218.5"/>
