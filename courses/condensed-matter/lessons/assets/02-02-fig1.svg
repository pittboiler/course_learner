<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Diatomic chain: two branches over the first Brillouin zone (M = 3m). A frequency gap opens at the zone boundary.</text>

  <!-- ==== motion insets ==== -->
  <!-- acoustic: in-phase (blue arrows, same direction) -->
  <circle cx="100" cy="52" r="9" fill="#8a8a8a"/>
  <circle cx="150" cy="52" r="6" fill="#8a8a8a"/>
  <line x1="100" y1="52" x2="124" y2="52" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="124,52 118,49 118,55" fill="#4a90d9"/>
  <line x1="150" y1="52" x2="174" y2="52" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="174,52 168,49 168,55" fill="#4a90d9"/>
  <text x="70" y="76" fill="#8a8a8a" font-size="12.5">acoustic — atoms in phase</text>

  <!-- optical: out-of-phase (coral arrows, opposite directions) -->
  <circle cx="400" cy="52" r="9" fill="#8a8a8a"/>
  <circle cx="450" cy="52" r="6" fill="#8a8a8a"/>
  <line x1="400" y1="52" x2="376" y2="52" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="376,52 382,49 382,55" fill="#e0645c"/>
  <line x1="450" y1="52" x2="474" y2="52" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="474,52 468,49 468,55" fill="#e0645c"/>
  <text x="368" y="76" fill="#8a8a8a" font-size="12.5">optical — atoms out of phase</text>

  <!-- ==== forbidden gap band ==== -->
  <rect x="70" y="114.9" width="500" height="103.7" fill="#e0645c" opacity="0.15"/>
  <text x="320" y="171" fill="#e0645c" font-style="italic" text-anchor="middle" font-size="13">forbidden gap</text>

  <!-- ==== axes ==== -->
  <line x1="55" y1="360" x2="55" y2="90" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="55,86 51,94 59,94" fill="#8a8a8a"/>
  <text x="40" y="98" fill="#8a8a8a" font-style="italic">ω</text>
  <line x1="50" y1="360" x2="600" y2="360" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="604,360 596,356 596,364" fill="#8a8a8a"/>
  <text x="602" y="378" fill="#8a8a8a" font-style="italic">k</text>

  <!-- zone-boundary guides -->
  <line x1="70" y1="360" x2="70" y2="100" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="570" y1="360" x2="570" y2="100" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="320" y1="360" x2="320" y2="80" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- k-axis ticks -->
  <text x="70" y="378" fill="#8a8a8a" text-anchor="middle" font-size="12.5">−π/a</text>
  <text x="320" y="378" fill="#8a8a8a" text-anchor="middle" font-size="12.5">0</text>
  <text x="570" y="378" fill="#8a8a8a" text-anchor="middle" font-size="12.5">π/a</text>

  <!-- frequency reference levels -->
  <line x1="55" y1="218.6" x2="570" y2="218.6" stroke="#8a8a8a" stroke-width="0.7" stroke-dasharray="2,3"/>
  <line x1="55" y1="114.9" x2="570" y2="114.9" stroke="#8a8a8a" stroke-width="0.7" stroke-dasharray="2,3"/>
  <text x="576" y="222" fill="#8a8a8a" font-size="11.5">√(2C/M)</text>
  <text x="576" y="118" fill="#8a8a8a" font-size="11.5">√(2C/m)</text>
  <text x="326" y="90" fill="#8a8a8a" font-size="11.5">ω₊(0)=√(2C(1/M+1/m))</text>

