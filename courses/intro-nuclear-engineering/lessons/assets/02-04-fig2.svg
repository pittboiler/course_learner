<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Average log-energy loss per collision &#958; &#8212; a bigger &#958; means far fewer collisions to reach thermal.</text>

  <!-- y axis -->
  <line x1="70" y1="60" x2="70" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="30" y="66" fill="#8a8a8a">&#958;</text>
  <line x1="66" y1="70" x2="70" y2="70" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="44" y="75" fill="#8a8a8a">1.0</text>
  <line x1="66" y1="160" x2="70" y2="160" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="44" y="165" fill="#8a8a8a">0.5</text>
  <text x="52" y="255" fill="#8a8a8a">0</text>

  <!-- x axis / baseline -->
  <line x1="70" y1="250" x2="580" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- H bar (coral, best per collision) -->
  <rect x="110" y="70" width="70" height="180" fill="#e0645c" opacity="0.28" stroke="#e0645c" stroke-width="2"/>
  <text x="130" y="62" fill="#e0645c">&#958;=1.00</text>
  <text x="112" y="270" fill="#8a8a8a">H (A=1)</text>
  <text x="112" y="288" fill="#8a8a8a">&#8776;18 coll.</text>

  <!-- D bar -->
  <rect x="230" y="119.5" width="70" height="130.5" fill="#4a90d9" opacity="0.2" stroke="#4a90d9" stroke-width="2"/>
  <text x="240" y="111" fill="#4a90d9">&#958;=0.73</text>
  <text x="232" y="270" fill="#8a8a8a">D (A=2)</text>
  <text x="232" y="288" fill="#8a8a8a">&#8776;25 coll.</text>

  <!-- C bar -->
  <rect x="350" y="221.6" width="70" height="28.4" fill="#4a90d9" opacity="0.2" stroke="#4a90d9" stroke-width="2"/>
  <text x="348" y="214" fill="#4a90d9">&#958;=0.16</text>
  <text x="346" y="270" fill="#8a8a8a">C (A=12)</text>
  <text x="346" y="288" fill="#8a8a8a">&#8776;115 coll.</text>

  <!-- U bar (essentially invisible) -->
  <rect x="470" y="248.5" width="70" height="1.5" fill="#4a90d9" opacity="0.2" stroke="#4a90d9" stroke-width="2"/>
  <text x="462" y="241" fill="#4a90d9">&#958;=0.008</text>
  <text x="460" y="270" fill="#8a8a8a">U (A=238)</text>
  <text x="460" y="288" fill="#8a8a8a">&#8776;2172 coll.</text>
</svg>
