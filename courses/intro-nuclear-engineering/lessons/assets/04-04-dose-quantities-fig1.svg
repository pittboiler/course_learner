<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="24" y="22" fill="#8a8a8a" font-style="italic">The dose ladder: energy deposited becomes biological hazard through two weightings.</text>

  <!-- ===== left: the dose ladder ===== -->

  <!-- Box D (absorbed dose) -->
  <rect x="34" y="238" width="212" height="52" rx="4" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="140" y="260" fill="#4a90d9" text-anchor="middle">Absorbed dose D</text>
  <text x="140" y="278" fill="#8a8a8a" text-anchor="middle">gray (J/kg)</text>

  <!-- arrow D -> H -->
  <line x1="140" y1="238" x2="140" y2="204" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="140,204 135,214 145,214" fill="#8a8a8a"/>
  <text x="150" y="224" fill="#e0645c">&#215; w</text>
  <text x="176" y="228" fill="#e0645c" font-size="11">R</text>
  <text x="252" y="224" fill="#8a8a8a" font-size="12">(how it ionizes)</text>

  <!-- Box H (equivalent dose) -->
  <rect x="34" y="152" width="212" height="52" rx="4" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="140" y="174" fill="#4a90d9" text-anchor="middle">Equivalent dose H</text>
  <text x="140" y="192" fill="#8a8a8a" text-anchor="middle">sievert (per tissue)</text>

  <!-- arrow H -> E -->
  <line x1="140" y1="152" x2="140" y2="118" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="140,118 135,128 145,128" fill="#8a8a8a"/>
  <text x="150" y="138" fill="#e0645c">&#931; w</text>
  <text x="175" y="142" fill="#e0645c" font-size="11">T</text>
  <text x="252" y="138" fill="#8a8a8a" font-size="12">(which tissue)</text>

  <!-- Box E (effective dose) -->
  <rect x="34" y="66" width="212" height="52" rx="4" fill="#e0645c" opacity="0.15" stroke="#e0645c" stroke-width="2"/>
  <text x="140" y="88" fill="#e0645c" text-anchor="middle">Effective dose E</text>
  <text x="140" y="106" fill="#8a8a8a" text-anchor="middle">sievert (whole-body risk)</text>

  <!-- ===== right: w_R bar chart ===== -->
  <text x="470" y="52" fill="#8a8a8a" text-anchor="middle" font-style="italic">radiation weighting w</text>
  <text x="536" y="56" fill="#8a8a8a" font-size="11" font-style="italic">R</text>

  <!-- baseline -->
  <line x1="356" y1="274" x2="624" y2="274" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- y ticks -->
  <line x1="352" y1="274" x2="356" y2="274" stroke="#8a8a8a" stroke-width="1"/>
  <text x="348" y="278" fill="#8a8a8a" text-anchor="end" font-size="11">0</text>
  <line x1="352" y1="184" x2="356" y2="184" stroke="#8a8a8a" stroke-width="1"/>
  <text x="348" y="188" fill="#8a8a8a" text-anchor="end" font-size="11">10</text>
  <line x1="352" y1="94" x2="356" y2="94" stroke="#8a8a8a" stroke-width="1"/>
  <text x="348" y="98" fill="#8a8a8a" text-anchor="end" font-size="11">20</text>

  <!-- bar: beta/gamma/x, wR = 1 -->
  <rect x="372" y="265" width="50" height="9" fill="#4a90d9" opacity="0.7" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="397" y="290" fill="#8a8a8a" text-anchor="middle" font-size="12">&#946;, &#947;, x</text>
  <text x="397" y="304" fill="#8a8a8a" text-anchor="middle" font-size="11">1</text>

  <!-- bar: neutrons, ~2 to 20 (show ~10 solid, dashed range to 20) -->
  <rect x="452" y="184" width="50" height="90" fill="#4a90d9" opacity="0.7" stroke="#4a90d9" stroke-width="1.5"/>
  <line x1="452" y1="94" x2="502" y2="94" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="477" y1="184" x2="477" y2="94" stroke="#e0645c" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="477" y="290" fill="#8a8a8a" text-anchor="middle" font-size="12">neutrons</text>
  <text x="477" y="304" fill="#8a8a8a" text-anchor="middle" font-size="11">2&#8211;20</text>

  <!-- bar: alpha, wR = 20 -->
  <rect x="532" y="94" width="50" height="180" fill="#e0645c" opacity="0.7" stroke="#e0645c" stroke-width="1.5"/>
  <text x="557" y="290" fill="#8a8a8a" text-anchor="middle" font-size="12">&#945;</text>
  <text x="557" y="304" fill="#8a8a8a" text-anchor="middle" font-size="11">20</text>
</svg>
