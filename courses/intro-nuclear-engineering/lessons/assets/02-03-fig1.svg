<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="70" y="22" fill="#8a8a8a" font-style="italic">Absorption cross-section vs neutron energy (log&#8211;log): a 1/v slope at low E, resonance spikes in the epithermal band.</text>

  <!-- ===== gridlines (dashed, grey) ===== -->
  <line x1="152.7" y1="50" x2="152.7" y2="300" stroke="#8a8a8a" stroke-width="0.7" stroke-dasharray="2 5" opacity="0.6"/>
  <line x1="236" y1="50" x2="236" y2="300" stroke="#8a8a8a" stroke-width="0.7" stroke-dasharray="2 5" opacity="0.6"/>
  <line x1="392" y1="50" x2="392" y2="300" stroke="#8a8a8a" stroke-width="0.7" stroke-dasharray="2 5" opacity="0.6"/>
  <line x1="548" y1="50" x2="548" y2="300" stroke="#8a8a8a" stroke-width="0.7" stroke-dasharray="2 5" opacity="0.6"/>
  <line x1="80" y1="250" x2="600" y2="250" stroke="#8a8a8a" stroke-width="0.7" stroke-dasharray="2 5" opacity="0.6"/>
  <line x1="80" y1="150" x2="600" y2="150" stroke="#8a8a8a" stroke-width="0.7" stroke-dasharray="2 5" opacity="0.6"/>

  <!-- ===== axes ===== -->
  <line x1="80" y1="300" x2="612" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="612,300 602,295 602,305" fill="#8a8a8a"/>
  <line x1="80" y1="300" x2="80" y2="44" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="80,44 75,54 85,54" fill="#8a8a8a"/>

  <!-- y-axis label -->
  <text x="26" y="175" fill="#8a8a8a" transform="rotate(-90 26 175)" text-anchor="middle">absorption &#963; (barn)</text>
  <!-- x-axis label -->
  <text x="600" y="292" fill="#8a8a8a" text-anchor="end">neutron energy E</text>

  <!-- y tick labels -->
  <text x="72" y="254" fill="#8a8a8a" text-anchor="end">1</text>
  <text x="72" y="154" fill="#8a8a8a" text-anchor="end">100</text>
  <text x="72" y="54" fill="#8a8a8a" text-anchor="end">10&#8308;</text>

  <!-- x tick labels -->
  <text x="152.7" y="316" fill="#8a8a8a" text-anchor="middle">0.025 eV</text>
  <text x="236" y="316" fill="#8a8a8a" text-anchor="middle">1 eV</text>
  <text x="392" y="316" fill="#8a8a8a" text-anchor="middle">1 keV</text>
  <text x="548" y="316" fill="#8a8a8a" text-anchor="middle">1 MeV</text>

  <!-- region labels -->
  <text x="118" y="338" fill="#8a8a8a" text-anchor="middle" font-style="italic">thermal</text>
  <text x="330" y="338" fill="#8a8a8a" text-anchor="middle" font-style="italic">epithermal</text>
  <text x="548" y="338" fill="#8a8a8a" text-anchor="middle" font-style="italic">fast</text>

  <!-- ===== 1/v line (blue), corner to corner in log-log ===== -->
  <line x1="80" y1="50" x2="600" y2="300" stroke="#4a90d9" stroke-width="3"/>
  <text x="104" y="72" fill="#4a90d9" font-style="italic">&#963; &#8733; 1/v</text>

  <!-- thermal point marker -->
  <circle cx="152.7" cy="85" r="4" fill="#4a90d9"/>
  <text x="160" y="80" fill="#4a90d9">2200 m/s</text>

  <!-- ===== resonance spikes (coral) ===== -->
  <path d="M 275.8 145.6 L 278.8 55 L 281.8 145.6 Z" fill="#e0645c" stroke="#e0645c" stroke-width="1"/>
  <path d="M 300.6 157.5 L 303.6 95 L 306.6 157.5 Z" fill="#e0645c" stroke="#e0645c" stroke-width="1"/>
  <path d="M 314.5 164.2 L 317.5 80 L 320.5 164.2 Z" fill="#e0645c" stroke="#e0645c" stroke-width="1"/>
  <path d="M 327.6 170.5 L 330.6 112 L 333.6 170.5 Z" fill="#e0645c" stroke="#e0645c" stroke-width="1"/>
  <path d="M 337 175 L 340 100 L 343 175 Z" fill="#e0645c" stroke="#e0645c" stroke-width="1"/>
  <path d="M 351.5 182 L 354.5 128 L 357.5 182 Z" fill="#e0645c" stroke="#e0645c" stroke-width="1"/>
  <path d="M 361.8 186.9 L 364.8 120 L 367.8 186.9 Z" fill="#e0645c" stroke="#e0645c" stroke-width="1"/>
  <path d="M 373.3 192.5 L 376.3 150 L 379.3 192.5 Z" fill="#e0645c" stroke="#e0645c" stroke-width="1"/>
  <path d="M 383.9 197.5 L 386.9 138 L 389.9 197.5 Z" fill="#e0645c" stroke="#e0645c" stroke-width="1"/>

  <!-- resonance annotation -->
  <line x1="278.8" y1="55" x2="300" y2="46" stroke="#e0645c" stroke-width="0.8"/>
  <text x="304" y="50" fill="#e0645c">&#178;&#179;&#8312;U resonances</text>
</svg>
