<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="60" y="24" fill="#8a8a8a" font-style="italic">A charged particle deposits little at first, then dumps most of its energy in a spike &#8212; the Bragg peak &#8212; right before it stops.</text>

  <!-- y axis -->
  <line x1="60" y1="258" x2="60" y2="50" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="60,50 55,60 65,60" fill="#8a8a8a"/>
  <text x="52" y="48" fill="#8a8a8a" text-anchor="end">&#8722;dE/dx</text>

  <!-- x axis -->
  <line x1="60" y1="258" x2="590" y2="258" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="590,258 580,253 580,263" fill="#8a8a8a"/>
  <text x="586" y="280" fill="#8a8a8a" text-anchor="end">depth  x</text>
  <text x="52" y="263" fill="#8a8a8a" text-anchor="end">0</text>

  <!-- photon comparison: energy deposited falls off exponentially from the surface -->
  <path d="M 60 150 L 130 172 L 210 192 L 300 209 L 400 222 L 500 231 L 570 236"
        fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="330" y="205" fill="#8a8a8a">photons (&#8733; e&#8722;&#956;x)</text>

  <!-- charged-particle plateau (blue) -->
  <path d="M 60 218 L 120 215 L 180 211 L 240 206 L 300 199 L 350 190 L 390 178 L 420 162"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="150" y="200" fill="#4a90d9">plateau</text>

  <!-- the Bragg peak and the cliff to zero (coral) -->
  <path d="M 420 162 L 445 128 L 462 92 L 472 74 L 478 82 L 484 108 L 490 152 L 495 200 L 499 240 L 502 258"
        fill="none" stroke="#e0645c" stroke-width="3"/>
  <text x="430" y="66" fill="#e0645c">Bragg peak</text>

  <!-- range marker at the foot of the cliff -->
  <line x1="502" y1="258" x2="502" y2="120" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="502" y1="288" x2="502" y2="266" stroke="#8a8a8a" stroke-width="1"/>
  <text x="502" y="304" fill="#8a8a8a" text-anchor="middle">range R</text>
</svg>
