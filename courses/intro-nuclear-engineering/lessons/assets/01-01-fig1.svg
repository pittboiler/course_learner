<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">The label carries the bookkeeping; the radius barely grows because R &#8733; A^(1/3) &#8212; nuclei are packed at constant density.</text>

  <!-- ===== left: nuclide notation + a nucleus ===== -->

  <!-- the A_Z X label -->
  <text x="52" y="150" fill="#e0645c" font-size="20">A</text>
  <text x="52" y="205" fill="#4a90d9" font-size="20">Z</text>
  <text x="74" y="192" fill="#8a8a8a" font-size="48">X</text>

  <!-- leader arrows from label to nucleus -->
  <text x="60" y="250" fill="#8a8a8a" font-size="13">A = Z + N</text>

  <!-- nucleus -->
  <circle cx="215" cy="175" r="64" fill="#8a8a8a" opacity="0.10"/>
  <circle cx="215" cy="175" r="64" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- protons (coral, count Z) -->
  <circle cx="200" cy="150" r="7" fill="#e0645c"/>
  <circle cx="230" cy="155" r="7" fill="#e0645c"/>
  <circle cx="210" cy="180" r="7" fill="#e0645c"/>
  <circle cx="240" cy="185" r="7" fill="#e0645c"/>
  <circle cx="196" cy="205" r="7" fill="#e0645c"/>
  <circle cx="225" cy="207" r="7" fill="#e0645c"/>
  <circle cx="215" cy="132" r="7" fill="#e0645c"/>

  <!-- neutrons (blue, count N) -->
  <circle cx="184" cy="168" r="7" fill="#4a90d9"/>
  <circle cx="246" cy="167" r="7" fill="#4a90d9"/>
  <circle cx="205" cy="137" r="7" fill="#4a90d9"/>
  <circle cx="236" cy="136" r="7" fill="#4a90d9"/>
  <circle cx="190" cy="192" r="7" fill="#4a90d9"/>
  <circle cx="252" cy="190" r="7" fill="#4a90d9"/>
  <circle cx="220" cy="214" r="7" fill="#4a90d9"/>
  <circle cx="230" cy="180" r="7" fill="#4a90d9"/>

  <!-- legend -->
  <circle cx="60" cy="290" r="7" fill="#e0645c"/>
  <text x="74" y="295" fill="#8a8a8a">proton (Z of them)</text>
  <circle cx="60" cy="316" r="7" fill="#4a90d9"/>
  <text x="74" y="321" fill="#8a8a8a">neutron (N of them)</text>

  <!-- divider -->
  <line x1="322" y1="70" x2="322" y2="330" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- ===== right: R proportional to A^(1/3) at constant density ===== -->

  <!-- baseline -->
  <line x1="360" y1="238" x2="620" y2="238" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- A = 8, radius scale 16 -->
  <circle cx="382" cy="222" r="16" fill="#e0645c" opacity="0.16" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="382" y="266" fill="#8a8a8a" text-anchor="middle" font-size="13">A = 8</text>

  <!-- A = 64, radius scale 32 -->
  <circle cx="452" cy="206" r="32" fill="#e0645c" opacity="0.16" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="452" y="266" fill="#8a8a8a" text-anchor="middle" font-size="13">A = 64</text>

  <!-- A = 216, radius scale 48 -->
  <circle cx="558" cy="190" r="48" fill="#e0645c" opacity="0.16" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="558" y="266" fill="#8a8a8a" text-anchor="middle" font-size="13">A = 216</text>

  <!-- radius growth annotation -->
  <text x="360" y="100" fill="#e0645c" font-size="16">R &#8733; A</text>
  <text x="404" y="93" fill="#e0645c" font-size="11">1/3</text>
  <text x="360" y="124" fill="#8a8a8a" font-size="13">27&#215; the volume, only 3&#215; the radius</text>
  <text x="360" y="146" fill="#8a8a8a" font-size="13">density &#961; &#8776; constant</text>

  <!-- caption bottom right -->
  <text x="360" y="300" fill="#8a8a8a" font-size="13" font-style="italic">same shade inside = same packing of nucleons</text>
</svg>
