<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Step the potential, watch the current fall: i(t) &#8733; t^(&#8722;1/2) (Cottrell) as the depletion layer &#948;(t)=&#8730;(&#960;Dt) spreads outward.</text>

  <text x="55" y="52" fill="#8a8a8a" font-size="13">Current transient</text>

  <line x1="60" y1="230" x2="310" y2="230" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="310,230 300,225 300,235" fill="#8a8a8a"/>
  <text x="300" y="250" fill="#8a8a8a">t</text>
  <line x1="60" y1="230" x2="60" y2="60" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="60,60 55,70 65,70" fill="#8a8a8a"/>
  <text x="44" y="68" fill="#8a8a8a">i</text>
  <text x="46" y="245" fill="#8a8a8a">0</text>

  <path d="M 69 63.5 L 78 109 L 88 130 L 97 142 L 106 150 L 129 163 L 152 170 L 175 176 L 198 180 L 221 183 L 244 185 L 267 187 L 290 189"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="150" y="135" fill="#4a90d9">i(t) = nFAC*&#8730;(D/&#960;t)</text>

  <text x="205" y="150" fill="#8a8a8a" font-size="12">Cottrell plot</text>
  <line x1="205" y1="205" x2="300" y2="205" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="205" y1="205" x2="205" y2="158" stroke="#8a8a8a" stroke-width="1"/>
  <text x="298" y="220" fill="#8a8a8a" font-size="11">t^(&#8722;1/2)</text>
  <text x="192" y="163" fill="#8a8a8a" font-size="11">i</text>
  <line x1="205" y1="205" x2="292" y2="162" stroke="#e0645c" stroke-width="2.5"/>
  <circle cx="205" cy="205" r="2.5" fill="#e0645c"/>

  <text x="360" y="52" fill="#8a8a8a" font-size="13">Growing diffusion layer</text>

  <line x1="378" y1="90" x2="378" y2="235" stroke="#8a8a8a" stroke-width="3"/>
  <text x="352" y="165" fill="#8a8a8a" font-size="11" transform="rotate(-90 352 165)">electrode</text>

  <line x1="378" y1="235" x2="630" y2="235" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="630,235 620,230 620,240" fill="#8a8a8a"/>
  <text x="600" y="255" fill="#8a8a8a">distance from electrode</text>
  <line x1="378" y1="235" x2="378" y2="66" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="378,66 373,76 383,76" fill="#8a8a8a"/>
  <text x="360" y="74" fill="#8a8a8a">C</text>

  <line x1="378" y1="100" x2="620" y2="100" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="588" y="96" fill="#8a8a8a" font-size="12">C* (bulk)</text>

  <path d="M 378 235 L 420 100 L 620 100" fill="none" stroke="#e0645c" stroke-width="2.5" opacity="1"/>
  <path d="M 378 235 L 480 100 L 620 100" fill="none" stroke="#e0645c" stroke-width="2" opacity="0.7"/>
  <path d="M 378 235 L 545 100 L 620 100" fill="none" stroke="#e0645c" stroke-width="1.7" opacity="0.5"/>

  <text x="418" y="126" fill="#e0645c" font-size="12">t&#8321;</text>
  <text x="478" y="126" fill="#e0645c" font-size="12">t&#8322;</text>
  <text x="543" y="126" fill="#e0645c" font-size="12">t&#8323;</text>

  <line x1="420" y1="222" x2="545" y2="222" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="545,222 536,218 536,226" fill="#e0645c"/>
  <text x="452" y="216" fill="#e0645c" font-size="12">&#948;(t)=&#8730;(&#960;Dt)</text>

  <circle cx="378" cy="235" r="3" fill="#4a90d9"/>
  <text x="384" y="230" fill="#4a90d9" font-size="12">C&#8347; = 0</text>
</svg>
