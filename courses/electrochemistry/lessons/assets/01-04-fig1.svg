<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">One number, three faces: read the voltage, and you already know the free energy and the equilibrium constant.</text>

  <!-- ===== bridge deck (grey structure) ===== -->
  <line x1="70" y1="262" x2="570" y2="262" stroke="#8a8a8a" stroke-width="3"/>
  <line x1="135" y1="262" x2="135" y2="182" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="320" y1="262" x2="320" y2="200" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="505" y1="262" x2="505" y2="182" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="135" y1="182" x2="320" y2="200" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="505" y1="182" x2="320" y2="200" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ===== centre: the voltmeter (blue) ===== -->
  <text x="320" y="86" fill="#4a90d9" font-weight="bold" text-anchor="middle" font-size="16">E&#176;_cell  (the voltage)</text>
  <circle cx="320" cy="150" r="48" fill="#4a90d9" fill-opacity="0.10" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- scale arc -->
  <path d="M 283.6 129 A 42 42 0 0 1 356.4 129" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="320" y1="108" x2="320" y2="102" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="349.7" y1="120.3" x2="352.9" y2="117.1" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="290.3" y1="120.3" x2="287.1" y2="117.1" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- needle -->
  <line x1="320" y1="150" x2="335.2" y2="117.4" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="320" cy="150" r="4" fill="#4a90d9"/>
  <text x="320" y="182" fill="#8a8a8a" text-anchor="middle" font-size="12">voltmeter</text>
  <!-- the dial secretly reads Gibbs energy -->
  <text x="320" y="216" fill="#e0645c" text-anchor="middle" font-size="12">dial = &#8722;&#916;G / nF</text>

  <!-- ===== left node: Gibbs energy (coral) ===== -->
  <rect x="42" y="120" width="186" height="60" rx="8" fill="#e0645c" fill-opacity="0.12" stroke="#e0645c" stroke-width="2"/>
  <text x="135" y="146" fill="#e0645c" text-anchor="middle" font-size="16">&#916;G&#176; = &#8722;nFE&#176;</text>
  <text x="135" y="168" fill="#8a8a8a" text-anchor="middle" font-size="12">(&#8722;) &#8658; spontaneous</text>

  <!-- ===== right node: equilibrium constant (coral) ===== -->
  <rect x="412" y="120" width="186" height="60" rx="8" fill="#e0645c" fill-opacity="0.12" stroke="#e0645c" stroke-width="2"/>
  <text x="505" y="146" fill="#e0645c" text-anchor="middle" font-size="16">K = e^(nFE&#176;/RT)</text>
  <text x="505" y="168" fill="#8a8a8a" text-anchor="middle" font-size="12">&#8811; 1 &#8658; runs to completion</text>

  <!-- ===== connecting arrows (coral conversions) ===== -->
  <!-- centre -> left -->
  <line x1="270" y1="150" x2="232" y2="150" stroke="#e0645c" stroke-width="2"/>
  <polygon points="232,150 241,146 241,154" fill="#e0645c"/>
  <text x="251" y="140" fill="#e0645c" text-anchor="middle" font-size="12">&#215; (&#8722;nF)</text>
  <!-- centre -> right -->
  <line x1="370" y1="150" x2="408" y2="150" stroke="#e0645c" stroke-width="2"/>
  <polygon points="408,150 399,146 399,154" fill="#e0645c"/>
  <text x="389" y="140" fill="#e0645c" text-anchor="middle" font-size="12">nF/RT, then e^x</text>
</svg>
