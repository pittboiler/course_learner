<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Nernst: E falls linearly with log Q, slope -0.0592/n, crossing E&#176; at Q=1. Same couple, two concentrations, drives a cell.</text>

  <!-- ===== left: the Nernst line E vs log Q ===== -->

  <!-- x axis (log Q) -->
  <line x1="55" y1="255" x2="350" y2="255" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="350,255 340,250 340,260" fill="#8a8a8a"/>
  <text x="300" y="275" fill="#8a8a8a">log Q</text>
  <!-- y axis (E) -->
  <line x1="200" y1="255" x2="200" y2="60" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="200,60 195,70 205,70" fill="#8a8a8a"/>
  <text x="184" y="66" fill="#8a8a8a">E</text>
  <text x="180" y="272" fill="#8a8a8a">0</text>

  <!-- the Nernst line -->
  <line x1="60" y1="100" x2="340" y2="220" stroke="#4a90d9" stroke-width="3"/>
  <text x="252" y="185" fill="#4a90d9">slope = -0.0592/n</text>

  <!-- E-standard point at Q=1 (log Q = 0) -->
  <circle cx="200" cy="160" r="5" fill="#e0645c"/>
  <line x1="200" y1="160" x2="150" y2="160" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="96" y="164" fill="#e0645c">E&#176;</text>
  <text x="146" y="248" fill="#8a8a8a">Q&lt;1</text>
  <text x="212" y="248" fill="#8a8a8a">Q&gt;1</text>

  <!-- ===== right: concentration cell schematic ===== -->

  <!-- voltmeter -->
  <circle cx="510" cy="120" r="15" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="505" y="125" fill="#e0645c">E</text>

  <!-- wires -->
  <path d="M 450 175 L 450 120 L 495 120" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M 570 175 L 570 120 L 525 120" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- electrodes (same metal) -->
  <rect x="446" y="175" width="8" height="60" fill="#4a90d9" opacity="0.25" stroke="#4a90d9" stroke-width="2"/>
  <rect x="566" y="175" width="8" height="60" fill="#4a90d9" opacity="0.25" stroke="#4a90d9" stroke-width="2"/>

  <!-- left beaker (dilute) -->
  <path d="M 415 195 L 415 255 L 485 255 L 485 195" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="415" y1="205" x2="485" y2="205" stroke="#4a90d9" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
  <!-- right beaker (concentrated) -->
  <path d="M 535 195 L 535 255 L 605 255 L 605 195" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="535" y1="205" x2="605" y2="205" stroke="#4a90d9" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>

  <!-- salt bridge -->
  <path d="M 485 225 C 495 208, 525 208, 535 225" fill="none" stroke="#8a8a8a" stroke-width="2"/>

  <!-- labels -->
  <text x="422" y="278" fill="#e0645c">dilute</text>
  <text x="540" y="278" fill="#e0645c">conc.</text>
  <text x="470" y="163" fill="#8a8a8a" font-size="12">same metal</text>
</svg>
