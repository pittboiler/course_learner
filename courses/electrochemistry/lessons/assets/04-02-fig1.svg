<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Voltage waterfall: the ideal 1.23 V bleeds down through three overpotentials to a ~0.70 V operating point.</text>

  <!-- ===== voltage axis ===== -->
  <line x1="60" y1="292" x2="60" y2="46" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="60,46 55,56 65,56" fill="#8a8a8a"/>
  <text x="18" y="50" fill="#8a8a8a">E / V</text>

  <!-- axis ticks -->
  <line x1="55" y1="292" x2="60" y2="292" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="34" y="296" fill="#8a8a8a" font-size="12">0</text>
  <line x1="55" y1="197.7" x2="60" y2="197.7" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="26" y="201" fill="#8a8a8a" font-size="12">0.5</text>
  <line x1="55" y1="105.4" x2="60" y2="105.4" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="26" y="109" fill="#8a8a8a" font-size="12">1.0</text>

  <!-- baseline -->
  <line x1="60" y1="292" x2="620" y2="292" stroke="#8a8a8a" stroke-width="1"/>

  <!-- guide line at 1.23 V -->
  <line x1="60" y1="62.9" x2="620" y2="62.9" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="516" y="58" fill="#8a8a8a" font-size="11">1.23 V (thermo max)</text>

  <!-- ===== bar 1: ideal voltage (blue, full) ===== -->
  <rect x="80" y="62.9" width="78" height="229.1" fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="2"/>
  <text x="119" y="308" fill="#4a90d9" font-size="12" text-anchor="middle">ideal</text>
  <text x="119" y="322" fill="#4a90d9" font-size="12" text-anchor="middle">1.23 V</text>

  <!-- connector -->
  <line x1="158" y1="62.9" x2="190" y2="62.9" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- ===== loss 1: activation / ORR (coral, floating) ===== -->
  <rect x="190" y="62.9" width="78" height="64.6" fill="#e0645c" opacity="0.30" stroke="#e0645c" stroke-width="2"/>
  <text x="229" y="99" fill="#e0645c" font-size="12" text-anchor="middle">activation</text>
  <text x="229" y="113" fill="#e0645c" font-size="12" text-anchor="middle">(ORR)</text>
  <text x="229" y="308" fill="#e0645c" font-size="12" text-anchor="middle">&#8722;0.35</text>

  <!-- connector -->
  <line x1="268" y1="127.5" x2="300" y2="127.5" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- ===== loss 2: ohmic (coral, floating) ===== -->
  <rect x="300" y="127.5" width="78" height="22.2" fill="#e0645c" opacity="0.30" stroke="#e0645c" stroke-width="2"/>
  <text x="339" y="123" fill="#e0645c" font-size="12" text-anchor="middle">ohmic</text>
  <text x="339" y="308" fill="#e0645c" font-size="12" text-anchor="middle">&#8722;0.12</text>

  <!-- connector -->
  <line x1="378" y1="149.7" x2="410" y2="149.7" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- ===== loss 3: concentration (coral, floating) ===== -->
  <rect x="410" y="149.7" width="78" height="11.1" fill="#e0645c" opacity="0.30" stroke="#e0645c" stroke-width="2"/>
  <text x="449" y="140" fill="#e0645c" font-size="12" text-anchor="middle">conc.</text>
  <text x="449" y="308" fill="#e0645c" font-size="12" text-anchor="middle">&#8722;0.06</text>

  <!-- connector -->
  <line x1="488" y1="160.8" x2="520" y2="160.8" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- ===== bar final: operating voltage (blue, full) ===== -->
  <rect x="520" y="160.8" width="78" height="131.2" fill="#4a90d9" opacity="0.30" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="559" y="308" fill="#4a90d9" font-size="12" text-anchor="middle">operating</text>
  <text x="559" y="322" fill="#4a90d9" font-size="12" text-anchor="middle">0.70 V</text>
</svg>
