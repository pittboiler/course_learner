<svg viewBox="0 0 620 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Butler&#8211;Volmer: net current (blue) = anodic minus cathodic exponentials (coral dashed), crossing zero at &#951; = 0.</text>

