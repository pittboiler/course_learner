<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- title -->
  <text x="280" y="22" fill="#8a8a8a" text-anchor="middle">Nature draws Player 2's type</text>

  <!-- Nature node -->
  <circle cx="280" cy="44" r="7" fill="#8a8a8a"/>

  <!-- type branches from Nature -->
  <line x1="280" y1="44" x2="160" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="280" y1="44" x2="400" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="196" y="78" fill="#e0645c" text-anchor="middle">&#952;&#8321; = high   (prob p)</text>
  <text x="366" y="78" fill="#4a90d9" text-anchor="middle">&#952;&#8322; = low   (prob 1&#8722;p)</text>

  <!-- Player 1 information set (dashed) enclosing both P1 decision nodes -->
  <rect x="118" y="104" width="324" height="34" rx="17" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="4 4"/>
  <circle cx="160" cy="120" r="6" fill="#e0645c"/>
  <circle cx="400" cy="120" r="6" fill="#4a90d9"/>
  <text x="280" y="160" fill="#8a8a8a" text-anchor="middle" font-size="13">Player 1: one information set &#8212; moves without seeing &#952;</text>

  <!-- Player 1 actions (a1) from left node -->
  <line x1="160" y1="120" x2="112" y2="232" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="160" y1="120" x2="208" y2="232" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="120" y="180" fill="#8a8a8a" font-size="12">T</text>
  <text x="196" y="180" fill="#8a8a8a" font-size="12">B</text>

  <!-- Player 1 actions from right node -->
  <line x1="400" y1="120" x2="352" y2="232" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="400" y1="120" x2="448" y2="232" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="360" y="180" fill="#8a8a8a" font-size="12">T</text>
  <text x="436" y="180" fill="#8a8a8a" font-size="12">B</text>

  <!-- payoff leaves -->
  <rect x="100" y="234" width="24" height="10" fill="#e0645c" opacity="0.35"/>
  <rect x="196" y="234" width="24" height="10" fill="#e0645c" opacity="0.35"/>
  <rect x="340" y="234" width="24" height="10" fill="#4a90d9" opacity="0.35"/>
  <rect x="436" y="234" width="24" height="10" fill="#4a90d9" opacity="0.35"/>

  <text x="160" y="266" fill="#e0645c" text-anchor="middle" font-size="12">payoffs u(a&#8321;,a&#8322;; &#952;&#8321;)</text>
  <text x="400" y="266" fill="#4a90d9" text-anchor="middle" font-size="12">payoffs u(a&#8321;,a&#8322;; &#952;&#8322;)</text>

  <!-- P2 annotation -->
  <text x="280" y="298" fill="#8a8a8a" text-anchor="middle" font-size="13">Player 2 sees its own &#952; and best-responds by type:  s&#8322;(&#952;)</text>

  <!-- caption -->
  <text x="280" y="340" fill="#8a8a8a" text-anchor="middle" font-style="italic" font-size="13">Incomplete information = imperfect information about Nature's draw: hidden type, known prior.</text>
</svg>
