<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- ===== Battle of the Sexes bimatrix ===== -->

  <!-- player headings -->
  <text x="340" y="42" fill="#8a8a8a" text-anchor="middle" font-style="italic">Player 2 (Column) — prefers Football</text>
  <text x="150" y="205" fill="#8a8a8a" text-anchor="middle" font-style="italic" transform="rotate(-90 150 205)">Player 1 (Row) — prefers Opera</text>

  <!-- column labels -->
  <text x="275" y="92" fill="#8a8a8a" text-anchor="middle">Opera</text>
  <text x="405" y="92" fill="#8a8a8a" text-anchor="middle">Football</text>

  <!-- row labels -->
  <text x="200" y="160" fill="#8a8a8a" text-anchor="end">Opera</text>
  <text x="200" y="250" fill="#8a8a8a" text-anchor="end">Football</text>

  <!-- grid -->
  <rect x="210" y="105" width="260" height="180" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="340" y1="105" x2="340" y2="285" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="210" y1="195" x2="470" y2="195" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- NE circles (both-underlined cells) -->
  <ellipse cx="275" cy="150" rx="52" ry="30" fill="none" stroke="#2e9e6b" stroke-width="2.5"/>
  <ellipse cx="405" cy="240" rx="52" ry="30" fill="none" stroke="#2e9e6b" stroke-width="2.5"/>
  <text x="332" y="128" fill="#2e9e6b" font-size="12">NE</text>
  <text x="462" y="218" fill="#2e9e6b" font-size="12">NE</text>

  <!-- ===== payoffs: Player 1 blue, Player 2 red; underline = best response ===== -->
  <!-- (Opera, Opera): (2,1) both best responses -->
  <text x="258" y="157" fill="#4a90d9" font-size="22" text-anchor="middle">2</text>
  <text x="275" y="157" fill="#8a8a8a" font-size="22" text-anchor="middle">,</text>
  <text x="292" y="157" fill="#e0645c" font-size="22" text-anchor="middle">1</text>
  <line x1="249" y1="163" x2="267" y2="163" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="283" y1="163" x2="301" y2="163" stroke="#e0645c" stroke-width="2.5"/>

  <!-- (Opera, Football): (0,0) neither -->
  <text x="388" y="157" fill="#4a90d9" font-size="22" text-anchor="middle">0</text>
  <text x="405" y="157" fill="#8a8a8a" font-size="22" text-anchor="middle">,</text>
  <text x="422" y="157" fill="#e0645c" font-size="22" text-anchor="middle">0</text>

  <!-- (Football, Opera): (0,0) neither -->
  <text x="258" y="247" fill="#4a90d9" font-size="22" text-anchor="middle">0</text>
  <text x="275" y="247" fill="#8a8a8a" font-size="22" text-anchor="middle">,</text>
  <text x="292" y="247" fill="#e0645c" font-size="22" text-anchor="middle">0</text>

  <!-- (Football, Football): (1,2) both best responses -->
  <text x="388" y="247" fill="#4a90d9" font-size="22" text-anchor="middle">1</text>
  <text x="405" y="247" fill="#8a8a8a" font-size="22" text-anchor="middle">,</text>
  <text x="422" y="247" fill="#e0645c" font-size="22" text-anchor="middle">2</text>
  <line x1="379" y1="253" x2="397" y2="253" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="413" y1="253" x2="431" y2="253" stroke="#e0645c" stroke-width="2.5"/>

  <!-- legend -->
  <line x1="210" y1="308" x2="228" y2="308" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="234" y="313" fill="#8a8a8a" font-size="12">Row's best response</text>
  <line x1="360" y1="308" x2="378" y2="308" stroke="#e0645c" stroke-width="2.5"/>
  <text x="384" y="313" fill="#8a8a8a" font-size="12">Column's best response</text>

  <!-- caption -->
  <text x="500" y="150" fill="#8a8a8a" font-size="12">Both underlined</text>
  <text x="500" y="167" fill="#8a8a8a" font-size="12">in a cell ⇒</text>
  <text x="500" y="184" fill="#8a8a8a" font-size="12">Nash equilibrium.</text>
</svg>
