<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Fold from the leaves up: player 2 picks c on the left (1 &gt; 0) and f on the right (3 &gt; 2);</text>
  <text x="30" y="40" fill="#8a8a8a" font-style="italic">player 1 then compares 3 vs 1 and plays A. Bold = backward-induction path.</text>

  <!-- ===== edges (drawn first, nodes on top) ===== -->
  <!-- root -> right node (B) : normal -->
  <line x1="280" y1="58" x2="400" y2="152" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- right node -> leaf e : normal -->
  <line x1="400" y1="178" x2="335" y2="288" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- right node -> leaf f : normal -->
  <line x1="400" y1="178" x2="465" y2="288" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- left node -> leaf d : normal -->
  <line x1="160" y1="178" x2="225" y2="288" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- highlighted backward-induction path -->
  <!-- root -> left node (A) -->
  <line x1="280" y1="58" x2="160" y2="152" stroke="#e0645c" stroke-width="4.5"/>
  <!-- left node -> leaf c -->
  <line x1="160" y1="178" x2="95" y2="288" stroke="#e0645c" stroke-width="4.5"/>

  <!-- ===== action labels ===== -->
  <text x="205" y="98" fill="#c0392b" font-weight="bold">A</text>
  <text x="348" y="98" fill="#555555">B</text>
  <text x="110" y="238" fill="#c0392b" font-weight="bold">c</text>
  <text x="205" y="238" fill="#555555">d</text>
  <text x="352" y="238" fill="#555555">e</text>
  <text x="452" y="238" fill="#555555">f</text>

  <!-- ===== decision nodes ===== -->
  <circle cx="280" cy="45" r="14" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="280" y="50" fill="#555555" text-anchor="middle">1</text>
  <circle cx="160" cy="165" r="14" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="160" y="170" fill="#555555" text-anchor="middle">2</text>
  <circle cx="400" cy="165" r="14" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="400" y="170" fill="#555555" text-anchor="middle">2</text>

  <!-- ===== terminal nodes + payoffs ===== -->
  <circle cx="95"  cy="292" r="4" fill="#e0645c"/>
  <circle cx="225" cy="292" r="4" fill="#8a8a8a"/>
  <circle cx="335" cy="292" r="4" fill="#8a8a8a"/>
  <circle cx="465" cy="292" r="4" fill="#8a8a8a"/>
  <text x="95"  y="316" fill="#c0392b" font-weight="bold" text-anchor="middle">(3, 1)</text>
  <text x="225" y="316" fill="#555555" text-anchor="middle">(0, 0)</text>
  <text x="335" y="316" fill="#555555" text-anchor="middle">(2, 2)</text>
  <text x="465" y="316" fill="#555555" text-anchor="middle">(1, 3)</text>

  <!-- payoff-order note -->
  <text x="30" y="348" fill="#8a8a8a" font-style="italic">Leaf payoffs are ordered (player 1, player 2).</text>
</svg>
