<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="70" y="28" fill="#8a8a8a" font-style="italic">Prisoner's Dilemma: in each cell, (Row payoff, Column payoff). Higher is better.</text>

  <!-- column player heading -->
  <text x="325" y="58" fill="#8a8a8a" text-anchor="middle">Column player</text>
  <text x="255" y="88" fill="#8a8a8a" text-anchor="middle">Cooperate</text>
  <text x="395" y="88" fill="#8a8a8a" text-anchor="middle">Defect</text>

  <!-- row player heading -->
  <text x="42" y="205" fill="#8a8a8a" text-anchor="middle" transform="rotate(-90 42 205)">Row player</text>
  <text x="180" y="155" fill="#8a8a8a" text-anchor="end">Cooperate</text>
  <text x="180" y="245" fill="#8a8a8a" text-anchor="end">Defect</text>

  <!-- shaded dominant-strategy equilibrium cell (Defect, Defect) -->
  <rect x="325" y="205" width="140" height="90" fill="#8a8a8a" opacity="0.14"/>

  <!-- grid border and interior lines -->
  <rect x="185" y="115" width="280" height="180" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="325" y1="115" x2="325" y2="295" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="185" y1="205" x2="465" y2="205" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- payoffs: Row in blue, Column in red -->
  <text x="255" y="165" text-anchor="middle"><tspan fill="#4a90d9">3</tspan><tspan fill="#8a8a8a">, </tspan><tspan fill="#e0645c">3</tspan></text>
  <text x="395" y="165" text-anchor="middle"><tspan fill="#4a90d9">0</tspan><tspan fill="#8a8a8a">, </tspan><tspan fill="#e0645c">5</tspan></text>
  <text x="255" y="255" text-anchor="middle"><tspan fill="#4a90d9">5</tspan><tspan fill="#8a8a8a">, </tspan><tspan fill="#e0645c">0</tspan></text>
  <text x="395" y="255" text-anchor="middle"><tspan fill="#4a90d9">1</tspan><tspan fill="#8a8a8a">, </tspan><tspan fill="#e0645c">1</tspan></text>

  <!-- dominance arrows: Row prefers Defect (down), Column prefers Defect (right) -->
  <line x1="255" y1="176" x2="255" y2="240" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3 4"/>
  <polygon points="255,246 251,236 259,236" fill="#4a90d9"/>
  <line x1="406" y1="160" x2="454" y2="160" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <polygon points="460,160 450,156 450,164" fill="#e0645c"/>

  <!-- key -->
  <text x="70" y="330" fill="#4a90d9">Defect strictly dominates for Row (5&gt;3, 1&gt;0)</text>
  <text x="70" y="348" fill="#e0645c">Defect strictly dominates for Column (5&gt;3, 1&gt;0)</text>
</svg>
