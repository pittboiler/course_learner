<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- divider -->
  <line x1="280" y1="40" x2="280" y2="310" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ===== Panel A: forall x, exists y — each x has its OWN y ===== -->
  <text x="24" y="28" fill="#4a90d9" font-weight="bold">&#8704;x &#8707;y : y is a mother of x</text>
  <text x="24" y="46" fill="#8a8a8a" font-style="italic">everyone has a mother (their own)</text>

  <!-- arrows (own targets) -->
  <line x1="70" y1="110" x2="210" y2="110" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="210,110 200,105 200,115" fill="#4a90d9"/>
  <line x1="70" y1="180" x2="210" y2="180" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="210,180 200,175 200,185" fill="#4a90d9"/>
  <line x1="70" y1="250" x2="210" y2="250" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="210,250 200,245 200,255" fill="#4a90d9"/>

  <!-- x nodes -->
  <circle cx="60" cy="110" r="12" fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="52" y="115" fill="#4a90d9">x&#8321;</text>
  <circle cx="60" cy="180" r="12" fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="52" y="185" fill="#4a90d9">x&#8322;</text>
  <circle cx="60" cy="250" r="12" fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="52" y="255" fill="#4a90d9">x&#8323;</text>

  <!-- y nodes (distinct) -->
  <circle cx="222" cy="110" r="12" fill="#e0645c" opacity="0.18" stroke="#e0645c" stroke-width="1.5"/>
  <text x="214" y="115" fill="#e0645c">y&#8321;</text>
  <circle cx="222" cy="180" r="12" fill="#e0645c" opacity="0.18" stroke="#e0645c" stroke-width="1.5"/>
  <text x="214" y="185" fill="#e0645c">y&#8322;</text>
  <circle cx="222" cy="250" r="12" fill="#e0645c" opacity="0.18" stroke="#e0645c" stroke-width="1.5"/>
  <text x="214" y="255" fill="#e0645c">y&#8323;</text>

  <!-- ===== Panel B: exists y, forall x — ONE y for all x ===== -->
  <text x="304" y="28" fill="#4a90d9" font-weight="bold">&#8707;y &#8704;x : y is a mother of x</text>
  <text x="304" y="46" fill="#8a8a8a" font-style="italic">one single mother of everyone</text>

  <!-- arrows (all to shared node) -->
  <line x1="350" y1="110" x2="486" y2="172" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="486,172 475,169 478,179" fill="#4a90d9"/>
  <line x1="350" y1="180" x2="486" y2="180" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="486,180 476,175 476,185" fill="#4a90d9"/>
  <line x1="350" y1="250" x2="486" y2="188" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="486,188 478,181 475,191" fill="#4a90d9"/>

  <!-- x nodes -->
  <circle cx="340" cy="110" r="12" fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="332" y="115" fill="#4a90d9">x&#8321;</text>
  <circle cx="340" cy="180" r="12" fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="332" y="185" fill="#4a90d9">x&#8322;</text>
  <circle cx="340" cy="250" r="12" fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="332" y="255" fill="#4a90d9">x&#8323;</text>

  <!-- single shared y node -->
  <circle cx="498" cy="180" r="14" fill="#e0645c" opacity="0.28" stroke="#e0645c" stroke-width="2"/>
  <text x="491" y="185" fill="#e0645c">y</text>

  <!-- caption -->
  <text x="24" y="332" fill="#8a8a8a" font-style="italic">Swapping the two quantifiers changes what is claimed: many mothers (left) vs. one universal mother (right).</text>
</svg>
