<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- shaded region: (A ∪ B) complement = everything in the universe box OUTSIDE both circles -->
  <!-- rectangle with the two circles punched out via even-odd fill -->
  <path d="M 40 60 H 520 V 320 H 40 Z
           M 150 190 A 90 90 0 1 0 330 190 A 90 90 0 1 0 150 190 Z
           M 230 190 A 90 90 0 1 0 410 190 A 90 90 0 1 0 230 190 Z"
        fill="#8a8a8a" opacity="0.18" fill-rule="evenodd"/>

  <!-- universe boundary -->
  <rect x="40" y="60" width="480" height="260" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="48" y="80" fill="#8a8a8a" font-style="italic">U</text>

  <!-- circle A -->
  <circle cx="240" cy="190" r="90" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="168" y="150" fill="#4a90d9" font-weight="bold">A</text>

  <!-- circle B -->
  <circle cx="320" cy="190" r="90" fill="none" stroke="#e0645c" stroke-width="3"/>
  <text x="388" y="150" fill="#e0645c" font-weight="bold">B</text>

  <!-- pointer to the shaded outside region -->
  <line x1="470" y1="115" x2="440" y2="150" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="415" y="108" fill="#8a8a8a">(A ∪ B)ᶜ</text>

  <!-- caption -->
  <text x="40" y="348" fill="#8a8a8a" font-style="italic">Shaded = outside both A and B = Aᶜ ∩ Bᶜ. The picture suggests it; the element method proves it.</text>
</svg>
