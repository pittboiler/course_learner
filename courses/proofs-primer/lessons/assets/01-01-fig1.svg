<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="30" fill="#8a8a8a" font-style="italic">A conditional and its three relatives. Only the diagonals are logically equivalent.</text>

  <!-- equivalence diagonals (drawn first, behind the boxes) -->
  <line x1="150" y1="120" x2="410" y2="270" stroke="#4a90d9" stroke-width="2" stroke-dasharray="3 4"/>
  <line x1="410" y1="120" x2="150" y2="270" stroke="#e0645c" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- Top-left: Statement -->
  <rect x="60" y="80" width="180" height="80" rx="6" fill="#4a90d9" opacity="0.18"/>
  <rect x="60" y="80" width="180" height="80" rx="6" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="150" y="108" fill="#4a90d9" text-anchor="middle" font-weight="bold">Statement</text>
  <text x="150" y="133" fill="#333333" text-anchor="middle" font-size="16">P ⟹ Q</text>
  <text x="150" y="152" fill="#8a8a8a" text-anchor="middle" font-size="12">if P then Q</text>

  <!-- Top-right: Converse -->
  <rect x="320" y="80" width="180" height="80" rx="6" fill="#e0645c" opacity="0.18"/>
  <rect x="320" y="80" width="180" height="80" rx="6" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="410" y="108" fill="#e0645c" text-anchor="middle" font-weight="bold">Converse</text>
  <text x="410" y="133" fill="#333333" text-anchor="middle" font-size="16">Q ⟹ P</text>
  <text x="410" y="152" fill="#8a8a8a" text-anchor="middle" font-size="12">swap</text>

  <!-- Bottom-left: Inverse -->
  <rect x="60" y="230" width="180" height="80" rx="6" fill="#e0645c" opacity="0.18"/>
  <rect x="60" y="230" width="180" height="80" rx="6" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="150" y="258" fill="#e0645c" text-anchor="middle" font-weight="bold">Inverse</text>
  <text x="150" y="283" fill="#333333" text-anchor="middle" font-size="16">¬P ⟹ ¬Q</text>
  <text x="150" y="302" fill="#8a8a8a" text-anchor="middle" font-size="12">negate</text>

  <!-- Bottom-right: Contrapositive -->
  <rect x="320" y="230" width="180" height="80" rx="6" fill="#4a90d9" opacity="0.18"/>
  <rect x="320" y="230" width="180" height="80" rx="6" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="410" y="258" fill="#4a90d9" text-anchor="middle" font-weight="bold">Contrapositive</text>
  <text x="410" y="283" fill="#333333" text-anchor="middle" font-size="16">¬Q ⟹ ¬P</text>
  <text x="410" y="302" fill="#8a8a8a" text-anchor="middle" font-size="12">swap + negate</text>

  <!-- each diagonal is an equivalence class; label both on white plates -->
  <rect x="184" y="158" width="92" height="20" rx="4" fill="#ffffff"/>
  <text x="230" y="172" fill="#4a90d9" font-size="12" font-weight="bold" text-anchor="middle">≡ equivalent</text>
  <rect x="286" y="158" width="92" height="20" rx="4" fill="#ffffff"/>
  <text x="332" y="172" fill="#e0645c" font-size="12" font-weight="bold" text-anchor="middle">≡ equivalent</text>

  <!-- the classic trap: statement is NOT equivalent to its converse (top edge) -->
  <line x1="240" y1="120" x2="320" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="262" y="110" width="36" height="20" rx="4" fill="#ffffff"/>
  <text x="280" y="124" fill="#8a8a8a" font-size="15" font-weight="bold" text-anchor="middle">≢</text>
</svg>
