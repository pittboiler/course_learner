<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Three ways ions react in water &#8212; and redox is electrons changing hands.</text>

  <!-- ===== decision tree ===== -->

  <!-- root box -->
  <rect x="250" y="42" width="140" height="34" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="320" y="63" fill="#8a8a8a" text-anchor="middle">Reaction in water</text>

  <!-- branch lines -->
  <line x1="320" y1="76" x2="112" y2="116" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="320" y1="76" x2="320" y2="116" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="320" y1="76" x2="528" y2="116" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="112,118 107,109 117,109" fill="#8a8a8a"/>
  <polygon points="320,118 315,109 325,109" fill="#8a8a8a"/>
  <polygon points="528,118 523,109 533,109" fill="#e0645c"/>

  <!-- box 1: precipitation -->
  <rect x="22" y="120" width="180" height="50" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="112" y="141" fill="#8a8a8a" text-anchor="middle">Precipitation</text>
  <text x="112" y="159" fill="#8a8a8a" text-anchor="middle" font-size="12">insoluble solid forms &#8595;</text>

  <!-- box 2: acid-base -->
  <rect x="230" y="120" width="180" height="50" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="320" y="141" fill="#8a8a8a" text-anchor="middle">Acid&#8211;base</text>
  <text x="320" y="159" fill="#8a8a8a" text-anchor="middle" font-size="12">H&#8314; + OH&#8315; &#8594; H&#8322;O</text>

  <!-- box 3: redox (highlighted) -->
  <rect x="438" y="120" width="180" height="50" rx="4" fill="#e0645c" fill-opacity="0.10" stroke="#e0645c" stroke-width="1.8"/>
  <text x="528" y="141" fill="#e0645c" text-anchor="middle">Redox</text>
  <text x="528" y="159" fill="#e0645c" text-anchor="middle" font-size="12">electrons transfer</text>

  <!-- connector: redox box expands into the cartoon below -->
  <line x1="528" y1="170" x2="500" y2="236" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ===== electron-transfer cartoon ===== -->

  <!-- reducing agent (blue) -->
  <circle cx="150" cy="290" r="44" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="150" y="286" fill="#4a90d9" text-anchor="middle">reducing</text>
  <text x="150" y="304" fill="#4a90d9" text-anchor="middle">agent</text>
  <text x="150" y="356" fill="#8a8a8a" text-anchor="middle" font-size="13">Fe: +2 &#8594; +3 (oxidized)</text>
  <text x="150" y="374" fill="#8a8a8a" text-anchor="middle" font-size="12">loses e&#8722;, ox# &#8593;</text>

  <!-- oxidizing agent (grey) -->
  <circle cx="490" cy="290" r="44" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="490" y="286" fill="#8a8a8a" text-anchor="middle">oxidizing</text>
  <text x="490" y="304" fill="#8a8a8a" text-anchor="middle">agent</text>
  <text x="490" y="356" fill="#8a8a8a" text-anchor="middle" font-size="13">Mn: +7 &#8594; +2 (reduced)</text>
  <text x="490" y="374" fill="#8a8a8a" text-anchor="middle" font-size="12">gains e&#8722;, ox# &#8595;</text>

  <!-- electron flow arrow -->
  <line x1="200" y1="290" x2="432" y2="290" stroke="#e0645c" stroke-width="2"/>
  <polygon points="446,290 432,284 432,296" fill="#e0645c"/>
  <circle cx="250" cy="290" r="5" fill="#e0645c"/>
  <circle cx="316" cy="290" r="5" fill="#e0645c"/>
  <circle cx="382" cy="290" r="5" fill="#e0645c"/>
  <text x="316" y="276" fill="#e0645c" text-anchor="middle">e&#8722; transfer</text>
</svg>
