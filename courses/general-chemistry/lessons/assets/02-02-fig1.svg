<svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="16" y="22" fill="#8a8a8a" font-style="italic">The road map: grams A &#8594; mol A &#8594;(mole ratio)&#8594; mol B &#8594; grams B. Below: the smaller reactant caps the product.</text>

  <!-- ===== top pipeline: grams A -> mol A -> mol B -> grams B ===== -->

  <!-- box 1: grams A -->
  <rect x="16" y="64" width="96" height="46" rx="5" fill="#8a8a8a" opacity="0.15" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="64" y="92" fill="#8a8a8a" text-anchor="middle">grams A</text>

  <!-- box 2: mol A -->
  <rect x="184" y="64" width="96" height="46" rx="5" fill="#8a8a8a" opacity="0.15" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="232" y="92" fill="#8a8a8a" text-anchor="middle">mol A</text>

  <!-- box 3: mol B (blue - the bridge lands here) -->
  <rect x="352" y="64" width="96" height="46" rx="5" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="400" y="92" fill="#4a90d9" text-anchor="middle">mol B</text>

  <!-- box 4: grams B -->
  <rect x="520" y="64" width="96" height="46" rx="5" fill="#8a8a8a" opacity="0.15" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="568" y="92" fill="#8a8a8a" text-anchor="middle">grams B</text>

  <!-- arrow 1: divide by M_A -->
  <line x1="112" y1="87" x2="178" y2="87" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="184,87 175,83 175,91" fill="#8a8a8a"/>
  <text x="147" y="56" fill="#8a8a8a" text-anchor="middle" font-size="12">&#247; M&#8330;</text>

  <!-- arrow 2: mole ratio bridge (blue) -->
  <line x1="280" y1="87" x2="346" y2="87" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="352,87 342,82 342,92" fill="#4a90d9"/>
  <text x="313" y="56" fill="#4a90d9" text-anchor="middle" font-size="12">&#215; (b/a)</text>
  <text x="313" y="128" fill="#4a90d9" text-anchor="middle" font-size="11">mole ratio</text>

  <!-- arrow 3: multiply by M_B -->
  <line x1="448" y1="87" x2="514" y2="87" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="520,87 511,83 511,91" fill="#8a8a8a"/>
  <text x="483" y="56" fill="#8a8a8a" text-anchor="middle" font-size="12">&#215; M_B</text>

  <!-- divider -->
  <line x1="16" y1="158" x2="644" y2="158" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 5"/>
  <text x="16" y="184" fill="#8a8a8a" font-style="italic" font-size="12">Limiting reagent: turn each reactant into mol of product &#8212; the smallest number wins.</text>

  <!-- ===== inset: limiting reagent (uses P3 numbers) ===== -->

  <!-- reactant 1 (coral = limiting) -->
  <rect x="30" y="208" width="238" height="42" rx="5" fill="#e0645c" opacity="0.15" stroke="#e0645c" stroke-width="2"/>
  <text x="149" y="234" fill="#e0645c" text-anchor="middle" font-size="13">HCl: 0.0750 mol &#8594; 0.0375 mol H&#8322;</text>
  <text x="149" y="272" fill="#e0645c" text-anchor="middle" font-size="11">limiting &#8212; runs out first</text>

  <!-- reactant 2 (grey = excess) -->
  <rect x="30" y="292" width="238" height="42" rx="5" fill="#8a8a8a" opacity="0.15" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="149" y="318" fill="#8a8a8a" text-anchor="middle" font-size="13">Al: 0.185 mol &#8594; 0.278 mol H&#8322;</text>

  <!-- product box (coral outline) -->
  <rect x="418" y="250" width="212" height="42" rx="5" fill="#e0645c" opacity="0.10" stroke="#e0645c" stroke-width="2"/>
  <text x="524" y="270" fill="#e0645c" text-anchor="middle" font-size="13">H&#8322; formed = 0.0375 mol</text>
  <text x="524" y="286" fill="#8a8a8a" text-anchor="middle" font-size="11">the smaller cap decides</text>

  <!-- converging arrows -->
  <line x1="268" y1="229" x2="412" y2="264" stroke="#e0645c" stroke-width="2"/>
  <polygon points="418,265 408,263 410,255" fill="#e0645c"/>
  <line x1="268" y1="313" x2="412" y2="278" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 4"/>
  <polygon points="418,277 408,275 410,283" fill="#8a8a8a"/>
</svg>
