<svg viewBox="0 0 700 310" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Electron domains spread out to get as far apart as possible &#8212; count them, read off the shape.</text>

  <!-- ===================== 1. LINEAR (2) ===================== -->
  <g>
    <line x1="70" y1="150" x2="70" y2="110" stroke="#8a8a8a" stroke-width="2"/>
    <line x1="70" y1="150" x2="70" y2="190" stroke="#8a8a8a" stroke-width="2"/>
    <circle cx="70" cy="104" r="8" fill="#4a90d9"/>
    <circle cx="70" cy="196" r="8" fill="#4a90d9"/>
    <circle cx="70" cy="150" r="10" fill="#8a8a8a"/>
    <text x="70" y="230" fill="#8a8a8a" text-anchor="middle">180&#176;</text>
    <text x="70" y="250" fill="#8a8a8a" text-anchor="middle" font-weight="bold">Linear</text>
    <text x="70" y="266" fill="#8a8a8a" text-anchor="middle" font-style="italic">2 domains</text>
  </g>

  <!-- ===================== 2. TRIGONAL PLANAR (3) ===================== -->
  <g>
    <line x1="210" y1="150" x2="210" y2="106" stroke="#8a8a8a" stroke-width="2"/>
    <line x1="210" y1="150" x2="172" y2="186" stroke="#8a8a8a" stroke-width="2"/>
    <line x1="210" y1="150" x2="248" y2="186" stroke="#8a8a8a" stroke-width="2"/>
    <circle cx="210" cy="104" r="8" fill="#4a90d9"/>
    <circle cx="170" cy="188" r="8" fill="#4a90d9"/>
    <circle cx="250" cy="188" r="8" fill="#4a90d9"/>
    <circle cx="210" cy="150" r="10" fill="#8a8a8a"/>
    <text x="210" y="230" fill="#8a8a8a" text-anchor="middle">120&#176;</text>
    <text x="210" y="250" fill="#8a8a8a" text-anchor="middle" font-weight="bold">Trigonal planar</text>
    <text x="210" y="266" fill="#8a8a8a" text-anchor="middle" font-style="italic">3 domains</text>
  </g>

  <!-- ===================== 3. TETRAHEDRAL (4) ===================== -->
  <g>
    <!-- back bonds (thin) -->
    <line x1="350" y1="150" x2="316" y2="116" stroke="#8a8a8a" stroke-width="1.5"/>
    <line x1="350" y1="150" x2="384" y2="116" stroke="#8a8a8a" stroke-width="1.5"/>
    <!-- front bonds (bold = toward viewer) -->
    <line x1="350" y1="150" x2="316" y2="186" stroke="#8a8a8a" stroke-width="4"/>
    <line x1="350" y1="150" x2="384" y2="186" stroke="#8a8a8a" stroke-width="4"/>
    <circle cx="314" cy="112" r="8" fill="#4a90d9"/>
    <circle cx="386" cy="112" r="8" fill="#4a90d9"/>
    <circle cx="314" cy="188" r="8" fill="#4a90d9"/>
    <circle cx="386" cy="188" r="8" fill="#4a90d9"/>
    <circle cx="350" cy="150" r="10" fill="#8a8a8a"/>
    <text x="350" y="230" fill="#8a8a8a" text-anchor="middle">109.5&#176;</text>
    <text x="350" y="250" fill="#8a8a8a" text-anchor="middle" font-weight="bold">Tetrahedral</text>
    <text x="350" y="266" fill="#8a8a8a" text-anchor="middle" font-style="italic">4 domains</text>
  </g>

  <!-- ===================== 4. TRIGONAL BIPYRAMIDAL (5) ===================== -->
  <g>
    <!-- axial -->
    <line x1="490" y1="150" x2="490" y2="102" stroke="#8a8a8a" stroke-width="2"/>
    <line x1="490" y1="150" x2="490" y2="198" stroke="#8a8a8a" stroke-width="2"/>
    <!-- equatorial: two to the sides, one toward viewer (bold) -->
    <line x1="490" y1="150" x2="450" y2="140" stroke="#8a8a8a" stroke-width="1.5"/>
    <line x1="490" y1="150" x2="530" y2="140" stroke="#8a8a8a" stroke-width="1.5"/>
    <line x1="490" y1="150" x2="490" y2="178" stroke="#8a8a8a" stroke-width="4"/>
    <circle cx="490" cy="98" r="8" fill="#4a90d9"/>
    <circle cx="490" cy="202" r="8" fill="#4a90d9"/>
    <circle cx="447" cy="139" r="8" fill="#4a90d9"/>
    <circle cx="533" cy="139" r="8" fill="#4a90d9"/>
    <circle cx="490" cy="180" r="8" fill="#4a90d9"/>
    <circle cx="490" cy="150" r="10" fill="#8a8a8a"/>
    <text x="490" y="230" fill="#8a8a8a" text-anchor="middle">90&#176; / 120&#176;</text>
    <text x="490" y="250" fill="#8a8a8a" text-anchor="middle" font-weight="bold">Trigonal bipyramidal</text>
    <text x="490" y="266" fill="#8a8a8a" text-anchor="middle" font-style="italic">5 domains</text>
  </g>

  <!-- ===================== 5. OCTAHEDRAL (6) ===================== -->
  <g>
    <line x1="630" y1="150" x2="630" y2="102" stroke="#8a8a8a" stroke-width="2"/>
    <line x1="630" y1="150" x2="630" y2="198" stroke="#8a8a8a" stroke-width="2"/>
    <line x1="630" y1="150" x2="586" y2="150" stroke="#8a8a8a" stroke-width="2"/>
    <line x1="630" y1="150" x2="674" y2="150" stroke="#8a8a8a" stroke-width="2"/>
    <!-- depth pair: front bold, back thin -->
    <line x1="630" y1="150" x2="606" y2="172" stroke="#8a8a8a" stroke-width="4"/>
    <line x1="630" y1="150" x2="654" y2="128" stroke="#8a8a8a" stroke-width="1.5"/>
    <circle cx="630" cy="98" r="8" fill="#4a90d9"/>
    <circle cx="630" cy="202" r="8" fill="#4a90d9"/>
    <circle cx="582" cy="150" r="8" fill="#4a90d9"/>
    <circle cx="678" cy="150" r="8" fill="#4a90d9"/>
    <circle cx="604" cy="174" r="8" fill="#4a90d9"/>
    <circle cx="656" cy="126" r="8" fill="#4a90d9"/>
    <circle cx="630" cy="150" r="10" fill="#8a8a8a"/>
    <text x="630" y="230" fill="#8a8a8a" text-anchor="middle">90&#176;</text>
    <text x="630" y="250" fill="#8a8a8a" text-anchor="middle" font-weight="bold">Octahedral</text>
    <text x="630" y="266" fill="#8a8a8a" text-anchor="middle" font-style="italic">6 domains</text>
  </g>

  <!-- ===================== legend ===================== -->
  <g>
    <circle cx="210" cy="292" r="7" fill="#8a8a8a"/>
    <text x="222" y="296" fill="#8a8a8a">central atom</text>
    <circle cx="330" cy="292" r="7" fill="#4a90d9"/>
    <text x="342" y="296" fill="#8a8a8a">bonded atom</text>
    <circle cx="452" cy="289" r="2.6" fill="#e0645c"/>
    <circle cx="452" cy="296" r="2.6" fill="#e0645c"/>
    <text x="462" y="296" fill="#8a8a8a">lone pair (replaces a bonded atom &#8594; new shape)</text>
  </g>
</svg>
