<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Heat a gas and its speed distribution flattens and slides right &#8212; faster on average, but with a longer fast tail.</text>

  <!-- axes -->
  <line x1="70" y1="270" x2="600" y2="270" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="600,270 590,265 590,275" fill="#8a8a8a"/>
  <text x="500" y="292" fill="#8a8a8a">molecular speed v &#8594;</text>
  <line x1="70" y1="270" x2="70" y2="60" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,60 65,70 75,70" fill="#8a8a8a"/>
  <text x="40" y="52" fill="#8a8a8a">fraction of molecules</text>

  <!-- lower-T curve (blue) -->
  <path d="M 70.0 270.0 L 78.6 269.1 L 87.2 266.3 L 95.8 261.9 L 104.3 256.0 L 112.9 249.1 L 121.5 241.4 L 130.1 233.5 L 138.7 225.6 L 147.2 218.3 L 155.8 211.7 L 164.4 206.3 L 173.0 202.1 L 181.6 199.4 L 190.2 198.1 L 198.8 198.2 L 207.3 199.7 L 215.9 202.3 L 224.5 205.9 L 233.1 210.3 L 241.7 215.1 L 250.2 220.4 L 258.8 225.7 L 267.4 231.1 L 276.0 236.2 L 284.6 241.0 L 293.2 245.5 L 301.8 249.5 L 310.3 253.1 L 318.9 256.2 L 327.5 258.9 L 336.1 261.2 L 344.7 263.1 L 353.2 264.6 L 361.8 265.9 L 370.4 266.9 L 379.0 267.6 L 387.6 268.2 L 396.2 268.7 L 404.8 269.1 L 413.3 269.3 L 421.9 269.5 L 430.5 269.7 L 439.1 269.8 L 447.7 269.8 L 456.2 269.9 L 464.8 269.9 L 473.4 270.0 L 585.0 270.0"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- higher-T curve (coral) -->
  <path d="M 70.0 270.0 L 78.6 269.1 L 87.2 266.3 L 95.8 261.6 L 104.3 255.3 L 112.9 247.4 L 121.5 238.1 L 130.1 227.5 L 138.7 215.9 L 147.2 203.6 L 155.8 190.7 L 164.4 177.4 L 173.0 164.1 L 181.6 151.0 L 190.2 138.4 L 198.8 126.3 L 207.3 115.1 L 215.9 104.8 L 224.5 95.8 L 233.1 87.9 L 241.7 81.5 L 250.2 76.4 L 258.8 72.8 L 267.4 70.7 L 276.0 70.0 L 284.6 70.7 L 293.2 72.7 L 301.8 75.9 L 310.3 80.3 L 318.9 85.7 L 327.5 91.9 L 336.1 99.0 L 344.7 106.6 L 353.2 114.8 L 361.8 123.4 L 370.4 132.1 L 379.0 141.1 L 387.6 150.0 L 396.2 158.9 L 404.8 167.6 L 413.3 176.1 L 421.9 184.3 L 430.5 192.1 L 439.1 199.6 L 447.7 206.6 L 456.2 213.2 L 464.8 219.3 L 473.4 225.0 L 482.0 230.2 L 490.6 234.9 L 499.2 239.2 L 507.8 243.2 L 516.3 246.7 L 524.9 249.8 L 533.5 252.6 L 542.1 255.0 L 550.7 257.2 L 559.2 259.1 L 567.8 260.8 L 576.4 262.2 L 585.0 263.4"
        fill="none" stroke="#e0645c" stroke-width="3"/>

  <!-- peak markers -->
  <line x1="193.6" y1="198.1" x2="193.6" y2="270" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="276.0" y1="70.0" x2="276.0" y2="270" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- legend -->
  <line x1="430" y1="95" x2="460" y2="95" stroke="#4a90d9" stroke-width="3"/>
  <text x="466" y="100" fill="#4a90d9">lower T (cool)</text>
  <line x1="430" y1="118" x2="460" y2="118" stroke="#e0645c" stroke-width="3"/>
  <text x="466" y="123" fill="#e0645c">higher T (hot)</text>
</svg>
