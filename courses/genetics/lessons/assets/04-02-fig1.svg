  <path d="M 190 262 L 232 262" stroke="#d1495b" stroke-width="1.6" marker-start="url(#lft4)" marker-end="url(#rgt4)"/>
  <text x="212" y="256" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b" text-anchor="middle">lost</text>
  <text x="24" y="348" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">offspring generation &#8212; shifted by R, not by S</text>
  <text x="24" y="366" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b">the shortfall is (1 &#8722; h&#178;)S: regression to the mean, measured</text>
  <text x="24" y="390" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">Extreme parents are extreme partly by good genes and partly</text>
  <text x="24" y="406" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">by good luck. Only the additive genes are transmitted.</text>
  <text x="24" y="430" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#2e8b57">h&#178;(realized) = R / S &#8212; defined by what selection achieved.</text>

  <line x1="330" y1="34" x2="330" y2="430" stroke="#ddd" stroke-width="2"/>
  <text x="352" y="46" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Long-term selection: the plateau, and how to test it</text>
  <line x1="368" y1="220" x2="600" y2="220" stroke="#333" stroke-width="1.6"/>
  <line x1="368" y1="220" x2="368" y2="70" stroke="#333" stroke-width="1.6"/>
  <path d="M 372 216 C 400 180 430 130 470 108 C 520 84 560 78 596 76" fill="none" stroke="#2e8b57" stroke-width="2.6"/>
  <path d="M 470 108 C 500 128 540 160 596 180" fill="none" stroke="#d1495b" stroke-width="2.4" stroke-dasharray="5 4"/>
  <text x="606" y="80" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#2e8b57">selection continued</text>
  <text x="606" y="184" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b">selection RELAXED</text>
  <text x="484" y="240" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333" text-anchor="middle">generations &#8594;</text>
  <text x="352" y="264" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">Drifts back &#8594; natural selection was opposing you;</text>
  <text x="352" y="280" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">stays put &#8594; the additive variance really is spent.</text>
  <text x="352" y="300" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b">Never read a plateau as exhausted variance without this test.</text>

  <text x="352" y="336" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">QTL mapping: detection is not identification</text>
