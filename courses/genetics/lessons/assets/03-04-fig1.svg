<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="The lac operon in four regulatory states and a merodiploid showing trans-acting repressor versus cis-acting operator">
  <rect width="800" height="470" fill="#ffffff"/>
  <text x="14" y="22" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">The lac operon computes: lactose AND NOT glucose</text>

  <g font-family="Helvetica,Arial,sans-serif" font-size="10">
    <line x1="20" y1="52" x2="500" y2="52" stroke="#5d6b73" stroke-width="3"/>
    <rect x="24" y="42" width="46" height="20" rx="3" fill="#6a4c93"/><text x="47" y="56" fill="#fff" text-anchor="middle">lacI</text>
    <rect x="106" y="42" width="44" height="20" rx="3" fill="#2e8b57"/><text x="128" y="56" fill="#fff" text-anchor="middle">CAP</text>
    <rect x="152" y="42" width="40" height="20" rx="3" fill="#8fa8c0"/><text x="172" y="56" fill="#fff" text-anchor="middle">P</text>
    <rect x="194" y="42" width="36" height="20" rx="3" fill="#d1495b"/><text x="212" y="56" fill="#fff" text-anchor="middle">O</text>
    <rect x="232" y="42" width="84" height="20" rx="3" fill="#1a6fb5"/><text x="274" y="56" fill="#fff" text-anchor="middle">lacZ</text>
    <rect x="318" y="42" width="72" height="20" rx="3" fill="#1a6fb5"/><text x="354" y="56" fill="#fff" text-anchor="middle">lacY</text>
    <rect x="392" y="42" width="64" height="20" rx="3" fill="#1a6fb5"/><text x="424" y="56" fill="#fff" text-anchor="middle">lacA</text>
    <text x="520" y="56" fill="#666">one promoter, one mRNA, three proteins</text>
  </g>

  <g font-family="Helvetica,Arial,sans-serif" font-size="10.5">
    <rect x="20" y="80" width="760" height="26" fill="#f7f7f7" stroke="#ddd"/>
    <text x="34" y="97" font-weight="bold" fill="#333">lactose</text><text x="120" y="97" font-weight="bold" fill="#333">glucose</text>
    <text x="216" y="97" font-weight="bold" fill="#333">repressor</text><text x="360" y="97" font-weight="bold" fill="#333">CAP&#8211;cAMP</text><text x="520" y="97" font-weight="bold" fill="#333">transcription</text>

    <rect x="20" y="106" width="760" height="24" fill="#fff" stroke="#eee"/>
    <text x="34" y="122" fill="#333">absent</text><text x="120" y="122" fill="#333">present</text>
    <text x="216" y="122" fill="#d1495b">ON the operator</text><text x="360" y="122" fill="#999">absent (cAMP low)</text><text x="520" y="122" font-weight="bold" fill="#d1495b">NONE</text>

    <rect x="20" y="130" width="760" height="24" fill="#fafafa" stroke="#eee"/>
    <text x="34" y="146" fill="#333">absent</text><text x="120" y="146" fill="#333">absent</text>
    <text x="216" y="146" fill="#d1495b">ON the operator</text><text x="360" y="146" fill="#2e8b57">bound (cAMP high)</text><text x="520" y="146" font-weight="bold" fill="#d1495b">NONE &#8212; repressor still blocks</text>

    <rect x="20" y="154" width="760" height="24" fill="#fff" stroke="#eee"/>
    <text x="34" y="170" fill="#333">present</text><text x="120" y="170" fill="#333">present</text>
    <text x="216" y="170" fill="#2e8b57">released</text><text x="360" y="170" fill="#999">absent (cAMP low)</text><text x="520" y="170" fill="#c9871f">very low &#8212; weak promoter</text>

    <rect x="20" y="178" width="760" height="26" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.6"/>
    <text x="34" y="196" font-weight="bold" fill="#1f5c3a">present</text><text x="120" y="196" font-weight="bold" fill="#1f5c3a">absent</text>
    <text x="216" y="196" fill="#2e8b57">released</text><text x="360" y="196" fill="#2e8b57">bound</text><text x="520" y="196" font-weight="bold" fill="#1f5c3a">HIGH</text>
  </g>
  <text x="20" y="224" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#111">Two different mechanisms for two inputs: one <tspan font-weight="bold">removes a repressor</tspan>, one <tspan font-weight="bold">recruits an activator</tspan>.</text>
  <text x="20" y="242" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#d1495b">Lactose does not switch the operon on. It un-switches it off.</text>

  <line x1="14" y1="256" x2="786" y2="256" stroke="#ddd" stroke-width="2"/>
  <text x="14" y="280" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">The merodiploid test: does a good copy elsewhere rescue it?</text>

  <g font-family="Helvetica,Arial,sans-serif" font-size="10.5">
    <text x="20" y="304" font-weight="bold" fill="#6a4c93">TRANS-acting &#8212; a diffusible product</text>
    <line x1="24" y1="330" x2="360" y2="330" stroke="#5d6b73" stroke-width="3"/>
    <rect x="28" y="320" width="40" height="20" rx="3" fill="#cccccc"/><text x="48" y="334" fill="#666" text-anchor="middle">I&#8315;</text>
    <rect x="96" y="320" width="30" height="20" rx="3" fill="#d1495b"/><text x="111" y="334" fill="#fff" text-anchor="middle">O</text>
    <rect x="128" y="320" width="70" height="20" rx="3" fill="#cccccc"/><text x="163" y="334" fill="#666" text-anchor="middle">Z&#8315;</text>
    <text x="376" y="334" fill="#666">chromosome</text>

    <line x1="24" y1="374" x2="360" y2="374" stroke="#5d6b73" stroke-width="3"/>
    <rect x="28" y="364" width="40" height="20" rx="3" fill="#6a4c93"/><text x="48" y="378" fill="#fff" text-anchor="middle">I&#8314;</text>
    <rect x="96" y="364" width="30" height="20" rx="3" fill="#d1495b"/><text x="111" y="378" fill="#fff" text-anchor="middle">O</text>
    <rect x="128" y="364" width="70" height="20" rx="3" fill="#1a6fb5"/><text x="163" y="378" fill="#fff" text-anchor="middle">Z&#8314;</text>
    <text x="376" y="378" fill="#666">F&#8242; plasmid</text>

    <circle cx="230" cy="352" r="11" fill="#6a4c93"/><text x="230" y="356" fill="#fff" text-anchor="middle" font-size="9">rep</text>
    <path d="M 68 372 C 140 356 190 352 219 352" fill="none" stroke="#6a4c93" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M 222 344 C 200 336 150 332 118 330" fill="none" stroke="#6a4c93" stroke-width="2" marker-end="url(#r)"/>
    <path d="M 226 362 C 200 370 150 374 118 374" fill="none" stroke="#6a4c93" stroke-width="2" marker-end="url(#r)"/>
    <text x="248" y="356" fill="#6a4c93">reaches BOTH operators</text>
    <text x="24" y="404" font-weight="bold" fill="#2e8b57">&#8594; RESCUED: the cell is inducible. I&#8314; is trans-dominant.</text>
  </g>

  <line x1="424" y1="290" x2="424" y2="440" stroke="#ddd" stroke-width="2"/>
  <g font-family="Helvetica,Arial,sans-serif" font-size="10.5">
    <text x="444" y="304" font-weight="bold" fill="#d1495b">CIS-acting &#8212; a DNA site</text>
    <line x1="448" y1="330" x2="770" y2="330" stroke="#5d6b73" stroke-width="3"/>
    <rect x="452" y="320" width="40" height="20" rx="3" fill="#6a4c93"/><text x="472" y="334" fill="#fff" text-anchor="middle">I&#8314;</text>
    <rect x="520" y="320" width="30" height="20" rx="3" fill="#e8a33d"/><text x="535" y="334" fill="#fff" text-anchor="middle">O&#7580;</text>
    <rect x="552" y="320" width="70" height="20" rx="3" fill="#1a6fb5"/><text x="587" y="334" fill="#fff" text-anchor="middle">Z&#8314;</text>
    <text x="636" y="334" fill="#d1495b" font-weight="bold">&#8594; always ON</text>

    <line x1="448" y1="374" x2="770" y2="374" stroke="#5d6b73" stroke-width="3"/>
    <rect x="452" y="364" width="40" height="20" rx="3" fill="#6a4c93"/><text x="472" y="378" fill="#fff" text-anchor="middle">I&#8314;</text>
    <rect x="520" y="364" width="30" height="20" rx="3" fill="#d1495b"/><text x="535" y="378" fill="#fff" text-anchor="middle">O</text>
    <rect x="552" y="364" width="70" height="20" rx="3" fill="#cccccc"/><text x="587" y="378" fill="#666" text-anchor="middle">Z&#8315;</text>
    <text x="636" y="378" fill="#666">regulated normally</text>

    <text x="444" y="404" font-weight="bold" fill="#d1495b">&#8594; CONSTITUTIVE. O&#7580; affects only what</text>
    <text x="444" y="420" font-weight="bold" fill="#d1495b">is physically attached to it.</text>
  </g>
  <rect x="14" y="436" width="770" height="28" rx="6" fill="#fdf7ee" stroke="#c9871f" stroke-width="1.5"/>
  <text x="28" y="455" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#8a5a10">Swap O&#7580; and Z&#8314; onto opposite molecules and the phenotype flips from constitutive to inducible &#8212; that comparison IS the cis/trans test.</text>
  <defs><marker id="r" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#6a4c93"/></marker></defs>
</svg>
