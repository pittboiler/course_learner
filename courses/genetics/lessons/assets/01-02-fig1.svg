<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="The same 1:2:1 genotype ratio read four ways: complete dominance, incomplete dominance, codominance, and a homozygous lethal allele">
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="14" y="24" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">Transmission never changes. Only how many classes you can see changes.</text>
  <text x="14" y="46" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#666">Genotypes from Aa &#215; Aa are always 1 AA : 2 Aa : 1 aa</text>

  <g font-family="Helvetica,Arial,sans-serif" font-size="11">
    <text x="106" y="76" font-weight="bold" fill="#111" text-anchor="middle">Complete dominance</text>
    <rect x="46" y="90" width="34" height="34" rx="5" fill="#c1272d"/>
    <rect x="88" y="90" width="34" height="34" rx="5" fill="#c1272d"/>
    <rect x="130" y="90" width="34" height="34" rx="5" fill="#c1272d"/>
    <rect x="46" y="132" width="34" height="34" rx="5" fill="#ffffff" stroke="#999" stroke-width="1.6"/>
    <text x="63" y="112" fill="#fff" text-anchor="middle" font-size="10">AA</text>
    <text x="105" y="112" fill="#fff" text-anchor="middle" font-size="10">Aa</text>
    <text x="147" y="112" fill="#fff" text-anchor="middle" font-size="10">Aa</text>
    <text x="63" y="154" fill="#333" text-anchor="middle" font-size="10">aa</text>
    <text x="106" y="192" fill="#111" text-anchor="middle" font-size="13" font-weight="bold">3 : 1</text>
    <text x="106" y="212" fill="#666" text-anchor="middle">two classes collapse</text>
  </g>

  <line x1="196" y1="60" x2="196" y2="230" stroke="#ddd" stroke-width="2"/>
  <g font-family="Helvetica,Arial,sans-serif" font-size="11">
    <text x="300" y="76" font-weight="bold" fill="#111" text-anchor="middle">Incomplete dominance</text>
    <rect x="240" y="90" width="34" height="34" rx="5" fill="#c1272d"/>
    <rect x="282" y="90" width="34" height="34" rx="5" fill="#e8969a"/>
    <rect x="324" y="90" width="34" height="34" rx="5" fill="#e8969a"/>
    <rect x="240" y="132" width="34" height="34" rx="5" fill="#ffffff" stroke="#999" stroke-width="1.6"/>
    <text x="257" y="112" fill="#fff" text-anchor="middle" font-size="10">AA</text>
    <text x="299" y="112" fill="#7a2530" text-anchor="middle" font-size="10">Aa</text>
    <text x="341" y="112" fill="#7a2530" text-anchor="middle" font-size="10">Aa</text>
    <text x="257" y="154" fill="#333" text-anchor="middle" font-size="10">aa</text>
    <text x="300" y="192" fill="#111" text-anchor="middle" font-size="13" font-weight="bold">1 : 2 : 1</text>
    <text x="300" y="212" fill="#666" text-anchor="middle">heterozygote is a uniform blend</text>
  </g>

  <line x1="390" y1="60" x2="390" y2="230" stroke="#ddd" stroke-width="2"/>
  <g font-family="Helvetica,Arial,sans-serif" font-size="11">
    <text x="494" y="76" font-weight="bold" fill="#111" text-anchor="middle">Codominance</text>
    <rect x="434" y="90" width="34" height="34" rx="5" fill="#c1272d"/>
    <rect x="476" y="90" width="34" height="34" rx="5" fill="url(#stripe)" stroke="#999" stroke-width="1.2"/>
    <rect x="518" y="90" width="34" height="34" rx="5" fill="url(#stripe)" stroke="#999" stroke-width="1.2"/>
    <rect x="434" y="132" width="34" height="34" rx="5" fill="#ffffff" stroke="#999" stroke-width="1.6"/>
    <text x="451" y="112" fill="#fff" text-anchor="middle" font-size="10">AA</text>
    <text x="493" y="112" fill="#333" text-anchor="middle" font-size="10">Aa</text>
    <text x="535" y="112" fill="#333" text-anchor="middle" font-size="10">Aa</text>
    <text x="451" y="154" fill="#333" text-anchor="middle" font-size="10">aa</text>
    <text x="494" y="192" fill="#111" text-anchor="middle" font-size="13" font-weight="bold">1 : 2 : 1</text>
    <text x="494" y="212" fill="#666" text-anchor="middle">heterozygote shows <tspan font-style="italic">both</tspan>, not halfway</text>
  </g>

  <line x1="584" y1="60" x2="584" y2="230" stroke="#ddd" stroke-width="2"/>
  <g font-family="Helvetica,Arial,sans-serif" font-size="11">
    <text x="692" y="76" font-weight="bold" fill="#111" text-anchor="middle">Homozygous lethal</text>
    <rect x="628" y="90" width="34" height="34" rx="5" fill="#eeeeee" stroke="#d1495b" stroke-width="1.8" stroke-dasharray="4 3"/>
    <line x1="632" y1="94" x2="658" y2="120" stroke="#d1495b" stroke-width="2.4"/>
    <line x1="658" y1="94" x2="632" y2="120" stroke="#d1495b" stroke-width="2.4"/>
    <rect x="670" y="90" width="34" height="34" rx="5" fill="#e8a33d"/>
    <rect x="712" y="90" width="34" height="34" rx="5" fill="#e8a33d"/>
    <rect x="628" y="132" width="34" height="34" rx="5" fill="#8a6a4f"/>
    <text x="645" y="146" fill="#fff" text-anchor="middle" font-size="10">aa</text>
    <text x="687" y="112" fill="#fff" text-anchor="middle" font-size="10">Aa</text>
    <text x="729" y="112" fill="#fff" text-anchor="middle" font-size="10">Aa</text>
    <text x="692" y="192" fill="#d1495b" text-anchor="middle" font-size="13" font-weight="bold">2 : 1</text>
    <text x="692" y="212" fill="#666" text-anchor="middle">a class is missing, not merged</text>
  </g>

  <rect x="14" y="250" width="770" height="66" rx="8" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.5"/>
  <text x="28" y="272" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Reading a phenotype ratio backwards:</text>
  <text x="28" y="294" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">3 : 1 &#8594; complete dominance&#160;&#160;&#183;&#160;&#160;1 : 2 : 1 &#8594; incomplete <tspan font-style="italic">or</tspan> codominant&#160;&#160;&#183;&#160;&#160;2 : 1 &#8594; homozygous lethal</text>
  <text x="28" y="310" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#d1495b">A 2 : 1 ratio means only one thing &#8212; and reduced litter or seed set should confirm it.</text>

  <rect x="14" y="326" width="770" height="62" rx="8" fill="#fdf7ee" stroke="#c9871f" stroke-width="1.5"/>
  <text x="28" y="348" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#8a5a10">One genotype, four dominance relations &#8212; HbA/HbS:</text>
  <text x="28" y="368" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">clinical disease &#8594; recessive&#160;&#160;&#183;&#160;&#160;electrophoresis &#8594; codominant&#160;&#160;&#183;&#160;&#160;sickling at low O&#8322; &#8594; incomplete&#160;&#160;&#183;&#160;&#160;malaria &#8594; overdominant</text>
  <text x="28" y="384" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#8a5a10">Dominance is a property of the phenotype you chose to measure.</text>
  <defs>
    <pattern id="stripe" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ffffff"/><rect width="4" height="8" fill="#c1272d"/>
    </pattern>
  </defs>
</svg>
