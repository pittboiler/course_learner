<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 814 433" width="814" height="433" role="img" aria-label="A chiasma using two of four chromatids gives two parental and two recombinant products, a testcross reading gametes directly, and recombination frequency saturating at 0.5">
  <rect width="814" height="433" fill="#ffffff"/>
  <text x="14" y="22" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">Why 50% is a ceiling: a crossover uses only two of the four chromatids</text>

  <g stroke-width="7" stroke-linecap="round">
    <line x1="30" y1="60" x2="230" y2="60" stroke="#1a6fb5"/>
    <line x1="30" y1="86" x2="230" y2="86" stroke="#1a6fb5"/>
    <line x1="30" y1="118" x2="230" y2="118" stroke="#e8a33d"/>
    <line x1="30" y1="144" x2="230" y2="144" stroke="#e8a33d"/>
  </g>
  <path d="M 130 86 L 160 118" stroke="#d1495b" stroke-width="3.5" fill="none"/>
  <path d="M 130 118 L 160 86" stroke="#d1495b" stroke-width="3.5" fill="none"/>
  <text x="145" y="168" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d1495b" text-anchor="middle">chiasma</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">
    <text x="26" y="64" text-anchor="end">A B</text><text x="26" y="90" text-anchor="end">A B</text>
    <text x="20" y="122" text-anchor="end">a b</text><text x="20" y="148" text-anchor="end">a b</text>
  </g>
  <path d="M 246 102 L 278 102" stroke="#555" stroke-width="2.4" marker-end="url(#n)"/>
  <g font-family="Helvetica,Arial,sans-serif" font-size="11.5">
    <rect x="290" y="48" width="140" height="26" rx="5" fill="#e8f0fb" stroke="#1a6fb5" stroke-width="1.5"/><text x="360" y="66" text-anchor="middle" fill="#134f80">A B &#8212; parental</text>
    <rect x="290" y="78" width="140" height="26" rx="5" fill="#fbe9eb" stroke="#d1495b" stroke-width="1.5"/><text x="360" y="96" text-anchor="middle" fill="#7a2530">A b &#8212; recombinant</text>
    <rect x="290" y="108" width="140" height="26" rx="5" fill="#fbe9eb" stroke="#d1495b" stroke-width="1.5"/><text x="360" y="126" text-anchor="middle" fill="#7a2530">a B &#8212; recombinant</text>
    <rect x="290" y="138" width="140" height="26" rx="5" fill="#e8f0fb" stroke="#1a6fb5" stroke-width="1.5"/><text x="360" y="156" text-anchor="middle" fill="#134f80">a b &#8212; parental</text>
  </g>
  <text x="360" y="184" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">2 : 2 &#8212; so even a crossover in EVERY meiosis</text>
  <text x="360" y="200" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#d1495b" text-anchor="middle">gives only 50% recombinants</text>

  <line x1="14" y1="214" x2="450" y2="214" stroke="#ddd" stroke-width="2"/>
  <text x="14" y="238" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">The testcross reads gametes directly</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="11.5">
    <text x="20" y="262" fill="#333">dihybrid  A B / a b</text>
    <text x="180" y="262" fill="#333">&#215;</text>
    <text x="200" y="262" fill="#333">a b / a b  (contributes only a b)</text>
    <text x="20" y="292" fill="#666">so every offspring phenotype <tspan font-weight="bold" fill="#111">names the gamete it received</tspan></text>
    <rect x="20" y="304" width="200" height="24" fill="#e8f0fb" stroke="#1a6fb5" stroke-width="1.3"/><text x="30" y="321" fill="#134f80">A B &#8212; abundant &#8594; PARENTAL</text>
    <rect x="20" y="328" width="200" height="24" fill="#e8f0fb" stroke="#1a6fb5" stroke-width="1.3"/><text x="30" y="345" fill="#134f80">a b &#8212; abundant &#8594; PARENTAL</text>
    <rect x="20" y="352" width="200" height="24" fill="#fbe9eb" stroke="#d1495b" stroke-width="1.3"/><text x="30" y="369" fill="#7a2530">A b &#8212; rare &#8594; recombinant</text>
    <rect x="20" y="376" width="200" height="24" fill="#fbe9eb" stroke="#d1495b" stroke-width="1.3"/><text x="30" y="393" fill="#7a2530">a b &#8212; rare &#8594; recombinant</text>
    <text x="238" y="322" fill="#333">The <tspan font-weight="bold">abundant</tspan> classes tell you</text>
    <text x="238" y="340" fill="#333">the parent&#8217;s phase &#8212; not which</text>
    <text x="238" y="358" fill="#333">alleles look like they belong</text>
    <text x="238" y="376" fill="#333">together.</text>
    <text x="238" y="400" fill="#d1495b" font-weight="bold">RF &gt; 0.5 means you got it backwards.</text>
  </g>

  <line x1="450" y1="214" x2="450" y2="420" stroke="#ddd" stroke-width="2"/>
  <line x1="450" y1="34" x2="450" y2="200" stroke="#ddd" stroke-width="2"/>
  <text x="470" y="238" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">RF saturates; map distance does not</text>
  <line x1="470" y1="390" x2="784" y2="390" stroke="#333" stroke-width="1.8"/>
  <line x1="470" y1="390" x2="470" y2="250" stroke="#333" stroke-width="1.8"/>
  <line x1="470" y1="244" x2="784" y2="244" stroke="#bbb" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="790" y="248" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666" text-anchor="end">0.5 ceiling</text>
