  <polyline points="470.0,390.0 473.0,386.6 476.0,383.2 479.0,379.9 482.0,376.7 485.0,373.6 488.0,370.5 491.0,367.5 494.0,364.6 497.0,361.7 500.0,359.0 503.0,356.3 506.0,353.6 509.0,351.0 512.0,348.5 515.0,346.0 518.0,343.6 521.0,341.3 524.0,339.0 527.0,336.7 530.0,334.6 533.0,332.4 536.0,330.3 539.0,328.3 542.0,326.3 545.0,324.4 548.0,322.5 551.0,320.6 554.0,318.8 557.0,317.1 560.0,315.3 563.0,313.7 566.0,312.0 569.0,310.4 572.0,308.9 575.0,307.3 578.0,305.9 581.0,304.4 584.0,303.0 587.0,301.6 590.0,300.2 593.0,298.9 596.0,297.6 599.0,296.4 602.0,295.1 605.0,293.9 608.0,292.8 611.0,291.6 614.0,290.5 617.0,289.4 620.0,288.4 623.0,287.3 626.0,286.3 629.0,285.3 632.0,284.3 635.0,283.4 638.0,282.5 641.0,281.6 644.0,280.7 647.0,279.8 650.0,279.0 653.0,278.2 656.0,277.4 659.0,276.6 662.0,275.9 665.0,275.1 668.0,274.4 671.0,273.7 674.0,273.0 677.0,272.3 680.0,271.7 683.0,271.0 686.0,270.4 689.0,269.8 692.0,269.2 695.0,268.6 698.0,268.0 701.0,267.5 704.0,266.9 707.0,266.4 710.0,265.9 713.0,265.4 716.0,264.9 719.0,264.4 722.0,263.9 725.0,263.5 728.0,263.0 731.0,262.6 734.0,262.1 737.0,261.7 740.0,261.3 743.0,260.9 746.0,260.5 749.0,260.2 752.0,259.8 755.0,259.4 758.0,259.1 761.0,258.7 764.0,258.4 767.0,258.1 770.0,257.7" fill="none" stroke="#1a6fb5" stroke-width="2.8"/>
  <text x="530" y="286" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8fa8c0">if RF = distance</text>
  <text x="640" y="316" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1a6fb5">observed RF</text>
  <text x="627" y="410" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333" text-anchor="middle">true map distance (Morgans) &#8594;</text>
  <text x="470" y="428" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">Build maps from SHORT intervals summed &#8212; distances add, RFs do not.</text>
