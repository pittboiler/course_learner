<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 430" width="824" height="430" role="img" aria-label="First-cousin pedigree with two IBD paths, genotype frequencies shifting with F, and the Wahlund effect">
  <rect width="824" height="430" fill="#ffffff"/>
  <text x="14" y="22" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">First cousins: two paths, each (&#189;)&#8308;</text>

  <g stroke="#333" stroke-width="1.6" fill="none">
    <line x1="60" y1="56" x2="130" y2="56"/>
    <line x1="95" y1="56" x2="95" y2="82"/>
    <line x1="46" y1="82" x2="144" y2="82"/>
    <line x1="46" y1="82" x2="46" y2="96"/><line x1="144" y1="82" x2="144" y2="96"/>
    <line x1="46" y1="112" x2="20" y2="112"/><line x1="144" y1="112" x2="176" y2="112"/>
    <line x1="33" y1="112" x2="33" y2="138"/><line x1="160" y1="112" x2="160" y2="138"/>
    <line x1="33" y1="138" x2="60" y2="138"/><line x1="160" y1="138" x2="133" y2="138"/>
    <line x1="60" y1="152" x2="60" y2="166"/><line x1="133" y1="152" x2="133" y2="166"/>
    <line x1="60" y1="180" x2="133" y2="180"/>
    <line x1="96" y1="180" x2="96" y2="200"/>
  </g>
  <rect x="52" y="48" width="16" height="16" fill="#e8a33d" stroke="#333" stroke-width="1.6"/>
  <circle cx="130" cy="56" r="8" fill="#e8a33d" stroke="#333" stroke-width="1.6"/>
  <text x="95" y="40" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8a5a10" text-anchor="middle">shared grandparents</text>
  <rect x="38" y="96" width="16" height="16" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <circle cx="144" cy="104" r="8" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <circle cx="20" cy="112" r="8" fill="#eee" stroke="#333" stroke-width="1.6"/>
  <rect x="168" y="104" width="16" height="16" fill="#eee" stroke="#333" stroke-width="1.6"/>
  <rect x="52" y="138" width="16" height="16" fill="#1a6fb5" stroke="#333" stroke-width="1.6"/>
  <circle cx="133" cy="146" r="8" fill="#1a6fb5" stroke="#333" stroke-width="1.6"/>
  <text x="96" y="200" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a6fb5" text-anchor="middle">first cousins</text>
  <circle cx="96" cy="212" r="9" fill="#d1495b" stroke="#333" stroke-width="1.6"/>
  <text x="96" y="238" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b" text-anchor="middle">F = &#189; &#215; &#8539; = 1/16</text>
  <text x="14" y="264" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">Each path: 5 individuals &#8594; (&#189;)&#8308; = 1/16.</text>
  <text x="14" y="280" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">Two shared grandparents &#8594; kinship = &#8539;.</text>
  <text x="14" y="300" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111">F(offspring) = &#189; &#215; r(parents)</text>

  <line x1="212" y1="34" x2="212" y2="320" stroke="#ddd" stroke-width="2"/>
  <text x="234" y="46" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">F moves heterozygotes into the homozygote classes</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="10">
    <text x="234" y="70" fill="#666">F = 0</text>
    <rect x="290" y="58" width="70" height="18" fill="#1a6fb5"/><rect x="360" y="58" width="140" height="18" fill="#2e8b57"/><rect x="500" y="58" width="70" height="18" fill="#d1495b"/>
    <text x="325" y="72" fill="#fff" text-anchor="middle">p&#178;</text><text x="430" y="72" fill="#fff" text-anchor="middle">2pq</text><text x="535" y="72" fill="#fff" text-anchor="middle">q&#178;</text>

    <text x="234" y="106" fill="#666">F = 0.0625</text>
    <rect x="290" y="94" width="79" height="18" fill="#1a6fb5"/><rect x="369" y="94" width="122" height="18" fill="#2e8b57"/><rect x="491" y="94" width="79" height="18" fill="#d1495b"/>

    <text x="234" y="142" fill="#666">F = 0.25</text>
    <rect x="290" y="130" width="105" height="18" fill="#1a6fb5"/><rect x="395" y="130" width="70" height="18" fill="#2e8b57"/><rect x="465" y="130" width="105" height="18" fill="#d1495b"/>

    <text x="234" y="178" fill="#666">F = 1</text>
    <rect x="290" y="166" width="140" height="18" fill="#1a6fb5"/><rect x="430" y="166" width="140" height="18" fill="#d1495b"/>
  </g>
  <text x="234" y="206" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">f(AA) = p&#178; + Fpq&#160;&#160;&#183;&#160;&#160;f(Aa) = 2pq(1&#8722;F)&#160;&#160;&#183;&#160;&#160;f(aa) = q&#178; + Fpq</text>
  <text x="234" y="228" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#2e8b57">Allele frequencies do NOT change. Inbreeding is not evolution.</text>
  <rect x="234" y="242" width="336" height="66" rx="7" fill="#fbe9eb" stroke="#d1495b" stroke-width="1.5"/>
  <text x="246" y="262" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7a2530">Relative rise in affected: 1 + Fp/q &#8776; 1 + F/q</text>
  <text x="246" y="280" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7a2530">&#8594; the RARER the allele, the more inbreeding matters.</text>
  <text x="246" y="300" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#7a2530">q = 0.001, first cousins: a 63-fold increase.</text>

  <line x1="596" y1="34" x2="596" y2="320" stroke="#ddd" stroke-width="2"/>
  <text x="616" y="46" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Wahlund effect</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="10">
    <rect x="616" y="60" width="164" height="52" rx="6" fill="#e8f0fb" stroke="#1a6fb5" stroke-width="1.4"/>
    <text x="626" y="78" fill="#134f80">community 1: q = 0.2</text>
    <text x="626" y="96" fill="#134f80">320 : 160 : 20 &#8212; perfect HW</text>
    <rect x="616" y="118" width="164" height="52" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.4"/>
    <text x="626" y="136" fill="#1f5c3a">community 2: q = 0.8</text>
    <text x="626" y="154" fill="#1f5c3a">20 : 160 : 320 &#8212; perfect HW</text>
    <path d="M 698 174 L 698 192" stroke="#555" stroke-width="2" marker-end="url(#t)"/>
    <rect x="616" y="194" width="164" height="52" rx="6" fill="#fbe9eb" stroke="#d1495b" stroke-width="1.8"/>
    <text x="626" y="212" fill="#7a2530">POOLED: 340 : 320 : 340</text>
    <text x="626" y="230" font-weight="bold" fill="#7a2530">heterozygote deficit &#8594; &#8220;F&#8221; = 0.36</text>
  </g>
  <text x="606" y="266" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">Nobody married a relative.</text>
  <text x="606" y="282" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">Structure and inbreeding are</text>
  <text x="606" y="298" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#d1495b">indistinguishable at ONE locus.</text>

  <rect x="14" y="334" width="770" height="84" rx="8" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.5"/>
  <text x="28" y="356" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Telling them apart requires many loci:</text>
  <text x="28" y="378" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">&#8226; True inbreeding &#8594; genome-wide excess homozygosity in an individual, as <tspan font-weight="bold">long runs of homozygosity</tspan>.</text>
  <text x="28" y="396" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">&#8226; Structure &#8594; deficits <tspan font-weight="bold">correlated across loci in a way that clusters individuals into groups</tspan> &#8212; visible as PCA clusters.</text>
  <text x="28" y="414" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#d1495b">This is exactly the correction every modern GWAS applies. F_ST = (H_T &#8722; H_S)/H_T quantifies the structure.</text>
  <defs><marker id="t" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs>
</svg>
