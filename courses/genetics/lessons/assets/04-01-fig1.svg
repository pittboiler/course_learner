<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="Adding loci makes a discrete trait continuous, the variance partition with only the additive part transmitted, offspring on midparent regression, and the liability threshold model">
  <rect width="800" height="440" fill="#ffffff"/>
  <text x="14" y="22" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">Many Mendelian loci of small effect &#8594; a normal distribution</text>
  <rect x="24.0" y="110.0" width="16.6" height="40.0" fill="#1a6fb5"/><rect x="43.3" y="70.0" width="16.6" height="80.0" fill="#1a6fb5"/><rect x="62.7" y="110.0" width="16.6" height="40.0" fill="#1a6fb5"/><text x="53" y="168" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">1 locus</text><rect x="90.0" y="136.7" width="10.0" height="13.3" fill="#1a6fb5"/><rect x="101.6" y="96.7" width="10.0" height="53.3" fill="#1a6fb5"/><rect x="113.2" y="70.0" width="10.0" height="80.0" fill="#1a6fb5"/><rect x="124.8" y="96.7" width="10.0" height="53.3" fill="#1a6fb5"/><rect x="136.4" y="136.7" width="10.0" height="13.3" fill="#1a6fb5"/><text x="119" y="168" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">2 loci</text><rect x="156.0" y="149.7" width="4.5" height="0.3" fill="#1a6fb5"/><rect x="161.3" y="146.8" width="4.5" height="3.2" fill="#1a6fb5"/><rect x="166.5" y="135.7" width="4.5" height="14.3" fill="#1a6fb5"/><rect x="171.8" y="111.9" width="4.5" height="38.1" fill="#1a6fb5"/><rect x="177.1" y="83.3" width="4.5" height="66.7" fill="#1a6fb5"/><rect x="182.4" y="70.0" width="4.5" height="80.0" fill="#1a6fb5"/><rect x="187.6" y="83.3" width="4.5" height="66.7" fill="#1a6fb5"/><rect x="192.9" y="111.9" width="4.5" height="38.1" fill="#1a6fb5"/><rect x="198.2" y="135.7" width="4.5" height="14.3" fill="#1a6fb5"/><rect x="203.5" y="146.8" width="4.5" height="3.2" fill="#1a6fb5"/><rect x="208.7" y="149.7" width="4.5" height="0.3" fill="#1a6fb5"/><text x="185" y="168" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">5 loci</text><rect x="222.0" y="150.0" width="1.2" height="0.0" fill="#1a6fb5"/><rect x="223.4" y="150.0" width="1.2" height="0.0" fill="#1a6fb5"/><rect x="224.8" y="150.0" width="1.2" height="0.0" fill="#1a6fb5"/><rect x="226.2" y="150.0" width="1.2" height="0.0" fill="#1a6fb5"/><rect x="227.7" y="150.0" width="1.2" height="0.0" fill="#1a6fb5"/><rect x="229.1" y="150.0" width="1.2" height="0.0" fill="#1a6fb5"/><rect x="230.5" y="150.0" width="1.2" height="0.0" fill="#1a6fb5"/><rect x="231.9" y="150.0" width="1.2" height="0.0" fill="#1a6fb5"/><rect x="233.3" y="150.0" width="1.2" height="0.0" fill="#1a6fb5"/><rect x="234.7" y="149.8" width="1.2" height="0.2" fill="#1a6fb5"/><rect x="236.1" y="149.5" width="1.2" height="0.5" fill="#1a6fb5"/><rect x="237.6" y="148.7" width="1.2" height="1.3" fill="#1a6fb5"/><rect x="239.0" y="146.8" width="1.2" height="3.2" fill="#1a6fb5"/><rect x="240.4" y="143.0" width="1.2" height="7.0" fill="#1a6fb5"/><rect x="241.8" y="136.5" width="1.2" height="13.5" fill="#1a6fb5"/><rect x="243.2" y="126.7" width="1.2" height="23.3" fill="#1a6fb5"/><rect x="244.6" y="113.5" width="1.2" height="36.5" fill="#1a6fb5"/><rect x="246.0" y="98.5" width="1.2" height="51.5" fill="#1a6fb5"/><rect x="247.5" y="84.2" width="1.2" height="65.8" fill="#1a6fb5"/><rect x="248.9" y="73.8" width="1.2" height="76.2" fill="#1a6fb5"/><rect x="250.3" y="70.0" width="1.2" height="80.0" fill="#1a6fb5"/><rect x="251.7" y="73.8" width="1.2" height="76.2" fill="#1a6fb5"/><rect x="253.1" y="84.2" width="1.2" height="65.8" fill="#1a6fb5"/><rect x="254.5" y="98.5" width="1.2" height="51.5" fill="#1a6fb5"/><rect x="256.0" y="113.5" width="1.2" height="36.5" fill="#1a6fb5"/><rect x="257.4" y="126.7" width="1.2" height="23.3" fill="#1a6fb5"/><rect x="258.8" y="136.5" width="1.2" height="13.5" fill="#1a6fb5"/><rect x="260.2" y="143.0" width="1.2" height="7.0" fill="#1a6fb5"/><rect x="261.6" y="146.8" width="1.2" height="3.2" fill="#1a6fb5"/><rect x="263.0" y="148.7" width="1.2" height="1.3" fill="#1a6fb5"/><rect x="264.4" y="149.5" width="1.2" height="0.5" fill="#1a6fb5"/><rect x="265.9" y="149.8" width="1.2" height="0.2" fill="#1a6fb5"/><rect x="267.3" y="150.0" width="1.2" height="0.0" fill="#1a6fb5"/><rect x="268.7" y="150.0" width="1.2" height="0.0" fill="#1a6fb5"/><rect x="270.1" y="150.0" width="1.2" height="0.0" fill="#1a6fb5"/><rect x="271.5" y="150.0" width="1.2" height="0.0" fill="#1a6fb5"/><rect x="272.9" y="150.0" width="1.2" height="0.0" fill="#1a6fb5"/><rect x="274.3" y="150.0" width="1.2" height="0.0" fill="#1a6fb5"/><rect x="275.8" y="150.0" width="1.2" height="0.0" fill="#1a6fb5"/><rect x="277.2" y="150.0" width="1.2" height="0.0" fill="#1a6fb5"/><rect x="278.6" y="150.0" width="1.2" height="0.0" fill="#1a6fb5"/><text x="251" y="168" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">20 loci</text>
  <text x="24" y="192" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">Add environmental variance and even the 2-locus case blurs into continuity.</text>
  <text x="24" y="208" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b">Continuous variation is what particulate inheritance looks like with many particles.</text>

  <line x1="300" y1="34" x2="300" y2="222" stroke="#ddd" stroke-width="2"/>
  <text x="322" y="46" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Partition the variance</text>
  <g>
    <rect x="326" y="60" width="160" height="34" fill="#2e8b57"/><text x="406" y="82" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">V_A (additive)</text>
    <rect x="326" y="94" width="66" height="28" fill="#8fa8c0"/><text x="359" y="113" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#fff" text-anchor="middle">V_D</text>
    <rect x="392" y="94" width="42" height="28" fill="#b8c4cf"/><text x="413" y="113" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#fff" text-anchor="middle">V_I</text>
    <rect x="434" y="94" width="52" height="28" fill="#e0e0e0"/>
    <rect x="326" y="122" width="160" height="34" fill="#e8a33d"/><text x="406" y="144" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle">V_E (environment)</text>
    <path d="M 496 77 L 528 77" stroke="#2e8b57" stroke-width="2.4" marker-end="url(#s)"/>
    <text x="534" y="74" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#2e8b57">TRANSMITTED</text>
    <text x="534" y="90" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#2e8b57">parents pass alleles</text>
    <line x1="496" y1="108" x2="528" y2="108" stroke="#d1495b" stroke-width="2.4"/>
    <line x1="522" y1="102" x2="534" y2="114" stroke="#d1495b" stroke-width="2.4"/>
    <line x1="534" y1="102" x2="522" y2="114" stroke="#d1495b" stroke-width="2.4"/>
    <text x="546" y="112" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">not transmitted &#8212; these are</text>
    <text x="546" y="126" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">properties of COMBINATIONS,</text>
    <text x="546" y="140" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">and meiosis breaks combinations</text>
  </g>
  <text x="326" y="180" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">H&#178; = V_G / V_P &#8212; how much is genetic at all</text>
  <text x="326" y="200" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#2e8b57">h&#178; = V_A / V_P &#8212; how much is <tspan font-style="italic">passed on</tspan>, and the only one that predicts anything</text>

  <line x1="14" y1="234" x2="786" y2="234" stroke="#ddd" stroke-width="2"/>

  <text x="14" y="258" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Read h&#178; off the slope</text>
  <line x1="60" y1="410" x2="330" y2="410" stroke="#333" stroke-width="1.8"/>
  <line x1="60" y1="410" x2="60" y2="272" stroke="#333" stroke-width="1.8"/>
  <text x="195" y="432" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333" text-anchor="middle">midparent value &#8594;</text>
  <text x="52" y="284" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="end">offspring</text>
  <g fill="#8fa8c0">
    <circle cx="92" cy="392" r="3.4"/><circle cx="112" cy="378" r="3.4"/><circle cx="128" cy="390" r="3.4"/><circle cx="146" cy="368" r="3.4"/>
    <circle cx="164" cy="376" r="3.4"/><circle cx="180" cy="356" r="3.4"/><circle cx="198" cy="366" r="3.4"/><circle cx="216" cy="344" r="3.4"/>
    <circle cx="234" cy="352" r="3.4"/><circle cx="252" cy="332" r="3.4"/><circle cx="270" cy="342" r="3.4"/><circle cx="292" cy="322" r="3.4"/>
    <circle cx="106" cy="400" r="3.4"/><circle cx="188" cy="386" r="3.4"/><circle cx="244" cy="368" r="3.4"/><circle cx="306" cy="340" r="3.4"/>
  </g>
  <line x1="80" y1="396" x2="316" y2="330" stroke="#1a6fb5" stroke-width="2.6"/>
  <text x="196" y="304" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#1a6fb5" text-anchor="middle">slope = h&#178;</text>

  <line x1="360" y1="246" x2="360" y2="430" stroke="#ddd" stroke-width="2"/>
  <text x="382" y="258" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Liability threshold: how a polygenic cause gives an all-or-none disease</text>
  <line x1="400" y1="400" x2="770" y2="400" stroke="#333" stroke-width="1.8"/>
  <path d="M 404 398 C 470 396 500 300 585 300 C 670 300 700 396 766 398" fill="#e8f0fb" stroke="#1a6fb5" stroke-width="2.4"/>
  <path d="M 700 344 C 720 366 740 392 766 398 L 700 398 Z" fill="#d1495b" opacity="0.75"/>
  <line x1="700" y1="288" x2="700" y2="410" stroke="#d1495b" stroke-width="2.4" stroke-dasharray="5 4"/>
  <text x="700" y="282" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b" text-anchor="middle">threshold</text>
  <text x="736" y="376" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#fff" text-anchor="middle">affected</text>
  <text x="560" y="418" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333" text-anchor="middle">liability = summed genetic + environmental risk &#8594;</text>
  <text x="382" y="286" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">Sibling recurrence &#8776; &#8730;(prevalence),</text>
  <text x="382" y="302" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">not a Mendelian fraction.</text>
  <text x="382" y="326" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">Carter effect: an affected member of</text>
  <text x="382" y="340" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">the LESS-susceptible sex must have</text>
  <text x="382" y="354" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">crossed a higher threshold &#8212; so their</text>
  <text x="382" y="368" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">relatives are at HIGHER risk.</text>
  <defs><marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e8b57"/></marker></defs>
</svg>