<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Random bivalent orientation at metaphase I giving four equally likely gametes, and the 9:3:3:1 ratio as an outer product of two 3:1 ratios">
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="14" y="24" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">Independent assortment is random spindle orientation</text>

  <g>
    <text x="110" y="52" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#333" text-anchor="middle">Orientation 1 (p = &#189;)</text>
    <line x1="30" y1="112" x2="190" y2="112" stroke="#bbb" stroke-width="1.6" stroke-dasharray="5 4"/>
    <rect x="52" y="72" width="16" height="34" rx="4" fill="#1a6fb5"/><rect x="52" y="118" width="16" height="34" rx="4" fill="#8fa8c0"/>
    <rect x="146" y="72" width="16" height="34" rx="4" fill="#2e8b57"/><rect x="146" y="118" width="16" height="34" rx="4" fill="#9ec9ae"/>
    <text x="60" y="66" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#134f80" text-anchor="middle">A</text>
    <text x="60" y="168" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d7fa0" text-anchor="middle">a</text>
    <text x="154" y="66" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f5c3a" text-anchor="middle">B</text>
    <text x="154" y="168" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4f8a67" text-anchor="middle">b</text>
    <text x="110" y="196" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#333" text-anchor="middle">&#8594; gametes AB and ab</text>
  </g>
  <g>
    <text x="300" y="52" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#333" text-anchor="middle">Orientation 2 (p = &#189;)</text>
    <line x1="220" y1="112" x2="380" y2="112" stroke="#bbb" stroke-width="1.6" stroke-dasharray="5 4"/>
    <rect x="242" y="72" width="16" height="34" rx="4" fill="#1a6fb5"/><rect x="242" y="118" width="16" height="34" rx="4" fill="#8fa8c0"/>
    <rect x="336" y="72" width="16" height="34" rx="4" fill="#9ec9ae"/><rect x="336" y="118" width="16" height="34" rx="4" fill="#2e8b57"/>
    <text x="250" y="66" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#134f80" text-anchor="middle">A</text>
    <text x="250" y="168" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d7fa0" text-anchor="middle">a</text>
    <text x="344" y="66" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4f8a67" text-anchor="middle">b</text>
    <text x="344" y="168" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f5c3a" text-anchor="middle">B</text>
    <text x="300" y="196" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#333" text-anchor="middle">&#8594; gametes Ab and aB</text>
  </g>
  <rect x="30" y="212" width="350" height="46" rx="7" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.5"/>
  <text x="42" y="232" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">Each pair flips its <tspan font-weight="bold">own</tspan> coin, so all four gametes</text>
  <text x="42" y="250" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">appear at &#188; each. That is the whole law.</text>
  <text x="30" y="286" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#d1495b">&#8212; and it holds only for genes on <tspan font-weight="bold">different</tspan> chromosomes.</text>
  <text x="30" y="304" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#d1495b">Module 2 is entirely about what happens when it fails.</text>

  <line x1="416" y1="14" x2="416" y2="386" stroke="#ddd" stroke-width="2"/>
  <text x="438" y="24" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">9:3:3:1 is 3:1 multiplied by itself</text>

  <text x="600" y="58" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333" text-anchor="middle">gene B</text>
  <text x="470" y="80" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#2e8b57" text-anchor="middle">B_ : 3</text>
  <text x="600" y="80" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#2e8b57" text-anchor="middle">&#8212;</text>
  <text x="730" y="80" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#2e8b57" text-anchor="middle">bb : 1</text>
  <text x="446" y="150" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#1a6fb5" text-anchor="middle">A_</text>
  <text x="446" y="166" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#1a6fb5" text-anchor="middle">3</text>
  <text x="446" y="238" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#1a6fb5" text-anchor="middle">aa</text>
  <text x="446" y="254" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#1a6fb5" text-anchor="middle">1</text>
  <text x="424" y="112" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">gene A</text>

  <rect x="470" y="96" width="130" height="88" fill="#e8f0fb" stroke="#1a6fb5" stroke-width="1.8"/>
  <text x="535" y="132" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#134f80" text-anchor="middle">A_ B_</text>
  <text x="535" y="154" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#134f80" text-anchor="middle">3 &#215; 3 = 9</text>
  <rect x="600" y="96" width="130" height="88" fill="#dbeadb" stroke="#2e8b57" stroke-width="1.8"/>
  <text x="665" y="132" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f5c3a" text-anchor="middle">A_ bb</text>
  <text x="665" y="154" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#1f5c3a" text-anchor="middle">3 &#215; 1 = 3</text>
  <rect x="470" y="184" width="130" height="88" fill="#dbeadb" stroke="#2e8b57" stroke-width="1.8"/>
  <text x="535" y="220" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f5c3a" text-anchor="middle">aa B_</text>
  <text x="535" y="242" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#1f5c3a" text-anchor="middle">1 &#215; 3 = 3</text>
  <rect x="600" y="184" width="130" height="88" fill="#fdeee0" stroke="#c9871f" stroke-width="1.8"/>
  <text x="665" y="220" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#8a5a10" text-anchor="middle">aa bb</text>
  <text x="665" y="242" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#8a5a10" text-anchor="middle">1 &#215; 1 = 1</text>

  <text x="438" y="304" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">The famous ratio is not a fact about two genes.</text>
  <text x="438" y="322" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#111">It is (3:1) &#8855; (3:1). Three genes give (3:1) cubed.</text>
  <text x="438" y="348" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">So do each gene separately and multiply &#8212;</text>
  <text x="438" y="366" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">never draw the 64-cell grid.</text>
</svg>
