<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>

  <!-- title -->
  <text x="320" y="30" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">Bell state  |&#934;&#8314;&#10217; = ( |00&#10217; + |11&#10217; ) / &#8730;2</text>

  <!-- the two entangled qubits -->
  <circle cx="180" cy="95" r="30" fill="#dbe9fb" stroke="#1a5fb4" stroke-width="2.5"/>
  <text x="180" y="101" font-size="20" fill="#1a5fb4" text-anchor="middle" font-weight="bold">A</text>
  <circle cx="460" cy="95" r="30" fill="#fde6d3" stroke="#c05a1c" stroke-width="2.5"/>
  <text x="460" y="101" font-size="20" fill="#c05a1c" text-anchor="middle" font-weight="bold">B</text>

  <!-- entanglement squiggle between them -->
  <path d="M212,95 Q235,75 258,95 T304,95 T350,95 T396,95 T428,95" fill="none" stroke="#7a3fb4" stroke-width="2.5"/>
  <text x="320" y="65" font-size="14" fill="#7a3fb4" text-anchor="middle" font-style="italic">entangled &#8212; no state of its own</text>

  <!-- divider -->
  <line x1="60" y1="150" x2="580" y2="150" stroke="#cccccc" stroke-width="1"/>
  <text x="60" y="176" font-size="14" fill="#555555">Measure A in the {|0&#10217;, |1&#10217;} basis:</text>

  <!-- branch 1: A -> 0 -->
  <rect x="70" y="196" width="220" height="84" rx="8" fill="#f5f8fd" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="86" y="222" font-size="15" fill="#1a5fb4" font-weight="bold">A &#8594; 0   (prob &#189;)</text>
  <text x="86" y="248" font-size="14" fill="#222222">collapses to |0&#10217;&#8321; &#8855; |0&#10217;&#8322;</text>
  <text x="86" y="270" font-size="14" fill="#c05a1c" font-weight="bold">&#8756; B is 0 for certain</text>

  <!-- branch 2: A -> 1 -->
  <rect x="350" y="196" width="220" height="84" rx="8" fill="#f5f8fd" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="366" y="222" font-size="15" fill="#1a5fb4" font-weight="bold">A &#8594; 1   (prob &#189;)</text>
  <text x="366" y="248" font-size="14" fill="#222222">collapses to |1&#10217;&#8321; &#8855; |1&#10217;&#8322;</text>
  <text x="366" y="270" font-size="14" fill="#c05a1c" font-weight="bold">&#8756; B is 1 for certain</text>

  <!-- no-signaling note -->
  <rect x="70" y="308" width="500" height="66" rx="8" fill="#fbf6ec" stroke="#b58900" stroke-width="1.5"/>
  <text x="86" y="332" font-size="14" fill="#8a6d00" font-weight="bold">But B alone still looks 50/50.</text>
  <text x="86" y="354" font-size="13" fill="#555555">P(B = 0) = P(B = 1) = &#189; whether or not A was measured &#8212; the correlation only shows</text>
  <text x="86" y="370" font-size="13" fill="#555555">up when the two records are compared. Nothing is transmitted: no signaling.</text>
</svg>
