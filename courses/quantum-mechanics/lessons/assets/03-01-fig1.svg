<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="440" fill="#ffffff"/>

  <text x="330" y="28" font-size="18" fill="#222222" text-anchor="middle">Quantum harmonic oscillator: an evenly-spaced ladder in a parabolic well</text>

  <!-- axes -->
  <line x1="60" y1="390" x2="620" y2="390" stroke="#222222" stroke-width="2"/>
  <line x1="60" y1="405" x2="60" y2="50" stroke="#222222" stroke-width="2"/>
  <polygon points="620,390 608,384 608,396" fill="#222222"/>
  <polygon points="60,50 54,62 66,62" fill="#222222"/>
  <text x="628" y="396" font-size="16" fill="#222222">x</text>
  <text x="46" y="58" font-size="16" fill="#222222">E</text>

  <!-- the parabolic potential  V = 1/2 m w^2 x^2 -->
  <polyline fill="none" stroke="#1a3c5e" stroke-width="2.5"
    points="100,75 120,129.7 140,179.1 160,223.4 180,262.4 200,296.3 220,324.9 240,348.3 260,366.6 280,379.6 300,387.4 320,390 340,387.4 360,379.6 380,366.6 400,348.3 420,324.9 440,296.3 460,262.4 480,223.4 500,179.1 520,129.7 540,75"/>
  <text x="118" y="72" font-size="15" fill="#1a3c5e">V(x) = &#189; m&#969;&#178;x&#178;</text>

  <!-- energy levels (dashed) at E_n = hw(n+1/2), evenly spaced -->
  <line x1="247" y1="355" x2="393" y2="355" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="193" y1="285" x2="447" y2="285" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="156" y1="215" x2="484" y2="215" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="126" y1="145" x2="514" y2="145" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="100" y1="75"  x2="540" y2="75"  stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- level labels -->
  <text x="399" y="360" font-size="14" fill="#555555">E&#8320; = &#189;&#8463;&#969;</text>
  <text x="453" y="290" font-size="14" fill="#555555">E&#8321; = 3/2 &#8463;&#969;</text>
  <text x="490" y="220" font-size="14" fill="#555555">E&#8322; = 5/2 &#8463;&#969;</text>
  <text x="520" y="150" font-size="14" fill="#555555">E&#8323; = 7/2 &#8463;&#969;</text>
  <text x="546" y="80"  font-size="14" fill="#555555">E&#8324; = 9/2 &#8463;&#969;</text>

  <!-- eigenfunctions drawn on their levels -->
  <!-- phi_0: Gaussian, no nodes, level E_0 -->
  <polyline fill="none" stroke="#2e7d32" stroke-width="2"
    points="230,345 250,338 270,330 290,322 310,318 320,317 330,318 350,322 370,330 390,338 410,345"/>
  <text x="218" y="349" font-size="14" fill="#2e7d32" text-anchor="end">&#966;&#8320;</text>

  <!-- phi_1: one node, level E_1 -->
  <polyline fill="none" stroke="#2e7d32" stroke-width="2"
    points="200,291 230,303 260,317 290,314 320,285 350,256 380,253 410,267 440,279"/>
  <text x="188" y="295" font-size="14" fill="#2e7d32" text-anchor="end">&#966;&#8321;</text>

  <!-- phi_2: two nodes, level E_2 -->
  <polyline fill="none" stroke="#2e7d32" stroke-width="2"
    points="190,209 220,196 250,184 270,193 290,217 305,235 320,242 335,235 350,217 370,193 390,184 420,196 450,209"/>
  <text x="178" y="213" font-size="14" fill="#2e7d32" text-anchor="end">&#966;&#8322;</text>

  <!-- "ladder continues" dots -->
  <text x="320" y="112" font-size="20" fill="#999999" text-anchor="middle">&#8942;</text>

  <!-- constant spacing brace: hw between E_2 and E_3 on the far right -->
  <line x1="585" y1="215" x2="585" y2="145" stroke="#b22222" stroke-width="2"/>
  <polygon points="585,215 580,204 590,204" fill="#b22222"/>
  <polygon points="585,145 580,156 590,156" fill="#b22222"/>
  <text x="596" y="185" font-size="15" fill="#b22222">&#8463;&#969;</text>
  <text x="596" y="203" font-size="12" fill="#b22222">(constant)</text>

  <!-- zero-point energy: 1/2 hw above the floor -->
  <line x1="90" y1="355" x2="247" y2="355" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="110" y1="390" x2="110" y2="355" stroke="#c0392b" stroke-width="2"/>
  <polygon points="110,390 105,379 115,379" fill="#c0392b"/>
  <polygon points="110,355 105,366 115,366" fill="#c0392b"/>
  <text x="120" y="378" font-size="14" fill="#c0392b">&#189;&#8463;&#969;</text>
  <text x="120" y="410" font-size="12" fill="#c0392b">zero-point energy (E&#8320; &#8800; 0)</text>
</svg>
