  <text x="470" y="120" font-size="15" fill="#b22222">Re Ψ = (Gaussian envelope) × (oscillation)</text>

  <!-- group-velocity motion arrow -->
  <line x1="215" y1="278" x2="360" y2="278" stroke="#2e7d32" stroke-width="2.4"/>
  <polygon points="360,278 348,272 348,284" fill="#2e7d32"/>
  <text x="288" y="272" font-size="16" fill="#2e7d32" text-anchor="middle">the whole packet drifts right at v_g = p/m</text>

  <!-- divider -->
  <line x1="60" y1="300" x2="700" y2="300" stroke="#eeeeee" stroke-width="1"/>

  <!-- ===== BOTTOM: spread packet, later t ===== -->
