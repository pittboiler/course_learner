<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7b3fb5"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="320" y="28" font-size="16" fill="#333333" text-anchor="middle">A degenerate level splits when the perturbation is turned on</text>

  <!-- LEFT: single g-fold degenerate level -->
  <line x1="70" y1="205" x2="235" y2="205" stroke="#1f6f3f" stroke-width="4"/>
  <text x="152" y="196" font-size="14" fill="#1f6f3f" text-anchor="middle">E&#8304;&#8345;</text>
  <text x="152" y="230" font-size="12" fill="#555555" text-anchor="middle">3 states, same energy</text>
  <text x="152" y="246" font-size="12" fill="#555555" text-anchor="middle">(3-fold degenerate)</text>
  <text x="152" y="176" font-size="12" fill="#888888" text-anchor="middle">H&#770;&#8320; only</text>

  <!-- perturbation-on arrow -->
  <line x1="255" y1="205" x2="360" y2="205" stroke="#7b3fb5" stroke-width="2" marker-end="url(#arr)"/>
  <text x="305" y="196" font-size="13" fill="#7b3fb5" text-anchor="middle">turn on H&#770;&#8242;</text>
  <text x="305" y="224" font-size="11" fill="#7b3fb5" text-anchor="middle">diagonalize W</text>

  <!-- RIGHT: three split sublevels (unequal spacings = eigenvalues of W) -->
  <!-- top -->
  <line x1="400" y1="110" x2="560" y2="110" stroke="#333333" stroke-width="2.5"/>
  <text x="568" y="114" font-size="13" fill="#333333">E&#8304;&#8345; + E&#8321;&#185;</text>
  <text x="480" y="102" font-size="11" fill="#7b3fb5" text-anchor="middle">good state |I&#10217;</text>
  <!-- middle -->
  <line x1="400" y1="200" x2="560" y2="200" stroke="#333333" stroke-width="2.5"/>
  <text x="568" y="204" font-size="13" fill="#333333">E&#8304;&#8345; + E&#8322;&#185;</text>
  <text x="480" y="192" font-size="11" fill="#7b3fb5" text-anchor="middle">good state |II&#10217;</text>
  <!-- bottom -->
  <line x1="400" y1="290" x2="560" y2="290" stroke="#333333" stroke-width="2.5"/>
  <text x="568" y="294" font-size="13" fill="#333333">E&#8304;&#8345; + E&#8323;&#185;</text>
  <text x="480" y="308" font-size="11" fill="#7b3fb5" text-anchor="middle">good state |III&#10217;</text>

  <!-- fan connectors from the degenerate level to each sublevel -->
  <line x1="360" y1="205" x2="400" y2="110" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="360" y1="205" x2="400" y2="200" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="360" y1="205" x2="400" y2="290" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- splitting bracket -->
  <line x1="605" y1="110" x2="625" y2="110" stroke="#d64545" stroke-width="1.2"/>
  <line x1="605" y1="290" x2="625" y2="290" stroke="#d64545" stroke-width="1.2"/>
  <line x1="623" y1="110" x2="623" y2="290" stroke="#d64545" stroke-width="1.2"/>
  <text x="632" y="204" font-size="12" fill="#d64545" transform="rotate(90 632 204)" text-anchor="middle">splitting = spread of W's eigenvalues</text>

  <!-- footnote -->
  <text x="320" y="360" font-size="12" fill="#555555" text-anchor="middle">Each shift E&#7522;&#185; is an eigenvalue of W&#7522;&#11388; = &#10216;i&#8304;|H&#770;&#8242;|j&#8304;&#10217;; each good state is its eigenvector.</text>
  <text x="320" y="380" font-size="12" fill="#999999" text-anchor="middle">If two eigenvalues coincide, those two lines stay merged &#8212; degeneracy only partially lifted.</text>
</svg>
