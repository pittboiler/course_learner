<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
  <!-- shaded probability region under the curve between a and b -->
  <polygon points="290,300 290,97 330,70 370,97 410,160.5 410,300"
           fill="#7aa7d8" fill-opacity="0.55" stroke="none"/>
  <!-- axes -->
  <line x1="60" y1="300" x2="608" y2="300" stroke="#222222" stroke-width="2"/>
  <line x1="90" y1="330" x2="90" y2="52" stroke="#222222" stroke-width="2"/>
  <!-- x axis arrow -->
  <polygon points="608,300 596,294 596,306" fill="#222222"/>
  <!-- density curve |psi|^2 -->
  <polyline fill="none" stroke="#b22222" stroke-width="3"
    points="90,297.45 130,289.9 170,268.9 210,225.3 250,160.5 290,97 330,70 370,97 410,160.5 450,225.3 490,268.9 530,289.9 570,297.45"/>
  <!-- interval markers a and b on the axis -->
  <line x1="290" y1="300" x2="290" y2="312" stroke="#222222" stroke-width="2"/>
  <line x1="410" y1="300" x2="410" y2="312" stroke="#222222" stroke-width="2"/>
  <text x="286" y="330" font-size="20" fill="#222222">a</text>
  <text x="406" y="330" font-size="20" fill="#222222">b</text>
  <!-- labels -->
  <text x="614" y="306" font-size="20" fill="#222222">x</text>
  <text x="150" y="90" font-size="22" fill="#b22222">|&#968;(x)|&#178;</text>
  <text x="300" y="230" font-size="17" fill="#1a3c5e" text-anchor="middle">P(a&#8804;x&#8804;b)</text>
  <text x="205" y="352" font-size="15" fill="#555555">shaded area = probability the particle is found in [a, b]</text>
</svg>
