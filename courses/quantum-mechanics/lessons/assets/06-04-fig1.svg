  <text x="600" y="60" font-size="17" fill="#1a5fb4">V(x)</text>

  <!-- energy level E (dashed) -->
  <line x1="90" y1="176" x2="600" y2="176" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="604" y="182" font-size="18" fill="#333333">E</text>

  <!-- turning point markers -->
  <line x1="144" y1="176" x2="144" y2="335" stroke="#888888" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="546" y1="176" x2="546" y2="335" stroke="#888888" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="144" cy="176" r="4" fill="#333333"/>
  <circle cx="546" cy="176" r="4" fill="#333333"/>
  <text x="130" y="352" font-size="17" fill="#222222">a</text>
  <text x="540" y="352" font-size="17" fill="#222222">b</text>
  <text x="90" y="352" font-size="13" fill="#555555">turning points: E = V</text>

  <!-- WKB wavefunction: exponential outside, oscillatory (1/sqrt(p) envelope) inside -->
  <polyline fill="none" stroke="#c01c28" stroke-width="2.4"
    points="70.0,176.0 99.3,175.9 108.5,175.6 114.0,175.0 119.5,173.5 125.0,170.5 130.5,165.0 136.0,156.9 141.5,148.2 144.2,146.0 147.0,146.1 152.5,148.0 158.0,154.4 163.5,166.8 169.0,183.1 174.5,197.1 180.0,202.6 185.5,195.8 191.0,178.7 196.5,160.3 202.0,152.0 207.5,160.4 213.0,180.3 218.5,196.6 222.2,198.2 227.7,184.6 233.2,163.3 238.7,154.2 244.2,166.6 249.7,188.4 254.2,197.3 259.8,186.4 265.2,164.1 269.8,155.1 275.3,166.8 280.8,189.3 285.4,196.5 290.9,182.0 296.4,160.2 300.1,155.8 305.6,170.7 311.1,192.4 314.8,195.9 320.2,179.6 325.8,158.7 329.4,156.7 334.9,174.6 340.4,194.4 343.2,195.7 348.7,183.0 354.2,158.3 357.8,156.9 363.3,175.4 368.8,194.7 371.6,195.7 377.1,178.7 382.6,158.2 386.2,156.6 391.8,174.5 397.2,194.4 400.0,196.3 405.5,181.4 411.0,159.8 414.7,155.3 420.2,169.2 425.7,191.0 429.3,197.1 434.8,186.1 440.3,164.0 444.9,154.5 450.4,163.6 455.9,185.1 461.4,198.1 464.2,196.9 469.7,181.2 475.2,160.9 479.8,152.8 485.2,159.5 490.8,178.3 496.2,195.7 500.8,201.3 506.3,194.8 511.8,178.7 517.3,161.2 522.8,149.0 527.4,146.0 532.9,149.9 538.4,157.4 543.9,164.2 546.7,165.5 552.2,168.2 558.6,171.7 565.0,174.0 573.2,175.4 583.3,175.9 596.2,176.0 620.0,176.0"/>

  <!-- annotations -->
  <text x="235" y="128" font-size="15" fill="#c01c28" text-anchor="middle">classically allowed: &#968; oscillates,  amplitude &#8733; 1/&#8730;p</text>
  <text x="107" y="230" font-size="13" fill="#5a6b80" text-anchor="middle">forbidden</text>
  <text x="107" y="247" font-size="13" fill="#5a6b80" text-anchor="middle">&#968; ~ e^(&#8722;&#8747;&#954;dx)</text>
  <text x="583" y="230" font-size="13" fill="#5a6b80" text-anchor="middle">forbidden</text>
  <text x="583" y="247" font-size="13" fill="#5a6b80" text-anchor="middle">&#968; decays</text>

  <!-- caption -->
  <text x="60" y="384" font-size="14" fill="#555555" font-style="italic">Between the turning points E &gt; V and the wave ripples (piling up where the particle moves slowly); outside, E &lt; V and it dies exponentially.</text>
</svg>
