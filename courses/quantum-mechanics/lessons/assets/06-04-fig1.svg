<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 400" font-family="sans-serif">
  <rect x="0" y="0" width="690" height="400" fill="#ffffff"/>

  <!-- shaded classically-forbidden regions (E < V, outside turning points) -->
  <rect x="70"  y="40" width="74"  height="285" fill="#e7edf5" fill-opacity="0.75"/>
  <rect x="546" y="40" width="74"  height="285" fill="#e7edf5" fill-opacity="0.75"/>

  <!-- axis baseline (bottom of well, V=0) -->
