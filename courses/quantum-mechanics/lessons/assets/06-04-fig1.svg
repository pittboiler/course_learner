  <polygon points="640,325 628,319 628,331" fill="#222222"/>
  <text x="644" y="331" font-size="19" fill="#222222">x</text>

  <!-- potential well V(x) (smooth parabola) -->
  <polyline fill="none" stroke="#1a5fb4" stroke-width="3"
