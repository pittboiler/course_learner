<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="sans-serif">
  <rect x="0" y="0" width="680" height="430" fill="#ffffff"/>

  <!-- title -->
  <text x="340" y="30" font-size="18" fill="#222222" text-anchor="middle">&#189; &#8855; &#189;  =  1  &#8853;  0</text>
  <text x="340" y="52" font-size="14" fill="#555555" text-anchor="middle">spin &#8855; spin  =  triplet &#8853; singlet   &#183;   dimension  2 &#215; 2 = 4 = 3 + 1</text>

  <!-- m axis -->
  <line x1="70" y1="120" x2="70" y2="360" stroke="#222222" stroke-width="1.5"/>
  <text x="70" y="108" font-size="14" fill="#222222" text-anchor="middle">m</text>
  <text x="52" y="155" font-size="13" fill="#222222" text-anchor="end">+1</text>
  <text x="52" y="245" font-size="13" fill="#222222" text-anchor="end">0</text>
  <text x="52" y="335" font-size="13" fill="#222222" text-anchor="end">&#8722;1</text>
  <line x1="66" y1="150" x2="74" y2="150" stroke="#222222" stroke-width="1.5"/>
  <line x1="66" y1="240" x2="74" y2="240" stroke="#222222" stroke-width="1.5"/>
  <line x1="66" y1="330" x2="74" y2="330" stroke="#222222" stroke-width="1.5"/>

  <!-- Triplet block -->
  <text x="230" y="98" font-size="15" fill="#1a3c5e" text-anchor="middle">Triplet   j = 1   (symmetric)</text>
  <text x="230" y="116" font-size="12.5" fill="#1a3c5e" text-anchor="middle">J&#178; = 2&#8463;&#178;</text>

  <line x1="150" y1="150" x2="310" y2="150" stroke="#1a3c5e" stroke-width="2.5"/>
  <text x="322" y="155" font-size="14" fill="#1a3c5e">|&#8593;&#8593;&#10217;</text>

  <line x1="150" y1="240" x2="310" y2="240" stroke="#1a3c5e" stroke-width="2.5"/>
  <text x="322" y="245" font-size="14" fill="#1a3c5e">(|&#8593;&#8595;&#10217; + |&#8595;&#8593;&#10217;)/&#8730;2</text>

  <line x1="150" y1="330" x2="310" y2="330" stroke="#1a3c5e" stroke-width="2.5"/>
  <text x="322" y="335" font-size="14" fill="#1a3c5e">|&#8595;&#8595;&#10217;</text>

  <!-- lowering arrows down the triplet -->
  <line x1="135" y1="158" x2="135" y2="228" stroke="#b22222" stroke-width="2"/>
  <polygon points="135,234 129,222 141,222" fill="#b22222"/>
  <text x="126" y="197" font-size="13.5" fill="#b22222" text-anchor="end">J&#8722;</text>

  <line x1="135" y1="248" x2="135" y2="318" stroke="#b22222" stroke-width="2"/>
  <polygon points="135,324 129,312 141,312" fill="#b22222"/>
  <text x="126" y="287" font-size="13.5" fill="#b22222" text-anchor="end">J&#8722;</text>

  <!-- Singlet block -->
  <text x="540" y="98" font-size="15" fill="#7a1a5e" text-anchor="middle">Singlet   j = 0</text>
  <text x="540" y="116" font-size="12.5" fill="#7a1a5e" text-anchor="middle">(antisymmetric),   J&#178; = 0</text>

  <line x1="470" y1="240" x2="610" y2="240" stroke="#7a1a5e" stroke-width="2.5"/>
  <text x="540" y="266" font-size="14" fill="#7a1a5e" text-anchor="middle">(|&#8593;&#8595;&#10217; &#8722; |&#8595;&#8593;&#10217;)/&#8730;2</text>

  <!-- note about m=0 subspace -->
  <text x="340" y="398" font-size="12.5" fill="#555555" text-anchor="middle">the two m = 0 products |&#8593;&#8595;&#10217;, |&#8595;&#8593;&#10217; split into one symmetric (triplet) and one antisymmetric (singlet) combination</text>
</svg>
