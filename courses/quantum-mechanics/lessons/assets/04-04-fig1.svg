<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="430" fill="#ffffff"/>
  <defs>
    <marker id="down-v" markerWidth="10" markerHeight="10" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#7b3fb5"/>
    </marker>
    <marker id="down-r" markerWidth="10" markerHeight="10" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#d64545"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="320" y="24" font-size="16" fill="#333333" text-anchor="middle">Hydrogen energy levels &#160; E&#8345; = &#8722;13.6 eV / n&#178;</text>

  <!-- continuum band (E > 0) -->
  <rect x="130" y="42" width="380" height="28" fill="#eeeeee"/>
  <line x1="130" y1="70" x2="510" y2="70" stroke="#888888" stroke-width="1.5"/>
  <text x="320" y="60" font-size="12" fill="#777777" text-anchor="middle">continuum: E &gt; 0, electron unbound (ionized)</text>
  <text x="515" y="74" font-size="12" fill="#777777">E = 0</text>

  <!-- energy levels: y = 70 + (-E)*25 ; ceiling E=0 at y=70, floor E=-13.6 at y=410 -->
  <!-- n=5 : E=-0.54 -> y=83.6 -->
  <line x1="130" y1="83" x2="510" y2="83" stroke="#333333" stroke-width="2"/>
  <text x="112" y="87" font-size="12" fill="#333333" text-anchor="end">5</text>
  <!-- n=4 : E=-0.85 -> y=91.3 -->
  <line x1="130" y1="91" x2="510" y2="91" stroke="#333333" stroke-width="2"/>
  <text x="112" y="95" font-size="12" fill="#333333" text-anchor="end">4</text>
  <!-- n=3 : E=-1.51 -> y=107.8 -->
  <line x1="130" y1="108" x2="510" y2="108" stroke="#333333" stroke-width="2"/>
  <text x="112" y="112" font-size="13" fill="#333333" text-anchor="end">3</text>
  <text x="515" y="112" font-size="11" fill="#999999">&#8722;1.51 eV</text>
  <!-- n=2 : E=-3.4 -> y=155 -->
  <line x1="130" y1="155" x2="510" y2="155" stroke="#333333" stroke-width="2"/>
  <text x="112" y="159" font-size="13" fill="#333333" text-anchor="end">2</text>
  <text x="515" y="159" font-size="11" fill="#999999">&#8722;3.40 eV</text>
  <!-- n=1 : E=-13.6 -> y=410 -->
  <line x1="130" y1="410" x2="510" y2="410" stroke="#333333" stroke-width="2.5"/>
  <text x="112" y="414" font-size="13" fill="#333333" text-anchor="end">1</text>
  <text x="515" y="414" font-size="11" fill="#999999">&#8722;13.6 eV (ground)</text>

  <!-- axis label -->
  <text x="70" y="240" font-size="13" fill="#555555" text-anchor="middle" transform="rotate(-90 70 240)">principal quantum number n</text>

  <!-- Balmer alpha: 3 -> 2, red, visible -->
  <line x1="235" y1="108" x2="235" y2="152" stroke="#d64545" stroke-width="2" marker-end="url(#down-r)"/>
  <text x="245" y="132" font-size="12" fill="#d64545">H&#945; (Balmer): 3&#8594;2</text>
  <text x="245" y="147" font-size="11" fill="#d64545">656 nm, red visible</text>

  <!-- Lyman alpha: 2 -> 1, violet, UV -->
  <line x1="360" y1="155" x2="360" y2="407" stroke="#7b3fb5" stroke-width="2" marker-end="url(#down-v)"/>
  <text x="370" y="285" font-size="12" fill="#7b3fb5">Ly&#945; (Lyman): 2&#8594;1</text>
  <text x="370" y="300" font-size="11" fill="#7b3fb5">121.6 nm, UV</text>

  <!-- crowding note -->
  <text x="320" y="82" font-size="10" fill="#aaaaaa" text-anchor="middle"></text>
  <text x="270" y="76" font-size="10" fill="#aaaaaa" text-anchor="middle">levels crowd toward 0 as n grows (spacing &#8764; 1/n&#179;)</text>
</svg>
