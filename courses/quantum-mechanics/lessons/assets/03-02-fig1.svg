<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>

  <!-- energy axis -->
  <line x1="90" y1="392" x2="90" y2="58" stroke="#222222" stroke-width="2"/>
  <polygon points="90,50 84,62 96,62" fill="#222222"/>
  <text x="90" y="44" font-size="15" fill="#222222" text-anchor="middle">Energy</text>

  <!-- continuation dots -->
  <text x="290" y="86" font-size="22" fill="#888888" text-anchor="middle">&#8942;</text>

  <!-- energy levels (equally spaced by hbar-omega) -->
  <line x1="150" y1="100" x2="430" y2="100" stroke="#1a3c5e" stroke-width="2.5"/>
  <text x="445" y="105" font-size="15" fill="#1a3c5e">n = 4,&#160;&#160;E&#8324; = (9/2)&#8463;&#969;</text>

  <line x1="150" y1="160" x2="430" y2="160" stroke="#1a3c5e" stroke-width="2.5"/>
  <text x="445" y="165" font-size="15" fill="#1a3c5e">n = 3,&#160;&#160;E&#8323; = (7/2)&#8463;&#969;</text>

  <line x1="150" y1="220" x2="430" y2="220" stroke="#1a3c5e" stroke-width="2.5"/>
  <text x="445" y="225" font-size="15" fill="#1a3c5e">n = 2,&#160;&#160;E&#8322; = (5/2)&#8463;&#969;</text>

  <line x1="150" y1="280" x2="430" y2="280" stroke="#1a3c5e" stroke-width="2.5"/>
  <text x="445" y="285" font-size="15" fill="#1a3c5e">n = 1,&#160;&#160;E&#8321; = (3/2)&#8463;&#969;</text>

  <line x1="150" y1="340" x2="430" y2="340" stroke="#1a3c5e" stroke-width="2.5"/>
  <text x="445" y="345" font-size="15" fill="#1a3c5e">n = 0,&#160;&#160;E&#8320; = (1/2)&#8463;&#969;</text>

  <!-- spacing indicator hbar-omega between n=1 and n=2 -->
  <line x1="125" y1="224" x2="125" y2="276" stroke="#222222" stroke-width="1.5"/>
  <polygon points="125,220 119,232 131,232" fill="#222222"/>
  <polygon points="125,280 119,268 131,268" fill="#222222"/>
  <text x="112" y="255" font-size="15" fill="#222222" text-anchor="end">&#8463;&#969;</text>

  <!-- raising arrow a-dagger (up) between n=0 and n=1 -->
  <line x1="215" y1="336" x2="215" y2="286" stroke="#1a7a3c" stroke-width="2.5"/>
  <polygon points="215,281 209,293 221,293" fill="#1a7a3c"/>
  <text x="224" y="316" font-size="16" fill="#1a7a3c">a&#8224;</text>

  <!-- lowering arrow a (down) between n=1 and n=0 -->
  <line x1="365" y1="284" x2="365" y2="334" stroke="#b22222" stroke-width="2.5"/>
  <polygon points="365,339 359,327 371,327" fill="#b22222"/>
  <text x="356" y="316" font-size="16" fill="#b22222" text-anchor="end">a</text>

  <!-- rung labels -->
  <text x="290" y="378" font-size="13.5" fill="#1a7a3c" text-anchor="middle">a&#8224;|n&#10217; = &#8730;(n+1) |n+1&#10217;</text>
  <text x="290" y="398" font-size="13.5" fill="#b22222" text-anchor="middle">a|n&#10217; = &#8730;n |n&#8722;1&#10217;,&#160;&#160;&#160;a|0&#10217; = 0  (floor)</text>
</svg>
