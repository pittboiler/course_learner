  <!-- ===== Panel 3: t = T/2 ===== -->
  <text x="510" y="52" font-size="14" fill="#1a3c5e" text-anchor="middle">t = T/2   (cos&#969;t = &#8722;1)</text>
  <line x1="445" y1="45" x2="445" y2="175" stroke="#222222" stroke-width="2.5"/>
  <line x1="575" y1="45" x2="575" y2="175" stroke="#222222" stroke-width="2.5"/>
  <line x1="445" y1="175" x2="575" y2="175" stroke="#222222" stroke-width="2"/>
  <polyline fill="#7aa7d8" fill-opacity="0.55" stroke="#b22222" stroke-width="2.5"
