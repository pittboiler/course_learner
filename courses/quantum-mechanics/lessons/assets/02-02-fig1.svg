  <line x1="533.4" y1="175" x2="533.4" y2="45" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polygon points="533.4,178 528.4,190 538.4,190" fill="#1a7f37"/>
  <text x="533.4" y="204" font-size="12" fill="#1a7f37" text-anchor="middle">&#10216;x&#10217;</text>

  <!-- flow arrows between panels -->
  <text x="210" y="120" font-size="26" fill="#888888">&#8594;</text>
  <text x="410" y="120" font-size="26" fill="#888888">&#8594;</text>

  <!-- caption -->
  <text x="320" y="240" font-size="13.5" fill="#555555" text-anchor="middle">Each &#966;&#8345; alone has a frozen |&#966;&#8345;|&#178;. Together, the cross term rides cos(&#969;t) with &#969; = (E&#8322;&#8722;E&#8321;)/&#295;,</text>
  <text x="320" y="260" font-size="13.5" fill="#555555" text-anchor="middle">so the blob &#8212; and &#10216;x&#10217; &#8212; oscillates left&#8596;right at the beat frequency set by the energy gap. Period T = 2&#960;&#295;/(E&#8322;&#8722;E&#8321;).</text>
</svg>
