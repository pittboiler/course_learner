  <polygon points="86.6,178 81.6,190 91.6,190" fill="#1a7f37"/>
  <text x="86.6" y="204" font-size="12" fill="#1a7f37" text-anchor="middle">&#10216;x&#10217;</text>

  <!-- ===== Panel 2: t = T/4 ===== -->
  <text x="310" y="52" font-size="14" fill="#1a3c5e" text-anchor="middle">t = T/4   (cos&#969;t = 0)</text>
  <line x1="245" y1="45" x2="245" y2="175" stroke="#222222" stroke-width="2.5"/>
  <line x1="375" y1="45" x2="375" y2="175" stroke="#222222" stroke-width="2.5"/>
  <line x1="245" y1="175" x2="375" y2="175" stroke="#222222" stroke-width="2"/>
