  <text x="150" y="60" font-size="13" fill="#666666" font-style="italic">+&#8463;&#178;&#8467;(&#8467;+1)/2mr&#178;</text>

  <!-- bare Coulomb well: -A/r  (blue dashed) -->
  <polyline fill="none" stroke="#1a5fb4" stroke-width="2" stroke-dasharray="6 5"
    points="132.5,326.7 140.1,305.6 147.7,289.3 155.3,276.3 162.8,265.6 170.4,256.8 178.0,249.3 185.6,242.9 193.2,237.3 200.8,232.5 208.3,228.2 215.9,224.4 223.5,221.0 231.1,217.9 238.7,215.1 246.3,212.6 253.9,210.3 261.4,208.2 269.0,206.3 276.6,204.5 284.2,202.9 291.8,201.3 299.4,199.9 306.9,198.6 314.5,197.3 322.1,196.1 329.7,195.0 337.3,194.0 344.9,193.0 352.5,192.1 360.0,191.2 367.6,190.4 375.2,189.6 382.8,188.9 390.4,188.2 398.0,187.5 405.6,186.9 413.1,186.3 420.7,185.7 428.3,185.1 435.9,184.6 443.5,184.1 451.1,183.6 458.6,183.1 466.2,182.7 473.8,182.2 481.4,181.8 489.0,181.4 496.6,181.0 504.2,180.6 511.7,180.3 519.3,179.9 526.9,179.6 534.5,179.3 542.1,178.9 549.7,178.6 557.2,178.3 564.8,178.0 572.4,177.8 580.0,177.5"/>
