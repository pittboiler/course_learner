  <polyline fill="none" stroke="#c01c28" stroke-width="3"
    points="111.0,101.0 117.0,157.0 123.0,186.2 129.1,202.0 135.1,210.7 141.1,215.3 147.1,217.5 153.1,218.3 159.1,218.2 165.1,217.5 171.1,216.5 177.2,215.3 183.2,214.0 189.2,212.6 195.2,211.2 201.2,209.9 207.2,208.5 213.2,207.2 219.2,205.9 225.3,204.7 231.3,203.5 237.3,202.4 243.3,201.3 249.3,200.2 255.3,199.2 261.3,198.3 267.3,197.4 273.4,196.5 279.4,195.6 285.4,194.8 291.4,194.0 297.4,193.3 303.4,192.6 309.4,191.9 315.4,191.2 321.5,190.6 327.5,190.0 333.5,189.4 339.5,188.8 345.5,188.3 351.5,187.8 357.5,187.3 363.5,186.8 369.6,186.3 375.6,185.8 381.6,185.4 387.6,185.0 393.6,184.6 399.6,184.2 405.6,183.8 411.6,183.4 417.7,183.0 423.7,182.7 429.7,182.3 435.7,182.0 441.7,181.7 447.7,181.4 453.7,181.1 459.7,180.8 465.8,180.5 471.8,180.2 477.8,179.9 483.8,179.7 489.8,179.4 495.8,179.1 501.8,178.9 507.8,178.7 513.9,178.4 519.9,178.2 525.9,178.0 531.9,177.8 537.9,177.5 543.9,177.3 549.9,177.1 555.9,176.9 562.0,176.7 568.0,176.6 574.0,176.4 580.0,176.2"/>
