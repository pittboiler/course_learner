  <!-- minimum marker -->
  <circle cx="155" cy="218.3" r="4" fill="#c01c28"/>
  <line x1="155" y1="218.3" x2="155" y2="160" stroke="#c01c28" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="150" y="245" font-size="14" fill="#c01c28" text-anchor="middle">r&#8320;</text>
  <text x="163" y="233" font-size="13" fill="#c01c28">well minimum</text>

  <!-- bound-state energy level E < 0 (dashed) -->
  <line x1="150" y1="191.5" x2="420" y2="191.5" stroke="#333333" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="424" y="197" font-size="16" fill="#333333">E &lt; 0 (bound)</text>

  <!-- caption -->
  <text x="80" y="360" font-size="14" fill="#555555" font-style="italic">The repulsive centrifugal barrier (gray) plus the attractive well (blue) add to an effective potential (red) with a</text>
  <text x="80" y="376" font-size="14" fill="#555555" font-style="italic">finite-depth well: for &#8467; &gt; 0 the 1/r&#178; barrier walls the particle off from r = 0.</text>
</svg>
