<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="420" fill="#ffffff"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2b4a">Second order = repulsion: every level pushes E&#8345; away from itself</text>

  <!-- ================= PANEL A: generic level ================= -->
  <text x="175" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2b4a">A generic level</text>

  <!-- energy axis -->
  <line x1="55" y1="370" x2="55" y2="90" stroke="#555" stroke-width="1.5"/>
  <polygon points="55,82 51,94 59,94" fill="#555"/>
  <text x="45" y="98" text-anchor="end" font-size="14" fill="#555">E</text>

  <!-- neighbor above -->
  <line x1="80" y1="110" x2="270" y2="110" stroke="#1a2b4a" stroke-width="2.5"/>
  <text x="278" y="115" font-size="14" fill="#1a2b4a">E&#8345;&#8330;&#8321;&#8304;</text>

  <!-- central level -->
  <line x1="80" y1="230" x2="270" y2="230" stroke="#1a2b4a" stroke-width="3"/>
  <text x="278" y="235" font-size="14" font-weight="bold" fill="#1a2b4a">E&#8345;&#8304;</text>

  <!-- neighbor below -->
  <line x1="80" y1="350" x2="270" y2="350" stroke="#1a2b4a" stroke-width="2.5"/>
  <text x="278" y="355" font-size="14" fill="#1a2b4a">E&#8345;&#8331;&#8321;&#8304;</text>

  <!-- push DOWN (from level above) -->
  <line x1="150" y1="238" x2="150" y2="278" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="150,286 145,274 155,274" fill="#c0392b"/>
  <text x="140" y="272" text-anchor="end" font-size="12" fill="#c0392b">above pushes down</text>

  <!-- push UP (from level below) -->
  <line x1="150" y1="222" x2="150" y2="182" stroke="#2e6da4" stroke-width="2.5"/>
  <polygon points="150,174 145,186 155,186" fill="#2e6da4"/>
  <text x="140" y="192" text-anchor="end" font-size="12" fill="#2e6da4">below pushes up</text>

  <text x="175" y="400" text-anchor="middle" font-size="12.5" fill="#555">near neighbors (small gap) dominate the sum</text>

  <!-- divider -->
  <line x1="340" y1="80" x2="340" y2="405" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ================= PANEL B: ground state ================= -->
  <text x="500" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2b4a">The ground state</text>

  <!-- energy axis -->
  <line x1="385" y1="370" x2="385" y2="90" stroke="#555" stroke-width="1.5"/>
  <polygon points="385,82 381,94 389,94" fill="#555"/>
  <text x="375" y="98" text-anchor="end" font-size="14" fill="#555">E</text>

  <!-- excited levels, all above -->
  <line x1="410" y1="110" x2="600" y2="110" stroke="#1a2b4a" stroke-width="2"/>
  <text x="608" y="115" font-size="13" fill="#1a2b4a">E&#8323;&#8304;</text>
  <line x1="410" y1="160" x2="600" y2="160" stroke="#1a2b4a" stroke-width="2"/>
  <text x="608" y="165" font-size="13" fill="#1a2b4a">E&#8322;&#8304;</text>
  <line x1="410" y1="210" x2="600" y2="210" stroke="#1a2b4a" stroke-width="2"/>
  <text x="608" y="215" font-size="13" fill="#1a2b4a">E&#8321;&#8304;</text>

  <!-- ground level -->
  <line x1="410" y1="330" x2="600" y2="330" stroke="#1a2b4a" stroke-width="3"/>
  <text x="608" y="335" font-size="13" font-weight="bold" fill="#1a2b4a">E&#8320;&#8304;</text>

  <!-- three down arrows onto the ground level -->
  <line x1="450" y1="338" x2="450" y2="372" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="450,380 445,368 455,368" fill="#c0392b"/>
  <line x1="490" y1="338" x2="490" y2="372" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="490,380 485,368 495,368" fill="#c0392b"/>
  <line x1="530" y1="338" x2="530" y2="372" stroke="#c0392b" stroke-width="2.5"/>
  <polygon points="530,380 525,368 535,368" fill="#c0392b"/>

  <text x="500" y="400" text-anchor="middle" font-size="12.5" fill="#c0392b" font-weight="bold">nothing below &#8594; only pushed down &#8594; E&#8320;&#178; &lt; 0</text>
</svg>
