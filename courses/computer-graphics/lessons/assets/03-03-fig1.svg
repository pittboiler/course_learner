<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">A ray meets a sphere where |o + t d - c| = r: a quadratic in t</text>
  <circle cx="470.0" cy="215.0" r="105" fill="#4a90d9" stroke="#4a90d9" stroke-width="2" opacity="0.12"/>
  <circle cx="470.0" cy="215.0" r="105" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="470.0" cy="215.0" r="3.5" fill="#4a90d9"/>
  <text x="478.0" y="231.0" fill="#4a90d9">c</text>
  <line x1="470.0" y1="215.0" x2="470.0" y2="110.0" stroke="#4a90d9" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="476.0" y="162.5" fill="#4a90d9">r</text>
  <circle cx="60.0" cy="300.0" r="5" fill="#8a8a8a"/>
  <text x="54.0" y="322.0" fill="#8a8a8a">eye o</text>
  <line x1="60.0" y1="300.0" x2="208.7" y2="280.7" stroke="#8a8a8a" stroke-width="2.4"/>
  <polygon points="208.7,280.7 197.2,277.1 198.5,287.0" fill="#8a8a8a"/>
  <text x="139.2" y="310.4" fill="#8a8a8a" font-size="14">d</text>
  <line x1="208.7" y1="280.7" x2="374.7" y2="259.1" stroke="#8a8a8a" stroke-width="1.4"/>
  <line x1="374.7" y1="259.1" x2="573.4" y2="233.3" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="573.4" y1="233.3" x2="662.6" y2="221.7" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="2 4"/>
  <circle cx="374.7" cy="259.1" r="5" fill="#e0645c"/>
  <circle cx="573.4" cy="233.3" r="5" fill="#8a8a8a"/>
  <text x="388.7" y="285.1" fill="#e0645c" font-size="12.5">t1: first hit</text>
  <text x="581.4" y="255.3" fill="#8a8a8a" font-size="12.5">t2: exit</text>
  <line x1="374.7" y1="259.1" x2="311.2" y2="288.5" stroke="#e0645c" stroke-width="2"/>
  <polygon points="311.2,288.5 323.3,288.4 319.1,279.3" fill="#e0645c"/>
  <text x="303.2" y="306.5" fill="#e0645c" font-size="12.5" text-anchor="end">n = (p - c)/r</text>
  <circle cx="250.0" cy="70.0" r="7" fill="#e0645c"/>
  <text x="262.0" y="75.0" fill="#e0645c" font-size="12.5">light</text>
  <line x1="374.7" y1="259.1" x2="250.0" y2="70.0" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="300.4" y="164.5" fill="#e0645c" font-size="12.5" text-anchor="end">shadow ray</text>
  <text x="40.0" y="378.0" fill="#8a8a8a" font-size="12.5">discriminant &lt; 0: miss</text>
  <text x="230.0" y="378.0" fill="#8a8a8a" font-size="12.5">= 0: grazes</text>
  <text x="360.0" y="378.0" fill="#8a8a8a" font-size="12.5">&gt; 0: two roots, take the smallest t &gt; epsilon</text>
</svg>
