<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Half-edges: every edge is two directed half-edges, one per adjacent face</text>
  <circle cx="150.0" cy="330.0" r="5" fill="#8a8a8a"/>
  <circle cx="420.0" cy="330.0" r="5" fill="#8a8a8a"/>
  <circle cx="285.0" cy="110.0" r="5" fill="#8a8a8a"/>
  <circle cx="560.0" cy="130.0" r="5" fill="#8a8a8a"/>
  <text x="140.0" y="348.0" fill="#8a8a8a" text-anchor="end">v0</text>
  <text x="424.0" y="352.0" fill="#8a8a8a">v1</text>
  <text x="285.0" y="98.0" fill="#8a8a8a" text-anchor="middle">v2</text>
  <text x="570.0" y="124.0" fill="#8a8a8a">v3</text>
