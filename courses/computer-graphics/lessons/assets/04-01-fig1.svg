  <line x1="285.0" y1="110.0" x2="150.0" y2="330.0" stroke="#8a8a8a" stroke-width="1.2" opacity="0.6"/>
  <line x1="420.0" y1="330.0" x2="560.0" y2="130.0" stroke="#8a8a8a" stroke-width="1.2" opacity="0.6"/>
  <line x1="560.0" y1="130.0" x2="285.0" y2="110.0" stroke="#8a8a8a" stroke-width="1.2" opacity="0.6"/>
  <line x1="178.0" y1="321.0" x2="392.0" y2="321.0" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="392.0,321.0 382.1,316.5 382.1,325.5" fill="#4a90d9"/>
  <text x="285.0" y="318.0" fill="#4a90d9" font-size="12.5" text-anchor="middle">h0</text>
  <line x1="397.7" y1="310.8" x2="292.0" y2="138.6" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="292.0,138.6 293.3,149.4 301.0,144.7" fill="#4a90d9"/>
  <text x="318.0" y="250.0" fill="#4a90d9" font-size="12.5" text-anchor="end">h1 = next(h0)</text>
  <line x1="278.0" y1="138.6" x2="172.3" y2="310.8" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="172.3,310.8 181.3,304.8 173.7,300.1" fill="#4a90d9"/>
  <text x="205.0" y="215.0" fill="#4a90d9" font-size="12.5" text-anchor="end">h2</text>
  <line x1="307.3" y1="129.2" x2="413.0" y2="301.4" stroke="#e0645c" stroke-width="2"/>
  <polygon points="413.0,301.4 411.7,290.6 404.0,295.3" fill="#e0645c"/>
  <text x="395.0" y="268.0" fill="#e0645c" font-size="12.5">h3 = twin(h1)</text>
  <line x1="428.7" y1="301.9" x2="536.6" y2="147.8" stroke="#e0645c" stroke-width="2"/>
  <polygon points="536.6,147.8 527.2,153.3 534.6,158.5" fill="#e0645c"/>
  <text x="500.0" y="250.0" fill="#e0645c" font-size="12.5" text-anchor="middle">h4</text>
  <line x1="531.4" y1="136.9" x2="312.3" y2="121.0" stroke="#e0645c" stroke-width="2"/>
  <polygon points="312.3,121.0 321.8,126.2 322.5,117.2" fill="#e0645c"/>
  <text x="430.0" y="150.0" fill="#e0645c" font-size="12.5" text-anchor="middle">h5</text>
  <text x="245.0" y="290.0" fill="#4a90d9" text-anchor="middle">face A</text>
  <text x="470.0" y="205.0" fill="#e0645c" text-anchor="middle">face B</text>
  <text x="40.0" y="385.0" fill="#8a8a8a" font-size="12.5">each half-edge stores: origin vertex, twin, next, face</text>
  <text x="40.0" y="405.0" fill="#8a8a8a" font-size="12.5">one-ring of a vertex: repeat h = next(twin(h)) until back at the start</text>
