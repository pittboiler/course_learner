<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="380" fill="#ffffff"/>

  <!-- Left: lambda = (4,2,1) -->
  <text x="150" y="45" font-size="20" fill="#111" text-anchor="middle">Ferrers diagram of</text>
  <text x="150" y="72" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">&#955; = (4, 2, 1)</text>

  <!-- row 1: 4 -->
  <circle cx="70" cy="130" r="13" fill="#1a1a1a"/>
  <circle cx="115" cy="130" r="13" fill="#1a1a1a"/>
  <circle cx="160" cy="130" r="13" fill="#1a1a1a"/>
  <circle cx="205" cy="130" r="13" fill="#1a1a1a"/>
  <!-- row 2: 2 -->
  <circle cx="70" cy="175" r="13" fill="#1a1a1a"/>
  <circle cx="115" cy="175" r="13" fill="#1a1a1a"/>
  <!-- row 3: 1 -->
  <circle cx="70" cy="220" r="13" fill="#1a1a1a"/>

  <text x="150" y="290" font-size="15" fill="#555" text-anchor="middle">rows = parts   (4, then 2, then 1)</text>

  <!-- Arrow: reflect across diagonal -->
  <text x="340" y="150" font-size="15" fill="#111" text-anchor="middle">reflect</text>
  <text x="340" y="170" font-size="15" fill="#111" text-anchor="middle">across the</text>
  <text x="340" y="190" font-size="15" fill="#111" text-anchor="middle">diagonal</text>
  <line x1="295" y1="215" x2="385" y2="215" stroke="#111" stroke-width="2.5"/>
  <polygon points="385,215 373,209 373,221" fill="#111"/>
  <polygon points="295,215 307,209 307,221" fill="#111"/>

  <!-- Right: lambda' = (3,2,1,1) -->
  <text x="520" y="45" font-size="20" fill="#111" text-anchor="middle">Conjugate</text>
  <text x="520" y="72" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">&#955;&#8242; = (3, 2, 1, 1)</text>

  <!-- row 1: 3 -->
  <circle cx="450" cy="130" r="13" fill="#1a1a1a"/>
  <circle cx="495" cy="130" r="13" fill="#1a1a1a"/>
  <circle cx="540" cy="130" r="13" fill="#1a1a1a"/>
  <!-- row 2: 2 -->
  <circle cx="450" cy="175" r="13" fill="#1a1a1a"/>
  <circle cx="495" cy="175" r="13" fill="#1a1a1a"/>
  <!-- row 3: 1 -->
  <circle cx="450" cy="220" r="13" fill="#1a1a1a"/>
  <!-- row 4: 1 -->
  <circle cx="450" cy="265" r="13" fill="#1a1a1a"/>

  <text x="520" y="315" font-size="15" fill="#555" text-anchor="middle">new rows = old columns</text>

  <text x="340" y="360" font-size="14" fill="#777" text-anchor="middle">Both have 7 dots: conjugation is a bijection on partitions of n.</text>
</svg>
