<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="470" fill="#ffffff"/>

  <text x="320" y="34" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">The Boolean lattice B&#8323;: subsets of {1,2,3} under &#8838;</text>

  <!-- ================= edges (drawn first, under nodes) ================= -->
  <!-- default cover edges in gray -->
  <g stroke="#9a9a9a" stroke-width="2">
    <!-- from bottom to level 1 -->
    <line x1="320" y1="400" x2="320" y2="300"/>              <!-- empty - {2} -->
    <line x1="320" y1="400" x2="500" y2="300"/>              <!-- empty - {3} -->
    <!-- level 1 to level 2 -->
    <line x1="140" y1="290" x2="320" y2="185"/>              <!-- {1} - {1,3} -->
    <line x1="320" y1="290" x2="140" y2="185"/>              <!-- {2} - {1,2} -->
    <line x1="320" y1="290" x2="500" y2="185"/>              <!-- {2} - {2,3} -->
    <line x1="500" y1="290" x2="320" y2="185"/>              <!-- {3} - {1,3} -->
    <line x1="500" y1="290" x2="500" y2="185"/>              <!-- {3} - {2,3} -->
    <!-- level 2 to top -->
    <line x1="320" y1="175" x2="320" y2="80"/>               <!-- {1,3} - top -->
    <line x1="500" y1="175" x2="320" y2="80"/>               <!-- {2,3} - top -->
  </g>

  <!-- highlighted CHAIN edges (blue, thick): empty - {1} - {1,2} - {1,2,3} -->
  <g stroke="#1565c0" stroke-width="6" stroke-linecap="round">
    <line x1="320" y1="400" x2="140" y2="300"/>              <!-- empty - {1} -->
    <line x1="140" y1="290" x2="140" y2="185"/>              <!-- {1} - {1,2} -->
    <line x1="140" y1="175" x2="320" y2="80"/>               <!-- {1,2} - top -->
  </g>

  <!-- ================= antichain rings (amber, behind nodes): {1},{2},{3} ================= -->
  <g fill="none" stroke="#e08a00" stroke-width="4">
    <circle cx="140" cy="290" r="33"/>
    <circle cx="320" cy="290" r="33"/>
    <circle cx="500" cy="290" r="33"/>
  </g>

  <!-- ================= nodes ================= -->
  <!-- bottom: empty set (chain) -->
  <circle cx="320" cy="400" r="26" fill="#cfe3ff" stroke="#1565c0" stroke-width="2.5"/>
  <text x="320" y="407" font-size="20" fill="#111" text-anchor="middle">&#8709;</text>

  <!-- level 1 -->
  <circle cx="140" cy="290" r="26" fill="#cfe3ff" stroke="#1565c0" stroke-width="2.5"/>
  <text x="140" y="297" font-size="18" fill="#111" text-anchor="middle">1</text>
  <circle cx="320" cy="290" r="26" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="320" y="297" font-size="18" fill="#111" text-anchor="middle">2</text>
  <circle cx="500" cy="290" r="26" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="500" y="297" font-size="18" fill="#111" text-anchor="middle">3</text>

  <!-- level 2 -->
  <circle cx="140" cy="175" r="26" fill="#cfe3ff" stroke="#1565c0" stroke-width="2.5"/>
  <text x="140" y="182" font-size="18" fill="#111" text-anchor="middle">12</text>
  <circle cx="320" cy="175" r="26" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="320" y="182" font-size="18" fill="#111" text-anchor="middle">13</text>
  <circle cx="500" cy="175" r="26" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="500" y="182" font-size="18" fill="#111" text-anchor="middle">23</text>

  <!-- top: full set (chain) -->
  <circle cx="320" cy="65" r="27" fill="#cfe3ff" stroke="#1565c0" stroke-width="2.5"/>
  <text x="320" y="72" font-size="17" fill="#111" text-anchor="middle">123</text>

  <!-- ================= legend ================= -->
  <line x1="60" y1="430" x2="100" y2="430" stroke="#1565c0" stroke-width="6" stroke-linecap="round"/>
  <text x="110" y="435" font-size="15" fill="#111">chain &#8709; &#8834; {1} &#8834; {1,2} &#8834; {1,2,3}  (length 4)</text>
  <circle cx="80" cy="455" r="11" fill="none" stroke="#e08a00" stroke-width="4"/>
  <text x="110" y="460" font-size="15" fill="#111">antichain {1}, {2}, {3}  (width 3 = &#8579;(3,1), Sperner)</text>
</svg>
