<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="320" y="34" font-size="18" fill="#111" text-anchor="middle" font-weight="bold">Erdős–Szekeres, the case m = n = 2</text>
  <text x="320" y="58" font-size="14" fill="#555" text-anchor="middle">Sequence 3, 1, 4, 2, 5 — label each term (longest ↑ ending here, longest ↓ ending here)</text>

  <!-- Axes -->
  <line x1="60" y1="80" x2="60" y2="360" stroke="#111" stroke-width="1.5"/>
  <line x1="60" y1="360" x2="560" y2="360" stroke="#111" stroke-width="1.5"/>
  <text x="40" y="365" font-size="12" fill="#777" text-anchor="middle">value</text>
  <text x="300" y="392" font-size="12" fill="#777" text-anchor="middle">position in the sequence  →</text>

  <!-- Increasing chain 3 → 4 → 5 (positions 1,3,5): the forced length-3 run -->
  <polyline points="100,200 300,140 500,80" fill="none" stroke="#0a7a3f" stroke-width="3" stroke-dasharray="6 5"/>

  <!-- Points -->
  <!-- p1: pos1 val3 (1,1) -->
  <circle cx="100" cy="200" r="8" fill="#1a1a1a"/>
  <text x="100" y="182" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">(1,1)</text>
  <text x="100" y="378" font-size="12" fill="#777" text-anchor="middle">1</text>
  <!-- p2: pos2 val1 (1,2) -->
  <circle cx="200" cy="320" r="8" fill="#1a1a1a"/>
  <text x="200" y="345" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">(1,2)</text>
  <text x="200" y="378" font-size="12" fill="#777" text-anchor="middle">2</text>
  <!-- p3: pos3 val4 (2,1) -->
  <circle cx="300" cy="140" r="8" fill="#0a7a3f"/>
  <text x="300" y="122" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">(2,1)</text>
  <text x="300" y="378" font-size="12" fill="#777" text-anchor="middle">3</text>
  <!-- p4: pos4 val2 (2,2) -->
  <circle cx="400" cy="260" r="8" fill="#1a1a1a"/>
  <text x="400" y="285" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">(2,2)</text>
  <text x="400" y="378" font-size="12" fill="#777" text-anchor="middle">4</text>
  <!-- p5: pos5 val5 (3,1) -->
  <circle cx="500" cy="80" r="8" fill="#0a7a3f"/>
  <text x="500" y="72" font-size="14" fill="#c1121f" text-anchor="middle" font-weight="bold">(3,1)</text>
  <text x="500" y="378" font-size="12" fill="#777" text-anchor="middle">5</text>

  <!-- Green chain callout -->
  <text x="500" y="110" font-size="12.5" fill="#0a7a3f" text-anchor="middle">↑ 3–4–5</text>

  <!-- Bottom note -->
  <text x="320" y="418" font-size="13" fill="#111" text-anchor="middle">5 distinct labels, but only 2×2 = 4 boxes if both runs stayed ≤ 2 — so one coordinate must hit 3.</text>
</svg>
