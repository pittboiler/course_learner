<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="400" height="400" fill="#ffffff"/>

  <!-- Blue pentagram (the "star" chords): 1-3, 3-5, 5-2, 2-4, 4-1 -->
  <g stroke="#2244cc" stroke-width="3" fill="none">
    <line x1="200" y1="50"  x2="276" y2="285"/>
    <line x1="276" y1="285" x2="76"  y2="140"/>
    <line x1="76"  y1="140" x2="324" y2="140"/>
    <line x1="324" y1="140" x2="124" y2="285"/>
    <line x1="124" y1="285" x2="200" y2="50"/>
  </g>

  <!-- Red pentagon (the outer 5-cycle): 1-2, 2-3, 3-4, 4-5, 5-1 -->
  <g stroke="#cc2222" stroke-width="3.5" fill="none">
    <line x1="200" y1="50"  x2="324" y2="140"/>
    <line x1="324" y1="140" x2="276" y2="285"/>
    <line x1="276" y1="285" x2="124" y2="285"/>
    <line x1="124" y1="285" x2="76"  y2="140"/>
    <line x1="76"  y1="140" x2="200" y2="50"/>
  </g>

  <!-- Vertices -->
  <g fill="#1a1a1a">
    <circle cx="200" cy="50"  r="7"/>
    <circle cx="324" cy="140" r="7"/>
    <circle cx="276" cy="285" r="7"/>
    <circle cx="124" cy="285" r="7"/>
    <circle cx="76"  cy="140" r="7"/>
  </g>

  <!-- Vertex labels -->
  <g fill="#1a1a1a" font-size="18" font-weight="bold">
    <text x="200" y="34"  text-anchor="middle">1</text>
    <text x="344" y="140" text-anchor="middle">2</text>
    <text x="296" y="305" text-anchor="middle">3</text>
    <text x="104" y="305" text-anchor="middle">4</text>
    <text x="56"  y="140" text-anchor="middle">5</text>
  </g>

  <!-- Legend -->
  <g font-size="15" fill="#1a1a1a">
    <line x1="40" y1="360" x2="72" y2="360" stroke="#cc2222" stroke-width="3.5"/>
    <text x="80" y="365">red pentagon (5-cycle)</text>
    <line x1="40" y1="384" x2="72" y2="384" stroke="#2244cc" stroke-width="3"/>
    <text x="80" y="389">blue pentagram (5-cycle)</text>
  </g>
</svg>
