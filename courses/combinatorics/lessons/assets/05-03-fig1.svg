<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="340" fill="#ffffff"/>

  <text x="350" y="38" font-size="20" fill="#111" text-anchor="middle" font-weight="bold">Two tableaux of shape &#955; = (3, 2)</text>

  <!-- Left: Standard Young tableau -->
  <text x="136" y="82" font-size="17" fill="#111" text-anchor="middle">Standard (SYT)</text>
  <!-- row 1 -->
  <rect x="70"  y="110" width="44" height="44" fill="none" stroke="#111" stroke-width="2"/>
  <rect x="114" y="110" width="44" height="44" fill="none" stroke="#111" stroke-width="2"/>
  <rect x="158" y="110" width="44" height="44" fill="none" stroke="#111" stroke-width="2"/>
  <!-- row 2 -->
  <rect x="70"  y="154" width="44" height="44" fill="none" stroke="#111" stroke-width="2"/>
  <rect x="114" y="154" width="44" height="44" fill="none" stroke="#111" stroke-width="2"/>
  <text x="92"  y="140" font-size="22" fill="#111" text-anchor="middle">1</text>
  <text x="136" y="140" font-size="22" fill="#111" text-anchor="middle">2</text>
  <text x="180" y="140" font-size="22" fill="#111" text-anchor="middle">4</text>
  <text x="92"  y="184" font-size="22" fill="#111" text-anchor="middle">3</text>
  <text x="136" y="184" font-size="22" fill="#111" text-anchor="middle">5</text>
  <text x="136" y="232" font-size="14" fill="#555" text-anchor="middle">each of 1..5 once</text>
  <text x="136" y="252" font-size="14" fill="#555" text-anchor="middle">rows &#8593; strictly, cols &#8595; strictly</text>

  <!-- Right: Semistandard Young tableau -->
  <text x="466" y="82" font-size="17" fill="#111" text-anchor="middle">Semistandard (SSYT)</text>
  <!-- row 1 -->
  <rect x="400" y="110" width="44" height="44" fill="none" stroke="#111" stroke-width="2"/>
  <rect x="444" y="110" width="44" height="44" fill="none" stroke="#111" stroke-width="2"/>
  <rect x="488" y="110" width="44" height="44" fill="none" stroke="#111" stroke-width="2"/>
  <!-- row 2 -->
  <rect x="400" y="154" width="44" height="44" fill="none" stroke="#111" stroke-width="2"/>
  <rect x="444" y="154" width="44" height="44" fill="none" stroke="#111" stroke-width="2"/>
  <text x="422" y="140" font-size="22" fill="#111" text-anchor="middle">1</text>
  <text x="466" y="140" font-size="22" fill="#111" text-anchor="middle">1</text>
  <text x="510" y="140" font-size="22" fill="#111" text-anchor="middle">2</text>
  <text x="422" y="184" font-size="22" fill="#111" text-anchor="middle">2</text>
  <text x="466" y="184" font-size="22" fill="#111" text-anchor="middle">3</text>
  <text x="466" y="232" font-size="14" fill="#555" text-anchor="middle">repeats allowed</text>
  <text x="466" y="252" font-size="14" fill="#555" text-anchor="middle">rows &#8593; weakly, cols &#8595; strictly</text>

  <text x="350" y="300" font-size="15" fill="#111" text-anchor="middle">Weight of the SSYT: two 1's, two 2's, one 3  &#8594;  monomial  x&#8321;&#178; x&#8322;&#178; x&#8323;</text>
  <text x="350" y="324" font-size="14" fill="#777" text-anchor="middle">Summing these monomials over all SSYT of shape &#955; gives the Schur function s&#955;.</text>
</svg>
