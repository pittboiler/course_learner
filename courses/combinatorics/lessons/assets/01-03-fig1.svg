<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="420" fill="#ffffff"/>

  <!-- three overlapping circles -->
  <circle cx="215" cy="175" r="110" fill="#d94f4f" fill-opacity="0.16" stroke="#111111" stroke-width="2"/>
  <circle cx="345" cy="175" r="110" fill="#4f7fd9" fill-opacity="0.16" stroke="#111111" stroke-width="2"/>
  <circle cx="280" cy="290" r="110" fill="#4faf6a" fill-opacity="0.16" stroke="#111111" stroke-width="2"/>

  <!-- circle labels -->
  <text x="150" y="120" font-size="26" font-weight="bold" fill="#111111">A</text>
  <text x="392" y="120" font-size="26" font-weight="bold" fill="#111111">B</text>
  <text x="272" y="378" font-size="26" font-weight="bold" fill="#111111">C</text>

  <!-- singles: + -->
  <text x="168" y="185" font-size="30" fill="#111111">+</text>
  <text x="378" y="185" font-size="30" fill="#111111">+</text>
  <text x="272" y="330" font-size="30" fill="#111111">+</text>

  <!-- pairwise intersections: − -->
  <text x="273" y="150" font-size="30" fill="#111111">&#8722;</text>
  <text x="207" y="270" font-size="30" fill="#111111">&#8722;</text>
  <text x="333" y="270" font-size="30" fill="#111111">&#8722;</text>

  <!-- triple intersection: + -->
  <text x="271" y="228" font-size="30" font-weight="bold" fill="#111111">+</text>

  <!-- sign key -->
  <text x="46" y="402" font-size="15" fill="#111111">To count the union: add single-set terms (+), subtract pairwise overlaps (&#8722;), add the triple (+).</text>
</svg>
