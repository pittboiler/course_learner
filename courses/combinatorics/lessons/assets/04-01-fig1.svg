<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="430" fill="#ffffff"/>

  <text x="350" y="34" font-size="17" fill="#111" text-anchor="middle">One object, three encodings — all counted by the Catalan number</text>
  <text x="350" y="56" font-size="17" fill="#111" text-anchor="middle" font-weight="bold">C&#8323; = 5</text>

  <!-- ================= LEFT: lattice Dyck path ================= -->
  <text x="205" y="92" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">Lattice path, stays weakly below the diagonal</text>

  <!-- grid -->
  <g stroke="#cfcfcf" stroke-width="1">
    <line x1="100" y1="130" x2="310" y2="130"/>
    <line x1="100" y1="200" x2="310" y2="200"/>
    <line x1="100" y1="270" x2="310" y2="270"/>
    <line x1="100" y1="340" x2="310" y2="340"/>
    <line x1="100" y1="130" x2="100" y2="340"/>
    <line x1="170" y1="130" x2="170" y2="340"/>
    <line x1="240" y1="130" x2="240" y2="340"/>
    <line x1="310" y1="130" x2="310" y2="340"/>
  </g>

  <!-- diagonal y = x -->
  <line x1="100" y1="340" x2="310" y2="130" stroke="#888" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="322" y="128" font-size="12" fill="#888">y = x</text>

  <!-- lattice dots -->
  <g fill="#b0b0b0">
    <circle cx="100" cy="340" r="3"/><circle cx="170" cy="340" r="3"/><circle cx="240" cy="340" r="3"/><circle cx="310" cy="340" r="3"/>
    <circle cx="100" cy="270" r="3"/><circle cx="170" cy="270" r="3"/><circle cx="240" cy="270" r="3"/><circle cx="310" cy="270" r="3"/>
    <circle cx="100" cy="200" r="3"/><circle cx="170" cy="200" r="3"/><circle cx="240" cy="200" r="3"/><circle cx="310" cy="200" r="3"/>
    <circle cx="100" cy="130" r="3"/><circle cx="170" cy="130" r="3"/><circle cx="240" cy="130" r="3"/><circle cx="310" cy="130" r="3"/>
  </g>

  <!-- the path E E N E N N -->
  <polyline points="100,340 170,340 240,340 240,270 310,270 310,200 310,130"
            fill="none" stroke="#c0392b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="100" cy="340" r="5" fill="#c0392b"/>
  <circle cx="310" cy="130" r="5" fill="#c0392b"/>

  <!-- step labels: East = '(' , North = ')' -->
  <text x="135" y="360" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="bold">(</text>
  <text x="205" y="360" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="bold">(</text>
  <text x="258" y="309" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="bold">)</text>
  <text x="275" y="262" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="bold">(</text>
  <text x="328" y="240" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="bold">)</text>
  <text x="328" y="170" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="bold">)</text>

  <text x="205" y="392" font-size="13" fill="#555" text-anchor="middle">East = "(",  North = ")"</text>

  <!-- ================= RIGHT: mountain range ================= -->
  <text x="520" y="92" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">Same path as a mountain range</text>

  <!-- baseline -->
  <line x1="400" y1="340" x2="640" y2="340" stroke="#888" stroke-width="1.5"/>
  <text x="648" y="344" font-size="12" fill="#888">0</text>

  <!-- mountain U U D U D D -->
  <polyline points="400,340 440,300 480,260 520,300 560,260 600,300 640,340"
            fill="none" stroke="#1a5fb4" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#1a5fb4">
    <circle cx="400" cy="340" r="4"/><circle cx="440" cy="300" r="4"/><circle cx="480" cy="260" r="4"/>
    <circle cx="520" cy="300" r="4"/><circle cx="560" cy="260" r="4"/><circle cx="600" cy="300" r="4"/><circle cx="640" cy="340" r="4"/>
  </g>

  <!-- parentheses under each step -->
  <text x="420" y="368" font-size="17" fill="#1a5fb4" text-anchor="middle" font-weight="bold">(</text>
  <text x="460" y="368" font-size="17" fill="#1a5fb4" text-anchor="middle" font-weight="bold">(</text>
  <text x="500" y="368" font-size="17" fill="#1a5fb4" text-anchor="middle" font-weight="bold">)</text>
  <text x="540" y="368" font-size="17" fill="#1a5fb4" text-anchor="middle" font-weight="bold">(</text>
  <text x="580" y="368" font-size="17" fill="#1a5fb4" text-anchor="middle" font-weight="bold">)</text>
  <text x="620" y="368" font-size="17" fill="#1a5fb4" text-anchor="middle" font-weight="bold">)</text>

  <text x="520" y="392" font-size="13" fill="#555" text-anchor="middle">up = "(",  down = ")"</text>

  <!-- shared string -->
  <text x="350" y="420" font-size="15" fill="#111" text-anchor="middle">Balanced string:  <tspan font-weight="bold" fill="#111">( ( ) ( ) )</tspan>   &#8212; never more ")" than "(" reading left to right</text>
</svg>
