<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="470" fill="#ffffff"/>

  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Slutsky decomposition of a rise in the price of good 1</text>

  <!-- axes -->
  <line x1="80" y1="380" x2="600" y2="380" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="80" y1="380" x2="80" y2="70" stroke="#1a1a1a" stroke-width="1.6"/>
  <polygon points="600,380 590,375 590,385" fill="#1a1a1a"/>
  <polygon points="80,70 75,80 85,80" fill="#1a1a1a"/>
  <text x="560" y="368" font-size="14" fill="#1a1a1a">good 1  (x&#8321;)</text>
  <text x="92" y="82" font-size="14" fill="#1a1a1a">good 2  (x&#8322;)</text>

  <!-- indifference curves -->
  <path d="M 150 120 Q 205 300 560 350" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 130 200 Q 200 320 440 355" fill="none" stroke="#7a7a7a" stroke-width="2"/>
  <text x="470" y="343" font-size="13" fill="#1a1a1a">u = u&#772;</text>
  <text x="352" y="368" font-size="13" fill="#7a7a7a">u&#8321; &lt; u&#772;</text>

  <!-- budget lines -->
  <line x1="80" y1="180" x2="540" y2="380" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="80" y1="180" x2="365" y2="380" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="80" y1="128" x2="440" y2="380" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="486" y="372" font-size="13" fill="#1a1a1a">B&#8304;</text>
  <text x="330" y="373" font-size="13" fill="#1a1a1a">B&#185; (p&#8321;&#8593;)</text>
  <text x="398" y="352" font-size="13" fill="#c0392b">B (compensated)</text>

  <!-- projection verticals -->
  <line x1="280" y1="267" x2="280" y2="380" stroke="#1a1a1a" stroke-width="0.9" stroke-dasharray="3 3"/>
  <line x1="219" y1="225" x2="219" y2="380" stroke="#1a1a1a" stroke-width="0.9" stroke-dasharray="3 3"/>
  <line x1="205" y1="268" x2="205" y2="380" stroke="#1a1a1a" stroke-width="0.9" stroke-dasharray="3 3"/>

  <!-- optimum points -->
  <circle cx="280" cy="267" r="4.5" fill="#1a1a1a"/>
  <circle cx="219" cy="225" r="4.5" fill="#c0392b"/>
  <circle cx="205" cy="268" r="4.5" fill="#2c6fbb"/>
  <text x="288" y="262" font-size="13" font-weight="bold" fill="#1a1a1a">A  initial</text>
  <text x="150" y="216" font-size="13" font-weight="bold" fill="#c0392b">B</text>
  <text x="176" y="285" font-size="13" font-weight="bold" fill="#2c6fbb">C</text>

  <!-- substitution bracket (B to A along x-axis) -->
  <line x1="219" y1="396" x2="280" y2="396" stroke="#c0392b" stroke-width="1.4"/>
  <line x1="219" y1="392" x2="219" y2="400" stroke="#c0392b" stroke-width="1.4"/>
  <line x1="280" y1="392" x2="280" y2="400" stroke="#c0392b" stroke-width="1.4"/>
  <text x="300" y="401" font-size="12.5" fill="#c0392b">substitution effect  (A&#8594;B, along u&#772;)</text>

  <!-- income bracket (C to B) -->
  <line x1="205" y1="396" x2="219" y2="396" stroke="#2c6fbb" stroke-width="1.4"/>
  <line x1="205" y1="392" x2="205" y2="400" stroke="#2c6fbb" stroke-width="1.4"/>
  <line x1="219" y1="392" x2="219" y2="400" stroke="#2c6fbb" stroke-width="1.4"/>
  <text x="60" y="416" font-size="12.5" fill="#2c6fbb">income effect (B&#8594;C)</text>
  <line x1="150" y1="412" x2="210" y2="399" stroke="#2c6fbb" stroke-width="0.9"/>

  <!-- total bracket -->
  <line x1="205" y1="430" x2="280" y2="430" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="205" y1="426" x2="205" y2="434" stroke="#1a1a1a" stroke-width="1.4"/>
  <line x1="280" y1="426" x2="280" y2="434" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="300" y="435" font-size="12.5" fill="#1a1a1a">total effect on x&#8321; (Marshallian)</text>
</svg>
