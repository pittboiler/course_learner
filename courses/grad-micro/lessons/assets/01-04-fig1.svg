<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>

  <text x="380" y="30" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">The value function is the upper envelope of a family of curves</text>

  <!-- axes -->
  <line x1="80" y1="330" x2="720" y2="330" stroke="#555555" stroke-width="1.5"/>
  <line x1="80" y1="345" x2="80" y2="50" stroke="#555555" stroke-width="1.5"/>
  <text x="726" y="335" font-family="sans-serif" font-size="14" fill="#555555">&#952;</text>
  <text x="60" y="58" font-family="sans-serif" font-size="14" fill="#555555">value</text>

  <!-- family of straight lines f(x, theta) for FIXED x: each affine in theta, each tangent to V below -->
  <!-- x = 1: y = theta - 0.5, from theta=0.5 to 4 -->
  <line x1="157.5" y1="330" x2="700" y2="207.5" stroke="#94a3b8" stroke-width="1.8"/>
  <!-- x = 2: y = 2 theta - 2, from theta=1 to 4 -->
  <line x1="235" y1="330" x2="700" y2="120" stroke="#94a3b8" stroke-width="1.8"/>
  <!-- x = 3: y = 3 theta - 4.5, from theta=1.5 to 4 -->
  <line x1="312.5" y1="330" x2="700" y2="67.5" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="655" y="200" font-family="sans-serif" font-size="12" fill="#64748b">x fixed</text>
  <text x="705" y="118" font-family="sans-serif" font-size="12" fill="#64748b">f(x,&#952;)</text>

  <!-- the envelope V(theta) = theta^2/2 -->
  <polyline points="80,330 157.5,325.6 235,312.5 312.5,290.6 390,260 467.5,220.6 545,172.5 622.5,115.6 700,50" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <text x="612" y="88" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">V(&#952;)</text>

  <!-- highlight the tangency of the x=2 line: at theta=2, V=2 -> (390,260) -->
  <circle cx="390" cy="260" r="6" fill="#b91c1c"/>
  <line x1="390" y1="260" x2="390" y2="330" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="374" y="348" font-family="sans-serif" font-size="13" fill="#b91c1c">&#952;&#8320;</text>

  <!-- annotation box for the tangency -->
  <text x="405" y="256" font-family="sans-serif" font-size="13" fill="#b91c1c">optimal x here is x*(&#952;&#8320;)</text>
  <text x="405" y="274" font-family="sans-serif" font-size="12" fill="#166534">slope of V = slope of that line = &#8706;f/&#8706;&#952;</text>

  <!-- caption -->
  <text x="380" y="372" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333333">At each &#952;, V touches the curve for the optimal x and lies above all the rest &#8212; so dV/d&#952; is just that curve's own slope, &#8706;f/&#8706;&#952;.</text>
</svg>
