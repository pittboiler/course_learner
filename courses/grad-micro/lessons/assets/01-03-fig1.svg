<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#1a1a1a" stroke="none">

    <!-- ================= Panel A: interior tangency ================= -->
    <text x="60" y="34" font-size="16" font-weight="bold">Interior optimum</text>
    <text x="60" y="52" font-size="12" fill="#555">tangency, both goods &gt; 0</text>

    <!-- axes -->
    <line x1="60" y1="70" x2="60" y2="330" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="60" y1="330" x2="300" y2="330" stroke="#1a1a1a" stroke-width="2"/>
    <text x="300" y="352" font-size="13" text-anchor="middle">x₁</text>
    <text x="40" y="80" font-size="13" text-anchor="middle">x₂</text>

    <!-- budget line g(x)=b (binding) -->
    <line x1="70" y1="130" x2="285" y2="330" stroke="#c0392b" stroke-width="2.5"/>
    <text x="205" y="200" font-size="12" fill="#c0392b" transform="rotate(43 205 200)">g(x) = b  (binding)</text>

    <!-- indifference curves (convex to origin) -->
    <path d="M 92,308 C 118,258 138,234 158,222 C 198,212 232,206 262,203" fill="none" stroke="#2c6fbb" stroke-width="2"/>
    <path d="M 128,320 C 152,286 170,268 190,258 C 224,246 250,242 278,240" fill="none" stroke="#9db9d8" stroke-width="1.6"/>

    <!-- tangent point -->
    <circle cx="158" cy="222" r="5" fill="#1a1a1a"/>
    <text x="168" y="216" font-size="12">optimum x*</text>
    <text x="120" y="182" font-size="11" fill="#2c6fbb">indifference curves</text>

    <!-- ================= Panel B: corner solution ================= -->
    <text x="420" y="34" font-size="16" font-weight="bold">Corner solution</text>
    <text x="420" y="52" font-size="12" fill="#555">x₁ = 0 binds, λ₁ &gt; 0</text>

    <!-- axes -->
    <line x1="420" y1="70" x2="420" y2="330" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="420" y1="330" x2="660" y2="330" stroke="#1a1a1a" stroke-width="2"/>
    <text x="660" y="352" font-size="13" text-anchor="middle">x₁</text>
    <text x="400" y="80" font-size="13" text-anchor="middle">x₂</text>

    <!-- budget line -->
    <line x1="430" y1="130" x2="645" y2="330" stroke="#c0392b" stroke-width="2.5"/>
    <text x="565" y="200" font-size="12" fill="#c0392b" transform="rotate(43 565 200)">g(x) = b  (binding)</text>

    <!-- indifference curve touching the x₂ axis (steeper than budget line) -->
    <path d="M 430,140 C 486,162 548,205 618,282" fill="none" stroke="#2c6fbb" stroke-width="2"/>
    <path d="M 460,120 C 520,150 585,200 650,278" fill="none" stroke="#9db9d8" stroke-width="1.6"/>

    <!-- corner optimum on the axis -->
    <circle cx="430" cy="140" r="5" fill="#1a1a1a"/>
    <text x="440" y="132" font-size="12">optimum x*</text>
    <text x="470" y="308" font-size="11" fill="#555">pull wants x₁ &lt; 0,</text>
    <text x="470" y="323" font-size="11" fill="#555">so it stops at 0</text>

  </g>
</svg>
