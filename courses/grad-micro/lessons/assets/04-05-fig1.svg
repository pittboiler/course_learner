<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>

  <!-- ===================== PANEL A: Edgeworth box ===================== -->
  <text x="70" y="34" font-size="17" font-weight="bold" fill="#1a1a1a">The core in the Edgeworth box</text>
  <text x="70" y="52" font-size="12.5" fill="#555">arc of the contract curve between the two indifference curves through &#969;</text>

  <!-- box -->
  <rect x="70" y="70" width="320" height="280" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- origins -->
  <circle cx="70" cy="350" r="3" fill="#1a1a1a"/>
  <text x="52" y="368" font-size="13" fill="#1a1a1a">O_A</text>
  <circle cx="390" cy="70" r="3" fill="#1a1a1a"/>
  <text x="372" y="62" font-size="13" fill="#1a1a1a">O_B</text>

  <!-- contract curve (full), thin dashed -->
  <path d="M 70,350 Q 230,250 390,70" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="300" y="300" font-size="12.5" fill="#888">contract curve</text>

  <!-- indifference curves through omega, forming the lens -->
  <path d="M 150,320 Q 260,292 300,180" fill="none" stroke="#0f766e" stroke-width="1.8"/>
  <text x="304" y="205" font-size="13" fill="#0f766e">u_A</text>
  <path d="M 150,320 Q 158,208 300,180" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="120" y="222" font-size="13" fill="#7c3aed">u_B</text>

  <!-- endowment -->
  <circle cx="150" cy="320" r="4.5" fill="#b45309"/>
  <text x="132" y="340" font-size="14" fill="#b45309">&#969;</text>

  <!-- highlighted core arc of contract curve -->
  <path d="M 185,268 Q 235,230 294,171" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="185" cy="268" r="4" fill="#1d4ed8"/>
  <circle cx="294" cy="171" r="4" fill="#1d4ed8"/>
  <text x="205" y="250" font-size="13.5" font-weight="bold" fill="#1d4ed8">core</text>

  <!-- Walrasian allocation on the core, with price line through omega -->
  <path d="M 112,362 L 302,150" fill="none" stroke="#b45309" stroke-width="1.3" stroke-dasharray="3 3"/>
  <circle cx="235" cy="225" r="4.5" fill="#111"/>
  <text x="242" y="222" font-size="13" fill="#111">x*  (Walrasian)</text>

  <!-- ===================== PANEL B: replication shrinks the core ===================== -->
  <text x="470" y="34" font-size="17" font-weight="bold" fill="#1a1a1a">Replicate &#8594; core shrinks</text>
  <text x="470" y="52" font-size="12.5" fill="#555">r copies of each type; only x* survives</text>

  <!-- funnel guides -->
  <path d="M 480,120 L 600,300" fill="none" stroke="#ddd" stroke-width="1.2"/>
  <path d="M 720,120 L 600,300" fill="none" stroke="#ddd" stroke-width="1.2"/>

  <!-- r = 1 -->
  <line x1="480" y1="120" x2="720" y2="120" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  <line x1="480" y1="113" x2="480" y2="127" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="720" y1="113" x2="720" y2="127" stroke="#1d4ed8" stroke-width="2"/>
  <text x="726" y="124" font-size="13" fill="#1a1a1a">r = 1</text>

  <!-- r = 2 -->
  <line x1="530" y1="175" x2="670" y2="175" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  <line x1="530" y1="168" x2="530" y2="182" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="670" y1="168" x2="670" y2="182" stroke="#1d4ed8" stroke-width="2"/>
  <text x="676" y="179" font-size="13" fill="#1a1a1a">r = 2</text>

  <!-- r = 3 -->
  <line x1="565" y1="230" x2="635" y2="230" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  <text x="641" y="234" font-size="13" fill="#1a1a1a">r = 3</text>

  <!-- limit point -->
  <circle cx="600" cy="300" r="6" fill="#111"/>
  <text x="612" y="296" font-size="13.5" font-weight="bold" fill="#111">x*</text>
  <text x="470" y="330" font-size="13" fill="#555">r &#8594; &#8734;:  core = { Walrasian allocations }</text>

  <!-- downward arrow -->
  <path d="M 600,242 L 600,282" fill="none" stroke="#555" stroke-width="1.6"/>
  <path d="M 596,276 L 600,286 L 604,276 Z" fill="#555"/>
</svg>
