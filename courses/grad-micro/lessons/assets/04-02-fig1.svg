<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>

  <defs>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c53030"/>
    </marker>
  </defs>

  <text x="140" y="28" font-size="15" font-weight="bold" fill="#1a1a1a">The Edgeworth box: every point is a feasible allocation</text>

  <!-- the box -->
  <rect x="140" y="50" width="420" height="300" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- origins -->
  <circle cx="140" cy="350" r="3.5" fill="#1a1a1a"/>
  <circle cx="560" cy="50" r="3.5" fill="#1a1a1a"/>
  <text x="104" y="366" font-size="13" font-weight="bold" fill="#1a1a1a">O_A</text>
  <text x="566" y="46" font-size="13" font-weight="bold" fill="#1a1a1a">O_B</text>

  <!-- axis hints -->
  <text x="300" y="382" font-size="12" fill="#4a5568">good 1  (A measures →)</text>
  <text x="118" y="210" font-size="12" fill="#4a5568" transform="rotate(-90 118 210)">good 2  (A measures ↑)</text>
  <text x="300" y="44" font-size="12" fill="#4a5568">good 1  (← B measures)</text>

  <!-- contract curve (Pareto set): tangency locus O_A -> O_B -->
  <path d="M140,350 C 240,320 300,300 350,275 C 400,250 430,225 455,200 C 500,155 535,100 560,50"
        fill="none" stroke="#b7791f" stroke-width="2.6"/>
  <text x="300" y="150" font-size="12" fill="#b7791f">contract curve</text>
  <text x="300" y="166" font-size="12" fill="#b7791f">(MRS_A = MRS_B)</text>

  <!-- A's indifference curve through equilibrium (convex to O_A) -->
  <path d="M413,119 C 425,150 447,185 455,200 C 463,213 500,250 560,287"
        fill="none" stroke="#2b6cb0" stroke-width="2.2"/>
  <text x="470" y="132" font-size="12" fill="#2b6cb0">A's IC</text>

  <!-- B's indifference curve through equilibrium (convex to O_B) -->
  <path d="M392,144 C 420,170 448,188 455,200 C 463,213 490,290 507,348"
        fill="none" stroke="#2f855a" stroke-width="2.2"/>
  <text x="386" y="128" font-size="12" fill="#2f855a">B's IC</text>

  <!-- budget line through endowment, slope = -p1/p2 -->
  <line x1="350" y1="50" x2="560" y2="350" stroke="#c53030" stroke-width="2.2"/>
  <text x="336" y="66" font-size="12" fill="#c53030">budget line: slope = −p₁/p₂</text>

  <!-- endowment point (corner: A owns all of good 1) -->
  <circle cx="560" cy="350" r="4.5" fill="#1a1a1a"/>
  <text x="486" y="342" font-size="12" font-weight="bold" fill="#1a1a1a">ω  (endowment)</text>

  <!-- equilibrium allocation: both consumers' choices coincide, ICs tangent -->
  <circle cx="455" cy="200" r="5" fill="#c53030"/>
  <text x="462" y="196" font-size="12" font-weight="bold" fill="#c53030">x*  (equilibrium)</text>

  <!-- trade arrow from endowment to equilibrium -->
  <line x1="548" y1="338" x2="468" y2="212" stroke="#c53030" stroke-width="1.6"
        stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="500" y="285" font-size="11" fill="#c53030">trade</text>
</svg>
