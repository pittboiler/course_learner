<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>

  <!-- ===================== LEFT PANEL: equilibrium, CS and PS ===================== -->
  <text x="60" y="26" font-size="15" font-weight="bold" fill="#1a1a1a">Competitive equilibrium: CS + PS</text>

  <!-- axes -->
  <line x1="70" y1="40" x2="70" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="70" y1="300" x2="340" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <text x="46" y="52" font-size="13" fill="#1a1a1a">p</text>
  <text x="330" y="322" font-size="13" fill="#1a1a1a">q</text>

  <!-- consumer surplus (upper triangle) -->
  <polygon points="70,170 70,70 188,170" fill="#2b6cb0" opacity="0.16"/>
  <!-- producer surplus (lower triangle) -->
  <polygon points="70,170 70,250 188,170" fill="#2f855a" opacity="0.16"/>

  <!-- demand line (downward): choke at top-left to high-q bottom-right -->
  <line x1="70" y1="70" x2="320" y2="280" stroke="#2b6cb0" stroke-width="2.4"/>
  <!-- supply line (upward): intercept at left to high-q top-right -->
  <line x1="70" y1="250" x2="320" y2="80" stroke="#2f855a" stroke-width="2.4"/>

  <!-- equilibrium dashed guides -->
  <line x1="70" y1="170" x2="188" y2="170" stroke="#718096" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="188" y1="170" x2="188" y2="300" stroke="#718096" stroke-width="1.4" stroke-dasharray="4 4"/>
  <circle cx="188" cy="170" r="4.5" fill="#1a1a1a"/>

  <!-- labels -->
  <text x="118" y="120" font-size="12.5" fill="#2b6cb0">CS</text>
  <text x="112" y="222" font-size="12.5" fill="#2f855a">PS</text>
  <text x="46" y="174" font-size="12.5" fill="#1a1a1a">p*</text>
  <text x="182" y="316" font-size="12.5" fill="#1a1a1a">q*</text>
  <text x="292" y="290" font-size="12" fill="#2b6cb0">D</text>
  <text x="298" y="78" font-size="12" fill="#2f855a">S</text>

  <!-- ===================== RIGHT PANEL: a tax and the DWL wedge ===================== -->
  <text x="420" y="26" font-size="15" font-weight="bold" fill="#1a1a1a">A per-unit tax: the DWL triangle</text>

  <!-- axes -->
  <line x1="430" y1="40" x2="430" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="430" y1="300" x2="700" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <text x="406" y="52" font-size="13" fill="#1a1a1a">p</text>
  <text x="690" y="322" font-size="13" fill="#1a1a1a">q</text>

  <!-- deadweight-loss triangle: apex at equilibrium, base = tax wedge at q_t -->
  <polygon points="548,170 500,129 500,202" fill="#c53030" opacity="0.22"/>

  <!-- demand and supply -->
  <line x1="430" y1="70" x2="680" y2="280" stroke="#2b6cb0" stroke-width="2.4"/>
  <line x1="430" y1="250" x2="680" y2="80" stroke="#2f855a" stroke-width="2.4"/>

  <!-- untaxed equilibrium marker -->
  <circle cx="548" cy="170" r="4" fill="#1a1a1a"/>
  <line x1="548" y1="170" x2="548" y2="300" stroke="#718096" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="540" y="316" font-size="12" fill="#1a1a1a">q*</text>

  <!-- tax wedge at reduced quantity q_t -->
  <line x1="500" y1="129" x2="500" y2="202" stroke="#c53030" stroke-width="2.4"/>
  <line x1="430" y1="129" x2="500" y2="129" stroke="#718096" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="430" y1="202" x2="500" y2="202" stroke="#718096" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="500" y1="129" x2="500" y2="300" stroke="#718096" stroke-width="1.2" stroke-dasharray="4 4"/>

  <text x="404" y="133" font-size="12" fill="#1a1a1a">pᵈ</text>
  <text x="404" y="207" font-size="12" fill="#1a1a1a">pˢ</text>
  <text x="492" y="316" font-size="12" fill="#1a1a1a">qₜ</text>
  <text x="512" y="160" font-size="12" fill="#c53030">t</text>
  <text x="520" y="188" font-size="12" fill="#c53030">DWL</text>
  <text x="652" y="290" font-size="12" fill="#2b6cb0">D</text>
  <text x="658" y="78" font-size="12" fill="#2f855a">S</text>
</svg>
