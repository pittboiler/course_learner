<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>

  <text x="380" y="30" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">The supply curve is marginal cost, above the shutdown point</text>

  <!-- axes -->
  <line x1="90" y1="340" x2="710" y2="340" stroke="#555555" stroke-width="1.5"/>
  <line x1="90" y1="355" x2="90" y2="55" stroke="#555555" stroke-width="1.5"/>
  <text x="712" y="358" font-family="sans-serif" font-size="14" fill="#555555">quantity q</text>
  <text x="70" y="62" font-family="sans-serif" font-size="13" text-anchor="end" fill="#555555">price, cost</text>
  <text x="70" y="78" font-family="sans-serif" font-size="13" text-anchor="end" fill="#555555">(per unit)</text>

  <!-- MC, non-supply (falling) branch: gray -->
  <polyline points="130,215 165,250 200,272 225,271 250,260" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- AVC curve: green, U-shaped, min at S=(250,260) -->
  <polyline points="170,242 200,252 225,258 250,260 310,255 390,246 470,235 540,223" fill="none" stroke="#166534" stroke-width="2.2"/>
  <text x="545" y="220" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">AVC</text>

  <!-- MC, supply branch (rising, above AVC min): bold blue = supply curve -->
  <polyline points="250,260 300,222 360,172 430,120 500,80 555,60" fill="none" stroke="#1d4ed8" stroke-width="3.2"/>
  <text x="560" y="62" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">MC = supply</text>

  <!-- shutdown point S -->
  <circle cx="250" cy="260" r="5.5" fill="#166534"/>
  <line x1="90" y1="260" x2="250" y2="260" stroke="#166534" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="96" y="254" font-family="sans-serif" font-size="12" fill="#166534">p&#8347; = min AVC (shutdown)</text>
  <text x="150" y="300" font-family="sans-serif" font-size="12" fill="#166534">below p&#8347;: q = 0</text>

  <!-- price line at y=150 -->
  <line x1="90" y1="150" x2="390" y2="150" stroke="#b91c1c" stroke-width="2"/>
  <text x="96" y="144" font-family="sans-serif" font-size="13" fill="#b91c1c">price p</text>
  <!-- intersection A: p = MC -->
  <circle cx="390" cy="150" r="6" fill="#b91c1c"/>
  <text x="400" y="146" font-family="sans-serif" font-size="13" fill="#b91c1c">p = MC(q*)</text>
  <line x1="390" y1="150" x2="390" y2="340" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="382" y="358" font-family="sans-serif" font-size="13" fill="#b91c1c">q*</text>

  <!-- caption -->
  <text x="380" y="388" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333333">A price-taker sets q where p meets rising MC; if p dips below the AVC minimum, the best output is zero.</text>
</svg>
