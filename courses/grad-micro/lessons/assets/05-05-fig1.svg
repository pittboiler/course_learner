<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="780" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrowdash" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7a4ea3"/>
    </marker>
  </defs>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a2e">The Revelation Principle</text>
  <text x="390" y="52" text-anchor="middle" font-size="13" fill="#555">any mechanism + its equilibrium  ≡  a truthful direct mechanism</text>

  <!-- dashed grouping box (top path inner) -->
  <rect x="150" y="82" width="360" height="92" rx="8" fill="#f3edfa" stroke="#7a4ea3" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="330" y="76" text-anchor="middle" font-size="12.5" fill="#7a4ea3" font-style="italic">fold the equilibrium strategies into the rules</text>

  <!-- TOP PATH -->
  <rect x="24" y="104" width="96" height="56" rx="8" fill="#eef2fb" stroke="#1a1a2e" stroke-width="1.6"/>
  <text x="72" y="138" text-anchor="middle" font-size="15" fill="#1a1a2e">Types θ</text>

  <rect x="168" y="104" width="140" height="56" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="1.6"/>
  <text x="238" y="138" text-anchor="middle" font-size="15" fill="#1a1a2e">Strategies σ*(θ)</text>

  <rect x="352" y="104" width="150" height="56" rx="8" fill="#ffffff" stroke="#1a1a2e" stroke-width="1.6"/>
  <text x="427" y="138" text-anchor="middle" font-size="15" fill="#1a1a2e">Mechanism g(·)</text>

  <rect x="636" y="104" width="118" height="56" rx="8" fill="#eafaf0" stroke="#1a1a2e" stroke-width="1.6"/>
  <text x="695" y="138" text-anchor="middle" font-size="15" fill="#1a1a2e">Outcome</text>

  <line x1="120" y1="132" x2="164" y2="132" stroke="#1a1a2e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="308" y1="132" x2="348" y2="132" stroke="#1a1a2e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="502" y1="132" x2="632" y2="132" stroke="#1a1a2e" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- BOTTOM PATH -->
  <rect x="24" y="292" width="96" height="56" rx="8" fill="#eef2fb" stroke="#1a1a2e" stroke-width="1.6"/>
  <text x="72" y="326" text-anchor="middle" font-size="15" fill="#1a1a2e">Types θ</text>

  <rect x="156" y="286" width="346" height="68" rx="8" fill="#f3edfa" stroke="#7a4ea3" stroke-width="1.8"/>
  <text x="329" y="313" text-anchor="middle" font-size="15" fill="#1a1a2e" font-weight="bold">Truthful direct mechanism</text>
  <text x="329" y="335" text-anchor="middle" font-size="14" fill="#1a1a2e">report θ honestly  →  g(σ*(θ))</text>

  <rect x="636" y="292" width="118" height="56" rx="8" fill="#eafaf0" stroke="#1a1a2e" stroke-width="1.6"/>
  <text x="695" y="320" text-anchor="middle" font-size="15" fill="#1a1a2e">Same</text>
  <text x="695" y="338" text-anchor="middle" font-size="15" fill="#1a1a2e">outcome</text>

  <line x1="120" y1="320" x2="152" y2="320" stroke="#1a1a2e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="502" y1="320" x2="632" y2="320" stroke="#1a1a2e" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- connectors between paths -->
  <line x1="330" y1="174" x2="330" y2="282" stroke="#7a4ea3" stroke-width="1.8" marker-end="url(#arrowdash)"/>
  <text x="342" y="232" text-anchor="start" font-size="12.5" fill="#7a4ea3" font-style="italic">collapse to</text>

  <line x1="695" y1="160" x2="695" y2="288" stroke="#1a1a2e" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="708" y="228" text-anchor="middle" font-size="18" fill="#1a1a2e">=</text>
</svg>
