<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
  <defs>
    <marker id="ax" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#222222"/>
    </marker>
    <marker id="gr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <text x="24" y="26" fill="#8a8a8a" font-style="italic">The separating menu: L pulled down off the efficient point, H left efficient, high type's IC curve pinned to L.</text>

  <!-- axes -->
  <line x1="70" y1="300" x2="612" y2="300" stroke="#222222" stroke-width="1.6" marker-end="url(#ax)"/>
  <line x1="70" y1="300" x2="70" y2="42" stroke="#222222" stroke-width="1.6" marker-end="url(#ax)"/>
  <text x="600" y="322" fill="#222222" text-anchor="middle">quantity q</text>
  <text x="60" y="52" fill="#222222" text-anchor="end">payment t</text>

  <!-- low type indifference curve through origin: t = q - q^2/2  (IR binds, U=0) -->
  <path d="M70,300 Q118,262 205,244" fill="none" stroke="#2f6db0" stroke-width="2.4"/>
  <text x="212" y="243" fill="#2f6db0">low type — IR binds (U = 0)</text>

  <!-- high type indifference curve through L and H: t = 2q - q^2/2 - 1/2  (IC binds) -->
  <path d="M125,259 C182,182 252,140 290,135" fill="none" stroke="#c0392b" stroke-width="2.4"/>
  <text x="300" y="118" fill="#c0392b">high type — IC binds</text>

  <!-- efficient low quantity marker q = theta_L (x=180) -->
  <line x1="180" y1="300" x2="180" y2="246" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="180" y="316" fill="#8a8a8a" text-anchor="middle" font-size="12">q*_L</text>

  <!-- L bundle -->
  <line x1="125" y1="300" x2="125" y2="259" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="125" cy="259" r="4.5" fill="#2f6db0"/>
  <text x="112" y="255" fill="#2f6db0" text-anchor="end" font-weight="bold">L</text>
  <text x="125" y="316" fill="#8a8a8a" text-anchor="middle" font-size="12">q_L</text>

  <!-- distortion bracket between q_L and q*_L -->
  <line x1="125" y1="332" x2="180" y2="332" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="125" y1="328" x2="125" y2="336" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="180" y1="328" x2="180" y2="336" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="152" y="348" fill="#8a8a8a" text-anchor="middle" font-size="12" font-style="italic">distortion</text>

  <!-- H bundle -->
  <line x1="290" y1="300" x2="290" y2="135" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="290" cy="135" r="4.5" fill="#c0392b"/>
  <text x="300" y="140" fill="#c0392b" font-weight="bold">H</text>
  <text x="290" y="316" fill="#8a8a8a" text-anchor="middle" font-size="12">q_H = &#952;_H</text>
  <text x="336" y="160" fill="#8a8a8a" font-size="12" font-style="italic">no distortion at the top</text>

  <!-- single-crossing note at L -->
  <text x="150" y="284" fill="#8a8a8a" font-size="11" font-style="italic">curves cross once at L</text>
</svg>
