<svg viewBox="0 0 780 330" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="780" height="330" fill="#ffffff"/>

  <!-- ================= Panel A: isoquant map + MRTS ================= -->
  <text x="220" y="26" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Isoquant map (two inputs)</text>

  <!-- axes -->
  <line x1="70" y1="250" x2="390" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="70" y1="40" x2="70" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="390,250 380,245 380,255" fill="#8a8a8a"/>
  <polygon points="70,40 65,50 75,50" fill="#8a8a8a"/>
  <text x="384" y="270" fill="#8a8a8a">x₁</text>
  <text x="48" y="52" fill="#8a8a8a">x₂</text>

  <!-- inner isoquant q = q1 -->
  <path d="M 103 97 L 112 130 L 130 166 L 160 194 L 190 208 L 238 220 L 298 228 L 358 232"
        fill="none" stroke="#2a6fb0" stroke-width="2.5"/>
  <text x="360" y="245" fill="#2a6fb0" font-size="13">q = q₁</text>

  <!-- middle isoquant q = q2 -->
  <path d="M 121 53 L 134 92 L 148 121 L 190 166 L 238 190 L 298 206 L 358 215"
        fill="none" stroke="#2a6fb0" stroke-width="2.5"/>
  <text x="360" y="209" fill="#2a6fb0" font-size="13">q₂</text>

  <!-- outer isoquant q = q3 -->
  <path d="M 148 40 L 154 55 L 190 114 L 238 153 L 298 178 L 358 193"
        fill="none" stroke="#2a6fb0" stroke-width="2.5"/>
  <text x="360" y="187" fill="#2a6fb0" font-size="13">q₃</text>

  <!-- tangent line = slope -MRTS at a point on the middle isoquant -->
  <line x1="150" y1="138" x2="250" y2="208" stroke="#c0562e" stroke-width="2"/>
  <circle cx="190" cy="166" r="4.5" fill="#c0562e"/>
  <text x="196" y="150" fill="#c0562e" font-size="13">slope = −MRTS = −MP₁/MP₂</text>

  <text x="110" y="300" fill="#8a8a8a" font-size="12.5">higher q = farther from origin;</text>
  <text x="110" y="318" fill="#8a8a8a" font-size="12.5">convex-to-origin ⇒ MRTS falls as x₁ rises</text>

  <!-- ================= Panel B: single input, returns to scale ================= -->
  <text x="600" y="26" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">One input q = f(x)</text>

  <!-- axes -->
  <line x1="470" y1="250" x2="760" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="470" y1="40" x2="470" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="760,250 750,245 750,255" fill="#8a8a8a"/>
  <polygon points="470,40 465,50 475,50" fill="#8a8a8a"/>
  <text x="754" y="270" fill="#8a8a8a">x (input)</text>
  <text x="452" y="52" fill="#8a8a8a">q</text>

  <!-- inflection divider -->
  <line x1="600" y1="60" x2="600" y2="250" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="600" y="268" text-anchor="middle" fill="#8a8a8a" font-size="12">inflection</text>

  <!-- production curve: convex (increasing returns) then concave (decreasing returns) -->
  <path d="M 470 250 L 500 244 L 530 234 L 560 218 L 590 196 L 620 172 L 650 150 L 680 133 L 710 121 L 740 114"
        fill="none" stroke="#c0562e" stroke-width="3"/>

  <text x="500" y="120" fill="#111111" font-size="12.5">increasing</text>
  <text x="500" y="136" fill="#111111" font-size="12.5">returns (convex)</text>
  <text x="640" y="96" fill="#111111" font-size="12.5">decreasing</text>
  <text x="640" y="112" fill="#111111" font-size="12.5">returns (concave)</text>
</svg>
