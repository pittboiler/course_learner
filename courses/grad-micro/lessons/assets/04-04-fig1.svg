<svg viewBox="0 0 780 440" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="780" height="440" fill="#ffffff"/>

  <!-- ================= PANEL 1: First Welfare Theorem ================= -->
  <text x="220" y="48" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">1st Welfare Thm: equilibrium &#8658; efficient</text>

  <!-- box -->
  <rect x="70" y="90" width="300" height="270" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="56" y="376" font-family="sans-serif" font-size="12" fill="#111111">O_A</text>
  <text x="374" y="86" font-family="sans-serif" font-size="12" fill="#111111">O_B</text>
  <text x="150" y="379" font-family="sans-serif" font-size="11.5" fill="#555555">good 1 (A &#8594;)</text>
  <text x="24" y="230" font-family="sans-serif" font-size="11.5" fill="#555555" transform="rotate(-90 24 230)">good 2 (A &#8593;)</text>

  <!-- contract curve (Pareto set) -->
  <path d="M70,360 L145,321 L220,270 L270,225 L295,198 L340,139 L370,90" fill="none" stroke="#166534" stroke-width="2.5"/>
  <text x="92" y="300" font-family="sans-serif" font-size="11.5" fill="#166534">contract curve</text>

  <!-- indifference curves tangent at E -->
  <path d="M220,120 Q248,175 270,225 Q300,258 340,286" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
  <path d="M220,180 Q248,205 270,225 Q292,268 310,315" fill="none" stroke="#9ca3af" stroke-width="1.4"/>

  <!-- budget line through endowment, slope -p1/p2 = -3/2 -->
  <line x1="170" y1="90" x2="370" y2="360" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="118" y="112" font-family="sans-serif" font-size="11.5" fill="#1d4ed8">slope = &#8722;p1/p2</text>

  <!-- endowment omega = (1,0) at bottom-right corner -->
  <circle cx="370" cy="360" r="4.5" fill="#b45309"/>
  <text x="344" y="352" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">&#969;</text>

  <!-- equilibrium E -->
  <circle cx="270" cy="225" r="5.5" fill="#b91c1c"/>
  <text x="256" y="216" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c">E</text>

  <text x="220" y="410" font-family="sans-serif" font-size="11.5" text-anchor="middle" fill="#111111">at E: MRS_A = MRS_B = p1/p2 = 3/2</text>

  <!-- ================= PANEL 2: Second Welfare Theorem ================= -->
  <text x="600" y="48" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">2nd Welfare Thm: efficient &#8658; supportable</text>

  <!-- box -->
  <rect x="450" y="90" width="300" height="270" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="436" y="376" font-family="sans-serif" font-size="12" fill="#111111">O_A</text>
  <text x="754" y="86" font-family="sans-serif" font-size="12" fill="#111111">O_B</text>

  <!-- contract curve -->
  <path d="M450,360 L525,321 L600,270 L650,225 L675,198 L720,139 L750,90" fill="none" stroke="#166534" stroke-width="2.5"/>

  <!-- indifference curves tangent at P -->
  <path d="M570,219 Q588,248 600,270 Q622,292 645,307" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
  <path d="M555,229 Q580,252 600,270 Q615,295 630,315" fill="none" stroke="#9ca3af" stroke-width="1.4"/>

  <!-- supporting price line through P and redistributed endowment, slope -4/3 -->
  <line x1="450" y1="90" x2="675" y2="360" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="472" y="120" font-family="sans-serif" font-size="11.5" fill="#1d4ed8">supporting prices</text>

  <!-- original endowment omega -->
  <circle cx="750" cy="360" r="4.5" fill="#b45309" opacity="0.5"/>
  <text x="742" y="352" font-family="sans-serif" font-size="11.5" fill="#b45309" opacity="0.8">&#969;</text>

  <!-- transfer arrow along bottom edge, A gives up 1/4 of good 1 -->
  <line x1="746" y1="360" x2="684" y2="360" stroke="#111111" stroke-width="1.6"/>
  <polygon points="676,360 686,355 686,365" fill="#111111"/>

  <!-- redistributed endowment omega' on the supporting line -->
  <circle cx="675" cy="360" r="4.5" fill="#b45309"/>
  <text x="666" y="352" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309">&#969;'</text>

  <!-- target Pareto point P -->
  <circle cx="600" cy="270" r="5.5" fill="#7c3aed"/>
  <text x="586" y="262" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#7c3aed">P</text>

  <text x="600" y="410" font-family="sans-serif" font-size="11.5" text-anchor="middle" fill="#111111">lump-sum transfer &#969;&#8594;&#969;' decentralizes P (p1/p2 = 4/3)</text>
</svg>
