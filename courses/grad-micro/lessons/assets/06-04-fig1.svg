<svg viewBox="0 0 780 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="780" height="430" fill="#ffffff"/>

  <!-- =============== LEFT PANEL: public good, VERTICAL summation =============== -->
  <text x="60" y="26" font-size="14.5" font-weight="bold" fill="#1a1a1a">Public good: sum willingness-to-pay VERTICALLY</text>

  <!-- axes -->
  <line x1="70" y1="46" x2="70" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="70" y1="300" x2="352" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <text x="42" y="58" font-size="13" fill="#1a1a1a">p</text>
  <text x="342" y="322" font-size="13" fill="#1a1a1a">G</text>

  <!-- aggregate marginal benefit = MB1 + MB2 (vertical sum) -->
  <line x1="70" y1="60" x2="340" y2="300" stroke="#6b46c1" stroke-width="2.8"/>
  <!-- individual MB curves -->
  <line x1="70" y1="140" x2="340" y2="300" stroke="#2b6cb0" stroke-width="2.2"/>
  <line x1="70" y1="220" x2="340" y2="300" stroke="#2f855a" stroke-width="2.2"/>
  <!-- marginal cost -->
  <line x1="70" y1="220" x2="340" y2="220" stroke="#c05621" stroke-width="2.2"/>

  <!-- Samuelson optimum: aggregate MB meets MC at G*=8 (x=250) -->
  <line x1="250" y1="220" x2="250" y2="300" stroke="#718096" stroke-width="1.3" stroke-dasharray="4 4"/>
  <circle cx="250" cy="220" r="4.5" fill="#1a1a1a"/>
  <text x="238" y="316" font-size="12" fill="#1a1a1a">G*</text>

  <!-- vertical-sum illustration at G=4 (x=160) -->
  <line x1="160" y1="300" x2="160" y2="140" stroke="#718096" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="160" cy="247" r="3.2" fill="#2f855a"/>
  <circle cx="160" cy="193" r="3.2" fill="#2b6cb0"/>
  <circle cx="160" cy="140" r="3.6" fill="#6b46c1"/>
  <text x="168" y="278" font-size="11.5" fill="#2f855a">MB&#8322;</text>
  <text x="168" y="222" font-size="11.5" fill="#2b6cb0">MB&#8321;</text>
  <text x="168" y="152" font-size="11.5" fill="#6b46c1">&#931;MB</text>
  <text x="94" y="132" font-size="11" fill="#6b46c1" font-weight="bold">stack heights</text>

  <!-- curve labels -->
  <text x="300" y="256" font-size="12" fill="#2b6cb0">MB&#8321;</text>
  <text x="300" y="290" font-size="12" fill="#2f855a">MB&#8322;</text>
  <text x="250" y="76" font-size="12" fill="#6b46c1" font-weight="bold">&#931;MB</text>
  <text x="300" y="214" font-size="12" fill="#c05621">MC</text>

  <!-- =============== RIGHT PANEL: private good, HORIZONTAL summation =============== -->
  <text x="440" y="26" font-size="14.5" font-weight="bold" fill="#1a1a1a">Private good: sum quantities HORIZONTALLY</text>

  <!-- axes -->
  <line x1="450" y1="46" x2="450" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="450" y1="300" x2="740" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <text x="422" y="58" font-size="13" fill="#1a1a1a">p</text>
  <text x="730" y="322" font-size="13" fill="#1a1a1a">q</text>

  <!-- individual demands and market (horizontal sum, further right) -->
  <line x1="450" y1="110" x2="560" y2="290" stroke="#2b6cb0" stroke-width="2.2"/>
  <line x1="450" y1="110" x2="620" y2="290" stroke="#2f855a" stroke-width="2.2"/>
  <line x1="450" y1="110" x2="730" y2="290" stroke="#6b46c1" stroke-width="2.8"/>

  <!-- common price line -->
  <line x1="450" y1="200" x2="700" y2="200" stroke="#718096" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="418" y="204" font-size="12" fill="#1a1a1a">p&#772;</text>

  <!-- intersection dots at common price -->
  <circle cx="505" cy="200" r="3.2" fill="#2b6cb0"/>
  <circle cx="535" cy="200" r="3.2" fill="#2f855a"/>
  <circle cx="590" cy="200" r="3.6" fill="#6b46c1"/>
  <line x1="505" y1="200" x2="505" y2="300" stroke="#718096" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="535" y1="200" x2="535" y2="300" stroke="#718096" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="590" y1="200" x2="590" y2="300" stroke="#718096" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="496" y="314" font-size="11" fill="#2b6cb0">q&#8321;</text>
  <text x="527" y="314" font-size="11" fill="#2f855a">q&#8322;</text>
  <text x="568" y="314" font-size="11" fill="#6b46c1">q&#8321;+q&#8322;</text>

  <!-- curve labels -->
  <text x="556" y="286" font-size="12" fill="#2b6cb0">D&#8321;</text>
  <text x="616" y="286" font-size="12" fill="#2f855a">D&#8322;</text>
  <text x="712" y="284" font-size="12" fill="#6b46c1" font-weight="bold">D</text>

  <!-- caption -->
  <text x="60" y="356" font-size="12.5" fill="#1a1a1a">Everyone consumes the SAME G, so add heights (marginal values) at each G: &#931; MB(G) = MC picks G*.</text>
  <text x="60" y="378" font-size="12.5" fill="#1a1a1a">A private good is consumed in different amounts at ONE price, so add widths (quantities) instead.</text>
  <text x="60" y="404" font-size="11.5" fill="#c53030">Equating a single MB&#8321; to MC (the free-rider's rule) lands far left of G* &#8212; under-provision.</text>
</svg>
