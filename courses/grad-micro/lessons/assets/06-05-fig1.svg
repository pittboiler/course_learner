<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b03030"/>
    </marker>
  </defs>

  <!-- voters' rankings box -->
  <rect x="18" y="18" width="212" height="96" rx="6" fill="#f4f4f0" stroke="#1a1a1a" stroke-width="1"/>
  <text x="30" y="40" font-size="13" font-weight="bold" fill="#1a1a1a">Three voters' rankings</text>
  <text x="30" y="60" font-size="13" fill="#1a1a1a">Voter 1:  A &#8827; B &#8827; C</text>
  <text x="30" y="80" font-size="13" fill="#1a1a1a">Voter 2:  B &#8827; C &#8827; A</text>
  <text x="30" y="100" font-size="13" fill="#1a1a1a">Voter 3:  C &#8827; A &#8827; B</text>

  <!-- cycle arrows (winner -> loser) -->
  <line x1="376.4" y1="105" x2="538.6" y2="290" stroke="#b03030" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="525" y1="320" x2="175" y2="320" stroke="#b03030" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="161.4" y1="290" x2="323.6" y2="105" stroke="#b03030" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- nodes -->
  <circle cx="350" cy="75" r="40" fill="#dbe7f2" stroke="#1a1a1a" stroke-width="2"/>
  <text x="350" y="82" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">A</text>
  <circle cx="565" cy="320" r="40" fill="#dbe7f2" stroke="#1a1a1a" stroke-width="2"/>
  <text x="565" y="327" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">B</text>
  <circle cx="135" cy="320" r="40" fill="#dbe7f2" stroke="#1a1a1a" stroke-width="2"/>
  <text x="135" y="327" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">C</text>

  <!-- arrow labels -->
  <text x="490" y="188" font-size="13" font-weight="bold" text-anchor="middle" fill="#b03030">A beats B</text>
  <text x="490" y="204" font-size="12" text-anchor="middle" fill="#1a1a1a">2&#8211;1</text>

  <text x="350" y="352" font-size="13" font-weight="bold" text-anchor="middle" fill="#b03030">B beats C</text>
  <text x="350" y="368" font-size="12" text-anchor="middle" fill="#1a1a1a">2&#8211;1</text>

  <text x="210" y="188" font-size="13" font-weight="bold" text-anchor="middle" fill="#b03030">C beats A</text>
  <text x="210" y="204" font-size="12" text-anchor="middle" fill="#1a1a1a">2&#8211;1</text>

  <!-- caption -->
  <text x="470" y="60" font-size="15" font-weight="bold" fill="#1a1a1a">Majority rule cycles:</text>
  <text x="470" y="80" font-size="15" fill="#1a1a1a">A &#8827; B &#8827; C &#8827; A</text>
  <text x="470" y="100" font-size="13" fill="#555555">no Condorcet winner exists</text>
</svg>
