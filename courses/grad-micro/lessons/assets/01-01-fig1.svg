<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>

  <!-- ================= Panel 1: convex vs non-convex set ================= -->
  <text x="130" y="28" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Convex set</text>
  <!-- convex blob (ellipse) -->
  <ellipse cx="130" cy="150" rx="90" ry="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <!-- two points and segment inside -->
  <circle cx="75" cy="120" r="4" fill="#111111"/>
  <circle cx="185" cy="185" r="4" fill="#111111"/>
  <line x1="75" y1="120" x2="185" y2="185" stroke="#111111" stroke-width="2"/>
  <text x="66" y="112" font-family="sans-serif" font-size="13" fill="#111111">x</text>
  <text x="192" y="188" font-family="sans-serif" font-size="13" fill="#111111">y</text>
  <text x="130" y="258" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#166534">segment stays inside ✓</text>

  <!-- ================= Panel 2: non-convex set ================= -->
  <text x="380" y="28" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Non-convex set</text>
  <!-- crescent-ish region: outer blob minus a bite -->
  <path d="M 320 90 Q 470 90 470 155 Q 470 220 320 220 Q 400 155 320 90 Z" fill="#fde2e2" stroke="#b91c1c" stroke-width="2"/>
  <!-- two points whose segment leaves the region -->
  <circle cx="335" cy="105" r="4" fill="#111111"/>
  <circle cx="335" cy="205" r="4" fill="#111111"/>
  <line x1="335" y1="105" x2="335" y2="205" stroke="#111111" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="343" y="102" font-family="sans-serif" font-size="13" fill="#111111">x</text>
  <text x="343" y="212" font-family="sans-serif" font-size="13" fill="#111111">y</text>
  <text x="380" y="258" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#b91c1c">segment exits region ✗</text>

  <!-- ================= Panel 3: concave function + chord ================= -->
  <text x="630" y="28" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Concave function</text>
  <!-- axes -->
  <line x1="545" y1="220" x2="720" y2="220" stroke="#555555" stroke-width="1.5"/>
  <line x1="555" y1="230" x2="555" y2="70" stroke="#555555" stroke-width="1.5"/>
  <!-- concave curve (dome), sampled points along y = -(x-h)^2 -->
  <path d="M 560 200 Q 630 60 710 130" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <!-- two points on the curve and the chord below -->
  <circle cx="575" cy="171" r="4" fill="#111111"/>
  <circle cx="695" cy="118" r="4" fill="#111111"/>
  <line x1="575" y1="171" x2="695" y2="118" stroke="#b91c1c" stroke-width="2"/>
  <text x="600" y="205" font-family="sans-serif" font-size="12" fill="#b91c1c">chord</text>
  <text x="618" y="95" font-family="sans-serif" font-size="12" fill="#1d4ed8">graph</text>
  <text x="630" y="258" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#166534">chord lies below graph ✓</text>
</svg>
