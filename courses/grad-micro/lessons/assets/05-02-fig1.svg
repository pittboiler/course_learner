<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>

  <!-- axes -->
  <line x1="80" y1="360" x2="605" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="80" y1="360" x2="80" y2="30" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="605,360 595,355 595,365" fill="#1a1a1a"/>
  <polygon points="80,30 75,40 85,40" fill="#1a1a1a"/>
  <text x="510" y="385" font-size="14" fill="#1a1a1a">education e</text>
  <text x="92" y="44" font-size="14" fill="#1a1a1a">wage w</text>

  <!-- productivity wage lines -->
  <line x1="80" y1="232" x2="560" y2="232" stroke="#999999" stroke-width="1.4" stroke-dasharray="6 4"/>
  <line x1="80" y1="104" x2="560" y2="104" stroke="#999999" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="565" y="236" font-size="13" fill="#c0392b">w = y&#8348;</text>
  <text x="565" y="108" font-size="13" fill="#2e6da4">w = y&#8341;</text>

  <!-- low type indifference curve through L and H: slope 1/theta_L (steep) -->
  <line x1="80" y1="232" x2="440" y2="40" stroke="#c0392b" stroke-width="2.5"/>
  <text x="360" y="70" font-size="13" fill="#c0392b">low type IC (slope 1/&#952;&#8348;)</text>

  <!-- high type indifference curve through H: slope 1/theta_H (flatter) -->
  <line x1="80" y1="168" x2="560" y2="40" stroke="#2e6da4" stroke-width="2.5"/>
  <text x="470" y="66" font-size="13" fill="#2e6da4">high type IC (flatter)</text>

  <!-- e* dropline -->
  <line x1="320" y1="360" x2="320" y2="104" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="308" y="378" font-size="13" fill="#1a1a1a">e*</text>
  <text x="72" y="378" font-size="13" fill="#1a1a1a">0</text>

  <!-- separating bundles -->
  <circle cx="80" cy="232" r="5" fill="#c0392b"/>
  <circle cx="320" cy="104" r="5" fill="#2e6da4"/>
  <text x="90" y="250" font-size="13" fill="#c0392b">L: (0, y&#8348;)</text>
  <text x="330" y="122" font-size="13" fill="#2e6da4">H: (e*, y&#8341;)</text>

  <!-- single crossing callout -->
  <circle cx="320" cy="104" r="10" fill="none" stroke="#2e7d32" stroke-width="1.6"/>
  <line x1="320" y1="104" x2="250" y2="160" stroke="#2e7d32" stroke-width="1"/>
  <text x="150" y="176" font-size="12" fill="#2e7d32">single crossing:</text>
  <text x="150" y="192" font-size="12" fill="#2e7d32">low IC steeper here</text>

  <!-- binding IC annotation -->
  <text x="150" y="300" font-size="12" fill="#c0392b">low type indifferent between</text>
  <text x="150" y="316" font-size="12" fill="#c0392b">L and H along the red line</text>
</svg>
