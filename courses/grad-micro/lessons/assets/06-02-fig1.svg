<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="560" height="380" fill="#ffffff"/>

  <text x="80" y="30" font-size="15" font-weight="bold" fill="#1a1a1a">Cournot best-response functions cross at the Nash equilibrium</text>

  <!-- axes -->
  <line x1="80" y1="55" x2="80" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="80" y1="300" x2="370" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="80,49 76,59 84,59" fill="#1a1a1a"/>
  <polygon points="376,300 366,296 366,304" fill="#1a1a1a"/>
  <text x="60" y="70" font-size="14" fill="#1a1a1a">q&#8322;</text>
  <text x="356" y="322" font-size="14" fill="#1a1a1a">q&#8321;</text>

  <!-- R1: firm 1's best response, steep (slope -2): from (q1=M) to (q2=2M) -->
  <line x1="180" y1="300" x2="80" y2="100" stroke="#2b6cb0" stroke-width="2.6"/>
  <text x="98" y="112" font-size="12.5" fill="#2b6cb0">R&#8321;(q&#8322;): firm 1</text>

  <!-- R2: firm 2's best response, shallow (slope -1/2): from (q2=M) to (q1=2M) -->
  <line x1="80" y1="200" x2="280" y2="300" stroke="#2f855a" stroke-width="2.6"/>
  <text x="238" y="288" font-size="12.5" fill="#2f855a">R&#8322;(q&#8321;): firm 2</text>

  <!-- Nash equilibrium at (2M/3, 2M/3) = pixel (147,233) -->
  <line x1="80" y1="233" x2="147" y2="233" stroke="#718096" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="147" y1="233" x2="147" y2="300" stroke="#718096" stroke-width="1.3" stroke-dasharray="4 4"/>
  <circle cx="147" cy="233" r="5" fill="#c53030"/>
  <text x="156" y="228" font-size="12.5" font-weight="bold" fill="#c53030">Nash (Cournot)</text>
  <text x="30" y="238" font-size="12" fill="#1a1a1a">a&#8722;c</text>
  <text x="34" y="252" font-size="12" fill="#1a1a1a">3b</text>
  <line x1="30" y1="242" x2="52" y2="242" stroke="#1a1a1a" stroke-width="1"/>
  <text x="120" y="318" font-size="12" fill="#1a1a1a">a&#8722;c</text>
  <text x="124" y="332" font-size="12" fill="#1a1a1a">3b</text>
  <line x1="120" y1="322" x2="142" y2="322" stroke="#1a1a1a" stroke-width="1"/>

  <!-- collusion point (M/2, M/2) = pixel (130,250) -->
  <circle cx="130" cy="250" r="4" fill="#1a1a1a"/>
  <text x="138" y="268" font-size="11.5" fill="#4a5568">collusion (less output)</text>

  <!-- competitive symmetric point (M, M) = pixel (180,200) -->
  <circle cx="180" cy="200" r="4" fill="#1a1a1a"/>
  <text x="188" y="196" font-size="11.5" fill="#4a5568">competition (p = c)</text>
</svg>
