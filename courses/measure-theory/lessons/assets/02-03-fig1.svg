<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="620" height="260" fill="#ffffff"/>

  <!-- shaded blocks: positive above the axis (blue), negative below (red) -->
  <!-- x maps [0,4] -> [60,560] (125 px/unit); y value 0 at 120, 30 px/unit -->
  <!-- [0,1): value +2  -> top at 60 -->
  <rect x="60"  y="60"  width="125" height="60"  fill="#bcd7f2" stroke="#111111" stroke-width="1.5"/>
  <!-- [3,4]: value +1 -> top at 90 -->
  <rect x="435" y="90"  width="125" height="30"  fill="#bcd7f2" stroke="#111111" stroke-width="1.5"/>
  <!-- [1,3): value -3 -> bottom at 210 -->
  <rect x="185" y="120" width="250" height="90"  fill="#f3c0c0" stroke="#111111" stroke-width="1.5"/>

  <!-- axes -->
  <line x1="60" y1="120" x2="575" y2="120" stroke="#111111" stroke-width="2"/>
  <line x1="60" y1="30"  x2="60"  y2="230" stroke="#111111" stroke-width="2"/>

  <!-- x ticks -->
  <line x1="185" y1="116" x2="185" y2="124" stroke="#111111" stroke-width="1.5"/>
  <line x1="310" y1="116" x2="310" y2="124" stroke="#111111" stroke-width="1.5"/>
  <line x1="435" y1="116" x2="435" y2="124" stroke="#111111" stroke-width="1.5"/>
  <line x1="560" y1="116" x2="560" y2="124" stroke="#111111" stroke-width="1.5"/>
  <text x="60"  y="140" fill="#111111" font-size="13" text-anchor="middle">0</text>
  <text x="185" y="140" fill="#111111" font-size="13" text-anchor="middle">1</text>
  <text x="310" y="140" fill="#111111" font-size="13" text-anchor="middle">2</text>
  <text x="435" y="140" fill="#111111" font-size="13" text-anchor="middle">3</text>
  <text x="560" y="140" fill="#111111" font-size="13" text-anchor="middle">4</text>

  <!-- value labels -->
  <text x="122" y="52"  fill="#1e5fa8" font-size="14" text-anchor="middle" font-weight="bold">+2</text>
  <text x="497" y="82"  fill="#1e5fa8" font-size="14" text-anchor="middle" font-weight="bold">+1</text>
  <text x="310" y="200" fill="#b23030" font-size="14" text-anchor="middle" font-weight="bold">-3</text>

  <!-- area annotations -->
  <text x="122" y="90"  fill="#111111" font-size="12" text-anchor="middle">area 2</text>
  <text x="497" y="108" fill="#111111" font-size="12" text-anchor="middle">area 1</text>
  <text x="310" y="180" fill="#111111" font-size="12" text-anchor="middle">area 6</text>

  <!-- totals -->
  <text x="595" y="60"  fill="#1e5fa8" font-size="14" text-anchor="end">∫ f⁺ = 3</text>
  <text x="595" y="230" fill="#b23030" font-size="14" text-anchor="end">∫ f⁻ = 6</text>
  <text x="595" y="245" fill="#111111" font-size="14" text-anchor="end" font-weight="bold">∫ f = 3 − 6 = −3</text>
</svg>
