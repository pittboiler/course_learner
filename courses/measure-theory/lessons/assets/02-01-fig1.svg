<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="480" height="300" fill="#ffffff"/>

  <!-- axes -->
  <line x1="60" y1="60" x2="60" y2="252" stroke="#111111" stroke-width="1.5"/>
  <line x1="50" y1="240" x2="452" y2="240" stroke="#111111" stroke-width="1.5"/>
  <text x="456" y="244" font-size="13" fill="#111111">x</text>

  <!-- threshold line y = a -->
  <line x1="60" y1="150" x2="440" y2="150" stroke="#1f6fb2" stroke-width="1.5" stroke-dasharray="1 0"/>
  <text x="20" y="154" font-size="13" fill="#1f6fb2">y = a</text>

  <!-- dashed drops at crossings -->
  <g stroke="#999999" stroke-width="1" stroke-dasharray="4 3">
    <line x1="100" y1="150" x2="100" y2="240"/>
    <line x1="180" y1="150" x2="180" y2="240"/>
    <line x1="300" y1="150" x2="300" y2="240"/>
    <line x1="388" y1="150" x2="388" y2="240"/>
  </g>

  <!-- superlevel set on the x-axis: {f > a} -->
  <line x1="100" y1="240" x2="180" y2="240" stroke="#c0392b" stroke-width="5"/>
  <line x1="300" y1="240" x2="388" y2="240" stroke="#c0392b" stroke-width="5"/>
  <text x="112" y="262" font-size="12" fill="#c0392b">{ f &gt; a }</text>
  <text x="316" y="262" font-size="12" fill="#c0392b">{ f &gt; a }</text>

  <!-- the graph of f -->
  <polyline fill="none" stroke="#111111" stroke-width="2.5"
    points="60,230 80,195 100,150 120,110 140,92 160,112 180,150 200,190 220,208 240,214 260,204 280,174 300,150 320,110 340,80 360,96 380,136 400,172 420,206 440,226"/>
  <text x="346" y="70" font-size="13" fill="#111111">y = f(x)</text>

  <!-- crossing dots -->
  <g fill="#1f6fb2">
    <circle cx="100" cy="150" r="3.5"/>
    <circle cx="180" cy="150" r="3.5"/>
    <circle cx="300" cy="150" r="3.5"/>
    <circle cx="388" cy="150" r="3.5"/>
  </g>

  <text x="70" y="285" font-size="11" fill="#555555">A superlevel set can have many pieces — so measurability must survive countable unions.</text>
</svg>
