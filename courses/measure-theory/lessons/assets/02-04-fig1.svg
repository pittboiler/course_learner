<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="460" height="300" fill="#ffffff"/>

  <!-- title -->
  <text x="230" y="24" text-anchor="middle" font-size="15" fill="#111">The moving bump  f_n = n·1_[0, 1/n]</text>

  <!-- axes -->
  <line x1="60" y1="250" x2="300" y2="250" stroke="#111" stroke-width="1.5"/>
  <line x1="60" y1="250" x2="60" y2="60" stroke="#111" stroke-width="1.5"/>
  <text x="305" y="254" font-size="12" fill="#111">x</text>

  <!-- x ticks -->
  <line x1="115" y1="250" x2="115" y2="255" stroke="#111" stroke-width="1"/>
  <text x="115" y="268" text-anchor="middle" font-size="11" fill="#111">1/4</text>
  <line x1="170" y1="250" x2="170" y2="255" stroke="#111" stroke-width="1"/>
  <text x="170" y="268" text-anchor="middle" font-size="11" fill="#111">1/2</text>
  <line x1="280" y1="250" x2="280" y2="255" stroke="#111" stroke-width="1"/>
  <text x="280" y="268" text-anchor="middle" font-size="11" fill="#111">1</text>
  <text x="60" y="268" text-anchor="middle" font-size="11" fill="#111">0</text>

  <!-- n=1 bump: [0,1] height 1 (40px) -->
  <rect x="60" y="210" width="220" height="40" fill="#7fb3d5" fill-opacity="0.35" stroke="#21618c" stroke-width="1.5"/>
  <text x="238" y="204" font-size="11" fill="#21618c">n=1, area 1</text>

  <!-- n=2 bump: [0,1/2] height 2 (80px) -->
  <rect x="60" y="170" width="110" height="80" fill="#7dcea0" fill-opacity="0.4" stroke="#1e8449" stroke-width="1.5"/>
  <text x="128" y="164" font-size="11" fill="#1e8449">n=2, area 1</text>

  <!-- n=4 bump: [0,1/4] height 4 (160px) -->
  <rect x="60" y="90" width="55" height="160" fill="#e59866" fill-opacity="0.45" stroke="#ba4a00" stroke-width="1.5"/>
  <text x="120" y="98" font-size="11" fill="#ba4a00">n=4, area 1</text>

  <!-- caption -->
  <text x="230" y="290" text-anchor="middle" font-size="12" fill="#111">taller &amp; narrower · area always 1 · pointwise limit ≡ 0 for x&gt;0</text>
</svg>
