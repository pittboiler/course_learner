<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="320" fill="#ffffff"/>

  <!-- ===================== LEFT PANEL: the cover ===================== -->
  <text x="30" y="34" font-size="16" font-weight="bold" fill="#111">An outer-measure cover</text>
  <text x="30" y="54" font-size="12" fill="#444">Any set E; cover it by countably many intervals.</text>

  <!-- number line -->
  <line x1="24" y1="118" x2="300" y2="118" stroke="#111" stroke-width="1.5"/>
  <polygon points="300,118 292,114 292,122" fill="#111"/>

  <!-- the set E: two blobs sitting on the line -->
  <ellipse cx="105" cy="118" rx="46" ry="23" fill="#cfe3f5" stroke="#111" stroke-width="1.5"/>
  <ellipse cx="220" cy="118" rx="34" ry="20" fill="#cfe3f5" stroke="#111" stroke-width="1.5"/>
  <text x="105" y="123" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">E</text>
  <text x="220" y="123" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">E</text>

  <!-- covering intervals I1, I2, I3 (overlap, spill past E) -->
  <rect x="48"  y="160" width="104" height="16" rx="4" fill="#bfe3c2" stroke="#111" stroke-width="1.3"/>
  <rect x="128" y="184" width="86"  height="16" rx="4" fill="#bfe3c2" stroke="#111" stroke-width="1.3"/>
  <rect x="188" y="160" width="84"  height="16" rx="4" fill="#bfe3c2" stroke="#111" stroke-width="1.3"/>
  <text x="100" y="172" font-size="12" fill="#111" text-anchor="middle">I&#8321;</text>
  <text x="171" y="196" font-size="12" fill="#111" text-anchor="middle">I&#8322;</text>
  <text x="230" y="172" font-size="12" fill="#111" text-anchor="middle">I&#8323;</text>

  <text x="30" y="238" font-size="14" fill="#111">m*(E) = inf &#931;&#8342; &#8467;(I&#8342;)</text>
  <text x="30" y="258" font-size="12" fill="#444">over all countable interval covers of E.</text>

  <!-- divider -->
  <line x1="318" y1="24" x2="318" y2="296" stroke="#cccccc" stroke-width="1"/>

  <!-- ===================== RIGHT PANEL: the split ===================== -->
  <text x="338" y="34" font-size="16" font-weight="bold" fill="#111">The Carath&#233;odory split</text>
  <text x="338" y="54" font-size="12" fill="#444">E must cut every test set A additively.</text>

  <clipPath id="clipA">
    <rect x="352" y="86" width="214" height="126" rx="20"/>
  </clipPath>

  <!-- A (blue); the part left uncovered by E is A \ E -->
  <rect x="352" y="86" width="214" height="126" rx="20" fill="#cfe3f5" stroke="#111" stroke-width="1.6"/>

  <!-- A &#8745; E : orange = E clipped to A -->
  <circle cx="556" cy="152" r="88" fill="#f6c98a" clip-path="url(#clipA)"/>

  <!-- boundary of E (extends beyond A) -->
  <circle cx="556" cy="152" r="88" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="5 4"/>

  <!-- re-stroke A outline on top -->
  <rect x="352" y="86" width="214" height="126" rx="20" fill="none" stroke="#111" stroke-width="1.6"/>

  <text x="372" y="106" font-size="15" font-weight="bold" fill="#111">A</text>
  <text x="418" y="156" font-size="13" fill="#111" text-anchor="middle">A &#8726; E</text>
  <text x="524" y="156" font-size="13" fill="#111" text-anchor="middle">A &#8745; E</text>
  <text x="612" y="120" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">E</text>

  <text x="338" y="248" font-size="14" fill="#111">m*(A) = m*(A&#8745;E) + m*(A&#8726;E)</text>
  <text x="338" y="268" font-size="12" fill="#444">required for every A &#8594; E is measurable.</text>
</svg>
