<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="480" height="340" fill="#ffffff"/>

  <!-- shaded regions -->
  <path d="M60,300 L300,300 L300,155 C250,215 170,300 60,300 Z" fill="#cfe3f7"/>
  <path d="M60,300 C170,300 250,215 300,155 L60,155 L60,300 Z" fill="#fbe0c3"/>

  <!-- guide lines -->
  <line x1="300" y1="300" x2="300" y2="155" stroke="#111111" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="60" y1="155" x2="300" y2="155" stroke="#111111" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- curve y = x^(p-1) -->
  <path d="M60,300 C170,300 250,215 300,155 C335,118 375,88 420,60" fill="none" stroke="#111111" stroke-width="2.5"/>

  <!-- axes -->
  <line x1="60" y1="300" x2="445" y2="300" stroke="#111111" stroke-width="2"/>
  <line x1="60" y1="300" x2="60" y2="40" stroke="#111111" stroke-width="2"/>

  <!-- corner point (a,b) on the curve -->
  <circle cx="300" cy="155" r="4" fill="#111111"/>

  <!-- labels -->
  <text x="300" y="320" font-size="17" fill="#111111" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">a</text>
  <text x="45" y="160" font-size="17" fill="#111111" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">b</text>
  <text x="452" y="305" font-size="16" fill="#111111" font-family="Helvetica, Arial, sans-serif">x</text>
  <text x="50" y="38" font-size="16" fill="#111111" font-family="Helvetica, Arial, sans-serif">y</text>

  <text x="205" y="272" font-size="17" fill="#111111" font-family="Helvetica, Arial, sans-serif">a<tspan dy="-7" font-size="12">p</tspan><tspan dy="7">/p</tspan></text>
  <text x="112" y="212" font-size="17" fill="#111111" font-family="Helvetica, Arial, sans-serif">b<tspan dy="-7" font-size="12">q</tspan><tspan dy="7">/q</tspan></text>

  <text x="352" y="92" font-size="15" fill="#111111" font-family="Helvetica, Arial, sans-serif">y = x<tspan dy="-6" font-size="11">p-1</tspan></text>

  <text x="252" y="332" font-size="13" fill="#111111" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-style="italic">rectangle ab is covered by the two areas</text>
</svg>
