<svg viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="430" fill="#ffffff"/>

  <!-- ===================== PANEL A ===================== -->
  <text x="350" y="26" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">Step 1 — split [0,1] into Q-cosets, pick one representative per coset  &#8658;  Vitali set V</text>

  <!-- coset rows: baselines over [0,1] mapped x = 280 + 180 t -->
  <!-- row a (red) y=72 -->
  <text x="272" y="76" text-anchor="end" font-size="11" fill="#111">coset a</text>
  <line x1="280" y1="72" x2="460" y2="72" stroke="#cccccc" stroke-width="1"/>
  <circle cx="289" cy="72" r="3" fill="#d1495b"/>
  <circle cx="355.6" cy="72" r="3" fill="#d1495b"/>
  <circle cx="393.4" cy="72" r="3" fill="#d1495b"/>
  <circle cx="438.4" cy="72" r="3" fill="#d1495b"/>
  <circle cx="312.4" cy="72" r="3" fill="#d1495b"/>
  <circle cx="312.4" cy="72" r="6.5" fill="none" stroke="#111" stroke-width="1.5"/>

  <!-- row b (blue) y=100 -->
  <text x="272" y="104" text-anchor="end" font-size="11" fill="#111">coset b</text>
  <line x1="280" y1="100" x2="460" y2="100" stroke="#cccccc" stroke-width="1"/>
  <circle cx="298" cy="100" r="3" fill="#2e6f95"/>
  <circle cx="339.4" cy="100" r="3" fill="#2e6f95"/>
  <circle cx="409.6" cy="100" r="3" fill="#2e6f95"/>
  <circle cx="451" cy="100" r="3" fill="#2e6f95"/>
  <circle cx="379" cy="100" r="3" fill="#2e6f95"/>
  <circle cx="379" cy="100" r="6.5" fill="none" stroke="#111" stroke-width="1.5"/>

  <!-- row c (green) y=128 -->
  <text x="272" y="132" text-anchor="end" font-size="11" fill="#111">coset c</text>
  <line x1="280" y1="128" x2="460" y2="128" stroke="#cccccc" stroke-width="1"/>
  <circle cx="283.6" cy="128" r="3" fill="#2a9d5c"/>
  <circle cx="325" cy="128" r="3" fill="#2a9d5c"/>
  <circle cx="366.4" cy="128" r="3" fill="#2a9d5c"/>
  <circle cx="398.8" cy="128" r="3" fill="#2a9d5c"/>
  <circle cx="424" cy="128" r="3" fill="#2a9d5c"/>
  <circle cx="424" cy="128" r="6.5" fill="none" stroke="#111" stroke-width="1.5"/>

  <!-- 0 and 1 ticks under panel A -->
  <line x1="280" y1="66" x2="280" y2="140" stroke="#999999" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="460" y1="66" x2="460" y2="140" stroke="#999999" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="280" y="154" text-anchor="middle" font-size="11" fill="#111">0</text>
  <text x="460" y="154" text-anchor="middle" font-size="11" fill="#111">1</text>
  <text x="500" y="104" font-size="11" fill="#555">each coset is dense;</text>
  <text x="500" y="120" font-size="11" fill="#555">ringed dot = chosen rep</text>

  <!-- ===================== PANEL B ===================== -->
  <text x="350" y="192" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">Step 2 — the translates V+q are disjoint copies, trapped in [-1,2]</text>

  <!-- containing region [-1,2]: x = 280 + 180 t  =>  -1:100, 0:280, 1:460, 2:640 -->
  <!-- shade [0,1] -->
  <rect x="280" y="205" width="180" height="150" fill="#eef3f7"/>
  <!-- vertical guides -->
  <line x1="100" y1="205" x2="100" y2="360" stroke="#999999" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="280" y1="205" x2="280" y2="360" stroke="#333333" stroke-width="1"/>
  <line x1="460" y1="205" x2="460" y2="360" stroke="#333333" stroke-width="1"/>
  <line x1="640" y1="205" x2="640" y2="360" stroke="#999999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="100" y="373" text-anchor="middle" font-size="11" fill="#111">-1</text>
  <text x="280" y="373" text-anchor="middle" font-size="11" fill="#111">0</text>
  <text x="460" y="373" text-anchor="middle" font-size="11" fill="#111">1</text>
  <text x="640" y="373" text-anchor="middle" font-size="11" fill="#111">2</text>

  <!-- row 1: q = -0.60 (red) y=214 -->
  <text x="92" y="218" text-anchor="end" font-size="11" fill="#111">V - 0.60</text>
  <circle cx="193.6" cy="214" r="3" fill="#d1495b"/>
  <circle cx="227.8" cy="214" r="3" fill="#d1495b"/>
  <circle cx="276.4" cy="214" r="3" fill="#d1495b"/>
  <circle cx="310.6" cy="214" r="3" fill="#d1495b"/>
  <circle cx="335.8" cy="214" r="3" fill="#d1495b"/>

  <!-- row 2: q = -0.25 (orange) y=242 -->
  <text x="92" y="246" text-anchor="end" font-size="11" fill="#111">V - 0.25</text>
  <circle cx="256.6" cy="242" r="3" fill="#e3893b"/>
  <circle cx="290.8" cy="242" r="3" fill="#e3893b"/>
  <circle cx="339.4" cy="242" r="3" fill="#e3893b"/>
  <circle cx="373.6" cy="242" r="3" fill="#e3893b"/>
  <circle cx="398.8" cy="242" r="3" fill="#e3893b"/>

  <!-- row 3: q = 0 (black) = V y=270 -->
  <text x="92" y="274" text-anchor="end" font-size="11" fill="#111" font-weight="bold">V  (q=0)</text>
  <circle cx="301.6" cy="270" r="3" fill="#111111"/>
  <circle cx="335.8" cy="270" r="3" fill="#111111"/>
  <circle cx="384.4" cy="270" r="3" fill="#111111"/>
  <circle cx="418.6" cy="270" r="3" fill="#111111"/>
  <circle cx="443.8" cy="270" r="3" fill="#111111"/>

  <!-- row 4: q = 0.30 (blue) y=298 -->
  <text x="92" y="302" text-anchor="end" font-size="11" fill="#111">V + 0.30</text>
  <circle cx="355.6" cy="298" r="3" fill="#2e6f95"/>
  <circle cx="389.8" cy="298" r="3" fill="#2e6f95"/>
  <circle cx="438.4" cy="298" r="3" fill="#2e6f95"/>
  <circle cx="472.6" cy="298" r="3" fill="#2e6f95"/>
  <circle cx="497.8" cy="298" r="3" fill="#2e6f95"/>

  <!-- row 5: q = 0.55 (green) y=326 -->
  <text x="92" y="330" text-anchor="end" font-size="11" fill="#111">V + 0.55</text>
  <circle cx="400.6" cy="326" r="3" fill="#2a9d5c"/>
  <circle cx="434.8" cy="326" r="3" fill="#2a9d5c"/>
  <circle cx="483.4" cy="326" r="3" fill="#2a9d5c"/>
  <circle cx="517.6" cy="326" r="3" fill="#2a9d5c"/>
  <circle cx="542.8" cy="326" r="3" fill="#2a9d5c"/>

  <text x="350" y="404" text-anchor="middle" font-size="12" fill="#111">Union of all rows covers [0,1] (shaded) yet fits inside [-1,2]:  [0,1] &#8838; &#8852; (V+q) &#8838; [-1,2]</text>
  <text x="350" y="422" text-anchor="middle" font-size="12" fill="#555">Countably many disjoint copies, each with the SAME measure &#8212; the sum can only be 0 or &#8734;.</text>
</svg>
