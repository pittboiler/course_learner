<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>

  <!-- shrinking averaging windows, drawn widest-first so narrower sits on top -->
  <rect x="210" y="40" width="240" height="210" fill="#e8eef5"/>
  <rect x="295" y="40" width="70"  height="210" fill="#cfe0f0"/>

  <!-- axes -->
  <line x1="55" y1="250" x2="615" y2="250" stroke="#111111" stroke-width="2"/>
  <line x1="55" y1="250" x2="55"  y2="40"  stroke="#111111" stroke-width="2"/>

  <!-- the function f -->
  <path d="M 65 222 C 165 120, 255 95, 330 90 C 405 95, 500 132, 600 214"
        fill="none" stroke="#1e5fa8" stroke-width="2.5"/>
  <text x="600" y="205" fill="#1e5fa8" font-size="15" text-anchor="end" font-style="italic">f</text>

  <!-- point x and value f(x) -->
  <line x1="330" y1="250" x2="330" y2="90" stroke="#111111" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="330" cy="90" r="4.5" fill="#111111"/>
  <text x="338" y="84" fill="#111111" font-size="14" font-style="italic">f(x)</text>

  <!-- average over the wide window r1 (well below f(x)) -->
  <line x1="210" y1="150" x2="450" y2="150" stroke="#b23030" stroke-width="2.5"/>
  <text x="456" y="154" fill="#b23030" font-size="13" text-anchor="start">A&#8321;f(x)</text>

  <!-- average over the narrow window r2 (closer to f(x)) -->
  <line x1="295" y1="112" x2="365" y2="112" stroke="#b23030" stroke-width="2.5"/>
  <text x="371" y="112" fill="#b23030" font-size="13" text-anchor="start">A&#8322;f(x)</text>

  <!-- convergence arrow: averages climb to f(x) as r shrinks -->
  <line x1="330" y1="150" x2="330" y2="98" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5 3"/>
  <polygon points="330,92 326,102 334,102" fill="#2e7d32"/>
  <text x="285" y="130" fill="#2e7d32" font-size="13" text-anchor="end">r &#8594; 0</text>

  <!-- window brackets under the axis -->
  <line x1="210" y1="258" x2="450" y2="258" stroke="#111111" stroke-width="1.5"/>
  <line x1="210" y1="254" x2="210" y2="262" stroke="#111111" stroke-width="1.5"/>
  <line x1="450" y1="254" x2="450" y2="262" stroke="#111111" stroke-width="1.5"/>
  <text x="330" y="274" fill="#111111" font-size="12" text-anchor="middle">wider ball B&#8321; = (x&#8722;r&#8321;, x+r&#8321;)</text>

  <line x1="295" y1="288" x2="365" y2="288" stroke="#111111" stroke-width="1.5"/>
  <line x1="295" y1="284" x2="295" y2="292" stroke="#111111" stroke-width="1.5"/>
  <line x1="365" y1="284" x2="365" y2="292" stroke="#111111" stroke-width="1.5"/>
  <text x="200" y="292" fill="#111111" font-size="12" text-anchor="end">narrower ball B&#8322;</text>

  <!-- x tick -->
  <line x1="330" y1="246" x2="330" y2="254" stroke="#111111" stroke-width="1.5"/>
</svg>
