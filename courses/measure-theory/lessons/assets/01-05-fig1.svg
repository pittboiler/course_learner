<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>

  <!-- divider -->
  <line x1="320" y1="30" x2="320" y2="278" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- Panel 1: outer regularity -->
  <text x="160" y="28" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Outer: hug E from outside by an open U</text>
  <ellipse cx="160" cy="170" rx="94" ry="76" fill="#eef2ff" stroke="#111111" stroke-width="1.5" stroke-dasharray="6 5"/>
  <ellipse cx="160" cy="170" rx="72" ry="56" fill="#cfe3ff" stroke="#111111" stroke-width="1.5"/>
  <text x="160" y="175" text-anchor="middle" font-size="20" fill="#111111" font-style="italic">E</text>
  <text x="160" y="112" text-anchor="middle" font-size="14" fill="#111111">U open</text>
  <text x="160" y="272" text-anchor="middle" font-size="14" fill="#111111">&#955;(U &#8726; E) &lt; &#949;</text>

  <!-- Panel 2: inner regularity -->
  <text x="480" y="28" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Inner: fill E from inside by a compact K</text>
  <ellipse cx="480" cy="170" rx="94" ry="76" fill="#eef2ff" stroke="#111111" stroke-width="1.5"/>
  <ellipse cx="480" cy="170" rx="60" ry="46" fill="#ffd9a8" stroke="#111111" stroke-width="1.5"/>
  <text x="480" y="175" text-anchor="middle" font-size="16" fill="#111111" font-style="italic">K</text>
  <text x="480" y="112" text-anchor="middle" font-size="14" fill="#111111" font-style="italic">E</text>
  <text x="480" y="272" text-anchor="middle" font-size="14" fill="#111111">&#955;(E &#8726; K) &lt; &#949;</text>
</svg>
