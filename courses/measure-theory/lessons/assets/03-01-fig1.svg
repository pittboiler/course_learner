<svg viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="470" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111111"/>
    </marker>
  </defs>

  <!-- ===== boxes ===== -->
  <!-- a.e. -->
  <rect x="55" y="40" width="175" height="50" rx="8" fill="#dbeafe" stroke="#111111" stroke-width="1.2"/>
  <text x="142" y="71" fill="#111111" font-size="17" text-anchor="middle">a.e. convergence</text>

  <!-- almost uniform -->
  <rect x="445" y="40" width="185" height="50" rx="8" fill="#ede9fe" stroke="#111111" stroke-width="1.2"/>
  <text x="537" y="65" fill="#111111" font-size="16" text-anchor="middle">almost uniform</text>
  <text x="537" y="82" fill="#555555" font-size="11" text-anchor="middle">(Lesson 3.2)</text>

  <!-- in L^p -->
  <rect x="45" y="250" width="180" height="50" rx="8" fill="#dcfce7" stroke="#111111" stroke-width="1.2"/>
  <text x="135" y="281" fill="#111111" font-size="17" text-anchor="middle">in L&#8305; (in mean)</text>

  <!-- in measure -->
  <rect x="250" y="380" width="190" height="50" rx="8" fill="#fee2e2" stroke="#111111" stroke-width="1.2"/>
  <text x="345" y="411" fill="#111111" font-size="17" text-anchor="middle">in measure</text>

  <!-- ===== top pair: a.e. <-> almost uniform ===== -->
  <line x1="232" y1="56" x2="441" y2="56" stroke="#111111" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="337" y="35" fill="#111111" font-size="12.5" text-anchor="middle">Egorov &#183; if &#956;(X) &lt; &#8734;</text>
  <line x1="443" y1="78" x2="234" y2="78" stroke="#111111" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="337" y="98" fill="#111111" font-size="12.5" text-anchor="middle">always</text>

  <!-- ===== L^p -> in measure (Chebyshev, always) ===== -->
  <line x1="160" y1="300" x2="272" y2="382" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="120" y="345" fill="#111111" font-size="12.5">Chebyshev</text>
  <text x="120" y="361" fill="#555555" font-size="11">(always)</text>

  <!-- ===== a.e. -> in measure (solid, finite measure) ===== -->
  <line x1="150" y1="92" x2="298" y2="378" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="205" y="205" fill="#111111" font-size="12.5" transform="rotate(63 205 205)">if &#956;(X) &lt; &#8734;</text>

  <!-- ===== in measure -> a.e. (dashed, subsequence only) ===== -->
  <line x1="332" y1="378" x2="185" y2="92" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="322" y="210" fill="#111111" font-size="12.5" transform="rotate(63 322 210)">a subsequence</text>

  <!-- ===== almost uniform -> in measure (always) ===== -->
  <line x1="505" y1="92" x2="402" y2="378" stroke="#111111" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="482" y="235" fill="#111111" font-size="12.5" transform="rotate(-74 482 235)">always</text>

  <!-- ===== caption: the gaps ===== -->
  <text x="470" y="396" fill="#111111" font-size="13" font-style="italic">The gaps (need a hypothesis):</text>
  <text x="470" y="419" fill="#555555" font-size="12">&#8226; measure / L&#8305; &#8655; a.e. &#8212; typewriter</text>
  <text x="470" y="438" fill="#555555" font-size="12">&#8226; a.e. &#8655; measure if &#956;(X)=&#8734; &#8212; escaping bump</text>
</svg>
