<svg viewBox="0 0 790 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">The local resolver does the walking. Your program asks once and waits.</text>
  <rect x="60" y="90" width="130" height="34" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" rx="5" opacity="0.13"/>
  <text x="125" y="112" fill="#4a90d9" font-size="10.5" text-anchor="middle">your host</text>
  <rect x="210" y="90" width="130" height="46" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" rx="5" opacity="0.13"/>
  <text x="275" y="108" fill="#4a90d9" font-size="10.5" text-anchor="middle">local DNS</text>
  <text x="275" y="124" fill="#4a90d9" font-size="10.5" text-anchor="middle">resolver</text>
  <rect x="420" y="60" width="130" height="34" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.5" rx="5" opacity="0.13"/>
  <text x="485" y="82" fill="#8a8a8a" font-size="10.5" text-anchor="middle">root server</text>
  <rect x="420" y="150" width="130" height="46" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.5" rx="5" opacity="0.13"/>
  <text x="485" y="168" fill="#8a8a8a" font-size="10.5" text-anchor="middle">TLD server</text>
  <text x="485" y="184" fill="#8a8a8a" font-size="10.5" text-anchor="middle">(.com)</text>
  <rect x="420" y="240" width="130" height="46" fill="#e0645c" stroke="#e0645c" stroke-width="1.5" rx="5" opacity="0.13"/>
  <text x="485" y="258" fill="#e0645c" font-size="10.5" text-anchor="middle">authoritative</text>
  <text x="485" y="274" fill="#e0645c" font-size="10.5" text-anchor="middle">(example.com)</text>
  <line x1="192" y1="106" x2="200.0" y2="106.0" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="206,106 200.0,109.3 200.0,102.7" fill="#4a90d9"/>
  <text x="150" y="100" fill="#4a90d9" font-size="9.5">1. query</text>
  <line x1="206" y1="120" x2="198.0" y2="120.0" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="192,120 198.0,116.7 198.0,123.3" fill="#4a90d9"/>
  <text x="150" y="132" fill="#4a90d9" font-size="9.5">8. answer</text>
  <line x1="344" y1="77" x2="410.0" y2="77.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="416,77 410.0,80.3 410.0,73.7" fill="#8a8a8a"/>
  <text x="348" y="71" fill="#8a8a8a" font-size="9.5">2. .com?</text>
  <line x1="416" y1="95" x2="350.0" y2="95.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="344,95 350.0,91.7 350.0,98.3" fill="#8a8a8a"/>
  <text x="348" y="109" fill="#8a8a8a" font-size="9.5">3. ask TLD</text>
  <line x1="344" y1="167" x2="410.0" y2="167.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="416,167 410.0,170.3 410.0,163.7" fill="#8a8a8a"/>
  <text x="348" y="161" fill="#8a8a8a" font-size="9.5">4. example.com?</text>
  <line x1="416" y1="185" x2="350.0" y2="185.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="344,185 350.0,181.7 350.0,188.3" fill="#8a8a8a"/>
  <text x="348" y="199" fill="#8a8a8a" font-size="9.5">5. ask authoritative</text>
  <line x1="344" y1="257" x2="410.0" y2="257.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="416,257 410.0,260.3 410.0,253.7" fill="#8a8a8a"/>
  <text x="348" y="251" fill="#8a8a8a" font-size="9.5">6. www?</text>
  <line x1="416" y1="275" x2="350.0" y2="275.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="344,275 350.0,271.7 350.0,278.3" fill="#8a8a8a"/>
  <text x="348" y="289" fill="#8a8a8a" font-size="9.5">7. 93.184.x.x</text>
  <text x="275" y="320" fill="#8a8a8a" font-size="10.5" text-anchor="middle">iterative: each server answers with a referral, not a lookup on your behalf</text>
  <line x1="45" y1="340" x2="745" y2="340" stroke="#8a8a8a" stroke-width="1"/>
  <text x="55" y="364" fill="#e0645c" font-size="11">CACHING is what makes this affordable. The resolver caches every answer for its TTL, so the root and TLD</text>
  <text x="55" y="382" fill="#e0645c" font-size="11">servers are consulted a vanishing fraction of the time - which is the only reason 13 root server addresses</text>
  <text x="55" y="400" fill="#e0645c" font-size="11">can serve the whole Internet. The cost of caching is that a changed record takes up to one TTL to be seen.</text>
  <text x="55" y="424" fill="#4a90d9" font-size="11">A cache hit turns eight messages into one, and turns three wide-area round trips into zero.</text>
</svg>
