<svg viewBox="0 0 790 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">Inside an AS you optimise cost. Between them you optimise policy, and policy beats cost.</text>
  <rect x="60" y="70" width="300" height="110" fill="none" stroke="#e0645c" stroke-width="1.5" rx="6"/>
  <text x="70" y="88" fill="#e0645c" font-size="10.5">AS 1  provider</text>
  <circle cx="100.0" cy="135" r="13" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="100.0" y="139" fill="#8a8a8a" font-size="9.5" text-anchor="middle">R</text>
  <line x1="113.0" y1="135" x2="197.0" y2="135" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="210.0" cy="135" r="13" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="210.0" y="139" fill="#8a8a8a" font-size="9.5" text-anchor="middle">R</text>
  <line x1="223.0" y1="135" x2="307.0" y2="135" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="320.0" cy="135" r="13" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="320.0" y="139" fill="#8a8a8a" font-size="9.5" text-anchor="middle">R</text>
  <rect x="60" y="220" width="190" height="100" fill="none" stroke="#4a90d9" stroke-width="1.5" rx="6"/>
  <text x="70" y="238" fill="#4a90d9" font-size="10.5">AS 2  customer</text>
  <circle cx="100.0" cy="285" r="13" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="100.0" y="289" fill="#8a8a8a" font-size="9.5" text-anchor="middle">R</text>
  <line x1="113.0" y1="285" x2="142.0" y2="285" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="155.0" cy="285" r="13" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="155.0" y="289" fill="#8a8a8a" font-size="9.5" text-anchor="middle">R</text>
  <line x1="168.0" y1="285" x2="197.0" y2="285" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="210.0" cy="285" r="13" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="210.0" y="289" fill="#8a8a8a" font-size="9.5" text-anchor="middle">R</text>
  <rect x="430" y="70" width="300" height="110" fill="none" stroke="#e0645c" stroke-width="1.5" rx="6"/>
  <text x="440" y="88" fill="#e0645c" font-size="10.5">AS 3  peer</text>
  <circle cx="470.0" cy="135" r="13" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="470.0" y="139" fill="#8a8a8a" font-size="9.5" text-anchor="middle">R</text>
  <line x1="483.0" y1="135" x2="567.0" y2="135" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="580.0" cy="135" r="13" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="580.0" y="139" fill="#8a8a8a" font-size="9.5" text-anchor="middle">R</text>
  <line x1="593.0" y1="135" x2="677.0" y2="135" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="690.0" cy="135" r="13" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="690.0" y="139" fill="#8a8a8a" font-size="9.5" text-anchor="middle">R</text>
  <rect x="430" y="220" width="190" height="100" fill="none" stroke="#4a90d9" stroke-width="1.5" rx="6"/>
  <text x="440" y="238" fill="#4a90d9" font-size="10.5">AS 4  customer</text>
  <circle cx="470.0" cy="285" r="13" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="470.0" y="289" fill="#8a8a8a" font-size="9.5" text-anchor="middle">R</text>
  <line x1="483.0" y1="285" x2="512.0" y2="285" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="525.0" cy="285" r="13" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="525.0" y="289" fill="#8a8a8a" font-size="9.5" text-anchor="middle">R</text>
  <line x1="538.0" y1="285" x2="567.0" y2="285" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="580.0" cy="285" r="13" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="580.0" y="289" fill="#8a8a8a" font-size="9.5" text-anchor="middle">R</text>
  <line x1="360" y1="125" x2="430" y2="125" stroke="#e0645c" stroke-width="2"/>
  <text x="395" y="116" fill="#e0645c" font-size="10" text-anchor="middle">peering</text>
  <line x1="150" y1="180" x2="150" y2="220" stroke="#4a90d9" stroke-width="2"/>
  <text x="158" y="203" fill="#4a90d9" font-size="10">transit</text>
  <line x1="560" y1="180" x2="560" y2="220" stroke="#4a90d9" stroke-width="2"/>
  <text x="568" y="203" fill="#4a90d9" font-size="10">transit</text>
  <line x1="45" y1="338" x2="745" y2="338" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="362" fill="#8a8a8a" font-size="11">AS 1 will carry traffic for its CUSTOMER AS 2 to anywhere, because AS 2 pays. It will carry traffic</text>
  <text x="60" y="380" fill="#8a8a8a" font-size="11">between AS 3 and AS 4 for nobody, because that is free transit for a peer - so it does not advertise</text>
  <text x="60" y="398" fill="#e0645c" font-size="11">a route it could perfectly well provide. The shortest path is not offered, and BGP never sees it.</text>
  <text x="60" y="422" fill="#4a90d9" font-size="11">That is why inter-AS routing is a path-vector protocol with policy filters, not a shortest-path algorithm.</text>
</svg>
