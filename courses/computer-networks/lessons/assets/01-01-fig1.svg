<svg viewBox="0 0 790 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">Each layer adds a header on the way down and strips it on the way up. Nothing else crosses.</text>
  <rect x="50" y="58" width="180" height="32" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" rx="4" opacity="0.14"/>
  <text x="140" y="79" fill="#4a90d9" font-size="11" text-anchor="middle">application</text>
  <text x="238" y="79" fill="#8a8a8a" font-size="10">HTTP, DNS, SMTP</text>
  <rect x="50" y="98" width="180" height="32" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" rx="4" opacity="0.14"/>
  <text x="140" y="119" fill="#4a90d9" font-size="11" text-anchor="middle">transport</text>
  <text x="238" y="119" fill="#8a8a8a" font-size="10">TCP, UDP</text>
  <rect x="50" y="138" width="180" height="32" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" rx="4" opacity="0.14"/>
  <text x="140" y="159" fill="#e0645c" font-size="11" text-anchor="middle">network</text>
  <text x="238" y="159" fill="#8a8a8a" font-size="10">IP</text>
  <rect x="50" y="178" width="180" height="32" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" rx="4" opacity="0.14"/>
  <text x="140" y="199" fill="#8a8a8a" font-size="11" text-anchor="middle">link</text>
  <text x="238" y="199" fill="#8a8a8a" font-size="10">Ethernet, Wi-Fi</text>
  <rect x="50" y="218" width="180" height="32" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" rx="4" opacity="0.14"/>
  <text x="140" y="239" fill="#8a8a8a" font-size="11" text-anchor="middle">physical</text>
  <text x="238" y="239" fill="#8a8a8a" font-size="10">bits on a wire</text>
  <rect x="400" y="58" width="300" height="32" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" rx="4" opacity="0.1"/>
  <text x="408" y="79" fill="#4a90d9" font-size="10">message</text>
  <rect x="400" y="98" width="260" height="32" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" rx="4" opacity="0.1"/>
  <text x="408" y="119" fill="#4a90d9" font-size="10">+ TCP hdr</text>
  <rect x="400" y="138" width="220" height="32" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" rx="4" opacity="0.1"/>
  <text x="408" y="159" fill="#e0645c" font-size="10">+ IP hdr</text>
  <rect x="400" y="178" width="180" height="32" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" rx="4" opacity="0.1"/>
  <text x="408" y="199" fill="#8a8a8a" font-size="10">+ frame hdr/trailer</text>
  <text x="400" y="250" fill="#8a8a8a" font-size="10.5">the message the application wrote is the innermost box, untouched</text>
  <line x1="45" y1="272" x2="745" y2="272" stroke="#8a8a8a" stroke-width="1"/>
  <text x="55" y="296" fill="#e0645c" font-size="11.5">FOUR DELAYS, and only one of them depends on the packet's size</text>
  <text x="58" y="320" fill="#4a90d9" font-size="10.5">delay</text>
  <text x="160" y="320" fill="#4a90d9" font-size="10.5">formula</text>
  <text x="250" y="320" fill="#4a90d9" font-size="10.5">what it is</text>
  <text x="540" y="320" fill="#4a90d9" font-size="10.5">depends on</text>
  <text x="58" y="342" fill="#8a8a8a" font-size="10.5">transmission</text>
  <text x="160" y="342" fill="#e0645c" font-size="10.5">L / R</text>
  <text x="250" y="342" fill="#8a8a8a" font-size="10.5">how long to push L bits out at rate R</text>
  <text x="540" y="342" fill="#8a8a8a" font-size="10.5">size and link rate</text>
  <text x="58" y="364" fill="#8a8a8a" font-size="10.5">propagation</text>
  <text x="160" y="364" fill="#e0645c" font-size="10.5">d / s</text>
  <text x="250" y="364" fill="#8a8a8a" font-size="10.5">how long a bit takes to cross distance d</text>
  <text x="540" y="364" fill="#8a8a8a" font-size="10.5">distance only</text>
  <text x="58" y="386" fill="#8a8a8a" font-size="10.5">queueing</text>
  <text x="160" y="386" fill="#e0645c" font-size="10.5">varies</text>
  <text x="250" y="386" fill="#8a8a8a" font-size="10.5">time spent waiting behind other packets</text>
  <text x="540" y="386" fill="#8a8a8a" font-size="10.5">load - the only random one</text>
  <text x="58" y="408" fill="#8a8a8a" font-size="10.5">processing</text>
  <text x="160" y="408" fill="#e0645c" font-size="10.5">small</text>
  <text x="250" y="408" fill="#8a8a8a" font-size="10.5">header check, lookup</text>
  <text x="540" y="408" fill="#8a8a8a" font-size="10.5">usually negligible</text>
  <text x="55" y="434" fill="#e0645c" font-size="10.5">A 1500-byte packet on a 100 Mb/s link takes 120 us to transmit and 16 ms to cross 4000 km. Distance usually wins.</text>
</svg>
