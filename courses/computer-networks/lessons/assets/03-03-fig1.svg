<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">Link state: flood the map, then every router runs the same shortest-path computation alone.</text>
  <line x1="120" y1="150" x2="300" y2="90" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="214.0" y="116.0" fill="#8a8a8a" font-size="10">2</text>
  <line x1="120" y1="150" x2="300" y2="220" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="214.0" y="181.0" fill="#8a8a8a" font-size="10">1</text>
  <line x1="120" y1="150" x2="470" y2="130" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="299.0" y="136.0" fill="#8a8a8a" font-size="10">5</text>
  <line x1="300" y1="90" x2="300" y2="220" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="304.0" y="151.0" fill="#8a8a8a" font-size="10">2</text>
  <line x1="300" y1="90" x2="470" y2="130" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="389.0" y="106.0" fill="#8a8a8a" font-size="10">3</text>
  <line x1="300" y1="220" x2="470" y2="130" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="389.0" y="171.0" fill="#8a8a8a" font-size="10">3</text>
  <line x1="300" y1="220" x2="470" y2="250" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="389.0" y="231.0" fill="#8a8a8a" font-size="10">1</text>
  <line x1="470" y1="130" x2="470" y2="250" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="474.0" y="186.0" fill="#8a8a8a" font-size="10">1</text>
  <line x1="470" y1="130" x2="640" y2="190" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="559.0" y="156.0" fill="#8a8a8a" font-size="10">5</text>
  <line x1="470" y1="250" x2="640" y2="190" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="559.0" y="216.0" fill="#8a8a8a" font-size="10">2</text>
  <circle cx="120" cy="150" r="18" fill="#e0645c" stroke="#e0645c" stroke-width="1.7"/>
  <text x="120" y="155" fill="#e0645c" font-size="12" text-anchor="middle">u</text>
  <circle cx="300" cy="90" r="18" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.7"/>
  <text x="300" y="95" fill="#4a90d9" font-size="12" text-anchor="middle">v</text>
  <circle cx="300" cy="220" r="18" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.7"/>
  <text x="300" y="225" fill="#4a90d9" font-size="12" text-anchor="middle">x</text>
  <circle cx="470" cy="130" r="18" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.7"/>
  <text x="470" y="135" fill="#4a90d9" font-size="12" text-anchor="middle">w</text>
  <circle cx="470" cy="250" r="18" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.7"/>
  <text x="470" y="255" fill="#4a90d9" font-size="12" text-anchor="middle">y</text>
  <circle cx="640" cy="190" r="18" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.7"/>
  <text x="640" y="195" fill="#4a90d9" font-size="12" text-anchor="middle">z</text>
  <text x="120" y="190" fill="#e0645c" font-size="10" text-anchor="middle">source</text>
  <text x="60" y="300" fill="#e0645c" font-size="11.5">Dijkstra from u, one row per step</text>
  <text x="64" y="322" fill="#8a8a8a" font-size="10">step</text>
  <text x="120" y="322" fill="#8a8a8a" font-size="10">settled</text>
  <text x="250" y="322" fill="#8a8a8a" font-size="10">v</text>
  <text x="320" y="322" fill="#8a8a8a" font-size="10">w</text>
  <text x="390" y="322" fill="#8a8a8a" font-size="10">x</text>
  <text x="460" y="322" fill="#8a8a8a" font-size="10">y</text>
  <text x="530" y="322" fill="#8a8a8a" font-size="10">z</text>
  <line x1="60" y1="328" x2="700" y2="328" stroke="#8a8a8a" stroke-width="1"/>
  <text x="64" y="346" fill="#8a8a8a" font-size="9.5">0</text>
  <text x="120" y="346" fill="#8a8a8a" font-size="9.5">u</text>
  <text x="250" y="346" fill="#8a8a8a" font-size="9.5">2,u</text>
  <text x="320" y="346" fill="#8a8a8a" font-size="9.5">5,u</text>
  <text x="390" y="346" fill="#8a8a8a" font-size="9.5">1,u</text>
  <text x="460" y="346" fill="#8a8a8a" font-size="9.5">inf</text>
  <text x="530" y="346" fill="#8a8a8a" font-size="9.5">inf</text>
  <text x="64" y="363" fill="#8a8a8a" font-size="9.5">1</text>
  <text x="120" y="363" fill="#8a8a8a" font-size="9.5">u,x</text>
  <text x="250" y="363" fill="#8a8a8a" font-size="9.5">2,u</text>
  <text x="320" y="363" fill="#8a8a8a" font-size="9.5">4,x</text>
  <text x="390" y="363" fill="#8a8a8a" font-size="9.5">-</text>
  <text x="460" y="363" fill="#8a8a8a" font-size="9.5">2,x</text>
  <text x="530" y="363" fill="#8a8a8a" font-size="9.5">inf</text>
  <text x="64" y="380" fill="#8a8a8a" font-size="9.5">2</text>
  <text x="120" y="380" fill="#8a8a8a" font-size="9.5">u,x,v</text>
  <text x="250" y="380" fill="#8a8a8a" font-size="9.5">-</text>
  <text x="320" y="380" fill="#8a8a8a" font-size="9.5">4,x</text>
  <text x="390" y="380" fill="#8a8a8a" font-size="9.5">-</text>
  <text x="460" y="380" fill="#8a8a8a" font-size="9.5">2,x</text>
  <text x="530" y="380" fill="#8a8a8a" font-size="9.5">inf</text>
  <text x="64" y="397" fill="#8a8a8a" font-size="9.5">3</text>
  <text x="120" y="397" fill="#8a8a8a" font-size="9.5">u,x,v,y</text>
  <text x="250" y="397" fill="#8a8a8a" font-size="9.5">-</text>
  <text x="320" y="397" fill="#8a8a8a" font-size="9.5">3,y</text>
  <text x="390" y="397" fill="#8a8a8a" font-size="9.5">-</text>
  <text x="460" y="397" fill="#8a8a8a" font-size="9.5">-</text>
  <text x="530" y="397" fill="#8a8a8a" font-size="9.5">4,y</text>
  <text x="64" y="414" fill="#8a8a8a" font-size="9.5">4</text>
  <text x="120" y="414" fill="#8a8a8a" font-size="9.5">u,x,v,y,w</text>
  <text x="250" y="414" fill="#8a8a8a" font-size="9.5">-</text>
  <text x="320" y="414" fill="#8a8a8a" font-size="9.5">-</text>
  <text x="390" y="414" fill="#8a8a8a" font-size="9.5">-</text>
  <text x="460" y="414" fill="#8a8a8a" font-size="9.5">-</text>
  <text x="530" y="414" fill="#8a8a8a" font-size="9.5">4,y</text>
  <text x="64" y="431" fill="#8a8a8a" font-size="9.5">5</text>
  <text x="120" y="431" fill="#8a8a8a" font-size="9.5">all</text>
  <text x="250" y="431" fill="#8a8a8a" font-size="9.5">-</text>
  <text x="320" y="431" fill="#8a8a8a" font-size="9.5">-</text>
  <text x="390" y="431" fill="#8a8a8a" font-size="9.5">-</text>
  <text x="460" y="431" fill="#8a8a8a" font-size="9.5">-</text>
  <text x="530" y="431" fill="#8a8a8a" font-size="9.5">-</text>
  <text x="600" y="346" fill="#e0645c" font-size="10">final costs</text>
  <text x="600" y="363" fill="#8a8a8a" font-size="10">v 2  w 3  x 1</text>
  <text x="600" y="380" fill="#8a8a8a" font-size="10">y 2  z 4</text>
  <text x="600" y="404" fill="#e0645c" font-size="10">next hop from u:</text>
  <text x="600" y="421" fill="#8a8a8a" font-size="10">v via v, all else via x</text>
  <text x="60" y="444" fill="#8a8a8a" font-size="10">Each entry is cost,predecessor. A node is settled when it has the smallest tentative cost left.</text>
</svg>
