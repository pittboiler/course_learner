<svg viewBox="0 0 790 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">The transport header is what tells one arriving stream of bytes from another.</text>
  <text x="60" y="62" fill="#4a90d9" font-size="11.5">UDP demultiplexes on TWO fields</text>
  <rect x="60" y="74" width="300" height="30" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" rx="4" opacity="0.13"/>
  <text x="210" y="94" fill="#4a90d9" font-size="11" text-anchor="middle">dest IP  +  dest port</text>
  <text x="60" y="124" fill="#8a8a8a" font-size="10.5">Two clients sending to port 53 land in the SAME socket. The</text>
  <text x="60" y="142" fill="#8a8a8a" font-size="10.5">server reads the source address from each datagram to reply.</text>
  <line x1="400" y1="60" x2="400" y2="200" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="430" y="62" fill="#e0645c" font-size="11.5">TCP demultiplexes on FOUR</text>
  <rect x="430" y="74" width="300" height="30" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" rx="4" opacity="0.13"/>
  <text x="580" y="94" fill="#e0645c" font-size="10" text-anchor="middle">src IP + src port + dest IP + dest port</text>
  <text x="430" y="124" fill="#8a8a8a" font-size="10.5">Two clients to port 80 get two DIFFERENT sockets, because</text>
  <text x="430" y="142" fill="#8a8a8a" font-size="10.5">the source half of the tuple differs. That is what a</text>
  <text x="430" y="160" fill="#8a8a8a" font-size="10.5">connection IS - an entry keyed by the four-tuple.</text>
  <line x1="45" y1="214" x2="745" y2="214" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="238" fill="#e0645c" font-size="11.5">one server, port 80, three arriving segments</text>
  <rect x="60" y="258" width="400" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="4" opacity="0.1"/>
  <text x="70" y="276" fill="#4a90d9" font-size="10.5">A: 10.0.0.5:41000  -&gt;  93.1.1.1:80</text>
  <line x1="466" y1="271" x2="516.0" y2="271.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="522,271 516.0,274.3 516.0,267.7" fill="#8a8a8a"/>
  <rect x="528" y="258" width="120" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="4" opacity="0.14"/>
  <text x="588" y="276" fill="#4a90d9" font-size="10.5" text-anchor="middle">socket 1</text>
  <rect x="60" y="292" width="400" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="4" opacity="0.1"/>
  <text x="70" y="310" fill="#4a90d9" font-size="10.5">B: 10.0.0.9:41000  -&gt;  93.1.1.1:80</text>
  <line x1="466" y1="305" x2="516.0" y2="305.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="522,305 516.0,308.3 516.0,301.7" fill="#8a8a8a"/>
  <rect x="528" y="292" width="120" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="4" opacity="0.14"/>
  <text x="588" y="310" fill="#4a90d9" font-size="10.5" text-anchor="middle">socket 2</text>
  <rect x="60" y="326" width="400" height="26" fill="#e0645c" stroke="#e0645c" stroke-width="1.3" rx="4" opacity="0.1"/>
  <text x="70" y="344" fill="#e0645c" font-size="10.5">A: 10.0.0.5:52310  -&gt;  93.1.1.1:80</text>
  <line x1="466" y1="339" x2="516.0" y2="339.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="522,339 516.0,342.3 516.0,335.7" fill="#8a8a8a"/>
  <rect x="528" y="326" width="120" height="26" fill="#e0645c" stroke="#e0645c" stroke-width="1.3" rx="4" opacity="0.14"/>
  <text x="588" y="344" fill="#e0645c" font-size="10.5" text-anchor="middle">socket 3</text>
  <text x="60" y="378" fill="#8a8a8a" font-size="11">Rows 1 and 3 come from the SAME host to the SAME port and still get different sockets, because the</text>
  <text x="60" y="396" fill="#8a8a8a" font-size="11">source port differs. That is why one browser can hold six connections to one server at once.</text>
  <text x="60" y="420" fill="#e0645c" font-size="11">UDP would have delivered all three to one socket. Choosing UDP means doing this bookkeeping yourself.</text>
</svg>
