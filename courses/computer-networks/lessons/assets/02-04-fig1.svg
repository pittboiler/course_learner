  <text x="438.57142857142856" y="352" fill="#8a8a8a" font-size="9.5" text-anchor="middle">13</text>
  <line x1="525.7142857142858" y1="330" x2="525.7142857142858" y2="336" stroke="#8a8a8a" stroke-width="1"/>
  <text x="525.7142857142858" y="352" fill="#8a8a8a" font-size="9.5" text-anchor="middle">16</text>
  <line x1="612.8571428571429" y1="330" x2="612.8571428571429" y2="336" stroke="#8a8a8a" stroke-width="1"/>
