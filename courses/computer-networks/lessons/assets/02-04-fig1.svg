  <line x1="84" y1="330.0" x2="90" y2="330.0" stroke="#8a8a8a" stroke-width="1"/>
  <text x="80" y="334.0" fill="#8a8a8a" font-size="9.5" text-anchor="end">0</text>
  <line x1="84" y1="258.57142857142856" x2="90" y2="258.57142857142856" stroke="#8a8a8a" stroke-width="1"/>
  <text x="80" y="262.57142857142856" fill="#8a8a8a" font-size="9.5" text-anchor="end">4</text>
  <line x1="84" y1="187.14285714285714" x2="90" y2="187.14285714285714" stroke="#8a8a8a" stroke-width="1"/>
  <text x="80" y="191.14285714285714" fill="#8a8a8a" font-size="9.5" text-anchor="end">8</text>
