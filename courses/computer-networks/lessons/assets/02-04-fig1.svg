  <circle cx="700.0" cy="187.14285714285714" r="2.6" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1"/>
  <text x="121.04761904761905" y="250.57142857142856" fill="#4a90d9" font-size="10">slow start: double each round</text>
  <text x="200.1904761904762" y="105.71428571428572" fill="#e0645c" font-size="10">congestion avoidance: +1 each round</text>
  <text x="253.33333333333337" y="99.85714285714286" fill="#e0645c" font-size="9.5">triple dup ACK at 12</text>
  <text x="487.7142857142858" y="82.0" fill="#e0645c" font-size="9.5">timeout at 13</text>
  <text x="556.7619047619048" y="268.42857142857144" fill="#4a90d9" font-size="10">timeout: cwnd to 1, slow start again</text>
  <line x1="45" y1="362" x2="755" y2="362" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="386" fill="#8a8a8a" font-size="10.5">A triple duplicate ACK means packets are still arriving, so Reno halves and keeps going. A timeout means</text>
  <text x="60" y="404" fill="#e0645c" font-size="10.5">nothing is getting through at all, so it drops to 1 and restarts slow start. Same loss, two different verdicts.</text>
  <text x="60" y="424" fill="#8a8a8a" font-size="10.5">ssthresh is set to half the window at EVERY loss, which is what makes the teeth get shorter under pressure.</text>
</svg>
