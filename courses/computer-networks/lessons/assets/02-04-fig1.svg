  <circle cx="554.7619047619048" cy="312.14285714285717" r="2.6" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="583.8095238095239" cy="294.2857142857143" r="2.6" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="612.8571428571429" cy="258.57142857142856" r="2.6" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="641.9047619047619" cy="222.85714285714286" r="2.6" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1"/>
