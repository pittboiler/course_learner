  <text x="80" y="119.71428571428572" fill="#8a8a8a" font-size="9.5" text-anchor="end">12</text>
  <text x="395.0" y="374" fill="#8a8a8a" font-size="10.5" text-anchor="middle">transmission round</text>
  <text x="74" y="56" fill="#8a8a8a" font-size="10.5">cwnd (MSS)</text>
  <line x1="90" y1="187.14285714285714" x2="700" y2="187.14285714285714" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="706" y="191.14285714285714" fill="#8a8a8a" font-size="9.5">ssthresh 8</text>
  <line x1="90" y1="222.85714285714286" x2="700" y2="222.85714285714286" stroke="#e0645c" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="706" y="226.85714285714286" fill="#e0645c" font-size="9.5">then 6</text>
