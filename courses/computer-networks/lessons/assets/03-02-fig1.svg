<svg viewBox="0 0 790 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">A forwarding table is a set of prefixes, and the most specific match wins.</text>
  <text x="60" y="62" fill="#e0645c" font-size="11.5">forwarding table</text>
  <text x="66" y="80" fill="#8a8a8a" font-size="10">prefix</text>
  <text x="220" y="80" fill="#8a8a8a" font-size="10">length</text>
  <text x="300" y="80" fill="#8a8a8a" font-size="10">interface</text>
  <line x1="60" y1="86" x2="380" y2="86" stroke="#8a8a8a" stroke-width="1"/>
  <text x="66" y="104" fill="#4a90d9" font-size="10.5">200.23.0.0/16</text>
  <text x="228" y="104" fill="#8a8a8a" font-size="10.5">16</text>
  <text x="310" y="104" fill="#e0645c" font-size="10.5">D</text>
  <text x="66" y="128" fill="#4a90d9" font-size="10.5">200.23.16.0/20</text>
  <text x="228" y="128" fill="#8a8a8a" font-size="10.5">20</text>
  <text x="310" y="128" fill="#e0645c" font-size="10.5">A</text>
  <text x="66" y="152" fill="#4a90d9" font-size="10.5">200.23.16.0/23</text>
  <text x="228" y="152" fill="#8a8a8a" font-size="10.5">23</text>
  <text x="310" y="152" fill="#e0645c" font-size="10.5">B</text>
  <text x="66" y="176" fill="#4a90d9" font-size="10.5">200.23.24.0/21</text>
  <text x="228" y="176" fill="#8a8a8a" font-size="10.5">21</text>
  <text x="310" y="176" fill="#e0645c" font-size="10.5">C</text>
  <text x="66" y="200" fill="#4a90d9" font-size="10.5">0.0.0.0/0</text>
  <text x="228" y="200" fill="#8a8a8a" font-size="10.5">0</text>
  <text x="310" y="200" fill="#e0645c" font-size="10.5">default</text>
  <line x1="410" y1="58" x2="410" y2="240" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="440" y="62" fill="#e0645c" font-size="11.5">resolving three destinations</text>
  <text x="446" y="92" fill="#4a90d9" font-size="10.5">200.23.17.9</text>
  <text x="446" y="108" fill="#8a8a8a" font-size="10">matches /16, /20, /23</text>
  <text x="446" y="124" fill="#e0645c" font-size="10.5">-&gt; B  (longest)</text>
  <text x="446" y="136" fill="#4a90d9" font-size="10.5">200.23.26.200</text>
  <text x="446" y="152" fill="#8a8a8a" font-size="10">matches /16, /20, /21</text>
  <text x="446" y="168" fill="#e0645c" font-size="10.5">-&gt; C  (longest)</text>
  <text x="446" y="180" fill="#4a90d9" font-size="10.5">200.23.100.5</text>
  <text x="446" y="196" fill="#8a8a8a" font-size="10">matches /16 only</text>
  <text x="446" y="212" fill="#e0645c" font-size="10.5">-&gt; D</text>
  <text x="440" y="232" fill="#8a8a8a" font-size="10">specificity, not table order, decides</text>
  <line x1="45" y1="256" x2="745" y2="256" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="280" fill="#e0645c" font-size="11">WHY LONGEST PREFIX. Aggregation: a provider advertises one /16 and its customers sit inside it on</text>
  <text x="60" y="298" fill="#8a8a8a" font-size="11">longer prefixes. Adding a customer adds one row here and NOTHING to the rest of the Internet, which</text>
  <text x="60" y="316" fill="#8a8a8a" font-size="11">is what keeps the global routing table at hundreds of thousands of entries instead of billions.</text>
  <text x="60" y="344" fill="#e0645c" font-size="11">NAT is the other half of the address story: one public address, many private hosts, with a table</text>
  <text x="60" y="362" fill="#8a8a8a" font-size="11">rewriting the source port on the way out and reversing it on the way back.</text>
  <rect x="60" y="378" width="660" height="40" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.3" rx="4" opacity="0.07"/>
  <text x="70" y="396" fill="#8a8a8a" font-size="10">out:  10.0.0.4:3345  -&gt;  198.51.100.7:5001        in:  198.51.100.7:5001  -&gt;  10.0.0.4:3345</text>
  <text x="70" y="412" fill="#8a8a8a" font-size="9.5">the port number, not the address, is what distinguishes the hosts behind one public address</text>
</svg>
