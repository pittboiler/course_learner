  <rect x="533.3333333333334" y="70" width="57.333333333333336" height="22" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.16"/>
  <text x="562.0" y="86" fill="#4a90d9" font-size="9.5" text-anchor="middle">SYN</text>
  <rect x="596.6666666666667" y="70" width="57.333333333333336" height="22" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.16"/>
  <text x="625.3333333333334" y="86" fill="#4a90d9" font-size="9.5" text-anchor="middle">GET</text>
  <text x="672" y="86" fill="#e0645c" font-size="11">9 RTT</text>
  <text x="55" y="140" fill="#e0645c" font-size="11.5">persistent connection, requests pipelined</text>
  <line x1="90" y1="160" x2="660" y2="160" stroke="#8a8a8a" stroke-width="1"/>
  <rect x="90.0" y="150" width="136.5" height="22" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.3" rx="3" opacity="0.16"/>
  <text x="158.25" y="166" fill="#8a8a8a" font-size="9.5" text-anchor="middle">DNS</text>
  <rect x="232.5" y="150" width="136.5" height="22" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.16"/>
  <text x="300.75" y="166" fill="#4a90d9" font-size="9.5" text-anchor="middle">SYN</text>
  <rect x="375.0" y="150" width="136.5" height="22" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.16"/>
  <text x="443.25" y="166" fill="#4a90d9" font-size="9.5" text-anchor="middle">GET html</text>
  <rect x="517.5" y="150" width="136.5" height="22" fill="#e0645c" stroke="#e0645c" stroke-width="1.3" rx="3" opacity="0.16"/>
  <text x="585.75" y="166" fill="#e0645c" font-size="9.5" text-anchor="middle">3 objects</text>
  <text x="672" y="166" fill="#e0645c" font-size="11">4 RTT</text>
  <text x="55" y="220" fill="#e0645c" font-size="11.5">non-persistent, DNS and base HTML already cached</text>
  <line x1="90" y1="240" x2="660" y2="240" stroke="#8a8a8a" stroke-width="1"/>
  <rect x="90.0" y="230" width="89.0" height="22" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.16"/>
  <text x="134.5" y="246" fill="#4a90d9" font-size="9.5" text-anchor="middle">SYN</text>
  <rect x="185.0" y="230" width="89.0" height="22" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.16"/>
  <text x="229.5" y="246" fill="#4a90d9" font-size="9.5" text-anchor="middle">GET</text>
  <rect x="280.0" y="230" width="89.0" height="22" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.16"/>
  <text x="324.5" y="246" fill="#4a90d9" font-size="9.5" text-anchor="middle">SYN</text>
  <rect x="375.0" y="230" width="89.0" height="22" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.16"/>
  <text x="419.5" y="246" fill="#4a90d9" font-size="9.5" text-anchor="middle">GET</text>
  <rect x="470.0" y="230" width="89.0" height="22" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.16"/>
  <text x="514.5" y="246" fill="#4a90d9" font-size="9.5" text-anchor="middle">SYN</text>
  <rect x="565.0" y="230" width="89.0" height="22" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.16"/>
  <text x="609.5" y="246" fill="#4a90d9" font-size="9.5" text-anchor="middle">GET</text>
  <text x="672" y="246" fill="#e0645c" font-size="11">6 RTT</text>
  <text x="55" y="300" fill="#e0645c" font-size="11.5">persistent, DNS and base HTML already cached</text>
  <line x1="90" y1="320" x2="660" y2="320" stroke="#8a8a8a" stroke-width="1"/>
  <rect x="90.0" y="310" width="279.0" height="22" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.16"/>
  <text x="229.5" y="326" fill="#4a90d9" font-size="9.5" text-anchor="middle">SYN</text>
  <rect x="375.0" y="310" width="279.0" height="22" fill="#e0645c" stroke="#e0645c" stroke-width="1.3" rx="3" opacity="0.16"/>
  <text x="514.5" y="326" fill="#e0645c" font-size="9.5" text-anchor="middle">3 objects</text>
  <text x="672" y="326" fill="#e0645c" font-size="11">2 RTT</text>
  <line x1="45" y1="352" x2="745" y2="352" stroke="#8a8a8a" stroke-width="1"/>
  <text x="55" y="376" fill="#8a8a8a" font-size="11">Each object on a fresh connection costs TWO round trips: one for the handshake, one for the request.</text>
  <text x="55" y="394" fill="#8a8a8a" font-size="11">A persistent connection pays the handshake once, and pipelining collapses the three requests into one round.</text>
  <text x="55" y="420" fill="#e0645c" font-size="11">Nine round trips to two. On a 100 ms path that is 900 ms against 200 ms, for identical bytes.</text>
</svg>
