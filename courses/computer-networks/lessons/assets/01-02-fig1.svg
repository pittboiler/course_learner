  <rect x="343.33333333333337" y="70" width="57.333333333333336" height="22" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.16"/>
  <text x="372.00000000000006" y="86" fill="#4a90d9" font-size="9.5" text-anchor="middle">GET</text>
  <rect x="406.6666666666667" y="70" width="57.333333333333336" height="22" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.16"/>
  <text x="435.33333333333337" y="86" fill="#4a90d9" font-size="9.5" text-anchor="middle">SYN</text>
  <rect x="470.0" y="70" width="57.333333333333336" height="22" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.16"/>
