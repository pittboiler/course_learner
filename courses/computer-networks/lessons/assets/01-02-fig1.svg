<svg viewBox="0 0 790 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">Same page, same server, same objects. The difference is how many round trips you spend asking.</text>
  <text x="55" y="60" fill="#e0645c" font-size="11.5">non-persistent HTTP, no parallel connections</text>
  <line x1="90" y1="80" x2="660" y2="80" stroke="#8a8a8a" stroke-width="1"/>
  <rect x="90.0" y="70" width="57.333333333333336" height="22" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.3" rx="3" opacity="0.16"/>
