  <rect x="153.33333333333334" y="70" width="57.333333333333336" height="22" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.16"/>
  <text x="182.0" y="86" fill="#4a90d9" font-size="9.5" text-anchor="middle">SYN</text>
