<svg viewBox="0 0 790 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">A can hear the access point and B cannot hear A. Carrier sense fails because senses differ by position.</text>
  <circle cx="180" cy="150" r="24" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.7"/>
  <text x="180" y="155" fill="#4a90d9" font-size="12" text-anchor="middle">A</text>
  <circle cx="395" cy="150" r="24" fill="#e0645c" stroke="#e0645c" stroke-width="1.7"/>
  <text x="395" y="155" fill="#e0645c" font-size="12" text-anchor="middle">AP</text>
  <circle cx="610" cy="150" r="24" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.7"/>
  <text x="610" y="155" fill="#4a90d9" font-size="12" text-anchor="middle">B</text>
  <circle cx="180" cy="150" r="150" fill="none" stroke="#4a90d9" stroke-width="1.2"/>
  <circle cx="610" cy="150" r="150" fill="none" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="180" y="318" fill="#4a90d9" font-size="10" text-anchor="middle">A's range</text>
  <text x="610" y="318" fill="#4a90d9" font-size="10" text-anchor="middle">B's range</text>
  <text x="395" y="318" fill="#e0645c" font-size="10" text-anchor="middle">both reach the AP; neither reaches the other</text>
  <line x1="45" y1="336" x2="745" y2="336" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="358" fill="#8a8a8a" font-size="10.5">A senses the channel: idle, because B is out of range. B senses: idle, for the same reason. Both</text>
  <text x="60" y="376" fill="#e0645c" font-size="10.5">transmit, and the frames COLLIDE at the access point, which is the only place that matters.</text>
  <text x="60" y="398" fill="#8a8a8a" font-size="10.5">Neither sender can detect it - a wireless radio cannot hear while it transmits, so CSMA/CD's core</text>
  <text x="60" y="416" fill="#4a90d9" font-size="10.5">mechanism is unavailable. 802.11 uses CSMA/CA: avoid collisions, and reserve with RTS/CTS.</text>
</svg>
