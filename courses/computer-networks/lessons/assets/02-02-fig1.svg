<svg viewBox="0 0 790 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">The channel is the same. The difference is how many packets are allowed to be in flight.</text>
  <text x="60" y="60" fill="#e0645c" font-size="11.5">stop and wait: one packet, then wait a full round trip</text>
  <line x1="120" y1="70" x2="120" y2="180" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="640" y1="70" x2="640" y2="180" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="120" y="68" fill="#8a8a8a" font-size="10" text-anchor="middle">sender</text>
  <text x="640" y="68" fill="#8a8a8a" font-size="10" text-anchor="middle">receiver</text>
  <text x="660" y="110" fill="#e0645c" font-size="10" text-anchor="end">utilisation</text>
  <line x1="124" y1="84" x2="636" y2="114" stroke="#4a90d9" stroke-width="1.4"/>
  <line x1="636" y1="120" x2="128" y2="152" stroke="#e0645c" stroke-width="1.4"/>
  <text x="660" y="126" fill="#e0645c" font-size="10" text-anchor="end">(L/R) / (RTT + L/R)</text>
  <text x="60" y="210" fill="#e0645c" font-size="11.5">pipelined: a window of packets in flight at once</text>
  <line x1="120" y1="220" x2="120" y2="330" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="640" y1="220" x2="640" y2="330" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="120" y="218" fill="#8a8a8a" font-size="10" text-anchor="middle">sender</text>
  <text x="640" y="218" fill="#8a8a8a" font-size="10" text-anchor="middle">receiver</text>
  <text x="660" y="260" fill="#e0645c" font-size="10" text-anchor="end">utilisation</text>
  <line x1="124" y1="234" x2="636" y2="264" stroke="#4a90d9" stroke-width="1.4"/>
  <line x1="636" y1="270" x2="128" y2="302" stroke="#e0645c" stroke-width="1.4"/>
  <line x1="134" y1="238" x2="636" y2="268" stroke="#4a90d9" stroke-width="1.4"/>
  <line x1="636" y1="274" x2="138" y2="306" stroke="#e0645c" stroke-width="1.4"/>
  <line x1="144" y1="242" x2="636" y2="272" stroke="#4a90d9" stroke-width="1.4"/>
  <line x1="636" y1="278" x2="148" y2="310" stroke="#e0645c" stroke-width="1.4"/>
  <text x="660" y="276" fill="#e0645c" font-size="10" text-anchor="end">N (L/R) / (RTT + L/R)</text>
  <line x1="45" y1="352" x2="745" y2="352" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="376" fill="#8a8a8a" font-size="11">1000-byte packets, a 1 Gb/s link, a 30 ms round trip. Transmission is 8 us and the round trip is 30 ms,</text>
  <text x="60" y="394" fill="#e0645c" font-size="11">so stop-and-wait keeps the link busy 0.027 percent of the time - 267 kb/s out of a gigabit.</text>
  <text x="60" y="418" fill="#4a90d9" font-size="11">To fill the pipe you need (RTT + L/R) / (L/R) = 3751 packets in flight. That number is why TCP has a window.</text>
</svg>
