  <text x="238.23529411764707" y="362" fill="#8a8a8a" font-size="9.5" text-anchor="middle">10</text>
  <line x1="402.94117647058823" y1="340" x2="402.94117647058823" y2="346" stroke="#8a8a8a" stroke-width="1"/>
  <text x="402.94117647058823" y="362" fill="#8a8a8a" font-size="9.5" text-anchor="middle">20</text>
  <line x1="567.6470588235294" y1="340" x2="567.6470588235294" y2="346" stroke="#8a8a8a" stroke-width="1"/>
  <text x="567.6470588235294" y="362" fill="#8a8a8a" font-size="9.5" text-anchor="middle">30</text>
  <line x1="650.0" y1="340" x2="650.0" y2="346" stroke="#8a8a8a" stroke-width="1"/>
  <text x="650.0" y="362" fill="#8a8a8a" font-size="9.5" text-anchor="middle">35</text>
  <line x1="84" y1="340.0" x2="90" y2="340.0" stroke="#8a8a8a" stroke-width="1"/>
  <text x="80" y="344.0" fill="#8a8a8a" font-size="9.5" text-anchor="end">0k</text>
  <line x1="84" y1="262.8571428571429" x2="90" y2="262.8571428571429" stroke="#8a8a8a" stroke-width="1"/>
  <text x="80" y="266.8571428571429" fill="#8a8a8a" font-size="9.5" text-anchor="end">5k</text>
  <line x1="84" y1="185.71428571428572" x2="90" y2="185.71428571428572" stroke="#8a8a8a" stroke-width="1"/>
  <text x="80" y="189.71428571428572" fill="#8a8a8a" font-size="9.5" text-anchor="end">10k</text>
  <line x1="84" y1="108.57142857142858" x2="90" y2="108.57142857142858" stroke="#8a8a8a" stroke-width="1"/>
  <text x="80" y="112.57142857142858" fill="#8a8a8a" font-size="9.5" text-anchor="end">15k</text>
  <text x="370.0" y="384" fill="#8a8a8a" font-size="10.5" text-anchor="middle">number of clients N</text>
  <text x="80" y="52" fill="#8a8a8a" font-size="10.5">distribution time (seconds)</text>
  <path d="M 90.0,224.3 L 106.5,224.3 L 122.9,224.3 L 139.4,224.3 L 155.9,224.3 L 172.4,224.3 L 188.8,224.3 L 205.3,224.3 L 221.8,224.3 L 238.2,224.3 L 254.7,224.3 L 271.2,224.3 L 287.6,224.3 L 304.1,224.3 L 320.6,224.3 L 337.1,216.6 L 353.5,208.9 L 370.0,201.1 L 386.5,193.4 L 402.9,185.7 L 419.4,178.0 L 435.9,170.3 L 452.4,162.6 L 468.8,154.9 L 485.3,147.1 L 501.8,139.4 L 518.2,131.7 L 534.7,124.0 L 551.2,116.3 L 567.6,108.6 L 584.1,100.9 L 600.6,93.1 L 617.1,85.4 L 633.5,77.7 L 650.0,70.0" fill="none" stroke="#e0645c" stroke-width="2"/>
  <path d="M 90.0,224.3 L 106.5,224.3 L 122.9,224.3 L 139.4,224.3 L 155.9,224.3 L 172.4,224.3 L 188.8,224.3 L 205.3,224.3 L 221.8,224.3 L 238.2,224.3 L 254.7,224.3 L 271.2,224.3 L 287.6,224.3 L 304.1,224.3 L 320.6,224.3 L 337.1,224.3 L 353.5,224.3 L 370.0,224.3 L 386.5,224.3 L 402.9,224.3 L 419.4,224.3 L 435.9,224.3 L 452.4,224.3 L 468.8,224.3 L 485.3,224.3 L 501.8,224.3 L 518.2,224.3 L 534.7,224.3 L 551.2,224.3 L 567.6,224.3 L 584.1,222.4 L 600.6,220.6 L 617.1,218.8 L 633.5,217.1 L 650.0,215.4" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="573.6470588235294" y="102.57142857142858" fill="#e0645c" font-size="10.5">client-server</text>
  <text x="573.6470588235294" y="216.28571428571428" fill="#4a90d9" font-size="10.5">peer-to-peer</text>
  <text x="55" y="372" fill="#8a8a8a" font-size="10.5">F = 15 Gb file, server uplink 30 Mb/s, each client downlink 2 Mb/s and uplink 1 Mb/s.</text>
  <text x="55" y="392" fill="#e0645c" font-size="10.5">Client-server is bounded below by N*F/u_s - the server must push every copy itself, so time is LINEAR in N.</text>
  <text x="55" y="412" fill="#4a90d9" font-size="10.5">Peer-to-peer divides by u_s + sum of peer uplinks, which grows with N, so the curve flattens instead.</text>
</svg>
