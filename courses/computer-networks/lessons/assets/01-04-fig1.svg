<svg viewBox="0 0 790 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">Client-server time grows with the crowd. Peer-to-peer time does not, because the crowd brings capacity.</text>
  <line x1="90" y1="340" x2="650" y2="340" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="90" y1="340" x2="90" y2="60" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="90.0" y1="340" x2="90.0" y2="346" stroke="#8a8a8a" stroke-width="1"/>
  <text x="90.0" y="362" fill="#8a8a8a" font-size="9.5" text-anchor="middle">1</text>
