<svg viewBox="0 0 790 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">The router reads the network header and nothing inside it. These are the fields it acts on.</text>
  <text x="60" y="60" fill="#e0645c" font-size="11.5">IPv4 header, the fields that do work</text>
  <rect x="60" y="72" width="60" height="26" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.3" rx="3" opacity="0.1"/>
  <text x="90.0" y="90" fill="#8a8a8a" font-size="9.5" text-anchor="middle">version</text>
  <rect x="120" y="72" width="80" height="26" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.3" rx="3" opacity="0.1"/>
  <text x="160.0" y="90" fill="#8a8a8a" font-size="9.5" text-anchor="middle">header len</text>
  <rect x="200" y="72" width="150" height="26" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.3" rx="3" opacity="0.1"/>
  <text x="275.0" y="90" fill="#8a8a8a" font-size="9.5" text-anchor="middle">total length</text>
  <rect x="60" y="102" width="140" height="26" fill="#e0645c" stroke="#e0645c" stroke-width="1.3" rx="3" opacity="0.15"/>
  <text x="130.0" y="120" fill="#e0645c" font-size="9.5" text-anchor="middle">identification</text>
  <rect x="200" y="102" width="60" height="26" fill="#e0645c" stroke="#e0645c" stroke-width="1.3" rx="3" opacity="0.15"/>
  <text x="230.0" y="120" fill="#e0645c" font-size="9.5" text-anchor="middle">flags</text>
  <rect x="260" y="102" width="150" height="26" fill="#e0645c" stroke="#e0645c" stroke-width="1.3" rx="3" opacity="0.15"/>
  <text x="335.0" y="120" fill="#e0645c" font-size="9.5" text-anchor="middle">fragment offset</text>
  <rect x="60" y="132" width="60" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.13"/>
  <text x="90.0" y="150" fill="#4a90d9" font-size="9.5" text-anchor="middle">TTL</text>
  <rect x="120" y="132" width="80" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.13"/>
  <text x="160.0" y="150" fill="#4a90d9" font-size="9.5" text-anchor="middle">protocol</text>
  <rect x="200" y="132" width="150" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.13"/>
  <text x="275.0" y="150" fill="#4a90d9" font-size="9.5" text-anchor="middle">header checksum</text>
  <rect x="60" y="162" width="290" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.13"/>
  <text x="205" y="180" fill="#4a90d9" font-size="10" text-anchor="middle">source address</text>
  <rect x="60" y="192" width="290" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.13"/>
  <text x="205" y="210" fill="#4a90d9" font-size="10" text-anchor="middle">destination address</text>
  <text x="60" y="238" fill="#8a8a8a" font-size="10">TTL decremented at every hop; at 0 the datagram is dropped</text>
  <text x="60" y="254" fill="#8a8a8a" font-size="10">protocol says which transport is inside: 6 is TCP, 17 is UDP</text>
  <text x="60" y="270" fill="#8a8a8a" font-size="10">the checksum covers the HEADER only, and is recomputed each hop</text>
  <line x1="400" y1="58" x2="400" y2="286" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="430" y="60" fill="#e0645c" font-size="11.5">fragmenting 4000 bytes for an MTU of 1500</text>
  <rect x="430" y="74" width="300" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" rx="3" opacity="0.14"/>
  <text x="580" y="92" fill="#4a90d9" font-size="10" text-anchor="middle">one datagram: 20 hdr + 3980 data</text>
  <rect x="430" y="118" width="300" height="36" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" rx="3" opacity="0.14"/>
  <text x="440" y="133" fill="#e0645c" font-size="10">20 hdr + 1480 data</text>
  <text x="440" y="149" fill="#8a8a8a" font-size="9.5">offset 0   MF=1</text>
  <text x="722" y="133" fill="#e0645c" font-size="10" text-anchor="end">len 1500</text>
  <rect x="430" y="164" width="300" height="36" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" rx="3" opacity="0.14"/>
  <text x="440" y="179" fill="#e0645c" font-size="10">20 hdr + 1480 data</text>
  <text x="440" y="195" fill="#8a8a8a" font-size="9.5">offset 185   MF=1</text>
  <text x="722" y="179" fill="#e0645c" font-size="10" text-anchor="end">len 1500</text>
  <rect x="430" y="210" width="300" height="36" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" rx="3" opacity="0.14"/>
  <text x="440" y="225" fill="#e0645c" font-size="10">20 hdr + 1020 data</text>
  <text x="440" y="241" fill="#8a8a8a" font-size="9.5">offset 370   MF=0</text>
  <text x="722" y="225" fill="#e0645c" font-size="10" text-anchor="end">len 1040</text>
  <text x="430" y="272" fill="#8a8a8a" font-size="10">offset is counted in EIGHT-byte units, so 1480/8 = 185</text>
  <line x1="45" y1="300" x2="745" y2="300" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="324" fill="#e0645c" font-size="11">FORWARDING is the per-packet action at one router: look up the destination, send it out an interface.</text>
  <text x="60" y="342" fill="#8a8a8a" font-size="11">It happens in nanoseconds, in hardware, millions of times a second. That is the DATA PLANE.</text>
  <text x="60" y="370" fill="#e0645c" font-size="11">ROUTING is deciding what those lookup tables should contain, by talking to other routers.</text>
  <text x="60" y="388" fill="#8a8a8a" font-size="11">It happens in seconds, in software, when the topology changes. That is the CONTROL PLANE.</text>
  <text x="60" y="416" fill="#4a90d9" font-size="11">Reassembly happens only at the DESTINATION, never at an intermediate router - so a router that</text>
  <text x="60" y="434" fill="#4a90d9" font-size="11">fragments never sees the pieces again, and a lost fragment costs the whole datagram.</text>
</svg>
