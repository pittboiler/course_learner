<svg viewBox="0 0 790 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">A CRC is polynomial long division over GF(2): subtraction is XOR, and there are no carries.</text>
  <text x="60" y="62" fill="#e0645c" font-size="11.5">data 101110, generator 1001 (degree 3), so append three zeros and divide</text>
  <text x="110.0" y="92" fill="#8a8a8a" text-anchor="middle">1</text>
  <text x="123.0" y="92" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="136.0" y="92" fill="#8a8a8a" text-anchor="middle">1</text>
  <text x="149.0" y="92" fill="#8a8a8a" text-anchor="middle">1</text>
  <text x="162.0" y="92" fill="#8a8a8a" text-anchor="middle">1</text>
  <text x="175.0" y="92" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="188.0" y="92" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="201.0" y="92" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="214.0" y="92" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="252.8" y="92" fill="#8a8a8a" font-size="10">augmented dividend</text>
  <text x="110.0" y="120" fill="#4a90d9" text-anchor="middle">1</text>
  <text x="123.0" y="120" fill="#4a90d9" text-anchor="middle">0</text>
  <text x="136.0" y="120" fill="#4a90d9" text-anchor="middle">0</text>
  <text x="149.0" y="120" fill="#4a90d9" text-anchor="middle">1</text>
  <text x="252.8" y="120" fill="#8a8a8a" font-size="10">XOR, aligned at bit 0</text>
  <line x1="103.5" y1="126" x2="155.5" y2="126" stroke="#8a8a8a" stroke-width="1"/>
  <text x="110.0" y="148" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="123.0" y="148" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="136.0" y="148" fill="#8a8a8a" text-anchor="middle">1</text>
  <text x="149.0" y="148" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="162.0" y="148" fill="#8a8a8a" text-anchor="middle">1</text>
  <text x="175.0" y="148" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="188.0" y="148" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="201.0" y="148" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="214.0" y="148" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="252.8" y="148" fill="#8a8a8a" font-size="10">result</text>
  <text x="136.0" y="176" fill="#4a90d9" text-anchor="middle">1</text>
  <text x="149.0" y="176" fill="#4a90d9" text-anchor="middle">0</text>
  <text x="162.0" y="176" fill="#4a90d9" text-anchor="middle">0</text>
  <text x="175.0" y="176" fill="#4a90d9" text-anchor="middle">1</text>
  <text x="252.8" y="176" fill="#8a8a8a" font-size="10">XOR, aligned at bit 2</text>
  <line x1="129.5" y1="182" x2="181.5" y2="182" stroke="#8a8a8a" stroke-width="1"/>
  <text x="110.0" y="204" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="123.0" y="204" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="136.0" y="204" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="149.0" y="204" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="162.0" y="204" fill="#8a8a8a" text-anchor="middle">1</text>
  <text x="175.0" y="204" fill="#8a8a8a" text-anchor="middle">1</text>
  <text x="188.0" y="204" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="201.0" y="204" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="214.0" y="204" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="252.8" y="204" fill="#8a8a8a" font-size="10">result</text>
  <text x="162.0" y="232" fill="#4a90d9" text-anchor="middle">1</text>
  <text x="175.0" y="232" fill="#4a90d9" text-anchor="middle">0</text>
  <text x="188.0" y="232" fill="#4a90d9" text-anchor="middle">0</text>
  <text x="201.0" y="232" fill="#4a90d9" text-anchor="middle">1</text>
  <text x="252.8" y="232" fill="#8a8a8a" font-size="10">XOR, aligned at bit 4</text>
  <line x1="155.5" y1="238" x2="207.5" y2="238" stroke="#8a8a8a" stroke-width="1"/>
  <text x="110.0" y="260" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="123.0" y="260" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="136.0" y="260" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="149.0" y="260" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="162.0" y="260" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="175.0" y="260" fill="#8a8a8a" text-anchor="middle">1</text>
  <text x="188.0" y="260" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="201.0" y="260" fill="#8a8a8a" text-anchor="middle">1</text>
  <text x="214.0" y="260" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="252.8" y="260" fill="#8a8a8a" font-size="10">result</text>
  <text x="175.0" y="288" fill="#4a90d9" text-anchor="middle">1</text>
  <text x="188.0" y="288" fill="#4a90d9" text-anchor="middle">0</text>
  <text x="201.0" y="288" fill="#4a90d9" text-anchor="middle">0</text>
  <text x="214.0" y="288" fill="#4a90d9" text-anchor="middle">1</text>
  <text x="252.8" y="288" fill="#8a8a8a" font-size="10">XOR, aligned at bit 5</text>
  <line x1="168.5" y1="294" x2="220.5" y2="294" stroke="#8a8a8a" stroke-width="1"/>
  <text x="110.0" y="316" fill="#e0645c" text-anchor="middle">0</text>
  <text x="123.0" y="316" fill="#e0645c" text-anchor="middle">0</text>
  <text x="136.0" y="316" fill="#e0645c" text-anchor="middle">0</text>
  <text x="149.0" y="316" fill="#e0645c" text-anchor="middle">0</text>
  <text x="162.0" y="316" fill="#e0645c" text-anchor="middle">0</text>
  <text x="175.0" y="316" fill="#e0645c" text-anchor="middle">0</text>
  <text x="188.0" y="316" fill="#e0645c" text-anchor="middle">0</text>
  <text x="201.0" y="316" fill="#e0645c" text-anchor="middle">1</text>
  <text x="214.0" y="316" fill="#e0645c" text-anchor="middle">1</text>
  <text x="252.8" y="316" fill="#8a8a8a" font-size="10">remainder in the low 3 bits</text>
  <text x="60" y="352" fill="#8a8a8a" font-size="10">the bits skipped over are positions where the leading bit was already 0</text>
  <text x="60" y="378" fill="#e0645c" font-size="12">transmit   101110 011</text>
  <line x1="45" y1="396" x2="745" y2="396" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="420" fill="#8a8a8a" font-size="11">The receiver divides the whole received word by the same generator. Zero remainder means accept.</text>
  <text x="60" y="438" fill="#8a8a8a" font-size="11">Appending the remainder makes the transmitted word an exact multiple of the generator, so a clean</text>
  <text x="60" y="456" fill="#8a8a8a" font-size="11">frame always divides evenly and no table of expected values is needed anywhere.</text>
</svg>
