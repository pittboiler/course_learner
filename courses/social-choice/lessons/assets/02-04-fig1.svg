<text x="171" y="256" font-size="11" text-anchor="middle" fill="#333333">majority: 9 of 17</text>
<text x="410" y="58" font-size="12" text-anchor="start" fill="#333333">After: 6 A&gt;C&gt;B, 2 A&gt;B&gt;C, 4 B&gt;C&gt;A, 5 C&gt;A&gt;B</text>
<line x1="551" y1="92" x2="551" y2="240" stroke="#333333" stroke-width="1" stroke-dasharray="4,3"/>
