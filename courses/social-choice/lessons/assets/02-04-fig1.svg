<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<rect x="0" y="0" width="780" height="300" fill="#ffffff"/>
<text x="390" y="24" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">Instant runoff, 17 voters: before and after two voters raise A</text>
