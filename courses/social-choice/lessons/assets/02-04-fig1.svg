<text x="551" y="256" font-size="11" text-anchor="middle" fill="#333333">majority: 9 of 17</text>
<text x="390" y="290" font-size="12" text-anchor="middle" fill="#111111">Moving A up eliminates B instead of C, and C beats A head to head, 9 to 8.</text>
