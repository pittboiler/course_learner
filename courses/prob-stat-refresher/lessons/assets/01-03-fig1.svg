<svg viewBox="0 0 620 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- ===================== LEFT PANEL: pmf (bars) ===================== -->
  <text x="70" y="32" fill="#4a90d9" font-weight="bold">pmf  p(x) = P(X = x)</text>

  <!-- axes -->
  <line x1="60" y1="290" x2="300" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="60" y1="60"  x2="60"  y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="46" y="95" fill="#8a8a8a">1</text>
  <line x1="55" y1="90" x2="60" y2="90" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- bars: heights = probabilities 0.2, 0.4, 0.3, 0.1 -->
  <rect x="75"  y="250" width="30" height="40" fill="#4a90d9" opacity="0.30" stroke="#4a90d9" stroke-width="2"/>
  <rect x="125" y="210" width="30" height="80" fill="#4a90d9" opacity="0.30" stroke="#4a90d9" stroke-width="2"/>
  <rect x="175" y="230" width="30" height="60" fill="#4a90d9" opacity="0.30" stroke="#4a90d9" stroke-width="2"/>
  <rect x="225" y="270" width="30" height="20" fill="#4a90d9" opacity="0.30" stroke="#4a90d9" stroke-width="2"/>

  <!-- bar value labels (x-axis) -->
  <text x="86"  y="308" fill="#8a8a8a">1</text>
  <text x="136" y="308" fill="#8a8a8a">2</text>
  <text x="186" y="308" fill="#8a8a8a">3</text>
  <text x="236" y="308" fill="#8a8a8a">4</text>
  <text x="292" y="308" fill="#8a8a8a">x</text>

  <!-- probability labels atop bars -->
  <text x="74"  y="244" fill="#4a90d9" font-size="12">.2</text>
  <text x="124" y="204" fill="#4a90d9" font-size="12">.4</text>
  <text x="174" y="224" fill="#4a90d9" font-size="12">.3</text>
  <text x="224" y="264" fill="#4a90d9" font-size="12">.1</text>

  <text x="70" y="332" fill="#8a8a8a" font-style="italic" font-size="12">heights sum to 1</text>

  <!-- ===================== RIGHT PANEL: CDF (staircase) ===================== -->
  <text x="372" y="32" fill="#e0645c" font-weight="bold">CDF  F(x) = P(X &#8804; x)</text>

  <!-- axes -->
  <line x1="360" y1="290" x2="600" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="360" y1="60"  x2="360" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="346" y="95" fill="#8a8a8a">1</text>
  <line x1="355" y1="90" x2="360" y2="90" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- staircase horizontal treads (F = 0, .2, .6, .9, 1) -->
  <line x1="360" y1="290" x2="390" y2="290" stroke="#e0645c" stroke-width="3"/>
  <line x1="390" y1="250" x2="440" y2="250" stroke="#e0645c" stroke-width="3"/>
  <line x1="440" y1="170" x2="490" y2="170" stroke="#e0645c" stroke-width="3"/>
  <line x1="490" y1="110" x2="540" y2="110" stroke="#e0645c" stroke-width="3"/>
  <line x1="540" y1="90"  x2="595" y2="90"  stroke="#e0645c" stroke-width="3"/>

  <!-- risers (the jumps = bar heights) -->
  <line x1="390" y1="290" x2="390" y2="250" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="440" y1="250" x2="440" y2="170" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="490" y1="170" x2="490" y2="110" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="540" y1="110" x2="540" y2="90"  stroke="#e0645c" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- closed dots (value attained) -->
  <circle cx="390" cy="250" r="4" fill="#e0645c"/>
  <circle cx="440" cy="170" r="4" fill="#e0645c"/>
  <circle cx="490" cy="110" r="4" fill="#e0645c"/>
  <circle cx="540" cy="90"  r="4" fill="#e0645c"/>
  <!-- open dots (left limits, not attained) -->
  <circle cx="390" cy="290" r="4" fill="#ffffff" stroke="#e0645c" stroke-width="1.5"/>
  <circle cx="440" cy="250" r="4" fill="#ffffff" stroke="#e0645c" stroke-width="1.5"/>
  <circle cx="490" cy="170" r="4" fill="#ffffff" stroke="#e0645c" stroke-width="1.5"/>
  <circle cx="540" cy="110" r="4" fill="#ffffff" stroke="#e0645c" stroke-width="1.5"/>

  <!-- x labels -->
  <text x="386" y="308" fill="#8a8a8a">1</text>
  <text x="436" y="308" fill="#8a8a8a">2</text>
  <text x="486" y="308" fill="#8a8a8a">3</text>
  <text x="536" y="308" fill="#8a8a8a">4</text>
  <text x="592" y="308" fill="#8a8a8a">x</text>

  <text x="372" y="332" fill="#8a8a8a" font-style="italic" font-size="12">running total climbs 0 &#8594; 1; jump at x = bar height</text>
</svg>
