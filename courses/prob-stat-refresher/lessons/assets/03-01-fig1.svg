<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- ===================== PANEL A: positive correlation ===================== -->
  <text x="60" y="34" fill="#4a90d9" font-weight="bold" font-size="13">&#961; &#8776; +0.9</text>
  <text x="60" y="50" fill="#8a8a8a" font-size="12">rise together</text>

  <!-- axes -->
  <line x1="55" y1="215" x2="215" y2="215" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="55" y1="60"  x2="55"  y2="215" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="207" y="233" fill="#8a8a8a" font-size="12">X</text>
  <text x="40"  y="70"  fill="#8a8a8a" font-size="12">Y</text>

  <!-- trend line (dashed) -->
  <line x1="60" y1="208" x2="205" y2="80" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>

  <!-- points -->
  <circle cx="70"  cy="200" r="3.5" fill="#4a90d9" opacity="0.85"/>
  <circle cx="85"  cy="178" r="3.5" fill="#4a90d9" opacity="0.85"/>
  <circle cx="80"  cy="190" r="3.5" fill="#4a90d9" opacity="0.85"/>
  <circle cx="100" cy="182" r="3.5" fill="#4a90d9" opacity="0.85"/>
  <circle cx="112" cy="165" r="3.5" fill="#4a90d9" opacity="0.85"/>
  <circle cx="125" cy="170" r="3.5" fill="#4a90d9" opacity="0.85"/>
  <circle cx="138" cy="150" r="3.5" fill="#4a90d9" opacity="0.85"/>
  <circle cx="150" cy="155" r="3.5" fill="#4a90d9" opacity="0.85"/>
  <circle cx="160" cy="132" r="3.5" fill="#4a90d9" opacity="0.85"/>
  <circle cx="172" cy="138" r="3.5" fill="#4a90d9" opacity="0.85"/>
  <circle cx="185" cy="115" r="3.5" fill="#4a90d9" opacity="0.85"/>
  <circle cx="198" cy="100" r="3.5" fill="#4a90d9" opacity="0.85"/>

  <!-- ===================== PANEL B: negative correlation ===================== -->
  <text x="275" y="34" fill="#e0645c" font-weight="bold" font-size="13">&#961; &#8776; &#8722;0.9</text>
  <text x="275" y="50" fill="#8a8a8a" font-size="12">one up, other down</text>

  <!-- axes -->
  <line x1="270" y1="215" x2="430" y2="215" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="270" y1="60"  x2="270" y2="215" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="422" y="233" fill="#8a8a8a" font-size="12">X</text>
  <text x="255" y="70"  fill="#8a8a8a" font-size="12">Y</text>

  <!-- trend line (dashed) -->
  <line x1="278" y1="82" x2="420" y2="205" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>

  <!-- points -->
  <circle cx="285" cy="88"  r="3.5" fill="#e0645c" opacity="0.85"/>
  <circle cx="298" cy="105" r="3.5" fill="#e0645c" opacity="0.85"/>
  <circle cx="292" cy="95"  r="3.5" fill="#e0645c" opacity="0.85"/>
  <circle cx="312" cy="112" r="3.5" fill="#e0645c" opacity="0.85"/>
  <circle cx="325" cy="128" r="3.5" fill="#e0645c" opacity="0.85"/>
  <circle cx="338" cy="120" r="3.5" fill="#e0645c" opacity="0.85"/>
  <circle cx="350" cy="145" r="3.5" fill="#e0645c" opacity="0.85"/>
  <circle cx="362" cy="152" r="3.5" fill="#e0645c" opacity="0.85"/>
  <circle cx="375" cy="140" r="3.5" fill="#e0645c" opacity="0.85"/>
  <circle cx="388" cy="168" r="3.5" fill="#e0645c" opacity="0.85"/>
  <circle cx="400" cy="180" r="3.5" fill="#e0645c" opacity="0.85"/>
  <circle cx="413" cy="195" r="3.5" fill="#e0645c" opacity="0.85"/>

  <!-- ===================== PANEL C: near-zero correlation ===================== -->
  <text x="490" y="34" fill="#8a8a8a" font-weight="bold" font-size="13">&#961; &#8776; 0</text>
  <text x="490" y="50" fill="#8a8a8a" font-size="12">no linear trend</text>

  <!-- axes -->
  <line x1="485" y1="215" x2="625" y2="215" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="485" y1="60"  x2="485" y2="215" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="617" y="233" fill="#8a8a8a" font-size="12">X</text>
  <text x="470" y="70"  fill="#8a8a8a" font-size="12">Y</text>

  <!-- flat "no slope" line (dashed) -->
  <line x1="492" y1="140" x2="618" y2="140" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- points -->
  <circle cx="512" cy="120" r="3.5" fill="#8a8a8a" opacity="0.85"/>
  <circle cx="528" cy="152" r="3.5" fill="#8a8a8a" opacity="0.85"/>
  <circle cx="542" cy="115" r="3.5" fill="#8a8a8a" opacity="0.85"/>
  <circle cx="556" cy="145" r="3.5" fill="#8a8a8a" opacity="0.85"/>
  <circle cx="568" cy="128" r="3.5" fill="#8a8a8a" opacity="0.85"/>
  <circle cx="538" cy="138" r="3.5" fill="#8a8a8a" opacity="0.85"/>
  <circle cx="575" cy="158" r="3.5" fill="#8a8a8a" opacity="0.85"/>
  <circle cx="560" cy="110" r="3.5" fill="#8a8a8a" opacity="0.85"/>
  <circle cx="548" cy="165" r="3.5" fill="#8a8a8a" opacity="0.85"/>
  <circle cx="580" cy="135" r="3.5" fill="#8a8a8a" opacity="0.85"/>
  <circle cx="520" cy="140" r="3.5" fill="#8a8a8a" opacity="0.85"/>
  <circle cx="565" cy="148" r="3.5" fill="#8a8a8a" opacity="0.85"/>

  <!-- caption -->
  <text x="60" y="278" fill="#8a8a8a" font-style="italic" font-size="12">Covariance sets the sign; correlation &#961; rescales it to [&#8722;1, 1]. Panel C is uncorrelated &#8212; which alone does not mean independent.</text>
</svg>
