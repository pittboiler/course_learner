<svg viewBox="0 0 580 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="24" y="26" fill="#8a8a8a" font-style="italic">10,000 people, split by disease then by test result — the base rate hides in the branch widths.</text>

  <!-- branches: root -> level 1 -->
  <line x1="70" y1="185" x2="220" y2="95" stroke="#e0645c" stroke-width="2"/>
  <line x1="70" y1="185" x2="220" y2="275" stroke="#4a90d9" stroke-width="2"/>

  <!-- branches: Disease -> leaves -->
  <line x1="235" y1="95" x2="405" y2="55" stroke="#e0645c" stroke-width="2"/>
  <line x1="235" y1="95" x2="405" y2="135" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- branches: Healthy -> leaves -->
  <line x1="235" y1="275" x2="405" y2="235" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="235" y1="275" x2="405" y2="315" stroke="#4a90d9" stroke-width="2"/>

  <!-- branch probability labels -->
  <text x="118" y="126" fill="#8a8a8a">prior 0.01</text>
  <text x="118" y="245" fill="#8a8a8a">prior 0.99</text>
  <text x="300" y="60" fill="#8a8a8a">0.99 sens.</text>
  <text x="300" y="120" fill="#8a8a8a">0.01</text>
  <text x="300" y="222" fill="#8a8a8a">0.05</text>
  <text x="300" y="308" fill="#8a8a8a">0.95 spec.</text>

  <!-- root node -->
  <circle cx="70" cy="185" r="6" fill="#8a8a8a"/>
  <text x="24" y="190" fill="#8a8a8a">10,000</text>

  <!-- level-1 nodes -->
  <circle cx="228" cy="95" r="6" fill="#e0645c"/>
  <text x="150" y="82" fill="#e0645c">disease · 100</text>
  <circle cx="228" cy="275" r="6" fill="#4a90d9"/>
  <text x="146" y="292" fill="#4a90d9">healthy · 9,900</text>

  <!-- leaf boxes -->
  <!-- true positives (highlighted) -->
  <rect x="412" y="40" width="128" height="30" rx="4" fill="#e0645c" opacity="0.18" stroke="#e0645c" stroke-width="1.5"/>
  <text x="420" y="60" fill="#e0645c">test + · 99</text>
  <!-- false negatives -->
  <rect x="412" y="120" width="128" height="30" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <text x="420" y="140" fill="#8a8a8a">test − · 1</text>
  <!-- false positives (highlighted) -->
  <rect x="412" y="220" width="128" height="30" rx="4" fill="#e0645c" opacity="0.18" stroke="#e0645c" stroke-width="1.5"/>
  <text x="420" y="240" fill="#e0645c">test + · 495</text>
  <!-- true negatives -->
  <rect x="412" y="300" width="128" height="30" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <text x="420" y="320" fill="#8a8a8a">test − · 9,405</text>

  <!-- posterior callout -->
  <text x="150" y="352" fill="#e0645c">P(disease | +) = 99 / (99 + 495) = 99/594 &#8776; 16.7%</text>
</svg>
