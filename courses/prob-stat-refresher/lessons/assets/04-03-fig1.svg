<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- left rejection tail: z < -1.96 -->
  <path d="M 182.2 249.3 L 180 251.6 L 166.25 263.3 L 152.5 270.8 L 138.75 275.2 L 125 277.7 L 114 278.75 L 114 280 L 182.2 280 Z"
        fill="#e0645c" opacity="0.30"/>
  <!-- right rejection tail: z > 1.96 -->
  <path d="M 397.8 249.3 L 400 251.6 L 413.75 263.3 L 427.5 270.8 L 441.25 275.2 L 455 277.7 L 466 278.75 L 466 280 L 397.8 280 Z"
        fill="#e0645c" opacity="0.30"/>

  <!-- p-value tail: area beyond the observed statistic z = 2.4 -->
  <path d="M 422 268.2 L 427.5 270.8 L 441.25 275.2 L 455 277.7 L 466 278.75 L 466 280 L 422 280 Z"
        fill="#e0645c" opacity="0.55"/>

  <!-- baseline axis -->
  <line x1="40" y1="280" x2="540" y2="280" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="540,280 530,275 530,285" fill="#8a8a8a"/>
  <text x="544" y="285" fill="#8a8a8a">z</text>

  <!-- null sampling distribution: standard normal bell -->
  <path d="M 114 278.75 L 125 277.7 L 138.75 275.2 L 152.5 270.8 L 166.25 263.3 L 180 251.6 L 193.75 234.6 L 207.5 211.8 L 221.25 183.9 L 235 152.6 L 248.75 121.5 L 262.5 94.7 L 276.25 76.5 L 290 70 L 303.75 76.5 L 317.5 94.7 L 331.25 121.5 L 345 152.6 L 358.75 183.9 L 372.5 211.8 L 386.25 234.6 L 400 251.6 L 413.75 263.3 L 427.5 270.8 L 441.25 275.2 L 455 277.7 L 466 278.75"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- critical-value droplines at +/- 1.96 -->
  <line x1="182.2" y1="249.3" x2="182.2" y2="280" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="397.8" y1="249.3" x2="397.8" y2="280" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="163" y="296" fill="#8a8a8a">&#8722;1.96</text>
  <text x="386" y="296" fill="#8a8a8a">1.96</text>
  <text x="286" y="296" fill="#8a8a8a">0</text>

  <!-- observed statistic marker at z = 2.4 -->
  <line x1="422" y1="150" x2="422" y2="280" stroke="#c8362f" stroke-width="2"/>
  <circle cx="422" cy="150" r="4" fill="#c8362f"/>
  <text x="426" y="146" fill="#c8362f">observed z</text>

  <!-- region labels -->
  <text x="120" y="235" fill="#e0645c">reject H&#8320;</text>
  <text x="404" y="228" fill="#e0645c">reject H&#8320;</text>
  <text x="235" y="200" fill="#4a90d9">retain H&#8320;</text>

  <!-- caption -->
  <text x="60" y="30" fill="#8a8a8a" font-style="italic">Assume H&#8320;: this bell is where z should land. Shaded ends = the 5% rejection region;</text>
  <text x="60" y="48" fill="#8a8a8a" font-style="italic">the darker tail beyond the observed z is the p-value. Land too far out, and disbelieve H&#8320;.</text>
</svg>
