<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- shrinking +/- sigma/sqrt(n) band around mu -->
  <path d="M 95 45 L 110 65 L 130 82 L 155 94 L 185 103 L 220 110 L 260 116 L 305 121 L 355 125 L 410 129 L 465 132 L 524 135
           L 524 185 L 465 188 L 410 191 L 355 195 L 305 199 L 260 204 L 220 210 L 185 217 L 155 226 L 130 238 L 110 255 L 95 275 Z"
        fill="#e0645c" opacity="0.15"/>

  <!-- axes -->
  <line x1="30" y1="300" x2="540" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="60" y1="18" x2="60" y2="322" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="540,300 530,295 530,305" fill="#8a8a8a"/>
  <polygon points="60,18 55,28 65,28" fill="#8a8a8a"/>
  <text x="546" y="305" fill="#8a8a8a">n</text>

  <!-- mu reference line -->
  <line x1="60" y1="160" x2="524" y2="160" stroke="#5a5a5a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="165" fill="#5a5a5a">&#956;</text>

  <!-- running sample mean: jittery, converging -->
  <path d="M 95 90 L 103 225 L 110 110 L 120 200 L 130 130 L 142 205 L 155 135 L 170 190 L 185 140 L 200 185
           L 220 148 L 240 178 L 260 150 L 285 172 L 305 152 L 330 170 L 355 155 L 385 167 L 410 157 L 440 165
           L 465 158 L 495 163 L 524 159"
        fill="none" stroke="#4a90d9" stroke-width="2"/>

  <!-- labels -->
  <text x="250" y="118" fill="#4a90d9">running sample mean  X&#772;&#8345;</text>
  <text x="250" y="264" fill="#e0645c">&#177; &#963;/&#8730;n band &#8212; shrinks like 1/&#8730;n</text>

  <!-- caption -->
  <text x="80" y="38" fill="#8a8a8a" font-style="italic">Independent noise cancels: the average settles onto &#956;, its uncertainty falling as &#963;/&#8730;n.</text>
</svg>
