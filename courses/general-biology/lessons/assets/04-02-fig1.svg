<svg viewBox="0 0 620 370" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Nothing changes unless something acts - and what acts leaves a signature.</text>
  <text x="34.0" y="58.0" fill="#4a90d9" font-size="12">Hardy-Weinberg: the null model</text>
  <text x="34.0" y="80.0" fill="#8a8a8a" font-size="10">If nothing acts, frequencies stay put:</text>
  <rect x="34.0" y="96.0" width="96.5" height="40.0" rx="3" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.2"/>
  <text x="82.2" y="121.0" fill="#4a90d9" font-size="12" text-anchor="middle">BB</text>
  <text x="82.2" y="154.0" fill="#8a8a8a" font-size="10" text-anchor="middle">0.36</text>
  <rect x="130.5" y="96.0" width="128.6" height="40.0" rx="3" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.2"/>
  <text x="194.8" y="121.0" fill="#e0645c" font-size="12" text-anchor="middle">Bb</text>
  <text x="194.8" y="154.0" fill="#8a8a8a" font-size="10" text-anchor="middle">0.48</text>
  <rect x="259.1" y="96.0" width="42.9" height="40.0" rx="3" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" opacity="0.2"/>
  <text x="280.6" y="121.0" fill="#8a8a8a" font-size="12" text-anchor="middle">bb</text>
  <text x="280.6" y="154.0" fill="#8a8a8a" font-size="10" text-anchor="middle">0.16</text>
  <text x="34.0" y="178.0" fill="#8a8a8a" font-size="11">p = 0.6, q = 0.4, and p<tspan baseline-shift="0" dy="-0.42em" font-size="0.72em">2</tspan><tspan dy="0.42em"></tspan> + 2pq + q<tspan baseline-shift="0" dy="-0.42em" font-size="0.72em">2</tspan><tspan dy="0.42em"></tspan> = 1</text>
  <text x="34.0" y="208.0" fill="#8a8a8a" font-size="10">It holds only if all five are true:</text>
  <text x="46.0" y="228.0" fill="#8a8a8a" font-size="10">- random mating</text>
  <text x="46.0" y="245.0" fill="#8a8a8a" font-size="10">- no selection</text>
  <text x="46.0" y="262.0" fill="#8a8a8a" font-size="10">- no mutation</text>
  <text x="46.0" y="279.0" fill="#8a8a8a" font-size="10">- no migration</text>
  <text x="46.0" y="296.0" fill="#8a8a8a" font-size="10">- a large population</text>
  <text x="34.0" y="326.0" fill="#e0645c" font-size="10">So a departure from these numbers is</text>
  <text x="34.0" y="342.0" fill="#e0645c" font-size="10">evidence that something is acting.</text>
  <line x1="346.0" y1="272.0" x2="600.0" y2="272.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <line x1="352.0" y1="278.0" x2="352.0" y2="74.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="338.0" y="62.0" fill="#8a8a8a" font-size="10">allele frequency</text>
  <text x="520.0" y="294.0" fill="#8a8a8a" font-size="10">generations</text>
  <path d="M 352.0 197.6 L 376.0 190.4 L 400.0 182.5 L 424.0 173.8 L 448.0 164.4 L 472.0 154.6 L 496.0 144.6 L 520.0 134.8 L 544.0 125.5 L 568.0 117.2 L 592.0 110.1" fill="none" stroke="#e0645c" stroke-width="2.8"/>
  <path d="M 352.0 197.6 L 376.0 205.0 L 400.0 190.2 L 424.0 199.5 L 448.0 184.6 L 472.0 195.7 L 496.0 175.3 L 520.0 188.3 L 544.0 201.3 L 568.0 190.2 L 592.0 197.6" fill="none" stroke="#4a90d9" stroke-width="2.4" stroke-dasharray="5 4"/>
  <text x="448.0" y="123.2" fill="#e0645c" font-size="10">selection: directional</text>
  <text x="448.0" y="216.2" fill="#4a90d9" font-size="10">drift: aimless, and</text>
  <text x="448.0" y="230.2" fill="#4a90d9" font-size="10">strongest when small</text>
  <text x="352.0" y="314.0" fill="#8a8a8a" font-size="10">Selection pushes one way; drift wanders. Both change</text>
  <text x="352.0" y="330.0" fill="#8a8a8a" font-size="10">frequencies, but only selection tracks the environment.</text>
</svg>
