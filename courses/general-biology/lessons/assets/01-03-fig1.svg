  <circle cx="96.0" cy="138.0" r="3.5" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="0" opacity="0.6"/>
  <text x="56.0" y="222.0" fill="#8a8a8a" font-size="10">no nucleus, no organelles</text>
  <ellipse cx="320.0" cy="120.0" rx="96.0" ry="72.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="2" opacity="0.1"/>
  <text x="320.0" y="36.0" fill="#4a90d9" font-size="13" text-anchor="middle">eukaryote</text>
  <text x="320.0" y="208.0" fill="#8a8a8a" font-size="10" text-anchor="middle">10 to 100 micrometres</text>
  <circle cx="310.0" cy="110.0" r="26.0" fill="#e0645c" stroke="#e0645c" stroke-width="2" opacity="0.18"/>
  <text x="310.0" y="114.0" fill="#e0645c" font-size="10" text-anchor="middle">nucleus</text>
