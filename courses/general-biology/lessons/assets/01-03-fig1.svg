  <text x="30.0" y="282.0" fill="#8a8a8a" font-size="11">Surface-to-volume falls as one over diameter, so a large cell starves at its</text>
  <text x="30.0" y="298.0" fill="#8a8a8a" font-size="11">centre - unless it folds membranes inward or flattens out.</text>
