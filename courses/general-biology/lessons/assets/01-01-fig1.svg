  <circle cx="476.7" cy="105.0" r="11.0" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="520.0" y1="130.0" x2="495.0" y2="173.3" stroke="#8a8a8a" stroke-width="2.2"/>
  <circle cx="495.0" cy="173.3" r="11.0" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="520.0" y1="130.0" x2="563.3" y2="155.0" stroke="#8a8a8a" stroke-width="2.2"/>
  <circle cx="563.3" cy="155.0" r="11.0" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="462.0" y="200.0" fill="#8a8a8a" font-size="11">four bonds, so carbon can</text>
  <text x="462.0" y="214.0" fill="#8a8a8a" font-size="11">chain, branch and ring -</text>
  <text x="462.0" y="228.0" fill="#8a8a8a" font-size="11">every biomolecule is a</text>
  <text x="462.0" y="242.0" fill="#8a8a8a" font-size="11">carbon skeleton</text>
</svg>
