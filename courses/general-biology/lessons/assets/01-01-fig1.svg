  <line x1="392.0" y1="150.0" x2="360.0" y2="258.0" stroke="#e0645c" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="268.0" y="300.0" fill="#e0645c" font-size="11">dashed = hydrogen bonds: weak singly, decisive in bulk</text>
