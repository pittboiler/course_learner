  <text x="104.0" y="104.0" fill="#e0645c" font-size="11">delta -</text>
  <text x="98.0" y="178.0" fill="#8a8a8a" font-size="11">104.5 degrees</text>
  <text x="60.0" y="196.0" fill="#8a8a8a" font-size="11">electrons sit closer to oxygen,</text>
  <text x="60.0" y="210.0" fill="#8a8a8a" font-size="11">so the molecule has two poles</text>
