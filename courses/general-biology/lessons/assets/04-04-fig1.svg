<svg viewBox="0 0 620 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Energy flows one way and mostly leaks; matter cycles.</text>
  <polygon points="206.0,126.0 254.0,126.0 240.0,76.0 220.0,76.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.6" opacity="0.14"/>
  <text x="230.0" y="107.0" fill="#e0645c" font-size="11" text-anchor="middle">tertiary consumers</text>
  <text x="230.0" y="123.0" fill="#8a8a8a" font-size="10" text-anchor="middle">1 unit</text>
  <polygon points="182.0,184.0 278.0,184.0 264.0,134.0 196.0,134.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.6" opacity="0.14"/>
  <text x="230.0" y="165.0" fill="#e0645c" font-size="11" text-anchor="middle">secondary consumers</text>
  <text x="230.0" y="181.0" fill="#8a8a8a" font-size="10" text-anchor="middle">10</text>
  <polygon points="148.4,242.0 311.6,242.0 297.6,192.0 162.4,192.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.6" opacity="0.14"/>
  <text x="230.0" y="223.0" fill="#e0645c" font-size="11" text-anchor="middle">primary consumers</text>
  <text x="230.0" y="239.0" fill="#8a8a8a" font-size="10" text-anchor="middle">100</text>
  <polygon points="110.0,300.0 350.0,300.0 336.0,250.0 124.0,250.0" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.6" opacity="0.14"/>
  <text x="230.0" y="281.0" fill="#4a90d9" font-size="11" text-anchor="middle">producers</text>
  <text x="230.0" y="297.0" fill="#8a8a8a" font-size="10" text-anchor="middle">1000</text>
  <text x="230.0" y="322.0" fill="#8a8a8a" font-size="11" text-anchor="middle">about 10 percent passes up each level</text>
  <text x="230.0" y="338.0" fill="#8a8a8a" font-size="10" text-anchor="middle">the other 90 percent is lost as heat and waste</text>
  <line x1="70.0" y1="132.0" x2="133.2" y2="132.0" stroke="#e0645c" stroke-width="2.4"/>
  <polygon points="140.0,132.0 131.8,135.7 131.8,128.3" fill="#e0645c"/>
  <text x="40.0" y="136.0" fill="#e0645c" font-size="11">sun</text>
  <text x="60.0" y="164.0" fill="#8a8a8a" font-size="9">enters once,</text>
  <text x="60.0" y="176.0" fill="#8a8a8a" font-size="9">leaves as heat</text>
  <text x="396.0" y="84.0" fill="#4a90d9" font-size="12">why food chains are short</text>
  <text x="396.0" y="106.0" fill="#8a8a8a" font-size="10">Four or five levels exhausts the</text>
  <text x="396.0" y="122.0" fill="#8a8a8a" font-size="10">supply: a fifth-level predator would</text>
  <text x="396.0" y="138.0" fill="#8a8a8a" font-size="10">have 0.01 percent of the original</text>
  <text x="396.0" y="154.0" fill="#8a8a8a" font-size="10">energy to live on.</text>
  <text x="396.0" y="190.0" fill="#4a90d9" font-size="12">why eating plants feeds more people</text>
  <text x="396.0" y="212.0" fill="#8a8a8a" font-size="10">A field feeding people directly</text>
  <text x="396.0" y="228.0" fill="#8a8a8a" font-size="10">supports roughly ten times as many</text>
  <text x="396.0" y="244.0" fill="#8a8a8a" font-size="10">as the same field feeding cattle.</text>
  <text x="396.0" y="280.0" fill="#4a90d9" font-size="12">and why matter is different</text>
  <text x="396.0" y="302.0" fill="#8a8a8a" font-size="10">Carbon, nitrogen and water cycle</text>
  <text x="396.0" y="318.0" fill="#8a8a8a" font-size="10">round indefinitely. Energy does not -</text>
  <text x="396.0" y="334.0" fill="#8a8a8a" font-size="10">it degrades to heat and is gone.</text>
</svg>
