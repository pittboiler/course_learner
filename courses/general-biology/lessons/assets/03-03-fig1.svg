  <line x1="106.0" y1="261.0" x2="188.0" y2="261.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="145.0" y="326.0" fill="#8a8a8a" font-size="10" text-anchor="middle">A pairs T with 2 bonds;</text>
  <text x="145.0" y="340.0" fill="#8a8a8a" font-size="10" text-anchor="middle">G pairs C with 3, so GC-rich</text>
  <text x="145.0" y="354.0" fill="#8a8a8a" font-size="10" text-anchor="middle">DNA is harder to pull apart</text>
  <text x="145.0" y="38.0" fill="#8a8a8a" font-size="10" text-anchor="middle">antiparallel: strands run opposite ways</text>
  <text x="460.0" y="58.0" fill="#4a90d9" font-size="12" text-anchor="middle">semiconservative replication</text>
