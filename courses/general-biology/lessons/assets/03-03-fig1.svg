  <text x="58.0" y="54.0" fill="#4a90d9" font-size="11">5'</text>
  <text x="58.0" y="302.0" fill="#4a90d9" font-size="11">3'</text>
  <text x="226.0" y="54.0" fill="#e0645c" font-size="11">3'</text>
  <text x="226.0" y="302.0" fill="#e0645c" font-size="11">5'</text>
  <text x="86.0" y="91.0" fill="#4a90d9" font-size="13">A</text>
  <text x="196.0" y="91.0" fill="#e0645c" font-size="13">T</text>
