  <line x1="106.0" y1="193.0" x2="188.0" y2="193.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="86.0" y="227.0" fill="#4a90d9" font-size="13">A</text>
  <text x="196.0" y="227.0" fill="#e0645c" font-size="13">T</text>
  <line x1="106.0" y1="219.5" x2="188.0" y2="219.5" stroke="#8a8a8a" stroke-width="1.4"/>
  <line x1="106.0" y1="224.5" x2="188.0" y2="224.5" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="86.0" y="261.0" fill="#4a90d9" font-size="13">G</text>
  <text x="196.0" y="261.0" fill="#e0645c" font-size="13">C</text>
  <line x1="106.0" y1="251.0" x2="188.0" y2="251.0" stroke="#8a8a8a" stroke-width="1.4"/>
