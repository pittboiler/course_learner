  <line x1="106.0" y1="115.0" x2="188.0" y2="115.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <line x1="106.0" y1="120.0" x2="188.0" y2="120.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <line x1="106.0" y1="125.0" x2="188.0" y2="125.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="86.0" y="159.0" fill="#4a90d9" font-size="13">T</text>
