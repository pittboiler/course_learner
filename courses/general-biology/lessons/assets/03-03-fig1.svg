  <line x1="460.0" y1="192.0" x2="460.0" y2="205.2" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="460.0,212.0 456.3,203.8 463.7,203.8" fill="#8a8a8a"/>
  <text x="460.0" y="232.0" fill="#8a8a8a" font-size="9" text-anchor="middle">strands separate; each templates a partner</text>
  <line x1="382.0" y1="244.0" x2="382.0" y2="332.0" stroke="#4a90d9" stroke-width="3"/>
  <line x1="410.0" y1="244.0" x2="410.0" y2="332.0" stroke="#8a8a8a" stroke-width="3"/>
