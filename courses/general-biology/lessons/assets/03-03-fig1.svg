  <line x1="382.0" y1="321.0" x2="410.0" y2="321.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="396.0" y="350.0" fill="#8a8a8a" font-size="10" text-anchor="middle">one old, one new</text>
  <line x1="510.0" y1="244.0" x2="510.0" y2="332.0" stroke="#8a8a8a" stroke-width="3"/>
  <line x1="538.0" y1="244.0" x2="538.0" y2="332.0" stroke="#e0645c" stroke-width="3"/>
  <line x1="510.0" y1="255.0" x2="538.0" y2="255.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="510.0" y1="277.0" x2="538.0" y2="277.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="510.0" y1="299.0" x2="538.0" y2="299.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="510.0" y1="321.0" x2="538.0" y2="321.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="524.0" y="350.0" fill="#8a8a8a" font-size="10" text-anchor="middle">one old, one new</text>
  <text x="460.0" y="364.0" fill="#e0645c" font-size="10" text-anchor="middle">neither daughter is wholly new</text>
  <text x="460.0" y="386.0" fill="#8a8a8a" font-size="9" text-anchor="middle">blue and coral = original, grey = newly built</text>
</svg>
