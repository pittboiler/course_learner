<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Most of a cell's life is interphase; division is the short part.</text>
