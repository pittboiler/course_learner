  <text x="84.8" y="243.9" fill="#8a8a8a" font-size="9" text-anchor="middle">grow, check</text>
  <polygon points="224.0,196.0 115.0,156.3 116.3,153.0 117.6,149.7 119.1,146.5 120.6,143.3 122.3,140.2 124.1,137.1 125.9,134.1 127.8,131.1 129.9,128.2 132.0,125.4 134.2,122.6 136.5,119.9 138.8,117.3 141.3,114.7 143.8,112.2 146.4,109.8 149.0,107.5 151.8,105.2 154.6,103.1 157.5,101.0 160.4,99.0 163.4,97.1 166.4,95.3 169.5,93.6 172.7,92.0 175.9,90.4 179.1,89.0 182.4,87.7 185.8,86.5 189.1,85.4 192.5,84.4 195.9,83.4 199.4,82.6 202.9,81.9 206.4,81.4 209.9,80.9 213.4,80.5 216.9,80.2 220.5,80.1 224.0,80.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.8" opacity="0.14"/>
  <text x="180.1" y="138.3" fill="#e0645c" font-size="15" text-anchor="middle">M</text>
  <text x="140.3" y="80.4" fill="#8a8a8a" font-size="9" text-anchor="middle">divide</text>
  <text x="224.0" y="42.0" fill="#8a8a8a" font-size="10" text-anchor="middle">interphase = G<tspan baseline-shift="0" dy="0.32em" font-size="0.72em">1</tspan><tspan dy="-0.32em"></tspan> + S + G<tspan baseline-shift="0" dy="0.32em" font-size="0.72em">2</tspan><tspan dy="-0.32em"></tspan>, about 90 percent of the cycle</text>
  <text x="400.0" y="48.0" fill="#e0645c" font-size="12">three checkpoints</text>
  <circle cx="312.9" cy="270.6" r="7.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.8" opacity="0.5"/>
  <text x="400.0" y="72.0" fill="#e0645c" font-size="11">G<tspan baseline-shift="0" dy="0.32em" font-size="0.72em">1</tspan><tspan dy="-0.32em"></tspan> checkpoint</text>
  <text x="400.0" y="88.0" fill="#8a8a8a" font-size="10">big enough? DNA damaged?</text>
  <circle cx="113.7" cy="160.2" r="7.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.8" opacity="0.5"/>
  <text x="400.0" y="118.0" fill="#e0645c" font-size="11">G<tspan baseline-shift="0" dy="0.32em" font-size="0.72em">2</tspan><tspan dy="-0.32em"></tspan> checkpoint</text>
  <text x="400.0" y="134.0" fill="#8a8a8a" font-size="10">DNA fully copied?</text>
  <circle cx="166.0" cy="95.5" r="7.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.8" opacity="0.5"/>
  <text x="400.0" y="164.0" fill="#e0645c" font-size="11">M checkpoint</text>
  <text x="400.0" y="180.0" fill="#8a8a8a" font-size="10">all chromosomes attached?</text>
  <text x="400.0" y="214.0" fill="#8a8a8a" font-size="10">a checkpoint is a stop signal, not a</text>
  <text x="400.0" y="228.0" fill="#8a8a8a" font-size="10">green light: the default is to halt</text>
  <text x="400.0" y="250.0" fill="#e0645c" font-size="11">cancer = these brakes fail</text>
</svg>
