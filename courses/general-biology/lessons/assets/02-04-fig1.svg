  <text x="230.4" y="345.9" fill="#8a8a8a" font-size="9" text-anchor="middle">copy the DNA</text>
  <polygon points="224.0,196.0 157.5,291.0 154.4,288.8 151.4,286.5 148.5,284.0 145.6,281.5 142.9,278.9 140.2,276.2 137.6,273.4 135.1,270.6 132.7,267.6 130.5,264.6 128.3,261.5 126.2,258.3 124.2,255.1 122.3,251.8 120.5,248.4 118.9,245.0 117.3,241.6 115.9,238.0 114.6,234.5 113.4,230.9 112.3,227.2 111.3,223.6 110.5,219.9 109.8,216.1 109.2,212.4 108.7,208.6 108.3,204.8 108.1,201.1 108.0,197.3 108.0,193.5 108.2,189.7 108.4,185.9 108.8,182.1 109.4,178.4 110.0,174.6 110.7,170.9 111.6,167.2 112.6,163.5 113.8,159.9 115.0,156.3" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.8" opacity="0.14"/>
