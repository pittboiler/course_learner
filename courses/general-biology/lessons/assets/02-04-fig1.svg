  <text x="361.2" y="150.1" fill="#8a8a8a" font-size="9" text-anchor="middle">grow, do the job</text>
  <polygon points="224.0,196.0 298.6,284.9 295.6,287.3 292.6,289.5 289.5,291.7 286.3,293.8 283.1,295.8 279.8,297.7 276.4,299.5 273.0,301.1 269.6,302.7 266.0,304.1 262.5,305.4 258.9,306.6 255.2,307.7 251.6,308.7 247.9,309.5 244.1,310.2 240.4,310.8 236.6,311.3 232.8,311.7 229.1,311.9 225.3,312.0 221.5,312.0 217.7,311.8 213.9,311.6 210.1,311.2 206.4,310.6 202.6,310.0 198.9,309.3 195.2,308.4 191.5,307.4 187.9,306.2 184.3,305.0 180.8,303.6 177.3,302.2 173.8,300.6 170.4,298.9 167.1,297.1 163.8,295.2 160.6,293.1 157.5,291.0" fill="#e0645c" stroke="#e0645c" stroke-width="1.8" opacity="0.14"/>
