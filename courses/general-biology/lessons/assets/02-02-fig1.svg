<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">One glucose, three stages, about 32 ATP.</text>
  <rect x="34.0" y="60.0" width="140.0" height="124.0" rx="7" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.8" opacity="0.1"/>
  <text x="104.0" y="84.0" fill="#4a90d9" font-size="12" text-anchor="middle">Glycolysis</text>
  <text x="104.0" y="102.0" fill="#8a8a8a" font-size="9" text-anchor="middle">in the cytosol</text>
  <text x="104.0" y="128.0" fill="#8a8a8a" font-size="9" text-anchor="middle">glucose to 2 pyruvate</text>
  <text x="104.0" y="158.0" fill="#e0645c" font-size="10" text-anchor="middle">2 ATP   2 NADH</text>
  <rect x="186.0" y="60.0" width="140.0" height="124.0" rx="7" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.8" opacity="0.1"/>
  <text x="256.0" y="84.0" fill="#4a90d9" font-size="12" text-anchor="middle">Pyruvate oxidation</text>
  <text x="256.0" y="102.0" fill="#8a8a8a" font-size="9" text-anchor="middle">mitochondrial matrix</text>
  <text x="256.0" y="128.0" fill="#8a8a8a" font-size="9" text-anchor="middle">2 pyruvate to 2 acetyl-CoA</text>
  <text x="256.0" y="158.0" fill="#e0645c" font-size="10" text-anchor="middle">0 ATP   2 NADH</text>
  <rect x="338.0" y="60.0" width="140.0" height="124.0" rx="7" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.8" opacity="0.1"/>
  <text x="408.0" y="84.0" fill="#4a90d9" font-size="12" text-anchor="middle">Citric acid cycle</text>
  <text x="408.0" y="102.0" fill="#8a8a8a" font-size="9" text-anchor="middle">mitochondrial matrix</text>
  <text x="408.0" y="128.0" fill="#8a8a8a" font-size="9" text-anchor="middle">acetyl-CoA fully oxidised</text>
  <text x="408.0" y="158.0" fill="#e0645c" font-size="10" text-anchor="middle">2 ATP   6 NADH   2 FADH<tspan baseline-shift="0" dy="0.32em" font-size="0.72em">2</tspan><tspan dy="-0.32em"></tspan></text>
  <line x1="174.0" y1="122.0" x2="179.2" y2="122.0" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="186.0,122.0 177.8,125.7 177.8,118.3" fill="#8a8a8a"/>
  <line x1="326.0" y1="122.0" x2="331.2" y2="122.0" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="338.0,122.0 329.8,125.7 329.8,118.3" fill="#8a8a8a"/>
  <line x1="478.0" y1="122.0" x2="509.2" y2="122.0" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="516.0,122.0 507.8,125.7 507.8,118.3" fill="#8a8a8a"/>
  <rect x="506.0" y="60.0" width="86.0" height="124.0" rx="7" fill="#e0645c" stroke="#e0645c" stroke-width="1.8" opacity="0.12"/>
  <text x="549.0" y="84.0" fill="#e0645c" font-size="12" text-anchor="middle">Electron</text>
  <text x="549.0" y="100.0" fill="#e0645c" font-size="12" text-anchor="middle">transport</text>
  <text x="549.0" y="124.0" fill="#8a8a8a" font-size="9" text-anchor="middle">inner</text>
  <text x="549.0" y="136.0" fill="#8a8a8a" font-size="9" text-anchor="middle">membrane</text>
  <text x="549.0" y="162.0" fill="#e0645c" font-size="10" text-anchor="middle">about 28 ATP</text>
  <text x="34.0" y="230.0" fill="#4a90d9" font-size="12">Tally per glucose</text>
  <text x="34.0" y="252.0" fill="#8a8a8a" font-size="11">substrate-level ATP (glycolysis + cycle)</text>
  <text x="330.0" y="252.0" fill="#8a8a8a" font-size="11" text-anchor="end">4</text>
  <text x="34.0" y="272.0" fill="#8a8a8a" font-size="11">10 NADH, each worth about 2.5 ATP</text>
  <text x="330.0" y="272.0" fill="#8a8a8a" font-size="11" text-anchor="end">25</text>
  <text x="34.0" y="292.0" fill="#8a8a8a" font-size="11">2 FADH<tspan baseline-shift="0" dy="0.32em" font-size="0.72em">2</tspan><tspan dy="-0.32em"></tspan>, each worth about 1.5 ATP</text>
  <text x="330.0" y="292.0" fill="#8a8a8a" font-size="11" text-anchor="end">3</text>
  <text x="34.0" y="312.0" fill="#e0645c" font-size="11">total</text>
  <text x="330.0" y="312.0" fill="#e0645c" font-size="11" text-anchor="end">about 32</text>
  <line x1="34.0" y1="282.0" x2="330.0" y2="282.0" stroke="#8a8a8a" stroke-width="1"/>
  <text x="366.0" y="254.0" fill="#8a8a8a" font-size="10">oxygen's only job is to accept the</text>
  <text x="366.0" y="268.0" fill="#8a8a8a" font-size="10">spent electrons at the very end -</text>
  <text x="366.0" y="282.0" fill="#8a8a8a" font-size="10">without it the whole line backs up</text>
  <text x="366.0" y="306.0" fill="#e0645c" font-size="10">fermentation salvages 2 ATP:</text>
  <text x="366.0" y="320.0" fill="#e0645c" font-size="10">about 2 percent of the energy</text>
</svg>
