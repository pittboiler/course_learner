<svg viewBox="0 0 620 414" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">DNA to RNA to protein - and what one deleted base does to it.</text>
  <rect x="40.0" y="58.0" width="120.0" height="54.0" rx="6" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.8" opacity="0.12"/>
  <text x="100.0" y="90.0" fill="#4a90d9" font-size="16" text-anchor="middle">DNA</text>
  <text x="100.0" y="128.0" fill="#8a8a8a" font-size="9" text-anchor="middle">in the nucleus</text>
  <line x1="168.0" y1="86.0" x2="227.2" y2="86.0" stroke="#e0645c" stroke-width="2.4"/>
  <polygon points="234.0,86.0 225.8,89.7 225.8,82.3" fill="#e0645c"/>
  <text x="200.0" y="74.0" fill="#e0645c" font-size="11" text-anchor="middle">transcription</text>
  <rect x="242.0" y="58.0" width="120.0" height="54.0" rx="6" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.8" opacity="0.12"/>
  <text x="302.0" y="90.0" fill="#4a90d9" font-size="16" text-anchor="middle">mRNA</text>
  <text x="302.0" y="128.0" fill="#8a8a8a" font-size="9" text-anchor="middle">exits to a ribosome</text>
  <line x1="370.0" y1="86.0" x2="429.2" y2="86.0" stroke="#e0645c" stroke-width="2.4"/>
  <polygon points="436.0,86.0 427.8,89.7 427.8,82.3" fill="#e0645c"/>
  <text x="403.0" y="74.0" fill="#e0645c" font-size="11" text-anchor="middle">translation</text>
  <rect x="444.0" y="58.0" width="132.0" height="54.0" rx="6" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.8" opacity="0.12"/>
  <text x="510.0" y="90.0" fill="#4a90d9" font-size="16" text-anchor="middle">protein</text>
  <text x="510.0" y="128.0" fill="#8a8a8a" font-size="9" text-anchor="middle">folds, does the job</text>
  <text x="40.0" y="192.0" fill="#8a8a8a" font-size="12">normal</text>
  <rect x="126.0" y="174.0" width="76.0" height="28.0" rx="4" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.14"/>
  <text x="164.0" y="194.0" fill="#4a90d9" font-size="14" text-anchor="middle">AUG</text>
  <text x="164.0" y="218.0" fill="#8a8a8a" font-size="10" text-anchor="middle">Met</text>
  <rect x="212.0" y="174.0" width="76.0" height="28.0" rx="4" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.14"/>
  <text x="250.0" y="194.0" fill="#4a90d9" font-size="14" text-anchor="middle">GCC</text>
  <text x="250.0" y="218.0" fill="#8a8a8a" font-size="10" text-anchor="middle">Ala</text>
  <rect x="298.0" y="174.0" width="76.0" height="28.0" rx="4" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.14"/>
  <text x="336.0" y="194.0" fill="#4a90d9" font-size="14" text-anchor="middle">UAU</text>
  <text x="336.0" y="218.0" fill="#8a8a8a" font-size="10" text-anchor="middle">Tyr</text>
  <rect x="384.0" y="174.0" width="76.0" height="28.0" rx="4" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.14"/>
  <text x="422.0" y="194.0" fill="#e0645c" font-size="14" text-anchor="middle">UGA</text>
  <text x="422.0" y="218.0" fill="#8a8a8a" font-size="10" text-anchor="middle">stop</text>
  <text x="40.0" y="286.0" fill="#e0645c" font-size="12">first G deleted</text>
  <rect x="126.0" y="268.0" width="76.0" height="28.0" rx="4" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.14"/>
  <text x="164.0" y="288.0" fill="#4a90d9" font-size="14" text-anchor="middle">AUG</text>
  <text x="164.0" y="312.0" fill="#8a8a8a" font-size="10" text-anchor="middle">Met</text>
  <rect x="212.0" y="268.0" width="76.0" height="28.0" rx="4" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.14"/>
  <text x="250.0" y="288.0" fill="#e0645c" font-size="14" text-anchor="middle">CCU</text>
  <text x="250.0" y="312.0" fill="#8a8a8a" font-size="10" text-anchor="middle">Pro</text>
  <rect x="298.0" y="268.0" width="76.0" height="28.0" rx="4" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.14"/>
  <text x="336.0" y="288.0" fill="#e0645c" font-size="14" text-anchor="middle">AUU</text>
  <text x="336.0" y="312.0" fill="#8a8a8a" font-size="10" text-anchor="middle">Ile</text>
  <rect x="384.0" y="268.0" width="76.0" height="28.0" rx="4" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.14"/>
  <text x="422.0" y="288.0" fill="#e0645c" font-size="14" text-anchor="middle">...</text>
  <text x="422.0" y="312.0" fill="#8a8a8a" font-size="10" text-anchor="middle">runs on</text>
  <text x="40.0" y="348.0" fill="#8a8a8a" font-size="11">Every codon after the deletion is misread - the reading frame shifted by one.</text>
  <text x="40.0" y="368.0" fill="#8a8a8a" font-size="11">A substitution changes at most one amino acid; a deletion wrecks all of it downstream.</text>
  <text x="40.0" y="396.0" fill="#e0645c" font-size="11">That is why insertions and deletions are usually far worse than substitutions.</text>
</svg>
