  <text x="60.0" y="354.0" fill="#8a8a8a" font-size="10">never pair. No crossing over,</text>
  <text x="60.0" y="370.0" fill="#8a8a8a" font-size="10">no independent assortment.</text>
  <line x1="452.0" y1="158.0" x2="452.0" y2="179.2" stroke="#e0645c" stroke-width="2"/>
  <polygon points="452.0,186.0 448.3,177.8 455.7,177.8" fill="#e0645c"/>
