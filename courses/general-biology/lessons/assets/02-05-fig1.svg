  <line x1="452.0" y1="258.0" x2="452.0" y2="275.2" stroke="#e0645c" stroke-width="2"/>
  <polygon points="452.0,282.0 448.3,273.8 455.7,273.8" fill="#e0645c"/>
  <text x="466.0" y="274.0" fill="#e0645c" font-size="9">meiosis II: sisters separate</text>
  <ellipse cx="362.0" cy="306.0" rx="26.0" ry="18.0" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <rect x="358.5" y="298.0" width="7.0" height="20.0" rx="3" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.35"/>
  <ellipse cx="422.0" cy="306.0" rx="26.0" ry="18.0" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <rect x="418.5" y="298.0" width="7.0" height="20.0" rx="3" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.35"/>
  <ellipse cx="482.0" cy="306.0" rx="26.0" ry="18.0" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <rect x="478.5" y="298.0" width="7.0" height="16.0" rx="3" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.35"/>
  <ellipse cx="542.0" cy="306.0" rx="26.0" ry="18.0" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <rect x="538.5" y="298.0" width="7.0" height="16.0" rx="3" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.35"/>
  <text x="452.0" y="344.0" fill="#e0645c" font-size="11" text-anchor="middle">4 gametes, n = 2 each</text>
  <text x="452.0" y="360.0" fill="#8a8a8a" font-size="9" text-anchor="middle">all genetically different</text>
  <rect x="340.0" y="374.0" width="236.0" height="44.0" rx="6" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.08"/>
  <text x="352.0" y="392.0" fill="#8a8a8a" font-size="10">crossing over + independent assortment:</text>
  <text x="352.0" y="408.0" fill="#8a8a8a" font-size="10">2<tspan baseline-shift="0" dy="-0.42em" font-size="0.72em">23</tspan><tspan dy="0.42em"></tspan> = 8.4 million gamete types in humans</text>
</svg>
