<svg viewBox="0 0 620 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">One division copies; two divisions halve, shuffle and vary.</text>
  <text x="160.0" y="52.0" fill="#4a90d9" font-size="14" text-anchor="middle">MITOSIS</text>
  <text x="160.0" y="68.0" fill="#8a8a8a" font-size="10" text-anchor="middle">growth and repair</text>
  <text x="452.0" y="52.0" fill="#e0645c" font-size="14" text-anchor="middle">MEIOSIS</text>
  <text x="452.0" y="68.0" fill="#8a8a8a" font-size="10" text-anchor="middle">making gametes</text>
  <line x1="306.0" y1="44.0" x2="306.0" y2="404.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 5"/>
  <ellipse cx="160.0" cy="110.0" rx="74.0" ry="30.0" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
