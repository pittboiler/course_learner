  <polygon points="160.0,190.0 156.3,181.8 163.7,181.8" fill="#8a8a8a"/>
  <text x="174.0" y="178.0" fill="#8a8a8a" font-size="9">one division</text>
  <ellipse cx="96.0" cy="222.0" rx="54.0" ry="26.0" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
  <rect x="68.5" y="210.0" width="7.0" height="24.0" rx="3" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.35"/>
  <rect x="96.5" y="210.0" width="7.0" height="18.0" rx="3" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.35"/>
  <ellipse cx="224.0" cy="222.0" rx="54.0" ry="26.0" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
  <rect x="196.5" y="210.0" width="7.0" height="24.0" rx="3" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.35"/>
  <rect x="224.5" y="210.0" width="7.0" height="18.0" rx="3" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.35"/>
  <text x="160.0" y="264.0" fill="#4a90d9" font-size="11" text-anchor="middle">2 daughters, 2n = 4 each</text>
  <text x="160.0" y="280.0" fill="#8a8a8a" font-size="9" text-anchor="middle">genetically identical to the parent</text>
  <text x="160.0" y="296.0" fill="#8a8a8a" font-size="9" text-anchor="middle">and to each other</text>
  <rect x="46.0" y="318.0" width="228.0" height="72.0" rx="6" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.08"/>
