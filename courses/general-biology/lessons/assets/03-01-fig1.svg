<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">A Punnett square is just meiosis, tabulated.</text>
  <text x="123.0" y="96.0" fill="#4a90d9" font-size="15" text-anchor="middle">B</text>
  <text x="72.0" y="150.9" fill="#e0645c" font-size="15" text-anchor="middle">B</text>
  <text x="189.0" y="96.0" fill="#4a90d9" font-size="15" text-anchor="middle">b</text>
  <text x="72.0" y="216.9" fill="#e0645c" font-size="15" text-anchor="middle">b</text>
  <text x="156.0" y="70.0" fill="#4a90d9" font-size="11" text-anchor="middle">pollen from Bb</text>
  <text x="38.0" y="176.0" fill="#e0645c" font-size="11" text-anchor="middle">eggs</text>
  <text x="38.0" y="190.0" fill="#e0645c" font-size="11" text-anchor="middle">from Bb</text>
  <rect x="90.0" y="110.0" width="66.0" height="66.0" rx="4" fill="#4a90d9" stroke="#8a8a8a" stroke-width="1.4" opacity="0.16"/>
  <text x="123.0" y="145.0" fill="#4a90d9" font-size="16" text-anchor="middle">BB</text>
  <text x="123.0" y="163.0" fill="#8a8a8a" font-size="9" text-anchor="middle">dark</text>
  <rect x="156.0" y="110.0" width="66.0" height="66.0" rx="4" fill="#4a90d9" stroke="#8a8a8a" stroke-width="1.4" opacity="0.16"/>
  <text x="189.0" y="145.0" fill="#4a90d9" font-size="16" text-anchor="middle">Bb</text>
  <text x="189.0" y="163.0" fill="#8a8a8a" font-size="9" text-anchor="middle">dark</text>
  <rect x="90.0" y="176.0" width="66.0" height="66.0" rx="4" fill="#4a90d9" stroke="#8a8a8a" stroke-width="1.4" opacity="0.16"/>
  <text x="123.0" y="211.0" fill="#4a90d9" font-size="16" text-anchor="middle">Bb</text>
  <text x="123.0" y="229.0" fill="#8a8a8a" font-size="9" text-anchor="middle">dark</text>
  <rect x="156.0" y="176.0" width="66.0" height="66.0" rx="4" fill="#e0645c" stroke="#8a8a8a" stroke-width="1.4" opacity="0.24"/>
  <text x="189.0" y="211.0" fill="#e0645c" font-size="16" text-anchor="middle">bb</text>
  <text x="189.0" y="229.0" fill="#8a8a8a" font-size="9" text-anchor="middle">light</text>
  <text x="156.0" y="272.0" fill="#4a90d9" font-size="14" text-anchor="middle">3 dark : 1 light</text>
  <text x="156.0" y="290.0" fill="#8a8a8a" font-size="10" text-anchor="middle">genotypes 1 BB : 2 Bb : 1 bb</text>
  <text x="300.0" y="72.0" fill="#4a90d9" font-size="12">why the square works</text>
  <text x="300.0" y="100.0" fill="#8a8a8a" font-size="11">Each parent is Bb, so meiosis I sends</text>
  <text x="300.0" y="116.0" fill="#8a8a8a" font-size="11">B to one gamete and b to the other -</text>
  <text x="300.0" y="138.0" fill="#8a8a8a" font-size="11">that is segregation, and it is literally</text>
  <text x="300.0" y="154.0" fill="#8a8a8a" font-size="11">homologues separating at anaphase I.</text>
  <text x="300.0" y="176.0" fill="#8a8a8a" font-size="11">So half the gametes carry B and half b.</text>
  <text x="300.0" y="192.0" fill="#8a8a8a" font-size="11">Fertilisation pairs them at random,</text>
  <text x="300.0" y="214.0" fill="#8a8a8a" font-size="11">which is what the four boxes enumerate.</text>
  <rect x="290.0" y="238.0" width="300.0" height="64.0" rx="6" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.08"/>
  <text x="300.0" y="258.0" fill="#e0645c" font-size="11">Genotype is what you carry (BB, Bb, bb).</text>
  <text x="300.0" y="276.0" fill="#e0645c" font-size="11">Phenotype is what shows (dark, light).</text>
  <text x="300.0" y="294.0" fill="#8a8a8a" font-size="10">BB and Bb look the same; only bb differs.</text>
</svg>
