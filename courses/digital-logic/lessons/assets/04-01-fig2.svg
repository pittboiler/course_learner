<svg viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic" font-size="13">A 4-bit LFSR: the same shift chain, but the input is the XOR of two tapped outputs instead of external data.</text>

  <!-- stage 1 -->
  <rect x="110" y="56" width="70" height="72" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="118" y="100" fill="#8a8a8a" font-size="12">D</text>
  <text x="172" y="100" fill="#8a8a8a" font-size="12" text-anchor="end">Q</text>
  <path d="M 110 104 L 123 111 L 110 118 Z" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="145" y="48" fill="#4a90d9" font-size="13" text-anchor="middle">Q0</text>

  <!-- stage 2 -->
  <line x1="180" y1="84" x2="240" y2="84" stroke="#4a90d9" stroke-width="2"/>
  <path d="M 232 80 L 240 84 L 232 88 Z" fill="#4a90d9"/>
  <rect x="240" y="56" width="70" height="72" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="248" y="100" fill="#8a8a8a" font-size="12">D</text>
  <text x="302" y="100" fill="#8a8a8a" font-size="12" text-anchor="end">Q</text>
  <path d="M 240 104 L 253 111 L 240 118 Z" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="275" y="48" fill="#4a90d9" font-size="13" text-anchor="middle">Q1</text>

  <!-- stage 3 -->
  <line x1="310" y1="84" x2="370" y2="84" stroke="#4a90d9" stroke-width="2"/>
  <path d="M 362 80 L 370 84 L 362 88 Z" fill="#4a90d9"/>
  <rect x="370" y="56" width="70" height="72" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="378" y="100" fill="#8a8a8a" font-size="12">D</text>
  <text x="432" y="100" fill="#8a8a8a" font-size="12" text-anchor="end">Q</text>
  <path d="M 370 104 L 383 111 L 370 118 Z" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="405" y="48" fill="#4a90d9" font-size="13" text-anchor="middle">Q2</text>

  <!-- stage 4 -->
  <line x1="440" y1="84" x2="500" y2="84" stroke="#4a90d9" stroke-width="2"/>
  <path d="M 492 80 L 500 84 L 492 88 Z" fill="#4a90d9"/>
  <rect x="500" y="56" width="70" height="72" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="508" y="100" fill="#8a8a8a" font-size="12">D</text>
  <text x="562" y="100" fill="#8a8a8a" font-size="12" text-anchor="end">Q</text>
  <path d="M 500 104 L 513 111 L 500 118 Z" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="535" y="48" fill="#4a90d9" font-size="13" text-anchor="middle">Q3</text>

  <!-- output tail -->
  <line x1="570" y1="84" x2="615" y2="84" stroke="#4a90d9" stroke-width="2"/>
  <text x="622" y="88" fill="#4a90d9" font-size="12">out</text>

  <!-- taps -->
  <circle cx="470" cy="84" r="3.5" fill="#e0645c"/>
  <line x1="470" y1="84" x2="470" y2="205" stroke="#e0645c" stroke-width="2"/>
  <line x1="470" y1="205" x2="340" y2="205" stroke="#e0645c" stroke-width="2"/>
  <circle cx="595" cy="84" r="3.5" fill="#e0645c"/>
  <line x1="595" y1="84" x2="595" y2="225" stroke="#e0645c" stroke-width="2"/>
  <line x1="595" y1="225" x2="340" y2="225" stroke="#e0645c" stroke-width="2"/>
  <line x1="340" y1="205" x2="312" y2="205" stroke="#e0645c" stroke-width="2"/>
  <line x1="340" y1="225" x2="312" y2="225" stroke="#e0645c" stroke-width="2"/>
  <text x="470" y="170" fill="#e0645c" font-size="11" text-anchor="middle">tap Q2</text>
  <text x="595" y="170" fill="#e0645c" font-size="11" text-anchor="middle">tap Q3</text>

  <!-- XOR gate, pointing left -->
  <path d="M 306 195 Q 290 215 306 235 Q 276 235 250 215 Q 276 195 306 195 Z" fill="none" stroke="#e0645c" stroke-width="2"/>
  <path d="M 316 195 Q 300 215 316 235" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="281" y="221" fill="#e0645c" font-size="17" text-anchor="middle">&#8853;</text>

  <!-- feedback path -->
  <line x1="250" y1="215" x2="70" y2="215" stroke="#e0645c" stroke-width="2"/>
  <line x1="70" y1="215" x2="70" y2="84" stroke="#e0645c" stroke-width="2"/>
  <line x1="70" y1="84" x2="110" y2="84" stroke="#e0645c" stroke-width="2"/>
  <path d="M 102 80 L 110 84 L 102 88 Z" fill="#e0645c"/>
  <text x="150" y="208" fill="#e0645c" font-size="12">feedback</text>

  <text x="20" y="262" fill="#8a8a8a" font-size="12">All four flip-flops share one clock (omitted for clarity).</text>
  <text x="20" y="282" fill="#8a8a8a" font-size="12">Next state: Q3 &#8592; Q2, Q2 &#8592; Q1, Q1 &#8592; Q0, Q0 &#8592; Q3 &#8853; Q2 &#8212; period 15, every nonzero pattern once.</text>
</svg>
