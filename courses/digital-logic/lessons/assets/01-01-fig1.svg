<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="22" fill="#8a8a8a" font-style="italic" font-size="13">One byte, three readings: place values on top, nibbles to hex below, decimal total at the bottom.</text>

  <!-- row label -->
  <text x="62" y="76" fill="#8a8a8a" font-size="11" text-anchor="end">place</text>

  <!-- place values: blue where the bit is 1, grey where it is 0 -->
  <text x="95"  y="76" fill="#4a90d9" text-anchor="middle">128</text>
  <text x="145" y="76" fill="#8a8a8a" text-anchor="middle">64</text>
  <text x="195" y="76" fill="#4a90d9" text-anchor="middle">32</text>
  <text x="245" y="76" fill="#4a90d9" text-anchor="middle">16</text>
  <text x="315" y="76" fill="#8a8a8a" text-anchor="middle">8</text>
  <text x="365" y="76" fill="#4a90d9" text-anchor="middle">4</text>
  <text x="415" y="76" fill="#8a8a8a" text-anchor="middle">2</text>
  <text x="465" y="76" fill="#4a90d9" text-anchor="middle">1</text>

  <!-- bit cells -->
  <rect x="70"  y="88" width="50" height="46" fill="#4a90d9" opacity="0.15"/>
  <rect x="70"  y="88" width="50" height="46" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <rect x="120" y="88" width="50" height="46" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="170" y="88" width="50" height="46" fill="#4a90d9" opacity="0.15"/>
  <rect x="170" y="88" width="50" height="46" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <rect x="220" y="88" width="50" height="46" fill="#4a90d9" opacity="0.15"/>
  <rect x="220" y="88" width="50" height="46" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <rect x="290" y="88" width="50" height="46" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="340" y="88" width="50" height="46" fill="#4a90d9" opacity="0.15"/>
  <rect x="340" y="88" width="50" height="46" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <rect x="390" y="88" width="50" height="46" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="440" y="88" width="50" height="46" fill="#4a90d9" opacity="0.15"/>
  <rect x="440" y="88" width="50" height="46" fill="none" stroke="#4a90d9" stroke-width="2"/>

  <text x="62" y="118" fill="#8a8a8a" font-size="11" text-anchor="end">bits</text>
  <text x="95"  y="119" fill="#4a90d9" text-anchor="middle" font-size="20">1</text>
  <text x="145" y="119" fill="#8a8a8a" text-anchor="middle" font-size="20">0</text>
  <text x="195" y="119" fill="#4a90d9" text-anchor="middle" font-size="20">1</text>
  <text x="245" y="119" fill="#4a90d9" text-anchor="middle" font-size="20">1</text>
  <text x="315" y="119" fill="#8a8a8a" text-anchor="middle" font-size="20">0</text>
  <text x="365" y="119" fill="#4a90d9" text-anchor="middle" font-size="20">1</text>
  <text x="415" y="119" fill="#8a8a8a" text-anchor="middle" font-size="20">0</text>
  <text x="465" y="119" fill="#4a90d9" text-anchor="middle" font-size="20">1</text>

  <!-- bit indices -->
  <text x="95"  y="150" fill="#8a8a8a" text-anchor="middle" font-size="10">b7</text>
  <text x="145" y="150" fill="#8a8a8a" text-anchor="middle" font-size="10">b6</text>
  <text x="195" y="150" fill="#8a8a8a" text-anchor="middle" font-size="10">b5</text>
  <text x="245" y="150" fill="#8a8a8a" text-anchor="middle" font-size="10">b4</text>
  <text x="315" y="150" fill="#8a8a8a" text-anchor="middle" font-size="10">b3</text>
  <text x="365" y="150" fill="#8a8a8a" text-anchor="middle" font-size="10">b2</text>
  <text x="415" y="150" fill="#8a8a8a" text-anchor="middle" font-size="10">b1</text>
  <text x="465" y="150" fill="#8a8a8a" text-anchor="middle" font-size="10">b0</text>

  <!-- nibble brackets, grouped from the RIGHT -->
  <path d="M 70 160 L 70 172 L 270 172 L 270 160" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="170" y1="172" x2="170" y2="180" stroke="#e0645c" stroke-width="1.5"/>
  <path d="M 290 160 L 290 172 L 490 172 L 490 160" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="390" y1="172" x2="390" y2="180" stroke="#e0645c" stroke-width="1.5"/>

  <text x="170" y="204" fill="#e0645c" text-anchor="middle" font-size="24">B</text>
  <text x="390" y="204" fill="#e0645c" text-anchor="middle" font-size="24">5</text>
  <text x="170" y="222" fill="#8a8a8a" text-anchor="middle" font-size="10">1011 = 11</text>
  <text x="390" y="222" fill="#8a8a8a" text-anchor="middle" font-size="10">0101 = 5</text>
  <text x="510" y="204" fill="#e0645c" font-size="16">= 0xB5</text>

  <!-- decimal total -->
  <line x1="70" y1="240" x2="490" y2="240" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="280" y="264" fill="#8a8a8a" text-anchor="middle">128 + 32 + 16 + 4 + 1</text>
  <text x="280" y="290" fill="#4a90d9" text-anchor="middle" font-size="19">= 181 decimal</text>
</svg>
