<svg viewBox="0 0 740 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Left: an X you may read as 1 grows a pair into an octet. Right: two groups that touch but never overlap glitch; a redundant term bridges them.</text>

  <!-- ============ panel (a): don't-care K-map, BCD digit greater than or equal to 5 ============ -->
  <text x="30" y="58" fill="#8a8a8a">(a) Don&#8217;t-cares are free real estate</text>
  <text x="30" y="78" fill="#8a8a8a" font-size="13">BCD digit, A is the MSB; X = the six codes 1010&#8211;1111 that cannot occur</text>

  <!-- axis labels -->
  <text x="198" y="106" fill="#8a8a8a" font-size="13" text-anchor="middle">CD</text>
  <text x="82" y="128" fill="#8a8a8a" font-size="13" text-anchor="middle">AB</text>

  <!-- column headers -->
  <text x="132" y="124" fill="#8a8a8a" font-size="13" text-anchor="middle">00</text>
  <text x="176" y="124" fill="#8a8a8a" font-size="13" text-anchor="middle">01</text>
  <text x="220" y="124" fill="#8a8a8a" font-size="13" text-anchor="middle">11</text>
  <text x="264" y="124" fill="#8a8a8a" font-size="13" text-anchor="middle">10</text>

  <!-- row headers -->
  <text x="102" y="163" fill="#8a8a8a" font-size="13" text-anchor="end">00</text>
  <text x="102" y="207" fill="#8a8a8a" font-size="13" text-anchor="end">01</text>
  <text x="102" y="251" fill="#8a8a8a" font-size="13" text-anchor="end">11</text>
  <text x="102" y="295" fill="#8a8a8a" font-size="13" text-anchor="end">10</text>

  <!-- grid 4x4, origin 110,132, cell 44 -->
  <line x1="110" y1="132" x2="286" y2="132" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="110" y1="176" x2="286" y2="176" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="110" y1="220" x2="286" y2="220" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="110" y1="264" x2="286" y2="264" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="110" y1="308" x2="286" y2="308" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="110" y1="132" x2="110" y2="308" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="154" y1="132" x2="154" y2="308" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="198" y1="132" x2="198" y2="308" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="242" y1="132" x2="242" y2="308" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="286" y1="132" x2="286" y2="308" stroke="#8a8a8a" stroke-width="1.2"/>

  <!-- minterm indices, row AB=00 -->
  <text x="114" y="143" fill="#8a8a8a" font-size="9">0</text>
  <text x="158" y="143" fill="#8a8a8a" font-size="9">1</text>
  <text x="202" y="143" fill="#8a8a8a" font-size="9">3</text>
  <text x="246" y="143" fill="#8a8a8a" font-size="9">2</text>
  <text x="114" y="187" fill="#8a8a8a" font-size="9">4</text>
  <text x="158" y="187" fill="#8a8a8a" font-size="9">5</text>
  <text x="202" y="187" fill="#8a8a8a" font-size="9">7</text>
  <text x="246" y="187" fill="#8a8a8a" font-size="9">6</text>
  <text x="114" y="231" fill="#8a8a8a" font-size="9">12</text>
  <text x="158" y="231" fill="#8a8a8a" font-size="9">13</text>
  <text x="202" y="231" fill="#8a8a8a" font-size="9">15</text>
  <text x="246" y="231" fill="#8a8a8a" font-size="9">14</text>
  <text x="114" y="275" fill="#8a8a8a" font-size="9">8</text>
  <text x="158" y="275" fill="#8a8a8a" font-size="9">9</text>
  <text x="202" y="275" fill="#8a8a8a" font-size="9">11</text>
  <text x="246" y="275" fill="#8a8a8a" font-size="9">10</text>

  <!-- cell values, row AB=00: 0 0 0 0 -->
  <text x="132" y="162" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="176" y="162" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="220" y="162" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="264" y="162" fill="#8a8a8a" text-anchor="middle">0</text>
  <!-- row AB=01: 0 1 1 1 -->
  <text x="132" y="206" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="176" y="206" fill="#4a90d9" text-anchor="middle">1</text>
  <text x="220" y="206" fill="#4a90d9" text-anchor="middle">1</text>
  <text x="264" y="206" fill="#4a90d9" text-anchor="middle">1</text>
  <!-- row AB=11: X X X X -->
  <text x="132" y="250" fill="#8a8a8a" text-anchor="middle">X</text>
  <text x="176" y="250" fill="#8a8a8a" text-anchor="middle">X</text>
  <text x="220" y="250" fill="#8a8a8a" text-anchor="middle">X</text>
  <text x="264" y="250" fill="#8a8a8a" text-anchor="middle">X</text>
  <!-- row AB=10: 1 1 X X -->
  <text x="132" y="294" fill="#4a90d9" text-anchor="middle">1</text>
  <text x="176" y="294" fill="#4a90d9" text-anchor="middle">1</text>
  <text x="220" y="294" fill="#8a8a8a" text-anchor="middle">X</text>
  <text x="264" y="294" fill="#8a8a8a" text-anchor="middle">X</text>

  <!-- grey dashed: the pair you get if every X is forced to 0 -->
  <rect x="115" y="269" width="78" height="34" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="4 4"/>

  <!-- coral: the octet you get once the X cells are read as 1 -->
  <rect x="114" y="224" width="168" height="80" rx="12" fill="none" stroke="#e0645c" stroke-width="2.5"/>

  <!-- panel (a) legend -->
  <rect x="30" y="326" width="18" height="10" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="56" y="336" fill="#8a8a8a" font-size="13">every X forced to 0: a pair, 3 literals</text>
  <rect x="30" y="350" width="18" height="10" rx="4" fill="none" stroke="#e0645c" stroke-width="2.2"/>
  <text x="56" y="360" fill="#e0645c" font-size="13">six X cells read as 1: an octet, the single literal A</text>

  <!-- ============ panel (b): static-1 hazard ============ -->
  <text x="410" y="58" fill="#8a8a8a">(b) A hazard, and the bridge that removes it</text>
  <text x="410" y="78" fill="#8a8a8a" font-size="13">three variables, A is the MSB; cells 1,3 and 6,7 are the two minimal groups</text>

  <!-- axis labels -->
  <text x="530" y="106" fill="#8a8a8a" font-size="13" text-anchor="middle">BC</text>
  <text x="414" y="128" fill="#8a8a8a" font-size="13" text-anchor="middle">A</text>

  <!-- column headers -->
  <text x="464" y="124" fill="#8a8a8a" font-size="13" text-anchor="middle">00</text>
  <text x="508" y="124" fill="#8a8a8a" font-size="13" text-anchor="middle">01</text>
  <text x="552" y="124" fill="#8a8a8a" font-size="13" text-anchor="middle">11</text>
  <text x="596" y="124" fill="#8a8a8a" font-size="13" text-anchor="middle">10</text>

  <!-- row headers -->
  <text x="434" y="163" fill="#8a8a8a" font-size="13" text-anchor="end">0</text>
  <text x="434" y="207" fill="#8a8a8a" font-size="13" text-anchor="end">1</text>

  <!-- grid 4x2, origin 442,132, cell 44 -->
  <line x1="442" y1="132" x2="618" y2="132" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="442" y1="176" x2="618" y2="176" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="442" y1="220" x2="618" y2="220" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="442" y1="132" x2="442" y2="220" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="486" y1="132" x2="486" y2="220" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="530" y1="132" x2="530" y2="220" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="574" y1="132" x2="574" y2="220" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="618" y1="132" x2="618" y2="220" stroke="#8a8a8a" stroke-width="1.2"/>

  <!-- minterm indices -->
  <text x="446" y="143" fill="#8a8a8a" font-size="9">0</text>
  <text x="490" y="143" fill="#8a8a8a" font-size="9">1</text>
  <text x="534" y="143" fill="#8a8a8a" font-size="9">3</text>
  <text x="578" y="143" fill="#8a8a8a" font-size="9">2</text>
  <text x="446" y="187" fill="#8a8a8a" font-size="9">4</text>
  <text x="490" y="187" fill="#8a8a8a" font-size="9">5</text>
  <text x="534" y="187" fill="#8a8a8a" font-size="9">7</text>
  <text x="578" y="187" fill="#8a8a8a" font-size="9">6</text>

  <!-- cell values, row A=0: 0 1 1 0 -->
  <text x="464" y="162" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="508" y="162" fill="#4a90d9" text-anchor="middle">1</text>
  <text x="552" y="162" fill="#4a90d9" text-anchor="middle">1</text>
  <text x="596" y="162" fill="#8a8a8a" text-anchor="middle">0</text>
  <!-- row A=1: 0 0 1 1 -->
  <text x="464" y="206" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="508" y="206" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="552" y="206" fill="#4a90d9" text-anchor="middle">1</text>
  <text x="596" y="206" fill="#4a90d9" text-anchor="middle">1</text>

  <!-- the two minimal groups -->
  <rect x="491" y="137" width="78" height="34" rx="10" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <rect x="535" y="181" width="78" height="34" rx="10" fill="none" stroke="#e0645c" stroke-width="2.5"/>

  <!-- the consensus term bridging them -->
  <ellipse cx="552" cy="176" rx="19" ry="40" fill="none" stroke="#e0645c" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- the seam where the glitch lives -->
  <line x1="640" y1="176" x2="576" y2="176" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="644" y="181" fill="#8a8a8a" font-size="12">the seam</text>

  <!-- panel (b) legend -->
  <rect x="410" y="326" width="18" height="10" rx="4" fill="none" stroke="#e0645c" stroke-width="2.2"/>
  <text x="436" y="336" fill="#e0645c" font-size="13">the two minimal groups: they touch, but never overlap</text>
  <ellipse cx="419" cy="355" rx="9" ry="6" fill="none" stroke="#e0645c" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="436" y="360" fill="#e0645c" font-size="13">consensus term BC (cells 3 and 7): redundant, hazard&#8211;free</text>
</svg>
