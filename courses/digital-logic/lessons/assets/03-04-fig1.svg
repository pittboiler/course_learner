<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ahg" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#8a8a8a"/>
    </marker>
    <marker id="ahb" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#4a90d9"/>
    </marker>
    <marker id="ahc" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#e0645c"/>
    </marker>
  </defs>

  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Moore 101 detector: state name, code Q1Q0, and output inside each circle. Coral = the two overlap arrows.</text>

  <!-- reset -->
  <line x1="12" y1="178" x2="42" y2="178" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ahg)"/>
  <text x="27" y="166" fill="#8a8a8a" font-size="11" text-anchor="middle">reset</text>

  <!-- states -->
  <circle cx="90" cy="178" r="44" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="90" y="169" fill="#8a8a8a" text-anchor="middle">none</text>
  <text x="90" y="185" fill="#8a8a8a" text-anchor="middle" font-size="11">00</text>
  <text x="90" y="201" fill="#8a8a8a" text-anchor="middle" font-size="11">y = 0</text>

  <circle cx="255" cy="178" r="44" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="255" y="169" fill="#8a8a8a" text-anchor="middle">saw 1</text>
  <text x="255" y="185" fill="#8a8a8a" text-anchor="middle" font-size="11">01</text>
  <text x="255" y="201" fill="#8a8a8a" text-anchor="middle" font-size="11">y = 0</text>

  <circle cx="420" cy="178" r="44" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="420" y="169" fill="#8a8a8a" text-anchor="middle">saw 10</text>
  <text x="420" y="185" fill="#8a8a8a" text-anchor="middle" font-size="11">10</text>
  <text x="420" y="201" fill="#8a8a8a" text-anchor="middle" font-size="11">y = 0</text>

  <circle cx="590" cy="178" r="44" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="590" y="169" fill="#8a8a8a" text-anchor="middle">saw 101</text>
  <text x="590" y="185" fill="#8a8a8a" text-anchor="middle" font-size="11">11</text>
  <text x="590" y="201" fill="#4a90d9" text-anchor="middle" font-size="11">y = 1</text>

  <!-- forward progress chain -->
  <line x1="134" y1="178" x2="207" y2="178" stroke="#4a90d9" stroke-width="2" marker-end="url(#ahb)"/>
  <text x="170" y="169" fill="#4a90d9" text-anchor="middle">1</text>
  <line x1="299" y1="178" x2="372" y2="178" stroke="#4a90d9" stroke-width="2" marker-end="url(#ahb)"/>
  <text x="335" y="169" fill="#4a90d9" text-anchor="middle">0</text>
  <line x1="464" y1="178" x2="542" y2="178" stroke="#4a90d9" stroke-width="2" marker-end="url(#ahb)"/>
  <text x="503" y="169" fill="#4a90d9" text-anchor="middle">1</text>

  <!-- self loops -->
  <path d="M59,147 C50,95 130,95 121,147" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ahg)"/>
  <text x="90" y="100" fill="#8a8a8a" text-anchor="middle">0</text>
  <path d="M224,147 C215,95 295,95 286,147" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ahg)"/>
  <text x="255" y="100" fill="#8a8a8a" text-anchor="middle">1</text>

  <!-- failure arrow: saw 10 back to none on 0 -->
  <path d="M389,209 C350,332 160,332 121,209" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ahg)"/>
  <text x="255" y="320" fill="#8a8a8a" text-anchor="middle">0</text>

  <!-- overlap arrows out of saw 101 -->
  <path d="M559,209 C546,282 464,282 451,209" fill="none" stroke="#e0645c" stroke-width="2" marker-end="url(#ahc)"/>
  <text x="505" y="281" fill="#e0645c" text-anchor="middle">0</text>
  <path d="M559,147 C525,55 350,52 293,156" fill="none" stroke="#e0645c" stroke-width="2" marker-end="url(#ahc)"/>
  <text x="435" y="68" fill="#e0645c" text-anchor="middle">1</text>
</svg>
