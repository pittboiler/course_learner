<svg viewBox="0 0 700 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">One clock and an AND chain buys you a clean count; chained clocks buy you a glitch.</text>

  <!-- ================= PANEL A: 4-bit synchronous up-counter ================= -->
  <text x="40" y="48" fill="#8a8a8a" font-size="12">(a) Synchronous: every flip-flop sees the same edge. Stage i toggles when all lower stages are 1.</text>

  <!-- T0 tied to logic 1 -->
  <text x="66" y="192" fill="#e0645c">1</text>
  <line x1="78" y1="188" x2="90" y2="188" stroke="#e0645c" stroke-width="1.5"/>

  <!-- FF0 -->
  <rect x="90" y="170" width="60" height="60" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="96" y="192" fill="#8a8a8a" font-size="12">T</text>
  <text x="144" y="192" fill="#8a8a8a" font-size="12" text-anchor="end">Q</text>
  <polygon points="90,206 101,214 90,222" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="120" y="162" fill="#8a8a8a" font-size="11" text-anchor="middle">T = 1</text>
  <text x="120" y="252" fill="#4a90d9" font-size="12" text-anchor="middle">Q0 (LSB)</text>

  <!-- FF1 -->
  <rect x="230" y="170" width="60" height="60" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="236" y="192" fill="#8a8a8a" font-size="12">T</text>
  <text x="284" y="192" fill="#8a8a8a" font-size="12" text-anchor="end">Q</text>
  <polygon points="230,206 241,214 230,222" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="260" y="162" fill="#8a8a8a" font-size="11" text-anchor="middle">T = Q0</text>
  <text x="260" y="252" fill="#4a90d9" font-size="12" text-anchor="middle">Q1</text>

  <!-- FF2 -->
  <rect x="370" y="170" width="60" height="60" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="376" y="192" fill="#8a8a8a" font-size="12">T</text>
  <text x="424" y="192" fill="#8a8a8a" font-size="12" text-anchor="end">Q</text>
  <polygon points="370,206 381,214 370,222" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="400" y="162" fill="#8a8a8a" font-size="11" text-anchor="middle">T = Q0Q1</text>
  <text x="400" y="252" fill="#4a90d9" font-size="12" text-anchor="middle">Q2</text>

  <!-- FF3 -->
  <rect x="510" y="170" width="60" height="60" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="516" y="192" fill="#8a8a8a" font-size="12">T</text>
  <text x="564" y="192" fill="#8a8a8a" font-size="12" text-anchor="end">Q</text>
  <polygon points="510,206 521,214 510,222" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="540" y="162" fill="#8a8a8a" font-size="11" text-anchor="middle">T = Q0Q1Q2</text>
  <text x="540" y="252" fill="#4a90d9" font-size="12" text-anchor="middle">Q3 (MSB)</text>

  <!-- feedback: Q0 to T1 and up to gate G2 -->
  <line x1="150" y1="188" x2="230" y2="188" stroke="#e0645c" stroke-width="1.5"/>
  <circle cx="170" cy="188" r="3.5" fill="#e0645c"/>
  <line x1="170" y1="188" x2="170" y2="101" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="170" y1="101" x2="320" y2="101" stroke="#e0645c" stroke-width="1.5"/>

  <!-- feedback: Q1 up to gate G2 -->
  <line x1="290" y1="188" x2="310" y2="188" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="310" y1="188" x2="310" y2="119" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="310" y1="119" x2="320" y2="119" stroke="#e0645c" stroke-width="1.5"/>

  <!-- G2: AND of Q0 and Q1 -->
  <path d="M 320 92 L 340 92 A 18 18 0 0 1 340 128 L 320 128 Z" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <line x1="358" y1="110" x2="362" y2="110" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="362" y1="61" x2="362" y2="188" stroke="#e0645c" stroke-width="1.5"/>
  <circle cx="362" cy="110" r="3.5" fill="#e0645c"/>
  <line x1="362" y1="188" x2="370" y2="188" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="362" y1="61" x2="460" y2="61" stroke="#e0645c" stroke-width="1.5"/>

  <!-- feedback: Q2 up to gate G3 -->
  <line x1="430" y1="188" x2="450" y2="188" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="450" y1="188" x2="450" y2="79" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="450" y1="79" x2="460" y2="79" stroke="#e0645c" stroke-width="1.5"/>

  <!-- G3: AND of (Q0Q1) and Q2 -->
  <path d="M 460 52 L 480 52 A 18 18 0 0 1 480 88 L 460 88 Z" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <line x1="498" y1="70" x2="502" y2="70" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="502" y1="70" x2="502" y2="188" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="502" y1="188" x2="510" y2="188" stroke="#e0645c" stroke-width="1.5"/>

  <!-- common clock bus -->
  <line x1="60" y1="270" x2="600" y2="270" stroke="#8a8a8a" stroke-width="2"/>
  <text x="52" y="274" fill="#8a8a8a" font-size="12" text-anchor="end">CLK</text>
  <line x1="70" y1="270" x2="70" y2="214" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="70" y1="214" x2="90" y2="214" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="70" cy="270" r="3.5" fill="#8a8a8a"/>
  <line x1="210" y1="270" x2="210" y2="214" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="210" y1="214" x2="230" y2="214" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="210" cy="270" r="3.5" fill="#8a8a8a"/>
  <line x1="350" y1="270" x2="350" y2="214" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="350" y1="214" x2="370" y2="214" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="350" cy="270" r="3.5" fill="#8a8a8a"/>
  <line x1="490" y1="270" x2="490" y2="214" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="490" y1="214" x2="510" y2="214" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="490" cy="270" r="3.5" fill="#8a8a8a"/>
  <text x="612" y="274" fill="#8a8a8a" font-size="11">one edge, all four</text>

  <!-- ================= divider ================= -->
  <line x1="40" y1="298" x2="660" y2="298" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- ================= PANEL B: ripple counter decoding glitch ================= -->
  <text x="40" y="322" fill="#8a8a8a" font-size="12">(b) Ripple: each stage is clocked by the one before it, so 0111 walks down to 1000 through three false codes.</text>

  <!-- t_cq marker -->
  <line x1="250" y1="344" x2="294" y2="344" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="250,344 258,341 258,347" fill="#e0645c"/>
  <polygon points="294,344 286,341 286,347" fill="#e0645c"/>
  <text x="302" y="348" fill="#e0645c" font-size="11">one t(cq) per stage</text>

  <!-- guides -->
  <line x1="250" y1="352" x2="250" y2="556" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="294" y1="352" x2="294" y2="556" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="338" y1="352" x2="338" y2="556" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="382" y1="352" x2="382" y2="556" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="426" y1="352" x2="426" y2="556" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- waveform labels -->
  <text x="108" y="376" fill="#8a8a8a" font-size="12" text-anchor="end">CLK</text>
  <text x="108" y="414" fill="#4a90d9" font-size="12" text-anchor="end">Q0</text>
  <text x="108" y="452" fill="#4a90d9" font-size="12" text-anchor="end">Q1</text>
  <text x="108" y="490" fill="#4a90d9" font-size="12" text-anchor="end">Q2</text>
  <text x="108" y="528" fill="#4a90d9" font-size="12" text-anchor="end">Q3</text>

  <!-- waveforms -->
  <path d="M 120 382 L 130 382 L 130 360 L 250 360 L 250 382 L 440 382 L 440 360 L 560 360 L 560 382 L 680 382" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <path d="M 120 398 L 294 398 L 294 420 L 604 420 L 604 398 L 680 398" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <path d="M 120 436 L 338 436 L 338 458 L 680 458" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <path d="M 120 474 L 382 474 L 382 496 L 680 496" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <path d="M 120 534 L 426 534 L 426 512 L 680 512" fill="none" stroke="#4a90d9" stroke-width="2"/>

  <!-- decoded value row -->
  <text x="120" y="572" fill="#8a8a8a" font-size="11">value:</text>
  <text x="212" y="572" fill="#8a8a8a" font-size="12" text-anchor="middle">0111</text>
  <text x="316" y="572" fill="#e0645c" font-size="11" text-anchor="middle">0110</text>
  <text x="360" y="572" fill="#e0645c" font-size="11" text-anchor="middle">0100</text>
  <text x="404" y="572" fill="#e0645c" font-size="11" text-anchor="middle">0000</text>
  <text x="515" y="572" fill="#8a8a8a" font-size="12" text-anchor="middle">1000</text>
  <text x="212" y="590" fill="#8a8a8a" font-size="11" text-anchor="middle">(7)</text>
  <text x="515" y="590" fill="#8a8a8a" font-size="11" text-anchor="middle">(8)</text>

  <!-- glitch bracket -->
  <line x1="294" y1="588" x2="426" y2="588" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="294,588 302,585 302,591" fill="#e0645c"/>
  <polygon points="426,588 418,585 418,591" fill="#e0645c"/>
  <text x="360" y="606" fill="#e0645c" font-size="11" text-anchor="middle">4 &#215; t(cq): the decoder sees 6, then 4, then 0</text>

  <text x="120" y="630" fill="#8a8a8a" font-size="12" font-style="italic">Correct at the edges, garbage in between &#8212; which is why a ripple count must never drive decode logic.</text>
</svg>
