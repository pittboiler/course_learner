<svg viewBox="0 0 540 290" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="bb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90d9"/>
    </marker>
    <marker id="bc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0645c"/>
    </marker>
  </defs>

  <text x="20" y="18" fill="#8a8a8a" font-style="italic" font-size="13">The circuit under analysis: two D flip-flops, one AND gate, one feedback wire.</text>

  <!-- input X -->
  <text x="34" y="113" fill="#4a90d9" font-size="14" text-anchor="end">X</text>
  <line x1="40" y1="108" x2="120" y2="108" stroke="#4a90d9" stroke-width="2" marker-end="url(#bb)"/>
  <circle cx="85" cy="108" r="3.5" fill="#4a90d9"/>
  <path d="M 85 108 L 85 60 L 218 60 L 218 97 L 250 97" fill="none" stroke="#4a90d9" stroke-width="2" marker-end="url(#bb)"/>

  <!-- FF0 -->
  <rect x="120" y="90" width="70" height="70" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="128" y="113" fill="#8a8a8a" font-size="13">D</text>
  <text x="182" y="113" fill="#8a8a8a" font-size="13" text-anchor="end">Q</text>
  <polygon points="120,136 131,142 120,148" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="155" y="180" fill="#8a8a8a" font-size="11" text-anchor="middle">FF0</text>

  <!-- Q0 feedback into the AND gate -->
  <path d="M 190 108 L 232 108 L 232 120 L 250 120" fill="none" stroke="#e0645c" stroke-width="2" marker-end="url(#bc)"/>
  <text x="196" y="100" fill="#e0645c" font-size="12">Q0</text>
  <text x="196" y="140" fill="#e0645c" font-size="11">feedback</text>

  <!-- AND gate -->
  <path d="M 250 86 L 272 86 A 22.5 22.5 0 0 1 272 131 L 250 131 Z" fill="#4a90d9" opacity="0.15"/>
  <path d="M 250 86 L 272 86 A 22.5 22.5 0 0 1 272 131 L 250 131 Z" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="272" y="152" fill="#4a90d9" font-size="11" text-anchor="middle">AND</text>
  <line x1="295" y1="108" x2="330" y2="108" stroke="#4a90d9" stroke-width="2" marker-end="url(#bb)"/>

  <!-- FF1 -->
  <rect x="330" y="90" width="70" height="70" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="338" y="113" fill="#8a8a8a" font-size="13">D</text>
  <text x="392" y="113" fill="#8a8a8a" font-size="13" text-anchor="end">Q</text>
  <polygon points="330,136 341,142 330,148" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="365" y="180" fill="#8a8a8a" font-size="11" text-anchor="middle">FF1</text>

  <!-- output -->
  <line x1="400" y1="108" x2="466" y2="108" stroke="#4a90d9" stroke-width="2" marker-end="url(#bb)"/>
  <text x="474" y="113" fill="#4a90d9" font-size="14">Z = Q1</text>

  <!-- clock distribution -->
  <text x="52" y="255" fill="#8a8a8a" font-size="12" text-anchor="end">CLK</text>
  <line x1="58" y1="250" x2="340" y2="250" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="100" cy="250" r="3.5" fill="#8a8a8a"/>
  <circle cx="310" cy="250" r="3.5" fill="#8a8a8a"/>
  <path d="M 100 250 L 100 142 L 120 142" fill="none" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#bg)"/>
  <path d="M 310 250 L 310 142 L 330 142" fill="none" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#bg)"/>
  <text x="352" y="255" fill="#8a8a8a" font-size="11">one clock, both flip-flops</text>

  <text x="20" y="278" fill="#8a8a8a" font-size="11" font-style="italic">D1 = X &#183; Q0</text>
  <text x="150" y="278" fill="#8a8a8a" font-size="11" font-style="italic">D0 = X</text>
  <text x="250" y="278" fill="#8a8a8a" font-size="11" font-style="italic">Z = Q1</text>
</svg>
