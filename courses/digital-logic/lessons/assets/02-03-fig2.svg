<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">One control wire turns an adder into a subtractor: SUB flips every B bit and supplies the +1 as the carry-in.</text>

  <!-- SUB control bus -->
  <line x1="40" y1="48" x2="664" y2="48" stroke="#e0645c" stroke-width="3"/>
  <text x="672" y="53" fill="#e0645c">SUB</text>

  <!-- ===== stage 3 ===== -->
  <line x1="48" y1="48" x2="48" y2="112" stroke="#e0645c" stroke-width="3"/>
  <line x1="48" y1="112" x2="66" y2="112" stroke="#e0645c" stroke-width="3"/>
  <circle cx="48" cy="48" r="4" fill="#e0645c"/>
  <text x="66" y="72" fill="#8a8a8a" font-size="12" text-anchor="middle">B<tspan font-size="9" dy="3">3</tspan></text>
  <line x1="66" y1="80" x2="66" y2="98" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M 61,91 Q 71,105 61,119" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <path d="M 66,91 Q 76,105 66,119 Q 83,119 100,105 Q 83,91 66,91 Z" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <line x1="100" y1="105" x2="100" y2="150" stroke="#4a90d9" stroke-width="2"/>
  <text x="140" y="72" fill="#8a8a8a" font-size="12" text-anchor="middle">A<tspan font-size="9" dy="3">3</tspan></text>
  <line x1="140" y1="80" x2="140" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="70" y="150" width="96" height="62" fill="#4a90d9" fill-opacity="0.10" stroke="#8a8a8a" stroke-width="2"/>
  <text x="118" y="186" fill="#8a8a8a" text-anchor="middle">FA3</text>
  <line x1="118" y1="212" x2="118" y2="240" stroke="#4a90d9" stroke-width="2"/>
  <text x="118" y="256" fill="#4a90d9" font-size="12" text-anchor="middle">S<tspan font-size="9" dy="3">3</tspan></text>
  <!-- ===== stage 2 ===== -->
  <line x1="188" y1="48" x2="188" y2="112" stroke="#e0645c" stroke-width="3"/>
  <line x1="188" y1="112" x2="206" y2="112" stroke="#e0645c" stroke-width="3"/>
  <circle cx="188" cy="48" r="4" fill="#e0645c"/>
  <text x="206" y="72" fill="#8a8a8a" font-size="12" text-anchor="middle">B<tspan font-size="9" dy="3">2</tspan></text>
  <line x1="206" y1="80" x2="206" y2="98" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M 201,91 Q 211,105 201,119" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <path d="M 206,91 Q 216,105 206,119 Q 223,119 240,105 Q 223,91 206,91 Z" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <line x1="240" y1="105" x2="240" y2="150" stroke="#4a90d9" stroke-width="2"/>
  <text x="280" y="72" fill="#8a8a8a" font-size="12" text-anchor="middle">A<tspan font-size="9" dy="3">2</tspan></text>
  <line x1="280" y1="80" x2="280" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="210" y="150" width="96" height="62" fill="#4a90d9" fill-opacity="0.10" stroke="#8a8a8a" stroke-width="2"/>
  <text x="258" y="186" fill="#8a8a8a" text-anchor="middle">FA2</text>
  <line x1="258" y1="212" x2="258" y2="240" stroke="#4a90d9" stroke-width="2"/>
  <text x="258" y="256" fill="#4a90d9" font-size="12" text-anchor="middle">S<tspan font-size="9" dy="3">2</tspan></text>
  <!-- ===== stage 1 ===== -->
  <line x1="328" y1="48" x2="328" y2="112" stroke="#e0645c" stroke-width="3"/>
  <line x1="328" y1="112" x2="346" y2="112" stroke="#e0645c" stroke-width="3"/>
  <circle cx="328" cy="48" r="4" fill="#e0645c"/>
  <text x="346" y="72" fill="#8a8a8a" font-size="12" text-anchor="middle">B<tspan font-size="9" dy="3">1</tspan></text>
  <line x1="346" y1="80" x2="346" y2="98" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M 341,91 Q 351,105 341,119" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <path d="M 346,91 Q 356,105 346,119 Q 363,119 380,105 Q 363,91 346,91 Z" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <line x1="380" y1="105" x2="380" y2="150" stroke="#4a90d9" stroke-width="2"/>
  <text x="420" y="72" fill="#8a8a8a" font-size="12" text-anchor="middle">A<tspan font-size="9" dy="3">1</tspan></text>
  <line x1="420" y1="80" x2="420" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="350" y="150" width="96" height="62" fill="#4a90d9" fill-opacity="0.10" stroke="#8a8a8a" stroke-width="2"/>
  <text x="398" y="186" fill="#8a8a8a" text-anchor="middle">FA1</text>
  <line x1="398" y1="212" x2="398" y2="240" stroke="#4a90d9" stroke-width="2"/>
  <text x="398" y="256" fill="#4a90d9" font-size="12" text-anchor="middle">S<tspan font-size="9" dy="3">1</tspan></text>
  <!-- ===== stage 0 ===== -->
  <line x1="468" y1="48" x2="468" y2="112" stroke="#e0645c" stroke-width="3"/>
  <line x1="468" y1="112" x2="486" y2="112" stroke="#e0645c" stroke-width="3"/>
  <circle cx="468" cy="48" r="4" fill="#e0645c"/>
  <text x="486" y="72" fill="#8a8a8a" font-size="12" text-anchor="middle">B<tspan font-size="9" dy="3">0</tspan></text>
  <line x1="486" y1="80" x2="486" y2="98" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M 481,91 Q 491,105 481,119" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <path d="M 486,91 Q 496,105 486,119 Q 503,119 520,105 Q 503,91 486,91 Z" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <line x1="520" y1="105" x2="520" y2="150" stroke="#4a90d9" stroke-width="2"/>
  <text x="560" y="72" fill="#8a8a8a" font-size="12" text-anchor="middle">A<tspan font-size="9" dy="3">0</tspan></text>
  <line x1="560" y1="80" x2="560" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="490" y="150" width="96" height="62" fill="#4a90d9" fill-opacity="0.10" stroke="#8a8a8a" stroke-width="2"/>
  <text x="538" y="186" fill="#8a8a8a" text-anchor="middle">FA0</text>
  <line x1="538" y1="212" x2="538" y2="240" stroke="#4a90d9" stroke-width="2"/>
  <text x="538" y="256" fill="#4a90d9" font-size="12" text-anchor="middle">S<tspan font-size="9" dy="3">0</tspan></text>

  <!-- carry chain -->
  <line x1="664" y1="48" x2="664" y2="181" stroke="#e0645c" stroke-width="3"/>
  <line x1="664" y1="181" x2="586" y2="181" stroke="#e0645c" stroke-width="3"/>
  <polygon points="586,181 596,176 596,186" fill="#e0645c"/>
  <text x="624" y="172" fill="#e0645c" font-size="12" text-anchor="middle">C<tspan font-size="9" dy="3">0</tspan><tspan dy="-3"> = SUB</tspan></text>

  <line x1="490" y1="181" x2="446" y2="181" stroke="#e0645c" stroke-width="3"/>
  <polygon points="446,181 456,176 456,186" fill="#e0645c"/>
  <text x="468" y="172" fill="#e0645c" font-size="12" text-anchor="middle">C<tspan font-size="9" dy="3">1</tspan></text>

  <line x1="350" y1="181" x2="306" y2="181" stroke="#e0645c" stroke-width="3"/>
  <polygon points="306,181 316,176 316,186" fill="#e0645c"/>
  <text x="328" y="172" fill="#e0645c" font-size="12" text-anchor="middle">C<tspan font-size="9" dy="3">2</tspan></text>

  <line x1="210" y1="181" x2="166" y2="181" stroke="#e0645c" stroke-width="3"/>
  <polygon points="166,181 176,176 176,186" fill="#e0645c"/>
  <text x="188" y="172" fill="#e0645c" font-size="12" text-anchor="middle">C<tspan font-size="9" dy="3">3</tspan></text>

  <line x1="70" y1="181" x2="16" y2="181" stroke="#e0645c" stroke-width="3"/>
  <polygon points="16,181 26,176 26,186" fill="#e0645c"/>
  <text x="44" y="172" fill="#e0645c" font-size="12" text-anchor="middle">C<tspan font-size="9" dy="3">4</tspan></text>

  <text x="40" y="288" fill="#8a8a8a" font-size="13">SUB = 0 &#160;&#8594;&#160; each XOR passes B through, C<tspan font-size="10" dy="3">0</tspan><tspan dy="-3"> = 0 &#160;&#8594;&#160; the unit computes A + B</tspan></text>
  <text x="40" y="310" fill="#e0645c" font-size="13">SUB = 1 &#160;&#8594;&#160; each XOR inverts B, C<tspan font-size="10" dy="3">0</tspan><tspan dy="-3"> = 1 &#160;&#8594;&#160; the unit computes A + (invert B) + 1 = A &#8722; B</tspan></text>
</svg>
