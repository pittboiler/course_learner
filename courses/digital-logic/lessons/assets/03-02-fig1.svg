<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">A positive&#8211;edge&#8211;triggered D flip&#8211;flop: Q copies D only at the coral edges, and only after t-cq.</text>

  <!-- edge numbers -->
  <text x="130" y="46" fill="#8a8a8a" font-size="11" text-anchor="middle">1</text>
  <text x="260" y="46" fill="#8a8a8a" font-size="11" text-anchor="middle">2</text>
  <text x="390" y="46" fill="#8a8a8a" font-size="11" text-anchor="middle">3</text>
  <text x="520" y="46" fill="#8a8a8a" font-size="11" text-anchor="middle">4</text>

  <!-- setup and hold windows around edge 2 -->
  <rect x="232" y="132" width="28" height="44" fill="#e0645c" opacity="0.25"/>
  <rect x="260" y="132" width="14" height="44" fill="#4a90d9" opacity="0.30"/>
  <text x="246" y="126" fill="#e0645c" font-size="12" text-anchor="middle">t<tspan font-size="9" dy="3">su</tspan></text>
  <line x1="267" y1="176" x2="267" y2="184" stroke="#4a90d9" stroke-width="1"/>
  <text x="267" y="196" fill="#4a90d9" font-size="12" text-anchor="middle">t<tspan font-size="9" dy="3">h</tspan></text>

  <!-- rising clock edges -->
  <line x1="130" y1="52" x2="130" y2="268" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="260" y1="52" x2="260" y2="268" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="390" y1="52" x2="390" y2="268" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="520" y1="52" x2="520" y2="268" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- CLK -->
  <text x="50" y="80" fill="#8a8a8a">CLK</text>
  <path d="M 100 88 H 130 V 60 H 195 V 88 H 260 V 60 H 325 V 88 H 390 V 60 H 455 V 88 H 520 V 60 H 585 V 88 H 660"
        fill="none" stroke="#8a8a8a" stroke-width="2.5"/>

  <!-- D -->
  <text x="50" y="160" fill="#4a90d9">D</text>
  <path d="M 100 168 H 165 V 140 H 300 V 168 H 340 V 140 H 370 V 168 H 480 V 140 H 660"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- sampling instants -->
  <circle cx="130" cy="168" r="4" fill="#e0645c"/>
  <circle cx="260" cy="140" r="4" fill="#e0645c"/>
  <circle cx="390" cy="168" r="4" fill="#e0645c"/>
  <circle cx="520" cy="140" r="4" fill="#e0645c"/>

  <!-- lost pulse annotation -->
  <line x1="355" y1="196" x2="355" y2="174" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="326" y="210" fill="#8a8a8a" font-size="11">pulse lost</text>

  <!-- Q -->
  <text x="50" y="246" fill="#4a90d9">Q</text>
  <path d="M 100 254 H 278 V 226 H 408 V 254 H 538 V 226 H 660"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- t-cq annotation on the first Q transition -->
  <line x1="278" y1="226" x2="278" y2="284" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="260" y1="278" x2="278" y2="278" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="260,278 268,274 268,282" fill="#e0645c"/>
  <polygon points="278,278 270,274 270,282" fill="#e0645c"/>
  <text x="286" y="282" fill="#e0645c" font-size="12">t<tspan font-size="9" dy="3">cq</tspan></text>

  <!-- time axis -->
  <line x1="100" y1="300" x2="670" y2="300" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="670,300 660,296 660,304" fill="#8a8a8a"/>
  <text x="676" y="304" fill="#8a8a8a" font-size="12">t</text>

  <!-- sampled values -->
  <text x="130" y="318" fill="#8a8a8a" font-size="11" text-anchor="middle">samples 0</text>
  <text x="260" y="318" fill="#8a8a8a" font-size="11" text-anchor="middle">samples 1</text>
  <text x="390" y="318" fill="#8a8a8a" font-size="11" text-anchor="middle">samples 0</text>
  <text x="520" y="318" fill="#8a8a8a" font-size="11" text-anchor="middle">samples 1</text>
</svg>
