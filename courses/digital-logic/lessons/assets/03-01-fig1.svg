<svg viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">

  <text x="40" y="22" fill="#8a8a8a" font-style="italic" font-size="13">Feedback makes one bit stick &#8212; but while EN is high the D latch is a window, not a snapshot.</text>

  <!-- ================= panel (a): cross coupled NOR SR latch ================= -->
  <text x="40" y="48" fill="#8a8a8a" font-style="italic" font-size="12">(a) Cross&#8211;coupled NOR gates. The coral wires are the feedback; they are the memory.</text>

  <!-- NOR 1 -->
  <path d="M 200,70 Q 216,90 200,110 Q 230,108 246,90 Q 230,72 200,70 Z" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="251" cy="90" r="5" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="212" y="95" fill="#4a90d9" font-size="11">NOR</text>

  <!-- NOR 2 -->
  <path d="M 200,140 Q 216,160 200,180 Q 230,178 246,160 Q 230,142 200,140 Z" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="251" cy="160" r="5" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="212" y="165" fill="#4a90d9" font-size="11">NOR</text>

  <!-- external inputs -->
  <line x1="155" y1="81" x2="207" y2="81" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="136" y="86" fill="#8a8a8a">R</text>
  <line x1="155" y1="169" x2="207" y2="169" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="136" y="174" fill="#8a8a8a">S</text>

  <!-- outputs -->
  <line x1="256" y1="90" x2="420" y2="90" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="256" y1="160" x2="420" y2="160" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="428" y="96" fill="#8a8a8a">Q</text>
  <text x="428" y="166" fill="#8a8a8a">Q</text>
  <line x1="427" y1="151" x2="440" y2="151" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- feedback A: Q back to the top input of NOR 2 -->
  <path d="M 310,90 L 310,118 L 120,118 L 120,151 L 207,151" fill="none" stroke="#e0645c" stroke-width="2"/>
  <circle cx="310" cy="90" r="3.5" fill="#e0645c"/>

  <!-- feedback B: Q bar back to the bottom input of NOR 1 -->
  <path d="M 330,160 L 330,196 L 100,196 L 100,99 L 207,99" fill="none" stroke="#e0645c" stroke-width="2"/>
  <circle cx="330" cy="160" r="3.5" fill="#e0645c"/>

  <text x="340" y="212" fill="#e0645c" font-size="12" font-style="italic">feedback</text>
  <text x="460" y="110" fill="#8a8a8a" font-size="12">S=1, R=0 &#8594; set</text>
  <text x="460" y="130" fill="#8a8a8a" font-size="12">S=0, R=1 &#8594; reset</text>
  <text x="460" y="150" fill="#8a8a8a" font-size="12">S=R=0 &#8594; hold (the bit)</text>

  <!-- ================= panel (b): timing diagram ================= -->
  <text x="40" y="246" fill="#8a8a8a" font-style="italic" font-size="12">(b) While EN is high the latch is transparent: Q copies D continuously, glitch and all.</text>

  <!-- transparent windows -->
  <rect x="150" y="268" width="150" height="182" fill="#e0645c" opacity="0.10"/>
  <rect x="420" y="268" width="140" height="182" fill="#e0645c" opacity="0.10"/>
  <text x="158" y="264" fill="#8a8a8a" font-size="11" font-style="italic">transparent</text>
  <text x="428" y="264" fill="#8a8a8a" font-size="11" font-style="italic">transparent</text>
  <text x="243" y="264" fill="#e0645c" font-size="11" font-style="italic">glitch</text>

  <!-- signal names -->
  <text x="42" y="300" fill="#8a8a8a">D</text>
  <text x="30" y="366" fill="#8a8a8a">EN</text>
  <text x="42" y="432" fill="#8a8a8a">Q</text>

  <!-- D waveform: high = 280, low = 306 -->
  <path d="M 70,306 L 110,306 L 110,280 L 200,280 L 200,306 L 250,306" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <path d="M 250,306 L 250,280 L 270,280 L 270,306" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <path d="M 270,306 L 340,306 L 340,280 L 470,280 L 470,306 L 520,306 L 520,280 L 630,280" fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- EN waveform: high = 346, low = 372 -->
  <path d="M 70,372 L 150,372 L 150,346 L 300,346 L 300,372 L 420,372 L 420,346 L 560,346 L 560,372 L 630,372" fill="none" stroke="#8a8a8a" stroke-width="2.5"/>

  <!-- Q waveform: high = 412, low = 438 -->
  <path d="M 70,438 L 150,438 L 150,412 L 200,412 L 200,438 L 250,438" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <path d="M 250,438 L 250,412 L 270,412 L 270,438" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <path d="M 270,438 L 420,438 L 420,412 L 470,412 L 470,438 L 520,438 L 520,412 L 630,412" fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- glitch propagates -->
  <line x1="260" y1="286" x2="260" y2="404" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="4 4"/>
  <polygon points="260,412 256,402 264,402" fill="#e0645c"/>

  <!-- D moves while EN is low, and is ignored -->
  <line x1="340" y1="286" x2="340" y2="450" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="316" y="464" fill="#8a8a8a" font-size="11" font-style="italic">ignored</text>

  <text x="470" y="464" fill="#8a8a8a" font-size="11" font-style="italic">EN falls: Q freezes at D</text>

</svg>
