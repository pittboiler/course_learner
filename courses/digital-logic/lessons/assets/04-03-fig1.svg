<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">The same two functions built twice: a PLA programs both planes; a ROM freezes the AND plane into a full decoder.</text>

  <line x1="392" y1="38" x2="392" y2="348" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- ================= LEFT: PLA ================= -->
  <text x="40" y="44" fill="#8a8a8a" font-size="13">PLA: 3 product terms, one of them shared</text>
  <text x="58" y="64" fill="#8a8a8a" font-size="11">AND plane (programmable)</text>
  <text x="234" y="64" fill="#8a8a8a" font-size="11">OR plane (programmable)</text>

  <!-- input labels with drawn overlines for complements -->
  <text x="70" y="86" fill="#8a8a8a" text-anchor="middle">A</text>
  <text x="92" y="86" fill="#8a8a8a" text-anchor="middle">A</text>
  <line x1="87" y1="76" x2="97" y2="76" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="118" y="86" fill="#8a8a8a" text-anchor="middle">B</text>
  <text x="140" y="86" fill="#8a8a8a" text-anchor="middle">B</text>
  <line x1="135" y1="76" x2="145" y2="76" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="166" y="86" fill="#8a8a8a" text-anchor="middle">C</text>
  <text x="188" y="86" fill="#8a8a8a" text-anchor="middle">C</text>
  <line x1="183" y1="76" x2="193" y2="76" stroke="#8a8a8a" stroke-width="1.2"/>

  <!-- vertical input lines -->
  <line x1="70" y1="92" x2="70" y2="205" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="92" y1="92" x2="92" y2="205" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="118" y1="92" x2="118" y2="205" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="140" y1="92" x2="140" y2="205" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="166" y1="92" x2="166" y2="205" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="188" y1="92" x2="188" y2="205" stroke="#8a8a8a" stroke-width="1"/>

  <!-- product term rows: crossbar segment (grey) -->
  <line x1="58" y1="115" x2="196" y2="115" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="58" y1="150" x2="196" y2="150" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="58" y1="185" x2="196" y2="185" stroke="#8a8a8a" stroke-width="1"/>

  <!-- AND gates -->
  <g fill="none" stroke="#4a90d9" stroke-width="2">
    <path d="M 0 -12 L 12 -12 A 12 12 0 0 1 12 12 L 0 12 Z" transform="translate(196,115)"/>
    <path d="M 0 -12 L 12 -12 A 12 12 0 0 1 12 12 L 0 12 Z" transform="translate(196,150)"/>
    <path d="M 0 -12 L 12 -12 A 12 12 0 0 1 12 12 L 0 12 Z" transform="translate(196,185)"/>
  </g>

  <!-- product term lines into the OR plane -->
  <line x1="220" y1="115" x2="325" y2="115" stroke="#4a90d9" stroke-width="2"/>
  <line x1="220" y1="150" x2="325" y2="150" stroke="#4a90d9" stroke-width="2"/>
  <line x1="220" y1="185" x2="325" y2="185" stroke="#4a90d9" stroke-width="2"/>

  <!-- product term labels -->
  <text x="228" y="110" fill="#4a90d9">AB</text>
  <text x="228" y="145" fill="#4a90d9">AC</text>
  <line x1="228" y1="136" x2="237" y2="136" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="228" y="180" fill="#4a90d9">BC</text>
  <line x1="237" y1="171" x2="246" y2="171" stroke="#4a90d9" stroke-width="1.2"/>

  <!-- OR plane vertical output lines -->
  <line x1="258" y1="100" x2="258" y2="232" stroke="#4a90d9" stroke-width="2"/>
  <line x1="300" y1="100" x2="300" y2="232" stroke="#4a90d9" stroke-width="2"/>

  <!-- programmed dots: AND plane -->
  <g fill="#e0645c">
    <circle cx="70" cy="115" r="4"/>
    <circle cx="118" cy="115" r="4"/>
    <circle cx="92" cy="150" r="4"/>
    <circle cx="166" cy="150" r="4"/>
    <circle cx="118" cy="185" r="4"/>
    <circle cx="188" cy="185" r="4"/>
    <circle cx="258" cy="115" r="4"/>
    <circle cx="258" cy="150" r="4"/>
    <circle cx="300" cy="115" r="4"/>
    <circle cx="300" cy="185" r="4"/>
  </g>

  <!-- OR gates -->
  <g fill="none" stroke="#4a90d9" stroke-width="2">
    <path d="M 0 -14 Q 10 0 0 14 Q 20 14 30 0 Q 20 -14 0 -14 Z" transform="translate(258,232) rotate(90)"/>
    <path d="M 0 -14 Q 10 0 0 14 Q 20 14 30 0 Q 20 -14 0 -14 Z" transform="translate(300,232) rotate(90)"/>
  </g>
  <line x1="258" y1="262" x2="258" y2="284" stroke="#4a90d9" stroke-width="2"/>
  <line x1="300" y1="262" x2="300" y2="284" stroke="#4a90d9" stroke-width="2"/>
  <text x="258" y="300" fill="#4a90d9" text-anchor="middle">F1</text>
  <text x="300" y="300" fill="#4a90d9" text-anchor="middle">F2</text>

  <!-- ================= RIGHT: ROM ================= -->
  <text x="412" y="44" fill="#8a8a8a" font-size="13">ROM: fixed decoder generates all 8 minterms</text>
  <text x="412" y="64" fill="#8a8a8a" font-size="11">AND plane (fixed)</text>
  <text x="566" y="64" fill="#8a8a8a" font-size="11">OR plane (programmable)</text>

  <text x="394" y="134" fill="#8a8a8a" text-anchor="end">A</text>
  <text x="394" y="164" fill="#8a8a8a" text-anchor="end">B</text>
  <text x="394" y="194" fill="#8a8a8a" text-anchor="end">C</text>
  <line x1="398" y1="130" x2="428" y2="130" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="398" y1="160" x2="428" y2="160" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="398" y1="190" x2="428" y2="190" stroke="#8a8a8a" stroke-width="1"/>

  <rect x="428" y="95" width="46" height="176" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="451" y="179" fill="#8a8a8a" text-anchor="middle" transform="rotate(-90 451 183)">3-to-8</text>
  <text x="451" y="195" fill="#8a8a8a" text-anchor="middle" transform="rotate(-90 451 183)">decoder</text>

  <!-- minterm word lines -->
  <g stroke="#8a8a8a" stroke-width="1">
    <line x1="474" y1="105" x2="680" y2="105"/>
    <line x1="474" y1="127" x2="680" y2="127"/>
    <line x1="474" y1="149" x2="680" y2="149"/>
    <line x1="474" y1="171" x2="680" y2="171"/>
    <line x1="474" y1="193" x2="680" y2="193"/>
    <line x1="474" y1="215" x2="680" y2="215"/>
    <line x1="474" y1="237" x2="680" y2="237"/>
    <line x1="474" y1="259" x2="680" y2="259"/>
  </g>
  <g fill="#8a8a8a" font-size="10">
    <text x="480" y="101">m0</text>
    <text x="480" y="123">m1</text>
    <text x="480" y="145">m2</text>
    <text x="480" y="167">m3</text>
    <text x="480" y="189">m4</text>
    <text x="480" y="211">m5</text>
    <text x="480" y="233">m6</text>
    <text x="480" y="255">m7</text>
  </g>

  <line x1="604" y1="92" x2="604" y2="278" stroke="#4a90d9" stroke-width="2"/>
  <line x1="650" y1="92" x2="650" y2="278" stroke="#4a90d9" stroke-width="2"/>

  <g fill="#e0645c">
    <circle cx="604" cy="127" r="4"/>
    <circle cx="604" cy="171" r="4"/>
    <circle cx="604" cy="237" r="4"/>
    <circle cx="604" cy="259" r="4"/>
    <circle cx="650" cy="149" r="4"/>
    <circle cx="650" cy="237" r="4"/>
    <circle cx="650" cy="259" r="4"/>
  </g>

  <g fill="none" stroke="#4a90d9" stroke-width="2">
    <path d="M 0 -14 Q 10 0 0 14 Q 20 14 30 0 Q 20 -14 0 -14 Z" transform="translate(604,278) rotate(90)"/>
    <path d="M 0 -14 Q 10 0 0 14 Q 20 14 30 0 Q 20 -14 0 -14 Z" transform="translate(650,278) rotate(90)"/>
  </g>
  <line x1="604" y1="308" x2="604" y2="330" stroke="#4a90d9" stroke-width="2"/>
  <line x1="650" y1="308" x2="650" y2="330" stroke="#4a90d9" stroke-width="2"/>
  <text x="604" y="346" fill="#4a90d9" text-anchor="middle">F1</text>
  <text x="650" y="346" fill="#4a90d9" text-anchor="middle">F2</text>

  <!-- legend -->
  <circle cx="48" cy="326" r="4" fill="#e0645c"/>
  <text x="58" y="330" fill="#8a8a8a" font-size="11">a dot marks a programmed connection (a stored 1)</text>
</svg>
