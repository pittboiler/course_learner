    <line x1="84" y1="329" x2="143" y2="329"/>
    <line x1="58" y1="376" x2="150" y2="376"/>
  </g>
  <g fill="#8a8a8a">
    <circle cx="58" cy="199" r="3"/><circle cx="84" cy="217" r="3"/>
    <circle cx="58" cy="255" r="3"/><circle cx="84" cy="273" r="3"/>
    <circle cx="58" cy="311" r="3"/><circle cx="84" cy="329" r="3"/>
    <circle cx="58" cy="376" r="3"/>
  </g>

  <g stroke="#8a8a8a" stroke-width="1.5" fill="none">
    <path d="M150,190 H174 A18,18 0 0 1 174,226 H150 Z"/>
    <path d="M150,246 Q172,246 192,264 Q172,282 150,282 Q162,264 150,246 Z"/>
    <path d="M150,302 Q172,302 192,320 Q172,338 150,338 Q162,320 150,302 Z"/>
    <path d="M143,302 Q155,320 143,338"/>
    <path d="M150,358 L182,376 L150,394 Z"/>
    <circle cx="186" cy="376" r="4"/>
  </g>
  <g font-size="9" fill="#8a8a8a" text-anchor="middle">
    <text x="171" y="186">AND</text>
    <text x="171" y="242">OR</text>
    <text x="171" y="298">XOR</text>
    <text x="171" y="354">NOT A</text>
  </g>

  <g stroke="#8a8a8a" stroke-width="1.2">
    <line x1="192" y1="208" x2="250" y2="208"/>
    <line x1="192" y1="264" x2="250" y2="264"/>
    <line x1="192" y1="320" x2="250" y2="320"/>
    <line x1="190" y1="376" x2="250" y2="376"/>
  </g>

  <path d="M250,188 L290,222 L290,366 L250,400 Z" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <g font-size="9" fill="#8a8a8a">
    <text x="255" y="212">0</text><text x="255" y="268">1</text>
    <text x="255" y="324">2</text><text x="255" y="380">3</text>
  </g>
  <text x="274" y="294" font-size="10" fill="#8a8a8a" text-anchor="middle" transform="rotate(-90 274 294)">4-to-1 MUX</text>
  <line x1="270" y1="412" x2="270" y2="385" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="270" y="426" font-size="11" fill="#8a8a8a" text-anchor="middle">S<tspan font-size="9" dy="3">1</tspan>S<tspan font-size="9" dy="0">0</tspan></text>

  <polyline points="290,294 480,294 480,260 520,260" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>

  <path d="M520,112 L560,146 L560,254 L520,288 Z" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <g font-size="9" fill="#8a8a8a">
    <text x="525" y="144">0</text><text x="525" y="264">1</text>
  </g>
  <text x="548" y="200" font-size="10" fill="#8a8a8a" text-anchor="middle" transform="rotate(-90 548 200)">2-to-1 MUX</text>
  <line x1="540" y1="300" x2="540" y2="273" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="540" y="314" font-size="11" fill="#8a8a8a" text-anchor="middle">S<tspan font-size="9" dy="3">2</tspan></text>

  <line x1="560" y1="200" x2="615" y2="200" stroke="#e0645c" stroke-width="1.6"/>
  <text x="622" y="204" font-size="12" fill="#e0645c">F<tspan font-size="9" dy="3">i</tspan></text>
</svg>
