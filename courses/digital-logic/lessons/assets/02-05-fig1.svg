<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" font-family="Helvetica, Arial, sans-serif">
  <text x="10" y="18" font-size="12" font-style="italic" fill="#8a8a8a">One-bit ALU slice: arithmetic unit, logic unit, output mux. Coral marks the path active for SUB (select 001).</text>

  <rect x="128" y="62" width="320" height="104" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="132" y="56" font-size="10" font-style="italic" fill="#8a8a8a">arithmetic unit</text>
  <rect x="128" y="176" width="180" height="230" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="246" y="194" font-size="10" font-style="italic" fill="#8a8a8a" text-anchor="end">logic unit</text>

  <line x1="58" y1="66" x2="58" y2="380" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="58" y="58" font-size="12" fill="#4a90d9" text-anchor="middle">A<tspan font-size="9" dy="3">i</tspan></text>
  <line x1="84" y1="66" x2="84" y2="332" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="90" y="58" font-size="12" fill="#4a90d9" text-anchor="middle">B<tspan font-size="9" dy="3">i</tspan></text>

  <line x1="58" y1="90" x2="330" y2="90" stroke="#e0645c" stroke-width="1.4"/>
  <circle cx="58" cy="90" r="3" fill="#e0645c"/>
  <line x1="84" y1="113" x2="143" y2="113" stroke="#e0645c" stroke-width="1.4"/>
  <circle cx="84" cy="113" r="3" fill="#e0645c"/>

  <g stroke="#e0645c" stroke-width="1.6" fill="none">
    <path d="M150,104 Q172,104 192,122 Q172,140 150,140 Q162,122 150,104 Z"/>
    <path d="M143,104 Q155,122 143,140"/>
  </g>
  <line x1="118" y1="131" x2="143" y2="131" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="116" y="135" font-size="11" fill="#8a8a8a" text-anchor="end">S<tspan font-size="9" dy="3">0</tspan></text>

  <polyline points="192,122 212,122 212,113 230,113" fill="none" stroke="#e0645c" stroke-width="1.4"/>
  <g stroke="#e0645c" stroke-width="1.6" fill="none">
    <path d="M230,104 H254 A18,18 0 0 1 254,140 H230 Z"/>
  </g>
  <line x1="205" y1="131" x2="230" y2="131" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="203" y="152" font-size="11" fill="#8a8a8a" text-anchor="end">S<tspan font-size="9" dy="3">1</tspan></text>
  <line x1="188" y1="141" x2="203" y2="141" stroke="#8a8a8a" stroke-width="1.1"/>

  <line x1="272" y1="122" x2="330" y2="122" stroke="#e0645c" stroke-width="1.4"/>
  <text x="301" y="116" font-size="11" fill="#e0645c" text-anchor="middle">Y<tspan font-size="9" dy="3">i</tspan></text>

  <rect x="330" y="70" width="100" height="90" fill="none" stroke="#e0645c" stroke-width="1.6"/>
  <text x="380" y="106" font-size="11" fill="#e0645c" text-anchor="middle">FULL</text>
  <text x="380" y="122" font-size="11" fill="#e0645c" text-anchor="middle">ADDER</text>

  <line x1="350" y1="190" x2="350" y2="160" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="356" y="200" font-size="10" fill="#8a8a8a">C<tspan font-size="9" dy="3">i</tspan> from slice i&#8722;1</text>
  <line x1="410" y1="70" x2="410" y2="46" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="416" y="42" font-size="10" fill="#8a8a8a">C<tspan font-size="9" dy="3">i+1</tspan> to slice i+1</text>

  <polyline points="430,95 480,95 480,140 520,140" fill="none" stroke="#e0645c" stroke-width="1.4"/>
  <text x="455" y="89" font-size="11" fill="#e0645c" text-anchor="middle">&#931;<tspan font-size="9" dy="3">i</tspan></text>

  <g stroke="#8a8a8a" stroke-width="1.2">
    <line x1="58" y1="199" x2="150" y2="199"/>
    <line x1="84" y1="217" x2="150" y2="217"/>
    <line x1="58" y1="255" x2="150" y2="255"/>
