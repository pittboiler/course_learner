<svg viewBox="0 0 640 322" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic" font-size="13">Eight clock cycles of the worked example. Z is just Q1, so it is stable for a whole cycle.</text>

  <!-- cycle numbers -->
  <text x="66" y="40" fill="#8a8a8a" font-size="11" text-anchor="end">cycle</text>
  <text x="120" y="40" fill="#8a8a8a" font-size="11" text-anchor="middle">1</text>
  <text x="180" y="40" fill="#8a8a8a" font-size="11" text-anchor="middle">2</text>
  <text x="240" y="40" fill="#8a8a8a" font-size="11" text-anchor="middle">3</text>
  <text x="300" y="40" fill="#8a8a8a" font-size="11" text-anchor="middle">4</text>
  <text x="360" y="40" fill="#8a8a8a" font-size="11" text-anchor="middle">5</text>
  <text x="420" y="40" fill="#8a8a8a" font-size="11" text-anchor="middle">6</text>
  <text x="480" y="40" fill="#8a8a8a" font-size="11" text-anchor="middle">7</text>
  <text x="540" y="40" fill="#8a8a8a" font-size="11" text-anchor="middle">8</text>

  <!-- clock-edge guides -->
  <line x1="90"  y1="46" x2="90"  y2="292" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="2 5"/>
  <line x1="150" y1="46" x2="150" y2="292" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="2 5"/>
  <line x1="210" y1="46" x2="210" y2="292" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="2 5"/>
  <line x1="270" y1="46" x2="270" y2="292" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="2 5"/>
  <line x1="330" y1="46" x2="330" y2="292" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="2 5"/>
  <line x1="390" y1="46" x2="390" y2="292" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="2 5"/>
  <line x1="450" y1="46" x2="450" y2="292" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="2 5"/>
  <line x1="510" y1="46" x2="510" y2="292" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="2 5"/>

  <!-- row labels -->
  <text x="68" y="76"  fill="#8a8a8a" font-size="12" text-anchor="end">CLK</text>
  <text x="68" y="126" fill="#8a8a8a" font-size="12" text-anchor="end">X</text>
  <text x="68" y="176" fill="#8a8a8a" font-size="12" text-anchor="end">Q1</text>
  <text x="68" y="226" fill="#8a8a8a" font-size="12" text-anchor="end">Q0</text>
  <text x="68" y="276" fill="#8a8a8a" font-size="12" text-anchor="end">Z</text>

  <!-- CLK -->
  <path d="M 75 82 L 90 82 L 90 58 L 120 58 L 120 82 L 150 82 L 150 58 L 180 58 L 180 82 L 210 82 L 210 58 L 240 58 L 240 82 L 270 82 L 270 58 L 300 58 L 300 82 L 330 82 L 330 58 L 360 58 L 360 82 L 390 82 L 390 58 L 420 58 L 420 82 L 450 82 L 450 58 L 480 58 L 480 82 L 510 82 L 510 58 L 540 58 L 540 82 L 570 82"
        fill="none" stroke="#4a90d9" stroke-width="2"/>

  <!-- X -->
  <path d="M 75 132 L 90 132 L 90 108 L 210 108 L 210 132 L 270 132 L 270 108 L 450 108 L 450 132 L 570 132"
        fill="none" stroke="#4a90d9" stroke-width="2"/>

  <!-- Q1 -->
  <path d="M 75 182 L 210 182 L 210 158 L 270 158 L 270 182 L 390 182 L 390 158 L 510 158 L 510 182 L 570 182"
        fill="none" stroke="#4a90d9" stroke-width="2"/>

  <!-- Q0 -->
  <path d="M 75 232 L 150 232 L 150 208 L 270 208 L 270 232 L 330 232 L 330 208 L 510 208 L 510 232 L 570 232"
        fill="none" stroke="#4a90d9" stroke-width="2"/>

  <!-- Z -->
  <path d="M 75 282 L 210 282 L 210 258 L 270 258 L 270 282 L 390 282 L 390 258 L 510 258 L 510 282 L 570 282"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>

  <!-- state per cycle -->
  <text x="66" y="308" fill="#8a8a8a" font-size="11" text-anchor="end">state</text>
  <text x="120" y="308" fill="#8a8a8a" font-size="11" text-anchor="middle">00</text>
  <text x="180" y="308" fill="#8a8a8a" font-size="11" text-anchor="middle">01</text>
  <text x="240" y="308" fill="#8a8a8a" font-size="11" text-anchor="middle">11</text>
  <text x="300" y="308" fill="#8a8a8a" font-size="11" text-anchor="middle">00</text>
  <text x="360" y="308" fill="#8a8a8a" font-size="11" text-anchor="middle">01</text>
  <text x="420" y="308" fill="#8a8a8a" font-size="11" text-anchor="middle">11</text>
  <text x="480" y="308" fill="#8a8a8a" font-size="11" text-anchor="middle">11</text>
  <text x="540" y="308" fill="#8a8a8a" font-size="11" text-anchor="middle">00</text>

  <text x="580" y="76"  fill="#8a8a8a" font-size="10">rising edge</text>
  <text x="580" y="88"  fill="#8a8a8a" font-size="10">= new state</text>
</svg>
