<svg viewBox="0 0 640 272" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="bhg" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#8a8a8a"/>
    </marker>
    <marker id="bhb" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#4a90d9"/>
    </marker>
    <marker id="bhc" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#e0645c"/>
    </marker>
  </defs>

  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Mealy 101 detector: three states, arrows labelled input / output. Coral = the arrow that fires the detection.</text>

  <!-- reset -->
  <line x1="18" y1="140" x2="62" y2="140" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#bhg)"/>
  <text x="38" y="128" fill="#8a8a8a" font-size="11" text-anchor="middle">reset</text>

  <!-- states -->
  <circle cx="110" cy="140" r="42" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="110" y="145" fill="#8a8a8a" text-anchor="middle">none</text>
  <circle cx="315" cy="140" r="42" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="315" y="145" fill="#8a8a8a" text-anchor="middle">saw 1</text>
  <circle cx="520" cy="140" r="42" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="520" y="145" fill="#8a8a8a" text-anchor="middle">saw 10</text>

  <!-- chain -->
  <line x1="152" y1="140" x2="269" y2="140" stroke="#4a90d9" stroke-width="2" marker-end="url(#bhb)"/>
  <text x="210" y="130" fill="#4a90d9" text-anchor="middle">1 / 0</text>
  <line x1="357" y1="140" x2="474" y2="140" stroke="#4a90d9" stroke-width="2" marker-end="url(#bhb)"/>
  <text x="415" y="130" fill="#4a90d9" text-anchor="middle">0 / 0</text>

  <!-- self loops -->
  <path d="M80,110 C71,58 149,58 140,110" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#bhg)"/>
  <text x="110" y="50" fill="#8a8a8a" text-anchor="middle">0 / 0</text>
  <path d="M285,110 C276,58 354,58 345,110" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#bhg)"/>
  <text x="315" y="50" fill="#8a8a8a" text-anchor="middle">1 / 0</text>

  <!-- detection arrow -->
  <path d="M490,170 C476,228 359,228 345,170" fill="none" stroke="#e0645c" stroke-width="2" marker-end="url(#bhc)"/>
  <text x="417" y="206" fill="#e0645c" text-anchor="middle">1 / 1</text>

  <!-- failure arrow -->
  <path d="M506,180 C480,258 150,258 124,180" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#bhg)"/>
  <text x="315" y="255" fill="#8a8a8a" text-anchor="middle">0 / 0</text>
</svg>
