<svg viewBox="0 0 700 512" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">The seven gates, and De Morgan drawn: a bubble slid through a gate flips the shape.</text>

  <!-- ============ ROW 1: NOT, AND, OR, XOR ============ -->

  <!-- NOT at (70,100) -->
  <g transform="translate(70,100)">
    <line x1="-30" y1="0" x2="0" y2="0" stroke="#8a8a8a" stroke-width="1.5"/>
    <path d="M 0 -17 L 30 0 L 0 17 Z" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
    <circle cx="35" cy="0" r="5" fill="none" stroke="#e0645c" stroke-width="2"/>
    <line x1="40" y1="0" x2="68" y2="0" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="18" y="42" fill="#8a8a8a" text-anchor="middle">NOT</text>
    <text x="18" y="58" fill="#8a8a8a" font-size="11" text-anchor="middle">&#8220;invert it&#8221;</text>
  </g>

  <!-- AND at (245,100) -->
  <g transform="translate(245,100)">
    <line x1="-30" y1="-9" x2="0" y2="-9" stroke="#8a8a8a" stroke-width="1.5"/>
    <line x1="-30" y1="9" x2="0" y2="9" stroke="#8a8a8a" stroke-width="1.5"/>
    <path d="M 0 -18 L 20 -18 A 18 18 0 0 1 20 18 L 0 18 Z" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
    <line x1="38" y1="0" x2="68" y2="0" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="19" y="42" fill="#8a8a8a" text-anchor="middle">AND</text>
    <text x="19" y="58" fill="#8a8a8a" font-size="11" text-anchor="middle">&#8220;both&#8221;</text>
  </g>

  <!-- OR at (420,100) -->
  <g transform="translate(420,100)">
    <line x1="-30" y1="-9" x2="4" y2="-9" stroke="#8a8a8a" stroke-width="1.5"/>
    <line x1="-30" y1="9" x2="4" y2="9" stroke="#8a8a8a" stroke-width="1.5"/>
    <path d="M 0 -18 C 22 -18 34 -9 40 0 C 34 9 22 18 0 18 C 10 6 10 -6 0 -18 Z" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
    <line x1="40" y1="0" x2="68" y2="0" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="19" y="42" fill="#8a8a8a" text-anchor="middle">OR</text>
    <text x="19" y="58" fill="#8a8a8a" font-size="11" text-anchor="middle">&#8220;at least one&#8221;</text>
  </g>

  <!-- XOR at (595,100) -->
  <g transform="translate(595,100)">
    <line x1="-32" y1="-9" x2="-4" y2="-9" stroke="#8a8a8a" stroke-width="1.5"/>
    <line x1="-32" y1="9" x2="-4" y2="9" stroke="#8a8a8a" stroke-width="1.5"/>
    <path d="M -9 -18 C 1 -6 1 6 -9 18" fill="none" stroke="#4a90d9" stroke-width="2"/>
    <path d="M 0 -18 C 22 -18 34 -9 40 0 C 34 9 22 18 0 18 C 10 6 10 -6 0 -18 Z" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
    <line x1="40" y1="0" x2="66" y2="0" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="19" y="42" fill="#8a8a8a" text-anchor="middle">XOR</text>
    <text x="19" y="58" fill="#8a8a8a" font-size="11" text-anchor="middle">&#8220;they differ&#8221;</text>
  </g>

  <!-- ============ ROW 2: bubbled partners ============ -->

  <!-- note under NOT column -->
  <text x="88" y="218" fill="#e0645c" font-size="11" text-anchor="middle">a bubble</text>
  <text x="88" y="233" fill="#e0645c" font-size="11" text-anchor="middle">= inversion</text>
  <text x="88" y="252" fill="#8a8a8a" font-size="11" text-anchor="middle">(on an input it</text>
  <text x="88" y="266" fill="#8a8a8a" font-size="11" text-anchor="middle">means active low)</text>

  <!-- NAND at (245,215) -->
  <g transform="translate(245,215)">
    <line x1="-30" y1="-9" x2="0" y2="-9" stroke="#8a8a8a" stroke-width="1.5"/>
    <line x1="-30" y1="9" x2="0" y2="9" stroke="#8a8a8a" stroke-width="1.5"/>
    <path d="M 0 -18 L 20 -18 A 18 18 0 0 1 20 18 L 0 18 Z" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
    <circle cx="43" cy="0" r="5" fill="none" stroke="#e0645c" stroke-width="2"/>
    <line x1="48" y1="0" x2="72" y2="0" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="19" y="42" fill="#8a8a8a" text-anchor="middle">NAND</text>
    <text x="19" y="58" fill="#8a8a8a" font-size="11" text-anchor="middle">&#8220;not both&#8221;</text>
  </g>

  <!-- NOR at (420,215) -->
  <g transform="translate(420,215)">
    <line x1="-30" y1="-9" x2="4" y2="-9" stroke="#8a8a8a" stroke-width="1.5"/>
    <line x1="-30" y1="9" x2="4" y2="9" stroke="#8a8a8a" stroke-width="1.5"/>
    <path d="M 0 -18 C 22 -18 34 -9 40 0 C 34 9 22 18 0 18 C 10 6 10 -6 0 -18 Z" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
    <circle cx="45" cy="0" r="5" fill="none" stroke="#e0645c" stroke-width="2"/>
    <line x1="50" y1="0" x2="74" y2="0" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="19" y="42" fill="#8a8a8a" text-anchor="middle">NOR</text>
    <text x="19" y="58" fill="#8a8a8a" font-size="11" text-anchor="middle">&#8220;neither&#8221;</text>
  </g>

  <!-- XNOR at (595,215) -->
  <g transform="translate(595,215)">
    <line x1="-32" y1="-9" x2="-4" y2="-9" stroke="#8a8a8a" stroke-width="1.5"/>
    <line x1="-32" y1="9" x2="-4" y2="9" stroke="#8a8a8a" stroke-width="1.5"/>
    <path d="M -9 -18 C 1 -6 1 6 -9 18" fill="none" stroke="#4a90d9" stroke-width="2"/>
    <path d="M 0 -18 C 22 -18 34 -9 40 0 C 34 9 22 18 0 18 C 10 6 10 -6 0 -18 Z" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
    <circle cx="45" cy="0" r="5" fill="none" stroke="#e0645c" stroke-width="2"/>
    <line x1="50" y1="0" x2="72" y2="0" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="19" y="42" fill="#8a8a8a" text-anchor="middle">XNOR</text>
    <text x="19" y="58" fill="#8a8a8a" font-size="11" text-anchor="middle">&#8220;they match&#8221;</text>
  </g>

  <!-- ============ divider ============ -->
  <line x1="40" y1="296" x2="660" y2="296" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 5"/>
  <text x="40" y="320" fill="#8a8a8a" font-style="italic">Bubble pushing &#8212; push the bubble through the gate and the shape flips.</text>

  <!-- row A: NAND equals OR with inverted inputs -->
  <g transform="translate(80,378)">
    <text x="-52" y="-5" fill="#8a8a8a">A</text>
    <text x="-52" y="14" fill="#8a8a8a">B</text>
    <line x1="-36" y1="-9" x2="0" y2="-9" stroke="#8a8a8a" stroke-width="1.5"/>
    <line x1="-36" y1="9" x2="0" y2="9" stroke="#8a8a8a" stroke-width="1.5"/>
    <path d="M 0 -18 L 20 -18 A 18 18 0 0 1 20 18 L 0 18 Z" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
    <circle cx="43" cy="0" r="5" fill="none" stroke="#e0645c" stroke-width="2"/>
    <line x1="48" y1="0" x2="72" y2="0" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="78" y="5" fill="#8a8a8a">A &#183; B</text>
    <line x1="78" y1="-9" x2="109" y2="-9" stroke="#8a8a8a" stroke-width="1.5"/>
  </g>
  <text x="248" y="384" fill="#e0645c" font-size="20" text-anchor="middle">&#8801;</text>
  <g transform="translate(340,378)">
    <text x="-62" y="-5" fill="#8a8a8a">A</text>
    <text x="-62" y="14" fill="#8a8a8a">B</text>
    <line x1="-46" y1="-9" x2="-14" y2="-9" stroke="#8a8a8a" stroke-width="1.5"/>
    <line x1="-46" y1="9" x2="-14" y2="9" stroke="#8a8a8a" stroke-width="1.5"/>
    <circle cx="-9" cy="-9" r="5" fill="none" stroke="#e0645c" stroke-width="2"/>
    <circle cx="-9" cy="9" r="5" fill="none" stroke="#e0645c" stroke-width="2"/>
    <line x1="-4" y1="-9" x2="4" y2="-9" stroke="#8a8a8a" stroke-width="1.5"/>
    <line x1="-4" y1="9" x2="4" y2="9" stroke="#8a8a8a" stroke-width="1.5"/>
    <path d="M 0 -18 C 22 -18 34 -9 40 0 C 34 9 22 18 0 18 C 10 6 10 -6 0 -18 Z" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
    <line x1="40" y1="0" x2="64" y2="0" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="70" y="5" fill="#8a8a8a">A + B</text>
    <line x1="70" y1="-9" x2="80" y2="-9" stroke="#8a8a8a" stroke-width="1.5"/>
    <line x1="95" y1="-9" x2="105" y2="-9" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="0" y="46" fill="#8a8a8a" font-size="11" text-anchor="middle">OR with inverted inputs</text>
  </g>

  <!-- row B: NOR equals AND with inverted inputs -->
  <g transform="translate(80,468)">
    <text x="-52" y="-5" fill="#8a8a8a">A</text>
    <text x="-52" y="14" fill="#8a8a8a">B</text>
    <line x1="-36" y1="-9" x2="4" y2="-9" stroke="#8a8a8a" stroke-width="1.5"/>
    <line x1="-36" y1="9" x2="4" y2="9" stroke="#8a8a8a" stroke-width="1.5"/>
    <path d="M 0 -18 C 22 -18 34 -9 40 0 C 34 9 22 18 0 18 C 10 6 10 -6 0 -18 Z" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
    <circle cx="45" cy="0" r="5" fill="none" stroke="#e0645c" stroke-width="2"/>
    <line x1="50" y1="0" x2="72" y2="0" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="78" y="5" fill="#8a8a8a">A + B</text>
    <line x1="78" y1="-9" x2="113" y2="-9" stroke="#8a8a8a" stroke-width="1.5"/>
  </g>
  <text x="248" y="474" fill="#e0645c" font-size="20" text-anchor="middle">&#8801;</text>
  <g transform="translate(340,468)">
    <text x="-62" y="-5" fill="#8a8a8a">A</text>
    <text x="-62" y="14" fill="#8a8a8a">B</text>
    <line x1="-46" y1="-9" x2="-14" y2="-9" stroke="#8a8a8a" stroke-width="1.5"/>
    <line x1="-46" y1="9" x2="-14" y2="9" stroke="#8a8a8a" stroke-width="1.5"/>
    <circle cx="-9" cy="-9" r="5" fill="none" stroke="#e0645c" stroke-width="2"/>
    <circle cx="-9" cy="9" r="5" fill="none" stroke="#e0645c" stroke-width="2"/>
    <line x1="-4" y1="-9" x2="0" y2="-9" stroke="#8a8a8a" stroke-width="1.5"/>
    <line x1="-4" y1="9" x2="0" y2="9" stroke="#8a8a8a" stroke-width="1.5"/>
    <path d="M 0 -18 L 20 -18 A 18 18 0 0 1 20 18 L 0 18 Z" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
    <line x1="38" y1="0" x2="62" y2="0" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="68" y="5" fill="#8a8a8a">A &#183; B</text>
    <line x1="68" y1="-9" x2="78" y2="-9" stroke="#8a8a8a" stroke-width="1.5"/>
    <line x1="89" y1="-9" x2="99" y2="-9" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="0" y="46" fill="#8a8a8a" font-size="11" text-anchor="middle">AND with inverted inputs</text>
  </g>
</svg>
