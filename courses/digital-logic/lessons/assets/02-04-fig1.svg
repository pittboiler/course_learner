<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="24" fill="#8a8a8a" font-style="italic" font-size="13">A decoder hands you every minterm at once; a mux picks one data input &#8212; which is why it can be any function.</text>

  <!-- ============ panel (a): 2-to-4 decoder ============ -->
  <text x="26" y="52" fill="#8a8a8a" font-size="13">(a) 2-to-4 decoder &#8212; each output IS one minterm</text>

  <!-- input wires -->
  <line x1="52" y1="112" x2="100" y2="112" stroke="#4a90d9" stroke-width="2"/>
  <line x1="52" y1="184" x2="100" y2="184" stroke="#4a90d9" stroke-width="2"/>
  <text x="26" y="116" fill="#4a90d9">A1</text>
  <text x="26" y="188" fill="#4a90d9">A0</text>
  <text x="24" y="132" fill="#8a8a8a" font-size="10">MSB</text>

  <!-- decoder body -->
  <rect x="100" y="72" width="100" height="152" fill="#4a90d9" opacity="0.12"/>
  <rect x="100" y="72" width="100" height="152" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="150" y="142" fill="#4a90d9" text-anchor="middle" font-size="13">2-to-4</text>
  <text x="150" y="160" fill="#4a90d9" text-anchor="middle" font-size="13">decoder</text>

  <!-- output wires -->
  <line x1="200" y1="92"  x2="240" y2="92"  stroke="#4a90d9" stroke-width="2"/>
  <line x1="200" y1="132" x2="240" y2="132" stroke="#4a90d9" stroke-width="2"/>
  <line x1="200" y1="172" x2="240" y2="172" stroke="#4a90d9" stroke-width="2"/>
  <line x1="200" y1="212" x2="240" y2="212" stroke="#4a90d9" stroke-width="2"/>

  <!-- row 0 : Y0 = A1bar A0bar = m0 -->
  <text x="246" y="97" fill="#8a8a8a">Y0</text>
  <text x="280" y="97" fill="#8a8a8a">=</text>
  <text x="296" y="97" fill="#8a8a8a">A1</text>
  <text x="320" y="97" fill="#8a8a8a">A0</text>
  <line x1="296" y1="86" x2="313" y2="86" stroke="#8a8a8a" stroke-width="1.3"/>
  <line x1="320" y1="86" x2="337" y2="86" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="350" y="97" fill="#e0645c">m0</text>

  <!-- row 1 : Y1 = A1bar A0 = m1 -->
  <text x="246" y="137" fill="#8a8a8a">Y1</text>
  <text x="280" y="137" fill="#8a8a8a">=</text>
  <text x="296" y="137" fill="#8a8a8a">A1</text>
  <text x="320" y="137" fill="#8a8a8a">A0</text>
  <line x1="296" y1="126" x2="313" y2="126" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="350" y="137" fill="#e0645c">m1</text>

  <!-- row 2 : Y2 = A1 A0bar = m2 -->
  <text x="246" y="177" fill="#8a8a8a">Y2</text>
  <text x="280" y="177" fill="#8a8a8a">=</text>
  <text x="296" y="177" fill="#8a8a8a">A1</text>
  <text x="320" y="177" fill="#8a8a8a">A0</text>
  <line x1="320" y1="166" x2="337" y2="166" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="350" y="177" fill="#e0645c">m2</text>

  <!-- row 3 : Y3 = A1 A0 = m3 -->
  <text x="246" y="217" fill="#8a8a8a">Y3</text>
  <text x="280" y="217" fill="#8a8a8a">=</text>
  <text x="296" y="217" fill="#8a8a8a">A1</text>
  <text x="320" y="217" fill="#8a8a8a">A0</text>
  <text x="350" y="217" fill="#e0645c">m3</text>

  <text x="26" y="252" fill="#8a8a8a" font-size="11">Exactly one output is 1 at a time: input `10` asserts Y2 only.</text>

  <!-- ============ panel (b): 4-to-1 mux ============ -->
  <text x="412" y="52" fill="#8a8a8a" font-size="13">(b) one 4-to-1 mux realizes F(A,B,C,D)</text>
  <text x="555" y="74" fill="#8a8a8a" text-anchor="middle" font-size="12">4-to-1 MUX</text>

  <!-- data input labels -->
  <text x="418" y="111" fill="#8a8a8a">I0</text>
  <text x="442" y="111" fill="#8a8a8a">=</text>
  <text x="458" y="111" fill="#8a8a8a">1</text>

  <text x="418" y="158" fill="#8a8a8a">I1</text>
  <text x="442" y="158" fill="#8a8a8a">=</text>
  <text x="458" y="158" fill="#8a8a8a">C</text>
  <line x1="457" y1="147" x2="469" y2="147" stroke="#8a8a8a" stroke-width="1.3"/>

  <text x="418" y="204" fill="#e0645c">I2</text>
  <text x="442" y="204" fill="#e0645c">=</text>
  <text x="458" y="204" fill="#e0645c">C</text>

  <text x="418" y="251" fill="#8a8a8a">I3</text>
  <text x="442" y="251" fill="#8a8a8a">=</text>
  <text x="458" y="251" fill="#8a8a8a">C</text>

  <!-- data wires -->
  <line x1="482" y1="107" x2="530" y2="107" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="482" y1="154" x2="530" y2="154" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="482" y1="200" x2="530" y2="200" stroke="#e0645c" stroke-width="2.6"/>
  <line x1="482" y1="247" x2="530" y2="247" stroke="#8a8a8a" stroke-width="1.8"/>

  <!-- mux body -->
  <polygon points="530,84 580,122 580,232 530,270" fill="#4a90d9" opacity="0.12"/>
  <polygon points="530,84 580,122 580,232 530,270" fill="none" stroke="#4a90d9" stroke-width="2"/>

  <!-- selected path -->
  <path d="M 530 200 L 580 177 L 648 177" fill="none" stroke="#e0645c" stroke-width="2.6"/>
  <text x="654" y="182" fill="#e0645c">Y</text>

  <!-- select lines -->
  <line x1="536" y1="300" x2="536" y2="265" stroke="#e0645c" stroke-width="1.8"/>
  <line x1="568" y1="300" x2="568" y2="241" stroke="#e0645c" stroke-width="1.8"/>
  <text x="536" y="317" fill="#e0645c" text-anchor="middle" font-size="13">A=1</text>
  <text x="568" y="317" fill="#e0645c" text-anchor="middle" font-size="13">B=0</text>
  <text x="552" y="337" fill="#8a8a8a" text-anchor="middle" font-size="11">select lines (A is S1, the MSB)</text>

  <text x="598" y="216" fill="#e0645c" font-size="12">selects index 2,</text>
  <text x="598" y="232" fill="#e0645c" font-size="12">so Y = I2 = C</text>
</svg>
