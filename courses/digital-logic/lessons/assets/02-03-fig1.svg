<svg viewBox="0 0 700 490" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">The sum is fast; the carry is the bottleneck. Filled dots are connections &#8212; plain crossings are not.</text>

  <!-- ============ panel (a): full adder ============ -->
  <text x="30" y="48" fill="#8a8a8a" font-weight="bold">(a) Full adder &#8212; the coral carry path is only 2 gates deep, but every stage pays it again</text>

  <!-- input labels -->
  <text x="30" y="71" fill="#8a8a8a">A</text>
  <text x="30" y="89" fill="#8a8a8a">B</text>
  <text x="22" y="200" fill="#e0645c">C<tspan font-size="10" dy="4">in</tspan></text>

  <!-- A and B wires -->
  <line x1="52" y1="66" x2="130" y2="66" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="52" y1="84" x2="130" y2="84" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="90" y1="66" x2="90" y2="224" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="90" y1="224" x2="130" y2="224" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="108" y1="84" x2="108" y2="242" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="108" y1="242" x2="130" y2="242" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="90" cy="66" r="3.5" fill="#8a8a8a"/>
  <circle cx="108" cy="84" r="3.5" fill="#8a8a8a"/>

  <!-- XOR1 : p = A xor B -->
  <path d="M 124,58 Q 136,75 124,92" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <path d="M 130,58 Q 142,75 130,92 Q 156,92 172,75 Q 156,58 130,58 Z" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>

  <!-- AND1 : g = AB -->
  <path d="M 130,216 L 150,216 A 17,17 0 0 1 150,250 L 130,250 Z" fill="none" stroke="#8a8a8a" stroke-width="2"/>

  <!-- p net -->
  <line x1="172" y1="75" x2="250" y2="75" stroke="#4a90d9" stroke-width="2"/>
  <line x1="250" y1="75" x2="250" y2="161" stroke="#4a90d9" stroke-width="2"/>
  <line x1="250" y1="101" x2="330" y2="101" stroke="#4a90d9" stroke-width="2"/>
  <line x1="250" y1="161" x2="330" y2="161" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="250" cy="101" r="3.5" fill="#4a90d9"/>
  <text x="180" y="68" fill="#4a90d9" font-size="13">p = A &#8853; B</text>

  <!-- g net -->
  <line x1="167" y1="233" x2="430" y2="233" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="176" y="228" fill="#8a8a8a" font-size="13">g = AB</text>

  <!-- Cin net : coral trunk to AND2, grey branch to XOR2 -->
  <line x1="52" y1="195" x2="285" y2="195" stroke="#e0645c" stroke-width="3"/>
  <line x1="285" y1="195" x2="285" y2="179" stroke="#e0645c" stroke-width="3"/>
  <line x1="285" y1="179" x2="330" y2="179" stroke="#e0645c" stroke-width="3"/>
  <line x1="285" y1="179" x2="285" y2="119" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="285" y1="119" x2="330" y2="119" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="285" cy="179" r="3.5" fill="#e0645c"/>

  <!-- XOR2 : S -->
  <path d="M 324,93 Q 336,110 324,127" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <path d="M 330,93 Q 342,110 330,127 Q 356,127 372,110 Q 356,93 330,93 Z" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <line x1="372" y1="110" x2="520" y2="110" stroke="#4a90d9" stroke-width="2"/>
  <text x="528" y="115" fill="#4a90d9">S</text>

  <!-- AND2 -->
  <path d="M 330,153 L 350,153 A 17,17 0 0 1 350,187 L 330,187 Z" fill="#e0645c" fill-opacity="0.12" stroke="#e0645c" stroke-width="3"/>
  <line x1="367" y1="170" x2="400" y2="170" stroke="#e0645c" stroke-width="3"/>
  <line x1="400" y1="170" x2="400" y2="215" stroke="#e0645c" stroke-width="3"/>
  <line x1="400" y1="215" x2="430" y2="215" stroke="#e0645c" stroke-width="3"/>

  <!-- OR1 : Cout -->
  <path d="M 430,207 Q 442,224 430,241 Q 456,241 472,224 Q 456,207 430,207 Z" fill="#e0645c" fill-opacity="0.12" stroke="#e0645c" stroke-width="3"/>
  <line x1="472" y1="224" x2="560" y2="224" stroke="#e0645c" stroke-width="3"/>
  <text x="568" y="229" fill="#e0645c">C<tspan font-size="10" dy="4">out</tspan></text>

  <text x="440" y="262" fill="#e0645c" font-size="12">C<tspan font-size="9" dy="3">out</tspan><tspan dy="-3"> = g + p&#183;C</tspan><tspan font-size="9" dy="3">in</tspan></text>

  <!-- ============ panel (b): 4-bit ripple carry ============ -->
  <text x="30" y="308" fill="#8a8a8a" font-weight="bold">(b) 4-bit ripple-carry adder &#8212; coral numbers are gate delays until that wire settles</text>

  <!-- FA3 -->
  <rect x="70" y="350" width="96" height="62" fill="#4a90d9" fill-opacity="0.10" stroke="#8a8a8a" stroke-width="2"/>
  <text x="118" y="386" fill="#8a8a8a" text-anchor="middle">FA3</text>
  <line x1="98" y1="326" x2="98" y2="350" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="138" y1="326" x2="138" y2="350" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="98" y="320" fill="#8a8a8a" font-size="12" text-anchor="middle">A<tspan font-size="9" dy="3">3</tspan></text>
  <text x="138" y="320" fill="#8a8a8a" font-size="12" text-anchor="middle">B<tspan font-size="9" dy="3">3</tspan></text>
  <line x1="118" y1="412" x2="118" y2="438" stroke="#4a90d9" stroke-width="2"/>
  <text x="118" y="454" fill="#4a90d9" font-size="12" text-anchor="middle">S<tspan font-size="9" dy="3">3</tspan></text>
  <text x="150" y="454" fill="#e0645c" font-size="12" text-anchor="middle">8</text>

  <!-- FA2 -->
  <rect x="210" y="350" width="96" height="62" fill="#4a90d9" fill-opacity="0.10" stroke="#8a8a8a" stroke-width="2"/>
  <text x="258" y="386" fill="#8a8a8a" text-anchor="middle">FA2</text>
  <line x1="238" y1="326" x2="238" y2="350" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="278" y1="326" x2="278" y2="350" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="238" y="320" fill="#8a8a8a" font-size="12" text-anchor="middle">A<tspan font-size="9" dy="3">2</tspan></text>
  <text x="278" y="320" fill="#8a8a8a" font-size="12" text-anchor="middle">B<tspan font-size="9" dy="3">2</tspan></text>
  <line x1="258" y1="412" x2="258" y2="438" stroke="#4a90d9" stroke-width="2"/>
  <text x="258" y="454" fill="#4a90d9" font-size="12" text-anchor="middle">S<tspan font-size="9" dy="3">2</tspan></text>
  <text x="290" y="454" fill="#e0645c" font-size="12" text-anchor="middle">6</text>

  <!-- FA1 -->
  <rect x="350" y="350" width="96" height="62" fill="#4a90d9" fill-opacity="0.10" stroke="#8a8a8a" stroke-width="2"/>
  <text x="398" y="386" fill="#8a8a8a" text-anchor="middle">FA1</text>
  <line x1="378" y1="326" x2="378" y2="350" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="418" y1="326" x2="418" y2="350" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="378" y="320" fill="#8a8a8a" font-size="12" text-anchor="middle">A<tspan font-size="9" dy="3">1</tspan></text>
  <text x="418" y="320" fill="#8a8a8a" font-size="12" text-anchor="middle">B<tspan font-size="9" dy="3">1</tspan></text>
  <line x1="398" y1="412" x2="398" y2="438" stroke="#4a90d9" stroke-width="2"/>
  <text x="398" y="454" fill="#4a90d9" font-size="12" text-anchor="middle">S<tspan font-size="9" dy="3">1</tspan></text>
  <text x="430" y="454" fill="#e0645c" font-size="12" text-anchor="middle">4</text>

  <!-- FA0 -->
  <rect x="490" y="350" width="96" height="62" fill="#4a90d9" fill-opacity="0.10" stroke="#8a8a8a" stroke-width="2"/>
  <text x="538" y="386" fill="#8a8a8a" text-anchor="middle">FA0</text>
  <line x1="518" y1="326" x2="518" y2="350" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="558" y1="326" x2="558" y2="350" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="518" y="320" fill="#8a8a8a" font-size="12" text-anchor="middle">A<tspan font-size="9" dy="3">0</tspan></text>
  <text x="558" y="320" fill="#8a8a8a" font-size="12" text-anchor="middle">B<tspan font-size="9" dy="3">0</tspan></text>
  <line x1="538" y1="412" x2="538" y2="438" stroke="#4a90d9" stroke-width="2"/>
  <text x="538" y="454" fill="#4a90d9" font-size="12" text-anchor="middle">S<tspan font-size="9" dy="3">0</tspan></text>
  <text x="570" y="454" fill="#e0645c" font-size="12" text-anchor="middle">2</text>

  <!-- carry chain, right to left -->
  <line x1="656" y1="381" x2="586" y2="381" stroke="#e0645c" stroke-width="3"/>
  <polygon points="586,381 596,376 596,386" fill="#e0645c"/>
  <text x="624" y="372" fill="#e0645c" font-size="12" text-anchor="middle">C<tspan font-size="9" dy="3">0</tspan></text>
  <text x="624" y="402" fill="#e0645c" font-size="12" text-anchor="middle">0</text>

  <line x1="490" y1="381" x2="446" y2="381" stroke="#e0645c" stroke-width="3"/>
  <polygon points="446,381 456,376 456,386" fill="#e0645c"/>
  <text x="468" y="372" fill="#e0645c" font-size="12" text-anchor="middle">C<tspan font-size="9" dy="3">1</tspan></text>
  <text x="468" y="402" fill="#e0645c" font-size="12" text-anchor="middle">3</text>

  <line x1="350" y1="381" x2="306" y2="381" stroke="#e0645c" stroke-width="3"/>
  <polygon points="306,381 316,376 316,386" fill="#e0645c"/>
  <text x="328" y="372" fill="#e0645c" font-size="12" text-anchor="middle">C<tspan font-size="9" dy="3">2</tspan></text>
  <text x="328" y="402" fill="#e0645c" font-size="12" text-anchor="middle">5</text>

  <line x1="210" y1="381" x2="166" y2="381" stroke="#e0645c" stroke-width="3"/>
  <polygon points="166,381 176,376 176,386" fill="#e0645c"/>
  <text x="188" y="372" fill="#e0645c" font-size="12" text-anchor="middle">C<tspan font-size="9" dy="3">3</tspan></text>
  <text x="188" y="402" fill="#e0645c" font-size="12" text-anchor="middle">7</text>

  <line x1="70" y1="381" x2="16" y2="381" stroke="#e0645c" stroke-width="3"/>
  <polygon points="16,381 26,376 26,386" fill="#e0645c"/>
  <text x="44" y="372" fill="#e0645c" font-size="12" text-anchor="middle">C<tspan font-size="9" dy="3">4</tspan></text>
  <text x="44" y="402" fill="#e0645c" font-size="12" text-anchor="middle">9</text>

  <text x="30" y="480" fill="#8a8a8a" font-style="italic" font-size="12">Stage 0 costs 3 gate delays; every further stage adds exactly 2. Widen to 32 bits and the last carry lands at 65.</text>
</svg>
