<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="20" y="24" fill="#8a8a8a" font-style="italic">Boss problem 2(a): ten 1s on a Gray-coded 4-variable map, covered by three groups of four.</text>

  <!-- axis headings -->
  <text x="262" y="46" fill="#8a8a8a" text-anchor="middle" font-size="13">CD</text>
  <text x="178" y="70" fill="#8a8a8a" text-anchor="middle" font-size="13">00</text>
  <text x="234" y="70" fill="#8a8a8a" text-anchor="middle" font-size="13">01</text>
  <text x="290" y="70" fill="#8a8a8a" text-anchor="middle" font-size="13">11</text>
  <text x="346" y="70" fill="#8a8a8a" text-anchor="middle" font-size="13">10</text>
  <text x="106" y="197" fill="#8a8a8a" text-anchor="middle" font-size="13">AB</text>
  <text x="132" y="113" fill="#8a8a8a" text-anchor="middle" font-size="13">00</text>
  <text x="132" y="169" fill="#8a8a8a" text-anchor="middle" font-size="13">01</text>
  <text x="132" y="225" fill="#8a8a8a" text-anchor="middle" font-size="13">11</text>
  <text x="132" y="281" fill="#8a8a8a" text-anchor="middle" font-size="13">10</text>

  <!-- grid -->
  <line x1="150" y1="80" x2="150" y2="304" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="206" y1="80" x2="206" y2="304" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="262" y1="80" x2="262" y2="304" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="318" y1="80" x2="318" y2="304" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="374" y1="80" x2="374" y2="304" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="150" y1="80" x2="374" y2="80" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="150" y1="136" x2="374" y2="136" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="150" y1="192" x2="374" y2="192" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="150" y1="248" x2="374" y2="248" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="150" y1="304" x2="374" y2="304" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- row AB=00 : m0 m1 m3 m2 -->
  <text x="164" y="100" fill="#8a8a8a" font-size="10">m0</text>
  <text x="220" y="100" fill="#8a8a8a" font-size="10">m1</text>
  <text x="276" y="100" fill="#8a8a8a" font-size="10">m3</text>
  <text x="332" y="100" fill="#8a8a8a" font-size="10">m2</text>
  <text x="178" y="120" fill="#4a90d9" font-size="18" text-anchor="middle">1</text>
  <text x="234" y="120" fill="#4a90d9" font-size="18" text-anchor="middle">1</text>
  <text x="290" y="120" fill="#4a90d9" font-size="18" text-anchor="middle">1</text>
  <text x="346" y="120" fill="#4a90d9" font-size="18" text-anchor="middle">1</text>

  <!-- row AB=01 : m4 m5 m7 m6 -->
  <text x="164" y="156" fill="#8a8a8a" font-size="10">m4</text>
  <text x="220" y="156" fill="#8a8a8a" font-size="10">m5</text>
  <text x="276" y="156" fill="#8a8a8a" font-size="10">m7</text>
  <text x="332" y="156" fill="#8a8a8a" font-size="10">m6</text>
  <text x="178" y="176" fill="#4a90d9" font-size="18" text-anchor="middle">1</text>
  <text x="234" y="176" fill="#4a90d9" font-size="18" text-anchor="middle">1</text>
  <text x="290" y="176" fill="#8a8a8a" font-size="18" text-anchor="middle">0</text>
  <text x="346" y="176" fill="#8a8a8a" font-size="18" text-anchor="middle">0</text>

  <!-- row AB=11 : m12 m13 m15 m14 -->
  <text x="164" y="212" fill="#8a8a8a" font-size="10">m12</text>
  <text x="220" y="212" fill="#8a8a8a" font-size="10">m13</text>
  <text x="276" y="212" fill="#8a8a8a" font-size="10">m15</text>
  <text x="332" y="212" fill="#8a8a8a" font-size="10">m14</text>
  <text x="178" y="232" fill="#8a8a8a" font-size="18" text-anchor="middle">0</text>
  <text x="234" y="232" fill="#8a8a8a" font-size="18" text-anchor="middle">0</text>
  <text x="290" y="232" fill="#4a90d9" font-size="18" text-anchor="middle">1</text>
  <text x="346" y="232" fill="#4a90d9" font-size="18" text-anchor="middle">1</text>

  <!-- row AB=10 : m8 m9 m11 m10 -->
  <text x="164" y="268" fill="#8a8a8a" font-size="10">m8</text>
  <text x="220" y="268" fill="#8a8a8a" font-size="10">m9</text>
  <text x="276" y="268" fill="#8a8a8a" font-size="10">m11</text>
  <text x="332" y="268" fill="#8a8a8a" font-size="10">m10</text>
  <text x="178" y="288" fill="#8a8a8a" font-size="18" text-anchor="middle">0</text>
  <text x="234" y="288" fill="#8a8a8a" font-size="18" text-anchor="middle">0</text>
  <text x="290" y="288" fill="#4a90d9" font-size="18" text-anchor="middle">1</text>
  <text x="346" y="288" fill="#4a90d9" font-size="18" text-anchor="middle">1</text>

  <!-- group 1: top left 2x2 -->
  <rect x="157" y="87" width="98" height="98" rx="10" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <!-- group 2: bottom right 2x2 -->
  <rect x="265" y="195" width="106" height="106" rx="10" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <!-- group 3: wraps top row to bottom row -->
  <rect x="274" y="86" width="88" height="42" rx="10" fill="none" stroke="#e0645c" stroke-width="2.5" stroke-dasharray="6 4"/>
  <rect x="274" y="254" width="88" height="42" rx="10" fill="none" stroke="#e0645c" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- legend -->
  <rect x="400" y="116" width="24" height="16" rx="4" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <text x="432" y="130" fill="#e0645c" font-size="15">A</text>
  <text x="444" y="130" fill="#e0645c" font-size="15">C</text>
  <line x1="432" y1="118" x2="442" y2="118" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="444" y1="118" x2="454" y2="118" stroke="#e0645c" stroke-width="1.5"/>
  <text x="470" y="130" fill="#8a8a8a" font-size="11">covers m0, m1, m4, m5</text>

  <rect x="400" y="156" width="24" height="16" rx="4" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <text x="432" y="170" fill="#e0645c" font-size="15">AC</text>
  <text x="470" y="170" fill="#8a8a8a" font-size="11">covers m10, m11, m14, m15</text>

  <rect x="400" y="196" width="24" height="16" rx="4" fill="none" stroke="#e0645c" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="432" y="210" fill="#e0645c" font-size="15">B</text>
  <text x="444" y="210" fill="#e0645c" font-size="15">C</text>
  <line x1="432" y1="198" x2="442" y2="198" stroke="#e0645c" stroke-width="1.5"/>
  <text x="470" y="210" fill="#8a8a8a" font-size="11">covers m2, m3, m10, m11</text>
  <text x="470" y="225" fill="#8a8a8a" font-size="11" font-style="italic">top and bottom rows touch</text>

  <text x="396" y="264" fill="#8a8a8a" font-size="16">F =</text>
  <text x="424" y="264" fill="#e0645c" font-size="16">A</text>
  <text x="436" y="264" fill="#e0645c" font-size="16">C</text>
  <line x1="424" y1="251" x2="435" y2="251" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="436" y1="251" x2="447" y2="251" stroke="#e0645c" stroke-width="1.5"/>
  <text x="452" y="264" fill="#8a8a8a" font-size="16">+</text>
  <text x="470" y="264" fill="#e0645c" font-size="16">B</text>
  <text x="482" y="264" fill="#e0645c" font-size="16">C</text>
  <line x1="470" y1="251" x2="481" y2="251" stroke="#e0645c" stroke-width="1.5"/>
  <text x="498" y="264" fill="#8a8a8a" font-size="16">+</text>
  <text x="516" y="264" fill="#e0645c" font-size="16">A</text>
  <text x="528" y="264" fill="#e0645c" font-size="16">C</text>
</svg>
