  <text x="428" y="327" fill="#8a8a8a" font-size="12">M0</text>

  <!-- M1 -->
  <text x="285" y="388" fill="#8a8a8a" font-size="15">A</text>
  <text x="302" y="388" fill="#8a8a8a" font-size="15">+</text>
  <text x="319" y="388" fill="#8a8a8a" font-size="15">B</text>
  <text x="334" y="388" fill="#8a8a8a" font-size="15">+</text>
  <text x="351" y="388" fill="#8a8a8a" font-size="15">C</text>
