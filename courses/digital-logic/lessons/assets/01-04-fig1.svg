  <text x="420" y="237" fill="#8a8a8a" font-size="12">m7</text>

  <!-- big OR -->
  <path d="M 490 108 Q 516 158 490 208 Q 545 205 585 158 Q 545 111 490 108 Z" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="512" y="163" fill="#4a90d9" font-size="13">OR</text>
  <line x1="585" y1="158" x2="640" y2="158" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="646" y="163" fill="#4a90d9" font-weight="bold">F</text>

  <!-- ================= POS network ================= -->
  <text x="255" y="300" fill="#8a8a8a" font-weight="bold">Product of maxterms &#8594; OR gates into one AND</text>

  <!-- M0 -->
  <text x="285" y="338" fill="#8a8a8a" font-size="15">A</text>
  <text x="302" y="338" fill="#8a8a8a" font-size="15">+</text>
  <text x="319" y="338" fill="#8a8a8a" font-size="15">B</text>
  <text x="334" y="338" fill="#8a8a8a" font-size="15">+</text>
  <text x="351" y="338" fill="#8a8a8a" font-size="15">C</text>
  <line x1="366" y1="325" x2="384" y2="325" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="366" y1="333" x2="386" y2="333" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="366" y1="341" x2="384" y2="341" stroke="#8a8a8a" stroke-width="1"/>
