  <!-- m7 -->
  <text x="300" y="248" fill="#8a8a8a" font-size="15">A</text>
  <text x="320" y="248" fill="#8a8a8a" font-size="15">B</text>
  <text x="340" y="248" fill="#8a8a8a" font-size="15">C</text>
  <line x1="362" y1="235" x2="380" y2="235" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="362" y1="243" x2="380" y2="243" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="362" y1="251" x2="380" y2="251" stroke="#8a8a8a" stroke-width="1"/>
  <path d="M 380 228 L 402 228 A 15 15 0 0 1 402 258 L 380 258 Z" fill="none" stroke="#4a90d9" stroke-width="2"/>
