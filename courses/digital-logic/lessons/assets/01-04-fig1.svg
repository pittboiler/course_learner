  <line x1="362" y1="143" x2="380" y2="143" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="362" y1="151" x2="380" y2="151" stroke="#8a8a8a" stroke-width="1"/>
  <path d="M 380 128 L 402 128 A 15 15 0 0 1 402 158 L 380 158 Z" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <polyline points="417,143 455,143 455,145 500,145" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="420" y="137" fill="#8a8a8a" font-size="12">m5</text>

  <!-- m6, highlighted -->
  <text x="300" y="198" fill="#e0645c" font-size="15">A</text>
  <text x="320" y="198" fill="#e0645c" font-size="15">B</text>
  <text x="340" y="198" fill="#e0645c" font-size="15">C</text>
  <line x1="339" y1="185" x2="351" y2="185" stroke="#e0645c" stroke-width="1.2"/>
  <line x1="362" y1="185" x2="380" y2="185" stroke="#e0645c" stroke-width="1"/>
  <line x1="362" y1="193" x2="380" y2="193" stroke="#e0645c" stroke-width="1"/>
  <line x1="362" y1="201" x2="380" y2="201" stroke="#e0645c" stroke-width="1"/>
  <path d="M 380 178 L 402 178 A 15 15 0 0 1 402 208 L 380 208 Z" fill="none" stroke="#e0645c" stroke-width="2.5"/>
