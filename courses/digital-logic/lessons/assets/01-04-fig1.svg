<svg viewBox="0 0 700 540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">One table, two exact circuits: every F=1 row becomes an AND gate, every F=0 row becomes an OR gate.</text>

  <!-- ================= truth table ================= -->
  <text x="30" y="46" fill="#8a8a8a" font-weight="bold">Majority of A, B, C</text>

  <text x="42" y="66" fill="#8a8a8a">i</text>
  <text x="74" y="66" fill="#8a8a8a">A</text>
  <text x="100" y="66" fill="#8a8a8a">B</text>
  <text x="126" y="66" fill="#8a8a8a">C</text>
  <text x="156" y="66" fill="#8a8a8a">F</text>
  <text x="182" y="66" fill="#8a8a8a">term</text>
  <line x1="30" y1="72" x2="225" y2="72" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="146" y1="52" x2="146" y2="288" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="173" y1="52" x2="173" y2="288" stroke="#8a8a8a" stroke-width="1"/>

  <rect x="30" y="234" width="195" height="24" fill="#e0645c" opacity="0.18"/>

  <text x="42" y="92" fill="#8a8a8a">0</text>
  <text x="74" y="92" fill="#8a8a8a">0</text>
  <text x="100" y="92" fill="#8a8a8a">0</text>
  <text x="126" y="92" fill="#8a8a8a">0</text>
  <text x="156" y="92" fill="#8a8a8a">0</text>
  <text x="182" y="92" fill="#8a8a8a">M0</text>

  <text x="42" y="118" fill="#8a8a8a">1</text>
  <text x="74" y="118" fill="#8a8a8a">0</text>
  <text x="100" y="118" fill="#8a8a8a">0</text>
  <text x="126" y="118" fill="#8a8a8a">1</text>
  <text x="156" y="118" fill="#8a8a8a">0</text>
  <text x="182" y="118" fill="#8a8a8a">M1</text>

  <text x="42" y="144" fill="#8a8a8a">2</text>
  <text x="74" y="144" fill="#8a8a8a">0</text>
  <text x="100" y="144" fill="#8a8a8a">1</text>
  <text x="126" y="144" fill="#8a8a8a">0</text>
  <text x="156" y="144" fill="#8a8a8a">0</text>
  <text x="182" y="144" fill="#8a8a8a">M2</text>

  <text x="42" y="170" fill="#4a90d9">3</text>
  <text x="74" y="170" fill="#4a90d9">0</text>
  <text x="100" y="170" fill="#4a90d9">1</text>
  <text x="126" y="170" fill="#4a90d9">1</text>
  <text x="156" y="170" fill="#4a90d9">1</text>
  <text x="182" y="170" fill="#4a90d9">m3</text>

  <text x="42" y="196" fill="#8a8a8a">4</text>
  <text x="74" y="196" fill="#8a8a8a">1</text>
  <text x="100" y="196" fill="#8a8a8a">0</text>
  <text x="126" y="196" fill="#8a8a8a">0</text>
  <text x="156" y="196" fill="#8a8a8a">0</text>
  <text x="182" y="196" fill="#8a8a8a">M4</text>

  <text x="42" y="222" fill="#4a90d9">5</text>
  <text x="74" y="222" fill="#4a90d9">1</text>
  <text x="100" y="222" fill="#4a90d9">0</text>
  <text x="126" y="222" fill="#4a90d9">1</text>
  <text x="156" y="222" fill="#4a90d9">1</text>
  <text x="182" y="222" fill="#4a90d9">m5</text>

  <text x="42" y="252" fill="#e0645c" font-weight="bold">6</text>
  <text x="74" y="252" fill="#e0645c" font-weight="bold">1</text>
  <text x="100" y="252" fill="#e0645c" font-weight="bold">1</text>
  <text x="126" y="252" fill="#e0645c" font-weight="bold">0</text>
  <text x="156" y="252" fill="#e0645c" font-weight="bold">1</text>
  <text x="182" y="252" fill="#e0645c" font-weight="bold">m6</text>

  <text x="42" y="278" fill="#4a90d9">7</text>
  <text x="74" y="278" fill="#4a90d9">1</text>
  <text x="100" y="278" fill="#4a90d9">1</text>
  <text x="126" y="278" fill="#4a90d9">1</text>
  <text x="156" y="278" fill="#4a90d9">1</text>
  <text x="182" y="278" fill="#4a90d9">m7</text>

  <line x1="30" y1="288" x2="225" y2="288" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="30" y="310" fill="#8a8a8a" font-size="12">A is the most significant bit;</text>
  <text x="30" y="326" fill="#8a8a8a" font-size="12">row i = binary value of ABC.</text>
  <text x="30" y="356" fill="#e0645c" font-size="12">Row 6 = 110, so its minterm keeps</text>
  <text x="30" y="372" fill="#e0645c" font-size="12">A and B, and complements C.</text>
  <text x="30" y="404" fill="#8a8a8a" font-size="12">F = 1 on rows 3,5,6,7 &#8594; 4 minterms</text>
  <text x="30" y="422" fill="#8a8a8a" font-size="12">F = 0 on rows 0,1,2,4 &#8594; 4 maxterms</text>
  <text x="30" y="448" fill="#8a8a8a" font-size="12">Both circuits are two gate levels</text>
  <text x="30" y="464" fill="#8a8a8a" font-size="12">deep, ignoring input inverters.</text>

  <!-- coral trace from row 6 to its AND gate -->
  <polyline points="228,248 248,248 248,198 278,198" fill="none" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="285,198 277,194 277,202" fill="#e0645c"/>

  <!-- ================= SOP network ================= -->
  <text x="255" y="46" fill="#8a8a8a" font-weight="bold">Sum of minterms &#8594; AND gates into one OR</text>

  <!-- m3 -->
  <text x="300" y="98" fill="#8a8a8a" font-size="15">A</text>
  <line x1="299" y1="85" x2="311" y2="85" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="320" y="98" fill="#8a8a8a" font-size="15">B</text>
  <text x="340" y="98" fill="#8a8a8a" font-size="15">C</text>
