  <text x="536" y="192" fill="#4a90d9" font-size="18" text-anchor="middle">1</text>
  <text x="592" y="192" fill="#8a8a8a" font-size="18" text-anchor="middle">0</text>

  <rect x="457" y="101" width="102" height="102" rx="10" fill="none" stroke="#e0645c" stroke-width="2.5"/>

  <text x="396" y="240" fill="#8a8a8a" font-size="15">D0 =</text>
  <text x="442" y="240" fill="#e0645c" font-size="15">x</text>
  <text x="462" y="240" fill="#8a8a8a" font-size="12" font-style="italic">(just a wire)</text>
