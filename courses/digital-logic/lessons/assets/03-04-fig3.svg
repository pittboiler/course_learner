  <text x="146" y="240" fill="#e0645c" font-size="15">Q0</text>
  <text x="169" y="240" fill="#e0645c" font-size="15">x</text>
  <line x1="168" y1="227" x2="178" y2="227" stroke="#e0645c" stroke-width="1.5"/>
