  <text x="508" y="66" fill="#8a8a8a" text-anchor="middle" font-size="13">Q0 x</text>
  <text x="424" y="88" fill="#8a8a8a" text-anchor="middle" font-size="13">00</text>
  <text x="480" y="88" fill="#8a8a8a" text-anchor="middle" font-size="13">01</text>
  <text x="536" y="88" fill="#8a8a8a" text-anchor="middle" font-size="13">11</text>
  <text x="592" y="88" fill="#8a8a8a" text-anchor="middle" font-size="13">10</text>
  <text x="362" y="158" fill="#8a8a8a" text-anchor="middle" font-size="13">Q1</text>
  <text x="382" y="130" fill="#8a8a8a" text-anchor="middle" font-size="13">0</text>
  <text x="382" y="186" fill="#8a8a8a" text-anchor="middle" font-size="13">1</text>

