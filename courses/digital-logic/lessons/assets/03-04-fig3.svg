  <text x="570" y="111" fill="#8a8a8a" font-size="10">m2</text>
  <text x="424" y="136" fill="#8a8a8a" font-size="18" text-anchor="middle">0</text>
  <text x="480" y="136" fill="#4a90d9" font-size="18" text-anchor="middle">1</text>
  <text x="536" y="136" fill="#4a90d9" font-size="18" text-anchor="middle">1</text>
  <text x="592" y="136" fill="#8a8a8a" font-size="18" text-anchor="middle">0</text>

  <text x="402" y="167" fill="#8a8a8a" font-size="10">m4</text>
  <text x="458" y="167" fill="#8a8a8a" font-size="10">m5</text>
  <text x="514" y="167" fill="#8a8a8a" font-size="10">m7</text>
  <text x="570" y="167" fill="#8a8a8a" font-size="10">m6</text>
