<svg viewBox="0 0 640 540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90d9"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0645c"/>
    </marker>
  </defs>

  <text x="20" y="18" fill="#8a8a8a" font-style="italic" font-size="13">Every clocked machine is this one loop &#8212; and every state diagram is a picture of what the loop does.</text>

  <text x="20" y="38" fill="#8a8a8a" font-size="12">(a) the synchronous model</text>

  <!-- Mealy-only dashed path: inputs straight to the output logic -->
  <text x="300" y="46" fill="#8a8a8a" font-style="italic" font-size="11" text-anchor="middle">Mealy only</text>
  <path d="M 100 90 L 100 52 L 530 52 L 530 70" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ag)"/>

  <!-- blocks -->
  <rect x="120" y="70" width="130" height="60" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="185" y="95" fill="#4a90d9" text-anchor="middle" font-size="13">Next-state</text>
  <text x="185" y="113" fill="#4a90d9" text-anchor="middle" font-size="13">logic</text>

  <rect x="300" y="70" width="110" height="60" fill="#4a90d9" opacity="0.15"/>
  <rect x="300" y="70" width="110" height="60" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="355" y="95" fill="#4a90d9" text-anchor="middle" font-size="13">State</text>
  <text x="355" y="113" fill="#4a90d9" text-anchor="middle" font-size="13">register</text>

  <rect x="470" y="70" width="120" height="60" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="530" y="95" fill="#4a90d9" text-anchor="middle" font-size="13">Output</text>
  <text x="530" y="113" fill="#4a90d9" text-anchor="middle" font-size="13">logic</text>

  <!-- input -->
  <text x="46" y="95" fill="#4a90d9" font-size="14" text-anchor="middle">X</text>
  <line x1="60" y1="90" x2="120" y2="90" stroke="#4a90d9" stroke-width="2" marker-end="url(#ab)"/>
  <circle cx="100" cy="90" r="3.5" fill="#8a8a8a"/>

  <!-- between blocks -->
  <text x="275" y="90" fill="#8a8a8a" font-size="10" text-anchor="middle">next state</text>
  <line x1="250" y1="100" x2="300" y2="100" stroke="#4a90d9" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="410" y1="100" x2="470" y2="100" stroke="#4a90d9" stroke-width="2" marker-end="url(#ab)"/>
  <circle cx="440" cy="100" r="3.5" fill="#e0645c"/>

  <!-- output -->
  <line x1="590" y1="100" x2="624" y2="100" stroke="#4a90d9" stroke-width="2" marker-end="url(#ab)"/>
  <text x="608" y="90" fill="#4a90d9" font-size="12">Z</text>

  <!-- clock -->
  <line x1="355" y1="180" x2="355" y2="130" stroke="#4a90d9" stroke-width="2" marker-end="url(#ab)"/>
  <text x="362" y="172" fill="#4a90d9" font-size="12">CLK</text>

  <!-- feedback -->
  <path d="M 440 100 L 440 205 L 90 205 L 90 115 L 120 115" fill="none" stroke="#e0645c" stroke-width="2" marker-end="url(#ac)"/>
  <text x="265" y="222" fill="#e0645c" font-size="11" text-anchor="middle">present state Q &#8212; the only memory in the machine</text>

  <text x="20" y="246" fill="#8a8a8a" font-size="12">(b) state diagram (Moore)</text>

  <!-- ===== panel (b): state diagram ===== -->

  <!-- S00 -->
  <circle cx="150" cy="340" r="34" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="150" y="336" fill="#8a8a8a" text-anchor="middle" font-size="14">00</text>
  <text x="150" y="353" fill="#8a8a8a" text-anchor="middle" font-size="11">Z=0</text>

  <!-- S01 -->
  <circle cx="340" cy="340" r="34" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="340" y="336" fill="#8a8a8a" text-anchor="middle" font-size="14">01</text>
  <text x="340" y="353" fill="#8a8a8a" text-anchor="middle" font-size="11">Z=0</text>

  <!-- S11 -->
  <circle cx="245" cy="445" r="34" fill="#4a90d9" opacity="0.15"/>
  <circle cx="245" cy="445" r="34" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="245" y="441" fill="#4a90d9" text-anchor="middle" font-size="14">11</text>
  <text x="245" y="458" fill="#4a90d9" text-anchor="middle" font-size="11">Z=1</text>

  <!-- S10, unreachable -->
  <circle cx="560" cy="360" r="34" fill="none" stroke="#e0645c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="560" y="356" fill="#e0645c" text-anchor="middle" font-size="14">10</text>
  <text x="560" y="373" fill="#e0645c" text-anchor="middle" font-size="11">Z=1</text>
  <text x="560" y="300" fill="#e0645c" text-anchor="middle" font-size="11">unreachable &#8212;</text>
  <text x="560" y="315" fill="#e0645c" text-anchor="middle" font-size="11">nothing points here</text>
  <line x1="560" y1="394" x2="560" y2="424" stroke="#e0645c" stroke-width="1.6" marker-end="url(#ac)"/>
  <text x="560" y="442" fill="#e0645c" text-anchor="middle" font-size="11">0 &#8594; 00,  1 &#8594; 01</text>

  <!-- from 00 on X=1 to 01 -->
  <path d="M 178 321 Q 245 290 312 321" fill="none" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="245" y="286" fill="#8a8a8a" text-anchor="middle" font-size="13">1</text>

  <!-- from 01 on X=0 to 00 -->
  <path d="M 314 360 Q 245 384 176 360" fill="none" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="245" y="392" fill="#8a8a8a" text-anchor="middle" font-size="13">0</text>

  <!-- 00 self-loop on 0 -->
  <path d="M 120 358 C 74 376, 74 304, 120 322" fill="none" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="72" y="345" fill="#8a8a8a" text-anchor="end" font-size="13">0</text>
  <line x1="150" y1="272" x2="150" y2="302" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="150" y="266" fill="#8a8a8a" text-anchor="middle" font-size="11">reset</text>

  <!-- from 01 on X=1 to 11 -->
  <path d="M 368 357 Q 415 440 279 442" fill="none" stroke="#4a90d9" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="394" y="416" fill="#4a90d9" text-anchor="middle" font-size="13">1</text>

  <!-- from 11 on X=0 to 00 -->
  <line x1="232" y1="412" x2="160" y2="374" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="187" y="410" fill="#8a8a8a" text-anchor="middle" font-size="13">0</text>

  <!-- 11 self-loop on 1 -->
  <path d="M 232 478 C 216 512, 276 512, 260 478" fill="none" stroke="#4a90d9" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="246" y="528" fill="#4a90d9" text-anchor="middle" font-size="13">1</text>

  <text x="20" y="512" fill="#8a8a8a" font-size="11">arrow labels = value of X</text>
</svg>
