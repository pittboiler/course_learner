<svg viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="24" y="26" fill="#8a8a8a" font-style="italic">One reaction, four reactors, one currency: every design equation is now an expression in X and &#8722;r&#8341;(X).</text>
  <text x="24" y="44" fill="#8a8a8a" font-size="12">Blue = integral over X (accumulate along time/length).  Coral = algebraic (evaluate once, at the exit X).</text>

  <!-- ============ Panel 1: BATCH (integral) ============ -->
  <rect x="24" y="62" width="308" height="168" rx="8" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="40" y="86" fill="#8a8a8a" font-size="15" font-weight="bold">BATCH</text>
  <text x="40" y="104" fill="#8a8a8a" font-size="11">no in, no out &#183; solve for time t</text>
  <!-- closed tank icon with stirrer -->
  <rect x="250" y="76" width="60" height="46" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="280" y1="76" x2="280" y2="66" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="272" y1="99" x2="288" y2="99" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="276" y1="94" x2="284" y2="104" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- equation: t = N_A0 ∫ dX/(−r_A V) -->
  <text x="44" y="168" fill="#4a90d9" font-size="18">t = N<tspan font-size="11" dy="5">A0</tspan><tspan dy="-5"> </tspan></text>
  <text x="120" y="158" fill="#4a90d9" font-size="30">&#8747;</text>
  <text x="133" y="150" fill="#4a90d9" font-size="10">X</text>
  <text x="121" y="176" fill="#4a90d9" font-size="10">0</text>
  <text x="146" y="160" fill="#4a90d9" font-size="16">dX</text>
  <line x1="146" y1="170" x2="308" y2="170" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="176" y="192" fill="#4a90d9" font-size="16">(&#8722;r<tspan font-size="11" dy="4">A</tspan><tspan dy="-4"> </tspan>) V</text>

  <!-- ============ Panel 2: CSTR (algebraic) ============ -->
  <rect x="348" y="62" width="308" height="168" rx="8" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="364" y="86" fill="#8a8a8a" font-size="15" font-weight="bold">CSTR</text>
  <text x="364" y="104" fill="#8a8a8a" font-size="11">perfectly mixed &#183; solve for volume V</text>
  <!-- stirred tank with in/out arrows -->
  <rect x="574" y="76" width="60" height="46" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="604" y1="76" x2="604" y2="66" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="596" y1="99" x2="612" y2="99" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="558" y1="84" x2="574" y2="84" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="574,84 566,80 566,88" fill="#8a8a8a"/>
  <line x1="634" y1="114" x2="650" y2="114" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="650,114 642,110 642,118" fill="#8a8a8a"/>
  <!-- equation: V = F_A0 X / (−r_A) evaluated at exit -->
  <text x="380" y="168" fill="#e0645c" font-size="18">V = F<tspan font-size="11" dy="5">A0</tspan><tspan dy="-5"> </tspan>X</text>
  <line x1="470" y1="160" x2="560" y2="160" stroke="#e0645c" stroke-width="1.2"/>
  <text x="486" y="184" fill="#e0645c" font-size="16">&#8722;r<tspan font-size="11" dy="4">A</tspan></text>
  <text x="380" y="214" fill="#8a8a8a" font-size="11" font-style="italic">no integral &#8212; &#8722;r&#8341; taken at the single exit X</text>

  <!-- ============ Panel 3: PFR (integral) ============ -->
  <rect x="24" y="250" width="308" height="168" rx="8" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="40" y="274" fill="#8a8a8a" font-size="15" font-weight="bold">PFR</text>
  <text x="40" y="292" fill="#8a8a8a" font-size="11">plug flow &#183; solve for volume V</text>
  <!-- tube with flow arrows -->
  <rect x="228" y="266" width="84" height="26" rx="13" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="210" y1="279" x2="228" y2="279" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="228,279 220,275 220,283" fill="#8a8a8a"/>
  <line x1="312" y1="279" x2="330" y2="279" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="330,279 322,275 322,283" fill="#8a8a8a"/>
  <!-- equation: V = F_A0 ∫ dX/(−r_A) -->
  <text x="44" y="356" fill="#4a90d9" font-size="18">V = F<tspan font-size="11" dy="5">A0</tspan><tspan dy="-5"> </tspan></text>
  <text x="128" y="346" fill="#4a90d9" font-size="30">&#8747;</text>
  <text x="141" y="338" fill="#4a90d9" font-size="10">X</text>
  <text x="129" y="364" fill="#4a90d9" font-size="10">0</text>
  <text x="156" y="348" fill="#4a90d9" font-size="16">dX</text>
  <line x1="156" y1="358" x2="270" y2="358" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="182" y="380" fill="#4a90d9" font-size="16">&#8722;r<tspan font-size="11" dy="4">A</tspan></text>

  <!-- ============ Panel 4: PBR (integral) ============ -->
  <rect x="348" y="250" width="308" height="168" rx="8" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="364" y="274" fill="#8a8a8a" font-size="15" font-weight="bold">PBR</text>
  <text x="364" y="292" fill="#8a8a8a" font-size="11">packed bed &#183; solve for catalyst weight W</text>
  <!-- tube packed with catalyst dots -->
  <rect x="556" y="266" width="84" height="26" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="566" cy="273" r="3" fill="#8a8a8a"/>
  <circle cx="577" cy="283" r="3" fill="#8a8a8a"/>
  <circle cx="588" cy="272" r="3" fill="#8a8a8a"/>
  <circle cx="599" cy="284" r="3" fill="#8a8a8a"/>
  <circle cx="610" cy="273" r="3" fill="#8a8a8a"/>
  <circle cx="621" cy="284" r="3" fill="#8a8a8a"/>
  <circle cx="631" cy="273" r="3" fill="#8a8a8a"/>
  <!-- equation: W = F_A0 ∫ dX/(−r_A') -->
  <text x="368" y="356" fill="#4a90d9" font-size="18">W = F<tspan font-size="11" dy="5">A0</tspan><tspan dy="-5"> </tspan></text>
  <text x="456" y="346" fill="#4a90d9" font-size="30">&#8747;</text>
  <text x="469" y="338" fill="#4a90d9" font-size="10">X</text>
  <text x="457" y="364" fill="#4a90d9" font-size="10">0</text>
  <text x="484" y="348" fill="#4a90d9" font-size="16">dX</text>
  <line x1="484" y1="358" x2="600" y2="358" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="508" y="380" fill="#4a90d9" font-size="16">&#8722;r<tspan font-size="11" dy="4">A</tspan>'</text>
</svg>
