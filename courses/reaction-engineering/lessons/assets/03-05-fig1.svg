<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="40" y="20" fill="#8a8a8a" font-style="italic">Stable where the removal line is steeper than the generation curve; the middle crossing tips either way.</text>

  <!-- ===== main plot: G(T) and R(T) ===== -->
  <!-- axes -->
  <line x1="70" y1="300" x2="405" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="405,300 395,295 395,305" fill="#8a8a8a"/>
  <text x="384" y="318" fill="#8a8a8a">T</text>
  <line x1="70" y1="300" x2="70" y2="58" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,58 65,68 75,68" fill="#8a8a8a"/>
  <text x="82" y="66" fill="#8a8a8a">heat rate</text>

  <!-- G(T) generation curve (coral, S-shaped from Arrhenius) -->
  <path d="M 70 250 L 90 244 L 110 238 L 140 228 L 170 210 L 200 190 L 215 180 L 230 169 L 260 150 L 290 132 L 330 117 L 360 110 L 390 106"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <text x="262" y="146" fill="#e0645c">G(T) generated</text>

  <!-- R(T) removal line (blue, straight) -->
  <line x1="70" y1="260" x2="390" y2="84" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="300" y="92" fill="#4a90d9">R(T) removed</text>

  <!-- intersection dots -->
  <circle cx="110" cy="238" r="4" fill="#8a8a8a"/>
  <circle cx="215" cy="180" r="4" fill="#8a8a8a"/>
  <circle cx="330" cy="117" r="4" fill="#8a8a8a"/>

  <!-- annotations at each intersection -->
  <text x="118" y="255" fill="#8a8a8a">low: stable</text>
  <text x="118" y="269" fill="#8a8a8a" font-size="11">R steeper</text>

  <text x="150" y="176" fill="#8a8a8a">middle: unstable</text>
  <text x="150" y="190" fill="#8a8a8a" font-size="11">G steeper &#8594; runs away</text>

  <text x="300" y="135" fill="#8a8a8a">high: stable</text>
  <text x="300" y="149" fill="#8a8a8a" font-size="11">R steeper</text>

  <!-- ===== inset: T vs time ===== -->
  <text x="452" y="150" fill="#8a8a8a" font-style="italic" font-size="12">T vs time</text>
  <line x1="452" y1="300" x2="612" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="612,300 602,295 602,305" fill="#8a8a8a"/>
  <text x="596" y="318" fill="#8a8a8a">t</text>
  <line x1="452" y1="300" x2="452" y2="168" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="452,168 447,178 457,178" fill="#8a8a8a"/>
  <text x="460" y="176" fill="#8a8a8a">T</text>

  <!-- controlled approach (blue, saturating) -->
  <path d="M 452 292 C 485 258 525 235 560 232 S 600 231 608 231"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="520" y="252" fill="#4a90d9" font-size="12">controlled</text>

  <!-- runaway (coral, exponential blow-up) -->
  <path d="M 452 292 C 505 289 545 283 565 262 C 578 245 585 210 590 182"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <text x="556" y="196" fill="#e0645c" font-size="12">runaway</text>
</svg>
