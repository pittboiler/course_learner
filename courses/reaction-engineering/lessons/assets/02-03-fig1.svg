<svg viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Same conversion X, different C_A: a gas that makes more moles (&#949;&gt;0) droops below the liquid line &#8212; expansion dilutes A.</text>

  <!-- y axis -->
  <line x1="70" y1="278" x2="70" y2="62" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,62 65,72 75,72" fill="#8a8a8a"/>
  <text x="34" y="70" fill="#8a8a8a">C_A/C_A0</text>
  <!-- x axis -->
  <line x1="70" y1="278" x2="500" y2="278" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="500,278 490,273 490,283" fill="#8a8a8a"/>
  <text x="505" y="283" fill="#8a8a8a">X</text>

  <!-- gridline value 1 and 0.5 -->
  <line x1="70" y1="78" x2="470" y2="78" stroke="#8a8a8a" stroke-width="0.75" stroke-dasharray="2 5"/>
  <text x="52" y="82" fill="#8a8a8a">1</text>
  <text x="46" y="182" fill="#8a8a8a">0.5</text>
  <text x="60" y="292" fill="#8a8a8a">0</text>
  <!-- x ticks -->
  <text x="66" y="296" fill="#8a8a8a">0</text>
  <text x="262" y="296" fill="#8a8a8a">0.5</text>
  <text x="464" y="296" fill="#8a8a8a">1</text>
  <line x1="270" y1="278" x2="270" y2="282" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="470" y1="278" x2="470" y2="282" stroke="#8a8a8a" stroke-width="1"/>

  <!-- liquid straight line: 1 - X -->
  <line x1="70" y1="78" x2="470" y2="278" stroke="#4a90d9" stroke-width="3"/>
  <text x="322" y="150" fill="#4a90d9">liquid (&#949;=0):  1&#8722;X</text>

  <!-- gas curve: (1-X)/(1+X), eps=1 -->
  <path d="M 70 78 L 110 106.4 L 150 136.7 L 190 162.3 L 230 184.3 L 270 203.3 L 310 220 L 350 234.7 L 390 247.8 L 430 259.5 L 470 278"
        fill="none" stroke="#e0645c" stroke-width="3"/>
  <text x="360" y="270" fill="#e0645c">gas (&#949;=1)</text>

  <!-- droop bracket at X=0.5: liquid y=178, gas y=203.3 -->
  <line x1="270" y1="178" x2="270" y2="203.3" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="270,178 266,187 274,187" fill="#e0645c"/>
  <polygon points="270,203.3 266,194 274,194" fill="#e0645c"/>
  <circle cx="270" cy="178" r="3" fill="#4a90d9"/>
  <circle cx="270" cy="203.3" r="3" fill="#e0645c"/>
  <text x="280" y="196" fill="#e0645c">extra dilution</text>
</svg>
