<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Temperature down an exothermic PFR: a cooled bed peaks then falls (hot spot);</text>
  <text x="30" y="42" fill="#8a8a8a" font-style="italic">the runaway case never turns over. Coolant T&#8336; is the design lever.</text>

  <!-- axes -->
  <line x1="80" y1="340" x2="580" y2="340" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="580,340 570,335 570,345" fill="#8a8a8a"/>
  <text x="560" y="362" fill="#8a8a8a">V</text>
  <text x="450" y="362" fill="#8a8a8a" font-size="11">reactor volume</text>
  <line x1="80" y1="340" x2="80" y2="70" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="80,70 75,80 85,80" fill="#8a8a8a"/>
  <text x="64" y="76" fill="#8a8a8a">T</text>
  <text x="52" y="266" fill="#8a8a8a" font-size="11">T&#8320;</text>

  <!-- inlet temperature marker -->
  <line x1="76" y1="260" x2="84" y2="260" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- runaway case (coral): T never turns over -->
  <path d="M 80 260 L 160 232 L 230 198 L 290 158 L 340 116 L 380 88 L 415 76"
        fill="none" stroke="#e0645c" stroke-width="3"/>
  <text x="420" y="72" fill="#e0645c" font-weight="bold">runaway (T&#8336; too high)</text>

  <!-- cooled case (blue): peak inside, then falls -->
  <path d="M 80 260 L 140 190 L 200 138 L 258 116 L 320 138 L 400 168 L 500 194 L 560 206"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="300" y="270" fill="#4a90d9" font-weight="bold">cooled bed</text>

  <!-- hot spot marker -->
  <circle cx="258" cy="116" r="4" fill="#4a90d9"/>
  <line x1="258" y1="116" x2="258" y2="340" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="214" y="104" fill="#4a90d9" font-size="11">hot spot (T peaks, dT/dV = 0)</text>

  <!-- coolant temperature line (co-current: rises slightly) -->
  <path d="M 80 300 L 560 282" fill="none" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="440" y="300" fill="#8a8a8a" font-size="12">T&#8336; coolant (co-current)</text>

  <!-- annotation -->
  <text x="120" y="384" fill="#8a8a8a" font-size="11">gap T &#8722; T&#8336; drives removal Ua(T&#8722;T&#8336;); (&#8722;&#916;H)(&#8722;r_A) drives generation</text>
</svg>
