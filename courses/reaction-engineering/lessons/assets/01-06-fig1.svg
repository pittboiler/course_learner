<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">In a PFR each plug is a tiny batch: X climbs as it flows down the tube. A CSTR sits at one X everywhere.</text>

  <!-- ============ PFR (top) ============ -->
  <text x="30" y="58" fill="#8a8a8a" font-weight="bold">PFR &#8212; plug flow, no axial mixing</text>

  <!-- tube -->
  <rect x="70" y="72" width="440" height="56" fill="#4a90d9" opacity="0.10" stroke="#4a90d9" stroke-width="2"/>

  <!-- plugs sliding down the tube -->
  <line x1="150" y1="72" x2="150" y2="128" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="230" y1="72" x2="230" y2="128" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="310" y1="72" x2="310" y2="128" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="390" y1="72" x2="390" y2="128" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- the slice dV -->
  <rect x="310" y="72" width="80" height="56" fill="#e0645c" opacity="0.16" stroke="#e0645c" stroke-width="1.5"/>
  <text x="330" y="146" fill="#e0645c">dV</text>

  <!-- inlet / outlet flow arrows -->
  <line x1="34" y1="100" x2="68" y2="100" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="68,100 58,95 58,105" fill="#8a8a8a"/>
  <text x="34" y="92" fill="#8a8a8a">F</text>
  <text x="46" y="95" fill="#8a8a8a" font-size="10">A0</text>
  <text x="30" y="118" fill="#8a8a8a">X=0</text>

  <line x1="512" y1="100" x2="548" y2="100" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="548,100 538,95 538,105" fill="#8a8a8a"/>
  <text x="516" y="92" fill="#8a8a8a">F</text>
  <text x="528" y="95" fill="#8a8a8a" font-size="10">A</text>
  <text x="512" y="118" fill="#8a8a8a">X out</text>

  <!-- ============ X vs V profile (middle) ============ -->
  <!-- axes -->
  <line x1="70" y1="300" x2="510" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="510,300 500,295 500,305" fill="#8a8a8a"/>
  <text x="514" y="305" fill="#8a8a8a">V</text>
  <line x1="70" y1="300" x2="70" y2="176" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,176 65,186 75,186" fill="#8a8a8a"/>
  <text x="52" y="184" fill="#8a8a8a">X</text>
  <text x="56" y="304" fill="#8a8a8a">0</text>

  <!-- rising X(V) curve: fast early (high rate), flattening late -->
  <path d="M 70 300 L 110 270 L 150 246 L 190 227 L 230 213 L 270 202 L 310 195 L 350 190 L 390 187 L 430 185 L 470 184"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="440" y="176" fill="#4a90d9">X rises along the tube</text>

  <!-- tie the dV slice down to the curve -->
  <line x1="310" y1="128" x2="310" y2="195" stroke="#e0645c" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="390" y1="128" x2="390" y2="187" stroke="#e0645c" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- ============ CSTR (right, contrast) ============ -->
  <text x="548" y="200" fill="#8a8a8a" font-weight="bold" font-size="12">CSTR</text>
  <rect x="548" y="212" width="70" height="70" rx="8" fill="#e0645c" opacity="0.12" stroke="#e0645c" stroke-width="2"/>
  <!-- stirrer -->
  <line x1="583" y1="212" x2="583" y2="238" stroke="#e0645c" stroke-width="2"/>
  <line x1="570" y1="238" x2="596" y2="238" stroke="#e0645c" stroke-width="2"/>
  <text x="556" y="272" fill="#e0645c" font-size="11">one X</text>
  <text x="556" y="300" fill="#8a8a8a" font-size="11">flat inside</text>
</svg>
