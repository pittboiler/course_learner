<svg viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="24" y="24" fill="#8a8a8a" font-style="italic">Adiabatic: no heat leaves, so the fluid heats itself. Temperature is locked to conversion by a straight line.</text>
  <text x="24" y="42" fill="#8a8a8a" font-size="12">Left: the energy-balance line T(X).  Right: the rate it drives &#8212; k climbs with T, C&#8341; falls with X, so &#8722;r&#8341; humps.</text>

  <!-- ============ LEFT: T vs X energy-balance line ============ -->
  <!-- axes -->
  <line x1="90" y1="70" x2="90" y2="360" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="90" y1="360" x2="420" y2="360" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="70" y="365" fill="#8a8a8a" font-size="12" text-anchor="end">300</text>
  <text x="70" y="74" fill="#8a8a8a" font-size="12" text-anchor="end">500</text>
  <text x="70" y="159" fill="#e0645c" font-size="12" text-anchor="end">440</text>
  <text x="40" y="215" fill="#8a8a8a" font-size="13">T (K)</text>
  <text x="88" y="380" fill="#8a8a8a" font-size="12" text-anchor="middle">0</text>
  <text x="307" y="380" fill="#e0645c" font-size="12" text-anchor="middle">0.7</text>
  <text x="400" y="380" fill="#8a8a8a" font-size="12" text-anchor="middle">1</text>
  <text x="255" y="402" fill="#8a8a8a" font-size="13" text-anchor="middle">conversion X</text>

  <!-- adiabatic line: (X=0, T=300) to (X=1, T=500) -->
  <line x1="90" y1="360" x2="400" y2="70" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- dashed guides to the X=0.7 point (T=440) -->
  <line x1="90" y1="154" x2="307" y2="154" stroke="#e0645c" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="307" y1="360" x2="307" y2="154" stroke="#e0645c" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="307" cy="154" r="4" fill="#e0645c"/>

  <!-- endpoint marker at X=1 -->
  <circle cx="400" cy="70" r="4" fill="#4a90d9"/>
  <text x="378" y="60" fill="#4a90d9" font-size="12" text-anchor="middle">500 K</text>

  <!-- slope annotation -->
  <text x="150" y="250" fill="#4a90d9" font-size="13">slope = &#916;T</text>
  <text x="210" y="256" fill="#4a90d9" font-size="10">ad</text>
  <text x="150" y="268" fill="#4a90d9" font-size="13">= 200 K</text>

  <!-- ============ RIGHT: -r_A vs X hump ============ -->
  <line x1="470" y1="70" x2="470" y2="360" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="470" y1="360" x2="672" y2="360" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="452" y="215" fill="#8a8a8a" font-size="13" text-anchor="end">&#8722;r<tspan font-size="10" dy="4">A</tspan></text>
  <text x="468" y="380" fill="#8a8a8a" font-size="12" text-anchor="middle">0</text>
  <text x="670" y="380" fill="#8a8a8a" font-size="12" text-anchor="middle">1</text>
  <text x="571" y="402" fill="#8a8a8a" font-size="13" text-anchor="middle">conversion X</text>

  <!-- hump curve: k rises with T (up), C_A falls with X (down to 0) -->
  <path d="M 480 300 C 515 250 555 165 575 152 C 605 142 640 300 670 356" fill="none" stroke="#e0645c" stroke-width="2.5"/>

  <text x="500" y="285" fill="#8a8a8a" font-size="11">hotter &#8594;</text>
  <text x="497" y="300" fill="#8a8a8a" font-size="11">k climbs</text>
  <text x="612" y="300" fill="#8a8a8a" font-size="11" text-anchor="middle">C&#8341;&#8594;0</text>
  <text x="612" y="314" fill="#8a8a8a" font-size="11" text-anchor="middle">starved</text>
  <text x="575" y="135" fill="#e0645c" font-size="11" text-anchor="middle">peak rate</text>
</svg>
