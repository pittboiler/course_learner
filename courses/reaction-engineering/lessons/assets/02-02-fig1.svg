  <polygon points="70,55 65,66 75,66" fill="#8a8a8a"/>
  <line x1="70" y1="300" x2="565" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="565,300 554,295 554,305" fill="#8a8a8a"/>

