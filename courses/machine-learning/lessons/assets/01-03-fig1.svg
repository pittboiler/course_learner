<svg viewBox="0 0 700.0 380.0" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="11.5" text-anchor="start" font-style="italic">Least squares is a projection: y-hat is the closest point of col(X) to y, so the residual sticks straight out.</text>
  <polygon points="90.0,300.0 400.0,345.0 650.0,255.0 340.0,210.0" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.0" fill-opacity="0.1"/>
  <line x1="200.0" y1="285.0" x2="330.2" y2="303.9" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="330.2" y1="303.9" x2="325.4" y2="305.3" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="330.2" y1="303.9" x2="326.0" y2="301.2" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="200.0" y1="285.0" x2="290.0" y2="252.6" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="290.0" y1="252.6" x2="286.4" y2="256.1" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="290.0" y1="252.6" x2="285.0" y2="252.2" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="336.2" y="315.9" fill="#8a8a8a" font-size="11.0" text-anchor="start">columns of X</text>
  <line x1="200.0" y1="285.0" x2="470.0" y2="122.0" stroke="#4a90d9" stroke-width="2.0"/>
  <line x1="470.0" y1="122.0" x2="465.7" y2="128.2" stroke="#4a90d9" stroke-width="2.0"/>
  <line x1="470.0" y1="122.0" x2="462.6" y2="122.9" stroke="#4a90d9" stroke-width="2.0"/>
  <line x1="200.0" y1="285.0" x2="470.0" y2="272.0" stroke="#4a90d9" stroke-width="1.6"/>
  <line x1="470.0" y1="272.0" x2="463.8" y2="275.2" stroke="#4a90d9" stroke-width="1.6"/>
  <line x1="470.0" y1="272.0" x2="463.5" y2="269.5" stroke="#4a90d9" stroke-width="1.6"/>
  <line x1="470.0" y1="272.0" x2="470.0" y2="122.0" stroke="#e0645c" stroke-width="2.2"/>
  <circle cx="470.0" cy="122.0" r="3.4" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.0"/>
  <circle cx="470.0" cy="272.0" r="3.4" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.0"/>
  <circle cx="200.0" cy="285.0" r="2.6" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.0"/>
  <path d="M 458.0 272.6 L 458.0 260.6 L 470.0 260.0" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="324.0" y="178.0" fill="#4a90d9" font-size="14.0" text-anchor="start" font-style="italic">y</text>
  <text x="388.0" y="300.0" fill="#4a90d9" font-size="12.5" text-anchor="start">y-hat = Hy</text>
  <text x="482.0" y="196.0" fill="#e0645c" font-size="12.5" text-anchor="start">residual  r = y - y-hat</text>
  <text x="482.0" y="214.0" fill="#e0645c" font-size="11.0" text-anchor="start">r is perpendicular to col(X)</text>
  <text x="174.0" y="296.0" fill="#8a8a8a" font-size="11.0" text-anchor="end">0</text>
  <text x="556.0" y="252.0" fill="#8a8a8a" font-size="12.5" text-anchor="start">col(X)</text>
  <text x="20.0" y="358.0" fill="#8a8a8a" font-size="11.5" text-anchor="start">Normal equations: X-transpose r = 0, i.e. r is orthogonal to every column of X.</text>
</svg>
