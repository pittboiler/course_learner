<svg viewBox="0 0 620 290" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="620" height="290" fill="#ffffff"/>
  <text x="310" y="30" font-size="15" fill="#111" text-anchor="middle">The Hamiltonian counts quanta: each mode is an oscillator of energy &#969;&#8346;.</text>

  <!-- three mode ladders -->
  <g>
    <!-- mode 1 -->
    <text x="110" y="255" font-size="12.5" fill="#555" text-anchor="middle">mode p&#8321;</text>
    <line x1="80" y1="230" x2="140" y2="230" stroke="#111" stroke-width="1.6"/>
    <line x1="80" y1="195" x2="140" y2="195" stroke="#111" stroke-width="1.6"/>
    <line x1="80" y1="160" x2="140" y2="160" stroke="#111" stroke-width="1.6"/>
    <line x1="80" y1="125" x2="140" y2="125" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3"/>
    <!-- mode 2 -->
    <text x="250" y="255" font-size="12.5" fill="#555" text-anchor="middle">mode p&#8322;</text>
    <line x1="220" y1="230" x2="280" y2="230" stroke="#111" stroke-width="1.6"/>
    <line x1="220" y1="188" x2="280" y2="188" stroke="#111" stroke-width="1.6"/>
    <line x1="220" y1="146" x2="280" y2="146" stroke="#111" stroke-width="1.6"/>
    <line x1="220" y1="104" x2="280" y2="104" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3"/>
    <!-- mode 3 -->
    <text x="390" y="255" font-size="12.5" fill="#555" text-anchor="middle">mode p&#8323;</text>
    <line x1="360" y1="230" x2="420" y2="230" stroke="#111" stroke-width="1.6"/>
    <line x1="360" y1="200" x2="420" y2="200" stroke="#111" stroke-width="1.6"/>
    <line x1="360" y1="170" x2="420" y2="170" stroke="#111" stroke-width="1.6"/>
    <line x1="360" y1="140" x2="420" y2="140" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="150" y="66" font-size="12.5" fill="#111">&#8230;</text>
  </g>

  <!-- zero-point line -->
  <line x1="70" y1="230" x2="430" y2="230" stroke="#0a7d4f" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="470" y="234" font-size="12" fill="#0a7d4f">zero-point (&#189; per mode)</text>

  <!-- formula -->
  <text x="310" y="278" font-size="13.5" fill="#111" text-anchor="middle">H = &#8747; &#969;&#8346;(a&#8346;&#8224;a&#8346; + &#189;&#948;&#179;(0))  &#8594;  normal order  &#8594;  :H: = &#8747; &#969;&#8346; a&#8346;&#8224;a&#8346;</text>
</svg>
