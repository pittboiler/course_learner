<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="310" fill="#ffffff"/>
  <defs><marker id="g" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#111"/></marker></defs>
  <text x="320" y="30" font-size="15" fill="#111" text-anchor="middle">Demanding a LOCAL phase symmetry forces a new field: the photon.</text>

  <!-- global -->
  <rect x="40" y="60" width="250" height="90" rx="8" fill="#1f6fb2" fill-opacity="0.07" stroke="#1f6fb2" stroke-width="1.6"/>
  <text x="165" y="86" font-size="13.5" fill="#1f6fb2" text-anchor="middle">GLOBAL: &#968; &#8594; e^(i&#945;)&#968;,  &#945; constant</text>
  <text x="165" y="112" font-size="13" fill="#111" text-anchor="middle">Dirac &#8466; invariant &#10003;</text>
  <text x="165" y="134" font-size="12" fill="#555" text-anchor="middle">(Noether charge = electric charge)</text>

  <!-- arrow -->
  <line x1="320" y1="105" x2="380" y2="105" stroke="#111" stroke-width="1.8" marker-end="url(#g)"/>
  <text x="350" y="95" font-size="11.5" fill="#555" text-anchor="middle">make &#945;=&#945;(x)</text>

  <!-- local -->
  <rect x="390" y="60" width="220" height="90" rx="8" fill="#c0532a" fill-opacity="0.07" stroke="#c0532a" stroke-width="1.6"/>
  <text x="500" y="86" font-size="13.5" fill="#c0532a" text-anchor="middle">LOCAL: &#945; = &#945;(x)</text>
  <text x="500" y="112" font-size="13" fill="#111" text-anchor="middle">&#8706;&#7512;&#968; picks up &#8706;&#7512;&#945; &#8226; broken &#10007;</text>

  <!-- fix -->
  <rect x="120" y="185" width="400" height="70" rx="8" fill="#0a7d4f" fill-opacity="0.07" stroke="#0a7d4f" stroke-width="1.8"/>
  <text x="320" y="212" font-size="14.5" fill="#0a7d4f" text-anchor="middle">FIX: covariant derivative  D&#7512; = &#8706;&#7512; + ieA&#7512;</text>
  <text x="320" y="238" font-size="13" fill="#111" text-anchor="middle">the gauge field A&#7512; is the PHOTON  (massless)</text>

  <text x="320" y="288" font-size="12.5" fill="#111" text-anchor="middle">a photon mass term m&#178;A&#7512;A&#7512; is not gauge-invariant &#8658; the photon must be massless</text>
</svg>
