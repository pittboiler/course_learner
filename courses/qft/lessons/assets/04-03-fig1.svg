<svg viewBox="0 0 520 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="520" height="360" fill="#ffffff"/>
  <text x="260" y="28" font-size="15" fill="#111" text-anchor="middle">A hole in the filled negative-energy sea = an antiparticle (positron).</text>

  <!-- energy axis -->
  <line x1="70" y1="55" x2="70" y2="330" stroke="#111" stroke-width="1.3"/>
  <text x="54" y="62" font-size="12" font-style="italic" fill="#111">E</text>
  <line x1="66" y1="190" x2="74" y2="190" stroke="#111"/>
  <text x="52" y="194" font-size="11" fill="#555" text-anchor="end">0</text>

  <!-- positive states (mostly empty) -->
  <rect x="95" y="70" width="360" height="55" fill="#1f6fb2" fill-opacity="0.06" stroke="#1f6fb2" stroke-width="1.2"/>
  <text x="275" y="102" font-size="12.5" fill="#1f6fb2" text-anchor="middle">positive-energy states (E &#8805; +m): mostly empty</text>
  <!-- an electron -->
  <circle cx="150" cy="97" r="6" fill="#1f6fb2"/>
  <text x="150" y="60" font-size="11.5" fill="#1f6fb2" text-anchor="middle">e&#8722;</text>

  <!-- negative sea (filled) -->
  <rect x="95" y="255" width="360" height="60" fill="#c0532a" fill-opacity="0.10" stroke="#c0532a" stroke-width="1.2"/>
  <text x="275" y="335" font-size="12.5" fill="#c0532a" text-anchor="middle">negative-energy "sea" (E &#8804; &#8722;m): filled</text>
  <!-- filled dots -->
  <g fill="#c0532a">
    <circle cx="120" cy="285" r="5"/><circle cx="160" cy="285" r="5"/>
    <circle cx="240" cy="285" r="5"/><circle cx="280" cy="285" r="5"/>
    <circle cx="320" cy="285" r="5"/><circle cx="360" cy="285" r="5"/><circle cx="400" cy="285" r="5"/>
  </g>
  <!-- the hole -->
  <circle cx="200" cy="285" r="6" fill="none" stroke="#0a7d4f" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="200" y="330" font-size="11.5" fill="#0a7d4f" text-anchor="middle">hole = e&#8314;</text>

  <text x="260" y="352" font-size="12" fill="#111" text-anchor="middle">modern view: the field's v-spinor simply creates the antiparticle (positive energy)</text>
</svg>
