<svg viewBox="0 0 500 370" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="500" height="370" fill="#ffffff"/>
  <text x="250" y="28" font-size="15" fill="#111" text-anchor="middle">Microcausality: fields commute at spacelike separation.</text>

  <!-- axes -->
  <line x1="250" y1="345" x2="250" y2="55" stroke="#111" stroke-width="1.2"/>
  <line x1="70" y1="200" x2="440" y2="200" stroke="#111" stroke-width="1.2"/>
  <text x="258" y="66" font-size="12" font-style="italic" fill="#111">t</text>
  <text x="432" y="220" font-size="12" font-style="italic" fill="#111">x</text>

  <!-- light cone -->
  <line x1="250" y1="200" x2="400" y2="60" stroke="#c60" stroke-width="1.8"/>
  <line x1="250" y1="200" x2="100" y2="60" stroke="#c60" stroke-width="1.8"/>
  <line x1="250" y1="200" x2="400" y2="340" stroke="#c60" stroke-width="1.8"/>
  <line x1="250" y1="200" x2="100" y2="340" stroke="#c60" stroke-width="1.8"/>
  <polygon points="250,200 325,130 175,130" fill="#0a7d4f" fill-opacity="0.08"/>
  <polygon points="250,200 325,270 175,270" fill="#0a7d4f" fill-opacity="0.08"/>

  <!-- point y at origin -->
  <circle cx="250" cy="200" r="4.5" fill="#111"/>
  <text x="238" y="222" font-size="13" font-style="italic" fill="#111">y</text>

  <!-- timelike point x (inside cone) -->
  <circle cx="270" cy="110" r="4.5" fill="#0a7d4f"/>
  <text x="280" y="108" font-size="12.5" fill="#0a7d4f">x (timelike): can influence</text>

  <!-- spacelike point x' (outside cone) -->
  <circle cx="400" cy="185" r="4.5" fill="#1f6fb2"/>
  <text x="300" y="180" font-size="12.5" fill="#1f6fb2">x&#8242; (spacelike)</text>

  <text x="250" y="360" font-size="13" fill="#111" text-anchor="middle">(x&#8242;&#8722;y)&#178; &lt; 0  &#8658;  [&#966;(x&#8242;), &#966;(y)] = 0   (particle &amp; antiparticle amplitudes cancel)</text>
</svg>
