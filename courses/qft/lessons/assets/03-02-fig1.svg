<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="270" fill="#ffffff"/>
  <text x="320" y="30" font-size="15" fill="#111" text-anchor="middle">The S-matrix is a time-ordered exponential: a power series in the coupling.</text>

  <!-- the expansion -->
  <text x="320" y="72" font-size="16" fill="#111" text-anchor="middle">S = T exp( &#8722;i &#8747; H&#7522;&#8345;&#8348; dt )</text>

  <!-- terms -->
  <text x="60" y="120" font-size="14" fill="#111">S = </text>
  <rect x="95" y="102" width="60" height="30" rx="5" fill="#1f6fb2" fill-opacity="0.10" stroke="#1f6fb2"/>
  <text x="125" y="122" font-size="14" fill="#1f6fb2" text-anchor="middle">1</text>
  <text x="165" y="120" font-size="14" fill="#111">+</text>
  <rect x="185" y="102" width="150" height="30" rx="5" fill="#0a7d4f" fill-opacity="0.10" stroke="#0a7d4f"/>
  <text x="260" y="122" font-size="13" fill="#0a7d4f" text-anchor="middle">&#8722;i &#8747;H&#7522;&#8345;&#8348;dt&#8321;</text>
  <text x="345" y="120" font-size="14" fill="#111">+</text>
  <rect x="365" y="102" width="215" height="30" rx="5" fill="#c0532a" fill-opacity="0.10" stroke="#c0532a"/>
  <text x="472" y="122" font-size="12.5" fill="#c0532a" text-anchor="middle">(&#8722;i)&#178;/2! &#8747;&#8747; T{H&#7522;&#8345;&#8348;(t&#8321;)H&#7522;&#8345;&#8348;(t&#8322;)}</text>
  <text x="590" y="120" font-size="14" fill="#111">+ &#8230;</text>

  <text x="125" y="152" font-size="11.5" fill="#555" text-anchor="middle">no scatter</text>
  <text x="260" y="152" font-size="11.5" fill="#555" text-anchor="middle">order &#955;</text>
  <text x="472" y="152" font-size="11.5" fill="#555" text-anchor="middle">order &#955;&#178;</text>

  <!-- time ordering illustration -->
  <line x1="120" y1="210" x2="520" y2="210" stroke="#111" stroke-width="1.2"/>
  <text x="530" y="214" font-size="12" font-style="italic" fill="#111">t</text>
  <circle cx="200" cy="210" r="4" fill="#c0532a"/><text x="200" y="230" font-size="11.5" fill="#555" text-anchor="middle">t&#8322;</text>
  <circle cx="380" cy="210" r="4" fill="#c0532a"/><text x="380" y="230" font-size="11.5" fill="#555" text-anchor="middle">t&#8321;</text>
  <text x="290" y="258" font-size="12.5" fill="#111" text-anchor="middle">T puts later operators to the left (they don't commute)</text>
</svg>
