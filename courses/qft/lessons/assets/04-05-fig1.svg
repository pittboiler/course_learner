<svg viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="600" height="250" fill="#ffffff"/>
  <defs><marker id="fa" markerWidth="10" markerHeight="10" refX="6" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="#c0532a"/></marker></defs>
  <text x="300" y="30" font-size="15" fill="#111" text-anchor="middle">The fermion propagator: an internal line with a direction (fermion-number arrow).</text>

  <!-- fermion line with arrow -->
  <line x1="130" y1="110" x2="470" y2="110" stroke="#c0532a" stroke-width="2.6"/>
  <polygon points="305,110 293,104 293,116" fill="#c0532a"/>
  <text x="120" y="114" font-size="13" font-style="italic" fill="#111" text-anchor="end">y</text>
  <text x="480" y="114" font-size="13" font-style="italic" fill="#111">x</text>
  <text x="300" y="95" font-size="12" fill="#555" text-anchor="middle">momentum p &#8594;</text>

  <!-- propagator formula -->
  <text x="300" y="160" font-size="17" fill="#111" text-anchor="middle">S_F(p) = i(&#947;&#7512;p&#7512; + m) / (p&#178; &#8722; m&#178; + i&#949;)</text>
  <text x="300" y="188" font-size="13" fill="#555" text-anchor="middle">= i / (&#947;&#7512;p&#7512; &#8722; m + i&#949;)     (numerator &#947;&#7512;p&#7512; + m from the spin sum)</text>

  <text x="300" y="228" font-size="12.5" fill="#111" text-anchor="middle">fermionic time-ordering carries a minus sign &#8658; each closed fermion loop gets (&#8722;1)</text>
</svg>
