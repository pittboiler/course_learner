<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="560" height="380" fill="#ffffff"/>
  <defs>
    <marker id="up" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#1f6fb2"/></marker>
    <marker id="dn" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#c0532a"/></marker>
  </defs>
  <text x="280" y="30" font-size="15" fill="#111" text-anchor="middle">Fock space: a&#8224; adds a particle, a removes one, all built on the vacuum.</text>

  <!-- levels -->
  <g stroke="#111" stroke-width="1.8">
    <line x1="150" y1="320" x2="410" y2="320"/>
    <line x1="150" y1="240" x2="410" y2="240"/>
    <line x1="150" y1="160" x2="410" y2="160"/>
    <line x1="150" y1="90" x2="410" y2="90"/>
  </g>
  <text x="130" y="325" font-size="15" fill="#111" text-anchor="end">|0&#10217;</text>
  <text x="130" y="245" font-size="15" fill="#111" text-anchor="end">|p&#10217;</text>
  <text x="130" y="165" font-size="15" fill="#111" text-anchor="end">|p,q&#10217;</text>
  <text x="130" y="95" font-size="15" fill="#111" text-anchor="end">|p,q,r&#10217;</text>

  <text x="420" y="325" font-size="12.5" fill="#555">vacuum (0 particles)</text>
  <text x="420" y="245" font-size="12.5" fill="#555">1 particle, energy &#969;&#8346;</text>
  <text x="420" y="165" font-size="12.5" fill="#555">2 particles</text>
  <text x="420" y="95" font-size="12.5" fill="#555">3 particles &#8230;</text>

  <!-- a-dagger up arrows -->
  <line x1="240" y1="314" x2="240" y2="246" stroke="#1f6fb2" stroke-width="2" marker-end="url(#up)"/>
  <line x1="240" y1="234" x2="240" y2="166" stroke="#1f6fb2" stroke-width="2" marker-end="url(#up)"/>
  <line x1="240" y1="154" x2="240" y2="96" stroke="#1f6fb2" stroke-width="2" marker-end="url(#up)"/>
  <text x="218" y="285" font-size="14" fill="#1f6fb2" text-anchor="end">a&#8224;</text>

  <!-- a down arrows -->
  <line x1="320" y1="246" x2="320" y2="314" stroke="#c0532a" stroke-width="2" marker-end="url(#dn)"/>
  <line x1="320" y1="166" x2="320" y2="234" stroke="#c0532a" stroke-width="2" marker-end="url(#dn)"/>
  <line x1="320" y1="96" x2="320" y2="154" stroke="#c0532a" stroke-width="2" marker-end="url(#dn)"/>
  <text x="334" y="285" font-size="14" fill="#c0532a">a</text>

  <text x="280" y="362" font-size="12.5" fill="#111" text-anchor="middle">[a&#8346;, a&#8346;&#8242;&#8224;] = (2&#960;)&#179;&#948;&#179;(p&#8722;p&#8242;) &#183;  a&#8346;|0&#10217; = 0  &#183;  N = &#8747;a&#8224;a counts quanta</text>
</svg>
