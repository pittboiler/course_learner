<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
  <text x="320" y="28" font-size="15" fill="#111" text-anchor="middle">Wick: a vacuum time-ordered product = sum over all ways to pair (contract) the fields.</text>
  <text x="320" y="52" font-size="13.5" fill="#555" text-anchor="middle">each contraction = a Feynman propagator D_F</text>

  <!-- three pairings of four points 1 2 3 4 -->
  <g font-size="13" fill="#111">
    <!-- pairing 1: (12)(34) -->
    <g transform="translate(40,90)">
      <circle cx="20" cy="40" r="4" fill="#111"/><text x="14" y="62">1</text>
      <circle cx="80" cy="40" r="4" fill="#111"/><text x="74" y="62">2</text>
      <circle cx="140" cy="40" r="4" fill="#111"/><text x="134" y="62">3</text>
      <circle cx="200" cy="40" r="4" fill="#111"/><text x="194" y="62">4</text>
      <path d="M20,40 C 40,10 60,10 80,40" fill="none" stroke="#1f6fb2" stroke-width="2"/>
      <path d="M140,40 C 160,10 180,10 200,40" fill="none" stroke="#1f6fb2" stroke-width="2"/>
      <text x="110" y="95" fill="#1f6fb2" text-anchor="middle" font-size="12.5">D_F(12) D_F(34)</text>
    </g>
    <!-- pairing 2: (13)(24) -->
    <g transform="translate(380,90)">
      <circle cx="20" cy="40" r="4" fill="#111"/><text x="14" y="62">1</text>
      <circle cx="80" cy="40" r="4" fill="#111"/><text x="74" y="62">2</text>
      <circle cx="140" cy="40" r="4" fill="#111"/><text x="134" y="62">3</text>
      <circle cx="200" cy="40" r="4" fill="#111"/><text x="194" y="62">4</text>
      <path d="M20,40 C 50,0 110,0 140,40" fill="none" stroke="#0a7d4f" stroke-width="2"/>
      <path d="M80,40 C 110,5 170,5 200,40" fill="none" stroke="#0a7d4f" stroke-width="2"/>
      <text x="110" y="95" fill="#0a7d4f" text-anchor="middle" font-size="12.5">D_F(13) D_F(24)</text>
    </g>
    <!-- pairing 3: (14)(23) -->
    <g transform="translate(210,190)">
      <circle cx="20" cy="40" r="4" fill="#111"/><text x="14" y="62">1</text>
      <circle cx="80" cy="40" r="4" fill="#111"/><text x="74" y="62">2</text>
      <circle cx="140" cy="40" r="4" fill="#111"/><text x="134" y="62">3</text>
      <circle cx="200" cy="40" r="4" fill="#111"/><text x="194" y="62">4</text>
      <path d="M20,40 C 60,-12 160,-12 200,40" fill="none" stroke="#c0532a" stroke-width="2"/>
      <path d="M80,40 C 100,15 120,15 140,40" fill="none" stroke="#c0532a" stroke-width="2"/>
      <text x="110" y="95" fill="#c0532a" text-anchor="middle" font-size="12.5">D_F(14) D_F(23)</text>
    </g>
  </g>
  <text x="320" y="292" font-size="12.5" fill="#111" text-anchor="middle">&#10216;0|T&#966;&#8321;&#966;&#8322;&#966;&#8323;&#966;&#8324;|0&#10217; = D_F(12)D_F(34) + D_F(13)D_F(24) + D_F(14)D_F(23)</text>
</svg>
