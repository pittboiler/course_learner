<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="620" height="320" fill="#ffffff"/>
  <text x="310" y="28" font-size="15" fill="#111" text-anchor="middle">Feynman diagrams for &#966;&#8308;: external legs = particles, vertices = interactions.</text>

  <!-- tree level: single 4-point vertex -->
  <g transform="translate(30,60)">
    <text x="130" y="18" font-size="13.5" fill="#111" text-anchor="middle">tree level (order &#955;)</text>
    <circle cx="130" cy="120" r="6" fill="#c0532a"/>
    <line x1="40" y1="60" x2="130" y2="120" stroke="#1f6fb2" stroke-width="2.2"/>
    <line x1="40" y1="180" x2="130" y2="120" stroke="#1f6fb2" stroke-width="2.2"/>
    <line x1="220" y1="60" x2="130" y2="120" stroke="#0a7d4f" stroke-width="2.2"/>
    <line x1="220" y1="180" x2="130" y2="120" stroke="#0a7d4f" stroke-width="2.2"/>
    <text x="28" y="58" font-size="12" fill="#1f6fb2" text-anchor="end">in</text>
    <text x="28" y="188" font-size="12" fill="#1f6fb2" text-anchor="end">in</text>
    <text x="232" y="58" font-size="12" fill="#0a7d4f">out</text>
    <text x="232" y="188" font-size="12" fill="#0a7d4f">out</text>
    <text x="130" y="235" font-size="13" fill="#111" text-anchor="middle">i&#8499; = &#8722;i&#955;   (contact vertex)</text>
  </g>

  <!-- one loop: two vertices + loop -->
  <g transform="translate(340,60)">
    <text x="130" y="18" font-size="13.5" fill="#111" text-anchor="middle">one loop (order &#955;&#178;)</text>
    <circle cx="90" cy="120" r="6" fill="#c0532a"/>
    <circle cx="170" cy="120" r="6" fill="#c0532a"/>
    <line x1="20" y1="70" x2="90" y2="120" stroke="#1f6fb2" stroke-width="2.2"/>
    <line x1="20" y1="170" x2="90" y2="120" stroke="#1f6fb2" stroke-width="2.2"/>
    <line x1="240" y1="70" x2="170" y2="120" stroke="#0a7d4f" stroke-width="2.2"/>
    <line x1="240" y1="170" x2="170" y2="120" stroke="#0a7d4f" stroke-width="2.2"/>
    <!-- loop between the two vertices -->
    <path d="M90,120 C 110,85 150,85 170,120" fill="none" stroke="#111" stroke-width="2"/>
    <path d="M90,120 C 110,155 150,155 170,120" fill="none" stroke="#111" stroke-width="2"/>
    <text x="130" y="98" font-size="11.5" fill="#555" text-anchor="middle">loop</text>
    <text x="130" y="235" font-size="13" fill="#111" text-anchor="middle">internal lines = propagators</text>
  </g>

  <text x="310" y="308" font-size="12.5" fill="#111" text-anchor="middle">each Wick pairing &#8596; one diagram; loops carry an unfixed internal momentum to integrate</text>
</svg>
