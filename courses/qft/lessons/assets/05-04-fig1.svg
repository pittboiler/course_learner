<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="380" fill="#ffffff"/>
  <defs><marker id="qe" markerWidth="10" markerHeight="10" refX="6" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="#c0532a"/></marker></defs>
  <text x="320" y="28" font-size="15" fill="#111" text-anchor="middle">The QED Feynman rules: one vertex, two propagators, external-line factors.</text>

  <!-- vertex -->
  <g transform="translate(50,55)">
    <circle cx="70" cy="55" r="5" fill="#111"/>
    <line x1="20" y1="20" x2="70" y2="55" stroke="#c0532a" stroke-width="2.2" marker-end="url(#qe)"/>
    <line x1="70" y1="55" x2="120" y2="20" stroke="#c0532a" stroke-width="2.2"/>
    <path d="M70,55 q 8,10 16,0 q 8,-10 16,0 q 8,10 16,0" transform="rotate(90 70 55)" fill="none" stroke="#0a7d4f" stroke-width="1.8"/>
    <text x="70" y="120" font-size="13.5" fill="#111" text-anchor="middle">vertex: &#8722;ie&#947;&#7512;</text>
  </g>

  <!-- electron propagator -->
  <g transform="translate(230,55)">
    <line x1="10" y1="45" x2="130" y2="45" stroke="#c0532a" stroke-width="2.4"/>
    <polygon points="80,45 68,39 68,51" fill="#c0532a"/>
    <text x="70" y="90" font-size="12.5" fill="#111" text-anchor="middle">electron:</text>
    <text x="70" y="112" font-size="12.5" fill="#111" text-anchor="middle">i(&#947;&#183;p+m)/(p&#178;&#8722;m&#178;+i&#949;)</text>
  </g>

  <!-- photon propagator -->
  <g transform="translate(440,55)">
    <path d="M10,45 q 12,14 24,0 q 12,-14 24,0 q 12,14 24,0 q 12,-14 24,0 q 12,14 24,0" fill="none" stroke="#0a7d4f" stroke-width="2.2"/>
    <text x="70" y="90" font-size="12.5" fill="#111" text-anchor="middle">photon:</text>
    <text x="70" y="112" font-size="12.5" fill="#111" text-anchor="middle">&#8722;i&#951;&#7512;&#7515;/(k&#178;+i&#949;)</text>
  </g>

  <!-- external lines -->
  <line x1="40" y1="210" x2="600" y2="210" stroke="#ddd" stroke-width="1"/>
  <text x="320" y="235" font-size="13.5" fill="#111" text-anchor="middle" font-weight="bold">external lines</text>
  <text x="180" y="265" font-size="13" fill="#c0532a" text-anchor="middle">incoming e&#8722;: u(p)</text>
  <text x="460" y="265" font-size="13" fill="#c0532a" text-anchor="middle">outgoing e&#8722;: u&#772;(p)</text>
  <text x="180" y="292" font-size="13" fill="#c0532a" text-anchor="middle">incoming e&#8314;: v&#772;(p)</text>
  <text x="460" y="292" font-size="13" fill="#c0532a" text-anchor="middle">outgoing e&#8314;: v(p)</text>
  <text x="180" y="319" font-size="13" fill="#0a7d4f" text-anchor="middle">incoming &#947;: &#949;&#7512;(k)</text>
  <text x="460" y="319" font-size="13" fill="#0a7d4f" text-anchor="middle">outgoing &#947;: &#949;&#7512;*(k)</text>

  <text x="320" y="356" font-size="12.5" fill="#111" text-anchor="middle">+ &#8747;d&#8308;&#8467;/(2&#960;)&#8308; per loop  &#183;  (&#8722;1) per closed fermion loop  &#183;  read fermion lines against the arrow</text>
</svg>
