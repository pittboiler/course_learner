<svg viewBox="0 0 560 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="560" height="280" fill="#ffffff"/>
  <defs><marker id="s" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#1f6fb2"/></marker></defs>
  <text x="280" y="30" font-size="15" fill="#111" text-anchor="middle">Scattering: free in-state (t &#8594; &#8722;&#8734;) &#8594; S-matrix &#8594; free out-state (t &#8594; +&#8734;).</text>

  <!-- in state lines -->
  <line x1="40" y1="110" x2="200" y2="140" stroke="#1f6fb2" stroke-width="2.4" marker-end="url(#s)"/>
  <line x1="40" y1="210" x2="200" y2="170" stroke="#1f6fb2" stroke-width="2.4" marker-end="url(#s)"/>
  <text x="60" y="100" font-size="13.5" fill="#1f6fb2">|i&#10217; (in)</text>
  <text x="30" y="245" font-size="11.5" fill="#555">far apart, free</text>

  <!-- S box -->
  <rect x="210" y="120" width="140" height="70" rx="10" fill="#c0532a" fill-opacity="0.08" stroke="#c0532a" stroke-width="2"/>
  <text x="280" y="150" font-size="22" font-style="italic" fill="#c0532a" text-anchor="middle">S</text>
  <text x="280" y="172" font-size="11.5" fill="#555" text-anchor="middle">interaction on</text>

  <!-- out state lines -->
  <line x1="360" y1="140" x2="520" y2="105" stroke="#0a7d4f" stroke-width="2.4" marker-end="url(#s2)"/>
  <line x1="360" y1="170" x2="520" y2="205" stroke="#0a7d4f" stroke-width="2.4" marker-end="url(#s2)"/>
  <defs><marker id="s2" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#0a7d4f"/></marker></defs>
  <text x="470" y="95" font-size="13.5" fill="#0a7d4f">|f&#10217; (out)</text>

  <text x="280" y="245" font-size="13.5" fill="#111" text-anchor="middle">amplitude  S&#11002;&#7522; = &#10216;f| S |i&#10217;,   probability = |S&#11002;&#7522;|&#178;,   S&#8224;S = 1</text>
</svg>
