<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="270" fill="#ffffff"/>
  <text x="320" y="30" font-size="15" fill="#111" text-anchor="middle">The Dirac equation is the "square root" of Klein&#8211;Gordon.</text>

  <!-- KG -->
  <rect x="220" y="60" width="200" height="46" rx="8" fill="#1f6fb2" fill-opacity="0.08" stroke="#1f6fb2" stroke-width="1.6"/>
  <text x="320" y="89" font-size="16" fill="#1f6fb2" text-anchor="middle">(&#9633; + m&#178;)&#966; = 0</text>
  <text x="435" y="89" font-size="12" fill="#555">Klein&#8211;Gordon (2nd order)</text>

  <!-- factorization -->
  <text x="320" y="140" font-size="15" fill="#111" text-anchor="middle">&#8722;(i&#947;&#7512;&#8706;&#7512; &#8722; m)(i&#947;&#7512;&#8706;&#7512; + m) = &#9633; + m&#178;</text>

  <!-- Dirac -->
  <rect x="200" y="165" width="240" height="46" rx="8" fill="#c0532a" fill-opacity="0.08" stroke="#c0532a" stroke-width="1.8"/>
  <text x="320" y="194" font-size="16" fill="#c0532a" text-anchor="middle">(i&#947;&#7512;&#8706;&#7512; &#8722; m)&#968; = 0</text>
  <text x="455" y="194" font-size="12" fill="#555">Dirac (1st order)</text>

  <text x="320" y="245" font-size="13.5" fill="#111" text-anchor="middle">requires the Clifford algebra:  {&#947;&#7512;, &#947;&#7515;} = 2&#951;&#7512;&#7515;  &#8226;  &#947;&#7512; are 4&#215;4 matrices</text>
</svg>
