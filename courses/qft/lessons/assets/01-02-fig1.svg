<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="620" height="320" fill="#ffffff"/>
  <text x="310" y="28" font-size="15" fill="#111" text-anchor="middle">A field is the continuum limit of infinitely many coupled oscillators.</text>

  <!-- discrete chain: beads with vertical displacement, connected by springs -->
  <text x="60" y="70" font-size="12.5" fill="#555">discrete:</text>
  <g>
    <!-- baseline -->
    <line x1="90" y1="110" x2="560" y2="110" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>
    <!-- bead x-positions and displacements (a wave) -->
    <!-- springs (zigzag approximated by lines) -->
    <polyline points="110,92 150,80 190,86 230,72 270,88 310,78 350,96 390,84 430,100 470,90 510,104"
              fill="none" stroke="#c0532a" stroke-width="1.4"/>
    <!-- vertical stems -->
    <g stroke="#bbb" stroke-width="0.8">
      <line x1="110" y1="110" x2="110" y2="92"/><line x1="150" y1="110" x2="150" y2="80"/>
      <line x1="190" y1="110" x2="190" y2="86"/><line x1="230" y1="110" x2="230" y2="72"/>
      <line x1="270" y1="110" x2="270" y2="88"/><line x1="310" y1="110" x2="310" y2="78"/>
      <line x1="350" y1="110" x2="350" y2="96"/><line x1="390" y1="110" x2="390" y2="84"/>
      <line x1="430" y1="110" x2="430" y2="100"/><line x1="470" y1="110" x2="470" y2="90"/><line x1="510" y1="110" x2="510" y2="104"/>
    </g>
    <!-- beads -->
    <g fill="#1a1a1a">
      <circle cx="110" cy="92" r="4"/><circle cx="150" cy="80" r="4"/><circle cx="190" cy="86" r="4"/>
      <circle cx="230" cy="72" r="4"/><circle cx="270" cy="88" r="4"/><circle cx="310" cy="78" r="4"/>
      <circle cx="350" cy="96" r="4"/><circle cx="390" cy="84" r="4"/><circle cx="430" cy="100" r="4"/>
      <circle cx="470" cy="90" r="4"/><circle cx="510" cy="104" r="4"/>
    </g>
    <text x="150" y="66" font-size="12" font-style="italic" fill="#1a1a1a">q&#7522;(t)</text>
  </g>

  <!-- arrow -->
  <line x1="310" y1="140" x2="310" y2="180" stroke="#0a7d4f" stroke-width="1.8" marker-end="url(#c)"/>
  <defs><marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#0a7d4f"/></marker></defs>
  <text x="322" y="166" font-size="12.5" fill="#0a7d4f">lattice spacing &#8594; 0</text>

  <!-- continuum field -->
  <text x="60" y="215" font-size="12.5" fill="#555">continuum:</text>
  <line x1="90" y1="250" x2="560" y2="250" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M110,232 C 170,215 210,215 270,238 C 330,262 380,230 430,240 C 470,248 500,258 510,254"
        fill="none" stroke="#1f6fb2" stroke-width="2.4"/>
  <text x="230" y="212" font-size="14" font-style="italic" fill="#1f6fb2">&#966;(x, t)</text>
  <text x="530" y="254" font-size="12" fill="#555">x</text>

  <text x="310" y="300" font-size="13" fill="#111" text-anchor="middle">action  S = &#8747; d&#8308;x  &#8466;(&#966;, &#8706;&#8342;&#966;)   &#8658;   Euler&#8211;Lagrange field equation</text>
</svg>
