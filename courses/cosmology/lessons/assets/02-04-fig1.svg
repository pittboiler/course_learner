<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">The neutron-to-proton ratio: it tracks equilibrium, freezes out near 1/5, then decays toward 1/7.</text>

  <!-- ===== axes ===== -->
  <!-- y axis -->
  <line x1="90" y1="70" x2="90" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="90,70 85,80 95,80" fill="#8a8a8a"/>
  <text x="40" y="66" fill="#8a8a8a">n/p</text>
  <!-- x axis -->
  <line x1="90" y1="290" x2="610" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="610,290 600,285 600,295" fill="#8a8a8a"/>
  <text x="360" y="330" fill="#8a8a8a">temperature falling &#8594; (time increasing &#8594;)</text>

  <!-- y tick labels and faint guides -->
  <text x="66" y="75" fill="#8a8a8a">1</text>
  <line x1="90" y1="230" x2="610" y2="230" stroke="#8a8a8a" stroke-width="0.75" stroke-dasharray="2 5"/>
  <text x="58" y="234" fill="#8a8a8a">1/5</text>
  <line x1="90" y1="241" x2="610" y2="241" stroke="#8a8a8a" stroke-width="0.75" stroke-dasharray="2 5"/>
  <text x="58" y="255" fill="#8a8a8a">1/7</text>
  <text x="72" y="294" fill="#8a8a8a">0</text>

  <!-- ===== equilibrium descent (blue solid), following Boltzmann to freeze-out ===== -->
  <path d="M 90 140 L 147 151 L 204 165 L 260 186 L 295 202 L 317 215 L 329 222 L 340 230"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- equilibrium continuation if it HAD stayed coupled (blue dashed, diving) -->
  <path d="M 340 230 L 360 242 L 385 253 L 415 262 L 448 268"
        fill="none" stroke="#4a90d9" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="380" y="285" fill="#4a90d9" font-size="12">equilibrium (if maintained)</text>

  <!-- frozen plateau + slow neutron decay (blue solid) -->
  <path d="M 340 230 L 400 230 L 460 234 L 520 238 L 570 241"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- ===== freeze-out marker (coral) ===== -->
  <line x1="340" y1="70" x2="340" y2="290" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="340" cy="230" r="4" fill="#e0645c"/>
  <text x="346" y="120" fill="#e0645c" font-size="12">freeze-out</text>
  <text x="346" y="136" fill="#e0645c" font-size="12">T &#8776; 0.8 MeV</text>
  <text x="346" y="152" fill="#e0645c" font-size="12">t &#8776; 1 s</text>
  <text x="346" y="168" fill="#e0645c" font-size="12">n/p &#8776; 1/5</text>

  <!-- ===== deuterium-formation marker (coral) ===== -->
  <circle cx="570" cy="241" r="4" fill="#e0645c"/>
  <text x="480" y="205" fill="#e0645c" font-size="12">D forms</text>
  <text x="480" y="221" fill="#e0645c" font-size="12">T &#8776; 0.07 MeV</text>
  <line x1="405" y1="215" x2="405" y2="229" stroke="#e0645c" stroke-width="1"/>
  <text x="345" y="211" fill="#e0645c" font-size="12">n &#8594; p decay</text>
</svg>
