<svg viewBox="0 0 640 410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="24" y="22" fill="#8a8a8a" font-style="italic">The horizon problem: patches A and B sit 180&#176; apart on the last-scattering sky,</text>
  <text x="24" y="39" fill="#8a8a8a" font-style="italic">their causal horizons (&#8776;1&#176;) never overlapped &#8212; yet their temperatures match.</text>

  <!-- last-scattering surface -->
  <circle cx="320" cy="225" r="150" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="320" y="66" fill="#8a8a8a" text-anchor="middle">last-scattering surface (z &#8776; 1100)</text>

  <!-- observer -->
  <circle cx="320" cy="225" r="5" fill="#e0645c"/>
  <text x="320" y="248" fill="#8a8a8a" text-anchor="middle">us, today</text>

  <!-- our sightlines out to A and B (past light cone) -->
  <line x1="320" y1="225" x2="192" y2="225" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="320" y1="225" x2="448" y2="225" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- extra patches: many more, all agreeing -->
  <circle cx="320" cy="75" r="4" fill="#e0645c"/>
  <circle cx="320" cy="375" r="4" fill="#e0645c"/>
  <circle cx="426" cy="119" r="4" fill="#e0645c"/>
  <circle cx="214" cy="119" r="4" fill="#e0645c"/>
  <circle cx="426" cy="331" r="4" fill="#e0645c"/>
  <circle cx="214" cy="331" r="4" fill="#e0645c"/>

  <!-- patch A (left) with its causal horizon -->
  <circle cx="170" cy="225" r="22" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="1.5"/>
  <circle cx="170" cy="225" r="5" fill="#e0645c"/>
  <text x="170" y="205" fill="#e0645c" text-anchor="middle" font-weight="bold">A</text>
  <text x="145" y="280" fill="#8a8a8a" text-anchor="middle">T = 2.725 K</text>
  <text x="145" y="322" fill="#4a90d9" text-anchor="middle">causal horizon</text>
  <text x="145" y="338" fill="#4a90d9" text-anchor="middle">&#8776; 1&#176; on our sky</text>

  <!-- patch B (right) with its causal horizon -->
  <circle cx="470" cy="225" r="22" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="1.5"/>
  <circle cx="470" cy="225" r="5" fill="#e0645c"/>
  <text x="470" y="205" fill="#e0645c" text-anchor="middle" font-weight="bold">B</text>
  <text x="495" y="280" fill="#8a8a8a" text-anchor="middle">T = 2.725 K</text>
  <text x="495" y="322" fill="#4a90d9" text-anchor="middle">causal horizon</text>
  <text x="495" y="338" fill="#4a90d9" text-anchor="middle">&#8776; 1&#176; on our sky</text>

  <!-- bottom takeaway -->
  <text x="320" y="400" fill="#e0645c" text-anchor="middle">180&#176; apart, no shared causal past &#8212; yet &#916;T/T ~ 10&#8722;&#8309; everywhere</text>
</svg>
