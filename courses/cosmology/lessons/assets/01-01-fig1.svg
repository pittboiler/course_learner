<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="vh" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e0645c"/>
    </marker>
  </defs>

  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Every galaxy recedes; farther ones recede faster (arrow &#8733; distance). No center &#8212; you'd see the same from any galaxy.</text>

  <!-- comoving grid -->
  <g stroke="#8a8a8a" stroke-width="1" opacity="0.35" stroke-dasharray="2 5">
    <line x1="110" y1="120" x2="110" y2="270"/>
    <line x1="210" y1="120" x2="210" y2="270"/>
    <line x1="310" y1="120" x2="310" y2="270"/>
    <line x1="410" y1="120" x2="410" y2="270"/>
    <line x1="510" y1="120" x2="510" y2="270"/>
    <line x1="110" y1="120" x2="510" y2="120"/>
    <line x1="110" y1="195" x2="510" y2="195"/>
    <line x1="110" y1="270" x2="510" y2="270"/>
  </g>

  <!-- velocity arrows (from each galaxy, radiating from the observer at 310,195) -->
  <g stroke="#e0645c" stroke-width="2">
    <line x1="110" y1="120" x2="58"  y2="100.5" marker-end="url(#vh)"/>
    <line x1="210" y1="120" x2="184" y2="100.5" marker-end="url(#vh)"/>
    <line x1="310" y1="120" x2="310" y2="100.5" marker-end="url(#vh)"/>
    <line x1="410" y1="120" x2="436" y2="100.5" marker-end="url(#vh)"/>
    <line x1="510" y1="120" x2="562" y2="100.5" marker-end="url(#vh)"/>
    <line x1="110" y1="195" x2="58"  y2="195"   marker-end="url(#vh)"/>
    <line x1="210" y1="195" x2="184" y2="195"   marker-end="url(#vh)"/>
    <line x1="410" y1="195" x2="436" y2="195"   marker-end="url(#vh)"/>
    <line x1="510" y1="195" x2="562" y2="195"   marker-end="url(#vh)"/>
    <line x1="110" y1="270" x2="58"  y2="289.5" marker-end="url(#vh)"/>
    <line x1="210" y1="270" x2="184" y2="289.5" marker-end="url(#vh)"/>
    <line x1="310" y1="270" x2="310" y2="289.5" marker-end="url(#vh)"/>
    <line x1="410" y1="270" x2="436" y2="289.5" marker-end="url(#vh)"/>
    <line x1="510" y1="270" x2="562" y2="289.5" marker-end="url(#vh)"/>
  </g>

  <!-- galaxies -->
  <g fill="#4a90d9">
    <circle cx="110" cy="120" r="5"/>
    <circle cx="210" cy="120" r="5"/>
    <circle cx="310" cy="120" r="5"/>
    <circle cx="410" cy="120" r="5"/>
    <circle cx="510" cy="120" r="5"/>
    <circle cx="110" cy="195" r="5"/>
    <circle cx="210" cy="195" r="5"/>
    <circle cx="410" cy="195" r="5"/>
    <circle cx="510" cy="195" r="5"/>
    <circle cx="110" cy="270" r="5"/>
    <circle cx="210" cy="270" r="5"/>
    <circle cx="310" cy="270" r="5"/>
    <circle cx="410" cy="270" r="5"/>
    <circle cx="510" cy="270" r="5"/>
  </g>

  <!-- observer -->
  <circle cx="310" cy="195" r="9" fill="none" stroke="#e0645c" stroke-width="2"/>
  <circle cx="310" cy="195" r="3.5" fill="#4a90d9"/>
  <text x="320" y="214" fill="#8a8a8a">you (any observer)</text>

  <!-- law label -->
  <text x="40" y="326" fill="#e0645c">v = H&#8320; d</text>
  <text x="96" y="326" fill="#8a8a8a">&#8212; recession speed grows linearly with distance.</text>
</svg>
