<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Dark-matter wells pull the photon&#8211;baryon fluid in; photon pressure pushes back &#8212; a standing sound wave whose harmonics become the CMB peaks.</text>

  <!-- ===== left: potential well with oscillating fluid ===== -->

  <!-- the gravitational potential well (grey) -->
  <path d="M 80 90 L 110 151 L 140 195 L 170 221 L 200 230 L 230 221 L 260 195 L 290 151 L 320 90"
        fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="86" y="82" fill="#8a8a8a" font-size="12">&#934; (dark-matter well)</text>

  <!-- vertical oscillation double-arrow through the fluid -->
  <line x1="200" y1="150" x2="200" y2="252" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="200,148 195,158 205,158" fill="#e0645c"/>
  <polygon points="200,254 195,244 205,244" fill="#e0645c"/>

  <!-- the photon-baryon fluid blob at mid-swing -->
  <circle cx="200" cy="200" r="22" fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="2"/>
  <text x="182" y="204" fill="#4a90d9" font-size="12">&#947;+b</text>

  <!-- rarefaction (out, photon pressure) label -->
  <text x="214" y="150" fill="#e0645c" font-size="12">rarefaction</text>
  <text x="214" y="164" fill="#8a8a8a" font-size="11">(pressure wins)</text>

  <!-- compression (in, gravity) label -->
  <text x="214" y="245" fill="#e0645c" font-size="12">compression</text>
  <text x="214" y="259" fill="#8a8a8a" font-size="11">(gravity wins)</text>

  <!-- sound-speed tag -->
  <text x="70" y="300" fill="#4a90d9" font-size="12">sound speed c&#8347; = c / &#8730;(3(1+R))</text>

  <!-- ===== right: preview of the CMB peaks ===== -->

  <!-- axes -->
  <line x1="410" y1="255" x2="618" y2="255" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="618,255 608,250 608,260" fill="#8a8a8a"/>
  <text x="600" y="272" fill="#8a8a8a" font-size="12">&#8467;</text>
  <line x1="410" y1="255" x2="410" y2="95" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="410,95 405,105 415,105" fill="#8a8a8a"/>
  <text x="384" y="104" fill="#8a8a8a" font-size="11">power</text>

  <!-- the peak curve (blue) -->
  <path d="M 410 205 C 425 205 432 122 445 117 C 458 122 468 206 478 209 C 490 210 498 160 508 157 C 518 160 528 206 538 207 C 548 208 552 186 560 185 C 578 187 600 228 616 236"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- peak markers -->
  <circle cx="445" cy="117" r="3.5" fill="#e0645c"/>
  <text x="440" y="108" fill="#e0645c" font-size="12">1</text>
  <circle cx="508" cy="157" r="3.5" fill="#e0645c"/>
  <text x="503" y="148" fill="#e0645c" font-size="12">2</text>
  <circle cx="560" cy="185" r="3.5" fill="#e0645c"/>
  <text x="555" y="176" fill="#e0645c" font-size="12">3</text>

  <!-- plateau + damping annotations -->
  <text x="410" y="292" fill="#8a8a8a" font-size="11">plateau (Sachs&#8211;Wolfe) &#8594; peaks &#8594; damping tail</text>
</svg>
