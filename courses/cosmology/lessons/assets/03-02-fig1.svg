<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Growth of a matter overdensity &#948; vs scale factor a (log&#8211;log): frozen, then &#948; &#8733; a, then frozen again.</text>

  <!-- axes -->
  <line x1="70" y1="258" x2="575" y2="258" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="575,258 565,253 565,263" fill="#8a8a8a"/>
  <text x="540" y="278" fill="#8a8a8a">log a</text>
  <line x1="70" y1="258" x2="70" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,52 65,62 75,62" fill="#8a8a8a"/>
  <text x="44" y="66" fill="#8a8a8a">log &#948;</text>

  <!-- era-boundary markers -->
  <line x1="205" y1="258" x2="205" y2="70" stroke="#e0645c" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="184" y="276" fill="#e0645c">a_eq</text>
  <line x1="475" y1="258" x2="475" y2="70" stroke="#e0645c" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="458" y="276" fill="#e0645c">a_&#923;</text>

  <!-- the growing-mode curve -->
  <path d="M 70 236 L 110 231 L 150 226 L 205 220 L 475 96 L 515 90 L 560 88"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- region labels -->
  <text x="92" y="200" fill="#8a8a8a" font-size="12">radiation era</text>
  <text x="92" y="216" fill="#8a8a8a" font-size="12">frozen (&#8733; ln a)</text>
  <text x="300" y="150" fill="#4a90d9" font-size="13">matter era:  &#948; &#8733; a</text>
  <text x="486" y="112" fill="#8a8a8a" font-size="12">&#923; era</text>
  <text x="486" y="128" fill="#8a8a8a" font-size="12">frozen</text>
</svg>
