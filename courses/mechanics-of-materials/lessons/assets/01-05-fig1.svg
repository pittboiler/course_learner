<svg viewBox="0 0 620 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Heat a blocked bar and it fights the walls: blocked growth &#945;&#916;TL becomes compression &#963; = E&#945;&#916;T. Inset: pull a bar, it thins.</text>

  <!-- ===== TOP: constrained bar heated between two rigid walls ===== -->

  <!-- left wall -->
  <line x1="80" y1="112" x2="80" y2="200" stroke="#8a8a8a" stroke-width="2.5"/>
  <line x1="80" y1="118" x2="70" y2="128" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="80" y1="134" x2="70" y2="144" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="80" y1="150" x2="70" y2="160" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="80" y1="166" x2="70" y2="176" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="80" y1="182" x2="70" y2="192" stroke="#8a8a8a" stroke-width="1"/>

  <!-- right wall -->
  <line x1="420" y1="112" x2="420" y2="200" stroke="#8a8a8a" stroke-width="2.5"/>
  <line x1="420" y1="118" x2="430" y2="128" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="420" y1="134" x2="430" y2="144" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="420" y1="150" x2="430" y2="160" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="420" y1="166" x2="430" y2="176" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="420" y1="182" x2="430" y2="192" stroke="#8a8a8a" stroke-width="1"/>

  <!-- ghost: where the free end WANTS to reach -->
  <rect x="420" y="140" width="42" height="35" fill="#4a90d9" opacity="0.12" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- the bar -->
  <rect x="80" y="140" width="340" height="35" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="250" y="163" fill="#4a90d9" text-anchor="middle">bar: L, E, &#945;</text>

  <!-- heat squiggles above -->
  <path d="M 190 128 q 6 -8 12 0 q 6 8 12 0" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <path d="M 230 128 q 6 -8 12 0 q 6 8 12 0" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <path d="M 270 128 q 6 -8 12 0 q 6 8 12 0" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="296" y="132" fill="#e0645c">heat +&#916;T</text>

  <!-- blocked-growth dimension over the ghost -->
  <line x1="420" y1="122" x2="462" y2="122" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="420,122 429,118 429,126" fill="#e0645c"/>
  <polygon points="462,122 453,118 453,126" fill="#e0645c"/>
  <text x="470" y="126" fill="#e0645c">&#945;&#916;TL (blocked)</text>

  <!-- wall reaction arrows, pushing the bar inward -> compression -->
  <line x1="84" y1="192" x2="122" y2="192" stroke="#e0645c" stroke-width="2"/>
  <polygon points="122,192 113,188 113,196" fill="#e0645c"/>
  <line x1="416" y1="192" x2="378" y2="192" stroke="#e0645c" stroke-width="2"/>
  <polygon points="378,192 387,188 387,196" fill="#e0645c"/>
  <text x="250" y="221" fill="#e0645c" text-anchor="middle">&#963; = E&#945;&#916;T  (compression)</text>

  <!-- ===== INSET: Poisson lateral contraction under axial pull ===== -->
  <text x="60" y="262" fill="#8a8a8a" font-style="italic">Poisson effect: axial stretch &#8594; lateral thinning</text>

  <!-- original shape (dashed grey) -->
  <rect x="150" y="278" width="150" height="44" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- stretched + thinned shape (blue) -->
  <rect x="138" y="286" width="174" height="28" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>

  <!-- axial pull arrows (coral) -->
  <line x1="136" y1="300" x2="92" y2="300" stroke="#e0645c" stroke-width="2"/>
  <polygon points="92,300 101,296 101,304" fill="#e0645c"/>
  <text x="86" y="304" fill="#e0645c" text-anchor="end">P</text>
  <line x1="314" y1="300" x2="358" y2="300" stroke="#e0645c" stroke-width="2"/>
  <polygon points="358,300 349,296 349,304" fill="#e0645c"/>
  <text x="364" y="304" fill="#e0645c">P</text>

  <!-- lateral contraction arrows (blue) -->
  <line x1="225" y1="278" x2="225" y2="288" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="225,288 221,281 229,281" fill="#4a90d9"/>
  <line x1="225" y1="322" x2="225" y2="312" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="225,312 221,319 229,319" fill="#4a90d9"/>

  <!-- Poisson definition -->
  <text x="410" y="296" fill="#8a8a8a">&#957; = &#8722; &#949;(lateral) / &#949;(axial)</text>
  <text x="410" y="316" fill="#8a8a8a">&#8776; 0.3 for metals</text>
</svg>
