<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="24" fill="#8a8a8a" font-style="italic">A cantilever under tip load P bends into the elastic curve v(x): flat at the wall, maximum droop at the free tip.</text>

  <!-- fixed wall -->
  <line x1="90" y1="78" x2="90" y2="206" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="90" y1="86" x2="82" y2="96" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="90" y1="102" x2="82" y2="112" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="90" y1="118" x2="82" y2="128" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="90" y1="134" x2="82" y2="144" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="90" y1="150" x2="82" y2="160" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="90" y1="166" x2="82" y2="176" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="90" y1="182" x2="82" y2="192" stroke="#8a8a8a" stroke-width="1"/>

  <!-- boundary-condition annotation at the wall -->
  <text x="20" y="66" fill="#8a8a8a">fixed end:</text>
  <text x="20" y="234" fill="#8a8a8a">v = 0,  v&#8242; = 0</text>

  <!-- undeformed beam axis (dashed) -->
  <line x1="90" y1="110" x2="560" y2="110" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="300" y="102" fill="#8a8a8a" font-style="italic">undeformed axis (x)</text>

  <!-- deflected elastic curve v(x) -->
  <path d="M 90 110 L 137 111.3 L 184 115 L 231 120.9 L 278 128.7 L 325 138.1 L 372 148.9 L 419 160.7 L 466 173.4 L 513 186.5 L 560 200"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="250" y="170" fill="#4a90d9">v(x)</text>

  <!-- tip load P -->
  <line x1="560" y1="156" x2="560" y2="196" stroke="#e0645c" stroke-width="2"/>
  <polygon points="560,202 554,190 566,190" fill="#e0645c"/>
  <text x="568" y="176" fill="#e0645c">P</text>

  <!-- tip deflection marker -->
  <line x1="560" y1="110" x2="606" y2="110" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="560" y1="200" x2="606" y2="200" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="600" y1="110" x2="600" y2="200" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="600,110 595,120 605,120" fill="#e0645c"/>
  <polygon points="600,200 595,190 605,190" fill="#e0645c"/>
  <text x="512" y="228" fill="#e0645c">&#948; = PL&#179;/(3EI)</text>
</svg>
