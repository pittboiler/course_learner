<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="350" y="20" fill="#8a8a8a" font-style="italic" text-anchor="middle">The prop force R is exactly the force that lifts the released cantilever's tip back to zero.</text>

  <!-- ============ PANEL A: released cantilever + UDL ============ -->
  <!-- wall -->
  <line x1="40" y1="108" x2="40" y2="172" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="40" y1="112" x2="32" y2="122" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="40" y1="126" x2="32" y2="136" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="40" y1="140" x2="32" y2="150" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="40" y1="154" x2="32" y2="164" stroke="#8a8a8a" stroke-width="1"/>
  <!-- undeflected beam -->
  <line x1="40" y1="140" x2="200" y2="140" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- UDL load bar + arrows -->
  <line x1="40" y1="106" x2="200" y2="106" stroke="#4a90d9" stroke-width="1.5"/>
  <line x1="65" y1="106" x2="65" y2="132" stroke="#4a90d9" stroke-width="1"/>
  <polygon points="65,138 61,128 69,128" fill="#4a90d9"/>
  <line x1="105" y1="106" x2="105" y2="132" stroke="#4a90d9" stroke-width="1"/>
  <polygon points="105,138 101,128 109,128" fill="#4a90d9"/>
  <line x1="145" y1="106" x2="145" y2="132" stroke="#4a90d9" stroke-width="1"/>
  <polygon points="145,138 141,128 149,128" fill="#4a90d9"/>
  <line x1="185" y1="106" x2="185" y2="132" stroke="#4a90d9" stroke-width="1"/>
  <polygon points="185,138 181,128 189,128" fill="#4a90d9"/>
  <text x="120" y="100" fill="#4a90d9" text-anchor="middle">w</text>
  <!-- deflected shape (droops down) -->
  <path d="M 40 140 C 90 140, 150 158, 200 170" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="200" cy="170" r="2.5" fill="#4a90d9"/>
  <!-- sub-caption + value -->
  <text x="120" y="192" fill="#8a8a8a" text-anchor="middle">released + UDL</text>
  <text x="120" y="212" fill="#4a90d9" text-anchor="middle">&#948;&#8321; = wL&#8308;/8EI &#8595;</text>

  <!-- operator + -->
  <text x="240" y="146" fill="#8a8a8a" font-size="26" text-anchor="middle">+</text>

  <!-- ============ PANEL B: released cantilever + prop force R ============ -->
  <!-- wall -->
  <line x1="280" y1="108" x2="280" y2="172" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="280" y1="112" x2="272" y2="122" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="280" y1="126" x2="272" y2="136" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="280" y1="140" x2="272" y2="150" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="280" y1="154" x2="272" y2="164" stroke="#8a8a8a" stroke-width="1"/>
  <!-- undeflected beam -->
  <line x1="280" y1="140" x2="440" y2="140" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- deflected shape (lifts up) -->
  <path d="M 280 140 C 330 140, 390 122, 440 114" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="440" cy="114" r="2.5" fill="#4a90d9"/>
  <!-- prop force R (up arrow at tip) -->
  <line x1="440" y1="140" x2="440" y2="100" stroke="#e0645c" stroke-width="2"/>
  <polygon points="440,94 435,105 445,105" fill="#e0645c"/>
  <text x="450" y="120" fill="#e0645c">R</text>
  <!-- sub-caption + value -->
  <text x="360" y="192" fill="#8a8a8a" text-anchor="middle">released + prop R</text>
  <text x="360" y="212" fill="#e0645c" text-anchor="middle">&#948;&#8322; = RL&#179;/3EI &#8593;</text>

  <!-- operator = -->
  <text x="480" y="146" fill="#8a8a8a" font-size="26" text-anchor="middle">=</text>

  <!-- ============ PANEL C: actual propped cantilever ============ -->
  <!-- wall -->
  <line x1="520" y1="108" x2="520" y2="172" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="520" y1="112" x2="512" y2="122" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="520" y1="126" x2="512" y2="136" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="520" y1="140" x2="512" y2="150" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="520" y1="154" x2="512" y2="164" stroke="#8a8a8a" stroke-width="1"/>
  <!-- undeflected beam -->
  <line x1="520" y1="140" x2="680" y2="140" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- UDL load bar + arrows -->
  <line x1="520" y1="106" x2="680" y2="106" stroke="#4a90d9" stroke-width="1.5"/>
  <line x1="545" y1="106" x2="545" y2="132" stroke="#4a90d9" stroke-width="1"/>
  <polygon points="545,138 541,128 549,128" fill="#4a90d9"/>
  <line x1="585" y1="106" x2="585" y2="132" stroke="#4a90d9" stroke-width="1"/>
  <polygon points="585,138 581,128 589,128" fill="#4a90d9"/>
  <line x1="625" y1="106" x2="625" y2="132" stroke="#4a90d9" stroke-width="1"/>
  <polygon points="625,138 621,128 629,128" fill="#4a90d9"/>
  <line x1="665" y1="106" x2="665" y2="132" stroke="#4a90d9" stroke-width="1"/>
  <polygon points="665,138 661,128 669,128" fill="#4a90d9"/>
  <text x="600" y="100" fill="#4a90d9" text-anchor="middle">w</text>
  <!-- deflected shape (small dip, zero at both ends) -->
  <path d="M 520 140 C 570 140, 620 156, 680 140" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <!-- roller support at right end -->
  <polygon points="680,140 673,152 687,152" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="670" y1="156" x2="690" y2="156" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- sub-caption + value -->
  <text x="600" y="192" fill="#8a8a8a" text-anchor="middle">actual propped cantilever</text>
  <text x="600" y="212" fill="#e0645c" text-anchor="middle">net &#948; = 0 at prop</text>

  <!-- compatibility line -->
  <text x="350" y="240" fill="#8a8a8a" text-anchor="middle">Compatibility: set &#948;&#8321; = &#948;&#8322;  &#8594;  R = 3wL/8</text>
</svg>
