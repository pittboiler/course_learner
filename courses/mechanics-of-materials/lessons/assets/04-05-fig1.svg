<svg viewBox="0 0 460 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Two yield boundaries in principal-stress space: safe inside, yield on the curve.</text>

  <!-- axes -->
  <line x1="110" y1="210" x2="352" y2="210" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="352,210 342,205 342,215" fill="#8a8a8a"/>
  <text x="356" y="215" fill="#8a8a8a">&#963;&#8321;</text>
  <line x1="230" y1="332" x2="230" y2="90" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="230,90 225,100 235,100" fill="#8a8a8a"/>
  <text x="214" y="100" fill="#8a8a8a">&#963;&#8322;</text>
  <text x="216" y="226" fill="#8a8a8a">0</text>

  <!-- axis ticks at plus/minus sigma_Y -->
  <line x1="320" y1="206" x2="320" y2="214" stroke="#8a8a8a" stroke-width="1"/>
  <text x="306" y="228" fill="#8a8a8a">&#963;Y</text>
  <line x1="140" y1="206" x2="140" y2="214" stroke="#8a8a8a" stroke-width="1"/>
  <text x="120" y="228" fill="#8a8a8a">&#8722;&#963;Y</text>
  <line x1="226" y1="120" x2="234" y2="120" stroke="#8a8a8a" stroke-width="1"/>
  <text x="238" y="124" fill="#8a8a8a">&#963;Y</text>
  <line x1="226" y1="300" x2="234" y2="300" stroke="#8a8a8a" stroke-width="1"/>
  <text x="238" y="304" fill="#8a8a8a">&#8722;&#963;Y</text>

  <!-- von Mises ellipse (blue) -->
  <path d="M 320.0 120.0 L 330.4 136.5 L 333.9 158.0 L 330.4 183.1 L 320.0 210.0 L 303.5 236.9 L 282.0 262.0 L 256.9 283.5 L 230.0 300.0 L 203.1 310.4 L 178.0 313.9 L 156.5 310.4 L 140.0 300.0 L 129.6 283.5 L 126.1 262.0 L 129.6 236.9 L 140.0 210.0 L 156.5 183.1 L 178.0 158.0 L 203.1 136.5 L 230.0 120.0 L 256.9 109.6 L 282.0 106.1 L 303.5 109.6 Z"
        fill="#4a90d9" fill-opacity="0.07" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- Tresca hexagon (coral) -->
  <path d="M 320 210 L 320 120 L 230 120 L 140 210 L 140 300 L 230 300 Z"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>

  <!-- pure-shear diagonal (max gap), dashed -->
  <line x1="230" y1="210" x2="290" y2="270" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- max-gap markers on the pure-shear line -->
  <circle cx="275" cy="255" r="3" fill="#e0645c"/>
  <circle cx="282.0" cy="262.0" r="3" fill="#4a90d9"/>
  <line x1="300" y1="290" x2="284" y2="264" stroke="#8a8a8a" stroke-width="1"/>
  <text x="296" y="306" fill="#8a8a8a">pure shear:</text>
  <text x="296" y="322" fill="#8a8a8a">gap ~15%</text>

  <!-- legend -->
  <line x1="40" y1="360" x2="66" y2="360" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="72" y="365" fill="#8a8a8a">von Mises (ellipse)</text>
  <line x1="40" y1="382" x2="66" y2="382" stroke="#e0645c" stroke-width="2.5"/>
  <text x="72" y="387" fill="#8a8a8a">Tresca (hexagon, inscribed)</text>
</svg>
