<svg viewBox="0 0 790 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="22" fill="#8a8a8a" font-size="11.5" font-style="italic">A bucket overflows. Whether the directory doubles depends on one comparison: local depth against global depth.</text>
  <text x="24" y="58" fill="#8a8a8a" font-size="11.5" font-weight="bold">before: insert 21</text>
  <text x="24" y="87" fill="#8a8a8a" font-size="10">000</text>
  <line x1="58" y1="83" x2="78" y2="83" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="82" y="87" fill="#8a8a8a" font-size="10">B0</text>
  <text x="24" y="107" fill="#8a8a8a" font-size="10">001</text>
  <line x1="58" y1="103" x2="78" y2="103" stroke="#e0645c" stroke-width="1.0"/>
  <text x="82" y="107" fill="#e0645c" font-size="10">B1</text>
  <text x="24" y="127" fill="#8a8a8a" font-size="10">010</text>
  <line x1="58" y1="123" x2="78" y2="123" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="82" y="127" fill="#8a8a8a" font-size="10">B2</text>
  <text x="24" y="147" fill="#8a8a8a" font-size="10">011</text>
  <line x1="58" y1="143" x2="78" y2="143" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="82" y="147" fill="#8a8a8a" font-size="10">B3</text>
  <text x="24" y="167" fill="#8a8a8a" font-size="10">100</text>
  <line x1="58" y1="163" x2="78" y2="163" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="82" y="167" fill="#8a8a8a" font-size="10">B4</text>
  <text x="24" y="187" fill="#8a8a8a" font-size="10">101</text>
  <line x1="58" y1="183" x2="78" y2="183" stroke="#e0645c" stroke-width="1.0"/>
  <text x="82" y="187" fill="#e0645c" font-size="10">B1</text>
  <text x="24" y="207" fill="#8a8a8a" font-size="10">110</text>
  <line x1="58" y1="203" x2="78" y2="203" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="82" y="207" fill="#8a8a8a" font-size="10">B2</text>
  <text x="24" y="227" fill="#8a8a8a" font-size="10">111</text>
  <line x1="58" y1="223" x2="78" y2="223" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="82" y="227" fill="#8a8a8a" font-size="10">B3</text>
  <rect x="24" y="246" width="168" height="20" fill="#e0645c" stroke="#e0645c" stroke-width="1.0" rx="2" opacity="0.22"/>
  <text x="30" y="260" fill="#e0645c" font-size="10">B1  ld=2  [1, 5]  FULL</text>
  <text x="24" y="286" fill="#8a8a8a" font-size="10">Bucket B1 is full, and its local</text>
  <text x="24" y="302" fill="#8a8a8a" font-size="10">depth 2 is BELOW the global</text>
  <text x="24" y="318" fill="#8a8a8a" font-size="10">depth 3 - so two directory</text>
  <text x="24" y="334" fill="#8a8a8a" font-size="10">entries (001 and 101) already</text>
  <text x="24" y="350" fill="#8a8a8a" font-size="10">point at it.</text>
  <text x="288" y="58" fill="#4a90d9" font-size="11.5" font-weight="bold">split only, no doubling</text>
  <text x="288" y="87" fill="#8a8a8a" font-size="10">000</text>
  <line x1="322" y1="83" x2="342" y2="83" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="346" y="87" fill="#8a8a8a" font-size="10">B0</text>
  <text x="288" y="107" fill="#8a8a8a" font-size="10">001</text>
  <line x1="322" y1="103" x2="342" y2="103" stroke="#e0645c" stroke-width="1.0"/>
  <text x="346" y="107" fill="#e0645c" font-size="10">B1</text>
  <text x="288" y="127" fill="#8a8a8a" font-size="10">010</text>
  <line x1="322" y1="123" x2="342" y2="123" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="346" y="127" fill="#8a8a8a" font-size="10">B2</text>
  <text x="288" y="147" fill="#8a8a8a" font-size="10">011</text>
  <line x1="322" y1="143" x2="342" y2="143" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="346" y="147" fill="#8a8a8a" font-size="10">B3</text>
  <text x="288" y="167" fill="#8a8a8a" font-size="10">100</text>
  <line x1="322" y1="163" x2="342" y2="163" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="346" y="167" fill="#8a8a8a" font-size="10">B4</text>
  <text x="288" y="187" fill="#8a8a8a" font-size="10">101</text>
  <line x1="322" y1="183" x2="342" y2="183" stroke="#e0645c" stroke-width="1.0"/>
  <text x="346" y="187" fill="#e0645c" font-size="10">B5</text>
  <text x="288" y="207" fill="#8a8a8a" font-size="10">110</text>
  <line x1="322" y1="203" x2="342" y2="203" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="346" y="207" fill="#8a8a8a" font-size="10">B2</text>
  <text x="288" y="227" fill="#8a8a8a" font-size="10">111</text>
  <line x1="322" y1="223" x2="342" y2="223" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="346" y="227" fill="#8a8a8a" font-size="10">B3</text>
  <rect x="288" y="246" width="168" height="20" fill="#e0645c" stroke="#e0645c" stroke-width="1.0" rx="2" opacity="0.22"/>
  <text x="294" y="260" fill="#e0645c" font-size="10">B1  ld=3  [1]</text>
  <rect x="288" y="270" width="168" height="20" fill="#e0645c" stroke="#e0645c" stroke-width="1.0" rx="2" opacity="0.22"/>
  <text x="294" y="284" fill="#e0645c" font-size="10">B5  ld=3  [5, 21]</text>
  <text x="288" y="310" fill="#8a8a8a" font-size="10">B1 splits into B1 and B5, both</text>
  <text x="288" y="326" fill="#8a8a8a" font-size="10">at local depth 3. Entry 101 is</text>
  <text x="288" y="342" fill="#8a8a8a" font-size="10">re-pointed at B5; 001 keeps B1.</text>
  <text x="288" y="358" fill="#8a8a8a" font-size="10">The directory did not change</text>
  <text x="288" y="374" fill="#8a8a8a" font-size="10">size - it did not need to.</text>
  <text x="552" y="58" fill="#e0645c" font-size="11.5" font-weight="bold">next insert forces a double</text>
  <text x="552" y="87" fill="#8a8a8a" font-size="10">...101</text>
  <line x1="586" y1="83" x2="606" y2="83" stroke="#e0645c" stroke-width="1.0"/>
  <text x="610" y="87" fill="#e0645c" font-size="10">B5</text>
  <rect x="552" y="106" width="168" height="20" fill="#e0645c" stroke="#e0645c" stroke-width="1.0" rx="2" opacity="0.22"/>
  <text x="558" y="120" fill="#e0645c" font-size="10">B5  ld=3  [5, 21]  FULL</text>
  <text x="552" y="146" fill="#8a8a8a" font-size="10">Now B5 is full and its local depth</text>
  <text x="552" y="162" fill="#8a8a8a" font-size="10">3 EQUALS the global depth, so no</text>
  <text x="552" y="178" fill="#8a8a8a" font-size="10">spare directory entry exists to</text>
  <text x="552" y="194" fill="#8a8a8a" font-size="10">re-point. The directory must</text>
  <text x="552" y="210" fill="#8a8a8a" font-size="10">double to depth 4 first, and only</text>
  <text x="552" y="226" fill="#8a8a8a" font-size="10">then can B5 split.</text>
  <text x="552" y="242" fill="#8a8a8a" font-size="10"></text>
  <text x="552" y="258" fill="#8a8a8a" font-size="10">Doubling costs one directory</text>
  <text x="552" y="274" fill="#8a8a8a" font-size="10">rewrite. No data page moves</text>
  <text x="552" y="290" fill="#8a8a8a" font-size="10">except the one bucket that splits.</text>
  <text x="24" y="386" fill="#4a90d9" font-size="10.5">The rule in one line:  local depth &lt; global depth  -&gt;  split the bucket.   local depth = global depth  -&gt;  double, then split.</text>
  <text x="24" y="406" fill="#e0645c" font-size="10.5">Either way a lookup is ONE directory probe plus ONE bucket read, no matter how large the file grows.</text>
</svg>
