<svg viewBox="0 0 790 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="22" fill="#8a8a8a" font-size="11.5" font-style="italic">Division as a grid. A member qualifies only if her row has no gap in the required columns.</text>
  <text x="24" y="72" fill="#8a8a8a" font-size="11">required:</text>
  <text x="159" y="72" fill="#4a90d9" font-size="11.5" text-anchor="middle" font-weight="bold">B1</text>
  <text x="237" y="72" fill="#4a90d9" font-size="11.5" text-anchor="middle" font-weight="bold">B2</text>
  <text x="315" y="72" fill="#4a90d9" font-size="11.5" text-anchor="middle" font-weight="bold">B5</text>
  <text x="24" y="108" fill="#8a8a8a" font-size="11.5">Ada</text>
  <rect x="124" y="88" width="70" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.16"/>
  <text x="159" y="110" fill="#4a90d9" font-size="10" text-anchor="middle">borrowed</text>
  <rect x="202" y="88" width="70" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.16"/>
  <text x="237" y="110" fill="#4a90d9" font-size="10" text-anchor="middle">borrowed</text>
  <rect x="280" y="88" width="70" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.16"/>
  <text x="315" y="110" fill="#4a90d9" font-size="10" text-anchor="middle">borrowed</text>
  <text x="370" y="110" fill="#4a90d9" font-size="11">qualifies</text>
  <text x="24" y="146" fill="#8a8a8a" font-size="11.5">Bram</text>
  <rect x="124" y="126" width="70" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.16"/>
  <text x="159" y="148" fill="#4a90d9" font-size="10" text-anchor="middle">borrowed</text>
  <rect x="202" y="126" width="70" height="28" fill="#e0645c" stroke="#e0645c" stroke-width="1.2" rx="3" opacity="0.26"/>
  <text x="237" y="148" fill="#e0645c" font-size="10" text-anchor="middle">MISSING</text>
  <rect x="280" y="126" width="70" height="28" fill="#e0645c" stroke="#e0645c" stroke-width="1.2" rx="3" opacity="0.26"/>
  <text x="315" y="148" fill="#e0645c" font-size="10" text-anchor="middle">MISSING</text>
  <text x="370" y="148" fill="#e0645c" font-size="11">gap</text>
  <text x="24" y="184" fill="#8a8a8a" font-size="11.5">Cyd</text>
  <rect x="124" y="164" width="70" height="28" fill="#e0645c" stroke="#e0645c" stroke-width="1.2" rx="3" opacity="0.26"/>
  <text x="159" y="186" fill="#e0645c" font-size="10" text-anchor="middle">MISSING</text>
  <rect x="202" y="164" width="70" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.16"/>
  <text x="237" y="186" fill="#4a90d9" font-size="10" text-anchor="middle">borrowed</text>
  <rect x="280" y="164" width="70" height="28" fill="#e0645c" stroke="#e0645c" stroke-width="1.2" rx="3" opacity="0.26"/>
  <text x="315" y="186" fill="#e0645c" font-size="10" text-anchor="middle">MISSING</text>
  <text x="370" y="186" fill="#e0645c" font-size="11">gap</text>
  <text x="24" y="220" fill="#8a8a8a" font-size="11.5">Devi</text>
  <text x="124" y="220" fill="#8a8a8a" font-size="10.5">no loans at all - never appears as a candidate</text>
  <rect x="24" y="250" width="736" height="96" fill="none" stroke="#8a8a8a" stroke-width="1.2" rx="5" stroke-dasharray="4 4"/>
  <text x="38" y="272" fill="#8a8a8a" font-size="11">The four MISSING cells are exactly what the algebra subtracts:</text>
  <text x="38" y="292" fill="#e0645c" font-size="11.5">(Bram,B2)  (Bram,B5)  (Cyd,B1)  (Cyd,B5)</text>
  <text x="38" y="314" fill="#8a8a8a" font-size="10.5">Project them onto the member column to get the disqualified set {Bram, Cyd}, then remove</text>
  <text x="38" y="330" fill="#8a8a8a" font-size="10.5">it from all candidates {Ada, Bram, Cyd}. Two subtractions - hence two nested NOT EXISTS.</text>
</svg>
