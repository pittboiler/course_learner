<svg viewBox="0 0 790 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="22" fill="#8a8a8a" font-size="11.5" font-style="italic">Each level is defined by the anomalies it permits. Snapshot isolation sits off this ladder and admits an anomaly of its own.</text>
  <text x="24" y="58" fill="#4a90d9" font-size="11" font-weight="bold">isolation level</text>
  <text x="234" y="78" fill="#8a8a8a" font-size="10" text-anchor="middle">dirty read</text>
  <text x="342" y="78" fill="#8a8a8a" font-size="10" text-anchor="middle">non-repeatable</text>
  <text x="450" y="78" fill="#8a8a8a" font-size="10" text-anchor="middle">phantom</text>
  <text x="558" y="78" fill="#8a8a8a" font-size="10" text-anchor="middle">write skew</text>
  <text x="28" y="116" fill="#8a8a8a" font-size="10.5">Read Uncommitted</text>
  <rect x="184" y="98" width="100" height="28" fill="#e0645c" stroke="#e0645c" stroke-width="1.0" rx="3" opacity="0.2"/>
  <text x="234" y="117" fill="#e0645c" font-size="10.5" text-anchor="middle">yes</text>
  <rect x="292" y="98" width="100" height="28" fill="#e0645c" stroke="#e0645c" stroke-width="1.0" rx="3" opacity="0.2"/>
  <text x="342" y="117" fill="#e0645c" font-size="10.5" text-anchor="middle">yes</text>
  <rect x="400" y="98" width="100" height="28" fill="#e0645c" stroke="#e0645c" stroke-width="1.0" rx="3" opacity="0.2"/>
  <text x="450" y="117" fill="#e0645c" font-size="10.5" text-anchor="middle">yes</text>
  <rect x="508" y="98" width="100" height="28" fill="#e0645c" stroke="#e0645c" stroke-width="1.0" rx="3" opacity="0.2"/>
  <text x="558" y="117" fill="#e0645c" font-size="10.5" text-anchor="middle">yes</text>
  <text x="28" y="152" fill="#8a8a8a" font-size="10.5">Read Committed</text>
  <rect x="184" y="134" width="100" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.0" rx="3" opacity="0.12"/>
  <text x="234" y="153" fill="#4a90d9" font-size="10.5" text-anchor="middle">no</text>
  <rect x="292" y="134" width="100" height="28" fill="#e0645c" stroke="#e0645c" stroke-width="1.0" rx="3" opacity="0.2"/>
  <text x="342" y="153" fill="#e0645c" font-size="10.5" text-anchor="middle">yes</text>
  <rect x="400" y="134" width="100" height="28" fill="#e0645c" stroke="#e0645c" stroke-width="1.0" rx="3" opacity="0.2"/>
  <text x="450" y="153" fill="#e0645c" font-size="10.5" text-anchor="middle">yes</text>
  <rect x="508" y="134" width="100" height="28" fill="#e0645c" stroke="#e0645c" stroke-width="1.0" rx="3" opacity="0.2"/>
  <text x="558" y="153" fill="#e0645c" font-size="10.5" text-anchor="middle">yes</text>
  <text x="28" y="188" fill="#8a8a8a" font-size="10.5">Repeatable Read</text>
  <rect x="184" y="170" width="100" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.0" rx="3" opacity="0.12"/>
  <text x="234" y="189" fill="#4a90d9" font-size="10.5" text-anchor="middle">no</text>
  <rect x="292" y="170" width="100" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.0" rx="3" opacity="0.12"/>
  <text x="342" y="189" fill="#4a90d9" font-size="10.5" text-anchor="middle">no</text>
  <rect x="400" y="170" width="100" height="28" fill="#e0645c" stroke="#e0645c" stroke-width="1.0" rx="3" opacity="0.2"/>
  <text x="450" y="189" fill="#e0645c" font-size="10.5" text-anchor="middle">yes</text>
  <rect x="508" y="170" width="100" height="28" fill="#e0645c" stroke="#e0645c" stroke-width="1.0" rx="3" opacity="0.2"/>
  <text x="558" y="189" fill="#e0645c" font-size="10.5" text-anchor="middle">yes</text>
  <text x="28" y="224" fill="#8a8a8a" font-size="10.5">Serializable</text>
  <rect x="184" y="206" width="100" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.0" rx="3" opacity="0.12"/>
  <text x="234" y="225" fill="#4a90d9" font-size="10.5" text-anchor="middle">no</text>
  <rect x="292" y="206" width="100" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.0" rx="3" opacity="0.12"/>
  <text x="342" y="225" fill="#4a90d9" font-size="10.5" text-anchor="middle">no</text>
  <rect x="400" y="206" width="100" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.0" rx="3" opacity="0.12"/>
  <text x="450" y="225" fill="#4a90d9" font-size="10.5" text-anchor="middle">no</text>
  <rect x="508" y="206" width="100" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.0" rx="3" opacity="0.12"/>
  <text x="558" y="225" fill="#4a90d9" font-size="10.5" text-anchor="middle">no</text>
  <text x="28" y="260" fill="#e0645c" font-size="10.5" font-weight="bold">Snapshot (SI)</text>
  <rect x="184" y="242" width="100" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.0" rx="3" opacity="0.12"/>
  <text x="234" y="261" fill="#4a90d9" font-size="10.5" text-anchor="middle">no</text>
  <rect x="292" y="242" width="100" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.0" rx="3" opacity="0.12"/>
  <text x="342" y="261" fill="#4a90d9" font-size="10.5" text-anchor="middle">no</text>
  <rect x="400" y="242" width="100" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.0" rx="3" opacity="0.12"/>
  <text x="450" y="261" fill="#4a90d9" font-size="10.5" text-anchor="middle">no</text>
  <rect x="508" y="242" width="100" height="28" fill="#e0645c" stroke="#e0645c" stroke-width="1.0" rx="3" opacity="0.3"/>
  <text x="558" y="261" fill="#e0645c" font-size="10.5" text-anchor="middle">YES</text>
  <line x1="24" y1="90" x2="612" y2="90" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="24" y="296" fill="#e0645c" font-size="11" font-weight="bold">write skew, the anomaly the ladder does not name</text>
  <text x="28" y="314" fill="#8a8a8a" font-size="9.5"></text>
  <text x="96" y="314" fill="#8a8a8a" font-size="9.5">T1</text>
  <text x="430" y="314" fill="#8a8a8a" font-size="9.5">T2</text>
  <text x="28" y="331" fill="#8a8a8a" font-size="9.5">start</text>
  <text x="96" y="331" fill="#8a8a8a" font-size="9.5">pilots on duty: Reyes, Okonjo</text>
  <text x="430" y="331" fill="#8a8a8a" font-size="9.5"></text>
  <text x="28" y="348" fill="#8a8a8a" font-size="9.5">read</text>
  <text x="96" y="348" fill="#8a8a8a" font-size="9.5">sees BOTH on duty</text>
  <text x="430" y="348" fill="#8a8a8a" font-size="9.5">sees BOTH on duty</text>
  <text x="28" y="365" fill="#8a8a8a" font-size="9.5">decide</text>
  <text x="96" y="365" fill="#8a8a8a" font-size="9.5">'one will remain' - removes Reyes</text>
  <text x="430" y="365" fill="#8a8a8a" font-size="9.5">'one will remain' - removes Okonjo</text>
  <text x="28" y="382" fill="#8a8a8a" font-size="9.5">write</text>
  <text x="96" y="382" fill="#8a8a8a" font-size="9.5">row Reyes</text>
  <text x="430" y="382" fill="#8a8a8a" font-size="9.5">row Okonjo   (different row!)</text>
  <text x="28" y="399" fill="#8a8a8a" font-size="9.5">commit</text>
  <text x="96" y="399" fill="#8a8a8a" font-size="9.5">succeeds</text>
  <text x="430" y="399" fill="#8a8a8a" font-size="9.5">succeeds</text>
  <text x="28" y="416" fill="#8a8a8a" font-size="9.5">result</text>
  <text x="96" y="416" fill="#e0645c" font-size="9.5">pilots on duty: NONE</text>
  <text x="430" y="416" fill="#8a8a8a" font-size="9.5"></text>
  <rect x="470" y="296" width="296" height="126" fill="#e0645c" stroke="#e0645c" stroke-width="1.2" rx="5" opacity="0.1"/>
  <text x="482" y="316" fill="#e0645c" font-size="10.5" font-weight="bold">Why SI misses it:</text>
  <text x="482" y="334" fill="#8a8a8a" font-size="10">SI aborts a transaction only when two</text>
  <text x="482" y="350" fill="#8a8a8a" font-size="10">transactions write the SAME row. Here</text>
  <text x="482" y="366" fill="#8a8a8a" font-size="10">they write different rows, so there is no</text>
  <text x="482" y="382" fill="#8a8a8a" font-size="10">write-write conflict to detect - and the</text>
  <text x="482" y="398" fill="#8a8a8a" font-size="10">constraint each checked was invalidated</text>
  <text x="482" y="414" fill="#e0645c" font-size="10">by the other's write, not its own.</text>
</svg>
