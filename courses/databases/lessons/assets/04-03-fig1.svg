<svg viewBox="0 0 790 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="22" fill="#8a8a8a" font-size="11.5" font-style="italic">Two-phase locking guarantees an acyclic precedence graph by construction - and pays for it with deadlock.</text>
  <text x="24" y="58" fill="#4a90d9" font-size="11" font-weight="bold">lock compatibility</text>
  <text x="90" y="78" fill="#8a8a8a" font-size="10.5" text-anchor="middle">held S</text>
  <text x="160" y="78" fill="#8a8a8a" font-size="10.5" text-anchor="middle">held X</text>
  <text x="52" y="108" fill="#8a8a8a" font-size="10.5" text-anchor="middle">want S</text>
  <rect x="60" y="88" width="62" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.1" rx="3" opacity="0.18"/>
  <text x="91" y="107" fill="#4a90d9" font-size="10.5" text-anchor="middle">yes</text>
  <rect x="130" y="88" width="62" height="28" fill="#e0645c" stroke="#e0645c" stroke-width="1.1" rx="3" opacity="0.18"/>
  <text x="161" y="107" fill="#e0645c" font-size="10.5" text-anchor="middle">wait</text>
  <text x="52" y="142" fill="#8a8a8a" font-size="10.5" text-anchor="middle">want X</text>
  <rect x="60" y="122" width="62" height="28" fill="#e0645c" stroke="#e0645c" stroke-width="1.1" rx="3" opacity="0.18"/>
  <text x="91" y="141" fill="#e0645c" font-size="10.5" text-anchor="middle">wait</text>
  <rect x="130" y="122" width="62" height="28" fill="#e0645c" stroke="#e0645c" stroke-width="1.1" rx="3" opacity="0.18"/>
  <text x="161" y="141" fill="#e0645c" font-size="10.5" text-anchor="middle">wait</text>
  <text x="24" y="170" fill="#8a8a8a" font-size="10">Only reader-reader shares. Everything</text>
  <text x="24" y="186" fill="#8a8a8a" font-size="10">else waits - which is exactly the set of</text>
  <text x="24" y="202" fill="#4a90d9" font-size="10">CONFLICTS from 4.2, enforced.</text>
  <line x1="250" y1="210" x2="530" y2="210" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="250" y1="80" x2="250" y2="210" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="250" y="228" fill="#8a8a8a" font-size="10.5">time</text>
  <text x="244" y="74" fill="#8a8a8a" font-size="10.5" text-anchor="end">locks held</text>
  <text x="250" y="62" fill="#4a90d9" font-size="11" font-weight="bold">the two phases</text>
  <path d="M 258,210 L 340,120 L 400,120 L 470,210" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <line x1="340" y1="210" x2="340" y2="114" stroke="#8a8a8a" stroke-width="1.0" stroke-dasharray="3 3"/>
  <line x1="400" y1="210" x2="400" y2="114" stroke="#8a8a8a" stroke-width="1.0" stroke-dasharray="3 3"/>
  <text x="295" y="228" fill="#4a90d9" font-size="10" text-anchor="middle">growing</text>
  <text x="435" y="228" fill="#4a90d9" font-size="10" text-anchor="middle">shrinking</text>
  <text x="370" y="106" fill="#e0645c" font-size="10" text-anchor="middle">lock point</text>
  <text x="250" y="236" fill="#8a8a8a" font-size="10">The rule: once you release ANY lock you may</text>
  <text x="250" y="252" fill="#8a8a8a" font-size="10">acquire no more. The lock point is the instant</text>
  <text x="250" y="268" fill="#8a8a8a" font-size="10">the transaction 'takes effect' - and ordering</text>
  <text x="250" y="284" fill="#4a90d9" font-size="10">transactions by lock point IS a serial order.</text>
  <text x="250" y="308" fill="#e0645c" font-size="10">STRICT 2PL goes further: hold every X lock</text>
  <text x="250" y="324" fill="#e0645c" font-size="10">until commit, so the shrink is a vertical drop.</text>
  <text x="250" y="340" fill="#e0645c" font-size="10">That is what buys cascadelessness.</text>
  <text x="578" y="62" fill="#e0645c" font-size="11" font-weight="bold">wait-for graph</text>
  <circle cx="620" cy="120" r="22" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.15"/>
  <circle cx="620" cy="120" r="22" fill="none" stroke="#e0645c" stroke-width="1.4"/>
  <text x="620" y="125" fill="#e0645c" font-size="11.5" text-anchor="middle">T1</text>
  <circle cx="740" cy="120" r="22" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.15"/>
  <circle cx="740" cy="120" r="22" fill="none" stroke="#e0645c" stroke-width="1.4"/>
  <text x="740" y="125" fill="#e0645c" font-size="11.5" text-anchor="middle">T2</text>
  <circle cx="680" cy="225" r="22" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.15"/>
  <circle cx="680" cy="225" r="22" fill="none" stroke="#e0645c" stroke-width="1.4"/>
  <text x="680" y="230" fill="#e0645c" font-size="11.5" text-anchor="middle">T3</text>
  <line x1="644" y1="120" x2="712" y2="120" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="712.0,120.0 703.0,116.0 703.0,124.0" fill="#e0645c"/>
  <text x="678" y="116" fill="#e0645c" font-size="10" text-anchor="middle">B</text>
  <line x1="728.093" y1="140.838" x2="693.892" y2="200.689" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="693.9,200.7 701.8,194.9 694.9,190.9" fill="#e0645c"/>
  <text x="734.992" y="166.764" fill="#e0645c" font-size="10" text-anchor="middle">C</text>
  <line x1="668.093" y1="204.162" x2="633.892" y2="144.311" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="633.9,144.3 634.9,154.1 641.8,150.1" fill="#e0645c"/>
  <text x="626.992" y="170.236" fill="#e0645c" font-size="10" text-anchor="middle">A</text>
  <text x="578" y="270" fill="#8a8a8a" font-size="10">A cycle here is a DEADLOCK: each holds a</text>
  <text x="578" y="286" fill="#8a8a8a" font-size="10">lock the next one needs. Nobody moves.</text>
  <text x="578" y="310" fill="#8a8a8a" font-size="10">The database's response is one the OS</text>
  <text x="578" y="326" fill="#4a90d9" font-size="10">cannot make - it ABORTS a victim and</text>
  <text x="578" y="342" fill="#4a90d9" font-size="10">restarts it. Rollback is a preemption</text>
  <text x="578" y="358" fill="#4a90d9" font-size="10">that a process cannot offer.</text>
  <text x="24" y="394" fill="#8a8a8a" font-size="10.5">Deadlock is not a flaw in 2PL. It is what happens when the protocol refuses to build a cyclic precedence graph:</text>
  <text x="24" y="412" fill="#4a90d9" font-size="10.5">the cycle has to go somewhere, and 2PL puts it in the wait-for graph, where it is detectable and repairable.</text>
</svg>
