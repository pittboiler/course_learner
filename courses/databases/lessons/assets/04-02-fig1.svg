<svg viewBox="0 0 790 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="22" fill="#8a8a8a" font-size="11.5" font-style="italic">A schedule is conflict-serializable exactly when its precedence graph is acyclic. Read the graph, not the schedule.</text>
  <text x="24" y="62" fill="#e0645c" font-size="11.5">S1:  r1(X)  w2(Y)  r3(Z)  r3(Y)  w2(X)  w1(Z)</text>
  <circle cx="110" cy="130" r="24" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.15"/>
  <circle cx="110" cy="130" r="24" fill="none" stroke="#e0645c" stroke-width="1.4"/>
  <text x="110" y="135" fill="#e0645c" font-size="12" text-anchor="middle">T1</text>
  <circle cx="250" cy="130" r="24" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.15"/>
  <circle cx="250" cy="130" r="24" fill="none" stroke="#e0645c" stroke-width="1.4"/>
  <text x="250" y="135" fill="#e0645c" font-size="12" text-anchor="middle">T2</text>
  <circle cx="180" cy="250" r="24" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.15"/>
  <circle cx="180" cy="250" r="24" fill="none" stroke="#e0645c" stroke-width="1.4"/>
  <text x="180" y="255" fill="#e0645c" font-size="12" text-anchor="middle">T3</text>
  <line x1="136" y1="130" x2="220" y2="130" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="220.0,130.0 211.0,126.0 211.0,134.0" fill="#e0645c"/>
  <text x="178" y="126" fill="#e0645c" font-size="10" text-anchor="middle">X</text>
  <line x1="236.899" y1="152.458" x2="195.116" y2="224.087" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="195.1,224.1 203.1,218.3 196.2,214.3" fill="#e0645c"/>
  <text x="242.008" y="184.272" fill="#e0645c" font-size="10" text-anchor="middle">Y</text>
  <line x1="166.899" y1="227.542" x2="125.116" y2="155.913" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="125.1,155.9 126.2,165.7 133.1,161.7" fill="#e0645c"/>
  <text x="120.008" y="187.728" fill="#e0645c" font-size="10" text-anchor="middle">Z</text>
  <text x="24" y="300" fill="#e0645c" font-size="10.5">T1 -&gt; T2 -&gt; T3 -&gt; T1 is a cycle, so NO serial order</text>
  <text x="24" y="316" fill="#e0645c" font-size="10.5">matches. The schedule is not conflict-serializable</text>
  <text x="24" y="332" fill="#e0645c" font-size="10.5">and a scheduler must not allow it.</text>
  <text x="24" y="356" fill="#8a8a8a" font-size="10.5">Note no two transactions conflict TWICE - every</text>
  <text x="24" y="372" fill="#8a8a8a" font-size="10.5">edge is a different item. A pairwise check misses it.</text>
  <text x="430" y="62" fill="#4a90d9" font-size="11.5">S2:  r3(Z)  r1(X)  w1(X)  r2(X)  w2(Y)  r3(Y)</text>
  <circle cx="490" cy="150" r="24" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.15"/>
  <circle cx="490" cy="150" r="24" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="490" y="155" fill="#4a90d9" font-size="12" text-anchor="middle">T1</text>
  <circle cx="610" cy="150" r="24" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.15"/>
  <circle cx="610" cy="150" r="24" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="610" y="155" fill="#4a90d9" font-size="12" text-anchor="middle">T2</text>
  <circle cx="730" cy="150" r="24" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" opacity="0.15"/>
  <circle cx="730" cy="150" r="24" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="730" y="155" fill="#4a90d9" font-size="12" text-anchor="middle">T3</text>
  <line x1="516" y1="150" x2="580" y2="150" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="580.0,150.0 571.0,146.0 571.0,154.0" fill="#8a8a8a"/>
  <text x="548" y="146" fill="#8a8a8a" font-size="10" text-anchor="middle">X</text>
  <line x1="636" y1="150" x2="700" y2="150" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="700.0,150.0 691.0,146.0 691.0,154.0" fill="#8a8a8a"/>
  <text x="668" y="146" fill="#8a8a8a" font-size="10" text-anchor="middle">Y</text>
  <text x="430" y="220" fill="#4a90d9" font-size="10.5">Acyclic, so it IS conflict-serializable.</text>
  <text x="430" y="244" fill="#8a8a8a" font-size="10.5">The edges give a topological order, and here</text>
  <text x="430" y="260" fill="#4a90d9" font-size="10.5">there is exactly one: T1, T2, T3.</text>
  <text x="430" y="292" fill="#8a8a8a" font-size="10.5">The schedule interleaves - T3 reads Z before T1</text>
  <text x="430" y="308" fill="#8a8a8a" font-size="10.5">starts and Y after T2 finishes - yet its effect is</text>
  <text x="430" y="324" fill="#8a8a8a" font-size="10.5">identical to running the three one after another.</text>
  <text x="430" y="356" fill="#4a90d9" font-size="10.5">That is the whole definition of correct concurrency:</text>
  <text x="430" y="372" fill="#4a90d9" font-size="10.5">not 'no interleaving' but 'indistinguishable from none'.</text>
</svg>
