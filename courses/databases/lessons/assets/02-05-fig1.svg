  <text x="608" y="262" fill="#e0645c" font-size="10.5">4 rows back.</text>
  <text x="608" y="284" fill="#e0645c" font-size="10.5">The two coral rows</text>
  <text x="608" y="300" fill="#e0645c" font-size="10.5">were never stored.</text>
  <text x="24" y="348" fill="#8a8a8a" font-size="11">The test is one closure. For a split into R1 and R2, the join is lossless exactly when the shared</text>
  <text x="24" y="368" fill="#8a8a8a" font-size="11">attributes determine all of R1 or all of R2. Here pid -&gt; pname passes; flight determines nothing.</text>
  <text x="24" y="392" fill="#e0645c" font-size="11">A lossy decomposition does not lose rows - it gains them, which is worse and harder to notice.</text>
