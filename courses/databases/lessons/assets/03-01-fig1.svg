<svg viewBox="0 0 790 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="22" fill="#8a8a8a" font-size="11.5" font-style="italic">The buffer pool is the only place data is readable. What it is allowed to do with a dirty page decides what recovery must do.</text>
  <text x="24" y="62" fill="#4a90d9" font-size="12" font-weight="bold">buffer pool</text>
  <text x="24" y="78" fill="#8a8a8a" font-size="10">frames  pin  dirty</text>
  <rect x="24" y="90" width="150" height="30" fill="#e0645c" stroke="#e0645c" stroke-width="1.2" rx="3" opacity="0.15"/>
  <text x="32" y="110" fill="#e0645c" font-size="10.5">booking p417</text>
  <text x="184" y="110" fill="#8a8a8a" font-size="11">2</text>
  <text x="216" y="110" fill="#e0645c" font-size="10.5">yes</text>
  <rect x="24" y="128" width="150" height="30" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.15"/>
  <text x="32" y="148" fill="#4a90d9" font-size="10.5">passenger p9</text>
  <text x="184" y="148" fill="#8a8a8a" font-size="11">0</text>
  <text x="216" y="148" fill="#8a8a8a" font-size="10.5">no</text>
  <rect x="24" y="166" width="150" height="30" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.15"/>
  <text x="32" y="186" fill="#4a90d9" font-size="10.5">booking p418</text>
  <text x="184" y="186" fill="#8a8a8a" font-size="11">1</text>
  <text x="216" y="186" fill="#8a8a8a" font-size="10.5">no</text>
  <rect x="24" y="204" width="150" height="30" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.15"/>
  <text x="32" y="224" fill="#4a90d9" font-size="10.5">index root</text>
  <text x="184" y="224" fill="#8a8a8a" font-size="11">5</text>
  <text x="216" y="224" fill="#8a8a8a" font-size="10.5">no</text>
  <rect x="24" y="242" width="150" height="30" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.2" rx="3" opacity="0.1"/>
  <text x="32" y="262" fill="#8a8a8a" font-size="10.5">free</text>
  <text x="184" y="262" fill="#8a8a8a" font-size="11">-</text>
  <text x="216" y="262" fill="#8a8a8a" font-size="10.5">-</text>
  <text x="24" y="300" fill="#8a8a8a" font-size="10">pin &gt; 0 means someone is reading it:</text>
  <text x="24" y="316" fill="#8a8a8a" font-size="10">the frame cannot be evicted at all.</text>
  <text x="24" y="336" fill="#e0645c" font-size="10">dirty means the disk copy is stale:</text>
  <text x="24" y="352" fill="#e0645c" font-size="10">evicting it requires a write first.</text>
  <text x="24" y="376" fill="#8a8a8a" font-size="10">A page not in the pool cannot be read</text>
  <text x="24" y="392" fill="#8a8a8a" font-size="10">by anyone - every access goes through here.</text>
  <text x="336" y="62" fill="#4a90d9" font-size="11" font-weight="bold">may an UNCOMMITTED dirty page be evicted?</text>
  <text x="336" y="78" fill="#4a90d9" font-size="11" font-weight="bold">must a COMMITTED page be written at commit?</text>
  <text x="536" y="92" fill="#8a8a8a" font-size="11" text-anchor="middle">no steal</text>
  <text x="736" y="92" fill="#e0645c" font-size="11" text-anchor="middle">STEAL</text>
  <text x="328" y="142" fill="#8a8a8a" font-size="11" text-anchor="end">FORCE</text>
  <rect x="340" y="100" width="192" height="76" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.3" rx="4" opacity="0.1"/>
  <text x="436" y="130" fill="#8a8a8a" font-size="11.5" text-anchor="middle">no undo</text>
  <text x="436" y="150" fill="#8a8a8a" font-size="11.5" text-anchor="middle">no redo</text>
  <rect x="540" y="100" width="192" height="76" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.3" rx="4" opacity="0.1"/>
  <text x="636" y="130" fill="#8a8a8a" font-size="11.5" text-anchor="middle">UNDO</text>
  <text x="636" y="150" fill="#8a8a8a" font-size="11.5" text-anchor="middle">no redo</text>
  <text x="328" y="226" fill="#8a8a8a" font-size="11" text-anchor="end">no force</text>
  <rect x="340" y="184" width="192" height="76" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.3" rx="4" opacity="0.1"/>
  <text x="436" y="214" fill="#8a8a8a" font-size="11.5" text-anchor="middle">no undo</text>
  <text x="436" y="234" fill="#8a8a8a" font-size="11.5" text-anchor="middle">REDO</text>
  <rect x="540" y="184" width="192" height="76" fill="#e0645c" stroke="#e0645c" stroke-width="1.3" rx="4" opacity="0.22"/>
  <text x="636" y="214" fill="#e0645c" font-size="11.5" text-anchor="middle">UNDO</text>
  <text x="636" y="234" fill="#e0645c" font-size="11.5" text-anchor="middle">REDO</text>
  <text x="336" y="288" fill="#8a8a8a" font-size="10.5">Top left is the easy corner and the useless one: a commit that</text>
  <text x="336" y="304" fill="#8a8a8a" font-size="10.5">must flush every page it touched turns one logical write into many</text>
  <text x="336" y="320" fill="#8a8a8a" font-size="10.5">random disk writes, and a long transaction can never be evicted.</text>
  <text x="336" y="344" fill="#e0645c" font-size="10.5">Bottom right buys the performance and pays for it in 4.5, where</text>
  <text x="336" y="360" fill="#e0645c" font-size="10.5">the log has to carry both a before image and an after image of</text>
  <text x="336" y="376" fill="#e0645c" font-size="10.5">every change - one to undo it, one to redo it.</text>
</svg>
