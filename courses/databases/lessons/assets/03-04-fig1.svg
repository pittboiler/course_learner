<svg viewBox="0 0 790 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="22" fill="#8a8a8a" font-size="11.5" font-style="italic">Sorting 8 pages with 3 buffer frames. Pass 0 makes sorted runs; each later pass merges B-1 = 2 of them at a time.</text>
  <text x="24" y="62" fill="#8a8a8a" font-size="11" font-weight="bold">pass 0  -  read B pages, sort in memory, write a run</text>
  <rect x="150" y="74" width="78" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.15"/>
  <text x="163" y="92" fill="#4a90d9" font-size="10" text-anchor="middle">2</text>
  <text x="189" y="92" fill="#4a90d9" font-size="10" text-anchor="middle">7</text>
  <text x="215" y="92" fill="#4a90d9" font-size="10" text-anchor="middle">9</text>
  <text x="189" y="68" fill="#4a90d9" font-size="10" text-anchor="middle">run 1</text>
  <rect x="300" y="74" width="78" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.15"/>
  <text x="313" y="92" fill="#4a90d9" font-size="10" text-anchor="middle">1</text>
  <text x="339" y="92" fill="#4a90d9" font-size="10" text-anchor="middle">4</text>
  <text x="365" y="92" fill="#4a90d9" font-size="10" text-anchor="middle">8</text>
  <text x="339" y="68" fill="#4a90d9" font-size="10" text-anchor="middle">run 2</text>
  <rect x="450" y="74" width="52" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.15"/>
  <text x="463" y="92" fill="#4a90d9" font-size="10" text-anchor="middle">3</text>
  <text x="489" y="92" fill="#4a90d9" font-size="10" text-anchor="middle">6</text>
  <text x="476" y="68" fill="#4a90d9" font-size="10" text-anchor="middle">run 3</text>
  <text x="600" y="92" fill="#e0645c" font-size="11">3 runs</text>
  <text x="600" y="108" fill="#8a8a8a" font-size="10.5">16 I/Os</text>
  <text x="24" y="160" fill="#8a8a8a" font-size="11" font-weight="bold">merge pass 1  -  2-way merges (one frame is the output buffer)</text>
  <rect x="150" y="172" width="156" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.15"/>
  <text x="163" y="190" fill="#4a90d9" font-size="10" text-anchor="middle">1</text>
  <text x="189" y="190" fill="#4a90d9" font-size="10" text-anchor="middle">2</text>
  <text x="215" y="190" fill="#4a90d9" font-size="10" text-anchor="middle">4</text>
  <text x="241" y="190" fill="#4a90d9" font-size="10" text-anchor="middle">7</text>
  <text x="267" y="190" fill="#4a90d9" font-size="10" text-anchor="middle">8</text>
  <text x="293" y="190" fill="#4a90d9" font-size="10" text-anchor="middle">9</text>
  <text x="228" y="166" fill="#4a90d9" font-size="10" text-anchor="middle">merge runs 1 and 2</text>
  <rect x="450" y="172" width="52" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.15"/>
  <text x="463" y="190" fill="#4a90d9" font-size="10" text-anchor="middle">3</text>
  <text x="489" y="190" fill="#4a90d9" font-size="10" text-anchor="middle">6</text>
  <text x="476" y="166" fill="#4a90d9" font-size="10" text-anchor="middle">run 3 passes through</text>
  <text x="600" y="190" fill="#e0645c" font-size="11">2 runs</text>
  <text x="600" y="206" fill="#8a8a8a" font-size="10.5">16 I/Os</text>
  <line x1="300" y1="100" x2="300" y2="166" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="487" y1="100" x2="487" y2="166" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="24" y="258" fill="#8a8a8a" font-size="11" font-weight="bold">merge pass 2  -  merge the last two runs</text>
  <rect x="150" y="270" width="208" height="26" fill="#e0645c" stroke="#e0645c" stroke-width="1.2" rx="3" opacity="0.15"/>
  <text x="163" y="288" fill="#e0645c" font-size="10" text-anchor="middle">1</text>
  <text x="189" y="288" fill="#e0645c" font-size="10" text-anchor="middle">2</text>
  <text x="215" y="288" fill="#e0645c" font-size="10" text-anchor="middle">3</text>
  <text x="241" y="288" fill="#e0645c" font-size="10" text-anchor="middle">4</text>
  <text x="267" y="288" fill="#e0645c" font-size="10" text-anchor="middle">6</text>
  <text x="293" y="288" fill="#e0645c" font-size="10" text-anchor="middle">7</text>
  <text x="319" y="288" fill="#e0645c" font-size="10" text-anchor="middle">8</text>
  <text x="345" y="288" fill="#e0645c" font-size="10" text-anchor="middle">9</text>
  <text x="254" y="264" fill="#e0645c" font-size="10" text-anchor="middle">sorted</text>
  <text x="600" y="288" fill="#e0645c" font-size="11">1 run - done</text>
  <text x="600" y="304" fill="#8a8a8a" font-size="10.5">16 I/Os</text>
  <line x1="300" y1="198" x2="330" y2="264" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="487" y1="198" x2="400" y2="264" stroke="#8a8a8a" stroke-width="1.0"/>
  <rect x="24" y="336" width="742" height="78" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="5" opacity="0.09"/>
  <text x="36" y="358" fill="#4a90d9" font-size="10.5">Every pass reads all 8 pages and writes all 8, so a pass costs 2N regardless of how many runs it merges.</text>
  <text x="36" y="378" fill="#4a90d9" font-size="10.5">3 passes x 16 = 48 I/Os. The only lever is the NUMBER of passes, and it falls logarithmically in B:</text>
  <text x="36" y="400" fill="#e0645c" font-size="10.5">passes = 1 + ceil( log base (B-1) of ceil(N/B) ).   More memory buys fewer passes, never a cheaper pass.</text>
</svg>
