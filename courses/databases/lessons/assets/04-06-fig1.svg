<svg viewBox="0 0 790 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="22" fill="#8a8a8a" font-size="11.5" font-style="italic">CAP is not a choice among three. The partition happens to you; the only choice is what to do while it lasts.</text>
  <text x="24" y="58" fill="#4a90d9" font-size="11" font-weight="bold">a network partition, drawn honestly</text>
  <rect x="24" y="80" width="116" height="46" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="5" opacity="0.14"/>
  <text x="82" y="100" fill="#4a90d9" font-size="11" text-anchor="middle">replica A</text>
  <text x="82" y="118" fill="#8a8a8a" font-size="10" text-anchor="middle">seats = 1</text>
  <rect x="268" y="80" width="116" height="46" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="5" opacity="0.14"/>
  <text x="326" y="100" fill="#4a90d9" font-size="11" text-anchor="middle">replica B</text>
  <text x="326" y="118" fill="#8a8a8a" font-size="10" text-anchor="middle">seats = 1</text>
  <line x1="150" y1="103" x2="262" y2="103" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="206" y="96" fill="#e0645c" font-size="15" text-anchor="middle">X</text>
  <text x="206" y="142" fill="#e0645c" font-size="10" text-anchor="middle">link down</text>
  <text x="24" y="168" fill="#8a8a8a" font-size="10.5">a booking request arrives at replica A. It cannot reach B.</text>
  <rect x="24" y="184" width="176" height="98" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="4" opacity="0.12"/>
  <text x="34" y="204" fill="#4a90d9" font-size="11" font-weight="bold">choose C</text>
  <text x="34" y="222" fill="#8a8a8a" font-size="10">refuse the write until</text>
  <text x="34" y="238" fill="#8a8a8a" font-size="10">the link returns.</text>
  <text x="34" y="260" fill="#8a8a8a" font-size="10">Nobody sells a seat</text>
  <text x="34" y="276" fill="#e0645c" font-size="10">twice. Nobody sells.</text>
  <rect x="216" y="184" width="176" height="98" fill="#e0645c" stroke="#e0645c" stroke-width="1.2" rx="4" opacity="0.14"/>
  <text x="226" y="204" fill="#e0645c" font-size="11" font-weight="bold">choose A</text>
  <text x="226" y="222" fill="#8a8a8a" font-size="10">accept it, reconcile</text>
  <text x="226" y="238" fill="#8a8a8a" font-size="10">later.</text>
  <text x="226" y="260" fill="#8a8a8a" font-size="10">The sale completes.</text>
  <text x="226" y="276" fill="#e0645c" font-size="10">The seat may sell twice.</text>
  <text x="24" y="306" fill="#8a8a8a" font-size="10.5">The third option, 'choose P', does not exist - a partition is an event,</text>
  <text x="24" y="322" fill="#4a90d9" font-size="10.5">not a design decision. When there is NO partition you may have both.</text>
  <text x="430" y="58" fill="#4a90d9" font-size="11" font-weight="bold">quorums make the choice a dial (N = 3 replicas)</text>
  <text x="430" y="82" fill="#8a8a8a" font-size="10.5" font-weight="bold">W</text>
  <text x="470" y="82" fill="#8a8a8a" font-size="10.5" font-weight="bold">R</text>
  <text x="510" y="82" fill="#8a8a8a" font-size="10.5" font-weight="bold">R+W</text>
  <text x="558" y="82" fill="#8a8a8a" font-size="10.5" font-weight="bold">guarantee</text>
  <text x="644" y="82" fill="#8a8a8a" font-size="10.5" font-weight="bold">survives</text>
  <line x1="430" y1="87" x2="766" y2="87" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="430" y="112" fill="#8a8a8a" font-size="10.5">1</text>
  <text x="470" y="112" fill="#8a8a8a" font-size="10.5">1</text>
  <text x="510" y="112" fill="#8a8a8a" font-size="10.5">2</text>
  <text x="558" y="112" fill="#8a8a8a" font-size="10.5">eventual</text>
  <text x="644" y="112" fill="#8a8a8a" font-size="10.5">2 node failures</text>
  <text x="430" y="142" fill="#8a8a8a" font-size="10.5">2</text>
  <text x="470" y="142" fill="#8a8a8a" font-size="10.5">2</text>
  <text x="510" y="142" fill="#8a8a8a" font-size="10.5">4</text>
  <text x="558" y="142" fill="#e0645c" font-size="10.5" font-weight="bold">STRONG</text>
  <text x="644" y="142" fill="#8a8a8a" font-size="10.5">1 node failure</text>
  <text x="430" y="172" fill="#8a8a8a" font-size="10.5">3</text>
  <text x="470" y="172" fill="#8a8a8a" font-size="10.5">1</text>
  <text x="510" y="172" fill="#8a8a8a" font-size="10.5">4</text>
  <text x="558" y="172" fill="#e0645c" font-size="10.5" font-weight="bold">STRONG</text>
  <text x="644" y="172" fill="#8a8a8a" font-size="10.5">0 write failures</text>
  <text x="430" y="202" fill="#8a8a8a" font-size="10.5">1</text>
  <text x="470" y="202" fill="#8a8a8a" font-size="10.5">3</text>
  <text x="510" y="202" fill="#8a8a8a" font-size="10.5">4</text>
  <text x="558" y="202" fill="#e0645c" font-size="10.5" font-weight="bold">STRONG</text>
  <text x="644" y="202" fill="#8a8a8a" font-size="10.5">0 read failures</text>
  <text x="430" y="228" fill="#8a8a8a" font-size="10.5">A read quorum and a write quorum must OVERLAP for a</text>
  <text x="430" y="244" fill="#8a8a8a" font-size="10.5">read to be guaranteed to see the last write, and two sets</text>
  <text x="430" y="260" fill="#4a90d9" font-size="10.5">drawn from N overlap exactly when R + W &gt; N.</text>
  <text x="430" y="288" fill="#8a8a8a" font-size="10.5">So consistency is not on or off. It is a number you set,</text>
  <text x="430" y="304" fill="#8a8a8a" font-size="10.5">per operation, trading against how many machines may</text>
  <text x="430" y="320" fill="#8a8a8a" font-size="10.5">be down before you stop answering.</text>
  <rect x="24" y="344" width="742" height="76" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.1" rx="5" opacity="0.09"/>
  <text x="36" y="366" fill="#8a8a8a" font-size="10.5">What you actually give up when you shard: any query whose predicate is not the shard key must</text>
  <text x="36" y="384" fill="#8a8a8a" font-size="10.5">visit every shard, and any transaction spanning shards needs a distributed commit protocol.</text>
  <text x="36" y="404" fill="#e0645c" font-size="10.5">A join across shards has no good plan at all. That, not CAP, is what most teams hit first.</text>
</svg>
