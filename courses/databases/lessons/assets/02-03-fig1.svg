  <text x="486" y="258" fill="#4a90d9" font-size="10.5" text-anchor="middle">in</text>
  <rect x="538" y="238" width="88" height="30" fill="#e0645c" stroke="#e0645c" stroke-width="1.2" rx="3" opacity="0.26"/>
  <text x="582" y="258" fill="#e0645c" font-size="10.5" text-anchor="middle">in</text>
  <rect x="634" y="238" width="88" height="30" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.15"/>
  <text x="678" y="258" fill="#4a90d9" font-size="10.5" text-anchor="middle">in</text>
  <rect x="730" y="238" width="88" height="30" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.15"/>
  <text x="774" y="258" fill="#4a90d9" font-size="10.5" text-anchor="middle">in</text>
  <text x="24" y="296" fill="#8a8a8a" font-size="11">Nothing fires on a fourth pass, so the closure is complete and equals all seven attributes:</text>
  <text x="24" y="318" fill="#4a90d9" font-size="11">{flight, date, seat} is a superkey. Removing any one attribute stops the chain, so it is a key.</text>
  <text x="24" y="340" fill="#e0645c" font-size="10.5">Coral marks what each step added. The order of firing never changes the final set.</text>
</svg>
