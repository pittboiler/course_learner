  <text x="774" y="82" fill="#8a8a8a" font-size="10.5" text-anchor="middle">gate</text>
  <text x="24" y="118" fill="#8a8a8a" font-size="10.5">start</text>
  <rect x="154" y="100" width="88" height="30" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.15"/>
  <text x="198" y="120" fill="#4a90d9" font-size="10.5" text-anchor="middle">in</text>
