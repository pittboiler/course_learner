  <text x="390" y="120" fill="#4a90d9" font-size="10.5" text-anchor="middle">in</text>
  <rect x="442" y="100" width="88" height="30" fill="none" stroke="#8a8a8a" stroke-width="0.9" rx="3" stroke-dasharray="3 3"/>
  <rect x="538" y="100" width="88" height="30" fill="none" stroke="#8a8a8a" stroke-width="0.9" rx="3" stroke-dasharray="3 3"/>
