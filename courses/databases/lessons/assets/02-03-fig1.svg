<svg viewBox="0 0 790 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="22" fill="#8a8a8a" font-size="11.5" font-style="italic">Attribute closure. Start with the set, fire any dependency whose left side is inside it, repeat until nothing grows.</text>
