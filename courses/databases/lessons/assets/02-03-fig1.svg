  <rect x="634" y="146" width="88" height="30" fill="#e0645c" stroke="#e0645c" stroke-width="1.2" rx="3" opacity="0.26"/>
  <text x="678" y="166" fill="#e0645c" font-size="10.5" text-anchor="middle">in</text>
  <rect x="730" y="146" width="88" height="30" fill="#e0645c" stroke="#e0645c" stroke-width="1.2" rx="3" opacity="0.26"/>
  <text x="774" y="166" fill="#e0645c" font-size="10.5" text-anchor="middle">in</text>
  <text x="24" y="210" fill="#4a90d9" font-size="10.5">flight,date,seat -&gt; pid</text>
  <rect x="154" y="192" width="88" height="30" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.15"/>
  <text x="198" y="212" fill="#4a90d9" font-size="10.5" text-anchor="middle">in</text>
  <rect x="250" y="192" width="88" height="30" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.15"/>
  <text x="294" y="212" fill="#4a90d9" font-size="10.5" text-anchor="middle">in</text>
