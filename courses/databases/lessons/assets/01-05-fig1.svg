<svg viewBox="0 0 790 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="22" fill="#8a8a8a" font-size="11.5" font-style="italic">Evaluation order, not written order. Each clause hands rows to the next; only SELECT is evaluated near the end.</text>
  <rect x="24" y="56" width="300" height="30" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="4" opacity="0.15"/>
  <text x="34" y="76" fill="#4a90d9" font-size="11.5">FROM  publisher JOIN book</text>
  <text x="338" y="76" fill="#8a8a8a" font-size="11.5" font-weight="bold">5 rows</text>
  <text x="414" y="76" fill="#8a8a8a" font-size="10">one row per book</text>
  <line x1="174" y1="86" x2="174" y2="102" stroke="#8a8a8a" stroke-width="1.2"/>
  <rect x="24" y="102" width="300" height="30" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="4" opacity="0.15"/>
  <text x="34" y="122" fill="#4a90d9" font-size="11.5">WHERE b.year &gt;= 2021</text>
  <text x="338" y="122" fill="#8a8a8a" font-size="11.5" font-weight="bold">3 rows</text>
  <text x="414" y="122" fill="#8a8a8a" font-size="10">row filter - no aggregates allowed</text>
  <line x1="174" y1="132" x2="174" y2="148" stroke="#8a8a8a" stroke-width="1.2"/>
  <rect x="24" y="148" width="300" height="30" fill="#e0645c" stroke="#e0645c" stroke-width="1.3" rx="4" opacity="0.15"/>
  <text x="34" y="168" fill="#e0645c" font-size="11.5">GROUP BY p.pub_id, p.name</text>
  <text x="338" y="168" fill="#e0645c" font-size="11.5" font-weight="bold">2 groups</text>
  <text x="414" y="168" fill="#8a8a8a" font-size="10">Ravenwood {Nine Gates, Ember}, Holloway {The Long Field}</text>
  <line x1="174" y1="178" x2="174" y2="194" stroke="#8a8a8a" stroke-width="1.2"/>
  <rect x="24" y="194" width="300" height="30" fill="#e0645c" stroke="#e0645c" stroke-width="1.3" rx="4" opacity="0.15"/>
  <text x="34" y="214" fill="#e0645c" font-size="11.5">HAVING COUNT(*) &gt;= 2</text>
  <text x="338" y="214" fill="#e0645c" font-size="11.5" font-weight="bold">1 group</text>
  <text x="414" y="214" fill="#8a8a8a" font-size="10">group filter - aggregates required here</text>
  <line x1="174" y1="224" x2="174" y2="240" stroke="#8a8a8a" stroke-width="1.2"/>
  <rect x="24" y="240" width="300" height="30" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="4" opacity="0.15"/>
  <text x="34" y="260" fill="#4a90d9" font-size="11.5">SELECT p.name, COUNT(*), AVG(b.price)</text>
  <text x="338" y="260" fill="#8a8a8a" font-size="11.5" font-weight="bold">1 row</text>
  <text x="414" y="260" fill="#8a8a8a" font-size="10">aggregates computed per surviving group</text>
  <line x1="174" y1="270" x2="174" y2="286" stroke="#8a8a8a" stroke-width="1.2"/>
  <rect x="24" y="286" width="300" height="30" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.3" rx="4" opacity="0.15"/>
  <text x="34" y="306" fill="#8a8a8a" font-size="11.5">ORDER BY 2 DESC</text>
  <text x="338" y="306" fill="#8a8a8a" font-size="11.5" font-weight="bold">1 row</text>
  <text x="414" y="306" fill="#8a8a8a" font-size="10">the only clause that fixes an order</text>
  <text x="24" y="356" fill="#e0645c" font-size="11">The Ravenwood group has COUNT(*) = 2 but AVG(price) = 22, because Ember's price is NULL</text>
  <text x="24" y="374" fill="#e0645c" font-size="11">and AVG divides by the count of non-null values, not by the count of rows.</text>
</svg>
