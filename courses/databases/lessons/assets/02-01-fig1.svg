<svg viewBox="0 0 790 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="22" fill="#8a8a8a" font-size="11.5" font-style="italic">An ER diagram. Rectangles are entity sets, diamonds relationship sets, doubled outlines mark the weak entity and the relationship that identifies it.</text>
  <rect x="32" y="88" width="120" height="40" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" rx="3" opacity="0.15"/>
  <text x="92" y="112" fill="#4a90d9" font-size="11.5" text-anchor="middle">Passenger</text>
  <polygon points="268,86.0 320.0,108 268,130.0 216.0,108" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" opacity="0.15"/>
  <polygon points="268,86.0 320.0,108 268,130.0 216.0,108" fill="none" stroke="#e0645c" stroke-width="1.4"/>
  <text x="268" y="112" fill="#e0645c" font-size="10.5" text-anchor="middle">Books</text>
  <rect x="409" y="88" width="122" height="40" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" rx="3" opacity="0.15"/>
  <rect x="413" y="92" width="114" height="32" fill="none" stroke="#4a90d9" stroke-width="1.1" rx="2"/>
  <text x="470" y="112" fill="#4a90d9" font-size="11.5" text-anchor="middle">Departure</text>
  <polygon points="470,192.0 522.0,214 470,236.0 418.0,214" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" opacity="0.15"/>
  <polygon points="470,192.0 522.0,214 470,236.0 418.0,214" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="470,198.0 513.0,214 470,230.0 427.0,214" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="470" y="218" fill="#8a8a8a" font-size="10.5" text-anchor="middle">Instance of</text>
  <rect x="415" y="300" width="110" height="40" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" rx="3" opacity="0.15"/>
  <text x="470" y="324" fill="#4a90d9" font-size="11.5" text-anchor="middle">Flight</text>
  <rect x="37" y="300" width="110" height="40" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" rx="3" opacity="0.15"/>
  <text x="92" y="324" fill="#4a90d9" font-size="11.5" text-anchor="middle">Aircraft</text>
  <polygon points="268,298.0 320.0,320 268,342.0 216.0,320" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" opacity="0.15"/>
  <polygon points="268,298.0 320.0,320 268,342.0 216.0,320" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="268" y="324" fill="#8a8a8a" font-size="10.5" text-anchor="middle">Flown by</text>
  <polygon points="626,298.0 672.0,320 626,342.0 580.0,320" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" opacity="0.15"/>
  <polygon points="626,298.0 672.0,320 626,342.0 580.0,320" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="626" y="324" fill="#8a8a8a" font-size="10.5" text-anchor="middle">Departs</text>
  <rect x="691" y="300" width="94" height="40" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" rx="3" opacity="0.15"/>
  <text x="738" y="324" fill="#4a90d9" font-size="11.5" text-anchor="middle">Airport</text>
  <line x1="152" y1="108" x2="216" y2="108" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="184" y="100" fill="#8a8a8a" font-size="11" text-anchor="middle">M</text>
  <line x1="320" y1="108" x2="409" y2="108" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="364" y="100" fill="#8a8a8a" font-size="11" text-anchor="middle">N</text>
  <line x1="470" y1="128" x2="470" y2="192" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="484" y="158" fill="#8a8a8a" font-size="11" text-anchor="middle">1</text>
  <line x1="470" y1="236" x2="470" y2="300" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="484" y="268" fill="#8a8a8a" font-size="11" text-anchor="middle">N</text>
  <line x1="147" y1="320" x2="216" y2="320" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="182" y="312" fill="#8a8a8a" font-size="11" text-anchor="middle">1</text>
  <line x1="320" y1="320" x2="415" y2="320" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="368" y="312" fill="#8a8a8a" font-size="11" text-anchor="middle">N</text>
  <line x1="525" y1="320" x2="580" y2="320" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="552" y="312" fill="#8a8a8a" font-size="11" text-anchor="middle">N</text>
  <line x1="672" y1="320" x2="691" y2="320" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="682" y="312" fill="#8a8a8a" font-size="11" text-anchor="middle">1</text>
  <text x="268" y="148" fill="#e0645c" font-size="10" text-anchor="middle">attribute: seat</text>
  <rect x="24" y="356" width="360" height="66" fill="none" stroke="#8a8a8a" stroke-width="1.1" rx="4" stroke-dasharray="4 4"/>
  <text x="36" y="376" fill="#8a8a8a" font-size="10.5">Departure is WEAK: a date identifies nothing on its own.</text>
  <text x="36" y="392" fill="#8a8a8a" font-size="10.5">Its key is the owner Flight's flight_no plus its own</text>
  <text x="36" y="408" fill="#e0645c" font-size="10.5">discriminator date - the composite key (flight_no, date).</text>
  <rect x="404" y="356" width="362" height="66" fill="none" stroke="#8a8a8a" stroke-width="1.1" rx="4" stroke-dasharray="4 4"/>
  <text x="416" y="376" fill="#8a8a8a" font-size="10.5">Books is M:N, so it cannot fold into either side and</text>
  <text x="416" y="392" fill="#8a8a8a" font-size="10.5">becomes a table of its own carrying seat. The three N:1</text>
  <text x="416" y="408" fill="#4a90d9" font-size="10.5">relationships each fold into one foreign key. That is 2.2.</text>
</svg>
