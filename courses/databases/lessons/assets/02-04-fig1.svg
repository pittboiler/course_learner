<svg viewBox="0 0 790 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="22" fill="#8a8a8a" font-size="11.5" font-style="italic">The normal forms nest. Each ring adds one condition; a relation in an inner ring satisfies every outer one.</text>
  <rect x="24" y="52" width="742" height="322" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" rx="6" opacity="0.09"/>
  <text x="34" y="70" fill="#8a8a8a" font-size="12" font-weight="bold">1NF</text>
  <text x="76" y="70" fill="#8a8a8a" font-size="10.5">every value atomic</text>
  <rect x="66" y="92" width="658" height="242" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" rx="6" opacity="0.09"/>
  <text x="76" y="110" fill="#8a8a8a" font-size="12" font-weight="bold">2NF</text>
  <text x="118" y="110" fill="#8a8a8a" font-size="10.5">no non-prime attribute depends on PART of a key</text>
  <rect x="108" y="132" width="574" height="162" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" rx="6" opacity="0.09"/>
  <text x="118" y="150" fill="#4a90d9" font-size="12" font-weight="bold">3NF</text>
  <text x="160" y="150" fill="#4a90d9" font-size="10.5">for every X -&gt; A: X is a superkey, OR A is prime</text>
  <rect x="150" y="172" width="490" height="82" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" rx="6" opacity="0.09"/>
  <text x="160" y="190" fill="#e0645c" font-size="12" font-weight="bold">BCNF</text>
  <text x="202" y="190" fill="#e0645c" font-size="10.5">for every X -&gt; A: X is a superkey. No exceptions.</text>
  <text x="174" y="214" fill="#e0645c" font-size="10.5">R(flight,date,seat,pid,pname,aircraft,gate)</text>
  <text x="174" y="230" fill="#e0645c" font-size="10.5">sits HERE - in 1NF only</text>
  <line x1="168" y1="210" x2="140" y2="150" stroke="#e0645c" stroke-width="1.1" stroke-dasharray="3 3"/>
  <text x="560" y="130" fill="#4a90d9" font-size="10.5">R(A,B,C,D,E) of 2.3 Ex 2</text>
  <text x="560" y="146" fill="#4a90d9" font-size="10.5">sits here: 3NF, not BCNF,</text>
  <text x="560" y="162" fill="#4a90d9" font-size="10.5">because every attribute is prime</text>
  <text x="24" y="356" fill="#8a8a8a" font-size="11">The gap between 3NF and BCNF is exactly the prime-attribute escape clause. It is narrow, it is</text>
  <text x="24" y="376" fill="#8a8a8a" font-size="11">deliberate, and 2.5 shows what it buys: 3NF is always reachable without losing a dependency;</text>
  <text x="24" y="396" fill="#e0645c" font-size="11">BCNF is not.</text>
</svg>
