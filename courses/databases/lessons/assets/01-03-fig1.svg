<svg viewBox="0 0 790 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="22" fill="#8a8a8a" font-size="11.5" font-style="italic">Three-valued logic. WHERE keeps a row only when the predicate evaluates to true - unknown is discarded, exactly like false.</text>
  <text x="24" y="64" fill="#4a90d9" font-size="12" font-weight="bold">p AND q</text>
  <text x="93" y="90" fill="#8a8a8a" font-size="11" text-anchor="middle">T</text>
  <text x="139" y="90" fill="#8a8a8a" font-size="11" text-anchor="middle">F</text>
  <text x="185" y="90" fill="#8a8a8a" font-size="11" text-anchor="middle">U</text>
  <text x="47" y="136" fill="#8a8a8a" font-size="11" text-anchor="middle">T</text>
  <rect x="70" y="120" width="46" height="40" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.0" rx="3" opacity="0.15"/>
  <text x="93" y="137" fill="#4a90d9" font-size="12" text-anchor="middle">T</text>
  <rect x="116" y="120" width="46" height="40" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.0" rx="3" opacity="0.15"/>
  <text x="139" y="137" fill="#8a8a8a" font-size="12" text-anchor="middle">F</text>
