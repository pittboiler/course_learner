  <text x="169" y="89" fill="#8a8a8a" font-size="10.5" text-anchor="middle">50</text>
  <text x="199" y="89" fill="#8a8a8a" font-size="10.5" text-anchor="middle">63</text>
  <rect x="24" y="140" width="68" height="24" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.3" rx="3" opacity="0.15"/>
  <text x="43" y="157" fill="#8a8a8a" font-size="10.5" text-anchor="middle">12</text>
  <text x="73" y="157" fill="#8a8a8a" font-size="10.5" text-anchor="middle">25</text>
  <line x1="169" y1="96" x2="58" y2="140" stroke="#8a8a8a" stroke-width="1.0"/>
  <rect x="116" y="140" width="68" height="24" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.3" rx="3" opacity="0.15"/>
  <text x="135" y="157" fill="#8a8a8a" font-size="10.5" text-anchor="middle">31</text>
  <text x="165" y="157" fill="#8a8a8a" font-size="10.5" text-anchor="middle">44</text>
  <line x1="169" y1="96" x2="150" y2="140" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="110" y1="152" x2="116" y2="152" stroke="#8a8a8a" stroke-width="1.0"/>
  <rect x="208" y="140" width="68" height="24" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.3" rx="3" opacity="0.15"/>
  <text x="227" y="157" fill="#8a8a8a" font-size="10.5" text-anchor="middle">50</text>
  <text x="257" y="157" fill="#8a8a8a" font-size="10.5" text-anchor="middle">58</text>
  <line x1="169" y1="96" x2="242" y2="140" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="202" y1="152" x2="208" y2="152" stroke="#8a8a8a" stroke-width="1.0"/>
  <rect x="300" y="140" width="98" height="24" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.3" rx="3" opacity="0.15"/>
  <text x="319" y="157" fill="#8a8a8a" font-size="10.5" text-anchor="middle">63</text>
  <text x="349" y="157" fill="#8a8a8a" font-size="10.5" text-anchor="middle">70</text>
  <text x="379" y="157" fill="#8a8a8a" font-size="10.5" text-anchor="middle">77</text>
  <line x1="169" y1="96" x2="349" y2="140" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="294" y1="152" x2="300" y2="152" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="24" y="190" fill="#e0645c" font-size="10.5">the rightmost leaf is full (3 keys is the limit)</text>
  <text x="430" y="58" fill="#4a90d9" font-size="11.5" font-weight="bold">after inserting 85: 3 levels</text>
  <rect x="600" y="72" width="38" height="24" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.15"/>
  <text x="619" y="89" fill="#4a90d9" font-size="10.5" text-anchor="middle">63</text>
  <rect x="470" y="132" width="68" height="24" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.15"/>
  <text x="489" y="149" fill="#4a90d9" font-size="10.5" text-anchor="middle">31</text>
  <text x="519" y="149" fill="#4a90d9" font-size="10.5" text-anchor="middle">50</text>
  <rect x="660" y="132" width="38" height="24" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.15"/>
  <text x="679" y="149" fill="#4a90d9" font-size="10.5" text-anchor="middle">77</text>
  <line x1="619" y1="96" x2="504" y2="132" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="619" y1="96" x2="679" y2="132" stroke="#8a8a8a" stroke-width="1.0"/>
  <rect x="412" y="196" width="68" height="24" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.15"/>
  <text x="431" y="213" fill="#4a90d9" font-size="10.5" text-anchor="middle">12</text>
  <text x="461" y="213" fill="#4a90d9" font-size="10.5" text-anchor="middle">25</text>
  <line x1="504" y1="156" x2="446" y2="196" stroke="#8a8a8a" stroke-width="1.0"/>
  <rect x="484" y="196" width="68" height="24" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.15"/>
  <text x="503" y="213" fill="#4a90d9" font-size="10.5" text-anchor="middle">31</text>
  <text x="533" y="213" fill="#4a90d9" font-size="10.5" text-anchor="middle">44</text>
  <line x1="504" y1="156" x2="518" y2="196" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="478" y1="208" x2="484" y2="208" stroke="#e0645c" stroke-width="1.4"/>
  <rect x="556" y="196" width="68" height="24" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.15"/>
  <text x="575" y="213" fill="#4a90d9" font-size="10.5" text-anchor="middle">50</text>
  <text x="605" y="213" fill="#4a90d9" font-size="10.5" text-anchor="middle">58</text>
  <line x1="504" y1="156" x2="590" y2="196" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="550" y1="208" x2="556" y2="208" stroke="#e0645c" stroke-width="1.4"/>
  <rect x="628" y="196" width="68" height="24" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.15"/>
  <text x="647" y="213" fill="#4a90d9" font-size="10.5" text-anchor="middle">63</text>
  <text x="677" y="213" fill="#4a90d9" font-size="10.5" text-anchor="middle">70</text>
  <line x1="679" y1="156" x2="662" y2="196" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="622" y1="208" x2="628" y2="208" stroke="#e0645c" stroke-width="1.4"/>
  <rect x="700" y="196" width="68" height="24" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.15"/>
  <text x="719" y="213" fill="#4a90d9" font-size="10.5" text-anchor="middle">77</text>
  <text x="749" y="213" fill="#4a90d9" font-size="10.5" text-anchor="middle">85</text>
  <line x1="679" y1="156" x2="734" y2="196" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="694" y1="208" x2="700" y2="208" stroke="#e0645c" stroke-width="1.4"/>
  <text x="412" y="246" fill="#e0645c" font-size="10.5">coral links chain the leaves in key order:</text>
  <text x="412" y="262" fill="#e0645c" font-size="10.5">a range scan descends once, then walks sideways.</text>
  <rect x="24" y="288" width="742" height="130" fill="none" stroke="#8a8a8a" stroke-width="1.1" rx="5" stroke-dasharray="4 4"/>
  <text x="36" y="310" fill="#8a8a8a" font-size="11" font-weight="bold">Three properties, each earning its place:</text>
  <text x="36" y="332" fill="#8a8a8a" font-size="10.5">1. Every value lives in a LEAF. Internal nodes hold separator keys only, so they are pure routing</text>
  <text x="36" y="348" fill="#8a8a8a" font-size="10.5">   and pack more keys per page - which is what keeps the height at 3 or 4 for millions of rows.</text>
  <text x="36" y="368" fill="#8a8a8a" font-size="10.5">2. Leaves are CHAINED. A range scan pays the descent once and then reads sequentially.</text>
  <text x="36" y="388" fill="#8a8a8a" font-size="10.5">3. Growth is at the ROOT, never the leaves. Splits push upward, so every leaf stays at the same</text>
  <text x="36" y="404" fill="#8a8a8a" font-size="10.5">   depth and every lookup costs exactly the height - no rebalancing, no worst case.</text>
</svg>
