<svg viewBox="0 0 790 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="22" fill="#8a8a8a" font-size="11.5" font-style="italic">Inserting 85 overflows a full leaf; the split pushes 77 up into a full root, which splits in turn and adds a level.</text>
  <text x="24" y="58" fill="#8a8a8a" font-size="11.5" font-weight="bold">before: 2 levels</text>
