<svg viewBox="0 0 790 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="20" y="22" fill="#8a8a8a" font-size="11.5" font-style="italic">Hash join partitions both inputs on the same function, so only matching partitions can join - then each pair fits in memory.</text>
  <text x="24" y="60" fill="#4a90d9" font-size="11" font-weight="bold">phase 1: partition both inputs with h1</text>
  <rect x="24" y="74" width="84" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.15"/>
  <text x="66" y="92" fill="#4a90d9" font-size="10.5" text-anchor="middle">booking</text>
  <rect x="24" y="108" width="84" height="26" fill="#e0645c" stroke="#e0645c" stroke-width="1.2" rx="3" opacity="0.15"/>
  <text x="66" y="126" fill="#e0645c" font-size="10.5" text-anchor="middle">passenger</text>
  <rect x="160" y="76" width="52" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.1" rx="3" opacity="0.13"/>
  <text x="186" y="94" fill="#4a90d9" font-size="10" text-anchor="middle">B0</text>
  <rect x="220" y="76" width="52" height="26" fill="#e0645c" stroke="#e0645c" stroke-width="1.1" rx="3" opacity="0.13"/>
  <text x="246" y="94" fill="#e0645c" font-size="10" text-anchor="middle">P0</text>
  <line x1="112" y1="90" x2="156" y2="89" stroke="#8a8a8a" stroke-width="0.9"/>
  <line x1="112" y1="122" x2="216" y2="89" stroke="#8a8a8a" stroke-width="0.9"/>
  <rect x="160" y="110" width="52" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.1" rx="3" opacity="0.13"/>
  <text x="186" y="128" fill="#4a90d9" font-size="10" text-anchor="middle">B1</text>
  <rect x="220" y="110" width="52" height="26" fill="#e0645c" stroke="#e0645c" stroke-width="1.1" rx="3" opacity="0.13"/>
  <text x="246" y="128" fill="#e0645c" font-size="10" text-anchor="middle">P1</text>
  <line x1="112" y1="90" x2="156" y2="123" stroke="#8a8a8a" stroke-width="0.9"/>
  <line x1="112" y1="122" x2="216" y2="123" stroke="#8a8a8a" stroke-width="0.9"/>
  <rect x="160" y="144" width="52" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.1" rx="3" opacity="0.13"/>
  <text x="186" y="162" fill="#4a90d9" font-size="10" text-anchor="middle">B2</text>
  <rect x="220" y="144" width="52" height="26" fill="#e0645c" stroke="#e0645c" stroke-width="1.1" rx="3" opacity="0.13"/>
  <text x="246" y="162" fill="#e0645c" font-size="10" text-anchor="middle">P2</text>
  <line x1="112" y1="90" x2="156" y2="157" stroke="#8a8a8a" stroke-width="0.9"/>
  <line x1="112" y1="122" x2="216" y2="157" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="160" y="194" fill="#8a8a8a" font-size="10">same h1 both sides, so a booking</text>
  <text x="160" y="210" fill="#8a8a8a" font-size="10">and its passenger land in the SAME</text>
  <text x="160" y="226" fill="#e0645c" font-size="10">numbered pair - no other pair can match.</text>
  <text x="24" y="258" fill="#4a90d9" font-size="11" font-weight="bold">phase 2: for each k, build a hash table on Pk with h2, probe with Bk</text>
  <text x="24" y="278" fill="#8a8a8a" font-size="10.5">Each partition is about 1/(B-1) of its input, so it fits in memory.</text>
  <text x="24" y="296" fill="#8a8a8a" font-size="10.5">Cost: read both (M+N), write both partitions (M+N), read both back (M+N)  =  3(M+N).</text>
  <text x="24" y="316" fill="#e0645c" font-size="10.5">Nothing is ever read three times, and nothing is sorted.</text>
  <text x="430" y="60" fill="#4a90d9" font-size="11" font-weight="bold">cost of joining them, B = 502 frames</text>
  <text x="430" y="95" fill="#8a8a8a" font-size="10">hash join</text>
  <rect x="590" y="82" width="78.75" height="17" fill="#e0645c" stroke="#e0645c" stroke-width="1.0" rx="2" opacity="0.3"/>
  <text x="674.75" y="95" fill="#e0645c" font-size="9.5">157,500</text>
  <text x="430" y="135" fill="#8a8a8a" font-size="10">index NL, clustered</text>
  <rect x="590" y="122" width="101.25" height="17" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.0" rx="2" opacity="0.3"/>
  <text x="697.25" y="135" fill="#4a90d9" font-size="9.5">202,500</text>
  <text x="430" y="175" fill="#8a8a8a" font-size="10">block NL</text>
  <rect x="590" y="162" width="126.25" height="17" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.0" rx="2" opacity="0.3"/>
  <text x="722.25" y="175" fill="#4a90d9" font-size="9.5">252,500</text>
  <text x="430" y="215" fill="#8a8a8a" font-size="10">sort-merge</text>
  <rect x="590" y="202" width="131.25" height="17" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.0" rx="2" opacity="0.3"/>
  <text x="727.25" y="215" fill="#4a90d9" font-size="9.5">262,500</text>
  <text x="430" y="255" fill="#8a8a8a" font-size="10">index NL, unclustered</text>
  <rect x="590" y="242" width="150" height="17" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.0" rx="2" opacity="0.3"/>
  <text x="596" y="255" fill="#8a8a8a" font-size="9.5">2,152,500</text>
  <text x="430" y="296" fill="#8a8a8a" font-size="10.5">The spread is a factor of 14 across plans that all</text>
  <text x="430" y="312" fill="#8a8a8a" font-size="10.5">return exactly the same rows.</text>
  <text x="430" y="336" fill="#4a90d9" font-size="10.5">And if BOTH inputs arrive already sorted on the join</text>
  <text x="430" y="352" fill="#4a90d9" font-size="10.5">key, sort-merge collapses to the merge alone:</text>
  <text x="430" y="372" fill="#e0645c" font-size="11">52,500 I/Os - a third of the hash join.</text>
  <text x="430" y="396" fill="#8a8a8a" font-size="10.5">That is why 3.7 tracks which orders a plan produces.</text>
</svg>
