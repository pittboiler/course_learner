<svg viewBox="0 0 790 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker></defs>
  <defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0645c"/></marker></defs>
  <text x="20" y="22" fill="#8a8a8a" font-size="11.5" font-style="italic">Four relation schemas. Underline = primary key, dashed arrow = foreign key pointing at the key it must match.</text>
  <rect x="30" y="48" width="190" height="86" fill="none" stroke="#4a90d9" stroke-width="1.5" rx="4"/>
  <rect x="30" y="48" width="190" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.0" opacity="0.16"/>
  <text x="40" y="66" fill="#4a90d9" font-size="12.5" font-weight="bold">publisher</text>
  <text x="44" y="88" fill="#4a90d9" font-size="11">pub_id</text>
  <line x1="44" y1="91" x2="77.022" y2="91" stroke="#4a90d9" stroke-width="1.1"/>
  <text x="44" y="108" fill="#8a8a8a" font-size="11">name</text>
  <text x="44" y="128" fill="#8a8a8a" font-size="11">city</text>
  <rect x="300" y="48" width="190" height="126" fill="none" stroke="#4a90d9" stroke-width="1.5" rx="4"/>
  <rect x="300" y="48" width="190" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.0" opacity="0.16"/>
  <text x="310" y="66" fill="#4a90d9" font-size="12.5" font-weight="bold">book</text>
  <text x="314" y="88" fill="#4a90d9" font-size="11">isbn</text>
  <line x1="314" y1="91" x2="334.174" y2="91" stroke="#4a90d9" stroke-width="1.1"/>
  <text x="314" y="108" fill="#8a8a8a" font-size="11">title</text>
  <text x="314" y="128" fill="#e0645c" font-size="11">pub_id</text>
  <text x="314" y="148" fill="#8a8a8a" font-size="11">year</text>
  <text x="314" y="168" fill="#8a8a8a" font-size="11">price</text>
  <rect x="30" y="210" width="190" height="106" fill="none" stroke="#4a90d9" stroke-width="1.5" rx="4"/>
  <rect x="30" y="210" width="190" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.0" opacity="0.16"/>
  <text x="40" y="228" fill="#4a90d9" font-size="12.5" font-weight="bold">member</text>
  <text x="44" y="250" fill="#4a90d9" font-size="11">mid</text>
  <line x1="44" y1="253" x2="61.721" y2="253" stroke="#4a90d9" stroke-width="1.1"/>
  <text x="44" y="270" fill="#8a8a8a" font-size="11">name</text>
  <text x="44" y="290" fill="#8a8a8a" font-size="11">city</text>
  <text x="44" y="310" fill="#8a8a8a" font-size="11">joined</text>
  <rect x="300" y="210" width="190" height="106" fill="none" stroke="#4a90d9" stroke-width="1.5" rx="4"/>
  <rect x="300" y="210" width="190" height="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.0" opacity="0.16"/>
  <text x="310" y="228" fill="#4a90d9" font-size="12.5" font-weight="bold">loan</text>
  <text x="314" y="250" fill="#e0645c" font-size="11">mid</text>
  <line x1="314" y1="253" x2="331.721" y2="253" stroke="#e0645c" stroke-width="1.1"/>
  <text x="314" y="270" fill="#e0645c" font-size="11">isbn</text>
  <line x1="314" y1="273" x2="334.174" y2="273" stroke="#e0645c" stroke-width="1.1"/>
  <text x="314" y="290" fill="#4a90d9" font-size="11">taken</text>
  <line x1="314" y1="293" x2="340.906" y2="293" stroke="#4a90d9" stroke-width="1.1"/>
  <text x="314" y="310" fill="#8a8a8a" font-size="11">returned</text>
  <path d="M 300 116 C 265 116 258 62 224 62" fill="none" stroke="#e0645c" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="230" y1="62" x2="224" y2="62" stroke="#e0645c" stroke-width="1.4" marker-end="url(#ar2)"/>
  <path d="M 300 250 C 268 250 258 224 224 224" fill="none" stroke="#e0645c" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="230" y1="224" x2="224" y2="224" stroke="#e0645c" stroke-width="1.4" marker-end="url(#ar2)"/>
  <path d="M 495 244 C 560 244 560 110 512 88" fill="none" stroke="#e0645c" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="518" y1="92" x2="512" y2="88" stroke="#e0645c" stroke-width="1.4" marker-end="url(#ar2)"/>
  <text x="300" y="340" fill="#8a8a8a" font-size="10.5">loan has no single-attribute key: a member may borrow the same book twice,</text>
  <text x="300" y="356" fill="#8a8a8a" font-size="10.5">so the key is the triple (mid, isbn, taken) - all three underlined together.</text>
  <text x="300" y="378" fill="#8a8a8a" font-size="10.5">Every foreign-key value must appear as a key value in the table it points at,</text>
  <text x="300" y="394" fill="#8a8a8a" font-size="10.5">or be NULL. That rule is referential integrity.</text>
  <text x="30" y="340" fill="#8a8a8a" font-size="11" font-weight="bold">schema = the shape</text>
  <text x="30" y="356" fill="#8a8a8a" font-size="10.5">(names, domains, keys)</text>
  <text x="30" y="378" fill="#8a8a8a" font-size="11" font-weight="bold">instance = today's rows</text>
  <text x="30" y="394" fill="#8a8a8a" font-size="10.5">(changes every second)</text>
</svg>
