<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">One carbon, three ways to mix its orbitals: more s-character &#8594; fewer bonds, wider angles, and &#960; bonds appear.</text>

  <!-- ============ Panel 1: sp3 tetrahedral CH4 ============ -->
  <text x="120" y="58" fill="#8a8a8a" font-size="16" font-weight="bold" text-anchor="middle">sp&#179; &#183; tetrahedral</text>
  <text x="120" y="76" fill="#8a8a8a" text-anchor="middle" font-style="italic">4 domains &#183; 109.5&#176;</text>

  <!-- sigma bonds (blue) -->
  <line x1="120" y1="185" x2="120" y2="120" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="120" y1="185" x2="72" y2="225" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- wedge bond (coming forward) -->
  <polygon points="120,185 166,220 172,214" fill="#4a90d9"/>
  <!-- dashed bond (going back) -->
  <line x1="120" y1="185" x2="150" y2="152" stroke="#4a90d9" stroke-width="2.5" stroke-dasharray="3 3"/>

  <!-- atoms -->
  <circle cx="120" cy="185" r="12" fill="#8a8a8a"/>
  <text x="120" y="190" fill="#2b2b2b" text-anchor="middle" font-weight="bold">C</text>
  <text x="120" y="113" fill="#8a8a8a" text-anchor="middle">H</text>
  <text x="64" y="234" fill="#8a8a8a" text-anchor="middle">H</text>
  <text x="176" y="228" fill="#8a8a8a" text-anchor="middle">H</text>
  <text x="158" y="148" fill="#8a8a8a" text-anchor="middle">H</text>
  <!-- angle label -->
  <text x="93" y="168" fill="#e0645c" font-size="12">109.5&#176;</text>

  <text x="120" y="278" fill="#8a8a8a" text-anchor="middle" font-style="italic">CH&#8324; &#8212; all single (&#963;)</text>

  <!-- ============ Panel 2: sp2 trigonal planar ethene ============ -->
  <text x="360" y="58" fill="#8a8a8a" font-size="16" font-weight="bold" text-anchor="middle">sp&#178; &#183; trigonal planar</text>
  <text x="360" y="76" fill="#8a8a8a" text-anchor="middle" font-style="italic">3 domains &#183; 120&#176;</text>

  <!-- pi cloud (coral) above and below the C=C -->
  <ellipse cx="360" cy="164" rx="42" ry="16" fill="#e0645c" opacity="0.22"/>
  <ellipse cx="360" cy="206" rx="42" ry="16" fill="#e0645c" opacity="0.22"/>
  <text x="410" y="150" fill="#e0645c" font-size="12">&#960;</text>

  <!-- sigma framework (blue) -->
  <!-- C=C sigma -->
  <line x1="338" y1="185" x2="382" y2="185" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- C-H sigma bonds, left C -->
  <line x1="338" y1="185" x2="300" y2="160" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="338" y1="185" x2="300" y2="210" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- C-H sigma bonds, right C -->
  <line x1="382" y1="185" x2="420" y2="160" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="382" y1="185" x2="420" y2="210" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- atoms -->
  <circle cx="338" cy="185" r="11" fill="#8a8a8a"/>
  <text x="338" y="190" fill="#2b2b2b" text-anchor="middle" font-weight="bold" font-size="12">C</text>
  <circle cx="382" cy="185" r="11" fill="#8a8a8a"/>
  <text x="382" y="190" fill="#2b2b2b" text-anchor="middle" font-weight="bold" font-size="12">C</text>
  <text x="292" y="156" fill="#8a8a8a" text-anchor="middle">H</text>
  <text x="292" y="220" fill="#8a8a8a" text-anchor="middle">H</text>
  <text x="428" y="156" fill="#8a8a8a" text-anchor="middle">H</text>
  <text x="428" y="220" fill="#8a8a8a" text-anchor="middle">H</text>
  <!-- angle label -->
  <text x="332" y="238" fill="#e0645c" font-size="12">120&#176;</text>

  <text x="360" y="278" fill="#8a8a8a" text-anchor="middle" font-style="italic">CH&#8322;=CH&#8322; &#8212; 1&#963; + 1&#960;</text>

  <!-- ============ Panel 3: sp linear ethyne ============ -->
  <text x="600" y="58" fill="#8a8a8a" font-size="16" font-weight="bold" text-anchor="middle">sp &#183; linear</text>
  <text x="600" y="76" fill="#8a8a8a" text-anchor="middle" font-style="italic">2 domains &#183; 180&#176;</text>

  <!-- two pi clouds (coral): one vertical, one horizontal (orthogonal) -->
  <ellipse cx="600" cy="165" rx="30" ry="12" fill="#e0645c" opacity="0.22"/>
  <ellipse cx="600" cy="205" rx="30" ry="12" fill="#e0645c" opacity="0.22"/>
  <ellipse cx="600" cy="185" rx="30" ry="9" fill="#e0645c" opacity="0.30"/>
  <text x="636" y="152" fill="#e0645c" font-size="12">2&#960;</text>

  <!-- sigma framework (blue), all on one line -->
  <line x1="536" y1="185" x2="580" y2="185" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="580" y1="185" x2="620" y2="185" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="620" y1="185" x2="664" y2="185" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- atoms -->
  <text x="528" y="190" fill="#8a8a8a" text-anchor="middle">H</text>
  <circle cx="580" cy="185" r="11" fill="#8a8a8a"/>
  <text x="580" y="190" fill="#2b2b2b" text-anchor="middle" font-weight="bold" font-size="12">C</text>
  <circle cx="620" cy="185" r="11" fill="#8a8a8a"/>
  <text x="620" y="190" fill="#2b2b2b" text-anchor="middle" font-weight="bold" font-size="12">C</text>
  <text x="672" y="190" fill="#8a8a8a" text-anchor="middle">H</text>
  <!-- angle label -->
  <text x="600" y="238" fill="#e0645c" font-size="12" text-anchor="middle">180&#176;</text>

  <text x="600" y="278" fill="#8a8a8a" text-anchor="middle" font-style="italic">CH&#8801;CH &#8212; 1&#963; + 2&#960;</text>

  <!-- s-character arrow across the bottom -->
  <line x1="90" y1="308" x2="640" y2="308" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="640,308 630,303 630,313" fill="#8a8a8a"/>
  <text x="365" y="328" fill="#8a8a8a" text-anchor="middle" font-style="italic">increasing s-character &#8594; shorter, stronger bonds</text>
</svg>
