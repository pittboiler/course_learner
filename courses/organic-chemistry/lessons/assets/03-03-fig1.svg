<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Nu&#8315; hits the &#948;+ carbonyl carbon; the &#960; electrons fold onto O &#8594; tetrahedral alkoxide &#8594; protonate to an alcohol.</text>

  <!-- ============ Species A: carbonyl + nucleophile attack (center x=150) ============ -->
  <!-- C=O double bond -->
  <line x1="144" y1="138" x2="144" y2="110" stroke="#4a90d9" stroke-width="2"/>
  <line x1="156" y1="138" x2="156" y2="110" stroke="#4a90d9" stroke-width="2"/>
  <text x="144" y="106" fill="#4a90d9" text-anchor="middle">O</text>
  <text x="150" y="156" fill="#4a90d9" text-anchor="middle">C</text>
  <!-- R and R' groups -->
  <line x1="141" y1="160" x2="112" y2="186" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="102" y="196" fill="#8a8a8a">R</text>
  <line x1="159" y1="160" x2="188" y2="186" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="192" y="196" fill="#8a8a8a">R&#8242;</text>
  <!-- partial charges -->
  <text x="170" y="106" fill="#e0645c">&#948;&#8722;</text>
  <text x="168" y="160" fill="#e0645c">&#948;+</text>
  <!-- nucleophile -->
  <text x="42" y="154" fill="#e0645c">Nu&#8315;</text>
  <!-- curved arrow: Nu -> carbonyl carbon -->
  <path d="M 78 152 Q 104 176 132 158" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="132,158 124,155 129,164" fill="#e0645c"/>
  <!-- curved arrow: pi electrons -> O -->
  <path d="M 160 128 Q 176 114 160 102" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="160,102 166,109 154,108" fill="#e0645c"/>

  <!-- reaction arrow A -> B -->
  <line x1="238" y1="150" x2="288" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="288,150 278,146 278,154" fill="#8a8a8a"/>

  <!-- ============ Species B: tetrahedral alkoxide (center x=390) ============ -->
  <line x1="390" y1="138" x2="390" y2="110" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="390" y="106" fill="#4a90d9" text-anchor="middle">O&#8315;</text>
  <text x="390" y="156" fill="#8a8a8a" text-anchor="middle">C</text>
  <!-- Nu now bonded -->
  <line x1="381" y1="145" x2="356" y2="126" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="338" y="124" fill="#e0645c">Nu</text>
  <!-- R and R' -->
  <line x1="381" y1="160" x2="354" y2="186" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="344" y="196" fill="#8a8a8a">R</text>
  <line x1="399" y1="160" x2="426" y2="186" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="430" y="196" fill="#8a8a8a">R&#8242;</text>
  <text x="390" y="222" fill="#8a8a8a" font-style="italic" text-anchor="middle" font-size="12">tetrahedral alkoxide</text>

  <!-- reaction arrow B -> C, with H3O+ -->
  <line x1="470" y1="150" x2="520" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="520,150 510,146 510,154" fill="#8a8a8a"/>
  <text x="495" y="142" fill="#8a8a8a" text-anchor="middle" font-size="12">H&#8323;O&#8314;</text>

  <!-- ============ Species C: alcohol (center x=610) ============ -->
  <line x1="610" y1="138" x2="610" y2="110" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="610" y="106" fill="#4a90d9" text-anchor="middle">OH</text>
  <text x="610" y="156" fill="#4a90d9" text-anchor="middle">C</text>
  <line x1="601" y1="145" x2="576" y2="126" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="558" y="124" fill="#e0645c">Nu</text>
  <line x1="601" y1="160" x2="574" y2="186" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="564" y="196" fill="#8a8a8a">R</text>
  <line x1="619" y1="160" x2="646" y2="186" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="650" y="196" fill="#8a8a8a">R&#8242;</text>
  <text x="610" y="222" fill="#8a8a8a" font-style="italic" text-anchor="middle" font-size="12">alcohol</text>

  <!-- ============ reactivity note ============ -->
  <line x1="60" y1="256" x2="660" y2="256" stroke="#8a8a8a" stroke-width="0.75" stroke-dasharray="2 4"/>
  <text x="60" y="282" fill="#8a8a8a">Reactivity:</text>
  <text x="150" y="282" fill="#4a90d9">aldehyde (R&#8242; = H)</text>
  <text x="290" y="282" fill="#8a8a8a">&#62;</text>
  <text x="310" y="282" fill="#8a8a8a">ketone (R&#8242; = alkyl)</text>
  <text x="60" y="302" fill="#8a8a8a" font-size="12">the aldehyde carbon is less crowded and less electron-fed, so it is the better electrophile.</text>
</svg>
