<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Rank the four groups 1&#8211;4, point 4 away, trace 1&#8594;2&#8594;3: clockwise = R. The mirror image reverses it to S.</text>

  <!-- mirror plane -->
  <line x1="320" y1="72" x2="320" y2="250" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 5"/>
  <text x="320" y="66" fill="#8a8a8a" font-style="italic" font-size="12" text-anchor="middle">mirror</text>

  <!-- ================= LEFT molecule (R) ================= -->
  <!-- bonds -->
  <line x1="180" y1="160" x2="180" y2="112" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="180" y1="160" x2="226" y2="186" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="180" y1="160" x2="134" y2="186" stroke="#8a8a8a" stroke-width="2"/>
  <!-- dashed wedge to H (points away) -->
  <line x1="176" y1="170" x2="184" y2="170" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="175" y1="178" x2="185" y2="178" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="174" y1="186" x2="186" y2="186" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="172" y1="194" x2="188" y2="194" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="171" y1="202" x2="189" y2="202" stroke="#8a8a8a" stroke-width="1.6"/>
  <!-- central carbon -->
  <circle cx="180" cy="160" r="2.5" fill="#8a8a8a"/>
  <!-- atom labels -->
  <text x="180" y="106" fill="#8a8a8a" text-anchor="middle">Br</text>
  <text x="238" y="193" fill="#8a8a8a" text-anchor="middle">Cl</text>
  <text x="124" y="193" fill="#8a8a8a" text-anchor="middle">F</text>
  <text x="180" y="228" fill="#8a8a8a" text-anchor="middle">H</text>
  <!-- priority numbers -->
  <text x="199" y="101" fill="#4a90d9" font-size="12" font-weight="bold">1</text>
  <text x="254" y="198" fill="#4a90d9" font-size="12" font-weight="bold">2</text>
  <text x="107" y="198" fill="#4a90d9" font-size="12" font-weight="bold">3</text>
  <text x="196" y="233" fill="#4a90d9" font-size="12" font-weight="bold">4</text>
  <!-- rotation arrow 1->2->3 (clockwise) -->
  <path d="M 196 120 C 250 128, 254 186, 152 202" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="152,202 165,198 160,210" fill="#e0645c"/>
  <text x="150" y="152" fill="#e0645c" font-size="17" font-weight="bold">R</text>

  <!-- ================= RIGHT molecule (S) ================= -->
  <!-- bonds -->
  <line x1="460" y1="160" x2="460" y2="112" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="460" y1="160" x2="414" y2="186" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="460" y1="160" x2="506" y2="186" stroke="#8a8a8a" stroke-width="2"/>
  <!-- dashed wedge to H -->
  <line x1="456" y1="170" x2="464" y2="170" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="455" y1="178" x2="465" y2="178" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="454" y1="186" x2="466" y2="186" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="452" y1="194" x2="468" y2="194" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="451" y1="202" x2="469" y2="202" stroke="#8a8a8a" stroke-width="1.6"/>
  <!-- central carbon -->
  <circle cx="460" cy="160" r="2.5" fill="#8a8a8a"/>
  <!-- atom labels -->
  <text x="460" y="106" fill="#8a8a8a" text-anchor="middle">Br</text>
  <text x="402" y="193" fill="#8a8a8a" text-anchor="middle">Cl</text>
  <text x="518" y="193" fill="#8a8a8a" text-anchor="middle">F</text>
  <text x="460" y="228" fill="#8a8a8a" text-anchor="middle">H</text>
  <!-- priority numbers -->
  <text x="478" y="101" fill="#4a90d9" font-size="12" font-weight="bold">1</text>
  <text x="384" y="198" fill="#4a90d9" font-size="12" font-weight="bold">2</text>
  <text x="533" y="198" fill="#4a90d9" font-size="12" font-weight="bold">3</text>
  <text x="476" y="233" fill="#4a90d9" font-size="12" font-weight="bold">4</text>
  <!-- rotation arrow 1->2->3 (counter-clockwise) -->
  <path d="M 444 120 C 390 128, 386 186, 488 202" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="488,202 475,198 480,210" fill="#e0645c"/>
  <text x="480" y="152" fill="#e0645c" font-size="17" font-weight="bold">S</text>
</svg>
