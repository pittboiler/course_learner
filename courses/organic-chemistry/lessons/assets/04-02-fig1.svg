<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">&#185;H NMR of ethyl acetate: shift tells you the neighborhood, integration counts the H's, splitting counts the neighbors.</text>

  <!-- structure, top right -->
  <text x="430" y="60" fill="#8a8a8a" font-size="15">CH&#8323;&#8211;CO&#8211;O&#8211;CH&#8322;&#8211;CH&#8323;</text>
  <text x="430" y="78" fill="#8a8a8a" font-size="11">ethyl acetate</text>

  <!-- baseline / delta axis -->
  <line x1="60" y1="252" x2="612" y2="252" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="60,252 70,247 70,257" fill="#8a8a8a"/>
  <text x="300" y="300" fill="#8a8a8a">&#948; (ppm) &#8212; decreasing, deshielded left</text>

  <!-- ticks: delta 0..5, x = 580 - delta*98 -->
  <line x1="580" y1="252" x2="580" y2="258" stroke="#8a8a8a" stroke-width="1"/>
  <text x="576" y="272" fill="#8a8a8a">0</text>
  <line x1="482" y1="252" x2="482" y2="258" stroke="#8a8a8a" stroke-width="1"/>
  <text x="478" y="272" fill="#8a8a8a">1</text>
  <line x1="384" y1="252" x2="384" y2="258" stroke="#8a8a8a" stroke-width="1"/>
  <text x="380" y="272" fill="#8a8a8a">2</text>
  <line x1="286" y1="252" x2="286" y2="258" stroke="#8a8a8a" stroke-width="1"/>
  <text x="282" y="272" fill="#8a8a8a">3</text>
  <line x1="188" y1="252" x2="188" y2="258" stroke="#8a8a8a" stroke-width="1"/>
  <text x="184" y="272" fill="#8a8a8a">4</text>
  <line x1="90" y1="252" x2="90" y2="258" stroke="#8a8a8a" stroke-width="1"/>
  <text x="86" y="272" fill="#8a8a8a">5</text>

  <!-- ===== quartet: OCH2, 2H, delta ~4.1, x~178 (1:3:3:1) ===== -->
  <line x1="166" y1="252" x2="166" y2="178" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="174" y1="252" x2="174" y2="140" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="182" y1="252" x2="182" y2="140" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="190" y1="252" x2="190" y2="178" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="150" y="128" fill="#e0645c">quartet</text>
  <text x="169" y="112" fill="#e0645c">2H</text>
  <text x="150" y="238" fill="#8a8a8a" font-size="12">OCH&#8322;</text>

  <!-- ===== singlet: acetyl CH3, 3H, delta ~2.0, x=384 ===== -->
  <line x1="384" y1="252" x2="384" y2="96" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="360" y="84" fill="#e0645c">singlet</text>
  <text x="376" y="68" fill="#e0645c">3H</text>
  <text x="356" y="238" fill="#8a8a8a" font-size="12">CO&#8211;CH&#8323;</text>

  <!-- ===== triplet: CH3 of ethyl, 3H, delta ~1.2, x~462 (1:2:1) ===== -->
  <line x1="455" y1="252" x2="455" y2="164" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="462" y1="252" x2="462" y2="112" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="469" y1="252" x2="469" y2="164" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="444" y="100" fill="#e0645c">triplet</text>
  <text x="455" y="84" fill="#e0645c">3H</text>
  <text x="448" y="238" fill="#8a8a8a" font-size="12">CH&#8323;</text>

  <!-- ===== TMS reference singlet, delta 0, x=580 ===== -->
  <line x1="580" y1="252" x2="580" y2="206" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="566" y="196" fill="#8a8a8a" font-size="11">TMS</text>
</svg>
