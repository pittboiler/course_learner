<svg viewBox="0 0 640 410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Add, then eliminate: Nu attacks the acyl carbon, a tetrahedral intermediate forms, the leaving group is expelled &#8212; net swap.</text>

  <!-- ============ STATE 1: starting acyl-LG ============ -->
  <!-- carbonyl carbon at (110,150) -->
  <!-- R group -->
  <line x1="72" y1="172" x2="102" y2="154" stroke="#8a8a8a" stroke-width="2"/>
  <text x="58" y="180" fill="#8a8a8a">R</text>
  <!-- C=O double bond (blue carbonyl) -->
  <line x1="106" y1="146" x2="106" y2="104" stroke="#4a90d9" stroke-width="2"/>
  <line x1="114" y1="146" x2="114" y2="104" stroke="#4a90d9" stroke-width="2"/>
  <text x="104" y="98" fill="#4a90d9">O</text>
  <!-- C -->
  <text x="104" y="156" fill="#8a8a8a">C</text>
  <!-- C-LG bond -->
  <line x1="120" y1="154" x2="150" y2="172" stroke="#8a8a8a" stroke-width="2"/>
  <text x="152" y="182" fill="#8a8a8a">LG</text>
  <!-- Nu approaching from below (coral) -->
  <text x="98" y="222" fill="#e0645c">Nu:</text>
  <!-- coral curved arrow: Nu -> carbonyl carbon -->
  <path d="M 112 206 C 130 190, 132 172, 118 156" fill="none" stroke="#e0645c" stroke-width="1.6"/>
  <polygon points="118,156 124,163 114,164" fill="#e0645c"/>

  <!-- arrow to state 2 -->
  <line x1="176" y1="150" x2="212" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="212,150 203,146 203,154" fill="#8a8a8a"/>
  <text x="176" y="140" fill="#8a8a8a" font-size="12">add</text>

  <!-- ============ STATE 2: tetrahedral intermediate ============ -->
  <!-- carbon at (300,150) -->
  <line x1="262" y1="172" x2="292" y2="154" stroke="#8a8a8a" stroke-width="2"/>
  <text x="248" y="180" fill="#8a8a8a">R</text>
  <!-- C-O(-) single bond up -->
  <line x1="300" y1="144" x2="300" y2="106" stroke="#8a8a8a" stroke-width="2"/>
  <text x="292" y="100" fill="#8a8a8a">O</text>
  <text x="306" y="96" fill="#8a8a8a" font-size="11">&#8722;</text>
  <text x="294" y="156" fill="#8a8a8a">C</text>
  <!-- Nu now bonded (coral) down-left-ish, drawn to lower left -->
  <line x1="296" y1="158" x2="278" y2="196" stroke="#e0645c" stroke-width="2"/>
  <text x="262" y="210" fill="#e0645c">Nu</text>
  <!-- C-LG bond down-right -->
  <line x1="308" y1="156" x2="340" y2="176" stroke="#8a8a8a" stroke-width="2"/>
  <text x="342" y="186" fill="#8a8a8a">LG</text>
  <!-- coral arrow: O(-) lone pair reforms C=O -->
  <path d="M 292 110 C 276 122, 278 140, 292 148" fill="none" stroke="#e0645c" stroke-width="1.6"/>
  <polygon points="292,148 283,146 288,155" fill="#e0645c"/>
  <!-- coral arrow: C-LG bond breaks, LG leaves -->
  <path d="M 314 160 C 330 168, 344 176, 352 190" fill="none" stroke="#e0645c" stroke-width="1.6"/>
  <polygon points="352,190 343,187 349,180" fill="#e0645c"/>

  <!-- arrow to state 3 -->
  <line x1="376" y1="150" x2="412" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="412,150 403,146 403,154" fill="#8a8a8a"/>
  <text x="374" y="140" fill="#8a8a8a" font-size="12">eliminate</text>
  <text x="384" y="168" fill="#e0645c" font-size="12">&#8722; LG</text>

  <!-- ============ STATE 3: product acyl-Nu ============ -->
  <!-- carbon at (500,150) -->
  <line x1="462" y1="172" x2="492" y2="154" stroke="#8a8a8a" stroke-width="2"/>
  <text x="448" y="180" fill="#8a8a8a">R</text>
  <!-- C=O double bond (blue) -->
  <line x1="496" y1="146" x2="496" y2="104" stroke="#4a90d9" stroke-width="2"/>
  <line x1="504" y1="146" x2="504" y2="104" stroke="#4a90d9" stroke-width="2"/>
  <text x="494" y="98" fill="#4a90d9">O</text>
  <text x="494" y="156" fill="#8a8a8a">C</text>
  <!-- C-Nu bond (blue, the new group) -->
  <line x1="510" y1="154" x2="540" y2="172" stroke="#4a90d9" stroke-width="2"/>
  <text x="542" y="182" fill="#4a90d9">Nu</text>
  <text x="470" y="222" fill="#4a90d9" font-size="12">new acyl product</text>

  <!-- ============ reactivity ladder ============ -->
  <line x1="40" y1="288" x2="600" y2="288" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 5"/>
  <text x="40" y="316" fill="#8a8a8a" font-style="italic" font-size="13">Reactivity toward acyl substitution:</text>

  <!-- descending arrow -->
  <line x1="120" y1="350" x2="560" y2="350" stroke="#e0645c" stroke-width="2"/>
  <polygon points="560,350 549,345 549,355" fill="#e0645c"/>
  <text x="118" y="378" fill="#e0645c" font-size="12">most reactive</text>
  <text x="500" y="378" fill="#e0645c" font-size="12">least reactive</text>

  <text x="120" y="344" fill="#4a90d9" font-size="13">acyl chloride</text>
  <text x="238" y="344" fill="#8a8a8a" font-size="13">&#62;</text>
  <text x="256" y="344" fill="#8a8a8a" font-size="13">anhydride</text>
  <text x="352" y="344" fill="#8a8a8a" font-size="13">&#62;</text>
  <text x="370" y="344" fill="#8a8a8a" font-size="13">ester</text>
  <text x="418" y="344" fill="#8a8a8a" font-size="13">&#62;</text>
  <text x="436" y="344" fill="#4a90d9" font-size="13">amide</text>
</svg>
