<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="24" y="22" fill="#8a8a8a" font-style="italic">Radical chain HBr + peroxides: Br&#8226; adds first, to the carbon that leaves the MORE stable radical &#8212; anti-Markovnikov.</text>

  <!-- ================= INITIATION ================= -->
  <text x="24" y="66" fill="#8a8a8a" font-weight="bold" font-size="12" letter-spacing="1">INITIATION</text>
  <line x1="24" y1="74" x2="616" y2="74" stroke="#8a8a8a" stroke-width="0.6" stroke-dasharray="2 5"/>

  <!-- RO-OR homolysis -->
  <text x="40" y="106" fill="#8a8a8a">RO</text>
  <text x="66" y="106" fill="#8a8a8a">&#8212;</text>
  <text x="80" y="106" fill="#8a8a8a">OR</text>
  <!-- reaction arrow with hv -->
  <line x1="120" y1="101" x2="170" y2="101" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="170,101 162,97 162,105" fill="#8a8a8a"/>
  <text x="130" y="94" fill="#8a8a8a" font-size="12" font-style="italic">h&#957;</text>
  <text x="186" y="106" fill="#e0645c">2 RO</text>
  <circle cx="222" cy="97" r="2.4" fill="#e0645c"/>

  <!-- RO. + HBr -->
  <text x="290" y="106" fill="#e0645c">RO</text>
  <circle cx="314" cy="97" r="2.4" fill="#e0645c"/>
  <text x="322" y="106" fill="#8a8a8a">+</text>
  <text x="338" y="106" fill="#4a90d9">H&#8212;Br</text>
  <line x1="392" y1="101" x2="430" y2="101" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="430,101 422,97 422,105" fill="#8a8a8a"/>
  <text x="446" y="106" fill="#8a8a8a">ROH  +  </text>
  <text x="516" y="106" fill="#e0645c">Br</text>
  <circle cx="536" cy="97" r="2.4" fill="#e0645c"/>

  <!-- ================= PROPAGATION ================= -->
  <text x="24" y="152" fill="#8a8a8a" font-weight="bold" font-size="12" letter-spacing="1">PROPAGATION  (the chain that repeats)</text>
  <line x1="24" y1="160" x2="616" y2="160" stroke="#8a8a8a" stroke-width="0.6" stroke-dasharray="2 5"/>

  <!-- step 1: Br. adds to the alkene -->
  <text x="40" y="212" fill="#e0645c">Br</text>
  <circle cx="60" cy="203" r="2.4" fill="#e0645c"/>
  <text x="72" y="212" fill="#8a8a8a">+</text>

  <!-- alkene skeletal: C1=C2-Et -->
  <text x="92" y="212" fill="#4a90d9">H&#8322;C</text>
  <line x1="128" y1="205" x2="152" y2="205" stroke="#4a90d9" stroke-width="1.6"/>
  <line x1="128" y1="210" x2="152" y2="210" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="156" y="212" fill="#4a90d9">CH&#8212;CH&#8322;CH&#8323;</text>

  <!-- fishhook 1: Br unpaired e- to terminal carbon (C1) -->
  <path d="M 64 196 C 80 176, 108 176, 112 199" fill="none" stroke="#e0645c" stroke-width="1.4"/>
  <path d="M 112 199 L 106 190" fill="none" stroke="#e0645c" stroke-width="1.4"/>
  <!-- fishhook 2: one pi electron to internal carbon (C2), making the radical -->
  <path d="M 140 200 C 150 182, 168 182, 168 199" fill="none" stroke="#e0645c" stroke-width="1.4"/>
  <path d="M 168 199 L 162 191" fill="none" stroke="#e0645c" stroke-width="1.4"/>

  <!-- arrow to product -->
  <line x1="252" y1="207" x2="292" y2="207" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="292,207 284,203 284,211" fill="#8a8a8a"/>

  <!-- product of step 1: Br-CH2-.CH-Et  (2 radical) -->
  <text x="304" y="212" fill="#4a90d9">BrCH&#8322;&#8212;CH&#8212;CH&#8322;CH&#8323;</text>
  <circle cx="368" cy="200" r="2.4" fill="#e0645c"/>
  <text x="430" y="234" fill="#e0645c" font-size="11.5">2&#176; radical (more stable)</text>

  <!-- step 2: radical abstracts H from HBr -->
  <text x="40" y="284" fill="#4a90d9">BrCH&#8322;&#8212;CH&#8212;CH&#8322;CH&#8323;</text>
  <circle cx="104" cy="272" r="2.4" fill="#e0645c"/>
  <text x="170" y="284" fill="#8a8a8a">+</text>
  <text x="186" y="284" fill="#4a90d9">H&#8212;Br</text>
  <line x1="244" y1="279" x2="284" y2="279" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="284,279 276,275 276,283" fill="#8a8a8a"/>
  <text x="298" y="284" fill="#4a90d9">BrCH&#8322;&#8212;CH&#8322;&#8212;CH&#8322;CH&#8323;</text>
  <text x="480" y="284" fill="#8a8a8a">+  </text>
  <text x="500" y="284" fill="#e0645c">Br</text>
  <circle cx="520" cy="275" r="2.4" fill="#e0645c"/>
  <text x="298" y="306" fill="#8a8a8a" font-size="11.5">1-bromobutane (anti-Markovnikov)  &#8592; Br&#8226; regenerated, chain continues</text>

  <!-- ================= TERMINATION ================= -->
  <text x="24" y="352" fill="#8a8a8a" font-weight="bold" font-size="12" letter-spacing="1">TERMINATION</text>
  <line x1="24" y1="360" x2="616" y2="360" stroke="#8a8a8a" stroke-width="0.6" stroke-dasharray="2 5"/>

  <text x="40" y="396" fill="#e0645c">Br</text>
  <circle cx="60" cy="387" r="2.4" fill="#e0645c"/>
  <text x="72" y="396" fill="#8a8a8a">+</text>
  <text x="90" y="396" fill="#e0645c">Br</text>
  <circle cx="110" cy="387" r="2.4" fill="#e0645c"/>
  <line x1="132" y1="391" x2="172" y2="391" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="172,391 164,387 164,395" fill="#8a8a8a"/>
  <text x="186" y="396" fill="#8a8a8a">Br&#8212;Br    (two radicals pair up &#8594; chain ends)</text>
</svg>
