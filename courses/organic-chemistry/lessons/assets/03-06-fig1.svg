<svg viewBox="0 0 660 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Oxidation climbs the ladder only while there's a C&#8211;H on the carbinol carbon; epoxides open where the nucleophile is steered.</text>

  <!-- ===================== TOP: oxidation ladder ===================== -->
  <text x="30" y="58" fill="#8a8a8a" font-style="italic">Oxidation ladder (coral = the C&#8211;H that gets removed)</text>

  <!-- 1 degree row -->
  <text x="34" y="98" fill="#8a8a8a">1&#176;</text>
  <text x="62" y="98" fill="#4a90d9">RCH</text>
  <text x="103" y="102" fill="#e0645c" font-size="11">2</text>
  <text x="112" y="98" fill="#4a90d9">OH</text>
  <!-- arrow 1 -->
  <line x1="150" y1="93" x2="222" y2="93" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="222,93 213,89 213,97" fill="#8a8a8a"/>
  <text x="158" y="84" fill="#e0645c" font-size="12">PCC (mild)</text>
  <text x="245" y="98" fill="#4a90d9">RCHO</text>
  <text x="240" y="114" fill="#8a8a8a" font-size="11">aldehyde</text>
  <!-- arrow 2 -->
  <line x1="310" y1="93" x2="382" y2="93" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="382,93 373,89 373,97" fill="#8a8a8a"/>
  <text x="312" y="84" fill="#e0645c" font-size="12">KMnO&#8324; (strong)</text>
  <text x="405" y="98" fill="#4a90d9">RCOOH</text>
  <text x="405" y="114" fill="#8a8a8a" font-size="11">carboxylic acid</text>

  <!-- 2 degree row -->
  <text x="34" y="150" fill="#8a8a8a">2&#176;</text>
  <text x="62" y="150" fill="#4a90d9">R</text>
  <text x="74" y="154" fill="#8a8a8a" font-size="11">2</text>
  <text x="82" y="150" fill="#4a90d9">CH</text>
  <text x="106" y="146" fill="#e0645c" font-size="11">(H)</text>
  <text x="82" y="166" fill="#e0645c" font-size="11">&#8593;</text>
  <text x="132" y="150" fill="#4a90d9">OH</text>
  <line x1="175" y1="145" x2="247" y2="145" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="247,145 238,141 238,149" fill="#8a8a8a"/>
  <text x="196" y="136" fill="#8a8a8a" font-size="12">[O]</text>
  <text x="270" y="150" fill="#4a90d9">R</text>
  <text x="282" y="154" fill="#8a8a8a" font-size="11">2</text>
  <text x="290" y="150" fill="#4a90d9">C=O</text>
  <text x="330" y="150" fill="#8a8a8a" font-size="11">ketone</text>

  <!-- 3 degree row -->
  <text x="34" y="202" fill="#8a8a8a">3&#176;</text>
  <text x="62" y="202" fill="#4a90d9">R</text>
  <text x="74" y="206" fill="#8a8a8a" font-size="11">3</text>
  <text x="82" y="202" fill="#4a90d9">C</text>
  <text x="95" y="198" fill="#e0645c" font-size="11">(no H)</text>
  <text x="132" y="202" fill="#4a90d9">OH</text>
  <line x1="175" y1="197" x2="247" y2="197" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="247,197 238,193 238,201" fill="#8a8a8a"/>
  <text x="196" y="188" fill="#8a8a8a" font-size="12">[O]</text>
  <line x1="205" y1="205" x2="217" y2="190" stroke="#e0645c" stroke-width="2"/>
  <line x1="205" y1="190" x2="217" y2="205" stroke="#e0645c" stroke-width="2"/>
  <text x="270" y="202" fill="#e0645c">no reaction</text>

  <!-- divider -->
  <line x1="30" y1="232" x2="630" y2="232" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- ===================== BOTTOM: epoxide ring-opening ===================== -->
  <text x="30" y="262" fill="#8a8a8a" font-style="italic">Epoxide ring-opening (coral = nucleophile attack)</text>

  <!-- LEFT: basic conditions -->
  <text x="70" y="292" fill="#8a8a8a">Base:</text>
  <!-- epoxide triangle -->
  <text x="150" y="300" fill="#8a8a8a">O</text>
  <line x1="152" y1="308" x2="128" y2="348" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="160" y1="308" x2="184" y2="348" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="128" y1="352" x2="184" y2="352" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="108" y="366" fill="#4a90d9">CH</text>
  <text x="128" y="370" fill="#4a90d9" font-size="11">2</text>
  <text x="176" y="366" fill="#4a90d9">C(CH</text>
  <text x="212" y="370" fill="#4a90d9" font-size="11">3</text>
  <text x="219" y="366" fill="#4a90d9">)</text>
  <text x="227" y="370" fill="#4a90d9" font-size="11">2</text>
  <!-- Nu attacks LESS-hindered CH2 -->
  <line x1="95" y1="392" x2="128" y2="358" stroke="#e0645c" stroke-width="2"/>
  <polygon points="128,358 118,360 124,368" fill="#e0645c"/>
  <text x="60" y="406" fill="#e0645c">HO&#8722; hits less-hindered C</text>

  <!-- RIGHT: acidic conditions -->
  <text x="400" y="292" fill="#8a8a8a">Acid:</text>
  <!-- protonated epoxide triangle -->
  <text x="480" y="300" fill="#8a8a8a">O</text>
  <text x="494" y="296" fill="#e0645c" font-size="11">H&#8314;</text>
  <line x1="482" y1="308" x2="458" y2="348" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="490" y1="308" x2="514" y2="348" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="458" y1="352" x2="514" y2="352" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="438" y="366" fill="#4a90d9">CH</text>
  <text x="458" y="370" fill="#4a90d9" font-size="11">2</text>
  <text x="506" y="366" fill="#4a90d9">C(CH</text>
  <text x="542" y="370" fill="#4a90d9" font-size="11">3</text>
  <text x="549" y="366" fill="#4a90d9">)</text>
  <text x="557" y="370" fill="#4a90d9" font-size="11">2</text>
  <!-- Nu attacks MORE-substituted C -->
  <line x1="575" y1="392" x2="514" y2="358" stroke="#e0645c" stroke-width="2"/>
  <polygon points="514,358 524,360 519,368" fill="#e0645c"/>
  <text x="470" y="406" fill="#e0645c">Nu hits more-substituted C</text>
</svg>
