<svg viewBox="0 0 700 384" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">The CAP proof: one write, one read, no messages in between</text>
  <rect x="56.0" y="74.0" width="232.0" height="150.0" fill="none" stroke="#8a8a8a" stroke-width="1.7" rx="8"/>
  <rect x="412.0" y="74.0" width="232.0" height="150.0" fill="none" stroke="#8a8a8a" stroke-width="1.7" rx="8"/>
  <text x="172.0" y="66.0" fill="#8a8a8a" font-size="12" text-anchor="middle">group G1</text>
  <text x="528.0" y="66.0" fill="#8a8a8a" font-size="12" text-anchor="middle">group G2</text>
  <circle cx="116.0" cy="128.0" r="16" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <circle cx="228.0" cy="128.0" r="16" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <circle cx="472.0" cy="128.0" r="16" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <circle cx="584.0" cy="128.0" r="16" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="172.0" y="196.0" fill="#4a90d9" font-size="11.5" text-anchor="middle">holds x = 1</text>
  <text x="528.0" y="196.0" fill="#e0645c" font-size="11.5" text-anchor="middle">holds x = 0</text>
  <line x1="350.0" y1="58.0" x2="350.0" y2="240.0" stroke="#e0645c" stroke-width="2.6" stroke-dasharray="8 5"/>
  <text x="350.0" y="254.0" fill="#e0645c" font-size="11" text-anchor="middle">partition: every message lost</text>
  <line x1="172.0" y1="104.0" x2="172.0" y2="120.0" stroke="#4a90d9" stroke-width="1.6"/>
  <polygon points="172.0,120.0 176.5,110.1 167.5,110.1" fill="#4a90d9"/>
  <text x="172.0" y="96.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">write x = 1, acknowledged</text>
  <line x1="528.0" y1="120.0" x2="528.0" y2="104.0" stroke="#e0645c" stroke-width="1.6"/>
  <polygon points="528.0,104.0 523.5,113.9 532.5,113.9" fill="#e0645c"/>
  <text x="528.0" y="96.0" fill="#e0645c" font-size="10.5" text-anchor="middle">read x, must answer</text>
  <text x="30.0" y="296.0" fill="#8a8a8a" font-size="11">Availability says G2 must answer. Partition tolerance says no message reached it.</text>
  <text x="30.0" y="318.0" fill="#8a8a8a" font-size="11">So G2 answers from what it has, which is the old value - and the write already returned,</text>
  <text x="30.0" y="340.0" fill="#8a8a8a" font-size="11">so real-time order forbids a later read from missing it.</text>
  <text x="30.0" y="368.0" fill="#4a90d9" font-size="11">Linearizable, available, partition-tolerant: choose two. The proof needs four nodes and two operations.</text>
</svg>
