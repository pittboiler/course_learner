<svg viewBox="0 0 700 376" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">A two-replica counter&#x27;s states form a lattice; merge is the least upper bound</text>
  <line x1="250.0" y1="336.0" x2="328.0" y2="270.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <line x1="250.0" y1="336.0" x2="172.0" y2="270.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <line x1="172.0" y1="270.0" x2="250.0" y2="204.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <line x1="172.0" y1="270.0" x2="94.0" y2="204.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <line x1="94.0" y1="204.0" x2="172.0" y2="138.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <line x1="328.0" y1="270.0" x2="406.0" y2="204.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <line x1="328.0" y1="270.0" x2="250.0" y2="204.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <line x1="250.0" y1="204.0" x2="328.0" y2="138.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <line x1="250.0" y1="204.0" x2="172.0" y2="138.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <line x1="172.0" y1="138.0" x2="250.0" y2="72.0" stroke="#e0645c" stroke-width="2.2"/>
  <line x1="406.0" y1="204.0" x2="328.0" y2="138.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <line x1="328.0" y1="138.0" x2="250.0" y2="72.0" stroke="#e0645c" stroke-width="2.2"/>
  <circle cx="250.0" cy="336.0" r="16" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="250.0" y="340.0" fill="#8a8a8a" font-size="11" text-anchor="middle">0,0</text>
  <circle cx="172.0" cy="270.0" r="16" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="172.0" y="274.0" fill="#8a8a8a" font-size="11" text-anchor="middle">0,1</text>
  <circle cx="94.0" cy="204.0" r="16" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="94.0" y="208.0" fill="#8a8a8a" font-size="11" text-anchor="middle">0,2</text>
  <circle cx="328.0" cy="270.0" r="16" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="328.0" y="274.0" fill="#8a8a8a" font-size="11" text-anchor="middle">1,0</text>
  <circle cx="250.0" cy="204.0" r="16" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="250.0" y="208.0" fill="#8a8a8a" font-size="11" text-anchor="middle">1,1</text>
  <circle cx="172.0" cy="138.0" r="16" fill="none" stroke="#e0645c" stroke-width="2.2"/>
  <text x="172.0" y="142.0" fill="#e0645c" font-size="11" text-anchor="middle">1,2</text>
  <circle cx="406.0" cy="204.0" r="16" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="406.0" y="208.0" fill="#8a8a8a" font-size="11" text-anchor="middle">2,0</text>
  <circle cx="328.0" cy="138.0" r="16" fill="none" stroke="#e0645c" stroke-width="2.2"/>
  <text x="328.0" y="142.0" fill="#e0645c" font-size="11" text-anchor="middle">2,1</text>
  <circle cx="250.0" cy="72.0" r="16" fill="none" stroke="#e0645c" stroke-width="2.2"/>
  <text x="250.0" y="76.0" fill="#e0645c" font-size="11" text-anchor="middle">2,2</text>
  <text x="250.0" y="362.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">both replicas at zero</text>
  <text x="420.0" y="90.0" fill="#8a8a8a" font-size="11">merge( (2,1), (2,1) ) = (2,1)   idempotent</text>
  <text x="420.0" y="112.0" fill="#e0645c" font-size="11">merge( (2,1), (1,2) ) = (2,2)   commutative</text>
  <text x="420.0" y="134.0" fill="#4a90d9" font-size="11">merge is pointwise max, the join</text>
  <text x="420.0" y="166.0" fill="#4a90d9" font-size="11">value = 2 + 2 = 4</text>
  <text x="420.0" y="206.0" fill="#8a8a8a" font-size="10.5">Every update moves UP the lattice, so</text>
  <text x="420.0" y="222.0" fill="#8a8a8a" font-size="10.5">replicas can only ever climb toward a</text>
  <text x="420.0" y="238.0" fill="#8a8a8a" font-size="10.5">common upper bound - never back down.</text>
</svg>
