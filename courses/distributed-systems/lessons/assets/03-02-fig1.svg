<svg viewBox="0 0 700 352" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Failure-detector classes: completeness down the side, accuracy across the top</text>
  <text x="255.0" y="66.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">strong</text>
  <text x="373.0" y="66.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">weak</text>
  <text x="491.0" y="66.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">eventually strong</text>
  <text x="609.0" y="66.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">eventually weak</text>
  <text x="432.0" y="42.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">accuracy</text>
  <text x="184.0" y="141.0" fill="#8a8a8a" font-size="11" text-anchor="end">strong completeness</text>
  <rect x="200.0" y="104.0" width="110.0" height="66.0" fill="none" stroke="#4a90d9" stroke-width="1.7" rx="4"/>
  <text x="255.0" y="143.0" fill="#4a90d9" font-size="16" text-anchor="middle">P</text>
  <rect x="318.0" y="104.0" width="110.0" height="66.0" fill="none" stroke="#4a90d9" stroke-width="1.7" rx="4"/>
  <text x="373.0" y="143.0" fill="#4a90d9" font-size="16" text-anchor="middle">S</text>
  <rect x="436.0" y="104.0" width="110.0" height="66.0" fill="none" stroke="#e0645c" stroke-width="1.7" rx="4"/>
  <text x="491.0" y="143.0" fill="#e0645c" font-size="16" text-anchor="middle">&lt;&gt;P</text>
  <rect x="554.0" y="104.0" width="110.0" height="66.0" fill="none" stroke="#e0645c" stroke-width="1.7" rx="4"/>
  <text x="609.0" y="143.0" fill="#e0645c" font-size="16" text-anchor="middle">&lt;&gt;S</text>
  <text x="184.0" y="215.0" fill="#8a8a8a" font-size="11" text-anchor="end">weak completeness</text>
  <rect x="200.0" y="178.0" width="110.0" height="66.0" fill="none" stroke="#4a90d9" stroke-width="1.7" rx="4"/>
  <text x="255.0" y="217.0" fill="#4a90d9" font-size="16" text-anchor="middle">Q</text>
  <rect x="318.0" y="178.0" width="110.0" height="66.0" fill="none" stroke="#4a90d9" stroke-width="1.7" rx="4"/>
  <text x="373.0" y="217.0" fill="#4a90d9" font-size="16" text-anchor="middle">W</text>
  <rect x="436.0" y="178.0" width="110.0" height="66.0" fill="none" stroke="#e0645c" stroke-width="1.7" rx="4"/>
  <text x="491.0" y="217.0" fill="#e0645c" font-size="16" text-anchor="middle">&lt;&gt;Q</text>
  <rect x="554.0" y="178.0" width="110.0" height="66.0" fill="none" stroke="#e0645c" stroke-width="1.7" rx="4"/>
  <text x="609.0" y="217.0" fill="#e0645c" font-size="16" text-anchor="middle">&lt;&gt;W</text>
  <text x="30.0" y="272.0" fill="#4a90d9" font-size="10.5">Left half (real accuracy): consensus needs only n &gt; f. Impossible to build in an asynchronous system.</text>
  <text x="30.0" y="292.0" fill="#e0645c" font-size="10.5">Right half (eventual accuracy): consensus needs n &gt; 2f. Buildable with adaptive timeouts.</text>
  <text x="30.0" y="320.0" fill="#8a8a8a" font-size="10.5">&lt;&gt;S - and the eventual-leader detector Omega it is equivalent to - is the WEAKEST detector</text>
  <text x="30.0" y="338.0" fill="#8a8a8a" font-size="10.5">that solves consensus at all. Every class here reduces to one of the four in the top row.</text>
</svg>
