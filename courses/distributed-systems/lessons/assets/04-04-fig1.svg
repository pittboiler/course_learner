  <text x="270.0" y="340.2" fill="#4a90d9" font-size="12" text-anchor="middle">C</text>
  <circle cx="124.9" cy="309.6" r="7" fill="#4a90d9"/>
  <text x="111.1" y="333.2" fill="#4a90d9" font-size="12" text-anchor="middle">D</text>
  <circle cx="88.6" cy="146.0" r="7" fill="#4a90d9"/>
  <text x="67.8" y="138.0" fill="#4a90d9" font-size="12" text-anchor="middle">E</text>
  <circle cx="308.4" cy="260.4" r="7" fill="#e0645c"/>
  <text x="331.9" y="275.4" fill="#e0645c" font-size="12" text-anchor="middle">new</text>
  <text x="196.0" y="202.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">hash ring</text>
  <text x="196.0" y="222.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">key goes clockwise</text>
  <text x="196.0" y="238.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">to the next node</text>
  <text x="372.0" y="84.0" fill="#8a8a8a" font-size="12">10 nodes, adding an 11th</text>
  <text x="372.0" y="108.0" fill="#e0645c" font-size="11.5">hash mod N:   90.9% of keys move</text>
  <text x="372.0" y="130.0" fill="#4a90d9" font-size="11.5">consistent hashing:   9.1% move</text>
  <text x="372.0" y="170.0" fill="#8a8a8a" font-size="12">virtual nodes fix the load spread</text>
  <text x="372.0" y="194.0" fill="#8a8a8a" font-size="10.5">per node</text>
  <text x="502.0" y="194.0" fill="#8a8a8a" font-size="10.5">max/min load</text>
  <text x="372.0" y="216.0" fill="#4a90d9" font-size="11">1</text>
  <text x="502.0" y="216.0" fill="#e0645c" font-size="11">16.2x</text>
  <text x="372.0" y="238.0" fill="#4a90d9" font-size="11">10</text>
  <text x="502.0" y="238.0" fill="#4a90d9" font-size="11">2.31x</text>
  <text x="372.0" y="260.0" fill="#4a90d9" font-size="11">50</text>
  <text x="502.0" y="260.0" fill="#4a90d9" font-size="11">1.58x</text>
  <text x="372.0" y="282.0" fill="#4a90d9" font-size="11">200</text>
  <text x="502.0" y="282.0" fill="#4a90d9" font-size="11">1.22x</text>
  <text x="372.0" y="322.0" fill="#8a8a8a" font-size="11">Chord routing: about log2(N) hops,</text>
  <text x="372.0" y="340.0" fill="#8a8a8a" font-size="11">so 20 hops among a million nodes.</text>
  <text x="24.0" y="372.0" fill="#e0645c" font-size="10.5">Only the keys on the coral arc change owner. Every other key stays exactly where it was.</text>
