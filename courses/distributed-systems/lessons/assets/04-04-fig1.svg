<svg viewBox="0 0 700 384" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Consistent hashing: adding a node moves only the arc behind it</text>
  <circle cx="196.0" cy="208.0" r="124" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M 315.8 175.9 L 316.7 179.4 L 317.4 182.9 L 318.1 186.5 L 318.7 190.0 L 319.2 193.6 L 319.5 197.2 L 319.8 200.8 L 319.9 204.4 L 320.0 208.0 L 319.9 211.6 L 319.8 215.2 L 319.5 218.8 L 319.2 222.4 L 318.7 226.0 L 318.1 229.5 L 317.4 233.1 L 316.7 236.6 L 315.8 240.1 L 314.8 243.6 L 313.7 247.0 L 312.5 250.4 L 311.2 253.8 L 309.9 257.1 L 308.4 260.4" fill="none" stroke="#e0645c" stroke-width="5.0"/>
