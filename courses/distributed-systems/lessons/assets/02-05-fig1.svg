<svg viewBox="0 0 700 388" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Two ways to place four replicas: the leader is a hub, or a pipeline</text>
  <text x="24.0" y="58.0" fill="#4a90d9" font-size="12">primary-backup: leader fans out</text>
  <rect x="108.0" y="130.0" width="84.0" height="40.0" fill="none" stroke="#4a90d9" stroke-width="1.5" rx="4"/>
  <text x="150.0" y="154.2" fill="#4a90d9" font-size="12" text-anchor="middle">leader</text>
  <rect x="16.0" y="218.0" width="76.0" height="36.0" fill="none" stroke="#8a8a8a" stroke-width="1.5" rx="4"/>
  <text x="54.0" y="239.8" fill="#8a8a8a" font-size="11" text-anchor="middle">follower</text>
  <line x1="116.4" y1="170.0" x2="68.4" y2="218.0" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="68.4,218.0 77.5,214.6 71.8,208.9" fill="#e0645c"/>
  <rect x="112.0" y="242.0" width="76.0" height="36.0" fill="none" stroke="#8a8a8a" stroke-width="1.5" rx="4"/>
  <text x="150.0" y="263.9" fill="#8a8a8a" font-size="11" text-anchor="middle">follower</text>
  <line x1="150.0" y1="170.0" x2="150.0" y2="242.0" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="150.0,242.0 154.0,233.2 146.0,233.2" fill="#e0645c"/>
  <rect x="208.0" y="218.0" width="76.0" height="36.0" fill="none" stroke="#8a8a8a" stroke-width="1.5" rx="4"/>
  <text x="246.0" y="239.8" fill="#8a8a8a" font-size="11" text-anchor="middle">follower</text>
  <line x1="183.6" y1="170.0" x2="231.6" y2="218.0" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="231.6,218.0 228.2,208.9 222.5,214.6" fill="#e0645c"/>
  <line x1="150.0" y1="74.0" x2="150.0" y2="130.0" stroke="#4a90d9" stroke-width="1.6"/>
  <polygon points="150.0,130.0 154.5,120.1 145.5,120.1" fill="#4a90d9"/>
  <text x="150.0" y="68.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">all writes</text>
  <text x="24.0" y="300.0" fill="#8a8a8a" font-size="10.5">leader handles 2(n-1) messages per write</text>
  <text x="24.0" y="318.0" fill="#8a8a8a" font-size="10.5">n = 5 means 8 messages at one node</text>
  <text x="24.0" y="336.0" fill="#e0645c" font-size="10.5">reads from a follower may be stale</text>
  <text x="392.0" y="58.0" fill="#4a90d9" font-size="12">chain replication: a pipeline</text>
  <rect x="372.0" y="132.0" width="56.0" height="36.0" fill="none" stroke="#4a90d9" stroke-width="1.8" rx="4"/>
  <text x="400.0" y="154.0" fill="#4a90d9" font-size="11" text-anchor="middle">head</text>
  <line x1="428.0" y1="150.0" x2="440.0" y2="150.0" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="440.0,150.0 430.1,145.5 430.1,154.5" fill="#e0645c"/>
  <rect x="440.0" y="132.0" width="56.0" height="36.0" fill="none" stroke="#8a8a8a" stroke-width="1.8" rx="4"/>
  <text x="468.0" y="154.0" fill="#8a8a8a" font-size="11" text-anchor="middle">mid</text>
  <line x1="496.0" y1="150.0" x2="508.0" y2="150.0" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="508.0,150.0 498.1,145.5 498.1,154.5" fill="#e0645c"/>
  <rect x="508.0" y="132.0" width="56.0" height="36.0" fill="none" stroke="#8a8a8a" stroke-width="1.8" rx="4"/>
  <text x="536.0" y="154.0" fill="#8a8a8a" font-size="11" text-anchor="middle">mid</text>
  <line x1="564.0" y1="150.0" x2="576.0" y2="150.0" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="576.0,150.0 566.1,145.5 566.1,154.5" fill="#e0645c"/>
  <rect x="576.0" y="132.0" width="56.0" height="36.0" fill="none" stroke="#4a90d9" stroke-width="1.8" rx="4"/>
  <text x="604.0" y="154.0" fill="#4a90d9" font-size="11" text-anchor="middle">tail</text>
  <line x1="400.0" y1="100.0" x2="400.0" y2="132.0" stroke="#4a90d9" stroke-width="1.6"/>
  <polygon points="400.0,132.0 404.5,122.1 395.5,122.1" fill="#4a90d9"/>
  <text x="400.0" y="94.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">writes</text>
  <line x1="604.0" y1="132.0" x2="604.0" y2="100.0" stroke="#4a90d9" stroke-width="1.6"/>
  <polygon points="604.0,100.0 599.5,109.9 608.5,109.9" fill="#4a90d9"/>
  <text x="604.0" y="94.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">reads + ack</text>
  <text x="392.0" y="300.0" fill="#8a8a8a" font-size="10.5">n messages per write, at most 2 per node</text>
  <text x="392.0" y="318.0" fill="#8a8a8a" font-size="10.5">the tail has seen every committed write,</text>
  <text x="392.0" y="336.0" fill="#4a90d9" font-size="10.5">so reads there are linearizable</text>
  <line x1="360.0" y1="46.0" x2="360.0" y2="286.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="24.0" y="368.0" fill="#8a8a8a" font-size="10.5">Both need one thing they cannot provide themselves: agreement on who holds each role (lesson 3.6).</text>
</svg>
