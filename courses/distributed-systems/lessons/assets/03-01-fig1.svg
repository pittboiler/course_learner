<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Why some initial configuration must be bivalent: walk from all-zero to all-one</text>
  <rect x="24.0" y="96.0" width="80.0" height="48.0" fill="none" stroke="#4a90d9" stroke-width="1.9" rx="5"/>
  <text x="64.0" y="126.0" fill="#4a90d9" font-size="15" text-anchor="middle">0000</text>
  <text x="64.0" y="164.0" fill="#4a90d9" font-size="11" text-anchor="middle">0-valent</text>
  <line x1="104.0" y1="120.0" x2="168.0" y2="120.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="168.0,120.0 158.1,115.5 158.1,124.5" fill="#8a8a8a"/>
  <text x="136.0" y="106.0" fill="#8a8a8a" font-size="10" text-anchor="middle">flip one</text>
  <rect x="168.0" y="96.0" width="80.0" height="48.0" fill="none" stroke="#8a8a8a" stroke-width="1.9" rx="5"/>
  <text x="208.0" y="126.0" fill="#8a8a8a" font-size="15" text-anchor="middle">1000</text>
  <text x="208.0" y="164.0" fill="#8a8a8a" font-size="11" text-anchor="middle">?</text>
  <line x1="248.0" y1="120.0" x2="312.0" y2="120.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="312.0,120.0 302.1,115.5 302.1,124.5" fill="#8a8a8a"/>
  <text x="280.0" y="106.0" fill="#8a8a8a" font-size="10" text-anchor="middle">flip one</text>
  <rect x="312.0" y="96.0" width="80.0" height="48.0" fill="none" stroke="#8a8a8a" stroke-width="1.9" rx="5"/>
  <text x="352.0" y="126.0" fill="#8a8a8a" font-size="15" text-anchor="middle">1100</text>
  <text x="352.0" y="164.0" fill="#8a8a8a" font-size="11" text-anchor="middle">?</text>
  <line x1="392.0" y1="120.0" x2="456.0" y2="120.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="456.0,120.0 446.1,115.5 446.1,124.5" fill="#8a8a8a"/>
  <text x="424.0" y="106.0" fill="#8a8a8a" font-size="10" text-anchor="middle">flip one</text>
  <rect x="456.0" y="96.0" width="80.0" height="48.0" fill="none" stroke="#8a8a8a" stroke-width="1.9" rx="5"/>
  <text x="496.0" y="126.0" fill="#8a8a8a" font-size="15" text-anchor="middle">1110</text>
  <text x="496.0" y="164.0" fill="#8a8a8a" font-size="11" text-anchor="middle">?</text>
  <line x1="536.0" y1="120.0" x2="600.0" y2="120.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="600.0,120.0 590.1,115.5 590.1,124.5" fill="#8a8a8a"/>
  <text x="568.0" y="106.0" fill="#8a8a8a" font-size="10" text-anchor="middle">flip one</text>
  <rect x="600.0" y="96.0" width="80.0" height="48.0" fill="none" stroke="#e0645c" stroke-width="1.9" rx="5"/>
  <text x="640.0" y="126.0" fill="#e0645c" font-size="15" text-anchor="middle">1111</text>
  <text x="640.0" y="164.0" fill="#e0645c" font-size="11" text-anchor="middle">1-valent</text>
  <text x="36.0" y="192.0" fill="#8a8a8a" font-size="11.5">Each step changes exactly one process&#x27;s input.</text>
  <text x="36.0" y="214.0" fill="#8a8a8a" font-size="11.5">If no configuration in the walk is bivalent, some adjacent pair is 0-valent and 1-valent,</text>
  <text x="36.0" y="236.0" fill="#8a8a8a" font-size="11.5">differing only in process p&#x27;s input.</text>
  <text x="36.0" y="266.0" fill="#e0645c" font-size="11.5">Now crash p at the very start. The two runs are then IDENTICAL to every other process,</text>
  <text x="36.0" y="288.0" fill="#e0645c" font-size="11.5">so they decide the same value - contradicting one being 0-valent and the other 1-valent.</text>
  <text x="36.0" y="318.0" fill="#4a90d9" font-size="11.5">Therefore a bivalent initial configuration exists, and one crash was all it took.</text>
</svg>
