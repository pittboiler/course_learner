<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Lamport numbers and vector timestamps on the same nine events</text>
  <text x="112.0" y="100.5" fill="#8a8a8a" text-anchor="end">P</text>
  <line x1="120.0" y1="96.0" x2="660.0" y2="96.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="660.0,96.0 650.1,91.5 650.1,100.5" fill="#8a8a8a"/>
  <text x="112.0" y="180.6" fill="#8a8a8a" text-anchor="end">Q</text>
  <line x1="120.0" y1="176.0" x2="660.0" y2="176.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="660.0,176.0 650.1,171.5 650.1,180.5" fill="#8a8a8a"/>
  <text x="112.0" y="260.6" fill="#8a8a8a" text-anchor="end">R</text>
  <line x1="120.0" y1="256.0" x2="660.0" y2="256.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="660.0,256.0 650.1,251.5 650.1,260.5" fill="#8a8a8a"/>
  <circle cx="150.0" cy="96.0" r="4.5" fill="#4a90d9"/>
  <text x="150.0" y="85.0" fill="#4a90d9" font-size="11" text-anchor="middle">P1</text>
  <text x="150.0" y="114.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">L=1</text>
  <text x="150.0" y="127.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">(1,0,0)</text>
  <circle cx="300.0" cy="96.0" r="4.5" fill="#4a90d9"/>
  <text x="300.0" y="85.0" fill="#4a90d9" font-size="11" text-anchor="middle">P2</text>
  <text x="300.0" y="114.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">L=2</text>
  <text x="300.0" y="127.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">(2,0,0)</text>
  <circle cx="430.0" cy="96.0" r="4.5" fill="#e0645c"/>
  <text x="430.0" y="85.0" fill="#e0645c" font-size="11" text-anchor="middle">P3</text>
  <text x="430.0" y="114.0" fill="#e0645c" font-size="10.5" text-anchor="middle">L=3</text>
  <text x="430.0" y="127.0" fill="#e0645c" font-size="10.5" text-anchor="middle">(3,0,0)</text>
  <circle cx="150.0" cy="176.0" r="4.5" fill="#4a90d9"/>
  <text x="150.0" y="165.0" fill="#4a90d9" font-size="11" text-anchor="middle">Q1</text>
  <text x="150.0" y="194.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">L=1</text>
  <text x="150.0" y="207.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">(0,1,0)</text>
  <circle cx="370.0" cy="176.0" r="4.5" fill="#4a90d9"/>
  <text x="370.0" y="165.0" fill="#4a90d9" font-size="11" text-anchor="middle">Q2</text>
  <text x="370.0" y="194.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">L=3</text>
  <text x="370.0" y="207.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">(2,2,0)</text>
  <circle cx="480.0" cy="176.0" r="4.5" fill="#e0645c"/>
  <text x="480.0" y="165.0" fill="#e0645c" font-size="11" text-anchor="middle">Q3</text>
  <text x="480.0" y="194.0" fill="#e0645c" font-size="10.5" text-anchor="middle">L=4</text>
  <text x="480.0" y="207.0" fill="#e0645c" font-size="10.5" text-anchor="middle">(2,3,0)</text>
  <circle cx="150.0" cy="256.0" r="4.5" fill="#4a90d9"/>
  <text x="150.0" y="245.0" fill="#4a90d9" font-size="11" text-anchor="middle">R1</text>
  <text x="150.0" y="274.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">L=1</text>
  <text x="150.0" y="287.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">(0,0,1)</text>
  <circle cx="560.0" cy="256.0" r="4.5" fill="#4a90d9"/>
  <text x="560.0" y="245.0" fill="#4a90d9" font-size="11" text-anchor="middle">R2</text>
  <text x="560.0" y="274.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">L=5</text>
  <text x="560.0" y="287.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">(2,3,2)</text>
  <circle cx="630.0" cy="256.0" r="4.5" fill="#4a90d9"/>
  <text x="630.0" y="245.0" fill="#4a90d9" font-size="11" text-anchor="middle">R3</text>
  <text x="630.0" y="274.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">L=6</text>
  <text x="630.0" y="287.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">(2,3,3)</text>
  <line x1="300.0" y1="96.0" x2="370.0" y2="176.0" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="370.0,176.0 366.9,165.6 360.1,171.5" fill="#e0645c"/>
  <text x="306.0" y="138.0" fill="#e0645c" font-size="10">m1</text>
  <line x1="480.0" y1="176.0" x2="560.0" y2="256.0" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="560.0,256.0 556.2,245.8 549.8,252.2" fill="#e0645c"/>
  <text x="486.0" y="218.0" fill="#e0645c" font-size="10">m2</text>
  <line x1="30.0" y1="296.0" x2="670.0" y2="296.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="30.0" y="314.0" fill="#e0645c" font-size="11.5">P3 and Q3 are concurrent: neither vector dominates. Lamport still says 3 &lt; 4.</text>
  <text x="30.0" y="331.0" fill="#8a8a8a" font-size="11.5">Lamport orders every pair; vectors order only the pairs that really are ordered.</text>
</svg>
