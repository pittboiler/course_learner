<svg viewBox="0 0 700 376" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">A double spend is a race: the attacker must out-mine the honest chain from behind</text>
  <rect x="60.0" y="110.0" width="52.0" height="34.0" fill="none" stroke="#8a8a8a" stroke-width="1.8" rx="3"/>
  <text x="86.0" y="132.0" fill="#8a8a8a" font-size="12" text-anchor="middle">0</text>
  <rect x="126.0" y="110.0" width="52.0" height="34.0" fill="none" stroke="#4a90d9" stroke-width="1.8" rx="3"/>
  <text x="152.0" y="132.0" fill="#4a90d9" font-size="12" text-anchor="middle">1</text>
  <line x1="112.0" y1="127.0" x2="124.0" y2="127.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="124.0,127.0 115.2,123.0 115.2,131.0" fill="#8a8a8a"/>
  <rect x="192.0" y="110.0" width="52.0" height="34.0" fill="none" stroke="#4a90d9" stroke-width="1.8" rx="3"/>
  <text x="218.0" y="132.0" fill="#4a90d9" font-size="12" text-anchor="middle">2</text>
  <line x1="178.0" y1="127.0" x2="190.0" y2="127.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="190.0,127.0 181.2,123.0 181.2,131.0" fill="#8a8a8a"/>
  <rect x="258.0" y="110.0" width="52.0" height="34.0" fill="none" stroke="#4a90d9" stroke-width="1.8" rx="3"/>
  <text x="284.0" y="132.0" fill="#4a90d9" font-size="12" text-anchor="middle">3</text>
  <line x1="244.0" y1="127.0" x2="256.0" y2="127.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="256.0,127.0 247.2,123.0 247.2,131.0" fill="#8a8a8a"/>
  <rect x="324.0" y="110.0" width="52.0" height="34.0" fill="none" stroke="#4a90d9" stroke-width="1.8" rx="3"/>
  <text x="350.0" y="132.0" fill="#4a90d9" font-size="12" text-anchor="middle">4</text>
  <line x1="310.0" y1="127.0" x2="322.0" y2="127.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="322.0,127.0 313.2,123.0 313.2,131.0" fill="#8a8a8a"/>
  <rect x="390.0" y="110.0" width="52.0" height="34.0" fill="none" stroke="#4a90d9" stroke-width="1.8" rx="3"/>
  <text x="416.0" y="132.0" fill="#4a90d9" font-size="12" text-anchor="middle">5</text>
  <line x1="376.0" y1="127.0" x2="388.0" y2="127.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="388.0,127.0 379.2,123.0 379.2,131.0" fill="#8a8a8a"/>
  <text x="284.0" y="94.0" fill="#4a90d9" font-size="11" text-anchor="middle">honest chain, 5 blocks ahead</text>
  <rect x="126.0" y="190.0" width="52.0" height="34.0" fill="none" stroke="#e0645c" stroke-width="1.8" rx="3"/>
  <text x="152.0" y="212.0" fill="#e0645c" font-size="12" text-anchor="middle">1&#x27;</text>
  <rect x="192.0" y="190.0" width="52.0" height="34.0" fill="none" stroke="#e0645c" stroke-width="1.8" rx="3"/>
  <text x="218.0" y="212.0" fill="#e0645c" font-size="12" text-anchor="middle">2&#x27;</text>
  <line x1="178.0" y1="207.0" x2="190.0" y2="207.0" stroke="#e0645c" stroke-width="1.2"/>
  <polygon points="190.0,207.0 181.2,203.0 181.2,211.0" fill="#e0645c"/>
  <rect x="258.0" y="190.0" width="52.0" height="34.0" fill="none" stroke="#e0645c" stroke-width="1.8" rx="3"/>
  <text x="284.0" y="212.0" fill="#e0645c" font-size="12" text-anchor="middle">3&#x27;</text>
  <line x1="244.0" y1="207.0" x2="256.0" y2="207.0" stroke="#e0645c" stroke-width="1.2"/>
  <polygon points="256.0,207.0 247.2,203.0 247.2,211.0" fill="#e0645c"/>
  <line x1="86.0" y1="144.0" x2="124.0" y2="207.0" stroke="#e0645c" stroke-width="1.2"/>
  <polygon points="124.0,207.0 122.9,197.4 116.0,201.5" fill="#e0645c"/>
  <text x="218.0" y="244.0" fill="#e0645c" font-size="11" text-anchor="middle">attacker&#x27;s private chain, 2 behind</text>
  <text x="444.0" y="96.0" fill="#8a8a8a" font-size="11">blocks to wait for a</text>
  <text x="444.0" y="112.0" fill="#8a8a8a" font-size="11">1-in-1000 reversal risk</text>
  <text x="444.0" y="140.0" fill="#8a8a8a" font-size="10.5">attacker share</text>
  <text x="584.0" y="140.0" fill="#8a8a8a" font-size="10.5">blocks</text>
  <text x="444.0" y="162.0" fill="#4a90d9" font-size="11">10%</text>
  <text x="584.0" y="162.0" fill="#4a90d9" font-size="11">5</text>
  <text x="444.0" y="184.0" fill="#4a90d9" font-size="11">20%</text>
  <text x="584.0" y="184.0" fill="#4a90d9" font-size="11">11</text>
  <text x="444.0" y="206.0" fill="#4a90d9" font-size="11">30%</text>
  <text x="584.0" y="206.0" fill="#4a90d9" font-size="11">24</text>
  <text x="444.0" y="228.0" fill="#e0645c" font-size="11">40%</text>
  <text x="584.0" y="228.0" fill="#e0645c" font-size="11">89</text>
  <text x="444.0" y="250.0" fill="#e0645c" font-size="11">45%</text>
  <text x="584.0" y="250.0" fill="#e0645c" font-size="11">340</text>
  <text x="24.0" y="300.0" fill="#8a8a8a" font-size="10.5">The chain with the most work wins, so the attacker needs a run of luck that lasts. Each extra block</text>
  <text x="24.0" y="318.0" fill="#8a8a8a" font-size="10.5">makes that exponentially less likely - as long as the attacker holds under half the hash power.</text>
  <text x="24.0" y="344.0" fill="#e0645c" font-size="10.5">At 50 percent the exponential decay flattens and no waiting time is enough. Nothing is ever final;</text>
  <text x="24.0" y="362.0" fill="#e0645c" font-size="10.5">it only gets cheap enough to ignore.</text>
</svg>
