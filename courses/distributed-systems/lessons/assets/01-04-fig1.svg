<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">NTP&#x27;s four timestamps, and the uncertainty the round trip leaves behind</text>
  <text x="112.0" y="114.2" fill="#8a8a8a" font-size="12" text-anchor="end">client</text>
  <line x1="120.0" y1="110.0" x2="600.0" y2="110.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="600.0,110.0 590.1,105.5 590.1,114.5" fill="#8a8a8a"/>
  <text x="112.0" y="200.2" fill="#8a8a8a" font-size="12" text-anchor="end">server</text>
  <line x1="120.0" y1="196.0" x2="600.0" y2="196.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="600.0,196.0 590.1,191.5 590.1,200.5" fill="#8a8a8a"/>
  <line x1="190.0" y1="110.0" x2="330.0" y2="196.0" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="330.0,196.0 323.9,187.0 319.2,194.7" fill="#e0645c"/>
  <line x1="390.0" y1="196.0" x2="540.0" y2="110.0" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="540.0,110.0 529.2,111.0 533.6,118.8" fill="#e0645c"/>
  <circle cx="190.0" cy="110.0" r="4.5" fill="#4a90d9"/>
  <text x="190.0" y="98.0" fill="#4a90d9" font-size="12" text-anchor="middle">T1</text>
  <text x="190.0" y="83.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">100.000</text>
  <circle cx="330.0" cy="196.0" r="4.5" fill="#4a90d9"/>
  <text x="330.0" y="216.0" fill="#4a90d9" font-size="12" text-anchor="middle">T2</text>
  <text x="330.0" y="231.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">100.030</text>
  <circle cx="390.0" cy="196.0" r="4.5" fill="#4a90d9"/>
  <text x="390.0" y="216.0" fill="#4a90d9" font-size="12" text-anchor="middle">T3</text>
  <text x="390.0" y="231.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">100.032</text>
  <circle cx="540.0" cy="110.0" r="4.5" fill="#4a90d9"/>
  <text x="540.0" y="98.0" fill="#4a90d9" font-size="12" text-anchor="middle">T4</text>
  <text x="540.0" y="83.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">100.050</text>
  <text x="236.0" y="144.0" fill="#e0645c" font-size="11">request</text>
  <text x="444.0" y="144.0" fill="#e0645c" font-size="11">reply</text>
  <text x="40.0" y="262.0" fill="#8a8a8a" font-size="12">round-trip delay</text>
  <text x="40.0" y="282.0" fill="#4a90d9" font-size="12">d = (T4 - T1) - (T3 - T2) = 50 - 2 = 48 ms</text>
  <text x="40.0" y="310.0" fill="#8a8a8a" font-size="12">estimated offset</text>
  <text x="40.0" y="330.0" fill="#4a90d9" font-size="12">o = ((T2 - T1) + (T3 - T4)) / 2 = (30 - 18)/2 = +6 ms</text>
  <text x="392.0" y="262.0" fill="#8a8a8a" font-size="12">true offset lies in</text>
  <line x1="400.0" y1="300.0" x2="660.0" y2="300.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="400.0" y1="292.0" x2="400.0" y2="308.0" stroke="#e0645c" stroke-width="2"/>
  <line x1="660.0" y1="292.0" x2="660.0" y2="308.0" stroke="#e0645c" stroke-width="2"/>
  <circle cx="465.0" cy="300.0" r="4.5" fill="#4a90d9"/>
  <text x="400.0" y="326.0" fill="#e0645c" font-size="11" text-anchor="middle">-18 ms</text>
  <text x="660.0" y="326.0" fill="#e0645c" font-size="11" text-anchor="middle">+30 ms</text>
  <text x="465.0" y="286.0" fill="#4a90d9" font-size="11" text-anchor="middle">+6</text>
  <text x="392.0" y="348.0" fill="#8a8a8a" font-size="10.5">width d = 48 ms: the round trip cannot say how it split</text>
</svg>
