  <rect x="48.0" y="150.0" width="34.0" height="34.0" fill="none" stroke="#8a8a8a" stroke-width="1.1" rx="3"/>
  <rect x="90.0" y="150.0" width="34.0" height="34.0" fill="none" stroke="#4a90d9" stroke-width="1.8" rx="3"/>
