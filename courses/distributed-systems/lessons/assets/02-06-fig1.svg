  <circle cx="107.0" cy="209.0" r="6" fill="#e0645c"/>
  <rect x="132.0" y="192.0" width="34.0" height="34.0" fill="none" stroke="#4a90d9" stroke-width="1.8" rx="3"/>
  <rect x="174.0" y="192.0" width="34.0" height="34.0" fill="none" stroke="#4a90d9" stroke-width="1.8" rx="3"/>
