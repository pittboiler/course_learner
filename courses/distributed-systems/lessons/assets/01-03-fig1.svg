<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">How many times the operation actually runs, in each of the three worlds</text>
  <text x="276.0" y="64.0" fill="#8a8a8a" font-size="11" text-anchor="middle">request lost</text>
  <line x1="196.0" y1="74.0" x2="196.0" y2="278.0" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="436.0" y="64.0" fill="#8a8a8a" font-size="11" text-anchor="middle">crash after applying</text>
  <line x1="356.0" y1="74.0" x2="356.0" y2="278.0" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="596.0" y="64.0" fill="#8a8a8a" font-size="11" text-anchor="middle">reply lost</text>
  <line x1="516.0" y1="74.0" x2="516.0" y2="278.0" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="676.0" y1="74.0" x2="676.0" y2="278.0" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="10.0" y1="92.0" x2="676.0" y2="92.0" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="14.0" y="121.0" fill="#8a8a8a" font-size="12">at-most-once</text>
  <text x="14.0" y="137.0" fill="#8a8a8a" font-size="10.5">send once, never retry</text>
  <text x="276.0" y="131.0" fill="#e0645c" font-size="22" text-anchor="middle">0</text>
  <text x="436.0" y="131.0" fill="#4a90d9" font-size="22" text-anchor="middle">1</text>
  <text x="596.0" y="131.0" fill="#4a90d9" font-size="22" text-anchor="middle">1</text>
  <line x1="10.0" y1="154.0" x2="676.0" y2="154.0" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="14.0" y="183.0" fill="#e0645c" font-size="12">at-least-once</text>
  <text x="14.0" y="199.0" fill="#8a8a8a" font-size="10.5">retry until a reply arrives</text>
  <text x="276.0" y="193.0" fill="#4a90d9" font-size="22" text-anchor="middle">1</text>
  <text x="436.0" y="193.0" fill="#e0645c" font-size="22" text-anchor="middle">2</text>
  <text x="596.0" y="193.0" fill="#e0645c" font-size="22" text-anchor="middle">2</text>
  <line x1="10.0" y1="216.0" x2="676.0" y2="216.0" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="14.0" y="245.0" fill="#4a90d9" font-size="12">at-least-once + dedup</text>
  <text x="14.0" y="261.0" fill="#8a8a8a" font-size="10.5">retry, server drops repeats</text>
  <text x="276.0" y="255.0" fill="#4a90d9" font-size="22" text-anchor="middle">1</text>
  <text x="436.0" y="255.0" fill="#4a90d9" font-size="22" text-anchor="middle">1</text>
  <text x="596.0" y="255.0" fill="#4a90d9" font-size="22" text-anchor="middle">1</text>
  <line x1="10.0" y1="278.0" x2="676.0" y2="278.0" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="14.0" y="308.0" fill="#8a8a8a" font-size="11.5">Only the bottom row runs the operation exactly once in every world -</text>
  <text x="14.0" y="326.0" fill="#8a8a8a" font-size="11.5">and only if the server&#x27;s record of seen request ids survives its own crash.</text>
</svg>
