<svg viewBox="0 0 700 388" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Two-phase commit, with the uncertainty window a participant cannot escape</text>
  <text x="142.0" y="98.2" fill="#8a8a8a" font-size="12" text-anchor="end">coordinator</text>
  <line x1="150.0" y1="94.0" x2="650.0" y2="94.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="650.0,94.0 640.1,89.5 640.1,98.5" fill="#8a8a8a"/>
  <text x="142.0" y="194.2" fill="#8a8a8a" font-size="12" text-anchor="end">P1</text>
  <line x1="150.0" y1="190.0" x2="650.0" y2="190.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="650.0,190.0 640.1,185.5 640.1,194.5" fill="#8a8a8a"/>
  <text x="142.0" y="272.2" fill="#8a8a8a" font-size="12" text-anchor="end">P2</text>
  <line x1="150.0" y1="268.0" x2="650.0" y2="268.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="650.0,268.0 640.1,263.5 640.1,272.5" fill="#8a8a8a"/>
  <line x1="210.0" y1="94.0" x2="254.0" y2="190.0" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="254.0,190.0 254.0,179.1 245.8,182.9" fill="#e0645c"/>
  <line x1="210.0" y1="94.0" x2="262.0" y2="268.0" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="262.0,268.0 263.5,257.2 254.9,259.8" fill="#e0645c"/>
  <text x="166.0" y="118.0" fill="#e0645c" font-size="10.5">prepare</text>
  <line x1="282.0" y1="190.0" x2="326.0" y2="94.0" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="326.0,94.0 317.8,101.1 326.0,104.9" fill="#4a90d9"/>
  <line x1="290.0" y1="268.0" x2="334.0" y2="94.0" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="334.0,94.0 327.2,102.5 335.9,104.7" fill="#4a90d9"/>
  <text x="330.0" y="116.0" fill="#4a90d9" font-size="10.5">vote yes</text>
  <rect x="282.0" y="176.0" width="244.0" height="28.0" fill="none" stroke="#e0645c" stroke-width="1.6" stroke-dasharray="5 4" rx="3"/>
  <text x="404.0" y="168.0" fill="#e0645c" font-size="10.5" text-anchor="middle">uncertainty window: P1 has voted yes and cannot decide alone</text>
  <text x="276.0" y="220.0" fill="#8a8a8a" font-size="10">force-write prepare record</text>
  <text x="352.0" y="76.0" fill="#8a8a8a" font-size="10">force-write decision</text>
  <line x1="430.0" y1="94.0" x2="474.0" y2="190.0" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="474.0,190.0 474.0,179.1 465.8,182.9" fill="#e0645c"/>
  <line x1="430.0" y1="94.0" x2="482.0" y2="268.0" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="482.0,268.0 483.5,257.2 474.9,259.8" fill="#e0645c"/>
  <text x="398.0" y="140.0" fill="#e0645c" font-size="10.5">commit</text>
  <line x1="526.0" y1="190.0" x2="570.0" y2="94.0" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="570.0,94.0 561.8,101.1 570.0,104.9" fill="#4a90d9"/>
  <line x1="534.0" y1="268.0" x2="578.0" y2="94.0" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="578.0,94.0 571.2,102.5 579.9,104.7" fill="#4a90d9"/>
  <text x="578.0" y="138.0" fill="#4a90d9" font-size="10.5">ack</text>
  <line x1="30.0" y1="312.0" x2="670.0" y2="312.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="30.0" y="332.0" fill="#e0645c" font-size="10.5">If the coordinator crashes anywhere inside the dashed box, P1 is stuck: it may not abort, because</text>
  <text x="30.0" y="350.0" fill="#e0645c" font-size="10.5">the coordinator may have decided commit, and it may not commit, because someone may have voted no.</text>
  <text x="30.0" y="378.0" fill="#4a90d9" font-size="11">2PC needs every participant to agree. Consensus needs a majority. That is the whole difference.</text>
</svg>
