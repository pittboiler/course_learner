  <text x="24.0" y="336.0" fill="#4a90d9" font-size="10.5">Consistent: P1 P2 P3 | Q1 | R1 R2.  Message a was sent inside and not yet received - it is in flight.</text>
  <text x="24.0" y="354.0" fill="#e0645c" font-size="10.5">Inconsistent: P1 | Q1 Q2 Q3 | R1 R2.  It contains Q2, the receipt of a, without P2, the send.</text>
