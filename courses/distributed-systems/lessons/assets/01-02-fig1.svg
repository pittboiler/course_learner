<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">The failure-model lattice: each step up admits more behaviour and costs more replicas</text>
  <rect x="40.0" y="58.0" width="380.0" height="46.0" fill="none" stroke="#e0645c" stroke-width="1.8" rx="5"/>
  <text x="52.0" y="78.0" fill="#e0645c">Byzantine (arbitrary)</text>
  <text x="52.0" y="96.0" fill="#8a8a8a" font-size="11">a node may do anything, including lie</text>
  <text x="442.0" y="87.0" fill="#e0645c" font-size="12">n ≥ 3f + 1</text>
  <line x1="230.0" y1="124.0" x2="230.0" y2="108.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="230.0,108.0 225.5,117.9 234.5,117.9" fill="#8a8a8a"/>
  <rect x="40.0" y="124.0" width="380.0" height="46.0" fill="none" stroke="#8a8a8a" stroke-width="1.8" rx="5"/>
  <text x="52.0" y="144.0" fill="#8a8a8a">timing</text>
  <text x="52.0" y="162.0" fill="#8a8a8a" font-size="11">replies, but too late or too early</text>
  <text x="442.0" y="153.0" fill="#8a8a8a" font-size="12">n ≥ 2f + 1</text>
  <line x1="230.0" y1="190.0" x2="230.0" y2="174.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="230.0,174.0 225.5,183.9 234.5,183.9" fill="#8a8a8a"/>
  <rect x="40.0" y="190.0" width="380.0" height="46.0" fill="none" stroke="#8a8a8a" stroke-width="1.8" rx="5"/>
  <text x="52.0" y="210.0" fill="#8a8a8a">omission</text>
  <text x="52.0" y="228.0" fill="#8a8a8a" font-size="11">sometimes drops a message it should send or receive</text>
  <text x="442.0" y="219.0" fill="#8a8a8a" font-size="12">n ≥ 2f + 1</text>
  <line x1="230.0" y1="256.0" x2="230.0" y2="240.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="230.0,240.0 225.5,249.9 234.5,249.9" fill="#8a8a8a"/>
  <rect x="40.0" y="256.0" width="380.0" height="46.0" fill="none" stroke="#4a90d9" stroke-width="1.8" rx="5"/>
  <text x="52.0" y="276.0" fill="#4a90d9">crash-recovery</text>
  <text x="52.0" y="294.0" fill="#8a8a8a" font-size="11">stops, then restarts with whatever it made durable</text>
  <text x="442.0" y="285.0" fill="#4a90d9" font-size="12">n ≥ 2f + 1</text>
  <line x1="230.0" y1="322.0" x2="230.0" y2="306.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="230.0,306.0 225.5,315.9 234.5,315.9" fill="#8a8a8a"/>
  <rect x="40.0" y="322.0" width="380.0" height="46.0" fill="none" stroke="#4a90d9" stroke-width="1.8" rx="5"/>
  <text x="52.0" y="342.0" fill="#4a90d9">crash-stop</text>
  <text x="52.0" y="360.0" fill="#8a8a8a" font-size="11">stops, and never comes back</text>
  <text x="442.0" y="351.0" fill="#4a90d9" font-size="12">n ≥ 2f + 1</text>
  <text x="442.0" y="44.0" fill="#8a8a8a" font-size="11">replicas to tolerate f</text>
  <line x1="30.0" y1="390.0" x2="670.0" y2="390.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="30.0" y="408.0" fill="#8a8a8a" font-size="10.5">Weaker assumption = more behaviour admitted = harder to tolerate. Choose the lowest box you can defend.</text>
</svg>
