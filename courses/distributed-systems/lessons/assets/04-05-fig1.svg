<svg viewBox="0 0 700 396" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Three nodes, one liar: two worlds that L1 cannot tell apart</text>
  <text x="24.0" y="58.0" fill="#e0645c" font-size="12">world A: the commander lies</text>
  <rect x="102.0" y="78.0" width="104.0" height="34.0" fill="none" stroke="#e0645c" stroke-width="1.5" rx="4"/>
  <text x="154.0" y="98.8" fill="#e0645c" font-size="11" text-anchor="middle">commander</text>
  <rect x="32.0" y="218.0" width="88.0" height="34.0" fill="none" stroke="#4a90d9" stroke-width="1.5" rx="4"/>
  <text x="76.0" y="238.8" fill="#4a90d9" font-size="11" text-anchor="middle">L1</text>
  <rect x="200.0" y="218.0" width="88.0" height="34.0" fill="none" stroke="#4a90d9" stroke-width="1.5" rx="4"/>
  <text x="244.0" y="238.8" fill="#4a90d9" font-size="11" text-anchor="middle">L2</text>
  <line x1="124.0" y1="112.0" x2="86.0" y2="218.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="86.0,218.0 93.6,210.2 85.1,207.2" fill="#8a8a8a"/>
  <text x="32.0" y="168.0" fill="#8a8a8a" font-size="10">attack</text>
  <line x1="184.0" y1="112.0" x2="244.0" y2="218.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="244.0,218.0 243.0,207.2 235.2,211.6" fill="#8a8a8a"/>
  <text x="200.0" y="168.0" fill="#8a8a8a" font-size="10">retreat</text>
  <line x1="200.0" y1="240.0" x2="120.0" y2="240.0" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="120.0,240.0 129.9,244.5 129.9,235.5" fill="#e0645c"/>
  <text x="160.0" y="266.0" fill="#e0645c" font-size="10" text-anchor="middle">C said retreat</text>
  <line x1="350.0" y1="52.0" x2="350.0" y2="300.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="374.0" y="58.0" fill="#e0645c" font-size="12">world B: L2 lies</text>
  <rect x="452.0" y="78.0" width="104.0" height="34.0" fill="none" stroke="#4a90d9" stroke-width="1.5" rx="4"/>
  <text x="504.0" y="98.8" fill="#4a90d9" font-size="11" text-anchor="middle">commander</text>
  <rect x="382.0" y="218.0" width="88.0" height="34.0" fill="none" stroke="#4a90d9" stroke-width="1.5" rx="4"/>
  <text x="426.0" y="238.8" fill="#4a90d9" font-size="11" text-anchor="middle">L1</text>
  <rect x="550.0" y="218.0" width="88.0" height="34.0" fill="none" stroke="#e0645c" stroke-width="1.5" rx="4"/>
  <text x="594.0" y="238.8" fill="#e0645c" font-size="11" text-anchor="middle">L2</text>
  <line x1="474.0" y1="112.0" x2="436.0" y2="218.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="436.0,218.0 443.6,210.2 435.1,207.2" fill="#8a8a8a"/>
  <text x="382.0" y="168.0" fill="#8a8a8a" font-size="10">attack</text>
  <line x1="534.0" y1="112.0" x2="594.0" y2="218.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="594.0,218.0 593.0,207.2 585.2,211.6" fill="#8a8a8a"/>
  <text x="550.0" y="168.0" fill="#8a8a8a" font-size="10">attack</text>
  <line x1="550.0" y1="240.0" x2="470.0" y2="240.0" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="470.0,240.0 479.9,244.5 479.9,235.5" fill="#e0645c"/>
  <text x="510.0" y="266.0" fill="#e0645c" font-size="10" text-anchor="middle">C said retreat</text>
  <rect x="24.0" y="284.0" width="300.0" height="30.0" fill="none" stroke="#4a90d9" stroke-width="1.7" rx="4"/>
  <rect x="374.0" y="284.0" width="300.0" height="30.0" fill="none" stroke="#4a90d9" stroke-width="1.7" rx="4"/>
  <text x="174.0" y="304.0" fill="#4a90d9" font-size="11" text-anchor="middle">L1 sees: attack from C, retreat from L2</text>
  <text x="524.0" y="304.0" fill="#4a90d9" font-size="11" text-anchor="middle">L1 sees: attack from C, retreat from L2</text>
  <text x="24.0" y="340.0" fill="#8a8a8a" font-size="10.5">In world B the commander is loyal and said attack, so validity forces L1 to attack - and L1 cannot</text>
  <text x="24.0" y="358.0" fill="#8a8a8a" font-size="10.5">distinguish the worlds, so it attacks in A too. The mirror argument forces L2 to retreat in A.</text>
  <text x="24.0" y="382.0" fill="#e0645c" font-size="11.5">Three nodes cannot tolerate one liar. The bound is n &gt;= 3f + 1.</text>
</svg>
