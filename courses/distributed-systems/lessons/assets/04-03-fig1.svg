  <text x="596.0" y="131.0" fill="#e0645c" font-size="11">straggler</text>
  <text x="596.0" y="147.0" fill="#e0645c" font-size="10">run a backup copy</text>
  <text x="620.0" y="200.0" fill="#8a8a8a" font-size="12" text-anchor="middle">M x R</text>
  <text x="620.0" y="216.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">transfers</text>
  <text x="24.0" y="330.0" fill="#8a8a8a" font-size="11">Fault tolerance is re-execution: a failed or slow task is simply run again somewhere else.</text>
  <text x="24.0" y="352.0" fill="#e0645c" font-size="11">That only works because map and reduce are deterministic and write their output atomically -</text>
  <text x="24.0" y="372.0" fill="#e0645c" font-size="11">the same requirement a replicated state machine has, for the same reason.</text>
