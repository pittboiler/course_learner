<svg viewBox="0 0 700 392" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">3PC unblocks a crash and breaks under a partition; a replicated coordinator does neither</text>
  <text x="24.0" y="58.0" fill="#e0645c" font-size="12">three-phase commit, partitioned</text>
  <line x1="350.0" y1="72.0" x2="350.0" y2="200.0" stroke="#e0645c" stroke-width="2.4" stroke-dasharray="8 5"/>
  <rect x="56.0" y="80.0" width="250.0" height="104.0" fill="none" stroke="#8a8a8a" stroke-width="1.6" rx="6"/>
  <rect x="394.0" y="80.0" width="250.0" height="104.0" fill="none" stroke="#8a8a8a" stroke-width="1.6" rx="6"/>
  <text x="181.0" y="104.0" fill="#4a90d9" font-size="11.5" text-anchor="middle">P1, P2 in PRE-COMMIT</text>
  <text x="181.0" y="128.0" fill="#8a8a8a" font-size="10" text-anchor="middle">so everyone must have voted yes</text>
  <text x="181.0" y="160.0" fill="#e0645c" text-anchor="middle">decides COMMIT</text>
  <text x="519.0" y="104.0" fill="#4a90d9" font-size="11.5" text-anchor="middle">P3, P4 only PREPARED</text>
  <text x="519.0" y="128.0" fill="#8a8a8a" font-size="10" text-anchor="middle">so nobody can have committed</text>
  <text x="519.0" y="160.0" fill="#e0645c" text-anchor="middle">decides ABORT</text>
  <text x="350.0" y="198.0" fill="#e0645c" font-size="10" text-anchor="middle">partition</text>
  <text x="350.0" y="222.0" fill="#e0645c" font-size="11" text-anchor="middle">Both rules are sound; applied on two sides they disagree. Atomicity is gone.</text>
  <line x1="24.0" y1="246.0" x2="676.0" y2="246.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="24.0" y="272.0" fill="#4a90d9" font-size="12">consensus-backed commit</text>
  <rect x="268.0" y="286.0" width="164.0" height="34.0" fill="none" stroke="#8a8a8a" stroke-width="1.5" rx="4"/>
  <text x="350.0" y="306.9" fill="#8a8a8a" font-size="11" text-anchor="middle">participants</text>
  <line x1="350.0" y1="320.0" x2="350.0" y2="344.0" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="350.0,344.0 354.5,334.1 345.5,334.1" fill="#e0645c"/>
  <text x="360.0" y="338.0" fill="#e0645c" font-size="10">votes</text>
  <rect x="180.0" y="344.0" width="340.0" height="34.0" fill="none" stroke="#4a90d9" stroke-width="2.0" rx="5"/>
  <text x="350.0" y="366.0" fill="#4a90d9" font-size="11" text-anchor="middle">replicated log holds the decision, on a majority</text>
  <text x="24.0" y="390.0" fill="#8a8a8a" font-size="10.5">A minority partition cannot decide anything, so there is no second answer to disagree with.</text>
</svg>
