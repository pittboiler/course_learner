  <text x="496.0" y="260.0" fill="#e0645c" font-size="11">lost</text>
  <text x="578.0" y="282.0" fill="#8a8a8a" font-size="11">no reply</text>
  <line x1="20.0" y1="342.0" x2="680.0" y2="342.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="20.0" y="360.0" fill="#8a8a8a" font-size="12">The client sees the same thing in all three. No timeout separates them.</text>
