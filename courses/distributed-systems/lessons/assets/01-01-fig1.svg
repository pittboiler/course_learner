  <text x="316.0" y="118.0" fill="#e0645c" font-size="11">never arrives</text>
  <text x="578.0" y="98.0" fill="#8a8a8a" font-size="11">no reply</text>
  <text x="14.0" y="150.0" fill="#8a8a8a" font-size="12">(b) the server crashed after applying it</text>
  <text x="142.0" y="170.2" fill="#8a8a8a" font-size="12" text-anchor="end">client</text>
  <line x1="150.0" y1="166.0" x2="560.0" y2="166.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="560.0,166.0 550.1,161.5 550.1,170.5" fill="#8a8a8a"/>
  <text x="142.0" y="210.2" fill="#8a8a8a" font-size="12" text-anchor="end">server</text>
  <line x1="150.0" y1="206.0" x2="560.0" y2="206.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="560.0,206.0 550.1,201.5 550.1,210.5" fill="#8a8a8a"/>
  <circle cx="200.0" cy="166.0" r="4" fill="#4a90d9"/>
  <line x1="200.0" y1="166.0" x2="300.0" y2="206.0" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="300.0,206.0 292.5,198.1 289.1,206.5" fill="#e0645c"/>
