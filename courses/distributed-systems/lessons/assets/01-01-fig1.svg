  <circle cx="300.0" cy="206.0" r="4" fill="#4a90d9"/>
  <text x="312.0" y="222.0" fill="#4a90d9" font-size="11">applied</text>
  <line x1="386.0" y1="200.0" x2="398.0" y2="212.0" stroke="#e0645c" stroke-width="2.0"/>
  <line x1="386.0" y1="212.0" x2="398.0" y2="200.0" stroke="#e0645c" stroke-width="2.0"/>
  <text x="406.0" y="210.0" fill="#e0645c" font-size="11">crash</text>
  <text x="578.0" y="190.0" fill="#8a8a8a" font-size="11">no reply</text>
  <text x="14.0" y="242.0" fill="#8a8a8a" font-size="12">(c) the reply was lost</text>
  <text x="142.0" y="262.2" fill="#8a8a8a" font-size="12" text-anchor="end">client</text>
  <line x1="150.0" y1="258.0" x2="560.0" y2="258.0" stroke="#8a8a8a" stroke-width="1.5"/>
