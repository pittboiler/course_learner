<svg viewBox="0 0 380 340" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="380" height="340" fill="#ffffff"/>

  <!-- light grid -->
  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="80" y1="60" x2="80" y2="300"/>
    <line x1="120" y1="60" x2="120" y2="300"/>
    <line x1="160" y1="60" x2="160" y2="300"/>
    <line x1="200" y1="60" x2="200" y2="300"/>
    <line x1="240" y1="60" x2="240" y2="300"/>
    <line x1="280" y1="60" x2="280" y2="300"/>
    <line x1="40" y1="260" x2="280" y2="260"/>
    <line x1="40" y1="220" x2="280" y2="220"/>
    <line x1="40" y1="180" x2="280" y2="180"/>
    <line x1="40" y1="140" x2="280" y2="140"/>
    <line x1="40" y1="100" x2="280" y2="100"/>
    <line x1="40" y1="60"  x2="280" y2="60"/>
  </g>

  <!-- axes -->
  <g stroke="#333333" stroke-width="2">
    <line x1="40" y1="300" x2="300" y2="300"/>
    <line x1="40" y1="300" x2="40" y2="50"/>
  </g>
  <polygon points="300,300 292,296 292,304" fill="#333333"/>
  <polygon points="40,50 36,58 44,58" fill="#333333"/>
  <text x="305" y="304" font-family="sans-serif" font-size="13" fill="#333333">x</text>
  <text x="33" y="46" font-family="sans-serif" font-size="13" fill="#333333">y</text>

  <!-- mirror line y = x, dashed -->
  <line x1="40" y1="300" x2="280" y2="60" stroke="#888888" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="255" y="55" font-family="sans-serif" font-size="13" fill="#888888" font-style="italic">y = x</text>

  <!-- original triangle ABC: A(1,2) B(4,3) C(2,5) -->
  <polygon points="80,220 200,180 120,100" fill="#2b6cb0" fill-opacity="0.18" stroke="#2b6cb0" stroke-width="2.5"/>
  <g fill="#2b6cb0">
    <circle cx="80" cy="220" r="3.5"/>
    <circle cx="200" cy="180" r="3.5"/>
    <circle cx="120" cy="100" r="3.5"/>
  </g>
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b6cb0">
    <text x="66" y="224">A</text>
    <text x="206" y="178">B</text>
    <text x="108" y="96">C</text>
  </g>

  <!-- reflected triangle A'B'C': A'(2,1) B'(3,4) C'(5,2) -->
  <polygon points="120,260 160,140 240,220" fill="#c53030" fill-opacity="0.16" stroke="#c53030" stroke-width="2.5"/>
  <g fill="#c53030">
    <circle cx="120" cy="260" r="3.5"/>
    <circle cx="160" cy="140" r="3.5"/>
    <circle cx="240" cy="220" r="3.5"/>
  </g>
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#c53030">
    <text x="124" y="276">A'</text>
    <text x="164" y="138">B'</text>
    <text x="246" y="224">C'</text>
  </g>

  <!-- reflection tie-lines (A to A', C to C') perpendicular to mirror -->
  <g stroke="#c53030" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.55">
    <line x1="80" y1="220" x2="120" y2="260"/>
    <line x1="120" y1="100" x2="240" y2="220"/>
  </g>
</svg>
