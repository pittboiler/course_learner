<svg viewBox="0 0 460 240" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="460" height="240" fill="#ffffff"/>

  <!-- ===== LEFT: rectangular prism (box) ===== -->
  <text x="95" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111">Solid: box</text>

  <!-- front face -->
  <rect x="35" y="70" width="100" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <!-- top face -->
  <polygon points="35,70 65,45 165,45 135,70" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <!-- right face -->
  <polygon points="135,70 165,45 165,115 135,140" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>

  <!-- length (bottom front) -->
  <text x="85" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111">length</text>
  <!-- height (left front) -->
  <text x="22" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111" transform="rotate(-90 22 108)">height</text>
  <!-- width (top slant) -->
  <text x="163" y="58" text-anchor="start" font-family="sans-serif" font-size="12" fill="#111">width</text>

  <text x="95" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1d4ed8">surface area = sum of faces (square units)</text>
  <text x="95" y="216" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1d4ed8">volume = length × width × height (cubic units)</text>

  <!-- divider -->
  <line x1="235" y1="35" x2="235" y2="210" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- ===== RIGHT: composite plane region (rectangle + triangle) ===== -->
  <text x="350" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111">Composite region</text>

  <!-- rectangle part -->
  <rect x="285" y="90" width="90" height="60" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <!-- triangle roof on top -->
  <polygon points="285,90 375,90 330,50" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>

  <!-- base label -->
  <text x="330" y="168" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111">base = 9</text>
  <!-- rectangle height -->
  <text x="272" y="122" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111" transform="rotate(-90 272 122)">6</text>
  <!-- triangle height (dashed) -->
  <line x1="330" y1="50" x2="330" y2="90" stroke="#15803d" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="342" y="74" text-anchor="start" font-family="sans-serif" font-size="12" fill="#111">4</text>

  <text x="350" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">area = rectangle + triangle</text>
  <text x="350" y="216" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">(add the pieces, square units)</text>
</svg>
