<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="420" height="320" fill="#ffffff"/>

  <!-- Two parallel lines (horizontal) -->
  <line x1="30" y1="110" x2="390" y2="110" stroke="#111111" stroke-width="2.5"/>
  <line x1="30" y1="230" x2="390" y2="230" stroke="#111111" stroke-width="2.5"/>

  <!-- Transversal -->
  <line x1="120" y1="40" x2="300" y2="300" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Line names -->
  <text x="396" y="114" font-family="sans-serif" font-size="15" fill="#111111">m</text>
  <text x="396" y="234" font-family="sans-serif" font-size="15" fill="#111111">n</text>
  <text x="306" y="300" font-family="sans-serif" font-size="15" fill="#c0392b">t</text>

  <!-- Parallel marks (matching chevrons on both lines) -->
  <polyline points="330,102 340,110 330,118" fill="none" stroke="#111111" stroke-width="2.5"/>
  <polyline points="330,222 340,230 330,238" fill="none" stroke="#111111" stroke-width="2.5"/>

  <!-- Top intersection at (168.5, 110): angles 1,2,3,4 -->
  <text x="147" y="94" font-family="sans-serif" font-size="16" fill="#1f6fb2" font-weight="bold">1</text>
  <text x="186" y="94" font-family="sans-serif" font-size="16" fill="#1f6fb2" font-weight="bold">2</text>
  <text x="147" y="131" font-family="sans-serif" font-size="16" fill="#1f6fb2" font-weight="bold">3</text>
  <text x="190" y="131" font-family="sans-serif" font-size="16" fill="#1f6fb2" font-weight="bold">4</text>

  <!-- Bottom intersection at (251.5, 230): angles 5,6,7,8 -->
  <text x="230" y="214" font-family="sans-serif" font-size="16" fill="#1f6fb2" font-weight="bold">5</text>
  <text x="269" y="214" font-family="sans-serif" font-size="16" fill="#1f6fb2" font-weight="bold">6</text>
  <text x="230" y="251" font-family="sans-serif" font-size="16" fill="#1f6fb2" font-weight="bold">7</text>
  <text x="273" y="251" font-family="sans-serif" font-size="16" fill="#1f6fb2" font-weight="bold">8</text>
</svg>
