<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two intersecting lines crossing at a point, forming four angles labeled 1, 2, 3, and 4">
  <rect x="0" y="0" width="400" height="260" fill="#ffffff"/>
  <!-- Line AB (shallow slope) -->
  <line x1="40" y1="90" x2="360" y2="170" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Line CD (steep slope) -->
  <line x1="120" y1="30" x2="280" y2="230" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Intersection point at approximately (200,130) -->
  <circle cx="200" cy="130" r="4" fill="#1a1a1a"/>
  <!-- Angle labels: ∠1 top, ∠3 bottom (vertical pair); ∠2 right, ∠4 left (vertical pair) -->
  <text x="196" y="86" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0b5cad" text-anchor="middle">1</text>
  <text x="252" y="138" font-family="sans-serif" font-size="20" font-weight="bold" fill="#b8390e" text-anchor="middle">2</text>
  <text x="204" y="184" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0b5cad" text-anchor="middle">3</text>
  <text x="148" y="126" font-family="sans-serif" font-size="20" font-weight="bold" fill="#b8390e" text-anchor="middle">4</text>
  <!-- Line endpoint labels -->
  <text x="30" y="88" font-family="sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle">A</text>
  <text x="372" y="174" font-family="sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle">B</text>
  <text x="118" y="22" font-family="sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle">C</text>
  <text x="284" y="246" font-family="sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle">D</text>
</svg>
