  <text x="128" y="164" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b">recessive: &#8730;(&#956;/s)</text>
  <text x="150" y="316" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a6fb5">dominant: &#956;/s</text>
  <text x="180" y="412" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333" text-anchor="middle">selection coefficient s (log) &#8594;</text>
  <text x="44" y="132" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333" text-anchor="end">q&#770;</text>
  <text x="44" y="392" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666" text-anchor="end">10&#8315;&#8312;</text>
  <text x="44" y="264" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#666" text-anchor="end">10&#8315;&#8308;</text>
  <text x="14" y="60" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">&#956; = 10&#8315;&#8310;. At s = 1 the recessive sits at 10&#8315;&#179;</text>
  <text x="14" y="76" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">and the dominant at 10&#8315;&#8310; &#8212; a <tspan font-weight="bold">thousandfold</tspan> gap</text>
  <text x="14" y="92" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">for identical mutation rate and identical severity.</text>

  <rect x="14" y="418" width="380" height="0" fill="none"/>
  <rect x="330" y="120" width="106" height="270" fill="none"/>
  <rect x="14" y="118" width="0" height="0" fill="none"/>
  <rect x="325" y="130" width="112" height="140" rx="7" fill="#fdf7ee" stroke="#c9871f" stroke-width="1.5"/>
  <text x="336" y="152" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#8a5a10">Haldane&#8217;s</text>
  <text x="336" y="168" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#8a5a10">principle</text>
  <text x="336" y="192" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">Load = &#956;</text>
  <text x="336" y="212" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">for a recessive,</text>
  <text x="336" y="228" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">2&#956; for a dominant.</text>
  <text x="336" y="252" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b">Independent of s.</text>
  <text x="325" y="292" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">A milder allele sits at a</text>
  <text x="325" y="308" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">proportionally higher</text>
  <text x="325" y="324" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">frequency, and the two</text>
  <text x="325" y="340" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">effects cancel exactly.</text>

  <line x1="446" y1="34" x2="446" y2="430" stroke="#ddd" stroke-width="2"/>
  <text x="466" y="46" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Overdominance: a stable peak below 1</text>
