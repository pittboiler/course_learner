  <path d="M 500 306 L 545 274" stroke="#d1495b" stroke-width="2" marker-end="url(#w)"/>
  <path d="M 640 316 L 578 272" stroke="#d1495b" stroke-width="2" marker-end="url(#w)"/>
  <text x="560" y="420" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b" text-anchor="middle">q&#770; = s/(s+t) = 1/3</text>
  <text x="615" y="440" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">allele frequency q &#8594;</text>
  <text x="454" y="142" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333" text-anchor="end">w&#772;</text>
  <path d="M 592 200 L 592 258" stroke="#c9871f" stroke-width="2" marker-start="url(#x1)" marker-end="url(#x2)"/>
  <text x="604" y="228" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#c9871f">segregational load</text>
  <text x="466" y="70" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">The equilibrium is <tspan font-weight="bold">stable</tspan> &#8212; the population</text>
  <text x="466" y="86" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">returns after any perturbation. But the peak</text>
  <text x="466" y="102" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#c9871f">is below 1, and it cannot climb off it:</text>
  <text x="466" y="118" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">the fittest genotype is a heterozygote, which</text>
  <text x="466" y="134" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">cannot breed true.</text>
