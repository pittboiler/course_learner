  <line x1="460" y1="400" x2="460" y2="130" stroke="#333" stroke-width="1.6"/>
  <line x1="460" y1="173" x2="770" y2="173" stroke="#bbb" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="776" y="177" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#666" text-anchor="end">w&#772; = 1</text>
