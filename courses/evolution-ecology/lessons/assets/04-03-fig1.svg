  <text x="52" y="74" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#2e8b57">immigration (near)</text>
  <text x="52" y="126" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#2e8b57">(far)</text>
  <text x="196" y="80" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#d1495b">extinction (small)</text>
  <text x="196" y="150" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#d1495b">(large)</text>
  <text x="145" y="260" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">species richness S &#8594;</text>
  <text x="34" y="72" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333" text-anchor="end">rate</text>
  <text x="14" y="284" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">Near islands: higher immigration &#8594; higher S&#770;</text>
  <text x="14" y="300" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">Large islands: lower extinction &#8594; higher S&#770;</text>
  <rect x="14" y="314" width="252" height="112" rx="8" fill="#fdf7ee" stroke="#c9871f" stroke-width="1.6"/>
  <text x="26" y="336" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#8a5a10">The third prediction: TURNOVER</text>
  <text x="26" y="358" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">At equilibrium the NUMBER is constant and</text>
  <text x="26" y="374" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">the species IDENTITY keeps changing.</text>
  <text x="26" y="398" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">Simberloff and Wilson fumigated mangrove</text>
  <text x="26" y="414" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">islands: richness returned, composition did not.</text>

  <line x1="290" y1="34" x2="290" y2="430" stroke="#ddd" stroke-width="2"/>
  <text x="308" y="46" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">S = cA&#7611; &#8212; a straight line on log&#8211;log</text>
