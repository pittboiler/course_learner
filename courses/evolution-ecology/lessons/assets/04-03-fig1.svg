  <text x="430" y="260" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">log area &#8594;</text>
  <text x="324" y="72" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333" text-anchor="end">log S</text>
  <text x="420" y="120" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1a6fb5">slope = z</text>
  <text x="308" y="288" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">z &#8776; 0.15&#8211;0.25 within a continuous area;</text>
  <text x="308" y="304" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">0.25&#8211;0.35 for true islands.</text>
  <rect x="302" y="318" width="238" height="108" rx="8" fill="#fbe9eb" stroke="#d1495b" stroke-width="1.6"/>
  <text x="314" y="340" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#7a2530">Habitat loss, z = 0.25</text>
  <text x="314" y="362" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">lose 50% of area &#8594; lose <tspan font-weight="bold">16%</tspan> of species</text>
  <text x="314" y="380" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">lose 90% &#8594; lose <tspan font-weight="bold">44%</tspan></text>
  <text x="314" y="398" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">lose 99% &#8594; lose <tspan font-weight="bold">68%</tspan></text>
  <text x="314" y="420" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">and the debt is paid over DECADES.</text>

  <line x1="556" y1="34" x2="556" y2="430" stroke="#ddd" stroke-width="2"/>
  <text x="574" y="46" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Same richness, different everything else</text>
  <g>
    <text x="574" y="72" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#2e8b57">A &#8212; even</text>
    <rect x="574" y="80" width="38" height="16" fill="#2e8b57"/><rect x="616" y="80" width="38" height="16" fill="#2e8b57"/><rect x="658" y="80" width="38" height="16" fill="#2e8b57"/><rect x="700" y="80" width="38" height="16" fill="#2e8b57"/><rect x="742" y="80" width="38" height="16" fill="#2e8b57"/>
    <text x="574" y="118" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">S = 5&#160;&#160;H&#8242; = 1.61&#160;&#160;J = 1.00&#160;&#160;D = 0.80</text>

    <text x="574" y="150" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#c9871f">B &#8212; moderate</text>
    <rect x="574" y="158" width="114" height="16" fill="#c9871f"/><rect x="692" y="158" width="38" height="16" fill="#c9871f"/><rect x="734" y="158" width="19" height="16" fill="#c9871f"/><rect x="757" y="158" width="10" height="16" fill="#c9871f"/><rect x="771" y="158" width="9" height="16" fill="#c9871f"/>
    <text x="574" y="196" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">S = 5&#160;&#160;H&#8242; = 1.16&#160;&#160;J = 0.72&#160;&#160;D = 0.59</text>

    <text x="574" y="228" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">C &#8212; dominated</text>
    <rect x="574" y="236" width="190" height="16" fill="#d1495b"/><rect x="766" y="236" width="4" height="16" fill="#d1495b"/><rect x="771" y="236" width="4" height="16" fill="#d1495b"/><rect x="776" y="236" width="4" height="16" fill="#d1495b"/>
    <text x="574" y="274" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">S = 5&#160;&#160;H&#8242; = 0.39&#160;&#160;J = 0.24&#160;&#160;D = 0.15</text>
  </g>
  <text x="574" y="308" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111">Richness cannot tell these apart at all.</text>
  <text x="574" y="332" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">Simpson&#8217;s D falls faster than Shannon,</text>
  <text x="574" y="348" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">because squaring the proportions weights</text>
  <text x="574" y="364" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">the dominant heavily. Shannon weights the</text>
  <text x="574" y="380" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">rare species more.</text>
  <text x="574" y="404" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">Report richness AND evenness separately.</text>
  <text x="574" y="424" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#666">(H&#8242; is literally Shannon entropy &#8212; same formula.)</text>
</svg>