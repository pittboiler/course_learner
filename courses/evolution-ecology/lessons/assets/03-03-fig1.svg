  <text x="210" y="128" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b" text-anchor="middle">unattainable</text>
  <circle cx="72" cy="83" r="5" fill="#2e8b57"/>
  <text x="80" y="80" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#2e8b57">cod: millions of tiny eggs</text>
  <circle cx="255" cy="242" r="5" fill="#8a5a10"/>
  <text x="248" y="236" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8a5a10" text-anchor="end">elephant: one calf</text>
  <text x="165" y="270" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">investment per offspring &#8594;</text>
  <text x="54" y="72" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333" text-anchor="end">number</text>
  <text x="14" y="294" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">n = B/s &#8212; every point on the curve is available.</text>
  <text x="14" y="314" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111">Which one is chosen depends on the SHAPE of s(e):</text>
  <text x="14" y="332" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#2e8b57">decelerating returns &#8594; many small, at the minimum viable size</text>
  <text x="14" y="348" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8a5a10">threshold returns &#8594; few large, because below threshold is wasted</text>
  <text x="14" y="376" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">&#8220;Few offspring&#8221; is not a deficiency &#8212; it is a <tspan font-weight="bold">purchase</tspan>.</text>
  <text x="14" y="404" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">Optimal effort: &#8722;S&#8242;(R) = 1/V &#8212; invest now until the marginal</text>
  <text x="14" y="420" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">survival cost equals the reciprocal of the future&#8217;s worth.</text>
  <text x="14" y="440" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b">Semelparity is iteroparity with a worthless future (V = 0).</text>

