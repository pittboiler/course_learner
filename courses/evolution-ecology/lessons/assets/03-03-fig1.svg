  <text x="536" y="216" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#2e8b57">V = 0: n* = 5</text>
  <text x="536" y="196" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#c9871f">V = 2: n* = 4.5</text>
  <text x="536" y="118" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b">V = 8: n* = 3</text>
  <text x="430" y="270" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">clutch size n &#8594;</text>
  <text x="318" y="300" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">n* = 5 &#8722; 0.25V</text>
  <text x="318" y="322" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b">High adult survival &#8594; high V &#8594; SMALL clutch.</text>
  <text x="318" y="344" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">Albatross: 95% adult survival, ONE egg, skips years.</text>
  <text x="318" y="360" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">Blue tit: 50% adult survival, ten eggs.</text>
  <text x="318" y="382" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#666">This is why Lack&#8217;s optimum overpredicts clutch size:</text>
  <text x="318" y="398" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#666">it ignores V entirely.</text>

  <line x1="560" y1="34" x2="560" y2="440" stroke="#ddd" stroke-width="2"/>
  <text x="578" y="46" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Fitness multiplies, so variance is punished</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="10.5">
    <rect x="578" y="66" width="204" height="82" rx="7" fill="#fbe9eb" stroke="#d1495b" stroke-width="1.6"/>
    <text x="588" y="86" font-weight="bold" fill="#7a2530">Germinate everything</text>
    <text x="588" y="104" fill="#333">good years: 10&#160;&#160;&#183;&#160;&#160;droughts: 0</text>
    <text x="588" y="122" fill="#333">arithmetic mean = <tspan font-weight="bold">6.0</tspan></text>
    <text x="588" y="140" fill="#d1495b" font-weight="bold">geometric mean = 0 &#8594; EXTINCT</text>

    <rect x="578" y="160" width="204" height="82" rx="7" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.6"/>
    <text x="588" y="180" font-weight="bold" fill="#1f5c3a">Keep half dormant</text>
    <text x="588" y="198" fill="#333">good years: 5.45&#160;&#160;&#183;&#160;&#160;droughts: 0.45</text>
    <text x="588" y="216" fill="#333">arithmetic mean = 3.45</text>
    <text x="588" y="234" fill="#2e8b57" font-weight="bold">geometric mean = 2.01 &#8594; DOUBLES</text>
  </g>
  <text x="578" y="270" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111">The LOWER average wins.</text>
  <text x="578" y="294" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">W&#772;_g &#8776; W&#772;_a &#8722; &#963;&#178;/(2W&#772;_a)</text>
  <text x="578" y="318" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">Across generations fitness is a PRODUCT,</text>
  <text x="578" y="334" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">so one year of zero is unrecoverable no</text>
  <text x="578" y="350" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">matter how good every other year was.</text>
  <text x="578" y="376" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">Bet-hedging is not timidity. It is arithmetic.</text>
  <text x="578" y="404" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#666">(Same mathematics as the Kelly criterion:</text>
  <text x="578" y="420" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#666">a gambler who bets everything on a</text>
  <text x="578" y="436" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#666">favourable wager goes broke with p = 1.)</text>
</svg>