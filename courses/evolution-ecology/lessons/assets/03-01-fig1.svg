<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Exponential growth curves, three survivorship types, and two age pyramids illustrating demographic momentum">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="14" y="22" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">Exponential growth: flat-looking, then abrupt</text>
  <line x1="40" y1="250" x2="250" y2="250" stroke="#333" stroke-width="1.6"/>
  <line x1="40" y1="250" x2="40" y2="60" stroke="#333" stroke-width="1.6"/>
