  <text x="334" y="80" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333" text-anchor="end">log l&#8339;</text>
  <text x="435" y="270" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">age &#8594;</text>
  <text x="446" y="100" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a6fb5">I &#8212; large mammals</text>
  <text x="446" y="176" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#2e8b57">II &#8212; constant rate</text>
  <text x="360" y="228" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b">III &#8212; fish, insects, plants</text>
  <text x="320" y="292" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">Type II is memoryless &#8212; the same exponential</text>
  <text x="320" y="308" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">as species lifespans in 2.4.</text>
  <text x="320" y="330" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">In a Type III species a newborn has LOW</text>
  <text x="320" y="346" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">reproductive value &#8212; it will probably die.</text>
  <text x="320" y="362" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">Save the survivors, not the young.</text>

  <line x1="560" y1="34" x2="560" y2="440" stroke="#ddd" stroke-width="2"/>
  <text x="580" y="46" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Demographic momentum</text>
  <rect x="603.0" y="229.0" width="74.0" height="10" fill="#c9871f" opacity="0.85"/><rect x="606.0" y="216.0" width="68.0" height="10" fill="#c9871f" opacity="0.85"/><rect x="609.0" y="203.0" width="62.0" height="10" fill="#c9871f" opacity="0.85"/><rect x="612.5" y="190.0" width="55.0" height="10" fill="#c9871f" opacity="0.85"/><rect x="616.0" y="177.0" width="48.0" height="10" fill="#c9871f" opacity="0.85"/><rect x="619.5" y="164.0" width="41.0" height="10" fill="#c9871f" opacity="0.85"/><rect x="623.0" y="151.0" width="34.0" height="10" fill="#c9871f" opacity="0.85"/><rect x="626.5" y="138.0" width="27.0" height="10" fill="#c9871f" opacity="0.85"/><rect x="630.0" y="125.0" width="20.0" height="10" fill="#c9871f" opacity="0.85"/><rect x="633.5" y="112.0" width="13.0" height="10" fill="#c9871f" opacity="0.85"/><rect x="636.5" y="99.0" width="7.0" height="10" fill="#c9871f" opacity="0.85"/>
  <text x="640" y="262" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8a5a10" text-anchor="middle">broad-based</text>
  <text x="640" y="278" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8a5a10" text-anchor="middle">(has been growing)</text>
  <rect x="727.0" y="229.0" width="46.0" height="10" fill="#1a6fb5" opacity="0.85"/><rect x="727.5" y="216.0" width="45.0" height="10" fill="#1a6fb5" opacity="0.85"/><rect x="727.5" y="203.0" width="45.0" height="10" fill="#1a6fb5" opacity="0.85"/><rect x="728.0" y="190.0" width="44.0" height="10" fill="#1a6fb5" opacity="0.85"/><rect x="728.0" y="177.0" width="44.0" height="10" fill="#1a6fb5" opacity="0.85"/><rect x="728.5" y="164.0" width="43.0" height="10" fill="#1a6fb5" opacity="0.85"/><rect x="729.5" y="151.0" width="41.0" height="10" fill="#1a6fb5" opacity="0.85"/><rect x="731.5" y="138.0" width="37.0" height="10" fill="#1a6fb5" opacity="0.85"/><rect x="735.0" y="125.0" width="30.0" height="10" fill="#1a6fb5" opacity="0.85"/><rect x="740.0" y="112.0" width="20.0" height="10" fill="#1a6fb5" opacity="0.85"/><rect x="745.0" y="99.0" width="10.0" height="10" fill="#1a6fb5" opacity="0.85"/>
  <text x="750" y="262" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#134f80" text-anchor="middle">columnar</text>
  <text x="750" y="278" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#134f80" text-anchor="middle">(stable age dist.)</text>
  <text x="576" y="310" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">Identical vital rates. Drop fertility to</text>
  <text x="576" y="326" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">replacement in both:</text>
  <text x="576" y="348" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#c9871f">broad-based grows 40&#8211;60 more years</text>
  <text x="576" y="364" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#134f80">columnar stops immediately</text>
  <text x="576" y="392" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">The large cohort of girls already born</text>
  <text x="576" y="408" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">has not yet reproduced. The growth is</text>
  <text x="576" y="424" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">already encoded in the age structure &#8212;</text>
  <text x="576" y="440" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">and it works in both directions.</text>
</svg>