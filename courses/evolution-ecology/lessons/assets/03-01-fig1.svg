  <line x1="40" y1="250" x2="250" y2="196" stroke="#999" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="256" y="72" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b">r = 0.12</text>
  <text x="256" y="150" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#c9871f">r = 0.08</text>
  <text x="256" y="212" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a6fb5">r = 0.04</text>
  <text x="256" y="192" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#999">linear</text>
  <text x="145" y="270" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">time &#8594;</text>
  <rect x="14" y="286" width="260" height="64" rx="7" fill="#fbe9eb" stroke="#d1495b" stroke-width="1.5"/>
  <text x="26" y="306" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7a2530">A lily pad doubling daily covers the pond</text>
  <text x="26" y="322" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7a2530">in 30 days. On day 29 it covers <tspan font-weight="bold">half</tspan>.</text>
  <text x="26" y="342" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#7a2530">One doubling time of warning &#8212; always.</text>
  <text x="14" y="376" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">N(t) = N&#8320;e&#7523;&#7511;&#160;&#160;&#183;&#160;&#160;&#955; = e&#7523;&#160;&#160;&#183;&#160;&#160;t&#8322; = ln2 / r</text>
  <text x="14" y="396" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">R&#8320; = &#931; l&#8339;m&#8339;&#160;&#160;&#183;&#160;&#160;T = &#931;x l&#8339;m&#8339; / R&#8320;&#160;&#160;&#183;&#160;&#160;r &#8776; lnR&#8320; / T</text>
  <text x="14" y="418" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#2e8b57">T is in the denominator: a short generation raises r as</text>
  <text x="14" y="434" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#2e8b57">effectively as more offspring do.</text>

  <line x1="300" y1="34" x2="300" y2="440" stroke="#ddd" stroke-width="2"/>
  <text x="320" y="46" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Three survivorship types</text>
  <line x1="340" y1="250" x2="530" y2="250" stroke="#333" stroke-width="1.6"/>
  <line x1="340" y1="250" x2="340" y2="70" stroke="#333" stroke-width="1.6"/>
