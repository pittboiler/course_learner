  <rect x="20" y="252" width="710" height="26" rx="6" fill="#fdf7ee" stroke="#c9871f" stroke-width="1.5"/>
  <text x="32" y="270" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#8a5a10">S = 0 for stabilizing and disruptive selection. <tspan font-weight="bold">Always report the change in VARIANCE alongside the change in mean</tspan> &#8212; either alone can mislead.</text>

  <line x1="14" y1="292" x2="786" y2="292" stroke="#ddd" stroke-width="2"/>
  <text x="14" y="316" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">&#946; is a regression slope</text>
  <line x1="40" y1="424" x2="250" y2="424" stroke="#333" stroke-width="1.6"/>
  <line x1="40" y1="424" x2="40" y2="330" stroke="#333" stroke-width="1.6"/>
  <g fill="#8fa8c0">
    <circle cx="62" cy="414" r="3"/><circle cx="82" cy="404" r="3"/><circle cx="98" cy="412" r="3"/><circle cx="116" cy="392" r="3"/>
    <circle cx="134" cy="398" r="3"/><circle cx="150" cy="380" r="3"/><circle cx="168" cy="388" r="3"/><circle cx="186" cy="366" r="3"/>
    <circle cx="204" cy="372" r="3"/><circle cx="222" cy="354" r="3"/><circle cx="72" cy="420" r="3"/><circle cx="196" cy="382" r="3"/>
  </g>
  <line x1="52" y1="418" x2="238" y2="356" stroke="#1a6fb5" stroke-width="2.6"/>
  <text x="145" y="342" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a6fb5" text-anchor="middle">slope = &#946;</text>
  <text x="46" y="336" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333" text-anchor="end">rel. fitness</text>
  <text x="145" y="442" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">trait value &#8594;</text>

  <line x1="286" y1="300" x2="286" y2="446" stroke="#ddd" stroke-width="2"/>
  <text x="306" y="316" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">The problem &#946; solves: direct vs. indirect selection</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="11">
    <rect x="310" y="332" width="120" height="28" rx="6" fill="#e8f0fb" stroke="#1a6fb5" stroke-width="1.6"/>
    <text x="370" y="351" text-anchor="middle" fill="#134f80">beak depth</text>
    <rect x="310" y="392" width="120" height="28" rx="6" fill="#f0f3f7" stroke="#8fa8c0" stroke-width="1.6"/>
    <text x="370" y="411" text-anchor="middle" fill="#5d7fa0">body size</text>
    <line x1="370" y1="360" x2="370" y2="392" stroke="#8fa8c0" stroke-width="2.4"/>
    <text x="380" y="380" fill="#8fa8c0" font-size="10">r &#8776; 0.8</text>
    <path d="M 434 346 L 510 366" stroke="#2e8b57" stroke-width="3" marker-end="url(#u)"/>
    <path d="M 434 406 L 510 386" stroke="#d1495b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#v)"/>
    <rect x="514" y="362" width="90" height="28" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.6"/>
    <text x="559" y="381" text-anchor="middle" fill="#1f5c3a">survival</text>
    <text x="616" y="356" fill="#2e8b57">&#946; large &#8212; DIRECT</text>
    <text x="616" y="396" fill="#d1495b">&#946; &#8776; 0 &#8212; the S on body size</text>
    <text x="616" y="412" fill="#d1495b">was indirect, via correlation</text>
  </g>
  <text x="306" y="440" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111">S measures total selection. Only &#946; = P&#8315;&#185;S isolates what selection acted on.</text>
  <defs>
    <marker id="u" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e8b57"/></marker>
    <marker id="v" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d1495b"/></marker>
  </defs>
