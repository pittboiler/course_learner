<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Logistic S-curve, growth rate parabola with harvest lines and the MSY bifurcation, and an Allee effect creating an extinction threshold">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="14" y="22" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">The S-curve, and where it comes from</text>
  <line x1="40" y1="250" x2="280" y2="250" stroke="#333" stroke-width="1.6"/>
  <line x1="40" y1="250" x2="40" y2="60" stroke="#333" stroke-width="1.6"/>
  <line x1="40" y1="70" x2="280" y2="70" stroke="#bbb" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="286" y="74" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666">K</text>
  <line x1="40" y1="160" x2="280" y2="160" stroke="#d1495b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="286" y="164" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b">K/2</text>
  <polyline points="40.0,235.6 43.8,233.3 47.7,230.6 51.5,227.4 55.3,223.8 59.2,219.5 63.0,214.6 66.8,208.8 70.7,202.2 74.5,194.5 78.3,185.5 82.2,175.0 86.0,162.9 89.8,148.8 93.7,132.4 97.5,113.4 101.3,91.3 105.2,65.6" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="5 4"/>
  <polyline points="40.0,235.6 43.8,233.5 47.7,231.1 51.5,228.4 55.3,225.4 59.2,222.0 63.0,218.3 66.8,214.2 70.7,209.7 74.5,204.8 78.3,199.5 82.2,193.9 86.0,188.0 89.8,181.7 93.7,175.3 97.5,168.6 101.3,161.9 105.2,155.2 109.0,148.5 112.8,141.9 116.7,135.5 120.5,129.4 124.3,123.6 128.2,118.1 132.0,113.0 135.8,108.3 139.7,104.0 143.5,100.0 147.3,96.5 151.2,93.3 155.0,90.4 158.8,87.8 162.7,85.6 166.5,83.6 170.3,81.8 174.2,80.2 178.0,78.9 181.8,77.7 185.7,76.7 189.5,75.8 193.3,75.0 197.2,74.3 201.0,73.7 204.8,73.2 208.7,72.8 212.5,72.4 216.3,72.1 220.2,71.8 224.0,71.5 227.8,71.3 231.7,71.1 235.5,71.0 239.3,70.8 243.2,70.7 247.0,70.6 250.8,70.5 254.7,70.5 258.5,70.4 262.3,70.3 266.2,70.3 270.0,70.3" fill="none" stroke="#1a6fb5" stroke-width="2.8"/>
  <circle cx="102" cy="160" r="5" fill="#d1495b"/>
  <text x="112" y="146" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b">inflection</text>
  <text x="118" y="106" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#999">exponential</text>
  <text x="160" y="270" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">time &#8594;</text>
  <text x="14" y="292" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">dN/dt = rN(1 &#8722; N/K): the product of &#8220;more individuals&#8221;</text>
  <text x="14" y="308" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">and &#8220;more crowding&#8221;, maximal in between.</text>
  <text x="14" y="330" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#2e8b57">The curve has rotational symmetry about K/2 &#8212; so the</text>
  <text x="14" y="346" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#2e8b57">time from a to K/2 equals the time from K/2 to K&#8722;a.</text>
  <text x="14" y="372" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">N = 0 unstable (f&#8242; = r &gt; 0)&#160;&#160;&#183;&#160;&#160;N = K stable (f&#8242; = &#8722;r &lt; 0)</text>

  <line x1="300" y1="34" x2="300" y2="392" stroke="#ddd" stroke-width="2"/>
  <text x="320" y="46" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Why MSY has no safety margin</text>
  <line x1="330" y1="250" x2="560" y2="250" stroke="#333" stroke-width="1.6"/>
  <line x1="330" y1="250" x2="330" y2="70" stroke="#333" stroke-width="1.6"/>
  <polyline points="330.0,250.0 332.2,243.7 334.4,237.5 336.6,231.4 338.8,225.4 341.0,219.6 343.2,213.9 345.4,208.3 347.6,202.9 349.8,197.6 352.0,192.4 354.2,187.3 356.4,182.4 358.6,177.6 360.8,172.9 363.0,168.4 365.2,164.0 367.4,159.7 369.6,155.5 371.8,151.5 374.0,147.6 376.2,143.8 378.4,140.2 380.6,136.7 382.8,133.3 385.0,130.0 387.2,126.9 389.4,123.9 391.6,121.0 393.8,118.2 396.0,115.6 398.2,113.1 400.4,110.7 402.6,108.5 404.8,106.4 407.0,104.4 409.2,102.5 411.4,100.8 413.6,99.2 415.8,97.7 418.0,96.4 420.2,95.2 422.4,94.1 424.6,93.1 426.8,92.3 429.0,91.6 431.2,91.0 433.4,90.6 435.6,90.3 437.8,90.1 440.0,90.0 442.2,90.1 444.4,90.3 446.6,90.6 448.8,91.0 451.0,91.6 453.2,92.3 455.4,93.1 457.6,94.1 459.8,95.2 462.0,96.4 464.2,97.7 466.4,99.2 468.6,100.8 470.8,102.5 473.0,104.4 475.2,106.4 477.4,108.5 479.6,110.7 481.8,113.1 484.0,115.6 486.2,118.2 488.4,121.0 490.6,123.9 492.8,126.9 495.0,130.0 497.2,133.3 499.4,136.7 501.6,140.2 503.8,143.8 506.0,147.6 508.2,151.5 510.4,155.5 512.6,159.7 514.8,164.0 517.0,168.4 519.2,172.9 521.4,177.6 523.6,182.4 525.8,187.3 528.0,192.4 530.2,197.6 532.4,202.9 534.6,208.3 536.8,213.9 539.0,219.6 541.2,225.4 543.4,231.4 545.6,237.5 547.8,243.7 550.0,250.0" fill="none" stroke="#2e8b57" stroke-width="2.8"/>
  <line x1="330" y1="150" x2="560" y2="150" stroke="#c9871f" stroke-width="2"/>
  <line x1="330" y1="90" x2="560" y2="90" stroke="#d1495b" stroke-width="2.4"/>
  <text x="566" y="154" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#c9871f">H &lt; MSY</text>
  <text x="566" y="94" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b">H = MSY</text>
  <circle cx="373" cy="150" r="4.5" fill="#fff" stroke="#c9871f" stroke-width="2.2"/>
  <circle cx="517" cy="150" r="4.5" fill="#c9871f"/>
  <circle cx="440" cy="90" r="5" fill="#d1495b"/>
  <text x="373" y="176" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#c9871f" text-anchor="middle">unstable</text>
  <text x="517" y="176" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#c9871f" text-anchor="middle">stable</text>
  <path d="M 388 164 L 410 164" stroke="#c9871f" stroke-width="1.6" marker-end="url(#z)"/>
  <path d="M 502 164 L 480 164" stroke="#c9871f" stroke-width="1.6" marker-end="url(#z)"/>
  <text x="440" y="72" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b" text-anchor="middle">they MERGE</text>
  <text x="445" y="270" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">N &#8594;&#160;&#160;&#160;&#160;(peak at K/2, height rK/4)</text>
  <text x="320" y="294" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">Below MSY there are two equilibria. At MSY they</text>
  <text x="320" y="310" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">collide; above it there is <tspan font-style="italic">none</tspan> and N &#8594; 0.</text>
  <text x="320" y="332" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b">MSY sits exactly at a saddle-node bifurcation.</text>
  <text x="320" y="356" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#2e8b57">Harvest a fixed FRACTION instead: N&#770; = K(1 &#8722; h/r)</text>
  <text x="320" y="372" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#2e8b57">declines smoothly, no bifurcation, no cliff.</text>

  <line x1="580" y1="34" x2="580" y2="392" stroke="#ddd" stroke-width="2"/>
  <text x="598" y="46" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Allee effect: an extinction threshold</text>
  <line x1="596" y1="400" x2="790" y2="400" stroke="#333" stroke-width="1.6"/>
  <line x1="600" y1="430" x2="600" y2="270" stroke="#333" stroke-width="1.6"/>
  <polyline points="600.0,400.0 601.8,401.1 603.6,402.0 605.4,402.7 607.2,403.3 609.0,403.7 610.8,404.0 612.6,404.1 614.4,404.0 616.2,403.8 618.0,403.5 619.8,403.1 621.6,402.5 623.4,401.8 625.2,400.9 627.0,400.0 628.8,399.0 630.6,397.8 632.4,396.5 634.2,395.2 636.0,393.8 637.8,392.2 639.6,390.6 641.4,389.0 643.2,387.2 645.0,385.4 646.8,383.5 648.6,381.6 650.4,379.6 652.2,377.5 654.0,375.5 655.8,373.3 657.6,371.2 659.4,369.0 661.2,366.8 663.0,364.5 664.8,362.3 666.6,360.0 668.4,357.8 670.2,355.5 672.0,353.2 673.8,351.0 675.6,348.8 677.4,346.5 679.2,344.3 681.0,342.1 682.8,340.0 684.6,337.9 686.4,335.8 688.2,333.8 690.0,331.8 691.8,329.9 693.6,328.0 695.4,326.2 697.2,324.5 699.0,322.9 700.8,321.3 702.6,319.8 704.4,318.4 706.2,317.1 708.0,315.8 709.8,314.7 711.6,313.7 713.4,312.8 715.2,312.0 717.0,311.4 718.8,310.8 720.6,310.4 722.4,310.1 724.2,310.0 726.0,310.0 727.8,310.2 729.6,310.5 731.4,310.9 733.2,311.6 735.0,312.3 736.8,313.3 738.6,314.4 740.4,315.8 742.2,317.3 744.0,319.0 745.8,320.9 747.6,322.9 749.4,325.2 751.2,327.7 753.0,330.5 754.8,333.4 756.6,336.5 758.4,339.9 760.2,343.6 762.0,347.4 763.8,351.5 765.6,355.8 767.4,360.4 769.2,365.3 771.0,370.4 772.8,375.8 774.6,381.4 776.4,387.3 778.2,393.5 780.0,400.0" fill="none" stroke="#d1495b" stroke-width="2.8"/>
  <circle cx="627" cy="400" r="5" fill="#fff" stroke="#d1495b" stroke-width="2.4"/>
  <text x="627" y="422" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b" text-anchor="middle">A</text>
  <text x="700" y="440" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">N &#8594;</text>
  <text x="598" y="286" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">Below A, per-capita growth is</text>
  <text x="598" y="302" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#d1495b">NEGATIVE &#8212; extinction follows</text>
  <text x="598" y="318" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">even with all harvesting stopped.</text>
  <text x="598" y="342" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">Mates cannot be found; group</text>
  <text x="598" y="358" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">defence and schooling fail.</text>
  <text x="598" y="382" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">The logistic contains no such point.</text>
  <defs><marker id="z" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#c9871f"/></marker></defs>
</svg>