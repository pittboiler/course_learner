<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="Energy pyramid and inverted biomass pyramid, nutrient cycles, and biomagnification">
  <rect width="800" height="440" fill="#ffffff"/>
  <text x="14" y="22" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">Energy pyramid (kJ/m&#178;/yr) &#8212; never inverted</text>
  <rect x="35.0" y="224.0" width="190.0" height="26" fill="#c9871f" opacity="0.95"/><text x="130" y="241" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#fff" text-anchor="middle">9000</text><rect x="120.5" y="195.0" width="19.0" height="26" fill="#c9871f" opacity="0.83"/><text x="130" y="212" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#fff" text-anchor="middle">900</text><rect x="129.1" y="166.0" width="1.9" height="26" fill="#c9871f" opacity="0.71"/><text x="130" y="183" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#fff" text-anchor="middle">90</text><rect x="129.7" y="137.0" width="0.6" height="26" fill="#c9871f" opacity="0.59"/><text x="130" y="154" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#fff" text-anchor="middle">9</text>
  <text x="130" y="270" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">E&#8345; = E&#8320;&#949;&#8319;&#8315;&#185;</text>
  <text x="14" y="292" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">Thermodynamics forbids an inverted ENERGY pyramid.</text>

  <text x="14" y="322" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Biomass pyramid &#8212; often inverted in water</text>
  <g transform="translate(0,180)"><rect x="100.0" y="224.0" width="60.0" height="26" fill="#1a6fb5" opacity="0.95"/><text x="130" y="241" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#fff" text-anchor="middle">phyto</text><rect x="70.0" y="195.0" width="120.0" height="26" fill="#1a6fb5" opacity="0.83"/><text x="130" y="212" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#fff" text-anchor="middle">zoo</text><rect x="85.0" y="166.0" width="90.0" height="26" fill="#1a6fb5" opacity="0.71"/><text x="130" y="183" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#fff" text-anchor="middle">fish</text><rect x="110.0" y="137.0" width="40.0" height="26" fill="#1a6fb5" opacity="0.59"/><text x="130" y="154" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#fff" text-anchor="middle">top</text></g>
  <text x="14" y="428" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1a6fb5">Biomass is a STOCK; energy flow is a RATE. A small,</text>
  <text x="14" y="440" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1a6fb5">fast-turning phytoplankton stock supports a large flux.</text>

  <line x1="270" y1="34" x2="270" y2="430" stroke="#ddd" stroke-width="2"/>
  <text x="288" y="46" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Two cycles, two bottlenecks</text>
  <ellipse cx="400" cy="118" rx="94" ry="34" fill="#e8f0fb" stroke="#1a6fb5" stroke-width="1.8"/>
  <text x="400" y="114" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#134f80" text-anchor="middle">N&#8322; &#8212; 78% of the</text>
  <text x="400" y="128" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#134f80" text-anchor="middle">atmosphere, inert</text>
  <path d="M 400 152 L 400 184" stroke="#d1495b" stroke-width="2.6" marker-end="url(#aa)"/>
  <text x="410" y="172" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b">FIXATION &#8212; the bottleneck</text>
  <rect x="330" y="186" width="140" height="30" rx="6" fill="#dbeadb" stroke="#2e8b57" stroke-width="1.6"/>
  <text x="400" y="205" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f5c3a" text-anchor="middle">organic N</text>
  <text x="288" y="240" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">Only prokaryotes with nitrogenase can break N&#8801;N.</text>

  <rect x="330" y="270" width="140" height="30" rx="6" fill="#fdf0dd" stroke="#c9871f" stroke-width="1.6"/>
  <text x="400" y="289" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8a5a10" text-anchor="middle">rock &#8594; water &#8594; organisms</text>
  <text x="288" y="322" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#8a5a10">Phosphorus has NO gaseous phase at all &#8212;</text>
  <text x="288" y="338" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">so it is the usual limiting nutrient in freshwater.</text>
  <rect x="284" y="352" width="222" height="76" rx="8" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.5"/>
  <text x="296" y="374" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111">Redfield ratio C:N:P = 106:16:1</text>
  <text x="296" y="394" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">ambient N:P &lt; 16 &#8594; nitrogen-limited</text>
  <text x="296" y="410" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">ambient N:P &gt; 16 &#8594; phosphorus-limited</text>
  <text x="296" y="424" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666">Residence time &#964; = M/F sets both the pool and the response time.</text>

  <line x1="530" y1="34" x2="530" y2="430" stroke="#ddd" stroke-width="2"/>
  <text x="548" y="46" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Biomagnification: &#966;/&#949; per level</text>
  <text x="548" y="66" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666">retention 90%, transfer 10% &#8594; 9&#215; per link</text>
  <rect x="600" y="80" width="6" height="26" fill="#d1495b" opacity="0.50"/><text x="612" y="98" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#7a2530">0.02 ppm</text><rect x="600" y="126" width="50" height="26" fill="#d1495b" opacity="0.62"/><text x="656" y="144" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#7a2530">0.18 ppm</text><rect x="600" y="172" width="94" height="26" fill="#d1495b" opacity="0.74"/><text x="700" y="190" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#7a2530">1.62 ppm</text><rect x="600" y="218" width="138" height="26" fill="#d1495b" opacity="0.86"/><text x="744" y="236" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#7a2530">14.58 ppm</text><rect x="600" y="264" width="182" height="26" fill="#d1495b" opacity="0.98"/><text x="788" y="282" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#7a2530">131.22 ppm</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#666">
    <text x="548" y="98">1</text><text x="548" y="144">2</text><text x="548" y="190">3</text><text x="548" y="236">4</text><text x="548" y="282">5</text>
  </g>
  <text x="548" y="322" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b">9&#8308; = 6561&#215; over four links</text>
  <text x="548" y="346" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">Energy falls tenfold per level while the</text>
  <text x="548" y="362" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">contaminant is retained at 90% &#8212; so it</text>
  <text x="548" y="378" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">concentrates into less and less tissue.</text>
  <text x="548" y="402" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">Needs all four: lipophilic, persistent, poorly</text>
  <text x="548" y="418" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">metabolized, poorly excreted. Water-soluble</text>
  <text x="548" y="434" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">toxins do NOT magnify, however toxic.</text>
  <defs><marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d1495b"/></marker></defs>
</svg>