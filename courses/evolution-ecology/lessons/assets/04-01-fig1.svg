<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Four phase-plane configurations of Lotka-Volterra competition">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="14" y="26" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">Four configurations, decided by which isocline lies outside the other</text>
  <text x="14" y="44" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#666">blue = species 1 isocline &#183; green = species 2 isocline &#183; horizontal axis N&#8321;, vertical axis N&#8322;</text>
  <text x="115" y="50" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111" text-anchor="middle">1 always wins</text><line x1="40" y1="190" x2="190" y2="190" stroke="#333" stroke-width="1.4"/><line x1="40" y1="190" x2="40" y2="60" stroke="#333" stroke-width="1.4"/><line x1="170.4" y1="190.0" x2="40.0" y2="77.0" stroke="#1a6fb5" stroke-width="2.4"/><line x1="40.0" y1="173.0" x2="94.3" y2="190.0" stroke="#2e8b57" stroke-width="2.4"/><text x="115" y="208" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a6fb5" text-anchor="middle">isocline 1 outside</text><text x="315" y="50" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111" text-anchor="middle">2 always wins</text><line x1="240" y1="190" x2="390" y2="190" stroke="#333" stroke-width="1.4"/><line x1="240" y1="190" x2="240" y2="60" stroke="#333" stroke-width="1.4"/><line x1="259.6" y1="190.0" x2="240.0" y2="142.9" stroke="#1a6fb5" stroke-width="2.4"/><line x1="240.0" y1="77.0" x2="370.4" y2="190.0" stroke="#2e8b57" stroke-width="2.4"/><text x="315" y="208" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#2e8b57" text-anchor="middle">isocline 2 outside</text><text x="515" y="50" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111" text-anchor="middle">stable coexistence</text><line x1="440" y1="190" x2="590" y2="190" stroke="#333" stroke-width="1.4"/><line x1="440" y1="190" x2="440" y2="60" stroke="#333" stroke-width="1.4"/><line x1="527.0" y1="190.0" x2="440.0" y2="77.0" stroke="#1a6fb5" stroke-width="2.4"/><line x1="440.0" y1="129.0" x2="570.4" y2="190.0" stroke="#2e8b57" stroke-width="2.4"/><text x="515" y="208" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b" text-anchor="middle">&#945;&#946; &lt; 1, both conditions hold</text><circle cx="502.5" cy="158.2" r="4.5" fill="#111" stroke="#111" stroke-width="2"/><text x="710" y="50" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111" text-anchor="middle">founder controlled</text><line x1="640" y1="190" x2="780" y2="190" stroke="#333" stroke-width="1.4"/><line x1="640" y1="190" x2="640" y2="60" stroke="#333" stroke-width="1.4"/><line x1="761.7" y1="190.0" x2="640.0" y2="109.3" stroke="#1a6fb5" stroke-width="2.4"/><line x1="640.0" y1="77.0" x2="716.1" y2="190.0" stroke="#2e8b57" stroke-width="2.4"/><text x="710" y="208" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#c9871f" text-anchor="middle">&#945;&#946; &gt; 1 &#8212; saddle</text><circle cx="679.3" cy="135.3" r="4.5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="443" y="182" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#111">&#9679; stable</text>
  <text x="643" y="182" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#111">&#9675; saddle</text>

  <rect x="14" y="238" width="380" height="196" rx="9" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.6"/>
  <text x="30" y="264" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">The coexistence conditions</text>
  <text x="30" y="292" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">&#945; &lt; K&#8321;/K&#8322;&#160;&#160;&#160;<tspan font-weight="bold">and</tspan>&#160;&#160;&#160;&#946; &lt; K&#8322;/K&#8321;</text>
  <text x="30" y="318" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">Multiply, and the K&#8217;s cancel:</text>
  <text x="30" y="344" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#d1495b">&#945;&#946; &lt; 1</text>
  <text x="30" y="372" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Each species must limit ITSELF more</text>
  <text x="30" y="390" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">than it limits the OTHER.</text>
  <text x="30" y="416" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">&#945;&#946; &lt; 1 is NECESSARY but not SUFFICIENT &#8212;</text>
  <text x="30" y="430" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">check both individual conditions.</text>

  <rect x="410" y="238" width="376" height="196" rx="9" fill="#fdf7ee" stroke="#c9871f" stroke-width="1.6"/>
  <text x="426" y="264" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#8a5a10">The operational test: mutual invasibility</text>
  <text x="426" y="290" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">Can each species increase from rare when the</text>
  <text x="426" y="306" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">other is at its equilibrium? If both can, they coexist.</text>
  <text x="426" y="330" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">Directly measurable: introduce a few individuals</text>
  <text x="426" y="346" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">into an established population and see.</text>
  <text x="426" y="374" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#8a5a10">Modern reframing (Chesson):</text>
  <text x="426" y="392" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">coexistence &#8660; niche difference &gt; fitness difference</text>
  <text x="426" y="416" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#666">Similar species need only small niche differences;</text>
  <text x="426" y="430" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#666">very unequal competitors need large ones.</text>
</svg>