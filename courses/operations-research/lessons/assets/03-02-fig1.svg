<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="26" y="24" fill="#8a8a8a" font-style="italic" font-size="12">Branch and bound on the knapsack: each node carries an LP bound, and three of the five nodes die unbranched.</text>

  <!-- ===== edges ===== -->
  <line x1="340" y1="102" x2="200" y2="170" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="340" y1="102" x2="500" y2="170" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="200" y1="216" x2="110" y2="286" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="200" y1="216" x2="290" y2="286" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- edge labels -->
  <text x="240" y="128" fill="#8a8a8a" text-anchor="middle">x<tspan dy="4" font-size="10">3</tspan><tspan dy="-4"> &#8805; 1</tspan></text>
  <text x="440" y="128" fill="#8a8a8a" text-anchor="middle">x<tspan dy="4" font-size="10">3</tspan><tspan dy="-4"> &#8804; 0</tspan></text>
  <text x="128" y="248" fill="#8a8a8a" text-anchor="middle">x<tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> &#8805; 1</tspan></text>
  <text x="274" y="248" fill="#8a8a8a" text-anchor="middle">x<tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> &#8804; 0</tspan></text>

  <!-- ===== N0 root ===== -->
  <rect x="270" y="56" width="140" height="46" rx="6" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="340" y="76" fill="#4a90d9" text-anchor="middle">N0 &#8212; root</text>
  <text x="340" y="94" fill="#4a90d9" text-anchor="middle" font-size="12">LP = 240</text>

  <!-- ===== N1 ===== -->
  <rect x="130" y="170" width="140" height="46" rx="6" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="200" y="190" fill="#4a90d9" text-anchor="middle">N1 &#8212; x<tspan dy="4" font-size="10">3</tspan><tspan dy="-4"> = 1</tspan></text>
  <text x="200" y="208" fill="#4a90d9" text-anchor="middle" font-size="12">LP = 230</text>

  <!-- ===== N4 (pruned by bound) ===== -->
  <rect x="430" y="170" width="140" height="46" rx="6" fill="#8a8a8a" fill-opacity="0.08" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="500" y="190" fill="#8a8a8a" text-anchor="middle">N4 &#8212; x<tspan dy="4" font-size="10">3</tspan><tspan dy="-4"> = 0</tspan></text>
  <text x="500" y="208" fill="#8a8a8a" text-anchor="middle" font-size="12">LP = 160</text>
  <text x="500" y="234" fill="#8a8a8a" text-anchor="middle" font-size="11">pruned: bound</text>

  <!-- ===== N2 (integral, optimum) ===== -->
  <rect x="40" y="286" width="140" height="46" rx="6" fill="#e0645c" fill-opacity="0.15" stroke="#e0645c" stroke-width="2.5"/>
  <text x="110" y="306" fill="#e0645c" text-anchor="middle">N2 &#8212; x<tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> = 1</tspan></text>
  <text x="110" y="324" fill="#e0645c" text-anchor="middle" font-size="12">LP = 220</text>
  <text x="110" y="350" fill="#e0645c" text-anchor="middle" font-size="11">integral: incumbent 220</text>

  <!-- ===== N3 (pruned by bound) ===== -->
  <rect x="220" y="286" width="140" height="46" rx="6" fill="#8a8a8a" fill-opacity="0.08" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="290" y="306" fill="#8a8a8a" text-anchor="middle">N3 &#8212; x<tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> = 0</tspan></text>
  <text x="290" y="324" fill="#8a8a8a" text-anchor="middle" font-size="12">LP = 180</text>
  <text x="290" y="350" fill="#8a8a8a" text-anchor="middle" font-size="11">pruned: bound</text>

  <!-- footer -->
  <text x="480" y="300" fill="#8a8a8a" text-anchor="middle" font-style="italic" font-size="12">root bound 240, incumbent 220,</text>
  <text x="480" y="318" fill="#8a8a8a" text-anchor="middle" font-style="italic" font-size="12">integrality gap 20</text>
</svg>
