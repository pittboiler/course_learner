<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="argrey" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a8a8a"/>
    </marker>
    <marker id="arcoral" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#e0645c"/>
    </marker>
  </defs>

  <text x="330" y="22" text-anchor="middle" font-size="13" font-style="italic" fill="#8a8a8a">Grey = unit cost, coral = optimal shipment.</text>

  <line x1="157.9" y1="107.7" x2="472.1" y2="82.3" stroke="#e0645c" stroke-width="2.5" marker-end="url(#arcoral)"/>
  <line x1="156.2" y1="119.9" x2="473.8" y2="240.1" stroke="#e0645c" stroke-width="2.5" marker-end="url(#arcoral)"/>
  <line x1="157.6" y1="225.2" x2="472.4" y2="169.8" stroke="#e0645c" stroke-width="2.5" marker-end="url(#arcoral)"/>
  <line x1="158.0" y1="231.5" x2="472.0" y2="248.5" stroke="#e0645c" stroke-width="2.5" marker-end="url(#arcoral)"/>

  <line x1="157.7" y1="114.1" x2="472.3" y2="160.9" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#argrey)"/>
  <line x1="155.9" y1="219.5" x2="474.1" y2="90.5" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#argrey)"/>

  <text x="230" y="93" text-anchor="middle" font-size="13" fill="#8a8a8a">4</text>
  <text x="430" y="147" text-anchor="middle" font-size="13" fill="#8a8a8a">6</text>
  <text x="190" y="148" text-anchor="middle" font-size="13" fill="#8a8a8a">9</text>
  <text x="430" y="101" text-anchor="middle" font-size="13" fill="#8a8a8a">5</text>
  <text x="290" y="193" text-anchor="middle" font-size="13" fill="#8a8a8a">3</text>
  <text x="230" y="250" text-anchor="middle" font-size="13" fill="#8a8a8a">8</text>

  <text x="350" y="84" text-anchor="middle" font-size="14" fill="#e0645c">20</text>
  <text x="350" y="208" text-anchor="middle" font-size="14" fill="#e0645c">10</text>
  <text x="350" y="183" text-anchor="middle" font-size="14" fill="#e0645c">35</text>
  <text x="350" y="256" text-anchor="middle" font-size="14" fill="#e0645c">15</text>

  <circle cx="130" cy="110" r="28" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="130" cy="230" r="28" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="130" y="115" text-anchor="middle" font-size="16" fill="#4a90d9">A</text>
  <text x="130" y="235" text-anchor="middle" font-size="16" fill="#4a90d9">B</text>

  <circle cx="500" cy="80" r="28" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="500" cy="165" r="28" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="500" cy="250" r="28" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="500" y="85" text-anchor="middle" font-size="15" fill="#4a90d9">W1</text>
  <text x="500" y="170" text-anchor="middle" font-size="15" fill="#4a90d9">W2</text>
  <text x="500" y="255" text-anchor="middle" font-size="15" fill="#4a90d9">W3</text>

  <text x="96" y="105" text-anchor="end" font-size="12" fill="#8a8a8a">plant A</text>
  <text x="96" y="121" text-anchor="end" font-size="12" fill="#8a8a8a">supply 30</text>
  <text x="96" y="225" text-anchor="end" font-size="12" fill="#8a8a8a">plant B</text>
  <text x="96" y="241" text-anchor="end" font-size="12" fill="#8a8a8a">supply 50</text>

  <text x="534" y="75" font-size="12" fill="#8a8a8a">store W1</text>
  <text x="534" y="91" font-size="12" fill="#8a8a8a">demand 20</text>
  <text x="534" y="160" font-size="12" fill="#8a8a8a">store W2</text>
  <text x="534" y="176" font-size="12" fill="#8a8a8a">demand 35</text>
  <text x="534" y="245" font-size="12" fill="#8a8a8a">store W3</text>
  <text x="534" y="261" font-size="12" fill="#8a8a8a">demand 25</text>

  <text x="330" y="303" text-anchor="middle" font-size="12" fill="#8a8a8a">solid coral = arc used at the optimum &#183; dashed grey = arc carries zero flow</text>
  <text x="330" y="321" text-anchor="middle" font-size="12" fill="#8a8a8a">supply 30 + 50 = demand 20 + 35 + 25 = 80, so the instance is balanced</text>
</svg>
