<svg viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="24" y="22" fill="#8a8a8a" font-style="italic" font-size="13">Each node carries f = cheapest cost from there to D; coral traces the optimal path.</text>

  <!-- ===== arcs, stage 1 to stage 2 ===== -->
  <line x1="86.3" y1="155.3" x2="213.7" y2="79.7" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="213.7,79.7 208.0,87.7 203.9,80.9" fill="#8a8a8a"/>
  <text x="145" y="111" fill="#8a8a8a">1</text>

  <line x1="89" y1="165" x2="211" y2="165" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="211,165 202,169 202,161" fill="#e0645c"/>
  <text x="146" y="158" fill="#e0645c">3</text>

  <line x1="86.3" y1="174.7" x2="213.7" y2="250.3" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="213.7,250.3 203.9,249.2 208.0,242.3" fill="#8a8a8a"/>
  <text x="145" y="224" fill="#8a8a8a">5</text>

  <!-- ===== arcs, stage 2 to stage 3 ===== -->
  <line x1="248.3" y1="75.1" x2="371.7" y2="109.9" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="371.7,109.9 362.0,111.3 364.1,103.6" fill="#8a8a8a"/>
  <text x="258" y="72" fill="#8a8a8a">6</text>

  <line x1="244.1" y1="82.8" x2="375.9" y2="202.2" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="375.9,202.2 366.5,199.1 371.9,193.2" fill="#8a8a8a"/>
  <text x="258" y="112" fill="#8a8a8a">9</text>

  <line x1="248.1" y1="159.3" x2="371.9" y2="120.7" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="371.9,120.7 364.5,127.2 362.1,119.6" fill="#8a8a8a"/>
  <text x="258" y="149" fill="#8a8a8a">6</text>

  <line x1="248.1" y1="170.7" x2="371.9" y2="209.3" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="371.9,209.3 362.1,210.4 364.5,202.8" fill="#e0645c"/>
  <text x="258" y="190" fill="#e0645c">4</text>

  <line x1="244.1" y1="247.2" x2="375.9" y2="127.8" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="375.9,127.8 371.9,136.8 366.5,130.9" fill="#8a8a8a"/>
  <text x="258" y="226" fill="#8a8a8a">2</text>

  <line x1="248.3" y1="254.9" x2="371.7" y2="220.1" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="371.7,220.1 364.1,226.4 362.0,218.7" fill="#8a8a8a"/>
  <text x="258" y="265" fill="#8a8a8a">3</text>

  <!-- ===== arcs, stage 3 to stage 4 ===== -->
  <line x1="408.1" y1="120.7" x2="531.9" y2="159.3" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="531.9,159.3 522.1,160.4 524.5,152.8" fill="#8a8a8a"/>
  <text x="466" y="132" fill="#8a8a8a">5</text>

  <line x1="408.1" y1="209.3" x2="531.9" y2="170.7" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="531.9,170.7 524.5,177.2 522.1,169.6" fill="#e0645c"/>
  <text x="466" y="203" fill="#e0645c">3</text>

  <!-- ===== nodes ===== -->
  <circle cx="70" cy="165" r="19" fill="#e0645c" fill-opacity="0.15" stroke="#e0645c" stroke-width="2.5"/>
  <text x="70" y="170" fill="#e0645c" text-anchor="middle">A</text>
  <text x="70" y="138" fill="#e0645c" text-anchor="middle" font-size="13">f = 10</text>

  <circle cx="230" cy="70" r="19" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="230" y="75" fill="#4a90d9" text-anchor="middle">B1</text>
  <text x="230" y="43" fill="#4a90d9" text-anchor="middle" font-size="13">f = 11</text>

  <circle cx="230" cy="165" r="19" fill="#e0645c" fill-opacity="0.15" stroke="#e0645c" stroke-width="2.5"/>
  <text x="230" y="170" fill="#e0645c" text-anchor="middle">B2</text>
  <text x="230" y="138" fill="#e0645c" text-anchor="middle" font-size="13">f = 7</text>

  <circle cx="230" cy="260" r="19" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="230" y="265" fill="#4a90d9" text-anchor="middle">B3</text>
  <text x="230" y="296" fill="#4a90d9" text-anchor="middle" font-size="13">f = 6</text>

  <circle cx="390" cy="115" r="19" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="390" y="120" fill="#4a90d9" text-anchor="middle">C1</text>
  <text x="390" y="88" fill="#4a90d9" text-anchor="middle" font-size="13">f = 5</text>

  <circle cx="390" cy="215" r="19" fill="#e0645c" fill-opacity="0.15" stroke="#e0645c" stroke-width="2.5"/>
  <text x="390" y="220" fill="#e0645c" text-anchor="middle">C2</text>
  <text x="390" y="252" fill="#e0645c" text-anchor="middle" font-size="13">f = 3</text>

  <circle cx="550" cy="165" r="19" fill="#e0645c" fill-opacity="0.15" stroke="#e0645c" stroke-width="2.5"/>
  <text x="550" y="170" fill="#e0645c" text-anchor="middle">D</text>
  <text x="550" y="138" fill="#e0645c" text-anchor="middle" font-size="13">f = 0</text>

  <!-- ===== stage rail ===== -->
  <line x1="40" y1="308" x2="580" y2="308" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="70" y="326" fill="#8a8a8a" text-anchor="middle" font-size="13">stage 1</text>
  <text x="230" y="326" fill="#8a8a8a" text-anchor="middle" font-size="13">stage 2</text>
  <text x="390" y="326" fill="#8a8a8a" text-anchor="middle" font-size="13">stage 3</text>
  <text x="550" y="326" fill="#8a8a8a" text-anchor="middle" font-size="13">stage 4 (end)</text>
</svg>
