<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="24" y="24" fill="#8a8a8a" font-style="italic">Two pivots from the origin to the optimum, along the edges &#8212; (4,0) and (4,3) never visited.</text>

  <!-- axes -->
  <line x1="130" y1="330" x2="520" y2="330" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="520,330 510,325 510,335" fill="#8a8a8a"/>
  <text x="528" y="336" fill="#8a8a8a">x1</text>
  <line x1="130" y1="330" x2="130" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="130,55 125,65 135,65" fill="#8a8a8a"/>
  <text x="114" y="46" fill="#8a8a8a">x2</text>

  <!-- ticks -->
  <line x1="240" y1="330" x2="240" y2="336" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="350" y1="330" x2="350" y2="336" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="460" y1="330" x2="460" y2="336" stroke="#8a8a8a" stroke-width="1"/>
  <text x="236" y="350" fill="#8a8a8a" font-size="12">2</text>
  <text x="346" y="350" fill="#8a8a8a" font-size="12">4</text>
  <text x="456" y="350" fill="#8a8a8a" font-size="12">6</text>
  <line x1="124" y1="246" x2="130" y2="246" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="124" y1="162" x2="130" y2="162" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="124" y1="78" x2="130" y2="78" stroke="#8a8a8a" stroke-width="1"/>
  <text x="112" y="251" fill="#8a8a8a" font-size="12">3</text>
  <text x="112" y="167" fill="#8a8a8a" font-size="12">6</text>
  <text x="112" y="83" fill="#8a8a8a" font-size="12">9</text>

  <!-- constraint lines -->
  <line x1="350" y1="330" x2="350" y2="60" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="356" y="68" fill="#8a8a8a" font-size="12">x1 &#8804; 4</text>
  <line x1="130" y1="162" x2="490" y2="162" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="398" y="180" fill="#8a8a8a" font-size="12">2x2 &#8804; 12</text>
  <line x1="130" y1="78" x2="460" y2="330" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="168" y="66" fill="#8a8a8a" font-size="12">3x1 + 2x2 &#8804; 18</text>

  <!-- feasible region -->
  <polygon points="130,330 350,330 350,246 240,162 130,162" fill="#4a90d9" opacity="0.15"/>
  <polygon points="130,330 350,330 350,246 240,162 130,162" fill="none" stroke="#4a90d9" stroke-width="2"/>

  <!-- unvisited vertices -->
  <circle cx="350" cy="330" r="4" fill="#8a8a8a"/>
  <circle cx="350" cy="246" r="4" fill="#8a8a8a"/>
  <text x="356" y="322" fill="#8a8a8a" font-size="12">(4,0)</text>
  <text x="358" y="242" fill="#8a8a8a" font-size="12">(4,3)</text>

  <!-- simplex path -->
  <line x1="137" y1="322" x2="137" y2="186" stroke="#e0645c" stroke-width="3"/>
  <polygon points="137,174 131,187 143,187" fill="#e0645c"/>
  <line x1="146" y1="169" x2="222" y2="169" stroke="#e0645c" stroke-width="3"/>
  <polygon points="234,169 221,163 221,175" fill="#e0645c"/>

  <!-- visited vertices -->
  <circle cx="130" cy="330" r="5" fill="#e0645c"/>
  <circle cx="130" cy="162" r="5" fill="#e0645c"/>
  <circle cx="240" cy="162" r="5" fill="#e0645c"/>

  <!-- annotations -->
  <text x="72" y="356" fill="#e0645c" font-size="12">(0,0)  z = 0</text>
  <text x="72" y="371" fill="#e0645c" font-size="12">basis s1, s2, s3</text>
  <text x="22" y="130" fill="#e0645c" font-size="12">(0,6)  z = 30</text>
  <text x="22" y="145" fill="#e0645c" font-size="12">basis s1, x2, s3</text>
  <text x="232" y="122" fill="#e0645c" font-size="12">(2,6)  z = 36  optimal</text>
  <text x="232" y="137" fill="#e0645c" font-size="12">basis x1, x2, s1</text>
</svg>
