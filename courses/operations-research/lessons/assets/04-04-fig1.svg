<svg viewBox="0 0 700 375" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="30" y="24" fill="#8a8a8a" font-style="italic" font-size="13">Left: stock drains at D, jumps back to Q, average Q/2. Right: the flat cost curve.</text>

  <text x="60" y="52" fill="#8a8a8a" font-size="13">(a) inventory over time</text>
  <text x="440" y="52" fill="#8a8a8a" font-size="13">(b) annual cost versus order quantity</text>

  <!-- ================= panel a ================= -->
  <line x1="60" y1="320" x2="360" y2="320" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="360,320 350,315 350,325" fill="#8a8a8a"/>
  <line x1="65" y1="330" x2="65" y2="95" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="65,95 60,105 70,105" fill="#8a8a8a"/>
  <text x="30" y="88" fill="#8a8a8a" font-size="13">inventory</text>
  <text x="322" y="312" fill="#8a8a8a" font-size="13">time</text>
  <text x="50" y="326" fill="#8a8a8a" font-size="12">0</text>

  <!-- order-up-to level Q -->
  <line x1="65" y1="120" x2="345" y2="120" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="46" y="125" fill="#8a8a8a">Q</text>
  <text x="92" y="110" fill="#8a8a8a" font-size="11">each ramp: demand D drains the stock at a constant rate</text>

  <!-- average level Q/2 -->
  <line x1="65" y1="220" x2="345" y2="220" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="268" y="214" fill="#e0645c" font-size="12">avg = Q/2</text>

  <!-- reorder point -->
  <line x1="65" y1="280" x2="345" y2="280" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="268" y="274" fill="#8a8a8a" font-size="12">reorder pt R</text>

  <!-- the sawtooth -->
  <polyline points="70,120 140,320 140,120 210,320 210,120 260,262" fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- lead time L -->
  <circle cx="126" cy="280" r="4.5" fill="#e0645c"/>
  <line x1="126" y1="336" x2="140" y2="336" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="126" y1="330" x2="126" y2="342" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="140" y1="330" x2="140" y2="342" stroke="#e0645c" stroke-width="1.5"/>
  <text x="148" y="341" fill="#e0645c" font-size="11">lead time L: order placed at R, arrives at 0</text>

  <!-- ================= panel b ================= -->
  <!-- flat region shading -->
  <rect x="504" y="66" width="58.5" height="254" fill="#e0645c" fill-opacity="0.13"/>

  <line x1="395" y1="320" x2="675" y2="320" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="675,320 665,315 665,325" fill="#8a8a8a"/>
  <line x1="400" y1="330" x2="400" y2="66" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="400,66 395,76 405,76" fill="#8a8a8a"/>
  <text x="386" y="326" fill="#8a8a8a" font-size="12">0</text>
  <text x="340" y="62" fill="#8a8a8a" font-size="12">dollars / year</text>
  <text x="666" y="310" fill="#8a8a8a" font-size="13">Q</text>

  <!-- x ticks -->
  <line x1="465" y1="320" x2="465" y2="326" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="453" y="338" fill="#8a8a8a" font-size="12">100</text>
  <line x1="530" y1="320" x2="530" y2="326" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="506" y="338" fill="#e0645c" font-size="12">200 = Q*</text>
  <line x1="595" y1="320" x2="595" y2="326" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="583" y="338" fill="#8a8a8a" font-size="12">300</text>
  <line x1="660" y1="320" x2="660" y2="326" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="648" y="338" fill="#8a8a8a" font-size="12">400</text>

  <!-- y ticks -->
  <line x1="394" y1="236.7" x2="400" y2="236.7" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="366" y="241" fill="#8a8a8a" font-size="12">300</text>
  <line x1="394" y1="153.3" x2="400" y2="153.3" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="366" y="158" fill="#8a8a8a" font-size="12">600</text>
  <line x1="394" y1="70" x2="400" y2="70" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="366" y="74" fill="#8a8a8a" font-size="12">900</text>

  <!-- ordering component D S / Q -->
  <polyline points="452,111.7 465,153.3 478,181.1 491,201.0 504,215.8 517,227.4 530,236.7 543,244.2 556,250.6 569,255.9 582,260.5 595,264.4 608,267.9 621,271.0 634,273.7 647,276.1 660,278.3" fill="none" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="612" y="258" fill="#8a8a8a" font-size="12">ordering DS/Q</text>

  <!-- holding component Q H / 2 -->
  <line x1="452" y1="286.7" x2="660" y2="153.3" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="614" y="192" fill="#8a8a8a" font-size="12">holding QH/2</text>

  <!-- total cost -->
  <polyline points="452,78.3 458.5,97.3 465,111.7 478,131.1 491,142.6 504,149.2 517,152.4 530,153.3 543,152.6 556,150.6 569,147.6 582,143.8 595,139.4 608,134.6 621,129.3 634,123.7 647,117.8 660,111.7" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="600" y="100" fill="#4a90d9" font-size="12">total cost</text>

  <!-- optimum markers -->
  <line x1="530" y1="320" x2="530" y2="150" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="530" cy="153.3" r="5" fill="#e0645c"/>
  <circle cx="530" cy="236.7" r="5" fill="#e0645c"/>
  <text x="406" y="240" fill="#e0645c" font-size="11">at Q* the two</text>
  <text x="406" y="254" fill="#e0645c" font-size="11">halves are equal</text>

  <text x="430" y="358" fill="#e0645c" font-size="11">shaded: cost within 2.5 percent of the minimum</text>
</svg>
