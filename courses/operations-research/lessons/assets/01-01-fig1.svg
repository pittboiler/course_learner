<svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-size="13" font-style="italic">Three walls, five corners, one sweeping level line.</text>

  <!-- ===== axes ===== -->
  <line x1="70" y1="340" x2="500" y2="340" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="500,340 490,335 490,345" fill="#8a8a8a"/>
  <text x="506" y="346" fill="#8a8a8a">x<tspan font-size="10" dy="3">1</tspan></text>

  <line x1="70" y1="340" x2="70" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,52 65,62 75,62" fill="#8a8a8a"/>
  <text x="80" y="50" fill="#8a8a8a">x<tspan font-size="10" dy="3">2</tspan></text>

  <!-- x ticks -->
  <line x1="190" y1="340" x2="190" y2="346" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="310" y1="340" x2="310" y2="346" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="430" y1="340" x2="430" y2="346" stroke="#8a8a8a" stroke-width="1"/>
  <text x="190" y="360" fill="#8a8a8a" font-size="12" text-anchor="middle">2</text>
  <text x="310" y="360" fill="#8a8a8a" font-size="12" text-anchor="middle">4</text>
  <text x="430" y="360" fill="#8a8a8a" font-size="12" text-anchor="middle">6</text>

  <!-- y ticks -->
  <line x1="64" y1="280" x2="70" y2="280" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="64" y1="220" x2="70" y2="220" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="64" y1="160" x2="70" y2="160" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="64" y1="100" x2="70" y2="100" stroke="#8a8a8a" stroke-width="1"/>
  <text x="58" y="284" fill="#8a8a8a" font-size="12" text-anchor="end">2</text>
  <text x="58" y="224" fill="#8a8a8a" font-size="12" text-anchor="end">4</text>
  <text x="58" y="164" fill="#8a8a8a" font-size="12" text-anchor="end">6</text>
  <text x="58" y="104" fill="#8a8a8a" font-size="12" text-anchor="end">8</text>

  <!-- ===== constraint lines ===== -->
  <!-- plant 1: x1 = 4 -->
  <line x1="310" y1="350" x2="310" y2="62" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="318" y="90" fill="#8a8a8a" font-size="13">x<tspan font-size="10" dy="3">1</tspan><tspan dy="-3"> &#8804; 4</tspan></text>

  <!-- plant 2: 2 x2 = 12 -->
  <line x1="60" y1="160" x2="470" y2="160" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="352" y="152" fill="#8a8a8a" font-size="13">2x<tspan font-size="10" dy="3">2</tspan><tspan dy="-3"> &#8804; 12</tspan></text>

  <!-- plant 3: 3 x1 + 2 x2 = 18 -->
  <line x1="70" y1="70" x2="442" y2="349" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="150" y="96" fill="#8a8a8a" font-size="13">3x<tspan font-size="10" dy="3">1</tspan><tspan dy="-3"> + 2x</tspan><tspan font-size="10" dy="3">2</tspan><tspan dy="-3"> &#8804; 18</tspan></text>

  <!-- ===== feasible polygon ===== -->
  <path d="M 70 340 L 310 340 L 310 250 L 190 160 L 70 160 Z"
        fill="#4a90d9" fill-opacity="0.18" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="110" y="305" fill="#4a90d9" font-size="13">feasible region</text>

  <!-- ===== objective level line 3 x1 + 5 x2 = 20 ===== -->
  <line x1="70" y1="220" x2="400" y2="319" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="84" y="212" fill="#8a8a8a" font-size="13">3x<tspan font-size="10" dy="3">1</tspan><tspan dy="-3"> + 5x</tspan><tspan font-size="10" dy="3">2</tspan><tspan dy="-3"> = 20</tspan></text>

  <!-- direction of improvement -->
  <line x1="250" y1="274" x2="340" y2="199" stroke="#e0645c" stroke-width="2"/>
  <polygon points="340,199 334.0,210.5 327.6,202.9" fill="#e0645c"/>
  <text x="346" y="192" fill="#e0645c" font-size="13">profit increases</text>

  <!-- ===== vertices ===== -->
  <circle cx="70" cy="340" r="5" fill="#e0645c"/>
  <circle cx="310" cy="340" r="5" fill="#e0645c"/>
  <circle cx="310" cy="250" r="5" fill="#e0645c"/>
  <circle cx="190" cy="160" r="5" fill="#e0645c"/>
  <circle cx="70" cy="160" r="5" fill="#e0645c"/>

  <text x="10" y="336" fill="#e0645c" font-size="13">(0, 0)</text>
  <text x="318" y="334" fill="#e0645c" font-size="13">(4, 0)</text>
  <text x="318" y="254" fill="#e0645c" font-size="13">(4, 3)</text>
  <text x="198" y="152" fill="#e0645c" font-size="13">(2, 6)</text>
  <text x="78" y="152" fill="#e0645c" font-size="13">(0, 6)</text>
</svg>
