<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Same two servers, same utilization &#8212; but one shared queue never lets a server idle while somebody waits.</text>

  <line x1="348" y1="40" x2="348" y2="304" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 5"/>

  <text x="26" y="56" fill="#8a8a8a" font-size="14">Pooled: one queue, two servers</text>

  <text x="24" y="118" fill="#8a8a8a">&#955; = 30/hr</text>
  <line x1="28" y1="150" x2="50" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="52,150 43,146 43,154" fill="#8a8a8a"/>

  <circle cx="70" cy="150" r="11" fill="#4a90d9" opacity="0.18"/>
  <circle cx="70" cy="150" r="11" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <circle cx="96" cy="150" r="11" fill="#4a90d9" opacity="0.18"/>
  <circle cx="96" cy="150" r="11" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <circle cx="122" cy="150" r="11" fill="#4a90d9" opacity="0.18"/>
  <circle cx="122" cy="150" r="11" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <circle cx="148" cy="150" r="11" fill="#4a90d9" opacity="0.18"/>
  <circle cx="148" cy="150" r="11" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="80" y="184" fill="#8a8a8a" font-size="12">one shared queue</text>

  <path d="M 162 150 L 188 150 L 188 120 L 202 120" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M 188 150 L 188 180 L 202 180" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="206,120 197,116 197,124" fill="#8a8a8a"/>
  <polygon points="206,180 197,176 197,184" fill="#8a8a8a"/>

  <rect x="206" y="98" width="58" height="44" fill="#4a90d9" opacity="0.18"/>
  <rect x="206" y="98" width="58" height="44" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="215" y="125" fill="#4a90d9" font-size="12">&#956; = 20</text>
  <rect x="206" y="158" width="58" height="44" fill="#4a90d9" opacity="0.18"/>
  <rect x="206" y="158" width="58" height="44" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="215" y="185" fill="#4a90d9" font-size="12">&#956; = 20</text>
  <text x="209" y="222" fill="#8a8a8a" font-size="12">both busy</text>

  <line x1="264" y1="120" x2="296" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="300,120 291,116 291,124" fill="#8a8a8a"/>
  <line x1="264" y1="180" x2="296" y2="180" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="300,180 291,176 291,184" fill="#8a8a8a"/>

  <text x="26" y="264" fill="#e0645c" font-size="15">W<tspan dy="4" font-size="11">q</tspan><tspan dy="-4" font-size="15"> &#8776; 3.9 min</tspan></text>
  <text x="26" y="292" fill="#8a8a8a" font-size="12">&#961; = 0.75</text>

  <text x="370" y="56" fill="#8a8a8a" font-size="14">Split: two queues, one server each</text>

  <text x="366" y="94" fill="#8a8a8a">&#955; = 15/hr</text>
  <line x1="370" y1="120" x2="388" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="392,120 383,116 383,124" fill="#8a8a8a"/>
  <circle cx="412" cy="120" r="11" fill="#4a90d9" opacity="0.18"/>
  <circle cx="412" cy="120" r="11" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <circle cx="438" cy="120" r="11" fill="#4a90d9" opacity="0.18"/>
  <circle cx="438" cy="120" r="11" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <circle cx="464" cy="120" r="11" fill="#4a90d9" opacity="0.18"/>
  <circle cx="464" cy="120" r="11" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <line x1="478" y1="120" x2="496" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="500,120 491,116 491,124" fill="#8a8a8a"/>
  <rect x="500" y="98" width="58" height="44" fill="#4a90d9" opacity="0.18"/>
  <rect x="500" y="98" width="58" height="44" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="509" y="125" fill="#4a90d9" font-size="12">&#956; = 20</text>
  <line x1="558" y1="120" x2="590" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="594,120 585,116 585,124" fill="#8a8a8a"/>

  <text x="366" y="166" fill="#8a8a8a">&#955; = 15/hr</text>
  <line x1="370" y1="192" x2="388" y2="192" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="392,192 383,188 383,196" fill="#8a8a8a"/>
  <text x="404" y="197" fill="#8a8a8a" font-size="12" font-style="italic">queue empty</text>
  <line x1="478" y1="192" x2="496" y2="192" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="500,192 491,188 491,196" fill="#8a8a8a"/>
  <rect x="500" y="170" width="58" height="44" fill="none" stroke="#e0645c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="516" y="197" fill="#e0645c" font-size="12">idle</text>

  <path d="M 496 200 C 462 210, 432 176, 438 140" fill="none" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="4 4"/>
  <polygon points="438,133 433,143 443,143" fill="#e0645c"/>

  <text x="370" y="264" fill="#e0645c" font-size="15">W<tspan dy="4" font-size="11">q</tspan><tspan dy="-4" font-size="15"> = 9 min</tspan></text>
  <text x="370" y="292" fill="#8a8a8a" font-size="12">&#961; = 0.75 each</text>

  <text x="26" y="330" fill="#e0645c" font-size="13">Identical capacity, identical utilization &#8212; pooling cuts the wait by a factor of 2.33&#215;.</text>
</svg>
