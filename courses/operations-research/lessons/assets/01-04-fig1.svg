<svg viewBox="0 0 620 290" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="18" fill="#8a8a8a" font-style="italic">Two things the simplex method assumed: a feasible origin (a), and one basis per vertex (b).</text>

  <text x="52" y="42" fill="#8a8a8a" font-style="italic" font-size="12">(a) a &#8805; constraint pushes the origin outside</text>
  <text x="378" y="42" fill="#8a8a8a" font-style="italic" font-size="12">(b) three lines, one vertex</text>

  <!-- ============ panel A ============ -->
  <line x1="58" y1="224" x2="248" y2="224" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="248,224 238,220 238,228" fill="#8a8a8a"/>
  <text x="252" y="229" fill="#8a8a8a">x1</text>
  <line x1="66" y1="230" x2="66" y2="72" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="66,72 62,82 70,82" fill="#8a8a8a"/>
  <text x="66" y="64" fill="#8a8a8a" text-anchor="middle">x2</text>

  <!-- feasible region: vertices (4,0) (5,0) (3,4) (0,5) (0,4) -->
  <polygon points="170,224 196,224 144,120 66,94 66,120" fill="#4a90d9" opacity="0.16"/>
  <polygon points="170,224 196,224 144,120 66,94 66,120" fill="none" stroke="#4a90d9" stroke-width="2"/>

  <!-- constraint lines -->
  <line x1="66" y1="120" x2="176" y2="230" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="200" y1="232" x2="116" y2="64" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="56" y1="91" x2="232" y2="150" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="74" y="214" fill="#8a8a8a" font-size="11">x1 + x2 &#8805; 4</text>
  <text x="112" y="58" fill="#8a8a8a" font-size="11">2x1 + x2 &#8804; 10</text>
  <text x="196" y="160" fill="#8a8a8a" font-size="11">x1 + 3x2 &#8804; 15</text>

  <!-- origin: infeasible start -->
  <circle cx="66" cy="224" r="5" fill="none" stroke="#e0645c" stroke-width="2"/>

  <!-- Phase I, drawn below the axis -->
  <line x1="68" y1="244" x2="162" y2="244" stroke="#e0645c" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="170,244 160,239 160,249" fill="#e0645c"/>
  <text x="66" y="266" fill="#e0645c" font-size="11">Phase I: origin &#8594; (4,0)</text>

  <!-- Phase II path along the boundary -->
  <polyline points="170,224 196,224 144,120" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="144,120 152,127.1 144.9,130.7" fill="#e0645c"/>
  <circle cx="170" cy="224" r="4" fill="#e0645c"/>
  <circle cx="196" cy="224" r="4" fill="#e0645c"/>
  <circle cx="144" cy="120" r="5" fill="#e0645c"/>
  <text x="186" y="184" fill="#e0645c" font-size="11">Phase II</text>
  <text x="144" y="110" fill="#e0645c" font-size="11" text-anchor="middle">optimum (3,4)</text>

  <circle cx="66" cy="94" r="3" fill="#8a8a8a"/>
  <circle cx="66" cy="120" r="3" fill="#8a8a8a"/>

  <!-- ============ panel B ============ -->
  <line x1="372" y1="210" x2="548" y2="210" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="548,210 538,206 538,214" fill="#8a8a8a"/>
  <text x="552" y="215" fill="#8a8a8a">x1</text>
  <line x1="380" y1="216" x2="380" y2="72" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="380,72 376,82 384,82" fill="#8a8a8a"/>
  <text x="380" y="64" fill="#8a8a8a" text-anchor="middle">x2</text>

  <polygon points="380,210 460,210 460,130 380,90" fill="#4a90d9" opacity="0.16"/>
  <polygon points="380,210 460,210 460,130 380,90" fill="none" stroke="#4a90d9" stroke-width="2"/>

  <line x1="460" y1="216" x2="460" y2="92" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="466" y="200" fill="#8a8a8a" font-size="11">x1 &#8804; 2</text>
  <line x1="372" y1="86" x2="504" y2="152" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="508" y="162" fill="#8a8a8a" font-size="11">x1 + 2x2 &#8804; 6</text>
  <line x1="412" y1="82" x2="508" y2="178" stroke="#e0645c" stroke-width="2"/>
  <text x="414" y="74" fill="#e0645c" font-size="11">x1 + x2 &#8804; 4 (redundant)</text>

  <circle cx="460" cy="130" r="5" fill="#e0645c"/>
  <text x="474" y="112" fill="#e0645c" font-size="11">three lines meet here</text>
  <text x="474" y="126" fill="#e0645c" font-size="11">&#8594; degenerate vertex (2,2)</text>
</svg>
