<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Each corner is one choice of three basic variables; the hollow point is a basis landing outside the region.</text>

  <!-- constraint lines -->
  <line x1="250" y1="170" x2="250" y2="340" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="70" y1="180" x2="430" y2="180" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="70" y1="105" x2="352" y2="340" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- feasible region -->
  <path d="M 70 330 L 250 330 L 250 255 L 160 180 L 70 180 Z" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- axes -->
  <line x1="70" y1="330" x2="400" y2="330" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="400,330 390,326 390,334" fill="#8a8a8a"/>
  <line x1="70" y1="330" x2="70" y2="90" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,90 66,100 74,100" fill="#8a8a8a"/>
  <text x="404" y="335" fill="#8a8a8a">x&#8321;</text>
  <text x="56" y="86" fill="#8a8a8a">x&#8322;</text>

  <!-- ticks -->
  <line x1="160" y1="330" x2="160" y2="336" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="250" y1="330" x2="250" y2="336" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="340" y1="330" x2="340" y2="336" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="160" y="349" fill="#8a8a8a" text-anchor="middle" font-size="11">2</text>
  <text x="250" y="349" fill="#8a8a8a" text-anchor="middle" font-size="11">4</text>
  <text x="340" y="349" fill="#8a8a8a" text-anchor="middle" font-size="11">6</text>
  <line x1="64" y1="255" x2="70" y2="255" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="64" y1="180" x2="70" y2="180" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="64" y1="105" x2="70" y2="105" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="58" y="259" fill="#8a8a8a" text-anchor="end" font-size="11">3</text>
  <text x="58" y="184" fill="#8a8a8a" text-anchor="end" font-size="11">6</text>
  <text x="58" y="109" fill="#8a8a8a" text-anchor="end" font-size="11">9</text>

  <!-- constraint labels -->
  <text x="76" y="96" fill="#8a8a8a" font-size="12">3x&#8321; + 2x&#8322; &#8804; 18</text>
  <text x="436" y="184" fill="#8a8a8a" font-size="12">2x&#8322; &#8804; 12</text>
  <text x="256" y="318" fill="#8a8a8a" font-size="12">x&#8321; &#8804; 4</text>

  <!-- vertices -->
  <circle cx="70" cy="330" r="5" fill="#4a90d9"/>
  <circle cx="250" cy="330" r="5" fill="#4a90d9"/>
  <circle cx="250" cy="255" r="5" fill="#4a90d9"/>
  <circle cx="70" cy="180" r="5" fill="#4a90d9"/>
  <circle cx="160" cy="180" r="6" fill="#e0645c"/>

  <!-- infeasible basic solution -->
  <circle cx="250" cy="180" r="5.5" fill="none" stroke="#8a8a8a" stroke-width="2"/>

  <!-- vertex labels -->
  <text x="8" y="364" fill="#4a90d9" font-size="12">(0, 0)</text>
  <text x="8" y="380" fill="#4a90d9" font-size="12">basic: s&#8321;, s&#8322;, s&#8323;</text>

  <text x="205" y="364" fill="#4a90d9" font-size="12">(4, 0)</text>
  <text x="205" y="380" fill="#4a90d9" font-size="12">basic: x&#8321;, s&#8322;, s&#8323;</text>

  <text x="262" y="252" fill="#4a90d9" font-size="12">(4, 3)</text>
  <text x="262" y="268" fill="#4a90d9" font-size="12">basic: x&#8321;, x&#8322;, s&#8322;</text>

  <text x="8" y="140" fill="#4a90d9" font-size="12">(0, 6)</text>
  <text x="8" y="156" fill="#4a90d9" font-size="12">basic: x&#8322;, s&#8321;, s&#8323;</text>

  <text x="175" y="140" fill="#e0645c" font-size="12">(2, 6)   z* = 36</text>
  <text x="175" y="156" fill="#e0645c" font-size="12">basic: x&#8321;, x&#8322;, s&#8321;</text>

  <text x="262" y="198" fill="#8a8a8a" font-size="12">(4, 6) not feasible</text>
  <text x="262" y="214" fill="#8a8a8a" font-size="12">basis x&#8321;, x&#8322;, s&#8323; gives s&#8323; = &#8722;6</text>
</svg>
