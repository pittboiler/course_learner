<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="11.5" text-anchor="start" font-style="italic">Pigeonhole: a run longer than the state count must revisit a state. The revisit is a loop you can take any number of times.</text>
  <circle cx="110.0" cy="150.0" r="20.0" fill="none" stroke="#444444" stroke-width="1.6"/>
  <text x="110.0" y="154.3" fill="#444444" font-size="12.5" text-anchor="middle">q&#8320;</text>
  <circle cx="340.0" cy="150.0" r="20.0" fill="none" stroke="#d1495b" stroke-width="1.6"/>
  <text x="340.0" y="154.3" fill="#d1495b" font-size="12.5" text-anchor="middle">q</text>
  <circle cx="640.0" cy="150.0" r="20.0" fill="none" stroke="#444444" stroke-width="1.6"/>
  <circle cx="640.0" cy="150.0" r="15.8" fill="none" stroke="#444444" stroke-width="1.3"/>
  <text x="640.0" y="154.3" fill="#444444" font-size="12.5" text-anchor="middle">q&#8348;</text>
  <text x="340.0" y="80.0" fill="#d1495b" font-size="11" text-anchor="middle">the SAME state, reached twice</text>
  <text x="340.0" y="96.0" fill="#d1495b" font-size="10.5" text-anchor="middle">&#8212; two of the &#8805; p+1 states on the run collide</text>
  <path d="M 130.0,150.0 Q 225.0,150.0 316.0,150.0" fill="none" stroke="#444444" stroke-width="1.4"/>
  <polygon points="320.0,150.0 315.6,152.3 315.6,147.7" fill="#444444"/>
  <text x="225.0" y="162.0" fill="#444444" font-size="11.5" text-anchor="middle">reading x</text>
  <path d="M 360.0,150.0 Q 490.0,150.0 616.0,150.0" fill="none" stroke="#444444" stroke-width="1.4"/>
  <polygon points="620.0,150.0 615.6,152.3 615.6,147.7" fill="#444444"/>
  <text x="490.0" y="162.0" fill="#444444" font-size="11.5" text-anchor="middle">reading z</text>
  <path d="M 329.0,165.0 C 310.0,200.0 370.0,200.0 351.0,165.0" fill="none" stroke="#d1495b" stroke-width="1.4"/>
  <polygon points="351.0,165.0 346.9,162.2 351.0,160.0" fill="#d1495b"/>
  <text x="340.0" y="209.0" fill="#d1495b" font-size="11.5" text-anchor="middle">reading y</text>
  <line x1="57.0" y1="150.0" x2="82.8" y2="150.0" stroke="#444444" stroke-width="1.4"/>
  <polygon points="87.0,150.0 82.6,152.3 82.6,147.7" fill="#444444"/>
  <text x="54.0" y="154.0" fill="#8a8a8a" font-size="10.5" text-anchor="end">start</text>
  <text x="640.0" y="190.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">accept</text>
  <line x1="20.0" y1="238.0" x2="740.0" y2="238.0" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="4 4"/>
  <text x="20.0" y="262.0" fill="#8a8a8a" font-size="11" text-anchor="start" font-style="italic">so the machine also accepts&#8230;</text>
  <text x="150.0" y="292.0" fill="#444444" font-size="14" text-anchor="middle">xz</text>
  <text x="150.0" y="312.0" fill="#8a8a8a" font-size="10" text-anchor="middle">skip the loop</text>
  <text x="278.0" y="292.0" fill="#444444" font-size="14" text-anchor="middle">xyz</text>
  <text x="278.0" y="312.0" fill="#8a8a8a" font-size="10" text-anchor="middle">the original</text>
  <text x="406.0" y="292.0" fill="#444444" font-size="14" text-anchor="middle">xyyz</text>
  <text x="406.0" y="312.0" fill="#8a8a8a" font-size="10" text-anchor="middle">go round twice</text>
  <text x="534.0" y="292.0" fill="#444444" font-size="14" text-anchor="middle">xyyyz</text>
  <text x="534.0" y="312.0" fill="#8a8a8a" font-size="10" text-anchor="middle">three times</text>
  <text x="662.0" y="292.0" fill="#444444" font-size="14" text-anchor="middle">&#8230;</text>
</svg>
