<svg viewBox="0 0 760 432" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="11.5" text-anchor="start" font-style="italic">NP is the class where a lucky guess is easy to check. The gap between the two columns below is the P vs NP question.</text>
  <rect x="60.0" y="56.0" width="150.0" height="40.0" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="135.0" y="81.0" fill="#444444" font-size="12" text-anchor="middle">input w</text>
  <rect x="60.0" y="112.0" width="150.0" height="40.0" rx="6" fill="none" stroke="#d1495b" stroke-width="1.5"/>
  <text x="135.0" y="137.0" fill="#d1495b" font-size="12" text-anchor="middle">certificate c</text>
  <text x="135.0" y="170.0" fill="#8a8a8a" font-size="10" text-anchor="middle">guessed, never computed</text>
  <line x1="214.0" y1="78.0" x2="296.1" y2="110.5" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="300.0,112.0 295.0,112.6 296.8,108.2" fill="#8a8a8a"/>
  <line x1="214.0" y1="134.0" x2="295.9" y2="118.8" stroke="#d1495b" stroke-width="1.4"/>
  <polygon points="300.0,118.0 296.1,121.1 295.2,116.5" fill="#d1495b"/>
  <rect x="304.0" y="90.0" width="190.0" height="50.0" rx="6" fill="none" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="399.0" y="111.0" fill="#4a90d9" font-size="12.5" text-anchor="middle" font-weight="bold">verifier V</text>
  <text x="399.0" y="128.0" fill="#8a8a8a" font-size="10" text-anchor="middle">runs in time poly(|w|)</text>
  <line x1="498.0" y1="115.0" x2="555.8" y2="115.0" stroke="#4a90d9" stroke-width="1.4"/>
  <polygon points="560.0,115.0 555.6,117.3 555.6,112.7" fill="#4a90d9"/>
  <text x="632.0" y="111.0" fill="#444444" font-size="12" text-anchor="middle">accept / reject</text>
  <text x="632.0" y="130.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">w &#8712; A  iff  SOME c works</text>
  <line x1="20.0" y1="196.0" x2="740.0" y2="196.0" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="4 4"/>
  <text x="20.0" y="222.0" fill="#444444" font-size="11.5" text-anchor="start" font-weight="bold">finding versus checking</text>
  <rect x="40.0" y="244.0" width="240.0" height="30.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="160.0" y="264.0" fill="#8a8a8a" font-size="11" text-anchor="middle">problem</text>
  <rect x="280.0" y="244.0" width="240.0" height="30.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="400.0" y="264.0" fill="#8a8a8a" font-size="11" text-anchor="middle">best known way to FIND</text>
  <rect x="520.0" y="244.0" width="220.0" height="30.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="630.0" y="264.0" fill="#8a8a8a" font-size="11" text-anchor="middle">cost to CHECK a certificate</text>
  <rect x="40.0" y="274.0" width="240.0" height="30.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="160.0" y="294.0" fill="#444444" font-size="11" text-anchor="middle">shortest path (s to t)</text>
  <rect x="280.0" y="274.0" width="240.0" height="30.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="400.0" y="294.0" fill="#444444" font-size="11" text-anchor="middle">breadth-first search</text>
  <rect x="520.0" y="274.0" width="220.0" height="30.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="630.0" y="294.0" fill="#444444" font-size="11" text-anchor="middle">&#8212; already easy to find</text>
  <rect x="40.0" y="304.0" width="240.0" height="30.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="160.0" y="324.0" fill="#444444" font-size="11" text-anchor="middle">Hamiltonian path</text>
  <rect x="280.0" y="304.0" width="240.0" height="30.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="400.0" y="324.0" fill="#d1495b" font-size="11" text-anchor="middle">try the n! orderings</text>
  <rect x="520.0" y="304.0" width="220.0" height="30.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="630.0" y="324.0" fill="#444444" font-size="11" text-anchor="middle">read the ordering: O(n&#178;)</text>
  <rect x="40.0" y="334.0" width="240.0" height="30.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="160.0" y="354.0" fill="#444444" font-size="11" text-anchor="middle">satisfying assignment</text>
  <rect x="280.0" y="334.0" width="240.0" height="30.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="400.0" y="354.0" fill="#d1495b" font-size="11" text-anchor="middle">try the 2&#8319; assignments</text>
  <rect x="520.0" y="334.0" width="220.0" height="30.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="630.0" y="354.0" fill="#444444" font-size="11" text-anchor="middle">plug in and evaluate: O(m)</text>
  <rect x="40.0" y="364.0" width="240.0" height="30.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="160.0" y="384.0" fill="#444444" font-size="11" text-anchor="middle">factor of a big N</text>
  <rect x="280.0" y="364.0" width="240.0" height="30.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="400.0" y="384.0" fill="#d1495b" font-size="11" text-anchor="middle">no known poly algorithm</text>
  <rect x="520.0" y="364.0" width="220.0" height="30.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="0.9"/>
  <text x="630.0" y="384.0" fill="#444444" font-size="11" text-anchor="middle">one division</text>
  <text x="380.0" y="424.0" fill="#444444" font-size="11" text-anchor="middle">Every row's right column is polynomial. That is what NP means &#8212; and nobody knows whether the middle column has to be slow.</text>
</svg>
