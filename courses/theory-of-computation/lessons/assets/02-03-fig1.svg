  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="11.5" text-anchor="start" font-style="italic">A tall parse tree repeats a variable on some root-to-leaf path. Graft the upper copy in place of the</text>
  <text x="20.0" y="36.0" fill="#8a8a8a" font-size="11.5" text-anchor="start" font-style="italic">lower one and the tree still parses &#8212; but two chunks, v and y, got duplicated at once.</text>
  <text x="210.0" y="70.0" fill="#444444" font-size="11.5" text-anchor="middle" font-weight="bold">the original derivation of s</text>
