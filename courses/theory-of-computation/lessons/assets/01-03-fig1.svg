<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="12" text-anchor="start" font-style="italic">Thompson's construction: three gadgets, glued with &#949;-moves. Each keeps one start and one accept.</text>
