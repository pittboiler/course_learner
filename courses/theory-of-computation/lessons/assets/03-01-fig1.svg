<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="11.5" text-anchor="start" font-style="italic">The a&#8319;b&#8319;c&#8319; decider on input abc: cross off one a, one b and one c per sweep, then check nothing is left over.</text>
  <text x="276.0" y="75.0" fill="#444444" font-size="12" text-anchor="end" font-weight="bold">q&#8320;</text>
  <rect x="300.0" y="58.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="315.0" y="76.0" fill="#444444" font-size="12.5" text-anchor="middle">a</text>
  <rect x="330.0" y="58.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="345.0" y="76.0" fill="#444444" font-size="12.5" text-anchor="middle">b</text>
  <rect x="360.0" y="58.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="375.0" y="76.0" fill="#444444" font-size="12.5" text-anchor="middle">c</text>
  <rect x="390.0" y="58.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="405.0" y="76.0" fill="#8a8a8a" font-size="12.5" text-anchor="middle">&#9251;</text>
  <text x="438.0" y="76.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">cross an a</text>
  <text x="276.0" y="120.0" fill="#444444" font-size="12" text-anchor="end" font-weight="bold">q&#8321;</text>
  <rect x="300.0" y="103.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="315.0" y="121.0" fill="#d1495b" font-size="12.5" text-anchor="middle">X</text>
  <rect x="330.0" y="103.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="345.0" y="121.0" fill="#444444" font-size="12.5" text-anchor="middle">b</text>
  <rect x="360.0" y="103.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="375.0" y="121.0" fill="#444444" font-size="12.5" text-anchor="middle">c</text>
  <rect x="390.0" y="103.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="405.0" y="121.0" fill="#8a8a8a" font-size="12.5" text-anchor="middle">&#9251;</text>
  <text x="438.0" y="121.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">find a b, cross it</text>
  <text x="276.0" y="165.0" fill="#444444" font-size="12" text-anchor="end" font-weight="bold">q&#8322;</text>
  <rect x="300.0" y="148.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="315.0" y="166.0" fill="#d1495b" font-size="12.5" text-anchor="middle">X</text>
  <rect x="330.0" y="148.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="345.0" y="166.0" fill="#d1495b" font-size="12.5" text-anchor="middle">Y</text>
  <rect x="360.0" y="148.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="375.0" y="166.0" fill="#444444" font-size="12.5" text-anchor="middle">c</text>
  <rect x="390.0" y="148.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="405.0" y="166.0" fill="#8a8a8a" font-size="12.5" text-anchor="middle">&#9251;</text>
  <text x="438.0" y="166.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">find a c, cross it</text>
  <text x="276.0" y="210.0" fill="#444444" font-size="12" text-anchor="end" font-weight="bold">q&#8323;</text>
  <rect x="300.0" y="193.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="315.0" y="211.0" fill="#d1495b" font-size="12.5" text-anchor="middle">X</text>
  <rect x="330.0" y="193.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="345.0" y="211.0" fill="#d1495b" font-size="12.5" text-anchor="middle">Y</text>
  <rect x="360.0" y="193.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="375.0" y="211.0" fill="#d1495b" font-size="12.5" text-anchor="middle">Z</text>
  <rect x="390.0" y="193.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="405.0" y="211.0" fill="#8a8a8a" font-size="12.5" text-anchor="middle">&#9251;</text>
  <text x="438.0" y="211.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">walk back</text>
  <text x="276.0" y="255.0" fill="#444444" font-size="12" text-anchor="end" font-weight="bold">q&#8323;</text>
  <rect x="300.0" y="238.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="315.0" y="256.0" fill="#d1495b" font-size="12.5" text-anchor="middle">X</text>
  <rect x="330.0" y="238.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="345.0" y="256.0" fill="#d1495b" font-size="12.5" text-anchor="middle">Y</text>
  <rect x="360.0" y="238.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="375.0" y="256.0" fill="#d1495b" font-size="12.5" text-anchor="middle">Z</text>
  <rect x="390.0" y="238.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="405.0" y="256.0" fill="#8a8a8a" font-size="12.5" text-anchor="middle">&#9251;</text>
  <text x="438.0" y="256.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">&#8230;to the left end</text>
  <text x="276.0" y="300.0" fill="#444444" font-size="12" text-anchor="end" font-weight="bold">q&#8320;</text>
  <rect x="300.0" y="283.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="315.0" y="301.0" fill="#d1495b" font-size="12.5" text-anchor="middle">X</text>
  <rect x="330.0" y="283.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="345.0" y="301.0" fill="#d1495b" font-size="12.5" text-anchor="middle">Y</text>
  <rect x="360.0" y="283.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="375.0" y="301.0" fill="#d1495b" font-size="12.5" text-anchor="middle">Z</text>
  <rect x="390.0" y="283.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="405.0" y="301.0" fill="#8a8a8a" font-size="12.5" text-anchor="middle">&#9251;</text>
  <text x="438.0" y="301.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">no a left &#8594; verify</text>
  <text x="276.0" y="345.0" fill="#444444" font-size="12" text-anchor="end" font-weight="bold">q&#8324;</text>
  <rect x="300.0" y="328.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="315.0" y="346.0" fill="#d1495b" font-size="12.5" text-anchor="middle">X</text>
  <rect x="330.0" y="328.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="345.0" y="346.0" fill="#d1495b" font-size="12.5" text-anchor="middle">Y</text>
  <rect x="360.0" y="328.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="375.0" y="346.0" fill="#d1495b" font-size="12.5" text-anchor="middle">Z</text>
  <rect x="390.0" y="328.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="405.0" y="346.0" fill="#8a8a8a" font-size="12.5" text-anchor="middle">&#9251;</text>
  <text x="438.0" y="346.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">only Y, Z remain</text>
  <text x="276.0" y="390.0" fill="#444444" font-size="12" text-anchor="end" font-weight="bold">q&#8324;</text>
  <rect x="300.0" y="373.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="315.0" y="391.0" fill="#d1495b" font-size="12.5" text-anchor="middle">X</text>
  <rect x="330.0" y="373.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="345.0" y="391.0" fill="#d1495b" font-size="12.5" text-anchor="middle">Y</text>
  <rect x="360.0" y="373.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="375.0" y="391.0" fill="#d1495b" font-size="12.5" text-anchor="middle">Z</text>
  <rect x="390.0" y="373.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="405.0" y="391.0" fill="#8a8a8a" font-size="12.5" text-anchor="middle">&#9251;</text>
  <text x="438.0" y="391.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">tape exhausted</text>
  <text x="276.0" y="435.0" fill="#4a90d9" font-size="12" text-anchor="end" font-weight="bold">accept</text>
  <rect x="300.0" y="418.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="315.0" y="436.0" fill="#d1495b" font-size="12.5" text-anchor="middle">X</text>
  <rect x="330.0" y="418.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="345.0" y="436.0" fill="#d1495b" font-size="12.5" text-anchor="middle">Y</text>
  <rect x="360.0" y="418.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="375.0" y="436.0" fill="#d1495b" font-size="12.5" text-anchor="middle">Z</text>
  <rect x="390.0" y="418.0" width="30.0" height="26.0" rx="0" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="405.0" y="436.0" fill="#8a8a8a" font-size="12.5" text-anchor="middle">&#9251;</text>
  <text x="276.0" y="40.0" fill="#8a8a8a" font-size="10" text-anchor="end">state</text>
  <text x="360.0" y="40.0" fill="#8a8a8a" font-size="10" text-anchor="middle">tape (blue box = head)</text>
  <text x="380.0" y="491.0" fill="#444444" font-size="11.5" text-anchor="middle">Unlike a stack, the tape can be re-read: crossing off leaves a record the machine can revisit.</text>
</svg>
