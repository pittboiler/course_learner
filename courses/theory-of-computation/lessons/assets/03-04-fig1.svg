<svg viewBox="0 0 760 478" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="11.5" text-anchor="start" font-style="italic">Five nested classes. Each label sits in the band where it lives &#8212; inside that ring, outside the next one in.</text>
  <rect x="20.0" y="40.0" width="720.0" height="412.0" rx="16" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="380.0" y="58.0" fill="#8a8a8a" font-size="12" text-anchor="middle" font-weight="bold">all languages</text>
  <rect x="52.0" y="80.0" width="656.0" height="332.0" rx="16" fill="none" stroke="#d1495b" stroke-width="1.5"/>
  <text x="380.0" y="98.0" fill="#d1495b" font-size="12" text-anchor="middle" font-weight="bold">Turing-recognizable</text>
  <rect x="88.0" y="120.0" width="584.0" height="252.0" rx="16" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="380.0" y="138.0" fill="#4a90d9" font-size="12" text-anchor="middle" font-weight="bold">decidable</text>
  <rect x="128.0" y="160.0" width="504.0" height="172.0" rx="16" fill="none" stroke="#444444" stroke-width="1.5"/>
  <text x="380.0" y="178.0" fill="#444444" font-size="12" text-anchor="middle" font-weight="bold">context-free</text>
  <rect x="176.0" y="200.0" width="408.0" height="86.0" rx="16" fill="none" stroke="#444444" stroke-width="1.5"/>
  <text x="380.0" y="218.0" fill="#444444" font-size="12" text-anchor="middle" font-weight="bold">regular</text>
  <text x="380.0" y="252.0" fill="#444444" font-size="13" text-anchor="middle">&#123;w : w ends in 01&#125;</text>
  <text x="380.0" y="268.0" fill="#8a8a8a" font-size="10" text-anchor="middle">one sticky note is enough (1.1)</text>
  <text x="380.0" y="306.0" fill="#444444" font-size="13" text-anchor="middle">&#123;a&#8319;b&#8319; : n &#8805; 0&#125;</text>
  <text x="380.0" y="322.0" fill="#8a8a8a" font-size="10" text-anchor="middle">needs a stack &#8212; not regular (1.5)</text>
  <text x="380.0" y="346.0" fill="#444444" font-size="13" text-anchor="middle">&#123;a&#8319;b&#8319;c&#8319; : n &#8805; 0&#125;</text>
  <text x="380.0" y="362.0" fill="#8a8a8a" font-size="10" text-anchor="middle">needs a tape &#8212; not context-free (2.3)</text>
  <text x="380.0" y="388.0" fill="#4a90d9" font-size="13" text-anchor="middle">A&#7511;&#7504; = &#123;&#9001;M,w&#9002; : M accepts w&#125;</text>
  <text x="380.0" y="404.0" fill="#8a8a8a" font-size="10" text-anchor="middle">simulate to say yes; nothing says no (4.1)</text>
  <text x="380.0" y="430.0" fill="#d1495b" font-size="13" text-anchor="middle">the complement of A&#7511;&#7504;</text>
  <text x="380.0" y="446.0" fill="#8a8a8a" font-size="10" text-anchor="middle">not even recognizable &#8212; and almost every language is out here (4.1)</text>
</svg>
