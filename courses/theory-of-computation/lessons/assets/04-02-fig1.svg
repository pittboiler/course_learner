<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="11.5" text-anchor="start" font-style="italic">A mapping reduction A &#8804;&#7504; B is a computable f that carries members to members AND non-members to non-members.</text>
  <rect x="40.0" y="70.0" width="250.0" height="210.0" rx="14" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="165.0" y="62.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">&#931;*  (instances of A)</text>
  <rect x="64.0" y="92.0" width="200.0" height="72.0" rx="10" fill="none" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="164.0" y="132.0" fill="#4a90d9" font-size="12.5" text-anchor="middle">A</text>
  <rect x="470.0" y="70.0" width="250.0" height="210.0" rx="14" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="595.0" y="62.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">&#931;*  (instances of B)</text>
  <rect x="494.0" y="92.0" width="200.0" height="72.0" rx="10" fill="none" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="594.0" y="132.0" fill="#4a90d9" font-size="12.5" text-anchor="middle">B</text>
  <text x="165.0" y="250.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">not in A</text>
  <text x="595.0" y="250.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">not in B</text>
  <line x1="300.0" y1="128.0" x2="457.8" y2="128.0" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="462.0,128.0 457.6,130.3 457.6,125.7" fill="#4a90d9"/>
  <text x="381.0" y="120.0" fill="#4a90d9" font-size="13" text-anchor="middle" font-style="italic">f</text>
  <line x1="300.0" y1="250.0" x2="457.8" y2="250.0" stroke="#d1495b" stroke-width="1.5"/>
  <polygon points="462.0,250.0 457.6,252.3 457.6,247.7" fill="#d1495b"/>
  <text x="381.0" y="242.0" fill="#d1495b" font-size="13" text-anchor="middle" font-style="italic">f</text>
  <text x="381.0" y="150.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">yes-instances &#8594; yes-instances</text>
  <text x="381.0" y="268.0" fill="#d1495b" font-size="10.5" text-anchor="middle">no-instances &#8594; no-instances</text>
  <text x="381.0" y="288.0" fill="#8a8a8a" font-size="10" text-anchor="middle">BOTH arrows are required. Only the first, and</text>
  <text x="381.0" y="302.0" fill="#8a8a8a" font-size="10" text-anchor="middle">f could send everything into B and prove nothing.</text>
  <text x="20.0" y="336.0" fill="#444444" font-size="11.5" text-anchor="start" font-weight="bold">How a decider for B gives a decider for A:</text>
  <rect x="40.0" y="350.0" width="150.0" height="36.0" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.1"/>
  <text x="115.0" y="373.0" fill="#444444" font-size="11.5" text-anchor="middle">input w</text>
  <line x1="193.0" y1="368.0" x2="204.8" y2="368.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <polygon points="209.0,368.0 204.6,370.3 204.6,365.7" fill="#8a8a8a"/>
  <rect x="212.0" y="350.0" width="150.0" height="36.0" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.1"/>
  <text x="287.0" y="373.0" fill="#444444" font-size="11.5" text-anchor="middle">compute f(w)</text>
  <line x1="365.0" y1="368.0" x2="376.8" y2="368.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <polygon points="381.0,368.0 376.6,370.3 376.6,365.7" fill="#8a8a8a"/>
  <rect x="384.0" y="350.0" width="150.0" height="36.0" rx="6" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="459.0" y="373.0" fill="#4a90d9" font-size="11.5" text-anchor="middle">run B's decider</text>
  <line x1="537.0" y1="368.0" x2="548.8" y2="368.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <polygon points="553.0,368.0 548.6,370.3 548.6,365.7" fill="#8a8a8a"/>
  <rect x="556.0" y="350.0" width="150.0" height="36.0" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.1"/>
  <text x="631.0" y="373.0" fill="#444444" font-size="11.5" text-anchor="middle">answer the same</text>
</svg>
