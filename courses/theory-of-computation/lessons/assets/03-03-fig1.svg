<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="11.5" text-anchor="start" font-style="italic">The universal machine U: one tape holding somebody else's program, that program's current state, and that program's tape.</text>
  <text x="20.0" y="38.0" fill="#8a8a8a" font-size="11.5" text-anchor="start" font-style="italic">Nothing here is new machinery &#8212; it is the same 7-tuple, reading a description instead of being one.</text>
  <rect x="100.0" y="90.0" width="300.0" height="44.0" rx="5" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="250.0" y="118.0" fill="#8a8a8a" font-size="13.5" text-anchor="middle">&#9001;M&#9002;</text>
  <text x="250.0" y="154.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">the program:</text>
  <text x="250.0" y="169.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">M's transition table, encoded</text>
  <rect x="412.0" y="90.0" width="78.0" height="44.0" rx="5" fill="none" stroke="#d1495b" stroke-width="1.6"/>
  <text x="451.0" y="118.0" fill="#d1495b" font-size="13.5" text-anchor="middle">q&#8323;</text>
  <text x="451.0" y="154.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">M's current state</text>
  <rect x="502.0" y="90.0" width="210.0" height="44.0" rx="5" fill="none" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="607.0" y="118.0" fill="#4a90d9" font-size="13.5" text-anchor="middle">0 1 1 &#9679;0 1</text>
  <text x="607.0" y="154.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">M's tape, with a dot</text>
  <text x="607.0" y="169.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">on the simulated head</text>
  <text x="96.0" y="118.0" fill="#8a8a8a" font-size="13" text-anchor="end">#</text>
  <text x="20.0" y="210.0" fill="#444444" font-size="11.5" text-anchor="start" font-weight="bold">U's inner loop, once per simulated step of M:</text>
  <rect x="32.0" y="226.0" width="160.0" height="54.0" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.1"/>
  <text x="112.0" y="246.0" fill="#444444" font-size="10.5" text-anchor="middle">read the dotted symbol</text>
  <text x="112.0" y="261.0" fill="#444444" font-size="10.5" text-anchor="middle">on M's tape</text>
  <line x1="195.0" y1="253.0" x2="203.8" y2="253.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <polygon points="208.0,253.0 203.6,255.3 203.6,250.7" fill="#8a8a8a"/>
  <rect x="212.0" y="226.0" width="160.0" height="54.0" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.1"/>
  <text x="292.0" y="246.0" fill="#444444" font-size="10.5" text-anchor="middle">scan &#9001;M&#9002; for the rule</text>
  <text x="292.0" y="261.0" fill="#444444" font-size="10.5" text-anchor="middle">matching (state, symbol)</text>
  <line x1="375.0" y1="253.0" x2="383.8" y2="253.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <polygon points="388.0,253.0 383.6,255.3 383.6,250.7" fill="#8a8a8a"/>
  <rect x="392.0" y="226.0" width="160.0" height="54.0" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.1"/>
  <text x="472.0" y="246.0" fill="#444444" font-size="10.5" text-anchor="middle">rewrite the dotted cell,</text>
  <text x="472.0" y="261.0" fill="#444444" font-size="10.5" text-anchor="middle">move the dot, update the state</text>
  <line x1="555.0" y1="253.0" x2="563.8" y2="253.0" stroke="#8a8a8a" stroke-width="1.1"/>
  <polygon points="568.0,253.0 563.6,255.3 563.6,250.7" fill="#8a8a8a"/>
  <rect x="572.0" y="226.0" width="160.0" height="54.0" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.1"/>
  <text x="652.0" y="246.0" fill="#444444" font-size="10.5" text-anchor="middle">if the state is M's accept</text>
  <text x="652.0" y="261.0" fill="#444444" font-size="10.5" text-anchor="middle">or reject, halt the same way</text>
  <text x="380.0" y="314.0" fill="#d1495b" font-size="11.5" text-anchor="middle">If M loops on w, U loops on &#9001;M,w&#9002;. U recognizes; it does not decide.</text>
</svg>
