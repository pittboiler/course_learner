<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="cor" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#e0645c"/>
    </marker>
    <marker id="gry" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Real forces (left) equal the mass&#215;acceleration bookkeeping (right): the FBD balances the kinetic diagram.</text>

  <!-- ===== LEFT: free-body diagram on the incline ===== -->

  <!-- incline triangle: high on the left, sloping down to the right -->
  <line x1="50" y1="250" x2="300" y2="250" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="50" y1="250" x2="50" y2="90" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="50" y1="90" x2="300" y2="250" stroke="#8a8a8a" stroke-width="2"/>
  <!-- ground hatching -->
  <line x1="70" y1="250" x2="60" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="110" y1="250" x2="100" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="150" y1="250" x2="140" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="190" y1="250" x2="180" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="230" y1="250" x2="220" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="270" y1="250" x2="260" y2="262" stroke="#8a8a8a" stroke-width="1"/>

  <!-- angle theta at the bottom-right corner -->
  <path d="M 260 250 A 40 40 0 0 1 266 228" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <text x="243" y="242" fill="#8a8a8a">&#952;</text>

  <!-- cylinder resting on the slope -->
  <circle cx="196" cy="138" r="38" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="196" cy="138" r="2.5" fill="#4a90d9"/>
  <text x="204" y="134" fill="#4a90d9">G</text>
  <!-- radius R to contact point -->
  <line x1="196" y1="138" x2="175" y2="170" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="180" y="150" fill="#4a90d9">R</text>

  <!-- weight mg (down, from G) -->
  <line x1="196" y1="138" x2="196" y2="212" stroke="#e0645c" stroke-width="2" marker-end="url(#cor)"/>
  <text x="201" y="206" fill="#e0645c">mg</text>

  <!-- normal N at contact point, outward along the surface normal -->
  <line x1="175" y1="170" x2="151" y2="132" stroke="#e0645c" stroke-width="2" marker-end="url(#cor)"/>
  <text x="132" y="128" fill="#e0645c">N</text>

  <!-- friction f up the slope, at contact point -->
  <line x1="175" y1="170" x2="121" y2="204" stroke="#e0645c" stroke-width="2" marker-end="url(#cor)"/>
  <text x="118" y="220" fill="#e0645c">f</text>

  <!-- ===== equals sign ===== -->
  <line x1="356" y1="142" x2="384" y2="142" stroke="#8a8a8a" stroke-width="2.5"/>
  <line x1="356" y1="156" x2="384" y2="156" stroke="#8a8a8a" stroke-width="2.5"/>

  <!-- ===== RIGHT: kinetic diagram ===== -->
  <circle cx="500" cy="150" r="38" fill="none" stroke="#4a90d9" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="500" cy="150" r="2.5" fill="#4a90d9"/>
  <text x="508" y="146" fill="#4a90d9">G</text>

  <!-- m a_G resultant, down the slope -->
  <line x1="500" y1="150" x2="562" y2="190" stroke="#e0645c" stroke-width="2.5" marker-end="url(#cor)"/>
  <text x="548" y="210" fill="#e0645c">m a<tspan dy="4" font-size="10">G</tspan></text>

  <!-- I_G alpha couple, clockwise -->
  <path d="M 480 138 A 24 24 0 0 1 520 138" fill="none" stroke="#e0645c" stroke-width="2" marker-end="url(#cor)"/>
  <text x="484" y="108" fill="#e0645c">I<tspan dy="4" font-size="10">G</tspan><tspan dy="-4">&#945;</tspan></text>

  <!-- slope reference under the kinetic diagram -->
  <line x1="452" y1="214" x2="560" y2="214" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4" transform="rotate(32 506 214)"/>
</svg>
