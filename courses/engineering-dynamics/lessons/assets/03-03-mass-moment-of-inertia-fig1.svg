<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="18" y="24" fill="#8a8a8a" font-style="italic">Compound pendulum: each piece brings its own I&#8320; ; the parallel-axis shift d carries it to the pivot O.</text>

  <!-- ceiling hatch + pivot -->
  <line x1="205" y1="52" x2="275" y2="52" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="212" y1="52" x2="205" y2="59" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="224" y1="52" x2="217" y2="59" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="236" y1="52" x2="229" y2="59" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="256" y1="52" x2="249" y2="59" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="268" y1="52" x2="261" y2="59" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="240" cy="60" r="5" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="240" cy="60" r="1.6" fill="#8a8a8a"/>
  <text x="252" y="56" fill="#8a8a8a">O &#8212; rotation axis (out of page)</text>

  <!-- rod (slender) -->
  <rect x="235" y="60" width="10" height="180" fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="2"/>
  <text x="290" y="150" fill="#4a90d9">rod: m&#8321;, L</text>

  <!-- rod centroidal axis + centroid G1 -->
  <line x1="221" y1="150" x2="259" y2="150" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="240" cy="150" r="3" fill="#4a90d9"/>
  <text x="262" y="146" fill="#8a8a8a">G&#8321;</text>

  <!-- disk at rod tip -->
  <circle cx="240" cy="240" r="30" fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="2"/>
  <line x1="204" y1="240" x2="276" y2="240" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="240" cy="240" r="3" fill="#4a90d9"/>
  <text x="282" y="244" fill="#8a8a8a">G&#8322;</text>
  <text x="290" y="290" fill="#4a90d9">disk: m&#8322;, R</text>
  <line x1="240" y1="240" x2="262" y2="222" stroke="#4a90d9" stroke-width="1"/>
  <text x="248" y="228" fill="#4a90d9">R</text>

  <!-- d1 dimension: O to G1 -->
  <line x1="150" y1="60" x2="240" y2="60" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="150" y1="150" x2="240" y2="150" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="150" y1="60" x2="150" y2="150" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="150,60 146,69 154,69" fill="#e0645c"/>
  <polygon points="150,150 146,141 154,141" fill="#e0645c"/>
  <text x="158" y="109" fill="#e0645c">d&#8321; = L/2</text>

  <!-- d2 dimension: O to G2 -->
  <line x1="105" y1="240" x2="240" y2="240" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="105" y1="60" x2="105" y2="240" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="105,60 101,69 109,69" fill="#e0645c"/>
  <polygon points="105,240 101,231 109,231" fill="#e0645c"/>
  <text x="42" y="154" fill="#e0645c">d&#8322; = L</text>
</svg>
