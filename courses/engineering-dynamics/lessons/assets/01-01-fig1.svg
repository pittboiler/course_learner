<svg viewBox="0 0 470 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">On a v&#8211;t graph: slope = acceleration, area underneath = displacement.</text>

  <!-- axes -->
  <line x1="60" y1="250" x2="430" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="430,250 420,245 420,255" fill="#8a8a8a"/>
  <text x="424" y="270" fill="#8a8a8a">t</text>
  <line x1="60" y1="250" x2="60" y2="60" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="60,60 55,70 65,70" fill="#8a8a8a"/>
  <text x="44" y="66" fill="#8a8a8a">v</text>
  <text x="48" y="266" fill="#8a8a8a">0</text>

  <!-- shaded area under the curve (= displacement) -->
  <path d="M 60 240 L 110 210 L 160 175 L 210 145 L 260 120 L 310 100 L 360 88 L 360 250 L 60 250 Z"
        fill="#4a90d9" opacity="0.16"/>

  <!-- the velocity curve v(t) -->
  <path d="M 60 240 L 110 210 L 160 175 L 210 145 L 260 120 L 310 100 L 360 88 L 400 82"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="376" y="76" fill="#4a90d9">v(t)</text>

  <!-- area label -->
  <text x="150" y="228" fill="#e0645c">area = &#916;x</text>

  <!-- tangent line at a point (= acceleration) -->
  <line x1="164" y1="170" x2="256" y2="120" stroke="#e0645c" stroke-width="2"/>
  <circle cx="210" cy="145" r="3.5" fill="#e0645c"/>

  <!-- slope triangle: run then rise -->
  <line x1="210" y1="145" x2="250" y2="145" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="250" y1="145" x2="250" y2="123" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="218" y="160" fill="#8a8a8a">&#916;t</text>
  <text x="256" y="138" fill="#8a8a8a">&#916;v</text>
  <text x="256" y="102" fill="#e0645c">slope = a</text>
</svg>
