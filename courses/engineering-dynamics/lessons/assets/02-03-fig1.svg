<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ed203-blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#4a90d9"/>
    </marker>
  </defs>

  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">The area under the force&#8211;time curve equals the change in momentum: J = &#916;p.</text>

  <!-- ===== left: force-time curve, area = impulse ===== -->

  <!-- F axis -->
  <line x1="70" y1="205" x2="70" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,55 65,65 75,65" fill="#8a8a8a"/>
  <text x="56" y="60" fill="#8a8a8a">F</text>
  <!-- t axis -->
  <line x1="60" y1="200" x2="315" y2="200" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="315,200 305,195 305,205" fill="#8a8a8a"/>
  <text x="318" y="205" fill="#8a8a8a">t</text>

  <!-- shaded impulse area under the force pulse -->
  <path d="M 110 200 C 140 200 150 80 180 80 C 210 80 220 200 250 200 Z"
        fill="#e0645c" fill-opacity="0.22" stroke="#e0645c" stroke-width="2.5"/>

  <!-- impulse label inside the region -->
  <text x="132" y="150" fill="#e0645c">J = &#8747;F dt</text>
  <text x="139" y="170" fill="#e0645c" font-size="12">(impulse)</text>

  <!-- t1, t2 ticks -->
  <line x1="110" y1="200" x2="110" y2="207" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="250" y1="200" x2="250" y2="207" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="103" y="222" fill="#8a8a8a">t&#8321;</text>
  <text x="243" y="222" fill="#8a8a8a">t&#8322;</text>

  <!-- ===== right: before / after momentum of a struck ball ===== -->

  <!-- before -->
  <text x="360" y="86" fill="#8a8a8a" font-style="italic">before</text>
  <circle cx="405" cy="112" r="13" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <line x1="421" y1="112" x2="500" y2="112" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#ed203-blue)"/>
  <text x="430" y="102" fill="#4a90d9">p&#8321; = m v&#8321;</text>

  <!-- after -->
  <text x="360" y="176" fill="#8a8a8a" font-style="italic">after</text>
  <circle cx="500" cy="202" r="13" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <line x1="484" y1="202" x2="392" y2="202" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#ed203-blue)"/>
  <text x="404" y="228" fill="#4a90d9">p&#8322; = m v&#8322;</text>

  <!-- the impulse that reversed it -->
  <text x="360" y="262" fill="#e0645c">impulse J = p&#8322; &#8722; p&#8321;</text>
</svg>
