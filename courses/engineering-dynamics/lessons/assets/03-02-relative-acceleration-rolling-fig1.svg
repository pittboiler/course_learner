<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="cor" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#e0645c"/>
    </marker>
    <marker id="gry" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- caption -->
  <text x="24" y="22" fill="#8a8a8a" font-style="italic">Rolling without slipping: the contact point C is the instantaneous center &#8212; zero velocity, yet it</text>
  <text x="24" y="40" fill="#8a8a8a" font-style="italic">accelerates upward at &#969;&#178;R toward the center. The top rides at twice the center's speed.</text>

  <!-- ground -->
  <line x1="40" y1="250" x2="580" y2="250" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="60" y1="250" x2="50" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="90" y1="250" x2="80" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="120" y1="250" x2="110" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="150" y1="250" x2="140" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="180" y1="250" x2="170" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="420" y1="250" x2="410" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="450" y1="250" x2="440" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="480" y1="250" x2="470" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="510" y1="250" x2="500" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="540" y1="250" x2="530" y2="262" stroke="#8a8a8a" stroke-width="1"/>

  <!-- wheel -->
  <circle cx="300" cy="170" r="80" fill="#4a90d9" fill-opacity="0.10" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- radius R (grey dashed, G to C) -->
  <line x1="300" y1="170" x2="300" y2="250" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="278" y="238" fill="#8a8a8a">R</text>

  <!-- center G -->
  <circle cx="300" cy="170" r="3.5" fill="#4a90d9"/>
  <text x="276" y="166" fill="#4a90d9">G</text>

  <!-- v_G at center -->
  <line x1="300" y1="170" x2="376" y2="170" stroke="#e0645c" stroke-width="2.5" marker-end="url(#cor)"/>
  <text x="322" y="162" fill="#e0645c">v_G = &#969;R</text>

  <!-- omega spin arc (clockwise) -->
  <path d="M 261 147.5 A 45 45 0 0 1 322.5 131" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#gry)"/>
  <text x="236" y="132" fill="#8a8a8a">&#969;</text>

  <!-- top point -->
  <circle cx="300" cy="90" r="3.5" fill="#4a90d9"/>
  <line x1="300" y1="90" x2="452" y2="90" stroke="#e0645c" stroke-width="2.5" marker-end="url(#cor)"/>
  <text x="360" y="82" fill="#e0645c">v = 2v_G</text>

  <!-- contact point C : IC, zero velocity, upward accel -->
  <circle cx="300" cy="250" r="3.5" fill="#e0645c"/>
  <line x1="300" y1="250" x2="300" y2="188" stroke="#e0645c" stroke-width="2.5" marker-end="url(#cor)"/>
  <text x="308" y="212" fill="#e0645c">a_C = &#969;&#178;R</text>
  <text x="308" y="270" fill="#8a8a8a">C  (IC:  v_C = 0)</text>
</svg>
