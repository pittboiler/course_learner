<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="24" y="24" fill="#8a8a8a" font-style="italic">The three cardinal rules &#8212; each corner is a knob you can turn to cut the dose in the middle.</text>

  <!-- triangle edges -->
  <polygon points="320,66 108,322 532,322" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- ===== center: source + dose ===== -->
  <g>
    <line x1="320" y1="185" x2="320" y2="245" stroke="#e0645c" stroke-width="1.5"/>
    <line x1="290" y1="215" x2="350" y2="215" stroke="#e0645c" stroke-width="1.5"/>
    <line x1="299" y1="194" x2="341" y2="236" stroke="#e0645c" stroke-width="1.5"/>
    <line x1="341" y1="194" x2="299" y2="236" stroke="#e0645c" stroke-width="1.5"/>
    <circle cx="320" cy="215" r="10" fill="#e0645c" opacity="0.25" stroke="#e0645c" stroke-width="2"/>
    <text x="320" y="266" fill="#e0645c" text-anchor="middle" font-weight="bold">dose H</text>
  </g>

  <!-- ===== TIME node (top) ===== -->
  <g>
    <rect x="252" y="40" width="136" height="52" rx="8" fill="#4a90d9" opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
    <text x="320" y="60" fill="#8a8a8a" text-anchor="middle" font-weight="bold">TIME</text>
    <text x="320" y="80" fill="#e0645c" text-anchor="middle">H &#8733; t</text>
  </g>
  <text x="320" y="108" fill="#8a8a8a" text-anchor="middle" font-size="12">half the time &#8594; half the dose</text>

  <!-- ===== DISTANCE node (bottom-left) ===== -->
  <g>
    <rect x="34" y="318" width="150" height="52" rx="8" fill="#4a90d9" opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
    <text x="109" y="338" fill="#8a8a8a" text-anchor="middle" font-weight="bold">DISTANCE</text>
    <text x="109" y="358" fill="#e0645c" text-anchor="middle">H &#8733; 1 / d&#178;</text>
  </g>
  <text x="109" y="306" fill="#8a8a8a" text-anchor="middle" font-size="12">2&#215; farther &#8594; &#188; the dose</text>

  <!-- ===== SHIELDING node (bottom-right) ===== -->
  <g>
    <rect x="452" y="318" width="158" height="52" rx="8" fill="#4a90d9" opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
    <text x="531" y="338" fill="#8a8a8a" text-anchor="middle" font-weight="bold">SHIELDING</text>
    <text x="531" y="358" fill="#e0645c" text-anchor="middle">H &#8733; B&#160;e^(&#8722;&#956;x)</text>
  </g>
  <text x="531" y="306" fill="#8a8a8a" text-anchor="middle" font-size="12">each HVL &#8594; &#189; the dose</text>
</svg>
