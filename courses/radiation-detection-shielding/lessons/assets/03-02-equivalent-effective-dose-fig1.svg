<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">The dose ladder: physics (Gy) &#8594; weighted for radiation type (Sv) &#8594; weighted for tissue (Sv).</text>

  <!-- ===== the ladder ===== -->

  <!-- D box -->
  <rect x="20" y="58" width="120" height="62" rx="4" fill="#4a90d9" opacity="0.14" stroke="#4a90d9" stroke-width="2"/>
  <text x="80" y="86" fill="#4a90d9" text-anchor="middle" font-size="20">D</text>
  <text x="80" y="105" fill="#8a8a8a" text-anchor="middle" font-size="12">gray (Gy)</text>
  <text x="80" y="138" fill="#8a8a8a" text-anchor="middle" font-size="11">absorbed energy</text>

  <!-- arrow D -> H -->
  <line x1="142" y1="89" x2="196" y2="89" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="196,89 186,84 186,94" fill="#8a8a8a"/>
  <text x="169" y="78" fill="#e0645c" text-anchor="middle" font-size="13">&#215; w<tspan font-size="9" dy="3">R</tspan></text>

  <!-- H box -->
  <rect x="200" y="58" width="140" height="62" rx="4" fill="#4a90d9" opacity="0.14" stroke="#4a90d9" stroke-width="2"/>
  <text x="270" y="86" fill="#4a90d9" text-anchor="middle" font-size="18">H = w<tspan font-size="11" dy="3">R</tspan><tspan dy="-3"> D</tspan></text>
  <text x="270" y="105" fill="#8a8a8a" text-anchor="middle" font-size="12">sievert (Sv)</text>
  <text x="270" y="138" fill="#8a8a8a" text-anchor="middle" font-size="11">equivalent dose</text>

  <!-- arrow H -> E -->
  <line x1="342" y1="89" x2="396" y2="89" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="396,89 386,84 386,94" fill="#8a8a8a"/>
  <text x="369" y="78" fill="#e0645c" text-anchor="middle" font-size="13">&#931; w<tspan font-size="9" dy="3">T</tspan></text>

  <!-- E box -->
  <rect x="400" y="58" width="200" height="62" rx="4" fill="#4a90d9" opacity="0.14" stroke="#e0645c" stroke-width="2"/>
  <text x="500" y="86" fill="#e0645c" text-anchor="middle" font-size="17">E = &#931;<tspan font-size="10" dy="4">T</tspan><tspan dy="-4"> w</tspan><tspan font-size="11" dy="3">T</tspan><tspan dy="-3"> H</tspan><tspan font-size="11" dy="3">T</tspan></text>
  <text x="500" y="105" fill="#8a8a8a" text-anchor="middle" font-size="12">sievert (Sv)</text>
  <text x="500" y="138" fill="#8a8a8a" text-anchor="middle" font-size="11">effective dose</text>

  <!-- ===== w_R bar chart ===== -->
  <text x="60" y="188" fill="#8a8a8a" font-size="13">Radiation weighting factor w<tspan font-size="9" dy="3">R</tspan></text>

  <!-- y axis -->
  <line x1="70" y1="330" x2="70" y2="205" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- x axis / baseline -->
  <line x1="70" y1="330" x2="420" y2="330" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- gridline + tick 20 -->
  <line x1="66" y1="220" x2="70" y2="220" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="60" y="224" fill="#8a8a8a" text-anchor="end" font-size="12">20</text>
  <!-- tick 10 -->
  <line x1="66" y1="275" x2="70" y2="275" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="60" y="279" fill="#8a8a8a" text-anchor="end" font-size="12">10</text>
  <!-- tick 1 -->
  <line x1="66" y1="324.5" x2="70" y2="324.5" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="60" y="328" fill="#8a8a8a" text-anchor="end" font-size="12">1</text>

  <!-- bar: gamma/beta = 1 (height 5.5) -->
  <rect x="105" y="324.5" width="55" height="5.5" fill="#4a90d9"/>
  <text x="132" y="346" fill="#8a8a8a" text-anchor="middle" font-size="12">&#947;, &#946;</text>

  <!-- bar: neutron ~10 (height 55) -->
  <rect x="200" y="275" width="55" height="55" fill="#4a90d9"/>
  <text x="227" y="346" fill="#8a8a8a" text-anchor="middle" font-size="12">neutron</text>
  <text x="227" y="268" fill="#8a8a8a" text-anchor="middle" font-size="10">2&#8211;20</text>

  <!-- bar: alpha = 20 (height 110) -->
  <rect x="295" y="220" width="55" height="110" fill="#e0645c"/>
  <text x="322" y="346" fill="#8a8a8a" text-anchor="middle" font-size="12">&#945;</text>

  <!-- LET note -->
  <text x="380" y="252" fill="#8a8a8a" font-size="11">denser</text>
  <text x="380" y="266" fill="#8a8a8a" font-size="11">ionization</text>
  <text x="380" y="280" fill="#8a8a8a" font-size="11">(higher LET)</text>
  <text x="380" y="294" fill="#8a8a8a" font-size="11">&#8594; larger w<tspan font-size="8" dy="2">R</tspan></text>
</svg>
