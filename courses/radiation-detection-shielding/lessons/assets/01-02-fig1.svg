<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="70" y="22" fill="#8a8a8a" font-style="italic">Lead: &#956;/&#961; is a bathtub &#8212; photoelectric falls, Compton plateaus, pair rises. Blue = total (what you measure).</text>

  <!-- ===== axes ===== -->
  <line x1="70" y1="40" x2="70" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="70" y1="300" x2="590" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- y ticks / labels (log, cm2/g) -->
  <text x="60" y="44" fill="#8a8a8a" text-anchor="end">100</text>
  <text x="60" y="109" fill="#8a8a8a" text-anchor="end">10</text>
  <text x="60" y="174" fill="#8a8a8a" text-anchor="end">1</text>
  <text x="60" y="239" fill="#8a8a8a" text-anchor="end">0.1</text>
  <text x="60" y="304" fill="#8a8a8a" text-anchor="end">0.01</text>
  <text x="24" y="175" fill="#8a8a8a" transform="rotate(-90 24 175)" text-anchor="middle">&#956;/&#961;&#160;(cm&#178;/g)</text>

  <!-- x ticks / labels (log, MeV) -->
  <text x="70" y="316" fill="#8a8a8a" text-anchor="middle">0.01</text>
  <text x="200" y="316" fill="#8a8a8a" text-anchor="middle">0.1</text>
  <text x="330" y="316" fill="#8a8a8a" text-anchor="middle">1</text>
  <text x="460" y="316" fill="#8a8a8a" text-anchor="middle">10</text>
  <text x="590" y="316" fill="#8a8a8a" text-anchor="middle">100</text>
  <text x="330" y="352" fill="#8a8a8a" text-anchor="middle">Photon energy (MeV)</text>

  <!-- ===== component curves (grey) ===== -->
  <!-- photoelectric: steep fall -->
  <path d="M 161 111 L 200 122 L 262 206 L 291 227 L 335 288" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="120" y="108" fill="#8a8a8a" font-style="italic">photoelectric</text>
  <!-- Compton: gentle plateau -->
  <path d="M 161 223 L 200 226 L 291 240 L 330 254 L 392 271 L 470 291" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="212" y="236" fill="#8a8a8a" font-style="italic">Compton</text>
  <!-- pair: rise from threshold -->
  <path d="M 392 299 L 421 283 L 460 269 L 520 255 L 590 247" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="512" y="232" fill="#8a8a8a" font-style="italic">pair</text>

  <!-- threshold marker at 1.022 MeV (x=331) -->
  <line x1="331" y1="300" x2="331" y2="286" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="331" y="283" fill="#8a8a8a" text-anchor="middle" font-size="11">1.022</text>

  <!-- ===== total (blue) ===== -->
  <path d="M 161 111 L 200 122 L 223 152 L 262 200 L 291 227 L 330 245 L 369 257 L 392 260 L 421 259 L 460 255 L 590 245" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="430" y="248" fill="#4a90d9" font-weight="bold">total &#956;/&#961;</text>

  <!-- ===== dominance bands (coral) under axis ===== -->
  <line x1="72" y1="328" x2="289" y2="328" stroke="#e0645c" stroke-width="2"/>
  <line x1="294" y1="328" x2="419" y2="328" stroke="#e0645c" stroke-width="2"/>
  <line x1="424" y1="328" x2="588" y2="328" stroke="#e0645c" stroke-width="2"/>
  <text x="180" y="341" fill="#e0645c" text-anchor="middle" font-size="11">photoelectric wins</text>
  <text x="356" y="341" fill="#e0645c" text-anchor="middle" font-size="11">Compton wins</text>
  <text x="506" y="341" fill="#e0645c" text-anchor="middle" font-size="11">pair wins</text>
</svg>
