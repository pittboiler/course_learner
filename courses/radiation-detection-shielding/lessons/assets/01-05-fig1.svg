<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Collected charge vs applied voltage: two initial ionizations (&#945; high, &#946; low) that stay apart, then merge in the GM region.</text>

  <!-- ===== axes ===== -->
  <line x1="64" y1="372" x2="620" y2="372" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="620,372 610,367 610,377" fill="#8a8a8a"/>
  <text x="470" y="404" fill="#8a8a8a" font-size="13">Applied voltage V &#8594;</text>

  <line x1="64" y1="372" x2="64" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="64,52 59,62 69,62" fill="#8a8a8a"/>
  <text x="20" y="230" fill="#8a8a8a" font-size="13" transform="rotate(-90 20 230)">Pulse amplitude (log scale)</text>

  <!-- ===== region boundaries ===== -->
  <line x1="130" y1="78" x2="130" y2="372" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="220" y1="78" x2="220" y2="372" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="345" y1="78" x2="345" y2="372" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="415" y1="78" x2="415" y2="372" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="535" y1="78" x2="535" y2="372" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ===== region labels (numbered) ===== -->
  <text x="97" y="66" fill="#8a8a8a" font-size="11" text-anchor="middle">1</text>
  <text x="97" y="360" fill="#8a8a8a" font-size="10" text-anchor="middle">Recomb.</text>

  <text x="175" y="66" fill="#8a8a8a" font-size="11" text-anchor="middle">2</text>
  <text x="175" y="93" fill="#8a8a8a" font-size="10" text-anchor="middle">Ion.</text>
  <text x="175" y="105" fill="#8a8a8a" font-size="10" text-anchor="middle">chamber</text>

  <text x="282" y="66" fill="#8a8a8a" font-size="11" text-anchor="middle">3</text>
  <text x="282" y="93" fill="#8a8a8a" font-size="10" text-anchor="middle">Proportional</text>

  <text x="380" y="66" fill="#8a8a8a" font-size="11" text-anchor="middle">4</text>
  <text x="380" y="93" fill="#8a8a8a" font-size="10" text-anchor="middle">Limited</text>
  <text x="380" y="105" fill="#8a8a8a" font-size="10" text-anchor="middle">prop.</text>

  <text x="475" y="66" fill="#8a8a8a" font-size="11" text-anchor="middle">5</text>
  <text x="475" y="93" fill="#8a8a8a" font-size="10" text-anchor="middle">Geiger&#8211;M&#252;ller</text>

  <text x="580" y="66" fill="#8a8a8a" font-size="11" text-anchor="middle">6</text>
  <text x="580" y="93" fill="#8a8a8a" font-size="10" text-anchor="middle">Continuous</text>
  <text x="580" y="105" fill="#8a8a8a" font-size="10" text-anchor="middle">discharge</text>

  <!-- ===== alpha (blue) curve ===== -->
  <path d="M 66 352 L 96 306 L 130 262 L 220 256 L 262 224 L 312 166 L 345 138 L 380 102 L 415 86 L 535 84 L 560 60 L 582 44"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- ===== beta (coral) curve ===== -->
  <path d="M 66 360 L 96 320 L 130 300 L 220 294 L 262 266 L 312 208 L 345 178 L 380 110 L 415 88"
        fill="none" stroke="#e0645c" stroke-width="3"/>

  <!-- curve labels in proportional region -->
  <text x="300" y="150" fill="#4a90d9" font-size="13">&#945;</text>
  <text x="300" y="228" fill="#e0645c" font-size="13">&#946;</text>

  <!-- merge marker -->
  <circle cx="415" cy="87" r="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="424" y="78" fill="#8a8a8a" font-size="10">curves merge</text>
</svg>
