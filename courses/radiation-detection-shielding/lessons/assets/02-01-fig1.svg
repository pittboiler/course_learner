<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Same law, two faces: a small mean is a skewed Poisson; grow the mean and it fills in to a symmetric Gaussian of width &#8730;N.</text>

  <!-- ===== left panel: small mean, skewed Poisson ===== -->
  <line x1="60" y1="250" x2="300" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="60" y1="250" x2="60" y2="80" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="52" y="270" fill="#8a8a8a" text-anchor="middle">counts N &#8594;</text>
  <text x="55" y="90" fill="#8a8a8a" text-anchor="end">P(N)</text>

  <!-- Poisson bars, mean = 3 -->
  <rect x="71" y="217" width="18" height="33" fill="#4a90d9" opacity="0.85"/>
  <rect x="95" y="150" width="18" height="100" fill="#4a90d9" opacity="0.85"/>
  <rect x="119" y="100" width="18" height="150" fill="#4a90d9" opacity="0.85"/>
  <rect x="143" y="100" width="18" height="150" fill="#4a90d9" opacity="0.85"/>
  <rect x="167" y="137" width="18" height="113" fill="#4a90d9" opacity="0.85"/>
  <rect x="191" y="182" width="18" height="68" fill="#4a90d9" opacity="0.85"/>
  <rect x="215" y="216" width="18" height="34" fill="#4a90d9" opacity="0.85"/>
  <rect x="239" y="236" width="18" height="14" fill="#4a90d9" opacity="0.85"/>
  <rect x="263" y="245" width="18" height="5" fill="#4a90d9" opacity="0.85"/>

  <text x="180" y="70" fill="#4a90d9" text-anchor="middle">mean &#956; = 3</text>
  <text x="180" y="296" fill="#8a8a8a" text-anchor="middle">skewed &#8212; long right tail</text>

  <!-- ===== right panel: large mean, Gaussian ===== -->
  <line x1="350" y1="250" x2="630" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="350" y1="250" x2="350" y2="80" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="490" y="270" fill="#8a8a8a" text-anchor="middle">counts N &#8594;</text>

  <!-- Poisson bars, mean = 25 (fill the bell) -->
  <rect x="356" y="247" width="14" height="3" fill="#4a90d9" opacity="0.7"/>
  <rect x="374" y="242" width="14" height="8" fill="#4a90d9" opacity="0.7"/>
  <rect x="392" y="230" width="14" height="20" fill="#4a90d9" opacity="0.7"/>
  <rect x="410" y="208" width="14" height="42" fill="#4a90d9" opacity="0.7"/>
  <rect x="428" y="177" width="14" height="73" fill="#4a90d9" opacity="0.7"/>
  <rect x="446" y="141" width="14" height="109" fill="#4a90d9" opacity="0.7"/>
  <rect x="464" y="112" width="14" height="138" fill="#4a90d9" opacity="0.7"/>
  <rect x="482" y="100" width="14" height="150" fill="#4a90d9" opacity="0.7"/>
  <rect x="500" y="112" width="14" height="138" fill="#4a90d9" opacity="0.7"/>
  <rect x="518" y="141" width="14" height="109" fill="#4a90d9" opacity="0.7"/>
  <rect x="536" y="177" width="14" height="73" fill="#4a90d9" opacity="0.7"/>
  <rect x="554" y="208" width="14" height="42" fill="#4a90d9" opacity="0.7"/>
  <rect x="572" y="230" width="14" height="20" fill="#4a90d9" opacity="0.7"/>
  <rect x="590" y="242" width="14" height="8" fill="#4a90d9" opacity="0.7"/>

  <!-- Gaussian envelope, mean 25, sigma 5 -->
  <path d="M 359 247 L 377 242 L 395 230 L 413 208 L 431 177 L 449 141 L 467 112 L 485 100 L 503 112 L 521 141 L 539 177 L 557 208 L 575 230 L 593 242 L 611 247"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>

  <text x="490" y="70" fill="#4a90d9" text-anchor="middle">mean &#956; = N = 25</text>

  <!-- mean tick -->
  <line x1="489" y1="250" x2="489" y2="258" stroke="#8a8a8a" stroke-width="1"/>
  <text x="489" y="290" fill="#8a8a8a" text-anchor="middle">N</text>

  <!-- +/- sqrt(N) width bracket at mean +/- 5 -->
  <line x1="444" y1="278" x2="534" y2="278" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="444,278 453,274 453,282" fill="#e0645c"/>
  <polygon points="534,278 525,274 525,282" fill="#e0645c"/>
  <line x1="444" y1="250" x2="444" y2="282" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="534" y1="250" x2="534" y2="282" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="489" y="308" fill="#e0645c" text-anchor="middle">width &#177;&#963; = &#177;&#8730;N = &#177;5</text>
</svg>
