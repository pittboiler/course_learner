<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">A layered neutron shield: slow it (moderator), catch it (absorber), then mop up the capture &#947; (high-Z).</text>

  <!-- ===== three layers ===== -->
  <!-- moderator layer -->
  <rect x="120" y="60" width="170" height="200" fill="#8a8a8a" opacity="0.10" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- absorber layer -->
  <rect x="290" y="60" width="90" height="200" fill="#8a8a8a" opacity="0.16" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- gamma shield layer -->
  <rect x="380" y="60" width="100" height="200" fill="#8a8a8a" opacity="0.24" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- layer labels -->
  <text x="205" y="282" fill="#8a8a8a" text-anchor="middle">moderator</text>
  <text x="205" y="300" fill="#8a8a8a" text-anchor="middle" font-size="12">(water / poly)</text>
  <text x="335" y="282" fill="#8a8a8a" text-anchor="middle">absorber</text>
  <text x="335" y="300" fill="#8a8a8a" text-anchor="middle" font-size="12">(&#8310;Li / &#185;&#8304;B)</text>
  <text x="430" y="282" fill="#8a8a8a" text-anchor="middle">&#947; shield</text>
  <text x="430" y="300" fill="#8a8a8a" text-anchor="middle" font-size="12">(lead)</text>

  <!-- roles -->
  <text x="205" y="52" fill="#8a8a8a" text-anchor="middle" font-size="12">SLOW (elastic scatter)</text>
  <text x="335" y="52" fill="#8a8a8a" text-anchor="middle" font-size="12">CAPTURE</text>
  <text x="430" y="52" fill="#8a8a8a" text-anchor="middle" font-size="12">STOP &#947;</text>

  <!-- ===== fast neutron in, straight ===== -->
  <line x1="20" y1="150" x2="120" y2="150" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="120,150 110,145 110,155" fill="#4a90d9"/>
  <text x="20" y="140" fill="#4a90d9" font-size="12">fast n (2 MeV)</text>

  <!-- ===== zigzag thermalizing path through moderator (shrinking steps) ===== -->
  <path d="M 120 150 L 148 118 L 176 178 L 206 128 L 234 168 L 258 138 L 278 158 L 290 150"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="150" y="205" fill="#4a90d9" font-size="12" text-anchor="middle">thermalizing</text>

  <!-- ===== capture burst in absorber ===== -->
  <g stroke="#e0645c" stroke-width="2">
    <line x1="325" y1="150" x2="325" y2="128"/>
    <line x1="325" y1="150" x2="325" y2="172"/>
    <line x1="325" y1="150" x2="305" y2="150"/>
    <line x1="325" y1="150" x2="345" y2="150"/>
    <line x1="325" y1="150" x2="311" y2="136"/>
    <line x1="325" y1="150" x2="339" y2="136"/>
    <line x1="325" y1="150" x2="311" y2="164"/>
    <line x1="325" y1="150" x2="339" y2="164"/>
  </g>
  <circle cx="325" cy="150" r="4" fill="#e0645c"/>
  <text x="325" y="120" fill="#e0645c" font-size="12" text-anchor="middle">(n,&#945;)</text>

  <!-- ===== secondary capture gamma, wavy, up-right into lead, stopped ===== -->
  <path d="M 330 146 Q 345 128 360 138 Q 375 148 390 130 Q 400 118 412 126"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="416,124 406,120 409,131" fill="#e0645c"/>
  <text x="352" y="112" fill="#e0645c" font-size="12">capture &#947;</text>
  <!-- absorbed mark inside lead -->
  <line x1="436" y1="112" x2="452" y2="128" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="452" y1="112" x2="436" y2="128" stroke="#e0645c" stroke-width="2.5"/>
  <text x="444" y="150" fill="#e0645c" font-size="12" text-anchor="middle">stopped</text>

  <!-- person side -->
  <text x="560" y="150" fill="#8a8a8a" text-anchor="middle" font-size="12">worker</text>
  <line x1="500" y1="150" x2="524" y2="150" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <polygon points="524,150 516,146 516,154" fill="#8a8a8a"/>
</svg>
