<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="46" y="24" fill="#8a8a8a" font-style="italic">A heavy charged particle loses energy slowly&#8230; then dumps most of it in a spike just before it stops.</text>

  <!-- y-axis -->
  <line x1="60" y1="250" x2="60" y2="46" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="60,46 55,56 65,56" fill="#8a8a8a"/>
  <text x="30" y="90" fill="#8a8a8a">energy</text>
  <text x="18" y="106" fill="#8a8a8a">deposited</text>
  <text x="24" y="122" fill="#8a8a8a">&#8722;dE/dx</text>

  <!-- x-axis -->
  <line x1="60" y1="250" x2="565" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="565,250 555,245 555,255" fill="#8a8a8a"/>
  <text x="470" y="286" fill="#8a8a8a">depth into medium</text>
  <text x="46" y="268" fill="#8a8a8a">0</text>

  <!-- plateau (entry region), gently rising: blue -->
  <path d="M 60 200 L 110 197 L 160 193 L 210 188 L 260 182 L 310 174 L 360 164 L 410 150 L 445 133"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- Bragg peak and fall-off: coral -->
  <path d="M 445 133 L 465 100 L 480 72 L 492 96 L 500 142 L 507 206 L 512 250"
        fill="none" stroke="#e0645c" stroke-width="3"/>

  <!-- peak label -->
  <text x="430" y="58" fill="#e0645c">Bragg peak</text>
  <line x1="478" y1="62" x2="480" y2="72" stroke="#e0645c" stroke-width="1"/>

  <!-- plateau label -->
  <text x="120" y="222" fill="#8a8a8a">plateau &#8212; slow, steady loss</text>

  <!-- range marker R -->
  <line x1="512" y1="250" x2="512" y2="228" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="506" y="270" fill="#e0645c">R</text>
  <text x="524" y="244" fill="#8a8a8a">&#8776; 0 beyond R</text>
</svg>
