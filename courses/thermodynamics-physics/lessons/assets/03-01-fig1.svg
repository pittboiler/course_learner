<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="24" fill="#8a8a8a" font-style="italic">The four potentials: each is U with a coral transform term added, and its differential names its two natural variables.</text>

  <!-- outer frame -->
  <rect x="20" y="40" width="600" height="360" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="320" y1="40" x2="320" y2="400" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="20" y1="220" x2="620" y2="220" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- ===== cell U (top-left) ===== -->
  <text x="42" y="84" fill="#4a90d9" font-size="30" font-weight="bold">U</text>
  <text x="86" y="82" fill="#8a8a8a" font-size="15">internal energy</text>
  <text x="42" y="118" fill="#8a8a8a" font-style="italic" font-size="13">natural variables:  S, V</text>
  <text x="42" y="158" font-size="17" fill="#4a90d9">dU = T dS − P dV</text>
  <text x="42" y="192" fill="#8a8a8a" font-size="12.5">T = (∂U/∂S)ᵥ    P = −(∂U/∂V)ₛ</text>

  <!-- ===== cell H (top-right) ===== -->
  <text x="342" y="84" fill="#4a90d9" font-size="30" font-weight="bold">H</text>
  <text x="386" y="82" font-size="15" fill="#4a90d9">= U <tspan fill="#e0645c">+ PV</tspan></text>
  <text x="342" y="118" fill="#8a8a8a" font-style="italic" font-size="13">natural variables:  S, P</text>
  <text x="342" y="158" font-size="17" fill="#4a90d9">dH = T dS <tspan fill="#e0645c">+ V dP</tspan></text>
  <text x="342" y="192" fill="#8a8a8a" font-size="12.5">T = (∂H/∂S)ₚ    V = (∂H/∂P)ₛ</text>

  <!-- ===== cell F (bottom-left) ===== -->
  <text x="42" y="264" fill="#4a90d9" font-size="30" font-weight="bold">F</text>
  <text x="86" y="262" font-size="15" fill="#4a90d9">= U <tspan fill="#e0645c">− TS</tspan></text>
  <text x="42" y="298" fill="#8a8a8a" font-style="italic" font-size="13">natural variables:  T, V</text>
  <text x="42" y="338" font-size="17" fill="#4a90d9">dF = <tspan fill="#e0645c">− S dT</tspan> − P dV</text>
  <text x="42" y="372" fill="#8a8a8a" font-size="12.5">S = −(∂F/∂T)ᵥ    P = −(∂F/∂V)ₜ</text>

  <!-- ===== cell G (bottom-right) ===== -->
  <text x="342" y="264" fill="#4a90d9" font-size="30" font-weight="bold">G</text>
  <text x="386" y="262" font-size="15" fill="#4a90d9">= U <tspan fill="#e0645c">+ PV − TS</tspan></text>
  <text x="342" y="298" fill="#8a8a8a" font-style="italic" font-size="13">natural variables:  T, P</text>
  <text x="342" y="338" font-size="17" fill="#4a90d9">dG = <tspan fill="#e0645c">− S dT</tspan> <tspan fill="#e0645c">+ V dP</tspan></text>
  <text x="342" y="372" fill="#8a8a8a" font-size="12.5">S = −(∂G/∂T)ₚ    V = (∂G/∂P)ₜ</text>
</svg>
