<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">If a super-engine X beat Carnot, its work could drive a Carnot fridge C — the pair would pump heat cold→hot for free.</text>

  <!-- ===== reservoirs ===== -->
  <rect x="60" y="48" width="520" height="40" fill="#e0645c" opacity="0.15" stroke="#e0645c" stroke-width="2"/>
  <text x="320" y="73" fill="#e0645c" text-anchor="middle">Hot reservoir&#160;&#160;T_h</text>

  <rect x="60" y="342" width="520" height="40" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="320" y="367" fill="#4a90d9" text-anchor="middle">Cold reservoir&#160;&#160;T_c</text>

  <!-- ===== devices ===== -->
  <rect x="140" y="185" width="120" height="80" fill="#8a8a8a" opacity="0.12" stroke="#8a8a8a" stroke-width="2"/>
  <text x="200" y="219" fill="#8a8a8a" text-anchor="middle">Super-engine</text>
  <text x="200" y="238" fill="#8a8a8a" text-anchor="middle">X  (η_X &gt; η_C)</text>

  <rect x="380" y="185" width="120" height="80" fill="#8a8a8a" opacity="0.12" stroke="#8a8a8a" stroke-width="2"/>
  <text x="440" y="219" fill="#8a8a8a" text-anchor="middle">Carnot fridge</text>
  <text x="440" y="238" fill="#8a8a8a" text-anchor="middle">C  (reversed)</text>

  <!-- ===== X: heat down from hot, heat down to cold ===== -->
  <!-- Q_h into X -->
  <line x1="200" y1="88" x2="200" y2="185" stroke="#e0645c" stroke-width="2"/>
  <polygon points="200,185 195,176 205,176" fill="#e0645c"/>
  <text x="210" y="140" fill="#e0645c">Q_h</text>
  <!-- Q_h - W out to cold -->
  <line x1="200" y1="265" x2="200" y2="342" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="200,342 195,333 205,333" fill="#4a90d9"/>
  <text x="210" y="308" fill="#4a90d9">Q_h &#8722; W</text>

  <!-- ===== work X -> C ===== -->
  <line x1="260" y1="225" x2="380" y2="225" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="380,225 371,220 371,230" fill="#8a8a8a"/>
  <text x="320" y="217" fill="#8a8a8a" text-anchor="middle">W</text>

  <!-- ===== C: heat up from cold, heat up to hot ===== -->
  <!-- Q_h' up to hot -->
  <line x1="440" y1="185" x2="440" y2="88" stroke="#e0645c" stroke-width="2"/>
  <polygon points="440,88 435,97 445,97" fill="#e0645c"/>
  <text x="450" y="140" fill="#e0645c">Q_h&#8242;</text>
  <!-- Q_h' - W up from cold -->
  <line x1="440" y1="342" x2="440" y2="265" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="440,265 435,274 445,274" fill="#4a90d9"/>
  <text x="450" y="308" fill="#4a90d9">Q_h&#8242; &#8722; W</text>

  <!-- ===== net-effect annotation ===== -->
  <text x="320" y="410" fill="#8a8a8a" font-style="italic" text-anchor="middle">Net (η_X &gt; η_C ⇒ Q_h&#8242; &gt; Q_h): heat Q_h&#8242;&#8722;Q_h moves cold→hot with no work in — a perfect fridge. Clausius says: impossible.</text>
</svg>
