<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="70" y="24" fill="#8a8a8a" font-style="italic" font-size="13">The Carnot cycle: two isotherms (blue) and two adiabats (coral) enclosing the net work (shaded).</text>

  <!-- axes -->
  <line x1="80" y1="300" x2="578" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="578,300 568,295 568,305" fill="#8a8a8a"/>
  <text x="566" y="320" fill="#8a8a8a">V</text>
  <line x1="80" y1="300" x2="80" y2="50" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="80,50 75,60 85,60" fill="#8a8a8a"/>
  <text x="66" y="60" fill="#8a8a8a">P</text>
  <text x="64" y="315" fill="#8a8a8a">0</text>

  <!-- shaded enclosed area = net work -->
  <polygon points="89.5,71.4 95.8,78.7 102.0,85.5 108.2,91.9 114.5,97.9 120.7,103.6 126.9,108.9 133.2,114.0 139.4,118.9 145.6,123.4 151.9,127.8 158.1,131.9 164.3,135.9 170.6,139.7 176.8,143.2 183.0,146.7 189.3,150.0 195.5,153.1 201.7,156.2 208.0,159.1 214.2,161.9 220.4,164.5 226.7,167.1 240.5,175.1 254.3,182.3 268.2,188.9 282.0,194.8 295.8,200.3 309.7,205.3 323.5,209.9 337.4,214.1 351.2,218.0 365.0,221.7 378.9,225.0 392.7,228.1 406.5,231.1 420.4,233.8 434.2,236.3 448.0,238.7 461.9,241.0 475.7,243.1 489.5,245.1 503.4,247.0 517.2,248.7 531.0,250.4 519.0,249.4 507.0,248.4 495.0,247.4 482.9,246.3 470.9,245.2 458.9,244.0 446.9,242.8 434.8,241.5 422.8,240.1 410.8,238.7 398.8,237.3 386.7,235.7 374.7,234.1 362.7,232.4 350.7,230.6 338.6,228.7 326.6,226.7 314.6,224.6 302.6,222.3 290.5,219.9 278.5,217.4 266.5,214.7 258.4,211.8 250.4,208.8 242.4,205.5 234.3,202.1 226.3,198.5 218.2,194.6 210.2,190.5 202.1,186.1 194.1,181.4 186.0,176.4 178.0,171.0 170.0,165.2 161.9,159.0 153.9,152.3 145.8,145.0 137.8,137.1 129.7,128.5 121.7,119.1 113.7,108.9 105.6,97.6 97.6,85.2 89.5,71.4"
           fill="#e0645c" opacity="0.15"/>

  <!-- isothermal expansion 1->2 (hot, blue) -->
  <polyline points="89.5,71.4 95.8,78.7 102.0,85.5 108.2,91.9 114.5,97.9 120.7,103.6 126.9,108.9 133.2,114.0 139.4,118.9 145.6,123.4 151.9,127.8 158.1,131.9 164.3,135.9 170.6,139.7 176.8,143.2 183.0,146.7 189.3,150.0 195.5,153.1 201.7,156.2 208.0,159.1 214.2,161.9 220.4,164.5 226.7,167.1"
            fill="none" stroke="#4a90d9" stroke-width="3"/>
  <!-- adiabatic expansion 2->3 (coral) -->
  <polyline points="226.7,167.1 240.5,175.1 254.3,182.3 268.2,188.9 282.0,194.8 295.8,200.3 309.7,205.3 323.5,209.9 337.4,214.1 351.2,218.0 365.0,221.7 378.9,225.0 392.7,228.1 406.5,231.1 420.4,233.8 434.2,236.3 448.0,238.7 461.9,241.0 475.7,243.1 489.5,245.1 503.4,247.0 517.2,248.7 531.0,250.4"
            fill="none" stroke="#e0645c" stroke-width="3"/>
  <!-- isothermal compression 3->4 (cold, blue) -->
  <polyline points="531.0,250.4 519.0,249.4 507.0,248.4 495.0,247.4 482.9,246.3 470.9,245.2 458.9,244.0 446.9,242.8 434.8,241.5 422.8,240.1 410.8,238.7 398.8,237.3 386.7,235.7 374.7,234.1 362.7,232.4 350.7,230.6 338.6,228.7 326.6,226.7 314.6,224.6 302.6,222.3 290.5,219.9 278.5,217.4 266.5,214.7"
            fill="none" stroke="#4a90d9" stroke-width="3"/>
  <!-- adiabatic compression 4->1 (coral) -->
  <polyline points="266.5,214.7 258.4,211.8 250.4,208.8 242.4,205.5 234.3,202.1 226.3,198.5 218.2,194.6 210.2,190.5 202.1,186.1 194.1,181.4 186.0,176.4 178.0,171.0 170.0,165.2 161.9,159.0 153.9,152.3 145.8,145.0 137.8,137.1 129.7,128.5 121.7,119.1 113.7,108.9 105.6,97.6 97.6,85.2 89.5,71.4"
            fill="none" stroke="#e0645c" stroke-width="3"/>

  <!-- state markers -->
  <circle cx="89.5" cy="71.4" r="4" fill="#8a8a8a"/>
  <text x="72" y="68" fill="#8a8a8a">1</text>
  <circle cx="226.7" cy="167.1" r="4" fill="#8a8a8a"/>
  <text x="230" y="162" fill="#8a8a8a">2</text>
  <circle cx="531.0" cy="250.4" r="4" fill="#8a8a8a"/>
  <text x="536" y="248" fill="#8a8a8a">3</text>
  <circle cx="266.5" cy="214.7" r="4" fill="#8a8a8a"/>
  <text x="262" y="231" fill="#8a8a8a">4</text>

  <!-- Q_h in: arrow toward hot isotherm -->
  <line x1="60" y1="150" x2="120" y2="120" stroke="#e0645c" stroke-width="2"/>
  <polygon points="120,120 110,120 116,128" fill="#e0645c"/>
  <text x="30" y="150" fill="#e0645c">Q_h in</text>
  <!-- Q_c out: arrow away from cold isotherm -->
  <line x1="470" y1="245" x2="530" y2="278" stroke="#e0645c" stroke-width="2"/>
  <polygon points="530,278 520,275 524,268" fill="#e0645c"/>
  <text x="533" y="292" fill="#e0645c">Q_c out</text>

  <!-- net work label inside loop -->
  <text x="205" y="200" fill="#e0645c">W = enclosed area</text>

  <!-- isotherm temperature tags -->
  <text x="132" y="103" fill="#4a90d9">T_h</text>
  <text x="392" y="252" fill="#4a90d9">T_c</text>

  <!-- stroke legend (upper-right, outside loop) -->
  <text x="352" y="86"  fill="#4a90d9" font-size="12.5">1→2  isothermal expand · Q_h in at T_h</text>
  <text x="352" y="108" fill="#e0645c" font-size="12.5">2→3  adiabatic expand · T_h → T_c</text>
  <text x="352" y="130" fill="#4a90d9" font-size="12.5">3→4  isothermal compress · Q_c out at T_c</text>
  <text x="352" y="152" fill="#e0645c" font-size="12.5">4→1  adiabatic compress · T_c → T_h</text>
</svg>
