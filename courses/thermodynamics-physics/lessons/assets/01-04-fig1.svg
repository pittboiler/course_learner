<svg viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Two curves through one state: the isotherm, and the steeper adiabat.</text>

  <!-- axes -->
  <line x1="70" y1="40" x2="70" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="70" y1="300" x2="575" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,40 65,52 75,52" fill="#8a8a8a"/>
  <polygon points="575,300 563,295 563,305" fill="#8a8a8a"/>
  <text x="52" y="52" fill="#8a8a8a">P</text>
  <text x="566" y="320" fill="#8a8a8a">V</text>

  <!-- isotherm (blue): P = const / V -->
  <path d="M 95.1 41.1 L 107.7 61.4 L 120.3 78.8 L 132.8 93.8 L 145.4 106.9 L 157.9 118.4 L 170.5 128.6 L 183.1 137.8 L 195.6 146.0 L 208.2 153.4 L 220.8 160.1 L 233.3 166.3 L 245.9 171.9 L 258.5 177.1 L 271.0 181.9 L 283.6 186.3 L 296.2 190.4 L 308.7 194.2 L 321.3 197.7 L 333.8 201.1 L 346.4 204.2 L 359.0 207.1 L 371.5 209.9 L 384.1 212.5 L 396.7 214.9 L 409.2 217.2 L 421.8 219.4 L 434.4 221.5 L 446.9 223.5 L 459.5 225.3 L 472.1 227.1 L 484.6 228.8 L 497.2 230.5 L 509.7 232.0 L 522.3 233.5 L 534.9 234.9 L 547.4 236.3 L 560.0 237.6"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- adiabat (coral): P = const / V^gamma, gamma = 5/3 -->
  <path d="M 130.3 45.9 L 142.2 71.3 L 154.2 92.9 L 166.1 111.4 L 178.1 127.4 L 190.0 141.3 L 201.9 153.5 L 213.9 164.3 L 225.8 173.8 L 237.7 182.4 L 249.7 190.0 L 261.6 196.9 L 273.5 203.1 L 285.5 208.7 L 297.4 213.9 L 309.3 218.6 L 321.3 222.8 L 333.2 226.8 L 345.2 230.4 L 357.1 233.8 L 369.0 236.9 L 381.0 239.7 L 392.9 242.4 L 404.8 244.9 L 416.8 247.2 L 428.7 249.4 L 440.6 251.4 L 452.6 253.3 L 464.5 255.1 L 476.4 256.7 L 488.4 258.3 L 500.3 259.8 L 512.3 261.2 L 524.2 262.5 L 536.1 263.8 L 548.1 265.0 L 560.0 266.1"
        fill="none" stroke="#e0645c" stroke-width="3"/>

  <!-- common state -->
  <circle cx="192.5" cy="144.0" r="4.5" fill="#8a8a8a"/>
  <text x="200" y="138" fill="#8a8a8a">common state</text>

  <!-- curve labels -->
  <text x="405" y="212" fill="#4a90d9">isotherm  PV = const</text>
  <text x="405" y="262" fill="#e0645c">adiabat  PV&#8309;&#8260;&#179; = const</text>

  <!-- "drops faster" annotation: gap between the curves at intermediate V -->
  <line x1="358" y1="206" x2="358" y2="232" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <polygon points="358,234 354,224 362,224" fill="#e0645c"/>
  <text x="150" y="288" fill="#8a8a8a" font-style="italic">Expand from the common state and the adiabat drops faster — it also cools.</text>
</svg>
