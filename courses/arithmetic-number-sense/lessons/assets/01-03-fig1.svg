<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="sans-serif">
  <rect x="0" y="0" width="600" height="340" fill="#ffffff"/>
  <!-- edges -->
  <g stroke="#222222" stroke-width="2">
    <line x1="300" y1="52" x2="185" y2="118"/>
    <line x1="300" y1="52" x2="415" y2="118"/>
    <line x1="185" y1="130" x2="110" y2="196"/>
    <line x1="185" y1="130" x2="255" y2="196"/>
    <line x1="415" y1="130" x2="360" y2="196"/>
    <line x1="415" y1="130" x2="470" y2="196"/>
    <line x1="255" y1="208" x2="200" y2="274"/>
    <line x1="255" y1="208" x2="310" y2="274"/>
  </g>
  <!-- composite nodes (open circles) -->
  <g fill="#ffffff" stroke="#222222" stroke-width="2">
    <circle cx="300" cy="40" r="24"/>
    <circle cx="185" cy="118" r="22"/>
    <circle cx="255" cy="196" r="22"/>
  </g>
  <!-- prime leaves (filled circles) -->
  <g fill="#1a5fb4" stroke="#1a5fb4" stroke-width="2">
    <circle cx="415" cy="118" r="22"/>
    <circle cx="110" cy="196" r="22"/>
    <circle cx="360" cy="196" r="22"/>
    <circle cx="470" cy="196" r="22"/>
    <circle cx="200" cy="274" r="22"/>
    <circle cx="310" cy="274" r="22"/>
  </g>
  <!-- labels on composites -->
  <g fill="#222222" font-size="22" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <text x="300" y="40">72</text>
    <text x="185" y="118">8</text>
    <text x="255" y="196">4</text>
  </g>
  <!-- labels on primes -->
  <g fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <text x="415" y="118">9</text>
    <text x="110" y="196">2</text>
    <text x="360" y="196">3</text>
    <text x="470" y="196">3</text>
    <text x="200" y="274">2</text>
    <text x="310" y="274">2</text>
  </g>
  <!-- legend -->
  <g font-size="15" fill="#222222">
    <circle cx="360" cy="292" r="10" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <text x="376" y="292" dominant-baseline="central">composite</text>
    <circle cx="470" cy="292" r="10" fill="#1a5fb4"/>
    <text x="486" y="292" dominant-baseline="central">prime</text>
  </g>
  <!-- result -->
  <text x="300" y="324" text-anchor="middle" font-size="20" font-weight="bold" fill="#222222">72 = 2 · 2 · 2 · 3 · 3 = 2³ · 3²</text>
</svg>
