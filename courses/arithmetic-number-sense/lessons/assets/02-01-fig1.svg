<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" font-family="sans-serif">
  <rect x="0" y="0" width="480" height="250" fill="#ffffff"/>

  <!-- Bar 1: 1/2 -->
  <text x="20" y="60" font-size="22" fill="#111111">1/2</text>
  <rect x="100" y="30" width="360" height="50" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="100" y="30" width="180" height="50" fill="#2b6cb0"/>
  <line x1="280" y1="30" x2="280" y2="80" stroke="#111111" stroke-width="2"/>

  <!-- Bar 2: 2/4 -->
  <text x="20" y="140" font-size="22" fill="#111111">2/4</text>
  <rect x="100" y="110" width="360" height="50" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="100" y="110" width="180" height="50" fill="#2b6cb0"/>
  <line x1="190" y1="110" x2="190" y2="160" stroke="#111111" stroke-width="2"/>
  <line x1="280" y1="110" x2="280" y2="160" stroke="#111111" stroke-width="2"/>
  <line x1="370" y1="110" x2="370" y2="160" stroke="#111111" stroke-width="2"/>

  <!-- Bar 3: 3/6 -->
  <text x="20" y="220" font-size="22" fill="#111111">3/6</text>
  <rect x="100" y="190" width="360" height="50" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="100" y="190" width="180" height="50" fill="#2b6cb0"/>
  <line x1="160" y1="190" x2="160" y2="240" stroke="#111111" stroke-width="2"/>
  <line x1="220" y1="190" x2="220" y2="240" stroke="#111111" stroke-width="2"/>
  <line x1="280" y1="190" x2="280" y2="240" stroke="#111111" stroke-width="2"/>
  <line x1="340" y1="190" x2="340" y2="240" stroke="#111111" stroke-width="2"/>
  <line x1="400" y1="190" x2="400" y2="240" stroke="#111111" stroke-width="2"/>

  <!-- shared half marker -->
  <line x1="280" y1="18" x2="280" y2="248" stroke="#e53e3e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="286" y="16" font-size="13" fill="#e53e3e">same shaded amount</text>
</svg>
