<svg viewBox="0 0 440 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="440" height="260" rx="10" fill="#faf9f6"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ===== LEFT: bijection (injective + surjective) ===== -->
  <text x="115" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">A function ✓</text>
  <ellipse cx="60" cy="150" rx="24" ry="78" fill="none" stroke="#333333" stroke-width="1.5"/>
  <ellipse cx="170" cy="150" rx="24" ry="78" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="60" y="248" text-anchor="middle" font-size="12" fill="#333333">domain A</text>
  <text x="170" y="248" text-anchor="middle" font-size="12" fill="#333333">codomain B</text>

  <!-- domain dots -->
  <circle cx="60" cy="100" r="6" fill="#333333"/><text x="42" y="104" text-anchor="middle" font-size="12" fill="#333333">a</text>
  <circle cx="60" cy="150" r="6" fill="#333333"/><text x="42" y="154" text-anchor="middle" font-size="12" fill="#333333">b</text>
  <circle cx="60" cy="200" r="6" fill="#333333"/><text x="42" y="204" text-anchor="middle" font-size="12" fill="#333333">c</text>
  <!-- codomain dots -->
  <circle cx="170" cy="100" r="6" fill="#333333"/><text x="188" y="104" text-anchor="middle" font-size="12" fill="#333333">1</text>
  <circle cx="170" cy="150" r="6" fill="#333333"/><text x="188" y="154" text-anchor="middle" font-size="12" fill="#333333">2</text>
  <circle cx="170" cy="200" r="6" fill="#333333"/><text x="188" y="204" text-anchor="middle" font-size="12" fill="#333333">3</text>
  <!-- arrows: one-to-one and onto -->
  <line x1="67" y1="100" x2="162" y2="100" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="67" y1="150" x2="162" y2="150" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="67" y1="200" x2="162" y2="200" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ===== RIGHT: fails both ===== -->
  <text x="325" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Fails ✗</text>
  <ellipse cx="270" cy="150" rx="24" ry="78" fill="none" stroke="#333333" stroke-width="1.5"/>
  <ellipse cx="380" cy="150" rx="24" ry="78" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="270" y="248" text-anchor="middle" font-size="12" fill="#333333">domain A</text>
  <text x="380" y="248" text-anchor="middle" font-size="12" fill="#333333">codomain B</text>

  <circle cx="270" cy="100" r="6" fill="#333333"/><text x="252" y="104" text-anchor="middle" font-size="12" fill="#333333">a</text>
  <circle cx="270" cy="150" r="6" fill="#333333"/><text x="252" y="154" text-anchor="middle" font-size="12" fill="#333333">b</text>
  <circle cx="270" cy="200" r="6" fill="#333333"/><text x="252" y="204" text-anchor="middle" font-size="12" fill="#333333">c</text>
  <circle cx="380" cy="100" r="6" fill="#333333"/><text x="398" y="104" text-anchor="middle" font-size="12" fill="#333333">1</text>
  <circle cx="380" cy="150" r="6" fill="#333333"/><text x="398" y="154" text-anchor="middle" font-size="12" fill="#333333">2</text>
  <circle cx="380" cy="200" r="7" fill="none" stroke="#dc2626" stroke-width="2"/><text x="398" y="204" text-anchor="middle" font-size="12" fill="#333333">3</text>
  <!-- a and b both hit 1 (not injective); nothing hits 3 (not surjective) -->
  <line x1="277" y1="100" x2="372" y2="100" stroke="#dc2626" stroke-width="2" marker-end="url(#ahr)"/>
  <line x1="277" y1="150" x2="372" y2="106" stroke="#dc2626" stroke-width="2" marker-end="url(#ahr)"/>
  <line x1="277" y1="200" x2="372" y2="152" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>
  <text x="325" y="228" text-anchor="middle" font-size="10.5" fill="#dc2626">two arrows → 1; nothing → 3</text>
</svg>
