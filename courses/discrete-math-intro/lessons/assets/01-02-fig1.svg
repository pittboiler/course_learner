<svg viewBox="0 0 420 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Universe rectangle U -->
  <rect x="10" y="10" width="400" height="260" rx="6"
        fill="#33333310" stroke="#333333" stroke-width="2"/>
  <text x="24" y="32" font-family="sans-serif" font-size="18" fill="#333333" font-style="italic">U</text>

  <!-- Circle A -->
  <circle cx="165" cy="145" r="95" fill="#3a7bd510" stroke="#333333" stroke-width="2"/>
  <!-- Circle B -->
  <circle cx="255" cy="145" r="95" fill="#d5883a10" stroke="#333333" stroke-width="2"/>

  <!-- Set labels -->
  <text x="95" y="150" font-family="sans-serif" font-size="22" fill="#333333" font-style="italic" text-anchor="middle">A</text>
  <text x="325" y="150" font-family="sans-serif" font-size="22" fill="#333333" font-style="italic" text-anchor="middle">B</text>

  <!-- Region labels -->
  <text x="120" y="200" font-family="sans-serif" font-size="14" fill="#333333" text-anchor="middle">A \ B</text>
  <text x="210" y="200" font-family="sans-serif" font-size="14" fill="#333333" text-anchor="middle">A ∩ B</text>
  <text x="300" y="200" font-family="sans-serif" font-size="14" fill="#333333" text-anchor="middle">B \ A</text>
  <text x="60" y="255" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">outside (in U, not in A∪B)</text>
</svg>
