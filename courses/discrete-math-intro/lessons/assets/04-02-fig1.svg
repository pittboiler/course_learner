<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="400" height="300" fill="#faf9f6"/>
  <text x="200" y="24" fill="#333333" font-size="15" font-weight="bold" text-anchor="middle">A graph and its degrees</text>

  <!-- edges (drawn first, behind the vertices) -->
  <line x1="200" y1="70" x2="105" y2="145" stroke="#333333" stroke-width="2.5"/>
  <line x1="200" y1="70" x2="295" y2="145" stroke="#333333" stroke-width="2.5"/>
  <line x1="105" y1="145" x2="295" y2="145" stroke="#333333" stroke-width="2.5"/>
  <line x1="105" y1="145" x2="200" y2="220" stroke="#333333" stroke-width="2.5"/>
  <line x1="295" y1="145" x2="200" y2="220" stroke="#333333" stroke-width="2.5"/>
  <line x1="200" y1="220" x2="335" y2="255" stroke="#333333" stroke-width="2.5"/>

  <!-- vertices (saturated accent dots) -->
  <circle cx="200" cy="70"  r="13" fill="#2a9d8f"/>
  <circle cx="105" cy="145" r="13" fill="#2a9d8f"/>
  <circle cx="295" cy="145" r="13" fill="#2a9d8f"/>
  <circle cx="200" cy="220" r="13" fill="#2a9d8f"/>
  <circle cx="335" cy="255" r="13" fill="#2a9d8f"/>

  <!-- vertex labels (inside the dots, light on saturated fill is OK here) -->
  <text x="200" y="75"  fill="#faf9f6" font-size="14" font-weight="bold" text-anchor="middle">A</text>
  <text x="105" y="150" fill="#faf9f6" font-size="14" font-weight="bold" text-anchor="middle">B</text>
  <text x="295" y="150" fill="#faf9f6" font-size="14" font-weight="bold" text-anchor="middle">C</text>
  <text x="200" y="225" fill="#faf9f6" font-size="14" font-weight="bold" text-anchor="middle">D</text>
  <text x="335" y="260" fill="#faf9f6" font-size="14" font-weight="bold" text-anchor="middle">E</text>

  <!-- degree labels (dark text) -->
  <text x="200" y="50"  fill="#333333" font-size="13" text-anchor="middle">deg 2</text>
  <text x="72"  y="140" fill="#333333" font-size="13" text-anchor="end">deg 3</text>
  <text x="328" y="140" fill="#333333" font-size="13" text-anchor="start">deg 3</text>
  <text x="200" y="245" fill="#333333" font-size="13" text-anchor="middle">deg 3</text>
  <text x="335" y="282" fill="#333333" font-size="13" text-anchor="middle">deg 1</text>

  <!-- handshake caption -->
  <text x="200" y="298" fill="#2a9d8f" font-size="13" font-weight="bold" text-anchor="middle">2+3+3+3+1 = 12 = 2 &#215; 6 edges</text>
</svg>
