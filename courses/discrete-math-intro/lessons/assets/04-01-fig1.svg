<svg viewBox="0 0 340 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="340" height="340" rx="12" fill="#faf9f6"/>
  <defs>
    <marker id="wrap" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- clock face -->
  <circle cx="170" cy="170" r="142" fill="none" stroke="#333333" stroke-width="2"/>
  <circle cx="170" cy="170" r="3.5" fill="#333333"/>

  <!-- tick + numbers 0..11 (0 at top, clockwise) -->
  <text x="170"   y="51"    text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">0</text>
  <text x="232.5" y="67.75" text-anchor="middle" font-size="16" fill="#333333">1</text>
  <text x="278.25" y="113.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#ea580c">2</text>
  <text x="295"   y="176"   text-anchor="middle" font-size="16" fill="#333333">3</text>
  <text x="278.25" y="238.5" text-anchor="middle" font-size="16" fill="#333333">4</text>
  <text x="232.5" y="284.25" text-anchor="middle" font-size="16" fill="#333333">5</text>
  <text x="170"   y="301"   text-anchor="middle" font-size="16" fill="#333333">6</text>
  <text x="107.5" y="284.25" text-anchor="middle" font-size="16" fill="#333333">7</text>
  <text x="61.75" y="238.5" text-anchor="middle" font-size="16" fill="#333333">8</text>
  <text x="41"    y="176"   text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">9</text>
  <text x="61.75" y="113.5" text-anchor="middle" font-size="16" fill="#333333">10</text>
  <text x="107.5" y="67.75" text-anchor="middle" font-size="16" fill="#333333">11</text>

  <!-- start marker at 9 -->
  <circle cx="75" cy="170" r="4.5" fill="#333333"/>

  <!-- wrap-around arc: from 9, clockwise past 0, to 2  (9 + 5 = 2 mod 12) -->
  <path d="M 75 170 A 95 95 0 0 1 252.3 122.5" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#wrap)"/>

  <!-- caption -->
  <text x="170" y="330" text-anchor="middle" font-size="13" fill="#333333">9 + 5 = 2 (mod 12): five steps clockwise wrap past 0</text>
</svg>
