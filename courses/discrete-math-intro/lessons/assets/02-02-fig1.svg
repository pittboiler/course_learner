<svg viewBox="0 0 460 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="460" height="200" rx="10" fill="#faf9f6"/>

  <!-- ground line -->
  <line x1="20" y1="150" x2="440" y2="150" stroke="#333333" stroke-width="2"/>

  <!-- Domino 1: base case, tipped over (fallen to the right) -->
  <g transform="translate(48 150) rotate(-62)">
    <rect x="-15" y="-70" width="30" height="70" rx="3" fill="#e07a5f" stroke="#333333" stroke-width="2"/>
    <line x1="0" y1="-58" x2="0" y2="-12" stroke="#333333" stroke-width="1.5"/>
  </g>
  <text x="40" y="182" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle">base case</text>
  <text x="40" y="196" font-family="sans-serif" font-size="11" fill="#333333" text-anchor="middle">(n = 1 falls)</text>

  <!-- push arrow from domino 1 toward domino 2 -->
  <path d="M 92 96 q 22 -6 40 4" fill="none" stroke="#3d5a80" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Standing dominoes k-1, k, k+1, ... -->
  <g>
    <rect x="150" y="80" width="26" height="70" rx="3" fill="#eaddc7" stroke="#333333" stroke-width="2"/>
    <rect x="205" y="80" width="26" height="70" rx="3" fill="#f2cc8f" stroke="#333333" stroke-width="2"/>
    <text x="218" y="120" font-family="sans-serif" font-size="15" fill="#333333" text-anchor="middle" font-weight="bold">k</text>
    <rect x="260" y="80" width="26" height="70" rx="3" fill="#f2cc8f" stroke="#333333" stroke-width="2"/>
    <text x="273" y="116" font-family="sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">k+1</text>
    <rect x="315" y="80" width="26" height="70" rx="3" fill="#eaddc7" stroke="#333333" stroke-width="2"/>
    <rect x="370" y="80" width="26" height="70" rx="3" fill="#eaddc7" stroke="#333333" stroke-width="2"/>
  </g>

  <!-- inductive step arrow: k knocks k+1 -->
  <path d="M 234 60 q 16 -10 28 14" fill="none" stroke="#3d5a80" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="248" y="40" font-family="sans-serif" font-size="12" fill="#3d5a80" text-anchor="middle" font-weight="bold">if k falls,</text>
  <text x="248" y="54" font-family="sans-serif" font-size="12" fill="#3d5a80" text-anchor="middle" font-weight="bold">k+1 falls</text>

  <!-- ellipsis for "and so on forever" -->
  <text x="418" y="120" font-family="sans-serif" font-size="18" fill="#333333" text-anchor="middle">…</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d5a80"/>
    </marker>
  </defs>
</svg>
