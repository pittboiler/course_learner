<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>

  <!-- title -->
  <text x="380" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#111111">The Curry&#8211;Howard&#8211;Lambek dictionary</text>
  <text x="380" y="56" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#555555">one idea, three vocabularies</text>

  <!-- table geometry: 3 columns, header + 5 rows -->
  <!-- column x-centres: 175, 405, 635 ; left edge 30, right edge 730 -->
  <!-- header y band 74..112 ; rows each 46 tall from 112 -->

  <!-- outer + inner grid -->
  <rect x="30" y="74" width="700" height="304" fill="none" stroke="#111111" stroke-width="1.6"/>
  <!-- vertical column separators at x=290 and x=520 -->
  <line x1="290" y1="74" x2="290" y2="378" stroke="#111111" stroke-width="1.2"/>
  <line x1="520" y1="74" x2="520" y2="378" stroke="#111111" stroke-width="1.2"/>
  <!-- header separator -->
  <line x1="30" y1="112" x2="730" y2="112" stroke="#111111" stroke-width="1.6"/>
  <!-- row separators -->
  <line x1="30" y1="158" x2="730" y2="158" stroke="#888888" stroke-width="1"/>
  <line x1="30" y1="204" x2="730" y2="204" stroke="#888888" stroke-width="1"/>
  <line x1="30" y1="250" x2="730" y2="250" stroke="#888888" stroke-width="1"/>
  <line x1="30" y1="296" x2="730" y2="296" stroke="#888888" stroke-width="1"/>
  <line x1="30" y1="332" x2="730" y2="332" stroke="#111111" stroke-width="1.6"/>

  <!-- header labels -->
  <text x="160" y="99" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#111111">Logic</text>
  <text x="405" y="99" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#111111">Programming (types)</text>
  <text x="625" y="99" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#111111">Category theory</text>

  <!-- row 1: proposition / type / object -->
  <text x="160" y="141" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">proposition</text>
  <text x="405" y="141" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">type</text>
  <text x="625" y="141" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">object</text>

  <!-- row 2: proof / program / morphism -->
  <text x="160" y="187" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">proof of A</text>
  <text x="405" y="187" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">program a : A</text>
  <text x="625" y="187" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">morphism 1 &#8594; A</text>

  <!-- row 3: conjunction / pair / product -->
  <text x="160" y="233" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">A &#8743; B  (and)</text>
  <text x="405" y="233" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">pair type A &#215; B</text>
  <text x="625" y="233" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">product A &#215; B</text>

  <!-- row 4: implication / function / exponential -->
  <text x="160" y="279" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">A &#8658; B  (implies)</text>
  <text x="405" y="279" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">function A &#8594; B</text>
  <text x="625" y="279" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">exponential B<tspan dy="-7" font-size="12">A</tspan></text>

  <!-- row 5: truth / unit / terminal -->
  <text x="160" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">&#8868;  (true)</text>
  <text x="405" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">unit type ( )</text>
  <text x="625" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">terminal object 1</text>

  <!-- bottom highlighted row: the adjunction -->
  <text x="380" y="358" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-style="italic" fill="#111111">currying:  proof of A &#8743; B &#8658; C   =   proof of A &#8658; (B &#8658; C)   =   the adjunction  (&#8211; &#215; B) &#8869; (&#8211;)<tspan dy="-6" font-size="11">B</tspan></text>
</svg>
