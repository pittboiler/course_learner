<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380">
  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111111"/>
    </marker>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif" fill="#111111" stroke="#111111">

    <text x="360" y="30" font-size="16" text-anchor="middle" stroke="none" font-weight="bold">A representable functor F &#8773; Hom(A, &#8722;)</text>
    <text x="360" y="50" font-size="12.5" text-anchor="middle" stroke="none" fill="#444444">one universal element u &#8712; FA generates every value</text>

    <!-- ===== LEFT: the category C ===== -->
    <text x="150" y="92" font-size="13" text-anchor="middle" stroke="none" fill="#444444" font-style="italic">in &#119966;</text>

    <!-- A -->
    <circle cx="150" cy="130" r="4" fill="#111111"/>
    <text x="150" y="122" font-size="16" text-anchor="middle" stroke="none">A</text>
    <text x="132" y="135" font-size="12" text-anchor="middle" stroke="none" fill="#888888">(rep. obj.)</text>

    <!-- X -->
    <circle cx="150" cy="300" r="4" fill="#111111"/>
    <text x="150" y="322" font-size="16" text-anchor="middle" stroke="none">X</text>

    <!-- f : A -> X -->
    <line x1="150" y1="136" x2="150" y2="292" stroke-width="1.6" marker-end="url(#ah)"/>
    <text x="163" y="218" font-size="15" text-anchor="middle" stroke="none" font-style="italic">f</text>
    <text x="205" y="222" font-size="12" text-anchor="middle" stroke="none" fill="#888888">any map</text>

    <!-- ===== RIGHT: the sets FA, FX ===== -->
    <text x="530" y="92" font-size="13" text-anchor="middle" stroke="none" fill="#444444" font-style="italic">in &#119982;&#119890;&#119905;</text>

    <!-- FA box -->
    <rect x="430" y="105" width="200" height="70" fill="none" stroke-width="1.4"/>
    <text x="452" y="127" font-size="15" text-anchor="middle" stroke="none">FA</text>
    <circle cx="540" cy="140" r="4" fill="#111111"/>
    <text x="540" y="130" font-size="14" text-anchor="middle" stroke="none" font-style="italic">u</text>

    <!-- FX box -->
    <rect x="430" y="275" width="200" height="70" fill="none" stroke-width="1.4"/>
    <text x="452" y="297" font-size="15" text-anchor="middle" stroke="none">FX</text>
    <circle cx="540" cy="312" r="4" fill="#111111"/>
    <text x="540" y="336" font-size="13" text-anchor="middle" stroke="none">(Ff)(u)</text>

    <!-- Ff : FA -> FX -->
    <line x1="540" y1="146" x2="540" y2="306" stroke-width="1.6" marker-end="url(#ah)"/>
    <text x="565" y="228" font-size="14" text-anchor="middle" stroke="none">Ff</text>

    <!-- correspondence f <-> (Ff)(u), drawn as a dashed bridge -->
    <line x1="220" y1="300" x2="425" y2="312" stroke-width="1.2" stroke-dasharray="5,4"/>
    <text x="322" y="366" font-size="12.5" text-anchor="middle" stroke="none" fill="#444444">f &#8614; (Ff)(u) : the natural bijection Hom(A,X) &#8773; FX</text>

  </g>
</svg>
