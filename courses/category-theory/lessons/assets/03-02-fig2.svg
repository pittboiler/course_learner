<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360">
  <rect x="0" y="0" width="700" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- object labels -->
  <text x="120" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">E</text>
  <text x="370" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">A</text>
  <text x="620" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">B</text>
  <text x="120" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">T</text>

  <!-- e : E -> A -->
  <line x1="152" y1="250" x2="340" y2="250" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="246" y="236" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-style="italic" fill="#111111">e</text>

  <!-- f : A -> B (upper) -->
  <line x1="402" y1="240" x2="590" y2="240" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="496" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-style="italic" fill="#111111">f</text>

  <!-- g : A -> B (lower) -->
  <line x1="402" y1="262" x2="590" y2="262" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="496" y="285" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-style="italic" fill="#111111">g</text>

  <!-- t : T -> A -->
  <line x1="150" y1="98" x2="352" y2="230" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="272" y="142" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-style="italic" fill="#111111">t</text>

  <!-- u : T -> E (dashed, unique) -->
  <line x1="120" y1="112" x2="120" y2="222" stroke="#111111" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrow)"/>
  <text x="100" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-style="italic" fill="#111111">u</text>
  <text x="63" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111111">(unique)</text>

  <!-- condition -->
  <text x="496" y="325" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-style="italic" fill="#111111">fe = ge,  ft = gt</text>
</svg>
