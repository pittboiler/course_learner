<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520">
  <rect x="0" y="0" width="700" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- corner labels -->
  <text x="310" y="253" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-style="italic" fill="#111111">A<tspan font-style="normal" dx="2">&#215;</tspan><tspan dy="8" font-size="16">C</tspan><tspan dy="-8" font-size="27"> B</tspan></text>
  <text x="560" y="253" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">A</text>
  <text x="310" y="478" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">B</text>
  <text x="560" y="478" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">C</text>
  <text x="120" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">T</text>

  <!-- square: top  P -> A  (projection p) -->
  <line x1="372" y1="244" x2="527" y2="244" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="448" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-style="italic" fill="#111111">p</text>

  <!-- square: left  P -> B  (projection q) -->
  <line x1="310" y1="270" x2="310" y2="440" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-style="italic" fill="#111111">q</text>

  <!-- square: right  A -> C  (f) -->
  <line x1="560" y1="270" x2="560" y2="440" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-style="italic" fill="#111111">f</text>

  <!-- square: bottom  B -> C  (g) -->
  <line x1="345" y1="470" x2="527" y2="470" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="458" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-style="italic" fill="#111111">g</text>

  <!-- cone leg a : T -> A -->
  <line x1="150" y1="82" x2="528" y2="234" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-style="italic" fill="#111111">a</text>

  <!-- cone leg b : T -> B -->
  <line x1="118" y1="112" x2="288" y2="452" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="176" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-style="italic" fill="#111111">b</text>

  <!-- mediating arrow u : T -> P (dashed, unique) -->
  <line x1="146" y1="104" x2="286" y2="230" stroke="#111111" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrow)"/>
  <text x="238" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-style="italic" fill="#111111">u</text>
  <text x="228" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111111">(unique)</text>

  <!-- commutes note -->
  <text x="435" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-style="italic" fill="#111111">fp = gq</text>
</svg>
