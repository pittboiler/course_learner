<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440">
  <rect x="0" y="0" width="780" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- panel titles -->
  <text x="190" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#111111">PRODUCT  (map in)</text>
  <text x="580" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#111111">COPRODUCT  (map out)</text>

  <!-- divider -->
  <line x1="390" y1="45" x2="390" y2="420" stroke="#cccccc" stroke-width="1"/>

  <!-- ==================== PRODUCT ==================== -->
  <text x="190" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">X</text>
  <text x="190" y="228" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">A&#215;B</text>
  <text x="60" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">A</text>
  <text x="320" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">B</text>

  <!-- unique mediating arrow (dashed) -->
  <line x1="190" y1="72" x2="190" y2="204" stroke="#111111" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
  <text x="232" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-style="italic" fill="#111111">&#10216;f, g&#10217;</text>
  <text x="234" y="162" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111111">(unique)</text>

  <!-- f : X -> A -->
  <line x1="171" y1="66" x2="70" y2="360" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="101" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-style="italic" fill="#111111">f</text>

  <!-- g : X -> B -->
  <line x1="209" y1="66" x2="310" y2="360" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="279" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-style="italic" fill="#111111">g</text>

  <!-- pi_1 : AxB -> A -->
  <line x1="172" y1="238" x2="76" y2="362" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="106" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#111111">&#960;<tspan dy="6" font-size="15" font-style="italic">1</tspan></text>

  <!-- pi_2 : AxB -> B -->
  <line x1="208" y1="238" x2="304" y2="362" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="274" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#111111">&#960;<tspan dy="6" font-size="15" font-style="italic">2</tspan></text>

  <!-- ==================== COPRODUCT ==================== -->
  <text x="450" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">A</text>
  <text x="710" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">B</text>
  <text x="580" y="228" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">A&#8852;B</text>
  <text x="580" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">X</text>

  <!-- iota_1 : A -> A+B -->
  <line x1="466" y1="66" x2="560" y2="206" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="126" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#111111">&#953;<tspan dy="6" font-size="15" font-style="italic">1</tspan></text>

  <!-- iota_2 : B -> A+B -->
  <line x1="694" y1="66" x2="600" y2="206" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="662" y="126" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#111111">&#953;<tspan dy="6" font-size="15" font-style="italic">2</tspan></text>

  <!-- unique co-mediating arrow (dashed) -->
  <line x1="580" y1="238" x2="580" y2="356" stroke="#111111" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
  <text x="624" y="292" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-style="italic" fill="#111111">[f, g]</text>
  <text x="624" y="314" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111111">(unique)</text>

  <!-- f : A -> X -->
  <line x1="452" y1="66" x2="566" y2="360" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="476" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-style="italic" fill="#111111">f</text>

  <!-- g : B -> X -->
  <line x1="708" y1="66" x2="594" y2="360" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="684" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-style="italic" fill="#111111">g</text>
</svg>
