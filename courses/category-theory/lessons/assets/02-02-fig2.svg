<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300">
  <rect x="0" y="0" width="560" height="300" fill="#ffffff"/>
  <defs>
    <marker id="ah2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111111"/>
    </marker>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif" fill="#111111" stroke="#111111">

    <text x="280" y="34" font-size="14" text-anchor="middle" stroke="none" font-weight="bold">Naturality of &#945; : Hom(A, &#8722;) &#8773; F</text>

    <!-- corners -->
    <text x="120" y="105" font-size="15" text-anchor="middle" stroke="none">Hom(A, X)</text>
    <text x="440" y="105" font-size="15" text-anchor="middle" stroke="none">F X</text>
    <text x="120" y="235" font-size="15" text-anchor="middle" stroke="none">Hom(A, Y)</text>
    <text x="440" y="235" font-size="15" text-anchor="middle" stroke="none">F Y</text>

    <!-- top: alpha_X -->
    <line x1="185" y1="100" x2="405" y2="100" stroke-width="1.6" marker-end="url(#ah2)"/>
    <text x="295" y="90" font-size="14" text-anchor="middle" stroke="none">&#945;&#8339;</text>

    <!-- bottom: alpha_Y -->
    <line x1="185" y1="230" x2="415" y2="230" stroke-width="1.6" marker-end="url(#ah2)"/>
    <text x="298" y="252" font-size="14" text-anchor="middle" stroke="none">&#945;&#8342;</text>

    <!-- left: g o - (post-compose with g) -->
    <line x1="120" y1="118" x2="120" y2="212" stroke-width="1.6" marker-end="url(#ah2)"/>
    <text x="88" y="170" font-size="14" text-anchor="middle" stroke="none">g &#8728; &#8722;</text>

    <!-- right: Fg -->
    <line x1="440" y1="118" x2="440" y2="212" stroke-width="1.6" marker-end="url(#ah2)"/>
    <text x="462" y="170" font-size="14" text-anchor="middle" stroke="none">Fg</text>

    <text x="280" y="175" font-size="13" text-anchor="middle" stroke="none" fill="#888888" font-style="italic">commutes</text>
    <text x="280" y="288" font-size="12.5" text-anchor="middle" stroke="none" fill="#444444">f &#8614; (Ff)(u), then g&#8226;; either path gives (F(g&#8728;f))(u)</text>

  </g>
</svg>
