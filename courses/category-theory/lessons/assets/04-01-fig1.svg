<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300">
  <rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- Row 1: multiplication (flatten) -->
  <text x="150" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#111111">[[a, b], [c]]</text>
  <line x1="285" y1="100" x2="470" y2="100" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="377" y="84" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#111111">&#956;&#160; (flatten)</text>
  <text x="560" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#111111">[a, b, c]</text>
  <text x="150" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-style="italic" fill="#111111">a list of lists</text>
  <text x="560" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-style="italic" fill="#111111">one list</text>

  <!-- Row 2: unit (wrap) -->
  <text x="150" y="228" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#111111">a</text>
  <line x1="185" y1="220" x2="470" y2="220" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="204" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#111111">&#951;&#160; (wrap as singleton)</text>
  <text x="545" y="228" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#111111">[a]</text>
  <text x="150" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-style="italic" fill="#111111">a bare value</text>
  <text x="545" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-style="italic" fill="#111111">a one-element list</text>
</svg>
