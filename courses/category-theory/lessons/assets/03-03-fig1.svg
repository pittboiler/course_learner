<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440">
  <rect x="0" y="0" width="780" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111111"/>
    </marker>
    <marker id="ahg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7a7a7a"/>
    </marker>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif" fill="#111111" stroke="none">

    <text x="390" y="30" font-size="16" text-anchor="middle" font-weight="bold">A cone over a diagram, and the universal (limit) cone</text>
    <text x="390" y="50" font-size="12.5" text-anchor="middle" fill="#555555">every apex factors uniquely through the limit L</text>

    <!-- ===== the diagram D : J -> C (right cluster) ===== -->
    <rect x="520" y="80" width="230" height="330" rx="10" fill="none" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4,4"/>
    <text x="635" y="102" font-size="12.5" text-anchor="middle" fill="#777777" font-style="italic">diagram D : J &#8594; C</text>

    <!-- D1, D2 (shared target), D3 -->
    <circle cx="595" cy="145" r="4" fill="#111111"/>
    <text x="595" y="137" font-size="15" text-anchor="middle">D(1)</text>
    <circle cx="705" cy="255" r="4" fill="#111111"/>
    <text x="722" y="259" font-size="15" text-anchor="middle">D(2)</text>
    <circle cx="595" cy="365" r="4" fill="#111111"/>
    <text x="595" y="385" font-size="15" text-anchor="middle">D(3)</text>

    <!-- internal arrows Du : D1->D2, Dv : D3->D2 -->
    <line x1="601" y1="150" x2="699" y2="249" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/>
    <text x="668" y="188" font-size="13" text-anchor="middle" font-style="italic">D(u)</text>
    <line x1="601" y1="360" x2="699" y2="261" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/>
    <text x="668" y="330" font-size="13" text-anchor="middle" font-style="italic">D(v)</text>

    <!-- ===== apex X (gray cone) ===== -->
    <circle cx="120" cy="120" r="4" fill="#7a7a7a"/>
    <text x="120" y="112" font-size="16" text-anchor="middle" fill="#555555">X</text>
    <text x="120" y="95" font-size="11.5" text-anchor="middle" fill="#7a7a7a">any apex</text>

    <!-- X legs (gray) to each D(j) -->
    <line x1="128" y1="118" x2="588" y2="144" stroke="#7a7a7a" stroke-width="1.2" marker-end="url(#ahg)"/>
    <text x="300" y="116" font-size="13" text-anchor="middle" fill="#7a7a7a">&#955;&#8321;</text>
    <line x1="127" y1="124" x2="698" y2="252" stroke="#7a7a7a" stroke-width="1.2" marker-end="url(#ahg)"/>
    <text x="360" y="176" font-size="13" text-anchor="middle" fill="#7a7a7a">&#955;&#8322;</text>
    <line x1="126" y1="130" x2="588" y2="362" stroke="#7a7a7a" stroke-width="1.2" marker-end="url(#ahg)"/>
    <text x="300" y="270" font-size="13" text-anchor="middle" fill="#7a7a7a">&#955;&#8323;</text>

    <!-- ===== limit L (black cone) ===== -->
    <circle cx="230" cy="300" r="4.5" fill="#111111"/>
    <text x="230" y="322" font-size="16" text-anchor="middle">L = lim D</text>
    <text x="230" y="339" font-size="11.5" text-anchor="middle" fill="#777777">universal cone</text>

    <!-- L legs (black) to each D(j) -->
    <line x1="238" y1="296" x2="588" y2="148" stroke="#111111" stroke-width="1.7" marker-end="url(#ah)"/>
    <text x="430" y="212" font-size="13.5" text-anchor="middle">&#960;&#8321;</text>
    <line x1="240" y1="298" x2="698" y2="256" stroke="#111111" stroke-width="1.7" marker-end="url(#ah)"/>
    <text x="480" y="286" font-size="13.5" text-anchor="middle">&#960;&#8322;</text>
    <line x1="238" y1="304" x2="588" y2="362" stroke="#111111" stroke-width="1.7" marker-end="url(#ah)"/>
    <text x="430" y="352" font-size="13.5" text-anchor="middle">&#960;&#8323;</text>

    <!-- unique factoring arrow h : X -> L -->
    <line x1="126" y1="128" x2="223" y2="293" stroke="#111111" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ah)"/>
    <text x="150" y="222" font-size="13.5" text-anchor="middle" font-style="italic">&#8707;! h</text>

    <!-- factoring equation -->
    <text x="390" y="426" font-size="12.5" text-anchor="middle" fill="#555555">commuting: D(u)&#8728;&#955;&#8321; = &#955;&#8322;, D(v)&#8728;&#955;&#8323; = &#955;&#8322;    &#8226;    factoring: &#960;&#8331;&#8728;h = &#955;&#8331; for every j</text>

  </g>
</svg>
