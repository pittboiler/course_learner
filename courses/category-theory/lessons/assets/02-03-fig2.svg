<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470">
  <rect x="0" y="0" width="700" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- corner labels -->
  <text x="150" y="105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#111111">Hom(A, A)</text>
  <text x="555" y="105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#111111">Hom(A, X)</text>
  <text x="150" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-style="italic" fill="#111111">F</text>
  <text x="170" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#111111">(A)</text>
  <text x="555" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-style="italic" fill="#111111">F</text>
  <text x="575" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#111111">(X)</text>

  <!-- top: f-post-composition -->
  <line x1="235" y1="97" x2="470" y2="97" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="352" y="82" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#111111">f &#8728; (&#8722;)</text>

  <!-- bottom: Ff -->
  <line x1="235" y1="370" x2="470" y2="370" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="352" y="398" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-style="italic" fill="#111111">Ff</text>

  <!-- left: alpha_A -->
  <line x1="150" y1="125" x2="150" y2="348" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="106" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#111111">&#945;<tspan dy="7" font-size="15" font-style="italic">A</tspan></text>

  <!-- right: alpha_X -->
  <line x1="555" y1="125" x2="555" y2="348" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="599" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#111111">&#945;<tspan dy="7" font-size="15" font-style="italic">X</tspan></text>

  <!-- element trace, small italic gray-ish (still #111) -->
  <text x="150" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-style="italic" fill="#111111">id</text>
  <text x="163" y="155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#111111">A</text>
  <text x="352" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#111111">&#8614;</text>
  <text x="560" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-style="italic" fill="#111111">f</text>

  <text x="150" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-style="italic" fill="#111111">u = &#945;</text>
  <text x="196" y="335" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#111111">A</text>
  <text x="223" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-style="italic" fill="#111111">(id</text>
  <text x="243" y="335" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#111111">A</text>
  <text x="252" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-style="italic" fill="#111111">)</text>

  <!-- commutes -->
  <text x="352" y="245" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-style="italic" fill="#111111">commutes</text>

  <!-- caption: the pin -->
  <text x="350" y="450" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#111111">Chase id<tspan dy="4" font-size="13" font-style="italic">A</tspan><tspan dy="-4" font-size="19"> both ways:  &#945;</tspan><tspan dy="4" font-size="13" font-style="italic">X</tspan><tspan dy="-4" font-size="19">(f) = Ff(u).  One element u pins every &#945;</tspan><tspan dy="4" font-size="13" font-style="italic">X</tspan><tspan dy="-4" font-size="19">.</tspan></text>
</svg>
