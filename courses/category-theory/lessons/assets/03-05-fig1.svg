<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- ===== LEFT TRIANGLE: identity for F ===== -->
  <text x="200" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-style="italic" fill="#111111">FUF</text>
  <text x="90"  y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-style="italic" fill="#111111">F</text>
  <text x="315" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-style="italic" fill="#111111">F</text>

  <!-- F to FUF via Feta -->
  <line x1="98"  y1="332" x2="168" y2="88"  stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="105" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#111111">F&#951;</text>

  <!-- FUF to F via epsilonF -->
  <line x1="232" y1="88"  x2="305" y2="332" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="303" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#111111">&#949;F</text>

  <!-- F to F via id -->
  <line x1="112" y1="352" x2="290" y2="352" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-style="italic" fill="#111111">id</text>
  <text x="216" y="384" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#111111">F</text>

  <text x="200" y="418" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#111111">(&#949;F) &#8728; (F&#951;) = id</text>

  <!-- ===== RIGHT TRIANGLE: identity for U ===== -->
  <text x="560" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-style="italic" fill="#111111">UFU</text>
  <text x="450" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-style="italic" fill="#111111">U</text>
  <text x="675" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-style="italic" fill="#111111">U</text>

  <!-- U to UFU via etaU -->
  <line x1="458" y1="332" x2="528" y2="88"  stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="463" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#111111">&#951;U</text>

  <!-- UFU to U via Uepsilon -->
  <line x1="592" y1="88"  x2="665" y2="332" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="663" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#111111">U&#949;</text>

  <!-- U to U via id -->
  <line x1="472" y1="352" x2="650" y2="352" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-style="italic" fill="#111111">id</text>
  <text x="576" y="384" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#111111">U</text>

  <text x="560" y="418" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#111111">(U&#949;) &#8728; (&#951;U) = id</text>
</svg>
