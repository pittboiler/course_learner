<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440">
  <rect x="0" y="0" width="780" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- ===== title bar ===== -->
  <text x="390" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#111111">The adjunction bijection   Hom(FX, Y)  &#8773;  Hom(X, UY)</text>

  <!-- ===== LEFT panel: Hom_D(FX, Y) ===== -->
  <rect x="24" y="60" width="320" height="340" rx="14" fill="none" stroke="#888888" stroke-width="1.5"/>
  <text x="184" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#111111">Hom<tspan font-size="13" dy="6">Grp</tspan><tspan dy="-6">(FX, Y)</tspan></text>
  <text x="184" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#555555">a group homomorphism</text>

  <!-- FX free group elements (left column) -->
  <text x="70" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#111111">FX</text>
  <circle cx="70" cy="185" r="5" fill="#111111"/><text x="52" y="190" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">a</text>
  <circle cx="70" cy="230" r="5" fill="#111111"/><text x="52" y="235" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">b</text>
  <circle cx="70" cy="275" r="5" fill="#111111"/><text x="38" y="280" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">ab</text>
  <circle cx="70" cy="320" r="5" fill="#111111"/><text x="30" y="325" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111111">a&#8315;&#185;b</text>
  <text x="70" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">&#8942;</text>

  <!-- Y group elements (right column of left panel) -->
  <text x="300" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#111111">Y</text>
  <circle cx="300" cy="185" r="5" fill="#111111"/>
  <circle cx="300" cy="230" r="5" fill="#111111"/>
  <circle cx="300" cy="275" r="5" fill="#111111"/>
  <circle cx="300" cy="320" r="5" fill="#111111"/>

  <!-- phi arrows: determined on all of FX -->
  <line x1="80" y1="185" x2="290" y2="185" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="80" y1="230" x2="290" y2="230" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="80" y1="275" x2="290" y2="270" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="80" y1="320" x2="290" y2="316" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="184" y="177" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-style="italic" fill="#111111">&#966;</text>

  <!-- ===== RIGHT panel: Hom_Set(X, UY) ===== -->
  <rect x="436" y="60" width="320" height="340" rx="14" fill="none" stroke="#888888" stroke-width="1.5"/>
  <text x="596" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#111111">Hom<tspan font-size="13" dy="6">Set</tspan><tspan dy="-6">(X, UY)</tspan></text>
  <text x="596" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#555555">a set map on generators</text>

  <!-- X generators -->
  <text x="482" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#111111">X</text>
  <circle cx="482" cy="235" r="5" fill="#111111"/><text x="464" y="240" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">a</text>
  <circle cx="482" cy="285" r="5" fill="#111111"/><text x="464" y="290" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111">b</text>

  <!-- UY underlying set -->
  <text x="712" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#111111">UY</text>
  <circle cx="712" cy="235" r="5" fill="#111111"/>
  <circle cx="712" cy="285" r="5" fill="#111111"/>
  <circle cx="712" cy="335" r="5" fill="#111111"/>

  <line x1="492" y1="235" x2="702" y2="235" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="492" y1="285" x2="702" y2="285" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="596" y="227" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-style="italic" fill="#111111">&#966;&#772;</text>

  <!-- ===== central bijection ===== -->
  <line x1="352" y1="205" x2="428" y2="205" stroke="#111111" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <line x1="428" y1="255" x2="352" y2="255" stroke="#111111" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <text x="390" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111">restrict to</text>
  <text x="390" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#111111">&#8773;</text>
  <text x="390" y="278" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111">extend by</text>
  <text x="390" y="293" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111">the group law</text>
</svg>
