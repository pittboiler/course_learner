<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440">
  <rect x="0" y="0" width="700" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- corner labels -->
  <text x="175" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">FA</text>
  <text x="525" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">FB</text>
  <text x="175" y="368" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">GA</text>
  <text x="525" y="368" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">GB</text>

  <!-- top: Ff : FA -> FB -->
  <line x1="222" y1="106" x2="478" y2="106" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-style="italic" fill="#111111">Ff</text>

  <!-- bottom: Gf : GA -> GB -->
  <line x1="222" y1="356" x2="478" y2="356" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="384" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-style="italic" fill="#111111">Gf</text>

  <!-- left: alpha_A : FA -> GA -->
  <line x1="175" y1="138" x2="175" y2="336" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="132" y="243" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#111111">&#945;<tspan dy="7" font-size="16" font-style="italic">A</tspan></text>

  <!-- right: alpha_B : FB -> GB -->
  <line x1="525" y1="138" x2="525" y2="336" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="568" y="243" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#111111">&#945;<tspan dy="7" font-size="16" font-style="italic">B</tspan></text>

  <!-- commutes -->
  <text x="350" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#111111">commutes</text>

  <!-- caption -->
  <text x="350" y="424" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#111111">&#945;<tspan dy="5" font-size="12" font-style="italic">B</tspan><tspan dy="-5" font-size="17"> &#8728; Ff  =  Gf &#8728; </tspan>&#945;<tspan dy="5" font-size="12" font-style="italic">A</tspan></text>
</svg>
