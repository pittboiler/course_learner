<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420">
  <rect x="0" y="0" width="700" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- the object A -->
  <circle cx="560" cy="210" r="34" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
  <text x="560" y="219" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-style="italic" fill="#111111">A</text>

  <!-- test objects on the left -->
  <text x="120" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-style="italic" fill="#111111">X</text>
  <text x="120" y="165" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-style="italic" fill="#111111">Y</text>
  <text x="120" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-style="italic" fill="#111111">Z</text>
  <text x="120" y="355" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-style="italic" fill="#111111">W</text>

  <!-- arrows into A: many maps -->
  <line x1="140" y1="62"  x2="528" y2="192" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="140" y1="158" x2="524" y2="202" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="140" y1="253" x2="524" y2="220" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="140" y1="347" x2="528" y2="232" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- a second arrow from Y to show Hom(Y,A) is a whole SET -->
  <path d="M 140 172 C 300 300, 420 300, 528 228" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>

  <!-- labels on a couple of arrows -->
  <text x="330" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-style="italic" fill="#111111">f</text>
  <text x="330" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-style="italic" fill="#111111">g</text>

  <!-- caption -->
  <text x="350" y="398" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#111111">Hom(&#8722;, A): the entire web of arrows into A &#8212; Yoneda says this web determines A up to iso.</text>
</svg>
