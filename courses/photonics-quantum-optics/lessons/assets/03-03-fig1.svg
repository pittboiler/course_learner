<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="24" y="22" fill="#8a8a8a" font-style="italic">A coherent state: a vacuum-sized blur of uncertainty parked at amplitude |&#945;|, angle &#966; — and its Poisson photon count.</text>

  <!-- ===== left: phase-space (quadrature) picture ===== -->

  <!-- X1 axis -->
  <line x1="60" y1="250" x2="330" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="330,250 320,245 320,255" fill="#8a8a8a"/>
  <text x="334" y="255" fill="#8a8a8a">X&#8321;</text>
  <!-- X2 axis -->
  <line x1="80" y1="285" x2="80" y2="60" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="80,60 75,70 85,70" fill="#8a8a8a"/>
  <text x="66" y="60" fill="#8a8a8a">X&#8322;</text>
  <text x="64" y="266" fill="#8a8a8a">0</text>

  <!-- the coherent-state blob (fuzzy vacuum-sized disk) -->
  <circle cx="242" cy="130" r="30" fill="#4a90d9" opacity="0.16"/>
  <circle cx="242" cy="130" r="20" fill="#4a90d9" opacity="0.22"/>
  <circle cx="242" cy="130" r="20" fill="none" stroke="#4a90d9" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="242" cy="130" r="2.5" fill="#4a90d9"/>

  <!-- amplitude arrow |alpha| from origin to blob center -->
  <line x1="80" y1="250" x2="242" y2="130" stroke="#e0645c" stroke-width="2"/>
  <polygon points="242,130 231,132 237,141" fill="#e0645c"/>
  <text x="150" y="178" fill="#e0645c">|&#945;|</text>

  <!-- phase angle phi -->
  <path d="M 130 250 A 50 50 0 0 0 117 219" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="132" y="235" fill="#8a8a8a">&#966;</text>

  <!-- blob radius = vacuum spread ~1/2 -->
  <line x1="242" y1="130" x2="262" y2="130" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="248" y="122" fill="#8a8a8a" font-size="12">&#189;</text>

  <!-- ===== right: Poisson P(n) bar sketch ===== -->
  <text x="430" y="70" fill="#8a8a8a" font-style="italic" font-size="13">P(n), peaked near |&#945;|&#178;</text>

  <!-- baseline -->
  <line x1="410" y1="250" x2="620" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="620,250 610,245 610,255" fill="#8a8a8a"/>
  <text x="600" y="268" fill="#8a8a8a">n</text>
  <line x1="410" y1="250" x2="410" y2="80" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- bars: roughly Poisson, peak in the middle -->
  <rect x="418" y="238" width="14" height="12" fill="#4a90d9" opacity="0.75"/>
  <rect x="436" y="218" width="14" height="32" fill="#4a90d9" opacity="0.75"/>
  <rect x="454" y="188" width="14" height="62" fill="#4a90d9" opacity="0.75"/>
  <rect x="472" y="150" width="14" height="100" fill="#4a90d9" opacity="0.75"/>
  <rect x="490" y="128" width="14" height="122" fill="#4a90d9" opacity="0.75"/>
  <rect x="508" y="128" width="14" height="122" fill="#4a90d9" opacity="0.75"/>
  <rect x="526" y="150" width="14" height="100" fill="#4a90d9" opacity="0.75"/>
  <rect x="544" y="188" width="14" height="62" fill="#4a90d9" opacity="0.75"/>
  <rect x="562" y="218" width="14" height="32" fill="#4a90d9" opacity="0.75"/>
  <rect x="580" y="238" width="14" height="12" fill="#4a90d9" opacity="0.75"/>

  <!-- mean marker -->
  <line x1="515" y1="120" x2="515" y2="258" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="486" y="115" fill="#e0645c" font-size="13">&#10216;n&#10217; = |&#945;|&#178;</text>
</svg>
