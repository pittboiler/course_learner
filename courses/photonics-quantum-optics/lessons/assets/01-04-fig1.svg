<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="20" y="24" fill="#8a8a8a" font-style="italic">Four-level pumping: pump 0&#8594;3, fast dump 3&#8594;2, lase 2&#8594;1, fast dump 1&#8594;0 keeps the lower laser level empty.</text>

  <!-- ===== energy levels (lower on page = lower energy) ===== -->
  <!-- level 3 : pump level -->
  <line x1="150" y1="95" x2="350" y2="95" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="360" y="92" fill="#8a8a8a">|3&#10217; &#8212; pump level, N&#8323; &#8776; 0</text>
  <!-- level 2 : upper laser level -->
  <line x1="150" y1="155" x2="350" y2="155" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="360" y="152" fill="#4a90d9">|2&#10217; &#8212; upper laser level, N&#8322; (long-lived)</text>
  <!-- level 1 : lower laser level -->
  <line x1="150" y1="250" x2="350" y2="250" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="360" y="247" fill="#8a8a8a">|1&#10217; &#8212; lower laser level, N&#8321; &#8776; 0</text>
  <!-- level 0 : ground -->
  <line x1="150" y1="300" x2="350" y2="300" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="360" y="297" fill="#8a8a8a">|0&#10217; &#8212; ground state, N&#8320; (large)</text>

  <!-- ===== transitions ===== -->
  <!-- pump 0 -> 3 (coral, up) -->
  <line x1="185" y1="298" x2="185" y2="104" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="185,95 180,107 190,107" fill="#e0645c"/>
  <text x="120" y="200" fill="#e0645c">pump</text>

  <!-- fast decay 3 -> 2 (grey, down) -->
  <line x1="235" y1="98" x2="235" y2="148" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="4 3"/>
  <polygon points="235,155 230,143 240,143" fill="#8a8a8a"/>
  <text x="243" y="128" fill="#8a8a8a">fast</text>

  <!-- laser 2 -> 1 (blue, down) -->
  <line x1="283" y1="158" x2="283" y2="243" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="283,250 278,238 288,238" fill="#4a90d9"/>
  <text x="291" y="205" fill="#4a90d9">laser</text>
  <text x="291" y="221" fill="#4a90d9">h&#957;</text>

  <!-- fast decay 1 -> 0 (grey, down) -->
  <line x1="325" y1="253" x2="325" y2="293" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="4 3"/>
  <polygon points="325,300 320,288 330,288" fill="#8a8a8a"/>
  <text x="300" y="278" fill="#8a8a8a">fast</text>

  <!-- inversion bracket between 2 and 1 -->
  <text x="70" y="150" fill="#4a90d9">&#916;N = N&#8322; &#8722; N&#8321;</text>
  <text x="70" y="166" fill="#4a90d9">&#8776; N&#8322; &gt; 0</text>
</svg>
