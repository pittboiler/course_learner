<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="24" y="20" fill="#8a8a8a" font-style="italic">Left: a herald click announces a partner photon. Right: loss = a beam splitter mixing in vacuum, which erodes nonclassicality.</text>

  <!-- ===================== Panel A: heralding ===================== -->
  <text x="30" y="48" fill="#8a8a8a">Heralded single photon</text>

  <!-- pair source -->
  <rect x="30" y="150" width="76" height="46" fill="#8a8a8a" opacity="0.15" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="68" y="170" fill="#8a8a8a" text-anchor="middle">pair</text>
  <text x="68" y="186" fill="#8a8a8a" text-anchor="middle">source</text>

  <!-- idler up to herald detector (coral) -->
  <line x1="104" y1="165" x2="168" y2="98" stroke="#e0645c" stroke-width="2"/>
  <polygon points="168,98 163.5,110 156.5,103" fill="#e0645c"/>
  <text x="112" y="122" fill="#e0645c">idler</text>

  <!-- herald detector box -->
  <rect x="168" y="72" width="78" height="40" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="207" y="89" fill="#e0645c" text-anchor="middle">herald</text>
  <text x="207" y="104" fill="#e0645c" text-anchor="middle">detector</text>

  <!-- signal to the right (blue) -->
  <line x1="106" y1="184" x2="312" y2="184" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="312,184 302,180 302,188" fill="#4a90d9"/>
  <text x="118" y="177" fill="#4a90d9">signal</text>

  <!-- gate marker on signal line -->
  <polygon points="207,173 218,184 207,195 196,184" fill="#8a8a8a" opacity="0.35" stroke="#8a8a8a" stroke-width="1"/>
  <text x="207" y="216" fill="#8a8a8a" text-anchor="middle">gate</text>

  <!-- click gates the signal (dashed coral, down) -->
  <line x1="207" y1="112" x2="207" y2="171" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="4 4"/>
  <polygon points="207,171 203,162 211,162" fill="#e0645c"/>
  <text x="214" y="140" fill="#e0645c">click ⇒ keep</text>

  <text x="258" y="180" fill="#8a8a8a">to</text>
  <text x="258" y="195" fill="#8a8a8a">expt.</text>

  <!-- divider -->
  <line x1="352" y1="40" x2="352" y2="230" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 5"/>

  <!-- ===================== Panel B: loss model ===================== -->
  <text x="386" y="48" fill="#8a8a8a">Loss = beam splitter (transmission η)</text>

  <!-- input signal (blue) -->
  <line x1="378" y1="150" x2="452" y2="150" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="452,150 442,146 442,154" fill="#4a90d9"/>
  <text x="382" y="142" fill="#4a90d9">signal in</text>

  <!-- beam splitter (grey diagonal) -->
  <line x1="460" y1="130" x2="490" y2="170" stroke="#8a8a8a" stroke-width="3"/>
  <text x="470" y="120" fill="#8a8a8a">η</text>

  <!-- vacuum in from below (coral, up) -->
  <line x1="475" y1="212" x2="475" y2="172" stroke="#e0645c" stroke-width="2"/>
  <polygon points="475,172 471,181 479,181" fill="#e0645c"/>
  <text x="482" y="204" fill="#e0645c">vacuum</text>

  <!-- transmitted to detector (blue) -->
  <line x1="490" y1="150" x2="556" y2="150" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="556,150 546,146 546,154" fill="#4a90d9"/>
  <text x="498" y="142" fill="#4a90d9">η kept</text>

  <!-- detector -->
  <rect x="556" y="132" width="40" height="36" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="576" y="155" fill="#4a90d9" text-anchor="middle">D</text>

  <!-- reflected / lost (coral, up) -->
  <line x1="475" y1="128" x2="475" y2="70" stroke="#e0645c" stroke-width="2"/>
  <polygon points="475,70 471,79 479,79" fill="#e0645c"/>
  <text x="482" y="82" fill="#e0645c">1−η lost</text>
</svg>
