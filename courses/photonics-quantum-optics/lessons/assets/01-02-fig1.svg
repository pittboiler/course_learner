<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Coherent driving flops the population: on resonance it reaches 1 (a &#960;-pulse); off resonance it is faster but capped.</text>

  <!-- P_e axis -->
  <line x1="70" y1="262" x2="70" y2="58" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,58 65,68 75,68" fill="#8a8a8a"/>
  <text x="44" y="62" fill="#8a8a8a">P&#8337;</text>
  <!-- time axis -->
  <line x1="70" y1="250" x2="486" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="486,250 476,245 476,255" fill="#8a8a8a"/>
  <text x="490" y="255" fill="#8a8a8a">t</text>
  <text x="56" y="255" fill="#8a8a8a">0</text>

  <!-- P=1 gridline -->
  <line x1="70" y1="70" x2="470" y2="70" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="48" y="74" fill="#8a8a8a">1</text>
  <!-- amplitude 0.5 gridline (off-resonant cap) -->
  <line x1="70" y1="160" x2="470" y2="160" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="474" y="164" fill="#e0645c">&#937;&#178;/&#937;&#771;&#178;</text>

