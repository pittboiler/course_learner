  <line x1="170" y1="70" x2="170" y2="250" stroke="#4a90d9" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="150" y="292" fill="#4a90d9">&#937;t = &#960;</text>
  <text x="128" y="308" fill="#8a8a8a" font-size="12">(&#960;-pulse: full transfer)</text>

  <!-- legend -->
  <line x1="330" y1="296" x2="356" y2="296" stroke="#4a90d9" stroke-width="3"/>
  <text x="362" y="300" fill="#8a8a8a" font-size="12">&#916; = 0 (resonant)</text>
  <line x1="330" y1="312" x2="356" y2="312" stroke="#e0645c" stroke-width="2.5"/>
  <text x="362" y="316" fill="#8a8a8a" font-size="12">&#916; = &#937; (off resonance)</text>

  <!-- two-level ladder inset -->
  <line x1="530" y1="90" x2="590" y2="90" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="594" y="94" fill="#4a90d9">|e&#10217;</text>
  <line x1="530" y1="180" x2="590" y2="180" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="594" y="184" fill="#8a8a8a">|g&#10217;</text>
  <line x1="560" y1="180" x2="560" y2="90" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="560,90 556,100 564,100" fill="#e0645c"/>
  <polygon points="560,180 556,170 564,170" fill="#e0645c"/>
  <text x="566" y="139" fill="#e0645c">&#8463;&#969;&#8320;</text>
</svg>
