<svg viewBox="0 0 620 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Phase space: a state is a mean point plus a noise blob. Vacuum and coherent states share the same isotropic SQL disk.</text>

  <!-- ===== axes ===== -->
  <!-- X1 axis -->
  <line x1="60" y1="300" x2="560" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="560,300 550,295 550,305" fill="#8a8a8a"/>
  <text x="540" y="325" fill="#8a8a8a">X&#8321;</text>
  <!-- X2 axis -->
  <line x1="150" y1="390" x2="150" y2="60" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="150,60 145,70 155,70" fill="#8a8a8a"/>
  <text x="120" y="72" fill="#8a8a8a">X&#8322;</text>
  <text x="132" y="320" fill="#8a8a8a">0</text>

  <!-- ===== vacuum noise disk at origin ===== -->
  <circle cx="150" cy="300" r="34" fill="#8a8a8a" opacity="0.12" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="150" cy="300" r="2.5" fill="#8a8a8a"/>
  <text x="70" y="360" fill="#8a8a8a">vacuum</text>
  <!-- radius = 1/2 marker on vacuum disk -->
  <line x1="150" y1="300" x2="150" y2="266" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="98" y="288" fill="#8a8a8a">&#189;</text>

  <!-- ===== amplitude arrow |alpha| ===== -->
  <line x1="150" y1="300" x2="392" y2="153" stroke="#e0645c" stroke-width="2"/>
  <polygon points="392,153 379,155 385,166" fill="#e0645c"/>
  <text x="255" y="212" fill="#e0645c">|&#945;|</text>

  <!-- ===== coherent state disk ===== -->
  <circle cx="400" cy="148" r="34" fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="400" cy="148" r="2.5" fill="#4a90d9"/>
  <text x="360" y="106" fill="#4a90d9">coherent |&#945;&#10217;</text>

  <!-- Delta X1 (horizontal) on coherent disk -->
  <line x1="366" y1="148" x2="434" y2="148" stroke="#e0645c" stroke-width="1.3"/>
  <polygon points="366,148 375,144 375,152" fill="#e0645c"/>
  <polygon points="434,148 425,144 425,152" fill="#e0645c"/>
  <text x="438" y="152" fill="#e0645c">&#916;X&#8321;</text>

  <!-- Delta X2 (vertical) on coherent disk -->
  <line x1="400" y1="114" x2="400" y2="182" stroke="#e0645c" stroke-width="1.3"/>
  <polygon points="400,114 396,123 404,123" fill="#e0645c"/>
  <polygon points="400,182 396,173 404,173" fill="#e0645c"/>
  <text x="405" y="200" fill="#e0645c">&#916;X&#8322;</text>

  <!-- equal-noise note -->
  <text x="300" y="392" fill="#8a8a8a" font-style="italic">&#916;X&#8321; = &#916;X&#8322; = &#189;  (same circle, just shifted)</text>
</svg>
