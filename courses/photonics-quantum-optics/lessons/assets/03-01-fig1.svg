<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">One field mode of frequency &#969; is one harmonic oscillator; its energy ladder is rungs spaced &#8463;&#969; &#8212; photons.</text>

  <!-- ===== left: a field mode in a box ===== -->
  <rect x="40" y="95" width="210" height="150" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M 50 170 L 62 138 L 74 125 L 86 139 L 98 171 L 110 203 L 122 215 L 134 200 L 146 167 L 158 136 L 170 125 L 182 141 L 194 174 L 206 205 L 218 215 L 230 198 L 240 170"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="72" y="272" fill="#8a8a8a">field mode in a box</text>
  <text x="108" y="291" fill="#8a8a8a">frequency &#969;</text>

  <!-- ===== middle: correspondence arrow ===== -->
  <line x1="268" y1="170" x2="340" y2="170" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="340,170 331,166 331,174" fill="#8a8a8a"/>
  <polygon points="268,170 277,166 277,174" fill="#8a8a8a"/>
  <text x="272" y="158" fill="#8a8a8a">same</text>
  <text x="272" y="192" fill="#8a8a8a">math</text>

  <!-- ===== right: oscillator parabola + energy ladder ===== -->
  <!-- parabola -->
  <path d="M 380 90 L 400 169 L 420 225 L 440 259 L 460 270 L 480 259 L 500 225 L 520 169 L 540 90"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- energy rungs (grey), spaced by hbar-omega -->
  <line x1="433" y1="250" x2="487" y2="250" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="412" y1="205" x2="508" y2="205" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="397" y1="160" x2="523" y2="160" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="386" y1="115" x2="534" y2="115" stroke="#8a8a8a" stroke-width="2"/>

  <!-- rung labels -->
  <text x="493" y="255" fill="#8a8a8a">|0&#10217;</text>
  <text x="514" y="210" fill="#8a8a8a">|1&#10217;</text>
  <text x="529" y="165" fill="#8a8a8a">|2&#10217;</text>
  <text x="540" y="120" fill="#8a8a8a">|3&#10217;</text>

  <!-- spacing bracket hbar-omega (between |0> and |1>) -->
  <line x1="375" y1="250" x2="375" y2="205" stroke="#e0645c" stroke-width="1.2"/>
  <polygon points="375,250 371,242 379,242" fill="#e0645c"/>
  <polygon points="375,205 371,213 379,213" fill="#e0645c"/>
  <text x="336" y="232" fill="#e0645c">&#8463;&#969;</text>

  <!-- ladder operators: a-dagger up, a down (between |1> and |2>) -->
  <line x1="448" y1="205" x2="448" y2="160" stroke="#e0645c" stroke-width="2"/>
  <polygon points="448,160 443,169 453,169" fill="#e0645c"/>
  <text x="410" y="187" fill="#e0645c">a&#8224;</text>

  <line x1="474" y1="160" x2="474" y2="205" stroke="#e0645c" stroke-width="2"/>
  <polygon points="474,205 469,196 479,196" fill="#e0645c"/>
  <text x="481" y="187" fill="#e0645c">a</text>

  <text x="404" y="291" fill="#8a8a8a">energy ladder, rungs spaced &#8463;&#969;</text>
</svg>
