<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">The RBC propagation mechanism</text>

  <!-- Shock box -->
  <rect x="30" y="170" width="130" height="70" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="95" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">TFP shock</text>
  <text x="95" y="222" text-anchor="middle" font-size="15" fill="#7c2d12">z &#8593;</text>

  <!-- MPK / MPL box -->
  <rect x="220" y="120" width="150" height="55" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="295" y="143" text-anchor="middle" font-size="14" fill="#1e3a8a">MPK &#8593; (return</text>
  <text x="295" y="162" text-anchor="middle" font-size="14" fill="#1e3a8a">to investing &#8593;)</text>

  <rect x="220" y="235" width="150" height="55" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="295" y="258" text-anchor="middle" font-size="14" fill="#1e3a8a">MPL = wage &#8593;</text>
  <text x="295" y="277" text-anchor="middle" font-size="14" fill="#1e3a8a">(return to work &#8593;)</text>

  <!-- Arrows shock -> MPK/MPL -->
  <line x1="160" y1="195" x2="220" y2="150" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="160" y1="215" x2="220" y2="262" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Real quantities box -->
  <rect x="430" y="150" width="150" height="120" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="505" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">They comove:</text>
  <text x="505" y="203" text-anchor="middle" font-size="14" fill="#14532d">labor &#8467; &#8593;</text>
  <text x="505" y="226" text-anchor="middle" font-size="14" fill="#14532d">output y &#8593;</text>
  <text x="505" y="249" text-anchor="middle" font-size="14" fill="#14532d">investment i &#8593;</text>

  <!-- Arrows MPK/MPL -> quantities -->
  <line x1="370" y1="150" x2="430" y2="190" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="262" x2="430" y2="230" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Capital feedback -->
  <rect x="430" y="320" width="150" height="55" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="505" y="343" text-anchor="middle" font-size="14" fill="#831843">capital k' &#8593;</text>
  <text x="505" y="362" text-anchor="middle" font-size="13" fill="#831843">(propagates z's echo)</text>

  <!-- investment -> capital -->
  <line x1="505" y1="270" x2="505" y2="320" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- capital feeds back to output/MPK next period (curved) -->
  <path d="M 580 348 C 660 348 660 150 592 150" fill="none" stroke="#be185d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowp)"/>
  <text x="655" y="250" text-anchor="middle" font-size="12" fill="#be185d" transform="rotate(90 655 250)">next period</text>

  <!-- caption -->
  <text x="360" y="405" text-anchor="middle" font-size="13" fill="#374151">One real shock moves labor, output, and investment together — and the extra capital carries the impulse forward in time.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#111111"/>
    </marker>
    <marker id="arrowp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#be185d"/>
    </marker>
  </defs>
</svg>
