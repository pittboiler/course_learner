<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="sans-serif">
  <rect x="0" y="0" width="540" height="400" fill="#ffffff"/>

  <!-- Axes -->
  <line x1="80" y1="350" x2="500" y2="350" stroke="#222222" stroke-width="2"/>
  <line x1="80" y1="350" x2="80" y2="40" stroke="#222222" stroke-width="2"/>
  <polygon points="500,350 490,345 490,355" fill="#222222"/>
  <polygon points="80,40 75,50 85,50" fill="#222222"/>

  <!-- Axis labels -->
  <text x="470" y="378" font-size="16" fill="#222222">unemployment  u</text>
  <text x="20" y="55" font-size="16" fill="#222222">vacancies</text>
  <text x="42" y="72" font-size="16" fill="#222222">V</text>

  <!-- Beveridge curve (downward-sloping, convex) -->
  <path d="M 110,70 C 160,150 200,200 250,230 C 320,270 400,300 470,315"
        fill="none" stroke="#1f6f3a" stroke-width="3"/>
  <text x="360" y="290" font-size="15" fill="#1f6f3a" font-weight="bold">Beveridge curve</text>
  <text x="360" y="308" font-size="12" fill="#1f6f3a">u = s/(s+f(&#952;))</text>

  <!-- Job-creation ray from origin, slope = equilibrium tightness -->
  <line x1="80" y1="350" x2="330" y2="60" stroke="#b8340f" stroke-width="3"/>
  <text x="300" y="95" font-size="15" fill="#b8340f" font-weight="bold">job creation</text>
  <text x="300" y="113" font-size="12" fill="#b8340f">slope = &#952;* = V/U</text>

  <!-- Intersection: equilibrium -->
  <circle cx="212" cy="196" r="6" fill="#111111"/>
  <line x1="212" y1="196" x2="212" y2="350" stroke="#777777" stroke-width="1.3" stroke-dasharray="5,4"/>
  <line x1="212" y1="196" x2="80" y2="196" stroke="#777777" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="222" y="188" font-size="15" fill="#111111" font-weight="bold">equilibrium (&#952;*, u*)</text>
  <text x="196" y="368" font-size="14" fill="#111111">u*</text>
  <text x="58" y="201" font-size="14" fill="#111111">V*</text>

  <!-- Note: shift arrow for higher z or beta -->
  <text x="150" y="30" font-size="12" fill="#b8340f">higher z or &#946; &#8594; flatter ray &#8594; higher u*</text>
</svg>
