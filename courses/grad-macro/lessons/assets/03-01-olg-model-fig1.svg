<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="sans-serif">
  <rect x="0" y="0" width="520" height="400" fill="#ffffff"/>

  <!-- title -->
  <text x="260" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">The OLG transition curve</text>
  <text x="260" y="44" text-anchor="middle" font-size="12" fill="#555555">(1+n)k&#8320;&#8321; = s(w&#8340;, r&#8320;&#8321;)  &#8594;  k&#8340;&#8321;&#8321; = g(k&#8340;)</text>

  <!-- axes -->
  <line x1="60" y1="340" x2="470" y2="340" stroke="#111111" stroke-width="2"/>
  <line x1="60" y1="340" x2="60" y2="60" stroke="#111111" stroke-width="2"/>
  <polygon points="470,340 462,336 462,344" fill="#111111"/>
  <polygon points="60,60 56,68 64,68" fill="#111111"/>
  <text x="452" y="360" font-size="13" fill="#111111">k&#8340;</text>
  <text x="20" y="70" font-size="13" fill="#111111">k&#8340;&#8321;&#8321;</text>

  <!-- 45-degree line -->
  <line x1="60" y1="340" x2="360" y2="40" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="330" y="52" font-size="12" fill="#888888">45&#176; (k&#8340;&#8321;&#8321;=k&#8340;)</text>

  <!-- transition curve g(k) -->
  <polyline points="60,340 100,248 140,219 180,197 220,180 260,165 300,152 340,140 360,134"
            fill="none" stroke="#1a5fb4" stroke-width="3"/>
  <text x="366" y="128" font-size="13" fill="#1a5fb4" font-weight="bold">g(k)</text>

  <!-- steady state marker at (220,180) -->
  <circle cx="220" cy="180" r="4.5" fill="#c01c28"/>
  <line x1="220" y1="180" x2="220" y2="340" stroke="#c01c28" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="212" y="358" font-size="13" fill="#c01c28" font-weight="bold">k*</text>

  <!-- convergence arrows along the axis (cobweb intuition) -->
  <line x1="110" y1="340" x2="180" y2="340" stroke="#2ec27e" stroke-width="2"/>
  <polygon points="180,340 172,336 172,344" fill="#2ec27e"/>
  <line x1="330" y1="340" x2="262" y2="340" stroke="#2ec27e" stroke-width="2"/>
  <polygon points="262,340 270,336 270,344" fill="#2ec27e"/>
  <text x="120" y="376" font-size="11" fill="#2ec27e">low k rises</text>
  <text x="280" y="376" font-size="11" fill="#2ec27e">high k falls</text>

  <!-- note: only the young fund capital -->
  <text x="80" y="100" font-size="11" fill="#555555">slope of g &lt; 1 at k* &#8658; stable</text>
  <text x="80" y="116" font-size="11" fill="#555555">(with log&#183;Cobb&#8211;Douglas)</text>
</svg>
