<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="sans-serif">
  <rect x="0" y="0" width="620" height="440" fill="#ffffff"/>

  <!-- Axes -->
  <line x1="70" y1="380" x2="590" y2="380" stroke="#222222" stroke-width="2"/>
  <line x1="70" y1="380" x2="70" y2="40" stroke="#222222" stroke-width="2"/>
  <polygon points="590,380 578,374 578,386" fill="#222222"/>
  <polygon points="70,40 64,52 76,52" fill="#222222"/>
  <text x="560" y="405" font-size="17" fill="#222222">k</text>
  <text x="18" y="52" font-size="16" fill="#222222">per eff.</text>
  <text x="24" y="70" font-size="16" fill="#222222">worker</text>

  <!-- break-even line (n+g+delta)k : straight line through origin -->
  <line x1="70" y1="380" x2="540" y2="90" stroke="#c0392b" stroke-width="2.5"/>
  <text x="470" y="80" font-size="16" fill="#c0392b">(n+g+δ)k</text>

  <!-- saving curve s f(k) = s k^alpha : concave -->
  <path d="M 70 380 Q 200 155 350 130 T 560 108" fill="none" stroke="#1f6feb" stroke-width="2.5"/>
  <text x="450" y="140" font-size="16" fill="#1f6feb">s·f(k)</text>

  <!-- steady state at intersection ~ k=270, y~178 -->
  <line x1="270" y1="380" x2="270" y2="178" stroke="#555555" stroke-width="1.4" stroke-dasharray="5 4"/>
  <circle cx="270" cy="178" r="5" fill="#111111"/>
  <text x="255" y="405" font-size="16" fill="#222222">k*</text>

  <!-- arrows toward k* : below k*, sf>break-even => k rises (arrow right) -->
  <line x1="150" y1="355" x2="205" y2="355" stroke="#1a7f37" stroke-width="2.5"/>
  <polygon points="212,355 200,349 200,361" fill="#1a7f37"/>
  <text x="120" y="345" font-size="14" fill="#1a7f37">k̇ &gt; 0</text>

  <!-- above k*: break-even > sf => k falls (arrow left) -->
  <line x1="400" y1="355" x2="345" y2="355" stroke="#1a7f37" stroke-width="2.5"/>
  <polygon points="338,355 350,349 350,361" fill="#1a7f37"/>
  <text x="405" y="345" font-size="14" fill="#1a7f37">k̇ &lt; 0</text>

  <!-- vertical gap illustration below k*: show sf above line -->
  <text x="300" y="240" font-size="13" fill="#555555">gap = k̇</text>
</svg>
