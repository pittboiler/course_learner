<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="430" fill="#ffffff"/>
  <!-- title -->
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Savings policy k' = &#945;&#946; z k&#8319; shifts up with a good shock</text>
  <!-- axes -->
  <line x1="70" y1="360" x2="610" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="70" y1="360" x2="70" y2="45" stroke="#1a1a1a" stroke-width="2"/>
  <text x="600" y="388" text-anchor="middle" font-size="15" fill="#1a1a1a">k (capital today)</text>
  <text x="30" y="55" font-size="15" fill="#1a1a1a">k'</text>
  <!-- high-z curve -->
  <polyline fill="none" stroke="#c0392b" stroke-width="3"
    points="70,360 158,201 247,165 335,139 423,119 512,103 600,89"/>
  <!-- low-z curve -->
  <polyline fill="none" stroke="#2c6fbb" stroke-width="3"
    points="70,360 158,254 247,230 335,213 423,200 512,189 600,179"/>
  <!-- labels on curves -->
  <text x="612" y="90" font-size="14" font-weight="bold" fill="#c0392b">high z</text>
  <text x="612" y="182" font-size="14" font-weight="bold" fill="#2c6fbb">low z</text>
  <!-- shift arrow -->
  <line x1="335" y1="209" x2="335" y2="145" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="335,139 331,149 339,149" fill="#1a1a1a"/>
  <text x="345" y="180" font-size="13" fill="#1a1a1a">positive shock</text>
  <text x="345" y="196" font-size="13" fill="#1a1a1a">z&#8593; &#8594; save more</text>
  <!-- note -->
  <text x="320" y="418" text-anchor="middle" font-size="13" fill="#555555">Same concave shape at every z; the shock scales the whole schedule. Consumption (1&#8722;&#945;&#946;)z k&#8319; scales identically.</text>
</svg>
