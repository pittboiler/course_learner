<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>

  <!-- Axes -->
  <line x1="70" y1="360" x2="600" y2="360" stroke="#222222" stroke-width="2"/>
  <line x1="70" y1="360" x2="70" y2="40" stroke="#222222" stroke-width="2"/>
  <text x="600" y="388" font-size="17" fill="#222222" text-anchor="end">state  k</text>
  <text x="30" y="52" font-size="17" fill="#222222">value</text>

  <!-- Family of inner objective curves h(k, k'_i) = u(k,k'_i)+beta V(k'_i), each a fixed control choice.
       Each is an upward line/curve in k; the value function is their upper envelope. -->
  <!-- curve family: lines of differing slope, envelope is a smooth concave curve -->
  <path d="M 90 330 L 560 250" stroke="#9ec5ff" stroke-width="2" fill="none"/>
  <path d="M 90 350 L 560 150" stroke="#9ec5ff" stroke-width="2" fill="none"/>
  <path d="M 90 300 L 560 120" stroke="#9ec5ff" stroke-width="2" fill="none"/>
  <path d="M 90 250 L 560 140" stroke="#9ec5ff" stroke-width="2" fill="none"/>
  <path d="M 90 200 L 560 210" stroke="#9ec5ff" stroke-width="2" fill="none"/>
  <path d="M 90 170 L 560 300" stroke="#9ec5ff" stroke-width="2" fill="none"/>

  <!-- Upper envelope V(k): concave curve tangent to the family -->
  <path d="M 90 300 C 200 150, 330 95, 560 100" stroke="#c0392b" stroke-width="3.5" fill="none"/>
  <text x="470" y="88" font-size="18" fill="#c0392b" font-weight="bold">V(k) = upper envelope</text>

  <!-- Tangency point marker at a specific k0 -->
  <circle cx="300" cy="118" r="5" fill="#222222"/>
  <line x1="300" y1="118" x2="300" y2="360" stroke="#888888" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="292" y="382" font-size="16" fill="#222222">k</text>
  <text x="305" y="382" font-size="12" fill="#222222">0</text>

  <!-- annotation: at the optimum the optimal-control curve is tangent; slope of V = slope of that fixed curve -->
  <text x="120" y="200" font-size="15" fill="#2c6fbb">each pale line: objective at a</text>
  <text x="120" y="220" font-size="15" fill="#2c6fbb">FIXED control k'</text>

  <text x="330" y="150" font-size="15" fill="#222222">at k, V is tangent to the</text>
  <text x="330" y="170" font-size="15" fill="#222222">curve of the optimal k' = g(k):</text>
  <text x="330" y="192" font-size="15" fill="#222222">so V'(k) = u (k, g(k))</text>
  <text x="447" y="197" font-size="11" fill="#222222">k</text>
  <text x="330" y="212" font-size="14" fill="#666666">(the control's own effect is flat)</text>
</svg>
