<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="320" fill="#ffffff"/>

  <text x="320" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Decomposing 3% output growth</text>
  <text x="320" y="54" text-anchor="middle" font-size="13" fill="#6b7280">&#916;Y/Y = &#945;&#8342; &#916;K/K + &#945;&#8343; &#916;L/L + &#916;A/A</text>

  <!-- axis: 0% at x=80, 3% at x=560 -> 160px per 1% -->
  <line x1="80" y1="200" x2="80" y2="90" stroke="#111827" stroke-width="1.5"/>
  <line x1="80" y1="200" x2="580" y2="200" stroke="#111827" stroke-width="1.5"/>

  <!-- ticks -->
  <g font-size="12" fill="#374151" text-anchor="middle">
    <line x1="80"  y1="200" x2="80"  y2="206" stroke="#111827"/>
    <text x="80"  y="222">0%</text>
    <line x1="240" y1="200" x2="240" y2="206" stroke="#111827"/>
    <text x="240" y="222">1%</text>
    <line x1="400" y1="200" x2="400" y2="206" stroke="#111827"/>
    <text x="400" y="222">2%</text>
    <line x1="560" y1="200" x2="560" y2="206" stroke="#111827"/>
    <text x="560" y="222">3%</text>
  </g>

  <!-- stacked bar, top y=110 bottom y=170 -->
  <!-- capital: 1.0% -> 80..240 -->
  <rect x="80"  y="110" width="160"   height="60" fill="#2563eb"/>
  <!-- labor: 0.667% -> 240..346.7 -->
  <rect x="240" y="110" width="106.7" height="60" fill="#16a34a"/>
  <!-- TFP: 1.333% -> 346.7..560 -->
  <rect x="346.7" y="110" width="213.3" height="60" fill="#dc2626"/>

  <!-- segment value labels -->
  <g font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">
    <text x="160"   y="145">1.00</text>
    <text x="293.3" y="145">0.67</text>
    <text x="453.3" y="145">1.33</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#374151">
    <rect x="120" y="256" width="16" height="16" fill="#2563eb"/>
    <text x="144" y="269">Capital  &#945;&#8342;&#183;&#916;K/K = &#8531;&#183;3%</text>
    <rect x="120" y="280" width="16" height="16" fill="#16a34a"/>
    <text x="144" y="293">Labor  &#945;&#8343;&#183;&#916;L/L = &#8532;&#183;1%</text>
    <rect x="390" y="256" width="16" height="16" fill="#dc2626"/>
    <text x="414" y="269">TFP (Solow residual)  &#916;A/A</text>
    <text x="414" y="293" fill="#6b7280">the part left unexplained</text>
  </g>
</svg>
