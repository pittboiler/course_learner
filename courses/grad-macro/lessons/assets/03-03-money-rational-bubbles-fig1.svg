<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="sans-serif">
  <rect x="0" y="0" width="440" height="360" fill="#ffffff"/>

  <!-- axes -->
  <line x1="55" y1="310" x2="410" y2="310" stroke="#222" stroke-width="1.5"/>
  <line x1="55" y1="310" x2="55" y2="30" stroke="#222" stroke-width="1.5"/>
  <polygon points="410,310 402,306 402,314" fill="#222"/>
  <polygon points="55,30 51,38 59,38" fill="#222"/>

  <text x="360" y="330" font-size="14" fill="#222">$m_t$</text>
  <text x="10" y="40" font-size="14" fill="#222">$m_{t+1}$</text>

  <!-- 45-degree line -->
  <line x1="55" y1="310" x2="335" y2="30" stroke="#888" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="300" y="55" font-size="12" fill="#888">45&#176;</text>

  <!-- law of motion G(m) -->
  <path d="M55,310 C110,205 185,150 235,130 C280,112 312,98 330,90"
        fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="336" y="92" font-size="13" fill="#c0392b" font-weight="bold">G</text>

  <!-- non-monetary steady state at origin -->
  <circle cx="55" cy="310" r="5" fill="#2c3e50"/>
  <text x="62" y="304" font-size="12" fill="#2c3e50">non-monetary SS</text>
  <text x="62" y="290" font-size="11" fill="#2c3e50">m = 0  (money worthless)</text>

  <!-- monetary steady state -->
  <circle cx="235" cy="130" r="5" fill="#1a7a3a"/>
  <line x1="235" y1="130" x2="235" y2="310" stroke="#1a7a3a" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="200" y="128" font-size="11" fill="#1a7a3a" font-weight="bold">monetary SS</text>
  <text x="216" y="326" font-size="13" fill="#1a7a3a">m*</text>

  <text x="120" y="175" font-size="11" fill="#c0392b">G above 45&#176;: balances</text>
  <text x="120" y="189" font-size="11" fill="#c0392b">carry positive value</text>
</svg>
