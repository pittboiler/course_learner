<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">The life-cycle profile: smooth consumption, humped income</text>

  <!-- Axes -->
  <line x1="70" y1="330" x2="600" y2="330" stroke="#333333" stroke-width="2"/>
  <line x1="70" y1="330" x2="70" y2="60" stroke="#333333" stroke-width="2"/>
  <text x="600" y="355" text-anchor="end" font-size="13" fill="#333333">age  →</text>
  <text x="58" y="70" text-anchor="end" font-size="13" fill="#333333">flow</text>

  <!-- age markers -->
  <text x="180" y="352" text-anchor="middle" font-size="12" fill="#555555">25</text>
  <text x="335" y="352" text-anchor="middle" font-size="12" fill="#555555">45</text>
  <text x="490" y="352" text-anchor="middle" font-size="12" fill="#555555">65</text>
  <line x1="490" y1="330" x2="490" y2="60" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="490" y="76" text-anchor="middle" font-size="12" fill="#888888">retire</text>

  <!-- Income: hump-shaped -->
  <path d="M70 300 Q 230 90 335 120 Q 430 145 490 300 L 490 300 L 600 300"
        fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="250" y="112" font-size="14" font-weight="bold" fill="#c0392b">labor income  y(t)</text>

  <!-- Consumption: flat -->
  <line x1="70" y1="215" x2="600" y2="215" stroke="#1f6feb" stroke-width="3"/>
  <text x="520" y="205" font-size="14" font-weight="bold" fill="#1f6feb">consumption  c</text>

  <!-- Phase labels / shading regions -->
  <!-- Young: borrow (c > y), region between income (below) and consumption (above) on left -->
  <text x="140" y="270" text-anchor="middle" font-size="12" fill="#1f6feb" font-weight="bold">borrow</text>
  <text x="140" y="286" text-anchor="middle" font-size="11" fill="#555555">c &gt; y</text>

  <!-- Middle: save (y > c) -->
  <text x="320" y="180" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">save</text>
  <text x="320" y="196" text-anchor="middle" font-size="11" fill="#555555">y &gt; c</text>

  <!-- Retirement: dissave -->
  <text x="545" y="270" text-anchor="middle" font-size="12" fill="#1f6feb" font-weight="bold">dissave</text>
  <text x="545" y="286" text-anchor="middle" font-size="11" fill="#555555">c &gt; y</text>

  <!-- Wealth curve (hump), lower panel hint via annotation -->
  <path d="M70 322 Q 200 322 335 300 Q 430 285 490 288 Q 545 291 600 322"
        fill="none" stroke="#2e8b57" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="360" y="322" font-size="12" fill="#2e8b57" font-weight="bold">assets (hump-shaped)</text>

  <!-- caption -->
  <text x="320" y="388" text-anchor="middle" font-size="12" fill="#555555">Consumption is flat; the gap to income is filled by borrowing, then saving, then running assets down.</text>
</svg>
