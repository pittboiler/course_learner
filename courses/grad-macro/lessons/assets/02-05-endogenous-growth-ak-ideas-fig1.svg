<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#ffffff"/>

  <!-- ===================== LEFT PANEL: SOLOW ===================== -->
  <text x="185" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Solow: diminishing returns</text>

  <!-- axes -->
  <line x1="60" y1="300" x2="330" y2="300" stroke="#111111" stroke-width="2"/>
  <line x1="60" y1="300" x2="60" y2="60" stroke="#111111" stroke-width="2"/>
  <text x="335" y="305" font-size="13" fill="#111111">k</text>

  <!-- (n+delta)k straight line -->
  <line x1="60" y1="300" x2="315" y2="95" stroke="#1a5fb4" stroke-width="2.5"/>
  <text x="250" y="110" font-size="13" fill="#1a5fb4">(n+δ)k</text>

  <!-- s f(k) concave curve -->
  <path d="M 60 300 Q 150 130 320 105" fill="none" stroke="#c01c28" stroke-width="2.5"/>
  <text x="255" y="150" font-size="13" fill="#c01c28">s·f(k)</text>

  <!-- crossing at k* (where the two meet) -->
  <circle cx="205" cy="182" r="4" fill="#111111"/>
  <line x1="205" y1="182" x2="205" y2="300" stroke="#111111" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="200" y="318" font-size="13" fill="#111111">k*</text>
  <text x="120" y="345" text-anchor="middle" font-size="12" fill="#555555">lines cross → growth stops</text>

  <!-- ===================== RIGHT PANEL: AK ===================== -->
  <text x="575" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">AK: constant returns</text>

  <!-- axes -->
  <line x1="450" y1="300" x2="720" y2="300" stroke="#111111" stroke-width="2"/>
  <line x1="450" y1="300" x2="450" y2="60" stroke="#111111" stroke-width="2"/>
  <text x="725" y="305" font-size="13" fill="#111111">k</text>

  <!-- (n+delta)k straight line (shallower) -->
  <line x1="450" y1="300" x2="710" y2="175" stroke="#1a5fb4" stroke-width="2.5"/>
  <text x="640" y="185" font-size="13" fill="#1a5fb4">(n+δ)k</text>

  <!-- s A k straight line (steeper, always above) -->
  <line x1="450" y1="300" x2="700" y2="80" stroke="#c01c28" stroke-width="2.5"/>
  <text x="620" y="95" font-size="13" fill="#c01c28">s·A·k</text>

  <!-- gap arrows showing sAk > (n+delta)k forever -->
  <line x1="600" y1="168" x2="600" y2="215" stroke="#2e7d32" stroke-width="2"/>
  <polygon points="600,163 596,173 604,173" fill="#2e7d32"/>
  <polygon points="600,220 596,210 604,210" fill="#2e7d32"/>
  <text x="612" y="196" font-size="12" fill="#2e7d32">gap &gt; 0</text>

  <text x="575" y="345" text-anchor="middle" font-size="12" fill="#555555">never cross → growth forever</text>
</svg>
