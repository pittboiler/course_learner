<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="sans-serif">
  <rect x="0" y="0" width="520" height="360" fill="#ffffff"/>

  <!-- axes -->
  <!-- horizontal axis (q) at I/K = 0 -->
  <line x1="60" y1="200" x2="480" y2="200" stroke="#333333" stroke-width="2"/>
  <!-- vertical axis at q = 0 -->
  <line x1="60" y1="40" x2="60" y2="340" stroke="#333333" stroke-width="2"/>

  <!-- axis labels -->
  <text x="486" y="205" font-size="18" fill="#333333">q</text>
  <text x="30" y="46" font-size="18" fill="#333333">I/K</text>

  <!-- q = 1 marker -->
  <line x1="270" y1="40" x2="270" y2="340" stroke="#999999" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="256" y="228" font-size="16" fill="#666666">1</text>

  <!-- I/K = 0 label at intersection -->
  <text x="66" y="196" font-size="14" fill="#666666">0</text>

  <!-- investment rule line: I/K = (q-1)/phi, passing through (q=1, I/K=0) -->
  <line x1="90" y1="290" x2="450" y2="90" stroke="#1a66cc" stroke-width="3"/>
  <text x="352" y="96" font-size="17" fill="#1a66cc" font-weight="bold">I/K = (q − 1)/φ</text>

  <!-- crossing dot at q=1 -->
  <circle cx="270" cy="200" r="5" fill="#1a66cc"/>

  <!-- region annotations -->
  <text x="120" y="322" font-size="15" fill="#cc3333">q &lt; 1: disinvest</text>
  <text x="330" y="60" font-size="15" fill="#118844">q &gt; 1: invest</text>

  <!-- slope note -->
  <text x="150" y="252" font-size="13" fill="#666666">slope = 1/φ (steeper = cheaper to adjust)</text>
</svg>
