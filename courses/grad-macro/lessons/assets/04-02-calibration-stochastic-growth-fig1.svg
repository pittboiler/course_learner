<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="430" fill="#ffffff"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Impulse responses to a persistent TFP shock (&#966;=0.95, &#945;=1/3)</text>

  <!-- axes -->
  <line x1="70" y1="360" x2="608" y2="360" stroke="#333333" stroke-width="1.5"/>
  <line x1="70" y1="40" x2="70" y2="360" stroke="#333333" stroke-width="1.5"/>

  <!-- y gridline at 1.0 -->
  <line x1="70" y1="131" x2="608" y2="131" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="64" y="135" text-anchor="end" font-size="12" fill="#666666">1.0</text>
  <text x="64" y="364" text-anchor="end" font-size="12" fill="#666666">0</text>
  <text x="64" y="60" text-anchor="end" font-size="12" fill="#666666">1.4</text>

  <!-- y label -->
  <text x="22" y="205" text-anchor="middle" font-size="13" fill="#333333" transform="rotate(-90 22 205)">% deviation from steady state</text>
  <!-- x label -->
  <text x="339" y="400" text-anchor="middle" font-size="13" fill="#333333">quarters since the shock (t)</text>
  <text x="70" y="378" text-anchor="middle" font-size="11" fill="#666666">0</text>
  <text x="335" y="378" text-anchor="middle" font-size="11" fill="#666666">5</text>
  <text x="600" y="378" text-anchor="middle" font-size="11" fill="#666666">10</text>

  <!-- z (TFP) : orange, monotone decay -->
  <polyline fill="none" stroke="#d97706" stroke-width="2.5"
    points="70,131 123,143 176,154 229,164 282,174 335,183 388,192 441,200 494,208 547,216 600,223"/>
  <!-- k (capital) : blue, starts at 0, humped -->
  <polyline fill="none" stroke="#2563eb" stroke-width="2.5"
    points="70,360 123,131 176,67 229,56 282,63 335,75 388,88 441,101 494,114 547,127 600,138"/>
  <!-- y (output) : green, jumps then humps -->
  <polyline fill="none" stroke="#059669" stroke-width="2.5"
    points="70,131 123,67 176,56 229,63 282,75 335,88 388,102 441,114 494,127 547,138 600,149"/>

  <!-- legend -->
  <rect x="430" y="300" width="172" height="56" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <line x1="442" y1="315" x2="466" y2="315" stroke="#d97706" stroke-width="2.5"/>
  <text x="472" y="319" font-size="12" fill="#333333">TFP  &#7825;&#8202;&#7524;</text>
  <line x1="442" y1="333" x2="466" y2="333" stroke="#2563eb" stroke-width="2.5"/>
  <text x="472" y="337" font-size="12" fill="#333333">capital  k&#770;&#8202;&#7524;&#8330;&#8321; (predetermined)</text>
  <line x1="442" y1="351" x2="466" y2="351" stroke="#059669" stroke-width="2.5"/>
  <text x="472" y="355" font-size="12" fill="#333333">output  &#375;&#8202;&#7524;</text>
</svg>