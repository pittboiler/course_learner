<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">The New Keynesian model: three blocks, one gap</text>

  <!-- Households box -->
  <rect x="40" y="70" width="180" height="90" rx="8" fill="#e8f0fe" stroke="#1a56db" stroke-width="2"/>
  <text x="130" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Households</text>
  <text x="130" y="120" text-anchor="middle" font-size="12" fill="#333">optimal consumption</text>
  <text x="130" y="138" text-anchor="middle" font-size="12" fill="#333">Euler equation</text>

  <!-- Firms box -->
  <rect x="40" y="290" width="180" height="110" rx="8" fill="#fdeee8" stroke="#c2410c" stroke-width="2"/>
  <text x="130" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Monopolistic firms</text>
  <text x="130" y="340" text-anchor="middle" font-size="12" fill="#333">markup pricing +</text>
  <text x="130" y="358" text-anchor="middle" font-size="12" fill="#333">Calvo stickiness</text>
  <text x="130" y="380" text-anchor="middle" font-size="12" fill="#333">(fraction 1−θ reset)</text>

  <!-- Central bank box -->
  <rect x="500" y="180" width="180" height="100" rx="8" fill="#eafbea" stroke="#15803d" stroke-width="2"/>
  <text x="590" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Central bank</text>
  <text x="590" y="230" text-anchor="middle" font-size="12" fill="#333">sets nominal rate i</text>
  <text x="590" y="248" text-anchor="middle" font-size="12" fill="#333">Taylor rule</text>
  <text x="590" y="266" text-anchor="middle" font-size="12" fill="#333">(Module 6)</text>

  <!-- Output gap center -->
  <ellipse cx="360" cy="230" rx="95" ry="55" fill="#fff7d6" stroke="#a16207" stroke-width="2.5"/>
  <text x="360" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Output gap</text>
  <text x="360" y="244" text-anchor="middle" font-size="13" fill="#333">x = y − yⁿ</text>

  <!-- Arrows: Households -> IS -> gap -->
  <line x1="220" y1="115" x2="300" y2="200" stroke="#1a56db" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="150" font-size="12" font-style="italic" fill="#1a56db">IS (Euler)</text>

  <!-- Firms -> Phillips -> gap -->
  <line x1="220" y1="345" x2="300" y2="262" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="228" y="330" font-size="12" font-style="italic" fill="#c2410c">Phillips curve</text>

  <!-- Central bank -> gap (real rate) -->
  <line x1="500" y1="230" x2="458" y2="230" stroke="#15803d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462" y="200" font-size="12" font-style="italic" fill="#15803d">real rate</text>

  <!-- gap feedback to central bank (dashed) -->
  <path d="M 430 270 Q 520 320 585 282" fill="none" stroke="#777" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="500" y="322" font-size="11" font-style="italic" fill="#777">responds to gap, inflation</text>

  <!-- inflation label between firms and CB -->
  <text x="360" y="435" text-anchor="middle" font-size="13" fill="#555">Sticky prices ⇒ money is NON-neutral ⇒ policy can close the gap</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
</svg>
