<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Recursive Competitive Equilibrium</text>

  <!-- Households box -->
  <rect x="40" y="80" width="200" height="90" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="140" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Households</text>
  <text x="140" y="134" text-anchor="middle" font-size="12" fill="#1e3a8a">own capital k, labor</text>
  <text x="140" y="152" text-anchor="middle" font-size="12" fill="#1e3a8a">choose c, k' via policy g</text>

  <!-- Firms box -->
  <rect x="480" y="80" width="200" height="90" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="580" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">Firms</text>
  <text x="580" y="134" text-anchor="middle" font-size="12" fill="#14532d">rent k, hire labor</text>
  <text x="580" y="152" text-anchor="middle" font-size="12" fill="#14532d">maximize profit</text>

  <!-- Factor markets arrows -->
  <!-- top arrow: households supply factors to firms -->
  <line x1="240" y1="105" x2="480" y2="105" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="97" text-anchor="middle" font-size="12" fill="#374151">supply capital k &amp; labor</text>

  <!-- bottom arrow: firms pay factor prices r,w -->
  <line x1="480" y1="145" x2="240" y2="145" stroke="#b45309" stroke-width="2" marker-end="url(#arrowO)"/>
  <text x="360" y="163" text-anchor="middle" font-size="12" fill="#b45309" font-weight="bold">pay r = MPK,  w = MPL</text>

  <!-- Factor markets label -->
  <text x="360" y="200" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">competitive factor markets clear</text>

  <!-- big-K / little-k forecasting loop -->
  <rect x="180" y="240" width="360" height="120" rx="10" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="360" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b21a8">The big-K / little-k trick</text>

  <text x="360" y="292" text-anchor="middle" font-size="12.5" fill="#3b0764">household controls its own k ; forecasts aggregate K</text>
  <text x="360" y="313" text-anchor="middle" font-size="13" fill="#3b0764">perceived law:  K' = G(K)</text>

  <!-- consistency fixed point -->
  <text x="360" y="341" text-anchor="middle" font-size="13" font-weight="bold" fill="#be185d">consistency:  aggregate of g(K,K)  =  G(K)</text>

  <!-- fixed-point loop arrows around the box -->
  <path d="M 175 300 C 120 300, 120 420, 360 420 C 600 420, 600 300, 545 300"
        fill="none" stroke="#be185d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowP)"/>
  <text x="360" y="440" text-anchor="middle" font-size="12" fill="#be185d" font-style="italic">fixed point in the law of motion G</text>

  <!-- equilibrium note -->
  <text x="360" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">in equilibrium: little k = big K  (only after each optimizes separately)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#374151"/>
    </marker>
    <marker id="arrowO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b45309"/>
    </marker>
    <marker id="arrowP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#be185d"/>
    </marker>
  </defs>
</svg>
