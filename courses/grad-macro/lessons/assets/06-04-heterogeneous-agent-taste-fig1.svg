<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="sans-serif">
  <rect x="0" y="0" width="680" height="380" fill="#ffffff"/>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Stationary wealth distribution (Aiyagari)</text>

  <!-- Axes -->
  <line x1="80" y1="300" x2="620" y2="300" stroke="#111111" stroke-width="2"/>
  <line x1="80" y1="300" x2="80" y2="70" stroke="#111111" stroke-width="2"/>
  <text x="350" y="345" text-anchor="middle" font-size="13" fill="#111111">wealth  a  (assets)</text>
  <text x="30" y="185" text-anchor="middle" font-size="13" fill="#111111" transform="rotate(-90 30 185)">density  of  households</text>

  <!-- Borrowing constraint line at a = a_min (x = 80) -->
  <line x1="80" y1="70" x2="80" y2="300" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="88" y="86" font-size="12" fill="#c0392b">borrowing</text>
  <text x="88" y="102" font-size="12" fill="#c0392b">constraint  a = a&#8331;</text>

  <!-- Mass spike at the constraint -->
  <rect x="80" y="120" width="20" height="180" fill="#c0392b" opacity="0.55"/>
  <text x="112" y="135" font-size="11.5" fill="#c0392b">atom of constrained</text>
  <text x="112" y="150" font-size="11.5" fill="#c0392b">households (a = a&#8331;)</text>

  <!-- Right-skewed density curve -->
  <path d="M 100 300
           C 130 300, 150 130, 190 128
           C 230 126, 250 175, 300 210
           C 360 250, 430 278, 500 292
           C 550 298, 590 300, 620 300"
        fill="none" stroke="#1f4e8c" stroke-width="3"/>
  <path d="M 100 300
           C 130 300, 150 130, 190 128
           C 230 126, 250 175, 300 210
           C 360 250, 430 278, 500 292
           C 550 298, 590 300, 620 300
           L 620 300 L 100 300 Z"
        fill="#1f4e8c" opacity="0.14"/>
  <text x="215" y="118" font-size="12" fill="#1f4e8c">buffer-stock savers</text>
  <text x="470" y="270" font-size="12" fill="#1f4e8c">long right tail (wealthy)</text>

  <!-- mean marker -->
  <line x1="255" y1="300" x2="255" y2="315" stroke="#111111" stroke-width="1.5"/>
  <text x="255" y="330" text-anchor="middle" font-size="11.5" fill="#111111">mean = aggregate K</text>
</svg>
