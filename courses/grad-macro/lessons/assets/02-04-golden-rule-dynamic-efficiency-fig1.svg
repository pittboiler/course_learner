<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>

  <!-- axes -->
  <line x1="70" y1="360" x2="620" y2="360" stroke="#333333" stroke-width="2"/>
  <line x1="70" y1="360" x2="70" y2="40" stroke="#333333" stroke-width="2"/>
  <text x="612" y="384" font-size="16" fill="#333333">k</text>
  <text x="30" y="52" font-size="16" fill="#333333">c</text>
  <text x="150" y="30" font-size="15" fill="#333333">steady-state consumption  c(k) = f(k) − (n+δ)k</text>

  <!-- consumption hump c(k)=k^{1/3}-0.07k -->
  <polyline fill="none" stroke="#1f6feb" stroke-width="3"
    points="70,360 89.3,185.6 108.6,150 127.9,129 147.2,115 187.5,97.5 224.3,90 270.4,87.2 301.5,88.3 359.4,94.5 438.3,109.5 494.4,123.4 552.4,140 610,158.1"/>

  <!-- k* Ramsey -->
  <line x1="187.5" y1="360" x2="187.5" y2="97.5" stroke="#2ca02c" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="187.5" cy="97.5" r="4.5" fill="#2ca02c"/>
  <text x="150" y="380" font-size="15" fill="#2ca02c">k* (Ramsey)</text>

  <!-- k_gr golden rule (peak) -->
  <line x1="270.4" y1="360" x2="270.4" y2="87.2" stroke="#d62728" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="270.4" cy="87.2" r="4.5" fill="#d62728"/>
  <text x="248" y="380" font-size="15" fill="#d62728">k_gr</text>
  <text x="286" y="74" font-size="14" fill="#d62728">peak: max c</text>

  <!-- Solow over-accumulation -->
  <line x1="438.3" y1="360" x2="438.3" y2="109.5" stroke="#9467bd" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="438.3" cy="109.5" r="4.5" fill="#9467bd"/>
  <text x="392" y="380" font-size="15" fill="#9467bd">k* (Solow, s&gt;α)</text>

  <!-- efficiency zone labels -->
  <text x="120" y="150" font-size="13" fill="#2ca02c">under-</text>
  <text x="120" y="167" font-size="13" fill="#2ca02c">accumulation</text>
  <text x="470" y="150" font-size="13" fill="#9467bd">over-accumulation</text>
  <text x="470" y="167" font-size="13" fill="#9467bd">(inefficient)</text>

  <!-- arrow: lowering s raises c -->
  <line x1="430" y1="122" x2="290" y2="102" stroke="#9467bd" stroke-width="2"/>
  <polygon points="290,102 300,98 299,108" fill="#9467bd"/>
  <text x="300" y="128" font-size="12.5" fill="#9467bd">lower s ⇒ c rises every period</text>
</svg>
