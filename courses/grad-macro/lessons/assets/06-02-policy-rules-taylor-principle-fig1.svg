<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="440" fill="#ffffff"/>

  <!-- title -->
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">The Taylor principle: how the real rate answers inflation</text>

  <!-- axes -->
  <line x1="90" y1="360" x2="600" y2="360" stroke="#111111" stroke-width="2"/>
  <line x1="90" y1="360" x2="90" y2="55" stroke="#111111" stroke-width="2"/>
  <text x="600" y="388" text-anchor="end" font-size="15" fill="#111111">inflation  &#960;</text>
  <text x="70" y="65" text-anchor="end" font-size="15" fill="#111111">nominal rate  i</text>

  <!-- target point guides -->
  <line x1="345" y1="360" x2="345" y2="205" stroke="#999999" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="90" y1="205" x2="345" y2="205" stroke="#999999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="345" y="380" text-anchor="middle" font-size="13" fill="#555555">&#960;*</text>

  <!-- Fisher 45-degree reference line: constant real rate -->
  <line x1="130" y1="345" x2="560" y2="65" stroke="#777777" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="565" y="62" font-size="12.5" fill="#555555">i = r*+&#960;</text>
  <text x="565" y="78" font-size="12.5" fill="#555555">(real rate fixed)</text>

  <!-- steep rule: phi_pi > 1 (determinate) -->
  <line x1="210" y1="360" x2="480" y2="60" stroke="#1a7f37" stroke-width="3"/>
  <text x="486" y="60" font-size="13.5" font-weight="bold" fill="#1a7f37">&#966;<tspan font-size="10" dy="4">&#960;</tspan><tspan dy="-4"> &gt; 1</tspan></text>
  <text x="486" y="78" font-size="12.5" fill="#1a7f37">determinate,</text>
  <text x="486" y="94" font-size="12.5" fill="#1a7f37">stabilizing</text>

  <!-- flat rule: phi_pi < 1 (indeterminate) -->
  <line x1="120" y1="315" x2="590" y2="130" stroke="#c1121f" stroke-width="3"/>
  <text x="500" y="150" font-size="13.5" font-weight="bold" fill="#c1121f">&#966;<tspan font-size="10" dy="4">&#960;</tspan><tspan dy="-4"> &lt; 1</tspan></text>
  <text x="500" y="168" font-size="12.5" fill="#c1121f">indeterminate,</text>
  <text x="500" y="184" font-size="12.5" fill="#c1121f">spiraling</text>

  <!-- target dot -->
  <circle cx="345" cy="205" r="5" fill="#111111"/>
  <text x="332" y="200" text-anchor="end" font-size="12.5" fill="#111111">target</text>

  <!-- annotation: to the right of target, real-rate gap -->
  <line x1="470" y1="120" x2="470" y2="163" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="470" y1="163" x2="470" y2="120" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="452" y="115" text-anchor="middle" font-size="11.5" fill="#1a7f37">i rises</text>
  <text x="452" y="128" text-anchor="middle" font-size="11.5" fill="#1a7f37">above &#960;</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#1a7f37"/>
    </marker>
  </defs>

  <!-- caption -->
  <text x="320" y="418" text-anchor="middle" font-size="12.5" fill="#333333">Right of target: the green rule lifts i above the dashed Fisher line &#8594; real rate up &#8594; demand cools &#8594; &#960; falls back.</text>
  <text x="320" y="434" text-anchor="middle" font-size="12.5" fill="#333333">The red rule lets &#960; outrun i &#8594; real rate falls &#8594; demand heats &#8594; &#960; rises further (self-fulfilling).</text>
</svg>
