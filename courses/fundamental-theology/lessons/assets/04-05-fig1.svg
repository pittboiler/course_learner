<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="Helvetica, Arial, sans-serif">

  <!-- axes -->
  <line x1="238" y1="34" x2="238" y2="352" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="238" y1="352" x2="776" y2="352" stroke="#8a8a8a" stroke-width="1.6"/>

  <!-- rung gridlines -->
  <line x1="238" y1="60" x2="776" y2="60" stroke="#8a8a8a" stroke-width="0.6" stroke-dasharray="3,4"/>
  <line x1="238" y1="108" x2="776" y2="108" stroke="#8a8a8a" stroke-width="0.6" stroke-dasharray="3,4"/>
  <line x1="238" y1="156" x2="776" y2="156" stroke="#8a8a8a" stroke-width="0.6" stroke-dasharray="3,4"/>
  <line x1="238" y1="204" x2="776" y2="204" stroke="#8a8a8a" stroke-width="0.6" stroke-dasharray="3,4"/>
  <line x1="238" y1="252" x2="776" y2="252" stroke="#8a8a8a" stroke-width="0.6" stroke-dasharray="3,4"/>
  <line x1="238" y1="316" x2="776" y2="316" stroke="#8a8a8a" stroke-width="0.6" stroke-dasharray="3,4"/>

  <!-- rung labels -->
  <text x="230" y="63" text-anchor="end" font-size="11" fill="#8a8a8a">1 &#183; divinely revealed</text>
  <text x="230" y="111" text-anchor="end" font-size="11" fill="#8a8a8a">2 &#183; definitive, to be held</text>
  <text x="230" y="159" text-anchor="end" font-size="11" fill="#8a8a8a">3 &#183; authentic, non&#8209;definitive</text>
  <text x="230" y="207" text-anchor="end" font-size="11" fill="#8a8a8a">4 &#183; theologically certain</text>
  <text x="230" y="255" text-anchor="end" font-size="11" fill="#8a8a8a">5 &#183; freely disputed</text>
  <text x="230" y="319" text-anchor="end" font-size="11" fill="#8a8a8a">not a teaching act</text>

  <!-- vertical axis title -->
  <text x="26" y="196" font-size="12" fill="#4a90d9" transform="rotate(-90 26 196)" text-anchor="middle">LEVEL OF AUTHORITY &#8212; how firmly taught</text>

  <!-- horizontal axis title and ends -->
  <text x="507" y="393" text-anchor="middle" font-size="12" fill="#4a90d9">HIERARCHY OF TRUTHS &#8212; relation to the foundation of the faith</text>
  <text x="248" y="371" font-size="10.5" fill="#8a8a8a">at the foundation</text>
  <text x="770" y="371" text-anchor="end" font-size="10.5" fill="#8a8a8a">further out, ordered to it</text>

  <!-- the coral link: same rung, opposite ends -->
  <line x1="310" y1="60" x2="706" y2="60" stroke="#e0645c" stroke-width="1.4" stroke-dasharray="6,5"/>
  <text x="508" y="50" text-anchor="middle" font-size="11" fill="#e0645c">same rung, opposite ends of the other axis</text>

  <!-- plotted claims -->
  <circle cx="310" cy="60" r="5" fill="#4a90d9"/>
  <text x="310" y="81" text-anchor="middle" font-size="10.5" fill="#4a90d9">Trinity; Incarnation</text>

  <circle cx="706" cy="60" r="5" fill="#4a90d9"/>
  <text x="706" y="81" text-anchor="middle" font-size="10.5" fill="#4a90d9">the Assumption, 1950</text>

  <circle cx="648" cy="108" r="5" fill="#4a90d9"/>
  <text x="648" y="129" text-anchor="middle" font-size="10.5" fill="#4a90d9">reserved priestly ordination</text>

  <circle cx="712" cy="156" r="5" fill="#4a90d9"/>
  <text x="712" y="177" text-anchor="middle" font-size="10.5" fill="#4a90d9">subsidiarity</text>

  <circle cx="392" cy="156" r="5" fill="#4a90d9"/>
  <text x="392" y="177" text-anchor="middle" font-size="10.5" fill="#4a90d9">a papal catechesis on prayer</text>

  <circle cx="530" cy="204" r="5" fill="#4a90d9"/>
  <text x="530" y="225" text-anchor="middle" font-size="10.5" fill="#4a90d9">many conclusions of the manuals</text>

  <circle cx="668" cy="252" r="5" fill="#4a90d9"/>
  <text x="668" y="273" text-anchor="middle" font-size="10.5" fill="#4a90d9">the fate of unbaptized infants</text>

  <circle cx="470" cy="316" r="5" fill="#e0645c"/>
  <text x="470" y="337" text-anchor="middle" font-size="10.5" fill="#e0645c">a remark in a press conference</text>

  <text x="507" y="416" text-anchor="middle" font-size="10.5" fill="#8a8a8a">Horizontal positions are illustrative, not measured. Moving right never moves a claim down.</text>
</svg>
