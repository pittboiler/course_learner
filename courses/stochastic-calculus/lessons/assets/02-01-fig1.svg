<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="340" fill="#ffffff"/>
  <text x="320" y="28" font-size="15" fill="#111" text-anchor="middle">The Riemann sum for &#8747;W dW depends on where you sample.</text>

  <!-- axes -->
  <line x1="70" y1="270" x2="600" y2="270" stroke="#111" stroke-width="1.2"/>
  <text x="605" y="274" font-size="12" fill="#555">t</text>

  <!-- one subinterval [t_k, t_{k+1}] blown up: path rises jaggedly -->
  <line x1="180" y1="275" x2="180" y2="265" stroke="#111"/>
  <text x="176" y="292" font-size="12" fill="#555" text-anchor="middle">t&#8342;</text>
  <line x1="440" y1="275" x2="440" y2="265" stroke="#111"/>
  <text x="440" y="292" font-size="12" fill="#555" text-anchor="middle">t&#8342;&#8330;&#8321;</text>

  <!-- left value line and right value line -->
  <line x1="70" y1="200" x2="180" y2="200" stroke="#1f6fb2" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="64" y="204" font-size="12" fill="#1f6fb2" text-anchor="end">W(t&#8342;)</text>
  <line x1="70" y1="110" x2="440" y2="110" stroke="#c0532a" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="64" y="114" font-size="12" fill="#c0532a" text-anchor="end">W(t&#8342;&#8330;&#8321;)</text>

  <!-- left rectangle (Ito choice, height = left value) -->
  <rect x="180" y="200" width="260" height="70" fill="#1f6fb2" fill-opacity="0.12" stroke="#1f6fb2" stroke-width="1.2"/>
  <text x="310" y="255" font-size="12.5" fill="#1f6fb2" text-anchor="middle">left height (It&#244;)</text>

  <!-- right-height top marker -->
  <rect x="180" y="110" width="260" height="90" fill="#c0532a" fill-opacity="0.07" stroke="#c0532a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="310" y="130" font-size="12.5" fill="#c0532a" text-anchor="middle">right height</text>

  <!-- the jagged path across the interval -->
  <polyline points="180,200 210,175 235,205 265,150 300,185 330,130 365,165 400,120 440,110"
            fill="none" stroke="#1a1a1a" stroke-width="1.6"/>

  <text x="320" y="320" font-size="13.5" fill="#111" text-anchor="middle">right&#8722;sum &#8722; left&#8722;sum = &#931;(&#916;W)&#178; &#8594; T &#8800; 0   &#8658;   the two limits differ</text>
</svg>
