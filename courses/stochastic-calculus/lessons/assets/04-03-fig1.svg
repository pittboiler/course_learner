<svg viewBox="0 0 660 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="280" fill="#ffffff"/>
  <defs>
    <marker id="mr" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#111"/>
    </marker>
  </defs>
  <text x="330" y="32" font-size="15" fill="#111" text-anchor="middle">Martingale representation: every Brownian martingale is a stochastic integral.</text>

  <!-- left box: any martingale -->
  <rect x="40" y="90" width="200" height="80" rx="8" fill="#1f6fb2" fill-opacity="0.08" stroke="#1f6fb2" stroke-width="1.8"/>
  <text x="140" y="122" font-size="15" fill="#1f6fb2" text-anchor="middle">any martingale M&#8348;</text>
  <text x="140" y="146" font-size="12.5" fill="#555" text-anchor="middle">(w.r.t. the BM filtration)</text>

  <!-- arrow -->
  <line x1="245" y1="130" x2="330" y2="130" stroke="#111" stroke-width="1.8" marker-end="url(#mr)"/>
  <text x="288" y="120" font-size="13" fill="#111" text-anchor="middle">=</text>

  <!-- right box: integral form -->
  <rect x="340" y="90" width="280" height="80" rx="8" fill="#0a7d4f" fill-opacity="0.08" stroke="#0a7d4f" stroke-width="1.8"/>
  <text x="480" y="126" font-size="17" fill="#0a7d4f" text-anchor="middle">M&#8320; + &#8747;&#8320;&#7511; H&#8347; dW&#8347;</text>
  <text x="480" y="150" font-size="12.5" fill="#555" text-anchor="middle">unique adapted integrand H</text>

  <text x="330" y="210" font-size="13.5" fill="#111" text-anchor="middle">H is the hedging strategy &#8212; every payoff is replicable (market completeness).</text>
  <text x="330" y="234" font-size="12.5" fill="#555" text-anchor="middle">existence is guaranteed; H is explicit via Clark&#8211;Ocone (Malliavin derivative).</text>
</svg>
