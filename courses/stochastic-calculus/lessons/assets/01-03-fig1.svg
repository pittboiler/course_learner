<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="320" fill="#ffffff"/>
  <text x="320" y="28" font-size="15" fill="#111" text-anchor="middle">A filtration is accumulating information: F_s &#8838; F_t for s &#8804; t.</text>

  <!-- known-information region up to s (solid path), unknown after (dashed) -->
  <polyline points="60,180 90,150 110,168 140,120 165,150 190,130 215,175 240,140 265,160"
            fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <polyline points="265,160 300,190 330,120 360,175 395,135 430,185 465,140 500,170 540,130 580,165"
            fill="none" stroke="#bbb" stroke-width="1.6" stroke-dasharray="5,4"/>

  <!-- now marker at s -->
  <line x1="265" y1="90" x2="265" y2="250" stroke="#1f6fb2" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="265" y="82" font-size="13" fill="#1f6fb2" text-anchor="middle">"now" = s</text>
  <circle cx="265" cy="160" r="4" fill="#1f6fb2"/>

  <!-- t marker -->
  <line x1="470" y1="110" x2="470" y2="250" stroke="#c0532a" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="470" y="104" font-size="13" fill="#c0532a" text-anchor="middle">later t</text>

  <!-- information brackets -->
  <line x1="60" y1="265" x2="265" y2="265" stroke="#1f6fb2" stroke-width="3"/>
  <text x="162" y="285" font-size="13" fill="#1f6fb2" text-anchor="middle">F_s  (known by s)</text>
  <line x1="60" y1="298" x2="470" y2="298" stroke="#c0532a" stroke-width="3"/>
  <text x="265" y="315" font-size="12" fill="#c0532a" text-anchor="middle">F_t  (known by t)  &#8835;  F_s</text>

  <!-- Markov note -->
  <text x="470" y="215" font-size="12.5" fill="#555" text-anchor="middle">Markov: future | past</text>
  <text x="470" y="232" font-size="12.5" fill="#555" text-anchor="middle">= future | present</text>
</svg>
