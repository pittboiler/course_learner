<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="620" height="320" fill="#ffffff"/>
  <text x="310" y="30" font-size="15" fill="#111" text-anchor="middle">Cov(W_s, W_t) = min(s, t): the shared history, up to the earlier time.</text>

  <!-- time axis -->
  <line x1="60" y1="250" x2="560" y2="250" stroke="#111" stroke-width="1.4"/>
  <text x="60" y="272" font-size="13" fill="#555">0</text>
  <line x1="260" y1="245" x2="260" y2="255" stroke="#111" stroke-width="1.4"/>
  <text x="256" y="272" font-size="13" fill="#555">s</text>
  <line x1="460" y1="245" x2="460" y2="255" stroke="#111" stroke-width="1.4"/>
  <text x="456" y="272" font-size="13" fill="#555">t</text>

  <!-- bar for W_s : history [0,s] -->
  <rect x="60" y="120" width="200" height="26" fill="#1f6fb2" fill-opacity="0.18" stroke="#1f6fb2" stroke-width="1.4"/>
  <text x="160" y="112" font-size="14" fill="#1f6fb2" text-anchor="middle">W_s uses [0, s]</text>

  <!-- bar for W_t : history [0,t] -->
  <rect x="60" y="160" width="400" height="26" fill="#c0532a" fill-opacity="0.14" stroke="#c0532a" stroke-width="1.4"/>
  <text x="360" y="204" font-size="14" fill="#c0532a" text-anchor="middle">W_t uses [0, t] = [0, s] &#8746; (s, t]</text>

  <!-- shared portion highlight -->
  <rect x="60" y="120" width="200" height="66" fill="#0a7d4f" fill-opacity="0.10" stroke="#0a7d4f" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="160" y="235" font-size="13" fill="#0a7d4f" text-anchor="middle">shared: length s = min(s,t)</text>

  <!-- decomposition -->
  <text x="310" y="300" font-size="14" fill="#111" text-anchor="middle">W_t = W_s + (W_t &#8722; W_s),  and (W_t &#8722; W_s) &#8869; W_s  &#8658;  Cov = Var(W_s) = s</text>
</svg>
