<svg viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="260" fill="#ffffff"/>
  <text x="330" y="30" font-size="15" fill="#111" text-anchor="middle">The stochastic product rule carries an extra cross term.</text>

  <!-- ordinary -->
  <text x="40" y="90" font-size="13.5" fill="#555">ordinary calculus:</text>
  <text x="230" y="90" font-size="17" fill="#999">d(XY) = X dY + Y dX</text>

  <!-- stochastic -->
  <text x="40" y="150" font-size="13.5" fill="#111">It&#244; calculus:</text>
  <text x="205" y="150" font-size="17" fill="#111">d(XY) = X dY + Y dX +</text>
  <rect x="475" y="128" width="120" height="34" fill="#0a7d4f" fill-opacity="0.12" stroke="#0a7d4f" stroke-width="1.6"/>
  <text x="535" y="151" font-size="17" fill="#0a7d4f" text-anchor="middle">dX dY</text>

  <text x="535" y="185" font-size="12.5" fill="#0a7d4f" text-anchor="middle">= d[X,Y]</text>
  <text x="535" y="203" font-size="12" fill="#555" text-anchor="middle">covariation</text>

  <text x="330" y="235" font-size="13" fill="#111" text-anchor="middle">for dX=&#963;&#8339; dW, dY=&#963;&#8342; dW (correlation &#961;):   dX dY = &#961; &#963;&#8339; &#963;&#8342; dt</text>
</svg>
