<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="560" height="320" fill="#ffffff"/>
  <text x="280" y="30" font-size="16" fill="#111" text-anchor="middle">The Itô multiplication table</text>
  <text x="280" y="52" font-size="12.5" fill="#555" text-anchor="middle">keep only terms of order dt; (dW)&#178; = dt is the survivor</text>

  <!-- grid -->
  <g stroke="#111" stroke-width="1.4">
    <line x1="150" y1="80" x2="470" y2="80"/>
    <line x1="150" y1="160" x2="470" y2="160"/>
    <line x1="150" y1="240" x2="470" y2="240"/>
    <line x1="150" y1="80" x2="150" y2="240"/>
    <line x1="310" y1="80" x2="310" y2="240"/>
    <line x1="470" y1="80" x2="470" y2="240"/>
  </g>

  <!-- headers -->
  <text x="230" y="70" font-size="18" font-style="italic" fill="#1f6fb2" text-anchor="middle">dt</text>
  <text x="390" y="70" font-size="18" font-style="italic" fill="#1f6fb2" text-anchor="middle">dW</text>
  <text x="120" y="126" font-size="18" font-style="italic" fill="#1f6fb2" text-anchor="middle">dt</text>
  <text x="120" y="206" font-size="18" font-style="italic" fill="#1f6fb2" text-anchor="middle">dW</text>

  <!-- entries -->
  <text x="230" y="126" font-size="18" fill="#999" text-anchor="middle">0</text>
  <text x="390" y="126" font-size="18" fill="#999" text-anchor="middle">0</text>
  <text x="230" y="206" font-size="18" fill="#999" text-anchor="middle">0</text>

  <!-- highlight dW*dW = dt -->
  <rect x="310" y="160" width="160" height="80" fill="#0a7d4f" fill-opacity="0.12" stroke="#0a7d4f" stroke-width="2"/>
  <text x="390" y="206" font-size="20" fill="#0a7d4f" text-anchor="middle" font-weight="bold">dt</text>

  <text x="280" y="285" font-size="14" fill="#111" text-anchor="middle">dW&#183;dW = dt,   dt&#183;dW = 0,   dt&#183;dt = 0</text>
  <text x="280" y="306" font-size="12" fill="#555" text-anchor="middle">because (&#916;W)&#178; &#8776; &#916;t,  &#916;t&#183;&#916;W &#8776; &#916;t^{3/2} &#8594; 0,  (&#916;t)&#178; &#8594; 0</text>
</svg>
