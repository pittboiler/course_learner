  <text x="60" y="414" fill="#8a8a8a" font-size="10.5">Head starts at track 53, marked with a dot. SSTF moves least and can starve a request stranded at the far end.</text>
  <text x="60" y="434" fill="#8a8a8a" font-size="10.5">C-SCAN moves most and gives every track the same maximum wait, because the head always approaches from</text>
  <text x="60" y="454" fill="#e0645c" font-size="10.5">the same direction. Least movement and fairest service are different objectives, and no policy wins both.</text>
