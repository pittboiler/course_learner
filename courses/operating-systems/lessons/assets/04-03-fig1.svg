<svg viewBox="0 0 790 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">The journal does not prevent the crash. It makes every crash point recoverable.</text>
  <rect x="70" y="72" width="130" height="64" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" rx="5" opacity="0.14"/>
  <text x="135" y="94" fill="#4a90d9" font-size="10.5" text-anchor="middle">write the</text>
  <text x="135" y="110" fill="#4a90d9" font-size="10.5" text-anchor="middle">JOURNAL entry</text>
  <line x1="202" y1="104" x2="212.0" y2="104.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="218,104 212.0,107.3 212.0,100.7" fill="#8a8a8a"/>
  <rect x="220" y="72" width="130" height="64" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" rx="5" opacity="0.14"/>
  <text x="285" y="94" fill="#4a90d9" font-size="10.5" text-anchor="middle">write the</text>
  <text x="285" y="110" fill="#4a90d9" font-size="10.5" text-anchor="middle">COMMIT record</text>
  <line x1="352" y1="104" x2="362.0" y2="104.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="368,104 362.0,107.3 362.0,100.7" fill="#8a8a8a"/>
  <rect x="370" y="72" width="130" height="64" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" rx="5" opacity="0.14"/>
  <text x="435" y="94" fill="#4a90d9" font-size="10.5" text-anchor="middle">write the data</text>
  <text x="435" y="110" fill="#4a90d9" font-size="10.5" text-anchor="middle">and metadata</text>
  <text x="435" y="126" fill="#4a90d9" font-size="10.5" text-anchor="middle">IN PLACE</text>
  <line x1="502" y1="104" x2="512.0" y2="104.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="518,104 512.0,107.3 512.0,100.7" fill="#8a8a8a"/>
  <rect x="520" y="72" width="130" height="64" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" rx="5" opacity="0.14"/>
  <text x="585" y="94" fill="#4a90d9" font-size="10.5" text-anchor="middle">free the</text>
  <text x="585" y="110" fill="#4a90d9" font-size="10.5" text-anchor="middle">journal entry</text>
  <line x1="70" y1="160" x2="650" y2="160" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="130" y1="140" x2="130" y2="178" stroke="#e0645c" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="130" y="196" fill="#e0645c" font-size="10.5" text-anchor="middle">crash here</text>
  <text x="60" y="216" fill="#8a8a8a" font-size="9.8">journal incomplete: no commit record,</text>
  <text x="60" y="232" fill="#8a8a8a" font-size="9.8">so recovery DISCARDS it. The file system</text>
  <text x="60" y="248" fill="#8a8a8a" font-size="9.8">is exactly as it was before. Update lost,</text>
  <text x="60" y="264" fill="#8a8a8a" font-size="9.8">consistency kept.</text>
  <line x1="290" y1="140" x2="290" y2="178" stroke="#e0645c" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="290" y="196" fill="#e0645c" font-size="10.5" text-anchor="middle">crash here</text>
  <text x="220" y="216" fill="#8a8a8a" font-size="9.8">committed but not applied: recovery</text>
  <text x="220" y="232" fill="#8a8a8a" font-size="9.8">REPLAYS the journal entry, writing the</text>
  <text x="220" y="248" fill="#8a8a8a" font-size="9.8">data and metadata in place. Update kept.</text>
  <line x1="450" y1="140" x2="450" y2="178" stroke="#e0645c" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="450" y="196" fill="#e0645c" font-size="10.5" text-anchor="middle">crash here</text>
  <text x="380" y="216" fill="#8a8a8a" font-size="9.8">applied but not freed: recovery replays</text>
  <text x="380" y="232" fill="#8a8a8a" font-size="9.8">it AGAIN. Harmless, because writing the</text>
  <text x="380" y="248" fill="#8a8a8a" font-size="9.8">same bytes twice is idempotent.</text>
  <line x1="50" y1="290" x2="740" y2="290" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="314" fill="#e0645c" font-size="11">The commit record is the whole mechanism: a single small write whose presence or absence decides,</text>
  <text x="60" y="332" fill="#e0645c" font-size="11">unambiguously, whether an entire multi-block update happened. That is what makes the update ATOMIC.</text>
  <text x="60" y="360" fill="#8a8a8a" font-size="11">The cost is that every change is written twice. Ordered journaling logs only METADATA and writes file</text>
  <text x="60" y="378" fill="#8a8a8a" font-size="11">data straight to its final home first, which halves the traffic and gives a weaker guarantee: the</text>
  <text x="60" y="396" fill="#8a8a8a" font-size="11">structure is always consistent, but a file may contain data from before the crash.</text>
</svg>
