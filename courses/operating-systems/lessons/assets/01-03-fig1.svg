<svg viewBox="0 0 790 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">A process is an address space plus one thread of control plus a row in the kernel's table.</text>
  <rect x="70" y="58" width="180" height="300" fill="none" stroke="#8a8a8a" stroke-width="1.4" rx="6"/>
  <text x="160" y="50" fill="#8a8a8a" font-size="11" text-anchor="middle">one process's address space</text>
  <rect x="78" y="58" width="164" height="46" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" rx="4" opacity="0.13"/>
  <text x="160" y="85.0" fill="#e0645c" font-size="11" text-anchor="middle">stack</text>
  <rect x="78" y="104" width="164" height="96" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" rx="4" opacity="0.04"/>
  <text x="160" y="156.0" fill="#8a8a8a" font-size="11" text-anchor="middle">(unmapped)</text>
  <rect x="78" y="200" width="164" height="50" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" rx="4" opacity="0.13"/>
  <text x="160" y="229.0" fill="#4a90d9" font-size="11" text-anchor="middle">heap</text>
  <rect x="78" y="250" width="164" height="40" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" rx="4" opacity="0.13"/>
  <text x="160" y="274.0" fill="#4a90d9" font-size="11" text-anchor="middle">data</text>
  <rect x="78" y="290" width="164" height="68" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" rx="4" opacity="0.13"/>
  <text x="160" y="328.0" fill="#4a90d9" font-size="11" text-anchor="middle">text (code)</text>
  <text x="252" y="84" fill="#e0645c" font-size="10">grows down</text>
  <text x="252" y="232" fill="#4a90d9" font-size="10">grows up</text>
  <text x="252" y="332" fill="#4a90d9" font-size="10">read + execute, never written</text>
  <text x="160" y="372" fill="#8a8a8a" font-size="10" text-anchor="middle">high addresses at the top</text>
  <rect x="400" y="58" width="335" height="120" fill="none" stroke="#e0645c" stroke-width="1.4" rx="6"/>
  <text x="412" y="78" fill="#e0645c" font-size="11">the kernel's row for it (the PCB)</text>
  <text x="418" y="98" fill="#8a8a8a" font-size="10.5">- pid, parent, state</text>
  <text x="418" y="117" fill="#8a8a8a" font-size="10.5">- saved registers and PC</text>
  <text x="418" y="136" fill="#8a8a8a" font-size="10.5">- page-table root pointer</text>
  <text x="418" y="155" fill="#8a8a8a" font-size="10.5">- open-file table, credentials</text>
  <text x="400" y="206" fill="#4a90d9" font-size="11">fork() duplicates the whole thing:</text>
  <rect x="430" y="222" width="90" height="32" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" rx="4" opacity="0.14"/>
  <text x="475" y="242" fill="#4a90d9" font-size="11" text-anchor="middle">parent</text>
  <line x1="475" y1="254" x2="425.0" y2="286.7" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="420,290 423.2,284.0 426.8,289.5" fill="#4a90d9"/>
  <line x1="475" y1="254" x2="529.9" y2="286.9" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="535,290 528.2,289.7 531.6,284.1" fill="#4a90d9"/>
  <rect x="370" y="290" width="100" height="32" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" rx="4" opacity="0.14"/>
  <text x="420" y="310" fill="#4a90d9" font-size="10.5" text-anchor="middle">returns pid</text>
  <rect x="490" y="290" width="100" height="32" fill="#e0645c" stroke="#e0645c" stroke-width="1.5" rx="4" opacity="0.14"/>
  <text x="540" y="310" fill="#e0645c" font-size="10.5" text-anchor="middle">returns 0</text>
  <text x="400" y="344" fill="#8a8a8a" font-size="10.5">Same code, same data values, different address spaces - and one</text>
  <text x="400" y="360" fill="#8a8a8a" font-size="10.5">differing return value, which is the only way the child knows.</text>
  <text x="400" y="384" fill="#e0645c" font-size="10.5">exec() then replaces the address space but keeps the row.</text>
</svg>
