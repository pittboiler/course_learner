<svg viewBox="0 0 790 410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">Three synchronisation objects, three different jobs. Confusing them is the classic bug.</text>
  <rect x="250" y="66" width="290" height="60" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" rx="5" opacity="0.08"/>
  <rect x="258" y="76" width="42" height="40" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.18"/>
  <rect x="305" y="76" width="42" height="40" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.18"/>
  <rect x="352" y="76" width="42" height="40" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="3" opacity="0.18"/>
  <rect x="399" y="76" width="42" height="40" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.3" rx="3" opacity="0.06"/>
  <rect x="446" y="76" width="42" height="40" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.3" rx="3" opacity="0.06"/>
  <rect x="493" y="76" width="42" height="40" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.3" rx="3" opacity="0.06"/>
  <text x="395" y="140" fill="#8a8a8a" font-size="10.5" text-anchor="middle">bounded buffer, 6 slots, 3 full</text>
  <rect x="60" y="76" width="150" height="44" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" rx="5" opacity="0.14"/>
  <text x="135" y="103" fill="#4a90d9" font-size="12" text-anchor="middle">producer</text>
  <rect x="580" y="76" width="150" height="44" fill="#e0645c" stroke="#e0645c" stroke-width="1.5" rx="5" opacity="0.14"/>
  <text x="655" y="103" fill="#e0645c" font-size="12" text-anchor="middle">consumer</text>
  <line x1="212" y1="98" x2="242.0" y2="98.0" stroke="#4a90d9" stroke-width="1.6"/>
  <polygon points="248,98 242.0,101.3 242.0,94.7" fill="#4a90d9"/>
  <line x1="542" y1="98" x2="572.0" y2="98.0" stroke="#e0645c" stroke-width="1.6"/>
  <polygon points="578,98 572.0,101.3 572.0,94.7" fill="#e0645c"/>
  <text x="60" y="182" fill="#e0645c" font-size="11">object</text>
  <text x="160" y="182" fill="#e0645c" font-size="11">what it is</text>
  <text x="380" y="182" fill="#e0645c" font-size="11">what it counts</text>
  <text x="560" y="182" fill="#e0645c" font-size="11">who waits on it</text>
  <line x1="55" y1="190" x2="735" y2="190" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="212" fill="#4a90d9" font-size="11">empty</text>
  <text x="160" y="212" fill="#8a8a8a" font-size="10.5">counting semaphore, starts at 6</text>
  <text x="380" y="212" fill="#8a8a8a" font-size="10.5">how many free slots remain</text>
  <text x="560" y="212" fill="#8a8a8a" font-size="10.5">producer waits, consumer signals</text>
  <text x="60" y="242" fill="#4a90d9" font-size="11">full</text>
  <text x="160" y="242" fill="#8a8a8a" font-size="10.5">counting semaphore, starts at 0</text>
  <text x="380" y="242" fill="#8a8a8a" font-size="10.5">how many items are available</text>
  <text x="560" y="242" fill="#8a8a8a" font-size="10.5">consumer waits, producer signals</text>
  <text x="60" y="272" fill="#4a90d9" font-size="11">mutex</text>
  <text x="160" y="272" fill="#8a8a8a" font-size="10.5">binary semaphore, starts at 1</text>
  <text x="380" y="272" fill="#8a8a8a" font-size="10.5">who may touch the buffer's indices</text>
  <text x="560" y="272" fill="#8a8a8a" font-size="10.5">both wait and signal it</text>
  <line x1="55" y1="306" x2="735" y2="306" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="330" fill="#8a8a8a" font-size="11">Order matters and is not symmetric: wait(empty) then wait(mutex), never the reverse. Taking the mutex first and</text>
  <text x="60" y="348" fill="#e0645c" font-size="11">then blocking on a full buffer holds the lock while asleep - and the only thread that could free a slot needs that lock.</text>
  <text x="60" y="376" fill="#4a90d9" font-size="11">Rule of thumb: acquire the resource count first, the mutual exclusion last, and release in the opposite order.</text>
</svg>
