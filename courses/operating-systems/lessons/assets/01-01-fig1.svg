<svg viewBox="0 0 790 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">One bit in one register decides whether an instruction is allowed. Everything else follows from that.</text>
  <rect x="55" y="52" width="680" height="86" fill="none" stroke="#8a8a8a" stroke-width="1.4" rx="6"/>
  <text x="65" y="70" fill="#8a8a8a" font-size="11.5">USER MODE  -  mode bit = 1  -  unprivileged</text>
  <rect x="150" y="84" width="150" height="42" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.6" rx="5" opacity="0.14"/>
  <text x="225" y="110" fill="#4a90d9" font-size="12" text-anchor="middle">shell</text>
  <rect x="340" y="84" width="150" height="42" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.6" rx="5" opacity="0.14"/>
  <text x="415" y="110" fill="#4a90d9" font-size="12" text-anchor="middle">your program</text>
  <rect x="545" y="84" width="150" height="42" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.6" rx="5" opacity="0.14"/>
  <text x="620" y="110" fill="#4a90d9" font-size="12" text-anchor="middle">browser</text>
  <line x1="55" y1="168" x2="735" y2="168" stroke="#e0645c" stroke-width="2.4"/>
  <text x="735" y="160" fill="#e0645c" font-size="11.5" text-anchor="end">the privilege boundary</text>
  <rect x="55" y="198" width="680" height="150" fill="none" stroke="#e0645c" stroke-width="1.4" rx="6"/>
  <text x="65" y="216" fill="#e0645c" font-size="11.5">KERNEL MODE  -  mode bit = 0  -  every instruction legal</text>
  <rect x="80" y="230" width="155" height="38" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" rx="5" opacity="0.12"/>
  <text x="157" y="254" fill="#8a8a8a" font-size="11" text-anchor="middle">page tables</text>
  <rect x="245" y="230" width="155" height="38" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" rx="5" opacity="0.12"/>
  <text x="322" y="254" fill="#8a8a8a" font-size="11" text-anchor="middle">device registers</text>
  <rect x="420" y="230" width="155" height="38" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" rx="5" opacity="0.12"/>
  <text x="497" y="254" fill="#8a8a8a" font-size="11" text-anchor="middle">interrupt vector</text>
  <rect x="600" y="230" width="155" height="38" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" rx="5" opacity="0.12"/>
  <text x="677" y="254" fill="#8a8a8a" font-size="11" text-anchor="middle">HALT / mode bit</text>
  <line x1="415" y1="126" x2="415.0" y2="160.0" stroke="#4a90d9" stroke-width="1.8"/>
  <polygon points="415,166 411.7,160.0 418.3,160.0" fill="#4a90d9"/>
  <line x1="415" y1="170" x2="415.0" y2="222.0" stroke="#4a90d9" stroke-width="1.8"/>
  <polygon points="415,228 411.7,222.0 418.3,222.0" fill="#4a90d9"/>
  <text x="425" y="152" fill="#4a90d9" font-size="10.5">trap: the only door, and it lands at</text>
  <text x="425" y="190" fill="#4a90d9" font-size="10.5">an address the kernel chose in advance</text>
  <line x1="660" y1="126" x2="660.0" y2="157.0" stroke="#e0645c" stroke-width="1.8"/>
  <polygon points="660,163 656.7,157.0 663.3,157.0" fill="#e0645c"/>
  <line x1="650" y1="158" x2="670" y2="172" stroke="#e0645c" stroke-width="2.2"/>
  <line x1="670" y1="158" x2="650" y2="172" stroke="#e0645c" stroke-width="2.2"/>
  <text x="680" y="140" fill="#e0645c" font-size="10.5">privileged instruction</text>
  <text x="680" y="155" fill="#e0645c" font-size="10.5">attempted directly:</text>
  <text x="680" y="170" fill="#e0645c" font-size="10.5">illegal-instruction trap</text>
  <text x="65" y="290" fill="#8a8a8a" font-size="11">The hardware does exactly two things for you: it refuses privileged instructions when the mode bit says user,</text>
  <text x="65" y="308" fill="#8a8a8a" font-size="11">and on a trap it flips the bit and jumps to a kernel-chosen address in one indivisible step.</text>
  <text x="65" y="332" fill="#e0645c" font-size="11">Both halves are needed. Flipping the bit without controlling the destination would let any program become the kernel.</text>
</svg>
