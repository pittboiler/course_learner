<svg viewBox="0 0 790 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">Five philosophers, five forks, and one rule that turns a symmetric system into a stuck one.</text>
  <circle cx="250.0" cy="105.0" r="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="250.0" y="110.0" fill="#4a90d9" font-size="12" text-anchor="middle">P1</text>
  <circle cx="364.12678195541844" cy="187.91796067500633" r="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="364.12678195541844" y="192.91796067500633" fill="#4a90d9" font-size="12" text-anchor="middle">P2</text>
  <circle cx="320.5342302750968" cy="322.08203932499373" r="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="320.5342302750968" y="327.08203932499373" fill="#4a90d9" font-size="12" text-anchor="middle">P3</text>
  <circle cx="179.46576972490323" cy="322.08203932499373" r="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="179.46576972490323" y="327.08203932499373" fill="#4a90d9" font-size="12" text-anchor="middle">P4</text>
  <circle cx="135.87321804458156" cy="187.91796067500633" r="26" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="135.87321804458156" y="192.91796067500633" fill="#4a90d9" font-size="12" text-anchor="middle">P5</text>
  <circle cx="286.4426856421333" cy="174.84094634875325" r="9" fill="#e0645c" stroke="#e0645c" stroke-width="1.5"/>
  <text x="286.4426856421333" y="178.84094634875325" fill="#e0645c" font-size="9.5" text-anchor="middle">f</text>
  <circle cx="308.9655040102995" cy="244.15905365124675" r="9" fill="#e0645c" stroke="#e0645c" stroke-width="1.5"/>
  <text x="308.9655040102995" y="248.15905365124675" fill="#e0645c" font-size="9.5" text-anchor="middle">f</text>
  <circle cx="250.0" cy="287.0" r="9" fill="#e0645c" stroke="#e0645c" stroke-width="1.5"/>
  <text x="250.0" y="291.0" fill="#e0645c" font-size="9.5" text-anchor="middle">f</text>
  <circle cx="191.03449598970047" cy="244.15905365124675" r="9" fill="#e0645c" stroke="#e0645c" stroke-width="1.5"/>
  <text x="191.03449598970047" y="248.15905365124675" fill="#e0645c" font-size="9.5" text-anchor="middle">f</text>
  <circle cx="213.55731435786666" cy="174.84094634875328" r="9" fill="#e0645c" stroke="#e0645c" stroke-width="1.5"/>
  <text x="213.55731435786666" y="178.84094634875328" fill="#e0645c" font-size="9.5" text-anchor="middle">f</text>
  <line x1="250.0" y1="133.0" x2="288.4" y2="163.6" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="292.32053816505805,166.7507764050038 286.7,165.8 290.1,161.5" fill="#e0645c"/>
  <line x1="337.49719949915414" y1="196.57043651750485" x2="320.2" y2="242.6" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="318.47606917325106,247.2492235949962 317.7,241.6 322.8,243.5" fill="#e0645c"/>
  <line x1="304.07624321090753" y1="299.42956348249515" x2="255.0" y2="297.2" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="250.0,297.0 255.1,294.5 254.9,300.0" fill="#e0645c"/>
  <line x1="195.92375678909247" y1="299.42956348249515" x2="182.9" y2="252.1" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="181.52393082674894,247.2492235949962 185.5,251.3 180.2,252.8" fill="#e0645c"/>
  <line x1="162.50280050084586" y1="196.57043651750485" x2="203.5" y2="169.5" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="207.67946183494192,166.7507764050038 205.0,171.8 202.0,167.2" fill="#e0645c"/>
  <text x="250" y="375" fill="#e0645c" font-size="10.5" text-anchor="middle">every philosopher holds the fork on their left</text>
  <text x="250" y="393" fill="#e0645c" font-size="10.5" text-anchor="middle">and waits for the one on their right</text>
  <rect x="430" y="66" width="305" height="290" fill="none" stroke="#8a8a8a" stroke-width="1.4" rx="6"/>
  <text x="444" y="90" fill="#8a8a8a" font-size="11.5">why this is stuck, in four conditions</text>
  <text x="452" y="118" fill="#e0645c" font-size="11">1. mutual exclusion</text>
  <text x="462" y="136" fill="#8a8a8a" font-size="10.5">a fork is held by one philosopher</text>
  <text x="452" y="164" fill="#e0645c" font-size="11">2. hold and wait</text>
  <text x="462" y="182" fill="#8a8a8a" font-size="10.5">each holds one and waits for another</text>
  <text x="452" y="210" fill="#e0645c" font-size="11">3. no preemption</text>
  <text x="462" y="228" fill="#8a8a8a" font-size="10.5">nobody's fork can be taken away</text>
  <text x="452" y="256" fill="#e0645c" font-size="11">4. circular wait</text>
  <text x="462" y="274" fill="#8a8a8a" font-size="10.5">P1 waits on P2 waits on ... waits on P1</text>
  <rect x="444" y="308" width="278" height="36" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" rx="4" opacity="0.13"/>
  <text x="583" y="331" fill="#4a90d9" font-size="11" text-anchor="middle">break any ONE and deadlock is impossible</text>
</svg>
