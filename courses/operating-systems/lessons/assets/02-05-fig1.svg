<svg viewBox="0 0 790 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">A cycle is necessary for deadlock. With several units of a resource it is not sufficient.</text>
  <text x="180" y="58" fill="#e0645c" font-size="11.5" text-anchor="middle">single unit each: DEADLOCKED</text>
  <circle cx="100" cy="120" r="24" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="100" y="125" fill="#4a90d9" font-size="12" text-anchor="middle">P1</text>
  <rect x="230" y="96" width="60" height="48" fill="none" stroke="#e0645c" stroke-width="1.6" rx="5"/>
  <text x="260" y="112" fill="#e0645c" font-size="11" text-anchor="middle">R1</text>
  <circle cx="248" cy="131" r="4.5" fill="#e0645c" stroke="#e0645c" stroke-width="1.2"/>
  <circle cx="260" cy="260" r="24" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="260" y="265" fill="#4a90d9" font-size="12" text-anchor="middle">P2</text>
  <rect x="70" y="236" width="60" height="48" fill="none" stroke="#e0645c" stroke-width="1.6" rx="5"/>
  <text x="100" y="252" fill="#e0645c" font-size="11" text-anchor="middle">R2</text>
  <circle cx="88" cy="271" r="4.5" fill="#e0645c" stroke="#e0645c" stroke-width="1.2"/>
  <line x1="124" y1="120" x2="220.0" y2="120.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="226,120 220.0,123.3 220.0,116.7" fill="#8a8a8a"/>
  <line x1="260" y1="146" x2="260.0" y2="226.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="260,232 256.7,226.0 263.3,226.0" fill="#8a8a8a"/>
  <line x1="236" y1="260" x2="132.0" y2="260.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="126,260 132.0,256.7 132.0,263.3" fill="#8a8a8a"/>
  <line x1="100" y1="234" x2="100.0" y2="152.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="100,146 103.3,152.0 96.7,152.0" fill="#8a8a8a"/>
  <text x="140" y="110" fill="#8a8a8a" font-size="10">requests</text>
  <text x="270" y="196" fill="#8a8a8a" font-size="10">held by</text>
  <text x="150" y="250" fill="#8a8a8a" font-size="10">requests</text>
  <text x="56" y="196" fill="#8a8a8a" font-size="10">held by</text>
  <text x="180" y="318" fill="#e0645c" font-size="10.5" text-anchor="middle">P1 waits for P2, P2 waits for P1.</text>
  <text x="180" y="336" fill="#e0645c" font-size="10.5" text-anchor="middle">Neither can ever proceed.</text>
  <line x1="400" y1="60" x2="400" y2="360" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="600" y="58" fill="#4a90d9" font-size="11" text-anchor="middle">two units of R1: SAME CYCLE, NOT DEADLOCKED</text>
  <circle cx="500" cy="120" r="24" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="500" y="125" fill="#4a90d9" font-size="12" text-anchor="middle">P1</text>
  <rect x="630" y="96" width="60" height="48" fill="none" stroke="#e0645c" stroke-width="1.6" rx="5"/>
  <text x="660" y="112" fill="#e0645c" font-size="11" text-anchor="middle">R1</text>
  <circle cx="648" cy="131" r="4.5" fill="#e0645c" stroke="#e0645c" stroke-width="1.2"/>
  <circle cx="666" cy="131" r="4.5" fill="#e0645c" stroke="#e0645c" stroke-width="1.2"/>
  <circle cx="660" cy="260" r="24" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="660" y="265" fill="#4a90d9" font-size="12" text-anchor="middle">P2</text>
  <rect x="470" y="236" width="60" height="48" fill="none" stroke="#e0645c" stroke-width="1.6" rx="5"/>
  <text x="500" y="252" fill="#e0645c" font-size="11" text-anchor="middle">R2</text>
  <circle cx="488" cy="271" r="4.5" fill="#e0645c" stroke="#e0645c" stroke-width="1.2"/>
  <line x1="524" y1="120" x2="620.0" y2="120.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="626,120 620.0,123.3 620.0,116.7" fill="#8a8a8a"/>
  <line x1="660" y1="146" x2="660.0" y2="226.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="660,232 656.7,226.0 663.3,226.0" fill="#8a8a8a"/>
  <line x1="636" y1="260" x2="532.0" y2="260.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="526,260 532.0,256.7 532.0,263.3" fill="#8a8a8a"/>
  <line x1="500" y1="234" x2="500.0" y2="152.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="500,146 503.3,152.0 496.7,152.0" fill="#8a8a8a"/>
  <circle cx="760" cy="200" r="24" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="760" y="205" fill="#8a8a8a" font-size="12" text-anchor="middle">P3</text>
  <line x1="690" y1="132" x2="737.9" y2="183.6" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="742,188 735.5,185.8 740.3,181.4" fill="#8a8a8a"/>
  <text x="600" y="318" fill="#4a90d9" font-size="10.5" text-anchor="middle">R1's second unit is held by P3, which needs nothing else.</text>
  <text x="600" y="336" fill="#4a90d9" font-size="10.5" text-anchor="middle">P3 finishes, frees a unit, and the cycle unwinds.</text>
  <line x1="55" y1="372" x2="735" y2="372" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="396" fill="#8a8a8a" font-size="11">So a cycle in the graph is a WARNING, not a verdict - which is exactly why detection needs the Banker's-style test.</text>
</svg>
