<svg viewBox="0 0 790 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">The page table is data the kernel writes. Every bit in an entry is a policy decision.</text>
  <text x="60" y="60" fill="#e0645c" font-size="11.5">one page-table entry</text>
  <rect x="60" y="74" width="300" height="32" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" rx="3" opacity="0.15"/>
  <text x="210.0" y="95" fill="#4a90d9" font-size="10.5" text-anchor="middle">physical frame number</text>
  <rect x="360" y="74" width="34" height="32" fill="#e0645c" stroke="#e0645c" stroke-width="1.5" rx="3" opacity="0.15"/>
  <text x="377.0" y="95" fill="#e0645c" font-size="11" text-anchor="middle">D</text>
  <rect x="394" y="74" width="34" height="32" fill="#e0645c" stroke="#e0645c" stroke-width="1.5" rx="3" opacity="0.15"/>
  <text x="411.0" y="95" fill="#e0645c" font-size="11" text-anchor="middle">A</text>
  <rect x="428" y="74" width="34" height="32" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.5" rx="3" opacity="0.15"/>
  <text x="445.0" y="95" fill="#8a8a8a" font-size="11" text-anchor="middle">U</text>
  <rect x="462" y="74" width="34" height="32" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.5" rx="3" opacity="0.15"/>
  <text x="479.0" y="95" fill="#8a8a8a" font-size="11" text-anchor="middle">W</text>
  <rect x="496" y="74" width="34" height="32" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.5" rx="3" opacity="0.15"/>
  <text x="513.0" y="95" fill="#8a8a8a" font-size="11" text-anchor="middle">P</text>
  <text x="66" y="128" fill="#e0645c" font-size="11">P</text>
  <text x="86" y="128" fill="#8a8a8a" font-size="10.5">present: is the page in memory at all?  0 means the next access traps</text>
  <text x="66" y="148" fill="#e0645c" font-size="11">W</text>
  <text x="86" y="148" fill="#8a8a8a" font-size="10.5">writable: 0 makes a store trap - this is how copy-on-write works</text>
  <text x="66" y="168" fill="#e0645c" font-size="11">U</text>
  <text x="86" y="168" fill="#8a8a8a" font-size="10.5">user: 0 means kernel-only, which is what protects the upper half</text>
  <text x="66" y="188" fill="#e0645c" font-size="11">A</text>
  <text x="86" y="188" fill="#8a8a8a" font-size="10.5">accessed: set by hardware on any touch, cleared by the OS - the input to Clock</text>
  <text x="66" y="208" fill="#e0645c" font-size="11">D</text>
  <text x="86" y="208" fill="#8a8a8a" font-size="10.5">dirty: set by hardware on a write, so a clean page can be evicted with no disk write</text>
  <line x1="55" y1="242" x2="735" y2="242" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="266" fill="#e0645c" font-size="11.5">TWO PROCESSES, TWO TABLES, ONE SET OF FRAMES</text>
  <rect x="70" y="284" width="210" height="48" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" rx="4" opacity="0.1"/>
  <text x="175" y="304" fill="#4a90d9" font-size="10.5" text-anchor="middle">process A page table</text>
  <text x="175" y="322" fill="#8a8a8a" font-size="10">VPN 5 -&gt; frame 12   VPN 9 -&gt; frame 40</text>
  <rect x="70" y="350" width="210" height="48" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" rx="4" opacity="0.1"/>
  <text x="175" y="370" fill="#4a90d9" font-size="10.5" text-anchor="middle">process B page table</text>
  <text x="175" y="388" fill="#8a8a8a" font-size="10">VPN 5 -&gt; frame 12   VPN 9 -&gt; frame 40</text>
  <rect x="470" y="284" width="240" height="114" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.4" rx="5" opacity="0.07"/>
  <text x="590" y="304" fill="#8a8a8a" font-size="10.5" text-anchor="middle">physical memory</text>
  <rect x="486" y="314" width="90" height="34" fill="#e0645c" stroke="#e0645c" stroke-width="1.4" rx="4" opacity="0.18"/>
  <text x="531" y="336" fill="#e0645c" font-size="10.5" text-anchor="middle">frame 12</text>
  <rect x="600" y="314" width="90" height="34" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.4" rx="4" opacity="0.18"/>
  <text x="645" y="336" fill="#4a90d9" font-size="10.5" text-anchor="middle">frame 40</text>
  <text x="590" y="368" fill="#e0645c" font-size="10">frame 12 is shared read-only: one copy</text>
  <text x="590" y="386" fill="#e0645c" font-size="10" text-anchor="middle">of libc for every process on the machine</text>
  <line x1="284" y1="308" x2="460.0" y2="325.4" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="466,326 459.7,328.7 460.4,322.1" fill="#8a8a8a"/>
  <line x1="284" y1="374" x2="460.1" y2="341.1" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="466,340 460.7,344.3 459.5,337.9" fill="#8a8a8a"/>
  <text x="300" y="414" fill="#8a8a8a" font-size="11" text-anchor="middle">Same virtual page number, different processes, whatever frames the kernel chose. The mapping is the isolation.</text>
</svg>
