<svg viewBox="0 0 790 410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">A name is not a file. A name is an entry in a directory that points at one.</text>
  <rect x="50" y="60" width="210" height="150" fill="none" stroke="#4a90d9" stroke-width="1.5" rx="6"/>
  <text x="155" y="80" fill="#4a90d9" font-size="11" text-anchor="middle">directory /home/j</text>
  <rect x="60" y="94" width="190" height="28" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.2" rx="3" opacity="0.07"/>
  <text x="68" y="113" fill="#8a8a8a" font-size="10.5">report.txt</text>
  <text x="242" y="113" fill="#e0645c" font-size="10" text-anchor="end">inode 40</text>
  <rect x="60" y="130" width="190" height="28" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.2" rx="3" opacity="0.07"/>
  <text x="68" y="149" fill="#8a8a8a" font-size="10.5">draft.txt</text>
  <text x="242" y="149" fill="#e0645c" font-size="10" text-anchor="end">inode 40</text>
  <rect x="60" y="166" width="190" height="28" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.2" rx="3" opacity="0.07"/>
  <text x="68" y="185" fill="#8a8a8a" font-size="10.5">notes.md</text>
  <text x="242" y="185" fill="#e0645c" font-size="10" text-anchor="end">inode 71</text>
  <text x="155" y="222" fill="#e0645c" font-size="10.5" text-anchor="middle">two names, one inode: a HARD LINK</text>
  <rect x="320" y="60" width="180" height="150" fill="none" stroke="#e0645c" stroke-width="1.5" rx="6"/>
  <text x="410" y="80" fill="#e0645c" font-size="11" text-anchor="middle">inode 40</text>
  <text x="332" y="98" fill="#8a8a8a" font-size="10">type: regular file</text>
  <text x="332" y="114" fill="#8a8a8a" font-size="10">size: 9,420 bytes</text>
  <text x="332" y="130" fill="#8a8a8a" font-size="10">owner, mode, times</text>
  <text x="332" y="146" fill="#8a8a8a" font-size="10">link count: 2</text>
  <text x="332" y="162" fill="#8a8a8a" font-size="10">12 direct pointers</text>
  <text x="332" y="178" fill="#8a8a8a" font-size="10">1 single indirect</text>
  <text x="332" y="194" fill="#8a8a8a" font-size="10">1 double indirect</text>
  <line x1="252" y1="110" x2="310.1" y2="119.1" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="316,120 309.6,122.3 310.6,115.8" fill="#8a8a8a"/>
  <line x1="252" y1="146" x2="310.1" y2="133.3" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="316,132 310.8,136.5 309.4,130.1" fill="#8a8a8a"/>
  <rect x="560" y="60" width="180" height="150" fill="none" stroke="#8a8a8a" stroke-width="1.5" rx="6"/>
  <text x="650" y="80" fill="#8a8a8a" font-size="11" text-anchor="middle">data blocks</text>
  <rect x="576" y="94" width="72" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.14"/>
  <text x="612" y="113" fill="#4a90d9" font-size="10" text-anchor="middle">block</text>
  <rect x="656" y="94" width="72" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.14"/>
  <text x="692" y="113" fill="#4a90d9" font-size="10" text-anchor="middle">block</text>
  <rect x="576" y="130" width="72" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.14"/>
  <text x="612" y="149" fill="#4a90d9" font-size="10" text-anchor="middle">block</text>
  <rect x="656" y="130" width="72" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.14"/>
  <text x="692" y="149" fill="#4a90d9" font-size="10" text-anchor="middle">block</text>
  <rect x="576" y="166" width="72" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.14"/>
  <text x="612" y="185" fill="#4a90d9" font-size="10" text-anchor="middle">block</text>
  <rect x="656" y="166" width="72" height="28" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.2" rx="3" opacity="0.14"/>
  <text x="692" y="185" fill="#4a90d9" font-size="10" text-anchor="middle">block</text>
  <line x1="504" y1="140" x2="550.0" y2="140.0" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="556,140 550.0,143.3 550.0,136.7" fill="#e0645c"/>
  <line x1="50" y1="240" x2="740" y2="240" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="264" fill="#8a8a8a" font-size="11">HARD LINK: a second directory entry pointing at inode 40. Link count 2. Deleting either name decrements</text>
  <text x="60" y="282" fill="#8a8a8a" font-size="11">the count; the data is freed only when it reaches 0. Both names are equally the file - neither is the original.</text>
  <text x="60" y="310" fill="#e0645c" font-size="11">SOFT LINK: a tiny file whose CONTENTS are a path string. Link count of the target is unchanged, so</text>
  <text x="60" y="328" fill="#e0645c" font-size="11">deleting the target leaves the link pointing at nothing - a dangling link, which a hard link can never be.</text>
  <text x="60" y="358" fill="#4a90d9" font-size="11">Consequences worth remembering: a hard link cannot cross file systems, because inode numbers are only</text>
  <text x="60" y="376" fill="#4a90d9" font-size="11">meaningful within one; and a hard link to a directory would let you build a cycle, so it is forbidden.</text>
</svg>
