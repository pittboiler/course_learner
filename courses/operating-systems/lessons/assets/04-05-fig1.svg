<svg viewBox="0 0 790 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">Both isolate. One virtualises the hardware, the other partitions one kernel's namespaces.</text>
  <text x="200" y="64" fill="#e0645c" font-size="11.5" text-anchor="middle">virtual machines</text>
  <rect x="50" y="76" width="300" height="30" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" rx="4" opacity="0.14"/>
  <text x="200" y="95.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">app A   |   app B</text>
  <rect x="50" y="110" width="300" height="30" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" rx="4" opacity="0.14"/>
  <text x="200" y="129.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">guest libs A | guest libs B</text>
  <rect x="50" y="144" width="300" height="34" fill="#e0645c" stroke="#e0645c" stroke-width="1.5" rx="4" opacity="0.14"/>
  <text x="200" y="165.0" fill="#e0645c" font-size="10.5" text-anchor="middle">GUEST KERNEL A | GUEST KERNEL B</text>
  <rect x="50" y="182" width="300" height="34" fill="#e0645c" stroke="#e0645c" stroke-width="1.5" rx="4" opacity="0.14"/>
  <text x="200" y="203.0" fill="#e0645c" font-size="10.5" text-anchor="middle">hypervisor</text>
  <rect x="50" y="220" width="300" height="30" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="0.14"/>
  <text x="200" y="239.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">host kernel</text>
  <rect x="50" y="254" width="300" height="28" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="0.14"/>
  <text x="200" y="272.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">hardware</text>
  <text x="590" y="64" fill="#4a90d9" font-size="11.5" text-anchor="middle">containers</text>
  <rect x="440" y="76" width="300" height="30" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" rx="4" opacity="0.14"/>
  <text x="590" y="95.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">app A   |   app B</text>
  <rect x="440" y="110" width="300" height="30" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5" rx="4" opacity="0.14"/>
  <text x="590" y="129.0" fill="#4a90d9" font-size="10.5" text-anchor="middle">container libs A | container libs B</text>
  <rect x="440" y="144" width="300" height="34" fill="#e0645c" stroke="#e0645c" stroke-width="1.5" rx="4" opacity="0.14"/>
  <text x="590" y="165.0" fill="#e0645c" font-size="10.5" text-anchor="middle">namespaces + cgroups</text>
  <rect x="440" y="182" width="300" height="34" fill="#e0645c" stroke="#e0645c" stroke-width="1.5" rx="4" opacity="0.14"/>
  <text x="590" y="203.0" fill="#e0645c" font-size="10.5" text-anchor="middle">ONE SHARED HOST KERNEL</text>
  <rect x="440" y="220" width="300" height="28" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.5" rx="4" opacity="0.14"/>
  <text x="590" y="238.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">hardware</text>
  <line x1="50" y1="278" x2="740" y2="278" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="302" fill="#e0645c" font-size="11">boundary enforced by</text>
  <text x="240" y="302" fill="#8a8a8a" font-size="11">hardware: the guest's privileged instructions trap to the hypervisor</text>
  <text x="240" y="320" fill="#8a8a8a" font-size="11">software: the same kernel, showing each container a different view</text>
  <text x="60" y="348" fill="#e0645c" font-size="11">cost of a boundary crossing</text>
  <text x="280" y="348" fill="#8a8a8a" font-size="11">a VM exit, hundreds to thousands of cycles</text>
  <text x="280" y="366" fill="#8a8a8a" font-size="11">a container's syscall is an ORDINARY syscall - zero extra cost</text>
  <text x="60" y="394" fill="#e0645c" font-size="11">So a container's isolation is exactly as strong as the kernel's syscall interface, which is a much larger</text>
  <text x="60" y="412" fill="#e0645c" font-size="11">attack surface than a hypervisor's - the real trade, and it is security, not performance.</text>
</svg>
