<svg viewBox="0 0 790 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-size="11.5" font-style="italic">Threads share the expensive thing (the address space) and duplicate the cheap thing (the stack).</text>
  <rect x="60" y="56" width="300" height="290" fill="none" stroke="#4a90d9" stroke-width="1.5" rx="6"/>
  <text x="210" y="48" fill="#4a90d9" font-size="11" text-anchor="middle">two PROCESSES</text>
  <rect x="76" y="70" width="130" height="260" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.3" rx="5" opacity="0.07"/>
  <rect x="86" y="80" width="110" height="34" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="4" opacity="0.14"/>
  <text x="141" y="102" fill="#4a90d9" font-size="10.5" text-anchor="middle">code</text>
  <rect x="86" y="120" width="110" height="34" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="4" opacity="0.14"/>
  <text x="141" y="142" fill="#4a90d9" font-size="10.5" text-anchor="middle">heap</text>
  <rect x="86" y="160" width="110" height="34" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="4" opacity="0.14"/>
  <text x="141" y="182" fill="#4a90d9" font-size="10.5" text-anchor="middle">globals</text>
  <rect x="86" y="200" width="110" height="34" fill="#e0645c" stroke="#e0645c" stroke-width="1.3" rx="4" opacity="0.14"/>
  <text x="141" y="222" fill="#e0645c" font-size="10.5" text-anchor="middle">stack</text>
  <rect x="86" y="240" width="110" height="34" fill="#e0645c" stroke="#e0645c" stroke-width="1.3" rx="4" opacity="0.14"/>
  <text x="141" y="262" fill="#e0645c" font-size="10.5" text-anchor="middle">registers</text>
  <text x="141" y="296" fill="#8a8a8a" font-size="10" text-anchor="middle">own page table</text>
  <text x="141" y="312" fill="#8a8a8a" font-size="10" text-anchor="middle">own everything</text>
  <rect x="214" y="70" width="130" height="260" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.3" rx="5" opacity="0.07"/>
  <rect x="224" y="80" width="110" height="34" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="4" opacity="0.14"/>
  <text x="279" y="102" fill="#4a90d9" font-size="10.5" text-anchor="middle">code</text>
  <rect x="224" y="120" width="110" height="34" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="4" opacity="0.14"/>
  <text x="279" y="142" fill="#4a90d9" font-size="10.5" text-anchor="middle">heap</text>
  <rect x="224" y="160" width="110" height="34" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="4" opacity="0.14"/>
  <text x="279" y="182" fill="#4a90d9" font-size="10.5" text-anchor="middle">globals</text>
  <rect x="224" y="200" width="110" height="34" fill="#e0645c" stroke="#e0645c" stroke-width="1.3" rx="4" opacity="0.14"/>
  <text x="279" y="222" fill="#e0645c" font-size="10.5" text-anchor="middle">stack</text>
  <rect x="224" y="240" width="110" height="34" fill="#e0645c" stroke="#e0645c" stroke-width="1.3" rx="4" opacity="0.14"/>
  <text x="279" y="262" fill="#e0645c" font-size="10.5" text-anchor="middle">registers</text>
  <text x="279" y="296" fill="#8a8a8a" font-size="10" text-anchor="middle">own page table</text>
  <text x="279" y="312" fill="#8a8a8a" font-size="10" text-anchor="middle">own everything</text>
  <rect x="400" y="56" width="335" height="290" fill="none" stroke="#e0645c" stroke-width="1.5" rx="6"/>
  <text x="567" y="48" fill="#e0645c" font-size="11" text-anchor="middle">one process, two THREADS</text>
  <rect x="414" y="70" width="306" height="130" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1.3" rx="5" opacity="0.07"/>
  <rect x="424" y="80" width="286" height="34" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="4" opacity="0.14"/>
  <text x="567" y="102" fill="#4a90d9" font-size="10.5" text-anchor="middle">code  -  SHARED</text>
  <rect x="424" y="120" width="286" height="34" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="4" opacity="0.14"/>
  <text x="567" y="142" fill="#4a90d9" font-size="10.5" text-anchor="middle">heap  -  SHARED</text>
  <rect x="424" y="160" width="286" height="34" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.3" rx="4" opacity="0.14"/>
  <text x="567" y="182" fill="#4a90d9" font-size="10.5" text-anchor="middle">globals  -  SHARED</text>
  <rect x="424" y="210" width="136" height="34" fill="#e0645c" stroke="#e0645c" stroke-width="1.3" rx="4" opacity="0.14"/>
  <text x="492" y="232" fill="#e0645c" font-size="10.5" text-anchor="middle">stack</text>
  <rect x="424" y="250" width="136" height="34" fill="#e0645c" stroke="#e0645c" stroke-width="1.3" rx="4" opacity="0.14"/>
  <text x="492" y="272" fill="#e0645c" font-size="10.5" text-anchor="middle">registers + PC</text>
  <text x="492" y="300" fill="#8a8a8a" font-size="10" text-anchor="middle">thread 1 owns</text>
  <rect x="574" y="210" width="136" height="34" fill="#e0645c" stroke="#e0645c" stroke-width="1.3" rx="4" opacity="0.14"/>
  <text x="642" y="232" fill="#e0645c" font-size="10.5" text-anchor="middle">stack</text>
  <rect x="574" y="250" width="136" height="34" fill="#e0645c" stroke="#e0645c" stroke-width="1.3" rx="4" opacity="0.14"/>
  <text x="642" y="272" fill="#e0645c" font-size="10.5" text-anchor="middle">registers + PC</text>
  <text x="642" y="300" fill="#8a8a8a" font-size="10" text-anchor="middle">thread 2 owns</text>
  <text x="414" y="326" fill="#8a8a8a" font-size="10.5">one page table for both: a switch between them changes no translation state</text>
  <line x1="55" y1="362" x2="735" y2="362" stroke="#8a8a8a" stroke-width="1"/>
  <text x="65" y="384" fill="#e0645c" font-size="11">Everything blue is shared, and everything shared is a place two threads can collide. That is Module 2's whole subject.</text>
</svg>
