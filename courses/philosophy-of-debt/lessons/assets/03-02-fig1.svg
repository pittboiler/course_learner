<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="800" height="490" fill="#ffffff"/>
<text x="400" y="28" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">The price of a 300-dollar, one-month loan, per 100 dollars lent (illustrative)</text>
<text x="400" y="48" font-size="12" fill="#333" text-anchor="middle">Same costs for both lenders; only B adds a markup. Dashed lines: two possible caps.</text>
<line x1="90" y1="420" x2="90" y2="82" stroke="#333" stroke-width="1.5"/>
<line x1="90" y1="420" x2="455" y2="420" stroke="#333" stroke-width="1.5"/>
<line x1="85" y1="420" x2="90" y2="420" stroke="#333" stroke-width="1.5"/>
<text x="81" y="424" font-size="12" fill="#111" text-anchor="end">0</text>
<line x1="85" y1="355" x2="90" y2="355" stroke="#333" stroke-width="1.5"/>
<text x="81" y="359" font-size="12" fill="#111" text-anchor="end">5</text>
<line x1="85" y1="290" x2="90" y2="290" stroke="#333" stroke-width="1.5"/>
<text x="81" y="294" font-size="12" fill="#111" text-anchor="end">10</text>
<line x1="85" y1="225" x2="90" y2="225" stroke="#333" stroke-width="1.5"/>
<text x="81" y="229" font-size="12" fill="#111" text-anchor="end">15</text>
<line x1="85" y1="160" x2="90" y2="160" stroke="#333" stroke-width="1.5"/>
<text x="81" y="164" font-size="12" fill="#111" text-anchor="end">20</text>
<line x1="85" y1="95" x2="90" y2="95" stroke="#333" stroke-width="1.5"/>
<text x="81" y="99" font-size="12" fill="#111" text-anchor="end">25</text>
<text x="34" y="257.5" font-size="12" fill="#111" text-anchor="middle" transform="rotate(-90 34 257.5)">dollars per 100 lent, per month</text>
<rect x="130" y="407" width="130" height="13" fill="#1a6fb5" stroke="#333" stroke-width="1"/>
<text x="195" y="417.5" font-size="11" fill="#ffffff" text-anchor="middle">cost of funds 1</text>
<rect x="130" y="342" width="130" height="65" fill="#2e8b57" stroke="#333" stroke-width="1"/>
<text x="195" y="364.2" font-size="12" fill="#ffffff" text-anchor="middle">expected loss 5</text>
<rect x="130" y="225" width="130" height="117" fill="#d9dee4" stroke="#333" stroke-width="1"/>
<text x="195" y="287.5" font-size="12" fill="#111" text-anchor="middle">servicing 9</text>
<rect x="300" y="407" width="130" height="13" fill="#1a6fb5" stroke="#333" stroke-width="1"/>
<text x="365" y="417.5" font-size="11" fill="#ffffff" text-anchor="middle">cost of funds 1</text>
<rect x="300" y="342" width="130" height="65" fill="#2e8b57" stroke="#333" stroke-width="1"/>
<text x="365" y="364.2" font-size="12" fill="#ffffff" text-anchor="middle">expected loss 5</text>
<rect x="300" y="225" width="130" height="117" fill="#d9dee4" stroke="#333" stroke-width="1"/>
<text x="365" y="287.5" font-size="12" fill="#111" text-anchor="middle">servicing 9</text>
<rect x="300" y="95" width="130" height="130" fill="#d1495b" stroke="#333" stroke-width="1"/>
<text x="365" y="164.0" font-size="12" fill="#ffffff" text-anchor="middle">markup 10</text>
<text x="195" y="201" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">A charges 15</text>
<text x="195" y="216" font-size="12" fill="#111" text-anchor="middle">APR 180%, EAR 435%</text>
<text x="365" y="71" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">B charges 25</text>
<text x="365" y="86" font-size="12" fill="#111" text-anchor="middle">APR 300%, EAR 1,355%</text>
<text x="195" y="440" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">Lender A</text>
<text x="195" y="456" font-size="11" fill="#333" text-anchor="middle">rivals in town</text>
<text x="365" y="440" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">Lender B</text>
<text x="365" y="456" font-size="11" fill="#333" text-anchor="middle">the only lender in town</text>
<line x1="90" y1="225" x2="462" y2="225" stroke="#111" stroke-width="2" stroke-dasharray="7 4"/>
<text x="470" y="222" font-size="12" font-weight="bold" fill="#111">Cap at 180% APR (15 a month) = the benchmark:</text>
<text x="470" y="238" font-size="12" fill="#111">B loses its markup and still lends; A unaffected</text>
<line x1="90" y1="381" x2="462" y2="381" stroke="#111" stroke-width="2" stroke-dasharray="7 4"/>
<text x="470" y="378" font-size="12" font-weight="bold" fill="#111">Cap at 36% APR (3 a month):</text>
<text x="470" y="394" font-size="12" fill="#111">below both lenders&#8217; costs, so neither lends</text>
<text x="470" y="160" font-size="12" fill="#d1495b" font-weight="bold">Markup: B&#8217;s price above its cost,</text>
<text x="470" y="176" font-size="12" fill="#333">the only part above the benchmark</text>
<text x="470" y="303" font-size="12" fill="#333">Cost stack (funds + risk + servicing):</text>
<text x="470" y="319" font-size="12" fill="#333">what a competitive market would charge</text>
<text x="400" y="478" font-size="11" fill="#333" text-anchor="middle">Illustrative numbers. APR = 12 &#215; monthly rate; EAR = the monthly rate compounded over 12 months.</text>
</svg>
