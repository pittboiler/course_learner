<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="372" fill="#ffffff"/>
  <text x="70" y="26" font-size="15" font-weight="bold" fill="#111">The village seed loan: where the rate falls (illustrative)</text>
  <text x="70" y="46" font-size="12" fill="#333">Annual interest rate on a loan of 1,000</text>

  <rect x="70" y="100" width="81" height="40" fill="#eeeeee" stroke="#999999"/>
  <rect x="151" y="100" width="459" height="40" fill="#e3eef8" stroke="#1a6fb5"/>
  <rect x="610" y="100" width="135" height="40" fill="#fbe3e7" stroke="#d1495b"/>
  <text x="110.5" y="117" font-size="11" fill="#333" text-anchor="middle">lender</text>
  <text x="110.5" y="131" font-size="11" fill="#333" text-anchor="middle">loses</text>
  <text x="265" y="125" font-size="12" fill="#1a6fb5" text-anchor="middle">both gain: 85 points</text>
  <text x="677.5" y="117" font-size="11" fill="#d1495b" text-anchor="middle">she is worse off</text>
  <text x="677.5" y="131" font-size="11" fill="#d1495b" text-anchor="middle">than with no loan</text>

  <line x1="70" y1="140" x2="745" y2="140" stroke="#111" stroke-width="1.5"/>
  <line x1="70" y1="140" x2="70" y2="146" stroke="#111"/>
  <line x1="178" y1="140" x2="178" y2="146" stroke="#111"/>
  <line x1="286" y1="140" x2="286" y2="146" stroke="#111"/>
  <line x1="394" y1="140" x2="394" y2="146" stroke="#111"/>
  <line x1="502" y1="140" x2="502" y2="146" stroke="#111"/>
  <line x1="610" y1="140" x2="610" y2="146" stroke="#111"/>
  <line x1="718" y1="140" x2="718" y2="146" stroke="#111"/>
  <text x="70" y="159" font-size="11" fill="#333" text-anchor="middle">0%</text>
  <text x="178" y="159" font-size="11" fill="#333" text-anchor="middle">20%</text>
  <text x="286" y="159" font-size="11" fill="#333" text-anchor="middle">40%</text>
  <text x="394" y="159" font-size="11" fill="#333" text-anchor="middle">60%</text>
  <text x="502" y="159" font-size="11" fill="#333" text-anchor="middle">80%</text>
  <text x="610" y="159" font-size="11" fill="#333" text-anchor="middle">100%</text>
  <text x="718" y="159" font-size="11" fill="#333" text-anchor="middle">120%</text>

  <line x1="151" y1="92" x2="151" y2="148" stroke="#2e8b57" stroke-width="3"/>
  <line x1="380.5" y1="80" x2="380.5" y2="148" stroke="#333" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="394" y1="80" x2="394" y2="148" stroke="#d1495b" stroke-width="3"/>
  <line x1="610" y1="92" x2="610" y2="148" stroke="#111" stroke-width="3"/>
  <text x="376" y="74" font-size="12" fill="#333" text-anchor="end">equal split of the gains: 57.5%</text>
  <text x="399" y="74" font-size="12" font-weight="bold" fill="#d1495b">charged: 60%</text>
  <text x="151" y="180" font-size="12" fill="#2e8b57">competitive rate = lender&#8217;s floor: 15%</text>
  <text x="151" y="195" font-size="11" fill="#2e8b57">(fair market value, Wertheimer&#8217;s benchmark)</text>
  <text x="610" y="180" font-size="12" fill="#111" text-anchor="middle">borrower&#8217;s ceiling: 100%</text>

  <text x="70" y="232" font-size="13" font-weight="bold" fill="#111">Dividing the 85 points at which both gain</text>

  <text x="70" y="262" font-size="12" fill="#111">charged, 60%</text>
  <rect x="250" y="244" width="225" height="26" fill="#333333"/>
  <rect x="475" y="244" width="200" height="26" fill="#1a6fb5"/>
  <text x="362.5" y="262" font-size="12" fill="#ffffff" text-anchor="middle">lender 45</text>
  <text x="575" y="262" font-size="12" fill="#ffffff" text-anchor="middle">borrower 40</text>

  <text x="70" y="298" font-size="12" fill="#111">equal split, 57.5%</text>
  <rect x="250" y="280" width="212.5" height="26" fill="#333333"/>
  <rect x="462.5" y="280" width="212.5" height="26" fill="#1a6fb5"/>
  <text x="356.25" y="298" font-size="12" fill="#ffffff" text-anchor="middle">lender 42.5</text>
  <text x="568.75" y="298" font-size="12" fill="#ffffff" text-anchor="middle">borrower 42.5</text>

  <text x="70" y="334" font-size="12" fill="#111">competitive, 15%</text>
  <rect x="250" y="316" width="425" height="26" fill="#1a6fb5"/>
  <text x="462.5" y="334" font-size="12" fill="#ffffff" text-anchor="middle">borrower 85 (the lender still covers his costs)</text>

  <text x="70" y="362" font-size="11" fill="#333">One point is 1% a year: 10 paid by her to him on the 1,000 if the loan is repaid.</text>
</svg>
