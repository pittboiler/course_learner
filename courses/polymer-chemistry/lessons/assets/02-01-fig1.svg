<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">A real distribution is right-skewed, so the mass-weighted average sits to the right of the count average.</text>

  <!-- axes -->
  <line x1="60" y1="258" x2="580" y2="258" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="580,258 570,253 570,263" fill="#8a8a8a"/>
  <text x="516" y="284" fill="#8a8a8a">M (molar mass)</text>
  <line x1="60" y1="258" x2="60" y2="58" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="60,58 55,68 65,68" fill="#8a8a8a"/>
  <text x="72" y="60" fill="#8a8a8a">number fraction n(M)</text>

  <!-- the skewed distribution curve -->
  <path d="M 70 258 L 95 248 L 120 222 L 145 176 L 170 120 L 195 86 L 210 76 L 230 82 L 260 104 L 295 134 L 335 164 L 380 189 L 430 211 L 485 228 L 540 240"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- mode (peak) tick -->
  <line x1="210" y1="258" x2="210" y2="252" stroke="#8a8a8a" stroke-width="1"/>

  <!-- M_n marker (count average, grey) -->
  <line x1="250" y1="258" x2="250" y2="93" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="232" y="278" fill="#8a8a8a">M<tspan baseline-shift="sub" font-size="10">n</tspan></text>

  <!-- M_w marker (mass average, coral) -->
  <line x1="340" y1="258" x2="340" y2="162" stroke="#e0645c" stroke-width="2"/>
  <text x="322" y="278" fill="#e0645c">M<tspan baseline-shift="sub" font-size="10">w</tspan></text>

  <!-- arrow showing M_w > M_n -->
  <line x1="258" y1="130" x2="332" y2="130" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="332,130 323,126 323,134" fill="#e0645c"/>
  <text x="262" y="122" fill="#e0645c">M<tspan baseline-shift="sub" font-size="10">w</tspan> &#8805; M<tspan baseline-shift="sub" font-size="10">n</tspan></text>
</svg>
