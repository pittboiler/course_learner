  <!-- phase-separating curve: chi = 1.5, double well -->
  <path d="M 71.6 101.1 L 80.4 96.3 L 90.8 90.9 L 101.2 85.9 L 111.6 81.4 L 122.0 77.4 L 132.4 73.8 L 142.8 70.7 L 153.2 68.1 L 163.6 65.9 L 174.0 64.1 L 184.4 62.8 L 194.8 62.0 L 205.2 61.5 L 215.6 61.5 L 226.0 61.9 L 236.4 62.7 L 246.8 63.9 L 257.2 65.4 L 267.6 67.3 L 278.0 69.6 L 288.4 72.2 L 298.8 75.2 L 309.2 78.4 L 319.6 82.0 L 330.0 85.8 L 340.4 89.8 L 350.8 94.2 L 361.2 98.7 L 371.6 103.4 L 382.0 108.2 L 392.4 113.2 L 402.8 118.3 L 413.2 123.4 L 423.6 128.5 L 434.0 133.6 L 444.4 138.7 L 454.8 143.5 L 465.2 148.1 L 475.6 152.5 L 486.0 156.4 L 496.4 159.8 L 506.8 162.5 L 517.2 164.4 L 527.6 165.2 L 538.0 164.5 L 548.4 162.1 L 558.8 157.1 L 569.2 148.5 L 579.6 133.9 L 588.4 110.4"
