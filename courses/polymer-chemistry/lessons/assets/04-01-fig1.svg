<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Free energy of mixing vs composition: raise &#967; and the single well (miscible) grows a hump (two phases).</text>

  <!-- y-axis -->
  <line x1="70" y1="45" x2="70" y2="310" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,45 65,55 75,55" fill="#8a8a8a"/>
  <text x="18" y="180" fill="#8a8a8a" transform="rotate(-90 18 180)">&#916;G&#8202;/k&#8202;T</text>

  <!-- x-axis (phi) -->
  <line x1="70" y1="310" x2="605" y2="310" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="605,310 595,305 595,315" fill="#8a8a8a"/>
  <text x="610" y="315" fill="#8a8a8a">&#966;</text>
  <text x="64" y="328" fill="#8a8a8a">0</text>
  <text x="322" y="328" fill="#8a8a8a">0.5</text>
  <text x="584" y="328" fill="#8a8a8a">1</text>
  <line x1="330" y1="307" x2="330" y2="313" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="590" y1="307" x2="590" y2="313" stroke="#8a8a8a" stroke-width="1"/>

  <!-- zero reference line for G -->
  <line x1="70" y1="102" x2="590" y2="102" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="44" y="106" fill="#8a8a8a">0</text>

