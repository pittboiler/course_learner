  <path d="M 71.6 103.5 L 80.4 111.6 L 90.8 120.8 L 101.2 129.9 L 111.6 138.8 L 122.0 147.6 L 132.4 156.2 L 142.8 164.6 L 153.2 172.9 L 163.6 181.0 L 174.0 188.9 L 184.4 196.7 L 194.8 204.2 L 205.2 211.6 L 215.6 218.7 L 226.0 225.7 L 236.4 232.4 L 246.8 238.9 L 257.2 245.1 L 267.6 251.1 L 278.0 256.8 L 288.4 262.2 L 298.8 267.4 L 309.2 272.2 L 319.6 276.6 L 330.0 280.8 L 340.4 284.5 L 350.8 287.9 L 361.2 290.9 L 371.6 293.4 L 382.0 295.4 L 392.4 297.0 L 402.8 298.0 L 413.2 298.4 L 423.6 298.3 L 434.0 297.4 L 444.4 295.9 L 454.8 293.6 L 465.2 290.4 L 475.6 286.3 L 486.0 281.2 L 496.4 274.9 L 506.8 267.3 L 517.2 258.3 L 527.6 247.5 L 538.0 234.7 L 548.4 219.5 L 558.8 201.1 L 569.2 178.5 L 579.6 149.2 L 588.4 112.8"
