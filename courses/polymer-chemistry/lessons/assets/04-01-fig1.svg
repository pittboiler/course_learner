  <!-- common tangent (schematic) touching the two coexisting compositions -->
  <line x1="96" y1="88.3" x2="530" y2="165.1" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="5 4"/>
  <circle cx="96" cy="88.3" r="4" fill="#e0645c"/>
  <circle cx="530" cy="165.1" r="4" fill="#e0645c"/>
  <text x="80" y="80" fill="#8a8a8a">&#966;&#8242;</text>
  <text x="524" y="182" fill="#8a8a8a">&#966;&#8243;</text>
  <text x="250" y="150" fill="#8a8a8a" font-style="italic">common tangent: the two phases</text>
</svg>
