<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Degree of polymerization X&#8345; = 1/(1&#8722;p) barely moves until conversion is nearly complete.</text>

  <!-- y axis -->
  <line x1="70" y1="280" x2="70" y2="44" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,44 65,54 75,54" fill="#8a8a8a"/>
  <text x="46" y="52" fill="#8a8a8a">X&#8345;</text>
  <!-- x axis -->
  <line x1="70" y1="280" x2="580" y2="280" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="580,280 570,275 570,285" fill="#8a8a8a"/>
  <text x="500" y="304" fill="#8a8a8a">conversion p</text>

  <!-- y ticks (X_n = 0, 50, 100) -->
  <line x1="66" y1="280" x2="70" y2="280" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="48" y="285" fill="#8a8a8a">0</text>
  <line x1="66" y1="165" x2="70" y2="165" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="42" y="170" fill="#8a8a8a">50</text>
  <line x1="66" y1="50" x2="70" y2="50" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="36" y="55" fill="#8a8a8a">100</text>

  <!-- x ticks (p = 0, 0.5, 1.0) -->
  <line x1="70" y1="280" x2="70" y2="284" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="62" y="298" fill="#8a8a8a">0</text>
  <line x1="315" y1="280" x2="315" y2="284" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="303" y="298" fill="#8a8a8a">0.5</text>
  <line x1="560" y1="280" x2="560" y2="284" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="548" y="298" fill="#8a8a8a">1.0</text>

  <!-- p -> 1 asymptote -->
  <line x1="560" y1="280" x2="560" y2="44" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="524" y="66" fill="#8a8a8a">p&#8594;1</text>

  <!-- the X_n = 1/(1-p) curve -->
  <path d="M 70 277.7 L 119 277.4 L 168 277.1 L 217 276.7 L 266 276.2 L 315 275.4 L 364 274.3 L 413 272.3 L 437.5 270.8 L 462 268.5 L 486.5 264.7 L 511 257.0 L 520.8 251.3 L 530.6 241.7 L 535.5 234.0 L 540.4 222.5 L 545.3 203.3 L 550.2 165.0 L 552.7 126.7 L 555.1 50.0"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- marker: p=0.5, X_n=2 -->
  <circle cx="315" cy="275.4" r="4" fill="#e0645c"/>
  <line x1="315" y1="275.4" x2="315" y2="240" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="300" y="234" fill="#e0645c">X&#8345;=2</text>

  <!-- marker: p=0.9, X_n=10 -->
  <circle cx="511" cy="257.0" r="4" fill="#e0645c"/>
  <text x="452" y="252" fill="#e0645c">p=0.9, X&#8345;=10</text>

  <!-- marker: p=0.99, X_n=100 -->
  <circle cx="555.1" cy="50.0" r="4" fill="#e0645c"/>
  <text x="452" y="46" fill="#e0645c">p=0.99, X&#8345;=100</text>
</svg>
