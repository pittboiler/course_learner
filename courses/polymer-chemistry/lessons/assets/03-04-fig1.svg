<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Stretching a coil destroys conformations (S drops); the chain pulls back with an entropic force f &#8733; T.</text>

  <!-- ===== left: coiled state, many conformations ===== -->
  <!-- ghost conformations (faint grey) -->
  <path d="M 60 165 C 68 130, 118 133, 126 165 C 133 195, 95 200, 150 165" fill="none" stroke="#8a8a8a" stroke-width="1.4" opacity="0.3"/>
  <path d="M 60 165 C 52 195, 92 208, 112 182 C 132 155, 100 133, 150 165" fill="none" stroke="#8a8a8a" stroke-width="1.4" opacity="0.3"/>
  <path d="M 60 165 C 84 138, 74 178, 104 192 C 138 204, 150 145, 150 165" fill="none" stroke="#8a8a8a" stroke-width="1.4" opacity="0.3"/>
  <!-- main conformation -->
  <path d="M 60 165 C 70 145, 105 145, 112 165 C 119 185, 92 190, 150 165" fill="none" stroke="#8a8a8a" stroke-width="2.5"/>
  <!-- endpoints -->
  <circle cx="60" cy="165" r="3.5" fill="#8a8a8a"/>
  <circle cx="150" cy="165" r="3.5" fill="#8a8a8a"/>
  <text x="46" y="242" fill="#8a8a8a">Coiled: many shapes</text>
  <text x="66" y="260" fill="#8a8a8a">high entropy S</text>

  <!-- ===== stretch arrow ===== -->
  <line x1="168" y1="165" x2="214" y2="165" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="214,165 205,161 205,169" fill="#8a8a8a"/>
  <text x="172" y="156" fill="#8a8a8a">stretch</text>

  <!-- ===== right: stretched state, few conformations ===== -->
  <path d="M 240 165 C 300 175, 360 155, 430 165" fill="none" stroke="#8a8a8a" stroke-width="1.4" opacity="0.3"/>
  <path d="M 240 165 C 285 156, 330 176, 375 159 C 400 168, 415 164, 430 165" fill="none" stroke="#8a8a8a" stroke-width="2.5"/>
  <circle cx="240" cy="165" r="3.5" fill="#8a8a8a"/>
  <circle cx="430" cy="165" r="3.5" fill="#8a8a8a"/>
  <!-- retractive entropic force (coral), pulling ends inward -->
  <line x1="470" y1="165" x2="440" y2="165" stroke="#e0645c" stroke-width="2"/>
  <polygon points="440,165 449,161 449,169" fill="#e0645c"/>
  <text x="474" y="170" fill="#e0645c">f</text>
  <text x="238" y="242" fill="#8a8a8a">Stretched: few shapes</text>
  <text x="272" y="260" fill="#8a8a8a">low entropy S</text>

  <!-- ===== inset: f vs T straight line through origin ===== -->
  <line x1="518" y1="205" x2="518" y2="95" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="518,95 514,104 522,104" fill="#8a8a8a"/>
  <line x1="518" y1="205" x2="618" y2="205" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="618,205 609,201 609,209" fill="#8a8a8a"/>
  <text x="500" y="100" fill="#8a8a8a">f</text>
  <text x="622" y="210" fill="#8a8a8a">T</text>
  <line x1="518" y1="205" x2="610" y2="112" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="536" y="242" fill="#4a90d9">f &#8733; T</text>
  <text x="518" y="260" fill="#8a8a8a">(fixed length)</text>
</svg>
