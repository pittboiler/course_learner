<svg viewBox="0 0 620 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Tacticity: which side of the backbone each group sits on &#8212; and whether the chain can pack into a crystal.</text>

  <!-- ===== Isotactic row (y = 85): all side groups up ===== -->
  <text x="20" y="80" fill="#8a8a8a">Isotactic</text>
  <text x="20" y="98" fill="#e0645c" font-size="11">same side &#8594; crystalline</text>
  <line x1="170" y1="85" x2="560" y2="85" stroke="#4a90d9" stroke-width="3"/>
  <line x1="190" y1="85" x2="190" y2="53" stroke="#e0645c" stroke-width="2"/><circle cx="190" cy="47" r="6" fill="#e0645c"/>
  <line x1="240" y1="85" x2="240" y2="53" stroke="#e0645c" stroke-width="2"/><circle cx="240" cy="47" r="6" fill="#e0645c"/>
  <line x1="290" y1="85" x2="290" y2="53" stroke="#e0645c" stroke-width="2"/><circle cx="290" cy="47" r="6" fill="#e0645c"/>
  <line x1="340" y1="85" x2="340" y2="53" stroke="#e0645c" stroke-width="2"/><circle cx="340" cy="47" r="6" fill="#e0645c"/>
  <line x1="390" y1="85" x2="390" y2="53" stroke="#e0645c" stroke-width="2"/><circle cx="390" cy="47" r="6" fill="#e0645c"/>
  <line x1="440" y1="85" x2="440" y2="53" stroke="#e0645c" stroke-width="2"/><circle cx="440" cy="47" r="6" fill="#e0645c"/>
  <line x1="490" y1="85" x2="490" y2="53" stroke="#e0645c" stroke-width="2"/><circle cx="490" cy="47" r="6" fill="#e0645c"/>
  <line x1="540" y1="85" x2="540" y2="53" stroke="#e0645c" stroke-width="2"/><circle cx="540" cy="47" r="6" fill="#e0645c"/>

  <!-- ===== Syndiotactic row (y = 190): strictly alternating ===== -->
  <text x="20" y="185" fill="#8a8a8a">Syndiotactic</text>
  <text x="20" y="203" fill="#e0645c" font-size="11">alternating &#8594; crystalline</text>
  <line x1="170" y1="190" x2="560" y2="190" stroke="#4a90d9" stroke-width="3"/>
  <line x1="190" y1="190" x2="190" y2="158" stroke="#e0645c" stroke-width="2"/><circle cx="190" cy="152" r="6" fill="#e0645c"/>
  <line x1="240" y1="190" x2="240" y2="222" stroke="#e0645c" stroke-width="2"/><circle cx="240" cy="228" r="6" fill="#e0645c"/>
  <line x1="290" y1="190" x2="290" y2="158" stroke="#e0645c" stroke-width="2"/><circle cx="290" cy="152" r="6" fill="#e0645c"/>
  <line x1="340" y1="190" x2="340" y2="222" stroke="#e0645c" stroke-width="2"/><circle cx="340" cy="228" r="6" fill="#e0645c"/>
  <line x1="390" y1="190" x2="390" y2="158" stroke="#e0645c" stroke-width="2"/><circle cx="390" cy="152" r="6" fill="#e0645c"/>
  <line x1="440" y1="190" x2="440" y2="222" stroke="#e0645c" stroke-width="2"/><circle cx="440" cy="228" r="6" fill="#e0645c"/>
  <line x1="490" y1="190" x2="490" y2="158" stroke="#e0645c" stroke-width="2"/><circle cx="490" cy="152" r="6" fill="#e0645c"/>
  <line x1="540" y1="190" x2="540" y2="222" stroke="#e0645c" stroke-width="2"/><circle cx="540" cy="228" r="6" fill="#e0645c"/>

  <!-- ===== Atactic row (y = 295): random ===== -->
  <text x="20" y="290" fill="#8a8a8a">Atactic</text>
  <text x="20" y="308" fill="#4a90d9" font-size="11">random &#8594; amorphous</text>
  <line x1="170" y1="295" x2="560" y2="295" stroke="#4a90d9" stroke-width="3"/>
  <line x1="190" y1="295" x2="190" y2="263" stroke="#e0645c" stroke-width="2"/><circle cx="190" cy="257" r="6" fill="#e0645c"/>
  <line x1="240" y1="295" x2="240" y2="327" stroke="#e0645c" stroke-width="2"/><circle cx="240" cy="333" r="6" fill="#e0645c"/>
  <line x1="290" y1="295" x2="290" y2="327" stroke="#e0645c" stroke-width="2"/><circle cx="290" cy="333" r="6" fill="#e0645c"/>
  <line x1="340" y1="295" x2="340" y2="263" stroke="#e0645c" stroke-width="2"/><circle cx="340" cy="257" r="6" fill="#e0645c"/>
  <line x1="390" y1="295" x2="390" y2="263" stroke="#e0645c" stroke-width="2"/><circle cx="390" cy="257" r="6" fill="#e0645c"/>
  <line x1="440" y1="295" x2="440" y2="327" stroke="#e0645c" stroke-width="2"/><circle cx="440" cy="333" r="6" fill="#e0645c"/>
  <line x1="490" y1="295" x2="490" y2="263" stroke="#e0645c" stroke-width="2"/><circle cx="490" cy="257" r="6" fill="#e0645c"/>
  <line x1="540" y1="295" x2="540" y2="327" stroke="#e0645c" stroke-width="2"/><circle cx="540" cy="333" r="6" fill="#e0645c"/>

  <!-- legend -->
  <text x="20" y="368" fill="#8a8a8a" font-size="11">&#9679; = side group R (e.g. the &#8722;CH3 of polypropylene); zigzag backbone carbons omitted for clarity.</text>
</svg>
