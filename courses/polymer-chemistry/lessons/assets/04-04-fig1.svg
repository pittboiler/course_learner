<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Same diblock, different block ratio f: the minority block (coral) packs into spheres &#8594; cylinders &#8594; gyroid &#8594; lamellae.</text>

  <!-- ===== panel 1: spheres ===== -->
  <rect x="40" y="60" width="110" height="110" fill="#4a90d9" fill-opacity="0.12" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="66" cy="86" r="6" fill="#e0645c"/>
  <circle cx="95" cy="86" r="6" fill="#e0645c"/>
  <circle cx="124" cy="86" r="6" fill="#e0645c"/>
  <circle cx="66" cy="115" r="6" fill="#e0645c"/>
  <circle cx="95" cy="115" r="6" fill="#e0645c"/>
  <circle cx="124" cy="115" r="6" fill="#e0645c"/>
  <circle cx="66" cy="144" r="6" fill="#e0645c"/>
  <circle cx="95" cy="144" r="6" fill="#e0645c"/>
  <circle cx="124" cy="144" r="6" fill="#e0645c"/>

  <!-- ===== panel 2: cylinders (cross-section) ===== -->
  <rect x="195" y="60" width="110" height="110" fill="#4a90d9" fill-opacity="0.12" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="218" cy="85" r="8" fill="#e0645c"/>
  <circle cx="250" cy="85" r="8" fill="#e0645c"/>
  <circle cx="282" cy="85" r="8" fill="#e0645c"/>
  <circle cx="234" cy="112" r="8" fill="#e0645c"/>
  <circle cx="266" cy="112" r="8" fill="#e0645c"/>
  <circle cx="218" cy="140" r="8" fill="#e0645c"/>
  <circle cx="250" cy="140" r="8" fill="#e0645c"/>
  <circle cx="282" cy="140" r="8" fill="#e0645c"/>

  <!-- ===== panel 3: gyroid (bicontinuous mesh) ===== -->
  <rect x="350" y="60" width="110" height="110" fill="#4a90d9" fill-opacity="0.12" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M 358 68 L 452 162" fill="none" stroke="#e0645c" stroke-width="4" stroke-linecap="round"/>
  <path d="M 358 108 L 412 162" fill="none" stroke="#e0645c" stroke-width="4" stroke-linecap="round"/>
  <path d="M 398 68 L 452 122" fill="none" stroke="#e0645c" stroke-width="4" stroke-linecap="round"/>
  <path d="M 452 68 L 358 162" fill="none" stroke="#e0645c" stroke-width="4" stroke-linecap="round"/>
  <path d="M 412 68 L 358 122" fill="none" stroke="#e0645c" stroke-width="4" stroke-linecap="round"/>
  <path d="M 452 108 L 398 162" fill="none" stroke="#e0645c" stroke-width="4" stroke-linecap="round"/>

  <!-- ===== panel 4: lamellae (alternating sheets) ===== -->
  <rect x="505" y="60" width="110" height="110" fill="#4a90d9" fill-opacity="0.12" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="523" y="60" width="18" height="110" fill="#e0645c" fill-opacity="0.55"/>
  <rect x="560" y="60" width="18" height="110" fill="#e0645c" fill-opacity="0.55"/>
  <rect x="597" y="60" width="18" height="110" fill="#e0645c" fill-opacity="0.55"/>

  <!-- morphology labels -->
  <text x="95" y="190" fill="#8a8a8a" text-anchor="middle">spheres</text>
  <text x="250" y="190" fill="#8a8a8a" text-anchor="middle">cylinders</text>
  <text x="405" y="190" fill="#8a8a8a" text-anchor="middle">gyroid</text>
  <text x="560" y="190" fill="#8a8a8a" text-anchor="middle">lamellae</text>

  <!-- f axis -->
  <line x1="40" y1="240" x2="632" y2="240" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="632,240 622,235 622,245" fill="#8a8a8a"/>
  <text x="95" y="262" fill="#e0645c" text-anchor="middle">f &#8776; 0.15</text>
  <text x="250" y="262" fill="#e0645c" text-anchor="middle">0.28</text>
  <text x="405" y="262" fill="#e0645c" text-anchor="middle">0.38</text>
  <text x="560" y="262" fill="#e0645c" text-anchor="middle">0.50</text>
  <text x="40" y="290" fill="#8a8a8a">minority-block volume fraction f (symmetric about 0.5) &#8594;</text>

  <!-- ODT note -->
  <text x="40" y="316" fill="#8a8a8a" font-style="italic">&#967;N above &#8776;10.5 orders the melt (ODT threshold); below it, the blocks just mix &#8212; a disordered melt.</text>
</svg>
