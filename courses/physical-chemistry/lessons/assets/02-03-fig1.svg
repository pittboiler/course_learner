<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="60" y="24" fill="#8a8a8a" font-style="italic">Each component's vapour pressure vs composition: solvent obeys Raoult (straight to p*), solute obeys Henry (slope K &#8800; p*).</text>

  <!-- ===== axes ===== -->
  <!-- y (pressure) axis -->
  <line x1="70" y1="290" x2="70" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,55 65,65 75,65" fill="#8a8a8a"/>
  <text x="46" y="60" fill="#8a8a8a">p</text>
  <!-- x (composition) axis -->
  <line x1="70" y1="290" x2="500" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="500,290 490,285 490,295" fill="#8a8a8a"/>
  <text x="502" y="295" fill="#8a8a8a">x</text>
  <text x="512" y="300" fill="#8a8a8a" font-size="10">B</text>

  <!-- x-axis endpoint labels -->
  <text x="52" y="308" fill="#8a8a8a">0</text>
  <text x="452" y="308" fill="#8a8a8a">1</text>
  <text x="52" y="324" fill="#8a8a8a" font-size="11">pure A</text>
  <text x="440" y="324" fill="#8a8a8a" font-size="11">pure B</text>

  <!-- p_A* tick -->
  <line x1="66" y1="160" x2="70" y2="160" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="26" y="164" fill="#4a90d9" font-size="13">p*<tspan dy="4" font-size="10">A</tspan></text>
  <!-- p_B* tick -->
  <line x1="66" y1="200" x2="70" y2="200" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="26" y="204" fill="#4a90d9" font-size="13">p*<tspan dy="4" font-size="10">B</tspan></text>

  <!-- ===== total pressure line: 60 - 20 x_B, from (70,160) to (470,200) ===== -->
  <line x1="70" y1="160" x2="470" y2="200" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="330" y="150" fill="#8a8a8a">total  p = p</text>
  <text x="410" y="154" fill="#8a8a8a" font-size="10">A</text>
  <text x="418" y="150" fill="#8a8a8a"> + p</text>
  <text x="446" y="154" fill="#8a8a8a" font-size="10">B</text>

  <!-- ===== Raoult, solvent A: 60(1-x_B), (70,160) -> (470,280) ===== -->
  <line x1="70" y1="160" x2="470" y2="280" stroke="#4a90d9" stroke-width="3"/>
  <text x="150" y="205" fill="#4a90d9">Raoult, solvent A</text>
  <text x="150" y="221" fill="#4a90d9" font-size="12">p</text>
  <text x="160" y="225" fill="#4a90d9" font-size="10">A</text>
  <text x="167" y="221" fill="#4a90d9" font-size="12"> = x</text>
  <text x="192" y="225" fill="#4a90d9" font-size="10">A</text>
  <text x="199" y="221" fill="#4a90d9" font-size="12"> p*</text>
  <text x="216" y="225" fill="#4a90d9" font-size="10">A</text>

  <!-- ===== Raoult, solute B: 40 x_B, (70,280) -> (470,200) ===== -->
  <line x1="70" y1="280" x2="470" y2="200" stroke="#4a90d9" stroke-width="3"/>
  <text x="335" y="238" fill="#4a90d9">Raoult, solute B</text>
  <text x="335" y="254" fill="#4a90d9" font-size="12">p</text>
  <text x="344" y="258" fill="#4a90d9" font-size="10">B</text>
  <text x="351" y="254" fill="#4a90d9" font-size="12"> = x</text>
  <text x="376" y="258" fill="#4a90d9" font-size="10">B</text>
  <text x="383" y="254" fill="#4a90d9" font-size="12"> p*</text>
  <text x="400" y="258" fill="#4a90d9" font-size="10">B</text>

  <!-- ===== Henry tangent for B: slope K_B, 100 x_B, (70,280) -> (270,180) ===== -->
  <line x1="70" y1="280" x2="270" y2="180" stroke="#e0645c" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="120" y="150" fill="#e0645c">Henry, solute B</text>
  <text x="120" y="166" fill="#e0645c" font-size="12">p</text>
  <text x="129" y="170" fill="#e0645c" font-size="10">B</text>
  <text x="136" y="166" fill="#e0645c" font-size="12"> = x</text>
  <text x="161" y="170" fill="#e0645c" font-size="10">B</text>
  <text x="168" y="166" fill="#e0645c" font-size="12"> K</text>
  <text x="182" y="170" fill="#e0645c" font-size="10">B</text>

  <!-- dilute-B highlight: coral sits above blue near x_B -> 0 -->
  <circle cx="70" cy="280" r="4" fill="#e0645c"/>
  <text x="80" y="112" fill="#e0645c" font-size="11">K</text>
  <text x="88" y="116" fill="#e0645c" font-size="9">B</text>
  <text x="94" y="112" fill="#e0645c" font-size="11"> &#8800; p*</text>
  <text x="124" y="116" fill="#e0645c" font-size="9">B</text>
</svg>
