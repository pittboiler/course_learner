<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="60" y="22" fill="#8a8a8a" font-style="italic">The fugacity coefficient &#966; = f/p measures non-ideality: it leaves 1, then returns to 1 as p &#8594; 0.</text>

  <!-- axes -->
  <line x1="70" y1="280" x2="580" y2="280" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="580,280 570,275 570,285" fill="#8a8a8a"/>
  <text x="560" y="300" fill="#8a8a8a">pressure p</text>
  <line x1="70" y1="280" x2="70" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,55 65,65 75,65" fill="#8a8a8a"/>
  <text x="44" y="62" fill="#8a8a8a">&#966;</text>

  <!-- ideal reference line phi = 1 -->
  <line x1="70" y1="130" x2="575" y2="130" stroke="#4a90d9" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="30" y="134" fill="#4a90d9">1</text>
  <text x="410" y="122" fill="#4a90d9">ideal gas: &#966; = 1</text>

  <!-- real-gas curve (coral): dips below 1 (attractions), rises above 1 (repulsions) -->
  <path d="M 70 130 L 130 155 L 190 178 L 250 186 L 310 180 L 370 160 L 430 132 L 490 110 L 560 92"
        fill="none" stroke="#e0645c" stroke-width="3"/>
  <text x="150" y="205" fill="#e0645c">&#966; &lt; 1 (attractions, Z &lt; 1)</text>
  <text x="455" y="98" fill="#e0645c">&#966; &gt; 1</text>
  <text x="415" y="222" fill="#8a8a8a">repulsions, Z &gt; 1</text>

  <!-- shared low-pressure limit point -->
  <circle cx="70" cy="130" r="4" fill="#8a8a8a"/>
  <text x="82" y="120" fill="#8a8a8a">as p &#8594; 0, real &#8594; ideal</text>
</svg>
