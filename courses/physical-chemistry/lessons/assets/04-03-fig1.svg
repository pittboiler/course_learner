<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Three modes, three spacings: translation is a near-continuum, vibration is an evenly spaced ladder, rotation spreads as J(J+1).</text>

  <!-- common energy axis -->
  <line x1="30" y1="300" x2="30" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="30,52 25,62 35,62" fill="#8a8a8a"/>
  <text x="14" y="60" fill="#8a8a8a">E</text>

  <!-- ===== Panel 1: translation ===== -->
  <text x="55" y="322" fill="#8a8a8a">translation</text>
  <text x="42" y="336" fill="#8a8a8a" font-size="11" font-style="italic">particle in a box</text>
  <!-- densely packed near-continuum lines -->
  <line x1="55" y1="298" x2="145" y2="298" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="293" x2="145" y2="293" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="288" x2="145" y2="288" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="283" x2="145" y2="283" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="278" x2="145" y2="278" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="273" x2="145" y2="273" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="268" x2="145" y2="268" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="263" x2="145" y2="263" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="258" x2="145" y2="258" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="253" x2="145" y2="253" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="248" x2="145" y2="248" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="243" x2="145" y2="243" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="238" x2="145" y2="238" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="233" x2="145" y2="233" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="228" x2="145" y2="228" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="223" x2="145" y2="223" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="218" x2="145" y2="218" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="213" x2="145" y2="213" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="208" x2="145" y2="208" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="203" x2="145" y2="203" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="198" x2="145" y2="198" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="55" y1="193" x2="145" y2="193" stroke="#8a8a8a" stroke-width="0.8"/>
  <text x="150" y="250" fill="#8a8a8a" font-size="11">&#8776; continuum</text>
  <text x="150" y="265" fill="#8a8a8a" font-size="11">n&#178;h&#178;/8mL&#178;</text>

  <!-- ===== Panel 2: vibration ===== -->
  <text x="290" y="322" fill="#4a90d9">vibration</text>
  <text x="272" y="336" fill="#8a8a8a" font-size="11" font-style="italic">harmonic oscillator</text>
  <!-- evenly spaced ladder, gap 40 -->
  <line x1="280" y1="285" x2="360" y2="285" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="280" y1="245" x2="360" y2="245" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="280" y1="205" x2="360" y2="205" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="280" y1="165" x2="360" y2="165" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="280" y1="125" x2="360" y2="125" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="280" y1="85"  x2="360" y2="85"  stroke="#4a90d9" stroke-width="2.5"/>
  <text x="364" y="289" fill="#4a90d9" font-size="11">v=0</text>
  <text x="364" y="249" fill="#4a90d9" font-size="11">v=1</text>
  <text x="364" y="209" fill="#4a90d9" font-size="11">v=2</text>
  <text x="364" y="169" fill="#4a90d9" font-size="11">v=3</text>
  <!-- equal-gap marker -->
  <line x1="300" y1="285" x2="300" y2="245" stroke="#e0645c" stroke-width="1.2"/>
  <polygon points="300,245 296,254 304,254" fill="#e0645c"/>
  <polygon points="300,285 296,276 304,276" fill="#e0645c"/>
  <text x="305" y="269" fill="#e0645c" font-size="12">h&#957;</text>

  <!-- ===== Panel 3: rotation ===== -->
  <text x="500" y="322" fill="#e0645c">rotation</text>
  <text x="500" y="336" fill="#8a8a8a" font-size="11" font-style="italic">rigid rotor</text>
  <!-- J(J+1): 0,2,6,12,20 -> heights scale 11/unit from baseline 290 -->
  <line x1="480" y1="290" x2="560" y2="290" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="480" y1="268" x2="560" y2="268" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="480" y1="224" x2="560" y2="224" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="480" y1="158" x2="560" y2="158" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="480" y1="70"  x2="560" y2="70"  stroke="#e0645c" stroke-width="2.5"/>
  <text x="564" y="294" fill="#e0645c" font-size="11">J=0 (g=1)</text>
  <text x="564" y="272" fill="#e0645c" font-size="11">J=1 (g=3)</text>
  <text x="564" y="228" fill="#e0645c" font-size="11">J=2 (g=5)</text>
  <text x="564" y="162" fill="#e0645c" font-size="11">J=3 (g=7)</text>
  <text x="564" y="74"  fill="#e0645c" font-size="11">J=4 (g=9)</text>
  <text x="452" y="130" fill="#8a8a8a" font-size="11" transform="rotate(-90 452 130)">&#8733; J(J+1)</text>
</svg>
