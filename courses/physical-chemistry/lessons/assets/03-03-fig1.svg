<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="60" y="26" fill="#8a8a8a" font-style="italic">Two elementary steps, two barriers, one intermediate valley &#8212; the taller barrier (coral) is rate-determining.</text>

  <!-- axes -->
  <line x1="60" y1="285" x2="612" y2="285" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="612,285 602,280 602,290" fill="#8a8a8a"/>
  <text x="470" y="308" fill="#8a8a8a">reaction progress &#8594;</text>
  <line x1="60" y1="285" x2="60" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="60,55 55,65 65,65" fill="#8a8a8a"/>
  <text x="28" y="150" fill="#8a8a8a" transform="rotate(-90 28 150)">energy</text>

  <!-- blue energy path R -> TS1 -> I -> TS2 -> P -->
  <path d="M 85 215 C 140 215, 165 130, 200 130 C 235 130, 275 185, 330 185 C 385 185, 415 95, 455 95 C 495 95, 530 240, 585 240"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- coral overlay: the rate-determining (taller) barrier, from intermediate up over TS2 -->
  <path d="M 330 185 C 385 185, 415 95, 455 95"
        fill="none" stroke="#e0645c" stroke-width="3"/>

  <!-- intermediate valley marker -->
  <circle cx="330" cy="185" r="4" fill="#e0645c"/>
  <line x1="330" y1="185" x2="330" y2="252" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="300" y="270" fill="#e0645c">intermediate I</text>

  <!-- RDS label at TS2 -->
  <line x1="455" y1="95" x2="455" y2="72" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="430" y="66" fill="#e0645c">RDS (slow)</text>

  <!-- TS1 label -->
  <text x="176" y="120" fill="#8a8a8a">TS1</text>

  <!-- endpoint labels -->
  <text x="70" y="235" fill="#8a8a8a">reactants</text>
  <text x="558" y="260" fill="#8a8a8a">products</text>
</svg>
