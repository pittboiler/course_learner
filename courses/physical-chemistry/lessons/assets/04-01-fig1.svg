<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Same ladder of levels, two temperatures. Bar length &#8733; population e&#8722;&#949;/kT: cold crowds the floor, hot climbs the rungs.</text>

  <!-- ===================== LEFT PANEL: low T ===================== -->
  <text x="120" y="52" fill="#8a8a8a">low T</text>

  <!-- energy axis -->
  <line x1="74" y1="272" x2="74" y2="86" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="74,86 69,96 79,96" fill="#8a8a8a"/>
  <text x="60" y="96" fill="#8a8a8a">&#949;</text>

  <!-- rungs (grey) -->
  <line x1="66" y1="260" x2="90" y2="260" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="66" y1="228" x2="90" y2="228" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="66" y1="196" x2="90" y2="196" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="66" y1="164" x2="90" y2="164" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="66" y1="132" x2="90" y2="132" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="66" y1="100" x2="90" y2="100" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="44" y="264" fill="#8a8a8a">&#949;&#8320;</text>

  <!-- population bars (blue), length &#8733; e^-1.5 i -->
  <rect x="90" y="254" width="130"  height="12" fill="#4a90d9" opacity="0.9"/>
  <rect x="90" y="222" width="29"   height="12" fill="#4a90d9" opacity="0.9"/>
  <rect x="90" y="190" width="6.5"  height="12" fill="#4a90d9" opacity="0.9"/>
  <rect x="90" y="158" width="1.5"  height="12" fill="#4a90d9" opacity="0.9"/>
  <rect x="90" y="126" width="0.4"  height="12" fill="#4a90d9" opacity="0.9"/>
  <rect x="90" y="94"  width="0.1"  height="12" fill="#4a90d9" opacity="0.9"/>

  <text x="228" y="264" fill="#4a90d9">n&#8320;</text>

  <!-- ===================== RIGHT PANEL: high T ===================== -->
  <text x="410" y="52" fill="#8a8a8a">high T</text>

  <!-- energy axis -->
  <line x1="364" y1="272" x2="364" y2="86" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="364,86 359,96 369,96" fill="#8a8a8a"/>
  <text x="350" y="96" fill="#8a8a8a">&#949;</text>

  <!-- rungs (grey) -->
  <line x1="356" y1="260" x2="380" y2="260" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="356" y1="228" x2="380" y2="228" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="356" y1="196" x2="380" y2="196" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="356" y1="164" x2="380" y2="164" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="356" y1="132" x2="380" y2="132" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="356" y1="100" x2="380" y2="100" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="334" y="264" fill="#8a8a8a">&#949;&#8320;</text>
  <text x="334" y="104" fill="#8a8a8a">&#949;&#8325;</text>

  <!-- population bars (coral), length &#8733; e^-0.4 i -->
  <rect x="380" y="254" width="130" height="12" fill="#e0645c" opacity="0.9"/>
  <rect x="380" y="222" width="87"  height="12" fill="#e0645c" opacity="0.9"/>
  <rect x="380" y="190" width="58"  height="12" fill="#e0645c" opacity="0.9"/>
  <rect x="380" y="158" width="39"  height="12" fill="#e0645c" opacity="0.9"/>
  <rect x="380" y="126" width="26"  height="12" fill="#e0645c" opacity="0.9"/>
  <rect x="380" y="94"  width="18"  height="12" fill="#e0645c" opacity="0.9"/>

  <text x="518" y="264" fill="#e0645c">n&#8320;</text>

  <!-- footer note -->
  <text x="74" y="308" fill="#8a8a8a" font-style="italic">q = &#931; g&#7522; e&#8722;&#949;&#7522;/kT counts the rungs a molecule can actually reach: q &#8776; 1 when cold, large when hot.</text>
</svg>
