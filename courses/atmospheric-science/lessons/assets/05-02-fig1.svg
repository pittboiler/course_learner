<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="24" y="24" fill="#8a8a8a" font-style="italic">Squash the column and it must spin down; stretch it again and a lee trough appears.</text>
  <path d="M 40 250 L 200 250 Q 260 180 300 180 Q 340 180 400 250 L 580 250" fill="none" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="300" y="172" fill="#8a8a8a" font-size="11" text-anchor="middle">mountain range</text>
  <line x1="40" y1="90" x2="580" y2="90" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="46" y="82" fill="#8a8a8a" font-size="11">tropopause (lid)</text>
  <rect x="87" y="90" width="46" height="160" fill="#4a90d9" opacity="0.16" stroke="#4a90d9" stroke-width="2"/>
  <text x="110" y="268" fill="#4a90d9" font-size="11" text-anchor="middle">h = 8 km</text>
  <text x="110" y="82" fill="#8a8a8a" font-size="11" text-anchor="middle">no spin</text>
  <rect x="277" y="90" width="46" height="90" fill="#4a90d9" opacity="0.16" stroke="#4a90d9" stroke-width="2"/>
  <text x="300" y="198" fill="#4a90d9" font-size="11" text-anchor="middle">h = 6 km</text>
  <path d="M 306 145 a 15 15 0 1 1 -14 -6" fill="none" stroke="#e0645c" stroke-width="2"/>
  <polygon points="291,138 298,129 287,127" fill="#e0645c"/>
  <text x="300" y="82" fill="#e0645c" font-size="11" text-anchor="middle">anticyclonic</text>
  <rect x="477" y="90" width="46" height="160" fill="#4a90d9" opacity="0.16" stroke="#4a90d9" stroke-width="2"/>
  <text x="500" y="268" fill="#4a90d9" font-size="11" text-anchor="middle">h = 8 km</text>
  <path d="M 494 180 a 15 15 0 1 0 14 -6" fill="none" stroke="#e0645c" stroke-width="2"/>
  <polygon points="509,173 502,164 513,162" fill="#e0645c"/>
  <text x="500" y="82" fill="#e0645c" font-size="11" text-anchor="middle">cyclonic</text>
  <line x1="150" y1="170" x2="262" y2="170" stroke="#8a8a8a" stroke-width="1.6"/>
  <polygon points="268,170 258,166 258,174" fill="#8a8a8a"/>
  <line x1="340" y1="170" x2="452" y2="170" stroke="#8a8a8a" stroke-width="1.6"/>
  <polygon points="458,170 448,166 448,174" fill="#8a8a8a"/>
  <text x="310" y="306" fill="#8a8a8a" font-size="12" text-anchor="middle">(zeta + f) / h is conserved along the flow</text>
  <text x="300" y="326" fill="#e0645c" font-size="11" text-anchor="middle">squashed: h down, so zeta + f must fall</text>
</svg>
