<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="26" y="24" fill="#8a8a8a" font-style="italic">Tight isobars, strong push: the force is the pressure gradient, not the pressure.</text>
  <line x1="60" y1="70" x2="290" y2="70" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="296" y="74" fill="#8a8a8a" font-size="11">1012</text>
  <line x1="60" y1="105" x2="290" y2="105" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="296" y="109" fill="#8a8a8a" font-size="11">1008</text>
  <line x1="60" y1="140" x2="290" y2="140" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="296" y="144" fill="#8a8a8a" font-size="11">1004</text>
  <line x1="60" y1="175" x2="290" y2="175" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="296" y="179" fill="#8a8a8a" font-size="11">1000</text>
  <line x1="60" y1="210" x2="290" y2="210" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="296" y="214" fill="#8a8a8a" font-size="11">996</text>
  <line x1="60" y1="245" x2="290" y2="245" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="296" y="249" fill="#8a8a8a" font-size="11">992</text>
  <text x="60" y="285" fill="#8a8a8a" font-size="12">isobars (hPa)</text>
  <circle cx="150" cy="157" r="9" fill="#4a90d9" opacity="0.3" stroke="#4a90d9" stroke-width="2"/>
  <line x1="150" y1="150" x2="150" y2="105" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="150,99 145,111 155,111" fill="#e0645c"/>
  <text x="158" y="120" fill="#e0645c" font-size="12">PGF: toward low p</text>
  <text x="60" y="303" fill="#8a8a8a" font-size="12">force per unit mass = minus one over rho times dp/dn</text>
  <rect x="340" y="110" width="150" height="80" fill="#4a90d9" opacity="0.13" stroke="#4a90d9" stroke-width="2"/>
  <text x="415" y="155" fill="#4a90d9" font-size="12" text-anchor="middle">mass = rho A dx</text>
  <line x1="288" y1="150" x2="334" y2="150" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="338,150 328,145 328,155" fill="#e0645c"/>
  <text x="292" y="140" fill="#e0645c" font-size="12">p A</text>
  <line x1="542" y1="150" x2="496" y2="150" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="492,150 502,145 502,155" fill="#e0645c"/>
  <text x="498" y="140" fill="#e0645c" font-size="12">(p + dp) A</text>
  <text x="330" y="222" fill="#8a8a8a" font-size="12">net force = minus dp times A</text>
  <text x="330" y="240" fill="#8a8a8a" font-size="12">divide by mass: minus (1/rho) dp/dx</text>
  <text x="330" y="266" fill="#8a8a8a" font-size="12">A cancels: only the gradient survives</text>
</svg>
