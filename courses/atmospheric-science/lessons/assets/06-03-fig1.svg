<svg viewBox="0 0 620 390" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="24" y="24" fill="#8a8a8a" font-style="italic">A Carnot engine: take heat from a warm sea, reject it at a cold tropopause.</text>
  <line x1="30" y1="300" x2="590" y2="300" stroke="#4a90d9" stroke-width="3"/>
  <text x="36" y="318" fill="#4a90d9" font-size="11">sea surface, 300 K</text>
  <line x1="30" y1="90" x2="590" y2="90" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="82" fill="#8a8a8a" font-size="11">outflow layer, 200 K</text>
  <path d="M 270 300 L 214 300 L 188 104 L 254 104 Z" fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="1.8"/>
  <line x1="242" y1="290" x2="222" y2="116" stroke="#e0645c" stroke-width="2.4"/>
  <polygon points="219,106 232,116 219,124" fill="#e0645c"/>
  <path d="M 350 300 L 406 300 L 432 104 L 366 104 Z" fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="1.8"/>
  <line x1="378" y1="290" x2="398" y2="116" stroke="#e0645c" stroke-width="2.4"/>
  <polygon points="401,106 388,116 401,124" fill="#e0645c"/>
  <text x="378" y="276" fill="#4a90d9" font-size="11" text-anchor="middle">eyewall</text>
  <text x="310" y="276" fill="#8a8a8a" font-size="11" text-anchor="middle">eye</text>
  <line x1="310" y1="120" x2="310" y2="260" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="4 3"/>
  <polygon points="310,268 305,256 315,256" fill="#8a8a8a"/>
  <line x1="80" y1="286" x2="198" y2="286" stroke="#e0645c" stroke-width="2.4"/>
  <polygon points="206,286 192,281 192,291" fill="#e0645c"/>
  <line x1="540" y1="286" x2="422" y2="286" stroke="#e0645c" stroke-width="2.4"/>
  <polygon points="414,286 428,281 428,291" fill="#e0645c"/>
  <text x="140" y="276" fill="#e0645c" font-size="11" text-anchor="middle">inflow gains heat from the sea</text>
  <line x1="184" y1="112" x2="90" y2="112" stroke="#e0645c" stroke-width="2.4"/>
  <polygon points="82,112 96,107 96,117" fill="#e0645c"/>
  <line x1="436" y1="112" x2="530" y2="112" stroke="#e0645c" stroke-width="2.4"/>
  <polygon points="538,112 524,107 524,117" fill="#e0645c"/>
  <text x="478" y="132" fill="#e0645c" font-size="11" text-anchor="middle">outflow sheds heat to space</text>
  <text x="310" y="352" fill="#8a8a8a" font-size="12" text-anchor="middle">efficiency = (Ts - To) / Ts = 100 / 300 = 0.33</text>
  <text x="310" y="374" fill="#e0645c" font-size="11" text-anchor="middle">stronger winds evaporate more, which strengthens the winds: WISHE</text>
</svg>
