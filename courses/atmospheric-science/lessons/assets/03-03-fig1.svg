<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="26" y="24" fill="#8a8a8a" font-style="italic">Space sees down to optical depth one. Add absorber and that level rises, and cools.</text>
