<svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="24" y="24" fill="#8a8a8a" font-style="italic">Divergence aloft pulls air up from below; the surface low deepens beneath it.</text>
  <ellipse cx="310" cy="120" rx="150" ry="34" fill="#4a90d9" opacity="0.16" stroke="#4a90d9" stroke-width="2"/>
  <line x1="90" y1="120" x2="516" y2="120" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="524,120 510,114 510,126" fill="#4a90d9"/>
  <text x="310" y="74" fill="#4a90d9" font-size="12" text-anchor="middle">jet streak</text>
  <line x1="310" y1="80" x2="310" y2="178" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="202" y="56" fill="#8a8a8a" font-size="11" text-anchor="middle">entrance half</text>
  <text x="418" y="56" fill="#8a8a8a" font-size="11" text-anchor="middle">exit half</text>
  <text x="78" y="96" fill="#8a8a8a" font-size="11" text-anchor="end">north</text>
  <text x="202" y="96" fill="#8a8a8a" font-size="11" text-anchor="middle">left entrance</text>
  <text x="202" y="154" fill="#e0645c" font-size="11" text-anchor="middle">right entrance</text>
  <text x="202" y="168" fill="#e0645c" font-size="11" text-anchor="middle">ASCENT</text>
  <text x="418" y="96" fill="#e0645c" font-size="11" text-anchor="middle">left exit</text>
  <text x="418" y="83" fill="#e0645c" font-size="11" text-anchor="middle">ASCENT</text>
  <text x="418" y="154" fill="#8a8a8a" font-size="11" text-anchor="middle">right exit</text>
  <line x1="120" y1="340" x2="480" y2="340" stroke="#8a8a8a" stroke-width="2"/>
  <text x="124" y="356" fill="#8a8a8a" font-size="11">surface</text>
  <line x1="120" y1="225" x2="480" y2="225" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="124" y="219" fill="#8a8a8a" font-size="11">upper level</text>
  <line x1="120" y1="282" x2="480" y2="282" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="476" y="277" fill="#8a8a8a" font-size="10" text-anchor="end">level of non-divergence</text>
  <line x1="290" y1="225" x2="230" y2="225" stroke="#e0645c" stroke-width="2"/>
  <polygon points="222,225 234,220 234,230" fill="#e0645c"/>
  <line x1="310" y1="225" x2="370" y2="225" stroke="#e0645c" stroke-width="2"/>
  <polygon points="378,225 366,220 366,230" fill="#e0645c"/>
  <text x="300" y="203" fill="#e0645c" font-size="11" text-anchor="middle">divergence</text>
  <line x1="222" y1="340" x2="278" y2="340" stroke="#e0645c" stroke-width="2"/>
  <polygon points="286,340 274,335 274,345" fill="#e0645c"/>
  <line x1="378" y1="340" x2="322" y2="340" stroke="#e0645c" stroke-width="2"/>
  <polygon points="314,340 326,335 326,345" fill="#e0645c"/>
  <text x="300" y="358" fill="#e0645c" font-size="11" text-anchor="middle">convergence</text>
  <line x1="300" y1="332" x2="300" y2="239" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="300,231 294,245 306,245" fill="#4a90d9"/>
  <text x="310" y="276" fill="#4a90d9" font-size="11">ascent</text>
  <text x="290" y="328" fill="#8a8a8a" font-size="12" text-anchor="end">L</text>
  <text x="310" y="382" fill="#8a8a8a" font-size="12" text-anchor="middle">the low deepens only if the outflow aloft beats the inflow below</text>
</svg>
