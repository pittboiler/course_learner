<svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="26" y="24" fill="#8a8a8a" font-style="italic">Warm columns are thicker, so pressure surfaces tilt more with height: a jet.</text>
  <line x1="70" y1="200.0" x2="400" y2="200.0" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="406" y="204.0" fill="#8a8a8a" font-size="11">1000 hPa</text>
  <line x1="70" y1="160.2" x2="400" y2="144.6" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="406" y="148.6" fill="#8a8a8a" font-size="11">700 hPa</text>
  <line x1="70" y1="127.5" x2="400" y2="98.9" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="406" y="102.9" fill="#8a8a8a" font-size="11">500 hPa</text>
  <line x1="70" y1="83.0" x2="400" y2="37.0" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="406" y="41.0" fill="#8a8a8a" font-size="11">300 hPa</text>
  <text x="108" y="240" fill="#8a8a8a" font-size="12" text-anchor="middle">POLE (cold)</text>
  <text x="348" y="240" fill="#8a8a8a" font-size="12" text-anchor="middle">EQUATOR (warm)</text>
  <circle cx="150" cy="68" r="4" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="150" cy="68" r="2" fill="#4a90d9"/>
  <circle cx="230" cy="68" r="6" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="230" cy="68" r="2" fill="#4a90d9"/>
  <circle cx="310" cy="68" r="9" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="310" cy="68" r="2" fill="#4a90d9"/>
  <text x="430" y="72" fill="#4a90d9" font-size="12">westerly grows with height</text>
  <line x1="60" y1="350" x2="560" y2="350" stroke="#8a8a8a" stroke-width="2"/>
  <text x="80" y="370" fill="#8a8a8a" font-size="11" text-anchor="middle">0</text>
  <line x1="80" y1="350" x2="80" y2="356" stroke="#8a8a8a" stroke-width="1"/>
  <text x="200" y="370" fill="#8a8a8a" font-size="11" text-anchor="middle">30</text>
  <line x1="200" y1="350" x2="200" y2="356" stroke="#8a8a8a" stroke-width="1"/>
  <text x="320" y="370" fill="#8a8a8a" font-size="11" text-anchor="middle">60</text>
  <line x1="320" y1="350" x2="320" y2="356" stroke="#8a8a8a" stroke-width="1"/>
  <text x="440" y="370" fill="#8a8a8a" font-size="11" text-anchor="middle">90</text>
  <line x1="440" y1="350" x2="440" y2="356" stroke="#8a8a8a" stroke-width="1"/>
  <text x="470" y="370" fill="#8a8a8a" font-size="11">latitude (degrees)</text>
  <path d="M 80 348 C 80 294, 200 294, 200 348" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="140" y="286" fill="#4a90d9" font-size="11" text-anchor="middle">Hadley</text>
  <path d="M 200 348 C 200 294, 320 294, 320 348" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="260" y="286" fill="#8a8a8a" font-size="11" text-anchor="middle">Ferrel</text>
  <path d="M 320 348 C 320 294, 440 294, 440 348" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="380" y="286" fill="#4a90d9" font-size="11" text-anchor="middle">polar</text>
  <text x="80" y="388" fill="#e0645c" font-size="11" text-anchor="middle">ITCZ</text>
  <text x="200" y="388" fill="#e0645c" font-size="11" text-anchor="middle">subtropical high</text>
  <text x="320" y="388" fill="#e0645c" font-size="11" text-anchor="middle">polar front</text>
  <text x="140" y="326" fill="#8a8a8a" font-size="11" text-anchor="middle">trades</text>
  <text x="260" y="326" fill="#8a8a8a" font-size="11" text-anchor="middle">westerlies</text>
  <text x="380" y="326" fill="#8a8a8a" font-size="11" text-anchor="middle">polar easterlies</text>
  <circle cx="205" cy="298" r="6" fill="none" stroke="#e0645c" stroke-width="2"/>
  <circle cx="205" cy="298" r="2" fill="#e0645c"/>
  <circle cx="325" cy="298" r="6" fill="none" stroke="#e0645c" stroke-width="2"/>
  <circle cx="325" cy="298" r="2" fill="#e0645c"/>
  <text x="60" y="268" fill="#e0645c" font-size="11">jets sit above the strongest temperature gradients</text>
</svg>
