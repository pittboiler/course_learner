<svg viewBox="0 0 620 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="24" y="24" fill="#8a8a8a" font-style="italic">Without shear the downdraft kills the updraft; with shear they stand side by side.</text>
  <line x1="40" y1="300" x2="280" y2="300" stroke="#8a8a8a" stroke-width="2"/>
  <text x="160" y="330" fill="#8a8a8a" font-size="12" text-anchor="middle">no shear: self-destructs</text>
  <path d="M 112 300 L 208 300 L 196 130 L 124 130 Z" fill="#4a90d9" opacity="0.16" stroke="#4a90d9" stroke-width="1.8"/>
  <ellipse cx="160" cy="122" rx="66" ry="12" fill="#4a90d9" opacity="0.2" stroke="#4a90d9" stroke-width="1.6"/>
  <line x1="140" y1="284" x2="140" y2="148" stroke="#4a90d9" stroke-width="2.4"/>
  <polygon points="140,138 134,152 146,152" fill="#4a90d9"/>
  <text x="134" y="210" fill="#4a90d9" font-size="11" text-anchor="end">up</text>
  <line x1="180" y1="150" x2="180" y2="286" stroke="#e0645c" stroke-width="2.4"/>
  <polygon points="180,296 174,282 186,282" fill="#e0645c"/>
  <text x="188" y="210" fill="#e0645c" font-size="11">down</text>
  <text x="160" y="114" fill="#e0645c" font-size="11" text-anchor="middle">rain falls into the inflow</text>
  <line x1="340" y1="300" x2="580" y2="300" stroke="#8a8a8a" stroke-width="2"/>
  <text x="460" y="330" fill="#8a8a8a" font-size="12" text-anchor="middle">strong shear: supercell</text>
  <path d="M 380 300 L 460 300 L 526 130 L 458 130 Z" fill="#4a90d9" opacity="0.16" stroke="#4a90d9" stroke-width="1.8"/>
  <ellipse cx="504" cy="122" rx="72" ry="12" fill="#4a90d9" opacity="0.2" stroke="#4a90d9" stroke-width="1.6"/>
  <line x1="412" y1="286" x2="480" y2="148" stroke="#4a90d9" stroke-width="2.4"/>
  <polygon points="486,138 472,148 482,158" fill="#4a90d9"/>
  <text x="426" y="192" fill="#4a90d9" font-size="11" text-anchor="end">tilted updraft</text>
  <line x1="536" y1="150" x2="536" y2="286" stroke="#e0645c" stroke-width="2.4"/>
  <polygon points="536,296 530,282 542,282" fill="#e0645c"/>
  <text x="490" y="110" fill="#e0645c" font-size="11">rain falls clear</text>
  <line x1="316" y1="270" x2="332" y2="270" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="337,270 329,267 329,273" fill="#8a8a8a"/>
  <line x1="316" y1="220" x2="350" y2="220" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="355,220 347,217 347,223" fill="#8a8a8a"/>
  <line x1="316" y1="170" x2="370" y2="170" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="375,170 367,167 367,173" fill="#8a8a8a"/>
  <line x1="316" y1="130" x2="388" y2="130" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="393,130 385,127 385,133" fill="#8a8a8a"/>
  <text x="346" y="100" fill="#8a8a8a" font-size="11" text-anchor="middle">shear</text>
  <text x="310" y="362" fill="#8a8a8a" font-size="12" text-anchor="middle">0 to 6 km shear below 10 m/s gives single cells; above 20 m/s, supercells</text>
</svg>
