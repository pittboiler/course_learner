<svg viewBox="0 0 820 515" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Where mobile charge comes from: bonds break, dopants donate or accept — the band picture, by energy.</text>

  <!-- ================= panel a: bond pictures ================= -->

  <!-- cluster 1: intrinsic silicon, centre 145,150 -->
  <circle cx="70" cy="150" r="15" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="70" y="154" fill="#8a8a8a" font-size="11" text-anchor="middle">Si</text>
  <circle cx="220" cy="150" r="15" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="220" y="154" fill="#8a8a8a" font-size="11" text-anchor="middle">Si</text>
  <circle cx="145" cy="80" r="15" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="145" y="84" fill="#8a8a8a" font-size="11" text-anchor="middle">Si</text>
  <circle cx="145" cy="220" r="15" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="145" y="224" fill="#8a8a8a" font-size="11" text-anchor="middle">Si</text>
  <circle cx="145" cy="150" r="18" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="145" y="155" fill="#8a8a8a" font-size="12" text-anchor="middle">Si</text>
  <!-- left bond -->
  <line x1="127" y1="147" x2="85" y2="147" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="127" y1="153" x2="85" y2="153" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="116" cy="150" r="3.2" fill="#8a8a8a"/>
  <circle cx="96" cy="150" r="3.2" fill="#8a8a8a"/>
  <!-- top bond -->
  <line x1="142" y1="132" x2="142" y2="95" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="148" y1="132" x2="148" y2="95" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="145" cy="122" r="3.2" fill="#8a8a8a"/>
  <circle cx="145" cy="105" r="3.2" fill="#8a8a8a"/>
  <!-- bottom bond -->
  <line x1="142" y1="168" x2="142" y2="205" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="148" y1="168" x2="148" y2="205" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="145" cy="178" r="3.2" fill="#8a8a8a"/>
  <circle cx="145" cy="195" r="3.2" fill="#8a8a8a"/>
  <!-- right bond: BROKEN. one electron left, one escaped -->
  <line x1="163" y1="147" x2="205" y2="147" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="163" y1="153" x2="205" y2="153" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="174" cy="150" r="3.2" fill="#8a8a8a"/>
  <circle cx="194" cy="150" r="4.6" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="187" y="176" fill="#e0645c" font-size="12">h+</text>
  <!-- escaped electron -->
  <line x1="197" y1="142" x2="207" y2="115" stroke="#4a90d9" stroke-width="1.4" stroke-dasharray="3 3"/>
  <polygon points="208,111 202,118 211,120" fill="#4a90d9"/>
  <circle cx="216" cy="103" r="4.6" fill="#4a90d9"/>
  <text x="224" y="101" fill="#4a90d9" font-size="12">e&#8722;</text>

  <!-- cluster 2: donor, centre 410,150 -->
  <circle cx="335" cy="150" r="15" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="335" y="154" fill="#8a8a8a" font-size="11" text-anchor="middle">Si</text>
  <circle cx="485" cy="150" r="15" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="485" y="154" fill="#8a8a8a" font-size="11" text-anchor="middle">Si</text>
  <circle cx="410" cy="80" r="15" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="410" y="84" fill="#8a8a8a" font-size="11" text-anchor="middle">Si</text>
  <circle cx="410" cy="220" r="15" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="410" y="224" fill="#8a8a8a" font-size="11" text-anchor="middle">Si</text>
  <circle cx="410" cy="150" r="18" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="410" y="155" fill="#4a90d9" font-size="12" text-anchor="middle">P</text>
  <line x1="392" y1="147" x2="350" y2="147" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="392" y1="153" x2="350" y2="153" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="381" cy="150" r="3.2" fill="#8a8a8a"/>
  <circle cx="361" cy="150" r="3.2" fill="#8a8a8a"/>
  <line x1="428" y1="147" x2="470" y2="147" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="428" y1="153" x2="470" y2="153" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="439" cy="150" r="3.2" fill="#8a8a8a"/>
  <circle cx="459" cy="150" r="3.2" fill="#8a8a8a"/>
  <line x1="407" y1="132" x2="407" y2="95" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="413" y1="132" x2="413" y2="95" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="410" cy="122" r="3.2" fill="#8a8a8a"/>
  <circle cx="410" cy="105" r="3.2" fill="#8a8a8a"/>
  <line x1="407" y1="168" x2="407" y2="205" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="413" y1="168" x2="413" y2="205" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="410" cy="178" r="3.2" fill="#8a8a8a"/>
  <circle cx="410" cy="195" r="3.2" fill="#8a8a8a"/>
  <!-- the loosely bound fifth electron -->
  <line x1="424" y1="136" x2="444" y2="112" stroke="#4a90d9" stroke-width="1.4" stroke-dasharray="3 3"/>
  <circle cx="450" cy="105" r="4.6" fill="#4a90d9"/>
  <text x="458" y="103" fill="#4a90d9" font-size="12">5th e&#8722;</text>

  <!-- cluster 3: acceptor, centre 675,150 -->
  <circle cx="600" cy="150" r="15" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="600" y="154" fill="#8a8a8a" font-size="11" text-anchor="middle">Si</text>
  <circle cx="750" cy="150" r="15" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="750" y="154" fill="#8a8a8a" font-size="11" text-anchor="middle">Si</text>
  <circle cx="675" cy="80" r="15" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="675" y="84" fill="#8a8a8a" font-size="11" text-anchor="middle">Si</text>
  <circle cx="675" cy="220" r="15" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="675" y="224" fill="#8a8a8a" font-size="11" text-anchor="middle">Si</text>
  <circle cx="675" cy="150" r="18" fill="#e0645c" fill-opacity="0.15" stroke="#e0645c" stroke-width="2"/>
  <text x="675" y="155" fill="#e0645c" font-size="12" text-anchor="middle">B</text>
  <line x1="657" y1="147" x2="615" y2="147" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="657" y1="153" x2="615" y2="153" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="646" cy="150" r="3.2" fill="#8a8a8a"/>
  <circle cx="626" cy="150" r="3.2" fill="#8a8a8a"/>
  <line x1="672" y1="132" x2="672" y2="95" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="678" y1="132" x2="678" y2="95" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="675" cy="122" r="3.2" fill="#8a8a8a"/>
  <circle cx="675" cy="105" r="3.2" fill="#8a8a8a"/>
  <line x1="672" y1="168" x2="672" y2="205" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="678" y1="168" x2="678" y2="205" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="675" cy="178" r="3.2" fill="#8a8a8a"/>
  <circle cx="675" cy="195" r="3.2" fill="#8a8a8a"/>
  <!-- right bond is one electron short -->
  <line x1="693" y1="147" x2="735" y2="147" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="693" y1="153" x2="735" y2="153" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="704" cy="150" r="3.2" fill="#8a8a8a"/>
  <circle cx="724" cy="150" r="4.6" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="717" y="176" fill="#e0645c" font-size="12">h+</text>

  <!-- cluster captions -->
  <text x="145" y="256" fill="#8a8a8a" font-size="13" text-anchor="middle">Intrinsic Si (4 valence e&#8722;)</text>
  <text x="145" y="273" fill="#8a8a8a" font-size="11.5" text-anchor="middle">heat breaks a bond &#8594; one free e&#8722; and one h+</text>
  <text x="410" y="256" fill="#4a90d9" font-size="13" text-anchor="middle">Donor: P (group V) &#8594; n-type</text>
  <text x="410" y="273" fill="#8a8a8a" font-size="11.5" text-anchor="middle">5th electron barely bound &#8594; free e&#8722;</text>
  <text x="675" y="256" fill="#e0645c" font-size="13" text-anchor="middle">Acceptor: B (group III) &#8594; p-type</text>
  <text x="675" y="273" fill="#8a8a8a" font-size="11.5" text-anchor="middle">one bond short &#8594; mobile h+</text>

  <line x1="40" y1="292" x2="780" y2="292" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 5"/>

  <!-- ================= panel b: band diagram ================= -->

  <!-- energy axis -->
  <line x1="60" y1="480" x2="60" y2="326" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="60,320 55,332 65,332" fill="#8a8a8a"/>
  <text x="48" y="336" fill="#8a8a8a" font-size="12">E</text>

  <text x="250" y="318" fill="#4a90d9" font-size="12.5" text-anchor="middle">n-type (donors)</text>
  <text x="560" y="318" fill="#e0645c" font-size="12.5" text-anchor="middle">p-type (acceptors)</text>

  <rect x="100" y="330" width="600" height="30" fill="#4a90d9" fill-opacity="0.13"/>
  <text x="110" y="350" fill="#8a8a8a" font-size="11.5">conduction band</text>
  <line x1="100" y1="360" x2="700" y2="360" stroke="#8a8a8a" stroke-width="2"/>
  <text x="708" y="364" fill="#8a8a8a" font-size="12.5">Ec</text>

  <rect x="100" y="462" width="600" height="30" fill="#e0645c" fill-opacity="0.13"/>
  <text x="110" y="482" fill="#8a8a8a" font-size="11.5">valence band</text>
  <line x1="100" y1="462" x2="700" y2="462" stroke="#8a8a8a" stroke-width="2"/>
  <text x="708" y="466" fill="#8a8a8a" font-size="12.5">Ev</text>

  <!-- gap arrow -->
  <line x1="165" y1="360" x2="165" y2="462" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="165,360 161,370 169,370" fill="#e0645c"/>
  <polygon points="165,462 161,452 169,452" fill="#e0645c"/>
  <text x="174" y="406" fill="#e0645c" font-size="12.5">Eg = 1.12 eV</text>
  <text x="174" y="422" fill="#8a8a8a" font-size="11">(the forbidden gap)</text>

  <line x1="400" y1="326" x2="400" y2="496" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- donor level and electrons in the conduction band -->
  <line x1="240" y1="376" x2="350" y2="376" stroke="#4a90d9" stroke-width="1.8" stroke-dasharray="9 6"/>
  <text x="358" y="380" fill="#4a90d9" font-size="12.5">Ed</text>
  <text x="240" y="394" fill="#8a8a8a" font-size="11">&#8776;45 meV below Ec: ionizes at room T</text>
  <line x1="295" y1="372" x2="295" y2="352" stroke="#4a90d9" stroke-width="1.4"/>
  <polygon points="295,348 291,358 299,358" fill="#4a90d9"/>
  <circle cx="245" cy="345" r="4.6" fill="#4a90d9"/>
  <circle cx="270" cy="345" r="4.6" fill="#4a90d9"/>
  <circle cx="320" cy="345" r="4.6" fill="#4a90d9"/>
  <circle cx="345" cy="345" r="4.6" fill="#4a90d9"/>
  <text x="240" y="412" fill="#4a90d9" font-size="11">electrons = majority carriers</text>

  <!-- acceptor level and holes in the valence band -->
  <line x1="470" y1="446" x2="580" y2="446" stroke="#e0645c" stroke-width="1.8" stroke-dasharray="9 6"/>
  <text x="588" y="450" fill="#e0645c" font-size="12.5">Ea</text>
  <text x="470" y="436" fill="#8a8a8a" font-size="11">&#8776;45 meV above Ev: grabs a valence e&#8722;</text>
  <line x1="525" y1="450" x2="525" y2="470" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="525,474 521,464 529,464" fill="#e0645c"/>
  <circle cx="480" cy="478" r="4.6" fill="none" stroke="#e0645c" stroke-width="2"/>
  <circle cx="505" cy="478" r="4.6" fill="none" stroke="#e0645c" stroke-width="2"/>
  <circle cx="550" cy="478" r="4.6" fill="none" stroke="#e0645c" stroke-width="2"/>
  <circle cx="575" cy="478" r="4.6" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="470" y="418" fill="#e0645c" font-size="11">holes = majority carriers</text>
</svg>
