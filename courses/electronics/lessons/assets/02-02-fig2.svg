<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">The DC load line V(CE) = 15 &#8722; I(C)&#215;4.3 k&#8486;, with the Q-point parked near mid-rail so the signal has room to swing both ways.</text>

  <!-- axes -->
  <line x1="60" y1="250" x2="486" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="490,250 480,245 480,255" fill="#8a8a8a"/>
  <line x1="70" y1="256" x2="70" y2="58" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,54 65,64 75,64" fill="#8a8a8a"/>
  <text x="70" y="44" fill="#8a8a8a" text-anchor="middle">I<tspan font-size="10" dy="3">C</tspan><tspan dy="-3"> (mA)</tspan></text>
  <text x="498" y="248" fill="#8a8a8a">V<tspan font-size="10" dy="3">CE</tspan><tspan dy="-3"> (V)</tspan></text>

  <!-- x ticks -->
  <line x1="195" y1="246" x2="195" y2="254" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="195" y="268" fill="#8a8a8a" text-anchor="middle">5</text>
  <line x1="320" y1="246" x2="320" y2="254" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="320" y="268" fill="#8a8a8a" text-anchor="middle">10</text>
  <line x1="445" y1="246" x2="445" y2="254" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="445" y="268" fill="#8a8a8a" text-anchor="middle">15</text>
  <text x="66" y="268" fill="#8a8a8a" text-anchor="middle">0</text>

  <!-- y ticks -->
  <line x1="66" y1="202.5" x2="74" y2="202.5" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="60" y="207" fill="#8a8a8a" text-anchor="end">1</text>
  <line x1="66" y1="155" x2="74" y2="155" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="60" y="159" fill="#8a8a8a" text-anchor="end">2</text>
  <line x1="66" y1="107.5" x2="74" y2="107.5" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="60" y="112" fill="#8a8a8a" text-anchor="end">3</text>

  <!-- transistor output characteristics -->
  <path d="M 70 250 Q 78 205 88 203.5 L 460 198" fill="none" stroke="#4a90d9" stroke-width="1.6" opacity="0.55"/>
  <path d="M 70 250 Q 78 170 88 168.5 L 460 163" fill="none" stroke="#4a90d9" stroke-width="2.2"/>
  <path d="M 70 250 Q 78 135 88 133.5 L 460 128" fill="none" stroke="#4a90d9" stroke-width="1.6" opacity="0.55"/>
  <text x="466" y="132" fill="#4a90d9" font-size="11">I<tspan font-size="9" dy="3">B</tspan><tspan dy="-3"> = 25 &#956;A</tspan></text>
  <text x="466" y="167" fill="#4a90d9" font-size="11">17.7 &#956;A</text>
  <text x="466" y="202" fill="#4a90d9" font-size="11">10 &#956;A</text>

  <!-- load line -->
  <line x1="70" y1="84.3" x2="445" y2="250" stroke="#8a8a8a" stroke-width="2.4"/>
  <text x="88" y="76" fill="#8a8a8a" font-size="11">V<tspan font-size="9" dy="3">CC</tspan><tspan dy="-3">/(R</tspan><tspan font-size="9" dy="3">C</tspan><tspan dy="-3">+R</tspan><tspan font-size="9" dy="3">E</tspan><tspan dy="-3">) = 3.49 mA</tspan></text>

  <!-- Q point -->
  <line x1="254.5" y1="166" x2="254.5" y2="284" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="70" y1="166" x2="254.5" y2="166" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="254.5" cy="166" r="5.5" fill="#e0645c"/>
  <text x="264" y="152" fill="#e0645c">Q = (7.38 V, 1.77 mA)</text>

  <!-- swing brackets -->
  <line x1="75" y1="254" x2="75" y2="284" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="445" y1="254" x2="445" y2="284" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="75" y1="284" x2="254.5" y2="284" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="75,284 84,280 84,288" fill="#e0645c"/>
  <polygon points="254.5,284 245.5,280 245.5,288" fill="#e0645c"/>
  <text x="165" y="302" fill="#e0645c" text-anchor="middle" font-size="12">7.2 V down &#8594; saturation clip</text>
  <line x1="254.5" y1="284" x2="445" y2="284" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="254.5,284 263.5,280 263.5,288" fill="#e0645c"/>
  <polygon points="445,284 436,280 436,288" fill="#e0645c"/>
  <text x="350" y="302" fill="#e0645c" text-anchor="middle" font-size="12">7.6 V up &#8594; cutoff clip</text>
</svg>
