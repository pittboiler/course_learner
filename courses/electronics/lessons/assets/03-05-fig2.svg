<svg viewBox="0 0 760 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Both topologies return the coral feedback resistor to the + input — only the input terminal differs.</text>

  <text x="20" y="52" fill="#8a8a8a">(a) non-inverting Schmitt trigger</text>
  <text x="410" y="52" fill="#8a8a8a">(b) inverting Schmitt trigger</text>

  <!-- ============ panel a: non-inverting Schmitt ============ -->

  <!-- feedback path (coral) -->
  <line x1="140" y1="120" x2="140" y2="75" stroke="#e0645c" stroke-width="1.8"/>
  <line x1="140" y1="75" x2="180" y2="75" stroke="#e0645c" stroke-width="1.8"/>
  <rect x="180" y="67" width="40" height="16" fill="none" stroke="#e0645c" stroke-width="1.8"/>
  <text x="192" y="61" fill="#e0645c">R<tspan dy="4" font-size="10">2</tspan></text>
  <line x1="220" y1="75" x2="280" y2="75" stroke="#e0645c" stroke-width="1.8"/>
  <line x1="280" y1="75" x2="280" y2="140" stroke="#e0645c" stroke-width="1.8"/>
  <circle cx="280" cy="140" r="3.2" fill="#8a8a8a"/>
  <circle cx="140" cy="120" r="3.2" fill="#8a8a8a"/>

  <!-- input path -->
  <text x="20" y="124" fill="#8a8a8a">v<tspan dy="4" font-size="10">in</tspan></text>
  <line x1="48" y1="120" x2="70" y2="120" stroke="#8a8a8a" stroke-width="1.8"/>
  <rect x="70" y="112" width="40" height="16" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="82" y="106" fill="#8a8a8a">R<tspan dy="4" font-size="10">1</tspan></text>
  <line x1="110" y1="120" x2="160" y2="120" stroke="#8a8a8a" stroke-width="1.8"/>

  <!-- op-amp -->
  <polygon points="160,100 160,180 230,140" fill="#4a90d9" fill-opacity="0.10" stroke="#4a90d9" stroke-width="2"/>
  <text x="167" y="125" fill="#4a90d9">+</text>
  <text x="167" y="167" fill="#4a90d9">&#8722;</text>
  <text x="176" y="146" fill="#4a90d9" font-size="11">open</text>
  <text x="176" y="158" fill="#4a90d9" font-size="11">loop</text>

  <!-- inverting input to ground -->
  <line x1="160" y1="160" x2="128" y2="160" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="128" y1="160" x2="128" y2="192" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="116" y1="192" x2="140" y2="192" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="121" y1="197" x2="135" y2="197" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="125" y1="202" x2="131" y2="202" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- output -->
  <line x1="230" y1="140" x2="312" y2="140" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="316" y="144" fill="#8a8a8a">v<tspan dy="4" font-size="10">out</tspan></text>

  <text x="26" y="240" fill="#8a8a8a">v<tspan dy="4" font-size="10">in</tspan><tspan dy="-4" font-size="13"> enters through R</tspan><tspan dy="4" font-size="10">1</tspan><tspan dy="-4" font-size="13">; switches when v</tspan><tspan dy="2" font-size="11">+</tspan><tspan dy="-2" font-size="13"> = 0</tspan></text>
  <text x="26" y="264" fill="#e0645c">V<tspan dy="4" font-size="10">TH,TL</tspan><tspan dy="-4" font-size="13"> = &#177;(R</tspan><tspan dy="4" font-size="10">1</tspan><tspan dy="-4" font-size="13">/R</tspan><tspan dy="4" font-size="10">2</tspan><tspan dy="-4" font-size="13">) V</tspan><tspan dy="4" font-size="10">sat</tspan></text>

  <!-- ============ panel b: inverting Schmitt ============ -->

  <!-- input path -->
  <text x="404" y="124" fill="#8a8a8a">v<tspan dy="4" font-size="10">in</tspan></text>
  <line x1="432" y1="120" x2="540" y2="120" stroke="#8a8a8a" stroke-width="1.8"/>

  <!-- op-amp -->
  <polygon points="540,100 540,180 610,140" fill="#4a90d9" fill-opacity="0.10" stroke="#4a90d9" stroke-width="2"/>
  <text x="547" y="125" fill="#4a90d9">&#8722;</text>
  <text x="547" y="167" fill="#4a90d9">+</text>
  <text x="556" y="146" fill="#4a90d9" font-size="11">open</text>
  <text x="556" y="158" fill="#4a90d9" font-size="11">loop</text>

  <!-- output -->
  <line x1="610" y1="140" x2="692" y2="140" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="696" y="144" fill="#8a8a8a">v<tspan dy="4" font-size="10">out</tspan></text>
  <circle cx="660" cy="140" r="3.2" fill="#8a8a8a"/>

  <!-- feedback path (coral) -->
  <line x1="660" y1="140" x2="660" y2="195" stroke="#e0645c" stroke-width="1.8"/>
  <line x1="660" y1="195" x2="600" y2="195" stroke="#e0645c" stroke-width="1.8"/>
  <rect x="560" y="187" width="40" height="16" fill="none" stroke="#e0645c" stroke-width="1.8"/>
  <text x="570" y="181" fill="#e0645c">R<tspan dy="4" font-size="10">2</tspan></text>
  <line x1="560" y1="195" x2="500" y2="195" stroke="#e0645c" stroke-width="1.8"/>
  <circle cx="500" cy="195" r="3.2" fill="#8a8a8a"/>

  <!-- + node down to R1 and ground -->
  <line x1="540" y1="160" x2="500" y2="160" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="500" y1="160" x2="500" y2="215" stroke="#8a8a8a" stroke-width="1.8"/>
  <rect x="492" y="215" width="16" height="40" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="514" y="240" fill="#8a8a8a">R<tspan dy="4" font-size="10">1</tspan></text>
  <line x1="500" y1="255" x2="500" y2="272" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="488" y1="272" x2="512" y2="272" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="493" y1="277" x2="507" y2="277" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="497" y1="282" x2="503" y2="282" stroke="#8a8a8a" stroke-width="1.5"/>

  <text x="410" y="310" fill="#8a8a8a">v<tspan dy="4" font-size="10">in</tspan><tspan dy="-4" font-size="13"> enters at &#8722;; switches when v</tspan><tspan dy="2" font-size="11">&#8722;</tspan><tspan dy="-2" font-size="13"> = v</tspan><tspan dy="2" font-size="11">+</tspan></text>
  <text x="410" y="334" fill="#e0645c">V<tspan dy="4" font-size="10">TH,TL</tspan><tspan dy="-4" font-size="13"> = &#177;V</tspan><tspan dy="4" font-size="10">sat</tspan><tspan dy="-4" font-size="13"> R</tspan><tspan dy="4" font-size="10">1</tspan><tspan dy="-4" font-size="13">/(R</tspan><tspan dy="4" font-size="10">1</tspan><tspan dy="-4" font-size="13"> + R</tspan><tspan dy="4" font-size="10">2</tspan><tspan dy="-4" font-size="13">)</tspan></text>

  <!-- ============ panel c: relaxation oscillator ============ -->

  <text x="20" y="378" fill="#8a8a8a">(c) relaxation oscillator: panel (b) with an RC in place of the input</text>
  <text x="440" y="378" fill="#8a8a8a">(d) capacitor voltage (coral), output (blue)</text>

  <!-- timing resistor R from output back to the cap node -->
  <line x1="110" y1="450" x2="110" y2="418" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="110" y1="418" x2="180" y2="418" stroke="#8a8a8a" stroke-width="1.8"/>
  <rect x="180" y="410" width="40" height="16" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="194" y="404" fill="#8a8a8a">R</text>
  <line x1="220" y1="418" x2="320" y2="418" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="320" y1="418" x2="320" y2="480" stroke="#8a8a8a" stroke-width="1.8"/>
  <circle cx="320" cy="480" r="3.2" fill="#8a8a8a"/>

  <!-- capacitor node -->
  <line x1="220" y1="450" x2="110" y2="450" stroke="#8a8a8a" stroke-width="1.8"/>
  <circle cx="110" cy="450" r="3.2" fill="#8a8a8a"/>
  <line x1="110" y1="450" x2="110" y2="470" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="96" y1="470" x2="124" y2="470" stroke="#4a90d9" stroke-width="2.4"/>
  <line x1="96" y1="478" x2="124" y2="478" stroke="#4a90d9" stroke-width="2.4"/>
  <text x="130" y="478" fill="#4a90d9">C</text>
  <line x1="110" y1="478" x2="110" y2="498" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="98" y1="498" x2="122" y2="498" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="103" y1="503" x2="117" y2="503" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="107" y1="508" x2="113" y2="508" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="140" y="444" fill="#8a8a8a">v<tspan dy="4" font-size="10">C</tspan></text>

  <!-- op-amp -->
  <polygon points="220,440 220,520 290,480" fill="#4a90d9" fill-opacity="0.10" stroke="#4a90d9" stroke-width="2"/>
  <text x="227" y="456" fill="#4a90d9">&#8722;</text>
  <text x="227" y="507" fill="#4a90d9">+</text>

  <!-- output -->
  <line x1="290" y1="480" x2="400" y2="480" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="404" y="484" fill="#8a8a8a">v<tspan dy="4" font-size="10">out</tspan></text>
  <circle cx="370" cy="480" r="3.2" fill="#8a8a8a"/>

  <!-- coral feedback -->
  <line x1="370" y1="480" x2="370" y2="540" stroke="#e0645c" stroke-width="1.8"/>
  <line x1="370" y1="540" x2="310" y2="540" stroke="#e0645c" stroke-width="1.8"/>
  <rect x="270" y="532" width="40" height="16" fill="none" stroke="#e0645c" stroke-width="1.8"/>
  <text x="280" y="526" fill="#e0645c">R<tspan dy="4" font-size="10">2</tspan></text>
  <line x1="270" y1="540" x2="170" y2="540" stroke="#e0645c" stroke-width="1.8"/>
  <circle cx="170" cy="540" r="3.2" fill="#8a8a8a"/>

  <!-- + node to R1 and ground -->
  <line x1="220" y1="500" x2="170" y2="500" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="170" y1="500" x2="170" y2="558" stroke="#8a8a8a" stroke-width="1.8"/>
  <rect x="162" y="558" width="16" height="40" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="184" y="583" fill="#8a8a8a">R<tspan dy="4" font-size="10">1</tspan></text>
  <line x1="170" y1="598" x2="170" y2="606" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="158" y1="606" x2="182" y2="606" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="163" y1="611" x2="177" y2="611" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="167" y1="616" x2="173" y2="616" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- ============ panel d: waveforms ============ -->

  <line x1="470" y1="445" x2="730" y2="445" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="470" y1="535" x2="730" y2="535" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <text x="426" y="405" fill="#8a8a8a">+V<tspan dy="4" font-size="10">sat</tspan></text>
  <text x="414" y="443" fill="#8a8a8a">+&#946;<tspan dy="4" font-size="10">f</tspan><tspan dy="-4" font-size="13">V</tspan><tspan dy="4" font-size="10">sat</tspan></text>
  <text x="414" y="545" fill="#8a8a8a">&#8722;&#946;<tspan dy="4" font-size="10">f</tspan><tspan dy="-4" font-size="13">V</tspan><tspan dy="4" font-size="10">sat</tspan></text>
  <text x="426" y="585" fill="#8a8a8a">&#8722;V<tspan dy="4" font-size="10">sat</tspan></text>

  <!-- output square wave -->
  <path d="M 480 400 L 540 400 L 540 580 L 600 580 L 600 400 L 660 400 L 660 580 L 720 580"
        fill="none" stroke="#4a90d9" stroke-width="2.4"/>

  <!-- capacitor exponential ramps -->
  <polyline points="480,535 492,508.4 504,487 516,469.8 528,456.1 540,445 552,471.6 564,493 576,510.2 588,523.9 600,535 612,508.4 624,487 636,469.8 648,456.1 660,445 672,471.6 684,493 696,510.2 708,523.9 720,535"
            fill="none" stroke="#e0645c" stroke-width="2.4"/>

  <!-- period marker -->
  <line x1="540" y1="600" x2="660" y2="600" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="540,600 549,596 549,604" fill="#8a8a8a"/>
  <polygon points="660,600 651,596 651,604" fill="#8a8a8a"/>
  <text x="568" y="596" fill="#8a8a8a">T</text>
</svg>
