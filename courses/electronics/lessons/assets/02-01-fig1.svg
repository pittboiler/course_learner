<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Transistor action: electrons injected into a thin, lightly doped base mostly miss it and land in the collector &#8212; and the family of curves that results.</text>

  <text x="20" y="52" fill="#8a8a8a">(a) npn structure</text>
  <text x="390" y="52" fill="#8a8a8a">(b) output characteristics</text>

  <!-- ============ panel a: npn structure ============ -->

  <!-- emitter -->
  <rect x="60" y="120" width="70" height="80" fill="#4a90d9" opacity="0.12"/>
  <rect x="60" y="120" width="70" height="80" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="84" y="145" fill="#4a90d9">n<tspan dy="-5" font-size="10">+</tspan></text>

  <!-- base (thin, highlighted) -->
  <rect x="130" y="120" width="26" height="80" fill="#e0645c" opacity="0.14"/>
  <rect x="130" y="120" width="26" height="80" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="139" y="145" fill="#e0645c">p</text>

  <!-- collector -->
  <rect x="156" y="120" width="100" height="80" fill="#4a90d9" opacity="0.12"/>
  <rect x="156" y="120" width="100" height="80" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="200" y="145" fill="#4a90d9">n</text>

  <!-- emitter lead + current -->
  <line x1="24" y1="160" x2="60" y2="160" stroke="#8a8a8a" stroke-width="2"/>
  <text x="20" y="152" fill="#8a8a8a">E</text>
  <line x1="52" y1="178" x2="28" y2="178" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="28,178 37,174 37,182" fill="#8a8a8a"/>
  <text x="30" y="196" fill="#8a8a8a">I<tspan dy="4" font-size="10">E</tspan></text>

  <!-- collector lead + current -->
  <line x1="256" y1="160" x2="296" y2="160" stroke="#8a8a8a" stroke-width="2"/>
  <text x="290" y="152" fill="#8a8a8a">C</text>
  <line x1="292" y1="178" x2="266" y2="178" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="266,178 275,174 275,182" fill="#8a8a8a"/>
  <text x="268" y="196" fill="#8a8a8a">I<tspan dy="4" font-size="10">C</tspan></text>

  <!-- base lead + current -->
  <line x1="143" y1="82" x2="143" y2="120" stroke="#8a8a8a" stroke-width="2"/>
  <text x="134" y="76" fill="#8a8a8a">B</text>
  <line x1="164" y1="86" x2="164" y2="112" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="164,112 160,103 168,103" fill="#8a8a8a"/>
  <text x="170" y="104" fill="#8a8a8a">I<tspan dy="4" font-size="10">B</tspan></text>

  <!-- electron flow straight through the base -->
  <line x1="72" y1="180" x2="234" y2="180" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="242,180 230,174 230,186" fill="#4a90d9"/>
  <text x="76" y="216" fill="#4a90d9" font-size="11">electron flow (emitter &#8594; collector)</text>

  <!-- the few that recombine, leaving as base current -->
  <line x1="143" y1="176" x2="143" y2="130" stroke="#e0645c" stroke-width="2"/>
  <polygon points="143,122 138,134 148,134" fill="#e0645c"/>

  <!-- annotations -->
  <text x="176" y="98" fill="#e0645c" font-size="11">a few recombine here</text>
  <text x="20" y="248" fill="#8a8a8a" font-size="11">emitter: heavily doped, injects hard</text>
  <text x="20" y="266" fill="#e0645c" font-size="11">base: thin and lightly doped &#8212; almost nothing recombines</text>
  <text x="20" y="284" fill="#8a8a8a" font-size="11">collector: collects whatever crosses the B&#8211;C depletion region</text>
  <text x="20" y="308" fill="#8a8a8a" font-size="11">B&#8211;E junction = left face &#160;&#160; B&#8211;C junction = right face</text>

  <!-- ============ panel b: output characteristics ============ -->

  <!-- saturation shading -->
  <rect x="440" y="80" width="28" height="240" fill="#e0645c" opacity="0.13"/>
  <text x="0" y="0" fill="#e0645c" font-size="11" transform="translate(458,236) rotate(-90)">saturation</text>

  <!-- axes -->
  <line x1="440" y1="320" x2="706" y2="320" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="706,320 696,315 696,325" fill="#8a8a8a"/>
  <line x1="440" y1="330" x2="440" y2="76" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="440,76 435,86 445,86" fill="#8a8a8a"/>
  <text x="664" y="342" fill="#8a8a8a">V<tspan dy="4" font-size="10">CE</tspan></text>
  <text x="418" y="72" fill="#8a8a8a">I<tspan dy="4" font-size="10">C</tspan></text>

  <!-- the I_B family -->
  <path d="M 440 320 C 452 320 462 271 468 265 L 650 249" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <path d="M 440 320 C 452 320 462 226 468 220 L 650 204" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <path d="M 440 320 C 452 320 462 181 468 175 L 650 159" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <path d="M 440 320 C 452 320 462 136 468 130 L 650 114" fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <text x="656" y="252" fill="#4a90d9" font-size="10">15 &#956;A</text>
  <text x="656" y="207" fill="#4a90d9" font-size="10">30 &#956;A</text>
  <text x="656" y="162" fill="#4a90d9" font-size="10">45 &#956;A</text>
  <text x="656" y="117" fill="#4a90d9" font-size="10">60 &#956;A</text>

  <!-- cutoff -->
  <line x1="468" y1="317" x2="650" y2="317" stroke="#8a8a8a" stroke-width="2"/>
  <text x="510" y="340" fill="#8a8a8a" font-size="11">cutoff: I<tspan dy="4" font-size="9">B</tspan><tspan dy="-4" font-size="11"> = 0</tspan></text>

  <!-- active region label -->
  <text x="520" y="292" fill="#8a8a8a" font-size="11">active region: flat lines, I<tspan dy="4" font-size="9">C</tspan><tspan dy="-4" font-size="11"> set by I</tspan><tspan dy="4" font-size="9">B</tspan></text>
  <text x="490" y="100" fill="#8a8a8a" font-size="11">the slight upward tilt is the Early effect</text>
</svg>
