<svg viewBox="0 0 760 368" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="24" y="22" fill="#8a8a8a" font-style="italic">Four diodes fold both half&#8211;cycles upward; the capacitor bridges the gaps. (Ripple exaggerated.)</text>

  <!-- ============ LEFT: full-wave bridge schematic ============ -->

  <text x="22" y="118" fill="#8a8a8a" font-size="12">120 V AC, 60 Hz</text>

  <!-- primary leads -->
  <line x1="25" y1="135" x2="45" y2="135" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="45" y1="135" x2="45" y2="165" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="25" y1="315" x2="45" y2="315" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="45" y1="285" x2="45" y2="315" stroke="#8a8a8a" stroke-width="1.8"/>
  <!-- primary coil (bumps face left) -->
  <path d="M 45 165 A 15 15 0 0 0 45 195 A 15 15 0 0 0 45 225 A 15 15 0 0 0 45 255 A 15 15 0 0 0 45 285"
        fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
  <!-- core -->
  <line x1="62" y1="155" x2="62" y2="295" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="68" y1="155" x2="68" y2="295" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- secondary coil (bumps face right) -->
  <path d="M 88 165 A 15 15 0 0 1 88 195 A 15 15 0 0 1 88 225 A 15 15 0 0 1 88 255 A 15 15 0 0 1 88 285"
        fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="30" y="352" fill="#8a8a8a" font-size="12" font-style="italic">step&#8211;down transformer</text>

  <!-- secondary leads: top to L corner, bottom around to R corner -->
  <line x1="88" y1="145" x2="88" y2="165" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="88" y1="145" x2="155" y2="145" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="155" y1="145" x2="155" y2="235" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="88" y1="285" x2="88" y2="330" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="88" y1="330" x2="295" y2="330" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="295" y1="235" x2="295" y2="330" stroke="#8a8a8a" stroke-width="1.8"/>

  <text x="110" y="238" fill="#e0645c" font-size="13">v</text>
  <text x="119" y="242" fill="#e0645c" font-size="10">s</text>
  <text x="110" y="258" fill="#e0645c" font-size="12">12 V pk</text>

  <!-- diamond edges -->
  <line x1="155" y1="235" x2="225" y2="180" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="295" y1="235" x2="225" y2="180" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="225" y1="290" x2="155" y2="235" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="225" y1="290" x2="295" y2="235" stroke="#8a8a8a" stroke-width="1.8"/>

  <!-- diode symbols: all four point toward the + node -->
  <g transform="translate(190,207.5) rotate(-38.16)">
    <polygon points="-9,-8 -9,8 3,0" fill="#4a90d9"/>
    <line x1="3" y1="-9" x2="3" y2="9" stroke="#4a90d9" stroke-width="2.5"/>
  </g>
  <g transform="translate(260,207.5) rotate(-141.84)">
    <polygon points="-9,-8 -9,8 3,0" fill="#4a90d9"/>
    <line x1="3" y1="-9" x2="3" y2="9" stroke="#4a90d9" stroke-width="2.5"/>
  </g>
  <g transform="translate(190,262.5) rotate(-141.84)">
    <polygon points="-9,-8 -9,8 3,0" fill="#4a90d9"/>
    <line x1="3" y1="-9" x2="3" y2="9" stroke="#4a90d9" stroke-width="2.5"/>
  </g>
  <g transform="translate(260,262.5) rotate(-38.16)">
    <polygon points="-9,-8 -9,8 3,0" fill="#4a90d9"/>
    <line x1="3" y1="-9" x2="3" y2="9" stroke="#4a90d9" stroke-width="2.5"/>
  </g>
  <text x="164" y="192" fill="#4a90d9" font-size="12">D1</text>
  <text x="280" y="192" fill="#4a90d9" font-size="12">D2</text>
  <text x="162" y="288" fill="#4a90d9" font-size="12">D3</text>
  <text x="276" y="288" fill="#4a90d9" font-size="12">D4</text>

  <!-- corner nodes -->
  <circle cx="155" cy="235" r="3" fill="#8a8a8a"/>
  <circle cx="295" cy="235" r="3" fill="#8a8a8a"/>
  <circle cx="225" cy="180" r="3" fill="#8a8a8a"/>
  <circle cx="225" cy="290" r="3" fill="#8a8a8a"/>

  <!-- + rail out of the top node -->
  <line x1="225" y1="150" x2="225" y2="180" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="225" y1="150" x2="402" y2="150" stroke="#8a8a8a" stroke-width="1.8"/>
  <polygon points="356,150 346,145.5 346,154.5" fill="#e0645c"/>
  <text x="338" y="141" fill="#e0645c" font-size="13">I</text>
  <text x="344" y="145" fill="#e0645c" font-size="10">L</text>

  <!-- smoothing capacitor branch -->
  <line x1="320" y1="150" x2="320" y2="196" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="306" y1="196" x2="334" y2="196" stroke="#4a90d9" stroke-width="3"/>
  <line x1="306" y1="208" x2="334" y2="208" stroke="#4a90d9" stroke-width="3"/>
  <line x1="320" y1="208" x2="320" y2="300" stroke="#8a8a8a" stroke-width="1.8"/>
  <circle cx="320" cy="150" r="3" fill="#8a8a8a"/>
  <circle cx="320" cy="300" r="3" fill="#8a8a8a"/>
  <text x="338" y="192" fill="#4a90d9" font-size="13">C</text>
  <text x="338" y="216" fill="#4a90d9" font-size="12">1000 &#956;F</text>

  <!-- load branch -->
  <line x1="402" y1="150" x2="402" y2="190" stroke="#8a8a8a" stroke-width="1.8"/>
  <rect x="389" y="190" width="26" height="40" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="402" y1="230" x2="402" y2="300" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="422" y="204" fill="#8a8a8a" font-size="13">R</text>
  <text x="431" y="208" fill="#8a8a8a" font-size="10">L</text>
  <text x="422" y="226" fill="#8a8a8a" font-size="12">120 &#8486;</text>
  <text x="372" y="172" fill="#8a8a8a" font-size="13">+</text>
  <text x="372" y="292" fill="#8a8a8a" font-size="13">&#8722;</text>

  <!-- minus rail, with a hop where it crosses the secondary return -->
  <line x1="225" y1="290" x2="225" y2="300" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="225" y1="300" x2="288" y2="300" stroke="#8a8a8a" stroke-width="1.8"/>
  <path d="M 288 300 A 7 7 0 0 1 302 300" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="302" y1="300" x2="402" y2="300" stroke="#8a8a8a" stroke-width="1.8"/>

  <!-- ground -->
  <line x1="355" y1="300" x2="355" y2="318" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="345" y1="318" x2="365" y2="318" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="348" y1="324" x2="362" y2="324" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="351" y1="330" x2="359" y2="330" stroke="#8a8a8a" stroke-width="1.2"/>

  <!-- ============ RIGHT: waveform stack ============ -->
  <g transform="translate(60,0)">

    <!-- plot 1: secondary sinusoid -->
    <text x="430" y="52" fill="#8a8a8a" font-size="12">secondary sinusoid &#8212; 60 Hz</text>
    <line x1="424" y1="100" x2="686" y2="100" stroke="#8a8a8a" stroke-width="1.2"/>
    <path d="M 430.0 100.0 L 435.0 90.1 L 440.0 80.7 L 445.0 72.6 L 450.0 66.2 L 455.0 62.0 L 460.0 60.1 L 465.0 60.7 L 470.0 63.8 L 475.0 69.2 L 480.0 76.5 L 485.0 85.3 L 490.0 95.0 L 495.0 105.0 L 500.0 114.7 L 505.0 123.5 L 510.0 130.8 L 515.0 136.2 L 520.0 139.3 L 525.0 139.9 L 530.0 138.0 L 535.0 133.8 L 540.0 127.4 L 545.0 119.3 L 550.0 109.9 L 555.0 100.0 L 560.0 90.1 L 565.0 80.7 L 570.0 72.6 L 575.0 66.2 L 580.0 62.0 L 585.0 60.1 L 590.0 60.7 L 595.0 63.8 L 600.0 69.2 L 605.0 76.5 L 610.0 85.3 L 615.0 95.0 L 620.0 105.0 L 625.0 114.7 L 630.0 123.5 L 635.0 130.8 L 640.0 136.2 L 645.0 139.3 L 650.0 139.9 L 655.0 138.0 L 660.0 133.8 L 665.0 127.4 L 670.0 119.3 L 675.0 109.9 L 680.0 100.0"
          fill="none" stroke="#4a90d9" stroke-width="2.5"/>

    <!-- plot 2: rectified -->
    <text x="430" y="167" fill="#8a8a8a" font-size="12">after the bridge &#8212; 120 Hz, no capacitor</text>
    <line x1="424" y1="215" x2="686" y2="215" stroke="#8a8a8a" stroke-width="1.2"/>
    <path d="M 430.0 215.0 L 432.5 210.0 L 435.0 205.1 L 437.5 200.3 L 440.0 195.7 L 442.5 191.5 L 445.0 187.6 L 447.5 184.2 L 450.0 181.2 L 452.5 178.8 L 455.0 177.0 L 457.5 175.7 L 460.0 175.1 L 462.5 175.1 L 465.0 175.7 L 467.5 177.0 L 470.0 178.8 L 472.5 181.2 L 475.0 184.2 L 477.5 187.6 L 480.0 191.5 L 482.5 195.7 L 485.0 200.3 L 487.5 205.1 L 490.0 210.0 L 492.5 215.0 L 495.0 210.0 L 497.5 205.1 L 500.0 200.3 L 502.5 195.7 L 505.0 191.5 L 507.5 187.6 L 510.0 184.2 L 512.5 181.2 L 515.0 178.8 L 517.5 177.0 L 520.0 175.7 L 522.5 175.1 L 525.0 175.1 L 527.5 175.7 L 530.0 177.0 L 532.5 178.8 L 535.0 181.2 L 537.5 184.2 L 540.0 187.6 L 542.5 191.5 L 545.0 195.7 L 547.5 200.3 L 550.0 205.1 L 552.5 210.0 L 555.0 215.0 L 557.5 210.0 L 560.0 205.1 L 562.5 200.3 L 565.0 195.7 L 567.5 191.5 L 570.0 187.6 L 572.5 184.2 L 575.0 181.2 L 577.5 178.8 L 580.0 177.0 L 582.5 175.7 L 585.0 175.1 L 587.5 175.1 L 590.0 175.7 L 592.5 177.0 L 595.0 178.8 L 597.5 181.2 L 600.0 184.2 L 602.5 187.6 L 605.0 191.5 L 607.5 195.7 L 610.0 200.3 L 612.5 205.1 L 615.0 210.0 L 617.5 215.0 L 620.0 210.0 L 622.5 205.1 L 625.0 200.3 L 627.5 195.7 L 630.0 191.5 L 632.5 187.6 L 635.0 184.2 L 637.5 181.2 L 640.0 178.8 L 642.5 177.0 L 645.0 175.7 L 647.5 175.1 L 650.0 175.1 L 652.5 175.7 L 655.0 177.0 L 657.5 178.8 L 660.0 181.2 L 662.5 184.2 L 665.0 187.6 L 667.5 191.5 L 670.0 195.7 L 672.5 200.3 L 675.0 205.1 L 677.5 210.0 L 680.0 215.0"
          fill="none" stroke="#4a90d9" stroke-width="2.5"/>

    <!-- plot 3: smoothed rail -->
    <text x="430" y="282" fill="#8a8a8a" font-size="12">with the smoothing capacitor &#8212; the DC rail</text>
    <line x1="424" y1="330" x2="686" y2="330" stroke="#8a8a8a" stroke-width="1.2"/>
    <line x1="500" y1="290" x2="640" y2="290" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 430.0 330.0 L 431.2 327.5 L 432.5 325.0 L 433.8 322.5 L 435.0 320.1 L 436.2 317.6 L 437.5 315.3 L 438.8 313.0 L 440.0 310.7 L 441.2 308.6 L 442.5 306.5 L 443.8 304.5 L 445.0 302.6 L 446.2 300.8 L 447.5 299.2 L 448.8 297.6 L 450.0 296.2 L 451.2 294.9 L 452.5 293.8 L 453.8 292.8 L 455.0 292.0 L 456.2 291.3 L 457.5 290.7 L 458.8 290.3 L 460.0 290.1 L 461.2 290.0 L 462.5 290.1 L 463.8 290.3 L 465.0 290.7 L 466.2 291.2 L 467.5 291.6 L 468.8 292.0 L 470.0 292.5 L 471.2 292.9 L 472.5 293.3 L 473.8 293.7 L 475.0 294.1 L 476.2 294.5 L 477.5 294.9 L 478.8 295.3 L 480.0 295.7 L 481.2 296.1 L 482.5 296.5 L 483.8 296.9 L 485.0 297.2 L 486.2 297.6 L 487.5 298.0 L 488.8 298.3 L 490.0 298.7 L 491.2 299.1 L 492.5 299.4 L 493.8 299.7 L 495.0 300.1 L 496.2 300.4 L 497.5 300.8 L 498.8 301.1 L 500.0 301.4 L 501.2 301.7 L 502.5 302.1 L 503.8 302.4 L 505.0 302.7 L 506.2 303.0 L 507.5 302.6 L 508.8 300.8 L 510.0 299.2 L 511.2 297.6 L 512.5 296.2 L 513.8 294.9 L 515.0 293.8 L 516.2 292.8 L 517.5 292.0 L 518.8 291.3 L 520.0 290.7 L 521.2 290.3 L 522.5 290.1 L 523.8 290.0 L 525.0 290.1 L 526.2 290.3 L 527.5 290.7 L 528.8 291.2 L 530.0 291.6 L 531.2 292.0 L 532.5 292.5 L 533.8 292.9 L 535.0 293.3 L 536.2 293.7 L 537.5 294.1 L 538.8 294.5 L 540.0 294.9 L 541.2 295.3 L 542.5 295.7 L 543.8 296.1 L 545.0 296.5 L 546.2 296.9 L 547.5 297.2 L 548.8 297.6 L 550.0 298.0 L 551.2 298.3 L 552.5 298.7 L 553.8 299.1 L 555.0 299.4 L 556.2 299.7 L 557.5 300.1 L 558.8 300.4 L 560.0 300.8 L 561.2 301.1 L 562.5 301.4 L 563.8 301.7 L 565.0 302.1 L 566.2 302.4 L 567.5 302.7 L 568.8 303.0 L 570.0 302.6 L 571.2 300.8 L 572.5 299.2 L 573.8 297.6 L 575.0 296.2 L 576.2 294.9 L 577.5 293.8 L 578.8 292.8 L 580.0 292.0 L 581.2 291.3 L 582.5 290.7 L 583.8 290.3 L 585.0 290.1 L 586.2 290.0 L 587.5 290.1 L 588.8 290.3 L 590.0 290.7 L 591.2 291.2 L 592.5 291.6 L 593.8 292.0 L 595.0 292.5 L 596.2 292.9 L 597.5 293.3 L 598.8 293.7 L 600.0 294.1 L 601.2 294.5 L 602.5 294.9 L 603.8 295.3 L 605.0 295.7 L 606.2 296.1 L 607.5 296.5 L 608.8 296.9 L 610.0 297.2 L 611.2 297.6 L 612.5 298.0 L 613.8 298.3 L 615.0 298.7 L 616.2 299.1 L 617.5 299.4 L 618.8 299.7 L 620.0 300.1 L 621.2 300.4 L 622.5 300.8 L 623.8 301.1 L 625.0 301.4 L 626.2 301.7 L 627.5 302.1 L 628.8 302.4 L 630.0 302.7 L 631.2 303.0 L 632.5 302.6 L 633.8 300.8 L 635.0 299.2 L 636.2 297.6 L 637.5 296.2 L 638.8 294.9 L 640.0 293.8 L 641.2 292.8 L 642.5 292.0 L 643.8 291.3 L 645.0 290.7 L 646.2 290.3 L 647.5 290.1 L 648.8 290.0 L 650.0 290.1 L 651.2 290.3 L 652.5 290.7 L 653.8 291.2 L 655.0 291.6 L 656.2 292.0 L 657.5 292.5 L 658.8 292.9 L 660.0 293.3 L 661.2 293.7 L 662.5 294.1 L 663.8 294.5 L 665.0 294.9 L 666.2 295.3 L 667.5 295.7 L 668.8 296.1 L 670.0 296.5 L 671.2 296.9 L 672.5 297.2 L 673.8 297.6 L 675.0 298.0 L 676.2 298.3 L 677.5 298.7 L 678.8 299.1 L 680.0 299.4"
          fill="none" stroke="#4a90d9" stroke-width="2.5"/>
    <!-- ripple marker -->
    <line x1="568.8" y1="290" x2="568.8" y2="303" stroke="#e0645c" stroke-width="1.6"/>
    <line x1="564" y1="290" x2="573.6" y2="290" stroke="#e0645c" stroke-width="1.6"/>
    <line x1="564" y1="303" x2="573.6" y2="303" stroke="#e0645c" stroke-width="1.6"/>
    <line x1="568.8" y1="303" x2="561" y2="314" stroke="#e0645c" stroke-width="1"/>
    <text x="540" y="325" fill="#e0645c" font-size="13">V</text>
    <text x="549" y="329" fill="#e0645c" font-size="10">r</text>
    <text x="556" y="325" fill="#e0645c" font-size="12">(ripple)</text>
