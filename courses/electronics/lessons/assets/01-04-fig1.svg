<svg viewBox="0 0 660 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="30" y="24" fill="#8a8a8a" font-style="italic" font-size="14">Two diode jobs: carve the waveform flat at a chosen level (a), or pin a rail and let the diode swallow the leftover current (b).</text>

  <text x="30" y="54" fill="#8a8a8a" font-size="14" font-weight="bold">(a) shunt clipper</text>

  <!-- input terminal -->
  <circle cx="62" cy="120" r="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="52" y="112" fill="#8a8a8a" text-anchor="end">v</text>
  <text x="53" y="116" fill="#8a8a8a" font-size="10">i</text>
  <line x1="66" y1="120" x2="92" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- series resistor R -->
  <rect x="92" y="110" width="50" height="20" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="93" y="102" fill="#8a8a8a">R = 1 k&#8486;</text>
  <line x1="142" y1="120" x2="272" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="200" cy="120" r="3" fill="#8a8a8a"/>

  <!-- output terminal -->
  <circle cx="274" cy="120" r="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="282" y="118" fill="#8a8a8a">v</text>
  <text x="291" y="122" fill="#8a8a8a" font-size="10">o</text>

  <!-- clamping branch: diode then bias source -->
  <line x1="200" y1="120" x2="200" y2="146" stroke="#4a90d9" stroke-width="1.8"/>
  <polygon points="190,146 210,146 200,164" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <line x1="187" y1="164" x2="213" y2="164" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="220" y="158" fill="#4a90d9">D</text>
  <line x1="200" y1="164" x2="200" y2="186" stroke="#4a90d9" stroke-width="1.8"/>
  <line x1="184" y1="186" x2="216" y2="186" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="192" y1="194" x2="208" y2="194" stroke="#8a8a8a" stroke-width="2"/>
  <text x="222" y="194" fill="#8a8a8a">V</text>
  <text x="231" y="198" fill="#8a8a8a" font-size="10">B</text>
  <text x="237" y="194" fill="#8a8a8a"> = 3 V</text>
  <line x1="200" y1="194" x2="200" y2="222" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- bottom rail + ground -->
  <line x1="62" y1="222" x2="274" y2="222" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="62" cy="222" r="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="274" cy="222" r="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="120" y1="222" x2="120" y2="234" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="109" y1="234" x2="131" y2="234" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="113" y1="239" x2="127" y2="239" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="117" y1="244" x2="123" y2="244" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- transfer characteristic -->
  <line x1="340" y1="160" x2="632" y2="160" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="632,160 622,155 622,165" fill="#8a8a8a"/>
  <text x="628" y="178" fill="#8a8a8a">v</text>
  <text x="637" y="182" fill="#8a8a8a" font-size="10">i</text>
  <line x1="450" y1="244" x2="450" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="450,52 445,62 455,62" fill="#8a8a8a"/>
  <text x="436" y="52" fill="#8a8a8a" text-anchor="end">v</text>
  <text x="438" y="56" fill="#8a8a8a" font-size="10">o</text>
  <text x="440" y="176" fill="#8a8a8a" text-anchor="end">0</text>

  <!-- unclipped continuation, grey dashed -->
  <line x1="494.4" y1="126.7" x2="618" y2="34" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="600" y="30" fill="#8a8a8a" text-anchor="end" font-size="11">(unclipped)</text>

  <!-- the transfer curve -->
  <path d="M 354 232 L 494.4 126.7 L 618 126.7" fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- clipping level markers -->
  <line x1="494.4" y1="126.7" x2="494.4" y2="160" stroke="#e0645c" stroke-width="1.3" stroke-dasharray="3 4"/>
  <line x1="450" y1="126.7" x2="494.4" y2="126.7" stroke="#e0645c" stroke-width="1.3" stroke-dasharray="3 4"/>
  <text x="498" y="176" fill="#e0645c" font-size="11">3.7 V</text>
  <text x="624" y="112" fill="#e0645c" text-anchor="end" font-size="11">D on: pinned at V_B + 0.7</text>
  <text x="358" y="252" fill="#4a90d9" font-size="11">D off: slope 1</text>

  <text x="30" y="290" fill="#8a8a8a" font-size="14" font-weight="bold">(b) Zener shunt regulator</text>

  <!-- input terminal -->
  <circle cx="100" cy="340" r="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="90" y="336" fill="#8a8a8a" text-anchor="end">V</text>
  <text x="91" y="340" fill="#8a8a8a" font-size="10">in</text>
  <text x="90" y="354" fill="#8a8a8a" text-anchor="end">&#8776; 10 V</text>
  <line x1="104" y1="340" x2="140" y2="340" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- series resistor R_S -->
  <rect x="140" y="330" width="55" height="20" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="140" y="308" fill="#8a8a8a">R</text>
  <text x="149" y="312" fill="#8a8a8a" font-size="10">S</text>
  <text x="155" y="308" fill="#8a8a8a"> = 180 &#8486;</text>
  <line x1="195" y1="340" x2="440" y2="340" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="320" cy="340" r="3" fill="#8a8a8a"/>
  <circle cx="440" cy="340" r="3" fill="#8a8a8a"/>

  <!-- Zener branch -->
  <line x1="320" y1="340" x2="320" y2="368" stroke="#4a90d9" stroke-width="1.8"/>
  <polygon points="310,386 330,386 320,368" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <path d="M 307 375 L 313 368 L 327 368 L 333 361" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <line x1="320" y1="386" x2="320" y2="430" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="346" y="392" fill="#4a90d9">V</text>
  <text x="355" y="396" fill="#4a90d9" font-size="10">Z</text>
  <text x="361" y="392" fill="#4a90d9"> = 5.1 V</text>

  <!-- load branch -->
  <line x1="440" y1="340" x2="440" y2="362" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="425" y="362" width="30" height="42" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="440" y1="404" x2="440" y2="430" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="478" y="392" fill="#8a8a8a">load</text>
  <text x="478" y="408" fill="#8a8a8a">0 to 20 mA</text>

  <!-- bottom rail + ground -->
  <line x1="100" y1="430" x2="440" y2="430" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="100" cy="430" r="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="250" y1="430" x2="250" y2="442" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="239" y1="442" x2="261" y2="442" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="243" y1="447" x2="257" y2="447" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="247" y1="452" x2="253" y2="452" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- current annotations -->
  <line x1="215" y1="322" x2="258" y2="322" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="258,322 249,318 249,326" fill="#e0645c"/>
  <text x="263" y="326" fill="#e0645c">I</text>
  <text x="268" y="330" fill="#e0645c" font-size="10">RS</text>
  <text x="282" y="326" fill="#e0645c"> = 27.2 mA</text>

  <line x1="298" y1="350" x2="298" y2="382" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="298,382 294,373 302,373" fill="#e0645c"/>
  <text x="292" y="370" fill="#e0645c" text-anchor="end">I</text>
  <text x="293" y="374" fill="#e0645c" font-size="10">Z</text>

  <line x1="478" y1="342" x2="478" y2="374" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="478,374 474,365 482,365" fill="#e0645c"/>
  <text x="486" y="362" fill="#e0645c">I</text>
  <text x="491" y="366" fill="#e0645c" font-size="10">L</text>

  <text x="30" y="478" fill="#e0645c" font-size="13">I_RS = I_Z + I_L, and R_S fixes I_RS &#8212; so the Zener absorbs whatever the load leaves behind.</text>
  <text x="30" y="498" fill="#8a8a8a" font-size="12">Worst case for the I_Z minimum: full load. Worst case for the I_Z maximum (and Zener heating): no load at all.</text>
</svg>
