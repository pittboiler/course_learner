<svg viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">

  <text x="28" y="20" fill="#8a8a8a" font-style="italic">(a) The converter replaces a smooth ramp with steps one LSB tall &#8212; the error never leaves a band of &#177;&#189; LSB.</text>
  <text x="28" y="36" fill="#8a8a8a" font-style="italic">(b) The R-2R ladder builds those steps out of exactly two resistor values, repeated.</text>

  <text x="28" y="62" fill="#8a8a8a" font-weight="bold">(a)</text>

  <!-- error band: ramp plus or minus half an LSB -->
  <polygon points="90,216.30 305,75.73 305,96.98 90,237.55" fill="#e0645c" opacity="0.16"/>
  <line x1="90" y1="216.30" x2="305" y2="75.73" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="90" y1="237.55" x2="305" y2="96.98" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- axes -->
  <line x1="70" y1="252" x2="70" y2="74" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,68 65,78 75,78" fill="#8a8a8a"/>
  <line x1="70" y1="240" x2="400" y2="240" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="400,240 390,235 390,245" fill="#8a8a8a"/>
  <text x="78" y="70" fill="#8a8a8a">V<tspan font-size="10" dy="3">out</tspan></text>
  <text x="404" y="245" fill="#8a8a8a">V<tspan font-size="10" dy="3">in</tspan></text>
  <text x="56" y="254" fill="#8a8a8a">0</text>

  <!-- the true analog ramp -->
  <line x1="70" y1="240" x2="313.75" y2="80.625" stroke="#8a8a8a" stroke-width="2"/>

  <!-- the quantized staircase -->
  <path d="M 70 240 H 86.25 V 218.75 H 118.75 V 197.5 H 151.25 V 176.25 H 183.75 V 155 H 216.25 V 133.75 H 248.75 V 112.5 H 281.25 V 91.25 H 313.75"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- one LSB marked between two adjacent code levels -->
  <line x1="281.25" y1="112.5" x2="350" y2="112.5" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="313.75" y1="91.25" x2="350" y2="91.25" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="340" y1="112.5" x2="340" y2="91.25" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="340,91.25 336,99 344,99" fill="#e0645c"/>
  <polygon points="340,112.5 336,105 344,105" fill="#e0645c"/>
  <text x="352" y="106" fill="#e0645c">1 LSB</text>

  <!-- legend -->
  <line x1="70" y1="268" x2="100" y2="268" stroke="#8a8a8a" stroke-width="2"/>
  <text x="106" y="272" fill="#8a8a8a">true analog ramp</text>
  <line x1="232" y1="268" x2="262" y2="268" stroke="#4a90d9" stroke-width="3"/>
  <text x="268" y="272" fill="#4a90d9">quantized output</text>
  <rect x="398" y="261" width="30" height="13" fill="#e0645c" opacity="0.16" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="434" y="272" fill="#e0645c">&#177;&#189; LSB error band</text>

  <text x="28" y="340" fill="#8a8a8a" font-weight="bold">(b)</text>

  <!-- ===== panel b: R-2R ladder ===== -->

  <!-- ground at the terminated end -->
  <line x1="100" y1="380" x2="78" y2="380" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="78" y1="380" x2="78" y2="392" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="70" y1="392" x2="86" y2="392" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="73" y1="397" x2="83" y2="397" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="76" y1="402" x2="80" y2="402" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- terminating 2R -->
  <rect x="100" y="370" width="50" height="20" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="112" y="364" fill="#4a90d9">2R</text>

  <!-- series rail -->
  <line x1="150" y1="380" x2="200" y2="380" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="200" y="370" width="50" height="20" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="219" y="364" fill="#4a90d9">R</text>
  <line x1="250" y1="380" x2="310" y2="380" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="310" y="370" width="50" height="20" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="329" y="364" fill="#4a90d9">R</text>
  <line x1="360" y1="380" x2="420" y2="380" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="420" y="370" width="50" height="20" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="439" y="364" fill="#4a90d9">R</text>
  <line x1="470" y1="380" x2="540" y2="380" stroke="#8a8a8a" stroke-width="1.5"/>

  <circle cx="170" cy="380" r="3.5" fill="#8a8a8a"/>
  <circle cx="280" cy="380" r="3.5" fill="#8a8a8a"/>
  <circle cx="390" cy="380" r="3.5" fill="#8a8a8a"/>
  <circle cx="500" cy="380" r="3.5" fill="#8a8a8a"/>

  <!-- leg b0, switch to ground -->
  <line x1="170" y1="380" x2="170" y2="398" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="159" y="398" width="22" height="42" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="187" y="424" fill="#4a90d9">2R</text>
  <text x="124" y="420" fill="#e0645c">b<tspan font-size="10" dy="3">0</tspan></text>
  <text x="118" y="440" fill="#8a8a8a" font-size="10">LSB</text>
  <line x1="170" y1="440" x2="170" y2="462" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="170" cy="462" r="3" fill="#8a8a8a"/>
  <line x1="170" y1="463" x2="185" y2="483" stroke="#e0645c" stroke-width="2"/>
  <circle cx="154" cy="486" r="3.5" fill="#8a8a8a"/>
  <circle cx="186" cy="486" r="3.5" fill="#8a8a8a"/>
  <line x1="186" y1="486" x2="186" y2="498" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="178" y1="498" x2="194" y2="498" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="181" y1="503" x2="191" y2="503" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="184" y1="508" x2="188" y2="508" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="154" y1="486" x2="154" y2="530" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="154" cy="530" r="3" fill="#8a8a8a"/>

  <!-- leg b1, switch to VREF -->
  <line x1="280" y1="380" x2="280" y2="398" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="269" y="398" width="22" height="42" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="297" y="424" fill="#4a90d9">2R</text>
  <text x="234" y="420" fill="#e0645c">b<tspan font-size="10" dy="3">1</tspan></text>
  <line x1="280" y1="440" x2="280" y2="462" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="280" cy="462" r="3" fill="#8a8a8a"/>
  <line x1="280" y1="463" x2="265" y2="483" stroke="#e0645c" stroke-width="2"/>
  <circle cx="264" cy="486" r="3.5" fill="#8a8a8a"/>
  <circle cx="296" cy="486" r="3.5" fill="#8a8a8a"/>
  <line x1="296" y1="486" x2="296" y2="498" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="288" y1="498" x2="304" y2="498" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="291" y1="503" x2="301" y2="503" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="294" y1="508" x2="298" y2="508" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="264" y1="486" x2="264" y2="530" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="264" cy="530" r="3" fill="#8a8a8a"/>

  <!-- leg b2, switch to ground -->
  <line x1="390" y1="380" x2="390" y2="398" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="379" y="398" width="22" height="42" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="407" y="424" fill="#4a90d9">2R</text>
  <text x="344" y="420" fill="#e0645c">b<tspan font-size="10" dy="3">2</tspan></text>
  <line x1="390" y1="440" x2="390" y2="462" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="390" cy="462" r="3" fill="#8a8a8a"/>
  <line x1="390" y1="463" x2="405" y2="483" stroke="#e0645c" stroke-width="2"/>
  <circle cx="374" cy="486" r="3.5" fill="#8a8a8a"/>
  <circle cx="406" cy="486" r="3.5" fill="#8a8a8a"/>
  <line x1="406" y1="486" x2="406" y2="498" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="398" y1="498" x2="414" y2="498" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="401" y1="503" x2="411" y2="503" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="404" y1="508" x2="408" y2="508" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="374" y1="486" x2="374" y2="530" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="374" cy="530" r="3" fill="#8a8a8a"/>

  <!-- leg b3, switch to VREF -->
  <line x1="500" y1="380" x2="500" y2="398" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="489" y="398" width="22" height="42" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="517" y="424" fill="#4a90d9">2R</text>
  <text x="454" y="420" fill="#e0645c">b<tspan font-size="10" dy="3">3</tspan></text>
  <text x="448" y="440" fill="#8a8a8a" font-size="10">MSB</text>
  <line x1="500" y1="440" x2="500" y2="462" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="500" cy="462" r="3" fill="#8a8a8a"/>
  <line x1="500" y1="463" x2="485" y2="483" stroke="#e0645c" stroke-width="2"/>
  <circle cx="484" cy="486" r="3.5" fill="#8a8a8a"/>
  <circle cx="516" cy="486" r="3.5" fill="#8a8a8a"/>
  <line x1="516" y1="486" x2="516" y2="498" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="508" y1="498" x2="524" y2="498" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="511" y1="503" x2="521" y2="503" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="514" y1="508" x2="518" y2="508" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="484" y1="486" x2="484" y2="530" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="484" cy="530" r="3" fill="#8a8a8a"/>

  <!-- VREF rail -->
  <line x1="105" y1="530" x2="484" y2="530" stroke="#e0645c" stroke-width="1.5"/>
  <text x="56" y="534" fill="#e0645c">V<tspan font-size="10" dy="3">REF</tspan></text>

  <!-- unity-gain buffer -->
  <line x1="540" y1="380" x2="540" y2="368" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="540" y1="368" x2="566" y2="368" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="566,348 566,412 614,380" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="572" y="372" fill="#4a90d9">+</text>
  <text x="572" y="402" fill="#4a90d9">&#8722;</text>
  <line x1="614" y1="380" x2="668" y2="380" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="640" cy="380" r="3" fill="#8a8a8a"/>
  <line x1="640" y1="380" x2="640" y2="424" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="640" y1="424" x2="552" y2="424" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="552" y1="424" x2="552" y2="398" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="552" y1="398" x2="566" y2="398" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="626" y="370" fill="#8a8a8a">V<tspan font-size="10" dy="3">out</tspan></text>

</svg>
