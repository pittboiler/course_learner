<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">A capacitor across the feedback resistor turns the inverting amplifier into a low-pass: flat, then &#8722;20 dB/decade.</text>

  <text x="20" y="52" fill="#8a8a8a">(a) inverting first-order active low-pass</text>
  <text x="470" y="52" fill="#8a8a8a">(b) its Bode magnitude</text>

  <!-- ================= panel a: schematic ================= -->

  <!-- input source label and wire -->
  <text x="24" y="166" fill="#8a8a8a">v<tspan dy="4" font-size="10">in</tspan></text>
  <line x1="62" y1="170" x2="100" y2="170" stroke="#8a8a8a" stroke-width="1.8"/>

  <!-- R1 -->
  <rect x="100" y="160" width="52" height="20" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="98" y="153" fill="#8a8a8a">R<tspan dy="4" font-size="10">1</tspan><tspan dy="-4"> = 10 k&#8486;</tspan></text>
  <line x1="152" y1="170" x2="250" y2="170" stroke="#8a8a8a" stroke-width="1.8"/>

  <!-- summing node -->
  <circle cx="210" cy="170" r="3.5" fill="#e0645c"/>
  <line x1="210" y1="174" x2="210" y2="252" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="118" y="270" fill="#e0645c" font-size="11">virtual ground: this node sits at 0 V</text>

  <!-- op-amp triangle -->
  <polygon points="250,150 250,230 310,190" fill="#4a90d9" opacity="0.12"/>
  <polygon points="250,150 250,230 310,190" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="256" y="175" fill="#4a90d9" font-size="15">&#8722;</text>
  <text x="256" y="216" fill="#4a90d9" font-size="15">+</text>

  <!-- non-inverting input to ground -->
  <line x1="250" y1="210" x2="222" y2="210" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="222" y1="210" x2="222" y2="244" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="212" y1="244" x2="232" y2="244" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="215" y1="249" x2="229" y2="249" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="218" y1="254" x2="226" y2="254" stroke="#8a8a8a" stroke-width="1.2"/>

  <!-- output wire -->
  <line x1="310" y1="190" x2="400" y2="190" stroke="#8a8a8a" stroke-width="1.8"/>
  <circle cx="350" cy="190" r="3.5" fill="#8a8a8a"/>
  <text x="358" y="212" fill="#8a8a8a">v<tspan dy="4" font-size="10">out</tspan></text>

  <!-- feedback rails (coral = feedback network) -->
  <line x1="210" y1="170" x2="210" y2="100" stroke="#e0645c" stroke-width="1.8"/>
  <line x1="350" y1="190" x2="350" y2="100" stroke="#e0645c" stroke-width="1.8"/>

  <!-- Rf branch -->
  <line x1="210" y1="100" x2="258" y2="100" stroke="#e0645c" stroke-width="1.8"/>
  <rect x="258" y="90" width="52" height="20" fill="none" stroke="#e0645c" stroke-width="1.8"/>
  <text x="246" y="82" fill="#e0645c">R<tspan dy="4" font-size="10">f</tspan><tspan dy="-4"> = 100 k&#8486;</tspan></text>
  <line x1="310" y1="100" x2="350" y2="100" stroke="#e0645c" stroke-width="1.8"/>

  <!-- Cf branch (parallel with Rf) -->
  <line x1="210" y1="140" x2="268" y2="140" stroke="#e0645c" stroke-width="1.8"/>
  <line x1="268" y1="128" x2="268" y2="152" stroke="#e0645c" stroke-width="3"/>
  <line x1="277" y1="128" x2="277" y2="152" stroke="#e0645c" stroke-width="3"/>
  <line x1="277" y1="140" x2="350" y2="140" stroke="#e0645c" stroke-width="1.8"/>
  <text x="286" y="134" fill="#e0645c">C<tspan dy="4" font-size="10">f</tspan><tspan dy="-4"> = 1.5 nF</tspan></text>

  <!-- annotation -->
  <text x="20" y="300" fill="#8a8a8a" font-size="11">At DC the cap is an open: gain = &#8722;R<tspan dy="4" font-size="9">f</tspan><tspan dy="-4">/R</tspan><tspan dy="4" font-size="9">1</tspan><tspan dy="-4"> = &#8722;10.</tspan></text>
  <text x="20" y="320" fill="#8a8a8a" font-size="11">As f rises, Z<tspan dy="4" font-size="9">f</tspan><tspan dy="-4"> = R</tspan><tspan dy="4" font-size="9">f</tspan><tspan dy="-4"> &#8741; 1/sC</tspan><tspan dy="4" font-size="9">f</tspan><tspan dy="-4"> shrinks &#8212; and so does the gain.</tspan></text>

  <!-- ================= panel b: Bode magnitude ================= -->

  <!-- axes -->
  <line x1="470" y1="300" x2="768" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="768,300 758,295 758,305" fill="#8a8a8a"/>
  <line x1="470" y1="310" x2="470" y2="76" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="470,76 465,86 475,86" fill="#8a8a8a"/>
  <text x="436" y="72" fill="#8a8a8a" font-size="11">|H| (dB)</text>
  <text x="672" y="342" fill="#8a8a8a" font-size="11">f (Hz, log scale)</text>

  <!-- dB gridline labels -->
  <text x="440" y="124" fill="#8a8a8a" font-size="11">20</text>
  <text x="448" y="204" fill="#8a8a8a" font-size="11">0</text>
  <text x="432" y="284" fill="#8a8a8a" font-size="11">&#8722;20</text>

  <!-- decade ticks -->
  <line x1="490" y1="300" x2="490" y2="305" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="570" y1="300" x2="570" y2="305" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="650" y1="300" x2="650" y2="305" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="730" y1="300" x2="730" y2="305" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="478" y="318" fill="#8a8a8a" font-size="11">100</text>
  <text x="560" y="318" fill="#8a8a8a" font-size="11">1k</text>
  <text x="638" y="318" fill="#8a8a8a" font-size="11">10k</text>
  <text x="716" y="318" fill="#8a8a8a" font-size="11">100k</text>

  <!-- asymptotes -->
  <line x1="470" y1="120" x2="570" y2="120" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="570" y1="120" x2="730" y2="280" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- true magnitude curve -->
  <path d="M 470 120.1 L 490 120.2 L 530 121.7 L 570 132.1 L 594 148.0 L 610 161.6 L 650 200.2 L 690 240.0 L 730 280.0"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- corner marker -->
  <line x1="570" y1="300" x2="570" y2="132.1" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="470" y1="132.1" x2="570" y2="132.1" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="3 4"/>
  <circle cx="570" cy="132.1" r="4.5" fill="#e0645c"/>
  <text x="580" y="128" fill="#e0645c" font-size="11">&#8722;3 dB point (17 dB)</text>
  <text x="516" y="290" fill="#e0645c" font-size="11">f<tspan dy="4" font-size="9">c</tspan><tspan dy="-4"> = 1 kHz</tspan></text>

  <!-- labels on the response -->
  <text x="486" y="110" fill="#8a8a8a" font-size="11">flat at 20 dB (gain of 10)</text>
  <text x="622" y="180" fill="#8a8a8a" font-size="11">&#8722;20 dB/decade</text>
</svg>
