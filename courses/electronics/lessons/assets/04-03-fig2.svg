<svg viewBox="0 0 780 428" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">The CMOS recipe: NMOS pull-down in series, PMOS pull-up in parallel. Bubble = PMOS.</text>

  <!-- ============================ NAND ============================ -->

  <line x1="190" y1="50" x2="190" y2="70" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="172" y1="50" x2="208" y2="50" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="214" y="54" fill="#8a8a8a" font-size="12">V<tspan font-size="10" dy="3">DD</tspan></text>
  <line x1="150" y1="70" x2="230" y2="70" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="190" cy="70" r="3.5" fill="#8a8a8a"/>

  <!-- PMOS A (parallel pull-up) -->
  <line x1="150" y1="70" x2="150" y2="96" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="150" y1="96" x2="150" y2="134" stroke="#4a90d9" stroke-width="3.5"/>
  <line x1="140" y1="100" x2="140" y2="130" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="133" cy="115" r="5" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="128" y1="115" x2="55" y2="115" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="150" y1="134" x2="150" y2="210" stroke="#8a8a8a" stroke-width="2"/>

  <!-- PMOS B (parallel pull-up) -->
  <line x1="230" y1="70" x2="230" y2="150" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="230" y1="150" x2="230" y2="188" stroke="#4a90d9" stroke-width="3.5"/>
  <line x1="220" y1="154" x2="220" y2="184" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="213" cy="169" r="5" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="208" y1="169" x2="80" y2="169" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="230" y1="188" x2="230" y2="210" stroke="#8a8a8a" stroke-width="2"/>

  <!-- output node -->
  <line x1="150" y1="210" x2="230" y2="210" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="190" cy="210" r="3.5" fill="#8a8a8a"/>
  <circle cx="230" cy="210" r="3.5" fill="#8a8a8a"/>
  <line x1="230" y1="210" x2="320" y2="210" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="326" y="214" fill="#e0645c">Y</text>

  <!-- NMOS A over NMOS B (series pull-down) -->
  <line x1="190" y1="210" x2="190" y2="230" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="190" y1="230" x2="190" y2="276" stroke="#4a90d9" stroke-width="3.5"/>
  <line x1="180" y1="234" x2="180" y2="272" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="180" y1="253" x2="55" y2="253" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="190" y1="276" x2="190" y2="300" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="190" y1="300" x2="190" y2="346" stroke="#4a90d9" stroke-width="3.5"/>
  <line x1="180" y1="304" x2="180" y2="342" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="180" y1="323" x2="80" y2="323" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="190" y1="346" x2="190" y2="372" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="172" y1="372" x2="208" y2="372" stroke="#8a8a8a" stroke-width="2.5"/>
  <line x1="178" y1="377" x2="202" y2="377" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="184" y1="382" x2="196" y2="382" stroke="#8a8a8a" stroke-width="2"/>

  <!-- input rails -->
  <line x1="55" y1="95" x2="55" y2="253" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="55" cy="115" r="3.5" fill="#8a8a8a"/>
  <text x="55" y="88" fill="#e0645c" text-anchor="middle">A</text>
  <line x1="80" y1="95" x2="80" y2="323" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="80" cy="169" r="3.5" fill="#8a8a8a"/>
  <text x="80" y="88" fill="#e0645c" text-anchor="middle">B</text>

  <text x="190" y="414" fill="#8a8a8a" font-size="12" text-anchor="middle">NAND &#8212; NMOS in series, PMOS in parallel</text>

  <!-- ============================ NOR ============================ -->

  <line x1="560" y1="50" x2="560" y2="78" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="542" y1="50" x2="578" y2="50" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="584" y="54" fill="#8a8a8a" font-size="12">V<tspan font-size="10" dy="3">DD</tspan></text>

  <!-- PMOS A over PMOS B (series pull-up) -->
  <line x1="560" y1="78" x2="560" y2="124" stroke="#4a90d9" stroke-width="3.5"/>
  <line x1="550" y1="82" x2="550" y2="120" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="543" cy="101" r="5" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="538" y1="101" x2="425" y2="101" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="560" y1="124" x2="560" y2="148" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="560" y1="148" x2="560" y2="194" stroke="#4a90d9" stroke-width="3.5"/>
  <line x1="550" y1="152" x2="550" y2="190" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="543" cy="171" r="5" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="538" y1="171" x2="450" y2="171" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="560" y1="194" x2="560" y2="230" stroke="#8a8a8a" stroke-width="2"/>

  <!-- output node -->
  <line x1="520" y1="230" x2="600" y2="230" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="560" cy="230" r="3.5" fill="#8a8a8a"/>
  <circle cx="600" cy="230" r="3.5" fill="#8a8a8a"/>
  <line x1="600" y1="230" x2="690" y2="230" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="696" y="234" fill="#e0645c">Y</text>

  <!-- NMOS A parallel NMOS B (parallel pull-down) -->
  <line x1="520" y1="230" x2="520" y2="250" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="520" y1="250" x2="520" y2="296" stroke="#4a90d9" stroke-width="3.5"/>
  <line x1="510" y1="254" x2="510" y2="292" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="510" y1="273" x2="425" y2="273" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="520" y1="296" x2="520" y2="372" stroke="#8a8a8a" stroke-width="2"/>

  <line x1="600" y1="230" x2="600" y2="306" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="600" y1="306" x2="600" y2="352" stroke="#4a90d9" stroke-width="3.5"/>
  <line x1="590" y1="310" x2="590" y2="348" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="590" y1="329" x2="450" y2="329" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="600" y1="352" x2="600" y2="372" stroke="#8a8a8a" stroke-width="2"/>

  <line x1="520" y1="372" x2="600" y2="372" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="560" cy="372" r="3.5" fill="#8a8a8a"/>
  <line x1="560" y1="372" x2="560" y2="384" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="542" y1="384" x2="578" y2="384" stroke="#8a8a8a" stroke-width="2.5"/>
  <line x1="548" y1="389" x2="572" y2="389" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="554" y1="394" x2="566" y2="394" stroke="#8a8a8a" stroke-width="2"/>

  <!-- input rails -->
  <line x1="425" y1="88" x2="425" y2="273" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="425" cy="101" r="3.5" fill="#8a8a8a"/>
  <text x="425" y="80" fill="#e0645c" text-anchor="middle">A</text>
  <line x1="450" y1="88" x2="450" y2="329" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="450" cy="171" r="3.5" fill="#8a8a8a"/>
  <text x="450" y="80" fill="#e0645c" text-anchor="middle">B</text>

  <text x="560" y="414" fill="#8a8a8a" font-size="12" text-anchor="middle">NOR &#8212; NMOS in parallel, PMOS in series</text>
</svg>
