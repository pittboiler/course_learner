<svg viewBox="0 0 620 290" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="30" y="20" fill="#8a8a8a" font-style="italic">One node, three inputs. X sits at 0 V, so each current depends only on its own resistor.</text>

  <!-- === input branch 1 === -->
  <circle cx="55" cy="62" r="4" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="24" y="67" fill="#8a8a8a">v</text>
  <text x="33" y="71" fill="#8a8a8a" font-size="10">1</text>
  <line x1="59" y1="62" x2="95" y2="62" stroke="#8a8a8a" stroke-width="2"/>
  <rect x="95" y="51" width="60" height="22" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="114" y="46" fill="#8a8a8a">R</text>
  <text x="124" y="50" fill="#8a8a8a" font-size="10">1</text>
  <line x1="155" y1="62" x2="300" y2="62" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="215" y1="62" x2="248" y2="62" stroke="#e0645c" stroke-width="2"/>
  <polygon points="253,62 243,57 243,67" fill="#e0645c"/>
  <text x="218" y="54" fill="#e0645c">i</text>
  <text x="223" y="58" fill="#e0645c" font-size="10">1</text>

  <!-- === input branch 2 === -->
  <circle cx="55" cy="106" r="4" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="24" y="111" fill="#8a8a8a">v</text>
  <text x="33" y="115" fill="#8a8a8a" font-size="10">2</text>
  <line x1="59" y1="106" x2="95" y2="106" stroke="#8a8a8a" stroke-width="2"/>
  <rect x="95" y="95" width="60" height="22" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="114" y="90" fill="#8a8a8a">R</text>
  <text x="124" y="94" fill="#8a8a8a" font-size="10">2</text>
  <line x1="155" y1="106" x2="300" y2="106" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="215" y1="106" x2="248" y2="106" stroke="#e0645c" stroke-width="2"/>
  <polygon points="253,106 243,101 243,111" fill="#e0645c"/>
  <text x="218" y="98" fill="#e0645c">i</text>
  <text x="223" y="102" fill="#e0645c" font-size="10">2</text>

  <!-- === input branch 3 === -->
  <circle cx="55" cy="150" r="4" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="24" y="155" fill="#8a8a8a">v</text>
  <text x="33" y="159" fill="#8a8a8a" font-size="10">3</text>
  <line x1="59" y1="150" x2="95" y2="150" stroke="#8a8a8a" stroke-width="2"/>
  <rect x="95" y="139" width="60" height="22" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="114" y="134" fill="#8a8a8a">R</text>
  <text x="124" y="138" fill="#8a8a8a" font-size="10">3</text>
  <line x1="155" y1="150" x2="300" y2="150" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="215" y1="150" x2="248" y2="150" stroke="#e0645c" stroke-width="2"/>
  <polygon points="253,150 243,145 243,155" fill="#e0645c"/>
  <text x="218" y="142" fill="#e0645c">i</text>
  <text x="223" y="146" fill="#e0645c" font-size="10">3</text>

  <!-- === summing bus === -->
  <line x1="300" y1="62" x2="300" y2="150" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="300" cy="62" r="4" fill="#8a8a8a"/>
  <line x1="300" y1="106" x2="340" y2="106" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="300" cy="106" r="5" fill="#e0645c"/>
  <text x="308" y="92" fill="#e0645c" font-weight="bold">X</text>

  <!-- === op-amp === -->
  <polygon points="340,72 340,208 410,140" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <line x1="348" y1="106" x2="360" y2="106" stroke="#4a90d9" stroke-width="2"/>
  <line x1="348" y1="174" x2="360" y2="174" stroke="#4a90d9" stroke-width="2"/>
  <line x1="354" y1="168" x2="354" y2="180" stroke="#4a90d9" stroke-width="2"/>

  <!-- === non-inverting input to ground === -->
  <line x1="340" y1="174" x2="265" y2="174" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="265" y1="174" x2="265" y2="222" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="253" y1="222" x2="277" y2="222" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="257" y1="227" x2="273" y2="227" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="261" y1="232" x2="269" y2="232" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- === feedback path === -->
  <line x1="300" y1="62" x2="300" y2="40" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="300" y1="40" x2="350" y2="40" stroke="#8a8a8a" stroke-width="2"/>
  <rect x="350" y="29" width="60" height="22" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="368" y="64" fill="#8a8a8a">R</text>
  <text x="378" y="68" fill="#8a8a8a" font-size="10">f</text>
  <line x1="410" y1="40" x2="460" y2="40" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="460" y1="40" x2="460" y2="140" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="460" y1="70" x2="460" y2="99" stroke="#e0645c" stroke-width="2"/>
  <polygon points="460,105 455,95 465,95" fill="#e0645c"/>
  <text x="468" y="92" fill="#e0645c">i</text>
  <text x="473" y="96" fill="#e0645c" font-size="10">f</text>

  <!-- === output === -->
  <line x1="410" y1="140" x2="520" y2="140" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="460" cy="140" r="4" fill="#8a8a8a"/>
  <text x="526" y="145" fill="#4a90d9">v</text>
  <text x="535" y="149" fill="#4a90d9" font-size="10">out</text>

  <text x="30" y="268" fill="#e0645c" font-style="italic">KCL at X: i1 plus i2 plus i3 all leave through Rf, and X never budges from 0 V.</text>
</svg>
