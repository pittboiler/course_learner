<svg viewBox="0 0 660 318" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="80" y="24" fill="#8a8a8a" font-style="italic" font-size="13">Each closed-loop gain line cuts the open-loop rolloff at that circuit's bandwidth &#8212; gain &#215; bandwidth is always 1 MHz.</text>

  <!-- axes -->
  <line x1="80" y1="265" x2="620" y2="265" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="620,265 610,260 610,270" fill="#8a8a8a"/>
  <text x="626" y="270" fill="#8a8a8a">f</text>
  <line x1="80" y1="275" x2="80" y2="60" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="80,60 75,70 85,70" fill="#8a8a8a"/>
  <text x="46" y="52" fill="#8a8a8a">|A| (dB)</text>

  <!-- dB ticks -->
  <line x1="75" y1="237.1" x2="80" y2="237.1" stroke="#8a8a8a" stroke-width="1"/>
  <text x="70" y="241.5" fill="#8a8a8a" text-anchor="end" font-size="12">0</text>
  <line x1="75" y1="209.3" x2="80" y2="209.3" stroke="#8a8a8a" stroke-width="1"/>
  <text x="70" y="213.6" fill="#8a8a8a" text-anchor="end" font-size="12">20</text>
  <line x1="75" y1="181.4" x2="80" y2="181.4" stroke="#8a8a8a" stroke-width="1"/>
  <text x="70" y="185.8" fill="#8a8a8a" text-anchor="end" font-size="12">40</text>
  <line x1="75" y1="153.6" x2="80" y2="153.6" stroke="#8a8a8a" stroke-width="1"/>
  <text x="70" y="158" fill="#8a8a8a" text-anchor="end" font-size="12">60</text>
  <line x1="75" y1="125.7" x2="80" y2="125.7" stroke="#8a8a8a" stroke-width="1"/>
  <text x="70" y="130" fill="#8a8a8a" text-anchor="end" font-size="12">80</text>
  <line x1="75" y1="97.9" x2="80" y2="97.9" stroke="#8a8a8a" stroke-width="1"/>
  <text x="70" y="102" fill="#8a8a8a" text-anchor="end" font-size="12">100</text>

  <!-- decade ticks and labels -->
  <line x1="80" y1="265" x2="80" y2="270" stroke="#8a8a8a" stroke-width="1"/>
  <text x="80" y="282" fill="#8a8a8a" text-anchor="middle" font-size="12">1</text>
  <line x1="154.3" y1="265" x2="154.3" y2="270" stroke="#8a8a8a" stroke-width="1"/>
  <text x="154.3" y="282" fill="#8a8a8a" text-anchor="middle" font-size="12">10</text>
  <line x1="228.6" y1="265" x2="228.6" y2="270" stroke="#8a8a8a" stroke-width="1"/>
  <text x="228.6" y="282" fill="#8a8a8a" text-anchor="middle" font-size="12">100</text>
  <line x1="302.9" y1="265" x2="302.9" y2="270" stroke="#8a8a8a" stroke-width="1"/>
  <text x="302.9" y="282" fill="#8a8a8a" text-anchor="middle" font-size="12">1k</text>
  <line x1="377.1" y1="265" x2="377.1" y2="270" stroke="#8a8a8a" stroke-width="1"/>
  <text x="377.1" y="282" fill="#e0645c" text-anchor="middle" font-size="12">10k</text>
  <line x1="451.4" y1="265" x2="451.4" y2="270" stroke="#8a8a8a" stroke-width="1"/>
  <text x="451.4" y="282" fill="#8a8a8a" text-anchor="middle" font-size="12">100k</text>
  <line x1="525.7" y1="265" x2="525.7" y2="270" stroke="#8a8a8a" stroke-width="1"/>
  <text x="525.7" y="282" fill="#8a8a8a" text-anchor="middle" font-size="12">1M</text>
  <line x1="600" y1="265" x2="600" y2="270" stroke="#8a8a8a" stroke-width="1"/>
  <text x="600" y="282" fill="#8a8a8a" text-anchor="middle" font-size="12">10M</text>

  <!-- closed-loop gain lines: grey for 10 and 1, coral for 100 -->
  <line x1="80" y1="209.3" x2="451.4" y2="209.3" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="451.4" y1="209.3" x2="451.4" y2="265" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="451.4" cy="209.3" r="3.5" fill="#8a8a8a"/>
  <text x="86" y="204" fill="#8a8a8a" font-size="12">A<tspan dy="3" font-size="10">CL</tspan><tspan dy="-3" font-size="12"> = 10</tspan></text>

  <line x1="80" y1="237.1" x2="525.7" y2="237.1" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="525.7" y1="237.1" x2="525.7" y2="265" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="525.7" cy="237.1" r="3.5" fill="#8a8a8a"/>
  <text x="86" y="232" fill="#8a8a8a" font-size="12">A<tspan dy="3" font-size="10">CL</tspan><tspan dy="-3" font-size="12"> = 1 (buffer)</tspan></text>

  <line x1="80" y1="181.4" x2="377.1" y2="181.4" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="377.1" y1="181.4" x2="377.1" y2="265" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="377.1" cy="181.4" r="4.5" fill="#e0645c"/>
  <text x="86" y="176" fill="#e0645c" font-size="12">A<tspan dy="3" font-size="10">CL</tspan><tspan dy="-3" font-size="12"> = 100</tspan></text>

  <!-- open-loop magnitude -->
  <path d="M 80 89.5 L 131.9 89.5 L 600 265" fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- annotations -->
  <text x="84" y="82" fill="#4a90d9" font-size="12">A<tspan dy="3" font-size="10">0</tspan><tspan dy="-3" font-size="12"> = 2&#215;10</tspan><tspan dy="-4" font-size="10">5</tspan><tspan dy="4" font-size="12">, i.e. 106 dB</tspan></text>
  <line x1="131.9" y1="92" x2="131.9" y2="140" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="137" y="152" fill="#8a8a8a" font-size="12">f<tspan dy="3" font-size="10">p</tspan><tspan dy="-3" font-size="12"> = 5 Hz (open loop)</tspan></text>
  <text x="255" y="112" fill="#4a90d9" font-size="12">slope &#8722;20 dB/decade</text>

  <text x="373" y="303" fill="#e0645c" font-size="12" text-anchor="end">bandwidth of the gain-100 amp &#8594;</text>
  <text x="620" y="303" fill="#8a8a8a" font-size="12" text-anchor="end">f<tspan dy="3" font-size="10">t</tspan><tspan dy="-3" font-size="12"> = GBW = 1 MHz</tspan></text>
</svg>
