<svg viewBox="0 0 940 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-style="italic" font-size="14">Three rungs of one ladder. Blue is the true exponential; coral is the model that replaces it. Climb only as high as your question requires.</text>

  <text x="58" y="56" fill="#8a8a8a" font-size="14">(1) ideal switch</text>
  <text x="58" y="74" fill="#8a8a8a" font-size="11">on: 0 V drop &#160;&#160;off: open</text>
  <line x1="60" y1="250" x2="292" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="292,250 283,246 283,254" fill="#8a8a8a"/>
  <text x="286" y="270" fill="#8a8a8a" font-size="11">V<tspan font-size="9" dy="4">D</tspan></text>
  <line x1="80" y1="266" x2="80" y2="104" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="80,104 76,113 84,113" fill="#8a8a8a"/>
  <text x="74" y="100" fill="#8a8a8a" text-anchor="end" font-size="11">I<tspan font-size="9" dy="4">D</tspan></text>
  <path d="M 80 250 L 167.5 250 L 178.4 249.8 L 189.4 247.7 L 193.7 244.2 L 197 238.3 L 200.3 226.7 L 203.6 203.3 L 205.5 180 L 206.9 156.7 L 207.9 133.3 L 208.8 110"
        fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <path d="M 62 250 L 80 250 L 80 110" fill="none" stroke="#e0645c" stroke-width="3"/>
  <line x1="106" y1="300" x2="132" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="134" cy="300" r="3" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="136" y1="299" x2="160" y2="291" stroke="#e0645c" stroke-width="2.5"/>
  <circle cx="162" cy="300" r="3" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="164" y1="300" x2="190" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="148" y="326" fill="#8a8a8a" text-anchor="middle" font-size="11">a plain switch</text>
  <text x="58" y="356" fill="#8a8a8a" font-size="11">Use for: sanity checks, logic levels.</text>

  <text x="368" y="56" fill="#8a8a8a" font-size="14">(2) constant-voltage-drop</text>
  <text x="368" y="74" fill="#8a8a8a" font-size="11">on: 0.7 V &#160;&#160;off: open</text>
  <line x1="370" y1="250" x2="602" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="602,250 593,246 593,254" fill="#8a8a8a"/>
  <text x="596" y="270" fill="#8a8a8a" font-size="11">V<tspan font-size="9" dy="4">D</tspan></text>
  <line x1="390" y1="266" x2="390" y2="104" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="390,104 386,113 394,113" fill="#8a8a8a"/>
  <text x="384" y="100" fill="#8a8a8a" text-anchor="end" font-size="11">I<tspan font-size="9" dy="4">D</tspan></text>
  <path d="M 390 250 L 477.5 250 L 488.4 249.8 L 499.4 247.7 L 503.7 244.2 L 507 238.3 L 510.3 226.7 L 513.6 203.3 L 515.5 180 L 516.9 156.7 L 517.9 133.3 L 518.8 110"
        fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <path d="M 372 250 L 523 250 L 523 110" fill="none" stroke="#e0645c" stroke-width="3"/>
  <line x1="523" y1="250" x2="523" y2="257" stroke="#e0645c" stroke-width="1.5"/>
  <text x="529" y="268" fill="#e0645c" font-size="11">0.7 V</text>
  <line x1="434" y1="300" x2="462" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="462" y1="288" x2="462" y2="312" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="470" y1="293" x2="470" y2="307" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="470" y1="300" x2="498" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="466" y="326" fill="#8a8a8a" text-anchor="middle" font-size="11">a 0.7 V battery</text>
  <text x="368" y="356" fill="#8a8a8a" font-size="11">Use for: DC bias points. The workhorse.</text>

  <text x="678" y="56" fill="#8a8a8a" font-size="14">(3) small-signal</text>
  <text x="678" y="74" fill="#8a8a8a" font-size="11">tangent at a fixed bias I<tspan font-size="9" dy="4">D</tspan></text>
  <line x1="690" y1="250" x2="908" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="908,250 899,246 899,254" fill="#8a8a8a"/>
  <line x1="700" y1="266" x2="700" y2="104" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="700,104 696,113 704,113" fill="#8a8a8a"/>
  <text x="694" y="100" fill="#8a8a8a" text-anchor="end" font-size="11">I<tspan font-size="9" dy="4">D</tspan> (mA)</text>
  <line x1="747.5" y1="250" x2="747.5" y2="256" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="795" y1="250" x2="795" y2="256" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="842.5" y1="250" x2="842.5" y2="256" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="890" y1="250" x2="890" y2="256" stroke="#8a8a8a" stroke-width="1"/>
  <text x="747.5" y="268" fill="#8a8a8a" text-anchor="middle" font-size="10">0.60</text>
  <text x="795" y="268" fill="#8a8a8a" text-anchor="middle" font-size="10">0.62</text>
  <text x="842.5" y="268" fill="#8a8a8a" text-anchor="middle" font-size="10">0.64</text>
  <text x="890" y="268" fill="#8a8a8a" text-anchor="middle" font-size="10">0.66</text>
  <text x="828" y="284" fill="#8a8a8a" text-anchor="middle" font-size="10">V<tspan font-size="9" dy="3">D</tspan><tspan dy="-3"> (V) &#8212; zoomed on the knee</tspan></text>
  <line x1="700" y1="203.3" x2="694" y2="203.3" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="700" y1="156.7" x2="694" y2="156.7" stroke="#8a8a8a" stroke-width="1"/>
  <text x="690" y="207" fill="#8a8a8a" text-anchor="end" font-size="10">1</text>
  <text x="690" y="160" fill="#8a8a8a" text-anchor="end" font-size="10">2</text>
  <path d="M 700 244.4 L 747.5 237.6 L 771.25 231.6 L 795 222.5 L 818.75 208.9 L 826.35 203.3 L 842.5 188.8 L 866.25 158.7 L 878.1 138.4 L 890 113.7"
        fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <line x1="766.9" y1="250" x2="890" y2="153.3" stroke="#e0645c" stroke-width="3"/>
  <circle cx="826.35" cy="203.3" r="5.5" fill="#e0645c"/>
  <text x="710" y="120" fill="#4a90d9" font-size="11">tangent slope = 1/r<tspan font-size="9" dy="4">d</tspan><tspan dy="-4"> = I</tspan><tspan font-size="9" dy="4">D</tspan><tspan dy="-4">/V</tspan><tspan font-size="9" dy="4">T</tspan></text>
  <text x="710" y="138" fill="#e0645c" font-size="11">r<tspan font-size="9" dy="4">d</tspan><tspan dy="-4"> = 25 mV / 1 mA = 25 &#8486;</tspan></text>
  <text x="820" y="196" fill="#e0645c" text-anchor="end" font-size="11">Q at I<tspan font-size="9" dy="4">D</tspan><tspan dy="-4"> = 1 mA</tspan></text>
  <line x1="748" y1="300" x2="774" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="774" y="292" width="34" height="16" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="808" y1="300" x2="834" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="791" y="326" fill="#8a8a8a" text-anchor="middle" font-size="11">a resistor r<tspan font-size="9" dy="4">d</tspan></text>
  <text x="678" y="356" fill="#8a8a8a" font-size="11">Use for: a small AC wiggle on a DC bias.</text>
</svg>
