<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">

  <text x="30" y="22" fill="#8a8a8a" font-size="12" font-style="italic">The gate builds the channel; V<tspan font-size="10" dy="3">DS</tspan><tspan dy="-3"> eats it away at the drain end</tspan> &#8212; pinch-off is the triode/saturation line.</text>

  <text x="40" y="48" fill="#8a8a8a" font-size="13" font-weight="bold">(a) NMOS cross-section, biased in saturation</text>
  <text x="400" y="48" fill="#8a8a8a" font-size="13" font-weight="bold">(b) output characteristics: I<tspan font-size="10" dy="3">D</tspan><tspan dy="-3"> vs V</tspan><tspan font-size="10" dy="3">DS</tspan></text>

  <rect x="50" y="120" width="280" height="110" fill="#8a8a8a" fill-opacity="0.10" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="128" y="205" fill="#8a8a8a" font-size="12">p-type substrate (body)</text>

  <rect x="58" y="120" width="52" height="38" fill="#4a90d9" fill-opacity="0.18" stroke="#4a90d9" stroke-width="1.5"/>
  <rect x="270" y="120" width="52" height="38" fill="#4a90d9" fill-opacity="0.18" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="74" y="145" fill="#4a90d9" font-size="12">n+</text>
  <text x="286" y="145" fill="#4a90d9" font-size="12">n+</text>

  <rect x="110" y="108" width="160" height="12" fill="#8a8a8a" fill-opacity="0.30" stroke="#8a8a8a" stroke-width="1"/>
  <rect x="110" y="92" width="160" height="16" fill="#4a90d9" fill-opacity="0.30" stroke="#4a90d9" stroke-width="1.5"/>

  <path d="M 110 120 L 250 120 L 250 121.5 L 110 129 Z" fill="#4a90d9" fill-opacity="0.75" stroke="none"/>

  <line x1="68" y1="120" x2="68" y2="74" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="62" y="66" fill="#8a8a8a">S</text>
  <line x1="190" y1="92" x2="190" y2="74" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="184" y="66" fill="#8a8a8a">G</text>
  <line x1="296" y1="120" x2="296" y2="74" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="290" y="66" fill="#8a8a8a">D</text>
  <line x1="190" y1="230" x2="190" y2="244" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="196" y="243" fill="#8a8a8a" font-size="11">B (body, tied to S)</text>

  <line x1="296" y1="86" x2="296" y2="106" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="296,110 292,100 300,100" fill="#8a8a8a"/>
  <text x="303" y="100" fill="#8a8a8a" font-size="11">I<tspan font-size="9" dy="3">D</tspan></text>

  <line x1="230" y1="140" x2="132" y2="140" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="128,140 138,136 138,144" fill="#8a8a8a"/>
  <text x="140" y="156" fill="#8a8a8a" font-size="10">electron flow</text>

  <line x1="258" y1="160" x2="256" y2="128" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="256,124 251,134 261,133" fill="#e0645c"/>
  <text x="212" y="176" fill="#e0645c" font-size="11">pinch-off</text>

  <text x="40" y="268" fill="#8a8a8a" font-size="11">blue slab on top = gate; grey strip under it = thin oxide (no current crosses it)</text>
  <text x="40" y="284" fill="#8a8a8a" font-size="11">solid blue wedge = the inversion layer, i.e. the channel, thinning toward the drain</text>
  <text x="40" y="300" fill="#e0645c" font-size="11">at the drain end the channel has vanished: carriers are swept across that gap by the field</text>

  <line x1="400" y1="240" x2="702" y2="240" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="706,240 696,235 696,245" fill="#8a8a8a"/>
  <text x="668" y="258" fill="#8a8a8a" font-size="12">V<tspan font-size="10" dy="3">DS</tspan></text>
  <line x1="400" y1="240" x2="400" y2="74" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="400,70 395,80 405,80" fill="#8a8a8a"/>
  <text x="380" y="78" fill="#8a8a8a" font-size="12">I<tspan font-size="10" dy="3">D</tspan></text>

  <path d="M 400 240 L 417.5 230.0 L 435 222.9 L 452.5 218.6 L 470 217.2 L 680 217.2" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <path d="M 400 240 L 426.25 217.5 L 452.5 201.4 L 478.75 191.8 L 505 188.6 L 680 188.6" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <path d="M 400 240 L 428 207.1 L 456 181.5 L 484 163.2 L 512 152.3 L 540 148.6 L 680 148.6" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <path d="M 400 240 L 421.875 206.5 L 443.75 177.5 L 465.625 153.0 L 487.5 132.9 L 509.375 117.3 L 531.25 106.1 L 553.125 99.4 L 575 97.1 L 680 97.1" fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <path d="M 400 240 L 417.5 238.6 L 435 234.3 L 452.5 227.1 L 470 217.2 L 487.5 204.3 L 505 188.6 L 522.5 170.0 L 540 148.6 L 557.5 124.3 L 575 97.1" fill="none" stroke="#e0645c" stroke-width="2" stroke-dasharray="6 4"/>

  <line x1="430" y1="78" x2="456" y2="78" stroke="#e0645c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="462" y="82" fill="#e0645c" font-size="11">boundary V<tspan font-size="9" dy="3">DS</tspan><tspan dy="-3"> = V</tspan><tspan font-size="9" dy="3">ov</tspan></text>
  <text x="497" y="143" fill="#8a8a8a" font-size="11">triode</text>
  <text x="598" y="128" fill="#8a8a8a" font-size="11">saturation</text>

  <text x="686" y="101" fill="#8a8a8a" font-size="11">2.5</text>
  <text x="686" y="152.5" fill="#8a8a8a" font-size="11">2.0</text>
  <text x="686" y="192.5" fill="#8a8a8a" font-size="11">1.5</text>
  <text x="686" y="221" fill="#8a8a8a" font-size="11">1.0</text>
  <text x="400" y="316" fill="#8a8a8a" font-size="11">Right-edge labels: the overdrive V<tspan font-size="9" dy="3">ov</tspan><tspan dy="-3"> = V</tspan><tspan font-size="9" dy="3">GS</tspan><tspan dy="-3"> &#8722; V</tspan><tspan font-size="9" dy="3">t</tspan><tspan dy="-3">, in volts.</tspan></text>
  <text x="400" y="332" fill="#8a8a8a" font-size="11">V<tspan font-size="9" dy="3">GS</tspan><tspan dy="-3"> below V</tspan><tspan font-size="9" dy="3">t</tspan><tspan dy="-3"> is cutoff: no curve at all, flat on the axis.</tspan></text>

</svg>
