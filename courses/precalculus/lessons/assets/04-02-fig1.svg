<svg viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="400" height="340" fill="#faf9f6"/>

  <!-- Axes -->
  <line x1="40" y1="290" x2="380" y2="290" stroke="#333333" stroke-width="2"/>
  <line x1="60" y1="310" x2="60" y2="30" stroke="#333333" stroke-width="2"/>
  <!-- Axis arrowheads -->
  <polygon points="380,290 370,285 370,295" fill="#333333"/>
  <polygon points="60,30 55,40 65,40" fill="#333333"/>
  <text x="368" y="308" fill="#333333" font-family="Georgia, serif" font-size="15" font-style="italic">x</text>
  <text x="42" y="40" fill="#333333" font-family="Georgia, serif" font-size="15" font-style="italic">y</text>

  <!-- Origin -->
  <circle cx="60" cy="290" r="3" fill="#333333"/>
  <text x="40" y="308" fill="#333333" font-family="Georgia, serif" font-size="13">O</text>

  <!-- Component legs (dashed) -->
  <!-- horizontal leg: x-component -->
  <line x1="60" y1="290" x2="300" y2="290" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- vertical leg: y-component -->
  <line x1="300" y1="290" x2="300" y2="110" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- The vector A (accent) -->
  <line x1="60" y1="290" x2="300" y2="110" stroke="#c0392b" stroke-width="3"/>
  <polygon points="300,110 286,120 296,128" fill="#c0392b"/>
  <text x="165" y="185" fill="#c0392b" font-family="Georgia, serif" font-size="17" font-style="italic" font-weight="bold">A</text>

  <!-- Magnitude label along the vector -->
  <text x="188" y="215" fill="#333333" font-family="Georgia, serif" font-size="13">|A| = &#8730;(x&#178;+y&#178;)</text>

  <!-- Direction angle arc -->
  <path d="M 100 290 A 40 40 0 0 0 88 265" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="104" y="278" fill="#333333" font-family="Georgia, serif" font-size="15">&#952;</text>

  <!-- Component labels -->
  <text x="150" y="308" fill="#333333" font-family="Georgia, serif" font-size="13" font-style="italic">x = |A| cos &#952;</text>
  <text x="308" y="205" fill="#333333" font-family="Georgia, serif" font-size="13" font-style="italic">y = |A| sin &#952;</text>

  <!-- endpoint dot -->
  <circle cx="300" cy="110" r="3.5" fill="#c0392b"/>
  <text x="300" y="100" fill="#333333" font-family="Georgia, serif" font-size="12">(x, y)</text>
</svg>
