<svg viewBox="0 0 440 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- light card -->
  <rect x="0" y="0" width="440" height="320" rx="10" fill="#faf9f6"/>

  <!-- axes -->
  <line x1="45" y1="160" x2="425" y2="160" stroke="#333333" stroke-width="1.2"/>
  <line x1="251.4" y1="34" x2="251.4" y2="292" stroke="#333333" stroke-width="1.2"/>
  <text x="418" y="153" font-size="11" fill="#333333">x</text>
  <text x="256" y="44" font-size="11" fill="#333333">p(x)</text>

  <!-- polynomial curve: p(x) = (x+2)(x-1)^2 -->
  <path d="M 87.7,282.5 L 94.3,252.5 L 107.4,201 L 120.5,160 L 133.5,128.6 L 153.2,97.5
           L 185.9,80 L 218.6,92.5 L 251.4,120 L 284.1,147.5 L 307,158.7 L 316.8,160
           L 326.6,158.6 L 343,149.1 L 362.6,123.7 L 382.3,80 L 398.6,27.2"
        fill="none" stroke="#333333" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- zeros -->
  <circle cx="120.5" cy="160" r="4.5" fill="#c2410c"/>
  <circle cx="316.8" cy="160" r="4.5" fill="#c2410c"/>

  <!-- zero labels -->
  <text x="120.5" y="182" font-size="11" fill="#c2410c" text-anchor="middle">x = -2</text>
  <text x="120.5" y="195" font-size="10" fill="#333333" text-anchor="middle">mult 1 · crosses</text>
  <text x="316.8" y="182" font-size="11" fill="#c2410c" text-anchor="middle">x = 1</text>
  <text x="316.8" y="195" font-size="10" fill="#333333" text-anchor="middle">mult 2 · touches</text>

  <!-- end-behavior arrows + labels -->
  <line x1="105" y1="215" x2="88" y2="280" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="52" y="300" font-size="10.5" fill="#333333">x → -∞ : p → -∞</text>

  <line x1="382" y1="80" x2="399" y2="30" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="300" y="24" font-size="10.5" fill="#333333">x → +∞ : p → +∞</text>

  <!-- title tag -->
  <text x="52" y="24" font-size="11" fill="#333333">p(x) = (x + 2)(x - 1)²</text>
</svg>
