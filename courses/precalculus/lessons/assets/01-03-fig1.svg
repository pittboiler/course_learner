<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="420" height="320" rx="10" fill="#faf9f6"/>

  <!-- grid -->
  <g stroke="#e2e0d8" stroke-width="1">
    <line x1="60" y1="40" x2="60" y2="290"/>
    <line x1="105" y1="40" x2="105" y2="290"/>
    <line x1="240" y1="40" x2="240" y2="290"/>
    <line x1="285" y1="40" x2="285" y2="290"/>
    <line x1="330" y1="40" x2="330" y2="290"/>
    <line x1="15" y1="70" x2="345" y2="70"/>
    <line x1="15" y1="100" x2="345" y2="100"/>
    <line x1="15" y1="220" x2="345" y2="220"/>
    <line x1="15" y1="250" x2="345" y2="250"/>
  </g>

  <!-- axes -->
  <g stroke="#333333" stroke-width="1.6">
    <line x1="15" y1="160" x2="345" y2="160"/>
    <line x1="150" y1="40" x2="150" y2="290"/>
  </g>
  <g fill="#333333" font-size="11">
    <text x="349" y="164">x</text>
    <text x="140" y="50">y</text>
    <text x="192" y="174">1</text>
    <text x="238" y="174">2</text>
    <text x="108" y="174">-1</text>
    <text x="156" y="134">1</text>
    <text x="156" y="74">3</text>
  </g>

  <!-- parent y = x^2 -->
  <polyline fill="none" stroke="#4b6cb7" stroke-width="2.6" stroke-linejoin="round"
    points="55.5,27.7 82.5,92.5 105,130 127.5,152.5 150,160 172.5,152.5 195,130 217.5,92.5 244.5,27.7"/>

  <!-- transformed y = -2(x-1)^2 + 3 -->
  <polyline fill="none" stroke="#c65a2e" stroke-width="2.6" stroke-linejoin="round"
    points="110.85,280 127.5,205 150,130 172.5,85 195,70 217.5,85 240,130 262.5,205 279.15,280"/>

  <!-- vertex marker -->
  <circle cx="195" cy="70" r="3.2" fill="#c65a2e"/>
  <circle cx="150" cy="160" r="3.2" fill="#4b6cb7"/>

  <!-- labels -->
  <text x="250" y="40" fill="#4b6cb7" font-size="13" font-style="italic">y = x²</text>
  <text x="286" y="262" fill="#c65a2e" font-size="13" font-style="italic">y = -2(x-1)²+3</text>
  <text x="199" y="66" fill="#c65a2e" font-size="10">(1, 3)</text>
</svg>
