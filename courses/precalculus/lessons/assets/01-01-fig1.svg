<svg viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <!-- f(x) = sqrt(4 - x^2): upper semicircle. Domain [-2,2] on x-axis, range [0,2] on y-axis -->

  <!-- axes -->
  <line x1="50" y1="250" x2="360" y2="250" stroke="#333333" stroke-width="1.5"/>
  <line x1="200" y1="290" x2="200" y2="80"  stroke="#333333" stroke-width="1.5"/>
  <!-- arrowheads -->
  <polygon points="360,250 352,246 352,254" fill="#333333"/>
  <polygon points="200,80 196,88 204,88"   fill="#333333"/>
  <text x="352" y="270" fill="#333333" font-size="13" font-style="italic">x</text>
  <text x="208" y="90"  fill="#333333" font-size="13" font-style="italic">y</text>

  <!-- domain segment on x-axis: x in [-2,2] -> screen 80..320 -->
  <line x1="80" y1="250" x2="320" y2="250" stroke="#1f6f8b" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <line x1="80" y1="245" x2="80" y2="255"  stroke="#1f6f8b" stroke-width="2"/>
  <line x1="320" y1="245" x2="320" y2="255" stroke="#1f6f8b" stroke-width="2"/>
  <text x="66"  y="272" fill="#1f6f8b" font-size="12">-2</text>
  <text x="314" y="272" fill="#1f6f8b" font-size="12">2</text>
  <text x="150" y="290" fill="#1f6f8b" font-size="12.5" font-weight="bold">domain [-2, 2]</text>

  <!-- range segment on y-axis: y in [0,2] -> screen 250..130 -->
  <line x1="200" y1="250" x2="200" y2="130" stroke="#c0392b" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <line x1="195" y1="130" x2="205" y2="130" stroke="#c0392b" stroke-width="2"/>
  <text x="178" y="126" fill="#c0392b" font-size="12">2</text>
  <text x="256" y="188" fill="#c0392b" font-size="12.5" font-weight="bold" transform="rotate(-90 256 188)">range [0, 2]</text>

  <!-- the curve -->
  <polyline fill="none" stroke="#333333" stroke-width="2.5"
    points="80,250 110,171 140,146 170,134 200,130 230,134 260,146 290,171 320,250"/>

  <!-- projection: input x = 1 (screen 260) up to curve, across to range -->
  <line x1="260" y1="250" x2="260" y2="146" stroke="#333333" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="260" y1="146" x2="200" y2="146" stroke="#333333" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  <circle cx="260" cy="146" r="3.5" fill="#333333"/>
  <text x="240" y="264" fill="#333333" font-size="11">x</text>
  <text x="176" y="150" fill="#333333" font-size="11">f(x)</text>

  <!-- title -->
  <text x="200" y="315" fill="#333333" font-size="12.5" text-anchor="middle" font-style="italic">f(x) = &#8730;(4 &#8722; x&#178;)</text>
</svg>
