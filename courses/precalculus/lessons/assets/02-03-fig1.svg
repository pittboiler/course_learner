<svg viewBox="0 0 380 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="380" height="360" fill="#faf9f6"/>

  <!-- axes -->
  <line x1="30" y1="290" x2="345" y2="290" stroke="#333333" stroke-width="1.5"/>
  <line x1="70" y1="55"  x2="70"  y2="345" stroke="#333333" stroke-width="1.5"/>
  <polygon points="345,290 337,286 337,294" fill="#333333"/>
  <polygon points="70,55 66,63 74,63" fill="#333333"/>
  <text x="349" y="294" font-size="12" fill="#333333">x</text>
  <text x="60"  y="52"  font-size="12" fill="#333333">y</text>
  <text x="74"  y="303" font-size="11" fill="#333333">0</text>

  <!-- mirror line y = x -->
  <line x1="50" y1="310" x2="310" y2="50" stroke="#333333" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="300" y="45" font-size="12" fill="#333333">y = x</text>

  <!-- exponential y = 2^x (blue) -->
  <polyline fill="none" stroke="#1d4ed8" stroke-width="2.6"
    points="22,273 50,262 70,250 90,233 110,210 130,177 150,130 162,93 170,64"/>
  <text x="176" y="70" font-size="13" fill="#1d4ed8" font-weight="bold">y = 2ˣ</text>

  <!-- logarithm y = log2(x) (amber) -->
  <polyline fill="none" stroke="#b45309" stroke-width="2.6"
    points="87,338 98,310 110,290 127,270 150,250 183,230 230,210 267,198 296,190"/>
  <text x="300" y="188" font-size="13" fill="#b45309" font-weight="bold">y = log₂x</text>

  <!-- key points on exponential -->
  <circle cx="70"  cy="250" r="3.5" fill="#1d4ed8"/>
  <text x="42" y="248" font-size="10.5" fill="#1d4ed8">(0, 1)</text>
  <circle cx="110" cy="210" r="3.5" fill="#1d4ed8"/>
  <text x="116" y="207" font-size="10.5" fill="#1d4ed8">(1, 2)</text>

  <!-- key points on logarithm (the swapped coordinates) -->
  <circle cx="110" cy="290" r="3.5" fill="#b45309"/>
  <text x="112" y="304" font-size="10.5" fill="#b45309">(1, 0)</text>
  <circle cx="150" cy="250" r="3.5" fill="#b45309"/>
  <text x="156" y="248" font-size="10.5" fill="#b45309">(2, 1)</text>

  <text x="30" y="352" font-size="10.5" fill="#333333">Reflecting across y = x swaps the coordinates: (0,1) ↔ (1,0), (1,2) ↔ (2,1).</text>
</svg>
