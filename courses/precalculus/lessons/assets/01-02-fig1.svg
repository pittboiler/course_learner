<svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="360" height="360" rx="10" fill="#faf9f6"/>

  <!-- axes -->
  <line x1="60" y1="315" x2="60" y2="45" stroke="#333333" stroke-width="1.5"/>
  <line x1="45" y1="300" x2="330" y2="300" stroke="#333333" stroke-width="1.5"/>
  <polygon points="60,42 56,52 64,52" fill="#333333"/>
  <polygon points="333,300 323,296 323,304" fill="#333333"/>
  <text x="47" y="52" fill="#333333" font-size="13" font-style="italic">y</text>
  <text x="322" y="318" fill="#333333" font-size="13" font-style="italic">x</text>
  <text x="47" y="316" fill="#333333" font-size="12">O</text>

  <!-- mirror line y = x -->
  <line x1="60" y1="300" x2="300" y2="60" stroke="#333333" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="272" y="78" fill="#333333" font-size="13" font-style="italic">y = x</text>

  <!-- f : the steeper curve (magenta) -->
  <polyline fill="none" stroke="#d6336c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
    points="60,300 78,292.8 96,271.2 114,235.2 132,184.8 150,120 163.5,61.95"/>
  <text x="140" y="86" fill="#d6336c" font-size="15" font-style="italic" font-weight="bold">f</text>

  <!-- f inverse : the flatter reflected curve (blue) -->
  <polyline fill="none" stroke="#1c7ed6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
    points="60,300 67.2,282 88.8,264 124.8,246 175.2,228 240,210 298.05,196.5"/>
  <text x="300" y="192" fill="#1c7ed6" font-size="15" font-style="italic" font-weight="bold">f</text>
  <text x="311" y="185" fill="#1c7ed6" font-size="11" font-style="italic">-1</text>

  <!-- shared fixed points on the mirror line -->
  <circle cx="60" cy="300" r="3.4" fill="#333333"/>
  <circle cx="105" cy="255" r="3.4" fill="#333333"/>
  <text x="110" y="250" fill="#333333" font-size="11">(1, 1)</text>

  <!-- a reflected pair: (2,4) on f, (4,2) on f^-1 -->
  <circle cx="150" cy="120" r="3.4" fill="#d6336c"/>
  <text x="156" y="118" fill="#d6336c" font-size="11">(2, 4)</text>
  <circle cx="240" cy="210" r="3.4" fill="#1c7ed6"/>
  <text x="246" y="214" fill="#1c7ed6" font-size="11">(4, 2)</text>
  <line x1="150" y1="120" x2="240" y2="210" stroke="#333333" stroke-width="1" stroke-dasharray="2 3" opacity="0.55"/>
</svg>
