<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-label="Left: protein level against time for a simple regulated gene and a negatively autoregulated gene rising to the same steady state, with the two half-times marked and a 6.6-fold speedup annotated. Right: a histogram of self-loop counts in randomized networks clustered near one, with the observed count of forty far to the right and a Z-score of about thirty-five.">
  <rect width="780" height="400" fill="#ffffff"/>

  <text x="80" y="32" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">Same steady state, same protein lifetime, very different response time</text>

  <text x="26" y="200" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333" transform="rotate(-90 26 200)" text-anchor="middle">protein Y</text>

  <line x1="80" y1="330" x2="455" y2="330" stroke="#111" stroke-width="1.4"/>
  <line x1="80" y1="60" x2="80" y2="330" stroke="#111" stroke-width="1.4"/>

  <line x1="80" y1="90" x2="450" y2="90" stroke="#8fa8c0" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="338" y="84" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#556">Y_st, same for both</text>

  <line x1="80" y1="210" x2="215" y2="210" stroke="#8fa8c0" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="86" y="204" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#556">half of Y_st</text>

  <polyline fill="none" stroke="#1a6fb5" stroke-width="2.4" points="80,330 121.1,280.5 162.2,241.2 203.3,210 244.4,185.3 285.6,165.6 326.7,150 367.8,137.6 408.9,127.8 450,120"/>
  <polyline fill="none" stroke="#d1495b" stroke-width="2.4" points="80,330 88.2,275.8 96.4,224.1 104.7,174.6 112.9,127.5 119.7,90 450,90"/>

  <line x1="98.7" y1="210" x2="98.7" y2="330" stroke="#d1495b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="203.3" y1="210" x2="203.3" y2="330" stroke="#1a6fb5" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="126" y="76" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#d1495b" font-weight="bold">negative autoregulation</text>
  <text x="300" y="140" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#1a6fb5" font-weight="bold">simple regulation</text>

  <text x="230" y="270" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#111">NAR half-time: 4.6 min</text>
  <text x="230" y="288" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#111">simple half-time: 30 min</text>
  <text x="230" y="308" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#2e8b57">speedup 6.6&#215;</text>

  <text x="80" y="345" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">0</text>
  <text x="203.3" y="345" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">30</text>
  <text x="326.7" y="345" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">60</text>
  <text x="450" y="345" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">90</text>
  <text x="265" y="366" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333" text-anchor="middle">time after induction (min), 30 min generation time</text>

  <rect x="490" y="60" width="280" height="290" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>
  <text x="502" y="82" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#111">Is NAR a motif? Count self-loops.</text>

  <line x1="515" y1="300" x2="758" y2="300" stroke="#111" stroke-width="1.2"/>

  <rect x="513" y="226" width="4.4" height="74" fill="#1a6fb5"/>
  <rect x="518.3" y="210" width="4.4" height="90" fill="#1a6fb5"/>
  <rect x="523.6" y="245" width="4.4" height="55" fill="#1a6fb5"/>
  <rect x="528.9" y="278" width="4.4" height="22" fill="#1a6fb5"/>
  <rect x="534.2" y="293" width="4.4" height="7" fill="#1a6fb5"/>

  <text x="556" y="244" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1a6fb5">randomized networks:</text>
  <text x="556" y="260" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1a6fb5">1.2 &#177; 1.1 self-loops</text>

  <line x1="727" y1="300" x2="727" y2="158" stroke="#d1495b" stroke-width="2.2"/>
  <polygon points="727,150 722.5,162 731.5,162" fill="#d1495b"/>
  <text x="727" y="140" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b" text-anchor="middle">observed: 40</text>

  <text x="640" y="196" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#2e8b57" text-anchor="middle">Z &#8776; 35</text>

  <text x="515" y="316" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">0</text>
  <text x="621" y="316" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">20</text>
  <text x="727" y="316" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">40</text>
  <text x="637" y="336" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333" text-anchor="middle">negative self-loops in the network</text>
</svg>
