<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="Three panels. Panel a plots a Hill input function f of X against X with the half-maximal point K marked. Panel b plots Y against time for two production rates, showing both curves reaching half of their own plateau at the identical time ln 2 over alpha even though one plateau is twice as high. Panel c shows three shaded grids for a two-input promoter, an AND gate, an OR gate, and the Boolean limit of the AND gate.">
<rect width="800" height="470" fill="#ffffff"/>

