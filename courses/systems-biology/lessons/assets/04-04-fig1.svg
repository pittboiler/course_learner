<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-label="Three panels: the kinase-phosphatase cycle, fraction modified versus the kinase-to-phosphatase ratio in first-order and zero-order regimes, and a three-layer cascade whose steepness compounds.">
