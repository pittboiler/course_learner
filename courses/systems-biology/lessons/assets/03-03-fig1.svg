<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-label="Panel a: an integral feedback block diagram. Panel b: receptor activity against time through three attractant steps, returning exactly to the same baseline each time, with a second faster trace on the same baseline.">
  <rect width="820" height="440" fill="#ffffff"/>
  <g font-family="Helvetica,Arial,sans-serif" fill="#111">

    <text x="18" y="32" font-size="11.5" font-weight="bold">(a)  Integral feedback: the integrator is the receptor methylation level</text>

    <rect x="210" y="44" width="220" height="44" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.4"/>
    <text x="320" y="62" font-size="10.5" text-anchor="middle" font-weight="bold">PLANT (receptor complex)</text>
    <text x="320" y="79" font-size="10.5" text-anchor="middle">activity A = A(M, L)</text>

    <line x1="120" y1="66" x2="204" y2="66" stroke="#2e8b57" stroke-width="1.6"/>
    <polygon points="211,66 204,62.5 204,69.5" fill="#2e8b57"/>
    <text x="120" y="58" font-size="10" fill="#2e8b57">input L (attractant)</text>

    <line x1="430" y1="66" x2="613" y2="66" stroke="#111" stroke-width="1.6"/>
    <polygon points="620,66 613,62.5 613,69.5" fill="#111"/>
    <text x="626" y="70" font-size="10.5">A (output: tumbling)</text>

    <circle cx="540" cy="66" r="3" fill="#111"/>
    <line x1="540" y1="69" x2="540" y2="107" stroke="#111" stroke-width="1.6"/>
    <polygon points="540,114 536.5,107 543.5,107" fill="#111"/>

    <circle cx="540" cy="128" r="14" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
    <text x="540" y="132" font-size="11" text-anchor="middle">&#8722;</text>

    <line x1="690" y1="128" x2="561" y2="128" stroke="#1a6fb5" stroke-width="1.6"/>
    <polygon points="554,128 561,124.5 561,131.5" fill="#1a6fb5"/>
    <text x="698" y="124" font-size="10" fill="#1a6fb5">setpoint A_set</text>
    <text x="698" y="138" font-size="10" fill="#1a6fb5">= V_R / (k_B B)</text>

    <line x1="526" y1="128" x2="438" y2="128" stroke="#d1495b" stroke-width="1.6"/>
    <polygon points="431,128 438,124.5 438,131.5" fill="#d1495b"/>
    <text x="442" y="121" font-size="10" fill="#d1495b">e = A &#8722; A_set</text>

    <rect x="200" y="112" width="230" height="44" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.4"/>
    <text x="315" y="130" font-size="10.5" text-anchor="middle" font-weight="bold">INTEGRATOR (CheR / CheB)</text>
    <text x="315" y="147" font-size="10.5" text-anchor="middle">dM/dt = &#8722;k e   (methylation M)</text>

    <line x1="240" y1="112" x2="240" y2="96" stroke="#111" stroke-width="1.6"/>
    <polygon points="240,89 236.5,96 243.5,96" fill="#111"/>
    <text x="247" y="105" font-size="10">M</text>

    <text x="18" y="172" font-size="10">Steady state forces dM/dt = 0, hence e = 0 exactly &#8212; no parameter of the plant appears in that equation.</text>

    <text x="18" y="192" font-size="11.5" font-weight="bold">(b)  Precision is robust; adaptation time is not</text>

    <polyline points="100,238 186.7,238 186.7,228 381.7,228 381.7,218 576.7,218 576.7,208 750,208" fill="none" stroke="#2e8b57" stroke-width="2"/>
    <text x="105" y="204" font-size="10" fill="#2e8b57">attractant L: three steps, each the same fold increase</text>

    <line x1="95" y1="250" x2="95" y2="400" stroke="#111" stroke-width="1.4"/>
    <line x1="95" y1="400" x2="751" y2="400" stroke="#111" stroke-width="1.4"/>
    <polygon points="758,400 751,396.5 751,403.5" fill="#111"/>
    <text x="400" y="420" font-size="10.5" text-anchor="middle">time (min)</text>
    <text x="48" y="325" font-size="10.5" text-anchor="middle" transform="rotate(-90 48 325)">receptor activity A</text>
    <text x="88" y="314" font-size="10" text-anchor="end">A*</text>

    <line x1="100" y1="310" x2="755" y2="310" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="612" y="304" font-size="10" fill="#555">baseline restored exactly</text>

    <polyline points="100,310 186.7,310 186.7,383.8 197.5,359.5 208.4,343.2 219.2,332.2 230,324.9 240.9,320 251.7,316.7 262.5,314.5 273.4,313 295,311.4 316.7,310.6 381.7,310 381.7,383.8 392.5,359.5 403.4,343.2 414.2,332.2 425,324.9 435.9,320 446.7,316.7 457.5,314.5 468.4,313 490,311.4 511.7,310.6 576.7,310 576.7,383.8 587.5,359.5 598.4,343.2 609.2,332.2 620,324.9 630.9,320 641.7,316.7 652.5,314.5 663.4,313 685,311.4 706.7,310.6 750,310" fill="none" stroke="#1a6fb5" stroke-width="1.8" stroke-dasharray="6 3"/>

    <polyline points="100,310 186.7,310 186.7,383.8 208.4,359.5 230,343.2 251.7,332.2 273.4,324.9 295,320 316.7,316.7 338.4,314.5 360,313 381.7,312 381.7,383.8 403.4,359.5 425,343.2 446.7,332.2 468.4,324.9 490,320 511.7,316.7 533.4,314.5 555,313 576.7,312 576.7,383.8 598.4,359.5 620,343.2 641.7,332.2 663.4,324.9 685,320 706.7,316.7 728.4,314.5 750,313" fill="none" stroke="#d1495b" stroke-width="2"/>

    <text x="100" y="262" font-size="10">Exact return to the same baseline after every step.</text>
    <line x1="430" y1="258" x2="456" y2="258" stroke="#d1495b" stroke-width="2"/>
    <text x="462" y="262" font-size="10">nominal</text>
    <line x1="430" y1="272" x2="456" y2="272" stroke="#1a6fb5" stroke-width="1.8" stroke-dasharray="6 3"/>
    <text x="462" y="276" font-size="10">receptor sensitivity doubled</text>
  </g>
</svg>
