<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" width="820" height="390" role="img" aria-label="Left: a small metabolic network with uptake into A, a branch from A to B and to C, and outputs from B to product and from C to biomass, with the mass balances written beneath. Right: the feasible flux set projected onto the plane of the two branch fluxes, a triangle whose slanted edge is the uptake bound drawn in red, with the optimal vertex for maximizing biomass marked and two objective gradient arrows drawn.">
<rect width="820" height="390" fill="#ffffff"/>
<defs>
<marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#333333"/></marker>
<marker id="ahr" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#d1495b"/></marker>
<marker id="ahg" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#2e8b57"/></marker>
</defs>

<text x="14" y="26" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#111111">The network, fluxes labelled</text>
<rect x="14" y="40" width="332" height="180" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>

<line x1="30" y1="130" x2="80" y2="130" stroke="#333333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="55" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111111">v<tspan font-size="8" dy="3">1</tspan><tspan dy="-3"> &#8804; 10</tspan></text>

<circle cx="100" cy="130" r="17" fill="#ffffff" stroke="#1a6fb5" stroke-width="2"/>
<text x="100" y="135" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">A</text>
<circle cx="215" cy="85" r="17" fill="#ffffff" stroke="#1a6fb5" stroke-width="2"/>
<text x="215" y="90" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">B</text>
<circle cx="215" cy="180" r="17" fill="#ffffff" stroke="#1a6fb5" stroke-width="2"/>
<text x="215" y="185" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">C</text>

<line x1="113" y1="121" x2="199" y2="94" stroke="#333333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="150" y="102" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111111">v<tspan font-size="8" dy="3">2</tspan></text>
<line x1="113" y1="139" x2="199" y2="171" stroke="#333333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="150" y="170" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111111">v<tspan font-size="8" dy="3">3</tspan></text>

<line x1="232" y1="85" x2="276" y2="85" stroke="#333333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="254" y="77" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111111">v<tspan font-size="8" dy="3">4</tspan></text>
<text x="281" y="89" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">product</text>
<line x1="232" y1="180" x2="276" y2="180" stroke="#2e8b57" stroke-width="1.8" marker-end="url(#ahg)"/>
<text x="254" y="172" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#2e8b57">v<tspan font-size="8" dy="3">5</tspan></text>
<text x="281" y="184" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#2e8b57">biomass</text>

<text x="14" y="246" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111111">A: v1 = v2 + v3   B: v2 = v4   C: v3 = v5</text>
<text x="14" y="264" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111111">Two degrees of freedom: pick v2 and v3.</text>
<text x="14" y="282" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111111">The whole feasible set is the triangle.</text>

<text x="368" y="26" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#111111">Feasible set in the (v2, v3) plane</text>

<polygon points="420,320 640,320 420,100" fill="#e8eef5" stroke="#1a6fb5" stroke-width="1.5"/>
<line x1="640" y1="320" x2="420" y2="100" stroke="#d1495b" stroke-width="3.5"/>

<line x1="420" y1="320" x2="700" y2="320" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="420" y1="320" x2="420" y2="86" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="708" y="324" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111111">v<tspan font-size="8" dy="3">2</tspan></text>
<text x="420" y="76" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111111">v<tspan font-size="8" dy="3">3</tspan></text>
<text x="640" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">10</text>
<text x="410" y="105" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">10</text>

<circle cx="420" cy="100" r="5.5" fill="#d1495b"/>
<text x="438" y="90" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111111">optimum for max v5</text>
<text x="438" y="104" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">v2 = 0, v3 = 10</text>

<line x1="490" y1="292" x2="490" y2="242" stroke="#2e8b57" stroke-width="2" marker-end="url(#ahg)"/>
<text x="498" y="258" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#2e8b57">increasing v5</text>

<line x1="520" y1="310" x2="556" y2="274" stroke="#1a6fb5" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#ah)"/>
<text x="562" y="284" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1a6fb5">increasing v4 + v5</text>

<line x1="596" y1="184" x2="558" y2="220" stroke="#d1495b" stroke-width="1" stroke-dasharray="3,2"/>
<text x="600" y="180" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#d1495b">uptake bound</text>
<text x="600" y="194" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">v1 = v2 + v3 = 10</text>

<text x="368" y="356" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111111">max v5: unique optimum at the top vertex, set by the uptake bound.</text>
<text x="368" y="372" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111111">max v4 + v5: gradient normal to that edge, so the whole edge is optimal.</text>
</svg>
