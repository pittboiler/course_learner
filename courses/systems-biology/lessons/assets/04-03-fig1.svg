<text x="252" y="150" font-size="9.5" fill="#111">deterministic</text>
<text x="70" y="76" font-size="9.5" fill="#333">same gene, same medium, same genome</text>

<rect x="420" y="45" width="380" height="205" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="0.8"/>
