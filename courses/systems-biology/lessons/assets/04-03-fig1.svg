<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" role="img" aria-label="Panel a: protein copy number against time for two genetically identical cells, both jagged and stepping upward in bursts, diverging to different levels while the smooth deterministic solution rises to a single steady state of 40. Panel c: a scatter of two-colour reporter measurements, cyan against yellow, forming a cloud stretched along the diagonal by extrinsic noise and spread perpendicular to the diagonal by intrinsic noise. Panel b left: two steady-state distributions at the same mean of 40 copies, a tall narrow Poisson curve with Fano factor 1 and a low broad bursty curve with Fano factor 10. Panel b right: a sample trace showing a promoter switching on in three brief episodes, each producing a staircase of transcripts that then decays, which is what makes the distribution broad.">
<rect width="820" height="560" fill="#ffffff"/>
<defs>
<marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
<path d="M0,0 L7,3 L0,6 z" fill="#333"/>
