<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 512" width="580" height="512" role="img" aria-label="Panel a: the French-flag model. An exponentially decaying morphogen gradient across a 500 micrometre tissue, with two dashed readout thresholds at 20 and 5 nanomolar cutting the tissue into three sharp domains at 161 and 300 micrometres. Panel b: a Turing pattern. Activator and inhibitor concentration profiles across space, in phase, the inhibitor shallower and longer-ranged because it diffuses 4.5 times faster, with the resulting periodic stripe pattern beneath and the wavelength of 109 micrometres marked between two peaks.">
