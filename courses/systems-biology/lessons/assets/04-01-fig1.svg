<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" role="img" aria-label="A six-reaction metabolic network drawn as a graph above its stoichiometric matrix, with one null-space vector highlighted in both to show that a pathway is a null-space vector.">
  <rect width="640" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#1a6fb5"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#d1495b"/>
    </marker>
  </defs>

  <rect x="15" y="12" width="610" height="178" rx="6" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>
  <text x="30" y="33" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#333">The network: 3 internal metabolites, 6 reactions</text>

  <line x1="310" y1="86" x2="310" y2="52" stroke="#1a6fb5" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="322" y="60" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1a6fb5">v6  secrete B</text>

  <line x1="78" y1="110" x2="136" y2="110" stroke="#d1495b" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="72" y="132" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d1495b" text-anchor="middle">v1</text>
  <text x="72" y="96" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">uptake</text>

  <circle cx="160" cy="110" r="19" fill="#e6f4ec" stroke="#2e8b57" stroke-width="1.6"/>
  <circle cx="310" cy="110" r="19" fill="#e6f4ec" stroke="#2e8b57" stroke-width="1.6"/>
  <circle cx="460" cy="110" r="19" fill="#e6f4ec" stroke="#2e8b57" stroke-width="1.6"/>
  <g font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#111" text-anchor="middle">
    <text x="160" y="117">A</text>
    <text x="310" y="117">B</text>
    <text x="460" y="117">C</text>
  </g>

  <line x1="183" y1="110" x2="286" y2="110" stroke="#d1495b" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="234" y="102" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d1495b" text-anchor="middle">v2</text>
  <line x1="333" y1="110" x2="436" y2="110" stroke="#d1495b" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="384" y="102" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d1495b" text-anchor="middle">v3</text>
  <line x1="483" y1="110" x2="545" y2="110" stroke="#d1495b" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="514" y="102" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d1495b" text-anchor="middle">v5</text>
  <text x="576" y="114" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555">biomass</text>

  <path d="M155,131 C 200,172 420,172 455,131" fill="none" stroke="#1a6fb5" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="305" y="176" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1a6fb5" text-anchor="middle">v4  bypass</text>

  <rect x="15" y="200" width="610" height="258" rx="6" fill="#ffffff" stroke="#8fa8c0" stroke-width="1"/>
  <text x="30" y="223" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#333">Its stoichiometric matrix S &#8212; rows are metabolites, columns are reactions</text>

  <rect x="237" y="262" width="124" height="92" fill="#fbe9ec"/>
  <rect x="404" y="262" width="38" height="92" fill="#fbe9ec"/>

  <g font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#333" text-anchor="middle">
    <text x="212" y="287">A</text>
    <text x="212" y="317">B</text>
    <text x="212" y="347">C</text>
  </g>

  <path d="M240,262 L232,262 L232,356 L240,356" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M482,262 L490,262 L490,356 L482,356" fill="none" stroke="#111" stroke-width="1.5"/>

  <g font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle">
    <text x="255" y="253" fill="#d1495b">v1</text>
    <text x="297" y="253" fill="#d1495b">v2</text>
    <text x="339" y="253" fill="#d1495b">v3</text>
    <text x="381" y="253" fill="#1a6fb5">v4</text>
    <text x="423" y="253" fill="#d1495b">v5</text>
    <text x="465" y="253" fill="#1a6fb5">v6</text>
  </g>

  <g font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#111" text-anchor="middle">
    <text x="255" y="287">+1</text><text x="297" y="287">&#8722;1</text><text x="339" y="287">0</text><text x="381" y="287">&#8722;1</text><text x="423" y="287">0</text><text x="465" y="287">0</text>
    <text x="255" y="317">0</text><text x="297" y="317">+1</text><text x="339" y="317">&#8722;1</text><text x="381" y="317">0</text><text x="423" y="317">0</text><text x="465" y="317">&#8722;1</text>
    <text x="255" y="347">0</text><text x="297" y="347">0</text><text x="339" y="347">+1</text><text x="381" y="347">+1</text><text x="423" y="347">&#8722;1</text><text x="465" y="347">0</text>
  </g>

  <text x="512" y="287" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">A balance</text>
  <text x="512" y="317" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">B balance</text>
  <text x="512" y="347" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">C balance</text>

  <text x="30" y="386" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#d1495b">Shaded route  v = (1, 1, 1, 0, 1, 0):  take up A, run it to B, to C, out as biomass.</text>
  <text x="30" y="408" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111">A: +1 &#8722; 1 = 0     B: +1 &#8722; 1 = 0     C: +1 &#8722; 1 = 0     so Sv = 0.</text>
  <text x="30" y="430" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#2e8b57">A pathway is nothing but a vector in the null space of S.</text>
  <text x="30" y="450" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#555">Two other independent routes: (1,0,0,1,1,0) bypass and (1,1,0,0,0,1) overflow. dim null(S) = 6 &#8722; 3 = 3.</text>
</svg>
