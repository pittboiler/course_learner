<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-label="Three panels. Left and centre show the toggle-switch nullclines in the u-v plane below and above the bifurcation threshold: at alpha equal to 1 the two sigmoidal nullclines cross once on the diagonal at a stable node, while at alpha equal to 3 they cross three times, with two stable nodes off the diagonal and a saddle on it, and the diagonal drawn as the separatrix. Right shows the bifurcation diagram of steady-state u against the input for the symmetry-broken toggle: an S-shaped curve with a solid lower branch, a dashed unstable middle branch and a solid upper branch, the two saddle-node fold points marked, and vertical arrows showing the upward jump on the way up and the downward jump at a lower input on the way down.">
<rect width="820" height="440" fill="#ffffff"/>

<!-- ================= PANEL A1 : alpha = 1 ================= -->
<text x="60" y="34" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">(a) &#945; = 1 &#8212; one crossing</text>
<text x="60" y="50" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">monostable: the tie is stable</text>

<rect x="60" y="60" width="180" height="180" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>
<!-- diagonal -->
<line x1="60" y1="240" x2="240" y2="60" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
<!-- v-nullcline (blue): v = 1/(1+u^2) -->
<path d="M 60,187.1 L 70.6,189.1 L 81.2,194.4 L 91.8,201.1 L 102.4,207.7 L 112.9,213.5 L 134.1,222.1 L 155.3,227.5 L 187.1,232.2 L 240,235.8" fill="none" stroke="#1a6fb5" stroke-width="2"/>
<!-- u-nullcline (coral): u = 1/(1+v^2) -->
<path d="M 112.9,240 L 110.9,229.4 L 105.6,218.8 L 98.9,208.2 L 92.3,197.6 L 86.5,187.1 L 77.9,165.9 L 72.5,144.7 L 67.8,112.9 L 64.2,60" fill="none" stroke="#d1495b" stroke-width="2"/>
<circle cx="96.1" cy="203.9" r="4.5" fill="#2e8b57" stroke="#111" stroke-width="1"/>
<text x="104" y="200" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">stable node</text>
<text x="104" y="212" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">u = v = 0.68</text>
<text x="150" y="120" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a6fb5">v-nullcline</text>
<text x="150" y="134" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b">u-nullcline</text>
<line x1="60" y1="240" x2="240" y2="240" stroke="#111" stroke-width="1.2"/>
<line x1="60" y1="240" x2="60" y2="60" stroke="#111" stroke-width="1.2"/>
<text x="145" y="256" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">u</text>
<text x="46" y="152" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">v</text>

<!-- ================= PANEL A2 : alpha = 3 ================= -->
<text x="300" y="34" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">(b) &#945; = 3 &#8212; three crossings</text>
<text x="300" y="50" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">bistable: the tie is now a saddle</text>

<rect x="300" y="60" width="180" height="180" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>
<!-- separatrix = diagonal -->
<line x1="300" y1="240" x2="480" y2="60" stroke="#111" stroke-width="1.6" stroke-dasharray="6,3"/>
<!-- v-nullcline (blue) -->
<path d="M 300,81.2 L 310.6,87.3 L 321.2,103.1 L 331.8,123.2 L 342.4,143.2 L 353,160.6 L 363.5,174.9 L 374.1,186.3 L 384.7,195.4 L 395.3,202.5 L 405.9,208.2 L 427.1,216.5 L 448.2,222.1 L 480,227.3" fill="none" stroke="#1a6fb5" stroke-width="2"/>
<!-- u-nullcline (coral) -->
<path d="M 458.8,240 L 452.7,229.4 L 436.9,218.8 L 416.8,208.2 L 396.8,197.6 L 379.4,187.1 L 365.1,176.5 L 353.7,165.9 L 344.6,155.3 L 337.5,144.7 L 331.8,134.1 L 323.5,112.9 L 317.9,91.8 L 312.7,60" fill="none" stroke="#d1495b" stroke-width="2"/>
<!-- fixed points -->
<circle cx="438.6" cy="219.8" r="4.5" fill="#2e8b57" stroke="#111" stroke-width="1"/>
<circle cx="320.2" cy="101.4" r="4.5" fill="#2e8b57" stroke="#111" stroke-width="1"/>
<circle cx="364.2" cy="175.8" r="4.5" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
<text x="392" y="234" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">U high (2.62, 0.38)</text>
<text x="328" y="94" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">V high (0.38, 2.62)</text>
<text x="372" y="172" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">saddle</text>
<text x="372" y="183" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">1.21, 1.21</text>
<text x="386" y="72" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">separatrix u = v</text>
<line x1="300" y1="240" x2="480" y2="240" stroke="#111" stroke-width="1.2"/>
<line x1="300" y1="240" x2="300" y2="60" stroke="#111" stroke-width="1.2"/>
<text x="385" y="256" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">u</text>
<text x="286" y="152" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">v</text>

<!-- ================= PANEL B : bifurcation diagram ================= -->
<text x="545" y="34" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">(c) hysteresis: broken symmetry</text>
<text x="545" y="50" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">two saddle-nodes, not a pitchfork</text>

<rect x="560" y="60" width="230" height="180" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>
<!-- lower stable branch -->
<path d="M 562.2,230.1 L 585.4,228.8 L 619.9,226.5 L 648.9,224.3 L 672.4,222 L 690.8,219.8 L 704.3,217.5 L 713.5,215.3 L 718.9,213 L 721.2,210" fill="none" stroke="#1a6fb5" stroke-width="2.4"/>
<!-- unstable middle branch -->
<path d="M 721.2,210 L 720.7,208.5 L 714.4,204 L 703.5,199.5 L 690.7,195 L 677.8,190.5 L 666,186 L 651.5,179.3 L 641.3,172.5 L 635.5,165.8 L 633.2,158" fill="none" stroke="#d1495b" stroke-width="2" stroke-dasharray="5,4"/>
<!-- upper stable branch -->
<path d="M 633.2,158 L 635.3,150 L 641.7,141 L 657,127.5 L 677.5,114 L 709.3,96 L 744.7,78 L 782.2,60" fill="none" stroke="#1a6fb5" stroke-width="2.4"/>
<!-- fold markers -->
<circle cx="721.2" cy="210" r="4" fill="#2e8b57" stroke="#111" stroke-width="1"/>
<circle cx="633.2" cy="158" r="4" fill="#2e8b57" stroke="#111" stroke-width="1"/>
<!-- jump arrows -->
<defs>
<marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M 0,0 L 6,3 L 0,6 z" fill="#111"/>
</marker>
</defs>
<line x1="721.2" y1="207" x2="721.2" y2="94" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="633.2" y1="161" x2="633.2" y2="221" stroke="#111" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="726" y="150" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">jump ON</text>
<text x="726" y="162" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">at 3.54</text>
<text x="566" y="192" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">jump OFF</text>
<text x="566" y="204" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">at 2.70</text>
<text x="648" y="112" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b">unstable</text>
<text x="600" y="80" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a6fb5">U-high branch</text>
<text x="600" y="238" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a6fb5">U-low branch</text>
<line x1="560" y1="240" x2="790" y2="240" stroke="#111" stroke-width="1.2"/>
<line x1="560" y1="240" x2="560" y2="60" stroke="#111" stroke-width="1.2"/>
<text x="633" y="256" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">2.70</text>
<text x="708" y="256" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">3.54</text>
<text x="640" y="270" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">input (production of u)</text>
<text x="540" y="152" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">u</text>

<!-- ================= caption strip ================= -->
<text x="60" y="300" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">Symmetric system: the tie state loses stability at &#945; = 2 along the antisymmetric direction &#8594; supercritical pitchfork.</text>
<text x="60" y="318" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">Break the symmetry (unequal promoter strengths, or an input) and the pitchfork unfolds into the two folds of panel (c).</text>
<text x="60" y="336" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">The gap between the two folds is the hysteresis loop &#8212; and the loop, not the steepness, is what proves bistability.</text>

<!-- legend -->
<line x1="60" y1="368" x2="88" y2="368" stroke="#1a6fb5" stroke-width="2.4"/>
<text x="94" y="372" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">stable branch / v-nullcline</text>
<line x1="270" y1="368" x2="298" y2="368" stroke="#d1495b" stroke-width="2" stroke-dasharray="5,4"/>
<text x="304" y="372" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">unstable branch / u-nullcline</text>
<circle cx="520" cy="368" r="4.5" fill="#2e8b57" stroke="#111" stroke-width="1"/>
<text x="530" y="372" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">stable</text>
<circle cx="590" cy="368" r="4.5" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
<text x="600" y="372" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">saddle (unstable)</text>
</svg>
