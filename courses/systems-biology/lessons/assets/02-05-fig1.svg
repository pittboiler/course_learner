<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 700" width="560" height="700" role="img" aria-label="Panel a: the incoherent type-1 feed-forward loop wiring beside a time course in which the output pulses to 50 then settles to an adapted plateau of 20, overlaid on a simple-regulation curve reaching the same plateau far more slowly. Panel b: a single-input module in which a rising regulator crosses four promoter thresholds in order, switching four genes on in threshold rank and off in the reverse order.">
