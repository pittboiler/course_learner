<svg viewBox="0 0 720 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">One twiddle multiply, two outputs &#8212; that is the butterfly. Stack log&#8322;N stages of them and the DFT costs N log&#8322;N.</text>

  <!-- ============ panel A: the generic butterfly ============ -->

  <text x="55" y="60" fill="#8a8a8a">The butterfly</text>

  <!-- E branch: straight to top, diagonal to bottom -->
  <line x1="62" y1="105" x2="228" y2="105" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="62" y1="105" x2="228" y2="230" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- O branch into the twiddle multiplier -->
  <line x1="62" y1="230" x2="112" y2="230" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="126" cy="230" r="13" fill="none" stroke="#e0645c" stroke-width="2"/>
  <line x1="119" y1="223" x2="133" y2="237" stroke="#e0645c" stroke-width="1.6"/>
  <line x1="133" y1="223" x2="119" y2="237" stroke="#e0645c" stroke-width="1.6"/>
  <text x="103" y="262" fill="#e0645c">W</text>
  <text x="116" y="266" fill="#e0645c" font-size="10">N</text>
  <text x="116" y="255" fill="#e0645c" font-size="10">k</text>
  <text x="128" y="262" fill="#e0645c">(twiddle)</text>

  <!-- twiddled O out to both outputs -->
  <line x1="139" y1="230" x2="228" y2="105" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="139" y1="230" x2="228" y2="230" stroke="#e0645c" stroke-width="2.5"/>

  <!-- signs at the summing nodes -->
  <circle cx="228" cy="105" r="4" fill="#8a8a8a"/>
  <circle cx="228" cy="230" r="4" fill="#8a8a8a"/>
  <text x="206" y="128" fill="#e0645c">+</text>
  <text x="206" y="212" fill="#e0645c">&#8722;</text>

  <!-- input / output labels -->
  <text x="26" y="110" fill="#8a8a8a">E[k]</text>
  <text x="26" y="235" fill="#8a8a8a">O[k]</text>
  <text x="236" y="110" fill="#8a8a8a">X[k]</text>
  <text x="236" y="235" fill="#8a8a8a">X[k+N/2]</text>

  <text x="26" y="300" fill="#8a8a8a" font-size="11">E, O = the half-size DFTs of the even and</text>
  <text x="26" y="316" fill="#8a8a8a" font-size="11">odd samples. The minus is W^(N/2) = &#8722;1.</text>

  <!-- divider -->
  <line x1="310" y1="55" x2="310" y2="320" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- ============ panel B: full N = 4 flow graph ============ -->

  <text x="345" y="60" fill="#8a8a8a">The whole N = 4 transform</text>

  <!-- stage 1 : pairs (row1,row2) and (row3,row4) -->
  <line x1="392" y1="100" x2="497" y2="100" stroke="#4a90d9" stroke-width="2"/>
  <line x1="392" y1="155" x2="497" y2="155" stroke="#4a90d9" stroke-width="2"/>
  <line x1="392" y1="100" x2="497" y2="155" stroke="#e0645c" stroke-width="2"/>
  <line x1="392" y1="155" x2="497" y2="100" stroke="#e0645c" stroke-width="2"/>

  <line x1="392" y1="210" x2="497" y2="210" stroke="#4a90d9" stroke-width="2"/>
  <line x1="392" y1="265" x2="497" y2="265" stroke="#4a90d9" stroke-width="2"/>
  <line x1="392" y1="210" x2="497" y2="265" stroke="#e0645c" stroke-width="2"/>
  <line x1="392" y1="265" x2="497" y2="210" stroke="#e0645c" stroke-width="2"/>

  <!-- stage 2 : pairs (row1,row3) and (row2,row4) -->
  <line x1="497" y1="100" x2="607" y2="100" stroke="#4a90d9" stroke-width="2"/>
  <line x1="497" y1="210" x2="607" y2="210" stroke="#4a90d9" stroke-width="2"/>
  <line x1="497" y1="100" x2="607" y2="210" stroke="#e0645c" stroke-width="2"/>
  <line x1="497" y1="210" x2="607" y2="100" stroke="#e0645c" stroke-width="2"/>

  <line x1="497" y1="155" x2="607" y2="155" stroke="#4a90d9" stroke-width="2"/>
  <line x1="497" y1="265" x2="607" y2="265" stroke="#4a90d9" stroke-width="2"/>
  <line x1="497" y1="155" x2="607" y2="265" stroke="#e0645c" stroke-width="2"/>
  <line x1="497" y1="265" x2="607" y2="155" stroke="#e0645c" stroke-width="2"/>

  <!-- nodes -->
  <circle cx="392" cy="100" r="4" fill="#8a8a8a"/>
  <circle cx="392" cy="155" r="4" fill="#8a8a8a"/>
  <circle cx="392" cy="210" r="4" fill="#8a8a8a"/>
  <circle cx="392" cy="265" r="4" fill="#8a8a8a"/>
  <circle cx="497" cy="100" r="4" fill="#8a8a8a"/>
  <circle cx="497" cy="155" r="4" fill="#8a8a8a"/>
  <circle cx="497" cy="210" r="4" fill="#8a8a8a"/>
  <circle cx="497" cy="265" r="4" fill="#8a8a8a"/>
  <circle cx="607" cy="100" r="4" fill="#8a8a8a"/>
  <circle cx="607" cy="155" r="4" fill="#8a8a8a"/>
  <circle cx="607" cy="210" r="4" fill="#8a8a8a"/>
  <circle cx="607" cy="265" r="4" fill="#8a8a8a"/>

  <!-- twiddle tags on the lower node of each stage-2 butterfly -->
  <text x="505" y="228" fill="#e0645c" font-size="11">&#215; 1</text>
  <text x="505" y="283" fill="#e0645c" font-size="11">&#215; (&#8722;j)</text>

  <!-- input labels, bit reversed order -->
  <text x="345" y="105" fill="#8a8a8a">x[0]</text>
  <text x="345" y="160" fill="#8a8a8a">x[2]</text>
  <text x="345" y="215" fill="#8a8a8a">x[1]</text>
  <text x="345" y="270" fill="#8a8a8a">x[3]</text>

  <!-- output labels -->
  <text x="617" y="105" fill="#8a8a8a">X[0]</text>
  <text x="617" y="160" fill="#8a8a8a">X[1]</text>
  <text x="617" y="215" fill="#8a8a8a">X[2]</text>
  <text x="617" y="270" fill="#8a8a8a">X[3]</text>

  <!-- stage brackets -->
  <text x="416" y="300" fill="#8a8a8a" font-size="11">stage 1</text>
  <text x="527" y="300" fill="#8a8a8a" font-size="11">stage 2</text>
  <text x="345" y="322" fill="#8a8a8a" font-size="11">inputs enter bit reversed; 2 stages &#215; 2 butterflies = 4 butterflies total</text>
</svg>
