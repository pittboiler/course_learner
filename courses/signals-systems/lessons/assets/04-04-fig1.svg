<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Filter specifications: the dashed coral outline is the ideal you cannot build; the blue curve is what you can.</text>

  <!-- band shading -->
  <rect x="70" y="60" width="200" height="210" fill="#4a90d9" opacity="0.09"/>
  <rect x="270" y="60" width="100" height="210" fill="#8a8a8a" opacity="0.12"/>
  <rect x="370" y="60" width="240" height="210" fill="#e0645c" opacity="0.09"/>

  <!-- axes -->
  <line x1="70" y1="270" x2="626" y2="270" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="626,270 616,265 616,275" fill="#8a8a8a"/>
  <text x="630" y="275" fill="#8a8a8a">&#969;</text>
  <line x1="70" y1="284" x2="70" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,52 65,62 75,62" fill="#8a8a8a"/>
  <text x="78" y="50" fill="#8a8a8a">|H(j&#969;)|</text>

  <!-- y-axis ticks and levels -->
  <line x1="64" y1="90" x2="70" y2="90" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="50" y="94" fill="#8a8a8a">1</text>
  <text x="50" y="274" fill="#8a8a8a">0</text>
  <line x1="70" y1="108" x2="270" y2="108" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="12" y="112" fill="#8a8a8a">1&#8722;&#948;<tspan font-size="10" dy="3">p</tspan></text>
  <line x1="370" y1="252" x2="610" y2="252" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="42" y="256" fill="#8a8a8a">&#948;<tspan font-size="10" dy="3">s</tspan></text>
  <line x1="64" y1="252" x2="70" y2="252" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- band-edge verticals -->
  <line x1="270" y1="90" x2="270" y2="280" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="370" y1="90" x2="370" y2="280" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="258" y="296" fill="#8a8a8a">&#969;<tspan font-size="10" dy="3">p</tspan></text>
  <text x="358" y="296" fill="#8a8a8a">&#969;<tspan font-size="10" dy="3">s</tspan></text>

  <!-- ideal brick wall (dashed coral) -->
  <path d="M 70 90 L 320 90 L 320 268 L 610 268" fill="none" stroke="#e0645c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="330" y="176" fill="#e0645c">ideal brick wall</text>
  <text x="330" y="192" fill="#e0645c">(unrealizable)</text>

  <!-- realizable magnitude response -->
  <path d="M 70 92 L 100 90 L 130 94 L 160 90.5 L 190 95 L 220 91 L 245 97 L 270 108 L 285 126 L 300 150 L 315 176 L 330 200 L 345 224 L 358 242 L 370 252 L 395 259 L 420 262.5 L 460 265.5 L 500 267.5 L 550 268.6 L 610 269.2"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="86" y="76" fill="#4a90d9">realizable |H|</text>

  <!-- passband ripple bracket -->
  <line x1="212" y1="90" x2="212" y2="108" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="212,90 208,98 216,98" fill="#e0645c"/>
  <polygon points="212,108 208,100 216,100" fill="#e0645c"/>
  <text x="196" y="128" fill="#e0645c">ripple &#948;<tspan font-size="10" dy="3">p</tspan></text>

  <!-- stopband attenuation bracket -->
  <line x1="470" y1="252" x2="470" y2="270" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="470,252 466,260 474,260" fill="#e0645c"/>
  <polygon points="470,270 466,262 474,262" fill="#e0645c"/>
  <text x="482" y="248" fill="#e0645c">stopband floor &#948;<tspan font-size="10" dy="3">s</tspan></text>

  <!-- band names -->
  <text x="140" y="318" fill="#8a8a8a">passband</text>
  <text x="278" y="318" fill="#8a8a8a">transition</text>
  <text x="452" y="318" fill="#8a8a8a">stopband</text>
</svg>
