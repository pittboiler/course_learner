<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Direct form II: one delay chain, feedback taps on the left, feed-forward taps on the right.</text>

  <!-- section labels -->
  <text x="126" y="52" fill="#8a8a8a" font-size="11" font-style="italic">feedback (poles)</text>
  <text x="404" y="52" fill="#8a8a8a" font-size="11" font-style="italic">feed forward (zeros)</text>

  <!-- ============ top rail ============ -->
  <text x="46" y="85" fill="#4a90d9">x[n]</text>
  <line x1="84" y1="90" x2="130" y2="90" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="136,90 126,85 126,95" fill="#4a90d9"/>

  <!-- left summing junction -->
  <circle cx="150" cy="90" r="14" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="144" y="96" fill="#8a8a8a">&#8721;</text>

  <!-- rail from left sum to w node, then on through b0 to right sum -->
  <line x1="164" y1="90" x2="390" y2="90" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="330" cy="90" r="4" fill="#4a90d9"/>
  <text x="300" y="76" fill="#4a90d9" font-size="13">w[n]</text>

  <!-- b0 gain -->
  <polygon points="390,80 390,100 418,90" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="392" y="76" fill="#e0645c" font-size="13">b<tspan font-size="10" dy="4">0</tspan></text>
  <line x1="418" y1="90" x2="482" y2="90" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="486,90 476,85 476,95" fill="#4a90d9"/>

  <!-- right summing junction -->
  <circle cx="500" cy="90" r="14" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="494" y="96" fill="#8a8a8a">&#8721;</text>
  <line x1="514" y1="90" x2="596" y2="90" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="602,90 592,85 592,95" fill="#4a90d9"/>
  <text x="608" y="85" fill="#4a90d9">y[n]</text>

  <!-- ============ delay chain ============ -->
  <line x1="330" y1="90" x2="330" y2="140" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="330,146 325,136 335,136" fill="#4a90d9"/>
  <rect x="305" y="146" width="50" height="38" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="318" y="171" fill="#8a8a8a">z<tspan font-size="10" dy="-6">&#8722;1</tspan></text>

  <line x1="330" y1="184" x2="330" y2="195" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="330" cy="195" r="4" fill="#4a90d9"/>
  <text x="286" y="185" fill="#4a90d9" font-size="13">w[n&#8722;1]</text>

  <line x1="330" y1="195" x2="330" y2="245" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="330,251 325,241 335,241" fill="#4a90d9"/>
  <rect x="305" y="251" width="50" height="38" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="318" y="276" fill="#8a8a8a">z<tspan font-size="10" dy="-6">&#8722;1</tspan></text>

  <line x1="330" y1="289" x2="330" y2="300" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="330" cy="300" r="4" fill="#4a90d9"/>
  <text x="286" y="322" fill="#4a90d9" font-size="13">w[n&#8722;2]</text>

  <!-- ============ feed forward taps ============ -->
  <!-- b1 -->
  <line x1="330" y1="195" x2="390" y2="195" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="390,185 390,205 418,195" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="392" y="181" fill="#e0645c" font-size="13">b<tspan font-size="10" dy="4">1</tspan></text>
  <line x1="418" y1="195" x2="482" y2="195" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="486,195 476,190 476,200" fill="#4a90d9"/>

  <circle cx="500" cy="195" r="14" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="494" y="201" fill="#8a8a8a">&#8721;</text>
  <line x1="500" y1="181" x2="500" y2="110" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="500,104 495,114 505,114" fill="#4a90d9"/>

  <!-- b2 -->
  <line x1="330" y1="300" x2="390" y2="300" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="390,290 390,310 418,300" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="392" y="286" fill="#e0645c" font-size="13">b<tspan font-size="10" dy="4">2</tspan></text>
  <line x1="418" y1="300" x2="500" y2="300" stroke="#4a90d9" stroke-width="2"/>
  <line x1="500" y1="300" x2="500" y2="215" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="500,209 495,219 505,219" fill="#4a90d9"/>

  <!-- ============ feedback taps ============ -->
  <!-- minus a1 -->
  <line x1="330" y1="195" x2="270" y2="195" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="270,185 270,205 242,195" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="238" y="181" fill="#e0645c" font-size="13">&#8722;a<tspan font-size="10" dy="4">1</tspan></text>
  <line x1="242" y1="195" x2="170" y2="195" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="164,195 174,190 174,200" fill="#4a90d9"/>

  <circle cx="150" cy="195" r="14" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="144" y="201" fill="#8a8a8a">&#8721;</text>
  <line x1="150" y1="181" x2="150" y2="110" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="150,104 145,114 155,114" fill="#4a90d9"/>

  <!-- minus a2 -->
  <line x1="330" y1="300" x2="270" y2="300" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="270,290 270,310 242,300" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="238" y="286" fill="#e0645c" font-size="13">&#8722;a<tspan font-size="10" dy="4">2</tspan></text>
  <line x1="242" y1="300" x2="150" y2="300" stroke="#4a90d9" stroke-width="2"/>
  <line x1="150" y1="300" x2="150" y2="215" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="150,209 145,219 155,219" fill="#4a90d9"/>

  <!-- footnote -->
  <text x="40" y="352" fill="#8a8a8a" font-size="11" font-style="italic">Three parts only: delay boxes, triangular gains, circular adders. Delete the left half and it is FIR.</text>
</svg>
