<svg viewBox="0 0 660 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">The DTFT repeats forever with period 2&#960; &#8212; only the shaded band carries new information.</text>

  <!-- principal band shading -->
  <rect x="265" y="112" width="150" height="138" fill="#e0645c" opacity="0.12"/>
  <line x1="265" y1="112" x2="265" y2="250" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="415" y1="112" x2="415" y2="250" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="340" y="106" fill="#e0645c" text-anchor="middle">principal band: &#8722;&#960; &#8804; &#937; &#8804; &#960;</text>

  <!-- period 2 pi marker, peak to peak -->
  <line x1="340" y1="130" x2="490" y2="130" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="340,130 349,126 349,134" fill="#e0645c"/>
  <polygon points="490,130 481,126 481,134" fill="#e0645c"/>
  <text x="415" y="124" fill="#e0645c" text-anchor="middle">period 2&#960;</text>

  <!-- frequency axis -->
  <line x1="100" y1="250" x2="596" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="596,250 586,245 586,255" fill="#8a8a8a"/>
  <text x="602" y="255" fill="#8a8a8a">&#937;</text>
  <!-- magnitude axis -->
  <line x1="100" y1="250" x2="100" y2="132" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="100,132 95,142 105,142" fill="#8a8a8a"/>
  <text x="72" y="146" fill="#8a8a8a">|X|</text>

  <!-- ticks -->
  <line x1="115" y1="250" x2="115" y2="256" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="190" y1="250" x2="190" y2="256" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="265" y1="250" x2="265" y2="256" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="340" y1="250" x2="340" y2="256" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="415" y1="250" x2="415" y2="256" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="490" y1="250" x2="490" y2="256" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="565" y1="250" x2="565" y2="256" stroke="#8a8a8a" stroke-width="1"/>
  <text x="115" y="270" fill="#8a8a8a" text-anchor="middle">&#8722;3&#960;</text>
  <text x="190" y="270" fill="#8a8a8a" text-anchor="middle">&#8722;2&#960;</text>
  <text x="265" y="270" fill="#8a8a8a" text-anchor="middle">&#8722;&#960;</text>
  <text x="340" y="270" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="415" y="270" fill="#8a8a8a" text-anchor="middle">&#960;</text>
  <text x="490" y="270" fill="#8a8a8a" text-anchor="middle">2&#960;</text>
  <text x="565" y="270" fill="#8a8a8a" text-anchor="middle">3&#960;</text>

  <!-- the periodic spectrum -->
  <polyline fill="none" stroke="#4a90d9" stroke-width="2.6" points="115,222.5 124.4,222 133.8,220.4 143.1,217.4 152.5,212.3 161.9,203.6 171.3,188.5 180.6,162.2 190,140 199.4,162.2 208.8,188.5 218.1,203.6 227.5,212.3 236.9,217.4 246.3,220.4 255.6,222 265,222.5 274.4,222 283.8,220.4 293.1,217.4 302.5,212.3 311.9,203.6 321.3,188.5 330.6,162.2 340,140 349.4,162.2 358.8,188.5 368.1,203.6 377.5,212.3 386.9,217.4 396.3,220.4 405.6,222 415,222.5 424.4,222 433.8,220.4 443.1,217.4 452.5,212.3 461.9,203.6 471.3,188.5 480.6,162.2 490,140 499.4,162.2 508.8,188.5 518.1,203.6 527.5,212.3 536.9,217.4 546.3,220.4 555.6,222 565,222.5"/>

  <!-- DC peak marker -->
  <circle cx="340" cy="140" r="3.6" fill="#e0645c"/>
  <text x="346" y="155" fill="#e0645c">DC</text>

  <!-- Nyquist callout -->
  <line x1="415" y1="256" x2="415" y2="282" stroke="#e0645c" stroke-width="1.2"/>
  <polygon points="415,282 411,273 419,273" fill="#e0645c"/>
  <text x="424" y="290" fill="#e0645c">&#937; = &#960;: fastest oscillation, f = f<tspan dy="4" font-size="10">s</tspan><tspan dy="-4">/2</tspan></text>

  <!-- ===== inset: the alternating sequence ===== -->
  <text x="60" y="338" fill="#8a8a8a">x[n] = (&#8722;1)<tspan dy="-6" font-size="10">n</tspan><tspan dy="6"> = cos(&#960;n)</tspan></text>
  <line x1="60" y1="380" x2="256" y2="380" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="256,380 247,376 247,384" fill="#8a8a8a"/>
  <text x="262" y="385" fill="#8a8a8a">n</text>

  <line x1="74" y1="380" x2="74" y2="402" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="74" cy="402" r="3.4" fill="#4a90d9"/>
  <line x1="96" y1="380" x2="96" y2="358" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="96" cy="358" r="3.4" fill="#4a90d9"/>
  <line x1="118" y1="380" x2="118" y2="402" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="118" cy="402" r="3.4" fill="#4a90d9"/>
  <line x1="140" y1="380" x2="140" y2="358" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="140" cy="358" r="3.4" fill="#4a90d9"/>
  <line x1="162" y1="380" x2="162" y2="402" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="162" cy="402" r="3.4" fill="#4a90d9"/>
  <line x1="184" y1="380" x2="184" y2="358" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="184" cy="358" r="3.4" fill="#4a90d9"/>
  <line x1="206" y1="380" x2="206" y2="402" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="206" cy="402" r="3.4" fill="#4a90d9"/>
  <line x1="228" y1="380" x2="228" y2="358" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="228" cy="358" r="3.4" fill="#4a90d9"/>
  <text x="140" y="396" fill="#8a8a8a" font-size="10" text-anchor="middle">n = 0</text>

  <text x="320" y="352" fill="#8a8a8a">One full cycle every two samples &#8212; the</text>
  <text x="320" y="372" fill="#8a8a8a">highest frequency a sampled signal can</text>
  <text x="320" y="392" fill="#8a8a8a">carry. Ask for faster and it folds back.</text>
</svg>
