  <line x1="320" y1="200" x2="320" y2="206" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="470" y1="200" x2="470" y2="206" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="152" y="222" fill="#8a8a8a">&#8722;&#969;<tspan dy="4" font-size="10">s</tspan></text>
  <text x="316" y="222" fill="#8a8a8a">0</text>
  <text x="462" y="222" fill="#8a8a8a">&#969;<tspan dy="4" font-size="10">s</tspan></text>

