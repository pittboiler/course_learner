<svg viewBox="0 0 640 552" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="30" y="24" fill="#8a8a8a" font-style="italic" font-size="14">Undersample and the copies collide (a) &#8212; then one set of samples fits two tones (b).</text>

  <!-- ================= panel (a): overlapping spectral copies ================= -->
  <text x="30" y="56" fill="#8a8a8a" font-size="14">(a) Sampling too slowly: &#969;<tspan dy="4" font-size="10">s</tspan><tspan dy="-4"> &lt; 2&#969;</tspan><tspan dy="4" font-size="10">M</tspan></text>

  <!-- overlap lenses, drawn first so triangle outlines sit on top -->
  <polygon points="370,200 395,182.5 420,200" fill="#e0645c" opacity="0.45"/>
  <polygon points="220,200 245,182.5 270,200" fill="#e0645c" opacity="0.45"/>

  <!-- shifted copies -->
  <polyline points="70,200 170,130 270,200" fill="none" stroke="#4a90d9" stroke-width="1.6" stroke-dasharray="5 4"/>
  <polyline points="370,200 470,130 570,200" fill="none" stroke="#4a90d9" stroke-width="1.6" stroke-dasharray="5 4"/>
  <!-- baseband copy -->
  <polyline points="220,200 320,130 420,200" fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- frequency axis -->
  <line x1="40" y1="200" x2="612" y2="200" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="612,200 602,195 602,205" fill="#8a8a8a"/>
  <text x="600" y="222" fill="#8a8a8a">&#969;</text>

