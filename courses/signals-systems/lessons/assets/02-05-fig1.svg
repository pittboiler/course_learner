<svg viewBox="0 0 880 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="26" fill="#8a8a8a" font-style="italic">Every pole is a note the system can play: horizontal position sets how fast it dies, vertical position sets how fast it rings.</text>

  <!-- half plane shading -->
  <rect x="90" y="110" width="160" height="340" fill="#4a90d9" opacity="0.07"/>
  <rect x="250" y="110" width="170" height="340" fill="#e0645c" opacity="0.07"/>

  <text x="90" y="98" fill="#8a8a8a" font-size="15">the s-plane</text>

  <!-- sigma axis -->
  <line x1="90" y1="300" x2="432" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="432,300 422,295 422,305" fill="#8a8a8a"/>
  <text x="438" y="305" fill="#8a8a8a">&#963;</text>
  <text x="238" y="318" fill="#8a8a8a" font-size="11">0</text>

  <!-- sigma ticks -->
  <line x1="100" y1="296" x2="100" y2="304" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="150" y1="296" x2="150" y2="304" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="200" y1="296" x2="200" y2="304" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="300" y1="296" x2="300" y2="304" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="350" y1="296" x2="350" y2="304" stroke="#8a8a8a" stroke-width="1"/>
  <text x="92" y="318" fill="#8a8a8a" font-size="11">&#8722;3</text>
  <text x="142" y="318" fill="#8a8a8a" font-size="11">&#8722;2</text>
  <text x="192" y="318" fill="#8a8a8a" font-size="11">&#8722;1</text>
  <text x="296" y="318" fill="#8a8a8a" font-size="11">1</text>
  <text x="346" y="318" fill="#8a8a8a" font-size="11">2</text>

  <!-- j omega axis: the stability boundary -->
  <line x1="250" y1="455" x2="250" y2="105" stroke="#e0645c" stroke-width="2"/>
  <polygon points="250,105 245,116 255,116" fill="#e0645c"/>
  <text x="258" y="102" fill="#e0645c">j&#969;</text>

  <!-- j omega ticks -->
  <line x1="246" y1="258" x2="254" y2="258" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="246" y1="216" x2="254" y2="216" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="246" y1="174" x2="254" y2="174" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="246" y1="342" x2="254" y2="342" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="246" y1="384" x2="254" y2="384" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="246" y1="426" x2="254" y2="426" stroke="#8a8a8a" stroke-width="1"/>
  <text x="258" y="262" fill="#8a8a8a" font-size="11">j1</text>
  <text x="258" y="220" fill="#8a8a8a" font-size="11">j2</text>
  <text x="264" y="178" fill="#8a8a8a" font-size="11">j3</text>
  <text x="258" y="346" fill="#8a8a8a" font-size="11">&#8722;j1</text>
  <text x="258" y="388" fill="#8a8a8a" font-size="11">&#8722;j2</text>
  <text x="264" y="430" fill="#8a8a8a" font-size="11">&#8722;j3</text>

  <!-- pole 1: real, left half -->
  <line x1="118" y1="293" x2="132" y2="307" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="132" y1="293" x2="118" y2="307" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="125" cy="272" r="10" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <text x="121" y="276" fill="#8a8a8a" font-size="11">1</text>

  <!-- pole 2: complex pair, left half -->
  <line x1="193" y1="209" x2="207" y2="223" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="207" y1="209" x2="193" y2="223" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="193" y1="377" x2="207" y2="391" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="207" y1="377" x2="193" y2="391" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="200" y1="223" x2="200" y2="377" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3 5" opacity="0.6"/>
  <circle cx="174" cy="206" r="10" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <text x="170" y="210" fill="#8a8a8a" font-size="11">2</text>

  <!-- pole 3: pair sitting on the axis -->
  <line x1="243" y1="167" x2="257" y2="181" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="257" y1="167" x2="243" y2="181" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="243" y1="419" x2="257" y2="433" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="257" y1="419" x2="243" y2="433" stroke="#e0645c" stroke-width="2.5"/>
  <circle cx="216" cy="174" r="10" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <text x="212" y="178" fill="#8a8a8a" font-size="11">3</text>

  <!-- pole 4: real, right half -->
  <line x1="318" y1="293" x2="332" y2="307" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="332" y1="293" x2="318" y2="307" stroke="#e0645c" stroke-width="2.5"/>
  <circle cx="325" cy="272" r="10" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <text x="321" y="276" fill="#8a8a8a" font-size="11">4</text>

  <!-- half plane verdicts -->
  <text x="90" y="474" fill="#4a90d9" font-size="12">LEFT half-plane &#8212; every mode decays (STABLE)</text>
  <text x="90" y="494" fill="#e0645c" font-size="12">RIGHT half-plane &#8212; some mode grows (UNSTABLE)</text>
  <text x="90" y="514" fill="#8a8a8a" font-size="12" font-style="italic">on the j&#969; axis &#8212; sustained, never decays (marginal)</text>
  <text x="90" y="536" fill="#8a8a8a" font-size="12" font-style="italic">farther left = faster decay &#183; farther up = faster ringing</text>

  <!-- ============ mode cards ============ -->
  <text x="462" y="138" fill="#8a8a8a" font-size="12" font-style="italic">the mode each pole contributes to h(t):</text>

  <!-- card 1: pure decay -->
  <rect x="460" y="148" width="400" height="68" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="486" cy="168" r="11" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <text x="482" y="172" fill="#8a8a8a" font-size="12">1</text>
  <text x="506" y="166" fill="#4a90d9" font-size="12">s = &#8722;2.5  (real, left half)</text>
  <text x="506" y="188" fill="#8a8a8a" font-size="12">e<tspan font-size="9" dy="-4">&#8722;2.5t</tspan><tspan dy="4">  &#8212; pure decay, no ringing</tspan></text>
  <line x1="700" y1="182" x2="852" y2="182" stroke="#8a8a8a" stroke-width="1"/>
  <text x="856" y="186" fill="#8a8a8a" font-size="10">t</text>
  <path d="M 700 158 L 707.5 162.8 L 715 166.6 L 722.5 169.7 L 730 172.1 L 737.5 174.1 L 745 175.7 L 752.5 176.9 L 760 177.9 L 767.5 178.8 L 775 179.4 L 782.5 179.9 L 790 180.3 L 797.5 180.7 L 805 180.9 L 812.5 181.1 L 820 181.3 L 827.5 181.5 L 835 181.6 L 842.5 181.7 L 850 181.7"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- card 2: ringing decay -->
  <rect x="460" y="232" width="400" height="68" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="486" cy="252" r="11" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <text x="482" y="256" fill="#8a8a8a" font-size="12">2</text>
  <text x="506" y="250" fill="#4a90d9" font-size="12">s = &#8722;1 &#177; j2  (pair, left half)</text>
  <text x="506" y="272" fill="#8a8a8a" font-size="12">e<tspan font-size="9" dy="-4">&#8722;t</tspan><tspan dy="4">cos 2t  &#8212; ringing decay</tspan></text>
  <line x1="700" y1="266" x2="852" y2="266" stroke="#8a8a8a" stroke-width="1"/>
  <text x="856" y="270" fill="#8a8a8a" font-size="10">t</text>
  <path d="M 700 244 L 705 246 L 710 247.8 L 715 249.5 L 720 251 L 725 252.3 L 730 253.6 L 735 254.7 L 740 255.7 L 745 256.7 L 750 257.5 L 755 258.3 L 760 259 L 765 259.6 L 770 260.2 L 775 260.7 L 780 261.2 L 785 261.6 L 790 262 L 795 262.4 L 800 262.7 L 805 263 L 810 263.3 L 815 263.5 L 820 263.8 L 825 264 L 830 264.2 L 835 264.3 L 840 264.5 L 845 264.6 L 850 264.7"
        fill="none" stroke="#e0645c" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M 700 288 L 705 286 L 710 284.2 L 715 282.5 L 720 281 L 725 279.7 L 730 278.4 L 735 277.3 L 740 276.3 L 745 275.3 L 750 274.5 L 755 273.7 L 760 273 L 765 272.4 L 770 271.8 L 775 271.3 L 780 270.8 L 785 270.4 L 790 270 L 795 269.6 L 800 269.3 L 805 269 L 810 268.7 L 815 268.5 L 820 268.2 L 825 268 L 830 267.9 L 835 267.7 L 840 267.5 L 845 267.4 L 850 267.3"
        fill="none" stroke="#e0645c" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M 700 244 L 705 248.7 L 710 256.9 L 715 266 L 720 273.5 L 725 277.8 L 730 278.4 L 735 275.8 L 740 271.1 L 745 266 L 750 261.8 L 755 259.3 L 760 259 L 765 260.5 L 770 263.1 L 775 266 L 780 268.4 L 785 269.8 L 790 270 L 795 269.1 L 800 267.6 L 805 266 L 810 264.6 L 815 263.9 L 820 263.8 L 825 264.2 L 830 265.1 L 835 266 L 840 266.8 L 845 267.2 L 850 267.3"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- card 3: sustained -->
  <rect x="460" y="316" width="400" height="68" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="486" cy="336" r="11" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <text x="482" y="340" fill="#8a8a8a" font-size="12">3</text>
  <text x="506" y="334" fill="#e0645c" font-size="12">s = &#177; j3  (pair, ON the axis)</text>
  <text x="506" y="356" fill="#8a8a8a" font-size="12">cos 3t  &#8212; sustained forever</text>
  <line x1="700" y1="350" x2="852" y2="350" stroke="#8a8a8a" stroke-width="1"/>
  <text x="856" y="354" fill="#8a8a8a" font-size="10">t</text>
  <path d="M 700 330 L 705 332.7 L 710 340 L 715 350 L 720 360 L 725 367.3 L 730 370 L 735 367.3 L 740 360 L 745 350 L 750 340 L 755 332.7 L 760 330 L 765 332.7 L 770 340 L 775 350 L 780 360 L 785 367.3 L 790 370 L 795 367.3 L 800 360 L 805 350 L 810 340 L 815 332.7 L 820 330 L 825 332.7 L 830 340 L 835 350 L 840 360 L 845 367.3 L 850 370"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- card 4: growth -->
  <rect x="460" y="400" width="400" height="68" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="486" cy="420" r="11" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <text x="482" y="424" fill="#8a8a8a" font-size="12">4</text>
  <text x="506" y="418" fill="#e0645c" font-size="12">s = +1.5  (real, right half)</text>
  <text x="506" y="440" fill="#8a8a8a" font-size="12">e<tspan font-size="9" dy="-4">1.5t</tspan><tspan dy="4">  &#8212; runaway growth</tspan></text>
  <line x1="700" y1="434" x2="852" y2="434" stroke="#8a8a8a" stroke-width="1"/>
  <text x="856" y="438" fill="#8a8a8a" font-size="10">t</text>
  <path d="M 700 431.8 L 707.5 431.5 L 715 431.2 L 722.5 430.8 L 730 430.3 L 737.5 429.8 L 745 429.3 L 752.5 428.6 L 760 427.9 L 767.5 427 L 775 426.1 L 782.5 425 L 790 423.8 L 797.5 422.4 L 805 420.8 L 812.5 419 L 820 417 L 827.5 414.6 L 835 412 L 842.5 409 L 850 405.5"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>
</svg>
