  <circle cx="297" cy="80.0" r="3.5" fill="#4a90d9"/>
  <line x1="363" y1="150" x2="363" y2="80.0" stroke="#4a90d9" stroke-width="3"/>
  <circle cx="363" cy="80.0" r="3.5" fill="#4a90d9"/>
  <line x1="429" y1="150" x2="429" y2="126.7" stroke="#4a90d9" stroke-width="3"/>
  <circle cx="429" cy="126.7" r="3.5" fill="#4a90d9"/>
  <line x1="495" y1="150" x2="495" y2="136.0" stroke="#4a90d9" stroke-width="3"/>
  <circle cx="495" cy="136.0" r="3.5" fill="#4a90d9"/>
  <line x1="561" y1="150" x2="561" y2="140.0" stroke="#4a90d9" stroke-width="3"/>
  <circle cx="561" cy="140.0" r="3.5" fill="#4a90d9"/>

  <text x="367" y="76" fill="#4a90d9" font-size="11">0.637</text>
  <text x="433" y="123" fill="#4a90d9" font-size="11">0.212</text>

  <!-- even harmonics are absent: mark two zeros -->
  <circle cx="396" cy="150" r="2" fill="#8a8a8a"/>
  <circle cx="462" cy="150" r="2" fill="#8a8a8a"/>
  <circle cx="264" cy="150" r="2" fill="#8a8a8a"/>
  <text x="384" y="166" fill="#8a8a8a" font-size="10">(even k: 0)</text>

  <!-- tick labels (k) -->
  <text x="93"  y="166" fill="#8a8a8a" font-size="11">&#8722;7</text>
  <text x="159" y="166" fill="#8a8a8a" font-size="11">&#8722;5</text>
  <text x="225" y="166" fill="#8a8a8a" font-size="11">&#8722;3</text>
  <text x="291" y="166" fill="#8a8a8a" font-size="11">&#8722;1</text>
  <text x="326" y="166" fill="#8a8a8a" font-size="11">0</text>
  <text x="360" y="166" fill="#8a8a8a" font-size="11">1</text>
  <text x="426" y="166" fill="#8a8a8a" font-size="11">3</text>
  <text x="492" y="166" fill="#8a8a8a" font-size="11">5</text>
  <text x="558" y="166" fill="#8a8a8a" font-size="11">7</text>

  <!-- ================= PANEL B: filter magnitude ================= -->
  <text x="36" y="216" fill="#8a8a8a">filter |H(j&#969;)| = 1 / &#8730;(1 + (&#969;/&#969;</text>
  <text x="238" y="216" fill="#8a8a8a" font-size="9">c</text>
  <text x="243" y="216" fill="#8a8a8a">)&#178;),  with &#969;</text>
  <text x="313" y="216" fill="#8a8a8a" font-size="9">c</text>
  <text x="318" y="216" fill="#8a8a8a"> = &#969;</text>
  <text x="337" y="216" fill="#8a8a8a" font-size="9">0</text>

  <line x1="60" y1="300" x2="608" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="330" y1="300" x2="330" y2="226" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="316" y="234" fill="#8a8a8a" font-size="10">1</text>

  <path d="M 60 291.5 L 90 290.5 L 120 289.3 L 150 287.4 L 180 285.0 L 210 281.4 L 240 275.9 L 270 266.3 L 285 258.6 L 300 248.2 L 315 236.3 L 330 230.0 L 345 236.3 L 360 248.2 L 375 258.6 L 390 266.3 L 420 275.9 L 450 281.4 L 480 285.0 L 510 287.4 L 540 289.3 L 570 290.5 L 600 291.5"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>

  <!-- values read off at the harmonic frequencies -->
  <circle cx="363" cy="250.5" r="4" fill="#e0645c"/>
  <circle cx="429" cy="277.9" r="4" fill="#e0645c"/>
  <circle cx="495" cy="286.3" r="4" fill="#e0645c"/>
  <circle cx="561" cy="290.1" r="4" fill="#e0645c"/>
  <text x="369" y="248" fill="#e0645c" font-size="11">0.707</text>
  <text x="435" y="275" fill="#e0645c" font-size="11">0.316</text>

  <!-- ================= PANEL C: output line spectrum ================= -->
  <text x="36" y="378" fill="#8a8a8a">output spectrum |a</text>
  <text x="146" y="378" fill="#8a8a8a" font-size="9">k</text>
  <text x="152" y="378" fill="#8a8a8a">H(jk&#969;</text>
  <text x="188" y="378" fill="#8a8a8a" font-size="9">0</text>
  <text x="193" y="378" fill="#8a8a8a">)|  (same scale as top)</text>

  <line x1="60" y1="450" x2="608" y2="450" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="330" y1="450" x2="330" y2="392" stroke="#8a8a8a" stroke-width="1.5"/>

  <line x1="99"  y1="450" x2="99"  y2="448.6" stroke="#4a90d9" stroke-width="3"/>
  <circle cx="99"  cy="448.6" r="3" fill="#4a90d9"/>
  <line x1="165" y1="450" x2="165" y2="447.3" stroke="#4a90d9" stroke-width="3"/>
  <circle cx="165" cy="447.3" r="3" fill="#4a90d9"/>
  <line x1="231" y1="450" x2="231" y2="442.6" stroke="#4a90d9" stroke-width="3"/>
  <circle cx="231" cy="442.6" r="3" fill="#4a90d9"/>
  <line x1="297" y1="450" x2="297" y2="400.5" stroke="#4a90d9" stroke-width="3"/>
  <circle cx="297" cy="400.5" r="3.5" fill="#4a90d9"/>
  <line x1="363" y1="450" x2="363" y2="400.5" stroke="#4a90d9" stroke-width="3"/>
  <circle cx="363" cy="400.5" r="3.5" fill="#4a90d9"/>
  <line x1="429" y1="450" x2="429" y2="442.6" stroke="#4a90d9" stroke-width="3"/>
  <circle cx="429" cy="442.6" r="3" fill="#4a90d9"/>
  <line x1="495" y1="450" x2="495" y2="447.3" stroke="#4a90d9" stroke-width="3"/>
  <circle cx="495" cy="447.3" r="3" fill="#4a90d9"/>
  <line x1="561" y1="450" x2="561" y2="448.6" stroke="#4a90d9" stroke-width="3"/>
  <circle cx="561" cy="448.6" r="3" fill="#4a90d9"/>

  <text x="367" y="397" fill="#4a90d9" font-size="11">0.450</text>
  <text x="433" y="439" fill="#4a90d9" font-size="11">0.067</text>

  <text x="93"  y="466" fill="#8a8a8a" font-size="11">&#8722;7</text>
  <text x="159" y="466" fill="#8a8a8a" font-size="11">&#8722;5</text>
  <text x="225" y="466" fill="#8a8a8a" font-size="11">&#8722;3</text>
  <text x="291" y="466" fill="#8a8a8a" font-size="11">&#8722;1</text>
  <text x="326" y="466" fill="#8a8a8a" font-size="11">0</text>
  <text x="360" y="466" fill="#8a8a8a" font-size="11">1</text>
  <text x="426" y="466" fill="#8a8a8a" font-size="11">3</text>
  <text x="492" y="466" fill="#8a8a8a" font-size="11">5</text>
  <text x="558" y="466" fill="#8a8a8a" font-size="11">7</text>
  <text x="470" y="486" fill="#8a8a8a" font-size="11">harmonic index k  (frequency k&#969;</text>
  <text x="627" y="486" fill="#8a8a8a" font-size="9">0</text>
  <text x="632" y="486" fill="#8a8a8a" font-size="11">)</text>

  <!-- ============ the multiplication: guides tying k=1 and k=3 across panels ============ -->
  <line x1="363" y1="82" x2="363" y2="398" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 5" opacity="0.65"/>
  <line x1="429" y1="128" x2="429" y2="440" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 5" opacity="0.65"/>
  <text x="220" y="330" fill="#e0645c" font-size="11" font-style="italic">0.637 &#215; 0.707 = 0.450</text>
  <text x="440" y="330" fill="#e0645c" font-size="11" font-style="italic">0.212 &#215; 0.316 = 0.067</text>
</svg>
