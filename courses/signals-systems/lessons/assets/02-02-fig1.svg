  <text x="140" y="58" fill="#8a8a8a" font-size="9">k</text>
  <text x="146" y="58" fill="#8a8a8a">|  (square wave)</text>

  <line x1="60" y1="150" x2="608" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="330" y1="150" x2="330" y2="72" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- stems, height = 110 * 2/(pi|k|) -->
  <line x1="99"  y1="150" x2="99"  y2="140.0" stroke="#4a90d9" stroke-width="3"/>
  <circle cx="99"  cy="140.0" r="3.5" fill="#4a90d9"/>
