<svg viewBox="0 0 640 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="34" y="20" fill="#8a8a8a" font-style="italic" font-size="13">Bin by bin: every input line is scaled by |H| at its own frequency — highs get crushed.</text>

  <!-- ================= PANEL A: input line spectrum ================= -->
