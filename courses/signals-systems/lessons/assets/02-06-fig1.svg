<svg viewBox="0 0 620 262" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="24" y="22" fill="#8a8a8a" font-style="italic">Negative feedback: measure the output, scale it by G(s), subtract it from the input &#8212; the loop closes to Y/X = H/(1+GH).</text>

  <!-- input arrow -->
  <line x1="34" y1="112" x2="100" y2="112" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="110,112 100,107 100,117" fill="#8a8a8a"/>
  <text x="38" y="102" fill="#8a8a8a">X(s)</text>

  <!-- summing junction -->
  <circle cx="132" cy="112" r="20" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="124" y="118" fill="#8a8a8a" font-size="17">&#8721;</text>
  <text x="108" y="102" fill="#8a8a8a" font-size="15">+</text>
  <text x="142" y="152" fill="#e0645c" font-size="17">&#8722;</text>

  <!-- error path into H -->
  <line x1="152" y1="112" x2="216" y2="112" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="226,112 216,107 216,117" fill="#4a90d9"/>
  <text x="166" y="102" fill="#4a90d9">E(s)</text>

  <!-- forward block -->
  <rect x="226" y="86" width="92" height="52" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="255" y="118" fill="#4a90d9" font-size="16">H(s)</text>

  <!-- output line and takeoff node -->
  <line x1="318" y1="112" x2="420" y2="112" stroke="#4a90d9" stroke-width="2"/>
  <line x1="420" y1="112" x2="498" y2="112" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="508,112 498,107 498,117" fill="#4a90d9"/>
  <circle cx="420" cy="112" r="4" fill="#4a90d9"/>
  <text x="462" y="102" fill="#4a90d9">Y(s)</text>

  <!-- feedback path -->
  <line x1="420" y1="112" x2="420" y2="196" stroke="#e0645c" stroke-width="2"/>
  <line x1="420" y1="196" x2="338" y2="196" stroke="#e0645c" stroke-width="2"/>
  <polygon points="328,196 338,191 338,201" fill="#e0645c"/>

  <!-- feedback block -->
  <rect x="236" y="170" width="92" height="52" fill="#e0645c" opacity="0.15" stroke="#e0645c" stroke-width="2"/>
  <text x="265" y="202" fill="#e0645c" font-size="16">G(s)</text>

  <!-- return to the summing junction -->
  <line x1="236" y1="196" x2="132" y2="196" stroke="#e0645c" stroke-width="2"/>
  <line x1="132" y1="196" x2="132" y2="142" stroke="#e0645c" stroke-width="2"/>
  <polygon points="132,132 127,142 137,142" fill="#e0645c"/>
  <text x="150" y="216" fill="#e0645c" font-size="12" font-style="italic">G(s)Y(s), the measured output</text>

  <!-- loop gain annotation -->
  <text x="352" y="246" fill="#8a8a8a" font-size="12" font-style="italic">once around the loop = G(s)H(s)</text>
</svg>
