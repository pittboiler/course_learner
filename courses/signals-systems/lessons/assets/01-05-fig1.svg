<svg viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="30" y="20" fill="#8a8a8a" font-style="italic">Flip h, slide it to n, multiply the overlapping stems, add: one output sample per stopping place.</text>

  <line x1="424" y1="38" x2="444" y2="38" stroke="#4a90d9" stroke-width="3"/>
  <text x="450" y="43" fill="#4a90d9">x[k] = {1, 2, 3}</text>
  <line x1="424" y1="60" x2="444" y2="60" stroke="#e0645c" stroke-width="3"/>
  <text x="450" y="65" fill="#e0645c">h[n-k], flipped and shifted</text>

  <text x="62" y="44" fill="#8a8a8a">n = 1:  y[1] = 1&#215;1 + 2&#215;1 = 3</text>
  <rect x="104" y="54" width="84" height="84" fill="#e0645c" opacity="0.12"/>
  <line x1="58" y1="128" x2="336" y2="128" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="336,128 327,124 327,132" fill="#8a8a8a"/>
  <text x="341" y="133" fill="#8a8a8a">k</text>
  <line x1="118" y1="128" x2="118" y2="106" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="118" cy="106" r="3.5" fill="#4a90d9"/>
  <line x1="166" y1="128" x2="166" y2="84" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="166" cy="84" r="3.5" fill="#4a90d9"/>
  <line x1="214" y1="128" x2="214" y2="62" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="214" cy="62" r="3.5" fill="#4a90d9"/>
  <line x1="126" y1="128" x2="126" y2="106" stroke="#e0645c" stroke-width="2.5"/>
  <circle cx="126" cy="106" r="3.5" fill="#e0645c"/>
  <line x1="174" y1="128" x2="174" y2="106" stroke="#e0645c" stroke-width="2.5"/>
  <circle cx="174" cy="106" r="3.5" fill="#e0645c"/>
  <text x="114" y="144" fill="#8a8a8a" font-size="11">0</text>
  <text x="162" y="144" fill="#8a8a8a" font-size="11">1</text>
  <text x="210" y="144" fill="#8a8a8a" font-size="11">2</text>
  <text x="258" y="144" fill="#8a8a8a" font-size="11">3</text>

  <text x="62" y="164" fill="#8a8a8a">n = 2:  y[2] = 2&#215;1 + 3&#215;1 = 5</text>
  <rect x="152" y="174" width="84" height="84" fill="#e0645c" opacity="0.12"/>
  <line x1="58" y1="248" x2="336" y2="248" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="336,248 327,244 327,252" fill="#8a8a8a"/>
  <text x="341" y="253" fill="#8a8a8a">k</text>
  <line x1="118" y1="248" x2="118" y2="226" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="118" cy="226" r="3.5" fill="#4a90d9"/>
  <line x1="166" y1="248" x2="166" y2="204" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="166" cy="204" r="3.5" fill="#4a90d9"/>
  <line x1="214" y1="248" x2="214" y2="182" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="214" cy="182" r="3.5" fill="#4a90d9"/>
  <line x1="174" y1="248" x2="174" y2="226" stroke="#e0645c" stroke-width="2.5"/>
  <circle cx="174" cy="226" r="3.5" fill="#e0645c"/>
  <line x1="222" y1="248" x2="222" y2="226" stroke="#e0645c" stroke-width="2.5"/>
  <circle cx="222" cy="226" r="3.5" fill="#e0645c"/>
  <text x="114" y="264" fill="#8a8a8a" font-size="11">0</text>
  <text x="162" y="264" fill="#8a8a8a" font-size="11">1</text>
  <text x="210" y="264" fill="#8a8a8a" font-size="11">2</text>
  <text x="258" y="264" fill="#8a8a8a" font-size="11">3</text>

  <text x="62" y="284" fill="#8a8a8a">n = 3:  y[3] = 3&#215;1 = 3</text>
  <rect x="200" y="294" width="36" height="84" fill="#e0645c" opacity="0.12"/>
  <line x1="58" y1="368" x2="336" y2="368" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="336,368 327,364 327,372" fill="#8a8a8a"/>
  <text x="341" y="373" fill="#8a8a8a">k</text>
  <line x1="118" y1="368" x2="118" y2="346" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="118" cy="346" r="3.5" fill="#4a90d9"/>
  <line x1="166" y1="368" x2="166" y2="324" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="166" cy="324" r="3.5" fill="#4a90d9"/>
  <line x1="214" y1="368" x2="214" y2="302" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="214" cy="302" r="3.5" fill="#4a90d9"/>
  <line x1="222" y1="368" x2="222" y2="346" stroke="#e0645c" stroke-width="2.5"/>
  <circle cx="222" cy="346" r="3.5" fill="#e0645c"/>
  <line x1="270" y1="368" x2="270" y2="346" stroke="#e0645c" stroke-width="2.5"/>
  <circle cx="270" cy="346" r="3.5" fill="#e0645c"/>
  <text x="114" y="384" fill="#8a8a8a" font-size="11">0</text>
  <text x="162" y="384" fill="#8a8a8a" font-size="11">1</text>
  <text x="210" y="384" fill="#8a8a8a" font-size="11">2</text>
  <text x="258" y="384" fill="#8a8a8a" font-size="11">3</text>

  <text x="415" y="205" fill="#8a8a8a">the output builds up:  y[n] = {1, 3, 5, 3}</text>
  <line x1="415" y1="330" x2="646" y2="330" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="646,330 637,326 637,334" fill="#8a8a8a"/>
  <text x="651" y="335" fill="#8a8a8a">n</text>
  <line x1="440" y1="330" x2="440" y2="310" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="440" cy="310" r="3.5" fill="#4a90d9"/>
  <text x="434" y="302" fill="#e0645c" font-size="12">1</text>
  <line x1="488" y1="330" x2="488" y2="270" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="488" cy="270" r="3.5" fill="#4a90d9"/>
  <text x="482" y="262" fill="#e0645c" font-size="12">3</text>
  <line x1="536" y1="330" x2="536" y2="230" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="536" cy="230" r="3.5" fill="#4a90d9"/>
  <text x="530" y="222" fill="#e0645c" font-size="12">5</text>
  <line x1="584" y1="330" x2="584" y2="270" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="584" cy="270" r="3.5" fill="#4a90d9"/>
  <text x="578" y="262" fill="#e0645c" font-size="12">3</text>
  <text x="436" y="346" fill="#8a8a8a" font-size="11">0</text>
  <text x="484" y="346" fill="#8a8a8a" font-size="11">1</text>
  <text x="532" y="346" fill="#8a8a8a" font-size="11">2</text>
  <text x="580" y="346" fill="#8a8a8a" font-size="11">3</text>
  <text x="415" y="372" fill="#8a8a8a" font-size="12">n = 0 (not drawn): y[0] = 1&#215;1 = 1</text>
  <text x="415" y="392" fill="#8a8a8a" font-size="12">length check: 3 + 2 - 1 = 4 points</text>
</svg>
