<svg viewBox="0 0 660 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="46" y="22" fill="#8a8a8a" font-style="italic">Multiplying by a cosine slides the spectrum to ±ωc — one carrier per user.</text>

  <!-- ============ row 1: baseband message spectrum ============ -->
  <text x="46" y="52" fill="#8a8a8a">1. The message at baseband: |X(j&#969;)|, bandwidth W</text>

  <line x1="60" y1="120" x2="612" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="612,120 602,115 602,125" fill="#8a8a8a"/>
  <text x="620" y="125" fill="#8a8a8a">&#969;</text>

  <polygon points="290,120 330,66 370,120" fill="#4a90d9" opacity="0.18"/>
  <polyline points="290,120 330,66 370,120" fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <line x1="290" y1="120" x2="290" y2="127" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="330" y1="120" x2="330" y2="127" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="370" y1="120" x2="370" y2="127" stroke="#8a8a8a" stroke-width="1"/>
  <text x="290" y="142" fill="#8a8a8a" text-anchor="middle" font-size="12">&#8722;W</text>
  <text x="330" y="142" fill="#8a8a8a" text-anchor="middle" font-size="12">0</text>
  <text x="370" y="142" fill="#8a8a8a" text-anchor="middle" font-size="12">W</text>

  <!-- ============ row 2: after modulation ============ -->
  <text x="46" y="186" fill="#8a8a8a">2. After &#215; cos(&#969;<tspan font-size="10" dy="3">c</tspan><tspan dy="-3">t): two half&#8211;height copies, centred at &#177;&#969;</tspan><tspan font-size="10" dy="3">c</tspan></text>

  <line x1="60" y1="250" x2="612" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="612,250 602,245 602,255" fill="#8a8a8a"/>
  <text x="620" y="255" fill="#8a8a8a">&#969;</text>

  <polygon points="110,250 150,223 190,250" fill="#4a90d9" opacity="0.18"/>
  <polyline points="110,250 150,223 190,250" fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <polygon points="470,250 510,223 550,250" fill="#4a90d9" opacity="0.18"/>
  <polyline points="470,250 510,223 550,250" fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <line x1="510" y1="250" x2="510" y2="221" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="489" y="212" fill="#e0645c" text-anchor="middle" font-size="12">LSB</text>
  <text x="531" y="212" fill="#e0645c" text-anchor="middle" font-size="12">USB</text>

  <line x1="150" y1="250" x2="150" y2="257" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="330" y1="250" x2="330" y2="257" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="510" y1="250" x2="510" y2="257" stroke="#8a8a8a" stroke-width="1"/>
  <text x="150" y="272" fill="#8a8a8a" text-anchor="middle" font-size="12">&#8722;&#969;<tspan font-size="9" dy="3">c</tspan></text>
  <text x="330" y="272" fill="#8a8a8a" text-anchor="middle" font-size="12">0</text>
  <text x="510" y="272" fill="#8a8a8a" text-anchor="middle" font-size="12">&#969;<tspan font-size="9" dy="3">c</tspan></text>

  <line x1="470" y1="292" x2="550" y2="292" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="470,292 479,288 479,296" fill="#e0645c"/>
  <polygon points="550,292 541,288 541,296" fill="#e0645c"/>
  <text x="510" y="310" fill="#e0645c" text-anchor="middle" font-size="12">2W</text>

  <line x1="46" y1="330" x2="612" y2="330" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 6"/>

  <!-- ============ row 3: FDM stack ============ -->
  <text x="46" y="356" fill="#8a8a8a">3. FDM: three users, three carriers, one shared channel</text>

  <line x1="60" y1="430" x2="612" y2="430" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="612,430 602,425 602,435" fill="#8a8a8a"/>
  <text x="620" y="435" fill="#8a8a8a">f</text>

  <polygon points="140,430 180,390 220,430" fill="#4a90d9" opacity="0.18"/>
  <polyline points="140,430 180,390 220,430" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="280,430 320,390 360,430" fill="#e0645c" opacity="0.18"/>
  <polyline points="280,430 320,390 360,430" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="420,430 460,390 500,430" fill="#4a90d9" opacity="0.18"/>
  <polyline points="420,430 460,390 500,430" fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <text x="180" y="382" fill="#4a90d9" text-anchor="middle" font-size="12">user 1</text>
  <text x="320" y="382" fill="#e0645c" text-anchor="middle" font-size="12">user 2</text>
  <text x="460" y="382" fill="#4a90d9" text-anchor="middle" font-size="12">user 3</text>

  <line x1="180" y1="430" x2="180" y2="437" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="320" y1="430" x2="320" y2="437" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="460" y1="430" x2="460" y2="437" stroke="#8a8a8a" stroke-width="1"/>
  <text x="180" y="452" fill="#8a8a8a" text-anchor="middle" font-size="12">f<tspan font-size="9" dy="3">c1</tspan></text>
  <text x="320" y="452" fill="#8a8a8a" text-anchor="middle" font-size="12">f<tspan font-size="9" dy="3">c2</tspan></text>
  <text x="460" y="452" fill="#8a8a8a" text-anchor="middle" font-size="12">f<tspan font-size="9" dy="3">c3</tspan></text>

  <text x="250" y="424" fill="#8a8a8a" text-anchor="middle" font-size="11">guard</text>
  <text x="390" y="424" fill="#8a8a8a" text-anchor="middle" font-size="11">guard</text>
</svg>
