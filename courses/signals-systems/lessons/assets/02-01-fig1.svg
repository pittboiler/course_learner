<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Left: the RC low-pass magnitude response. Right: same frequency out, rescaled and shifted.</text>

  <!-- ============ LEFT PANEL: magnitude response ============ -->

  <!-- vertical axis -->
  <line x1="50" y1="228" x2="50" y2="70" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="50,70 45,80 55,80" fill="#8a8a8a"/>
  <text x="42" y="64" fill="#8a8a8a">|H(j&#969;)|</text>
  <!-- horizontal axis -->
  <line x1="50" y1="210" x2="358" y2="210" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="358,210 348,205 348,215" fill="#8a8a8a"/>
  <text x="252" y="252" fill="#8a8a8a">&#969;RC   (log scale)</text>

  <!-- y ticks -->
  <line x1="46" y1="90" x2="54" y2="90" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="32" y="94" fill="#8a8a8a">1</text>
  <text x="40" y="214" fill="#8a8a8a">0</text>

  <!-- x ticks: 0.1, 1, 10, 100 -->
  <line x1="60" y1="206" x2="60" y2="214" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="48" y="228" fill="#8a8a8a">0.1</text>
  <line x1="153" y1="206" x2="153" y2="214" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="149" y="228" fill="#8a8a8a">1</text>
  <line x1="247" y1="206" x2="247" y2="214" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="239" y="228" fill="#8a8a8a">10</text>
  <line x1="340" y1="206" x2="340" y2="214" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="329" y="228" fill="#8a8a8a">100</text>

  <!-- the magnitude curve 1/sqrt(1 + (wRC)^2) -->
  <path d="M 60 90.6 L 76.4 91.3 L 88.1 92.3 L 104.5 95.1 L 125.2 102.7 L 138.9 111.7 L 153.3 125.1 L 169.8 143.4 L 181.4 156.3 L 197.9 172.1 L 218.6 186.5 L 232.2 193.0 L 246.7 198.1 L 274.8 204.0 L 311.9 207.6 L 340 208.8"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- cutoff guides -->
  <line x1="50" y1="125.1" x2="153.3" y2="125.1" stroke="#e0645c" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="153.3" y1="210" x2="153.3" y2="125.1" stroke="#e0645c" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="153.3" cy="125.1" r="4.5" fill="#e0645c"/>
  <text x="160" y="118" fill="#e0645c">&#969; = 1/RC</text>
  <text x="160" y="134" fill="#e0645c">|H| = 1/&#8730;2  (&#8722;3 dB)</text>

  <!-- band labels -->
  <text x="66" y="176" fill="#8a8a8a" font-size="11" font-style="italic">passband</text>
  <text x="264" y="176" fill="#8a8a8a" font-size="11" font-style="italic">stopband</text>

  <!-- ============ RIGHT PANEL: sinusoid in, sinusoid out ============ -->

  <!-- input axis -->
  <line x1="398" y1="110" x2="618" y2="110" stroke="#8a8a8a" stroke-width="1"/>
  <text x="398" y="70" fill="#4a90d9">x(t) = cos &#969;t</text>

  <!-- input sinusoid, amplitude 30 -->
  <path d="M 400 80 L 410 85.7 L 420 100.7 L 430 119.3 L 440 134.3 L 450 140 L 460 134.3 L 470 119.3 L 480 100.7 L 490 85.7 L 500 80 L 510 85.7 L 520 100.7 L 530 119.3 L 540 134.3 L 550 140 L 560 134.3 L 570 119.3 L 580 100.7 L 590 85.7 L 600 80"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- arrow into the system box -->
  <line x1="500" y1="146" x2="500" y2="164" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="500,168 495,158 505,158" fill="#8a8a8a"/>

  <!-- system box -->
  <rect x="440" y="170" width="120" height="30" fill="#8a8a8a" opacity="0.15" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="465" y="190" fill="#8a8a8a">LTI:  h(t)</text>

  <!-- arrow out of the box -->
  <line x1="500" y1="202" x2="500" y2="216" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="500,220 495,210 505,210" fill="#8a8a8a"/>

  <!-- output axis -->
  <line x1="398" y1="250" x2="618" y2="250" stroke="#8a8a8a" stroke-width="1"/>

  <!-- output sinusoid: amplitude 30/sqrt2, phase shift 45 degrees -->
  <path d="M 400 235 L 410 229.1 L 420 231.1 L 430 240.4 L 440 253.3 L 450 265 L 460 270.9 L 470 268.9 L 480 259.6 L 490 246.7 L 500 235 L 510 229.1 L 520 231.1 L 530 240.4 L 540 253.3 L 550 265 L 560 270.9 L 570 268.9 L 580 259.6 L 590 246.7 L 600 235"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>

  <!-- peak markers showing the phase shift -->
  <line x1="500" y1="80" x2="500" y2="146" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="512.5" y1="228.5" x2="512.5" y2="290" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="500" y1="286" x2="512.5" y2="286" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="500" y1="216" x2="500" y2="290" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3 4"/>

  <text x="398" y="306" fill="#e0645c">y(t) = |H(j&#969;)| cos(&#969;t + &#8736;H(j&#969;))</text>
  <text x="522" y="290" fill="#8a8a8a" font-size="11">shift = &#8736;H/&#969;</text>
</svg>
