<svg viewBox="0 0 660 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Two worlds: a curve you can evaluate anywhere, and a list you can only index &#8212; plus what shifting and reversing do to a pulse.</text>

  <!-- ============ PANEL A: continuous-time ============ -->
  <text x="60" y="52" fill="#8a8a8a" font-size="14">continuous time: x(t), t &#8712; &#8477;</text>

  <!-- t axis -->
  <line x1="45" y1="150" x2="308" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="308,150 298,145.5 298,154.5" fill="#8a8a8a"/>
  <text x="312" y="155" fill="#8a8a8a">t</text>
  <!-- amplitude axis -->
  <line x1="60" y1="196" x2="60" y2="82" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="60,82 55.5,92 64.5,92" fill="#8a8a8a"/>
  <text x="46" y="92" fill="#8a8a8a">x</text>
  <text x="52" y="166" fill="#8a8a8a" font-size="11">0</text>

  <!-- the smooth signal -->
  <path d="M 60.0 150.0 L 64.8 132.9 L 69.5 118.2 L 74.2 106.7 L 79.0 98.7 L 83.8 94.5 L 88.5 94.1 L 93.2 97.1 L 98.0 103.1 L 102.8 111.5 L 107.5 121.6 L 112.2 132.6 L 117.0 143.8 L 121.8 154.5 L 126.5 164.1 L 131.2 172.0 L 136.0 178.0 L 140.8 181.7 L 145.5 183.2 L 150.2 182.6 L 155.0 180.0 L 159.8 175.8 L 164.5 170.3 L 169.2 164.0 L 174.0 157.4 L 178.8 150.8 L 183.5 144.8 L 188.2 139.5 L 193.0 135.3 L 197.8 132.3 L 202.5 130.7 L 207.2 130.3 L 212.0 131.2 L 216.8 133.2 L 221.5 136.1 L 226.2 139.5 L 231.0 143.4 L 235.8 147.3 L 240.5 151.1 L 245.2 154.5 L 250.0 157.4 L 254.8 159.6 L 259.5 161.0 L 264.2 161.6 L 269.0 161.5 L 273.8 160.7 L 278.5 159.3 L 283.2 157.4 L 288.0 155.2"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- callout: value exists at a non-integer time -->
  <line x1="145.5" y1="183.2" x2="145.5" y2="150" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="145.5" cy="183.2" r="3.6" fill="#e0645c"/>
  <text x="128" y="212" fill="#e0645c" font-size="11">x(4.5) exists</text>
  <text x="72" y="228" fill="#8a8a8a" font-size="11">defined for every real t &#8212; no gaps</text>

  <!-- ============ PANEL B: discrete-time ============ -->
  <text x="390" y="52" fill="#8a8a8a" font-size="14">discrete time: x[n], n &#8712; &#8484;</text>

  <line x1="375" y1="150" x2="638" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="638,150 628,145.5 628,154.5" fill="#8a8a8a"/>
  <text x="642" y="155" fill="#8a8a8a">n</text>
  <line x1="390" y1="196" x2="390" y2="82" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="390,82 385.5,92 394.5,92" fill="#8a8a8a"/>
  <text x="376" y="92" fill="#8a8a8a">x</text>

  <!-- stems -->
  <circle cx="390" cy="150.0" r="3.6" fill="#4a90d9"/>
  <line x1="409" y1="150" x2="409" y2="98.7" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="409" cy="98.7" r="3.6" fill="#4a90d9"/>
  <line x1="428" y1="150" x2="428" y2="103.1" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="428" cy="103.1" r="3.6" fill="#4a90d9"/>
  <line x1="447" y1="150" x2="447" y2="143.8" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="447" cy="143.8" r="3.6" fill="#4a90d9"/>
  <line x1="466" y1="150" x2="466" y2="178.0" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="466" cy="178.0" r="3.6" fill="#4a90d9"/>
  <line x1="485" y1="150" x2="485" y2="180.0" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="485" cy="180.0" r="3.6" fill="#4a90d9"/>
  <line x1="504" y1="150" x2="504" y2="157.4" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="504" cy="157.4" r="3.6" fill="#4a90d9"/>
  <line x1="523" y1="150" x2="523" y2="135.3" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="523" cy="135.3" r="3.6" fill="#4a90d9"/>
  <line x1="542" y1="150" x2="542" y2="131.2" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="542" cy="131.2" r="3.6" fill="#4a90d9"/>
  <line x1="561" y1="150" x2="561" y2="143.4" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="561" cy="143.4" r="3.6" fill="#4a90d9"/>
  <line x1="580" y1="150" x2="580" y2="157.4" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="580" cy="157.4" r="3.6" fill="#4a90d9"/>
  <line x1="599" y1="150" x2="599" y2="161.5" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="599" cy="161.5" r="3.6" fill="#4a90d9"/>
  <line x1="618" y1="150" x2="618" y2="155.2" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="618" cy="155.2" r="3.6" fill="#4a90d9"/>

  <!-- index ticks -->
  <text x="387" y="166" fill="#8a8a8a" font-size="11">0</text>
  <text x="425" y="166" fill="#8a8a8a" font-size="11">2</text>
  <text x="463" y="166" fill="#8a8a8a" font-size="11">4</text>
  <text x="501" y="166" fill="#8a8a8a" font-size="11">6</text>
  <text x="539" y="166" fill="#8a8a8a" font-size="11">8</text>
  <text x="575" y="166" fill="#8a8a8a" font-size="11">10</text>
  <text x="613" y="166" fill="#8a8a8a" font-size="11">12</text>

  <!-- callout: nothing between stems -->
  <line x1="475.5" y1="196" x2="475.5" y2="172" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="424" y="212" fill="#e0645c" font-size="11">x[4.5] is meaningless</text>
  <text x="402" y="228" fill="#8a8a8a" font-size="11">a sequence: nothing lives between the stems</text>

  <!-- ============ PANEL C: shift and reversal ============ -->
  <line x1="30" y1="252" x2="630" y2="252" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="2 5"/>
  <text x="30" y="278" fill="#8a8a8a" font-size="14">the two moves on the time axis (blue = original pulse p(t), coral = result)</text>

  <!-- C-left: time shift -->
  <text x="60" y="304" fill="#8a8a8a" font-size="13">time shift p(t &#8722; 3): DELAY, slides RIGHT</text>
  <line x1="70" y1="400" x2="320" y2="400" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="320,400 311,396 311,404" fill="#8a8a8a"/>
  <text x="324" y="405" fill="#8a8a8a">t</text>
  <line x1="120" y1="415" x2="120" y2="330" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="120,330 116,339 124,339" fill="#8a8a8a"/>

  <path d="M 120 400 L 180 345 L 180 400" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <path d="M 210 400 L 270 345 L 270 400" fill="none" stroke="#e0645c" stroke-width="2.5"/>

  <line x1="150" y1="318" x2="240" y2="318" stroke="#e0645c" stroke-width="1.2"/>
  <polygon points="240,318 231,314 231,322" fill="#e0645c"/>
  <text x="177" y="313" fill="#e0645c" font-size="11">+3</text>

  <text x="112" y="416" fill="#8a8a8a" font-size="11">0</text>
  <text x="176" y="416" fill="#8a8a8a" font-size="11">2</text>
  <text x="206" y="416" fill="#8a8a8a" font-size="11">3</text>
  <text x="266" y="416" fill="#8a8a8a" font-size="11">5</text>
  <text x="76" y="440" fill="#8a8a8a" font-size="11">minus sign inside, motion to the right &#8212; the classic sign trap</text>

  <!-- C-right: time reversal -->
  <text x="400" y="304" fill="#8a8a8a" font-size="13">time reversal p(&#8722;t): mirror about t = 0</text>
  <line x1="390" y1="400" x2="620" y2="400" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="620,400 611,396 611,404" fill="#8a8a8a"/>
  <text x="624" y="405" fill="#8a8a8a">t</text>
  <line x1="480" y1="415" x2="480" y2="330" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="480,330 476,339 484,339" fill="#8a8a8a"/>

  <path d="M 480 400 L 540 345 L 540 400" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <path d="M 420 400 L 420 345 L 480 400" fill="none" stroke="#e0645c" stroke-width="2.5"/>

  <line x1="480" y1="326" x2="480" y2="416" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="472" y="416" fill="#8a8a8a" font-size="11">0</text>
  <text x="536" y="416" fill="#8a8a8a" font-size="11">2</text>
  <text x="410" y="416" fill="#8a8a8a" font-size="11">&#8722;2</text>
  <text x="396" y="440" fill="#8a8a8a" font-size="11">the ramp now runs backwards: it falls instead of rises</text>
</svg>
