<svg viewBox="0 0 680 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Walk &#937; around the unit circle: |H| = (distances to zeros) / (distances to poles), so the gain spikes where the path grazes a pole.</text>

  <!-- ================= left panel: the z-plane ================= -->

  <!-- real axis -->
  <line x1="45" y1="190" x2="297" y2="190" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="299,190 289,185 289,195" fill="#8a8a8a"/>
  <text x="303" y="195" fill="#8a8a8a">Re</text>
  <!-- imaginary axis -->
  <line x1="165" y1="302" x2="165" y2="84" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="165,82 160,92 170,92" fill="#8a8a8a"/>
  <text x="172" y="88" fill="#8a8a8a">Im</text>

  <!-- unit circle -->
  <circle cx="165" cy="190" r="95" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="52" y="112" fill="#8a8a8a">|z| = 1</text>
  <line x1="70" y1="128" x2="88" y2="118" stroke="#8a8a8a" stroke-width="0.8"/>

  <!-- endpoints of the walk -->
  <circle cx="260" cy="190" r="2.5" fill="#8a8a8a"/>
  <circle cx="70" cy="190" r="2.5" fill="#8a8a8a"/>
  <text x="258" y="208" fill="#8a8a8a" text-anchor="middle">&#937; = 0</text>
  <text x="74" y="208" fill="#8a8a8a" text-anchor="middle">&#937; = &#960;</text>

  <!-- direction of travel along the circle -->
  <polygon points="251.1,149.9 258.1,156.5 251.7,159.5" fill="#8a8a8a"/>

  <!-- angle arc for Omega_0 -->
  <path d="M 195 190 A 30 30 0 0 0 180 164.0" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="190" y="183" fill="#8a8a8a" text-anchor="middle" font-size="12">&#937;<tspan font-size="9" dy="3">0</tspan></text>

  <!-- radius line out to the pole -->
  <line x1="165" y1="190" x2="207.8" y2="116.0" stroke="#4a90d9" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="140" y="140" fill="#4a90d9" font-size="12">r</text>

  <!-- dashed distance lines from the evaluation point -->
  <line x1="212.5" y1="107.7" x2="207.8" y2="116.0" stroke="#e0645c" stroke-width="1.6"/>
  <line x1="212.5" y1="107.7" x2="207.8" y2="264.1" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="212.5" y1="107.7" x2="165" y2="190" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- poles: crosses -->
  <line x1="202.8" y1="111.0" x2="212.8" y2="121.0" stroke="#4a90d9" stroke-width="2.4"/>
  <line x1="202.8" y1="121.0" x2="212.8" y2="111.0" stroke="#4a90d9" stroke-width="2.4"/>
  <line x1="202.8" y1="259.1" x2="212.8" y2="269.1" stroke="#4a90d9" stroke-width="2.4"/>
  <line x1="202.8" y1="269.1" x2="212.8" y2="259.1" stroke="#4a90d9" stroke-width="2.4"/>
  <text x="220" y="272" fill="#4a90d9" font-size="12">poles r e<tspan font-size="9" dy="-5">&#177;j&#937;0</tspan></text>

  <!-- double zero at the origin -->
  <circle cx="165" cy="190" r="5.5" fill="none" stroke="#4a90d9" stroke-width="2.2"/>
  <text x="150" y="212" fill="#4a90d9" font-size="11" text-anchor="middle">(2)</text>

  <!-- evaluation point on the circle -->
  <circle cx="212.5" cy="107.7" r="4" fill="#e0645c"/>
  <text x="219" y="96" fill="#e0645c">e<tspan font-size="10" dy="-5">j&#937;</tspan></text>

  <!-- distance labels -->
  <line x1="238" y1="122" x2="215" y2="113" stroke="#e0645c" stroke-width="0.8"/>
  <text x="241" y="126" fill="#e0645c" font-size="12">d<tspan font-size="9" dy="3">1</tspan><tspan dy="-3"> = 1 - r = 0.10</tspan></text>
  <text x="216" y="216" fill="#e0645c" font-size="12">d<tspan font-size="9" dy="3">2</tspan><tspan dy="-3"> = 1.65</tspan></text>
  <text x="194" y="143" fill="#e0645c" font-size="12">1</text>

  <!-- ================= right panel: magnitude response ================= -->

  <line x1="375" y1="300" x2="652" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="654,300 644,295 644,305" fill="#8a8a8a"/>
  <text x="658" y="305" fill="#8a8a8a">&#937;</text>
  <line x1="380" y1="305" x2="380" y2="86" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="380,84 375,94 385,94" fill="#8a8a8a"/>
  <text x="386" y="90" fill="#8a8a8a" font-size="12">|H(e<tspan font-size="9" dy="-4">j&#937;</tspan><tspan dy="4">)|</tspan></text>

  <!-- x ticks -->
  <line x1="380" y1="300" x2="380" y2="305" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="510" y1="300" x2="510" y2="305" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="640" y1="300" x2="640" y2="305" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="380" y="319" fill="#8a8a8a" font-size="12" text-anchor="middle">0</text>
  <text x="510" y="319" fill="#8a8a8a" font-size="12" text-anchor="middle">&#960;/2</text>
  <text x="640" y="319" fill="#8a8a8a" font-size="12" text-anchor="middle">&#960;</text>

  <!-- unity gain gridline -->
  <line x1="380" y1="267.7" x2="645" y2="267.7" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 4"/>
  <text x="374" y="272" fill="#8a8a8a" font-size="11" text-anchor="end">1</text>
  <text x="374" y="207" fill="#8a8a8a" font-size="11" text-anchor="end">3</text>
  <line x1="377" y1="203.1" x2="383" y2="203.1" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="374" y="110" fill="#8a8a8a" font-size="11" text-anchor="end">6</text>
  <line x1="377" y1="106.2" x2="383" y2="106.2" stroke="#8a8a8a" stroke-width="1.2"/>

  <!-- the magnitude curve -->
  <path d="M 380 264.5 L 401.7 262.0 L 423.3 252.1 L 445.0 219.8 L 455.8 171.8 L 461.3 130.0 L 466.7 103.8 L 472.1 136.3 L 477.5 181.1 L 488.3 231.1 L 510.0 264.9 L 531.7 276.6 L 553.3 282.2 L 575.0 285.2 L 596.7 286.9 L 640.0 288.1"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- peak marker aligned with Omega_0 -->
  <line x1="466.7" y1="103.8" x2="466.7" y2="300" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="466.7" cy="103.8" r="4" fill="#e0645c"/>
  <text x="476" y="106" fill="#e0645c" font-size="12">peak = 1/(d<tspan font-size="9" dy="3">1</tspan><tspan dy="-3">d</tspan><tspan font-size="9" dy="3">2</tspan><tspan dy="-3">) = 6.07</tspan></text>
  <text x="466.7" y="319" fill="#e0645c" font-size="12" text-anchor="middle">&#937;<tspan font-size="9" dy="3">0</tspan></text>
</svg>
