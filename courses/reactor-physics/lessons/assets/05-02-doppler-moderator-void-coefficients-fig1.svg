<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Heat the fuel: each resonance broadens &#8212; same area, shorter and wider, extra capture in the wings.</text>

  <!-- axes -->
  <line x1="90" y1="260" x2="560" y2="260" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="560,260 550,255 550,265" fill="#8a8a8a"/>
  <text x="540" y="282" fill="#8a8a8a">E (energy)</text>
  <line x1="90" y1="260" x2="90" y2="45" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="90,45 85,55 95,55" fill="#8a8a8a"/>
  <text x="66" y="52" fill="#8a8a8a">&#963;a</text>

  <!-- resonance-energy marker -->
  <line x1="325" y1="260" x2="325" y2="150" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="311" y="278" fill="#8a8a8a">Er</text>

  <!-- shaded wings: where hot exceeds cold (more capture) -->
  <path d="M 354 177 L 370 201.6 L 385 224.3 L 400 241 L 415 251.2 L 435 257.5 L 455 259.4 L 475 260 L 415 260 L 400 259.4 L 385 255.2 L 370 235.3 L 355 181.1 Z" fill="#e0645c" opacity="0.18"/>
  <path d="M 296 177 L 280 201.6 L 265 224.3 L 250 241 L 235 251.2 L 215 257.5 L 195 259.4 L 175 260 L 235 260 L 250 259.4 L 265 255.2 L 280 235.3 L 295 181.1 Z" fill="#e0645c" opacity="0.18"/>

  <!-- hot (broadened) resonance: coral, short and wide -->
  <path d="M 175 260 L 195 259.4 L 215 257.5 L 235 251.2 L 250 241 L 265 224.3 L 280 201.6 L 295 177 L 310 157.5 L 325 150 L 340 157.5 L 355 177 L 370 201.6 L 385 224.3 L 400 241 L 415 251.2 L 435 257.5 L 455 259.4 L 475 260"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>

  <!-- cold resonance: blue, tall and narrow -->
  <path d="M 235 260 L 250 259.4 L 265 255.2 L 280 235.3 L 295 181.1 L 310 101.5 L 325 60 L 340 101.5 L 355 181.1 L 370 235.3 L 385 255.2 L 400 259.4 L 415 260"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- labels -->
  <text x="330" y="64" fill="#4a90d9">cold: tall &amp; narrow</text>
  <text x="452" y="150" fill="#e0645c">hot: short &amp; wide</text>
  <text x="452" y="168" fill="#e0645c">(same area)</text>

  <!-- wing callout -->
  <line x1="447" y1="230" x2="415" y2="248" stroke="#e0645c" stroke-width="1"/>
  <text x="450" y="228" fill="#e0645c">more capture</text>
  <text x="450" y="246" fill="#e0645c">in the wings</text>
</svg>
