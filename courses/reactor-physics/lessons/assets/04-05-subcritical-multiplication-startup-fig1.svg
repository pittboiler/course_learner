<svg viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="60" y="24" fill="#8a8a8a" font-style="italic">1/M falls (nearly) straight to zero at criticality &#8212; extrapolate to predict the critical rod position.</text>

  <!-- y-axis -->
  <line x1="70" y1="255" x2="70" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,55 65,65 75,65" fill="#8a8a8a"/>
  <text x="42" y="52" fill="#8a8a8a">1/M</text>
  <!-- x-axis -->
  <line x1="70" y1="255" x2="565" y2="255" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="565,255 555,250 555,260" fill="#8a8a8a"/>
  <text x="430" y="300" fill="#8a8a8a">rod withdrawal (cm)</text>

  <!-- y ticks -->
  <line x1="66" y1="65" x2="70" y2="65" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="48" y="70" fill="#8a8a8a">1.0</text>
  <line x1="66" y1="160" x2="70" y2="160" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="48" y="165" fill="#8a8a8a">0.5</text>
  <text x="55" y="260" fill="#8a8a8a">0</text>

  <!-- x ticks -->
  <line x1="230" y1="255" x2="230" y2="259" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="222" y="274" fill="#8a8a8a">20</text>
  <line x1="350" y1="255" x2="350" y2="259" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="342" y="274" fill="#8a8a8a">35</text>
  <line x1="470" y1="255" x2="470" y2="259" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="462" y="274" fill="#8a8a8a">50</text>

  <!-- measured 1/M line (blue): (0,1.0) (20,0.6) (35,0.3) -->
  <polyline points="70,65 230,141 350,198" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <circle cx="70" cy="65" r="4.5" fill="#4a90d9"/>
  <circle cx="230" cy="141" r="4.5" fill="#4a90d9"/>
  <circle cx="350" cy="198" r="4.5" fill="#4a90d9"/>
  <text x="86" y="60" fill="#4a90d9">measured</text>

  <!-- extrapolation (coral dashed) from (35,0.3) to (50,0) -->
  <line x1="350" y1="198" x2="470" y2="255" stroke="#e0645c" stroke-width="2.5" stroke-dasharray="7 5"/>
  <circle cx="470" cy="255" r="5.5" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <line x1="470" y1="255" x2="470" y2="80" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="392" y="150" fill="#e0645c">extrapolate</text>
  <text x="404" y="112" fill="#e0645c">critical</text>
  <text x="386" y="130" fill="#e0645c">1/M &#8594; 0</text>
</svg>
