<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">In a volume V, n neutrons each sweep v&#183;&#916;t of path &#8212; total track length per cm&#179; per s is &#966; = n v; each cm of track scores &#931; reactions.</text>

  <!-- ===== control volume box ===== -->
  <rect x="55" y="60" width="300" height="210" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="63" y="80" fill="#8a8a8a">V (1 cm&#179;)</text>

  <!-- speed direction key -->
  <line x1="240" y1="80" x2="330" y2="80" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>
  <polygon points="330,80 321,76 321,84" fill="#8a8a8a"/>
  <text x="270" y="74" fill="#8a8a8a">speed v</text>

  <!-- neutron tracks (blue): a dot at the tail, arrow head where it is now -->
  <circle cx="80" cy="115" r="3.5" fill="#4a90d9"/>
  <line x1="80" y1="115" x2="150" y2="115" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="150,115 141,111 141,119" fill="#4a90d9"/>

  <circle cx="70" cy="160" r="3.5" fill="#4a90d9"/>
  <line x1="70" y1="160" x2="132" y2="160" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="132,160 123,156 123,164" fill="#4a90d9"/>

  <circle cx="95" cy="205" r="3.5" fill="#4a90d9"/>
  <line x1="95" y1="205" x2="158" y2="205" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="158,205 149,201 149,209" fill="#4a90d9"/>

  <circle cx="78" cy="245" r="3.5" fill="#4a90d9"/>
  <line x1="78" y1="245" x2="146" y2="245" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="146,245 137,241 137,249" fill="#4a90d9"/>

  <!-- one track that reaches a target nucleus and reacts (coral) -->
  <circle cx="180" cy="160" r="3.5" fill="#4a90d9"/>
  <line x1="180" y1="160" x2="252" y2="160" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- target nucleus -->
  <circle cx="262" cy="160" r="8" fill="none" stroke="#e0645c" stroke-width="2"/>
  <line x1="255" y1="153" x2="269" y2="167" stroke="#e0645c" stroke-width="2"/>
  <line x1="269" y1="153" x2="255" y2="167" stroke="#e0645c" stroke-width="2"/>
  <text x="243" y="192" fill="#e0645c">reaction</text>

  <!-- the one swept-length marker (coral bracket under a track) -->
  <line x1="80" y1="128" x2="150" y2="128" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="80" y1="124" x2="80" y2="132" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="150" y1="124" x2="150" y2="132" stroke="#e0645c" stroke-width="1.5"/>
  <text x="92" y="145" fill="#e0645c">v&#183;&#916;t</text>

  <!-- ===== right: the two formulas ===== -->
  <text x="400" y="120" fill="#8a8a8a">flux (track length</text>
  <text x="400" y="140" fill="#8a8a8a">per cm&#179; per s):</text>
  <text x="410" y="172" fill="#4a90d9" font-size="20">&#966; = n v</text>

  <text x="400" y="212" fill="#8a8a8a">reaction rate</text>
  <text x="400" y="232" fill="#8a8a8a">(per cm&#179; per s):</text>
  <text x="410" y="264" fill="#e0645c" font-size="20">R = &#931; &#966;</text>
</svg>
