<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">A power rise heats the core; a negative &#945;T turns that heat into negative reactivity.</text>

  <!-- input arrow -->
  <text x="38" y="110" fill="#8a8a8a">&#961;<tspan font-size="10" dy="3">ext</tspan></text>
  <line x1="36" y1="120" x2="93" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="93,120 85,116 85,124" fill="#8a8a8a"/>

  <!-- summing junction -->
  <circle cx="110" cy="120" r="15" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="110" y="125" fill="#8a8a8a" text-anchor="middle">&#931;</text>
  <text x="93" y="108" fill="#8a8a8a" font-size="13">+</text>
  <text x="118" y="146" fill="#8a8a8a" font-size="13">&#8722;</text>

  <!-- sum to kinetics -->
  <line x1="125" y1="120" x2="188" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="188,120 180,116 180,124" fill="#8a8a8a"/>
  <text x="150" y="112" fill="#e0645c">&#961;</text>

  <!-- kinetics box -->
  <rect x="188" y="97" width="132" height="46" rx="6" fill="#4a90d9" opacity="0.12"/>
  <rect x="188" y="97" width="132" height="46" rx="6" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="254" y="125" fill="#4a90d9" text-anchor="middle">Point kinetics</text>

  <!-- kinetics to heating -->
  <line x1="320" y1="120" x2="400" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="400,120 392,116 392,124" fill="#8a8a8a"/>
  <text x="356" y="112" fill="#4a90d9">P</text>

  <!-- heating box -->
  <rect x="400" y="97" width="150" height="46" rx="6" fill="#4a90d9" opacity="0.12"/>
  <rect x="400" y="97" width="150" height="46" rx="6" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="475" y="115" fill="#4a90d9" text-anchor="middle">Core heats up</text>
  <text x="475" y="133" fill="#4a90d9" text-anchor="middle" font-size="12">P &#8594; T</text>

  <!-- heating down to alpha -->
  <line x1="475" y1="143" x2="475" y2="213" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="475,213 471,205 479,205" fill="#8a8a8a"/>
  <text x="483" y="182" fill="#4a90d9">T</text>

  <!-- alpha box -->
  <rect x="430" y="213" width="170" height="52" rx="6" fill="#e0645c" opacity="0.12"/>
  <rect x="430" y="213" width="170" height="52" rx="6" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="515" y="237" fill="#e0645c" text-anchor="middle">&#945;<tspan font-size="10" dy="3">T</tspan><tspan dy="-3"> = d&#961;/dT</tspan></text>
  <text x="515" y="256" fill="#e0645c" text-anchor="middle" font-size="12">&#916;&#961;<tspan font-size="9" dy="3">fb</tspan><tspan dy="-3"> = &#945;</tspan><tspan font-size="9" dy="3">T</tspan><tspan dy="-3">&#183;&#916;T  (&lt; 0)</tspan></text>

  <!-- feedback path back to sum -->
  <line x1="430" y1="239" x2="110" y2="239" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="110" y1="239" x2="110" y2="135" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="110,135 106,143 114,143" fill="#e0645c"/>
  <text x="150" y="257" fill="#e0645c" font-size="12">&#916;&#961;<tspan font-size="9" dy="3">fb</tspan></text>

  <!-- center annotation -->
  <text x="345" y="182" fill="#e0645c" text-anchor="middle" font-style="italic" font-size="13">negative feedback &#8594; self-regulating</text>
</svg>
