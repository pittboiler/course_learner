<svg viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">One loop: fission feeds fast neutrons, slowing-down feeds thermal, thermal fission feeds back.</text>

  <!-- ===== Group 1: FAST box ===== -->
  <rect x="165" y="52" width="230" height="58" rx="4" fill="#4a90d9" opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="280" y="76" fill="#4a90d9" text-anchor="middle" font-weight="bold">Group 1 &#8212; FAST</text>
  <text x="280" y="98" fill="#4a90d9" text-anchor="middle">&#966;&#8321;   D&#8321;   &#931;a&#8321;</text>

  <!-- ===== Group 2: THERMAL box ===== -->
  <rect x="165" y="236" width="230" height="58" rx="4" fill="#4a90d9" opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="280" y="260" fill="#4a90d9" text-anchor="middle" font-weight="bold">Group 2 &#8212; THERMAL</text>
  <text x="280" y="282" fill="#4a90d9" text-anchor="middle">&#966;&#8322;   D&#8322;   &#931;a&#8322;   (most fission here)</text>

  <!-- ===== slowing-down arrow: fast -> thermal ===== -->
  <line x1="250" y1="112" x2="250" y2="228" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="250,234 245,224 255,224" fill="#e0645c"/>
  <text x="242" y="166" fill="#e0645c" text-anchor="end">&#931;&#8321;&#8594;&#8322; &#966;&#8321;</text>
  <text x="242" y="184" fill="#e0645c" text-anchor="end">slowing down</text>

  <!-- ===== fission feedback arrow: thermal -> fast ===== -->
  <line x1="318" y1="234" x2="318" y2="118" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="318,112 313,122 323,122" fill="#e0645c"/>
  <text x="330" y="166" fill="#e0645c">(1/k) &#957;&#931;f&#8322; &#966;&#8322;</text>
  <text x="330" y="184" fill="#e0645c">fission source</text>

  <!-- ===== fast losses arrow (right) ===== -->
  <line x1="395" y1="78" x2="560" y2="78" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="566,78 556,73 556,83" fill="#8a8a8a"/>
  <text x="404" y="66" fill="#8a8a8a">leak D&#8321;B&#178;&#966;&#8321;  +  absorb &#931;a&#8321;&#966;&#8321;</text>

  <!-- ===== thermal losses arrow (right) ===== -->
  <line x1="395" y1="268" x2="560" y2="268" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="566,268 556,263 556,273" fill="#8a8a8a"/>
  <text x="404" y="256" fill="#8a8a8a">leak D&#8322;B&#178;&#966;&#8322;  +  absorb &#931;a&#8322;&#966;&#8322;</text>
</svg>
