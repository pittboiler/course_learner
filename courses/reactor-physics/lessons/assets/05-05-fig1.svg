<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">As fuel burns: U&#8211;235 falls, bred Pu&#8211;239 rises and starts fissioning, fission products pile up.</text>

  <!-- axes -->
  <line x1="70" y1="280" x2="614" y2="280" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="614,280 604,275 604,285" fill="#8a8a8a"/>
  <line x1="70" y1="280" x2="70" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,55 65,65 75,65" fill="#8a8a8a"/>

  <!-- axis labels -->
  <text x="300" y="312" fill="#8a8a8a">Burnup (GWd/tU)</text>
  <text x="24" y="50" fill="#8a8a8a">inventory</text>

  <!-- x ticks -->
  <line x1="70" y1="280" x2="70" y2="286" stroke="#8a8a8a" stroke-width="1"/>
  <text x="66" y="300" fill="#8a8a8a">0</text>
  <line x1="335" y1="280" x2="335" y2="286" stroke="#8a8a8a" stroke-width="1"/>
  <text x="328" y="300" fill="#8a8a8a">20</text>
  <line x1="600" y1="280" x2="600" y2="286" stroke="#8a8a8a" stroke-width="1"/>
  <text x="593" y="300" fill="#8a8a8a">40</text>

  <!-- fission products (grey), rising with total fissions -->
  <line x1="70" y1="280" x2="600" y2="175" stroke="#8a8a8a" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="470" y="200" fill="#8a8a8a">fission products</text>

  <!-- U-235 (blue), burning down -->
  <path d="M 70 70 L 136.25 105.9 L 202.5 135.7 L 268.75 160.4 L 335 180.8 L 401.25 197.7 L 467.5 211.8 L 533.75 223.5 L 600 233.2"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="86" y="88" fill="#4a90d9">U&#8211;235</text>

  <!-- Pu-239 (coral), breeding up toward saturation -->
  <path d="M 70 280 L 136.25 258.5 L 202.5 244.4 L 268.75 235 L 335 228.9 L 401.25 224.8 L 467.5 222.2 L 533.75 220.4 L 600 219.3"
        fill="none" stroke="#e0645c" stroke-width="3"/>
  <text x="150" y="256" fill="#e0645c">Pu&#8211;239</text>

  <!-- crossover marker: late in life bred Pu exceeds residual U-235 -->
  <circle cx="559" cy="222" r="4.5" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="559" y1="222" x2="559" y2="150" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="470" y="145" fill="#8a8a8a">Pu now out-fissions U&#8211;235</text>
</svg>
