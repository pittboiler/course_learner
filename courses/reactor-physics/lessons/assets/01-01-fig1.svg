<svg viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">One phase-space cell (r, &#937;, E): blue arrows add neutrons, coral arrows remove them; the imbalance sets &#8706;&#968;/&#8706;t.</text>

  <!-- ===== central control volume ===== -->
  <rect x="270" y="165" width="150" height="105" fill="#4a90d9" opacity="0.12" stroke="#8a8a8a" stroke-width="2"/>
  <text x="345" y="205" fill="#8a8a8a" text-anchor="middle">phase-space cell</text>
  <text x="345" y="228" fill="#4a90d9" text-anchor="middle" font-style="italic">&#968;(r, &#937;, E, t)</text>
  <text x="345" y="252" fill="#8a8a8a" text-anchor="middle" font-size="12">rate = &#8706;&#968;/&#8706;t</text>

  <!-- ===== streaming in (blue, left face) ===== -->
  <line x1="150" y1="217" x2="266" y2="217" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="266,217 254,212 254,222" fill="#4a90d9"/>
  <text x="146" y="205" fill="#4a90d9" text-anchor="end">streaming in</text>

  <!-- ===== leakage out (coral, right face) ===== -->
  <line x1="424" y1="217" x2="540" y2="217" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="540,217 528,212 528,222" fill="#e0645c"/>
  <text x="544" y="212" fill="#e0645c">leakage</text>
  <text x="544" y="230" fill="#e0645c">&#937;&#183;&#8711;&#968;</text>

  <!-- ===== in-scatter source (blue, top-left in) ===== -->
  <line x1="205" y1="80" x2="298" y2="160" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="298,160 285,157 291,148" fill="#4a90d9"/>
  <text x="120" y="66" fill="#4a90d9">in-scatter</text>
  <text x="60" y="84" fill="#4a90d9">&#8747;&#931;<tspan font-size="10" dy="3">s</tspan><tspan dy="-3">&#968;(&#937;&#8242;,E&#8242;) d&#937;&#8242;dE&#8242;</tspan></text>

  <!-- ===== fission source (blue, top-right in) ===== -->
  <line x1="490" y1="80" x2="395" y2="160" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="395,160 402,148 408,157" fill="#4a90d9"/>
  <text x="500" y="66" fill="#4a90d9">fission</text>
  <text x="470" y="84" fill="#4a90d9">(&#967;/4&#960;)&#8747;&#957;&#931;<tspan font-size="10" dy="3">f</tspan><tspan dy="-3">&#966; dE&#8242;</tspan></text>

  <!-- ===== external source (blue, bottom-left in) ===== -->
  <line x1="215" y1="365" x2="300" y2="278" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="300,278 289,285 296,292" fill="#4a90d9"/>
  <text x="120" y="388" fill="#4a90d9">external source S</text>

  <!-- ===== collision removal (coral, bottom-right out) ===== -->
  <line x1="392" y1="278" x2="478" y2="365" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="478,365 466,360 473,353" fill="#e0645c"/>
  <text x="488" y="378" fill="#e0645c">collision loss</text>
  <text x="500" y="396" fill="#e0645c">&#931;<tspan font-size="10" dy="3">t</tspan><tspan dy="-3">&#968;</tspan></text>

  <!-- legend -->
  <line x1="40" y1="412" x2="66" y2="412" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="72" y="416" fill="#8a8a8a" font-size="12">gain (neutrons added)</text>
  <line x1="250" y1="412" x2="276" y2="412" stroke="#e0645c" stroke-width="2.5"/>
  <text x="282" y="416" fill="#8a8a8a" font-size="12">loss (neutrons removed)</text>
</svg>
