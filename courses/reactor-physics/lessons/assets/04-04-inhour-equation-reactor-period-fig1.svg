<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="20" fill="#8a8a8a" font-style="italic">The inhour curve (physical branch): reactivity &#961; sets the stable period T.</text>
  <text x="30" y="38" fill="#8a8a8a" font-style="italic">Near &#961;=0 the period runs to &#177;&#8734;. Positive insertions can be arbitrarily fast; negative ones bottom out.</text>

  <!-- horizontal reactivity axis (T = 0) -->
  <line x1="45" y1="190" x2="595" y2="190" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="595,190 585,185 585,195" fill="#8a8a8a"/>
  <text x="600" y="194" fill="#8a8a8a">&#961;</text>
  <text x="288" y="207" fill="#8a8a8a">0</text>
  <text x="470" y="182" fill="#8a8a8a">+&#961; (insert)</text>
  <text x="95" y="182" fill="#8a8a8a">&#8722;&#961; (remove)</text>

  <!-- vertical period axis (&#961; = 0) -->
  <line x1="310" y1="345" x2="310" y2="48" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="310,48 305,58 315,58" fill="#8a8a8a"/>
  <text x="318" y="58" fill="#8a8a8a">T</text>
  <text x="238" y="88" fill="#8a8a8a">T &#8594; +&#8734;</text>
  <text x="330" y="332" fill="#8a8a8a">T &#8594; &#8722;&#8734;</text>

  <!-- positive branch: &#961; &#62; 0, T &#62; 0 -->
  <path d="M 318 62 L 326 82 L 336 102 L 350 123 L 368 141 L 392 156 L 422 167 L 458 175 L 500 181 L 545 185 L 565 187"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- highlighted operating point: &#961;=+0.0015 -->
  <circle cx="368" cy="141" r="4.5" fill="#e0645c"/>
  <line x1="368" y1="141" x2="410" y2="118" stroke="#e0645c" stroke-width="1"/>
  <text x="414" y="115" fill="#e0645c">&#961;=+0.0015 &#8594; T &#8776; 42 s</text>

  <!-- prompt-critical marker at &#961; = &#946; -->
  <line x1="565" y1="190" x2="565" y2="138" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="536" y="132" fill="#8a8a8a">&#961; = &#946; (prompt)</text>

  <!-- negative branch: &#961; &#60; 0, T &#60; 0 -->
  <path d="M 305 342 L 300 326 L 293 316 L 283 310 L 270 307 L 250 306 L 224 305 L 194 305 L 158 305 L 120 305"
        fill="none" stroke="#e0645c" stroke-width="3"/>

  <!-- negative floor asymptote -->
  <line x1="95" y1="305" x2="300" y2="305" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="98" y="298" fill="#e0645c">&#8776; &#8722;80 s floor</text>
  <text x="98" y="333" fill="#8a8a8a">(longest-lived precursor, &#955;&#8321; &#8776; 0.0125 /s)</text>
</svg>
