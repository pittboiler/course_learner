<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Each elastic collision bumps lethargy up by about &#958;: light nuclei take big steps (few collisions), heavy nuclei tiny ones (many).</text>

  <!-- legend (upper area, above thermal line) -->
  <line x1="330" y1="46" x2="352" y2="46" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="357" y="50" fill="#8a8a8a">hydrogen, &#958; &#8776; 1 (~18 collisions)</text>
  <line x1="330" y1="64" x2="352" y2="64" stroke="#e0645c" stroke-width="2.5"/>
  <text x="357" y="68" fill="#8a8a8a">graphite, &#958; &#8776; 0.16 (~115)</text>

  <!-- y-axis (lethargy) -->
  <line x1="70" y1="270" x2="70" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,55 65,65 75,65" fill="#8a8a8a"/>
  <text x="18" y="150" fill="#8a8a8a" transform="rotate(-90 18 150)">lethargy&#160;&#160;u = ln(E&#8320;/E)</text>

  <!-- x-axis (collision number) -->
  <line x1="70" y1="260" x2="480" y2="260" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="480,260 470,255 470,265" fill="#8a8a8a"/>
  <text x="360" y="298" fill="#8a8a8a">collision number&#160;&#160;n</text>

  <!-- x ticks -->
  <line x1="70" y1="260" x2="70" y2="265" stroke="#8a8a8a" stroke-width="1"/>
  <text x="66" y="278" fill="#8a8a8a">0</text>
  <line x1="203.3" y1="260" x2="203.3" y2="265" stroke="#8a8a8a" stroke-width="1"/>
  <text x="196" y="278" fill="#8a8a8a">10</text>
  <line x1="336.7" y1="260" x2="336.7" y2="265" stroke="#8a8a8a" stroke-width="1"/>
  <text x="330" y="278" fill="#8a8a8a">20</text>
  <line x1="470" y1="260" x2="470" y2="265" stroke="#8a8a8a" stroke-width="1"/>
  <text x="463" y="278" fill="#8a8a8a">30</text>

  <!-- thermal line -->
  <line x1="70" y1="78" x2="480" y2="78" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="150" y="73" fill="#e0645c">thermal: u &#8776; 18&#160;&#160;(0.025 eV)</text>

  <!-- hydrogen staircase -->
  <polyline points="70.0,260.0 83.3,260.0 83.3,250.0 96.7,250.0 96.7,240.0 110.0,240.0 110.0,230.0 123.3,230.0 123.3,220.0 136.7,220.0 136.7,210.0 150.0,210.0 150.0,200.0 163.3,200.0 163.3,190.0 176.7,190.0 176.7,180.0 190.0,180.0 190.0,170.0 203.3,170.0 203.3,160.0 216.7,160.0 216.7,150.0 230.0,150.0 230.0,140.0 243.3,140.0 243.3,130.0 256.7,130.0 256.7,120.0 270.0,120.0 270.0,110.0 283.3,110.0 283.3,100.0 296.7,100.0 296.7,90.0 310.0,90.0 310.0,80.0"
    fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- one riser annotated: step from u=3 to u=4 at x=123.3 -->
  <text x="128" y="228" fill="#4a90d9">&#916;u &#8776; &#958;</text>

  <!-- carbon shallow line -->
  <line x1="70" y1="260" x2="470" y2="212.7" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="470,212.7 459,211.5 463,220" fill="#e0645c"/>
  <text x="360" y="235" fill="#e0645c">&#8230; still slowing</text>

  <!-- energy axis (right) -->
  <text x="486" y="264" fill="#8a8a8a">2 MeV</text>
  <line x1="480" y1="184" x2="475" y2="184" stroke="#8a8a8a" stroke-width="1"/>
  <text x="486" y="188" fill="#8a8a8a">1 keV</text>
  <line x1="480" y1="115" x2="475" y2="115" stroke="#8a8a8a" stroke-width="1"/>
  <text x="486" y="119" fill="#8a8a8a">1 eV</text>
  <text x="486" y="82" fill="#8a8a8a">0.025 eV</text>
  <text x="522" y="150" fill="#8a8a8a" transform="rotate(90 522 150)">energy E (log)</text>
</svg>
