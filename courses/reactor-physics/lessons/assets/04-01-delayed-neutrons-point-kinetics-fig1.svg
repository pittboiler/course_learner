<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="26" fill="#8a8a8a" font-style="italic">Point kinetics: prompt production feeds P directly; a slice &#946;i/&#923; is diverted into precursor storage Ci,</text>
  <text x="40" y="44" fill="#8a8a8a" font-style="italic">which trickles neutrons back at rate &#955;i Ci seconds later.</text>

  <!-- P box (neutron population) -->
  <rect x="70" y="150" width="180" height="90" rx="6" fill="#4a90d9" opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="160" y="192" fill="#4a90d9" font-size="26" text-anchor="middle">P(t)</text>
  <text x="160" y="216" fill="#4a90d9" font-size="12" text-anchor="middle">neutron population</text>

  <!-- C box (precursors) -->
  <rect x="400" y="150" width="180" height="90" rx="6" fill="#e0645c" opacity="0.12" stroke="#e0645c" stroke-width="2"/>
  <text x="490" y="192" fill="#e0645c" font-size="26" text-anchor="middle">Ci(t)</text>
  <text x="490" y="216" fill="#e0645c" font-size="12" text-anchor="middle">precursor storage</text>

  <!-- top arrow: P feeds precursors -->
  <line x1="250" y1="175" x2="392" y2="175" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="392,175 383,171 383,179" fill="#8a8a8a"/>
  <text x="321" y="167" fill="#8a8a8a" text-anchor="middle">&#946;i / &#923; &#183; P</text>

  <!-- bottom arrow: precursors return delayed neutrons -->
  <line x1="400" y1="215" x2="258" y2="215" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="258,215 267,211 267,219" fill="#8a8a8a"/>
  <text x="321" y="234" fill="#8a8a8a" text-anchor="middle">&#955;i Ci</text>
  <text x="321" y="250" fill="#8a8a8a" font-size="11" text-anchor="middle" font-style="italic">delayed neutrons, seconds later</text>

  <!-- prompt self-loop on P -->
  <path d="M 110 150 C 110 96, 210 96, 210 150" fill="none" stroke="#e0645c" stroke-width="2"/>
  <polygon points="210,150 205,141 215,141" fill="#e0645c"/>
  <text x="160" y="90" fill="#e0645c" text-anchor="middle">(&#961; &#8722; &#946;) / &#923; &#183; P</text>
  <text x="160" y="122" fill="#e0645c" font-size="11" text-anchor="middle" font-style="italic">prompt response</text>

  <!-- external inputs/outputs on P -->
  <line x1="30" y1="195" x2="68" y2="195" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="68,195 59,191 59,199" fill="#8a8a8a"/>
  <text x="24" y="199" fill="#8a8a8a" text-anchor="end" font-size="11">source</text>

  <!-- power readout marker -->
  <text x="160" y="272" fill="#8a8a8a" font-size="11" text-anchor="middle">amplitude = reactor power</text>
</svg>
