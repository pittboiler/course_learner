<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ehead" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#e0645c"/>
    </marker>
  </defs>

  <!-- caption -->
  <text x="24" y="26" fill="#8a8a8a" font-style="italic">Field lines (red) run straight down the potential hill, crossing every</text>
  <text x="24" y="44" fill="#8a8a8a" font-style="italic">equipotential (blue) at a right angle — that perpendicularity is E = &#8722;&#8711;V.</text>

  <!-- equipotential circles (constant V): dashed blue -->
  <circle cx="280" cy="192" r="45" fill="none" stroke="#4a90d9" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="280" cy="192" r="88" fill="none" stroke="#4a90d9" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="280" cy="192" r="128" fill="none" stroke="#4a90d9" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- radial field lines (E): solid red, arrows point outward toward lower V -->
  <line x1="304" y1="192" x2="428" y2="192" stroke="#e0645c" stroke-width="2" marker-end="url(#ehead)"/>
  <line x1="256" y1="192" x2="132" y2="192" stroke="#e0645c" stroke-width="2" marker-end="url(#ehead)"/>
  <line x1="280" y1="168" x2="280" y2="44"  stroke="#e0645c" stroke-width="2" marker-end="url(#ehead)"/>
  <line x1="280" y1="216" x2="280" y2="340" stroke="#e0645c" stroke-width="2" marker-end="url(#ehead)"/>
  <line x1="297" y1="175" x2="385" y2="87"  stroke="#e0645c" stroke-width="2" marker-end="url(#ehead)"/>
  <line x1="263" y1="175" x2="175" y2="87"  stroke="#e0645c" stroke-width="2" marker-end="url(#ehead)"/>
  <line x1="297" y1="209" x2="385" y2="297" stroke="#e0645c" stroke-width="2" marker-end="url(#ehead)"/>
  <line x1="263" y1="209" x2="175" y2="297" stroke="#e0645c" stroke-width="2" marker-end="url(#ehead)"/>

  <!-- central positive charge -->
  <circle cx="280" cy="192" r="13" fill="#e0645c"/>
  <text x="280" y="197" fill="#ffffff" text-anchor="middle" font-size="16" font-weight="bold">+</text>

  <!-- V annotations -->
  <text x="280" y="150" fill="#4a90d9" text-anchor="middle">high V</text>
  <text x="470" y="196" fill="#4a90d9">low V</text>

  <!-- labels -->
  <text x="410" y="120" fill="#e0645c">field line E</text>
  <text x="366" y="330" fill="#4a90d9">equipotential (V = const)</text>
</svg>
