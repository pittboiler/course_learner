<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 640" width="820" height="640" role="img" aria-label="Panel a shows the elastic rebound cycle as a staircase of fault slip lagging behind a straight line of steady plate motion, with the gap labelled stored elastic strain, beside three map views of a fence line that is straight, then bent, then offset. Panel b plots seismic energy against moment magnitude on a logarithmic axis with real events marked, beside a bar chart of Mercalli intensity at four sites from one earthquake, where the distant soft-basin site shakes harder than a rock site half its distance.">
<defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#333333"/></marker>
