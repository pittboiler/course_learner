<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" width="780" height="620" role="img" aria-label="A pressure-temperature diagram showing metamorphic facies fields, the three aluminosilicate stability fields meeting at a triple point at 550 degrees Celsius and 0.45 gigapascals, the wet melting solidus, and three annotated pressure-temperature paths for contact, regional collisional and subduction metamorphism.">
  <rect width="780" height="620" fill="#ffffff"/>
  <defs>
    <marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/>
    </marker>
    <marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a6fb5"/>
    </marker>
    <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5651d"/>
    </marker>
  </defs>

  <text x="390" y="28" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#111">Metamorphic facies, the aluminosilicate triple point, and three P&#8211;T paths</text>

  <!-- facies fields -->
  <g stroke="#8fa8c0" stroke-width="1.2">
    <polygon points="198.3,450 301.7,450 301.7,368.6 219,368.6" fill="#eef2f6"/>
    <polygon points="301.7,450 708.1,450 708.1,409.3 301.7,409.3" fill="#f7ead8"/>
    <polygon points="301.7,409.3 439.4,409.3 439.4,232.9 301.7,368.6" fill="#dfe9e1"/>
    <polygon points="439.4,409.3 577.2,409.3 577.2,137.9 439.4,137.9" fill="#e6ecf3"/>
    <polygon points="577.2,409.3 708.1,409.3 708.1,137.9 577.2,137.9" fill="#f2ecdd"/>
    <polygon points="301.7,368.6 439.4,232.9 439.4,137.9 287.9,137.9 219,368.6" fill="#dde6f2"/>
    <polygon points="287.9,137.9 708.1,137.9 708.1,70 307.8,70" fill="#e3efe6"/>
  </g>

  <!-- facies labels -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#333" text-anchor="middle">
    <text x="255" y="412">Zeolite</text>
    <text x="470" y="437">Hornfels (contact)</text>
    <text x="360" y="380">Greenschist</text>
    <text x="348" y="196">Blueschist</text>
    <text x="505" y="212">Amphibolite</text>
    <text x="640" y="182">Granulite</text>
    <text x="450" y="110">Eclogite</text>
  </g>
  <text x="140" y="430" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#7a8a99" text-anchor="middle">diagenesis</text>

  <!-- wet solidus -->
  <line x1="597.9" y1="436.4" x2="528" y2="151.4" stroke="#111" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="660" y="438" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#111">wet solidus</text>
  <text x="610" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#111">melt &#8594; migmatite</text>

  <!-- aluminosilicate boundaries -->
  <g stroke="#d1495b" stroke-width="2.6" fill="none">
    <line x1="473.9" y1="327.9" x2="711.6" y2="70"/>
    <line x1="473.9" y1="327.9" x2="584.6" y2="450"/>
    <line x1="473.9" y1="327.9" x2="322.3" y2="432.4"/>
  </g>
  <circle cx="473.9" cy="327.9" r="7" fill="#ffffff"/>
  <circle cx="473.9" cy="327.9" r="4.5" fill="#d1495b"/>
  <g font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-style="italic" fill="#d1495b">
    <text x="450" y="168" text-anchor="middle">Kyanite</text>
    <text x="630" y="360" text-anchor="middle">Sillimanite</text>
    <text x="452" y="400" text-anchor="middle">Andalusite</text>
    <text x="482" y="342" text-anchor="start">550 &#176;C, 0.45 GPa</text>
  </g>

  <!-- P-T paths -->
  <path d="M232.8,422.9 L610,418.6" stroke="#2e8b57" stroke-width="3" fill="none" marker-end="url(#ahG)"/>
  <path d="M198.3,417.4 C 235,330 310,262 384.3,254.6 C 440,250 500,244 548,238" stroke="#1a6fb5" stroke-width="3" fill="none" marker-end="url(#ahB)"/>
  <path d="M163.9,433.7 C 195,330 230,210 370.6,110.7" stroke="#b5651d" stroke-width="3" fill="none" marker-end="url(#ahR)"/>
  <g font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="350" cy="422" r="9.5" fill="#2e8b57"/><text x="350" y="426.5">1</text>
    <circle cx="300" cy="272" r="9.5" fill="#1a6fb5"/><text x="300" y="276.5">2</text>
    <circle cx="215" cy="270" r="9.5" fill="#b5651d"/><text x="215" y="274.5">3</text>
  </g>

  <!-- axes -->
  <g stroke="#111" stroke-width="1.6" fill="none">
    <line x1="95" y1="450" x2="715" y2="450"/>
    <line x1="95" y1="450" x2="95" y2="70"/>
    <line x1="715" y1="450" x2="715" y2="70"/>
  </g>
  <g stroke="#111" stroke-width="1.3">
    <line x1="95" y1="450" x2="95" y2="456"/>
    <line x1="232.8" y1="450" x2="232.8" y2="456"/>
    <line x1="370.6" y1="450" x2="370.6" y2="456"/>
    <line x1="508.3" y1="450" x2="508.3" y2="456"/>
    <line x1="646.1" y1="450" x2="646.1" y2="456"/>
    <line x1="95" y1="450" x2="89" y2="450"/>
    <line x1="95" y1="341.4" x2="89" y2="341.4"/>
    <line x1="95" y1="232.9" x2="89" y2="232.9"/>
    <line x1="95" y1="124.3" x2="89" y2="124.3"/>
    <line x1="715" y1="450" x2="721" y2="450"/>
    <line x1="715" y1="378.1" x2="721" y2="378.1"/>
    <line x1="715" y1="306.1" x2="721" y2="306.1"/>
    <line x1="715" y1="234.2" x2="721" y2="234.2"/>
    <line x1="715" y1="162.3" x2="721" y2="162.3"/>
    <line x1="715" y1="90.3" x2="721" y2="90.3"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#111">
    <text x="95" y="470" text-anchor="middle">0</text>
    <text x="232.8" y="470" text-anchor="middle">200</text>
    <text x="370.6" y="470" text-anchor="middle">400</text>
    <text x="508.3" y="470" text-anchor="middle">600</text>
    <text x="646.1" y="470" text-anchor="middle">800</text>
    <text x="85" y="454" text-anchor="end">0</text>
    <text x="85" y="345.4" text-anchor="end">0.4</text>
    <text x="85" y="236.9" text-anchor="end">0.8</text>
    <text x="85" y="128.3" text-anchor="end">1.2</text>
    <text x="726" y="454" text-anchor="start">0</text>
    <text x="726" y="382.1" text-anchor="start">10</text>
    <text x="726" y="310.1" text-anchor="start">20</text>
    <text x="726" y="238.2" text-anchor="start">30</text>
    <text x="726" y="166.3" text-anchor="start">40</text>
    <text x="726" y="94.3" text-anchor="start">50</text>
    <text x="726" y="72" text-anchor="start" font-size="12" fill="#555">km</text>
  </g>
  <text x="405" y="490" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#111">Temperature (&#176;C)</text>
  <text x="42" y="260" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#111" transform="rotate(-90 42 260)">Pressure (GPa)</text>

  <!-- legend -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#111">
    <line x1="100" y1="516" x2="138" y2="516" stroke="#2e8b57" stroke-width="3"/>
    <text x="148" y="521">1 &#8212; Contact: heating at almost constant P beside an intrusion &#8594; hornfels, andalusite</text>
    <line x1="100" y1="540" x2="138" y2="540" stroke="#1a6fb5" stroke-width="3"/>
    <text x="148" y="545">2 &#8212; Regional (collisional): burial first, heat after &#8594; schist, kyanite then sillimanite</text>
    <line x1="100" y1="564" x2="138" y2="564" stroke="#b5651d" stroke-width="3"/>
    <text x="148" y="569">3 &#8212; Subduction: pressure without heat &#8594; blueschist, then eclogite</text>
    <line x1="100" y1="588" x2="138" y2="588" stroke="#d1495b" stroke-width="2.6"/>
    <text x="148" y="593">Coral lines: aluminosilicate boundaries; dot = triple point, the one fixed P&#8211;T marker</text>
  </g>
</svg>
