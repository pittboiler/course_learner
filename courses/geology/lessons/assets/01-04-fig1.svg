<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Igneous classification grid: four composition columns from felsic to ultramafic across the top with silica, colour index, density and solidification temperature, crossed with two texture rows, phaneritic and aphanitic, naming granite, diorite, gabbro, peridotite and rhyolite, andesite, basalt, komatiite, plus a bottom strip of four composition-independent textures.">
  <rect width="800" height="500" fill="#ffffff"/>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#555"/>
    </marker>
    <pattern id="fine1" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#f0e8db"/>
      <circle cx="2" cy="2.2" r="1.0" fill="#a89880"/>
      <circle cx="5.4" cy="5.1" r="0.8" fill="#6f6555"/>
    </pattern>
    <pattern id="fine2" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#cfc6b4"/>
      <circle cx="2.1" cy="2" r="1.1" fill="#6f6555"/>
      <circle cx="5.3" cy="5.3" r="0.9" fill="#3d4a42"/>
    </pattern>
    <pattern id="fine3" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#4a5148"/>
      <circle cx="2" cy="2.3" r="1.1" fill="#2c322c"/>
      <circle cx="5.4" cy="5" r="0.8" fill="#8b9a86"/>
    </pattern>
    <pattern id="fine4" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#5f7a5c"/>
      <circle cx="2.2" cy="2" r="1.1" fill="#3a4a38"/>
      <circle cx="5.2" cy="5.2" r="0.8" fill="#9fb3a8"/>
    </pattern>
  </defs>

  <g font-family="Helvetica,Arial,sans-serif">

    <text x="122" y="15" font-size="10.5" fill="#555">silica and quartz fall &#8594; colour index, density and melting temperature rise</text>
    <line x1="122" y1="22" x2="790" y2="22" stroke="#555" stroke-width="1" marker-end="url(#ah)"/>

    <text x="8" y="42" font-size="11" font-weight="bold" fill="#111">COMPOSITION</text>
    <text x="8" y="57" font-size="9.5" fill="#444">what melted, and</text>
    <text x="8" y="70" font-size="9.5" fill="#444">how far the melt</text>
    <text x="8" y="83" font-size="9.5" fill="#444">differentiated</text>

    <text x="206" y="43" font-size="13" font-weight="bold" fill="#1a6fb5" text-anchor="middle">FELSIC</text>
    <text x="206" y="59" font-size="10" fill="#333" text-anchor="middle">SiO&#8322; above 65%</text>
    <text x="206" y="73" font-size="10" fill="#333" text-anchor="middle">colour index 0&#8211;15</text>
    <text x="206" y="87" font-size="10" fill="#333" text-anchor="middle">density 2.7 g/cm&#179;</text>
    <text x="206" y="101" font-size="10" fill="#333" text-anchor="middle">solidus ~700 &#176;C</text>

    <text x="374" y="43" font-size="13" font-weight="bold" fill="#1a6fb5" text-anchor="middle">INTERMEDIATE</text>
    <text x="374" y="59" font-size="10" fill="#333" text-anchor="middle">SiO&#8322; 52&#8211;65%</text>
    <text x="374" y="73" font-size="10" fill="#333" text-anchor="middle">colour index 15&#8211;45</text>
    <text x="374" y="87" font-size="10" fill="#333" text-anchor="middle">density 2.8 g/cm&#179;</text>
    <text x="374" y="101" font-size="10" fill="#333" text-anchor="middle">solidus ~950 &#176;C</text>

    <text x="542" y="43" font-size="13" font-weight="bold" fill="#1a6fb5" text-anchor="middle">MAFIC</text>
    <text x="542" y="59" font-size="10" fill="#333" text-anchor="middle">SiO&#8322; 45&#8211;52%</text>
    <text x="542" y="73" font-size="10" fill="#333" text-anchor="middle">colour index 45&#8211;85</text>
    <text x="542" y="87" font-size="10" fill="#333" text-anchor="middle">density 3.0 g/cm&#179;</text>
    <text x="542" y="101" font-size="10" fill="#333" text-anchor="middle">solidus ~1100 &#176;C</text>

    <text x="710" y="43" font-size="13" font-weight="bold" fill="#1a6fb5" text-anchor="middle">ULTRAMAFIC</text>
    <text x="710" y="59" font-size="10" fill="#333" text-anchor="middle">SiO&#8322; below 45%</text>
    <text x="710" y="73" font-size="10" fill="#333" text-anchor="middle">colour index above 85</text>
    <text x="710" y="87" font-size="10" fill="#333" text-anchor="middle">density 3.3 g/cm&#179;</text>
    <text x="710" y="101" font-size="10" fill="#333" text-anchor="middle">solidus ~1300 &#176;C</text>

    <line x1="6" y1="110" x2="794" y2="110" stroke="#111" stroke-width="1.2"/>
    <line x1="118" y1="110" x2="118" y2="498" stroke="#8fa8c0" stroke-width="1"/>
    <line x1="290" y1="110" x2="290" y2="498" stroke="#dde3ea" stroke-width="1"/>
    <line x1="458" y1="110" x2="458" y2="498" stroke="#dde3ea" stroke-width="1"/>
    <line x1="626" y1="110" x2="626" y2="498" stroke="#dde3ea" stroke-width="1"/>
    <line x1="6" y1="236" x2="794" y2="236" stroke="#8fa8c0" stroke-width="1"/>
    <line x1="6" y1="362" x2="794" y2="362" stroke="#111" stroke-width="1.2"/>

    <text x="8" y="150" font-size="11" font-weight="bold" fill="#111">PHANERITIC</text>
    <text x="8" y="165" font-size="9.5" fill="#444">coarse crystals,</text>
    <text x="8" y="178" font-size="9.5" fill="#444">visible unaided</text>
    <text x="8" y="194" font-size="9.5" fill="#d1495b">slow, at depth</text>
    <text x="8" y="207" font-size="9.5" fill="#d1495b">(intrusive)</text>

    <text x="8" y="276" font-size="11" font-weight="bold" fill="#111">APHANITIC</text>
    <text x="8" y="291" font-size="9.5" fill="#444">grains too small</text>
    <text x="8" y="304" font-size="9.5" fill="#444">to see unaided</text>
    <text x="8" y="320" font-size="9.5" fill="#d1495b">fast, at the</text>
    <text x="8" y="333" font-size="9.5" fill="#d1495b">surface (extrusive)</text>

    <text x="8" y="402" font-size="11" font-weight="bold" fill="#111">TEXTURE ONLY</text>
    <text x="8" y="417" font-size="9.5" fill="#444">these record the</text>
    <text x="8" y="430" font-size="9.5" fill="#444">cooling history,</text>
    <text x="8" y="443" font-size="9.5" fill="#444">not composition</text>

    <g stroke="#333" stroke-width="0.9">
      <g transform="translate(141,122)">
        <polygon points="0,0 41,0 33,23 0,27" fill="#e7d3c4"/>
        <polygon points="41,0 78,0 69,19 33,23" fill="#dfe4e8"/>
        <polygon points="78,0 130,0 130,31 104,27 69,19" fill="#f2ece0"/>
        <polygon points="0,27 33,23 22,45 0,64" fill="#e7d3c4"/>
        <polygon points="33,23 69,19 61,45 22,45" fill="#dfe4e8"/>
        <polygon points="69,19 104,27 100,49 61,45" fill="#f2ece0"/>
        <polygon points="104,27 130,31 130,64 100,49" fill="#e7d3c4"/>
        <polygon points="0,64 22,45 37,64" fill="#dfe4e8"/>
        <polygon points="22,45 61,45 76,64 37,64" fill="#3d4a42"/>
        <polygon points="61,45 100,49 130,64 76,64" fill="#f2ece0"/>
      </g>
      <g transform="translate(309,122)">
        <polygon points="0,0 41,0 33,23 0,27" fill="#f2ece0"/>
        <polygon points="41,0 78,0 69,19 33,23" fill="#3d4a42"/>
        <polygon points="78,0 130,0 130,31 104,27 69,19" fill="#f2ece0"/>
        <polygon points="0,27 33,23 22,45 0,64" fill="#5a6b5f"/>
        <polygon points="33,23 69,19 61,45 22,45" fill="#f2ece0"/>
        <polygon points="69,19 104,27 100,49 61,45" fill="#3d4a42"/>
        <polygon points="104,27 130,31 130,64 100,49" fill="#f2ece0"/>
        <polygon points="0,64 22,45 37,64" fill="#3d4a42"/>
        <polygon points="22,45 61,45 76,64 37,64" fill="#f2ece0"/>
        <polygon points="61,45 100,49 130,64 76,64" fill="#5a6b5f"/>
      </g>
      <g transform="translate(477,122)">
        <polygon points="0,0 41,0 33,23 0,27" fill="#3a463f"/>
        <polygon points="41,0 78,0 69,19 33,23" fill="#e2e0d6"/>
        <polygon points="78,0 130,0 130,31 104,27 69,19" fill="#3a463f"/>
        <polygon points="0,27 33,23 22,45 0,64" fill="#5a6b5f"/>
        <polygon points="33,23 69,19 61,45 22,45" fill="#3a463f"/>
        <polygon points="69,19 104,27 100,49 61,45" fill="#e2e0d6"/>
        <polygon points="104,27 130,31 130,64 100,49" fill="#3a463f"/>
        <polygon points="0,64 22,45 37,64" fill="#7d9b6a"/>
        <polygon points="22,45 61,45 76,64 37,64" fill="#3a463f"/>
        <polygon points="61,45 100,49 130,64 76,64" fill="#5a6b5f"/>
      </g>
      <g transform="translate(645,122)">
        <polygon points="0,0 41,0 33,23 0,27" fill="#7d9b6a"/>
        <polygon points="41,0 78,0 69,19 33,23" fill="#6b8a5c"/>
        <polygon points="78,0 130,0 130,31 104,27 69,19" fill="#7d9b6a"/>
        <polygon points="0,27 33,23 22,45 0,64" fill="#3a463f"/>
        <polygon points="33,23 69,19 61,45 22,45" fill="#7d9b6a"/>
        <polygon points="69,19 104,27 100,49 61,45" fill="#6b8a5c"/>
        <polygon points="104,27 130,31 130,64 100,49" fill="#3a463f"/>
        <polygon points="0,64 22,45 37,64" fill="#7d9b6a"/>
        <polygon points="22,45 61,45 76,64 37,64" fill="#6b8a5c"/>
        <polygon points="61,45 100,49 130,64 76,64" fill="#7d9b6a"/>
      </g>
    </g>

    <text x="206" y="208" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">GRANITE</text>
    <text x="206" y="225" font-size="9.5" fill="#444" text-anchor="middle">continental crust, batholiths</text>
    <text x="374" y="208" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">DIORITE</text>
    <text x="374" y="225" font-size="9.5" fill="#444" text-anchor="middle">plutons under arcs</text>
    <text x="542" y="208" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">GABBRO</text>
    <text x="542" y="225" font-size="9.5" fill="#444" text-anchor="middle">lower oceanic crust</text>
    <text x="710" y="208" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">PERIDOTITE</text>
    <text x="710" y="225" font-size="9.5" fill="#444" text-anchor="middle">the mantle itself</text>

    <g stroke="#333" stroke-width="0.9">
      <rect x="141" y="248" width="130" height="64" fill="url(#fine1)"/>
      <rect x="309" y="248" width="130" height="64" fill="url(#fine2)"/>
      <rect x="477" y="248" width="130" height="64" fill="url(#fine3)"/>
      <rect x="645" y="248" width="130" height="64" fill="url(#fine4)"/>
    </g>
    <g stroke="#dfe8dc" stroke-width="1.3" fill="none">
      <path d="M652,258 L700,292"/>
      <path d="M676,254 L714,304"/>
      <path d="M700,256 L662,300"/>
      <path d="M722,262 L758,300"/>
      <path d="M760,256 L730,306"/>
    </g>

    <text x="206" y="334" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">RHYOLITE</text>
    <text x="206" y="351" font-size="9.5" fill="#444" text-anchor="middle">lava domes, ash flows</text>
    <text x="374" y="334" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">ANDESITE</text>
    <text x="374" y="351" font-size="9.5" fill="#444" text-anchor="middle">stratovolcano lavas</text>
    <text x="542" y="334" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">BASALT</text>
    <text x="542" y="351" font-size="9.5" fill="#444" text-anchor="middle">ocean floor, flood basalts</text>
    <text x="710" y="334" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">KOMATIITE</text>
    <text x="710" y="351" font-size="9.5" fill="#444" text-anchor="middle">Archean only: mantle hotter</text>

    <g stroke="#333" stroke-width="0.9">
      <rect x="141" y="374" width="130" height="64" fill="url(#fine2)"/>
      <polygon points="161,388 185,394 181,408 157,402" fill="#f2ece0"/>
      <polygon points="211,384 233,390 229,406 207,400" fill="#f2ece0"/>
      <polygon points="175,416 197,420 193,432 171,428" fill="#f2ece0"/>
      <polygon points="237,412 257,418 253,430 233,424" fill="#e7d3c4"/>

      <rect x="309" y="374" width="130" height="64" fill="#2a2a30"/>
      <rect x="477" y="374" width="130" height="64" fill="#6f6a5f"/>
      <rect x="645" y="374" width="130" height="64" fill="#d8d2c4"/>
    </g>
    <g fill="none" stroke="#7c7c8e" stroke-width="1.1">
      <path d="M327,438 A 46,46 0 0 1 373,392"/>
      <path d="M343,438 A 30,30 0 0 1 373,408"/>
      <path d="M359,438 A 14,14 0 0 1 373,424"/>
      <path d="M395,374 A 34,34 0 0 1 429,408"/>
    </g>
    <g stroke="#3a382f" stroke-width="0.6" fill="#f4f1ea">
      <ellipse cx="492" cy="388" rx="7" ry="5"/>
      <ellipse cx="516" cy="398" rx="10" ry="6"/>
      <ellipse cx="543" cy="385" rx="6" ry="4.5"/>
      <ellipse cx="566" cy="395" rx="8" ry="5.5"/>
      <ellipse cx="590" cy="386" rx="5" ry="4"/>
      <ellipse cx="497" cy="414" rx="9" ry="5.5"/>
      <ellipse cx="524" cy="422" rx="6" ry="4.5"/>
      <ellipse cx="551" cy="412" rx="11" ry="6"/>
      <ellipse cx="580" cy="420" rx="7" ry="5"/>
      <ellipse cx="597" cy="405" rx="5.5" ry="4"/>
      <ellipse cx="536" cy="431" rx="6" ry="3.5"/>
      <ellipse cx="572" cy="431" rx="5" ry="3"/>
    </g>
    <g stroke="#333" stroke-width="0.6">
      <polygon points="656,384 672,388 664,400" fill="#4a5148"/>
      <polygon points="684,382 702,390 688,398" fill="#8f8677"/>
      <polygon points="712,384 728,392 714,400" fill="#f2ece0"/>
      <polygon points="740,382 758,388 748,400" fill="#b5651d"/>
      <polygon points="660,408 678,414 664,424" fill="#8f8677"/>
      <polygon points="690,410 708,404 706,422" fill="#4a5148"/>
      <polygon points="718,410 738,416 722,426" fill="#8f8677"/>
      <polygon points="746,408 764,414 752,426" fill="#f2ece0"/>
      <polygon points="668,428 686,432 674,436" fill="#4a5148"/>
      <polygon points="726,430 748,434 732,437" fill="#b5651d"/>
      <circle cx="704" cy="432" r="4" fill="#efe9dc"/>
      <circle cx="762" cy="400" r="3.5" fill="#efe9dc"/>
    </g>

    <text x="206" y="460" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">PORPHYRITIC</text>
    <text x="206" y="476" font-size="9.5" fill="#444" text-anchor="middle">two-stage cooling: slow,</text>
    <text x="206" y="488" font-size="9.5" fill="#444" text-anchor="middle">then fast. Most informative.</text>
    <text x="374" y="460" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">GLASSY</text>
    <text x="374" y="476" font-size="9.5" fill="#444" text-anchor="middle">quenched before any</text>
    <text x="374" y="488" font-size="9.5" fill="#444" text-anchor="middle">crystals grew: obsidian</text>
    <text x="542" y="460" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">VESICULAR</text>
    <text x="542" y="476" font-size="9.5" fill="#444" text-anchor="middle">exsolved gas frozen in</text>
    <text x="542" y="488" font-size="9.5" fill="#444" text-anchor="middle">place: pumice, scoria</text>
    <text x="710" y="460" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">PYROCLASTIC</text>
    <text x="710" y="476" font-size="9.5" fill="#444" text-anchor="middle">magma fragmented in</text>
    <text x="710" y="488" font-size="9.5" fill="#444" text-anchor="middle">flight: ash, tuff</text>

  </g>
</svg>
