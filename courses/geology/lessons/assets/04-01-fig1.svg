<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 585" width="780" height="585" role="img" aria-label="A composite geologic cross-section engineered so that every relative-dating principle is needed at once. At the base a gneiss basement is overlain across an irregular nonconformity by three tilted beds, which a dike cuts and which are all beveled flat by an angular unconformity. Above that unconformity lie flat conglomerate, sandstone and shale, with a dark sill intruded between the sandstone and the shale and baked margins shown above and below it. A normal fault drops the right-hand block, offsetting everything from the gneiss up to the shale, and is itself planed off by a disconformity beneath an uppermost limestone that the fault does not cut. Eleven numbered badges mark the events, keyed to an ordered event list beneath the section." font-family="Helvetica,Arial,sans-serif">
