  <line x1="60" y1="422" x2="740" y2="422" stroke="#d5dde5" stroke-width="1.2"/>
  <text x="60" y="442" font-size="12.5" font-weight="bold" fill="#111">Event key &#8212; oldest (1) to youngest (11)</text>

  <g font-size="11" fill="#333">
    <text x="60" y="464">1. Gneiss basement forms (oldest rock present).</text>
    <text x="60" y="483">2. Uplift and erosion cut the nonconformity surface.</text>
    <text x="60" y="502">3. Beds T1, T2, T3 deposited flat on that surface.</text>
    <text x="60" y="521">4. Dike intrudes, cutting the gneiss and T1.</text>
    <text x="60" y="540">5. The whole lower package is tilted.</text>
    <text x="60" y="559">6. Erosion bevels beds and dike: angular unconformity.</text>
    <text x="450" y="464">7. F1 conglomerate, F2 sandstone, F3 shale.</text>
    <text x="450" y="483">8. Sill intrudes: baked margins above and below.</text>
    <text x="450" y="502">9. Normal fault offsets gneiss through F3.</text>
    <text x="450" y="521">10. Erosion planes the scarp: disconformity.</text>
    <text x="450" y="540">11. F4 limestone deposited; the fault stops below it.</text>
  </g>
