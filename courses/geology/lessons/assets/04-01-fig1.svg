  <text x="95" y="126" font-size="11.5" fill="#111">F3 shale</text>
  <text x="95" y="164" font-size="11" fill="#ffffff">sill &#8212; baked above and below</text>
  <text x="95" y="205" font-size="11.5" fill="#111">F2 sandstone</text>
  <text x="95" y="238" font-size="11" fill="#111">F1 conglomerate &#8212; clasts of gneiss and limestone</text>
  <text x="418" y="238" font-size="11" fill="#a03246" font-weight="bold">angular unconformity</text>
  <text x="332" y="312" font-size="11" fill="#111">T1</text>
  <text x="470" y="308" font-size="11" fill="#111">T2</text>
  <text x="662" y="330" font-size="11" fill="#111">T3</text>
  <text x="100" y="378" font-size="11" fill="#111">gneiss basement</text>
  <text x="296" y="364" font-size="11" fill="#8f2f3f" font-weight="bold">nonconformity</text>
  <text x="492" y="130" font-size="11" fill="#111">normal fault</text>
  <text x="268" y="352" font-size="11" fill="#111" transform="rotate(-82 268 352)">dike</text>

