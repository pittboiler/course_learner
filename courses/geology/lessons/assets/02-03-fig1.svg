<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" role="img" aria-label="Cross-section from a mid-ocean ridge to a trench and subducting slab, with force arrows for ridge push, slab pull, basal drag and slab resistance drawn in rough proportion, above a bar chart comparing the three driving forces to scale.">
<rect width="780" height="470" fill="#ffffff"/>
<defs>
<marker id="acoralLg" viewBox="0 0 26 22" markerWidth="26" markerHeight="22" refX="24" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L26 11 L0 22 Z" fill="#d1495b"/></marker>
<marker id="acoralSm" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 5 L0 10 Z" fill="#d1495b"/></marker>
<marker id="ablue" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 5 L0 10 Z" fill="#1a6fb5"/></marker>
<marker id="agrey" viewBox="0 0 11 9" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 4.5 L0 9 Z" fill="#777777"/></marker>
<marker id="aslate" viewBox="0 0 13 11" markerWidth="13" markerHeight="11" refX="12" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L13 5.5 L0 11 Z" fill="#6b87a3"/></marker>
</defs>

<text x="30" y="21" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#111">What moves a plate: the force budget</text>

<rect x="30" y="52" width="720" height="308" fill="#d8c9a3" stroke="#8fa8c0" stroke-width="1"/>
<rect x="31" y="53" width="718" height="227" fill="#e3d9c6"/>
<line x1="31" y1="280" x2="749" y2="280" stroke="#8fa8c0" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="42" y="274" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b5a3e">660 km</text>
<text x="42" y="300" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6b5a3e">deeper mantle</text>

<path d="M 30 52 L 750 52 L 750 86 L 552 92 L 528 118 L 520 102 Q 310 84 110 70 Q 70 66 30 76 Z" fill="#cfe3f2" stroke="none"/>

<path d="M 615 322 C 470 350 275 336 195 252" fill="none" stroke="#8fa8c0" stroke-width="3" marker-end="url(#aslate)"/>
<path d="M 170 250 L 170 180" fill="none" stroke="#8fa8c0" stroke-width="3" marker-end="url(#aslate)"/>
<text x="300" y="252" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#47617a">mantle return flow</text>
<text x="200" y="200" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6b5a3e">asthenosphere: weak, creeps</text>

<path d="M 30 76 Q 70 66 110 70 L 110 76 Q 70 72 30 82 Z" fill="#9fb3a8" stroke="#333333" stroke-width="1.1"/>
<path d="M 110 70 Q 310 84 520 102 L 528 118 L 520 168 Q 300 152 110 76 Z" fill="#9fb3a8" stroke="#333333" stroke-width="1.2"/>
<path d="M 528 118 L 692 300 L 684 350 L 520 168 Z" fill="#9fb3a8" stroke="#333333" stroke-width="1.2"/>
<path d="M 552 92 L 750 86 L 750 134 L 600 126 L 552 92 Z" fill="#9fb3a8" stroke="#333333" stroke-width="1.2"/>
<path d="M 648 88 L 660 70 L 672 88 Z" fill="#b5651d" stroke="#333333" stroke-width="0.8"/>

<line x1="110" y1="48" x2="110" y2="64" stroke="#555555" stroke-width="1"/>
<text x="110" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111" text-anchor="middle">ridge axis</text>
<line x1="502" y1="74" x2="524" y2="106" stroke="#555555" stroke-width="1"/>
<text x="498" y="72" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111" text-anchor="end">trench</text>
<text x="660" y="64" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111" text-anchor="middle">arc</text>
<text x="196" y="100" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111">lithosphere = the plate</text>

<line x1="170" y1="86" x2="203" y2="88" stroke="#d1495b" stroke-width="3.5" marker-end="url(#acoralSm)"/>
<text x="216" y="66" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#d1495b">ridge push</text>

<line x1="554" y1="176" x2="631" y2="262" stroke="#d1495b" stroke-width="10" marker-end="url(#acoralLg)"/>
<text x="548" y="240" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#d1495b" text-anchor="end">slab pull</text>
<text x="548" y="256" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d1495b" text-anchor="end">cold, dense slab</text>

<line x1="604" y1="281" x2="573" y2="246" stroke="#1a6fb5" stroke-width="3.5" marker-end="url(#ablue)"/>
<line x1="638" y1="221" x2="607" y2="186" stroke="#1a6fb5" stroke-width="3.5" marker-end="url(#ablue)"/>
<text x="654" y="196" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1a6fb5">slab resistance</text>

<line x1="312" y1="157" x2="352" y2="157" stroke="#777777" stroke-width="3" marker-end="url(#agrey)"/>
<line x1="308" y1="157" x2="268" y2="157" stroke="#777777" stroke-width="3" marker-end="url(#agrey)"/>
<text x="310" y="175" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555" text-anchor="middle">basal drag: sign uncertain</text>

<rect x="20" y="372" width="740" height="88" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>
<text x="32" y="390" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#111">Force per metre of plate boundary &#8212; bars drawn to scale</text>
<text x="128" y="411" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111" text-anchor="end">slab pull</text>
<rect x="136" y="402" width="420" height="11" fill="#d1495b"/>
<text x="564" y="411" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#111">&#8776;4&#215;10&#185;&#179; N/m</text>
<text x="128" y="429" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111" text-anchor="end">ridge push</text>
<rect x="136" y="420" width="35" height="11" fill="#e08a96"/>
<text x="180" y="429" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#111">&#8776;3&#215;10&#185;&#178; N/m &#8212; about 12 times smaller</text>
<text x="128" y="447" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111" text-anchor="end">basal drag</text>
<rect x="136" y="438" width="10" height="11" fill="#999999"/>
<text x="180" y="447" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#111">order 10&#185;&#178; N/m, may drive or resist</text>
</svg>
