<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 570" width="820" height="570" role="img" aria-label="Top: a wide cross-section running from a mid-ocean ridge across an ocean basin to a trench, volcanic arc and back-arc basin. Earthquake foci are shallow beneath the ridge and deepen along the subducting slab to 670 kilometres, where they stop. Melting regions are shaded beneath the ridge, in the mantle wedge above the slab at about 110 kilometres depth, and beneath the back-arc. Bottom: a map view of a ridge offset by a transform, showing that only the segment between the two ridge crests is a plate boundary and that the scars beyond it are fracture zones with no relative motion.">
<rect width="820" height="570" fill="#ffffff"/>

