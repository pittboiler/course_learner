<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-label="Left panel: a shoreline cross-section with coastal plain, beach sand, offshore mud and shelf carbonate belts separated by steep boundaries that climb landward, crossed by near-horizontal dashed time lines, so the facies boundaries are visibly diachronous. Right panel: two vertical sections at marked positions, each deepening upward but containing different facies, tied together by a single volcanic ash bed that lies inside the sandstone in one section and inside the carbonate in the other." font-family="Helvetica,Arial,sans-serif">
  <rect width="820" height="430" fill="#ffffff"/>

  <text x="30" y="24" font-size="13" font-weight="bold" fill="#111">A. Facies boundaries cut across time lines</text>
  <text x="505" y="24" font-size="13" font-weight="bold" fill="#111">B. Correlation by an ash bed</text>

  <line x1="255" y1="46" x2="150" y2="46" stroke="#d1495b" stroke-width="1.6"/>
  <polygon points="150,46 158,42.5 158,49.5" fill="#d1495b"/>
  <text x="261" y="49.5" font-size="9.5" fill="#d1495b">shoreline retreats landward</text>

  <rect x="40" y="60" width="430" height="240" fill="#f5f7fa"/>

  <polygon points="40,300 200,300 40,60" fill="#c9a26b"/>
  <polygon points="200,300 300,300 140,60 40,60" fill="#d8c9a3"/>
  <polygon points="300,300 400,300 240,60 140,60" fill="#9fb3a8"/>
  <polygon points="400,300 470,300 470,60 240,60" fill="#bcd4e6"/>

  <line x1="40" y1="90" x2="470" y2="90" stroke="#111" stroke-width="0.9" stroke-dasharray="6,4"/>
  <line x1="40" y1="140" x2="470" y2="140" stroke="#111" stroke-width="0.9" stroke-dasharray="6,4"/>
  <line x1="40" y1="240" x2="470" y2="240" stroke="#111" stroke-width="0.9" stroke-dasharray="6,4"/>
  <line x1="40" y1="285" x2="470" y2="285" stroke="#111" stroke-width="0.9" stroke-dasharray="6,4"/>
  <line x1="40" y1="190" x2="470" y2="190" stroke="#d1495b" stroke-width="2.4"/>

  <text x="474" y="93" font-size="9.5" fill="#333">t5</text>
  <text x="474" y="143" font-size="9.5" fill="#333">t4</text>
  <text x="474" y="193" font-size="9.5" fill="#d1495b">ash</text>
  <text x="474" y="243" font-size="9.5" fill="#333">t2</text>
  <text x="474" y="288" font-size="9.5" fill="#333">t1</text>

  <line x1="40" y1="300" x2="200" y2="60" stroke="#111" stroke-width="2"/>
  <line x1="140" y1="60" x2="300" y2="300" stroke="#111" stroke-width="2"/>
  <line x1="240" y1="60" x2="400" y2="300" stroke="#111" stroke-width="2"/>

  <text x="58" y="273" font-size="9.5" fill="#111">coastal plain</text>
  <text x="192" y="273" font-size="9.5" fill="#111">beach sand</text>
  <text x="290" y="273" font-size="9.5" fill="#111">offshore mud</text>
  <text x="384" y="273" font-size="9.5" fill="#111">shelf carbonate</text>

  <rect x="40" y="300" width="430" height="14" fill="#b9b9b9"/>
  <text x="46" y="311" font-size="9.5" fill="#111">older strata</text>

  <line x1="200" y1="60" x2="200" y2="300" stroke="#1a6fb5" stroke-width="1.4" stroke-dasharray="3,3"/>
  <line x1="380" y1="60" x2="380" y2="300" stroke="#1a6fb5" stroke-width="1.4" stroke-dasharray="3,3"/>
  <text x="196" y="330" font-size="11" font-weight="bold" fill="#1a6fb5">X</text>
  <text x="376" y="330" font-size="11" font-weight="bold" fill="#1a6fb5">Y</text>
  <text x="40" y="330" font-size="9.5" fill="#333">landward</text>
  <text x="470" y="330" font-size="9.5" text-anchor="end" fill="#333">seaward</text>

  <text x="540" y="46" font-size="9.5" font-weight="bold" fill="#1a6fb5">Section X</text>
  <text x="695" y="46" font-size="9.5" font-weight="bold" fill="#1a6fb5">Section Y</text>

  <rect x="545" y="150" width="55" height="150" fill="#d8c9a3" stroke="#111" stroke-width="1"/>
  <rect x="545" y="60" width="55" height="90" fill="#9fb3a8" stroke="#111" stroke-width="1"/>
  <rect x="545" y="187" width="55" height="6" fill="#d1495b"/>
  <text x="572" y="230" font-size="9.5" text-anchor="middle" fill="#111">sand</text>
  <text x="572" y="110" font-size="9.5" text-anchor="middle" fill="#111">mud</text>

  <rect x="700" y="270" width="55" height="30" fill="#9fb3a8" stroke="#111" stroke-width="1"/>
  <rect x="700" y="60" width="55" height="210" fill="#bcd4e6" stroke="#111" stroke-width="1"/>
  <rect x="700" y="187" width="55" height="6" fill="#d1495b"/>
  <text x="727" y="289" font-size="9.5" text-anchor="middle" fill="#111">mud</text>
  <text x="727" y="140" font-size="9.5" text-anchor="middle" fill="#111">carbonate</text>

  <line x1="600" y1="190" x2="700" y2="190" stroke="#d1495b" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="650" y="182" font-size="9.5" text-anchor="middle" fill="#d1495b">one instant</text>

  <text x="545" y="322" font-size="9.5" fill="#333">Both sections deepen upward, but they share</text>
  <text x="545" y="334" font-size="9.5" fill="#333">no facies contact, and the mud at X is</text>
  <text x="545" y="346" font-size="9.5" fill="#333">entirely younger than the mud at Y.</text>

  <rect x="40" y="349" width="14" height="10" fill="#c9a26b" stroke="#111" stroke-width="0.6"/>
  <text x="58" y="358" font-size="9.5" fill="#111">coastal plain</text>
  <rect x="150" y="349" width="14" height="10" fill="#d8c9a3" stroke="#111" stroke-width="0.6"/>
  <text x="168" y="358" font-size="9.5" fill="#111">beach sand</text>
  <rect x="255" y="349" width="14" height="10" fill="#9fb3a8" stroke="#111" stroke-width="0.6"/>
  <text x="273" y="358" font-size="9.5" fill="#111">offshore mud</text>
  <rect x="370" y="349" width="14" height="10" fill="#bcd4e6" stroke="#111" stroke-width="0.6"/>
  <text x="388" y="358" font-size="9.5" fill="#111">shelf carbonate</text>

  <line x1="40" y1="382" x2="72" y2="382" stroke="#111" stroke-width="0.9" stroke-dasharray="6,4"/>
  <text x="80" y="385" font-size="9.5" fill="#111">time line &#8212; one instant, traceable across every facies</text>
  <line x1="430" y1="382" x2="462" y2="382" stroke="#111" stroke-width="2"/>
  <text x="470" y="385" font-size="9.5" fill="#111">facies boundary &#8212; younger landward</text>

  <line x1="40" y1="406" x2="72" y2="406" stroke="#d1495b" stroke-width="2.4"/>
  <text x="80" y="409" font-size="9.5" fill="#111">volcanic ash &#8212; an instantaneous time plane; it lies in sand at X and in carbonate at Y</text>
</svg>
