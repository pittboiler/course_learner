<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" role="img" aria-label="A single time axis from 4.6 to 0.5 billion years ago carrying four stacked records. Track a plots atmospheric oxygen on a logarithmic scale, flat below one hundred-thousandth of the present level through the Archean, stepping up about three orders of magnitude between 2.45 and 2.32 billion years, holding near one percent through the mid-Proterozoic, and rising again after 0.8 billion years. Track b plots banded iron formation abundance as bars, peaking just before the oxygen step, nearly ceasing at 1.85 billion years, and reappearing briefly during the Cryogenian. Track c shows supercontinents Kenorland, Nuna, Rodinia and Pannotia as blocks. Track d marks glacial episodes, with the Huronian glaciations falling immediately after the oxygen step and the Sturtian, Marinoan and Gaskiers events clustered near the end. Eight numbered markers along the axis flag the key rock evidence, and dashed vertical guides show that the oxygen step, the last detrital pyrite and the onset of glaciation coincide.">
<rect width="820" height="500" fill="#ffffff"/>
<g font-family="Helvetica,Arial,sans-serif">

<text x="14" y="20" font-size="13" font-weight="bold" fill="#111">Four independent records on one axis: the first four billion years</text>

