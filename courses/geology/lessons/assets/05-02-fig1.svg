<text x="190" y="126" font-size="9.5" fill="#1a6fb5">anoxic air and anoxic deep ocean</text>
<text x="474" y="106" font-size="10.5" font-weight="bold" fill="#d1495b">GOE</text>
<text x="560" y="76" font-size="9.5" fill="#1a6fb5">the stable low-oxygen middle</text>
<text x="736" y="103" font-size="10.5" font-weight="bold" fill="#d1495b">NOE</text>

<text x="70" y="166" font-size="11" font-weight="bold" fill="#111">(b) Banded iron formation abundance</text>
