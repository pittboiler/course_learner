<text x="63" y="56" font-size="9.5" fill="#333" text-anchor="end">0</text>
<text x="63" y="86" font-size="9.5" fill="#333" text-anchor="end">&#8722;2</text>
<text x="63" y="116" font-size="9.5" fill="#333" text-anchor="end">&#8722;4</text>
<text x="63" y="146" font-size="9.5" fill="#333" text-anchor="end">&#8722;6</text>
