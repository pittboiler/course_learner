<text x="368" y="306" font-size="9" fill="#1a6fb5" text-anchor="middle">Pongola</text>
<text x="468" y="325" font-size="9" fill="#111" text-anchor="middle">Huronian</text>
<text x="746" y="306" font-size="9" fill="#1a6fb5" text-anchor="end">Sturtian, Marinoan, Gaskiers</text>
<line x1="748" y1="303" x2="758" y2="310" stroke="#1a6fb5" stroke-width="1"/>

