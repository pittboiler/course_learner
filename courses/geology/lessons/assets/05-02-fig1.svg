<text x="70" y="422" font-size="9.5" fill="#111">1  4.40 Ga  Jack Hills detrital zircons: oldest Earth material</text>
<text x="70" y="441" font-size="9.5" fill="#111">2  4.03 Ga  Acasta gneiss: oldest intact rock</text>
<text x="70" y="460" font-size="9.5" fill="#111">3  3.8 Ga  Isua pillow basalts and BIF: oceans, and sediment</text>
<text x="70" y="479" font-size="9.5" fill="#111">4  2.7 Ga  komatiite peak: mantle 200 to 300 K hotter</text>
<text x="430" y="422" font-size="9.5" fill="#111">5  2.45 Ga  last detrital pyrite and uraninite; S-MIF ends</text>
<text x="430" y="441" font-size="9.5" fill="#111">6  2.30 Ga  first red beds: free O2 in the air</text>
<text x="430" y="460" font-size="9.5" fill="#111">7  1.85 Ga  BIF largely ceases: the deep ocean loses its Fe(II)</text>
<text x="430" y="479" font-size="9.5" fill="#111">8  0.635 Ga  cap carbonate on Marinoan glacial diamictite</text>

