<text x="300" y="172" font-size="9.5" fill="#7a4413">peak: Hamersley and Transvaal, 2.6 to 2.4 Ga</text>
<text x="592" y="220" font-size="9.5" fill="#7a4413">no BIF for about 1.1 Gyr</text>
<text x="700" y="204" font-size="9.5" fill="#7a4413">Rapitan</text>

<text x="70" y="248" font-size="11" font-weight="bold" fill="#111">(c) Supercontinents assembled</text>
