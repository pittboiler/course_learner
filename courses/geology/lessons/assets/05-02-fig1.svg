<line x1="553.0" y1="48" x2="553.0" y2="336" stroke="#999" stroke-width="1" stroke-dasharray="3,4"/>
<line x1="751.9" y1="48" x2="751.9" y2="336" stroke="#999" stroke-width="1" stroke-dasharray="3,4"/>

<text x="70" y="42" font-size="11" font-weight="bold" fill="#111">(a) Atmospheric O2, log10 of the present level</text>
<line x1="70" y1="48" x2="70" y2="146" stroke="#333" stroke-width="1.2"/>
<line x1="66" y1="52" x2="70" y2="52" stroke="#333" stroke-width="1"/>
