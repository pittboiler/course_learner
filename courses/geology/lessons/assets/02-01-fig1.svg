<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 700" width="820" height="700" role="img" aria-label="Two panels. Top: a Pangaea reconstruction with the southern continents clustered around Africa, a green band showing the Glossopteris plant range sweeping continuously across South America, Africa, Antarctica, India and Australia, a coral band showing the Mesosaurus range crossing the South America to Africa join, and a rust band tracing one continuous mountain belt from North America into northern Europe. Bottom: a mid-ocean ridge cross-section with black and white magnetic polarity stripes drawn symmetrically about the ridge axis, a sediment wedge that thins to zero at the axis and thickens outward, crustal ages labelled identically on both flanks, and mantle upwelling arrows beneath the axis.">
<rect width="820" height="700" fill="#ffffff"/>

<text x="30" y="24" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#111">(a) Wegener's case: Pangaea, and the things that cross the joins</text>

<rect x="30" y="36" width="472" height="300" fill="#e6eff6" stroke="#8fa8c0" stroke-width="1"/>
<text x="44" y="54" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5a7b96">PANTHALASSA</text>
<text x="404" y="200" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5a7b96">TETHYS</text>

