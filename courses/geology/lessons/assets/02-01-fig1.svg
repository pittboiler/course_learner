<g font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111" font-weight="bold">
<text x="86" y="140">N. AMERICA</text>
<text x="300" y="108">EURASIA</text>
<text x="222" y="180">AFRICA</text>
<text x="126" y="196">S. AMER.</text>
<text x="304" y="228">INDIA</text>
<text x="212" y="302">ANTARCTICA</text>
<text x="356" y="286">AUS</text>
</g>

<g font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111">
<text x="516" y="52" font-weight="bold">What crosses the joins</text>
<rect x="516" y="62" width="26" height="11" fill="#2e8b57" opacity="0.5"/>
<text x="550" y="72">Glossopteris flora (Permian seed</text>
<text x="550" y="86">fern, heavy seeds, no ocean rafting)</text>
<rect x="516" y="96" width="26" height="11" fill="#d1495b" opacity="0.55"/>
<text x="550" y="106">Mesosaurus (freshwater reptile,</text>
<text x="550" y="120">could not cross an ocean)</text>
<rect x="516" y="130" width="26" height="11" fill="#b5651d" opacity="0.75"/>
<text x="550" y="140">One continuous mountain belt:</text>
<text x="550" y="154">Appalachians into the Caledonides,</text>
<text x="550" y="168">same ages, same structural grain</text>
<text x="516" y="196" font-weight="bold">Also matching across the joins</text>
<text x="516" y="212">Permian glacial striations radiating</text>
<text x="516" y="226">outward from a single ice centre</text>
<text x="516" y="240">near southern Africa &#8212; and coal</text>
<text x="516" y="254">swamps in Antarctica.</text>
<text x="516" y="278" font-weight="bold">The weakness</text>
<text x="516" y="294">All correlation. No mechanism that</text>
<text x="516" y="308">survived a strength calculation, so</text>
<text x="516" y="322">for fifty years it did not persuade.</text>
</g>
<text x="30" y="352" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">The fit is made at the 1000 m shelf edge, not at the coastline; coastlines are erosional accidents.</text>

<text x="30" y="382" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#111">(b) What settled it: the ridge cross-section, and why symmetry is decisive</text>

