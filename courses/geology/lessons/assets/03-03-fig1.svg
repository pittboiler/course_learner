<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 770" width="720" height="770" role="img" aria-label="Panel a: a Hjulstrom-style diagram of flow velocity against grain size on log axes, with the erosion curve rising steeply into the clay range so clay needs a higher velocity than sand, and a settling curve far below. Panel b: a meander in map view with cut bank and point bar, a cross-section inset showing helical flow, and a long profile with a knickpoint and paired terraces.">
