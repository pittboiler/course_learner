<text x="556" y="70" font-size="13" font-weight="bold" fill="#111">EROSION</text>
<text x="240" y="176" font-size="13" font-weight="bold" fill="#111">TRANSPORT</text>
<text x="556" y="252" font-size="13" font-weight="bold" fill="#111">DEPOSITION</text>
<text x="556" y="266" font-size="10" fill="#333">(settling wins)</text>

<line x1="152" y1="78" x2="118" y2="92" stroke="#d1495b" stroke-width="1.2"/>
