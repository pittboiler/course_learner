<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 625" width="780" height="625" role="img" aria-label="Top panel: viscosity plotted against silica content on a logarithmic axis, rising from basalt near 100 pascal seconds to rhyolite near ten billion, with a dashed fragmentation threshold separating effusive from explosive behaviour. Bottom panel: shield volcano, stratovolcano and caldera profiles drawn at true scale with no vertical exaggeration, annotated with magma type, eruptive style and characteristic hazard." font-family="Helvetica,Arial,sans-serif">
  <rect width="780" height="625" fill="#ffffff"/>

  <text x="20" y="26" font-size="14" font-weight="bold" fill="#111">A. One dial sets viscosity: silica content</text>

  <rect x="95" y="55" width="645" height="190" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>

  <line x1="95" y1="55" x2="95" y2="245" stroke="#111" stroke-width="1.5"/>
  <line x1="95" y1="245" x2="740" y2="245" stroke="#111" stroke-width="1.5"/>

  <line x1="95" y1="213.3" x2="102" y2="213.3" stroke="#111"/>
  <line x1="95" y1="181.7" x2="102" y2="181.7" stroke="#111"/>
  <line x1="95" y1="150.0" x2="102" y2="150.0" stroke="#111"/>
  <line x1="95" y1="118.3" x2="102" y2="118.3" stroke="#111"/>
  <line x1="95" y1="86.7" x2="102" y2="86.7" stroke="#111"/>
  <text x="88" y="249" font-size="11" text-anchor="end" fill="#333">0</text>
  <text x="88" y="217" font-size="11" text-anchor="end" fill="#333">2</text>
  <text x="88" y="186" font-size="11" text-anchor="end" fill="#333">4</text>
  <text x="88" y="154" font-size="11" text-anchor="end" fill="#333">6</text>
  <text x="88" y="122" font-size="11" text-anchor="end" fill="#333">8</text>
  <text x="88" y="91" font-size="11" text-anchor="end" fill="#333">10</text>
  <text x="88" y="59" font-size="11" text-anchor="end" fill="#333">12</text>
  <text x="34" y="150" font-size="11.5" text-anchor="middle" fill="#333" transform="rotate(-90 34 150)">log10 viscosity (Pa s)</text>

  <line x1="202.5" y1="245" x2="202.5" y2="239" stroke="#111"/>
  <line x1="310" y1="245" x2="310" y2="239" stroke="#111"/>
  <line x1="417.5" y1="245" x2="417.5" y2="239" stroke="#111"/>
  <line x1="525" y1="245" x2="525" y2="239" stroke="#111"/>
  <line x1="632.5" y1="245" x2="632.5" y2="239" stroke="#111"/>
  <text x="95" y="262" font-size="11" text-anchor="middle" fill="#333">45</text>
  <text x="202.5" y="262" font-size="11" text-anchor="middle" fill="#333">50</text>
  <text x="310" y="262" font-size="11" text-anchor="middle" fill="#333">55</text>
  <text x="417.5" y="262" font-size="11" text-anchor="middle" fill="#333">60</text>
  <text x="525" y="262" font-size="11" text-anchor="middle" fill="#333">65</text>
  <text x="632.5" y="262" font-size="11" text-anchor="middle" fill="#333">70</text>
  <text x="740" y="262" font-size="11" text-anchor="middle" fill="#333">75</text>
  <text x="417" y="284" font-size="12" text-anchor="middle" fill="#333">silica content (weight percent SiO2)</text>

  <line x1="95" y1="165.8" x2="740" y2="165.8" stroke="#d1495b" stroke-width="1.4" stroke-dasharray="7,5"/>
  <text x="110" y="76" font-size="12.5" fill="#d1495b" font-weight="bold">explosive &#8212; gas cannot escape, magma fragments</text>
  <text x="735" y="236" font-size="12.5" fill="#1a6fb5" font-weight="bold" text-anchor="end">effusive &#8212; gas bubbles out, magma flows</text>

  <polyline points="202.5,213.3 417.5,157.9 525,126.3 697,86.7" fill="none" stroke="#111" stroke-width="2.2"/>
  <circle cx="202.5" cy="213.3" r="5.5" fill="#1a6fb5" stroke="#111" stroke-width="1"/>
  <circle cx="417.5" cy="157.9" r="5.5" fill="#b5651d" stroke="#111" stroke-width="1"/>
  <circle cx="525" cy="126.3" r="5.5" fill="#d1495b" stroke="#111" stroke-width="1"/>
  <circle cx="697" cy="86.7" r="5.5" fill="#d1495b" stroke="#111" stroke-width="1"/>
  <text x="214" y="218" font-size="12" fill="#111">basalt, 50 percent</text>
  <text x="428" y="152" font-size="12" fill="#111">andesite, 60</text>
  <text x="536" y="131" font-size="12" fill="#111">dacite, 65</text>
  <text x="687" y="81" font-size="12" fill="#111" text-anchor="end">rhyolite, 73</text>

  <text x="20" y="318" font-size="13.5" font-weight="bold" fill="#111">B. The edifice follows &#8212; all three at true scale, no vertical exaggeration</text>

  <text x="44" y="344" font-size="12.5" font-weight="bold" fill="#111">Shield &#8212; Mauna Loa: 120 km across, 9 km from the seafloor, flanks 4 to 8 degrees</text>
  <text x="44" y="361" font-size="11.5" fill="#333">basalt &#183; log10 viscosity 2 &#183; effusive &#183; hazard: lava flows, which destroy property and rarely kill</text>
  <line x1="20" y1="420" x2="760" y2="420" stroke="#333" stroke-width="1.2"/>
  <path d="M 40 420 C 140 414 260 392 364 371 C 468 392 588 414 688 420 Z" fill="#9fb3a8" stroke="#111" stroke-width="1.5"/>

  <text x="195" y="462" font-size="12.5" font-weight="bold" fill="#111">Stratovolcano &#8212; Fuji: 25 km across, 3.8 km high, upper cone near 30 degrees</text>
  <text x="195" y="479" font-size="11.5" fill="#333">andesite &#183; log10 viscosity 5 &#183; explosive &#183; alternating lava and tephra</text>
  <text x="195" y="496" font-size="11.5" fill="#333">hazard: pyroclastic density currents, then lahars far down the valleys</text>
  <line x1="20" y1="510" x2="760" y2="510" stroke="#333" stroke-width="1.2"/>
  <path d="M 40 510 C 72 506 96 500 107.5 489.5 C 119 500 143 506 175 510 Z" fill="#d8c9a3" stroke="#111" stroke-width="1.5"/>

  <text x="195" y="533" font-size="12.5" font-weight="bold" fill="#111">Caldera &#8212; Crater Lake: 10 km wide, 1.2 km deep; dashed = the lost cone</text>
  <text x="195" y="550" font-size="11.5" fill="#333">rhyolite or dacite &#183; log10 viscosity 8 to 10 &#183; chamber voided, roof drops in</text>
  <text x="195" y="567" font-size="11.5" fill="#333">hazard: regional ash fall and climate forcing at VEI 6 to 8</text>
  <line x1="20" y1="575" x2="760" y2="575" stroke="#333" stroke-width="1.2"/>
  <path d="M 40 575 C 55 569 65 563 72.4 555 C 80 563 90 569 104.8 575" fill="none" stroke="#8fa8c0" stroke-width="1.4" stroke-dasharray="5,4"/>
  <path d="M 20 588 L 20 575 L 45 572 L 50 582 L 94 582 L 99 572 L 130 575 L 130 588 Z" fill="#d8c9a3" stroke="#111" stroke-width="1.5"/>
  <line x1="45" y1="572" x2="50" y2="588" stroke="#b5651d" stroke-width="1.2"/>
  <line x1="99" y1="572" x2="94" y2="588" stroke="#b5651d" stroke-width="1.2"/>

  <line x1="600" y1="600" x2="708" y2="600" stroke="#111" stroke-width="2"/>
  <line x1="600" y1="595" x2="600" y2="605" stroke="#111" stroke-width="2"/>
  <line x1="708" y1="595" x2="708" y2="605" stroke="#111" stroke-width="2"/>
  <text x="654" y="618" font-size="11.5" text-anchor="middle" fill="#333">20 km</text>
</svg>
