<line x1="672" y1="482" x2="706" y2="516" stroke="#111" stroke-width="0.8"/>

<text x="150" y="560" font-size="9.5" font-weight="bold" fill="#d1495b">drain the void and its roof loses buoyant support</text>

<rect x="48" y="572" width="372" height="28" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>
<text x="58" y="584" font-size="10" fill="#111">CaCO3 + CO2 + H2O &#8596; Ca2+ + 2 HCO3-</text>
<text x="58" y="596" font-size="9" fill="#333">&#8594; dissolves at high soil CO2   &#8592; precipitates in cave air</text>

