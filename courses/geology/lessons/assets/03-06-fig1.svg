<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-label="Groundwater cross-section showing vadose zone, water table, unconfined and confined aquifers, a pumping well with its cone of depression and a flowing artesian well, plus a karst section with cave, sinkhole and spring" font-family="Helvetica,Arial,sans-serif">
