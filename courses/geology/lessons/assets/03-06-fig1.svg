<text x="150" y="480" font-size="9.5" fill="#111">rain + soil CO2 &#8594; carbonic acid</text>

<polygon points="306,452 356,452 338,492 324,492" fill="#ffffff" stroke="#333" stroke-width="1.2" stroke-dasharray="4,3"/>
