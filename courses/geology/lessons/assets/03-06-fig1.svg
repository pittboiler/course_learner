<rect x="520" y="52" width="248" height="88" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>
<text x="532" y="70" font-size="10.5" font-weight="bold" fill="#111">Darcy's law, and the chain built on it</text>
<text x="532" y="86" font-size="10" fill="#111">q = -K (dh/dl)   flux, m/day</text>
<text x="532" y="101" font-size="10" fill="#111">Q = q A            discharge, m3/day</text>
<text x="532" y="116" font-size="10" fill="#111">v = q / n</text>
<text x="573" y="119" font-size="7.5" fill="#111">e</text>
<text x="588" y="116" font-size="10" fill="#111">pore velocity</text>
<text x="532" y="131" font-size="10" fill="#111">t = L / v            travel time</text>

<text x="55" y="116" font-size="9.5" fill="#1a6fb5">water table</text>
<text x="110" y="122" font-size="9.5" fill="#333">vadose (unsaturated) zone</text>
<text x="196" y="140" font-size="9.5" fill="#333">cone of depression</text>
<line x1="290" y1="143" x2="318" y2="176" stroke="#333" stroke-width="0.7"/>
<text x="470" y="150" font-size="9.5" fill="#333" text-anchor="middle">gaining stream</text>
<text x="500" y="164" font-size="9.5" fill="#d1495b">potentiometric surface</text>
<line x1="552" y1="167" x2="552" y2="176" stroke="#d1495b" stroke-width="0.8"/>
<text x="560" y="232" font-size="10" fill="#111" text-anchor="middle">unconfined aquifer (sand)</text>
<text x="700" y="240" font-size="9.5" fill="#333" text-anchor="middle">discharge area</text>
<text x="600" y="292" font-size="9.5" fill="#111" text-anchor="middle">aquitard (clay)</text>
<text x="600" y="322" font-size="10" fill="#111" text-anchor="middle">confined aquifer (sandstone)</text>
<text x="185" y="226" font-size="9.5" fill="#111">clay wedges out</text>
<line x1="262" y1="223" x2="278" y2="214" stroke="#111" stroke-width="0.8" marker-end="url(#ai)"/>
<text x="120" y="320" font-size="9.5" fill="#111">impermeable basement</text>

<text x="20" y="420" font-size="12.5" font-weight="bold" fill="#111">(b) Karst: acid water dissolves the aquifer, and dropping the water table drops the roof</text>

