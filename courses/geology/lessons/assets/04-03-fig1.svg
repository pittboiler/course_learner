<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 348" width="820" height="348" role="img" aria-label="Panel a draws all 4540 million years of Earth history as a single linear bar divided into four eons, Hadean, Archean, Proterozoic and Phanerozoic, with the Phanerozoic a thin sliver at the right-hand end and a bracket showing that the Precambrian occupies 88 percent of the bar and is divided into only three eons. Events marked along it include the oldest zircon at 4.40 billion years, the oldest intact rock at 4.03 billion years, the oldest traces of life at 3.5 billion years, the Great Oxidation Event at 2.4 billion years, and the base of the Ediacaran at 635 million years. A dashed wedge expands that sliver 8.4 times into panel b, which redraws the Phanerozoic alone at the same width, showing three eras and twelve periods of wildly unequal length, from a 79 million year Cretaceous to a 2.6 million year Quaternary thinner than the rule itself, with the five largest mass extinctions marked as triangles at the period boundaries they help define.">
<defs>
<marker id="gtar" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#d1495b"/></marker>
</defs>
<rect width="820" height="348" fill="#ffffff"/>

<text x="40" y="20" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">(a) All of Earth history, drawn linearly &#8212; millions of years ago (Ma)</text>

