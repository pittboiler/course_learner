<text x="225" y="41" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">3.5 Ga oldest traces of life</text>
<text x="666" y="41" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">635 Ma base Ediacaran</text>
