<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A cross-section through a collisional mountain belt drawn with a true vertical scale, showing five kilometres of topography above a twenty-eight kilometre crustal root, with metamorphic grade increasing downward, plus an inset comparing crustal columns before and after erosion.">
<rect width="800" height="600" fill="#ffffff"/>
<defs>
<clipPath id="crustclip">
<polygon points="55,73.3 120,73.1 180,72.9 250,68.6 300,63.9 340,58.9 400,55.3 460,56.0 520,56.4 580,58.9 640,65.4 700,69.7 745,71.5 785,72.2 785,210.1 745,214.1 700,224.2 640,248.4 580,284.7 520,298.8 460,300.8 400,304.8 340,284.7 300,256.4 250,230.2 180,206.0 120,205.0 55,204.0"/>
</clipPath>
<marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#333"/></marker>
<marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2e8b57"/></marker>
<marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1a6fb5"/></marker>
</defs>

<text x="20" y="18" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">Collisional orogen: vertical scale true, horizontal compressed</text>

<line x1="60" y1="34" x2="103" y2="34" stroke="#333" stroke-width="1.6" marker-end="url(#arrR)"/>
<text x="108" y="38" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">convergence</text>
<line x1="785" y1="34" x2="742" y2="34" stroke="#333" stroke-width="1.6" marker-end="url(#arrR)"/>
<text x="737" y="38" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="end">convergence</text>

<rect x="55" y="74" width="730" height="288" fill="#9fb3a8"/>

<g clip-path="url(#crustclip)">
<rect x="55" y="40" width="730" height="88" fill="#ece2c8"/>
<rect x="55" y="128" width="730" height="54" fill="#d8c9a3"/>
<rect x="55" y="182" width="730" height="54" fill="#bfa87e"/>
<rect x="55" y="236" width="730" height="130" fill="#a68d63"/>
</g>

<polygon points="55,73.3 120,73.1 180,72.9 250,68.6 300,63.9 340,58.9 400,55.3 460,56.0 520,56.4 580,58.9 640,65.4 700,69.7 745,71.5 785,72.2 785,210.1 745,214.1 700,224.2 640,248.4 580,284.7 520,298.8 460,300.8 400,304.8 340,284.7 300,256.4 250,230.2 180,206.0 120,205.0 55,204.0" fill="none" stroke="#111" stroke-width="2"/>

<line x1="215" y1="71" x2="285" y2="150" stroke="#d1495b" stroke-width="1.6"/>
<polygon points="-4,0 4,0 0,-6" transform="translate(236,94.7) rotate(48.5)" fill="#d1495b"/>
<polygon points="-4,0 4,0 0,-6" transform="translate(257,118.4) rotate(48.5)" fill="#d1495b"/>
<line x1="245" y1="68" x2="315" y2="155" stroke="#d1495b" stroke-width="1.6"/>
<polygon points="-4,0 4,0 0,-6" transform="translate(266,94.1) rotate(51.2)" fill="#d1495b"/>
<polygon points="-4,0 4,0 0,-6" transform="translate(287,120.2) rotate(51.2)" fill="#d1495b"/>
<line x1="275" y1="64" x2="345" y2="162" stroke="#d1495b" stroke-width="1.6"/>
<polygon points="-4,0 4,0 0,-6" transform="translate(296,93.4) rotate(54.5)" fill="#d1495b"/>
<polygon points="-4,0 4,0 0,-6" transform="translate(317,122.8) rotate(54.5)" fill="#d1495b"/>
<text x="130" y="52" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b">fold-and-thrust belt</text>
<line x1="238" y1="56" x2="266" y2="66" stroke="#d1495b" stroke-width="1"/>

<line x1="440" y1="56" x2="486" y2="272" stroke="#d1495b" stroke-width="1.4" stroke-dasharray="5,3"/>
<text x="446" y="112" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b">suture</text>

<line x1="545" y1="252" x2="527" y2="64" stroke="#2e8b57" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrG)"/>
<text x="556" y="164" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#2e8b57">exhumation</text>

<line x1="55" y1="74" x2="785" y2="74" stroke="#1a6fb5" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="200" y1="200" x2="700" y2="200" stroke="#1a6fb5" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="210" y="195" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a6fb5">Moho of normal 35 km crust</text>

<line x1="460" y1="56" x2="460" y2="74" stroke="#1a6fb5" stroke-width="2"/>
<line x1="455" y1="56" x2="465" y2="56" stroke="#1a6fb5" stroke-width="2"/>
<line x1="455" y1="74" x2="465" y2="74" stroke="#1a6fb5" stroke-width="2"/>
<text x="460" y="46" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1a6fb5" text-anchor="middle">topography: 5 km</text>

<line x1="490" y1="200" x2="490" y2="300" stroke="#1a6fb5" stroke-width="2"/>
<line x1="485" y1="200" x2="495" y2="200" stroke="#1a6fb5" stroke-width="2"/>
<line x1="485" y1="300" x2="495" y2="300" stroke="#1a6fb5" stroke-width="2"/>
<line x1="460" y1="326" x2="460" y2="308" stroke="#1a6fb5" stroke-width="1.4" marker-end="url(#arrB)"/>
<text x="430" y="338" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a6fb5" text-anchor="middle">root: 28 km &#8212; 5.6 &#215; the topography</text>

<text x="90" y="170" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">crust, 2.8 g/cm&#179;</text>
<text x="650" y="330" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">mantle, 3.3 g/cm&#179;</text>
<text x="705" y="234" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">Moho</text>

<line x1="48" y1="45" x2="48" y2="362" stroke="#333" stroke-width="1.2"/>
<line x1="44" y1="74" x2="48" y2="74" stroke="#333" stroke-width="1.2"/>
<text x="41" y="77" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="end">0</text>
<line x1="44" y1="146" x2="48" y2="146" stroke="#333" stroke-width="1.2"/>
<text x="41" y="149" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="end">20</text>
<line x1="44" y1="218" x2="48" y2="218" stroke="#333" stroke-width="1.2"/>
<text x="41" y="221" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="end">40</text>
<line x1="44" y1="290" x2="48" y2="290" stroke="#333" stroke-width="1.2"/>
<text x="41" y="293" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="end">60</text>
<line x1="44" y1="362" x2="48" y2="362" stroke="#333" stroke-width="1.2"/>
<text x="41" y="365" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="end">80</text>
<text x="16" y="215" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle" transform="rotate(-90 16 215)">depth below sea level (km)</text>

<text x="60" y="382" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">Metamorphic grade rises with depth:</text>
<rect x="60" y="390" width="14" height="11" fill="#ece2c8" stroke="#8fa8c0"/>
<text x="79" y="399" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">0&#8211;15 km: slate, phyllite</text>
<rect x="245" y="390" width="14" height="11" fill="#d8c9a3" stroke="#8fa8c0"/>
<text x="264" y="399" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">15&#8211;30 km: schist</text>
<rect x="410" y="390" width="14" height="11" fill="#bfa87e" stroke="#8fa8c0"/>
<text x="429" y="399" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">30&#8211;45 km: gneiss</text>
<rect x="580" y="390" width="14" height="11" fill="#a68d63" stroke="#8fa8c0"/>
<text x="599" y="399" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">45 km and deeper: migmatite</text>

<line x1="20" y1="414" x2="780" y2="414" stroke="#8fa8c0" stroke-width="1"/>
<text x="20" y="432" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Erosion and isostatic rebound</text>

<line x1="145" y1="452" x2="405" y2="452" stroke="#1a6fb5" stroke-width="1" stroke-dasharray="4,3"/>
<text x="140" y="449" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a6fb5" text-anchor="end">sea level</text>

<rect x="150" y="443" width="80" height="122" fill="#d8c9a3" stroke="#111" stroke-width="1.6"/>
<rect x="150" y="443" width="80" height="12" fill="#d1495b" fill-opacity="0.35" stroke="#d1495b" stroke-width="1"/>
<text x="190" y="582" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111" text-anchor="middle">before</text>

<rect x="310" y="445" width="80" height="110" fill="#d8c9a3" stroke="#111" stroke-width="1.6"/>
<text x="350" y="582" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111" text-anchor="middle">after</text>

<line x1="230" y1="565" x2="400" y2="565" stroke="#111" stroke-width="0.9" stroke-dasharray="3,3"/>
<line x1="400" y1="567" x2="400" y2="556" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#arrG)"/>
<line x1="230" y1="443" x2="405" y2="443" stroke="#111" stroke-width="0.9" stroke-dasharray="3,3"/>
<line x1="230" y1="455" x2="405" y2="455" stroke="#d1495b" stroke-width="0.9" stroke-dasharray="3,3"/>
<line x1="268" y1="456" x2="268" y2="445" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#arrG)"/>
<text x="276" y="454" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#2e8b57">rebound</text>
<text x="411" y="446" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#111">old summit</text>
<text x="411" y="462" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#d1495b">where the summit would sit with no rebound</text>

<text x="430" y="486" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d1495b">Strip 6.6 km of rock off the top &#8230;</text>
<text x="430" y="504" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">&#8230; the summit falls only 1.0 km,</text>
<text x="430" y="522" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#2e8b57">&#8230; and the Moho rises 5.6 km.</text>
<text x="430" y="546" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111">85 percent of the erosion is undone</text>
<text x="430" y="562" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111">by rebound from below.</text>
</svg>
