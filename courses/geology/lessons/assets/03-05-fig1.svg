<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 662" width="820" height="662" role="img" aria-label="Panel a: cross-section of a sand dune with wind blowing left to right, saltation hops sketched along the gentle windward slope, a steep slip face at the angle of repose of 34 degrees on the lee side, and beneath it a block of rock containing three sets of cross-beds whose foresets all dip downwind. Panel b: map view of a coastline with a headland and a bay, wave crests that are straight and oblique in deep water and bend to become shore-parallel in shallow water, energy arrows converging on the headland and spreading in the bay, a zigzag longshore drift path, and a spit growing downdrift.">
  <rect width="820" height="662" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#333"/>
