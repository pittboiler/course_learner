    <text x="112" y="104" font-size="11" fill="#111">stoss slope, 10&#8211;15&#176;: saltating grains hop up it</text>
    <text x="112" y="119" font-size="11" fill="#d1495b">each impact ejects the next grain &#8212; hops stay below ~1 m</text>
    <text x="470" y="130" font-size="11" font-weight="bold" fill="#111" text-anchor="middle">crest</text>
    <line x1="470" y1="140" x2="566" y2="140" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>
    <path d="M 528,140 A 58,58 0 0,1 518.1,172.5" fill="none" stroke="#333" stroke-width="1"/>
    <text x="536" y="170" font-size="11" font-weight="bold" fill="#111">34&#176;</text>
    <text x="634" y="166" font-size="11" fill="#111">slip face: grains avalanche at</text>
    <text x="634" y="181" font-size="11" fill="#111">the angle of repose (3.2)</text>
