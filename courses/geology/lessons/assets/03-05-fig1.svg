    <text x="716" y="336" font-size="10.5" fill="#333">sets 8&#8211;20 m</text>
    <text x="90" y="388" font-size="11" fill="#111">Preserved in rock: each set is a buried slip face, so foresets dip <tspan font-weight="bold">downwind</tspan> &#8212; an ancient erg records its palaeowind (1.5).</text>
    <text x="20" y="410" font-size="13" font-weight="bold" fill="#111">(b) Refraction concentrates wave energy; residual obliquity drives the longshore conveyor</text>
