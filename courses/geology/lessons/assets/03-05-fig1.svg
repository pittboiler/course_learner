    <text x="240" y="56" font-size="12" font-weight="bold" fill="#1a6fb5">wind</text>
    <path d="M 90,240 L 470,140 L 618,240 Z" fill="#d8c9a3" stroke="#333" stroke-width="1.6"/>
    <line x1="60" y1="240" x2="740" y2="240" stroke="#333" stroke-width="1.4"/>
