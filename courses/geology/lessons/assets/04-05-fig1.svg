<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" width="800" height="920" role="img" aria-label="A geologic map with a cross-section aligned beneath it. The map shows brown topographic contours at 400, 300 and 200 metres that swing sharply west where an east-flowing stream has cut a valley across the middle, while three geologic contacts in the western half swing only a little to the east in the same valley, so the contacts V downstream in the direction of dip while the contours V upstream. West of a normal fault with hachures on its downthrown western side, four units dip 15 degrees east; east of the fault the same units wrap around a north-plunging anticline whose nose closes northward with the oldest unit, the Triassic limestone, in its core. A red dashed section line runs east to west across the southern part of the map from A to A prime, and directly below, drawn at the same horizontal scale with no vertical exaggeration, the cross-section shows the east-dipping panel truncated against the west-dipping normal fault and the anticline beyond it, with dashed lines continuing the eroded arch above the present land surface. A full explanation lists the five map units youngest at top together with the strike and dip, fault, fold axis, contact and contour symbols." font-family="Helvetica,Arial,sans-serif">
