<text x="176" y="663" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#111">focus</text>
<text x="268" y="702" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a6fb5">P</text>
<text x="72" y="702" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b" text-anchor="end">S</text>
<text x="260" y="782" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#111">103&#176;</text>
<text x="228" y="836" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#111">143&#176;</text>
<text x="80" y="782" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#111" text-anchor="end">103&#176;</text>
<text x="170" y="853" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#111" text-anchor="middle">180&#176;</text>

<text x="290" y="690" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">P and S leave the focus together, and both are recorded out to 103&#176;.</text>
<text x="290" y="708" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">Beyond 103&#176; no direct S is recorded anywhere on Earth, ever.</text>
<text x="290" y="726" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#d1495b">Shear waves need rigidity, so the outer core has none: it is liquid.</text>
<text x="290" y="748" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">P vanishes from 103&#176; to 143&#176;, then returns, bent down and back</text>
<text x="290" y="764" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">through the core: the kink is the drop from 13.7 to 8.1 km/s.</text>
<text x="290" y="786" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">Faint P arrivals inside the shadow (Lehmann, 1936) are the</text>
<text x="290" y="802" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">signature of a solid inner core reflecting energy back out.</text>
</svg>
