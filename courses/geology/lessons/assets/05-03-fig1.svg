<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 512" width="820" height="512" role="img" aria-label="A single Phanerozoic time axis running from 539 million years ago to the present carries five stacked records. Track a plots relative sea level in metres above present, with a high in the Ordovician, a sharp drop at the Hirnantian glaciation, the lowest values of the eon when Pangaea was assembled near 290 million years, and the highest values in the mid Cretaceous near 90 million years. Track b plots an estimated deep-ocean temperature curve, warm through most of the eon with cold excursions at the Hirnantian and the Late Palaeozoic Ice Age, a hot spike at the end-Permian, a Cretaceous maximum, the PETM spike at 56 million years, and a long decline after 50 million years. Pale blue vertical bands mark the three icehouse intervals. Track c shows the continental configuration: Gondwana and the northern blocks separate, then Pangaea assembled between 320 and 200 million years, then dispersal as the Atlantic opens. Track d shows four orogenic belts as bars. Track e marks the four great flood-basalt provinces as triangles, the Chicxulub impact as a starred circle at 66 million years, and the Big Five mass extinctions as red triangles. Dashed guides at 252 and 66 million years show that the end-Permian and end-Cretaceous events coincide with flood basalts, and the end-Cretaceous with the impact as well.">
<rect width="820" height="512" fill="#ffffff"/>
<g font-family="Helvetica,Arial,sans-serif">

