<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 660" width="820" height="660" role="img" aria-label="Panel a is a Rubidium-Strontium isochron diagram. Four cogenetic minerals from one granite plot on a straight line whose slope gives the age and whose intercept on the vertical axis gives the initial strontium isotope ratio. A horizontal dashed line shows where all four samples sat at time zero, a dotted line shows the array partway through its rotation, and one altered sample plots well below the line, failing the closed-system test. Panel b is a temperature versus time cooling path for a single pluton, crossing five closure temperatures at five different ages, with a table naming each chronometer and the slope of one segment read as a cooling rate and converted to an exhumation rate.">
