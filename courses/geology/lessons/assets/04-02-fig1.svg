<text x="712" y="390" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">900</text>
<text x="762" y="390" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">60.0</text>
<text x="550" y="410" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">2  Ar-Ar hornblende</text>
<text x="712" y="410" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">525</text>
<text x="762" y="410" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">55.0</text>
<text x="550" y="430" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">3  Ar-Ar biotite</text>
<text x="712" y="430" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">300</text>
<text x="762" y="430" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">48.0</text>
<text x="550" y="450" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">4  apatite fission track</text>
<text x="712" y="450" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">110</text>
<text x="762" y="450" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">30.0</text>
<text x="550" y="470" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">5  apatite (U-Th)/He</text>
<text x="712" y="470" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">70</text>
<text x="762" y="470" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">22.0</text>
<text x="712" y="486" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#8fa8c0">&#176;C</text>
<text x="762" y="486" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#8fa8c0">Ma</text>
<line x1="546" y1="498" x2="800" y2="498" stroke="#8fa8c0" stroke-width="1"/>
<text x="550" y="518" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111111">All five ages are correct. Each dates</text>
<text x="550" y="532" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111111">cooling through its own Tc, and together</text>
<text x="550" y="546" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111111">they are a cooling history, not a conflict.</text>
<text x="550" y="574" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">Segment 3 to 4:</text>
<text x="550" y="588" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">190&#176;C / 18.0 Myr = 10.6&#176;C per Myr</text>
<text x="550" y="602" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">at 25&#176;C/km &#8594; 0.42 mm/yr of exhumation</text>
</svg>
