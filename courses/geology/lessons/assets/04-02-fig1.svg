<text x="215" y="432" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333">steep: the pluton is losing heat by conduction</text>
<text x="215" y="444" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333">into cold host rock, so this leg is not exhumation</text>
<text x="270" y="556" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333">gentle: the rock now rides the ambient geotherm,</text>
<text x="270" y="568" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333">so slope / geothermal gradient = exhumation rate</text>

