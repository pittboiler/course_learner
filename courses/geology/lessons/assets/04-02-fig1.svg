<text x="335" y="177" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b">altered sample: it lost radiogenic Sr87,</text>
<text x="335" y="189" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b">so it was an open system. Discard it.</text>
<text x="100" y="106" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#2e8b57">every parent atom lost becomes</text>
<text x="100" y="118" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#2e8b57">one daughter atom, so each sample</text>
<text x="100" y="130" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#2e8b57">climbs and the array pivots</text>
<text x="100" y="142" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#2e8b57">about the intercept</text>

<text x="550" y="56" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">A straight line, y = b + m x</text>
<text x="550" y="78" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">y = Sr87 / Sr86 now</text>
<text x="550" y="94" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">x = Rb87 / Sr86 now</text>
<text x="550" y="110" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">b = Sr87 / Sr86 at t = 0</text>
<text x="550" y="126" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">m = e^(&#955;t) - 1</text>
<line x1="550" y1="138" x2="790" y2="138" stroke="#8fa8c0" stroke-width="1"/>
<text x="550" y="158" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111111">m = 0.0170 &#8594; t = ln(1.0170)/&#955; = 1.21 Ga</text>
<text x="550" y="176" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111111">b = 0.7040 &#8594; a mantle-like source, not</text>
<text x="550" y="190" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111111">remelted old crust</text>
<line x1="550" y1="202" x2="790" y2="202" stroke="#8fa8c0" stroke-width="1"/>
<text x="550" y="222" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">Nothing was assumed about the initial</text>
<text x="550" y="236" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">daughter. The fit both measures it and</text>
<text x="550" y="250" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333333">tests the closed-system assumption.</text>

<line x1="30" y1="308" x2="790" y2="308" stroke="#8fa8c0" stroke-width="1"/>

<text x="30" y="336" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#111111">(b) One rock, five clocks: an age is a cooling age</text>

