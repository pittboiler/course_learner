<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 510" width="700" height="510" role="img" aria-label="Temperature versus depth diagram of the upper mantle showing the dry peridotite solidus, the water-saturated solidus, the geotherm, and three arrows marking decompression melting, flux melting and heat-transfer melting.">
  <rect width="700" height="510" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/>
    </marker>
  </defs>

  <rect x="90" y="50" width="530" height="350" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>

  <path d="M390,50 L373,167 L384,283 L402,400 L591,400 L414,50 Z" fill="#1a6fb5" opacity="0.10"/>
  <path d="M414,50 L591,400 L620,400 L620,50 Z" fill="#d1495b" opacity="0.12"/>

  <g stroke="#8fa8c0" stroke-width="1">
    <line x1="90" y1="50" x2="84" y2="50"/>
    <line x1="90" y1="166.7" x2="84" y2="166.7"/>
    <line x1="90" y1="283.3" x2="84" y2="283.3"/>
    <line x1="90" y1="400" x2="84" y2="400"/>
    <line x1="90" y1="400" x2="90" y2="406"/>
    <line x1="207.8" y1="400" x2="207.8" y2="406"/>
    <line x1="325.6" y1="400" x2="325.6" y2="406"/>
    <line x1="443.3" y1="400" x2="443.3" y2="406"/>
    <line x1="561.1" y1="400" x2="561.1" y2="406"/>
    <line x1="620" y1="122.2" x2="626" y2="122.2"/>
    <line x1="620" y1="194.4" x2="626" y2="194.4"/>
    <line x1="620" y1="266.7" x2="626" y2="266.7"/>
    <line x1="620" y1="338.9" x2="626" y2="338.9"/>
  </g>

  <g font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">
    <text x="80" y="54" text-anchor="end">0</text>
    <text x="80" y="171" text-anchor="end">50</text>
    <text x="80" y="287" text-anchor="end">100</text>
    <text x="80" y="404" text-anchor="end">150</text>
    <text x="90" y="418" text-anchor="middle">0</text>
    <text x="207.8" y="418" text-anchor="middle">400</text>
    <text x="325.6" y="418" text-anchor="middle">800</text>
    <text x="443.3" y="418" text-anchor="middle">1200</text>
    <text x="561.1" y="418" text-anchor="middle">1600</text>
    <text x="630" y="126">1</text>
    <text x="630" y="198">2</text>
    <text x="630" y="270">3</text>
    <text x="630" y="342">4</text>
  </g>

  <g font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#111">
    <text x="355" y="434" text-anchor="middle">temperature (&#176;C)</text>
    <text x="30" y="225" text-anchor="middle" transform="rotate(-90 30 225)">depth (km)</text>
    <text x="662" y="225" text-anchor="middle" transform="rotate(-90 662 225)">pressure (GPa)</text>
  </g>

  <path d="M414,50 L591,400" fill="none" stroke="#111111" stroke-width="2.6"/>
  <path d="M390,50 C381,95 372,130 373,167 C374,215 379,250 384,283 C388,325 396,365 402,400" fill="none" stroke="#1a6fb5" stroke-width="2.4" stroke-dasharray="8,4"/>
  <path d="M90,50 C170,62 240,88 267,108 C320,146 380,168 414,190 C447,212 468,232 473,260 C481,305 488,350 490,400" fill="none" stroke="#2e8b57" stroke-width="2.4"/>
  <path d="M290,70 L290,180" fill="none" stroke="#b5651d" stroke-width="2.2" stroke-dasharray="6,4"/>

  <g font-family="Helvetica,Arial,sans-serif" font-size="10.5">
    <text x="475" y="349" text-anchor="middle" fill="#1a6fb5">solid unless water is added</text>
    <text x="556" y="203" text-anchor="middle" fill="#d1495b">melt present</text>
    <text x="285" y="64" text-anchor="end" fill="#b5651d">wet granite solidus</text>
  </g>

  <path d="M487,262 L477,132" fill="none" stroke="#d1495b" stroke-width="2.6" marker-end="url(#ar)"/>
  <circle cx="481" cy="179" r="4" fill="#111111"/>
  <text x="470" y="172" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111">55 km</text>

  <path d="M538,307 L396,307" fill="none" stroke="#d1495b" stroke-width="2.6" marker-end="url(#ar)"/>
  <circle cx="458" cy="307" r="4.5" fill="#111111"/>
  <text x="452" y="297" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111">mantle wedge</text>

  <path d="M268,108 L322,108" fill="none" stroke="#d1495b" stroke-width="2.6" marker-end="url(#ar)"/>

  <g font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">
    <circle cx="491" cy="276" r="9" fill="#d1495b"/><text x="491" y="280" text-anchor="middle">1</text>
    <circle cx="554" cy="307" r="9" fill="#d1495b"/><text x="554" y="311" text-anchor="middle">2</text>
    <circle cx="250" cy="90" r="9" fill="#d1495b"/><text x="250" y="94" text-anchor="middle">3</text>
  </g>

  <rect x="475" y="58" width="143" height="82" fill="#ffffff" stroke="#8fa8c0" stroke-width="1"/>
  <g stroke-width="2.4" fill="none">
    <line x1="484" y1="71" x2="504" y2="71" stroke="#111111"/>
    <line x1="484" y1="89" x2="504" y2="89" stroke="#1a6fb5" stroke-dasharray="7,4"/>
    <line x1="484" y1="107" x2="504" y2="107" stroke="#2e8b57"/>
    <line x1="484" y1="125" x2="504" y2="125" stroke="#b5651d" stroke-dasharray="6,4"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">
    <text x="510" y="75">dry solidus</text>
    <text x="510" y="93">wet solidus</text>
    <text x="510" y="111">geotherm</text>
    <text x="510" y="129">granite solidus</text>
  </g>

  <g font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">
    <circle cx="28" cy="453" r="8.5" fill="#d1495b"/><text x="28" y="457" text-anchor="middle">1</text>
    <circle cx="28" cy="473" r="8.5" fill="#d1495b"/><text x="28" y="477" text-anchor="middle">2</text>
    <circle cx="28" cy="493" r="8.5" fill="#d1495b"/><text x="28" y="497" text-anchor="middle">3</text>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#333">
    <text x="44" y="457">decompression: rock rises, crosses the dry solidus near 55 km &#8212; ridges and hotspots</text>
    <text x="44" y="477">flux: water moves the solidus to the rock &#8212; the subduction-zone mantle wedge</text>
    <text x="44" y="497">heat: an intrusion pushes crust across the granite solidus &#8212; aureoles, crustal granite</text>
  </g>
</svg>
