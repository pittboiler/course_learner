  <!-- caption -->
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Uniform flow past a cylinder with clockwise circulation: streamlines crowd over the top (faster, lower pressure),</text>
  <text x="20" y="40" fill="#8a8a8a" font-style="italic">the two stagnation points drop below the axis, lift points up — yet the drag is exactly zero.</text>

