<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="20" fill="#8a8a8a" font-style="italic">Sound is a longitudinal density wave: gas bunches (compression) and spreads (rarefaction), and the pattern glides right at speed c.</text>

  <!-- propagation arrow + speed label -->
  <text x="452" y="50" fill="#e0645c">c = &#8730;(&#8706;p/&#8706;&#961;)</text>
  <line x1="452" y1="62" x2="556" y2="62" stroke="#e0645c" stroke-width="2"/>
  <polygon points="556,62 546,57 546,67" fill="#e0645c"/>

  <!-- ===== density bands: vertical lines, bunched at compressions ===== -->
  <g stroke="#e0645c" stroke-width="2" opacity="0.85">
    <line x1="56" y1="80" x2="56" y2="152"/>
    <line x1="78" y1="80" x2="78" y2="152"/>
    <line x1="96" y1="80" x2="96" y2="152"/>
    <line x1="109" y1="80" x2="109" y2="152"/>
    <line x1="120" y1="80" x2="120" y2="152"/>
    <line x1="131" y1="80" x2="131" y2="152"/>
    <line x1="144" y1="80" x2="144" y2="152"/>
    <line x1="162" y1="80" x2="162" y2="152"/>
    <line x1="184" y1="80" x2="184" y2="152"/>
    <line x1="211" y1="80" x2="211" y2="152"/>
    <line x1="240" y1="80" x2="240" y2="152"/>
    <line x1="269" y1="80" x2="269" y2="152"/>
    <line x1="296" y1="80" x2="296" y2="152"/>
    <line x1="318" y1="80" x2="318" y2="152"/>
    <line x1="336" y1="80" x2="336" y2="152"/>
    <line x1="349" y1="80" x2="349" y2="152"/>
    <line x1="360" y1="80" x2="360" y2="152"/>
    <line x1="371" y1="80" x2="371" y2="152"/>
    <line x1="384" y1="80" x2="384" y2="152"/>
    <line x1="402" y1="80" x2="402" y2="152"/>
    <line x1="424" y1="80" x2="424" y2="152"/>
    <line x1="451" y1="80" x2="451" y2="152"/>
    <line x1="480" y1="80" x2="480" y2="152"/>
    <line x1="509" y1="80" x2="509" y2="152"/>
    <line x1="536" y1="80" x2="536" y2="152"/>
    <line x1="558" y1="80" x2="558" y2="152"/>
    <line x1="576" y1="80" x2="576" y2="152"/>
    <line x1="589" y1="80" x2="589" y2="152"/>
    <line x1="600" y1="80" x2="600" y2="152"/>
  </g>

  <!-- region labels -->
  <text x="92" y="170" fill="#8a8a8a" font-size="12" font-style="italic">compression</text>
  <text x="212" y="170" fill="#8a8a8a" font-size="12" font-style="italic">rarefaction</text>

  <!-- alignment dashes from bands down to the p' curve -->
  <line x1="120" y1="152" x2="120" y2="185" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="240" y1="152" x2="240" y2="275" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ===== p'(x) sinusoid ===== -->
  <!-- midline / x-axis -->
  <line x1="40" y1="230" x2="616" y2="230" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="616,230 606,225 606,235" fill="#8a8a8a"/>
  <text x="620" y="234" fill="#8a8a8a">x</text>
  <!-- p' axis -->
  <line x1="40" y1="290" x2="40" y2="182" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="40,182 35,192 45,192" fill="#8a8a8a"/>
  <text x="18" y="192" fill="#8a8a8a">p&#8242;</text>

  <path d="M 40 252.5 L 60 230 L 80 207.5 L 100 191 L 120 185 L 140 191 L 160 207.5 L 180 230 L 200 252.5 L 220 269 L 240 275 L 260 269 L 280 252.5 L 300 230 L 320 207.5 L 340 191 L 360 185 L 380 191 L 400 207.5 L 420 230 L 440 252.5 L 460 269 L 480 275 L 500 269 L 520 252.5 L 540 230 L 560 207.5 L 580 191 L 600 185"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="126" y="182" fill="#4a90d9" font-size="12">p&#8242; &gt; 0</text>
  <text x="246" y="290" fill="#4a90d9" font-size="12">p&#8242; &lt; 0</text>
</svg>
