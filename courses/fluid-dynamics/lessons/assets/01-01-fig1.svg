<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Measured density vs the size of the averaging box: molecular noise at tiny scales,</text>
  <text x="40" y="42" fill="#8a8a8a" font-style="italic">a flat plateau (the continuum value ρ), then drift once the box spans real gradients.</text>

  <!-- REV window shading -->
  <rect x="225" y="70" width="195" height="215" fill="#e0645c" opacity="0.15"/>

  <!-- axes -->
  <line x1="70" y1="285" x2="610" y2="285" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="610,285 600,280 600,290" fill="#8a8a8a"/>
  <line x1="70" y1="285" x2="70" y2="66" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,66 65,76 75,76" fill="#8a8a8a"/>

  <!-- axis labels -->
  <text x="330" y="312" fill="#8a8a8a">averaging volume V  (log scale) →</text>
  <text x="40" y="60" fill="#8a8a8a">ρ = M/V</text>

  <!-- plateau reference line -->
  <line x1="70" y1="170" x2="610" y2="170" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 5"/>
  <text x="20" y="174" fill="#8a8a8a">ρ</text>

  <!-- the measured-density curve: noise → plateau → drift -->
  <path d="M 80 92 L 90 252 L 100 118 L 110 234 L 120 138 L 130 212 L 140 150 L 150 200
           L 160 158 L 170 190 L 180 162 L 190 184 L 200 166 L 210 178 L 220 170
           L 300 170 L 380 170 L 420 170
           L 460 167 L 490 161 L 520 151 L 550 137 L 580 118 L 596 108"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- REV window bracket + label -->
  <line x1="225" y1="70" x2="225" y2="285" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line x1="420" y1="70" x2="420" y2="285" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line x1="225" y1="84" x2="420" y2="84" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="225,84 234,80 234,88" fill="#e0645c"/>
  <polygon points="420,84 411,80 411,88" fill="#e0645c"/>
  <text x="278" y="78" fill="#e0645c">REV window</text>

  <!-- region labels -->
  <text x="92" y="272" fill="#8a8a8a" font-size="12">molecular noise</text>
  <text x="256" y="200" fill="#8a8a8a" font-size="12">continuum plateau</text>
  <text x="470" y="272" fill="#8a8a8a" font-size="12">macroscopic gradients</text>
</svg>
