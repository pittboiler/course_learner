<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">σ_ij = i-component of force per area on the face whose outward normal points along j. Coral = normal (pressure), blue = shear.</text>

  <!-- ===== left: cubic fluid element with stresses on its faces ===== -->

  <!-- axis triad -->
  <line x1="60" y1="300" x2="108" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="108,300 99,296 99,304" fill="#8a8a8a"/>
  <text x="112" y="305" fill="#8a8a8a">x</text>
  <line x1="60" y1="300" x2="60" y2="252" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="60,252 56,261 64,261" fill="#8a8a8a"/>
  <text x="49" y="249" fill="#8a8a8a">y</text>

  <!-- the fluid element (a face of the cube) -->
  <rect x="140" y="140" width="120" height="120" fill="#4a90d9" opacity="0.15" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="168" y="205" fill="#8a8a8a" font-style="italic">fluid</text>
  <text x="160" y="222" fill="#8a8a8a" font-style="italic">element</text>

  <!-- RIGHT face (outward normal +x): normal stress σ_xx (coral, compressive inward) -->
  <line x1="306" y1="175" x2="264" y2="175" stroke="#e0645c" stroke-width="2"/>
  <polygon points="262,175 272,170 272,180" fill="#e0645c"/>
  <text x="278" y="168" fill="#e0645c">σ_xx</text>

  <!-- RIGHT face: shear stress σ_yx (blue, tangential, up) -->
  <line x1="277" y1="248" x2="277" y2="209" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="277,205 272,215 282,215" fill="#4a90d9"/>
  <text x="284" y="245" fill="#4a90d9">σ_yx</text>

  <!-- TOP face (outward normal +y): normal stress σ_yy (coral, compressive inward, down) -->
  <line x1="175" y1="100" x2="175" y2="136" stroke="#e0645c" stroke-width="2"/>
  <polygon points="175,138 170,128 180,128" fill="#e0645c"/>
  <text x="147" y="110" fill="#e0645c">σ_yy</text>

  <!-- TOP face: shear stress σ_xy (blue, tangential, right) -->
  <line x1="205" y1="123" x2="246" y2="123" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="250,123 240,118 240,128" fill="#4a90d9"/>
  <text x="212" y="115" fill="#4a90d9">σ_xy</text>

  <!-- ===== right: traction on an oriented face ===== -->
  <text x="470" y="300" fill="#8a8a8a" font-style="italic">traction  t = σ·n</text>

  <!-- fluid on the near side (shaded) -->
  <polygon points="512.5,152.4 567.5,247.6 532.9,267.6 477.9,172.4" fill="#4a90d9" opacity="0.15"/>

  <!-- the cut surface -->
  <line x1="512.5" y1="152.4" x2="567.5" y2="247.6" stroke="#8a8a8a" stroke-width="2"/>

  <!-- outward unit normal n (grey) -->
  <line x1="540" y1="200" x2="583" y2="175" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="583,175 575.1,185.3 570.1,176.7" fill="#8a8a8a"/>
  <text x="588" y="172" fill="#8a8a8a">n</text>

  <!-- traction vector t = σn (coral) -->
  <line x1="540" y1="200" x2="567.5" y2="152.75" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="567.5,152.75 565.75,165.5 557.25,160.5" fill="#e0645c"/>
  <text x="571" y="148" fill="#e0645c">t</text>

  <!-- point of application -->
  <circle cx="540" cy="200" r="3" fill="#8a8a8a"/>
</svg>
