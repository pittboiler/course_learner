<svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Both spin the fluid in circles — but only the left one spins the parcels. Vorticity is the paddlewheel test.</text>

  <!-- ================= LEFT: solid-body rotation ================= -->
  <text x="90" y="52" fill="#8a8a8a">Solid-body rotation  u = Ω r  θ̂</text>

  <!-- streamlines (grey circles) -->
  <circle cx="170" cy="200" r="32" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="170" cy="200" r="58" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="170" cy="200" r="84" fill="none" stroke="#8a8a8a" stroke-width="1"/>

  <!-- velocity arrows on the right side, pointing up (CCW), length GROWS with r -->
  <line x1="202" y1="200" x2="202" y2="186" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="202,182 198,191 206,191" fill="#4a90d9"/>
  <line x1="228" y1="200" x2="228" y2="174" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="228,170 224,179 232,179" fill="#4a90d9"/>
  <line x1="254" y1="200" x2="254" y2="162" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="254,158 250,167 258,167" fill="#4a90d9"/>

  <!-- coral paddlewheel that SPINS (with curved rotation arrow) -->
  <circle cx="170" cy="142" r="13" fill="#e0645c" opacity="0.15" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="157" y1="142" x2="183" y2="142" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="170" y1="129" x2="170" y2="155" stroke="#e0645c" stroke-width="1.5"/>
  <path d="M 186 137 A 18 18 0 0 1 186 147" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="186,147 190,140 181,143" fill="#e0645c"/>
  <text x="192" y="146" fill="#e0645c">spins</text>

  <!-- uniform out-of-page vorticity: coral dots everywhere -->
  <circle cx="140" cy="230" r="2.5" fill="#e0645c"/>
  <circle cx="200" cy="230" r="2.5" fill="#e0645c"/>
  <circle cx="120" cy="185" r="2.5" fill="#e0645c"/>
  <circle cx="215" cy="175" r="2.5" fill="#e0645c"/>
  <text x="112" y="300" fill="#e0645c">ω = 2Ω  (uniform, everywhere)</text>

  <!-- ================= RIGHT: free / line vortex ================= -->
  <text x="392" y="52" fill="#8a8a8a">Free vortex  u = Γ / 2πr  θ̂</text>

  <!-- streamlines (grey circles) -->
  <circle cx="480" cy="200" r="32" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="480" cy="200" r="58" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="480" cy="200" r="84" fill="none" stroke="#8a8a8a" stroke-width="1"/>

  <!-- velocity arrows on the right side, pointing up (CCW), length SHRINKS with r -->
  <line x1="512" y1="200" x2="512" y2="172" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="512,168 508,177 516,177" fill="#4a90d9"/>
  <line x1="538" y1="200" x2="538" y2="184" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="538,180 534,189 542,189" fill="#4a90d9"/>
  <line x1="564" y1="200" x2="564" y2="189" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="564,185 560,194 568,194" fill="#4a90d9"/>

  <!-- coral paddlewheel that does NOT spin (no rotation arrow) -->
  <circle cx="480" cy="142" r="13" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="467" y1="142" x2="493" y2="142" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="480" y1="129" x2="480" y2="155" stroke="#e0645c" stroke-width="1.5"/>
  <text x="498" y="146" fill="#e0645c">no spin (r &gt; 0)</text>

  <!-- coral delta spike at the core -->
  <circle cx="480" cy="200" r="4" fill="#e0645c"/>
  <text x="446" y="300" fill="#e0645c">ω = 0 for r &gt; 0, spike at r = 0</text>

  <!-- circulation loop label spanning both -->
  <text x="392" y="330" fill="#8a8a8a" font-style="italic">Γ = ∮ u·dl  (same round any loop enclosing the core)</text>
</svg>
