<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Two exact solutions: a wall drags fluid into a straight line (Couette); a pressure gradient bows it into a parabola (Poiseuille).</text>

  <!-- ===== LEFT: plane Couette — linear profile ===== -->

  <!-- moving top wall -->
  <line x1="70" y1="100" x2="200" y2="100" stroke="#8a8a8a" stroke-width="3"/>
  <line x1="150" y1="88" x2="196" y2="88" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="200,88 190,83 190,93" fill="#4a90d9"/>
  <text x="170" y="82" fill="#4a90d9">U</text>
  <!-- fixed bottom wall (hatched) -->
  <line x1="70" y1="240" x2="200" y2="240" stroke="#8a8a8a" stroke-width="3"/>
  <line x1="78" y1="240" x2="70" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="98" y1="240" x2="90" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="118" y1="240" x2="110" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="138" y1="240" x2="130" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="158" y1="240" x2="150" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="178" y1="240" x2="170" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="198" y1="240" x2="190" y2="250" stroke="#8a8a8a" stroke-width="1"/>

  <!-- reference axis u=0 -->
  <line x1="70" y1="100" x2="70" y2="240" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- y arrow -->
  <text x="52" y="175" fill="#8a8a8a">y</text>
  <text x="30" y="245" fill="#8a8a8a">0</text>
  <text x="30" y="105" fill="#8a8a8a">h</text>

  <!-- linear velocity profile (tips): bottom u=0 to top u=U -->
  <line x1="70" y1="205" x2="95" y2="205" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="95,205 87,201 87,209" fill="#4a90d9"/>
  <line x1="70" y1="170" x2="120" y2="170" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="120,170 112,166 112,174" fill="#4a90d9"/>
  <line x1="70" y1="135" x2="145" y2="135" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="145,135 137,131 137,139" fill="#4a90d9"/>
  <!-- straight profile line -->
  <line x1="70" y1="240" x2="170" y2="100" stroke="#4a90d9" stroke-width="3"/>
  <text x="118" y="150" fill="#4a90d9">u(y)=U y/h</text>

  <!-- ===== RIGHT: plane/pipe Poiseuille — parabolic profile ===== -->

  <!-- fixed top wall -->
  <line x1="400" y1="100" x2="560" y2="100" stroke="#8a8a8a" stroke-width="3"/>
  <line x1="408" y1="100" x2="400" y2="90" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="428" y1="100" x2="420" y2="90" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="448" y1="100" x2="440" y2="90" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="468" y1="100" x2="460" y2="90" stroke="#8a8a8a" stroke-width="1"/>
  <!-- fixed bottom wall -->
  <line x1="400" y1="240" x2="560" y2="240" stroke="#8a8a8a" stroke-width="3"/>
  <line x1="408" y1="240" x2="400" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="428" y1="240" x2="420" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="448" y1="240" x2="440" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="468" y1="240" x2="460" y2="250" stroke="#8a8a8a" stroke-width="1"/>

  <!-- reference axis u=0 -->
  <line x1="400" y1="100" x2="400" y2="240" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- centreline -->
  <line x1="400" y1="170" x2="560" y2="170" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 5"/>

  <!-- pressure gradient arrow -->
  <line x1="360" y1="170" x2="398" y2="170" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="398,170 388,165 388,175" fill="#8a8a8a"/>
  <text x="352" y="192" fill="#8a8a8a">−∂ₓp</text>

  <!-- sample velocity arrows -->
  <line x1="400" y1="210" x2="467" y2="210" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="467,210 459,206 459,214" fill="#e0645c"/>
  <line x1="400" y1="170" x2="500" y2="170" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="500,170 492,166 492,174" fill="#e0645c"/>
  <line x1="400" y1="130" x2="467" y2="130" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="467,130 459,126 459,134" fill="#e0645c"/>

  <!-- parabolic profile (tips), computed u_max(1-((y-170)/70)^2) -->
  <path d="M 400 240 L 438.3 225 L 467.3 210 L 487.2 195 L 495.4 185 L 500 170 L 495.4 155 L 487.2 145 L 467.3 130 L 438.3 115 L 400 100"
        fill="none" stroke="#e0645c" stroke-width="3"/>
  <text x="505" y="168" fill="#e0645c">uₘₐₓ</text>
  <text x="452" y="266" fill="#e0645c">u ∝ (a²−r²)</text>
</svg>
