<svg viewBox="0 0 740 240" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">One knob for the whole module: Re = UL/ν, inertia ÷ stickiness — read left (gooey, reversible) to right (wakes, turbulence).</text>

  <!-- regime labels -->
  <text x="150" y="64" fill="#8a8a8a" text-anchor="middle">creeping / Stokes</text>
  <text x="355" y="64" fill="#8a8a8a" text-anchor="middle">laminar</text>
  <text x="590" y="64" fill="#8a8a8a" text-anchor="middle">turbulent</text>

  <!-- creeping | laminar divider (Re ~ 1) -->
  <line x1="270" y1="74" x2="270" y2="158" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- transition band (coral) around Re ~ 2300 -->
  <rect x="437" y="134" width="20" height="32" fill="#e0645c" opacity="0.15"/>
  <line x1="447" y1="118" x2="447" y2="190" stroke="#e0645c" stroke-width="1.5"/>
  <circle cx="447" cy="150" r="4" fill="#e0645c"/>
  <text x="447" y="206" fill="#e0645c" text-anchor="middle">pipe transition ≈ 2300</text>

  <!-- the Re axis (log scale) -->
  <line x1="60" y1="150" x2="700" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="700,150 690,145 690,155" fill="#8a8a8a"/>
  <text x="706" y="155" fill="#8a8a8a">Re</text>

  <!-- decade ticks + labels -->
  <line x1="60"  y1="150" x2="60"  y2="157" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="165" y1="150" x2="165" y2="157" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="270" y1="150" x2="270" y2="157" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="375" y1="150" x2="375" y2="157" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="480" y1="150" x2="480" y2="157" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="585" y1="150" x2="585" y2="157" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="690" y1="150" x2="690" y2="157" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60"  y="172" fill="#8a8a8a" text-anchor="middle">10⁻⁴</text>
  <text x="165" y="172" fill="#8a8a8a" text-anchor="middle">10⁻²</text>
  <text x="270" y="172" fill="#8a8a8a" text-anchor="middle">1</text>
  <text x="375" y="172" fill="#8a8a8a" text-anchor="middle">10²</text>
  <text x="480" y="172" fill="#8a8a8a" text-anchor="middle">10⁴</text>
  <text x="585" y="172" fill="#8a8a8a" text-anchor="middle">10⁶</text>
  <text x="690" y="172" fill="#8a8a8a" text-anchor="middle">10⁸</text>

  <!-- example markers (blue dots on the axis, grey stalks to labels) -->
  <!-- bacterium, Re ~ 1e-4 -->
  <circle cx="60" cy="150" r="4" fill="#4a90d9"/>
  <line x1="60" y1="150" x2="60" y2="124" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="118" fill="#4a90d9" text-anchor="middle">bacterium</text>

  <!-- airborne dust, Re ~ 1e-2 -->
  <circle cx="165" cy="150" r="4" fill="#4a90d9"/>
  <line x1="165" y1="150" x2="165" y2="124" stroke="#8a8a8a" stroke-width="1"/>
  <text x="165" y="118" fill="#4a90d9" text-anchor="middle">airborne dust</text>

  <!-- flying gnat, Re ~ 1e2 -->
  <circle cx="375" cy="150" r="4" fill="#4a90d9"/>
  <line x1="375" y1="150" x2="375" y2="124" stroke="#8a8a8a" stroke-width="1"/>
  <text x="375" y="118" fill="#4a90d9" text-anchor="middle">flying gnat</text>

  <!-- swimming human, Re ~ 1e6 -->
  <circle cx="585" cy="150" r="4" fill="#4a90d9"/>
  <line x1="585" y1="150" x2="585" y2="106" stroke="#8a8a8a" stroke-width="1"/>
  <text x="585" y="100" fill="#4a90d9" text-anchor="middle">swimming human</text>

  <!-- Boeing 747, Re ~ 1e7 -->
  <circle cx="637.5" cy="150" r="4" fill="#4a90d9"/>
  <line x1="637.5" y1="150" x2="637.5" y2="124" stroke="#8a8a8a" stroke-width="1"/>
  <text x="637.5" y="118" fill="#4a90d9" text-anchor="middle">Boeing 747</text>
</svg>
