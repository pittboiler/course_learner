<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Three hardness properties, three different things the attacker is handed</text>
  <rect x="52" y="50" width="180" height="150" fill="none" stroke="#4a90d9" stroke-width="1.6" rx="6"/>
  <text x="142" y="74" fill="#4a90d9" font-size="12" text-anchor="middle">preimage resistance</text>
  <line x1="52" y1="86" x2="232" y2="86" stroke="#4a90d9" stroke-width="1.0"/>
  <text x="68" y="112" fill="#8a8a8a" font-size="12">given: y</text>
  <text x="68" y="134" fill="#8a8a8a" font-size="12">find: any x</text>
  <text x="68" y="156" fill="#8a8a8a" font-size="12">with H(x) = y</text>
  <text x="142" y="190" fill="#4a90d9" text-anchor="middle">2^n work</text>
  <text x="142" y="222" fill="#8a8a8a" font-size="11" text-anchor="middle">attacker picks x</text>
  <rect x="292" y="50" width="180" height="150" fill="none" stroke="#4a90d9" stroke-width="1.6" rx="6"/>
  <text x="382" y="74" fill="#4a90d9" font-size="12" text-anchor="middle">second-preimage resistance</text>
  <line x1="292" y1="86" x2="472" y2="86" stroke="#4a90d9" stroke-width="1.0"/>
  <text x="308" y="112" fill="#8a8a8a" font-size="12">given: x</text>
  <text x="308" y="134" fill="#8a8a8a" font-size="12">find: x' not equal to x</text>
  <text x="308" y="156" fill="#8a8a8a" font-size="12">with H(x') = H(x)</text>
  <text x="382" y="190" fill="#4a90d9" text-anchor="middle">2^n work</text>
  <text x="382" y="222" fill="#8a8a8a" font-size="11" text-anchor="middle">attacker picks x' only</text>
  <rect x="532" y="50" width="180" height="150" fill="none" stroke="#e0645c" stroke-width="1.6" rx="6"/>
  <text x="622" y="74" fill="#e0645c" font-size="12" text-anchor="middle">collision resistance</text>
  <line x1="532" y1="86" x2="712" y2="86" stroke="#e0645c" stroke-width="1.0"/>
  <text x="548" y="112" fill="#8a8a8a" font-size="12">given: nothing</text>
  <text x="548" y="134" fill="#8a8a8a" font-size="12">find: any x, x'</text>
  <text x="548" y="156" fill="#8a8a8a" font-size="12">with H(x) = H(x')</text>
  <text x="622" y="190" fill="#e0645c" text-anchor="middle">2^(n/2) work</text>
  <text x="622" y="222" fill="#8a8a8a" font-size="11" text-anchor="middle">attacker picks both</text>
  <text x="40" y="262" fill="#8a8a8a" font-size="11">More freedom for the attacker means less work. Collision resistance is the strongest demand and the cheapest to break,</text>
  <text x="40" y="280" fill="#e0645c" font-size="11">which is why an n-bit hash gives only n/2 bits of collision security.</text>
</svg>
