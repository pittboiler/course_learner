<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Schnorr's three moves, and the two thought experiments that make them mean something</text>
  <text x="170" y="62" fill="#4a90d9" font-size="12" text-anchor="middle">Prover  (knows x)</text>
  <text x="520" y="62" fill="#8a8a8a" font-size="12" text-anchor="middle">Verifier</text>
  <line x1="170" y1="74" x2="170" y2="210" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="520" y1="74" x2="520" y2="210" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="176" y1="100" x2="514" y2="100" stroke="#4a90d9" stroke-width="1.4"/>
  <polygon points="514.0,100.0 505.6,103.3 505.6,96.7" fill="#4a90d9"/>
  <text x="345.0" y="92" fill="#4a90d9" font-size="12" text-anchor="middle">commit:  t = g^r  for fresh random r</text>
  <line x1="514" y1="145" x2="176" y2="145" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="176.0,145.0 184.4,141.7 184.4,148.3" fill="#8a8a8a"/>
  <text x="345.0" y="137" fill="#8a8a8a" font-size="12" text-anchor="middle">challenge:  c  chosen at random</text>
  <line x1="176" y1="190" x2="514" y2="190" stroke="#4a90d9" stroke-width="1.4"/>
  <polygon points="514.0,190.0 505.6,193.3 505.6,186.7" fill="#4a90d9"/>
  <text x="345.0" y="182" fill="#4a90d9" font-size="12" text-anchor="middle">response:  s = r + c x</text>
  <text x="536" y="212" fill="#8a8a8a" font-size="12">accepts if g^s = t . h^c</text>
  <rect x="40" y="250" width="300" height="110" fill="none" stroke="#e0645c" stroke-width="1.7" rx="6"/>
  <text x="190" y="274" fill="#e0645c" font-size="12" text-anchor="middle">Extractor  -  why it is sound</text>
  <text x="56" y="298" fill="#8a8a8a" font-size="11">Rewind: same t, two challenges c and c'.</text>
  <text x="56" y="318" fill="#8a8a8a" font-size="11">Then x = (s - s') / (c - c').</text>
  <text x="56" y="340" fill="#e0645c" font-size="11">Anyone who answers two challenges knows x.</text>
  <rect x="360" y="250" width="300" height="110" fill="none" stroke="#4a90d9" stroke-width="1.7" rx="6"/>
  <text x="510" y="274" fill="#4a90d9" font-size="12" text-anchor="middle">Simulator  -  why it leaks nothing</text>
  <text x="376" y="298" fill="#8a8a8a" font-size="11">Pick s and c first, set t = g^s h^(-c).</text>
  <text x="376" y="318" fill="#8a8a8a" font-size="11">The transcript verifies and used no x.</text>
  <text x="376" y="340" fill="#4a90d9" font-size="11">So the transcript cannot contain any.</text>
</svg>
