<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">What a quantum computer does to each primitive: one column collapses, the other halves</text>
  <rect x="40" y="56" width="300" height="168" fill="none" stroke="#e0645c" stroke-width="1.7" rx="6"/>
  <text x="190" y="80" fill="#e0645c" text-anchor="middle">Shor  -  polynomial time</text>
  <line x1="40" y1="92" x2="340" y2="92" stroke="#e0645c" stroke-width="1.0"/>
  <text x="56" y="116" fill="#8a8a8a" font-size="12">RSA</text>
  <text x="180" y="116" fill="#8a8a8a" font-size="11">factoring</text>
  <text x="300" y="116" fill="#e0645c" font-size="12" text-anchor="end">broken</text>
  <text x="56" y="146" fill="#8a8a8a" font-size="12">finite-field DH</text>
  <text x="180" y="146" fill="#8a8a8a" font-size="11">discrete log</text>
  <text x="300" y="146" fill="#e0645c" font-size="12" text-anchor="end">broken</text>
  <text x="56" y="176" fill="#8a8a8a" font-size="12">ECDH / ECDSA</text>
  <text x="180" y="176" fill="#8a8a8a" font-size="11">elliptic-curve DLP</text>
  <text x="300" y="176" fill="#e0645c" font-size="12" text-anchor="end">broken</text>
  <text x="56" y="196" fill="#e0645c" font-size="11">No key size helps: the attack drops from</text>
  <text x="56" y="212" fill="#e0645c" font-size="11">subexponential to polynomial time.</text>
  <rect x="360" y="56" width="300" height="168" fill="none" stroke="#4a90d9" stroke-width="1.7" rx="6"/>
  <text x="510" y="80" fill="#4a90d9" text-anchor="middle">Grover  -  square-root speedup</text>
  <line x1="360" y1="92" x2="660" y2="92" stroke="#4a90d9" stroke-width="1.0"/>
  <text x="376" y="116" fill="#8a8a8a" font-size="12">AES-128</text>
  <text x="480" y="116" fill="#8a8a8a" font-size="11">key search</text>
  <text x="644" y="116" fill="#4a90d9" font-size="12" text-anchor="end">2^64 iterations</text>
  <text x="376" y="146" fill="#8a8a8a" font-size="12">AES-256</text>
  <text x="480" y="146" fill="#8a8a8a" font-size="11">key search</text>
  <text x="644" y="146" fill="#4a90d9" font-size="12" text-anchor="end">2^128 iterations</text>
  <text x="376" y="176" fill="#8a8a8a" font-size="12">SHA-256</text>
  <text x="480" y="176" fill="#8a8a8a" font-size="11">preimage</text>
  <text x="644" y="176" fill="#4a90d9" font-size="12" text-anchor="end">2^128 iterations</text>
  <text x="376" y="196" fill="#4a90d9" font-size="11">Doubling the key restores the original level,</text>
  <text x="376" y="212" fill="#4a90d9" font-size="11">and the iterations are stubbornly sequential.</text>
  <rect x="40" y="252" width="620" height="56" fill="none" stroke="#8a8a8a" stroke-width="1.6" rx="6"/>
  <text x="350" y="276" fill="#8a8a8a" text-anchor="middle">Harvest now, decrypt later</text>
  <text x="350" y="296" fill="#8a8a8a" font-size="11" text-anchor="middle">Traffic recorded today is broken the day a machine exists, so key exchange must migrate before signatures do.</text>
  <text x="40" y="340" fill="#8a8a8a" font-size="11">Signatures only need to resist a machine that exists at the moment of verification, so their deadline is later -</text>
  <text x="40" y="358" fill="#8a8a8a" font-size="11">but certificate chains and firmware signing keys have lifetimes measured in decades, which pulls the deadline back.</text>
</svg>
