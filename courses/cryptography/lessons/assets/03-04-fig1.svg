<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">ElGamal is Diffie-Hellman with one side published in advance</text>
  <rect x="50" y="62" width="180" height="44" fill="none" stroke="#4a90d9" stroke-width="1.6" rx="5"/>
  <text x="140" y="82" fill="#4a90d9" font-size="12" text-anchor="middle">Bob publishes</text>
  <text x="140" y="100" fill="#4a90d9" font-size="12" text-anchor="middle">h = g^x   (x is secret)</text>
  <rect x="50" y="150" width="180" height="64" fill="none" stroke="#e0645c" stroke-width="1.6" rx="5"/>
  <text x="140" y="170" fill="#e0645c" font-size="12" text-anchor="middle">Alice picks fresh y</text>
  <text x="140" y="188" fill="#e0645c" font-size="12" text-anchor="middle">c1 = g^y</text>
  <text x="140" y="206" fill="#e0645c" font-size="12" text-anchor="middle">mask s = h^y = g^(xy)</text>
  <line x1="140" y1="110" x2="140" y2="146" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="140.0,146.0 136.7,137.6 143.3,137.6" fill="#8a8a8a"/>
  <rect x="300" y="110" width="190" height="58" fill="none" stroke="#8a8a8a" stroke-width="1.7" rx="5"/>
  <text x="395" y="134" fill="#8a8a8a" font-size="12" text-anchor="middle">ciphertext sent</text>
  <text x="395" y="156" fill="#8a8a8a" text-anchor="middle">( c1 ,  c2 = m . s )</text>
  <line x1="234" y1="182" x2="298" y2="152" stroke="#e0645c" stroke-width="1.3"/>
  <polygon points="298.0,152.0 291.8,158.6 289.0,152.5" fill="#e0645c"/>
  <rect x="540" y="110" width="140" height="58" fill="none" stroke="#4a90d9" stroke-width="1.6" rx="5"/>
  <text x="610" y="134" fill="#4a90d9" font-size="12" text-anchor="middle">Bob recovers</text>
  <text x="610" y="156" fill="#4a90d9" font-size="12" text-anchor="middle">s = c1^x</text>
  <line x1="494" y1="139" x2="536" y2="139" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="536.0,139.0 527.6,142.3 527.6,135.7" fill="#8a8a8a"/>
  <text x="50" y="250" fill="#8a8a8a" font-size="11">The pair (c1, s) is exactly a Diffie-Hellman exchange in which Bob's contribution was posted ahead of time.</text>
  <text x="50" y="268" fill="#8a8a8a" font-size="11">Because y is fresh for every message, encryption is randomised without any padding scheme.</text>
  <text x="50" y="300" fill="#e0645c" font-size="11">Price: the ciphertext is two group elements, so it is twice the size of the message space it protects.</text>
</svg>
