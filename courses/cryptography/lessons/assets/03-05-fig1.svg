  <text x="60" y="370" fill="#8a8a8a" font-size="11">Reflecting it across the x-axis gives P + Q. When P = Q, use the tangent at P instead of the chord.</text>
  <text x="60" y="392" fill="#4a90d9" font-size="11">Over a finite field the picture is a scatter of points, but the same algebraic formulas define the same group.</text>
</svg>
