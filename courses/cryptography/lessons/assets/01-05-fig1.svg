<svg viewBox="0 0 700 415" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">One Feistel round: invertible no matter what the round function does</text>
  <text x="210" y="46" fill="#4a90d9" font-size="15" text-anchor="middle">L</text>
  <text x="222" y="46" fill="#4a90d9" font-size="11">i</text>
  <text x="470" y="46" fill="#4a90d9" font-size="15" text-anchor="middle">R</text>
  <text x="482" y="46" fill="#4a90d9" font-size="11">i</text>
  <line x1="210" y1="60" x2="210" y2="260" stroke="#8a8a8a" stroke-width="1.4"/>
  <line x1="470" y1="60" x2="470" y2="150" stroke="#8a8a8a" stroke-width="1.4"/>
  <rect x="360" y="150" width="90" height="44" fill="none" stroke="#e0645c" stroke-width="1.8" rx="5"/>
  <text x="405" y="178" fill="#e0645c" font-size="14" text-anchor="middle">F  (k  , . )</text>
  <text x="408" y="182" fill="#e0645c" font-size="10">i</text>
  <circle cx="470" cy="172" r="4" fill="#8a8a8a"/>
  <line x1="466" y1="172" x2="452" y2="172" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="452.0,172.0 460.4,168.7 460.4,175.3" fill="#8a8a8a"/>
  <circle cx="210" cy="230" r="13" fill="none" stroke="#4a90d9" stroke-width="1.6"/>
  <line x1="201" y1="230" x2="219" y2="230" stroke="#4a90d9" stroke-width="1.4"/>
  <line x1="210" y1="221" x2="210" y2="239" stroke="#4a90d9" stroke-width="1.4"/>
  <line x1="360" y1="172" x2="226" y2="218" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="226.0,218.0 232.8,212.1 235.0,218.4" fill="#e0645c"/>
  <line x1="470" y1="150" x2="470" y2="194" stroke="#8a8a8a" stroke-width="1.4"/>
  <line x1="470" y1="194" x2="470" y2="260" stroke="#8a8a8a" stroke-width="1.4"/>
  <line x1="470" y1="260" x2="210" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="210.0,300.0 217.8,295.4 218.8,302.0" fill="#8a8a8a"/>
  <line x1="210" y1="260" x2="470" y2="300" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="470.0,300.0 461.2,302.0 462.2,295.4" fill="#4a90d9"/>
  <text x="210" y="322" fill="#8a8a8a" font-size="15" text-anchor="middle">L</text>
  <text x="224" y="322" fill="#8a8a8a" font-size="11">i+1</text>
  <text x="470" y="322" fill="#4a90d9" font-size="15" text-anchor="middle">R</text>
  <text x="484" y="322" fill="#4a90d9" font-size="11">i+1</text>
  <text x="50" y="356" fill="#8a8a8a" font-size="12">Forward:  L(i+1) = R(i)   and   R(i+1) = L(i) XOR F(k, R(i)).</text>
  <text x="50" y="376" fill="#8a8a8a" font-size="12">Inverse:  R(i) = L(i+1),   then   L(i) = R(i+1) XOR F(k, L(i+1)).</text>
  <text x="50" y="402" fill="#e0645c" font-size="12">F is never inverted, so it may be any function at all - that is the whole trick.</text>
</svg>
