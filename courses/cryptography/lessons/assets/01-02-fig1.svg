<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Every ciphertext is reachable from every message, by exactly one key</text>
  <text x="156" y="171.2" fill="#8a8a8a" font-size="12" text-anchor="end">message m</text>
  <text x="210.0" y="60" fill="#8a8a8a" font-size="12" text-anchor="middle">k = 00</text>
  <text x="290.0" y="60" fill="#8a8a8a" font-size="12" text-anchor="middle">k = 01</text>
  <text x="370.0" y="60" fill="#8a8a8a" font-size="12" text-anchor="middle">k = 10</text>
  <text x="450.0" y="60" fill="#8a8a8a" font-size="12" text-anchor="middle">k = 11</text>
  <text x="330" y="38" fill="#8a8a8a" font-size="12" text-anchor="middle">key k (uniform, 4 equally likely)</text>
  <text x="156" y="98.0" fill="#8a8a8a" text-anchor="end">00</text>
  <rect x="170" y="70" width="80" height="46" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="210.0" y="98.0" fill="#4a90d9" font-size="14" text-anchor="middle">00</text>
  <rect x="250" y="70" width="80" height="46" fill="none" stroke="#e0645c" stroke-width="2.0"/>
  <text x="290.0" y="98.0" fill="#e0645c" font-size="14" text-anchor="middle">01</text>
  <rect x="330" y="70" width="80" height="46" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="370.0" y="98.0" fill="#4a90d9" font-size="14" text-anchor="middle">10</text>
  <rect x="410" y="70" width="80" height="46" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="450.0" y="98.0" fill="#4a90d9" font-size="14" text-anchor="middle">11</text>
  <text x="156" y="144.0" fill="#8a8a8a" text-anchor="end">01</text>
  <rect x="170" y="116" width="80" height="46" fill="none" stroke="#e0645c" stroke-width="2.0"/>
  <text x="210.0" y="144.0" fill="#e0645c" font-size="14" text-anchor="middle">01</text>
  <rect x="250" y="116" width="80" height="46" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="290.0" y="144.0" fill="#4a90d9" font-size="14" text-anchor="middle">00</text>
  <rect x="330" y="116" width="80" height="46" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="370.0" y="144.0" fill="#4a90d9" font-size="14" text-anchor="middle">11</text>
  <rect x="410" y="116" width="80" height="46" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="450.0" y="144.0" fill="#4a90d9" font-size="14" text-anchor="middle">10</text>
  <text x="156" y="190.0" fill="#8a8a8a" text-anchor="end">10</text>
  <rect x="170" y="162" width="80" height="46" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="210.0" y="190.0" fill="#4a90d9" font-size="14" text-anchor="middle">10</text>
  <rect x="250" y="162" width="80" height="46" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="290.0" y="190.0" fill="#4a90d9" font-size="14" text-anchor="middle">11</text>
  <rect x="330" y="162" width="80" height="46" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="370.0" y="190.0" fill="#4a90d9" font-size="14" text-anchor="middle">00</text>
  <rect x="410" y="162" width="80" height="46" fill="none" stroke="#e0645c" stroke-width="2.0"/>
  <text x="450.0" y="190.0" fill="#e0645c" font-size="14" text-anchor="middle">01</text>
  <text x="156" y="236.0" fill="#8a8a8a" text-anchor="end">11</text>
  <rect x="170" y="208" width="80" height="46" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="210.0" y="236.0" fill="#4a90d9" font-size="14" text-anchor="middle">11</text>
  <rect x="250" y="208" width="80" height="46" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="290.0" y="236.0" fill="#4a90d9" font-size="14" text-anchor="middle">10</text>
  <rect x="330" y="208" width="80" height="46" fill="none" stroke="#e0645c" stroke-width="2.0"/>
  <text x="370.0" y="236.0" fill="#e0645c" font-size="14" text-anchor="middle">01</text>
  <rect x="410" y="208" width="80" height="46" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <text x="450.0" y="236.0" fill="#4a90d9" font-size="14" text-anchor="middle">00</text>
  <text x="170" y="282" fill="#8a8a8a" font-size="11">Row 'm' is a permutation of all four ciphertexts, so each is hit with probability 1/4 - the same 1/4 in every row.</text>
  <text x="170" y="300" fill="#e0645c" font-size="11">Seeing c = 01 (highlighted) is therefore equally likely under all four messages, and tells you nothing.</text>
</svg>
