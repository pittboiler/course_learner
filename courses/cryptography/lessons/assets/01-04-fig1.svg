<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">The distinguishing experiment: one string, two possible worlds, one guess</text>
  <rect x="60" y="60" width="240" height="80" fill="none" stroke="#4a90d9" stroke-width="1.6" rx="6"/>
  <text x="180" y="86" fill="#4a90d9" font-size="12" text-anchor="middle">World 0  (pseudorandom)</text>
  <text x="180" y="110" fill="#4a90d9" font-size="12" text-anchor="middle">s uniform in n bits,</text>
  <text x="180" y="128" fill="#4a90d9" font-size="12" text-anchor="middle">output y = G(s)</text>
  <rect x="60" y="170" width="240" height="80" fill="none" stroke="#e0645c" stroke-width="1.6" rx="6"/>
  <text x="180" y="196" fill="#e0645c" font-size="12" text-anchor="middle">World 1  (truly random)</text>
  <text x="180" y="220" fill="#e0645c" font-size="12" text-anchor="middle">y uniform in L bits</text>
  <text x="180" y="238" fill="#e0645c" font-size="12" text-anchor="middle">no seed at all</text>
  <line x1="304" y1="100" x2="400" y2="140" stroke="#4a90d9" stroke-width="1.4"/>
  <polygon points="400.0,140.0 391.0,139.9 393.6,133.7" fill="#4a90d9"/>
  <line x1="304" y1="210" x2="400" y2="166" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="400.0,166.0 393.8,172.5 391.0,166.4" fill="#e0645c"/>
  <text x="352" y="120" fill="#4a90d9" font-size="12">y</text>
  <text x="352" y="204" fill="#e0645c" font-size="12">y</text>
  <rect x="404" y="118" width="120" height="70" fill="none" stroke="#8a8a8a" stroke-width="1.8" rx="6"/>
  <text x="464" y="146" fill="#8a8a8a" font-size="12" text-anchor="middle">distinguisher</text>
  <text x="464" y="166" fill="#8a8a8a" font-size="12" text-anchor="middle">D  (efficient)</text>
  <line x1="528" y1="153" x2="600" y2="153" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="600.0,153.0 591.6,156.3 591.6,149.7" fill="#8a8a8a"/>
  <text x="608" y="157" fill="#8a8a8a">0 or 1</text>
  <text x="40" y="278" fill="#8a8a8a" font-size="11">Advantage = | Pr(D says 1 in world 0) - Pr(D says 1 in world 1) |. G is a PRG when no efficient D drives this above negligible.</text>
</svg>
