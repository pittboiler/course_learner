<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="24" y="22" fill="#8a8a8a" font-style="italic">Pellet &#8594; rod &#8594; assembly: each level a containment barrier, sized by heat and neutronics.</text>

  <!-- ===== panel 1: the pellet ===== -->
  <ellipse cx="78" cy="150" rx="26" ry="8" fill="#4a90d9" opacity="0.25" stroke="#4a90d9" stroke-width="1.5"/>
  <path d="M 52 150 L 52 196 A 26 8 0 0 0 104 196 L 104 150" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="1.5"/>
  <path d="M 52 150 A 26 8 0 0 0 104 150" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="78" y="230" fill="#4a90d9" text-anchor="middle">UO&#8322; pellet</text>
  <text x="78" y="248" fill="#8a8a8a" text-anchor="middle" font-size="11">sintered ceramic</text>
  <text x="78" y="263" fill="#8a8a8a" text-anchor="middle" font-size="11">~1 cm, ~2865 &#176;C mp</text>

  <!-- arrow 1 -->
  <line x1="120" y1="175" x2="168" y2="175" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="168,175 158,170 158,180" fill="#8a8a8a"/>
  <text x="144" y="166" fill="#8a8a8a" text-anchor="middle" font-size="11">stack</text>

  <!-- ===== panel 2: the fuel rod ===== -->
  <!-- cladding tube -->
  <rect x="196" y="52" width="40" height="256" rx="6" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <!-- plenum region -->
  <rect x="201" y="58" width="30" height="52" fill="none" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <!-- plenum spring -->
  <path d="M 216 62 L 208 68 L 224 74 L 208 80 L 224 86 L 208 92 L 224 98 L 216 104" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <!-- pellet stack -->
  <rect x="201" y="112" width="30" height="192" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="1.5"/>
  <line x1="201" y1="136" x2="231" y2="136" stroke="#4a90d9" stroke-width="0.8"/>
  <line x1="201" y1="160" x2="231" y2="160" stroke="#4a90d9" stroke-width="0.8"/>
  <line x1="201" y1="184" x2="231" y2="184" stroke="#4a90d9" stroke-width="0.8"/>
  <line x1="201" y1="208" x2="231" y2="208" stroke="#4a90d9" stroke-width="0.8"/>
  <line x1="201" y1="232" x2="231" y2="232" stroke="#4a90d9" stroke-width="0.8"/>
  <line x1="201" y1="256" x2="231" y2="256" stroke="#4a90d9" stroke-width="0.8"/>
  <line x1="201" y1="280" x2="231" y2="280" stroke="#4a90d9" stroke-width="0.8"/>

  <!-- plenum label -->
  <line x1="196" y1="84" x2="150" y2="84" stroke="#e0645c" stroke-width="1"/>
  <text x="146" y="80" fill="#e0645c" text-anchor="end" font-size="11">plenum</text>
  <text x="146" y="94" fill="#8a8a8a" text-anchor="end" font-size="10">(Xe, Kr gas)</text>
  <!-- cladding label -->
  <line x1="236" y1="130" x2="284" y2="130" stroke="#8a8a8a" stroke-width="1"/>
  <text x="288" y="127" fill="#8a8a8a" font-size="11">cladding</text>
  <text x="288" y="141" fill="#8a8a8a" font-size="10">(Zr alloy)</text>
  <text x="288" y="155" fill="#8a8a8a" font-size="10">= barrier 1</text>
  <!-- stack label -->
  <line x1="236" y1="220" x2="284" y2="220" stroke="#4a90d9" stroke-width="1"/>
  <text x="288" y="217" fill="#4a90d9" font-size="11">pellet stack</text>
  <text x="288" y="231" fill="#8a8a8a" font-size="10">~4 m active</text>
  <text x="216" y="330" fill="#4a90d9" text-anchor="middle">fuel rod</text>

  <!-- arrow 2 -->
  <line x1="400" y1="175" x2="448" y2="175" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="448,175 438,170 438,180" fill="#8a8a8a"/>
  <text x="424" y="166" fill="#8a8a8a" text-anchor="middle" font-size="11">bundle</text>

  <!-- ===== panel 3: the assembly ===== -->
  <rect x="470" y="78" width="180" height="180" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- 9x9 lattice of rods -->
  <g fill="#4a90d9" opacity="0.5">
    <circle cx="490" cy="98" r="4.5"/><circle cx="510" cy="98" r="4.5"/><circle cx="530" cy="98" r="4.5"/><circle cx="550" cy="98" r="4.5"/><circle cx="570" cy="98" r="4.5"/><circle cx="590" cy="98" r="4.5"/><circle cx="610" cy="98" r="4.5"/><circle cx="630" cy="98" r="4.5"/>
    <circle cx="490" cy="118" r="4.5"/><circle cx="510" cy="118" r="4.5"/><circle cx="530" cy="118" r="4.5"/><circle cx="550" cy="118" r="4.5"/><circle cx="570" cy="118" r="4.5"/><circle cx="590" cy="118" r="4.5"/><circle cx="610" cy="118" r="4.5"/><circle cx="630" cy="118" r="4.5"/>
    <circle cx="490" cy="138" r="4.5"/><circle cx="510" cy="138" r="4.5"/><circle cx="530" cy="138" r="4.5"/><circle cx="570" cy="138" r="4.5"/><circle cx="590" cy="138" r="4.5"/><circle cx="610" cy="138" r="4.5"/><circle cx="630" cy="138" r="4.5"/>
    <circle cx="490" cy="158" r="4.5"/><circle cx="510" cy="158" r="4.5"/><circle cx="530" cy="158" r="4.5"/><circle cx="550" cy="158" r="4.5"/><circle cx="570" cy="158" r="4.5"/><circle cx="590" cy="158" r="4.5"/><circle cx="610" cy="158" r="4.5"/><circle cx="630" cy="158" r="4.5"/>
    <circle cx="490" cy="178" r="4.5"/><circle cx="510" cy="178" r="4.5"/><circle cx="530" cy="178" r="4.5"/><circle cx="550" cy="178" r="4.5"/><circle cx="570" cy="178" r="4.5"/><circle cx="590" cy="178" r="4.5"/><circle cx="610" cy="178" r="4.5"/><circle cx="630" cy="178" r="4.5"/>
    <circle cx="490" cy="198" r="4.5"/><circle cx="510" cy="198" r="4.5"/><circle cx="530" cy="198" r="4.5"/><circle cx="570" cy="198" r="4.5"/><circle cx="590" cy="198" r="4.5"/><circle cx="610" cy="198" r="4.5"/><circle cx="630" cy="198" r="4.5"/>
    <circle cx="490" cy="218" r="4.5"/><circle cx="510" cy="218" r="4.5"/><circle cx="530" cy="218" r="4.5"/><circle cx="550" cy="218" r="4.5"/><circle cx="570" cy="218" r="4.5"/><circle cx="590" cy="218" r="4.5"/><circle cx="610" cy="218" r="4.5"/><circle cx="630" cy="218" r="4.5"/>
    <circle cx="490" cy="238" r="4.5"/><circle cx="510" cy="238" r="4.5"/><circle cx="530" cy="238" r="4.5"/><circle cx="550" cy="238" r="4.5"/><circle cx="570" cy="238" r="4.5"/><circle cx="590" cy="238" r="4.5"/><circle cx="610" cy="238" r="4.5"/><circle cx="630" cy="238" r="4.5"/>
  </g>
  <!-- guide tubes (coral) at the two gaps -->
  <circle cx="550" cy="138" r="5.5" fill="none" stroke="#e0645c" stroke-width="1.6"/>
  <circle cx="550" cy="198" r="5.5" fill="none" stroke="#e0645c" stroke-width="1.6"/>
  <!-- pin pitch marker -->
  <line x1="490" y1="266" x2="510" y2="266" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="490,266 496,263 496,269" fill="#e0645c"/>
  <polygon points="510,266 504,263 504,269" fill="#e0645c"/>
  <text x="520" y="270" fill="#e0645c" font-size="10">pin pitch</text>
  <text x="560" y="292" fill="#8a8a8a" text-anchor="middle">assembly (PWR ~17&#215;17)</text>
  <text x="560" y="308" fill="#8a8a8a" text-anchor="middle" font-size="10">coral = guide/control tubes</text>
</svg>
