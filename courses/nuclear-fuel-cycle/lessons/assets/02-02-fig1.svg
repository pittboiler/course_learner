<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Fuel excess (blue) falls as fuel burns; poison worth (coral) is withdrawn to match, so the net stays at zero &#8212; until refueling at EOC.</text>

  <!-- axes -->
  <line x1="70" y1="300" x2="70" y2="72" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,72 65,82 75,82" fill="#8a8a8a"/>
  <text transform="rotate(-90 26 190)" x="26" y="190" fill="#8a8a8a">reactivity</text>

  <!-- zero / critical line -->
  <line x1="70" y1="180" x2="612" y2="180" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="612,180 602,175 602,185" fill="#8a8a8a"/>
  <text x="500" y="176" fill="#8a8a8a">burnup / cycle time</text>
  <text x="360" y="172" fill="#8a8a8a" font-style="italic">net &#961; = 0  (critical all cycle)</text>

  <!-- EOC marker -->
  <line x1="560" y1="96" x2="560" y2="290" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="60" y="322" fill="#8a8a8a">BOC</text>
  <text x="522" y="322" fill="#8a8a8a">EOC (refuel)</text>

  <!-- blue: fuel excess reactivity (positive, declining) -->
  <path d="M 70 90 L 130 102 L 190 116 L 250 131 L 310 146 L 370 159 L 430 169 L 490 176 L 560 180"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="88" y="86" fill="#4a90d9">fuel excess &#961;(t) &#8212; fuel depletes, poisons build</text>

  <!-- coral: negative poison worth (mirror, magnitude declining) -->
  <path d="M 70 270 L 130 258 L 190 244 L 250 229 L 310 214 L 370 201 L 430 191 L 490 184 L 560 180"
        fill="none" stroke="#e0645c" stroke-width="3"/>
  <text x="88" y="292" fill="#e0645c">poison worth held down (rods + boron + burnable)</text>

  <!-- withdrawal arrows: poison pulled toward zero -->
  <line x1="250" y1="229" x2="250" y2="196" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="2 3"/>
  <polygon points="250,196 246,205 254,205" fill="#e0645c"/>
  <line x1="430" y1="191" x2="430" y2="184" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="2 3"/>
  <polygon points="430,182 426,190 434,190" fill="#e0645c"/>
  <text x="256" y="216" fill="#e0645c" font-size="12">withdrawn</text>
</svg>
