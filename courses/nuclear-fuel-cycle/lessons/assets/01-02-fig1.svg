<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Nearly all the rock in equals tailings out; a fraction R of the uranium leaves as yellowcake.</text>

  <!-- ===== main uranium flow (left to right) ===== -->

  <!-- Box: Ore -->
  <rect x="16" y="70" width="104" height="54" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="68" y="92" fill="#8a8a8a" text-anchor="middle">Ore</text>
  <text x="68" y="110" fill="#8a8a8a" text-anchor="middle" font-size="11">grade x% U</text>

  <!-- arrow Ore -> Leach -->
  <line x1="120" y1="97" x2="150" y2="97" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="150,97 140,92 140,102" fill="#4a90d9"/>

  <!-- Box: Crush + leach -->
  <rect x="152" y="70" width="104" height="54" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="204" y="92" fill="#8a8a8a" text-anchor="middle">Crush +</text>
  <text x="204" y="110" fill="#8a8a8a" text-anchor="middle">leach</text>

  <!-- arrow Leach -> Concentrate (recovery R) -->
  <line x1="256" y1="97" x2="300" y2="97" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="300,97 290,92 290,102" fill="#4a90d9"/>
  <text x="278" y="86" fill="#4a90d9" text-anchor="middle" font-size="11">&#215;&#160;R</text>

  <!-- Box: Concentrate / dry -->
  <rect x="302" y="70" width="104" height="54" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="354" y="92" fill="#8a8a8a" text-anchor="middle">Concentrate</text>
  <text x="354" y="110" fill="#8a8a8a" text-anchor="middle">+ dry</text>

  <!-- arrow Concentrate -> Yellowcake -->
  <line x1="406" y1="97" x2="446" y2="97" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="446,97 436,92 436,102" fill="#4a90d9"/>

  <!-- Box: U3O8 yellowcake (product) -->
  <rect x="448" y="66" width="176" height="62" rx="4" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="536" y="92" fill="#4a90d9" text-anchor="middle" font-size="15">U&#8323;O&#8328; yellowcake</text>
  <text x="536" y="112" fill="#4a90d9" text-anchor="middle" font-size="11">&#8776; 85% U by mass</text>

  <!-- ===== tailings branch (drops from leach) ===== -->
  <line x1="204" y1="124" x2="204" y2="196" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="204,196 199,186 209,186" fill="#e0645c"/>
  <text x="214" y="164" fill="#e0645c" font-size="11">(1 &#8722; R) U</text>
  <text x="214" y="180" fill="#e0645c" font-size="11">+ all the rock</text>

  <!-- Box: Tailings -->
  <rect x="80" y="198" width="248" height="62" rx="4" fill="#e0645c" opacity="0.12" stroke="#e0645c" stroke-width="2"/>
  <text x="204" y="224" fill="#e0645c" text-anchor="middle" font-size="15">Tailings</text>
  <text x="204" y="244" fill="#e0645c" text-anchor="middle" font-size="11">radon-emitting sand: Ra-226, Th-230</text>
</svg>
