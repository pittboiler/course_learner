<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Each thermal pass burns the fissile isotopes and piles up the even ones &#8212; the vector climbs the wall.</text>

  <!-- y-axis -->
  <line x1="90" y1="60" x2="90" y2="280" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="90" y1="280" x2="580" y2="280" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="52" y="64" fill="#8a8a8a">100%</text>
  <text x="60" y="174" fill="#8a8a8a">50%</text>
  <text x="70" y="284" fill="#8a8a8a">0</text>
  <text x="30" y="175" fill="#8a8a8a" transform="rotate(-90 30 175)">Pu vector composition</text>

  <!-- fissile floor -->
  <line x1="90" y1="170" x2="580" y2="170" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- Gen 0: fissile 65 / even 35 -->
  <rect x="133" y="137" width="84" height="143" fill="#4a90d9" opacity="0.35" stroke="#4a90d9" stroke-width="1.5"/>
  <rect x="133" y="60" width="84" height="77" fill="#e0645c" opacity="0.35" stroke="#e0645c" stroke-width="1.5"/>
  <text x="150" y="215" fill="#4a90d9">65% fis</text>
  <text x="175" y="303" fill="#8a8a8a" text-anchor="middle">UOX Pu (gen 0)</text>

  <!-- Gen 1: fissile 48 / even 52 -->
  <rect x="288" y="174" width="84" height="106" fill="#4a90d9" opacity="0.35" stroke="#4a90d9" stroke-width="1.5"/>
  <rect x="288" y="60" width="84" height="114" fill="#e0645c" opacity="0.35" stroke="#e0645c" stroke-width="1.5"/>
  <text x="305" y="233" fill="#4a90d9">48% fis</text>
  <text x="330" y="303" fill="#8a8a8a" text-anchor="middle">MOX Pu, 1 pass</text>

  <!-- Gen 2: fissile 35 / even 65 -->
  <rect x="443" y="203" width="84" height="77" fill="#4a90d9" opacity="0.35" stroke="#4a90d9" stroke-width="1.5"/>
  <rect x="443" y="60" width="84" height="143" fill="#e0645c" opacity="0.35" stroke="#e0645c" stroke-width="1.5"/>
  <text x="460" y="248" fill="#4a90d9">35% fis</text>
  <text x="485" y="303" fill="#8a8a8a" text-anchor="middle">would-be 2nd pass</text>

  <!-- mono-recycle wall -->
  <line x1="408" y1="60" x2="408" y2="280" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="415" y="76" fill="#e0645c">mono-recycle wall</text>
  <text x="415" y="92" fill="#e0645c">(thermal reactors)</text>

  <!-- fissile-fraction trend arrow -->
  <path d="M 175 128 C 250 150 330 168 460 196" fill="none" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="2 3"/>
  <polygon points="460,196 450,192 453,201" fill="#4a90d9"/>
  <text x="360" y="130" fill="#4a90d9">fissile fraction falls</text>

  <!-- legend -->
  <rect x="470" y="24" width="12" height="12" fill="#4a90d9" opacity="0.35" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="488" y="34" fill="#8a8a8a">fissile: Pu-239 + Pu-241</text>
  <rect x="470" y="40" width="12" height="12" fill="#e0645c" opacity="0.35" stroke="#e0645c" stroke-width="1.5"/>
  <text x="488" y="50" fill="#8a8a8a">even + Am: Pu-240, 242, Am-241</text>
</svg>
