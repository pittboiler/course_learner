<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="24" y="22" fill="#8a8a8a" font-style="italic">Fast core burns Pu-239; spare neutrons breed fertile U-238 into fresh Pu-239 in the blanket &#8212; out comes more fissile than went in.</text>

  <!-- ===== CORE ===== -->
  <rect x="48" y="70" width="150" height="120" rx="6" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="123" y="98" fill="#4a90d9" text-anchor="middle" font-weight="bold">CORE</text>
  <text x="123" y="120" fill="#4a90d9" text-anchor="middle">Pu-239 fissions</text>
  <text x="123" y="138" fill="#4a90d9" text-anchor="middle">(fast neutrons,</text>
  <text x="123" y="156" fill="#4a90d9" text-anchor="middle">no moderator)</text>
  <text x="123" y="180" fill="#4a90d9" text-anchor="middle" font-style="italic">&#951; &#8776; 2.45 n / fission</text>

  <!-- self-sustain loop (1 neutron back to core) -->
  <path d="M 123 70 C 90 34 156 34 130 66" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="130,66 122,58 136,56" fill="#4a90d9"/>
  <text x="123" y="30" fill="#4a90d9" text-anchor="middle">1 n &#8594; sustains chain</text>

  <!-- spare neutrons: core -> blanket -->
  <line x1="198" y1="118" x2="428" y2="118" stroke="#e0645c" stroke-width="2"/>
  <polygon points="428,118 418,113 418,123" fill="#e0645c"/>
  <text x="313" y="108" fill="#e0645c" text-anchor="middle">spare neutrons (&#951; &#8722; 1 &#8722; losses)</text>

  <!-- ===== BLANKET ===== -->
  <rect x="428" y="70" width="164" height="120" rx="6" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="510" y="98" fill="#8a8a8a" text-anchor="middle" font-weight="bold">BLANKET</text>
  <text x="510" y="120" fill="#8a8a8a" text-anchor="middle">U-238 (fertile,</text>
  <text x="510" y="138" fill="#8a8a8a" text-anchor="middle">otherwise waste)</text>
  <text x="510" y="162" fill="#8a8a8a" text-anchor="middle">captures neutrons</text>
  <text x="510" y="180" fill="#8a8a8a" text-anchor="middle">&#8594; breeds new fuel</text>

  <!-- net new Pu-239 returns to core -->
  <path d="M 428 172 C 300 250 250 250 123 196" fill="none" stroke="#e0645c" stroke-width="2"/>
  <polygon points="123,196 133,193 131,203" fill="#e0645c"/>
  <text x="276" y="242" fill="#e0645c" text-anchor="middle">net new Pu-239 &#8594; refuels core (BR &#62; 1)</text>

  <!-- ===== breeding chain ===== -->
  <text x="24" y="292" fill="#8a8a8a" font-style="italic">The breeding chain (one fertile capture, two beta decays):</text>

  <!-- U-238 -->
  <rect x="40" y="306" width="86" height="34" rx="5" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="83" y="328" fill="#8a8a8a" text-anchor="middle">U-238</text>
  <!-- arrow (n,gamma) -->
  <line x1="126" y1="323" x2="188" y2="323" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="188,323 178,318 178,328" fill="#4a90d9"/>
  <text x="157" y="314" fill="#4a90d9" text-anchor="middle">(n,&#947;)</text>

  <!-- U-239 -->
  <rect x="188" y="306" width="86" height="34" rx="5" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="231" y="328" fill="#8a8a8a" text-anchor="middle">U-239</text>
  <!-- arrow beta -->
  <line x1="274" y1="323" x2="336" y2="323" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="336,323 326,318 326,328" fill="#4a90d9"/>
  <text x="305" y="314" fill="#4a90d9" text-anchor="middle">&#946;&#8722; (23 min)</text>

  <!-- Np-239 -->
  <rect x="336" y="306" width="86" height="34" rx="5" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="379" y="328" fill="#8a8a8a" text-anchor="middle">Np-239</text>
  <!-- arrow beta -->
  <line x1="422" y1="323" x2="484" y2="323" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="484,323 474,318 474,328" fill="#4a90d9"/>
  <text x="453" y="314" fill="#4a90d9" text-anchor="middle">&#946;&#8722; (2.4 d)</text>

  <!-- Pu-239 -->
  <rect x="484" y="306" width="94" height="34" rx="5" fill="#e0645c" opacity="0.18" stroke="#e0645c" stroke-width="2"/>
  <text x="531" y="328" fill="#e0645c" text-anchor="middle" font-weight="bold">Pu-239</text>
  <text x="531" y="356" fill="#e0645c" text-anchor="middle">new fissile fuel</text>

  <!-- ===== BR bar ===== -->
  <text x="24" y="394" fill="#8a8a8a">Per fissile atom burned:</text>
  <!-- consumed = 1.0 -->
  <line x1="196" y1="390" x2="296" y2="390" stroke="#8a8a8a" stroke-width="8"/>
  <text x="246" y="410" fill="#8a8a8a" text-anchor="middle">consumed 1.0</text>
  <!-- produced = 1.2 -->
  <line x1="330" y1="390" x2="450" y2="390" stroke="#4a90d9" stroke-width="8"/>
  <line x1="450" y1="390" x2="470" y2="390" stroke="#e0645c" stroke-width="8"/>
  <text x="400" y="410" fill="#4a90d9" text-anchor="middle">produced 1.2</text>
  <text x="530" y="394" fill="#e0645c">+0.2 net gain</text>
</svg>
