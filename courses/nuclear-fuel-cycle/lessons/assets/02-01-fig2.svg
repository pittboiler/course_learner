<svg viewBox="0 0 580 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="24" y="22" fill="#8a8a8a" font-style="italic">Heat is made everywhere in the pellet but leaves only at the surface &#8212; so the centerline runs hottest.</text>

  <!-- axes -->
  <line x1="70" y1="290" x2="70" y2="50" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,50 65,60 75,60" fill="#8a8a8a"/>
  <text x="60" y="60" fill="#8a8a8a" text-anchor="end">T</text>
  <line x1="70" y1="290" x2="500" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="500,290 490,285 490,295" fill="#8a8a8a"/>
  <text x="498" y="308" fill="#8a8a8a" text-anchor="end">radius r</text>
  <text x="70" y="308" fill="#8a8a8a" text-anchor="middle" font-size="11">centerline</text>

  <!-- melt-limit line -->
  <line x1="70" y1="58" x2="470" y2="58" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="466" y="52" fill="#8a8a8a" text-anchor="end" font-size="11">UO&#8322; centerline-melt limit (~2865 &#176;C)</text>

  <!-- fuel temperature parabola (coral) -->
  <polyline points="70,84 122,88.8 174,103.2 226,127.2 278,160.8 330,204" fill="none" stroke="#e0645c" stroke-width="3"/>
  <!-- gap + clad + coolant drop (blue) -->
  <polyline points="330,204 352,232 378,244 378,244 420,262 470,268" fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- region dividers -->
  <line x1="330" y1="290" x2="330" y2="204" stroke="#8a8a8a" stroke-width="0.7" stroke-dasharray="2 3"/>
  <line x1="378" y1="290" x2="378" y2="244" stroke="#8a8a8a" stroke-width="0.7" stroke-dasharray="2 3"/>
  <text x="200" y="284" fill="#8a8a8a" text-anchor="middle" font-size="11">fuel pellet</text>
  <text x="354" y="284" fill="#8a8a8a" text-anchor="middle" font-size="10">gap</text>
  <text x="424" y="284" fill="#8a8a8a" text-anchor="middle" font-size="11">clad + coolant</text>

  <!-- centerline temperature marker -->
  <circle cx="70" cy="84" r="3.5" fill="#e0645c"/>
  <text x="82" y="84" fill="#e0645c" font-size="11">T&#8320; (centerline, hottest)</text>

  <!-- margin double-arrow between peak and melt line -->
  <line x1="70" y1="60" x2="70" y2="82" stroke="#8a8a8a" stroke-width="0"/>
  <line x1="46" y1="60" x2="46" y2="82" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="46,60 42,68 50,68" fill="#8a8a8a"/>
  <polygon points="46,82 42,74 50,74" fill="#8a8a8a"/>
  <text x="40" y="76" fill="#8a8a8a" text-anchor="end" font-size="10">margin</text>

  <!-- surface + coolant markers -->
  <circle cx="330" cy="204" r="3" fill="#4a90d9"/>
  <text x="330" y="196" fill="#4a90d9" text-anchor="middle" font-size="10">surface</text>
  <circle cx="470" cy="268" r="3" fill="#4a90d9"/>
  <text x="470" y="260" fill="#4a90d9" text-anchor="middle" font-size="10">coolant</text>

  <!-- note: raise q' -> whole curve lifts -->
  <text x="120" y="128" fill="#e0645c" font-size="11">higher q&#8242; lifts the whole curve</text>
</svg>
