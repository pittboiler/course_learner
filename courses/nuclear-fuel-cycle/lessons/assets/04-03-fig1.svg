<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/>
    </marker>
    <marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a90d9"/>
    </marker>
  </defs>

  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Coral nodes are proliferation-sensitive: where &#8805;1 SQ of weapons-usable material can appear.</text>

  <!-- ===== top row: the once-through spine ===== -->
  <rect x="30"  y="80" width="110" height="42" rx="5" fill="#4a90d9" opacity="0.14" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="85"  y="106" fill="#8a8a8a" text-anchor="middle">Mine &#38; Mill</text>

  <rect x="160" y="80" width="110" height="42" rx="5" fill="#4a90d9" opacity="0.14" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="215" y="106" fill="#8a8a8a" text-anchor="middle">Convert</text>

  <rect x="290" y="80" width="110" height="42" rx="5" fill="#e0645c" opacity="0.18" stroke="#e0645c" stroke-width="2"/>
  <text x="345" y="106" fill="#e0645c" text-anchor="middle">Enrich</text>
  <text x="345" y="140" fill="#e0645c" text-anchor="middle" font-size="11">push to &#8776;90&#37; &#8594; HEU</text>

  <rect x="420" y="80" width="110" height="42" rx="5" fill="#4a90d9" opacity="0.14" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="475" y="106" fill="#8a8a8a" text-anchor="middle">Fabricate</text>

  <rect x="550" y="80" width="110" height="42" rx="5" fill="#4a90d9" opacity="0.14" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="605" y="106" fill="#8a8a8a" text-anchor="middle">Reactor</text>

  <!-- top-row arrows -->
  <line x1="140" y1="101" x2="158" y2="101" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="270" y1="101" x2="288" y2="101" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="400" y1="101" x2="418" y2="101" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="530" y1="101" x2="548" y2="101" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- ===== bottom row: the two back-end forks ===== -->
  <rect x="340" y="238" width="120" height="42" rx="5" fill="#e0645c" opacity="0.18" stroke="#e0645c" stroke-width="2"/>
  <text x="400" y="264" fill="#e0645c" text-anchor="middle">Reprocess</text>
  <text x="400" y="300" fill="#e0645c" text-anchor="middle" font-size="11">separated Pu</text>

  <rect x="520" y="238" width="120" height="42" rx="5" fill="#4a90d9" opacity="0.14" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="580" y="264" fill="#8a8a8a" text-anchor="middle">Repository</text>

  <!-- reactor -> repository (once-through) -->
  <line x1="612" y1="122" x2="585" y2="236" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="628" y="185" fill="#8a8a8a" font-size="11">once-through</text>

  <!-- reactor -> reprocess (closed) -->
  <line x1="560" y1="122" x2="430" y2="236" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- reprocess -> fabricate (recycle loop, dashed blue) -->
  <line x1="388" y1="238" x2="462" y2="124" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ahb)"/>
  <text x="300" y="200" fill="#4a90d9" font-size="11">recycle (closed cycle)</text>
</svg>
