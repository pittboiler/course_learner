<text x="104.8" y="170" text-anchor="middle" fill="#8a8a8a" font-size="11">AD 1</text>
<line x1="188.0" y1="145" x2="188.0" y2="155" stroke="#8a8a8a"/>
<text x="188.0" y="170" text-anchor="middle" fill="#8a8a8a" font-size="11">10</text>
<line x1="280.5" y1="145" x2="280.5" y2="155" stroke="#8a8a8a"/>
<text x="280.5" y="170" text-anchor="middle" fill="#8a8a8a" font-size="11">20</text>
<line x1="373.0" y1="145" x2="373.0" y2="155" stroke="#8a8a8a"/>
<text x="373.0" y="170" text-anchor="middle" fill="#8a8a8a" font-size="11">30</text>
<line x1="465.5" y1="145" x2="465.5" y2="155" stroke="#8a8a8a"/>
<text x="465.5" y="170" text-anchor="middle" fill="#8a8a8a" font-size="11">40</text>
<line x1="558.0" y1="145" x2="558.0" y2="155" stroke="#8a8a8a"/>
<text x="558.0" y="170" text-anchor="middle" fill="#8a8a8a" font-size="11">50</text>
<line x1="650.5" y1="145" x2="650.5" y2="155" stroke="#8a8a8a"/>
<text x="650.5" y="170" text-anchor="middle" fill="#8a8a8a" font-size="11">60</text>
<line x1="743.0" y1="145" x2="743.0" y2="155" stroke="#8a8a8a"/>
<text x="743.0" y="170" text-anchor="middle" fill="#8a8a8a" font-size="11">70</text>
<rect x="336.0" y="132" width="92.5" height="8" fill="#e0645c" opacity="0.8"/>
<text x="329" y="140" text-anchor="end" fill="#e0645c">Pilate prefect, 26&#8211;36</text>
<rect x="706.0" y="132" width="64.8" height="8" fill="#e0645c" opacity="0.8"/>
<text x="770.8" y="212" text-anchor="end" fill="#e0645c">Revolt 66&#8211;70 (Masada 73 or 74)</text>
<rect x="67.8" y="188" width="388.5" height="8" fill="#e0645c" opacity="0.8"/>
<text x="262.0" y="210" text-anchor="middle" fill="#e0645c">Antipas tetrarch of Galilee, 4 BC&#8211;AD 39</text>
<line x1="67.8" y1="64" x2="67.8" y2="150" stroke="#4a90d9" stroke-dasharray="3 3"/>
<circle cx="67.8" cy="150" r="5" fill="#4a90d9"/>
<text x="67.8" y="60" text-anchor="start" fill="#4a90d9">4 BC Herod dies</text>
<line x1="151.0" y1="94" x2="151.0" y2="150" stroke="#4a90d9" stroke-dasharray="3 3"/>
<circle cx="151.0" cy="150" r="5" fill="#4a90d9"/>
<text x="151.0" y="90" text-anchor="start" fill="#4a90d9">AD 6 Archelaus out; census</text>
<line x1="386.9" y1="64" x2="386.9" y2="150" stroke="#4a90d9" stroke-dasharray="3 3"/>
<circle cx="386.9" cy="150" r="5" fill="#4a90d9"/>
<text x="386.9" y="60" text-anchor="middle" fill="#4a90d9">c. 30 or 33 crucifixion</text>
<line x1="548.8" y1="94" x2="548.8" y2="150" stroke="#4a90d9" stroke-dasharray="3 3"/>
<circle cx="548.8" cy="150" r="5" fill="#4a90d9"/>
<text x="548.8" y="90" text-anchor="end" fill="#4a90d9">c. 49 Claudius expels Jews (?)</text>
<line x1="571.9" y1="64" x2="571.9" y2="150" stroke="#4a90d9" stroke-dasharray="3 3"/>
<circle cx="571.9" cy="150" r="5" fill="#4a90d9"/>
<text x="571.9" y="40" text-anchor="start" fill="#4a90d9">51&#8211;52 Gallio</text>
<line x1="687.5" y1="94" x2="687.5" y2="150" stroke="#4a90d9" stroke-dasharray="3 3"/>
<circle cx="687.5" cy="150" r="5" fill="#4a90d9"/>
<text x="687.5" y="90" text-anchor="middle" fill="#4a90d9">64 fire; Nero</text>
<line x1="743.0" y1="69" x2="743.0" y2="150" stroke="#4a90d9" stroke-dasharray="3 3"/>
<circle cx="743.0" cy="150" r="5" fill="#4a90d9"/>
<text x="743.0" y="65" text-anchor="end" fill="#4a90d9">70 Temple burned</text>
<text x="40.0" y="270" fill="#8a8a8a" font-size="11">No year zero: 1 BC is followed directly by AD 1. Blue = point anchors; coral = spans.</text>
</svg>