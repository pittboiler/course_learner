<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="sans-serif" font-size="12">
<title>Dating anchors of the New Testament world, 4 BC to AD 73</title>
<line x1="40.0" y1="150" x2="780.0" y2="150" stroke="#8a8a8a" stroke-width="2"/>
<line x1="58.5" y1="145" x2="58.5" y2="155" stroke="#8a8a8a"/>
<text x="58.5" y="170" text-anchor="middle" fill="#8a8a8a" font-size="11">5 BC</text>
