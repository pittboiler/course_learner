<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500">
<rect x="0" y="0" width="760" height="500" fill="#ffffff"/>
<rect x="228.0" y="65.0" width="14" height="375.0" fill="#2e8b57" fill-opacity="0.18"/>
<line x1="235.0" y1="462.5" x2="235.0" y2="27.5" stroke="#111" stroke-width="2.5"/>
<text x="235.0" y="484.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111" text-anchor="middle">A (Earth station)</text>
<line x1="422.5" y1="462.5" x2="422.5" y2="27.5" stroke="#111" stroke-width="2.5"/>
<text x="422.5" y="484.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111" text-anchor="middle">B (reflector on the Moon)</text>
<line x1="235.0" y1="440.0" x2="422.5" y2="252.5" stroke="#333" stroke-width="2" stroke-dasharray="7 4"/>
<line x1="422.5" y1="252.5" x2="235.0" y2="65.0" stroke="#333" stroke-width="2" stroke-dasharray="7 4"/>
<circle cx="235.0" cy="440.0" r="5" fill="#111"/>
<text x="223.0" y="445.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111" text-anchor="end">t1 = 0 s: pulse leaves</text>
<circle cx="235.0" cy="65.0" r="5" fill="#111"/>
<text x="223.0" y="70.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111" text-anchor="end">t3 = 2.5 s: echo returns</text>
<circle cx="422.5" cy="252.5" r="5" fill="#111"/>
<text x="432.5" y="276.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111" text-anchor="start">R: reflection</text>
<line x1="235.0" y1="252.5" x2="422.5" y2="252.5" stroke="#1a6fb5" stroke-width="2.5"/>
<circle cx="235.0" cy="252.5" r="5" fill="#1a6fb5"/>
<line x1="235.0" y1="290.0" x2="422.5" y2="252.5" stroke="#d1495b" stroke-width="2.5"/>
<circle cx="235.0" cy="290.0" r="5" fill="#d1495b"/>
<text x="223.0" y="257.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a6fb5" text-anchor="end">&#949; = 1/2: t2 = 1.25 s</text>
<text x="223.0" y="295.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d1495b" text-anchor="end">&#949; = 0.4: t2 = 1.0 s</text>
<line x1="422.5" y1="252.5" x2="527.5" y2="231.5" stroke="#d1495b" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="535.5" y="227.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d1495b" text-anchor="start">&#949; = 0.4 extended: the</text>
<text x="535.5" y="242.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d1495b" text-anchor="start">standard "now" of an observer</text>
<text x="535.5" y="257.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d1495b" text-anchor="start">moving at 0.2c toward B</text>
<line x1="422.5" y1="252.5" x2="527.5" y2="252.5" stroke="#1a6fb5" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="535.5" y="278.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a6fb5" text-anchor="start">&#949; = 1/2 extended</text>
<text x="221.0" y="155.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2e8b57" text-anchor="end">green band: any t2 strictly</text>
<text x="221.0" y="170.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2e8b57" text-anchor="end">between t1 and t3 (0 &lt; &#949; &lt; 1)</text>
<text x="740" y="400" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333" text-anchor="end">t up (s); x across (light-seconds)</text>
<text x="740" y="416" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333" text-anchor="end">dashed black: light (drawn with &#949; = 1/2)</text>
</svg>
