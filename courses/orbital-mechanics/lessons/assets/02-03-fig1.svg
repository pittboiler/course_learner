<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">State vector to elements: eight steps, three quadrant checks.</text>
  <rect x="40" y="60" width="250" height="32" rx="6" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="52" y="81" fill="#4a90d9" font-size="13">1.  r, v magnitudes</text>
  <text x="52" y="105" fill="#8a8a8a" font-size="11">r, v, and radial speed</text>
  <line x1="62" y1="92" x2="62" y2="128" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="62,132 58,122 66,122" fill="#8a8a8a"/>
  <rect x="40" y="134" width="250" height="32" rx="6" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="52" y="155" fill="#4a90d9" font-size="13">2.  h = r cross v</text>
  <text x="52" y="179" fill="#8a8a8a" font-size="11">angular momentum</text>
  <line x1="62" y1="166" x2="62" y2="202" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="62,206 58,196 66,196" fill="#8a8a8a"/>
  <rect x="40" y="208" width="250" height="32" rx="6" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="52" y="229" fill="#4a90d9" font-size="13">3.  inclination</text>
  <text x="52" y="253" fill="#8a8a8a" font-size="11">from the z-part of h</text>
  <line x1="62" y1="240" x2="62" y2="276" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="62,280 58,270 66,270" fill="#8a8a8a"/>
  <rect x="40" y="282" width="250" height="32" rx="6" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="52" y="303" fill="#4a90d9" font-size="13">4.  n = K cross h</text>
  <text x="52" y="327" fill="#8a8a8a" font-size="11">node vector</text>
  <rect x="340" y="60" width="250" height="32" rx="6" fill="#e0645c" opacity="0.15" stroke="#e0645c" stroke-width="1.8"/>
  <text x="352" y="81" fill="#e0645c" font-size="13">5.  RAAN</text>
  <text x="352" y="105" fill="#8a8a8a" font-size="11">quadrant check on n-y</text>
  <line x1="362" y1="92" x2="362" y2="128" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="362,132 358,122 366,122" fill="#8a8a8a"/>
  <rect x="340" y="134" width="250" height="32" rx="6" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="352" y="155" fill="#4a90d9" font-size="13">6.  e vector</text>
  <text x="352" y="179" fill="#8a8a8a" font-size="11">eccentricity, size</text>
  <line x1="362" y1="166" x2="362" y2="202" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="362,206 358,196 366,196" fill="#8a8a8a"/>
  <rect x="340" y="208" width="250" height="32" rx="6" fill="#e0645c" opacity="0.15" stroke="#e0645c" stroke-width="1.8"/>
  <text x="352" y="229" fill="#e0645c" font-size="13">7.  arg. of perigee</text>
  <text x="352" y="253" fill="#8a8a8a" font-size="11">quadrant check on e-z</text>
  <line x1="362" y1="240" x2="362" y2="276" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="362,280 358,270 366,270" fill="#8a8a8a"/>
  <rect x="340" y="282" width="250" height="32" rx="6" fill="#e0645c" opacity="0.15" stroke="#e0645c" stroke-width="1.8"/>
  <text x="352" y="303" fill="#e0645c" font-size="13">8.  true anomaly</text>
  <text x="352" y="327" fill="#8a8a8a" font-size="11">quadrant check on r dot v</text>
  <path d="M 290 288 L 316 288 L 316 60 L 336 60" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="340,60 330,56 330,64" fill="#8a8a8a"/>
  <text x="40" y="336" fill="#e0645c" font-size="12">coral steps need a sign test; arccos alone cannot see the quadrant</text>
</svg>