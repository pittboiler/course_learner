  <ellipse cx="150.0" cy="180.0" rx="108" ry="34" fill="none" stroke="#e0645c" stroke-width="2.5" transform="rotate(-38 150.0 180.0)"/>
  <text x="188.0" y="108.0" fill="#e0645c" font-size="11">orbit plane</text>
  <path d="M 106.8 85.5 L 108.0 86.5 L 109.4 87.5 L 111.0 88.5 L 112.8 89.4 L 114.8 90.3 L 116.9 91.1 L 119.2 91.9 L 121.7 92.6 L 124.3 93.3 L 127.0 93.9 L 129.8 94.4 L 132.8 94.8 L 135.8 95.2 L 138.9 95.5 L 142.0 95.8 L 145.2 95.9 L 148.4 96.0 L 151.6 96.0 L 154.8 95.9 L 158.0 95.8 L 161.1 95.5 L 164.2 95.2 L 167.2 94.8 L 170.2 94.4 L 173.0 93.9 L 175.7 93.3 L 178.3 92.6 L 180.8 91.9 L 183.1 91.1 L 185.2 90.3 L 187.2 89.4 L 189.0 88.5 L 190.6 87.5 L 192.0 86.5 L 193.2 85.5" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="198.2,81.5 187.2,78.5 190.2,88.5" fill="#8a8a8a"/>
