  <line x1="52.0" y1="180.0" x2="74.0" y2="180.0" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="78.0" y="272.0" fill="#8a8a8a" font-size="11">shape exaggerated: the real flattening is 0.3 percent</text>
  <line x1="150.0" y1="276.0" x2="150.0" y2="72.0" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="3 4"/>
