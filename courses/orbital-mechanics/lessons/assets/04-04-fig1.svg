  <circle cx="430.0" cy="180.0" r="104.0" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="534.0" cy="180.0" r="11" fill="#4a90d9" opacity="0.35" stroke="#4a90d9" stroke-width="1.6"/>
  <line x1="521.0" y1="202.5" x2="547.0" y2="157.5" stroke="#e0645c" stroke-width="2.5"/>
  <circle cx="430.0" cy="76.0" r="11" fill="#4a90d9" opacity="0.35" stroke="#4a90d9" stroke-width="1.6"/>
  <line x1="452.5" y1="89.0" x2="407.5" y2="63.0" stroke="#e0645c" stroke-width="2.5"/>
  <circle cx="326.0" cy="180.0" r="11" fill="#4a90d9" opacity="0.35" stroke="#4a90d9" stroke-width="1.6"/>
  <line x1="339.0" y1="157.5" x2="313.0" y2="202.5" stroke="#e0645c" stroke-width="2.5"/>
  <circle cx="430.0" cy="284.0" r="11" fill="#4a90d9" opacity="0.35" stroke="#4a90d9" stroke-width="1.6"/>
  <line x1="407.5" y1="271.0" x2="452.5" y2="297.0" stroke="#e0645c" stroke-width="2.5"/>
  <text x="358.0" y="326.0" fill="#e0645c" font-size="11">the orbit plane turns with the Earth-Sun line,</text>
  <text x="358.0" y="340.0" fill="#e0645c" font-size="11">so local solar time never changes</text>
  <text x="400.0" y="60.0" fill="#8a8a8a" font-size="11">one year</text>
