<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="520" height="430" fill="#ffffff"/>

  <!-- cover-relation edges (drawn first so nodes sit on top) -->
  <g stroke="#111111" stroke-width="2">
    <line x1="260" y1="360" x2="160" y2="270"/>
    <line x1="260" y1="360" x2="360" y2="270"/>
    <line x1="160" y1="270" x2="160" y2="160"/>
    <line x1="160" y1="270" x2="360" y2="160"/>
    <line x1="360" y1="270" x2="360" y2="160"/>
    <line x1="160" y1="160" x2="260" y2="60"/>
    <line x1="360" y1="160" x2="260" y2="60"/>
  </g>

  <!-- nodes: divisors of 12 -->
  <g font-size="22" fill="#ffffff" text-anchor="middle">
    <circle cx="260" cy="60"  r="24" fill="#111111"/>
    <text x="260" y="68">12</text>

    <circle cx="160" cy="160" r="24" fill="#111111"/>
    <text x="160" y="168">4</text>

    <circle cx="360" cy="160" r="24" fill="#111111"/>
    <text x="360" y="168">6</text>

    <circle cx="160" cy="270" r="24" fill="#111111"/>
    <text x="160" y="278">2</text>

    <circle cx="360" cy="270" r="24" fill="#111111"/>
    <text x="360" y="278">3</text>

    <circle cx="260" cy="360" r="24" fill="#111111"/>
    <text x="260" y="368">1</text>
  </g>

  <!-- annotation: the incomparable pair -->
  <g stroke="#b00000" stroke-width="2" stroke-dasharray="5 5">
    <line x1="184" y1="270" x2="336" y2="270"/>
  </g>
  <text x="260" y="258" text-anchor="middle" font-size="14" fill="#b00000">2 and 3 incomparable</text>

  <text x="260" y="408" text-anchor="middle" font-size="14" fill="#555555">Divisors of 12 ordered by "divides" — a partial, not total, order</text>
</svg>
