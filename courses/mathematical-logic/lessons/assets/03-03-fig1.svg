<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="430" fill="#ffffff"/>

  <!-- the widening cone of stages -->
  <polygon points="280,40 470,400 90,400" fill="#f2f2f2" stroke="#111111" stroke-width="2"/>

  <!-- stage dividers (horizontal cuts), lower = earlier stage -->
  <g stroke="#111111" stroke-width="1.2">
    <line x1="256" y1="360" x2="304" y2="360"/>  <!-- V0/V1 boundary -->
    <line x1="235" y1="320" x2="325" y2="320"/>  <!-- V1/V2 -->
    <line x1="214" y1="280" x2="346" y2="280"/>  <!-- V2/V3 -->
    <line x1="188" y1="230" x2="372" y2="230"/>  <!-- V3/V4 -->
    <line x1="150" y1="160" x2="410" y2="160"/>  <!-- V_omega -->
  </g>

  <!-- rank labels on the right -->
  <g font-size="15" fill="#111111">
    <text x="315" y="388" text-anchor="start">V&#8320; = &#8709;</text>
    <text x="335" y="344" text-anchor="start">V&#8321;</text>
    <text x="356" y="304" text-anchor="start">V&#8322;</text>
    <text x="382" y="258" text-anchor="start">V&#8323;</text>
    <text x="420" y="198" text-anchor="start">V&#7473;</text>
    <text x="300" y="80"  text-anchor="middle" font-size="14" fill="#555555">V&#8342;&#8330;&#8321; = &#8473;(V&#8342;) &#8230;</text>
  </g>

  <!-- sample members drawn as dots at their birth rank -->
  <g fill="#111111">
    <circle cx="280" cy="340" r="4"/>
    <text x="248" y="345" text-anchor="end" font-size="12" fill="#555555">{&#8709;}</text>
    <circle cx="272" cy="300" r="4"/>
    <text x="205" y="305" text-anchor="end" font-size="12" fill="#555555">{{&#8709;}}</text>
    <circle cx="290" cy="190" r="4"/>
    <text x="178" y="150" text-anchor="end" font-size="12" fill="#555555">&#969; born here</text>
  </g>

  <!-- rank arrow -->
  <g stroke="#111111" stroke-width="2" fill="#111111">
    <line x1="70" y1="400" x2="70" y2="60"/>
    <polygon points="70,48 64,62 76,62"/>
  </g>
  <text x="52" y="230" text-anchor="middle" font-size="14" fill="#111111" transform="rotate(-90 52 230)">rank (ordinal stage) increasing</text>

  <text x="280" y="424" text-anchor="middle" font-size="13" fill="#555555">V = &#8899; V&#945; over all ordinals &#945; &#8212; every set is born at some stage</text>
</svg>
