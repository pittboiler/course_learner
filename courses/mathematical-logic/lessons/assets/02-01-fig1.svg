<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 262" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="520" height="262" fill="#ffffff"/>

  <!-- ===== the formula ===== -->
  <g font-size="22" text-anchor="middle" fill="#111111">
    <text x="50"  y="64">&#8704;</text>
    <text x="70"  y="64" font-style="italic">x</text>
    <text x="84"  y="64">(</text>
    <text x="100" y="64">P</text>
    <text x="116" y="64">(</text>
    <text x="130" y="64" font-style="italic" fill="#1a5fb4">x</text>
    <text x="144" y="64">)</text>
    <text x="164" y="64">&#8594;</text>
    <text x="188" y="64">&#8707;</text>
    <text x="206" y="64" font-style="italic">y</text>
    <text x="226" y="64">R</text>
    <text x="244" y="64">(</text>
    <text x="258" y="64" font-style="italic" fill="#1a5fb4">x</text>
    <text x="271" y="64">,</text>
    <text x="284" y="64" font-style="italic" fill="#1a5fb4">y</text>
    <text x="298" y="64">)</text>
    <text x="310" y="64">)</text>
    <text x="330" y="64">&#8743;</text>
    <text x="354" y="64">Q</text>
    <text x="370" y="64">(</text>
    <text x="384" y="64" font-style="italic" fill="#c01c28">x</text>
    <text x="398" y="64">)</text>
  </g>

  <!-- ===== scope of the universal quantifier ===== -->
  <path d="M76 84 L76 92 L318 92 L318 84" fill="none" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="197" y="108" text-anchor="middle" font-size="14" fill="#1a5fb4">scope of &#8704;x</text>

  <!-- ===== scope of the existential quantifier ===== -->
  <path d="M218 118 L218 126 L306 126 L306 118" fill="none" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="262" y="142" text-anchor="middle" font-size="14" fill="#1a5fb4">scope of &#8707;y</text>

  <!-- ===== the free occurrence ===== -->
  <line x1="384" y1="166" x2="384" y2="76" stroke="#c01c28" stroke-width="1.5"/>
  <polygon points="384,70 379,81 389,81" fill="#c01c28"/>
  <text x="384" y="184" text-anchor="middle" font-size="14" fill="#c01c28">free &#8212; outside the scope of &#8704;x</text>

  <!-- ===== legend ===== -->
  <rect x="54" y="210" width="13" height="13" fill="#1a5fb4"/>
  <text x="74" y="221" font-size="14" fill="#111111">bound occurrence (inside a quantifier's scope)</text>
  <rect x="54" y="232" width="13" height="13" fill="#c01c28"/>
  <text x="74" y="243" font-size="14" fill="#111111">free occurrence (captured by no quantifier)</text>
</svg>
