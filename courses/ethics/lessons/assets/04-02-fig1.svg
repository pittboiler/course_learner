<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img">
  <text x="10" y="20" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#8a8a8a">Deficiency vice at left, excess vice at right. Grey tick: arithmetic midpoint. Blue dot: the mean relative to us.</text>

  <text x="10" y="62" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a90d9">Food, beginner</text>
  <line x1="240" y1="58" x2="760" y2="58" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="500" y1="48" x2="500" y2="68" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="3,3"/>
  <circle cx="240" cy="58" r="6" fill="#e0645c"/>
  <circle cx="760" cy="58" r="6" fill="#e0645c"/>
  <circle cx="400" cy="58" r="8" fill="#4a90d9"/>
  <text x="240" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle">2 lb, too little</text>
  <text x="760" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle">10 lb, too much</text>
  <text x="500" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle">6 lb</text>

  <text x="10" y="126" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a90d9">Food, Milo</text>
  <line x1="240" y1="122" x2="760" y2="122" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="500" y1="112" x2="500" y2="132" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="3,3"/>
  <circle cx="240" cy="122" r="6" fill="#e0645c"/>
  <circle cx="760" cy="122" r="6" fill="#e0645c"/>
  <circle cx="640" cy="122" r="8" fill="#4a90d9"/>

  <text x="10" y="186" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a90d9">Anger, a trivial slight</text>
  <line x1="240" y1="182" x2="760" y2="182" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="500" y1="172" x2="500" y2="192" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="3,3"/>
  <circle cx="240" cy="182" r="6" fill="#e0645c"/>
  <circle cx="760" cy="182" r="6" fill="#e0645c"/>
  <circle cx="290" cy="182" r="8" fill="#4a90d9"/>

  <text x="10" y="246" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a90d9">Anger, cruelty to a child</text>
  <line x1="240" y1="242" x2="760" y2="242" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="500" y1="232" x2="500" y2="252" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="3,3"/>
  <circle cx="240" cy="242" r="6" fill="#e0645c"/>
  <circle cx="760" cy="242" r="6" fill="#e0645c"/>
  <circle cx="700" cy="242" r="8" fill="#4a90d9"/>
  <text x="240" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle">inirascibility</text>
  <text x="760" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle">irascibility</text>
  <text x="500" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle">The mean moves with the person and the occasion; it is not the middle of the line.</text>
</svg>
