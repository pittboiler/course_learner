<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- convergence interval (c-R, c+R) shaded blue -->
  <rect x="150" y="112" width="320" height="26" fill="#4a90d9" opacity="0.16"/>
  <!-- nested compact [c-r, c+r] shaded darker, where convergence is uniform -->
  <rect x="210" y="112" width="200" height="26" fill="#4a90d9" opacity="0.30"/>

  <!-- the real line -->
  <line x1="40" y1="125" x2="580" y2="125" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="580,125 570,120 570,130" fill="#8a8a8a"/>
  <polygon points="40,125 50,120 50,130" fill="#8a8a8a"/>

  <!-- center c -->
  <line x1="310" y1="104" x2="310" y2="146" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="310" cy="125" r="4" fill="#8a8a8a"/>
  <text x="305" y="166" fill="#8a8a8a">c</text>

  <!-- inner compact endpoints c-r, c+r -->
  <line x1="210" y1="112" x2="210" y2="138" stroke="#4a90d9" stroke-width="1.5"/>
  <line x1="410" y1="112" x2="410" y2="138" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="188" y="166" fill="#4a90d9">c−r</text>
  <text x="392" y="166" fill="#4a90d9">c+r</text>

  <!-- radius endpoints c-R, c+R : ambiguous "?" -->
  <line x1="150" y1="100" x2="150" y2="150" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="470" y1="100" x2="470" y2="150" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="150" cy="125" r="4" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <circle cx="470" cy="125" r="4" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="132" y="166" fill="#e0645c">c−R</text>
  <text x="452" y="166" fill="#e0645c">c+R</text>
  <text x="146" y="94" fill="#e0645c" font-weight="bold">?</text>
  <text x="466" y="94" fill="#e0645c" font-weight="bold">?</text>

  <!-- region labels -->
  <text x="222" y="100" fill="#4a90d9">converges absolutely</text>
  <text x="70" y="118" fill="#e0645c">diverges</text>
  <text x="512" y="118" fill="#e0645c">diverges</text>

  <!-- uniform bracket under inner interval -->
  <path d="M 210 200 L 210 208 L 410 208 L 410 200" fill="none" stroke="#4a90d9" stroke-width="1.3"/>
  <text x="238" y="228" fill="#4a90d9">uniform on any [c−r, c+r], r &lt; R</text>

  <!-- caption -->
  <text x="40" y="30" fill="#8a8a8a" font-style="italic">Absolute convergence inside radius R; divergence outside; endpoints undecided.</text>
  <text x="40" y="50" fill="#8a8a8a" font-style="italic">Convergence is uniform only on compact pieces strictly inside.</text>
</svg>
