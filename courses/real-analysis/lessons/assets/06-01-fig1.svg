<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- axes -->
  <line x1="40" y1="300" x2="540" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="70" y1="20" x2="70" y2="320" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="540,300 530,295 530,305" fill="#8a8a8a"/>
  <polygon points="70,20 65,30 75,30" fill="#8a8a8a"/>
  <text x="546" y="305" fill="#8a8a8a">x</text>

  <!-- the curve y = f(x): increasing, concave down -->
  <path d="M 100 290 L 140 258 L 180 232 L 220 212 L 260 196 L 300 184 L 340 175 L 380 168 L 420 163 L 460 160 L 500 158"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="466" y="150" fill="#4a90d9">y = f(x)</text>

  <!-- secant lines (grey), tilting toward the tangent as x approaches c -->
  <line x1="196" y1="217" x2="484" y2="155" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="196" y1="219" x2="404" y2="161" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="196" y1="220" x2="324" y2="176" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- tangent line at c (red) -->
  <line x1="150" y1="243.5" x2="470" y2="99.5" stroke="#e0645c" stroke-width="2.5"/>
  <text x="474" y="98" fill="#e0645c">tangent at c</text>

  <!-- sample points (x, f(x)) approaching c from the right -->
  <circle cx="460" cy="160" r="4" fill="#8a8a8a"/>
  <circle cx="380" cy="168" r="4" fill="#8a8a8a"/>
  <circle cx="300" cy="184" r="4" fill="#8a8a8a"/>
  <text x="452" y="180" fill="#8a8a8a">x₁</text>
  <text x="372" y="188" fill="#8a8a8a">x₂</text>
  <text x="292" y="204" fill="#8a8a8a">x₃</text>

  <!-- arrow showing x_n -> c -->
  <line x1="450" y1="215" x2="248" y2="215" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <polygon points="240,215 250,210 250,220" fill="#8a8a8a"/>
  <text x="330" y="234" fill="#8a8a8a" font-style="italic">as x → c the secants tilt to the tangent</text>

  <!-- the fixed point (c, f(c)) -->
  <circle cx="220" cy="212" r="5" fill="#4a90d9"/>
  <line x1="220" y1="212" x2="220" y2="300" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="212" y="318" fill="#8a8a8a">c</text>
  <text x="150" y="205" fill="#4a90d9">(c, f(c))</text>

  <!-- caption -->
  <text x="90" y="42" fill="#8a8a8a" font-style="italic">f′(c) is the limiting slope of the secant through (c,f(c)) and (x,f(x)).</text>
</svg>
