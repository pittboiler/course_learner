<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- tolerance band [L-eps, L+eps] -->
  <rect x="50" y="130" width="495" height="40" fill="#4a90d9" opacity="0.15"/>

  <!-- L line -->
  <line x1="50" y1="150" x2="545" y2="150" stroke="#4a90d9" stroke-width="2"/>
  <!-- band edges -->
  <line x1="50" y1="130" x2="545" y2="130" stroke="#4a90d9" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
  <line x1="50" y1="170" x2="545" y2="170" stroke="#4a90d9" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>

  <!-- axes -->
  <line x1="50" y1="40" x2="50" y2="320" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="50" y1="320" x2="550" y2="320" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="50,40 45,50 55,50" fill="#8a8a8a"/>
  <polygon points="550,320 540,315 540,325" fill="#8a8a8a"/>
  <text x="30" y="54" fill="#8a8a8a">a&#8345;</text>
  <text x="548" y="338" fill="#8a8a8a">n</text>

  <!-- y-axis labels -->
  <text x="8" y="135" fill="#4a90d9">L+&#949;</text>
  <text x="30" y="155" fill="#4a90d9">L</text>
  <text x="10" y="175" fill="#4a90d9">L&#8722;&#949;</text>

  <!-- N cutoff line: all terms with n > N lie in the band -->
  <line x1="262" y1="40" x2="262" y2="320" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="255" y="338" fill="#8a8a8a">N</text>

  <!-- dots outside the band (n <= N), grey -->
  <circle cx="70"  cy="90"  r="4.5" fill="#8a8a8a"/>
  <circle cx="105" cy="200" r="4.5" fill="#8a8a8a"/>
  <circle cx="140" cy="112" r="4.5" fill="#8a8a8a"/>
  <circle cx="175" cy="183" r="4.5" fill="#8a8a8a"/>
  <circle cx="210" cy="126" r="4.5" fill="#8a8a8a"/>
  <circle cx="245" cy="172" r="4.5" fill="#8a8a8a"/>

  <!-- dots inside the band (n > N), red -->
  <circle cx="280" cy="134" r="4.5" fill="#e0645c"/>
  <circle cx="315" cy="164" r="4.5" fill="#e0645c"/>
  <circle cx="350" cy="139" r="4.5" fill="#e0645c"/>
  <circle cx="385" cy="160" r="4.5" fill="#e0645c"/>
  <circle cx="420" cy="142" r="4.5" fill="#e0645c"/>
  <circle cx="455" cy="157" r="4.5" fill="#e0645c"/>
  <circle cx="490" cy="144" r="4.5" fill="#e0645c"/>
  <circle cx="525" cy="155" r="4.5" fill="#e0645c"/>

  <!-- caption -->
  <text x="70" y="300" fill="#8a8a8a" font-style="italic">Shrink &#949; and the band narrows &#8212; the cutoff N slides right, but a tail always fits.</text>
  <text x="300" y="70" fill="#e0645c">every term past N is within &#949; of L</text>
</svg>
