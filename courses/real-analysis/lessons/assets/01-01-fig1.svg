<svg viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="30" fill="#8a8a8a" font-style="italic">Rationals crowd in from both sides — yet no rational lands on the mark.</text>

  <!-- the number line (zoomed window 1.30 .. 1.55) -->
  <line x1="40" y1="150" x2="520" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="520,150 510,145 510,155" fill="#8a8a8a"/>

  <!-- ticks -->
  <line x1="136" y1="145" x2="136" y2="155" stroke="#8a8a8a" stroke-width="1"/>
  <text x="124" y="172" fill="#8a8a8a">1.35</text>
  <line x1="232" y1="145" x2="232" y2="155" stroke="#8a8a8a" stroke-width="1"/>
  <text x="220" y="172" fill="#8a8a8a">1.40</text>
  <line x1="328" y1="145" x2="328" y2="155" stroke="#8a8a8a" stroke-width="1"/>
  <text x="316" y="172" fill="#8a8a8a">1.45</text>
  <line x1="424" y1="145" x2="424" y2="155" stroke="#8a8a8a" stroke-width="1"/>
  <text x="412" y="172" fill="#8a8a8a">1.50</text>

  <!-- A: rationals with q^2 < 2, approaching from the left (blue) -->
  <circle cx="78"  cy="150" r="4" fill="#4a90d9"/>
  <circle cx="174" cy="150" r="4" fill="#4a90d9"/>
  <circle cx="232" cy="150" r="4" fill="#4a90d9"/>
  <circle cx="249" cy="150" r="4" fill="#4a90d9"/>
  <circle cx="255" cy="150" r="4" fill="#4a90d9"/>

  <!-- upper bounds: rationals with q^2 > 2, approaching from the right (red) -->
  <circle cx="266" cy="150" r="4" fill="#e0645c"/>
  <circle cx="270" cy="150" r="4" fill="#e0645c"/>
  <circle cx="290" cy="150" r="4" fill="#e0645c"/>
  <circle cx="347" cy="150" r="4" fill="#e0645c"/>
  <circle cx="462" cy="150" r="4" fill="#e0645c"/>

  <!-- the hole at sqrt(2) ~ 1.41421 -> x = 259 -->
  <circle cx="259" cy="150" r="6.5" fill="#ffffff" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="259" y1="150" x2="259" y2="92" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="243" y="84" fill="#8a8a8a">&#8730;2</text>

  <!-- brackets / labels for the two sides -->
  <text x="70"  y="210" fill="#4a90d9">A = { q : q &gt; 0, q&#178; &lt; 2 }</text>
  <line x1="150" y1="196" x2="230" y2="160" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="330" y="210" fill="#e0645c">upper bounds: q&#178; &gt; 2</text>
  <line x1="360" y1="196" x2="300" y2="160" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
</svg>
