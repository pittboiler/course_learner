<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- horizontal output band: (f(c) - eps, f(c) + eps) -->
  <rect x="60" y="116" width="300" height="68" fill="#e0645c" opacity="0.14"/>
  <!-- vertical input strip: (c - delta, c + delta) -->
  <rect x="220" y="18" width="140" height="282" fill="#4a90d9" opacity="0.12"/>

  <!-- axes -->
  <line x1="30" y1="300" x2="540" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="60" y1="18" x2="60" y2="322" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="540,300 530,295 530,305" fill="#8a8a8a"/>
  <polygon points="60,18 55,28 65,28" fill="#8a8a8a"/>
  <text x="546" y="305" fill="#8a8a8a">x</text>
  <text x="44" y="24" fill="#8a8a8a">y</text>

  <!-- band edges (dashed) across to the strip -->
  <line x1="60" y1="116" x2="360" y2="116" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="60" y1="184" x2="360" y2="184" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- strip edges (dashed) up to the axis top -->
  <line x1="220" y1="18" x2="220" y2="300" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="360" y1="18" x2="360" y2="300" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- guide lines to the point (c, f(c)) -->
  <line x1="290" y1="300" x2="290" y2="150" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="60" y1="150" x2="290" y2="150" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- the curve y = f(x) -->
  <path d="M 80 255 L 120 230 L 160 208 L 200 188 L 240 170 L 290 150 L 320 140 L 360 125 L 400 112 L 440 100 L 480 90 L 520 82"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- the point (c, f(c)) -->
  <circle cx="290" cy="150" r="5" fill="#4a90d9"/>

  <!-- y-axis labels (right-aligned, just left of the axis) -->
  <text x="55" y="120" fill="#e0645c" text-anchor="end">f(c)+&#949;</text>
  <text x="55" y="154" fill="#8a8a8a" text-anchor="end">f(c)</text>
  <text x="55" y="188" fill="#e0645c" text-anchor="end">f(c)&#8722;&#949;</text>

  <!-- x-axis labels -->
  <text x="220" y="318" fill="#4a90d9" text-anchor="middle">c&#8722;&#948;</text>
  <text x="290" y="318" fill="#8a8a8a" text-anchor="middle">c</text>
  <text x="360" y="318" fill="#4a90d9" text-anchor="middle">c+&#948;</text>

  <!-- caption -->
  <text x="80" y="40" fill="#8a8a8a" font-style="italic">You name the red band (&#949;); I must find a blue strip (&#948;)</text>
  <text x="80" y="58" fill="#8a8a8a" font-style="italic">whose entire graph stays trapped inside the band.</text>
</svg>
