<svg viewBox="0 0 600 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="20"><rect x="0" y="0" width="600" height="360" fill="#ffffff"/>
  <!-- title -->
  <text x="40" y="34" fill="#8a8a8a" font-size="14" font-style="italic">Any list of [0,1] must miss y: flip the nth digit of the nth number.</text>

  <!-- highlighted diagonal cells (blue) -->
  <rect x="132" y="53" width="30" height="28" rx="4" fill="#4a90d9" opacity="0.18"/>
  <rect x="172" y="88" width="30" height="28" rx="4" fill="#4a90d9" opacity="0.18"/>
  <rect x="212" y="123" width="30" height="28" rx="4" fill="#4a90d9" opacity="0.18"/>
  <rect x="252" y="158" width="30" height="28" rx="4" fill="#4a90d9" opacity="0.18"/>
  <rect x="292" y="193" width="30" height="28" rx="4" fill="#4a90d9" opacity="0.18"/>

  <!-- row labels and "0." -->
  <text x="40" y="75"  fill="#8a8a8a">x&#8321; = 0.</text>
  <text x="40" y="110" fill="#8a8a8a">x&#8322; = 0.</text>
  <text x="40" y="145" fill="#8a8a8a">x&#8323; = 0.</text>
  <text x="40" y="180" fill="#8a8a8a">x&#8324; = 0.</text>
  <text x="40" y="215" fill="#8a8a8a">x&#8325; = 0.</text>

  <!-- digit grid: columns centered at 147,187,227,267,307,347 -->
  <!-- row 1 -->
  <text x="147" y="75" text-anchor="middle" fill="#4a90d9" font-weight="bold">3</text>
  <text x="187" y="75" text-anchor="middle" fill="#333">1</text>
  <text x="227" y="75" text-anchor="middle" fill="#333">4</text>
  <text x="267" y="75" text-anchor="middle" fill="#333">1</text>
  <text x="307" y="75" text-anchor="middle" fill="#333">5</text>
  <text x="347" y="75" text-anchor="middle" fill="#8a8a8a">&#8230;</text>
  <!-- row 2 -->
  <text x="147" y="110" text-anchor="middle" fill="#333">2</text>
  <text x="187" y="110" text-anchor="middle" fill="#4a90d9" font-weight="bold">7</text>
  <text x="227" y="110" text-anchor="middle" fill="#333">1</text>
  <text x="267" y="110" text-anchor="middle" fill="#333">8</text>
  <text x="307" y="110" text-anchor="middle" fill="#333">2</text>
  <text x="347" y="110" text-anchor="middle" fill="#8a8a8a">&#8230;</text>
  <!-- row 3 -->
  <text x="147" y="145" text-anchor="middle" fill="#333">1</text>
  <text x="187" y="145" text-anchor="middle" fill="#333">4</text>
  <text x="227" y="145" text-anchor="middle" fill="#4a90d9" font-weight="bold">1</text>
  <text x="267" y="145" text-anchor="middle" fill="#333">4</text>
  <text x="307" y="145" text-anchor="middle" fill="#333">2</text>
  <text x="347" y="145" text-anchor="middle" fill="#8a8a8a">&#8230;</text>
  <!-- row 4 -->
  <text x="147" y="180" text-anchor="middle" fill="#333">5</text>
  <text x="187" y="180" text-anchor="middle" fill="#333">7</text>
  <text x="227" y="180" text-anchor="middle" fill="#333">7</text>
  <text x="267" y="180" text-anchor="middle" fill="#4a90d9" font-weight="bold">2</text>
  <text x="307" y="180" text-anchor="middle" fill="#333">1</text>
  <text x="347" y="180" text-anchor="middle" fill="#8a8a8a">&#8230;</text>
  <!-- row 5 -->
  <text x="147" y="215" text-anchor="middle" fill="#333">1</text>
  <text x="187" y="215" text-anchor="middle" fill="#333">2</text>
  <text x="227" y="215" text-anchor="middle" fill="#333">3</text>
  <text x="267" y="215" text-anchor="middle" fill="#333">4</text>
  <text x="307" y="215" text-anchor="middle" fill="#4a90d9" font-weight="bold">5</text>
  <text x="347" y="215" text-anchor="middle" fill="#8a8a8a">&#8230;</text>
  <!-- more rows -->
  <text x="40"  y="248" fill="#8a8a8a">&#8942;</text>

  <!-- separator -->
  <line x1="40" y1="268" x2="360" y2="268" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- the new number y (red), each digit differs from the diagonal above -->
  <text x="40" y="300" fill="#e0645c" font-weight="bold">y  = 0.</text>
  <text x="147" y="300" text-anchor="middle" fill="#e0645c" font-weight="bold">5</text>
  <text x="187" y="300" text-anchor="middle" fill="#e0645c" font-weight="bold">5</text>
  <text x="227" y="300" text-anchor="middle" fill="#e0645c" font-weight="bold">5</text>
  <text x="267" y="300" text-anchor="middle" fill="#e0645c" font-weight="bold">5</text>
  <text x="307" y="300" text-anchor="middle" fill="#e0645c" font-weight="bold">4</text>
  <text x="347" y="300" text-anchor="middle" fill="#8a8a8a">&#8230;</text>

  <!-- rule reminder -->
  <text x="40" y="338" fill="#8a8a8a" font-size="14">rule: digit &#8594; 5, but 5 &#8594; 4  (never 0 or 9, so no 0.4999&#8230;=0.5000&#8230; trap)</text>
  <text x="400" y="80"  fill="#4a90d9" font-size="14">diagonal:</text>
  <text x="400" y="100" fill="#4a90d9" font-size="14">3, 7, 1, 2, 5, &#8230;</text>
  <text x="400" y="296" fill="#e0645c" font-size="14">y differs from every x&#8345;</text>
</svg>
