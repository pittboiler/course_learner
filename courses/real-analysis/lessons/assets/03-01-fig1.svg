<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="70" y="34" fill="#8a8a8a" font-style="italic">Each new term is half the last; the partial sums s_n climb, settling onto S = 1.</text>

  <!-- limit line S = 1 -->
  <line x1="60" y1="70" x2="500" y2="70" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="506" y="75" fill="#e0645c">S = 1</text>

  <!-- axes -->
  <line x1="60" y1="300" x2="530" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="60" y1="48" x2="60" y2="322" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="530,300 520,295 520,305" fill="#8a8a8a"/>
  <text x="524" y="318" fill="#8a8a8a">n</text>

  <!-- bars: partial sums, with the newest increment highlighted (each half the previous) -->
  <!-- n=1 : s1=1/2 -->
  <rect x="72" y="185" width="36" height="115" fill="#4a90d9" opacity="0.30"/>
  <circle cx="90" cy="185" r="4" fill="#e0645c"/>
  <text x="86" y="316" fill="#8a8a8a">1</text>

  <!-- n=2 : s2=3/4 -->
  <rect x="137" y="300" width="36" height="0" fill="#8a8a8a" opacity="0.12"/>
  <rect x="137" y="185" width="36" height="115" fill="#8a8a8a" opacity="0.12"/>
  <rect x="137" y="127.5" width="36" height="57.5" fill="#4a90d9" opacity="0.30"/>
  <circle cx="155" cy="127.5" r="4" fill="#e0645c"/>
  <text x="151" y="316" fill="#8a8a8a">2</text>

  <!-- n=3 : s3=7/8 -->
  <rect x="202" y="127.5" width="36" height="172.5" fill="#8a8a8a" opacity="0.12"/>
  <rect x="202" y="98.75" width="36" height="28.75" fill="#4a90d9" opacity="0.30"/>
  <circle cx="220" cy="98.75" r="4" fill="#e0645c"/>
  <text x="216" y="316" fill="#8a8a8a">3</text>

  <!-- n=4 : s4=15/16 -->
  <rect x="267" y="98.75" width="36" height="201.25" fill="#8a8a8a" opacity="0.12"/>
  <rect x="267" y="84.4" width="36" height="14.35" fill="#4a90d9" opacity="0.30"/>
  <circle cx="285" cy="84.4" r="4" fill="#e0645c"/>
  <text x="281" y="316" fill="#8a8a8a">4</text>

  <!-- n=5 : s5=31/32 -->
  <rect x="332" y="84.4" width="36" height="215.6" fill="#8a8a8a" opacity="0.12"/>
  <rect x="332" y="77.2" width="36" height="7.2" fill="#4a90d9" opacity="0.30"/>
  <circle cx="350" cy="77.2" r="4" fill="#e0645c"/>
  <text x="346" y="316" fill="#8a8a8a">5</text>

  <!-- n=6 : s6=63/64 -->
  <rect x="397" y="77.2" width="36" height="222.8" fill="#8a8a8a" opacity="0.12"/>
  <rect x="397" y="73.6" width="36" height="3.6" fill="#4a90d9" opacity="0.30"/>
  <circle cx="415" cy="73.6" r="4" fill="#e0645c"/>
  <text x="411" y="316" fill="#8a8a8a">6</text>

  <!-- legend -->
  <rect x="360" y="150" width="14" height="14" fill="#4a90d9" opacity="0.30"/>
  <text x="380" y="162" fill="#8a8a8a">new term a_n = 1/2ⁿ</text>
  <rect x="360" y="172" width="14" height="14" fill="#8a8a8a" opacity="0.12"/>
  <text x="380" y="184" fill="#8a8a8a">earlier terms (s_{n-1})</text>
</svg>
