<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">A plane wall: temperature falls linearly from T&#8321; to T&#8322;, and heat flows down the gradient.</text>

  <!-- ===== the wall slab ===== -->
  <rect x="150" y="60" width="200" height="200" fill="#8a8a8a" opacity="0.12" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- hot face label -->
  <text x="120" y="55" fill="#e0645c">T&#8321; (hot)</text>
  <text x="330" y="55" fill="#4a90d9">T&#8322; (cold)</text>

  <!-- thickness marker L -->
  <line x1="150" y1="278" x2="350" y2="278" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="150,278 159,274 159,282" fill="#8a8a8a"/>
  <polygon points="350,278 341,274 341,282" fill="#8a8a8a"/>
  <text x="246" y="296" fill="#8a8a8a">L</text>
  <line x1="150" y1="260" x2="150" y2="284" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="350" y1="260" x2="350" y2="284" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- x axis inside wall -->
  <line x1="150" y1="240" x2="370" y2="240" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="370,240 361,236 361,244" fill="#8a8a8a"/>
  <text x="374" y="245" fill="#8a8a8a">x</text>

  <!-- linear temperature profile (hot left to cold right) -->
  <line x1="150" y1="90" x2="350" y2="200" stroke="#e0645c" stroke-width="3"/>
  <circle cx="150" cy="90" r="4" fill="#e0645c"/>
  <circle cx="350" cy="200" r="4" fill="#4a90d9"/>
  <text x="150" y="82" fill="#e0645c" font-style="italic">T(x)</text>

  <!-- gradient arrow: dT/dx points uphill (toward hot, left) -->
  <line x1="290" y1="128" x2="230" y2="128" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="230,128 239,124 239,132" fill="#8a8a8a"/>
  <text x="236" y="120" fill="#8a8a8a">&#8711;T</text>

  <!-- heat flux arrow: q'' points down-gradient (toward cold, right) -->
  <line x1="180" y1="170" x2="320" y2="170" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="320,170 308,164 308,176" fill="#4a90d9"/>
  <text x="228" y="163" fill="#4a90d9">q&#8243; = &#8722;k dT/dx</text>

  <!-- area A callout on cold face -->
  <line x1="350" y1="60" x2="350" y2="260" stroke="#4a90d9" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="356" y="160" fill="#4a90d9">area A</text>
</svg>
