<svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Flow over a hot flat plate: both boundary layers grow with x; the wall temperature slope sets h.</text>

  <!-- ===== the plate (wall) ===== -->
  <line x1="60" y1="250" x2="612" y2="250" stroke="#8a8a8a" stroke-width="2.5"/>
  <!-- solid hatching below the plate -->
  <line x1="72" y1="250" x2="62" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="102" y1="250" x2="92" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="132" y1="250" x2="122" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="162" y1="250" x2="152" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="192" y1="250" x2="182" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="222" y1="250" x2="212" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="252" y1="250" x2="242" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="282" y1="250" x2="272" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="312" y1="250" x2="302" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="342" y1="250" x2="332" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="372" y1="250" x2="362" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="402" y1="250" x2="392" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="432" y1="250" x2="422" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="462" y1="250" x2="452" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="492" y1="250" x2="482" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="522" y1="250" x2="512" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="552" y1="250" x2="542" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="582" y1="250" x2="572" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="612" y1="250" x2="602" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <text x="300" y="280" fill="#8a8a8a">hot wall, T&#8347; (solid)</text>

  <!-- x axis along the plate -->
  <line x1="60" y1="298" x2="150" y2="298" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="150,298 141,294 141,302" fill="#8a8a8a"/>
  <text x="155" y="303" fill="#8a8a8a">x</text>
  <line x1="60" y1="250" x2="60" y2="304" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="40" y="308" fill="#8a8a8a">0</text>

  <!-- ===== freestream arrows ===== -->
  <line x1="14" y1="110" x2="52" y2="110" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="52,110 43,106 43,114" fill="#4a90d9"/>
  <line x1="14" y1="145" x2="52" y2="145" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="52,145 43,141 43,149" fill="#4a90d9"/>
  <line x1="14" y1="180" x2="52" y2="180" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="52,180 43,176 43,184" fill="#4a90d9"/>
  <line x1="14" y1="215" x2="52" y2="215" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="52,215 43,211 43,219" fill="#4a90d9"/>
  <text x="12" y="96" fill="#4a90d9">u&#8734;, T&#8734;</text>

  <!-- ===== thermal boundary layer (coral, outer) ===== -->
  <path d="M 60 250 L 100 225 L 160 211 L 250 196 L 350 184 L 450 173 L 600 160"
        fill="none" stroke="#e0645c" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="556" y="150" fill="#e0645c">&#948;&#8348;(x)</text>
  <text x="470" y="150" fill="#e0645c" font-size="12">thermal</text>

  <!-- ===== velocity boundary layer (blue, inner) ===== -->
  <path d="M 60 250 L 100 228 L 160 216 L 250 203 L 350 191 L 450 182 L 600 170"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="556" y="188" fill="#4a90d9">&#948;(x)</text>
  <text x="472" y="205" fill="#4a90d9" font-size="12">velocity</text>

  <!-- ===== velocity profile at a station x = L ===== -->
  <line x1="350" y1="250" x2="350" y2="185" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>
  <!-- profile arrows: 0 at wall, growing to u-infinity at delta -->
  <line x1="350" y1="245" x2="356" y2="245" stroke="#4a90d9" stroke-width="1.6"/>
  <polygon points="356,245 351,243 351,247" fill="#4a90d9"/>
  <line x1="350" y1="234" x2="366" y2="234" stroke="#4a90d9" stroke-width="1.6"/>
  <polygon points="366,234 361,232 361,236" fill="#4a90d9"/>
  <line x1="350" y1="221" x2="380" y2="221" stroke="#4a90d9" stroke-width="1.6"/>
  <polygon points="380,221 375,219 375,223" fill="#4a90d9"/>
  <line x1="350" y1="207" x2="390" y2="207" stroke="#4a90d9" stroke-width="1.6"/>
  <polygon points="390,207 385,205 385,209" fill="#4a90d9"/>
  <line x1="350" y1="193" x2="395" y2="193" stroke="#4a90d9" stroke-width="1.6"/>
  <polygon points="395,193 390,191 390,195" fill="#4a90d9"/>
  <!-- profile envelope -->
  <path d="M 350 250 L 356 245 L 366 234 L 380 221 L 390 207 L 395 193"
        fill="none" stroke="#4a90d9" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="298" y="330" fill="#4a90d9" font-size="12">no-slip: u = 0 at wall</text>

  <!-- ===== wall gradient callout ===== -->
  <line x1="150" y1="250" x2="150" y2="216" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="2 3"/>
  <circle cx="150" cy="250" r="3" fill="#e0645c"/>
  <line x1="150" y1="250" x2="184" y2="230" stroke="#e0645c" stroke-width="2"/>
  <polygon points="184,230 174,230 179,238" fill="#e0645c"/>
  <text x="150" y="70" fill="#e0645c">h = &#8722;k&#8348; (&#8706;T/&#8706;y)|&#8320; / (T&#8347; &#8722; T&#8734;)</text>
  <line x1="205" y1="76" x2="176" y2="228" stroke="#e0645c" stroke-width="0.8" stroke-dasharray="2 3"/>
</svg>
