<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="70" y="22" fill="#8a8a8a" font-style="italic">Hotter bodies emit more at every &#955;, and their peak marches to shorter &#955; (Wien locus, dashed).</text>

  <!-- x axis -->
  <line x1="70" y1="250" x2="575" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="575,250 565,245 565,255" fill="#8a8a8a"/>
  <!-- y axis -->
  <line x1="70" y1="250" x2="70" y2="40" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,40 65,50 75,50" fill="#8a8a8a"/>

  <!-- x ticks -->
  <line x1="168" y1="250" x2="168" y2="255" stroke="#8a8a8a" stroke-width="1"/>
  <text x="162" y="270" fill="#8a8a8a">2</text>
  <line x1="266" y1="250" x2="266" y2="255" stroke="#8a8a8a" stroke-width="1"/>
  <text x="260" y="270" fill="#8a8a8a">4</text>
  <line x1="364" y1="250" x2="364" y2="255" stroke="#8a8a8a" stroke-width="1"/>
  <text x="358" y="270" fill="#8a8a8a">6</text>
  <line x1="462" y1="250" x2="462" y2="255" stroke="#8a8a8a" stroke-width="1"/>
  <text x="456" y="270" fill="#8a8a8a">8</text>
  <line x1="560" y1="250" x2="560" y2="255" stroke="#8a8a8a" stroke-width="1"/>
  <text x="551" y="270" fill="#8a8a8a">10</text>
  <text x="360" y="292" fill="#8a8a8a">Wavelength &#955; (&#956;m)</text>

  <!-- y axis label -->
  <text x="20" y="205" fill="#8a8a8a" transform="rotate(-90 20 205)">Spectral emissive power &#8594;</text>

  <!-- Wien locus (dashed) through the peaks -->
  <path d="M 183.6 45.0 L 188.3 82.8 L 193.5 114.9 L 199.1 141.8 L 205.2 164.3 L 212.0 182.8 L 219.5 198.0 L 227.8 210.3 L 237.1 220.2"
        fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="243" y="222" fill="#8a8a8a" font-size="12">&#955;&#8320;&#8321;&#8320;T = const</text>

  <!-- lower T curve (blue) -->
  <path d="M 72.5 250.0 L 111.7 249.8 L 131.3 243.6 L 150.9 223.9 L 170.5 201.7 L 190.1 187.5 L 209.7 182.9 L 229.3 184.8 L 258.7 193.6 L 297.9 207.3 L 356.6 223.3 L 415.4 233.2 L 474.2 239.2 L 533.0 242.8 L 557.5 243.8"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- higher T curve (coral) -->
  <path d="M 72.5 250.0 L 101.8 249.7 L 111.7 244.2 L 121.4 223.5 L 131.3 185.9 L 141.1 141.2 L 150.9 100.7 L 160.7 70.7 L 170.5 52.7 L 180.3 45.5 L 190.1 46.5 L 204.8 58.1 L 224.4 82.6 L 253.8 121.6 L 297.9 167.4 L 356.6 203.6 L 415.4 222.7 L 474.2 233.2 L 533.0 239.1 L 557.5 240.8"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>

  <!-- peak markers -->
  <circle cx="183.6" cy="45.0" r="3.5" fill="#e0645c"/>
  <circle cx="212.0" cy="182.8" r="3.5" fill="#4a90d9"/>

  <!-- curve labels -->
  <text x="205" y="40" fill="#e0645c">higher T</text>
  <text x="250" y="180" fill="#4a90d9">lower T</text>
</svg>
