<svg viewBox="0 0 620 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="60" y="22" fill="#8a8a8a" font-style="italic">Counterflow: effectiveness &#949; climbs with size NTU and saturates below 1; a smaller Cr reaches higher.</text>

  <!-- thermodynamic ceiling epsilon = 1 -->
  <line x1="70" y1="70" x2="560" y2="70" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- axes -->
  <line x1="70" y1="320" x2="575" y2="320" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="575,320 565,315 565,325" fill="#8a8a8a"/>
  <line x1="70" y1="320" x2="70" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,55 65,65 75,65" fill="#8a8a8a"/>

  <!-- x ticks -->
  <line x1="168" y1="320" x2="168" y2="325" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="266" y1="320" x2="266" y2="325" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="364" y1="320" x2="364" y2="325" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="462" y1="320" x2="462" y2="325" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="560" y1="320" x2="560" y2="325" stroke="#8a8a8a" stroke-width="1"/>
  <text x="66" y="338" fill="#8a8a8a">0</text>
  <text x="164" y="338" fill="#8a8a8a">1</text>
  <text x="262" y="338" fill="#8a8a8a">2</text>
  <text x="360" y="338" fill="#8a8a8a">3</text>
  <text x="458" y="338" fill="#8a8a8a">4</text>
  <text x="556" y="338" fill="#8a8a8a">5</text>
  <text x="300" y="362" fill="#8a8a8a">NTU = UA / C min</text>

  <!-- y ticks -->
  <line x1="65" y1="320" x2="70" y2="320" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="65" y1="195" x2="70" y2="195" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="65" y1="70" x2="70" y2="70" stroke="#8a8a8a" stroke-width="1"/>
  <text x="40" y="324" fill="#8a8a8a">0</text>
  <text x="30" y="199" fill="#8a8a8a">0.5</text>
  <text x="40" y="74" fill="#8a8a8a">1</text>
  <text x="18" y="180" fill="#8a8a8a" transform="rotate(-90 18 180)">effectiveness &#949;</text>

  <!-- Cr = 1 curve (grey, heavier than axes) -->
  <path d="M 70 320 L 119 236.7 L 168 195 L 217 170 L 266 153.3 L 315 141.4 L 364 132.5 L 413 125.5 L 462 120 L 511 115.4 L 560 111.7"
        fill="none" stroke="#8a8a8a" stroke-width="2.5"/>
  <!-- Cr = 0 curve (blue) -->
  <path d="M 70 320 L 119 221.6 L 168 162.0 L 217 125.8 L 266 103.8 L 315 90.5 L 364 82.4 L 413 77.5 L 462 74.6 L 511 72.8 L 560 71.7"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <!-- Cr = 0.5 curve (coral, the worked example) -->
  <path d="M 70 320 L 119 229.4 L 168 178.8 L 217 147.3 L 266 126.3 L 315 111.8 L 364 101.4 L 413 93.8 L 462 88.1 L 511 83.9 L 560 80.7"
        fill="none" stroke="#e0645c" stroke-width="3"/>

  <!-- worked-example marker: NTU = 1.5, eps = 0.69 on Cr = 0.5 -->
  <line x1="217" y1="320" x2="217" y2="147.3" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="70" y1="147.3" x2="217" y2="147.3" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="217" cy="147.3" r="4.5" fill="#e0645c"/>
  <text x="224" y="143" fill="#e0645c">&#949; &#8776; 0.69</text>

  <!-- curve labels -->
  <text x="470" y="66" fill="#4a90d9">Cr = 0</text>
  <text x="470" y="94" fill="#e0645c">Cr = 0.5</text>
  <text x="470" y="126" fill="#8a8a8a">Cr = 1</text>
</svg>
