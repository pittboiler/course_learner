<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="70" y="22" fill="#8a8a8a" font-style="italic" font-size="13">Pool boiling curve: heat flux q'' vs excess temperature (saturated water, 1 atm; log&#8211;log, schematic).</text>

  <!-- axes -->
  <line x1="70" y1="340" x2="618" y2="340" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="618,340 608,335 608,345" fill="#8a8a8a"/>
  <line x1="70" y1="340" x2="70" y2="46" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,46 65,56 75,56" fill="#8a8a8a"/>

  <!-- axis titles -->
  <text x="632" y="356" fill="#8a8a8a" text-anchor="end">log &#916;T<tspan baseline-shift="sub" font-size="10">e</tspan> = T<tspan baseline-shift="sub" font-size="10">s</tspan> &#8722; T<tspan baseline-shift="sub" font-size="10">sat</tspan></text>
  <text x="0" transform="translate(24,240) rotate(-90)" fill="#8a8a8a">log q'' (W/m<tspan baseline-shift="super" font-size="10">2</tspan>)</text>

  <!-- regime separators (at ONB, CHF, Leidenfrost) -->
  <line x1="165" y1="340" x2="165" y2="92" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="335" y1="340" x2="335" y2="92" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="485" y1="340" x2="485" y2="92" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- regime labels -->
  <text x="117" y="72" fill="#8a8a8a" text-anchor="middle" font-size="12">free</text>
  <text x="117" y="86" fill="#8a8a8a" text-anchor="middle" font-size="12">convection</text>
  <text x="250" y="72" fill="#8a8a8a" text-anchor="middle" font-size="12">nucleate</text>
  <text x="250" y="86" fill="#8a8a8a" text-anchor="middle" font-size="12">boiling</text>
  <text x="410" y="72" fill="#8a8a8a" text-anchor="middle" font-size="12">transition</text>
  <text x="551" y="72" fill="#8a8a8a" text-anchor="middle" font-size="12">film</text>
  <text x="551" y="86" fill="#8a8a8a" text-anchor="middle" font-size="12">boiling</text>

  <!-- the boiling curve -->
  <path d="M 85 322 C 115 314 142 302 165 288 C 205 268 262 150 335 72 C 378 105 440 200 485 235 C 528 218 568 183 600 152"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- burnout jump: push past CHF at fixed flux -> leap to film boiling, T soars -->
  <line x1="335" y1="72" x2="588" y2="72" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="588,72 578,67 578,77" fill="#e0645c"/>
  <text x="470" y="60" fill="#e0645c" text-anchor="middle" font-size="12">burnout jump (fixed q'')</text>

  <!-- key points -->
  <circle cx="165" cy="288" r="4" fill="#e0645c"/>
  <text x="152" y="308" fill="#e0645c" text-anchor="end" font-size="12">ONB</text>

  <circle cx="335" cy="72" r="5" fill="#e0645c"/>
  <text x="345" y="112" fill="#e0645c" font-size="12">CHF peak q''<tspan baseline-shift="sub" font-size="9">max</tspan></text>
  <text x="345" y="128" fill="#e0645c" font-size="12">(~1 MW/m<tspan baseline-shift="super" font-size="9">2</tspan>, DNB / burnout)</text>

  <circle cx="485" cy="235" r="4" fill="#e0645c"/>
  <text x="497" y="252" fill="#e0645c" font-size="12">Leidenfrost min</text>

  <!-- x tick labels (approx, water @1atm) -->
  <text x="165" y="356" fill="#8a8a8a" text-anchor="middle" font-size="11">~5</text>
  <text x="335" y="356" fill="#8a8a8a" text-anchor="middle" font-size="11">~30</text>
  <text x="485" y="356" fill="#8a8a8a" text-anchor="middle" font-size="11">~120</text>
  <text x="600" y="356" fill="#8a8a8a" text-anchor="middle" font-size="11">~1000</text>
  <text x="70" y="374" fill="#8a8a8a" text-anchor="middle" font-size="10">&#916;T<tspan baseline-shift="sub" font-size="8">e</tspan> (&#176;C):</text>
</svg>
