<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Temperature bleeds off along the fin: hot at the base, coasting toward T&#8734; at the tip (flat slope = adiabatic tip).</text>

  <!-- theta axis -->
  <line x1="80" y1="185" x2="80" y2="46" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="80,46 75,56 85,56" fill="#8a8a8a"/>
  <text x="58" y="58" fill="#8a8a8a">&#952;</text>

  <!-- baseline: theta = 0 (fluid at T-infinity) -->
  <line x1="80" y1="180" x2="480" y2="180" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="486" y="184" fill="#8a8a8a">&#952; = 0  (T&#8734;)</text>

  <!-- theta(x) profile -->
  <path d="M 80 60 L 118 74.8 L 156 87.6 L 194 98.3 L 232 106.9 L 270 114 L 308 119.5 L 346 123.7 L 384 126.7 L 422 128.4 L 460 129"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="150" y="72" fill="#4a90d9">&#952;(x) = T(x) &#8722; T&#8734;</text>

  <!-- theta_b marker at base -->
  <line x1="66" y1="180" x2="66" y2="60" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="66,60 62,69 70,69" fill="#e0645c"/>
  <polygon points="66,180 62,171 70,171" fill="#e0645c"/>
  <text x="40" y="124" fill="#e0645c">&#952;<tspan dy="4" font-size="10">b</tspan></text>

  <!-- link curve tip down to fin tip -->
  <line x1="460" y1="129" x2="460" y2="220" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- ===== fin schematic ===== -->

  <!-- wall / base structure -->
  <line x1="80" y1="205" x2="80" y2="285" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="80" y1="209" x2="72" y2="219" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="80" y1="225" x2="72" y2="235" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="80" y1="241" x2="72" y2="251" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="80" y1="257" x2="72" y2="267" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="80" y1="273" x2="72" y2="283" stroke="#8a8a8a" stroke-width="1"/>

  <!-- fin body -->
  <rect x="80" y="230" width="380" height="30" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>

  <!-- convective loss arrows off the top face -->
  <line x1="140" y1="230" x2="140" y2="212" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="140,212 136,221 144,221" fill="#e0645c"/>
  <line x1="240" y1="230" x2="240" y2="212" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="240,212 236,221 244,221" fill="#e0645c"/>
  <line x1="340" y1="230" x2="340" y2="212" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="340,212 336,221 344,221" fill="#e0645c"/>
  <text x="352" y="210" fill="#e0645c">h, T&#8734;</text>

  <!-- base / tip labels -->
  <text x="84" y="303" fill="#8a8a8a">base (x = 0)</text>
  <text x="410" y="303" fill="#8a8a8a">tip (x = L)</text>

  <!-- L dimension -->
  <line x1="80" y1="277" x2="460" y2="277" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="80,277 89,273 89,281" fill="#8a8a8a"/>
  <polygon points="460,277 451,273 451,281" fill="#8a8a8a"/>
  <text x="266" y="273" fill="#8a8a8a">L</text>
</svg>
