<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Two gray surfaces as a resistor network: a surface resistance at each surface, a space resistance in the gap.</text>

  <!-- ===== the two physical plates ===== -->
  <rect x="95" y="52" width="120" height="14" fill="#8a8a8a" opacity="0.30" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="98" y="45" fill="#e0645c">Surface 1: T&#8321;, &#949;&#8321;</text>
  <rect x="485" y="52" width="120" height="14" fill="#8a8a8a" opacity="0.30" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="488" y="45" fill="#4a90d9">Surface 2: T&#8322;, &#949;&#8322;</text>

  <!-- radiation exchange arrow across the gap -->
  <line x1="220" y1="59" x2="480" y2="59" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 4"/>
  <polygon points="480,59 470,55 470,63" fill="#8a8a8a"/>
  <polygon points="220,59 230,55 230,63" fill="#8a8a8a"/>
  <text x="300" y="82" fill="#8a8a8a" font-style="italic">radiation exchange</text>

  <!-- dashed drops from each plate to its E_b node -->
  <line x1="155" y1="66" x2="155" y2="135" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="545" y1="66" x2="545" y2="135" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ===== the resistance network (baseline y=150) ===== -->
  <!-- connecting wires -->
  <line x1="45" y1="150" x2="95" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="215" y1="150" x2="250" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="250" y1="150" x2="290" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="410" y1="150" x2="445" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="445" y1="150" x2="485" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="605" y1="150" x2="655" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- surface resistance 1 (coral) -->
  <rect x="95" y="128" width="120" height="44" rx="4" fill="#e0645c" opacity="0.16" stroke="#e0645c" stroke-width="1.5"/>
  <text x="155" y="147" fill="#e0645c" text-anchor="middle" font-size="12">surface R</text>
  <text x="155" y="164" fill="#e0645c" text-anchor="middle" font-size="12">(1&#8722;&#949;&#8321;)/(&#949;&#8321;A&#8321;)</text>

  <!-- space resistance (blue) -->
  <rect x="290" y="128" width="120" height="44" rx="4" fill="#4a90d9" opacity="0.16" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="350" y="147" fill="#4a90d9" text-anchor="middle" font-size="12">space R</text>
  <text x="350" y="164" fill="#4a90d9" text-anchor="middle" font-size="12">1/(A&#8321;F&#8321;&#8322;)</text>

  <!-- surface resistance 2 (coral) -->
  <rect x="485" y="128" width="120" height="44" rx="4" fill="#e0645c" opacity="0.16" stroke="#e0645c" stroke-width="1.5"/>
  <text x="545" y="147" fill="#e0645c" text-anchor="middle" font-size="12">surface R</text>
  <text x="545" y="164" fill="#e0645c" text-anchor="middle" font-size="12">(1&#8722;&#949;&#8322;)/(&#949;&#8322;A&#8322;)</text>

  <!-- nodes -->
  <circle cx="45" cy="150" r="5" fill="#8a8a8a"/>
  <circle cx="250" cy="150" r="5" fill="#8a8a8a"/>
  <circle cx="445" cy="150" r="5" fill="#8a8a8a"/>
  <circle cx="655" cy="150" r="5" fill="#8a8a8a"/>

  <!-- node labels -->
  <text x="45" y="120" fill="#8a8a8a" text-anchor="middle">Eb&#8321;</text>
  <text x="45" y="200" fill="#8a8a8a" text-anchor="middle" font-size="12">&#963;T&#8321;&#8308;</text>
  <text x="250" y="120" fill="#8a8a8a" text-anchor="middle">J&#8321;</text>
  <text x="445" y="120" fill="#8a8a8a" text-anchor="middle">J&#8322;</text>
  <text x="655" y="120" fill="#8a8a8a" text-anchor="middle">Eb&#8322;</text>
  <text x="655" y="200" fill="#8a8a8a" text-anchor="middle" font-size="12">&#963;T&#8322;&#8308;</text>

  <!-- heat-flow arrow along the network -->
  <line x1="120" y1="228" x2="590" y2="228" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="590,228 578,222 578,234" fill="#e0645c"/>
  <text x="300" y="221" fill="#e0645c" font-size="12">q&#8321;&#8322;  (heat flows through the three resistances in series)</text>

  <!-- legend -->
  <text x="30" y="270" fill="#e0645c" font-size="12">coral = surface resistance (real-surface penalty, &#949; &#60; 1)</text>
  <text x="400" y="270" fill="#4a90d9" font-size="12">blue = space resistance (geometry, view factor)</text>
</svg>
