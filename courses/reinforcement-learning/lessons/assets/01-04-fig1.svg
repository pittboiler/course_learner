  <text x="748" y="229.333" font-size="8.399999999999999" fill="#8a8a8a">1</text>
  <text x="752.67" y="225.333" font-size="12" fill="#8a8a8a">)</text>
  <text x="492" y="58" font-size="12" fill="#8a8a8a">V(s</text>
