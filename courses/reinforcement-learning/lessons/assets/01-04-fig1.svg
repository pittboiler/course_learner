<svg viewBox="0 0 790 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Two policies can each be better somewhere. The theorem says a single policy always sits at the top right.</text>
