  <text x="710" y="268.444" text-anchor="end" font-size="11.5" fill="#8a8a8a">A = (trade, hold)</text>
  <text x="496" y="142.667" text-anchor="end" font-size="11.5" fill="#8a8a8a">B = (idle, move)</text>
  <text x="710" y="83.5556" text-anchor="end" font-size="12" fill="#4a90d9" font-weight="bold">C = (trade, move)</text>
  <text x="496" y="250.444" text-anchor="end" font-size="11.5" fill="#8a8a8a">D = (idle, hold)</text>
  <text x="617.6" y="112.556" text-anchor="middle" font-size="11.5" fill="#e0645c">better than both</text>
  <text x="605" y="316" text-anchor="middle" font-size="11.5" fill="#8a8a8a" font-style="italic">Each dashed corner is a dominance region; C lies inside both.</text>
</svg>
