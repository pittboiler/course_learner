  <text x="32" y="272" font-size="8.399999999999999" fill="#e0645c">1</text>
  <text x="36.6704" y="268" font-size="12" fill="#e0645c">:  trade r = 5   or   idle r = -1   -   both stay</text>
  <text x="26" y="290" font-size="12" fill="#8a8a8a">s</text>
  <text x="32" y="294" font-size="8.399999999999999" fill="#8a8a8a">2</text>
  <text x="36.6704" y="290" font-size="12" fill="#8a8a8a">:  hold r = -2, stays   or   move r = 5,</text>
  <text x="54" y="308" font-size="12" fill="#8a8a8a">half to s</text>
  <text x="96.024" y="312" font-size="8.399999999999999" fill="#8a8a8a">1</text>
  <text x="100.694" y="308" font-size="12" fill="#8a8a8a">, half stays</text>
  <text x="214" y="238" text-anchor="middle" font-size="12.5" fill="#8a8a8a" font-style="italic">gamma = 1/2</text>
