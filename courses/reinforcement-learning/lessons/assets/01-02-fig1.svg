<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">The same observation, two different futures - until the state is enlarged enough to tell them apart.</text>
  <rect x="40" y="60" width="300" height="170" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="190" y="250" text-anchor="middle" font-size="12.5" fill="#8a8a8a">observation = ball position only</text>
  <circle cx="205" cy="145" r="9" fill="#4a90d9" stroke="#4a90d9" stroke-width="2" opacity="0.25"/>
  <circle cx="205" cy="145" r="9" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <line x1="194" y1="141" x2="140.108" y2="105.661" stroke="#e0645c" stroke-width="1.8" stroke-dasharray="5 4"/>
  <polygon points="133,101 138.621,110.665 144.104,102.302" fill="#e0645c" stroke="none" stroke-width="1"/>
  <line x1="194" y1="149" x2="140.108" y2="184.339" stroke="#e0645c" stroke-width="1.8" stroke-dasharray="5 4"/>
  <polygon points="133,189 144.104,187.698 138.621,179.335" fill="#e0645c" stroke="none" stroke-width="1"/>
  <text x="109" y="93" fill="#e0645c">or</text>
  <text x="221" y="150" font-size="20" fill="#e0645c">?</text>
  <text x="52" y="78" fill="#e0645c" font-weight="bold">NOT Markov</text>
  <rect x="420" y="60" width="300" height="170" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="570" y="250" text-anchor="middle" font-size="12.5" fill="#8a8a8a">observation = this frame and the last one</text>
  <circle cx="629" cy="175" r="9" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="631" y="205" text-anchor="middle" font-size="11" fill="#8a8a8a">t - 1</text>
  <circle cx="585" cy="145" r="9" fill="#4a90d9" stroke="#4a90d9" stroke-width="2" opacity="0.25"/>
  <circle cx="585" cy="145" r="9" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="585" y="125" text-anchor="middle" font-size="11" fill="#4a90d9">t</text>
  <line x1="622" y1="170" x2="592" y2="150" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="576" y1="139" x2="522.001" y2="101.82" stroke="#e0645c" stroke-width="2.2"/>
  <polygon points="515,97 520.401,106.789 526.072,98.5528" fill="#e0645c" stroke="none" stroke-width="1"/>
  <text x="481" y="89" fill="#e0645c">determined</text>
  <text x="432" y="78" fill="#4a90d9" font-weight="bold">Markov</text>
  <text x="380" y="296" text-anchor="middle" font-size="12.5" fill="#8a8a8a" font-style="italic">Velocity was never missing from the world - only from the state.</text>
</svg>
