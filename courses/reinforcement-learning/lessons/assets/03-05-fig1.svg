<svg viewBox="0 0 790 352" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">The critic does not just centre the return - it replaces everything downstream with an estimate of its mean.</text>
