  <text x="136" y="150" font-size="11" fill="#e0645c">- the TD error, used twice</text>
  <text x="20" y="336" font-size="11.5" fill="#8a8a8a" font-style="italic">the critic trains itself on δ and hands the same δ to the actor</text>
