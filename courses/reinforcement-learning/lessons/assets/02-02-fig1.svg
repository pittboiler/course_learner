  <polygon points="242,200 233.872,192.323 230.982,201.897" fill="#8a8a8a" stroke="none" stroke-width="1"/>
  <text x="134" y="202" font-size="12" fill="#8a8a8a">B:  r = 0</text>
  <line x1="298" y1="200" x2="343.387" y2="163.341" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="350,158 339.079,160.394 345.362,168.173" fill="#8a8a8a" stroke="none" stroke-width="1"/>
  <rect x="350" y="136" width="26" height="26" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="363" y="154" text-anchor="middle" fill="#8a8a8a">T</text>
  <text x="304" y="142" font-size="12" fill="#8a8a8a">r = +10</text>
  <text x="60" y="296" fill="#8a8a8a">Q*(s, A) = 1     but     Q*(s, B) = 10</text>
  <text x="60" y="318" font-size="12" fill="#8a8a8a" font-style="italic">and a greedy agent that tries A first never tries B again.</text>
