  <rect x="168" y="54" width="26" height="26" fill="none" stroke="#e0645c" stroke-width="1.8"/>
  <text x="181" y="72" text-anchor="middle" fill="#e0645c">T</text>
  <text x="204" y="66" font-size="12" fill="#e0645c">A:  r = +1</text>
