  <line x1="465" y1="171" x2="470" y2="171" stroke="#8a8a8a" stroke-width="1.1"/>
  <text x="461" y="175" text-anchor="end" font-size="10.5" fill="#8a8a8a">0.5</text>
  <line x1="465" y1="80" x2="470" y2="80" stroke="#8a8a8a" stroke-width="1.1"/>
  <text x="461" y="84" text-anchor="end" font-size="10.5" fill="#8a8a8a">1</text>
  <line x1="470" y1="262" x2="470" y2="267" stroke="#8a8a8a" stroke-width="1.1"/>
  <text x="470" y="281" text-anchor="middle" font-size="10.5" fill="#8a8a8a">0</text>
  <line x1="564.667" y1="262" x2="564.667" y2="267" stroke="#8a8a8a" stroke-width="1.1"/>
  <text x="564.667" y="281" text-anchor="middle" font-size="10.5" fill="#8a8a8a">40</text>
  <line x1="659.333" y1="262" x2="659.333" y2="267" stroke="#8a8a8a" stroke-width="1.1"/>
  <text x="659.333" y="281" text-anchor="middle" font-size="10.5" fill="#8a8a8a">80</text>
  <line x1="754" y1="262" x2="754" y2="267" stroke="#8a8a8a" stroke-width="1.1"/>
  <text x="754" y="281" text-anchor="middle" font-size="10.5" fill="#8a8a8a">120</text>
