<svg viewBox="0 0 790 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">A greedy policy seals its own blind spot: the action it never tries keeps the estimate that stopped it.</text>
  <circle cx="110" cy="150" r="30" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="105" y="155" font-size="16" fill="#4a90d9">s</text>
