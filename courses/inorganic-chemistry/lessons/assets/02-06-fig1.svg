<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Change the geometry, change the splitting: tetrahedral inverts and shrinks it; square-planar spreads it into four levels.</text>

  <!-- panel titles -->
  <text x="120" y="52" fill="#8a8a8a" font-weight="bold">Tetrahedral (T<tspan baseline-shift="sub" font-size="10">d</tspan>)</text>
  <text x="430" y="52" fill="#8a8a8a" font-weight="bold">Square planar (D<tspan baseline-shift="sub" font-size="10">4h</tspan>)</text>

  <!-- ===== left: tetrahedral, e below t2 ===== -->

  <!-- barycenter reference -->
  <line x1="60" y1="185" x2="270" y2="185" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="60" y="178" fill="#8a8a8a" font-size="11">barycenter</text>

  <!-- t2 (upper) -->
  <line x1="120" y1="130" x2="210" y2="130" stroke="#4a90d9" stroke-width="3"/>
  <text x="122" y="122" fill="#4a90d9" font-size="12">t<tspan baseline-shift="sub" font-size="9">2</tspan> :  d<tspan baseline-shift="sub" font-size="9">xy</tspan>, d<tspan baseline-shift="sub" font-size="9">xz</tspan>, d<tspan baseline-shift="sub" font-size="9">yz</tspan></text>

  <!-- e (lower) -->
  <line x1="120" y1="240" x2="210" y2="240" stroke="#4a90d9" stroke-width="3"/>
  <text x="122" y="258" fill="#4a90d9" font-size="12">e :  d<tspan baseline-shift="sub" font-size="9">z&#178;</tspan>, d<tspan baseline-shift="sub" font-size="9">x&#178;&#8722;y&#178;</tspan></text>

  <!-- delta_t arrow -->
  <line x1="95" y1="130" x2="95" y2="240" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="95,130 91,140 99,140" fill="#e0645c"/>
  <polygon points="95,240 91,230 99,230" fill="#e0645c"/>
  <text x="26" y="182" fill="#e0645c">&#916;<tspan baseline-shift="sub" font-size="10">t</tspan></text>
  <text x="14" y="200" fill="#e0645c" font-size="11">&#8776; 4/9 &#916;<tspan baseline-shift="sub" font-size="8">o</tspan></text>

  <!-- ===== right: square planar, four levels ===== -->

  <!-- dx2-y2 (top, far up) -->
  <line x1="430" y1="82" x2="520" y2="82" stroke="#e0645c" stroke-width="3"/>
  <text x="526" y="87" fill="#e0645c" font-size="12">d<tspan baseline-shift="sub" font-size="9">x&#178;&#8722;y&#178;</tspan></text>

  <!-- dxy -->
  <line x1="430" y1="190" x2="520" y2="190" stroke="#e0645c" stroke-width="3"/>
  <text x="526" y="195" fill="#e0645c" font-size="12">d<tspan baseline-shift="sub" font-size="9">xy</tspan></text>

  <!-- dz2 -->
  <line x1="430" y1="225" x2="520" y2="225" stroke="#e0645c" stroke-width="3"/>
  <text x="526" y="230" fill="#e0645c" font-size="12">d<tspan baseline-shift="sub" font-size="9">z&#178;</tspan></text>

  <!-- dxz, dyz (lowest) -->
  <line x1="430" y1="258" x2="520" y2="258" stroke="#e0645c" stroke-width="3"/>
  <text x="526" y="263" fill="#e0645c" font-size="12">d<tspan baseline-shift="sub" font-size="9">xz</tspan>, d<tspan baseline-shift="sub" font-size="9">yz</tspan></text>

  <!-- big d8 gap arrow -->
  <line x1="405" y1="82" x2="405" y2="190" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="405,82 401,92 409,92" fill="#8a8a8a"/>
  <polygon points="405,190 401,180 409,180" fill="#8a8a8a"/>
  <text x="352" y="132" fill="#8a8a8a" font-size="12">large</text>
  <text x="352" y="148" fill="#8a8a8a" font-size="12">gap (d<tspan baseline-shift="super" font-size="9">8</tspan>)</text>

  <!-- lower four note -->
  <text x="430" y="300" fill="#8a8a8a" font-size="11">d<tspan baseline-shift="super" font-size="8">8</tspan>: all 8 e<tspan baseline-shift="super" font-size="8">&#8722;</tspan> fill the lower four &#8594; diamagnetic</text>
</svg>
