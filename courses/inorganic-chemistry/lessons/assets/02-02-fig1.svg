<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ahBlue" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4a90d9"/></marker>
    <marker id="ahCoral" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e0645c"/></marker>
    <marker id="ahGrey" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8a8a8a"/></marker>
  </defs>

  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">One name, one formula: each fragment of the name maps to a piece of [Co(NH&#8323;)&#8325;Cl]Cl&#8322;.</text>

  <!-- ===== coordination-sphere box ===== -->
  <rect x="200" y="64" width="172" height="46" rx="6" fill="#4a90d9" opacity="0.10"/>
  <rect x="200" y="64" width="172" height="46" rx="6" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="204" y="58" fill="#4a90d9" font-size="12">coordination sphere (named inside the brackets)</text>
  <text x="392" y="58" fill="#8a8a8a" font-size="12">counterion</text>

  <!-- ===== formula (blue = in the sphere, grey = counterion, coral = charge) ===== -->
  <text x="204" y="98" fill="#4a90d9" font-size="24">[</text>
  <text x="216" y="98" fill="#4a90d9" font-size="24">Co</text>
  <text x="250" y="98" fill="#4a90d9" font-size="24">(NH&#8323;)&#8325;</text>
  <text x="322" y="98" fill="#4a90d9" font-size="24">Cl</text>
  <text x="352" y="98" fill="#4a90d9" font-size="24">]</text>
  <text x="364" y="84" fill="#e0645c" font-size="15">2+</text>
  <text x="392" y="98" fill="#8a8a8a" font-size="24">Cl&#8322;</text>

  <!-- ===== oxidation-state bookkeeping (coral) ===== -->
  <rect x="470" y="62" width="222" height="104" rx="6" fill="#e0645c" opacity="0.08"/>
  <rect x="470" y="62" width="222" height="104" rx="6" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="482" y="84" fill="#e0645c" font-size="13" font-weight="bold">Oxidation-state bookkeeping</text>
  <text x="482" y="106" fill="#e0645c" font-size="13">2 Cl&#8315; outside &#8658; complex ion = +2</text>
  <text x="482" y="128" fill="#e0645c" font-size="13">Co + 5&#183;(0) + (&#8722;1) = +2</text>
  <text x="482" y="150" fill="#e0645c" font-size="13">&#8658; Co = +3  &#8594;  cobalt(III)</text>

  <!-- ===== connector arrows (name fragment -> formula piece) ===== -->
  <line x1="93"  y1="257" x2="312" y2="102" stroke="#4a90d9" stroke-width="1" opacity="0.7" marker-end="url(#ahBlue)"/>
  <line x1="148" y1="257" x2="283" y2="102" stroke="#4a90d9" stroke-width="1" opacity="0.7" marker-end="url(#ahBlue)"/>
  <line x1="218" y1="257" x2="332" y2="102" stroke="#4a90d9" stroke-width="1" opacity="0.7" marker-end="url(#ahBlue)"/>
  <line x1="291" y1="257" x2="232" y2="102" stroke="#4a90d9" stroke-width="1" opacity="0.7" marker-end="url(#ahBlue)"/>
  <line x1="337" y1="257" x2="478" y2="164" stroke="#e0645c" stroke-width="1" opacity="0.8" marker-end="url(#ahCoral)"/>
  <line x1="408" y1="257" x2="408" y2="102" stroke="#8a8a8a" stroke-width="1" opacity="0.7" marker-end="url(#ahGrey)"/>

  <!-- ===== name fragments ===== -->
  <text x="70"  y="272" fill="#4a90d9">penta</text>
  <text x="118" y="272" fill="#4a90d9">ammine</text>
  <text x="182" y="272" fill="#4a90d9">chlorido</text>
  <text x="262" y="272" fill="#4a90d9">cobalt</text>
  <text x="322" y="272" fill="#e0645c">(III)</text>
  <text x="372" y="272" fill="#8a8a8a">chloride</text>

  <!-- reorder note -->
  <text x="70" y="302" fill="#8a8a8a" font-size="12">Ligands alphabetical (ammine &lt; chlorido), then the metal; the counterion is named last.</text>
</svg>
