<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Born&#8211;Haber cycle for MgO: climb the measurable steps (blue up, grey down), and the lattice drop (coral) must close the loop back to &#916;Hf.</text>

  <!-- energy axis -->
  <line x1="40" y1="410" x2="40" y2="50" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="40,50 35,60 45,60" fill="#8a8a8a"/>
  <text x="16" y="230" fill="#8a8a8a" transform="rotate(-90 16 230)">enthalpy</text>

  <!-- ===== level lines ===== -->
  <!-- L0 elements -->
  <line x1="60" y1="330" x2="150" y2="330" stroke="#8a8a8a" stroke-width="2"/>
  <text x="60" y="322" fill="#8a8a8a">Mg(s) + &#189;O&#8322;(g)</text>
  <!-- L1 after sublimation -->
  <line x1="150" y1="302" x2="230" y2="302" stroke="#8a8a8a" stroke-width="2"/>
  <!-- L2 after atomization -->
  <line x1="230" y1="276" x2="310" y2="276" stroke="#8a8a8a" stroke-width="2"/>
  <text x="232" y="270" fill="#8a8a8a">Mg(g) + O(g)</text>
  <!-- L3 after IE1 -->
  <line x1="310" y1="228" x2="390" y2="228" stroke="#8a8a8a" stroke-width="2"/>
  <!-- L4 after IE2 -->
  <line x1="390" y1="110" x2="470" y2="110" stroke="#8a8a8a" stroke-width="2"/>
  <text x="392" y="104" fill="#8a8a8a">Mg&#178;&#8314;(g) + O(g)</text>
  <!-- L5 after EA1 -->
  <line x1="470" y1="142" x2="545" y2="142" stroke="#8a8a8a" stroke-width="2"/>
  <!-- L6 after EA2 (top) -->
  <line x1="545" y1="88" x2="620" y2="88" stroke="#8a8a8a" stroke-width="2"/>
  <text x="470" y="80" fill="#8a8a8a">Mg&#178;&#8314;(g) + O&#178;&#8315;(g)</text>
  <!-- product baseline -->
  <line x1="60" y1="402" x2="620" y2="402" stroke="#8a8a8a" stroke-width="2"/>
  <text x="548" y="420" fill="#8a8a8a">MgO(s)</text>

  <!-- ===== step arrows ===== -->
  <!-- sublimation up -->
  <line x1="150" y1="330" x2="150" y2="302" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="150,302 146,311 154,311" fill="#4a90d9"/>
  <text x="156" y="320" fill="#4a90d9">sublim.</text>
  <!-- atomization up -->
  <line x1="230" y1="302" x2="230" y2="276" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="230,276 226,285 234,285" fill="#4a90d9"/>
  <text x="236" y="295" fill="#4a90d9">&#189;D(O&#8322;)</text>
  <!-- IE1 up -->
  <line x1="310" y1="276" x2="310" y2="228" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="310,228 306,237 314,237" fill="#4a90d9"/>
  <text x="316" y="256" fill="#4a90d9">IE&#8321;</text>
  <!-- IE2 up (big) -->
  <line x1="390" y1="228" x2="390" y2="110" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="390,110 386,119 394,119" fill="#4a90d9"/>
  <text x="396" y="172" fill="#4a90d9">IE&#8322;</text>
  <!-- EA1 down (grey, exothermic) -->
  <line x1="470" y1="110" x2="470" y2="142" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="470,142 466,133 474,133" fill="#8a8a8a"/>
  <text x="476" y="132" fill="#8a8a8a">EA&#8321;</text>
  <!-- EA2 up (endothermic) -->
  <line x1="545" y1="142" x2="545" y2="88" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="545,88 541,97 549,97" fill="#4a90d9"/>
  <text x="551" y="118" fill="#4a90d9">EA&#8322;</text>
  <!-- lattice drop (coral, big) -->
  <line x1="582" y1="88" x2="582" y2="402" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="582,402 577,391 587,391" fill="#e0645c"/>
  <text x="588" y="250" fill="#e0645c">&#8722;U</text>
  <!-- delta Hf closure (coral) -->
  <line x1="90" y1="330" x2="90" y2="402" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="90,402 85,391 95,391" fill="#e0645c"/>
  <text x="96" y="372" fill="#e0645c">&#916;Hf</text>
</svg>
