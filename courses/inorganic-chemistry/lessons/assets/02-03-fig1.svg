<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">Same formula, different structure: cis vs trans (square planar) and the &#916;/&#923; mirror-image pair (octahedral tris-chelate).</text>

  <!-- = TOP ROW: square-planar cis vs trans = -->
  <text x="150" y="52" fill="#8a8a8a" text-anchor="middle" font-style="italic">square planar  MA&#8322;B&#8322;</text>

  <!-- cis (cisplatin): A adjacent -->
  <!-- bonds -->
  <line x1="150" y1="105" x2="150" y2="70"  stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="150" y1="105" x2="185" y2="105" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="150" y1="105" x2="150" y2="140" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="150" y1="105" x2="115" y2="105" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- metal -->
  <circle cx="150" cy="105" r="9" fill="#8a8a8a" fill-opacity="0.2" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="150" y="109" fill="#8a8a8a" text-anchor="middle" font-size="11">Pt</text>
  <!-- A ligands (top, right) blue -->
  <circle cx="150" cy="66" r="12" fill="#4a90d9" fill-opacity="0.18" stroke="#4a90d9" stroke-width="2"/>
  <text x="150" y="70" fill="#4a90d9" text-anchor="middle">A</text>
  <circle cx="189" cy="105" r="12" fill="#4a90d9" fill-opacity="0.18" stroke="#4a90d9" stroke-width="2"/>
  <text x="189" y="109" fill="#4a90d9" text-anchor="middle">A</text>
  <!-- B ligands (bottom, left) coral -->
  <circle cx="150" cy="144" r="12" fill="#e0645c" fill-opacity="0.18" stroke="#e0645c" stroke-width="2"/>
  <text x="150" y="148" fill="#e0645c" text-anchor="middle">B</text>
  <circle cx="111" cy="105" r="12" fill="#e0645c" fill-opacity="0.18" stroke="#e0645c" stroke-width="2"/>
  <text x="111" y="109" fill="#e0645c" text-anchor="middle">B</text>
  <text x="150" y="178" fill="#8a8a8a" text-anchor="middle">cis  (cisplatin)</text>

  <!-- trans (transplatin): A opposite -->
  <line x1="400" y1="105" x2="400" y2="70"  stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="400" y1="105" x2="435" y2="105" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="400" y1="105" x2="400" y2="140" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="400" y1="105" x2="365" y2="105" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="400" cy="105" r="9" fill="#8a8a8a" fill-opacity="0.2" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="400" y="109" fill="#8a8a8a" text-anchor="middle" font-size="11">Pt</text>
  <!-- A ligands (top, bottom) blue -->
  <circle cx="400" cy="66" r="12" fill="#4a90d9" fill-opacity="0.18" stroke="#4a90d9" stroke-width="2"/>
  <text x="400" y="70" fill="#4a90d9" text-anchor="middle">A</text>
  <circle cx="400" cy="144" r="12" fill="#4a90d9" fill-opacity="0.18" stroke="#4a90d9" stroke-width="2"/>
  <text x="400" y="148" fill="#4a90d9" text-anchor="middle">A</text>
  <!-- B ligands (left, right) coral -->
  <circle cx="439" cy="105" r="12" fill="#e0645c" fill-opacity="0.18" stroke="#e0645c" stroke-width="2"/>
  <text x="439" y="109" fill="#e0645c" text-anchor="middle">B</text>
  <circle cx="361" cy="105" r="12" fill="#e0645c" fill-opacity="0.18" stroke="#e0645c" stroke-width="2"/>
  <text x="361" y="109" fill="#e0645c" text-anchor="middle">B</text>
  <text x="400" y="178" fill="#8a8a8a" text-anchor="middle">trans  (transplatin)</text>

  <!-- divider -->
  <line x1="20" y1="196" x2="680" y2="196" stroke="#8a8a8a" stroke-width="0.6" stroke-dasharray="2 5"/>

  <!-- = BOTTOM ROW: octahedral tris-chelate D/L = -->
  <text x="370" y="222" fill="#8a8a8a" text-anchor="middle" font-style="italic">octahedral tris-chelate  [M(en)&#8323;]  &#8212; chiral</text>

  <!-- mirror plane -->
  <line x1="370" y1="232" x2="370" y2="352" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="370" y="368" fill="#e0645c" text-anchor="middle" font-size="12">&#963; (mirror)</text>

  <!-- Delta (blue), left -->
  <line x1="250" y1="280" x2="249.2" y2="256.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <line x1="250" y1="280" x2="262.7" y2="259.6" stroke="#8a8a8a" stroke-width="1.3"/>
  <line x1="250" y1="280" x2="271.2" y2="291.3" stroke="#8a8a8a" stroke-width="1.3"/>
  <line x1="250" y1="280" x2="261.3" y2="301.2" stroke="#8a8a8a" stroke-width="1.3"/>
  <line x1="250" y1="280" x2="229.6" y2="292.7" stroke="#8a8a8a" stroke-width="1.3"/>
  <line x1="250" y1="280" x2="226.0" y2="279.2" stroke="#8a8a8a" stroke-width="1.3"/>
  <path d="M 249.2 256.0 Q 264.0 227.8 262.7 259.6" fill="none" stroke="#4a90d9" stroke-width="2.6"/>
  <path d="M 271.2 291.3 Q 288.2 318.2 261.3 301.2" fill="none" stroke="#4a90d9" stroke-width="2.6"/>
  <path d="M 229.6 292.7 Q 197.8 294.0 226.0 279.2" fill="none" stroke="#4a90d9" stroke-width="2.6"/>
  <circle cx="249.2" cy="256.0" r="3.5" fill="#4a90d9"/>
  <circle cx="262.7" cy="259.6" r="3.5" fill="#4a90d9"/>
  <circle cx="271.2" cy="291.3" r="3.5" fill="#4a90d9"/>
  <circle cx="261.3" cy="301.2" r="3.5" fill="#4a90d9"/>
  <circle cx="229.6" cy="292.7" r="3.5" fill="#4a90d9"/>
  <circle cx="226.0" cy="279.2" r="3.5" fill="#4a90d9"/>
  <circle cx="250" cy="280" r="8" fill="#8a8a8a" fill-opacity="0.25" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="250" y="284" fill="#8a8a8a" text-anchor="middle" font-size="11">M</text>
  <text x="250" y="345" fill="#4a90d9" text-anchor="middle" font-size="16">&#916;</text>

  <!-- Lambda (coral), right -->
  <line x1="490" y1="280" x2="477.3" y2="259.6" stroke="#8a8a8a" stroke-width="1.3"/>
  <line x1="490" y1="280" x2="490.8" y2="256.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <line x1="490" y1="280" x2="514.0" y2="279.2" stroke="#8a8a8a" stroke-width="1.3"/>
  <line x1="490" y1="280" x2="510.4" y2="292.7" stroke="#8a8a8a" stroke-width="1.3"/>
  <line x1="490" y1="280" x2="478.7" y2="301.2" stroke="#8a8a8a" stroke-width="1.3"/>
  <line x1="490" y1="280" x2="468.8" y2="291.3" stroke="#8a8a8a" stroke-width="1.3"/>
  <path d="M 477.3 259.6 Q 476.0 227.8 490.8 256.0" fill="none" stroke="#e0645c" stroke-width="2.6"/>
  <path d="M 514.0 279.2 Q 542.2 294.0 510.4 292.7" fill="none" stroke="#e0645c" stroke-width="2.6"/>
  <path d="M 478.7 301.2 Q 451.8 318.2 468.8 291.3" fill="none" stroke="#e0645c" stroke-width="2.6"/>
  <circle cx="477.3" cy="259.6" r="3.5" fill="#e0645c"/>
  <circle cx="490.8" cy="256.0" r="3.5" fill="#e0645c"/>
  <circle cx="514.0" cy="279.2" r="3.5" fill="#e0645c"/>
  <circle cx="510.4" cy="292.7" r="3.5" fill="#e0645c"/>
  <circle cx="478.7" cy="301.2" r="3.5" fill="#e0645c"/>
  <circle cx="468.8" cy="291.3" r="3.5" fill="#e0645c"/>
  <circle cx="490" cy="280" r="8" fill="#8a8a8a" fill-opacity="0.25" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="490" y="284" fill="#8a8a8a" text-anchor="middle" font-size="11">M</text>
  <text x="490" y="345" fill="#e0645c" text-anchor="middle" font-size="16">&#923;</text>

  <text x="620" y="284" fill="#8a8a8a" text-anchor="middle" font-size="12">non-super-</text>
  <text x="620" y="300" fill="#8a8a8a" text-anchor="middle" font-size="12">imposable</text>
</svg>
