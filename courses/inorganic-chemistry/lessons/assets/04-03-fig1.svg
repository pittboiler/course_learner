<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">The heme active site (edge-on): Fe in an N4 porphyrin plane, proximal His below, the 6th site open for O&#8322;.</text>
  <text x="30" y="42" fill="#8a8a8a" font-style="italic">Binding O&#8322; pulls the iron from out-of-plane (high-spin) into the plane (low-spin) &#8212; the trigger of cooperativity.</text>

  <!-- =================== LEFT: DEOXY =================== -->
  <text x="70" y="78" fill="#8a8a8a">deoxy &#8212; 6th site empty</text>

  <!-- open 6th site marker -->
  <circle cx="150" cy="120" r="12" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="168" y="124" fill="#8a8a8a">open site</text>

  <!-- porphyrin N4 plane, edge-on (domed): drawn as a shallow arc, blue -->
  <path d="M 70 205 Q 150 188 230 205" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- reference flat plane (dashed grey) -->
  <line x1="70" y1="205" x2="230" y2="205" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 4"/>
  <!-- equatorial N donors -->
  <circle cx="70" cy="205" r="5" fill="#4a90d9"/>
  <circle cx="230" cy="205" r="5" fill="#4a90d9"/>
  <text x="56" y="224" fill="#8a8a8a">N</text>
  <text x="226" y="224" fill="#8a8a8a">N</text>

  <!-- iron, OUT of plane (displaced down toward His) -->
  <circle cx="150" cy="220" r="11" fill="#4a90d9"/>
  <text x="138" y="225" fill="#8a8a8a" font-size="12">Fe</text>
  <text x="164" y="217" fill="#8a8a8a" font-size="12">high-spin</text>

  <!-- proximal histidine bond + label -->
  <line x1="150" y1="231" x2="150" y2="272" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="150" cy="284" r="7" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="70" y="308" fill="#8a8a8a">proximal His (5th site)</text>

  <!-- =================== RIGHT: OXY =================== -->
  <text x="400" y="78" fill="#8a8a8a">oxy &#8212; O&#8322; bound at 6th site</text>

  <!-- O2 bound at 6th site (coral) -->
  <circle cx="480" cy="120" r="8" fill="#e0645c"/>
  <circle cx="480" cy="102" r="8" fill="#e0645c"/>
  <line x1="480" y1="112" x2="480" y2="110" stroke="#e0645c" stroke-width="2"/>
  <text x="498" y="110" fill="#e0645c">O&#8322;</text>
  <!-- bond Fe -> O2 -->
  <line x1="480" y1="182" x2="480" y2="128" stroke="#4a90d9" stroke-width="2"/>

  <!-- porphyrin N4 plane, now flat, blue -->
  <line x1="400" y1="193" x2="560" y2="193" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="400" cy="193" r="5" fill="#4a90d9"/>
  <circle cx="560" cy="193" r="5" fill="#4a90d9"/>
  <text x="386" y="212" fill="#8a8a8a">N</text>
  <text x="556" y="212" fill="#8a8a8a">N</text>

  <!-- iron, now IN the plane -->
  <circle cx="480" cy="193" r="11" fill="#4a90d9"/>
  <text x="468" y="198" fill="#8a8a8a" font-size="12">Fe</text>
  <text x="494" y="190" fill="#8a8a8a" font-size="12">low-spin</text>

  <!-- coral displacement arrow: Fe moved UP into plane -->
  <line x1="524" y1="222" x2="524" y2="197" stroke="#e0645c" stroke-width="2"/>
  <polygon points="524,193 519,203 529,203" fill="#e0645c"/>
  <text x="532" y="216" fill="#e0645c">Fe moves</text>
  <text x="532" y="231" fill="#e0645c">into plane</text>

  <!-- proximal histidine bond + label -->
  <line x1="480" y1="204" x2="480" y2="272" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="480" cy="284" r="7" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="400" y="308" fill="#8a8a8a">proximal His (5th site)</text>
</svg>
