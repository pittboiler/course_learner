<svg viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="24" y="22" fill="#8a8a8a" font-style="italic">A base donates a lone pair (coral) into an acid's empty orbital, forming a dative bond; oxoacids grow stronger with more O.</text>

  <!-- section labels -->
  <text x="150" y="52" fill="#8a8a8a" font-size="12" text-anchor="middle">Lewis adduct formation</text>
  <text x="585" y="52" fill="#8a8a8a" font-size="12" text-anchor="middle">oxoacid strength</text>

  <!-- ===== NH3 (base) ===== -->
  <circle cx="70" cy="140" r="15" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="70" y="145" fill="#4a90d9" text-anchor="middle">N</text>
  <text x="46" y="172" fill="#8a8a8a" text-anchor="middle">H</text>
  <text x="70" y="182" fill="#8a8a8a" text-anchor="middle">H</text>
  <text x="94" y="172" fill="#8a8a8a" text-anchor="middle">H</text>
  <!-- lone pair (donated) -->
  <circle cx="94" cy="131" r="3" fill="#e0645c"/>
  <circle cx="94" cy="149" r="3" fill="#e0645c"/>
  <text x="70" y="112" fill="#e0645c" font-size="11" text-anchor="middle">lone pair</text>

  <!-- donation curved arrow -->
  <path d="M 101 140 Q 142 104 181 136" fill="none" stroke="#e0645c" stroke-width="2"/>
  <polygon points="181,136 172,133 176,143" fill="#e0645c"/>

  <!-- ===== BF3 (acid) ===== -->
  <circle cx="215" cy="140" r="15" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="215" y="145" fill="#4a90d9" text-anchor="middle">B</text>
  <text x="243" y="118" fill="#8a8a8a" text-anchor="middle">F</text>
  <text x="243" y="166" fill="#8a8a8a" text-anchor="middle">F</text>
  <text x="215" y="182" fill="#8a8a8a" text-anchor="middle">F</text>
  <!-- empty orbital -->
  <circle cx="190" cy="140" r="10" fill="none" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="188" y="112" fill="#8a8a8a" font-size="11" text-anchor="middle">empty orbital</text>

  <!-- reaction arrow -->
  <line x1="270" y1="140" x2="322" y2="140" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="322,140 313,136 313,144" fill="#8a8a8a"/>

  <!-- ===== product adduct F3B-NH3 ===== -->
  <circle cx="360" cy="140" r="15" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="360" y="145" fill="#4a90d9" text-anchor="middle">N</text>
  <circle cx="415" cy="140" r="15" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="415" y="145" fill="#4a90d9" text-anchor="middle">B</text>
  <!-- dative bond -->
  <line x1="375" y1="140" x2="400" y2="140" stroke="#e0645c" stroke-width="3"/>
  <text x="387" y="118" fill="#e0645c" font-size="11" text-anchor="middle">dative</text>
  <!-- N's H's -->
  <text x="336" y="118" fill="#8a8a8a" text-anchor="middle">H</text>
  <text x="336" y="168" fill="#8a8a8a" text-anchor="middle">H</text>
  <text x="360" y="182" fill="#8a8a8a" text-anchor="middle">H</text>
  <!-- B's F's -->
  <text x="440" y="118" fill="#8a8a8a" text-anchor="middle">F</text>
  <text x="440" y="168" fill="#8a8a8a" text-anchor="middle">F</text>
  <text x="415" y="182" fill="#8a8a8a" text-anchor="middle">F</text>
  <text x="388" y="210" fill="#8a8a8a" font-size="12" text-anchor="middle">F&#8323;B&#8211;NH&#8323; adduct</text>

  <!-- ===== oxoacid ladder ===== -->
  <line x1="505" y1="250" x2="655" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- bars -->
  <rect x="512" y="230" width="26" height="20" fill="#4a90d9" fill-opacity="0.55" stroke="#4a90d9" stroke-width="1.5"/>
  <rect x="547" y="205" width="26" height="45" fill="#4a90d9" fill-opacity="0.55" stroke="#4a90d9" stroke-width="1.5"/>
  <rect x="582" y="180" width="26" height="70" fill="#4a90d9" fill-opacity="0.55" stroke="#4a90d9" stroke-width="1.5"/>
  <rect x="617" y="150" width="26" height="100" fill="#4a90d9" fill-opacity="0.55" stroke="#4a90d9" stroke-width="1.5"/>
  <!-- bar labels -->
  <text x="525" y="266" fill="#8a8a8a" font-size="10" text-anchor="middle">HClO</text>
  <text x="560" y="266" fill="#8a8a8a" font-size="10" text-anchor="middle">HClO&#8322;</text>
  <text x="595" y="266" fill="#8a8a8a" font-size="10" text-anchor="middle">HClO&#8323;</text>
  <text x="630" y="266" fill="#8a8a8a" font-size="10" text-anchor="middle">HClO&#8324;</text>
  <!-- acidity arrow -->
  <line x1="498" y1="250" x2="498" y2="150" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="498,150 494,159 502,159" fill="#e0645c"/>
  <text x="474" y="205" fill="#e0645c" font-size="11" text-anchor="middle" transform="rotate(-90 474 205)">acidity</text>
</svg>
