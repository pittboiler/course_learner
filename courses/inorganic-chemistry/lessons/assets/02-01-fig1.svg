<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="24" fill="#8a8a8a" font-style="italic">Six donor atoms make an octahedron (left). A chelate ligand grips two sites at once, freeing loose ligands — more particles, more entropy (right).</text>

  <!-- ===== left: octahedral complex ML6 ===== -->
  <text x="60" y="58" fill="#8a8a8a">coordination number 6 &#8594; octahedral</text>

  <!-- bonds from metal to six donor atoms -->
  <line x1="150" y1="195" x2="150" y2="105" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="150" y1="195" x2="150" y2="285" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="150" y1="195" x2="70"  y2="170" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="150" y1="195" x2="230" y2="220" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="150" y1="195" x2="105" y2="245" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="150" y1="195" x2="195" y2="145" stroke="#8a8a8a" stroke-width="2"/>

  <!-- six donor atoms (blue) -->
  <circle cx="150" cy="105" r="13" fill="#4a90d9" opacity="0.2" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="150" cy="285" r="13" fill="#4a90d9" opacity="0.2" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="70"  cy="170" r="13" fill="#4a90d9" opacity="0.2" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="230" cy="220" r="13" fill="#4a90d9" opacity="0.2" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="105" cy="245" r="13" fill="#4a90d9" opacity="0.2" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="195" cy="145" r="13" fill="#4a90d9" opacity="0.2" stroke="#4a90d9" stroke-width="2"/>
  <text x="145" y="110" fill="#4a90d9">:</text>

  <!-- metal center (grey) -->
  <circle cx="150" cy="195" r="18" fill="#8a8a8a" opacity="0.25" stroke="#8a8a8a" stroke-width="2"/>
  <text x="143" y="200" fill="#8a8a8a">M</text>

  <text x="60"  y="308" fill="#4a90d9">6 lone pairs donated (Lewis bases)</text>

  <!-- ===== right: chelate effect ===== -->
  <text x="405" y="58" fill="#8a8a8a">bidentate &#8220;en&#8221; forms a 5-ring</text>

  <!-- metal center -->
  <circle cx="440" cy="200" r="18" fill="#8a8a8a" opacity="0.25" stroke="#8a8a8a" stroke-width="2"/>
  <text x="433" y="205" fill="#8a8a8a">M</text>

  <!-- chelate ring: M - N1 - C1 - C2 - N2 - M (coral) -->
  <path d="M 440 200 L 500 158 L 552 178 L 552 232 L 500 250 Z"
        fill="#e0645c" opacity="0.12" stroke="#e0645c" stroke-width="2.5"/>
  <!-- donor N atoms (blue, on the coral ring) -->
  <circle cx="500" cy="158" r="12" fill="#4a90d9" opacity="0.2" stroke="#4a90d9" stroke-width="2"/>
  <text x="493" y="163" fill="#4a90d9">N</text>
  <circle cx="500" cy="250" r="12" fill="#4a90d9" opacity="0.2" stroke="#4a90d9" stroke-width="2"/>
  <text x="493" y="255" fill="#4a90d9">N</text>
  <!-- carbon bridge atoms (grey) -->
  <circle cx="552" cy="178" r="8" fill="#8a8a8a" opacity="0.25" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="562" y="176" fill="#8a8a8a" font-size="12">C</text>
  <circle cx="552" cy="232" r="8" fill="#8a8a8a" opacity="0.25" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="562" y="240" fill="#8a8a8a" font-size="12">C</text>
  <text x="452" y="292" fill="#e0645c">one ligand, two bonds</text>

  <!-- released monodentate particles (coral, floating off) -->
  <text x="392" y="118" fill="#e0645c">freed:</text>
  <circle cx="452" cy="112" r="9" fill="#e0645c" opacity="0.18" stroke="#e0645c" stroke-width="2"/>
  <circle cx="486" cy="100" r="9" fill="#e0645c" opacity="0.18" stroke="#e0645c" stroke-width="2"/>
  <circle cx="520" cy="112" r="9" fill="#e0645c" opacity="0.18" stroke="#e0645c" stroke-width="2"/>
  <!-- little upward drift arrows -->
  <line x1="452" y1="128" x2="452" y2="140" stroke="#e0645c" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="486" y1="116" x2="486" y2="140" stroke="#e0645c" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="520" y1="128" x2="520" y2="140" stroke="#e0645c" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="548" y="112" fill="#e0645c" font-size="13">&#916;S &gt; 0</text>
</svg>
