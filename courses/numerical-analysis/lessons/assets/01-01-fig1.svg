<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="240" fill="#ffffff"/>

  <!-- title -->
  <text x="360" y="30" text-anchor="middle" font-size="16" fill="#111">Representable floats (toy model: 2 mantissa bits) &#8212; gaps double at each power of 2</text>

  <!-- main axis -->
  <line x1="52" y1="150" x2="700" y2="150" stroke="#111" stroke-width="1.5"/>
  <polygon points="700,150 690,145 690,155" fill="#111"/>

  <!-- minor ticks (representable values inside each binade) -->
  <g stroke="#111" stroke-width="1">
    <line x1="72.3" y1="143" x2="72.3" y2="157"/>
    <line x1="74.8" y1="143" x2="74.8" y2="157"/>
    <line x1="77.2" y1="143" x2="77.2" y2="157"/>
    <line x1="84.6" y1="143" x2="84.6" y2="157"/>
    <line x1="89.5" y1="143" x2="89.5" y2="157"/>
    <line x1="94.5" y1="143" x2="94.5" y2="157"/>
    <line x1="109.2" y1="143" x2="109.2" y2="157"/>
    <line x1="119.1" y1="143" x2="119.1" y2="157"/>
    <line x1="128.9" y1="143" x2="128.9" y2="157"/>
    <line x1="158.4" y1="143" x2="158.4" y2="157"/>
    <line x1="178.1" y1="143" x2="178.1" y2="157"/>
    <line x1="197.8" y1="143" x2="197.8" y2="157"/>
    <line x1="256.9" y1="143" x2="256.9" y2="157"/>
    <line x1="296.2" y1="143" x2="296.2" y2="157"/>
    <line x1="335.6" y1="143" x2="335.6" y2="157"/>
    <line x1="453.7" y1="143" x2="453.7" y2="157"/>
    <line x1="532.5" y1="143" x2="532.5" y2="157"/>
    <line x1="611.2" y1="143" x2="611.2" y2="157"/>
  </g>

  <!-- major ticks (powers of two) -->
  <g stroke="#1f5fbf" stroke-width="2">
    <line x1="69.8" y1="135" x2="69.8" y2="165"/>
    <line x1="79.7" y1="135" x2="79.7" y2="165"/>
    <line x1="99.4" y1="135" x2="99.4" y2="165"/>
    <line x1="138.75" y1="135" x2="138.75" y2="165"/>
    <line x1="217.5" y1="135" x2="217.5" y2="165"/>
    <line x1="375" y1="135" x2="375" y2="165"/>
    <line x1="690" y1="135" x2="690" y2="165"/>
  </g>

  <!-- power-of-two labels -->
  <g font-size="12" fill="#1f5fbf" text-anchor="middle">
    <text x="69.8" y="182">1/4</text>
    <text x="79.7" y="182">1/2</text>
    <text x="99.4" y="182">1</text>
    <text x="138.75" y="182">2</text>
    <text x="217.5" y="182">4</text>
    <text x="375" y="182">8</text>
    <text x="690" y="182">16</text>
  </g>

  <!-- spacing brackets / gap labels -->
  <g font-size="11.5" fill="#c0392b" text-anchor="middle">
    <text x="119" y="110">gap 1/4</text>
    <text x="296" y="110">gap 1</text>
    <text x="532" y="110">gap 2</text>
  </g>
  <g stroke="#c0392b" stroke-width="1">
    <line x1="99.4" y1="120" x2="138.75" y2="120"/>
    <line x1="217.5" y1="120" x2="375" y2="120"/>
    <line x1="375" y1="120" x2="690" y2="120"/>
  </g>

  <!-- caption -->
  <text x="360" y="215" text-anchor="middle" font-size="12.5" fill="#111">Same count of ticks per interval [2&#8319;, 2&#8319;&#8314;&#185;), so absolute spacing doubles each step right &#8212; density is uniform in <tspan font-style="italic">relative</tspan> terms.</text>
</svg>
