<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

  <!-- title -->
  <text x="360" y="28" text-anchor="middle" font-size="16" fill="#111">Forward Euler on y' = y, y(0) = 1 (h = 0.25): the polygon drifts below the true curve</text>

  <!-- axes -->
  <line x1="80" y1="50" x2="80" y2="340" stroke="#111" stroke-width="1.5"/>
  <line x1="80" y1="340" x2="670" y2="340" stroke="#111" stroke-width="1.5"/>
  <polygon points="670,340 660,335 660,345" fill="#111"/>
  <polygon points="80,50 75,60 85,60" fill="#111"/>
  <text x="672" y="356" font-size="12" fill="#111">t</text>
  <text x="66" y="54" font-size="12" fill="#111">y</text>

  <!-- t ticks -->
  <g font-size="11.5" fill="#111" text-anchor="middle">
    <line x1="80"  y1="340" x2="80"  y2="345" stroke="#111"/>
    <line x1="225" y1="340" x2="225" y2="345" stroke="#111"/>
    <line x1="370" y1="340" x2="370" y2="345" stroke="#111"/>
    <line x1="515" y1="340" x2="515" y2="345" stroke="#111"/>
    <line x1="660" y1="340" x2="660" y2="345" stroke="#111"/>
    <text x="80"  y="360">0</text>
    <text x="225" y="360">0.25</text>
    <text x="370" y="360">0.5</text>
    <text x="515" y="360">0.75</text>
    <text x="660" y="360">1</text>
  </g>

  <!-- y ticks -->
  <g font-size="11.5" fill="#111" text-anchor="end">
    <line x1="75" y1="312.38" x2="80" y2="312.38" stroke="#111"/>
    <line x1="75" y1="243.33" x2="80" y2="243.33" stroke="#111"/>
    <line x1="75" y1="174.29" x2="80" y2="174.29" stroke="#111"/>
    <line x1="75" y1="105.24" x2="80" y2="105.24" stroke="#111"/>
    <text x="72" y="316">1.0</text>
    <text x="72" y="247">1.5</text>
    <text x="72" y="178">2.0</text>
    <text x="72" y="109">2.5</text>
  </g>

  <!-- true solution y = e^t -->
  <polyline fill="none" stroke="#c0392b" stroke-width="2.5"
    points="80,312.38 109,305.30 138,297.86 167,290.03 196,281.81 225,273.16 254,264.07 283,254.51 312,244.46 341,233.90 370,222.80 399,211.12 428,198.85 457,185.95 486,172.39 515,158.13 544,143.14 573,127.38 602,110.81 631,93.40 660,75.10"/>
  <text x="600" y="70" font-size="12.5" fill="#c0392b" text-anchor="middle">true: y = e&#8348;</text>

  <!-- Euler polygon (each segment is a tangent step) -->
  <polyline fill="none" stroke="#1f5fbf" stroke-width="2.5"
    points="80,312.38 225,277.86 370,234.70 515,180.76 660,113.33"/>
  <g fill="#1f5fbf">
    <circle cx="80"  cy="312.38" r="4"/>
    <circle cx="225" cy="277.86" r="4"/>
    <circle cx="370" cy="234.70" r="4"/>
    <circle cx="515" cy="180.76" r="4"/>
    <circle cx="660" cy="113.33" r="4"/>
  </g>
  <text x="300" y="270" font-size="12.5" fill="#1f5fbf" text-anchor="middle">Euler polygon</text>

  <!-- node value labels -->
  <g font-size="10.5" fill="#1f5fbf" text-anchor="middle">
    <text x="225" y="293">1.250</text>
    <text x="370" y="250">1.563</text>
    <text x="515" y="196">1.953</text>
    <text x="660" y="129">2.441</text>
  </g>

  <!-- growing gap: dashed connectors true vs Euler at each node -->
  <g stroke="#7a7a7a" stroke-width="1" stroke-dasharray="3,3">
    <line x1="225" y1="273.16" x2="225" y2="277.86"/>
    <line x1="370" y1="222.80" x2="370" y2="234.70"/>
    <line x1="515" y1="158.13" x2="515" y2="180.76"/>
    <line x1="660" y1="75.10"  x2="660" y2="113.33"/>
  </g>

  <!-- highlighted global-error gap at t = 1 -->
  <line x1="660" y1="75.10" x2="660" y2="113.33" stroke="#111" stroke-width="2"/>
  <line x1="654" y1="75.10"  x2="666" y2="75.10"  stroke="#111" stroke-width="1.5"/>
  <line x1="654" y1="113.33" x2="666" y2="113.33" stroke="#111" stroke-width="1.5"/>
  <text x="648" y="98" font-size="12" fill="#111" text-anchor="end">global error</text>
  <text x="648" y="112" font-size="12" fill="#111" text-anchor="end">&#8776; 0.277</text>

  <!-- caption -->
  <text x="360" y="388" text-anchor="middle" font-size="12.5" fill="#111">Each blue segment leaves a node along the tangent (slope f = y there); the small one-step gaps accumulate left-to-right into the large gap at t = 1.</text>
</svg>
