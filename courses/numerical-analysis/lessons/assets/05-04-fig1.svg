<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

  <!-- title -->
  <text x="360" y="30" text-anchor="middle" font-size="17" fill="#111">Two stencils for the heat equation u&#7524; = &#945; u&#8339;&#8339;</text>

  <!-- ===================== LEFT PANEL: EXPLICIT (FTCS) ===================== -->
  <text x="175" y="62" text-anchor="middle" font-size="14.5" fill="#111">Explicit &#8212; forward Euler (FTCS)</text>

  <!-- faint mesh -->
  <g stroke="#cccccc" stroke-width="1">
    <line x1="70" y1="150" x2="290" y2="150"/>
    <line x1="70" y1="300" x2="290" y2="300"/>
    <line x1="110" y1="120" x2="110" y2="320"/>
    <line x1="175" y1="120" x2="175" y2="320"/>
    <line x1="240" y1="120" x2="240" y2="320"/>
  </g>

  <!-- time-level labels -->
  <text x="60" y="154" text-anchor="end" font-size="12" fill="#111">n+1</text>
  <text x="60" y="304" text-anchor="end" font-size="12" fill="#111">n</text>

  <!-- arrows: three known bottom nodes -> one unknown top-center -->
  <g stroke="#1f5fbf" stroke-width="2" fill="none">
    <line x1="112" y1="293" x2="170" y2="158"/>
    <line x1="175" y1="291" x2="175" y2="160"/>
    <line x1="238" y1="293" x2="180" y2="158"/>
  </g>
  <g fill="#1f5fbf">
    <polygon points="175,150 169,161 181,161"/>
  </g>

  <!-- known nodes (level n) -->
  <g fill="#111">
    <circle cx="110" cy="300" r="5.5"/>
    <circle cx="175" cy="300" r="5.5"/>
    <circle cx="240" cy="300" r="5.5"/>
  </g>
  <!-- unknown node (level n+1) -->
  <circle cx="175" cy="150" r="6.5" fill="#c0392b"/>

  <!-- space labels -->
  <g font-size="12" fill="#111" text-anchor="middle">
    <text x="110" y="322">i&#8722;1</text>
    <text x="175" y="322">i</text>
    <text x="240" y="322">i+1</text>
  </g>
  <text x="175" y="138" text-anchor="middle" font-size="12" fill="#c0392b">unknown</text>

  <text x="175" y="352" text-anchor="middle" font-size="12.5" fill="#111">one new value from three known</text>
  <text x="175" y="370" text-anchor="middle" font-size="12.5" fill="#111">values &#8212; cheap, but needs r &#8804; &#189;</text>

  <!-- ===================== RIGHT PANEL: IMPLICIT (BTCS) ===================== -->
  <text x="545" y="62" text-anchor="middle" font-size="14.5" fill="#111">Implicit &#8212; backward Euler (BTCS)</text>

  <!-- faint mesh -->
  <g stroke="#cccccc" stroke-width="1">
    <line x1="440" y1="150" x2="660" y2="150"/>
    <line x1="440" y1="300" x2="660" y2="300"/>
    <line x1="480" y1="120" x2="480" y2="320"/>
    <line x1="545" y1="120" x2="545" y2="320"/>
    <line x1="610" y1="120" x2="610" y2="320"/>
  </g>

  <!-- time-level labels -->
  <text x="430" y="154" text-anchor="end" font-size="12" fill="#111">n+1</text>
  <text x="430" y="304" text-anchor="end" font-size="12" fill="#111">n</text>

  <!-- coupling among the three unknowns at level n+1 -->
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <line x1="487" y1="150" x2="538" y2="150"/>
    <line x1="552" y1="150" x2="603" y2="150"/>
  </g>
  <g fill="#c0392b">
    <polygon points="545,150 534,144 534,156"/>
    <polygon points="545,150 556,144 556,156"/>
  </g>
  <!-- arrow: known bottom-center -> unknown top-center -->
  <line x1="545" y1="291" x2="545" y2="160" stroke="#1f5fbf" stroke-width="2"/>
  <polygon points="545,150 539,161 551,161" fill="#1f5fbf"/>

  <!-- unknown nodes (level n+1) -->
  <g fill="#c0392b">
    <circle cx="480" cy="150" r="6.5"/>
    <circle cx="545" cy="150" r="6.5"/>
    <circle cx="610" cy="150" r="6.5"/>
  </g>
  <!-- known node (level n) -->
  <circle cx="545" cy="300" r="5.5" fill="#111"/>

  <!-- space labels -->
  <g font-size="12" fill="#111" text-anchor="middle">
    <text x="480" y="322">i&#8722;1</text>
    <text x="545" y="322">i</text>
    <text x="610" y="322">i+1</text>
  </g>
  <text x="545" y="138" text-anchor="middle" font-size="12" fill="#c0392b">unknowns coupled</text>

  <text x="545" y="352" text-anchor="middle" font-size="12.5" fill="#111">new values coupled &#8212; solve a tridiagonal</text>
  <text x="545" y="370" text-anchor="middle" font-size="12.5" fill="#111">system, stable for any &#916;t</text>
</svg>
