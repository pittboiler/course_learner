<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2471a3"/>
    </marker>
  </defs>

  <!-- LEFT: unit circle -->
  <circle cx="175" cy="175" r="80" fill="none" stroke="#111111" stroke-width="2"/>
  <!-- faint axes -->
  <line x1="70" y1="175" x2="280" y2="175" stroke="#bbbbbb" stroke-width="1"/>
  <line x1="175" y1="70" x2="175" y2="280" stroke="#bbbbbb" stroke-width="1"/>
  <!-- v1, v2 (orthonormal right-singular vectors) -->
  <line x1="175" y1="175" x2="255" y2="175" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ahr)"/>
  <line x1="175" y1="175" x2="175" y2="95" stroke="#2471a3" stroke-width="2.5" marker-end="url(#ahb)"/>
  <text x="248" y="196" fill="#c0392b" font-size="16">v&#8321;</text>
  <text x="150" y="90" fill="#2471a3" font-size="16">v&#8322;</text>
  <text x="120" y="300" fill="#111111" font-size="15">unit circle</text>

  <!-- arrow between panels -->
  <line x1="300" y1="175" x2="400" y2="175" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="316" y="162" fill="#111111" font-size="16">A = U&#931;V&#7488;</text>

  <!-- RIGHT: image ellipse, semi-axes sigma_1 u1, sigma_2 u2 -->
  <!-- rotate(-25): major axis -> direction (cos25,-sin25)=u1 -->
  <ellipse cx="545" cy="175" rx="130" ry="46" transform="rotate(-25 545 175)" fill="none" stroke="#111111" stroke-width="2"/>
  <!-- sigma_1 u1 : 130*(0.906,-0.423) = (117.8,-55.0) -->
  <line x1="545" y1="175" x2="662.8" y2="120.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ahr)"/>
  <!-- sigma_2 u2 : 46*(0.423,0.906) = (19.5,41.7) -->
  <line x1="545" y1="175" x2="564.5" y2="216.7" stroke="#2471a3" stroke-width="2.5" marker-end="url(#ahb)"/>
  <text x="640" y="108" fill="#c0392b" font-size="16">&#963;&#8321;u&#8321;</text>
  <text x="566" y="232" fill="#2471a3" font-size="16">&#963;&#8322;u&#8322;</text>
  <text x="470" y="315" fill="#111111" font-size="15">A&#183;(circle) = ellipse</text>
</svg>
