<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="480" height="360" fill="#ffffff"/>
  <!-- x-axis -->
  <line x1="40" y1="293.2" x2="462" y2="293.2" stroke="#111111" stroke-width="1.5"/>
  <polygon points="462,293.2 453,288.8 453,297.6" fill="#111111"/>
  <text x="466" y="297" font-size="13" fill="#111111" font-style="italic">x</text>
  <!-- curve -->
  <polyline fill="none" stroke="#1a7f37" stroke-width="2.5"
    points="50,36.2 70,48.6 90,63.2 110,79.3 130,96.6 150,114.4 170,132.2 190,149.4 210,165.6 230,180.2 250,192.6 270,202.4 290,208.9 310,211.7 330,210.1 350,203.8 370,192.1 390,174.4 410,150.4 430,119.4 450,80.9"/>
  <text x="356" y="150" font-size="12" fill="#1a7f37">f never touches</text>
  <text x="356" y="166" font-size="12" fill="#1a7f37">the axis here</text>
  <!-- vertical drop lines -->
  <line x1="150" y1="293.2" x2="150" y2="114.4" stroke="#888888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="350" y1="293.2" x2="350" y2="203.8" stroke="#888888" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- tangent 0 -> 1 -->
  <line x1="150" y1="114.4" x2="350" y2="293.2" stroke="#cf222e" stroke-width="1.8"/>
  <!-- tangent 1 -> 0 -->
  <line x1="350" y1="203.8" x2="150" y2="293.2" stroke="#1f6feb" stroke-width="1.8"/>
  <!-- points -->
  <circle cx="150" cy="114.4" r="4" fill="#111111"/>
  <circle cx="350" cy="203.8" r="4" fill="#111111"/>
  <!-- ping-pong arrows along axis -->
  <path d="M 150 305 Q 250 330 350 305" fill="none" stroke="#cf222e" stroke-width="1.4"/>
  <polygon points="350,305 341,302 344,311" fill="#cf222e"/>
  <path d="M 350 320 Q 250 345 150 320" fill="none" stroke="#1f6feb" stroke-width="1.4"/>
  <polygon points="150,320 159,317 156,326" fill="#1f6feb"/>
  <!-- labels -->
  <text x="138" y="288" font-size="13" fill="#111111">0</text>
  <text x="346" y="288" font-size="13" fill="#111111">1</text>
  <text x="235" y="325" font-size="11" fill="#cf222e" font-style="italic">0 to 1</text>
  <text x="235" y="340" font-size="11" fill="#1f6feb" font-style="italic">1 to 0</text>
</svg>
