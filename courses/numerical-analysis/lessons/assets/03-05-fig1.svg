<svg xmlns="http://www.w3.org/2000/svg" width="440" height="400" viewBox="0 0 440 400" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="440" height="400" fill="#ffffff"/>
  <defs>
    <marker id="mGray" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555555"/>
    </marker>
    <marker id="mBlue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0066cc"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="70" y1="340" x2="360" y2="340" stroke="#bbbbbb" stroke-width="1"/>
  <line x1="70" y1="340" x2="70" y2="70" stroke="#bbbbbb" stroke-width="1"/>

  <!-- dominant eigen-direction v1 at 45 degrees -->
  <line x1="70" y1="340" x2="290" y2="120" stroke="#cc0000" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="296" y="118" font-size="14" fill="#cc0000">v&#8321; direction</text>
  <text x="296" y="134" font-size="12" fill="#cc0000">(&#955;&#8321; = 3)</text>

  <!-- iterate vectors x0..x4 rotating toward v1 -->
  <line x1="70" y1="340" x2="320" y2="340"   stroke="#888888" stroke-width="2" marker-end="url(#mGray)"/>
  <line x1="70" y1="340" x2="293.6" y2="228.2" stroke="#777777" stroke-width="2" marker-end="url(#mGray)"/>
  <line x1="70" y1="340" x2="265.2" y2="183.8" stroke="#666666" stroke-width="2" marker-end="url(#mGray)"/>
  <line x1="70" y1="340" x2="253.2" y2="169.9" stroke="#555555" stroke-width="2" marker-end="url(#mGray)"/>
  <line x1="70" y1="340" x2="248.9" y2="165.4" stroke="#0066cc" stroke-width="2.5" marker-end="url(#mBlue)"/>

  <!-- iterate labels -->
  <text x="326" y="345" font-size="13" fill="#111111">x&#8320;</text>
  <text x="300" y="228" font-size="13" fill="#111111">x&#8321;</text>
  <text x="248" y="176" font-size="13" fill="#111111">x&#8322;</text>
  <text x="225" y="158" font-size="13" fill="#0066cc">x&#8323;, x&#8324;</text>

  <!-- caption -->
  <text x="70" y="372" font-size="12.5" fill="#111111">A = [[2, 1], [1, 2]]:  each step, the gap to v&#8321; shrinks by |&#955;&#8322;/&#955;&#8321;| = 1/3.</text>
  <text x="70" y="55" font-size="13" fill="#111111">Power iteration swings x&#8342; from the axis onto the dominant eigendirection.</text>
</svg>
