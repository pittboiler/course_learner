<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>

  <!-- ===== Newton-Cotes (equispaced) ===== -->
  <text x="90" y="34" font-size="16" font-weight="bold" fill="#111">Newton&#8211;Cotes: fixed equispaced nodes (endpoints included)</text>

  <!-- weight bars (composite-trapezoid weights: ends half, interior full) -->
  <g fill="#9ec5ff" stroke="#1f6feb" stroke-width="1">
    <rect x="86"  y="100" width="8" height="20"/>
    <rect x="201" y="80"  width="8" height="40"/>
    <rect x="316" y="80"  width="8" height="40"/>
    <rect x="431" y="80"  width="8" height="40"/>
    <rect x="546" y="100" width="8" height="20"/>
  </g>

  <!-- axis line -->
  <line x1="70" y1="120" x2="570" y2="120" stroke="#111" stroke-width="2"/>
  <!-- nodes -->
  <g fill="#1f6feb">
    <circle cx="90"  cy="120" r="5"/>
    <circle cx="205" cy="120" r="5"/>
    <circle cx="320" cy="120" r="5"/>
    <circle cx="435" cy="120" r="5"/>
    <circle cx="550" cy="120" r="5"/>
  </g>
  <g font-size="13" fill="#111" text-anchor="middle">
    <text x="90"  y="140">-1</text>
    <text x="205" y="140">-0.5</text>
    <text x="320" y="140">0</text>
    <text x="435" y="140">0.5</text>
    <text x="550" y="140">1</text>
  </g>

  <!-- ===== Gauss-Legendre (3-point) ===== -->
  <text x="90" y="192" font-size="16" font-weight="bold" fill="#111">Gauss&#8211;Legendre (3-point): optimal interior nodes</text>

  <!-- weight bars proportional to 5/9, 8/9, 5/9 -->
  <g fill="#f5b7b1" stroke="#c0392b" stroke-width="1">
    <rect x="138" y="220" width="8" height="31"/>
    <rect x="316" y="202" width="8" height="49"/>
    <rect x="494" y="220" width="8" height="31"/>
  </g>

  <!-- axis line with endpoints marked as open (not used) -->
  <line x1="70" y1="251" x2="570" y2="251" stroke="#111" stroke-width="2"/>
  <g stroke="#111" stroke-width="1.5" fill="#ffffff">
    <circle cx="90"  cy="251" r="4"/>
    <circle cx="550" cy="251" r="4"/>
  </g>
  <!-- Gauss nodes -->
  <g fill="#c0392b">
    <circle cx="142" cy="251" r="5"/>
    <circle cx="320" cy="251" r="5"/>
    <circle cx="498" cy="251" r="5"/>
  </g>
  <g font-size="13" fill="#111" text-anchor="middle">
    <text x="142" y="271">-&#8730;(3/5)</text>
    <text x="320" y="271">0</text>
    <text x="498" y="271">&#8730;(3/5)</text>
    <text x="90"  y="271" fill="#777">-1</text>
    <text x="550" y="271" fill="#777">1</text>
  </g>
  <text x="320" y="291" font-size="12" fill="#777" text-anchor="middle">bar height &#8733; weight; endpoints are unused (open circles)</text>
</svg>
