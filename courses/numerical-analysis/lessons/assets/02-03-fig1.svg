<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="420" fill="#ffffff"/>

  <!-- title -->
  <text x="350" y="28" text-anchor="middle" font-size="16" fill="#111">Total error of the forward difference vs. step size h (log&#8211;log axes)</text>

  <!-- axes box -->
  <line x1="90" y1="60" x2="90" y2="360" stroke="#111" stroke-width="1.5"/>
  <line x1="90" y1="360" x2="660" y2="360" stroke="#111" stroke-width="1.5"/>

  <!-- x ticks + labels (powers of ten of h) -->
  <g stroke="#111" stroke-width="1">
    <line x1="90"    y1="360" x2="90"    y2="366"/>
    <line x1="232.5" y1="360" x2="232.5" y2="366"/>
    <line x1="375"   y1="360" x2="375"   y2="366"/>
    <line x1="517.5" y1="360" x2="517.5" y2="366"/>
    <line x1="660"   y1="360" x2="660"   y2="366"/>
  </g>
  <g font-size="12" fill="#111" text-anchor="middle">
    <text x="90"    y="380">10&#8315;&#185;&#8310;</text>
    <text x="232.5" y="380">10&#8315;&#185;&#178;</text>
    <text x="375"   y="380">10&#8315;&#8312;</text>
    <text x="517.5" y="380">10&#8315;&#8308;</text>
    <text x="660"   y="380">1</text>
  </g>
  <text x="375" y="404" text-anchor="middle" font-size="13" fill="#111">step size h  (smaller &#8592;)</text>

  <!-- y ticks + labels (powers of ten of error) -->
  <g stroke="#111" stroke-width="1">
    <line x1="84" y1="343.7" x2="90" y2="343.7"/>
    <line x1="84" y1="278.5" x2="90" y2="278.5"/>
    <line x1="84" y1="213.3" x2="90" y2="213.3"/>
    <line x1="84" y1="148.0" x2="90" y2="148.0"/>
    <line x1="84" y1="82.8"  x2="90" y2="82.8"/>
  </g>
  <g font-size="12" fill="#111" text-anchor="end">
    <text x="80" y="347.7">10&#8315;&#8312;</text>
    <text x="80" y="282.5">10&#8315;&#8310;</text>
    <text x="80" y="217.3">10&#8315;&#8308;</text>
    <text x="80" y="152.0">10&#8315;&#178;</text>
    <text x="80" y="86.8">1</text>
  </g>
  <text x="26" y="210" text-anchor="middle" font-size="13" fill="#111" transform="rotate(-90 26 210)">total error</text>

  <!-- round-off line: slope -1, rising to the left (blue, dashed) -->
  <line x1="90" y1="73.0" x2="403.5" y2="360" stroke="#1f5fbf" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="96" y="70" text-anchor="start" font-size="12.5" fill="#1f5fbf">round-off &#8733; &#949;/h  (slope &#8722;1)</text>

  <!-- truncation line: slope +1, rising to the right (red, dashed) -->
  <line x1="367.9" y1="360" x2="660" y2="92.6" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="654" y="70" text-anchor="end" font-size="12.5" fill="#c0392b">truncation &#8733; h  (slope +1)</text>

  <!-- total error curve (sum), dark solid, thick -->
  <polyline fill="none" stroke="#111" stroke-width="2.6"
    points="90,73.0 161.25,138.2 232.5,203.4 303.75,268.7 339.4,301.2 375,330.7 385.7,333.9 410.6,320.3 446.25,288.3 481.9,255.7 517.5,223.1 553.1,190.5 588.75,157.9 624.4,125.3 660,92.6"/>

  <!-- optimal-h marker -->
  <line x1="385.7" y1="360" x2="385.7" y2="333.9" stroke="#1a8a4a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="385.7" cy="333.9" r="4" fill="#1a8a4a"/>
  <text x="385.7" y="326" text-anchor="middle" font-size="12.5" fill="#1a8a4a">minimum</text>
  <text x="392" y="352" text-anchor="start" font-size="12.5" fill="#1a8a4a">h* &#8776; &#8730;&#949;</text>

  <!-- total label -->
  <text x="470" y="345" text-anchor="start" font-size="12.5" fill="#111">total = truncation + round-off</text>
</svg>
