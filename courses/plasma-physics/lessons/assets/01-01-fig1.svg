<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">A test charge in vacuum falls off as 1/r (grey); in a plasma the screening cloud kills it past a few λ_D (blue).</text>

  <!-- shielding cloud: region within one Debye length -->
  <rect x="70" y="55" width="100" height="195" fill="#e0645c" opacity="0.15"/>
  <text x="78" y="72" fill="#e0645c" font-style="italic" font-size="12">cloud of</text>
  <text x="78" y="86" fill="#e0645c" font-style="italic" font-size="12">opposite charge</text>

  <!-- axes -->
  <line x1="70" y1="250" x2="500" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="500,250 490,245 490,255" fill="#8a8a8a"/>
  <text x="504" y="255" fill="#8a8a8a">r</text>
  <line x1="70" y1="250" x2="70" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,55 65,65 75,65" fill="#8a8a8a"/>
  <text x="52" y="66" fill="#8a8a8a">φ</text>
  <text x="58" y="266" fill="#8a8a8a">0</text>

  <!-- bare Coulomb potential  φ = 1/r  (grey dashed) -->
  <path d="M 110 76.9 L 120 111.5 L 130 134.6 L 140 151.1 L 150 163.5 L 160 173.1 L 170 180.8 L 190 192.3 L 210 200.5 L 230 206.7 L 250 211.5 L 270 215.4 L 310 221.2 L 350 225.3 L 390 228.4 L 430 230.8 L 470 232.7"
        fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="300" y="212" fill="#8a8a8a">bare: Q/4πε₀r</text>

  <!-- screened Debye potential  φ = (1/r) e^{-r/λ_D}  (blue solid) -->
  <path d="M 110 134.0 L 120 166.0 L 130 186.7 L 140 200.9 L 150 211.1 L 160 218.7 L 170 224.5 L 190 232.6 L 210 237.8 L 230 241.3 L 250 243.6 L 270 245.3 L 310 247.4 L 350 248.5 L 390 249.1 L 430 249.5 L 470 249.7"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="150" y="128" fill="#4a90d9">screened: (Q/4πε₀r) e</text>
  <text x="291" y="122" fill="#4a90d9" font-size="11">−r/λ_D</text>

  <!-- Debye length marker -->
  <line x1="170" y1="250" x2="170" y2="55" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="160" y="266" fill="#e0645c">λ_D</text>
</svg>
