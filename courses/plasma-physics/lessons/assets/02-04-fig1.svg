<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Resonant particles surf the wave at v = &#969;/k. The slope &#8706;f&#8320;/&#8706;v there sets the sign: falling &#8594; damping, rising &#8594; growth.</text>

  <!-- axes -->
  <line x1="60" y1="250" x2="628" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="628,250 618,245 618,255" fill="#8a8a8a"/>
  <text x="632" y="255" fill="#8a8a8a">v</text>
  <line x1="60" y1="255" x2="60" y2="58" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="60,58 55,68 65,68" fill="#8a8a8a"/>
  <text x="42" y="66" fill="#8a8a8a">f&#8320;</text>
  <!-- v=0 tick -->
  <line x1="268.9" y1="250" x2="268.9" y2="256" stroke="#8a8a8a" stroke-width="1"/>
  <text x="264" y="270" fill="#8a8a8a">0</text>

  <!-- ===== Maxwellian f0(v) (blue) ===== -->
  <path d="M 70 249.6 L 98.4 248.0 L 126.6 242.1 L 155.3 225.6 L 183.7 191.6 L 212.1 140.8 L 240.5 91.2 L 268.9 70 L 297.4 91.2 L 325.8 140.8 L 354.2 191.6 L 382.6 225.6 L 411.1 242.1 L 439.5 248.0 L 467.9 249.6 L 496.3 250 L 553.2 250 L 610 250"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="150" y="120" fill="#4a90d9">f&#8320;(v) &#8212; Maxwellian</text>

  <!-- ===== bump-on-tail variant (dashed coral) ===== -->
  <path d="M 382.6 225.6 L 411.1 241.6 L 439.5 241.9 L 453.7 234.5 L 467.9 222.3 L 482.1 210.3 L 496.3 205 L 510.5 210.3 L 524.7 222.7 L 538.9 235.4 L 553.2 243.9 L 567.4 248 L 581.6 249.5"
        fill="none" stroke="#e0645c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="486" y="196" fill="#e0645c">bump-on-tail</text>

  <!-- ===== phase-velocity marker on the FALLING slope: damping ===== -->
  <line x1="354.2" y1="250" x2="354.2" y2="191.6" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle cx="354.2" cy="191.6" r="4" fill="#e0645c"/>
  <text x="330" y="185" fill="#e0645c">v = &#969;/k</text>
  <text x="150" y="300" fill="#e0645c">falling slope: more slow than fast surfers &#8594; wave damps (&#947; &lt; 0)</text>

  <!-- ===== rising-slope marker on the bump: growth ===== -->
  <line x1="467.9" y1="250" x2="467.9" y2="222.3" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle cx="467.9" cy="222.3" r="4" fill="#e0645c"/>
  <text x="474" y="320" fill="#e0645c">&#8706;f&#8320;/&#8706;v &gt; 0 here &#8594; growth</text>
  <line x1="500" y1="315" x2="470" y2="228" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="2 3"/>
</svg>
