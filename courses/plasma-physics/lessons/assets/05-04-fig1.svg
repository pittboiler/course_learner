<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Anti-parallel field lines (grey) pressed into a thin current sheet reconnect at the X-point (coral);</text>
  <text x="30" y="42" fill="#8a8a8a" font-style="italic">field-line tension then slingshots plasma out along the sheet at the Alfven speed v_A (blue).</text>

  <!-- ===== upper region: field points right (B ->) ===== -->
  <line x1="150" y1="95" x2="545" y2="95" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="545,95 536,91 536,99" fill="#8a8a8a"/>
  <line x1="150" y1="140" x2="545" y2="140" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="545,140 536,136 536,144" fill="#8a8a8a"/>
  <text x="552" y="99" fill="#8a8a8a">B</text>

  <!-- ===== lower region: field points left (B <-) ===== -->
  <line x1="150" y1="240" x2="545" y2="240" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="150,240 159,236 159,244" fill="#8a8a8a"/>
  <line x1="150" y1="285" x2="545" y2="285" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="150,285 159,281 159,289" fill="#8a8a8a"/>
  <text x="128" y="289" fill="#8a8a8a">B</text>

  <!-- ===== inflow arrows (grey) pushing field into the sheet ===== -->
  <line x1="290" y1="155" x2="290" y2="176" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="290,176 286,167 294,167" fill="#8a8a8a"/>
  <line x1="390" y1="155" x2="390" y2="176" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="390,176 386,167 394,167" fill="#8a8a8a"/>
  <line x1="290" y1="225" x2="290" y2="204" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="290,204 286,213 294,213" fill="#8a8a8a"/>
  <line x1="390" y1="225" x2="390" y2="204" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="390,204 386,213 394,213" fill="#8a8a8a"/>
  <text x="398" y="150" fill="#8a8a8a" font-style="italic">inflow v_in</text>

  <!-- ===== current sheet (coral-shaded, L x delta) ===== -->
  <rect x="235" y="180" width="210" height="20" fill="#e0645c" opacity="0.15" stroke="#e0645c" stroke-width="1"/>

  <!-- separatrix X -->
  <line x1="250" y1="150" x2="430" y2="230" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="250" y1="230" x2="430" y2="150" stroke="#e0645c" stroke-width="1.5"/>
  <circle cx="340" cy="190" r="4.5" fill="#e0645c"/>
  <text x="350" y="172" fill="#e0645c">X-point</text>

  <!-- reconnected, sharply-bent field lines (coral) being flung out -->
  <polyline points="455,175 510,190 455,205" fill="none" stroke="#e0645c" stroke-width="2"/>
  <polyline points="225,175 170,190 225,205" fill="none" stroke="#e0645c" stroke-width="2"/>

  <!-- outflow jets (blue) at v_A -->
  <line x1="355" y1="190" x2="455" y2="190" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="455,190 446,186 446,194" fill="#4a90d9"/>
  <line x1="325" y1="190" x2="225" y2="190" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="225,190 234,186 234,194" fill="#4a90d9"/>
  <text x="398" y="183" fill="#4a90d9">v_A</text>
  <text x="250" y="183" fill="#4a90d9">v_A</text>

  <!-- delta marker (sheet thickness) -->
  <line x1="468" y1="180" x2="468" y2="200" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="468,180 464,189 472,189" fill="#8a8a8a"/>
  <polygon points="468,200 464,191 472,191" fill="#8a8a8a"/>
  <text x="474" y="195" fill="#8a8a8a" font-style="italic">&#948;</text>

  <!-- L marker (sheet length) -->
  <line x1="235" y1="200" x2="235" y2="340" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="445" y1="200" x2="445" y2="340" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="235" y1="336" x2="445" y2="336" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="235,336 244,332 244,340" fill="#8a8a8a"/>
  <polygon points="445,336 436,332 436,340" fill="#8a8a8a"/>
  <text x="332" y="330" fill="#8a8a8a" font-style="italic">L</text>
</svg>
