<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Frozen-in flux: the fluid drags its field lines along and squeezes the tube — same flux Φ, stronger B.</text>

  <!-- ===== magnetic field lines (a flux tube, grey), spread left, squeezed right ===== -->
  <path d="M 60 118 C 220 118, 400 150, 590 158" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M 60 160 C 220 160, 400 168, 590 170" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M 60 202 C 220 202, 400 186, 590 182" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- field-line direction arrows -->
  <polygon points="590,158 580,153 581,162" fill="#8a8a8a"/>
  <polygon points="590,170 580,166 580,175" fill="#8a8a8a"/>
  <polygon points="590,182 580,178 581,187" fill="#8a8a8a"/>
  <text x="596" y="174" fill="#8a8a8a" font-style="italic">B</text>

  <!-- ===== fluid parcel A: upstream, fat tube ===== -->
  <ellipse cx="150" cy="160" rx="52" ry="62" fill="#4a90d9" opacity="0.15"/>
  <ellipse cx="150" cy="160" rx="52" ry="62" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <!-- co-moving loop (cross-section) drawn as a slanted ellipse on the tube -->
  <ellipse cx="150" cy="160" rx="12" ry="58" fill="none" stroke="#4a90d9" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="128" y="252" fill="#4a90d9">flux Φ</text>
  <text x="118" y="105" fill="#4a90d9">fluid parcel</text>

  <!-- ===== fluid parcel B: downstream, stretched + thinned ===== -->
  <ellipse cx="470" cy="170" rx="40" ry="26" fill="#4a90d9" opacity="0.15"/>
  <ellipse cx="470" cy="170" rx="40" ry="26" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <ellipse cx="470" cy="170" rx="9" ry="24" fill="none" stroke="#4a90d9" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="440" y="222" fill="#4a90d9">same Φ, smaller area</text>

  <!-- ===== velocity field (coral) advecting + stretching ===== -->
  <line x1="238" y1="132" x2="322" y2="140" stroke="#e0645c" stroke-width="2"/>
  <polygon points="322,140 311,137 313,146" fill="#e0645c"/>
  <line x1="238" y1="162" x2="330" y2="164" stroke="#e0645c" stroke-width="2"/>
  <polygon points="330,164 319,160 319,169" fill="#e0645c"/>
  <line x1="238" y1="192" x2="322" y2="188" stroke="#e0645c" stroke-width="2"/>
  <polygon points="322,188 313,182 311,191" fill="#e0645c"/>
  <text x="270" y="120" fill="#e0645c" font-style="italic">u (flow)</text>

  <!-- amplification note -->
  <text x="330" y="272" fill="#e0645c">B grows as the tube is stretched thin</text>
</svg>
