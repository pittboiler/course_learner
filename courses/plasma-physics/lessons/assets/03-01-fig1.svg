<svg viewBox="0 0 660 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Each velocity moment of Vlasov gives one fluid equation — but every equation calls on the next moment (coral): the closure gap.</text>

  <!-- ===== the ladder of equations (left column) ===== -->

  <!-- Vlasov box -->
  <rect x="40" y="46" width="300" height="42" rx="4" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="60" y="65" fill="#4a90d9">Vlasov equation</text>
  <text x="60" y="82" fill="#8a8a8a" font-size="12">for f(x, v, t)  — full phase space</text>

  <!-- arrow Vlasov -> continuity -->
  <line x1="190" y1="88" x2="190" y2="128" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="190,128 185,118 195,118" fill="#8a8a8a"/>
  <text x="200" y="112" fill="#8a8a8a" font-size="12">∫ d³v   (0th moment)</text>

  <!-- Continuity box -->
  <rect x="40" y="130" width="300" height="42" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="56" y="149" fill="#8a8a8a" font-size="12">Continuity</text>
  <text x="56" y="166" fill="#4a90d9">∂n/∂t + ∇·(n u) = 0</text>

  <!-- arrow continuity -> momentum -->
  <line x1="190" y1="172" x2="190" y2="212" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="190,212 185,202 195,202" fill="#8a8a8a"/>
  <text x="200" y="196" fill="#8a8a8a" font-size="12">∫ v d³v   (1st)</text>

  <!-- Momentum box -->
  <rect x="40" y="214" width="300" height="42" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="56" y="233" fill="#8a8a8a" font-size="12">Momentum</text>
  <text x="56" y="250" fill="#4a90d9">m n (∂u/∂t + u·∇u) = qn(E+u×B) − ∇·P</text>

  <!-- arrow momentum -> energy -->
  <line x1="190" y1="256" x2="190" y2="296" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="190,296 185,286 195,286" fill="#8a8a8a"/>
  <text x="200" y="280" fill="#8a8a8a" font-size="12">∫ vv d³v   (2nd)</text>

  <!-- Energy box -->
  <rect x="40" y="298" width="300" height="42" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="56" y="317" fill="#8a8a8a" font-size="12">Energy / pressure</text>
  <text x="56" y="334" fill="#4a90d9">∂P/∂t + … = −∇·q</text>

  <!-- dots downward -->
  <text x="182" y="366" fill="#8a8a8a" font-size="20">⋮</text>
  <text x="205" y="366" fill="#8a8a8a" font-size="12">never ends — an infinite hierarchy</text>

  <!-- ===== the "needs next moment" annotations (right column, coral) ===== -->
  <text x="435" y="152" fill="#e0645c" font-size="12">needs u  →</text>
  <text x="435" y="236" fill="#e0645c" font-size="12">needs P  →</text>
  <text x="435" y="320" fill="#e0645c" font-size="12">needs q  →</text>

  <!-- coral bracket linking the three "needs" -->
  <path d="M 520 145 Q 534 145 534 158 L 534 228 Q 534 236 542 236 Q 534 236 534 244 L 534 314 Q 534 327 520 327"
        fill="none" stroke="#e0645c" stroke-width="1.5"/>

  <!-- closure box -->
  <rect x="470" y="378" width="170" height="58" rx="4" fill="#e0645c" opacity="0.15" stroke="#e0645c" stroke-width="2"/>
  <text x="486" y="399" fill="#e0645c" font-size="12">Closure (equation</text>
  <text x="486" y="415" fill="#e0645c" font-size="12">of state):</text>
  <text x="486" y="431" fill="#e0645c">p ∝ n^γ   ⇒  P from n</text>

  <!-- arrow from bracket to closure -->
  <line x1="542" y1="236" x2="555" y2="376" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="4 4"/>
  <polygon points="555,376 549,367 560,368" fill="#e0645c"/>
  <text x="565" y="300" fill="#8a8a8a" font-size="12" font-style="italic">truncates</text>
  <text x="565" y="316" fill="#8a8a8a" font-size="12" font-style="italic">the chain</text>
</svg>
