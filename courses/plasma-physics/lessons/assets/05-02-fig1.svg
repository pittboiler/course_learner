<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="24" y="26" fill="#8a8a8a" font-style="italic">Toroidal field (grey, the long way) + poloidal field (coral, the short way) twist every line into a helix — the rotational transform.</text>

  <!-- ===== left: perspective torus ===== -->
  <!-- outer donut rim -->
  <ellipse cx="210" cy="200" rx="176" ry="80" fill="#4a90d9" opacity="0.06"/>
  <ellipse cx="210" cy="200" rx="176" ry="80" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- inner hole -->
  <ellipse cx="210" cy="188" rx="116" ry="22" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- toroidal field arrow: rides over the top (the long way around) -->
  <path d="M 92 150 Q 210 104 328 150" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="328,150 317,146 321,156" fill="#8a8a8a"/>
  <text x="150" y="128" fill="#8a8a8a">B_tor  (toroidal, the long way)</text>

  <!-- helical field line on the front face -->
  <path d="M 64.0 172.0 L 67.8 175.7 L 71.7 181.7 L 75.3 189.7 L 78.4 199.2 L 80.9 209.6 L 82.6 220.3 L 83.6 230.4 L 84.0 239.3 L 84.0 246.5 L 83.7 251.5 L 83.5 254.1 L 83.8 254.2 L 84.7 252.0 L 86.7 247.9 L 89.8 242.4 L 94.2 236.1 L 99.9 229.7 L 106.9 223.9 L 115.0 219.3 L 124.1 216.5 L 133.7 215.9 L 143.6 217.5 L 153.5 221.4 L 163.0 227.3 L 171.9 234.8 L 180.0 243.3 L 187.1 252.2 L 193.2 260.7 L 198.3 268.2 L 202.7 274.0 L 206.5 277.7 L 210.0 279.0 L 213.5 277.7 L 217.3 274.0 L 221.7 268.2 L 226.8 260.7 L 232.9 252.2 L 240.0 243.3 L 248.1 234.8 L 257.0 227.3 L 266.5 221.4 L 276.4 217.5 L 286.3 215.9 L 295.9 216.5 L 305.0 219.3 L 313.1 223.9 L 320.1 229.7 L 325.8 236.1 L 330.2 242.4 L 333.3 247.9 L 335.3 252.0 L 336.2 254.2 L 336.5 254.1 L 336.3 251.5 L 336.0 246.5 L 336.0 239.3 L 336.4 230.4 L 337.4 220.3 L 339.1 209.6 L 341.6 199.2 L 344.7 189.7 L 348.3 181.7 L 352.2 175.7 L 356.0 172.0"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="150" y="316" fill="#4a90d9">helical field line spiraling on a flux surface</text>

  <!-- ===== right: poloidal cross-section (a cut through the tube) ===== -->
  <text x="470" y="70" fill="#8a8a8a" font-style="italic">one cross-section</text>
  <!-- plasma cross-section -->
  <circle cx="560" cy="188" r="64" fill="#4a90d9" opacity="0.06"/>
  <circle cx="560" cy="188" r="64" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- nested inner flux surface -->
  <circle cx="560" cy="188" r="38" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="596" y="150" fill="#8a8a8a">nested flux surfaces</text>

  <!-- toroidal field: out of the page at the axis -->
  <circle cx="560" cy="188" r="9" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="560" cy="188" r="1.8" fill="#8a8a8a"/>
  <text x="530" y="176" fill="#8a8a8a">B_tor</text>

  <!-- poloidal field: coral loop around the cross-section, arrow = short way -->
  <circle cx="560" cy="188" r="64" fill="none" stroke="#e0645c" stroke-width="2.5" stroke-dasharray="150 6"/>
  <polygon points="624,199 619,189 629,189" fill="#e0645c"/>
  <polygon points="571,124 561,119 561,129" fill="#e0645c"/>
  <text x="500" y="270" fill="#e0645c">B_pol  (poloidal, the short way)</text>

  <!-- annotation: safety factor -->
  <text x="452" y="316" fill="#8a8a8a">q =  toroidal turns / poloidal turns</text>
  <text x="452" y="338" fill="#8a8a8a">rotational transform  ι = 1/q</text>
</svg>
