  <!-- Alfvén (blue) -->
  <path d="M 516.0 88.0 L 516.3 91.3 L 517.4 94.5 L 519.1 97.4 L 521.3 99.9 L 524.0 101.9 L 527.1 103.2 L 530.3 103.9 L 533.7 103.9 L 536.9 103.2 L 540.0 101.9 L 542.7 99.9 L 544.9 97.4 L 546.6 94.5 L 547.7 91.3 L 548.0 88.0 L 548.3 91.3 L 549.4 94.5 L 551.1 97.4 L 553.3 99.9 L 556.0 101.9 L 559.1 103.2 L 562.3 103.9 L 565.7 103.9 L 568.9 103.2 L 572.0 101.9 L 574.7 99.9 L 576.9 97.4 L 578.6 94.5 L 579.7 91.3 L 580.0 88.0 L 579.7 84.7 L 578.6 81.5 L 576.9 78.6 L 574.7 76.1 L 572.0 74.1 L 568.9 72.8 L 565.7 72.1 L 562.3 72.1 L 559.1 72.8 L 556.0 74.1 L 553.3 76.1 L 551.1 78.6 L 549.4 81.5 L 548.3 84.7 L 548.0 88.0 L 547.7 84.7 L 546.6 81.5 L 544.9 78.6 L 542.7 76.1 L 540.0 74.1 L 536.9 72.8 L 533.7 72.1 L 530.3 72.1 L 527.1 72.8 L 524.0 74.1 L 521.3 76.1 L 519.1 78.6 L 517.4 81.5 L 516.3 84.7 L 516.0 88.0" fill="none" stroke="#4a90d9" stroke-width="1.6"/>
  <!-- fast (coral) -->
  <path d="M 516.0 88.0 L 516.3 94.7 L 517.6 101.5 L 520.2 108.2 L 524.3 114.4 L 529.8 119.5 L 536.6 123.2 L 544.1 125.1 L 551.9 125.1 L 559.4 123.2 L 566.2 119.5 L 571.7 114.4 L 575.8 108.2 L 578.4 101.5 L 579.7 94.7 L 580.0 88.0 L 579.7 81.3 L 578.4 74.5 L 575.8 67.8 L 571.7 61.6 L 566.2 56.5 L 559.4 52.8 L 551.9 50.9 L 544.1 50.9 L 536.6 52.8 L 529.8 56.5 L 524.3 61.6 L 520.2 67.8 L 517.6 74.5 L 516.3 81.3 L 516.0 88.0" fill="none" stroke="#e0645c" stroke-width="1.6"/>
  <text x="583" y="118" fill="#e0645c" font-size="11">fast</text>
  <text x="551" y="112" fill="#4a90d9" font-size="11">Alfvén</text>
  <text x="536" y="93" fill="#8a8a8a" font-size="11">slow</text>
</svg>
