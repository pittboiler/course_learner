  <text x="474" y="130" fill="#8a8a8a">B</text>

  <!-- plasma beads frozen to the middle line (blue) -->
  <circle cx="70" cy="150" r="3.6" fill="#4a90d9"/>
  <circle cx="115" cy="126.6" r="3.6" fill="#4a90d9"/>
  <circle cx="160" cy="150" r="3.6" fill="#4a90d9"/>
  <circle cx="205" cy="174" r="3.6" fill="#4a90d9"/>
  <circle cx="250" cy="150" r="3.6" fill="#4a90d9"/>
  <circle cx="295" cy="126" r="3.6" fill="#4a90d9"/>
  <circle cx="340" cy="150" r="3.6" fill="#4a90d9"/>
  <circle cx="385" cy="174" r="3.6" fill="#4a90d9"/>
  <circle cx="430" cy="150" r="3.6" fill="#4a90d9"/>

  <!-- plasma transverse velocity at a node (blue) -->
  <line x1="160" y1="150" x2="160" y2="130" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="160,127 156,136 164,136" fill="#4a90d9"/>
  <text x="165" y="135" fill="#4a90d9">v (plasma)</text>

  <!-- tension restoring force at a crest: pulls down toward equilibrium (coral) -->
  <line x1="115" y1="127" x2="115" y2="148" stroke="#e0645c" stroke-width="2"/>
  <polygon points="115,151 111,142 119,142" fill="#e0645c"/>
  <!-- tension restoring force at a trough: pulls up (coral) -->
  <line x1="205" y1="173" x2="205" y2="152" stroke="#e0645c" stroke-width="2"/>
  <polygon points="205,149 201,158 209,158" fill="#e0645c"/>
  <text x="212" y="120" fill="#e0645c">tension B²/μ₀</text>

  <!-- propagation arrow along B at v_A (coral) -->
  <line x1="150" y1="256" x2="380" y2="256" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="388,256 376,251 376,261" fill="#e0645c"/>
  <text x="230" y="278" fill="#e0645c">Alfvén wave, speed v_A</text>

  <!-- ===== Friedrichs polar inset (top right): phase speed vs angle to B ===== -->
  <text x="503" y="44" fill="#8a8a8a" font-style="italic" font-size="11">phase speed vs angle to B</text>
  <rect x="505" y="48" width="120" height="84" fill="none" stroke="#8a8a8a" stroke-width="0.8"/>
  <!-- B axis -->
  <line x1="512" y1="88" x2="600" y2="88" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="602" y="92" fill="#8a8a8a" font-size="11">B</text>
