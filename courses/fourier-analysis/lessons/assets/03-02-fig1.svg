<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="440" fill="#ffffff"/>

  <!-- faint alignment line linking the jump to the spike -->
  <line x1="320" y1="70" x2="320" y2="360" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- ===================== TOP PANEL: Heaviside step ===================== -->
  <!-- x-axis -->
  <line x1="60" y1="150" x2="590" y2="150" stroke="#1a1a1a" stroke-width="1.6"/>
  <polygon points="590,150 580,145 580,155" fill="#1a1a1a"/>
  <!-- y-axis -->
  <line x1="320" y1="185" x2="320" y2="45" stroke="#1a1a1a" stroke-width="1.6"/>
  <polygon points="320,45 315,55 325,55" fill="#1a1a1a"/>

  <!-- H = 0 branch (x < 0) -->
  <line x1="95" y1="150" x2="320" y2="150" stroke="#1d4ed8" stroke-width="3.5"/>
  <!-- jump at x = 0 -->
  <line x1="320" y1="150" x2="320" y2="70" stroke="#1d4ed8" stroke-width="3.5" stroke-dasharray="6 5"/>
  <!-- H = 1 branch (x > 0) -->
  <line x1="320" y1="70" x2="560" y2="70" stroke="#1d4ed8" stroke-width="3.5"/>

  <!-- open / closed endpoints at the jump -->
  <circle cx="320" cy="150" r="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <circle cx="320" cy="70" r="5" fill="#1d4ed8"/>

  <!-- level guide "1" -->
  <line x1="312" y1="70" x2="320" y2="70" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="300" y="75" font-size="16" fill="#1a1a1a">1</text>

  <text x="600" y="155" font-size="16" fill="#1a1a1a">x</text>
  <text x="332" y="60" font-size="17" fill="#1d4ed8" font-weight="bold">H(x)</text>
  <text x="150" y="130" font-size="14" fill="#555555">the step</text>

  <!-- ===================== BOTTOM PANEL: delta spike ===================== -->
  <!-- x-axis -->
  <line x1="60" y1="360" x2="590" y2="360" stroke="#1a1a1a" stroke-width="1.6"/>
  <polygon points="590,360 580,355 580,365" fill="#1a1a1a"/>
  <!-- y-axis -->
  <line x1="320" y1="395" x2="320" y2="255" stroke="#1a1a1a" stroke-width="1.6"/>

  <!-- delta spike (arrow of weight 1) at x = 0 -->
  <line x1="320" y1="360" x2="320" y2="245" stroke="#dc2626" stroke-width="4"/>
  <polygon points="320,238 312,254 328,254" fill="#dc2626"/>

  <text x="600" y="365" font-size="16" fill="#1a1a1a">x</text>
  <text x="332" y="250" font-size="17" fill="#dc2626" font-weight="bold">&#948;(x)</text>
  <text x="332" y="290" font-size="14" fill="#dc2626">area = 1</text>
  <text x="120" y="330" font-size="14" fill="#555555">its weak derivative</text>

  <!-- relation caption -->
  <text x="380" y="415" font-size="17" fill="#1a1a1a">H&#8242;(x) = &#948;(x)</text>
</svg>
