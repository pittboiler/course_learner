<!-- caption -->
<text x="360" y="300" text-anchor="middle" font-size="14" fill="#111">A sharp cutoff in x&#8194;&#8594;&#8194;slow 1/&#958; ripples that never quite die: sinc &#958; = sin(&#960;&#958;) / (&#960;&#958;).</text>
<text x="360" y="322" text-anchor="middle" font-size="13" fill="#555">Zeros at every nonzero integer &#958;; height 1 at &#958; = 0.</text>
</svg>
