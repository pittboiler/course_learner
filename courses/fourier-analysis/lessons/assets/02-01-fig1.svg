<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="720" height="340" fill="#ffffff"/>

<!-- ============ LEFT PANEL: the box ============ -->
<text x="180" y="34" text-anchor="middle" font-size="17" fill="#111">The box  f(x)</text>

<!-- x-axis -->
<line x1="55" y1="200" x2="320" y2="200" stroke="#111" stroke-width="1.5"/>
<polygon points="320,200 312,196 312,204" fill="#111"/>
<text x="326" y="205" font-size="14" fill="#111">x</text>
<!-- y-axis -->
<line x1="180" y1="240" x2="180" y2="80" stroke="#111" stroke-width="1.5"/>
<polygon points="180,80 176,88 184,88" fill="#111"/>

<!-- box: height 1, from x=-1/2 to 1/2 -->
<path d="M 90 200 L 135 200 L 135 105 L 225 105 L 225 200 L 300 200"
      fill="none" stroke="#c0392b" stroke-width="2.5"/>
<!-- dashed height guide -->
<line x1="135" y1="105" x2="180" y2="105" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>

<!-- ticks + labels -->
<line x1="135" y1="197" x2="135" y2="203" stroke="#111" stroke-width="1.3"/>
<line x1="225" y1="197" x2="225" y2="203" stroke="#111" stroke-width="1.3"/>
<text x="135" y="220" text-anchor="middle" font-size="13" fill="#111">&#8722;&#189;</text>
<text x="225" y="220" text-anchor="middle" font-size="13" fill="#111">&#189;</text>
<text x="170" y="101" text-anchor="end" font-size="13" fill="#111">1</text>

<!-- ============ RIGHT PANEL: the sinc ============ -->
<text x="550" y="34" text-anchor="middle" font-size="17" fill="#111">Its transform  f&#770;(&#958;) = sinc &#958;</text>

<!-- x-axis (frequency) -->
<line x1="400" y1="200" x2="700" y2="200" stroke="#111" stroke-width="1.5"/>
<polygon points="700,200 692,196 692,204" fill="#111"/>
<text x="706" y="205" font-size="14" fill="#111">&#958;</text>
<!-- y-axis at xi=0 (x=550) -->
<line x1="550" y1="240" x2="550" y2="80" stroke="#111" stroke-width="1.5"/>
<polygon points="550,80 546,88 554,88" fill="#111"/>

<!-- integer tick marks (zeros of sinc except 0) -->
<g stroke="#111" stroke-width="1.2">
<line x1="484" y1="197" x2="484" y2="203"/>
<line x1="517" y1="197" x2="517" y2="203"/>
<line x1="583" y1="197" x2="583" y2="203"/>
<line x1="616" y1="197" x2="616" y2="203"/>
<line x1="649" y1="197" x2="649" y2="203"/>
</g>
<text x="517" y="218" text-anchor="middle" font-size="12" fill="#111">&#8722;1</text>
<text x="484" y="218" text-anchor="middle" font-size="12" fill="#111">&#8722;2</text>
<text x="583" y="218" text-anchor="middle" font-size="12" fill="#111">1</text>
<text x="616" y="218" text-anchor="middle" font-size="12" fill="#111">2</text>
<text x="649" y="218" text-anchor="middle" font-size="12" fill="#111">3</text>

<!-- peak = 1 guide -->
<line x1="550" y1="105" x2="583" y2="105" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
<text x="545" y="101" text-anchor="end" font-size="13" fill="#111">1</text>

