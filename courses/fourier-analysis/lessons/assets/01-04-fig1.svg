<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="17" fill="#111">Coefficient decay is the fingerprint of smoothness</text>

  <!-- ============ LEFT PANEL: jump, ~1/n ============ -->
  <text x="185" y="58" text-anchor="middle" font-size="14" fill="#111">Function with a jump (sawtooth)</text>
  <text x="185" y="78" text-anchor="middle" font-size="13" fill="#b0341f">coefficients decay like  1/n  (slow)</text>

  <!-- axes -->
  <line x1="60" y1="300" x2="320" y2="300" stroke="#111" stroke-width="1.5"/>
  <line x1="60" y1="300" x2="60" y2="95" stroke="#111" stroke-width="1.5"/>
  <text x="46" y="100" text-anchor="end" font-size="12" fill="#111">|c_n|</text>
  <text x="322" y="318" text-anchor="middle" font-size="12" fill="#111">n</text>

  <!-- stems: height = 190/n, baseline y=300 -->
  <g stroke="#b0341f" stroke-width="3">
    <line x1="80"  y1="300" x2="80"  y2="110.0"/>
    <line x1="110" y1="300" x2="110" y2="205.0"/>
    <line x1="140" y1="300" x2="140" y2="236.7"/>
    <line x1="170" y1="300" x2="170" y2="252.5"/>
    <line x1="200" y1="300" x2="200" y2="262.0"/>
    <line x1="230" y1="300" x2="230" y2="268.3"/>
    <line x1="260" y1="300" x2="260" y2="272.9"/>
    <line x1="290" y1="300" x2="290" y2="276.3"/>
  </g>
  <g fill="#b0341f">
    <circle cx="80"  cy="110.0" r="4"/>
    <circle cx="110" cy="205.0" r="4"/>
    <circle cx="140" cy="236.7" r="4"/>
    <circle cx="170" cy="252.5" r="4"/>
    <circle cx="200" cy="262.0" r="4"/>
    <circle cx="230" cy="268.3" r="4"/>
    <circle cx="260" cy="272.9" r="4"/>
    <circle cx="290" cy="276.3" r="4"/>
  </g>
  <!-- 1/n envelope -->
  <path d="M80,110 C110,175 140,225 200,258 C240,270 280,275 300,278" fill="none" stroke="#b0341f" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/>
  <g fill="#111" font-size="11" text-anchor="middle">
    <text x="80" y="316">1</text>
    <text x="140" y="316">3</text>
    <text x="200" y="316">5</text>
    <text x="260" y="316">7</text>
  </g>

  <!-- ============ RIGHT PANEL: smooth, ~1/n^2 ============ -->
  <text x="535" y="58" text-anchor="middle" font-size="14" fill="#111">Smoother function (continuous, kinked)</text>
  <text x="535" y="78" text-anchor="middle" font-size="13" fill="#1a6b3a">coefficients decay like  1/n²  (fast)</text>

  <line x1="410" y1="300" x2="670" y2="300" stroke="#111" stroke-width="1.5"/>
  <line x1="410" y1="300" x2="410" y2="95" stroke="#111" stroke-width="1.5"/>
  <text x="396" y="100" text-anchor="end" font-size="12" fill="#111">|c_n|</text>
  <text x="672" y="318" text-anchor="middle" font-size="12" fill="#111">n</text>

  <!-- stems: height = 190/n^2, baseline y=300 -->
  <g stroke="#1a6b3a" stroke-width="3">
    <line x1="430" y1="300" x2="430" y2="110.0"/>
    <line x1="460" y1="300" x2="460" y2="252.5"/>
    <line x1="490" y1="300" x2="490" y2="278.9"/>
    <line x1="520" y1="300" x2="520" y2="288.1"/>
    <line x1="550" y1="300" x2="550" y2="292.4"/>
    <line x1="580" y1="300" x2="580" y2="294.7"/>
    <line x1="610" y1="300" x2="610" y2="296.1"/>
    <line x1="640" y1="300" x2="640" y2="297.0"/>
  </g>
  <g fill="#1a6b3a">
    <circle cx="430" cy="110.0" r="4"/>
    <circle cx="460" cy="252.5" r="4"/>
    <circle cx="490" cy="278.9" r="4"/>
    <circle cx="520" cy="288.1" r="4"/>
    <circle cx="550" cy="292.4" r="4"/>
    <circle cx="580" cy="294.7" r="4"/>
    <circle cx="610" cy="296.1" r="4"/>
    <circle cx="640" cy="297.0" r="4"/>
  </g>
  <path d="M430,110 C445,200 460,250 490,278 C540,293 600,298 650,299" fill="none" stroke="#1a6b3a" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/>
  <g fill="#111" font-size="11" text-anchor="middle">
    <text x="430" y="316">1</text>
    <text x="490" y="316">3</text>
    <text x="550" y="316">5</text>
    <text x="610" y="316">7</text>
  </g>

  <!-- footer: energy interpretation -->
  <text x="360" y="345" text-anchor="middle" font-size="12.5" fill="#111">Parseval: total energy ‖f‖² is the sum of the squared bar heights — how energy is split across modes.</text>
</svg>
