<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>

  <!-- ===================== LEFT PANEL: hierarchical assembly ===================== -->
  <text x="185" y="26" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Hierarchical assembly (bottom-up)</text>
  <text x="185" y="44" font-size="12" text-anchor="middle" fill="#555555">small dark-matter halos merge into one galaxy</text>

  <!-- time arrow -->
  <line x1="24" y1="70" x2="24" y2="360" stroke="#999999" stroke-width="1.5"/>
  <polygon points="24,368 20,356 28,356" fill="#999999"/>
  <text x="16" y="220" font-size="11" fill="#777777" transform="rotate(-90 16 220)" text-anchor="middle">time / cosmic growth</text>

  <!-- merger tree connectors -->
  <g stroke="#b8a6d9" stroke-width="2" fill="none">
    <path d="M70,80 L100,150"/>
    <path d="M120,80 L100,150"/>
    <path d="M180,80 L185,150"/>
    <path d="M235,80 L270,150"/>
    <path d="M300,80 L270,150"/>
    <path d="M100,168 L185,245"/>
    <path d="M270,168 L185,245"/>
    <path d="M185,275 L185,315"/>
  </g>

  <!-- row 1: six small halos -->
  <g fill="#7b5ea7" fill-opacity="0.25" stroke="#7b5ea7" stroke-width="1.5" stroke-dasharray="3 2">
    <circle cx="70" cy="80" r="11"/>
    <circle cx="120" cy="80" r="10"/>
    <circle cx="180" cy="80" r="12"/>
    <circle cx="235" cy="80" r="10"/>
    <circle cx="300" cy="80" r="11"/>
  </g>

  <!-- row 2: two medium halos -->
  <g fill="#7b5ea7" fill-opacity="0.22" stroke="#7b5ea7" stroke-width="1.5" stroke-dasharray="4 2">
    <circle cx="100" cy="158" r="20"/>
    <circle cx="270" cy="158" r="21"/>
  </g>

  <!-- row 3: one large halo with cooling gas core -->
  <circle cx="185" cy="258" r="34" fill="#7b5ea7" fill-opacity="0.18" stroke="#7b5ea7" stroke-width="1.5" stroke-dasharray="5 3"/>
  <circle cx="185" cy="258" r="9" fill="#ffcf5c"/>
  <text x="228" y="252" font-size="10" fill="#8a6d00">gas cools,</text>
  <text x="228" y="265" font-size="10" fill="#8a6d00">condenses to stars</text>

  <!-- final spiral galaxy -->
  <g transform="translate(185,340)">
    <ellipse cx="0" cy="0" rx="46" ry="15" fill="#cfe0f5" stroke="#3f6fb0" stroke-width="1.5"/>
    <path d="M-40,0 A40,13 0 0 1 40,0" fill="none" stroke="#3f6fb0" stroke-width="2"/>
    <path d="M40,0 A40,13 0 0 1 -40,0" fill="none" stroke="#3f6fb0" stroke-width="2" stroke-opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="10" ry="7" fill="#ffd873"/>
  </g>
  <text x="185" y="378" font-size="11" text-anchor="middle" fill="#333333">one assembled galaxy</text>

  <!-- panel divider -->
  <line x1="380" y1="60" x2="380" y2="400" stroke="#dddddd" stroke-width="1.5"/>

  <!-- ===================== RIGHT PANEL: AGN + unification ===================== -->
  <text x="575" y="26" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Active galactic nucleus (AGN)</text>
  <text x="575" y="44" font-size="12" text-anchor="middle" fill="#555555">one engine, three names by viewing angle</text>

  <!-- jets -->
  <polygon points="560,205 552,80 568,80" fill="#5b9bd5" fill-opacity="0.55" stroke="#3f6fb0" stroke-width="1"/>
  <polygon points="560,235 552,360 568,360" fill="#5b9bd5" fill-opacity="0.55" stroke="#3f6fb0" stroke-width="1"/>
  <!-- radio lobes -->
  <ellipse cx="560" cy="78" rx="26" ry="16" fill="#9ecae1" fill-opacity="0.6" stroke="#3f6fb0" stroke-width="1"/>
  <ellipse cx="560" cy="362" rx="26" ry="16" fill="#9ecae1" fill-opacity="0.6" stroke="#3f6fb0" stroke-width="1"/>

  <!-- obscuring torus (edge-on donut) -->
  <ellipse cx="560" cy="220" rx="120" ry="30" fill="none" stroke="#a9744f" stroke-width="17" stroke-opacity="0.75"/>

  <!-- accretion disk -->
  <ellipse cx="560" cy="220" rx="66" ry="16" fill="#ffb347" stroke="#e07b1a" stroke-width="1.5"/>
  <ellipse cx="560" cy="220" rx="34" ry="8" fill="#ffe08a"/>
  <!-- central SMBH -->
  <circle cx="560" cy="220" r="12" fill="#111111"/>
  <text x="560" y="224" font-size="9" text-anchor="middle" fill="#ffffff">SMBH</text>

  <!-- viewing-angle labels with sightline arrows -->
  <!-- blazar: down the jet -->
  <line x1="560" y1="70" x2="560" y2="60" stroke="#c0392b" stroke-width="2"/>
  <polygon points="560,52 555,64 565,64" fill="#c0392b"/>
  <text x="575" y="62" font-size="11" fill="#c0392b" font-weight="bold">Blazar (look down jet)</text>

  <!-- quasar / Seyfert 1: face-on disk -->
  <line x1="690" y1="150" x2="612" y2="205" stroke="#1a7a3a" stroke-width="2"/>
  <polygon points="606,210 618,206 612,197" fill="#1a7a3a"/>
  <text x="678" y="140" font-size="11" fill="#1a7a3a" font-weight="bold" text-anchor="end">Quasar / Seyfert 1</text>
  <text x="700" y="153" font-size="10" fill="#1a7a3a" text-anchor="end">(see disk)</text>

  <!-- seyfert 2: edge-on through torus -->
  <line x1="700" y1="248" x2="640" y2="228" stroke="#6b4a8a" stroke-width="2"/>
  <polygon points="634,226 646,224 640,235" fill="#6b4a8a"/>
  <text x="710" y="252" font-size="11" fill="#6b4a8a" font-weight="bold" text-anchor="end">Seyfert 2</text>
  <text x="712" y="265" font-size="10" fill="#6b4a8a" text-anchor="end">(torus blocks disk)</text>

  <!-- caption -->
  <text x="575" y="400" font-size="11" text-anchor="middle" fill="#333333">accretion disk + jets, all &lt; light-days across</text>
</svg>
