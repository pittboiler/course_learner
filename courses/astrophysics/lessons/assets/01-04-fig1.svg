<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif"><rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
  <defs>
    <marker id="varr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f3b73"/>
    </marker>
  </defs>

  <!-- LEFT: virialized cluster -->
  <text x="150" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Virialized cluster</text>
  <text x="150" y="46" text-anchor="middle" font-size="12" fill="#555">random orbits, no net expansion</text>
  <circle cx="150" cy="185" r="120" fill="#eef3fb" stroke="#8aa4cf" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- stars with velocity vectors pointing every which way -->
  <g stroke="#1f3b73" stroke-width="2" marker-end="url(#varr)">
    <line x1="120" y1="120" x2="150" y2="105"/>
    <line x1="190" y1="140" x2="170" y2="175"/>
    <line x1="95"  y1="185" x2="130" y2="195"/>
    <line x1="210" y1="205" x2="185" y2="185"/>
    <line x1="150" y1="240" x2="145" y2="205"/>
    <line x1="120" y1="235" x2="150" y2="250"/>
    <line x1="180" y1="255" x2="205" y2="235"/>
    <line x1="100" y1="150" x2="90"  y2="185"/>
    <line x1="165" y1="110" x2="200" y2="120"/>
    <line x1="135" y1="165" x2="115" y2="150"/>
  </g>
  <g fill="#f2b705" stroke="#b8860b" stroke-width="1">
    <circle cx="120" cy="120" r="4.5"/>
    <circle cx="190" cy="140" r="4.5"/>
    <circle cx="95"  cy="185" r="4.5"/>
    <circle cx="210" cy="205" r="4.5"/>
    <circle cx="150" cy="240" r="4.5"/>
    <circle cx="120" cy="235" r="4.5"/>
    <circle cx="180" cy="255" r="4.5"/>
    <circle cx="100" cy="150" r="4.5"/>
    <circle cx="165" cy="110" r="4.5"/>
    <circle cx="135" cy="165" r="4.5"/>
  </g>
  <text x="150" y="330" text-anchor="middle" font-size="12" fill="#333">size R, speeds set by &#963;</text>

  <!-- RIGHT: energy bar chart -->
  <text x="470" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Energy budget</text>
  <text x="470" y="46" text-anchor="middle" font-size="13" fill="#333">2&#10216;K&#10217; + &#10216;U&#10217; = 0</text>

  <!-- baseline (zero) -->
  <line x1="360" y1="200" x2="600" y2="200" stroke="#333" stroke-width="1.5"/>
  <text x="612" y="204" font-size="12" fill="#333">0</text>

  <!-- 2<K> bar (up, +2) -->
  <rect x="378" y="80" width="46" height="120" fill="#2e8b57" opacity="0.85"/>
  <text x="401" y="72" text-anchor="middle" font-size="13" fill="#1c5c39">2&#10216;K&#10217;</text>
  <text x="401" y="145" text-anchor="middle" font-size="12" fill="#fff">+</text>

  <!-- <U> bar (down, -2) -->
  <rect x="448" y="200" width="46" height="120" fill="#c0392b" opacity="0.85"/>
  <text x="471" y="338" text-anchor="middle" font-size="13" fill="#8c261b">&#10216;U&#10217;</text>
  <text x="471" y="265" text-anchor="middle" font-size="12" fill="#fff">&#8722;</text>

  <!-- E bar (down, -1) -->
  <rect x="518" y="200" width="46" height="60" fill="#e08e0b" opacity="0.9"/>
  <text x="541" y="278" text-anchor="middle" font-size="13" fill="#9c6208">E</text>

  <!-- annotations -->
  <line x1="378" y1="140" x2="564" y2="140" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="470" y="356" text-anchor="middle" font-size="12" fill="#333">E = &#10216;U&#10217;/2 = &#8722;&#10216;K&#10217; &lt; 0  (bound)</text>
</svg>
