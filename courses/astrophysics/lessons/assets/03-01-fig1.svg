<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif"><rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
  <defs>
    <radialGradient id="cloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c3b1e1"/>
      <stop offset="70%" stop-color="#7b5ea7"/>
      <stop offset="100%" stop-color="#4a3170"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="60%" stop-color="#e8590c"/>
      <stop offset="100%" stop-color="#7a2504"/>
    </radialGradient>
    <marker id="dn" markerWidth="10" markerHeight="10" refX="4" refY="8" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#333"/>
    </marker>
    <marker id="ax" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- ===== LEFT: fragmentation cascade ===== -->
  <text x="185" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">A cloud fragments as it collapses</text>

  <!-- stage 1: one big diffuse cloud -->
  <circle cx="185" cy="78" r="42" fill="url(#cloud)" fill-opacity="0.9"/>
  <text x="245" y="70" font-size="12" fill="#3a2a5a">low ρ</text>
  <text x="245" y="86" font-size="12" fill="#3a2a5a" font-weight="bold">M_J large</text>
  <text x="60" y="82" text-anchor="end" font-size="12" fill="#555">1 cloud</text>

  <line x1="185" y1="122" x2="185" y2="150" stroke="#333" stroke-width="2" marker-end="url(#dn)"/>
  <text x="196" y="142" font-size="11" fill="#c1121f">ρ↑, M_J↓</text>

  <!-- stage 2: three cores -->
  <circle cx="150" cy="190" r="22" fill="url(#cloud)" fill-opacity="0.9"/>
  <circle cx="205" cy="182" r="20" fill="url(#cloud)" fill-opacity="0.9"/>
  <circle cx="185" cy="220" r="18" fill="url(#cloud)" fill-opacity="0.9"/>
  <text x="60" y="196" text-anchor="end" font-size="12" fill="#555">few cores</text>

  <line x1="185" y1="242" x2="185" y2="268" stroke="#333" stroke-width="2" marker-end="url(#dn)"/>
  <text x="196" y="260" font-size="11" fill="#c1121f">ρ↑, M_J↓</text>

  <!-- stage 3: many small collapsing cores -->
  <circle cx="135" cy="305" r="10" fill="url(#core)"/>
  <circle cx="165" cy="322" r="9" fill="url(#core)"/>
  <circle cx="195" cy="300" r="11" fill="url(#core)"/>
  <circle cx="225" cy="318" r="8" fill="url(#core)"/>
  <circle cx="150" cy="340" r="7" fill="url(#core)"/>
  <circle cx="205" cy="342" r="8" fill="url(#core)"/>
  <circle cx="235" cy="298" r="6" fill="url(#core)"/>
  <text x="60" y="322" text-anchor="end" font-size="12" fill="#555">a cluster</text>
  <text x="185" y="380" text-anchor="middle" font-size="12" fill="#444">isothermal cooling keeps T fixed while ρ climbs</text>

  <!-- divider -->
  <line x1="380" y1="50" x2="380" y2="360" stroke="#ccc" stroke-width="1"/>

  <!-- ===== RIGHT: M_J vs rho ===== -->
  <text x="575" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Why: M_J ∝ ρ⁻¹ᐟ²</text>
  <!-- axes -->
  <line x1="440" y1="330" x2="730" y2="330" stroke="#333" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="440" y1="330" x2="440" y2="70" stroke="#333" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="726" y="352" font-size="12" fill="#333" text-anchor="end">density ρ  →</text>
  <text x="432" y="66" text-anchor="end" font-size="12" fill="#333">M</text>

  <!-- cloud mass: horizontal line -->
  <line x1="440" y1="150" x2="720" y2="150" stroke="#0b5394" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="446" y="142" font-size="12" fill="#0b5394" font-weight="bold">M of a clump (fixed)</text>

  <!-- M_J(rho): decreasing curve rho^-1/2 -->
  <path d="M452,92 C500,150 560,235 720,300" fill="none" stroke="#c1121f" stroke-width="3"/>
  <text x="560" y="255" font-size="13" fill="#c1121f" font-weight="bold">M_J(ρ)</text>

  <!-- crossing point -->
  <circle cx="510" cy="150" r="4.5" fill="#111"/>
  <line x1="510" y1="150" x2="510" y2="330" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="514" y="345" font-size="11" fill="#555">M_J = M</text>

  <!-- unstable shaded region to the right -->
  <text x="620" y="200" text-anchor="middle" font-size="12" fill="#7a2504" font-weight="bold">M &gt; M_J</text>
  <text x="620" y="216" text-anchor="middle" font-size="11" fill="#7a2504">collapses,</text>
  <text x="620" y="230" text-anchor="middle" font-size="11" fill="#7a2504">fragments</text>
  <text x="472" y="110" font-size="11" fill="#555">stable</text>

  <text x="585" y="380" text-anchor="middle" font-size="12" fill="#444">as ρ rises, M_J drops below the clump mass</text>
</svg>
