<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="sans-serif"><rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Thermal history: the universe cools as it expands</text>
  <text x="360" y="44" text-anchor="middle" font-size="12" fill="#666">schematic &#8212; time increases &#8594;, temperature falls, T &#8733; 1/a</text>

  <!-- radiation-dominated shaded band -->
  <rect x="70" y="60" width="500" height="248" fill="#fff4e0" stroke="none"/>
  <text x="320" y="78" text-anchor="middle" font-size="11" fill="#b8860b" font-style="italic">radiation-dominated era (&#961; &#8733; a&#8315;&#8308;)</text>

  <!-- axes -->
  <line x1="70" y1="308" x2="700" y2="308" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="70" y1="308" x2="70" y2="55" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="700" y="330" text-anchor="end" font-size="12" fill="#333">time  (10&#8315;&#8308;&#8323; s &#8594; 10&#8309; yr, log)</text>
  <text x="58" y="66" text-anchor="end" font-size="12" fill="#333">T (K)</text>

  <!-- cooling curve through the epochs -->
  <polyline points="90,70 230,231 360,247 440,251 540,258 660,300"
            fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- epoch dots -->
  <g fill="#c0392b" stroke="#7a1f14" stroke-width="1">
    <circle cx="90"  cy="70"  r="5"/>
    <circle cx="230" cy="231" r="5"/>
    <circle cx="360" cy="247" r="5"/>
    <circle cx="440" cy="251" r="5"/>
    <circle cx="540" cy="258" r="5"/>
    <circle cx="660" cy="300" r="6" fill="#2e6db4" stroke="#1c4e86"/>
  </g>

  <!-- Planck -->
  <text x="95" y="66" font-size="11.5" font-weight="bold" fill="#111">Planck era</text>
  <text x="95" y="82" font-size="10.5" fill="#555">t~10&#8315;&#8308;&#8323; s, T~10&#179;&#178; K</text>

  <!-- Quark-hadron -->
  <line x1="230" y1="231" x2="230" y2="308" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="230" y="152" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111">quark&#8211;hadron</text>
  <text x="230" y="168" text-anchor="middle" font-size="10.5" fill="#555">t~10&#8315;&#8309; s</text>
  <text x="230" y="182" text-anchor="middle" font-size="10.5" fill="#555">T~10&#185;&#178; K</text>
  <text x="230" y="196" text-anchor="middle" font-size="10" fill="#777">quarks &#8594; p, n</text>

  <!-- neutrino decoupling -->
  <line x1="360" y1="247" x2="360" y2="308" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="356" y="120" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111">&#957; decouple</text>
  <text x="356" y="136" text-anchor="middle" font-size="10.5" fill="#555">t~1 s, T~10&#185;&#8304; K</text>
  <text x="356" y="150" text-anchor="middle" font-size="10" fill="#777">(~1 MeV)</text>

  <!-- e+e- annihilation -->
  <line x1="440" y1="251" x2="440" y2="308" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="452" y="176" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111">e&#8314;e&#8315; annihilate</text>
  <text x="452" y="192" text-anchor="middle" font-size="10.5" fill="#555">T~5&#215;10&#8313; K</text>

  <!-- BBN -->
  <line x1="540" y1="258" x2="540" y2="308" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="540" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">BBN</text>
  <text x="540" y="232" text-anchor="middle" font-size="10.5" fill="#555">t~3 min, T~10&#8313; K</text>

  <!-- first-three-minutes bracket -->
  <path d="M356 296 Q356 304 366 304 L534 304 Q544 304 544 296" fill="none" stroke="#8a6d1f" stroke-width="1.3"/>
  <text x="450" y="322" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-style="italic">the first ~3 minutes: light nuclei form</text>

  <!-- recombination -->
  <line x1="660" y1="300" x2="660" y2="308" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="660" y="276" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1c4e86">recombination</text>
  <text x="660" y="292" text-anchor="middle" font-size="10.5" fill="#1c4e86">t~380 kyr</text>
  <text x="660" y="360" text-anchor="middle" font-size="10.5" fill="#1c4e86">T~3000 K</text>
  <text x="660" y="374" text-anchor="middle" font-size="10" fill="#777">CMB released (6.3)</text>

  <!-- matter era note -->
  <text x="635" y="90" text-anchor="middle" font-size="10.5" fill="#555" font-style="italic">matter-</text>
  <text x="635" y="104" text-anchor="middle" font-size="10.5" fill="#555" font-style="italic">dominated</text>
</svg>
