<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="sans-serif">
  <defs>
    <radialGradient id="disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="11%" stop-color="#bfe0ff"/>
      <stop offset="24%" stop-color="#ffe08a"/>
      <stop offset="52%" stop-color="#f0913c"/>
      <stop offset="80%" stop-color="#b23a1a"/>
      <stop offset="100%" stop-color="#5a1508"/>
    </radialGradient>
    <radialGradient id="star" cx="42%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="55%" stop-color="#ffbf3d"/>
      <stop offset="100%" stop-color="#e07f14"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">An accretion disk: gravitational energy converted to light</text>

  <!-- Jets -->
  <polygon points="486,218 502,218 512,52 476,52" fill="#3b6fd4" opacity="0.55"/>
  <polygon points="486,222 502,222 512,388 476,388" fill="#3b6fd4" opacity="0.55"/>
  <text x="522" y="70" font-size="11.5" fill="#1c3a7a">relativistic jet</text>
  <text x="522" y="84" font-size="11.5" fill="#1c3a7a">(sometimes)</text>

  <!-- Accretion disk (tilted, edge-on-ish) -->
  <ellipse cx="494" cy="220" rx="180" ry="58" fill="url(#disk)" stroke="#3a0d05" stroke-width="1.2"/>
  <!-- faint spiral / annulus hints -->
  <ellipse cx="494" cy="220" rx="130" ry="41" fill="none" stroke="#7a1c0c" stroke-width="1" opacity="0.35"/>
  <ellipse cx="494" cy="220" rx="80" ry="25" fill="none" stroke="#7a3b00" stroke-width="1" opacity="0.4"/>
  <path d="M 494 220 Q 560 200 640 222" fill="none" stroke="#2a0a04" stroke-width="1" opacity="0.3"/>
  <path d="M 494 220 Q 430 240 350 219" fill="none" stroke="#2a0a04" stroke-width="1" opacity="0.3"/>

  <!-- Compact object -->
  <circle cx="494" cy="220" r="7" fill="#000000"/>
  <circle cx="494" cy="220" r="12" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.85"/>

  <!-- Disk labels -->
  <line x1="494" y1="196" x2="494" y2="150" stroke="#333" stroke-width="1"/>
  <text x="494" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">hot inner disk</text>
  <text x="494" y="156" text-anchor="middle" font-size="11" fill="#7a1c0c">~10⁷ K → X-rays</text>

  <line x1="655" y1="228" x2="690" y2="255" stroke="#333" stroke-width="1"/>
  <text x="628" y="300" text-anchor="middle" font-size="11" fill="#7a1c0c">cool outer disk</text>
  <text x="628" y="314" text-anchor="middle" font-size="11" fill="#7a1c0c">T ∝ r⁻³ᐟ⁴</text>

  <text x="360" y="360" text-anchor="middle" font-size="11.5" fill="#333">viscosity carries angular momentum outward; matter spirals inward, heating as it falls</text>

  <!-- Companion star -->
  <circle cx="96" cy="220" r="52" fill="url(#star)" stroke="#a85a00" stroke-width="1.5"/>
  <text x="96" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5c00">companion star</text>

  <!-- Gas stream from star to disk (Roche-lobe overflow through L1) -->
  <path d="M 148 220 Q 240 168 314 202" fill="none" stroke="#e0902a" stroke-width="7" opacity="0.55" stroke-linecap="round"/>
  <path d="M 148 220 Q 240 168 314 202" fill="none" stroke="#c47010" stroke-width="2" stroke-linecap="round"/>
  <text x="215" y="150" text-anchor="middle" font-size="11.5" fill="#8a4a00">gas stream (through L1)</text>
</svg>
