<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">The Hertzsprung–Russell diagram</text>

  <!-- Plot frame -->
  <rect x="80" y="40" width="520" height="380" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- Constant-radius dashed lines -->
  <!-- R = 100 R_sun -->
  <line x1="237.6" y1="40" x2="600" y2="159" stroke="#888" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="250" y="54" font-size="11" fill="#666" transform="rotate(18 250 54)">R = 100 R⊙</text>
  <!-- R = 1 R_sun -->
  <line x1="137.8" y1="159" x2="600" y2="311" stroke="#888" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="150" y="152" font-size="11" fill="#666" transform="rotate(18 150 152)">R = 1 R⊙</text>
  <!-- R = 0.01 R_sun -->
  <line x1="80" y1="292" x2="468.7" y2="420" stroke="#888" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="92" y="286" font-size="11" fill="#666" transform="rotate(18 92 286)">R = 0.01 R⊙</text>

  <!-- Main sequence band -->
  <polyline points="137,78 219,150 358,210 468,268 540,320 600,363"
            fill="none" stroke="#f4a63a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <polyline points="137,78 219,150 358,210 468,268 540,320 600,363"
            fill="none" stroke="#c47f14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="188" font-size="13" font-weight="bold" fill="#8a5a00" transform="rotate(24 300 188)">main sequence</text>

  <!-- Giants blob (cool, luminous, upper right) -->
  <ellipse cx="512" cy="150" rx="55" ry="30" fill="#e8523a" opacity="0.35"/>
  <text x="512" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#a12a17">giants</text>
  <text x="512" y="162" text-anchor="middle" font-size="10" fill="#a12a17">cool but big</text>

  <!-- Supergiants hint (top right) -->
  <text x="470" y="70" text-anchor="middle" font-size="11" fill="#a12a17" opacity="0.8">supergiants</text>

  <!-- White dwarf blob (hot, dim, lower left) -->
  <ellipse cx="250" cy="352" rx="48" ry="24" fill="#4a76d6" opacity="0.35"/>
  <text x="250" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#22459c">white dwarfs</text>
  <text x="250" y="365" text-anchor="middle" font-size="10" fill="#22459c">hot but tiny</text>

  <!-- Sun marker -->
  <circle cx="468" cy="268" r="6" fill="#f6c026" stroke="#7a5c00" stroke-width="1.5"/>
  <text x="480" y="264" font-size="12" font-weight="bold" fill="#7a5c00">☉ Sun</text>

  <!-- Y axis label and ticks (log L / L_sun) -->
  <text x="26" y="230" font-size="13" fill="#111" transform="rotate(-90 26 230)">luminosity  L / L⊙  (log)</text>
  <!-- ticks: logL 6 -> y40, 4 ->116, 2 ->192, 0 ->268, -2 ->344, -4 ->420 -->
  <g font-size="11" fill="#333">
    <line x1="75" y1="40" x2="80" y2="40" stroke="#333"/><text x="70" y="44" text-anchor="end">10<tspan dy="-4" font-size="8">6</tspan></text>
    <line x1="75" y1="116" x2="80" y2="116" stroke="#333"/><text x="70" y="120" text-anchor="end">10<tspan dy="-4" font-size="8">4</tspan></text>
    <line x1="75" y1="192" x2="80" y2="192" stroke="#333"/><text x="70" y="196" text-anchor="end">10<tspan dy="-4" font-size="8">2</tspan></text>
    <line x1="75" y1="268" x2="80" y2="268" stroke="#333"/><text x="70" y="272" text-anchor="end">1</text>
    <line x1="75" y1="344" x2="80" y2="344" stroke="#333"/><text x="70" y="348" text-anchor="end">10<tspan dy="-4" font-size="8">-2</tspan></text>
    <line x1="75" y1="420" x2="80" y2="420" stroke="#333"/><text x="70" y="424" text-anchor="end">10<tspan dy="-4" font-size="8">-4</tspan></text>
  </g>

  <!-- X axis label (temperature, decreasing rightward) -->
  <text x="340" y="470" text-anchor="middle" font-size="13" fill="#111">temperature  T (K)  —  hotter ← → cooler</text>
  <!-- ticks: 30000 x137.8, 10000 x358, 5772 x468.7, 3000 x600 -->
  <g font-size="11" fill="#333">
    <line x1="137.8" y1="420" x2="137.8" y2="425" stroke="#333"/><text x="137.8" y="438" text-anchor="middle">30000</text>
    <line x1="358" y1="420" x2="358" y2="425" stroke="#333"/><text x="358" y="438" text-anchor="middle">10000</text>
    <line x1="468.7" y1="420" x2="468.7" y2="425" stroke="#333"/><text x="468.7" y="438" text-anchor="middle">5772</text>
    <line x1="600" y1="420" x2="600" y2="425" stroke="#333"/><text x="600" y="438" text-anchor="middle">3000</text>
  </g>

  <!-- Spectral class color bar along the top inside -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="115" y="58" fill="#3b6fd4">O</text>
    <text x="200" y="58" fill="#5a86e0">B</text>
    <text x="330" y="58" fill="#6f9bd8">A</text>
    <text x="400" y="58" fill="#c9a13a">F</text>
    <text x="455" y="58" fill="#e0a020">G</text>
    <text x="515" y="58" fill="#e07a20">K</text>
    <text x="575" y="58" fill="#d8451f">M</text>
  </g>
</svg>
