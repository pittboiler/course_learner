  <!-- ============ TOP: orbiting binary emitting ripples ============ -->
  <text x="150" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Two compact masses orbit &#8594;</text>
  <text x="150" y="41" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">spacetime ripples carry energy away</text>

  <!-- outgoing ripples (concentric, fading) -->
  <g fill="none" stroke="#2e6db4" stroke-width="1.4">
    <circle cx="150" cy="120" r="34" opacity="0.85"/>
    <circle cx="150" cy="120" r="54" opacity="0.6"/>
    <circle cx="150" cy="120" r="74" opacity="0.4"/>
    <circle cx="150" cy="120" r="94" opacity="0.22"/>
  </g>

  <!-- orbit path -->
  <ellipse cx="150" cy="120" rx="22" ry="22" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- the two masses -->
  <circle cx="128" cy="120" r="10" fill="#333" stroke="#000" stroke-width="1"/>
  <circle cx="172" cy="120" r="10" fill="#333" stroke="#000" stroke-width="1"/>
  <!-- orbital motion arrows -->
  <path d="M150 98 A22 22 0 0 1 172 120" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#tarr)"/>
  <path d="M150 142 A22 22 0 0 1 128 120" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#tarr)"/>

  <!-- right-side explanatory text -->
  <text x="330" y="82" font-size="13" fill="#333">As the pair radiates, the orbit shrinks:</text>
  <text x="330" y="102" font-size="13" fill="#333">frequency and amplitude both climb &#8212;</text>
  <text x="330" y="122" font-size="13" font-weight="bold" fill="#1c4e86">the &#8220;chirp.&#8221;</text>
  <text x="330" y="150" font-size="13" fill="#333">LIGO measures the stretch/squeeze of</text>
  <text x="330" y="170" font-size="13" fill="#333">its 4 km arms: strain</text>
  <text x="527" y="170" font-size="13" font-weight="bold" fill="#7d3c98">h &#8776; &#916;L/L &#8776; 10&#8315;&#178;&#185;.</text>

  <line x1="30" y1="205" x2="650" y2="205" stroke="#ddd" stroke-width="1"/>

