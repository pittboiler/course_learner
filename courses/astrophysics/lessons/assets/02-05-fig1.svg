<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="470" fill="#ffffff"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">The mass–luminosity relation along the main sequence</text>

  <!-- Plot frame -->
  <rect x="80" y="50" width="520" height="350" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- Reference slope guide lines (faint) -->
  <!-- The L = M^3.5 line: from (104.8,400) to (550.5,50) -->
  <polyline points="104.8,400 550.5,50" fill="none" stroke="#f4a63a" stroke-width="14" opacity="0.45" stroke-linecap="round"/>
  <polyline points="104.8,400 550.5,50" fill="none" stroke="#c47f14" stroke-width="2.2" stroke-linecap="round"/>
  <text x="300" y="205" font-size="14" font-weight="bold" fill="#8a5a00" transform="rotate(-32 300 205)">L ∝ M³·⁵</text>

  <!-- Marked stars -->
  <!-- M dwarf -->
  <circle cx="132" cy="378" r="6" fill="#d8451f" stroke="#7a1c0c" stroke-width="1.5"/>
  <text x="142" y="374" font-size="11" font-weight="bold" fill="#7a1c0c">M dwarf</text>
  <text x="142" y="388" font-size="10" fill="#7a1c0c">0.2 M⊙ · ~10¹² yr</text>

  <!-- Sun -->
  <circle cx="253.3" cy="283.3" r="6.5" fill="#f6c026" stroke="#7a5c00" stroke-width="1.5"/>
  <text x="263" y="280" font-size="11" font-weight="bold" fill="#7a5c00">☉ Sun</text>
  <text x="263" y="294" font-size="10" fill="#7a5c00">1 M⊙ · ~10 Gyr</text>

  <!-- O star -->
  <circle cx="509" cy="82" r="6.5" fill="#3b6fd4" stroke="#1c3a7a" stroke-width="1.5"/>
  <text x="382" y="78" font-size="11" font-weight="bold" fill="#1c3a7a">O star</text>
  <text x="382" y="92" font-size="10" fill="#1c3a7a">30 M⊙ · ~5 Myr</text>

  <!-- Lower mass limit shading (M < 0.08 -> off left, brown dwarf note) -->
  <text x="92" y="430" font-size="10.5" fill="#555">← below 0.08 M⊙: no H fusion (brown dwarfs)</text>
  <text x="470" y="430" font-size="10.5" fill="#555">above ~100 M⊙: Eddington limit →</text>

  <!-- Y axis label and ticks (log L / L_sun) -->
  <text x="26" y="230" font-size="13" fill="#111" transform="rotate(-90 26 230)">luminosity  L / L⊙  (log)</text>
  <g font-size="11" fill="#333">
    <line x1="75" y1="50" x2="80" y2="50" stroke="#333"/><text x="70" y="54" text-anchor="end">10⁶</text>
    <line x1="75" y1="166.7" x2="80" y2="166.7" stroke="#333"/><text x="70" y="170.7" text-anchor="end">10³</text>
    <line x1="75" y1="283.3" x2="80" y2="283.3" stroke="#333"/><text x="70" y="287.3" text-anchor="end">1</text>
    <line x1="75" y1="400" x2="80" y2="400" stroke="#333"/><text x="70" y="404" text-anchor="end">10⁻³</text>
  </g>

  <!-- X axis label and ticks (log M / M_sun) -->
  <text x="340" y="458" text-anchor="middle" font-size="13" fill="#111">mass  M / M⊙  (log)  —  more massive →</text>
  <g font-size="11" fill="#333">
    <line x1="80" y1="400" x2="80" y2="405" stroke="#333"/><text x="80" y="418" text-anchor="middle">0.1</text>
    <line x1="253.3" y1="400" x2="253.3" y2="405" stroke="#333"/><text x="253.3" y="418" text-anchor="middle">1</text>
    <line x1="426.7" y1="400" x2="426.7" y2="405" stroke="#333"/><text x="426.7" y="418" text-anchor="middle">10</text>
    <line x1="600" y1="400" x2="600" y2="405" stroke="#333"/><text x="600" y="418" text-anchor="middle">100</text>
  </g>
</svg>
