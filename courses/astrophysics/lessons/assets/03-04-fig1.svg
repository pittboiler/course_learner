<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="sans-serif"><rect x="0" y="0" width="680" height="400" fill="#ffffff"/>
  <defs>
    <marker id="inw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="strm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b8860b"/>
    </marker>
  </defs>

  <!-- ================= LEFT: core-collapse ================= -->
  <text x="175" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Core-collapse (Type II / Ib/c)</text>
  <text x="175" y="44" text-anchor="middle" font-size="12" fill="#555">a massive star eats itself inward</text>

  <!-- onion-shell core -->
  <circle cx="175" cy="200" r="98" fill="#f6e7a8" stroke="#c9b25f" stroke-width="1"/>
  <circle cx="175" cy="200" r="74" fill="#f2cf6b" stroke="#c9a648" stroke-width="1"/>
  <circle cx="175" cy="200" r="54" fill="#e8a44b" stroke="#bd8235" stroke-width="1"/>
  <circle cx="175" cy="200" r="34" fill="#d47b3c" stroke="#a55d2a" stroke-width="1"/>
  <circle cx="175" cy="200" r="17" fill="#8a8f98" stroke="#4d525a" stroke-width="1.5"/>

  <!-- shell labels -->
  <text x="175" y="118" text-anchor="middle" font-size="10.5" fill="#7a6a1f">H</text>
  <text x="175" y="139" text-anchor="middle" font-size="10.5" fill="#7a5f1f">He</text>
  <text x="175" y="160" text-anchor="middle" font-size="10.5" fill="#7a4a1f">C/O</text>
  <text x="175" y="180" text-anchor="middle" font-size="10.5" fill="#6a3a1f">Si</text>
  <text x="175" y="204" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Fe</text>

  <!-- inward collapse arrows -->
  <g stroke="#c0392b" stroke-width="2" marker-end="url(#inw)">
    <line x1="175" y1="86"  x2="175" y2="176"/>
    <line x1="175" y1="314" x2="175" y2="224"/>
    <line x1="63"  y1="200" x2="152" y2="200"/>
    <line x1="287" y1="200" x2="198" y2="200"/>
    <line x1="96"  y1="121" x2="160" y2="185"/>
    <line x1="254" y1="279" x2="190" y2="215"/>
    <line x1="254" y1="121" x2="190" y2="185"/>
    <line x1="96"  y1="279" x2="160" y2="215"/>
  </g>

  <!-- neutrino squiggles from center -->
  <g stroke="#2e6db4" stroke-width="1.6" fill="none" opacity="0.9">
    <path d="M175 200 q10 -8 20 0 q10 8 20 0 q10 -8 20 0"/>
    <path d="M175 200 q-10 -8 -20 0 q-10 8 -20 0 q-10 -8 -20 0"/>
    <path d="M175 200 q8 10 0 20 q-8 10 0 20 q8 10 0 20"/>
  </g>
  <text x="175" y="342" text-anchor="middle" font-size="12" fill="#1c4e86">&#957; burst: ~99% of the energy</text>
  <text x="175" y="362" text-anchor="middle" font-size="12" fill="#333">Fe core &gt; M&#8339;&#8341; &#8594; collapse &#8594; bounce shock</text>
  <text x="175" y="382" text-anchor="middle" font-size="12" fill="#555">leaves a neutron star or black hole</text>

  <!-- divider -->
  <line x1="340" y1="30" x2="340" y2="386" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ================= RIGHT: thermonuclear ================= -->
  <text x="510" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Thermonuclear (Type Ia)</text>
  <text x="510" y="44" text-anchor="middle" font-size="12" fill="#555">a white dwarf is fed past its limit</text>

  <!-- companion giant -->
  <circle cx="430" cy="150" r="42" fill="#f2b705" stroke="#b8860b" stroke-width="1.5"/>
  <text x="430" y="154" text-anchor="middle" font-size="11" fill="#5c4300">companion</text>

  <!-- accretion stream to disk -->
  <path d="M468 168 Q540 210 566 232" fill="none" stroke="#b8860b" stroke-width="2.5" marker-end="url(#strm)"/>
  <!-- accretion disk -->
  <ellipse cx="580" cy="238" rx="34" ry="12" fill="none" stroke="#8aa4cf" stroke-width="2"/>
  <!-- white dwarf -->
  <circle cx="580" cy="238" r="9" fill="#dbe9ff" stroke="#2e6db4" stroke-width="1.5"/>
  <text x="580" y="272" text-anchor="middle" font-size="11" fill="#1c4e86">white dwarf</text>

  <!-- runaway starburst around WD -->
  <g stroke="#e8541c" stroke-width="2" opacity="0.85">
    <line x1="580" y1="238" x2="580" y2="196"/>
    <line x1="580" y1="238" x2="618" y2="210"/>
    <line x1="580" y1="238" x2="628" y2="238"/>
    <line x1="580" y1="238" x2="618" y2="266"/>
    <line x1="580" y1="238" x2="536" y2="266"/>
    <line x1="580" y1="238" x2="612" y2="196"/>
  </g>

  <text x="510" y="316" text-anchor="middle" font-size="12" fill="#333">M &#8594; M&#8339;&#8341; &#8776; 1.4 M&#8857; &#8594; carbon detonation</text>
  <text x="510" y="336" text-anchor="middle" font-size="12" fill="#b23">star destroyed &#8212; no remnant</text>
  <text x="510" y="358" text-anchor="middle" font-size="12" fill="#555">fixed mass &#8594; fixed brightness:</text>
  <text x="510" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#1c4e86">a standardizable candle</text>
</svg>
