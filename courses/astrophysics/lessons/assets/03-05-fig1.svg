<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

  <!-- ============ LEFT PANEL: the IMF ============ -->
  <text x="205" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">The initial mass function</text>
  <rect x="70" y="40" width="270" height="310" fill="none" stroke="#333" stroke-width="1.3"/>

  <!-- turnover (dashed, low mass) -->
  <polyline points="70,150 96,132 113,126 133,136"
            fill="none" stroke="#999" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- Salpeter power law (solid), slope -2.35 from M=0.5 to M=100 -->
  <polyline points="133,136 340,349"
            fill="none" stroke="#c47f14" stroke-width="3"/>
  <text x="252" y="212" font-size="12" font-weight="bold" fill="#8a5a00" transform="rotate(45 252 212)">slope &#8722;2.35</text>

  <!-- turnover marker -->
  <line x1="133" y1="40" x2="133" y2="350" stroke="#4a76d6" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="137" y="60" font-size="10" fill="#22459c">turnover</text>
  <text x="137" y="73" font-size="10" fill="#22459c">~0.5 M&#8857;</text>

  <!-- annotations -->
  <text x="98" y="112" font-size="11" fill="#22459c" text-anchor="middle">many</text>
  <text x="98" y="125" font-size="11" fill="#22459c" text-anchor="middle">low-mass</text>
  <text x="300" y="300" font-size="11" fill="#a12a17" text-anchor="middle">few</text>
  <text x="300" y="313" font-size="11" fill="#a12a17" text-anchor="middle">massive</text>

  <!-- y axis -->
  <text x="30" y="200" font-size="12" fill="#111" transform="rotate(-90 30 200)">log &#958;(M)  (number per unit mass)</text>
  <!-- x axis -->
  <text x="205" y="388" font-size="12" fill="#111" text-anchor="middle">log ( M / M&#8857; )</text>
  <g font-size="10" fill="#333" text-anchor="middle">
    <line x1="70" y1="350" x2="70" y2="355" stroke="#333"/><text x="70" y="368">0.1</text>
    <line x1="160" y1="350" x2="160" y2="355" stroke="#333"/><text x="160" y="368">1</text>
    <line x1="250" y1="350" x2="250" y2="355" stroke="#333"/><text x="250" y="368">10</text>
    <line x1="340" y1="350" x2="340" y2="355" stroke="#333"/><text x="340" y="368">100</text>
  </g>

  <!-- ============ RIGHT PANEL: cluster HR / turnoff clock ============ -->
  <text x="545" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">A cluster's turnoff = its age</text>
  <rect x="410" y="40" width="270" height="310" fill="none" stroke="#333" stroke-width="1.3"/>

  <!-- evolved-off upper main sequence (dashed grey) -->
  <polyline points="430,70 470,110 500,142"
            fill="none" stroke="#999" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="452" y="66" font-size="10" fill="#666">massive stars</text>
  <text x="452" y="79" font-size="10" fill="#666">already gone</text>

  <!-- surviving lower main sequence (solid orange) -->
  <polyline points="500,142 560,215 620,285 660,330"
            fill="none" stroke="#c47f14" stroke-width="3"/>
  <text x="600" y="300" font-size="11" font-weight="bold" fill="#8a5a00" transform="rotate(38 600 300)">main sequence</text>

  <!-- giant branch curving off the turnoff -->
  <path d="M 500 142 C 520 120, 545 110, 560 96" fill="none" stroke="#e8523a" stroke-width="2.5"/>
  <text x="568" y="96" font-size="10" fill="#a12a17">to giants</text>

  <!-- turnoff marker -->
  <circle cx="500" cy="142" r="6" fill="#e8523a" stroke="#7a1a10" stroke-width="1.5"/>
  <text x="486" y="168" font-size="11" font-weight="bold" fill="#a12a17" text-anchor="middle">turnoff</text>
  <text x="500" y="182" font-size="10" fill="#a12a17" text-anchor="middle">M &#8776; 2 M&#8857;</text>

  <!-- read-off arrow -->
  <line x1="512" y1="140" x2="600" y2="140" stroke="#333" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="608" y="136" font-size="10" fill="#111">age =</text>
  <text x="608" y="149" font-size="10" fill="#111">t(M)</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- axes -->
  <text x="370" y="195" font-size="12" fill="#111" transform="rotate(-90 370 195)">luminosity (log)</text>
  <text x="545" y="388" font-size="12" fill="#111" text-anchor="middle">temperature  &#8212;  hotter &#8592; &#8594; cooler</text>
</svg>
