<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="470" fill="#ffffff"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Lane–Emden density profiles θ(ξ)</text>
  <text x="320" y="42" text-anchor="middle" font-size="12" fill="#555">higher n = more centrally concentrated star  ·  ρ = ρ_c θ ⁿ</text>

  <!-- Plot frame -->
  <rect x="80" y="50" width="520" height="350" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- gridline at theta=0 already the baseline; light gridlines -->
  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="80" y1="137.5" x2="600" y2="137.5"/>
    <line x1="80" y1="225" x2="600" y2="225"/>
    <line x1="80" y1="312.5" x2="600" y2="312.5"/>
  </g>

  <!-- n=5 (red): infinite radius, never reaches zero -->
  <polyline fill="none" stroke="#d8451f" stroke-width="2.5" points="80.0,50.0 88.8,50.8 97.6,53.2 106.4,57.2 115.3,62.4 124.1,68.9 132.9,76.3 141.7,84.4 150.5,93.1 159.3,102.1 168.1,111.2 176.9,120.5 185.8,129.6 194.6,138.6 203.4,147.4 212.2,155.9 221.0,164.1 229.8,172.0 238.6,179.5 247.5,186.8 256.3,193.6 265.1,200.2 273.9,206.5 282.7,212.4 291.5,218.1 300.3,223.5 309.2,228.6 318.0,233.5 326.8,238.2 335.6,242.6 344.4,246.9 353.2,250.9 362.0,254.7 370.8,258.4 379.7,261.9 388.5,265.3 397.3,268.5 406.1,271.5 414.9,274.5 423.7,277.3 432.5,280.0 441.4,282.6 450.2,285.1 459.0,287.5 467.8,289.8 476.6,292.0 485.4,294.1 494.2,296.2 503.1,298.2 511.9,300.1 520.7,301.9 529.5,303.7 538.3,305.4 547.1,307.1 555.9,308.7 564.7,310.2 573.6,311.7 582.4,313.2 591.2,314.6 600.0,315.9"/>

  <!-- n=3 (orange, thick, physically key): Eddington model / relativistic degenerate -->
  <polyline fill="none" stroke="#e08214" stroke-width="3.5" points="80.0,50.0 88.9,50.8 97.8,53.3 106.7,57.4 115.7,63.0 124.6,69.9 133.5,78.1 142.4,87.2 151.3,97.2 160.2,107.9 169.1,119.1 178.1,130.6 187.0,142.3 195.9,154.0 204.8,165.7 213.7,177.3 222.6,188.6 231.5,199.6 240.5,210.3 249.4,220.7 258.3,230.6 267.2,240.2 276.1,249.3 285.0,258.0 293.9,266.3 302.9,274.3 311.8,281.8 320.7,289.0 329.6,295.8 338.5,302.3 347.4,308.4 356.3,314.2 365.3,319.8 374.2,325.1 383.1,330.1 392.0,334.8 400.9,339.3 409.8,343.7 418.7,347.8 427.7,351.7 436.6,355.4 445.5,358.9 454.4,362.3 463.3,365.6 472.2,368.7 481.1,371.6 490.1,374.5 499.0,377.2 507.9,379.8 516.8,382.3 525.7,384.7 534.6,387.0 543.5,389.2 552.5,391.4 561.4,393.4 570.3,395.4 579.2,397.3 588.1,399.1 592.3,400.0"/>
  <circle cx="592.3" cy="400" r="4" fill="#e08214"/>

  <!-- n=1 (green): theta = sin xi / xi -->
  <polyline fill="none" stroke="#2e8b3d" stroke-width="2.5" points="80.0,50.0 84.0,50.2 87.9,50.7 91.9,51.5 95.8,52.6 99.8,54.1 103.7,55.9 107.7,58.1 111.7,60.5 115.6,63.2 119.6,66.3 123.5,69.7 127.5,73.3 131.4,77.3 135.4,81.5 139.3,86.1 143.3,90.8 147.2,95.9 151.2,101.2 155.2,106.7 159.1,112.5 163.1,118.5 167.0,124.7 171.0,131.2 174.9,137.8 178.9,144.6 182.8,151.6 186.8,158.7 190.8,166.0 194.7,173.4 198.7,181.0 202.6,188.6 206.6,196.4 210.5,204.3 214.5,212.2 218.4,220.2 222.4,228.2 226.4,236.3 230.3,244.4 234.3,252.6 238.2,260.7 242.2,268.8 246.1,276.9 250.1,285.0 254.0,293.0 258.0,300.9 262.0,308.8 265.9,316.6 269.9,324.3 273.8,331.9 277.8,339.4 281.7,346.7 285.7,354.0 289.6,361.0 293.6,368.0 297.6,374.7 301.5,381.3 305.5,387.7 309.4,394.0 313.4,400.0"/>
  <circle cx="313.4" cy="400" r="4" fill="#2e8b3d"/>

  <!-- n=0 (blue): parabola, constant density -->
  <polyline fill="none" stroke="#2a6fd6" stroke-width="2.5" points="80.0,50.0 84.7,50.2 89.3,50.9 94.0,52.1 98.7,53.7 103.3,55.8 108.0,58.3 112.7,61.3 117.3,64.7 122.0,68.6 126.7,73.0 131.3,77.8 136.0,83.1 140.7,88.9 145.3,95.1 150.0,101.8 154.7,108.9 159.3,116.5 164.0,124.6 168.6,133.1 173.3,142.0 178.0,151.5 182.6,161.4 187.3,171.7 192.0,182.5 196.6,193.8 201.3,205.6 206.0,217.8 210.6,230.4 215.3,243.5 220.0,257.1 224.6,271.1 229.3,285.6 234.0,300.6 238.6,316.0 243.3,331.9 248.0,348.2 252.6,365.0 257.3,382.3 262.0,400.0"/>
  <circle cx="262.0" cy="400" r="4" fill="#2a6fd6"/>

  <!-- Legend (upper-right, empty region) -->
  <g font-size="12">
    <rect x="418" y="66" width="172" height="98" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <line x1="428" y1="84" x2="452" y2="84" stroke="#2a6fd6" stroke-width="2.5"/>
    <text x="458" y="88" fill="#1c4f9c">n=0  (ξ₁=√6, uniform)</text>
    <line x1="428" y1="106" x2="452" y2="106" stroke="#2e8b3d" stroke-width="2.5"/>
    <text x="458" y="110" fill="#1f6e2c">n=1  (ξ₁=π, sin ξ/ξ)</text>
    <line x1="428" y1="128" x2="452" y2="128" stroke="#e08214" stroke-width="3.5"/>
    <text x="458" y="132" fill="#b5660a" font-weight="bold">n=3  (ξ₁≈6.90, γ=4/3)</text>
    <line x1="428" y1="150" x2="452" y2="150" stroke="#d8451f" stroke-width="2.5"/>
    <text x="458" y="154" fill="#d8451f">n=5  (ξ₁=∞, no surface)</text>
  </g>

  <!-- Y axis label and ticks -->
  <text x="26" y="230" font-size="13" fill="#111" transform="rotate(-90 26 230)">θ = (ρ / ρ_c)^(1/n)   [dimensionless]</text>
  <g font-size="11" fill="#333">
    <line x1="75" y1="50" x2="80" y2="50" stroke="#333"/><text x="70" y="54" text-anchor="end">1.0</text>
    <line x1="75" y1="137.5" x2="80" y2="137.5" stroke="#333"/><text x="70" y="141" text-anchor="end">0.75</text>
    <line x1="75" y1="225" x2="80" y2="225" stroke="#333"/><text x="70" y="229" text-anchor="end">0.5</text>
    <line x1="75" y1="312.5" x2="80" y2="312.5" stroke="#333"/><text x="70" y="316" text-anchor="end">0.25</text>
    <line x1="75" y1="400" x2="80" y2="400" stroke="#333"/><text x="70" y="404" text-anchor="end">0</text>
  </g>

  <!-- X axis label and ticks -->
  <text x="340" y="452" text-anchor="middle" font-size="13" fill="#111">dimensionless radius  ξ  (center ξ=0  →  surface at first zero ξ₁)</text>
  <g font-size="11" fill="#333">
    <line x1="80" y1="400" x2="80" y2="405" stroke="#333"/><text x="80" y="418" text-anchor="middle">0</text>
    <line x1="154.3" y1="400" x2="154.3" y2="405" stroke="#333"/>
    <line x1="228.6" y1="400" x2="228.6" y2="405" stroke="#333"/>
    <line x1="302.9" y1="400" x2="302.9" y2="405" stroke="#333"/><text x="302.9" y="418" text-anchor="middle" fill="#999">3</text>
    <line x1="377.1" y1="400" x2="377.1" y2="405" stroke="#333"/>
    <line x1="451.4" y1="400" x2="451.4" y2="405" stroke="#333"/>
    <line x1="525.7" y1="400" x2="525.7" y2="405" stroke="#333"/><text x="525.7" y="418" text-anchor="middle" fill="#999">6</text>
    <line x1="600" y1="400" x2="600" y2="405" stroke="#333"/><text x="600" y="418" text-anchor="middle">7</text>
  </g>
</svg>
