<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="sans-serif"><rect x="0" y="0" width="820" height="460" fill="#ffffff"/>
  <defs>
    <marker id="dn" markerWidth="10" markerHeight="10" refX="4" refY="8" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#c1121f"/>
    </marker>
  </defs>

  <!-- ================= LEFT PANEL: dark matter digs the wells first ================= -->
  <text x="215" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Dark matter digs the wells first</text>

  <!-- Row 1: equality -->
  <text x="30" y="58" font-size="11" fill="#555">z ~ 3400 (equality)</text>
  <!-- smooth photon-baryon plasma band -->
  <rect x="55" y="46" width="330" height="10" fill="#f4a6c0" fill-opacity="0.55"/>
  <circle cx="90" cy="51" r="2.5" fill="#d6336c"/><circle cx="140" cy="51" r="2.5" fill="#d6336c"/>
  <circle cx="190" cy="51" r="2.5" fill="#d6336c"/><circle cx="240" cy="51" r="2.5" fill="#d6336c"/>
  <circle cx="290" cy="51" r="2.5" fill="#d6336c"/><circle cx="340" cy="51" r="2.5" fill="#d6336c"/>
  <!-- shallow DM well -->
  <path d="M55,90 C150,90 175,102 220,102 C265,102 290,90 385,90" fill="none" stroke="#1d3557" stroke-width="2.5"/>
  <text x="402" y="80" text-anchor="end" font-size="10.5" fill="#1d3557">DM ripple: &#948; ~ 10&#8315;&#8308;</text>

  <line x1="330" y1="112" x2="330" y2="132" stroke="#c1121f" stroke-width="2" marker-end="url(#dn)"/>
  <text x="338" y="127" font-size="10.5" fill="#c1121f">&#948; &#8733; a</text>

  <!-- Row 2: recombination -->
  <text x="30" y="152" font-size="11" fill="#555">z ~ 1100 (recomb.)</text>
  <rect x="55" y="140" width="330" height="10" fill="#f4a6c0" fill-opacity="0.55"/>
  <circle cx="90" cy="145" r="2.5" fill="#d6336c"/><circle cx="140" cy="145" r="2.5" fill="#d6336c"/>
  <circle cx="190" cy="145" r="2.5" fill="#d6336c"/><circle cx="240" cy="145" r="2.5" fill="#d6336c"/>
  <circle cx="290" cy="145" r="2.5" fill="#d6336c"/><circle cx="340" cy="145" r="2.5" fill="#d6336c"/>
  <!-- deeper DM well -->
  <path d="M55,178 C140,178 165,212 220,212 C275,212 300,178 385,178" fill="none" stroke="#1d3557" stroke-width="2.5"/>
  <text x="402" y="170" text-anchor="end" font-size="10.5" fill="#1d3557">well grown: &#948; ~ 10&#8315;&#179;</text>
  <text x="118" y="132" font-size="10" fill="#d6336c">baryons held smooth (radiation pressure)</text>

  <line x1="215" y1="222" x2="215" y2="242" stroke="#c1121f" stroke-width="2" marker-end="url(#dn)"/>
  <text x="223" y="237" font-size="10.5" fill="#c1121f">baryons freed</text>

  <!-- Row 3: baryons fall in -->
  <text x="30" y="262" font-size="11" fill="#555">z ~ 10 (galaxy)</text>
  <!-- deepest DM well -->
  <path d="M55,270 C130,270 158,340 220,340 C282,340 310,270 385,270" fill="none" stroke="#1d3557" stroke-width="2.5"/>
  <!-- baryons collapsed at bottom -->
  <circle cx="205" cy="330" r="3" fill="#d6336c"/><circle cx="220" cy="335" r="3" fill="#d6336c"/>
  <circle cx="235" cy="330" r="3" fill="#d6336c"/><circle cx="212" cy="325" r="3" fill="#d6336c"/>
  <circle cx="228" cy="326" r="3" fill="#d6336c"/><circle cx="220" cy="332" r="3.5" fill="#e8590c"/>
  <!-- infall arrows -->
  <line x1="150" y1="285" x2="195" y2="322" stroke="#d6336c" stroke-width="1.6"/>
  <line x1="290" y1="285" x2="245" y2="322" stroke="#d6336c" stroke-width="1.6"/>
  <text x="402" y="262" text-anchor="end" font-size="10.5" fill="#1d3557">baryons fall in &#8594; halo</text>
  <text x="215" y="368" text-anchor="middle" font-size="11" fill="#444">baryons inherit the well DM already built</text>

  <!-- divider -->
  <line x1="410" y1="40" x2="410" y2="430" stroke="#ccc" stroke-width="1"/>

  <!-- ================= RIGHT PANEL: cold vs hot dark matter ================= -->
  <text x="615" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Cold vs hot dark matter</text>

  <!-- Cold DM box -->
  <rect x="440" y="42" width="350" height="170" fill="#eef4fb" stroke="#1d3557" stroke-width="1"/>
  <text x="452" y="60" font-size="12.5" font-weight="bold" fill="#1d3557">Cold: slow, heavy &#8594; small lumps first</text>
  <!-- cosmic web: many small halos + filaments -->
  <line x1="470" y1="90" x2="540" y2="120" stroke="#7b9acc" stroke-width="1.4"/>
  <line x1="540" y1="120" x2="620" y2="100" stroke="#7b9acc" stroke-width="1.4"/>
  <line x1="620" y1="100" x2="700" y2="140" stroke="#7b9acc" stroke-width="1.4"/>
  <line x1="540" y1="120" x2="580" y2="180" stroke="#7b9acc" stroke-width="1.4"/>
  <line x1="620" y1="100" x2="660" y2="70" stroke="#7b9acc" stroke-width="1.4"/>
  <line x1="700" y1="140" x2="750" y2="110" stroke="#7b9acc" stroke-width="1.4"/>
  <line x1="470" y1="160" x2="540" y2="120" stroke="#7b9acc" stroke-width="1.4"/>
  <line x1="580" y1="180" x2="680" y2="185" stroke="#7b9acc" stroke-width="1.4"/>
  <circle cx="470" cy="90" r="6" fill="#1d3557"/><circle cx="540" cy="120" r="9" fill="#1d3557"/>
  <circle cx="620" cy="100" r="10" fill="#1d3557"/><circle cx="700" cy="140" r="8" fill="#1d3557"/>
  <circle cx="580" cy="180" r="7" fill="#1d3557"/><circle cx="660" cy="70" r="5" fill="#1d3557"/>
  <circle cx="750" cy="110" r="6" fill="#1d3557"/><circle cx="470" cy="160" r="5" fill="#1d3557"/>
  <circle cx="680" cy="185" r="6" fill="#1d3557"/><circle cx="510" cy="70" r="4" fill="#1d3557"/>
  <text x="452" y="205" font-size="10.5" fill="#1d3557">halos, filaments, voids &#8594; merge up (bottom-up) &#10003;</text>

  <!-- Hot DM box -->
  <rect x="440" y="230" width="350" height="170" fill="#fdeeee" stroke="#c1121f" stroke-width="1"/>
  <text x="452" y="248" font-size="12.5" font-weight="bold" fill="#c1121f">Hot: fast &#8594; free-streaming erases small scales</text>
  <!-- a couple of big smooth blobs, no fine structure -->
  <ellipse cx="545" cy="320" rx="70" ry="48" fill="#f7c5c5" stroke="#c1121f" stroke-width="1"/>
  <ellipse cx="690" cy="330" rx="55" ry="40" fill="#f7c5c5" stroke="#c1121f" stroke-width="1"/>
  <text x="545" y="325" text-anchor="middle" font-size="10.5" fill="#8a1414">smooth blob</text>
  <text x="690" y="335" text-anchor="middle" font-size="10.5" fill="#8a1414">smooth blob</text>
  <text x="452" y="388" font-size="10.5" fill="#c1121f">only huge structures survive &#8594; top-down (ruled out) &#10007;</text>

  <text x="615" y="424" text-anchor="middle" font-size="11" fill="#444">observed web is finely structured &#8594; dark matter is cold</text>
</svg>
