<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="sans-serif"><rect x="0" y="0" width="640" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b8360a"/>
    </marker>
    <marker id="arrY" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c9a100"/>
    </marker>
    <marker id="arrK" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
    <radialGradient id="disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd27f"/>
      <stop offset="55%" stop-color="#f08a1d"/>
      <stop offset="100%" stop-color="#8c1f0a"/>
    </radialGradient>
  </defs>

  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">A black hole: black, but not invisible</text>

  <!-- accretion disk (edge-on ellipse) behind + in front of the horizon -->
  <ellipse cx="235" cy="215" rx="150" ry="28" fill="url(#disk)" opacity="0.9"/>
  <!-- event horizon: the black disk -->
  <circle cx="235" cy="215" r="52" fill="#000"/>
  <!-- front rim of disk drawn over the lower part of the horizon -->
  <path d="M 85 215 A 150 28 0 0 0 385 215" fill="none" stroke="#f4a63a" stroke-width="4" opacity="0.9"/>

  <!-- r_s radius line -->
  <line x1="235" y1="215" x2="235" y2="163" stroke="#fff" stroke-width="2"/>
  <circle cx="235" cy="215" r="2.5" fill="#fff"/>
  <text x="246" y="188" font-size="14" fill="#fff" font-weight="bold">r&#8202;&#8347;</text>
  <text x="235" y="300" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">event horizon</text>
  <text x="235" y="318" text-anchor="middle" font-size="12.5" fill="#333">r&#8347; = 2GM/c&#178;</text>
  <text x="235" y="256" text-anchor="middle" font-size="12" fill="#ffe9c7">accretion disk</text>

  <!-- companion star, upper right -->
  <circle cx="560" cy="120" r="30" fill="#ffe066" stroke="#d4a300" stroke-width="2"/>
  <text x="560" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">companion star</text>

  <!-- accretion stream: gas pulled off the star spiralling to the disk -->
  <path d="M 533 138 C 470 180, 430 165, 380 205" fill="none" stroke="#c9a100" stroke-width="3" stroke-dasharray="1 0" marker-end="url(#arrY)"/>
  <text x="470" y="150" text-anchor="middle" font-size="12" fill="#8a7000">gas stream</text>

  <!-- light bending: dashed straight (undeflected) vs solid curved (actual) -->
  <line x1="620" y1="330" x2="150" y2="330" stroke="#333" stroke-width="1.3" stroke-dasharray="5 4"/>
  <path d="M 620 330 C 470 330, 360 328, 300 300 C 270 286, 255 268, 250 250" fill="none" stroke="#333" stroke-width="2.4" marker-end="url(#arrK)"/>
  <text x="560" y="352" text-anchor="middle" font-size="12" fill="#555">undeflected path</text>
  <text x="360" y="292" text-anchor="middle" font-size="12" fill="#111" font-weight="bold">starlight bent by gravity</text>

  <!-- balance caption -->
  <text x="320" y="374" text-anchor="middle" font-size="12.5" fill="#333">We see it by what orbits it, what falls in and glows, and how it bends light.</text>
</svg>
