<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="sans-serif"><rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <defs>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="55%" stop-color="#ffcf40"/>
      <stop offset="100%" stop-color="#f08c00"/>
    </radialGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7b2fbe"/>
      <stop offset="17%" stop-color="#2f6bde"/>
      <stop offset="34%" stop-color="#2fbecf"/>
      <stop offset="51%" stop-color="#37c837"/>
      <stop offset="68%" stop-color="#e6d800"/>
      <stop offset="84%" stop-color="#f08c00"/>
      <stop offset="100%" stop-color="#e63030"/>
    </linearGradient>
  </defs>

  <text x="380" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Kirchhoff&#8217;s three laws: what the geometry decides</text>

  <!-- Geometry cartoon -->
  <circle cx="80" cy="110" r="42" fill="url(#star)" stroke="#c76a00" stroke-width="1.5"/>
  <text x="80" y="172" text-anchor="middle" font-size="12" fill="#333">hot dense</text>
  <text x="80" y="187" text-anchor="middle" font-size="12" fill="#333">source</text>

  <!-- cloud -->
  <ellipse cx="300" cy="110" rx="66" ry="44" fill="#3b7dd8" fill-opacity="0.28" stroke="#3b7dd8" stroke-width="1.5"/>
  <text x="300" y="110" text-anchor="middle" font-size="12" fill="#1a4a8a">cool</text>
  <text x="300" y="126" text-anchor="middle" font-size="12" fill="#1a4a8a">tenuous gas</text>

  <!-- ray through to in-line eye (absorption) -->
  <line x1="122" y1="110" x2="620" y2="110" stroke="#e0a000" stroke-width="3"/>
  <polygon points="620,110 606,104 606,116" fill="#333"/>
  <text x="660" y="106" text-anchor="middle" font-size="12" fill="#333">eye A</text>
  <text x="660" y="121" text-anchor="middle" font-size="12" fill="#333">(behind gas)</text>

  <!-- ray to off-axis eye (emission) -->
  <line x1="300" y1="66" x2="470" y2="40" stroke="#37c837" stroke-width="2.5"/>
  <polygon points="470,40 456,40 462,51" fill="#333"/>
  <text x="520" y="38" text-anchor="middle" font-size="12" fill="#333">eye B</text>
  <text x="520" y="53" text-anchor="middle" font-size="12" fill="#333">(gas only)</text>

  <!-- Spectra bars -->
  <!-- 1. continuous -->
  <text x="120" y="228" font-size="13" font-weight="bold" fill="#111">1. Hot dense source alone &#8594; continuous spectrum</text>
  <rect x="120" y="236" width="500" height="40" fill="url(#rainbow)" stroke="#111" stroke-width="1"/>

  <!-- 2. absorption -->
  <text x="120" y="308" font-size="13" font-weight="bold" fill="#111">2. Source seen through cool gas (eye A) &#8594; absorption lines</text>
  <rect x="120" y="316" width="500" height="40" fill="url(#rainbow)" stroke="#111" stroke-width="1"/>
  <rect x="260" y="316" width="4" height="40" fill="#111"/>
  <rect x="330" y="316" width="4" height="40" fill="#111"/>
  <rect x="435" y="316" width="6" height="40" fill="#111"/>

  <!-- 3. emission -->
  <text x="120" y="388" font-size="13" font-weight="bold" fill="#111">3. Cool gas alone (eye B) &#8594; emission lines</text>
  <rect x="120" y="396" width="500" height="40" fill="#0b0b16" stroke="#111" stroke-width="1"/>
  <rect x="260" y="396" width="4" height="40" fill="#2fbecf"/>
  <rect x="330" y="396" width="4" height="40" fill="#37c837"/>
  <rect x="435" y="396" width="6" height="40" fill="#f08c00"/>

  <!-- wavelength axis hint -->
  <text x="120" y="452" font-size="11" fill="#555">short &#955; (blue)</text>
  <text x="620" y="452" text-anchor="end" font-size="11" fill="#555">long &#955; (red)</text>

  <text x="700" y="336" font-size="11" fill="#555" transform="rotate(90 700 336)">same &#955;, same atoms</text>
</svg>
