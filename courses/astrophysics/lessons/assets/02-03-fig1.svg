<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif"><rect x="0" y="0" width="640" height="400" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="400" fill="none"/>
  <!-- axes -->
  <line x1="70" y1="50" x2="70" y2="340" stroke="#444" stroke-width="1.5"/>
  <line x1="70" y1="340" x2="610" y2="340" stroke="#444" stroke-width="1.5"/>
  <text x="620" y="344" font-size="14" fill="#444" text-anchor="end">energy E</text>
  <text x="40" y="45" font-size="13" fill="#444">rate</text>

  <!-- Maxwell-Boltzmann tail: falling -->
  <polyline fill="none" stroke="#1f6feb" stroke-width="2.4" points="70.0,50.0 74.5,91.4 78.9,126.9 83.4,157.3 87.8,183.4 92.3,205.7 96.7,224.9 101.2,241.3 105.6,255.4 110.1,267.5 114.5,277.8 119.0,286.7 123.4,294.3 127.9,300.8 132.4,306.4 136.8,311.2 141.3,315.3 145.7,318.9 150.2,321.9 159.1,326.7 168.0,330.2 176.9,332.8 185.8,334.7 194.7,336.1 208.1,337.6 221.4,338.5 234.8,339.0 252.6,339.5 274.9,339.8 306.1,339.9 355.0,340.0 420.0,340.0 500.0,340.0 600.0,340.0"/>

  <!-- Tunneling probability: rising -->
  <polyline fill="none" stroke="#d1242f" stroke-width="2.4" points="70.0,340.0 110.1,340.0 127.9,339.9 145.7,339.7 159.1,339.4 172.4,338.8 185.8,338.0 199.2,336.7 212.5,335.0 225.9,332.8 239.2,330.2 252.6,326.9 266.0,323.1 279.3,318.7 292.7,313.7 306.1,308.1 319.4,301.9 332.8,295.0 346.1,287.6 359.5,279.6 372.9,271.0 386.2,261.8 399.6,252.1 412.9,241.8 426.3,231.0 439.7,219.7 453.0,207.9 466.4,195.6 479.7,182.9 493.1,169.7 506.5,156.1 519.8,142.0 533.2,127.6 546.6,112.8 559.9,97.6 573.3,82.1 586.6,66.2 600.0,50.0"/>

  <!-- Gamow peak: product, filled -->
  <polygon fill="#8250df" fill-opacity="0.18" stroke="#8250df" stroke-width="2.8" points="70.0,340.0 96.7,338.9 105.6,334.1 114.5,321.2 123.4,297.2 132.4,262.5 141.3,220.1 150.2,175.2 159.1,133.0 168.0,97.4 176.9,71.2 185.8,55.5 194.7,50.0 203.6,53.6 212.5,64.7 221.4,81.4 230.3,101.8 239.2,124.4 248.2,147.9 257.1,171.0 266.0,193.2 274.9,213.8 283.8,232.5 292.7,249.3 301.6,264.0 310.5,276.8 319.4,287.8 328.3,297.1 337.2,305.0 346.1,311.5 355.0,317.0 363.9,321.4 372.9,325.1 386.2,329.4 399.6,332.5 412.9,334.7 430.8,336.7 453.0,338.2 479.7,339.2 519.8,339.7 573.3,339.9 600.0,340.0 600.0,340.0 70.0,340.0"/>

  <!-- markers -->
  <line x1="92.2" y1="340" x2="92.2" y2="330" stroke="#444" stroke-width="1"/>
  <text x="92" y="356" font-size="12" fill="#1f6feb" text-anchor="middle">k_BT</text>
  <text x="92" y="369" font-size="10" fill="#888" text-anchor="middle">~1.3 keV</text>

  <line x1="194.7" y1="340" x2="194.7" y2="45" stroke="#8250df" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="195" y="40" font-size="12" fill="#8250df" text-anchor="middle">Gamow peak E&#8320;</text>
  <text x="242" y="60" font-size="11" fill="#8250df">~6 keV</text>

  <!-- barrier arrow off to the right -->
  <line x1="600" y1="300" x2="600" y2="315" stroke="#666" stroke-width="1"/>
  <path d="M 560 307 L 600 307" stroke="#666" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="558" y="303" font-size="11" fill="#666" text-anchor="end">Coulomb barrier ~1 MeV &#8594;</text>
  <text x="558" y="317" font-size="10" fill="#888" text-anchor="end">(~150&#215; off-scale to the right)</text>

  <!-- curve labels -->
  <text x="112" y="255" font-size="13" fill="#1f6feb">M&#8211;B tail  e&#8722;E/k_BT</text>
  <text x="470" y="120" font-size="13" fill="#d1242f" text-anchor="end">tunneling  e&#8722;&#8730;(E_G/E)</text>
  <text x="205" y="80" font-size="13" fill="#8250df">product = where fusion happens</text>

  <text x="330" y="392" font-size="10.5" fill="#888" text-anchor="middle">Schematic: each curve scaled to its own peak. The true peak rate is ~e&#8722;20 of unity &#8212; tiny, but nonzero.</text>
</svg>
