<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380">
  <rect x="0" y="0" width="640" height="380" fill="#ffffff"/>

  <text x="320" y="34" font-family="sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#1a1a1a">The four-divergence is a bookkeeping law</text>
  <text x="320" y="58" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#555555">whatever leaves the box must come out of what was inside</text>

  <!-- the volume box -->
  <rect x="230" y="110" width="180" height="150" fill="#eef4fb" stroke="#2166ac" stroke-width="2.5"/>
  <text x="320" y="180" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#1a1a1a">volume V</text>
  <text x="320" y="205" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#b2182b" font-weight="bold">Q = &#8747;&#961; dV</text>

  <!-- outward current arrows (red) crossing the boundary -->
  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#b2182b"/>
    </marker>
    <marker id="arrowB" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#2166ac"/>
    </marker>
  </defs>

  <!-- J out through top -->
  <line x1="290" y1="110" x2="290" y2="66" stroke="#b2182b" stroke-width="3" marker-end="url(#arrowR)"/>
  <line x1="350" y1="110" x2="350" y2="66" stroke="#b2182b" stroke-width="3" marker-end="url(#arrowR)"/>
  <!-- J out through right -->
  <line x1="410" y1="160" x2="470" y2="160" stroke="#b2182b" stroke-width="3" marker-end="url(#arrowR)"/>
  <line x1="410" y1="210" x2="470" y2="210" stroke="#b2182b" stroke-width="3" marker-end="url(#arrowR)"/>
  <!-- J in through left (blue) -->
  <line x1="170" y1="185" x2="230" y2="185" stroke="#2166ac" stroke-width="3" marker-end="url(#arrowB)"/>

  <text x="480" y="150" font-family="sans-serif" font-size="15" fill="#b2182b" font-weight="bold">J out</text>
  <text x="120" y="180" font-family="sans-serif" font-size="15" fill="#2166ac" font-weight="bold">J in</text>

  <!-- the equations -->
  <text x="320" y="305" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="bold">&#8706;&#956; J&#8319; = 0</text>
  <text x="320" y="332" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#333333">&#8706;&#961;/&#8706;t  +  &#8711;&#183;J = 0</text>
  <text x="320" y="358" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#666666">one scalar equation, true in every frame</text>
</svg>
