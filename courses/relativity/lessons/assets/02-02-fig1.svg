<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#2c6fbb"/>
    </marker>
  </defs>

  <!-- Panel A: vector = arrow -->
  <text x="125" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2b4a">contravariant vector <tspan>V</tspan><tspan baseline-shift="super" font-size="12">&#956;</tspan></text>
  <text x="125" y="46" text-anchor="middle" font-size="13" fill="#1a2b4a">an arrow</text>
  <line x1="55" y1="290" x2="245" y2="290" stroke="#9aa5b5" stroke-width="1"/>
  <line x1="60" y1="295" x2="60" y2="70" stroke="#9aa5b5" stroke-width="1"/>
  <line x1="60" y1="285" x2="200" y2="90" stroke="#c0392b" stroke-width="3.5" marker-end="url(#arrowRed)"/>
  <text x="150" y="170" font-size="17" font-weight="bold" fill="#c0392b">V</text>
  <text x="63" y="308" font-size="12" fill="#6b7280">length and direction</text>

  <!-- Panel B: covector = stack of surfaces -->
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2b4a">covector <tspan>W</tspan><tspan baseline-shift="sub" font-size="12">&#956;</tspan></text>
  <text x="360" y="46" text-anchor="middle" font-size="13" fill="#1a2b4a">a stack of level surfaces</text>
  <line x1="285" y1="90"  x2="465" y2="90"  stroke="#2c6fbb" stroke-width="2.5"/>
  <line x1="285" y1="130" x2="465" y2="130" stroke="#2c6fbb" stroke-width="2.5"/>
  <line x1="285" y1="170" x2="465" y2="170" stroke="#2c6fbb" stroke-width="2.5"/>
  <line x1="285" y1="210" x2="465" y2="210" stroke="#2c6fbb" stroke-width="2.5"/>
  <line x1="285" y1="250" x2="465" y2="250" stroke="#2c6fbb" stroke-width="2.5"/>
  <line x1="360" y1="270" x2="360" y2="72" stroke="#2c6fbb" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowBlue)"/>
  <text x="368" y="82" font-size="17" font-weight="bold" fill="#2c6fbb">W</text>
  <text x="470" y="94"  font-size="11" fill="#6b7280">&#966;=4</text>
  <text x="470" y="254" font-size="11" fill="#6b7280">&#966;=0</text>
  <text x="285" y="308" font-size="12" fill="#6b7280">tighter spacing = bigger covector</text>

  <!-- Panel C: contraction = surfaces pierced -->
  <text x="600" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2b4a">contraction <tspan>V</tspan><tspan baseline-shift="super" font-size="12">&#956;</tspan><tspan>W</tspan><tspan baseline-shift="sub" font-size="12">&#956;</tspan></text>
  <text x="600" y="46" text-anchor="middle" font-size="13" fill="#1a2b4a">= surfaces the arrow pierces</text>
  <line x1="520" y1="90"  x2="690" y2="90"  stroke="#2c6fbb" stroke-width="2.5"/>
  <line x1="520" y1="130" x2="690" y2="130" stroke="#2c6fbb" stroke-width="2.5"/>
  <line x1="520" y1="170" x2="690" y2="170" stroke="#2c6fbb" stroke-width="2.5"/>
  <line x1="520" y1="210" x2="690" y2="210" stroke="#2c6fbb" stroke-width="2.5"/>
  <line x1="520" y1="250" x2="690" y2="250" stroke="#2c6fbb" stroke-width="2.5"/>
  <line x1="575" y1="265" x2="625" y2="120" stroke="#c0392b" stroke-width="3.5" marker-end="url(#arrowRed)"/>
  <text x="628" y="120" font-size="17" font-weight="bold" fill="#c0392b">V</text>
  <circle cx="592" cy="210" r="4" fill="#1a2b4a"/>
  <circle cx="606" cy="170" r="4" fill="#1a2b4a"/>
  <circle cx="620" cy="130" r="4" fill="#1a2b4a"/>
  <text x="520" y="308" font-size="12" fill="#1a2b4a">pierces 3 surfaces, same count in every frame</text>
</svg>
