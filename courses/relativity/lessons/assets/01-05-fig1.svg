<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400">
  <rect x="0" y="0" width="480" height="400" fill="#ffffff"/>

  <!-- axes -->
  <line x1="70" y1="336" x2="450" y2="336" stroke="#333333" stroke-width="1.5"/>
  <line x1="70" y1="336" x2="70" y2="34" stroke="#333333" stroke-width="1.5"/>
  <polygon points="450,336 442,332 442,340" fill="#333333"/>
  <polygon points="70,34 66,42 74,42" fill="#333333"/>
  <text x="456" y="340" font-family="sans-serif" font-size="15" fill="#333333">pc</text>
  <text x="60" y="30" font-family="sans-serif" font-size="15" fill="#333333">E</text>

  <!-- massless asymptote E = pc (45 deg, equal scales) -->
  <line x1="70" y1="336" x2="352" y2="54" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="300" y="60" font-family="sans-serif" font-size="13" fill="#c0392b">E = pc  (m = 0)</text>

  <!-- hyperbola E = sqrt((pc)^2 + (mc^2)^2), mc^2 = 1 unit, scale 64 px/unit -->
  <polyline fill="none" stroke="#1f5fa8" stroke-width="2.5"
    points="70,272 102,264 134,245 166,221 198,193 230,164 262,134 294,103 326,72 345,53"/>

  <!-- rest-energy intercept -->
  <circle cx="70" cy="272" r="4" fill="#1f5fa8"/>
  <line x1="70" y1="272" x2="63" y2="272" stroke="#333333" stroke-width="1.5"/>
  <text x="8" y="276" font-family="sans-serif" font-size="14" fill="#1f5fa8">mc&#178;</text>

  <!-- label on curve -->
  <text x="150" y="200" font-family="sans-serif" font-size="13" fill="#1f5fa8">E&#178; &#8722; (pc)&#178; = (mc&#178;)&#178;</text>

  <!-- a point on the curve marked as a particle state -->
  <circle cx="230" cy="164" r="3.5" fill="#111111"/>
  <text x="236" y="160" font-family="sans-serif" font-size="12" fill="#111111">a particle</text>

  <text x="200" y="368" font-family="sans-serif" font-size="12" fill="#666666">every state of a mass-m particle lives on this curve; massless states ride the red line</text>
</svg>
