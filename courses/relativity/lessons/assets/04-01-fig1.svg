<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470">
  <rect x="0" y="0" width="560" height="470" fill="#ffffff"/>

  <!-- ===== the curved manifold: a sphere (globe) ===== -->
  <circle cx="230" cy="240" r="150" fill="#eef2ff" stroke="#374151" stroke-width="2"/>
  <!-- latitude lines -->
  <ellipse cx="230" cy="185" rx="128" ry="26" fill="none" stroke="#9ca3af" stroke-width="1"/>
  <ellipse cx="230" cy="240" rx="150" ry="32" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
  <ellipse cx="230" cy="295" rx="128" ry="26" fill="none" stroke="#9ca3af" stroke-width="1"/>
  <!-- longitude lines (meridians) -->
  <ellipse cx="230" cy="240" rx="45" ry="150" fill="none" stroke="#9ca3af" stroke-width="1"/>
  <ellipse cx="230" cy="240" rx="100" ry="150" fill="none" stroke="#9ca3af" stroke-width="1"/>
  <text x="150" y="415" font-family="sans-serif" font-size="14" fill="#374151" font-style="italic">curved manifold M</text>

  <!-- ===== tangent plane at p (a tilted card resting on the sphere) ===== -->
  <!-- corners: A=p (tangency), B=A+e_a, C=A+e_a+e_b, D=A+e_b -->
  <polygon points="336,134 456,176 410,80 290,38" fill="#bfdbfe" fill-opacity="0.72" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="298" y="60" font-family="sans-serif" font-size="14" fill="#1e3a8a" font-weight="bold">T</text>
  <text x="309" y="64" font-family="sans-serif" font-size="11" fill="#1e3a8a" font-weight="bold">p</text>
  <text x="316" y="60" font-family="sans-serif" font-size="14" fill="#1e3a8a" font-weight="bold">M</text>
  <text x="286" y="78" font-family="sans-serif" font-size="10.5" fill="#1e3a8a">(flat tangent space)</text>

  <!-- coordinate basis vectors at p -->
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arV" markerWidth="10" markerHeight="10" refX="8" refY="3.6" orient="auto">
      <path d="M0,0 L9,3.6 L0,7.2 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <line x1="336" y1="134" x2="390" y2="153" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="336" y1="134" x2="318" y2="96" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="393" y="160" font-family="sans-serif" font-size="13" fill="#1d4ed8">&#8706;</text>
  <text x="401" y="164" font-family="sans-serif" font-size="10" fill="#1d4ed8">1</text>
  <text x="300" y="92" font-family="sans-serif" font-size="13" fill="#1d4ed8">&#8706;</text>
  <text x="308" y="96" font-family="sans-serif" font-size="10" fill="#1d4ed8">2</text>

  <!-- the vector V living in the tangent plane -->
  <line x1="336" y1="134" x2="382" y2="111" stroke="#b91c1c" stroke-width="3" marker-end="url(#arV)"/>
  <text x="386" y="106" font-family="sans-serif" font-size="16" fill="#b91c1c" font-weight="bold">V</text>
  <text x="352" y="128" font-family="sans-serif" font-size="10.5" fill="#b91c1c">= V&#7524;&#8706;&#7524;</text>

  <!-- tangency point p -->
  <circle cx="336" cy="134" r="4.5" fill="#111827"/>
  <text x="322" y="150" font-family="sans-serif" font-size="14" fill="#111827" font-weight="bold">p</text>

  <!-- ===== second point q with its own tangent space ===== -->
  <polygon points="140,360 214,392 196,338 122,306" fill="#fde68a" fill-opacity="0.7" stroke="#b45309" stroke-width="1.4"/>
  <line x1="140" y1="360" x2="180" y2="352" stroke="#92400e" stroke-width="3" marker-end="url(#arV)"/>
  <circle cx="140" cy="360" r="4.5" fill="#111827"/>
  <text x="120" y="378" font-family="sans-serif" font-size="14" fill="#111827" font-weight="bold">q</text>
  <text x="150" y="328" font-family="sans-serif" font-size="14" fill="#78350f" font-weight="bold">T</text>
  <text x="161" y="332" font-family="sans-serif" font-size="11" fill="#78350f" font-weight="bold">q</text>
  <text x="168" y="328" font-family="sans-serif" font-size="14" fill="#78350f" font-weight="bold">M</text>

  <!-- "cannot compare" link between the two tangent spaces -->
  <path d="M 250 350 Q 300 320 320 160" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arG)"/>
  <text x="300" y="290" font-family="sans-serif" font-size="12.5" fill="#4b5563" font-weight="bold">compare V&#8339; and V&#8340;?</text>
  <text x="318" y="308" font-family="sans-serif" font-size="12" fill="#b91c1c">not defined yet</text>

  <!-- title note -->
  <text x="20" y="30" font-family="sans-serif" font-size="14.5" fill="#111827" font-weight="bold">Locally flat: at each point p, vectors live in the tangent space T</text>
  <text x="516" y="34" font-family="sans-serif" font-size="10" fill="#111827" font-weight="bold">p</text>
  <text x="522" y="30" font-family="sans-serif" font-size="14.5" fill="#111827" font-weight="bold">M</text>
</svg>
