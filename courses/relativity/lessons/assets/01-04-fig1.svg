<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470">
  <rect x="0" y="0" width="520" height="470" fill="#ffffff"/>

  <!-- region fills: future/past cones (timelike) -->
  <polygon points="260,230 60,30 460,30" fill="#dbeafe"/>
  <polygon points="260,230 60,430 460,430" fill="#dbeafe"/>
  <!-- left/right wedges (spacelike "elsewhere") -->
  <polygon points="260,230 60,30 60,430" fill="#f3f4f6"/>
  <polygon points="260,230 460,30 460,430" fill="#f3f4f6"/>

  <!-- light cone lines (null, 45 degrees) -->
  <line x1="60" y1="430" x2="460" y2="30" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="60" y1="30" x2="460" y2="430" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- invariant hyperbolae of constant interval (timelike, upper + lower) -->
  <polyline points="110,60 160,102 210,136 260,150 310,136 360,102 410,60" fill="none" stroke="#2563eb" stroke-width="2"/>
  <polyline points="110,400 160,358 210,324 260,310 310,324 360,358 410,400" fill="none" stroke="#2563eb" stroke-width="2"/>
  <!-- invariant hyperbolae (spacelike, left + right) -->
  <polyline points="430,60 388,130 354,180 340,230 354,280 388,330 430,400" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4"/>
  <polyline points="90,60 132,130 166,180 180,230 166,280 132,330 90,400" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- axes -->
  <line x1="60" y1="230" x2="470" y2="230" stroke="#111827" stroke-width="1.5"/>
  <line x1="260" y1="440" x2="260" y2="24" stroke="#111827" stroke-width="1.5"/>
  <polygon points="470,230 461,226 461,234" fill="#111827"/>
  <polygon points="260,24 256,33 264,33" fill="#111827"/>
  <text x="476" y="234" font-family="sans-serif" font-size="15" fill="#111827">x</text>
  <text x="268" y="34" font-family="sans-serif" font-size="15" fill="#111827">ct</text>

  <!-- event at origin -->
  <circle cx="260" cy="230" r="4.5" fill="#111827"/>
  <text x="230" y="250" font-family="sans-serif" font-size="13" fill="#111827">event O</text>

  <!-- region labels -->
  <text x="205" y="72" font-family="sans-serif" font-size="14" fill="#1e3a8a" font-weight="bold">FUTURE</text>
  <text x="182" y="90" font-family="sans-serif" font-size="11" fill="#1e3a8a">absolute future</text>
  <text x="207" y="410" font-family="sans-serif" font-size="14" fill="#1e3a8a" font-weight="bold">PAST</text>
  <text x="185" y="392" font-family="sans-serif" font-size="11" fill="#1e3a8a">absolute past</text>
  <text x="78" y="222" font-family="sans-serif" font-size="13" fill="#374151" font-weight="bold">ELSEWHERE</text>
  <text x="380" y="222" font-family="sans-serif" font-size="13" fill="#374151" font-weight="bold">ELSEWHERE</text>

  <!-- interval-type labels -->
  <text x="150" y="150" font-family="sans-serif" font-size="12" fill="#1e3a8a" transform="rotate(-45 150 150)">timelike  &#916;s&#178;&lt;0</text>
  <text x="120" y="205" font-family="sans-serif" font-size="12" fill="#374151">spacelike &#916;s&#178;&gt;0</text>
  <text x="330" y="330" font-family="sans-serif" font-size="12" fill="#b45309" transform="rotate(45 330 330)">null &#916;s&#178;=0 (light)</text>
</svg>
