<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>

  <defs>
    <marker id="rad" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/>
    </marker>
    <marker id="run" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- ================= LEFT: a black hole has entropy + radiates ================= -->
  <text x="28" y="32" font-family="sans-serif" font-size="16.5" fill="#1e3a8a" font-weight="bold">A black hole has entropy</text>
  <text x="28" y="50" font-family="sans-serif" font-size="12" fill="#374151" font-style="italic">entropy lives on the horizon AREA, not the volume</text>

  <!-- radiation arrows (drawn under the disk so they emanate from the edge) -->
  <line x1="236" y1="205" x2="270" y2="205" stroke="#ea580c" stroke-width="2" marker-end="url(#rad)"/>
  <line x1="216.6" y1="251.6" x2="240.7" y2="275.7" stroke="#ea580c" stroke-width="2" marker-end="url(#rad)"/>
  <line x1="170" y1="271" x2="170" y2="305" stroke="#ea580c" stroke-width="2" marker-end="url(#rad)"/>
  <line x1="123.4" y1="251.6" x2="99.3" y2="275.7" stroke="#ea580c" stroke-width="2" marker-end="url(#rad)"/>
  <line x1="104" y1="205" x2="70" y2="205" stroke="#ea580c" stroke-width="2" marker-end="url(#rad)"/>
  <line x1="123.4" y1="158.4" x2="99.3" y2="134.3" stroke="#ea580c" stroke-width="2" marker-end="url(#rad)"/>
  <line x1="170" y1="139" x2="170" y2="105" stroke="#ea580c" stroke-width="2" marker-end="url(#rad)"/>
  <line x1="216.6" y1="158.4" x2="240.7" y2="134.3" stroke="#ea580c" stroke-width="2" marker-end="url(#rad)"/>

  <!-- faint blackbody glow -->
  <circle cx="170" cy="205" r="78" fill="#f97316" fill-opacity="0.07"/>
  <!-- the horizon: a black disk -->
  <circle cx="170" cy="205" r="62" fill="#0b1020" stroke="#1e3a8a" stroke-width="2"/>
  <!-- area shading hint on the horizon -->
  <circle cx="170" cy="205" r="62" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
  <text x="170" y="200" font-family="sans-serif" font-size="13" fill="#93c5fd" font-weight="bold" text-anchor="middle">horizon</text>
  <text x="170" y="218" font-family="sans-serif" font-size="12.5" fill="#93c5fd" text-anchor="middle">area A = 4&#960;r</text>
  <text x="212" y="214" font-family="sans-serif" font-size="8.5" fill="#93c5fd">s</text>
  <text x="217" y="211" font-family="sans-serif" font-size="8.5" fill="#93c5fd">2</text>

  <!-- entropy label -->
  <text x="170" y="330" font-family="sans-serif" font-size="14.5" fill="#1e3a8a" font-weight="bold" text-anchor="middle">S = k</text>
  <text x="200" y="334" font-family="sans-serif" font-size="9.5" fill="#1e3a8a" font-weight="bold">B</text>
  <text x="207" y="330" font-family="sans-serif" font-size="14.5" fill="#1e3a8a" font-weight="bold">A / 4&#8467;</text>
  <text x="256" y="334" font-family="sans-serif" font-size="9.5" fill="#1e3a8a" font-weight="bold">P</text>
  <text x="263" y="325" font-family="sans-serif" font-size="9.5" fill="#1e3a8a" font-weight="bold">2</text>

  <text x="170" y="356" font-family="sans-serif" font-size="12" fill="#9a3412" text-anchor="middle" font-weight="bold">Hawking radiation</text>
  <text x="170" y="373" font-family="sans-serif" font-size="11.5" fill="#9a3412" text-anchor="middle">blackbody glow at T</text>
  <text x="262" y="377" font-family="sans-serif" font-size="8.5" fill="#9a3412">H</text>

  <!-- ================= divider ================= -->
  <line x1="392" y1="70" x2="392" y2="360" stroke="#d1d5db" stroke-width="1.2"/>

  <!-- ================= RIGHT: T_H vs M, the runaway ================= -->
  <text x="430" y="32" font-family="sans-serif" font-size="16.5" fill="#7f1d1d" font-weight="bold">Smaller means hotter</text>
  <text x="430" y="50" font-family="sans-serif" font-size="12" fill="#374151" font-style="italic">T_H &#8733; 1/M  &#8594;  evaporation runs away</text>

  <!-- axes -->
  <line x1="470" y1="90" x2="470" y2="320" stroke="#374151" stroke-width="1.6"/>
  <line x1="470" y1="320" x2="720" y2="320" stroke="#374151" stroke-width="1.6"/>
  <text x="452" y="98" font-family="sans-serif" font-size="13" fill="#374151" font-weight="bold">T</text>
  <text x="461" y="102" font-family="sans-serif" font-size="9" fill="#374151">H</text>
  <text x="712" y="340" font-family="sans-serif" font-size="13" fill="#374151" font-weight="bold">M</text>

  <!-- hyperbola T = k/M -->
  <path d="M 486,102 C 500,150 512,192 540,225 C 575,266 640,292 715,300"
        fill="none" stroke="#b91c1c" stroke-width="2.6"/>

  <!-- runaway direction arrow (toward small M, high T) -->
  <path d="M 640,278 C 585,258 545,222 512,178" fill="none" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#run)"/>
  <text x="556" y="255" font-family="sans-serif" font-size="11" fill="#b91c1c" font-weight="bold">lose mass</text>
  <text x="556" y="269" font-family="sans-serif" font-size="11" fill="#b91c1c" font-weight="bold">&#8594; hotter</text>
  <text x="556" y="283" font-family="sans-serif" font-size="11" fill="#b91c1c" font-weight="bold">&#8594; faster</text>

  <!-- markers on curve -->
  <circle cx="700" cy="299" r="4" fill="#1e3a8a"/>
  <text x="612" y="308" font-family="sans-serif" font-size="10.5" fill="#1e3a8a">solar mass: ~6&#215;10</text>
  <text x="704" y="303" font-family="sans-serif" font-size="7" fill="#1e3a8a">&#8722;8</text>
  <text x="710" y="308" font-family="sans-serif" font-size="10.5" fill="#1e3a8a"> K</text>

  <circle cx="500" cy="140" r="4" fill="#1e3a8a"/>
  <text x="507" y="135" font-family="sans-serif" font-size="10.5" fill="#1e3a8a">tiny primordial hole:</text>
  <text x="507" y="149" font-family="sans-serif" font-size="10.5" fill="#1e3a8a">blazing, ~10</text>
  <text x="583" y="144" font-family="sans-serif" font-size="7" fill="#1e3a8a">11</text>
  <text x="588" y="149" font-family="sans-serif" font-size="10.5" fill="#1e3a8a"> K</text>

  <!-- formula -->
  <text x="595" y="360" font-family="sans-serif" font-size="13.5" fill="#7f1d1d" font-weight="bold" text-anchor="middle">T_H = &#8463;c&#179; / (8&#960;GMk</text>
  <text x="690" y="364" font-family="sans-serif" font-size="9" fill="#7f1d1d" font-weight="bold">B</text>
  <text x="698" y="360" font-family="sans-serif" font-size="13.5" fill="#7f1d1d" font-weight="bold">)</text>

  <!-- ================= bottom strip: the analogy ================= -->
  <line x1="28" y1="392" x2="732" y2="392" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="380" y="416" font-family="sans-serif" font-size="14" fill="#111827" font-weight="bold" text-anchor="middle">horizon area &#8596; entropy  &#183;  surface gravity &#8596; temperature  &#183;  &#948;A &#8805; 0 &#8596; &#948;S &#8805; 0</text>
</svg>
