<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360">
  <rect x="0" y="0" width="520" height="360" fill="#ffffff"/>
  <text x="260" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">The Lorentz factor &#947; = 1/&#8730;(1 &#8722; &#946;&#178;)</text>

  <!-- axes -->
  <line x1="70" y1="300" x2="480" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="70" y1="300" x2="70" y2="34" stroke="#1a1a1a" stroke-width="2"/>

  <!-- y gridline / baseline gamma = 1 -->
  <line x1="70" y1="300" x2="470" y2="300" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- y ticks -->
  <text x="60" y="305" font-family="sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">1</text>
  <text x="60" y="261" font-family="sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">2</text>
  <text x="60" y="218" font-family="sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">3</text>
  <text x="60" y="175" font-family="sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">4</text>
  <text x="60" y="131" font-family="sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">5</text>
  <text x="60" y="88" font-family="sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">6</text>
  <text x="60" y="45" font-family="sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">7</text>
  <line x1="66" y1="256.7" x2="70" y2="256.7" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="66" y1="213.3" x2="70" y2="213.3" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="66" y1="170" x2="70" y2="170" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="66" y1="126.7" x2="70" y2="126.7" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="66" y1="83.3" x2="70" y2="83.3" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="66" y1="40" x2="70" y2="40" stroke="#1a1a1a" stroke-width="1"/>

  <!-- x ticks -->
  <text x="70" y="320" font-family="sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="270" y="320" font-family="sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">0.5c</text>
  <text x="470" y="320" font-family="sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">c</text>
  <text x="275" y="345" font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">speed  v  &#8594;</text>

  <!-- asymptote at v = c -->
  <line x1="470" y1="300" x2="470" y2="40" stroke="#cc3333" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="462" y="56" font-family="sans-serif" font-size="12" fill="#cc3333" text-anchor="end">&#947; &#8594; &#8734;  as  v &#8594; c</text>

  <!-- gamma curve -->
  <polyline fill="none" stroke="#1f5fbf" stroke-width="2.5"
    points="70,300 110,299.8 150,299.1 190,297.9 230,296.1 270,293.3 310,289.2 350,282.6 370,277.8 390,271.1 410,261.1 430,243.9 442,225.4 450,204.6 458,165.1 462,125.6 464,92.1 466,36"/>

  <!-- marked points -->
  <circle cx="310" cy="289.2" r="4" fill="#1f5fbf"/>
  <text x="316" y="286" font-family="sans-serif" font-size="11" fill="#1a1a1a">0.6c: &#947;=1.25</text>
  <circle cx="390" cy="271.1" r="4" fill="#1f5fbf"/>
  <text x="396" y="268" font-family="sans-serif" font-size="11" fill="#1a1a1a">0.8c: &#947;=1.67</text>
  <circle cx="466" cy="40" r="4" fill="#1f5fbf"/>
  <text x="458" y="80" font-family="sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">0.99c: &#947;&#8776;7.1</text>

  <!-- gamma >= 1 note -->
  <text x="150" y="292" font-family="sans-serif" font-size="12" fill="#555555">&#947; &#8805; 1 always (never below the dashed floor)</text>
</svg>
