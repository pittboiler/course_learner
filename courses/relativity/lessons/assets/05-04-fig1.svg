<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480">
  <rect x="0" y="0" width="780" height="480" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#444444"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="390" y="30" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">One action, varied against the metric, gives gravity</text>
  <text x="390" y="53" font-family="sans-serif" font-size="13.5" fill="#555555" text-anchor="middle">the same machine that gave Maxwell (3.6) &#8212; now the field IS the metric g&#8342;&#8341;</text>

  <!-- ========== TOP: the two action pieces ========== -->
  <!-- S_EH box -->
  <rect x="55" y="78" width="300" height="78" rx="8" fill="#1f4e9e" fill-opacity="0.08" stroke="#1f4e9e" stroke-width="1.8"/>
  <text x="205" y="100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f4e9e" text-anchor="middle">Gravity: Einstein&#8211;Hilbert</text>
  <text x="205" y="128" font-family="sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle">S&#8339;&#8341; = (c&#8308;/16&#960;G) &#8747; R &#8730;&#8722;g d&#8308;x</text>
  <text x="205" y="147" font-family="sans-serif" font-size="12" fill="#666666" text-anchor="middle">scalar built from curvature R</text>

  <!-- plus -->
  <text x="390" y="124" font-family="sans-serif" font-size="30" font-weight="bold" fill="#333333" text-anchor="middle">+</text>

  <!-- S_matter box -->
  <rect x="425" y="78" width="300" height="78" rx="8" fill="#1a7a3a" fill-opacity="0.08" stroke="#1a7a3a" stroke-width="1.8"/>
  <text x="575" y="100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a7a3a" text-anchor="middle">Matter &amp; fields</text>
  <text x="575" y="128" font-family="sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle">S&#8344; = &#8747; &#8466;&#8344; &#8730;&#8722;g d&#8308;x</text>
  <text x="575" y="147" font-family="sans-serif" font-size="12" fill="#666666" text-anchor="middle">scalar, EM (3.6), scalar field, &#8230;</text>

  <!-- arrows down into the "vary" band -->
  <line x1="205" y1="156" x2="205" y2="196" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="575" y1="156" x2="575" y2="196" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- vary band -->
  <rect x="150" y="200" width="480" height="46" rx="23" fill="#f4e9d8" stroke="#c08a26" stroke-width="1.6"/>
  <text x="390" y="221" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#8a5a10" text-anchor="middle">Treat the metric as the field: g&#8342;&#8341; &#8594; g&#8342;&#8341; + &#948;g&#8342;&#8341;</text>
  <text x="390" y="239" font-family="sans-serif" font-size="13.5" fill="#8a5a10" text-anchor="middle">demand &#948;S = &#948;S&#8339;&#8341; + &#948;S&#8344; = 0 for every wiggle &#948;g&#8342;&#8341;</text>

  <!-- arrows down to result boxes -->
  <line x1="205" y1="246" x2="205" y2="286" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="575" y1="246" x2="575" y2="286" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- left result: EH variation -->
  <rect x="35" y="290" width="340" height="86" rx="8" fill="#1f4e9e" fill-opacity="0.06" stroke="#1f4e9e" stroke-width="1.4"/>
  <text x="205" y="313" font-family="sans-serif" font-size="13" fill="#1f4e9e" text-anchor="middle">&#948;(&#8730;&#8722;g) = &#8722;&#189;&#8730;&#8722;g g&#8342;&#8341; &#948;g&#8342;&#8341;,  &#948;R&#8342;&#8341; &#8594; boundary</text>
  <text x="205" y="340" font-family="sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">&#948;S&#8339;&#8341; = (c&#8308;/16&#960;G) &#8747;&#8730;&#8722;g G&#8342;&#8341; &#948;g&#8342;&#8341; d&#8308;x</text>
  <text x="205" y="365" font-family="sans-serif" font-size="13.5" fill="#1f4e9e" text-anchor="middle">G&#8342;&#8341; = R&#8342;&#8341; &#8722; &#189; g&#8342;&#8341; R  (Einstein tensor)</text>

  <!-- right result: matter variation defines T -->
  <rect x="405" y="290" width="340" height="86" rx="8" fill="#1a7a3a" fill-opacity="0.06" stroke="#1a7a3a" stroke-width="1.4"/>
  <text x="575" y="313" font-family="sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">&#948;S&#8344; = &#8722;&#189; &#8747;&#8730;&#8722;g T&#8342;&#8341; &#948;g&#8342;&#8341; d&#8308;x</text>
  <text x="575" y="341" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#1a7a3a" text-anchor="middle">T&#8342;&#8341; &#8801; &#8722;(2/&#8730;&#8722;g) &#948;S&#8344;/&#948;g&#8342;&#8341;</text>
  <text x="575" y="364" font-family="sans-serif" font-size="12.5" fill="#666666" text-anchor="middle">the definition of stress&#8211;energy</text>

  <!-- converge arrows -->
  <line x1="205" y1="376" x2="360" y2="416" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="575" y1="376" x2="420" y2="416" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- bottom: Einstein equations -->
  <rect x="215" y="420" width="350" height="50" rx="10" fill="#c02626" fill-opacity="0.10" stroke="#c02626" stroke-width="2"/>
  <text x="390" y="452" font-family="sans-serif" font-size="21" font-weight="bold" fill="#c02626" text-anchor="middle">G&#8342;&#8341; = (8&#960;G/c&#8308;) T&#8342;&#8341;</text>
</svg>
