<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470">
  <rect x="0" y="0" width="780" height="470" fill="#ffffff"/>

  <!-- title -->
  <text x="390" y="30" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Curvature is tidal force</text>
  <text x="390" y="53" font-family="sans-serif" font-size="13.5" fill="#444444" text-anchor="middle">nearby geodesics accelerate toward or away from each other &#8212; you cannot transform it away</text>

  <line x1="390" y1="78" x2="390" y2="455" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===================== LEFT: converging geodesics on a sphere ===================== -->
  <text x="195" y="100" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Positive curvature: they converge</text>

  <!-- sphere -->
  <circle cx="190" cy="255" r="120" fill="#1a7a3a" fill-opacity="0.06" stroke="#1a1a1a" stroke-width="1.6"/>
  <!-- equator -->
  <ellipse cx="190" cy="255" rx="120" ry="34" fill="none" stroke="#1a7a3a" stroke-width="1.1" stroke-dasharray="5 4"/>

  <!-- two geodesics (meridians): parallel at the equator, meeting at the pole -->
  <path d="M 165 288 C 146 225, 166 150, 190 128" fill="none" stroke="#1f4e9e" stroke-width="2.4"/>
  <path d="M 215 288 C 234 225, 214 150, 190 128" fill="none" stroke="#c02626" stroke-width="2.4"/>

  <!-- pole (meeting point) -->
  <circle cx="190" cy="128" r="4" fill="#1a1a1a"/>
  <text x="190" y="120" font-family="sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">they meet</text>

  <!-- start: parallel, equal separation -->
  <circle cx="165" cy="288" r="3.2" fill="#1f4e9e"/>
  <circle cx="215" cy="288" r="3.2" fill="#c02626"/>
  <line x1="165" y1="306" x2="215" y2="306" stroke="#666666" stroke-width="1"/>
  <line x1="165" y1="302" x2="165" y2="310" stroke="#666666" stroke-width="1"/>
  <line x1="215" y1="302" x2="215" y2="310" stroke="#666666" stroke-width="1"/>
  <text x="190" y="324" font-family="sans-serif" font-size="12.5" fill="#444444" text-anchor="middle">start parallel (separation &#958;)</text>

  <text x="195" y="410" font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">initially-parallel geodesics don't stay parallel</text>
  <text x="195" y="430" font-family="sans-serif" font-size="12.5" fill="#444444" text-anchor="middle">relative acceleration = R &#8800; 0</text>

  <!-- ===================== RIGHT: tidal stretch of a falling ring ===================== -->
  <text x="585" y="100" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">A falling ring is stretched to an ellipse</text>

  <!-- original ring -->
  <circle cx="585" cy="235" r="52" fill="none" stroke="#1f4e9e" stroke-width="1.4" stroke-dasharray="4 4"/>
  <g fill="#1f4e9e">
    <circle cx="585" cy="183" r="3"/><circle cx="585" cy="287" r="3"/>
    <circle cx="637" cy="235" r="3"/><circle cx="533" cy="235" r="3"/>
    <circle cx="622" cy="198" r="3"/><circle cx="622" cy="272" r="3"/>
    <circle cx="548" cy="198" r="3"/><circle cx="548" cy="272" r="3"/>
  </g>

  <!-- tidal ellipse -->
  <ellipse cx="585" cy="235" rx="32" ry="80" fill="#c02626" fill-opacity="0.06" stroke="#c02626" stroke-width="2"/>
  <g fill="#c02626">
    <circle cx="585" cy="155" r="3.4"/><circle cx="585" cy="315" r="3.4"/>
    <circle cx="617" cy="235" r="3.4"/><circle cx="553" cy="235" r="3.4"/>
    <circle cx="608" cy="178" r="3.4"/><circle cx="608" cy="292" r="3.4"/>
    <circle cx="562" cy="178" r="3.4"/><circle cx="562" cy="292" r="3.4"/>
  </g>

  <!-- stretch arrows (radial / toward-away mass) -->
  <line x1="585" y1="150" x2="585" y2="128" stroke="#c02626" stroke-width="2"/>
  <path d="M 585 124 l -4 8 l 8 0 z" fill="#c02626"/>
  <line x1="585" y1="320" x2="585" y2="342" stroke="#c02626" stroke-width="2"/>
  <path d="M 585 346 l -4 -8 l 8 0 z" fill="#c02626"/>
  <text x="663" y="200" font-family="sans-serif" font-size="12.5" fill="#c02626" text-anchor="middle">stretch</text>
  <text x="663" y="216" font-family="sans-serif" font-size="11.5" fill="#c02626" text-anchor="middle">(radial)</text>

  <!-- squeeze arrows (transverse) -->
  <line x1="529" y1="235" x2="512" y2="235" stroke="#1f4e9e" stroke-width="2"/>
  <path d="M 508 235 l 8 -4 l 0 8 z" fill="#1f4e9e"/>
  <line x1="641" y1="235" x2="658" y2="235" stroke="#1f4e9e" stroke-width="2"/>
  <path d="M 662 235 l -8 -4 l 0 8 z" fill="#1f4e9e"/>
  <text x="585" y="238" font-family="sans-serif" font-size="11.5" fill="#1f4e9e" text-anchor="middle">squeeze</text>

  <!-- mass below -->
  <circle cx="585" cy="418" r="12" fill="#1a1a1a"/>
  <text x="585" y="422" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">M</text>
  <text x="672" y="418" font-family="sans-serif" font-size="12.5" fill="#444444" text-anchor="middle">gravity source</text>

  <text x="585" y="450" font-family="sans-serif" font-size="12.5" fill="#444444" text-anchor="middle">trace = &#8711;&#178;&#934; = 0 in vacuum &#8594; volume preserved</text>
</svg>
