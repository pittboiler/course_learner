<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360">
  <rect x="0" y="0" width="560" height="360" fill="#ffffff"/>

  <!-- axes -->
  <line x1="70" y1="300" x2="525" y2="300" stroke="#111827" stroke-width="1.5"/>
  <line x1="70" y1="300" x2="70" y2="40" stroke="#111827" stroke-width="1.5"/>
  <polygon points="525,300 516,296 516,304" fill="#111827"/>
  <polygon points="70,40 66,49 74,49" fill="#111827"/>
  <text x="60" y="36" font-family="sans-serif" font-size="15" fill="#111827">&#966;</text>
  <text x="300" y="332" font-family="sans-serif" font-size="13" fill="#374151">spacetime point (a slice of the region &#937;)</text>

  <!-- shaded region between curves to suggest the variation -->
  <path d="M120,250 C 190,80 360,110 470,250 C 380,120 200,120 120,250 Z" fill="#eef2ff"/>

  <!-- trial field phi + delta phi (dashed) -->
  <path d="M120,250 C 190,80 360,110 470,250" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- physical field phi (solid) -->
  <path d="M120,250 C 200,120 390,120 470,250" fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <!-- delta-phi arrows (physical up to trial) -->
  <line x1="235" y1="163" x2="235" y2="120" stroke="#dc2626" stroke-width="1.6"/>
  <polygon points="235,113 231,122 239,122" fill="#dc2626"/>
  <line x1="300" y1="152" x2="300" y2="122" stroke="#dc2626" stroke-width="1.6"/>
  <polygon points="300,116 296,125 304,125" fill="#dc2626"/>
  <text x="244" y="145" font-family="sans-serif" font-size="14" fill="#dc2626">&#948;&#966;</text>

  <!-- pinned boundary points -->
  <circle cx="120" cy="250" r="5" fill="#111827"/>
  <circle cx="470" cy="250" r="5" fill="#111827"/>
  <text x="88" y="278" font-family="sans-serif" font-size="12" fill="#111827">&#8706;&#937;</text>
  <text x="452" y="278" font-family="sans-serif" font-size="12" fill="#111827">&#8706;&#937;</text>
  <text x="150" y="288" font-family="sans-serif" font-size="12.5" fill="#111827">boundary fixed: &#948;&#966; = 0 on &#8706;&#937;</text>

  <!-- curve labels -->
  <text x="238" y="98" font-family="sans-serif" font-size="13" fill="#6b7280">trial &#966; + &#948;&#966;</text>
  <text x="352" y="196" font-family="sans-serif" font-size="13" fill="#2563eb" font-weight="bold">physical &#966;</text>
  <text x="352" y="214" font-family="sans-serif" font-size="12" fill="#2563eb">(&#948;S = 0)</text>

  <!-- note: infinitely many DOF -->
  <text x="120" y="60" font-family="sans-serif" font-size="12" fill="#374151">a field value at every point &#8594; &#8734;-many degrees of freedom</text>
</svg>
