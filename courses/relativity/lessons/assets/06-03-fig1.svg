<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430">
  <rect x="0" y="0" width="640" height="430" fill="#ffffff"/>

  <!-- top caption arrow: decreasing r tips the cones -->
  <line x1="560" y1="58" x2="120" y2="58" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="120,58 130,53 130,63" fill="#6b7280"/>
  <text x="205" y="48" font-family="sans-serif" font-size="13" fill="#374151">decreasing r  &#8594;  light cones tip toward r = 0</text>

  <!-- time arrow (left) -->
  <line x1="50" y1="400" x2="50" y2="95" stroke="#111827" stroke-width="1.5"/>
  <polygon points="50,95 45,105 55,105" fill="#111827"/>
  <text x="20" y="250" font-family="sans-serif" font-size="13" fill="#111827" transform="rotate(-90 20 250)">time (advanced)</text>

  <!-- r-axis -->
  <line x1="70" y1="400" x2="615" y2="400" stroke="#111827" stroke-width="1.5"/>
  <polygon points="615,400 605,395 605,405" fill="#111827"/>
  <text x="620" y="405" font-family="sans-serif" font-size="14" fill="#111827">r</text>
  <text x="86" y="418" font-family="sans-serif" font-size="12" fill="#111827">0</text>
  <text x="290" y="418" font-family="sans-serif" font-size="12" fill="#7c3aed">r_s</text>

  <!-- event horizon (dashed vertical at r_s) -->
  <line x1="300" y1="80" x2="300" y2="400" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="306" y="94" font-family="sans-serif" font-size="12" fill="#7c3aed" font-weight="bold">event horizon</text>

  <!-- singularity at r = 0 (jagged red world-line) -->
  <polyline points="92,400 98,385 86,370 98,355 86,340 98,325 86,310 98,295 86,280 98,265 86,250 98,235 86,220 98,205 86,190 98,175 86,160 98,145 86,130 98,115 90,100" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="60" y="378" font-family="sans-serif" font-size="12" fill="#dc2626" font-weight="bold">r = 0</text>
  <text x="24" y="130" font-family="sans-serif" font-size="11" fill="#dc2626">curvature</text>
  <text x="24" y="144" font-family="sans-serif" font-size="11" fill="#dc2626">&#8594; &#8734;</text>

  <!-- ==== light cones (fill blue, null edges amber) ==== -->
  <!-- A: far, upright -->
  <polygon points="520,360 468,308 572,308" fill="#dbeafe"/>
  <line x1="520" y1="360" x2="468" y2="308" stroke="#f59e0b" stroke-width="2"/>
  <line x1="520" y1="360" x2="572" y2="308" stroke="#f59e0b" stroke-width="2"/>
  <text x="576" y="332" font-family="sans-serif" font-size="11" fill="#374151">light still</text>
  <text x="576" y="345" font-family="sans-serif" font-size="11" fill="#374151">escapes</text>

  <!-- B: near outside -->
  <polygon points="400,305 348,253 420,253" fill="#dbeafe"/>
  <line x1="400" y1="305" x2="348" y2="253" stroke="#f59e0b" stroke-width="2"/>
  <line x1="400" y1="305" x2="420" y2="253" stroke="#f59e0b" stroke-width="2"/>

  <!-- C: at the horizon (outgoing edge vertical) -->
  <polygon points="300,258 248,206 300,206" fill="#dbeafe"/>
  <line x1="300" y1="258" x2="248" y2="206" stroke="#f59e0b" stroke-width="2"/>
  <line x1="300" y1="258" x2="300" y2="206" stroke="#f59e0b" stroke-width="2"/>
  <text x="312" y="176" font-family="sans-serif" font-size="11" fill="#374151">at r_s: outgoing</text>
  <text x="312" y="189" font-family="sans-serif" font-size="11" fill="#374151">ray is vertical</text>

  <!-- D: inside, tipped -->
  <polygon points="215,220 163,168 193,168" fill="#dbeafe"/>
  <line x1="215" y1="220" x2="163" y2="168" stroke="#f59e0b" stroke-width="2"/>
  <line x1="215" y1="220" x2="193" y2="168" stroke="#f59e0b" stroke-width="2"/>

  <!-- E: deep inside, fully tipped toward r=0 -->
  <polygon points="140,192 108,140 128,140" fill="#dbeafe"/>
  <line x1="140" y1="192" x2="108" y2="140" stroke="#f59e0b" stroke-width="2"/>
  <line x1="140" y1="192" x2="128" y2="140" stroke="#f59e0b" stroke-width="2"/>
  <text x="120" y="120" font-family="sans-serif" font-size="11" fill="#1e3a8a">inside horizon:</text>
  <text x="120" y="133" font-family="sans-serif" font-size="11" fill="#1e3a8a">every future &#8594; r = 0</text>

  <!-- infalling worldline threading the cones -->
  <polyline points="520,360 400,305 300,258 215,220 140,192 96,160" fill="none" stroke="#111827" stroke-width="2.5"/>
  <circle cx="520" cy="360" r="3.5" fill="#111827"/>
  <circle cx="400" cy="305" r="3.5" fill="#111827"/>
  <circle cx="300" cy="258" r="3.5" fill="#111827"/>
  <circle cx="215" cy="220" r="3.5" fill="#111827"/>
  <circle cx="140" cy="192" r="3.5" fill="#111827"/>
  <circle cx="96" cy="160" r="4.5" fill="#dc2626"/>
  <text x="360" y="390" font-family="sans-serif" font-size="12" fill="#111827">infalling worldline (stays inside its cones)</text>
</svg>
