<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="640" height="340" fill="#ffffff"/>

  <defs>
    <marker id="ahd" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#555555"/>
    </marker>
    <marker id="ahb" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="ahv" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#2b6cb0"/>
    </marker>
  </defs>

  <!-- divider -->
  <line x1="320" y1="30" x2="320" y2="310" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- ===================== LEFT: rest frame, isotropic ===================== -->
  <text x="150" y="45" fill="#333333" text-anchor="middle" font-weight="bold">Source rest frame</text>
  <text x="150" y="63" fill="#777777" text-anchor="middle" font-style="italic">emission is isotropic</text>

  <!-- isotropic arrows from (150,175), r=55, every 30 deg -->
  <line x1="150" y1="175" x2="205" y2="175" stroke="#555555" stroke-width="1.6" marker-end="url(#ahd)"/>
  <line x1="150" y1="175" x2="197.6" y2="147.5" stroke="#555555" stroke-width="1.6" marker-end="url(#ahd)"/>
  <line x1="150" y1="175" x2="177.5" y2="127.4" stroke="#555555" stroke-width="1.6" marker-end="url(#ahd)"/>
  <line x1="150" y1="175" x2="150" y2="120" stroke="#555555" stroke-width="1.6" marker-end="url(#ahd)"/>
  <line x1="150" y1="175" x2="122.5" y2="127.4" stroke="#555555" stroke-width="1.6" marker-end="url(#ahd)"/>
  <line x1="150" y1="175" x2="102.4" y2="147.5" stroke="#555555" stroke-width="1.6" marker-end="url(#ahd)"/>
  <line x1="150" y1="175" x2="95" y2="175" stroke="#555555" stroke-width="1.6" marker-end="url(#ahd)"/>
  <line x1="150" y1="175" x2="102.4" y2="202.5" stroke="#555555" stroke-width="1.6" marker-end="url(#ahd)"/>
  <line x1="150" y1="175" x2="122.5" y2="222.6" stroke="#555555" stroke-width="1.6" marker-end="url(#ahd)"/>
  <line x1="150" y1="175" x2="150" y2="230" stroke="#555555" stroke-width="1.6" marker-end="url(#ahd)"/>
  <line x1="150" y1="175" x2="177.5" y2="222.6" stroke="#555555" stroke-width="1.6" marker-end="url(#ahd)"/>
  <line x1="150" y1="175" x2="197.6" y2="202.5" stroke="#555555" stroke-width="1.6" marker-end="url(#ahd)"/>
  <circle cx="150" cy="175" r="6" fill="#333333"/>

  <text x="150" y="300" fill="#777777" text-anchor="middle" font-style="italic">half the photons go forward, half back</text>

  <!-- ===================== RIGHT: lab frame, beamed ===================== -->
  <text x="470" y="45" fill="#333333" text-anchor="middle" font-weight="bold">Lab frame (source ultrarelativistic)</text>
  <text x="470" y="63" fill="#777777" text-anchor="middle" font-style="italic">the "headlight" cone, half-angle ~ 1/&#947;</text>

  <!-- velocity arrow -->
  <line x1="360" y1="175" x2="400" y2="175" stroke="#2b6cb0" stroke-width="3" marker-end="url(#ahv)"/>
  <text x="378" y="167" fill="#2b6cb0" text-anchor="middle">v = &#946;c</text>

  <!-- source point -->
  <circle cx="410" cy="175" r="6" fill="#333333"/>

  <!-- cone boundary dashed, +/- ~24 deg, length 150 -->
  <line x1="410" y1="175" x2="547" y2="114" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="410" y1="175" x2="547" y2="236" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- beamed photons: tight forward cone, length ~95 -->
  <line x1="410" y1="175" x2="505" y2="175" stroke="#c0392b" stroke-width="1.8" marker-end="url(#ahb)"/>
  <line x1="410" y1="175" x2="504.7" y2="168.4" stroke="#c0392b" stroke-width="1.8" marker-end="url(#ahb)"/>
  <line x1="410" y1="175" x2="504.7" y2="181.6" stroke="#c0392b" stroke-width="1.8" marker-end="url(#ahb)"/>
  <line x1="410" y1="175" x2="503.7" y2="161.8" stroke="#c0392b" stroke-width="1.8" marker-end="url(#ahb)"/>
  <line x1="410" y1="175" x2="503.7" y2="188.2" stroke="#c0392b" stroke-width="1.8" marker-end="url(#ahb)"/>
  <line x1="410" y1="175" x2="502.1" y2="155.4" stroke="#c0392b" stroke-width="1.8" marker-end="url(#ahb)"/>
  <line x1="410" y1="175" x2="502.1" y2="194.6" stroke="#c0392b" stroke-width="1.8" marker-end="url(#ahb)"/>
  <line x1="410" y1="175" x2="499.7" y2="149.4" stroke="#c0392b" stroke-width="1.8" marker-end="url(#ahb)"/>
  <line x1="410" y1="175" x2="499.7" y2="200.6" stroke="#c0392b" stroke-width="1.8" marker-end="url(#ahb)"/>

  <!-- a couple faint back-scattered photons -->
  <line x1="410" y1="175" x2="372" y2="160" stroke="#d9a29c" stroke-width="1.4" marker-end="url(#ahb)"/>
  <line x1="410" y1="175" x2="372" y2="190" stroke="#d9a29c" stroke-width="1.4" marker-end="url(#ahb)"/>

  <text x="470" y="300" fill="#777777" text-anchor="middle" font-style="italic">aberration sweeps nearly all photons forward</text>
</svg>
