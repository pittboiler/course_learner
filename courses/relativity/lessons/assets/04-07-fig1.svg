<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
  <text x="320" y="34" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1a1a2e" text-anchor="middle">What the Ricci tensor measures: the volume of a small geodesic ball</text>

  <!-- LEFT PANEL: flat space -->
  <text x="160" y="72" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Flat space (R = 0)</text>
  <!-- reference grid -->
  <g stroke="#c9c9d6" stroke-width="1">
    <line x1="50" y1="110" x2="270" y2="110"/>
    <line x1="50" y1="150" x2="270" y2="150"/>
    <line x1="50" y1="190" x2="270" y2="190"/>
    <line x1="50" y1="230" x2="270" y2="230"/>
    <line x1="50" y1="270" x2="270" y2="270"/>
    <line x1="90" y1="90" x2="90" y2="290"/>
    <line x1="130" y1="90" x2="130" y2="290"/>
    <line x1="170" y1="90" x2="170" y2="290"/>
    <line x1="210" y1="90" x2="210" y2="290"/>
    <line x1="250" y1="90" x2="250" y2="290"/>
  </g>
  <!-- geodesic ball -->
  <circle cx="160" cy="190" r="72" fill="#4a90d9" fill-opacity="0.22" stroke="#2a5d9e" stroke-width="2.5"/>
  <!-- radius arrow -->
  <line x1="160" y1="190" x2="221" y2="152" stroke="#2a5d9e" stroke-width="2"/>
  <circle cx="160" cy="190" r="3" fill="#2a5d9e"/>
  <text x="196" y="160" font-family="sans-serif" font-size="14" fill="#2a5d9e">&#949;</text>
  <text x="160" y="330" font-family="sans-serif" font-size="14.5" fill="#1a1a2e" text-anchor="middle">area = &#960;&#949;&#178;  (baseline)</text>

  <!-- divider -->
  <line x1="320" y1="90" x2="320" y2="300" stroke="#e0e0e8" stroke-width="1.5"/>

  <!-- RIGHT PANEL: positively curved -->
  <text x="480" y="72" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Positive curvature (R &gt; 0)</text>
  <!-- converging geodesics (sphere-like) -->
  <g stroke="#c9c9d6" stroke-width="1" fill="none">
    <path d="M 400 100 Q 480 190 400 280"/>
    <path d="M 440 96 Q 480 190 440 284"/>
    <path d="M 480 94 L 480 286"/>
    <path d="M 520 96 Q 480 190 520 284"/>
    <path d="M 560 100 Q 480 190 560 280"/>
    <path d="M 405 130 Q 480 118 555 130"/>
    <path d="M 402 190 Q 480 178 558 190"/>
    <path d="M 405 250 Q 480 262 555 250"/>
  </g>
  <!-- dashed flat reference circle (same geodesic radius) -->
  <circle cx="480" cy="190" r="72" fill="none" stroke="#b0b0be" stroke-width="1.5" stroke-dasharray="5 5"/>
  <!-- actual (smaller) geodesic ball -->
  <circle cx="480" cy="190" r="55" fill="#d94a6a" fill-opacity="0.20" stroke="#a12a48" stroke-width="2.5"/>
  <line x1="480" y1="190" x2="519" y2="151" stroke="#a12a48" stroke-width="2"/>
  <circle cx="480" cy="190" r="3" fill="#a12a48"/>
  <text x="503" y="162" font-family="sans-serif" font-size="14" fill="#a12a48">&#949;</text>
  <text x="480" y="330" font-family="sans-serif" font-size="14.5" fill="#a12a48" text-anchor="middle">area &lt; &#960;&#949;&#178;  (volume deficit &#8733; R)</text>
</svg>
