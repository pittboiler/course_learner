<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470">
  <rect x="0" y="0" width="840" height="470" fill="#ffffff"/>

  <!-- title -->
  <text x="420" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="middle">The expanding universe: comoving grid, redshift, and spatial curvature</text>
  <text x="420" y="52" font-family="sans-serif" font-size="13.5" fill="#444444" text-anchor="middle">galaxies sit at FIXED comoving points &#183; the scale factor a(t) stretches every distance &#183; light stretches with it</text>

  <!-- ===================== LEFT: expanding grid + redshift ===================== -->

  <!-- small (early) grid -->
  <g stroke="#1f4e9e" stroke-width="1.1" fill="none">
    <line x1="55" y1="110" x2="155" y2="110"/>
    <line x1="55" y1="135" x2="155" y2="135"/>
    <line x1="55" y1="160" x2="155" y2="160"/>
    <line x1="55" y1="185" x2="155" y2="185"/>
    <line x1="55" y1="210" x2="155" y2="210"/>
    <line x1="55"  y1="110" x2="55"  y2="210"/>
    <line x1="80"  y1="110" x2="80"  y2="210"/>
    <line x1="105" y1="110" x2="105" y2="210"/>
    <line x1="130" y1="110" x2="130" y2="210"/>
    <line x1="155" y1="110" x2="155" y2="210"/>
  </g>
  <!-- galaxies at comoving nodes -->
  <circle cx="80"  cy="135" r="4" fill="#c02626"/>
  <circle cx="130" cy="185" r="4" fill="#c02626"/>
  <circle cx="105" cy="110" r="4" fill="#c02626"/>
  <text x="105" y="232" font-family="sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="middle">early: a(t&#8337;) small</text>

  <!-- arrow -->
  <line x1="165" y1="160" x2="220" y2="160" stroke="#333333" stroke-width="2"/>
  <polygon points="220,160 210,155 210,165" fill="#333333"/>
  <text x="193" y="150" font-family="sans-serif" font-size="11.5" fill="#333333" text-anchor="middle">expand</text>

  <!-- big (today) grid -->
  <g stroke="#1f4e9e" stroke-width="1.1" fill="none">
    <line x1="230" y1="90" x2="410" y2="90"/>
    <line x1="230" y1="135" x2="410" y2="135"/>
    <line x1="230" y1="180" x2="410" y2="180"/>
    <line x1="230" y1="225" x2="410" y2="225"/>
    <line x1="230" y1="270" x2="410" y2="270"/>
    <line x1="230" y1="90" x2="230" y2="270"/>
    <line x1="275" y1="90" x2="275" y2="270"/>
    <line x1="320" y1="90" x2="320" y2="270"/>
    <line x1="365" y1="90" x2="365" y2="270"/>
    <line x1="410" y1="90" x2="410" y2="270"/>
  </g>
  <!-- same comoving nodes, now farther apart -->
  <circle cx="275" cy="135" r="4.5" fill="#c02626"/>
  <circle cx="365" cy="225" r="4.5" fill="#c02626"/>
  <circle cx="320" cy="90"  r="4.5" fill="#c02626"/>
  <text x="320" y="292" font-family="sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="middle">today: a(t&#8320;) &gt; a(t&#8337;)</text>

  <!-- redshift: waves stretching -->
  <path d="M 55 340 a9,9 0 0,1 18,0 a9,9 0 0,0 18,0 a9,9 0 0,1 18,0 a9,9 0 0,0 18,0 a9,9 0 0,1 18,0 a9,9 0 0,0 18,0 a9,9 0 0,1 18,0 a9,9 0 0,0 18,0" fill="none" stroke="#1f4e9e" stroke-width="2"/>
  <path d="M 215 340 a24,24 0 0,1 48,0 a24,24 0 0,0 48,0 a24,24 0 0,1 48,0 a24,24 0 0,0 48,0" fill="none" stroke="#c02626" stroke-width="2"/>
  <text x="105" y="372" font-family="sans-serif" font-size="12" fill="#1f4e9e" text-anchor="middle">&#955;&#8337;&#8344;&#8339;&#8348; (emitted)</text>
  <text x="311" y="382" font-family="sans-serif" font-size="12" fill="#c02626" text-anchor="middle">&#955;&#8338;&#8340;&#8339; stretched (redder)</text>
  <text x="232" y="415" font-family="sans-serif" font-size="14.5" fill="#1a1a1a" text-anchor="middle">1 + z = a(t&#8320;) / a(t&#8337;) = &#955;&#8338;&#8340;&#8339; / &#955;&#8337;&#8344;&#8339;&#8348;</text>
  <text x="232" y="437" font-family="sans-serif" font-size="12" fill="#555555" text-anchor="middle">a purely geometric stretch &#8212; NOT a Doppler shift</text>

  <!-- divider -->
  <line x1="455" y1="75" x2="455" y2="450" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===================== RIGHT: three geometries ===================== -->
  <text x="645" y="95" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Three spatial geometries, set by k</text>

  <!-- k = +1 closed sphere -->
  <circle cx="540" cy="155" r="40" fill="#1a7a3a" fill-opacity="0.07" stroke="#1a1a1a" stroke-width="1.6"/>
  <g stroke="#1a7a3a" stroke-width="1.1" fill="none">
    <ellipse cx="540" cy="155" rx="40" ry="13"/>
    <ellipse cx="540" cy="155" rx="15" ry="40"/>
  </g>
  <text x="620" y="150" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1a1a1a">k = +1: closed</text>
  <text x="620" y="168" font-family="sans-serif" font-size="12" fill="#555555">3-sphere, finite volume</text>

  <!-- k = 0 flat plane (perspective grid) -->
  <g stroke="#1a7a3a" stroke-width="1.1" fill="none">
    <polygon points="500,300 590,300 570,265 510,265" fill="#1a7a3a" fill-opacity="0.07"/>
    <line x1="516.7" y1="265" x2="503.3" y2="300"/>
    <line x1="530" y1="265" x2="530" y2="300"/>
    <line x1="550" y1="265" x2="560" y2="300"/>
    <line x1="563.3" y1="265" x2="576.7" y2="300"/>
    <line x1="506" y1="288" x2="586" y2="288"/>
    <line x1="510" y1="277" x2="580" y2="277"/>
  </g>
  <text x="620" y="277" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1a1a1a">k = 0: flat</text>
  <text x="620" y="295" font-family="sans-serif" font-size="12" fill="#555555">Euclidean, infinite</text>

  <!-- k = -1 open saddle -->
  <path d="M 500 385 Q 545 358 590 385" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
  <path d="M 500 355 Q 545 388 590 355" fill="none" stroke="#1a7a3a" stroke-width="1.6"/>
  <path d="M 500 385 L 500 355 M 590 385 L 590 355" stroke="#1a7a3a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="620" y="372" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1a1a1a">k = &#8722;1: open</text>
  <text x="620" y="390" font-family="sans-serif" font-size="12" fill="#555555">hyperbolic, infinite</text>

  <text x="645" y="435" font-family="sans-serif" font-size="12" fill="#c02626" text-anchor="middle">k &#8596; total density vs critical (Lesson 6.7)</text>
</svg>
