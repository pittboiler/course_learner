<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380">
  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>

  <!-- title -->
  <text x="360" y="34" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Lowering an index with the Minkowski metric</text>
  <text x="360" y="58" font-family="sans-serif" font-size="15" fill="#444444" text-anchor="middle">V&#8347; = &#951;&#8347;&#8341; V&#8341;   &#183;   signature (&#8722;, +, +, +)</text>

  <!-- metric matrix eta -->
  <text x="150" y="98" font-family="sans-serif" font-size="16" fill="#1f4e9e" text-anchor="middle" font-style="italic">&#951;&#8347;&#8341;</text>
  <!-- left bracket -->
  <polyline points="98,112 90,112 90,258 98,258" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- right bracket -->
  <polyline points="252,112 260,112 260,258 252,258" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- rows -->
  <text x="110" y="140" font-family="sans-serif" font-size="17" fill="#c02626" text-anchor="middle" font-weight="bold">&#8722;1</text>
  <text x="150" y="140" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="190" y="140" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="230" y="140" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">0</text>

  <text x="110" y="175" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="150" y="175" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="190" y="175" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="230" y="175" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">0</text>

  <text x="110" y="210" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="150" y="210" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="190" y="210" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="230" y="210" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">0</text>

  <text x="110" y="245" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="150" y="245" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="190" y="245" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="230" y="245" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">1</text>

  <!-- times -->
  <text x="288" y="192" font-family="sans-serif" font-size="22" fill="#1a1a1a" text-anchor="middle">&#215;</text>

  <!-- V^nu column (contravariant) -->
  <text x="345" y="98" font-family="sans-serif" font-size="16" fill="#1a7a3a" text-anchor="middle" font-style="italic">V&#8341;</text>
  <polyline points="330,112 322,112 322,258 330,258" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <polyline points="360,112 368,112 368,258 360,258" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="345" y="140" font-family="sans-serif" font-size="17" fill="#1a7a3a" text-anchor="middle" font-weight="bold">2</text>
  <text x="345" y="175" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="345" y="210" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="345" y="245" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="345" y="284" font-family="sans-serif" font-size="13" fill="#666666" text-anchor="middle">contravariant</text>

  <!-- equals -->
  <text x="398" y="192" font-family="sans-serif" font-size="22" fill="#1a1a1a" text-anchor="middle">=</text>

  <!-- V_mu column (covariant, lowered) -->
  <text x="455" y="98" font-family="sans-serif" font-size="16" fill="#c02626" text-anchor="middle" font-style="italic">V&#8347;</text>
  <polyline points="440,112 432,112 432,258 440,258" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <polyline points="470,112 478,112 478,258 470,258" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="455" y="140" font-family="sans-serif" font-size="17" fill="#c02626" text-anchor="middle" font-weight="bold">&#8722;2</text>
  <text x="455" y="175" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="455" y="210" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="455" y="245" font-family="sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="455" y="284" font-family="sans-serif" font-size="13" fill="#666666" text-anchor="middle">covariant</text>

  <!-- annotation for the flipped time component -->
  <path d="M 480 133 C 540 120, 560 130, 560 150" fill="none" stroke="#c02626" stroke-width="1.5"/>
  <polygon points="560,150 556,141 564,141" fill="#c02626"/>
  <text x="600" y="130" font-family="sans-serif" font-size="13" fill="#c02626" text-anchor="middle">only the time</text>
  <text x="600" y="147" font-family="sans-serif" font-size="13" fill="#c02626" text-anchor="middle">slot (&#956;=0)</text>
  <text x="600" y="164" font-family="sans-serif" font-size="13" fill="#c02626" text-anchor="middle">flips sign</text>

  <!-- bottom caption -->
  <text x="360" y="330" font-family="sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">The metric&#8217;s single &#8722;1 on the diagonal is what makes spacetime Minkowski, not Euclidean.</text>
  <text x="360" y="352" font-family="sans-serif" font-size="14" fill="#444444" text-anchor="middle">Dot product: A&#183;B = &#951;&#8347;&#8341;A&#8347;B&#8341; = &#8722;A&#8304;B&#8304; + A&#185;B&#185; + A&#178;B&#178; + A&#179;B&#179;</text>
</svg>
