<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430">
  <rect x="0" y="0" width="780" height="430" fill="#ffffff"/>

  <!-- title -->
  <text x="390" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="middle">The Schwarzschild geometry: one throat at r&#8347;, one true singularity at r = 0</text>

  <!-- ===================== LEFT: EMBEDDING FUNNEL ===================== -->
  <text x="195" y="62" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Embedding diagram (space outside a mass)</text>
  <text x="195" y="82" font-family="sans-serif" font-size="12.5" fill="#444444" text-anchor="middle">far away the sheet is flat &#8594; it dips into a well</text>

  <!-- flat far region rim -->
  <ellipse cx="195" cy="115" rx="118" ry="26" fill="#1f4e9e" fill-opacity="0.05" stroke="#1f4e9e" stroke-width="1.6"/>

  <!-- funnel walls -->
  <path d="M 77 115 C 60 190, 120 262, 157 296" fill="none" stroke="#1f4e9e" stroke-width="1.8"/>
  <path d="M 313 115 C 330 190, 270 262, 233 296" fill="none" stroke="#1f4e9e" stroke-width="1.8"/>

  <!-- intermediate ring on the wall -->
  <ellipse cx="195" cy="208" rx="73" ry="16" fill="none" stroke="#1f4e9e" stroke-width="1.1" stroke-opacity="0.6"/>

  <!-- throat = r_s (event horizon) -->
  <ellipse cx="195" cy="296" rx="38" ry="11" fill="#c02626" fill-opacity="0.10" stroke="#c02626" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- narrowing below the throat toward r=0 -->
  <path d="M 157 296 C 168 322, 188 342, 195 348" fill="none" stroke="#1f4e9e" stroke-width="1.5" stroke-opacity="0.7"/>
  <path d="M 233 296 C 222 322, 202 342, 195 348" fill="none" stroke="#1f4e9e" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- singularity point -->
  <circle cx="195" cy="349" r="5" fill="#1a1a1a"/>

  <!-- labels -->
  <text x="330" y="112" font-family="sans-serif" font-size="12.5" fill="#1f4e9e" text-anchor="start">flat</text>
  <text x="300" y="296" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#c02626" text-anchor="start">r&#8347; horizon</text>
  <line x1="240" y1="296" x2="296" y2="296" stroke="#c02626" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="235" y="356" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1a1a1a" text-anchor="start">r = 0 singularity</text>
  <line x1="200" y1="349" x2="232" y2="352" stroke="#1a1a1a" stroke-width="0.8"/>

  <!-- divider -->
  <line x1="390" y1="55" x2="390" y2="400" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===================== RIGHT: METRIC FUNCTIONS ===================== -->
  <text x="585" y="62" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">The two metric factors vs r</text>

  <!-- axes -->
  <line x1="470" y1="90" x2="470" y2="320" stroke="#333333" stroke-width="1.4"/>
  <line x1="470" y1="320" x2="745" y2="320" stroke="#333333" stroke-width="1.4"/>
  <text x="745" y="338" font-family="sans-serif" font-size="12.5" fill="#333333" text-anchor="end">r / r&#8347;</text>

  <!-- asymptote line at value 1 -->
  <line x1="470" y1="255" x2="740" y2="255" stroke="#999999" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="465" y="259" font-family="sans-serif" font-size="11" fill="#666666" text-anchor="end">1</text>
  <text x="465" y="314" font-family="sans-serif" font-size="11" fill="#666666" text-anchor="end">0</text>

  <!-- vertical dashed line at r_s -->
  <line x1="470" y1="90" x2="470" y2="320" stroke="#c02626" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="470" y="336" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c02626" text-anchor="middle">r&#8347;</text>

  <!-- Curve A: g00 factor (1 - r_s/r), blue, 0 at r_s -> 1 -->
  <path d="M 470 310 Q 500 300, 513 292 T 557 283 Q 640 274, 730 269" fill="none" stroke="#1f4e9e" stroke-width="2.4"/>
  <text x="700" y="284" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1f4e9e" text-anchor="middle">1 &#8722; r&#8347;/r</text>
  <text x="668" y="300" font-family="sans-serif" font-size="11" fill="#1f4e9e" text-anchor="middle">(&#8722;g&#8320;&#8320; factor)</text>

  <!-- Curve B: g_rr factor 1/(1 - r_s/r), red, ->inf at r_s -->
  <path d="M 736 237 Q 640 228, 557 200 Q 522 165, 505 118 Q 500 103, 497 92" fill="none" stroke="#c02626" stroke-width="2.4"/>
  <text x="655" y="212" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#c02626" text-anchor="middle">1 / (1 &#8722; r&#8347;/r)</text>
  <text x="638" y="228" font-family="sans-serif" font-size="11" fill="#c02626" text-anchor="middle">(g&#8341;&#8341; factor)</text>

  <!-- arrows to infinity / zero at r_s -->
  <text x="512" y="102" font-family="sans-serif" font-size="12" fill="#c02626" text-anchor="start">&#8594; &#8734;</text>
  <text x="478" y="308" font-family="sans-serif" font-size="12" fill="#1f4e9e" text-anchor="start">&#8594; 0</text>

  <text x="585" y="372" font-family="sans-serif" font-size="12.5" fill="#444444" text-anchor="middle">At r&#8347;: &#8722;g&#8320;&#8320; &#8594; 0 (clocks freeze) and g&#8341;&#8341; &#8594; &#8734;.</text>
  <text x="585" y="390" font-family="sans-serif" font-size="12.5" fill="#444444" text-anchor="middle">A coordinate glitch, not a real one &#8212; unlike r = 0.</text>
</svg>
