<svg viewBox="0 0 720 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">One idea: choose the parameter that makes a sample moment as close to zero as possible.</text>
  <text x="360.0" y="86.0" fill="#8a8a8a" text-anchor="middle">E[ g(data, theta) ] = 0</text>
  <line x1="120.0" y1="100.0" x2="600.0" y2="100.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="126.0" y="132.0" fill="#4a90d9" font-size="12.5">OLS</text>
  <text x="268.0" y="132.0" fill="#4a90d9" font-size="12">E[ x (y - x&#x27;b) ] = 0</text>
  <text x="268.0" y="148.0" fill="#8a8a8a" font-size="10.5">k moments, k parameters: exactly solved</text>
  <text x="126.0" y="178.0" fill="#e0645c" font-size="12.5">IV / 2SLS</text>
  <text x="268.0" y="178.0" fill="#e0645c" font-size="12">E[ z (y - x&#x27;b) ] = 0</text>
  <text x="268.0" y="194.0" fill="#8a8a8a" font-size="10.5">more moments than parameters: weighted</text>
  <text x="126.0" y="224.0" fill="#8a8a8a" font-size="12.5">MLE</text>
  <text x="268.0" y="224.0" fill="#8a8a8a" font-size="12">E[ score(theta) ] = 0</text>
  <text x="268.0" y="240.0" fill="#8a8a8a" font-size="10.5">the moment IS the first-order condition</text>
  <text x="126.0" y="270.0" fill="#8a8a8a" font-size="12.5">Method of moments</text>
  <text x="268.0" y="270.0" fill="#8a8a8a" font-size="12">E[ y^r ] - m_r(theta) = 0</text>
  <text x="268.0" y="286.0" fill="#8a8a8a" font-size="10.5">match sample moments to population ones</text>
  <line x1="120.0" y1="318.0" x2="600.0" y2="318.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="360.0" y="338.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">With more moments than parameters you cannot zero them all — so minimise a weighted quadratic.</text>
</svg>
