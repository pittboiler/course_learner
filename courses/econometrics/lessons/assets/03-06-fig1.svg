<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">An instrument moves the treatment and reaches the outcome no other way.</text>
  <circle cx="110.0" cy="170.0" r="30" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="110.0" y="175.0" fill="#4a90d9" font-size="13" text-anchor="middle">Z</text>
  <circle cx="300.0" cy="170.0" r="30" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="300.0" y="175.0" fill="#8a8a8a" font-size="13" text-anchor="middle">D</text>
  <circle cx="500.0" cy="170.0" r="30" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="500.0" y="175.0" fill="#8a8a8a" font-size="13" text-anchor="middle">Y</text>
  <circle cx="400.0" cy="72.0" r="30" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="400.0" y="77.0" fill="#e0645c" font-size="13" text-anchor="middle">U</text>
  <line x1="142.0" y1="170.0" x2="266.0" y2="170.0" stroke="#4a90d9" stroke-width="2.4"/>
  <polygon points="266.0,170.0 252.8,164.0 252.8,176.0" fill="#4a90d9"/>
  <text x="204.0" y="158.0" fill="#4a90d9" font-size="11.5" text-anchor="middle">first stage</text>
  <line x1="332.0" y1="170.0" x2="466.0" y2="170.0" stroke="#8a8a8a" stroke-width="2.4"/>
  <polygon points="466.0,170.0 452.8,164.0 452.8,176.0" fill="#8a8a8a"/>
  <text x="399.0" y="158.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">the effect</text>
  <line x1="381.0" y1="95.0" x2="318.0" y2="146.0" stroke="#e0645c" stroke-width="2"/>
  <polygon points="318.0,146.0 329.7,143.0 323.4,135.2" fill="#e0645c"/>
  <line x1="419.0" y1="95.0" x2="482.0" y2="146.0" stroke="#e0645c" stroke-width="2"/>
  <polygon points="482.0,146.0 476.6,135.2 470.3,143.0" fill="#e0645c"/>
  <text x="400.0" y="58.0" fill="#e0645c" font-size="11.5" text-anchor="middle">confounder</text>
  <line x1="140.0" y1="150.0" x2="470.0" y2="96.0" stroke="#e0645c" stroke-width="1.8" stroke-dasharray="6 4"/>
  <line x1="295.0" y1="116.0" x2="315.0" y2="130.0" stroke="#e0645c" stroke-width="2.6"/>
  <line x1="315.0" y1="116.0" x2="295.0" y2="130.0" stroke="#e0645c" stroke-width="2.6"/>
  <text x="178.0" y="124.0" fill="#e0645c" font-size="11.5">exclusion: this must NOT exist</text>
  <text x="350.0" y="232.0" fill="#4a90d9" font-size="12" text-anchor="middle">Relevance: the blue arrow is real and strong.</text>
  <text x="350.0" y="254.0" fill="#e0645c" font-size="12" text-anchor="middle">Exclusion: Z affects Y only through D, and is unrelated to U.</text>
  <text x="350.0" y="284.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">Relevance is testable. Exclusion is not — it is an argument, not a statistic.</text>
</svg>
