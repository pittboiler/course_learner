<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">OLS drops a perpendicular from y onto the plane spanned by the regressors.</text>
  <polygon points="120.0,250.0 500.0,250.0 620.0,170.0 240.0,170.0" fill="#4a90d9" stroke="#8a8a8a" stroke-width="1.2" opacity="0.1"/>
  <text x="140.0" y="242.0" fill="#8a8a8a" font-size="12">col(X)  — everything X can reach</text>
  <line x1="300.0" y1="215.0" x2="250.0" y2="190.0" stroke="#8a8a8a" stroke-width="1.6"/>
  <polygon points="250.0,190.0 257.6,199.4 262.1,190.4" fill="#8a8a8a"/>
  <text x="232.0" y="184.0" fill="#8a8a8a" font-size="12" text-anchor="end">x2</text>
  <line x1="300.0" y1="215.0" x2="430.0" y2="232.0" stroke="#8a8a8a" stroke-width="1.6"/>
  <polygon points="430.0,232.0 419.7,225.6 418.4,235.5" fill="#8a8a8a"/>
  <text x="436.0" y="246.0" fill="#8a8a8a" font-size="12">x1</text>
  <line x1="300.0" y1="215.0" x2="470.0" y2="80.0" stroke="#e0645c" stroke-width="2.6"/>
  <polygon points="470.0,80.0 458.3,82.9 464.5,90.8" fill="#e0645c"/>
  <text x="478.0" y="74.0" fill="#e0645c">y</text>
  <line x1="300.0" y1="215.0" x2="430.0" y2="200.0" stroke="#4a90d9" stroke-width="2.6"/>
  <polygon points="430.0,200.0 418.5,196.3 419.6,206.2" fill="#4a90d9"/>
  <text x="430.0" y="220.0" fill="#4a90d9" font-size="13">y-hat = Hy</text>
  <line x1="470.0" y1="80.0" x2="430.0" y2="200.0" stroke="#8a8a8a" stroke-width="2.2" stroke-dasharray="5 4"/>
  <text x="482.0" y="140.0" fill="#8a8a8a" font-size="13">e = y - y-hat</text>
  <path d="M 423.0 192.0 L 431.0 185.0 L 438.0 193.0" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="350.0" y="300.0" fill="#8a8a8a" font-size="12" text-anchor="middle">e is orthogonal to every column of X — that is the normal equation X&#x27;e = 0.</text>
  <text x="350.0" y="320.0" fill="#8a8a8a" font-size="12" text-anchor="middle">Pythagoras on this triangle is the sum-of-squares decomposition.</text>
</svg>
