  <text x="285.4" y="90.0" fill="#4a90d9" font-size="11" text-anchor="middle">true latent line</text>
  <text x="141.1" y="135.5" fill="#e0645c" font-size="11">OLS on censored data:</text>
  <text x="141.1" y="149.7" fill="#e0645c" font-size="11">attenuated</text>
  <text x="230.0" y="314.0" fill="#8a8a8a" font-size="11" text-anchor="middle">Faint grey = the latent value you never see. Coral on the axis = what is recorded.</text>
  <text x="230.0" y="332.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">OLS on the censored outcome is biased toward zero.</text>
  <line x1="390.0" y1="80.0" x2="390.0" y2="322.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="414.0" y="112.0" fill="#8a8a8a" font-size="12.5">Three distinct situations:</text>
  <text x="414.0" y="146.0" fill="#e0645c" font-size="12">CENSORED (Tobit)</text>
  <text x="414.0" y="164.0" fill="#8a8a8a" font-size="10.5">you see x for everyone; y is piled at 0</text>
  <text x="414.0" y="200.0" fill="#4a90d9" font-size="12">TRUNCATED</text>
  <text x="414.0" y="218.0" fill="#8a8a8a" font-size="10.5">units with y at 0 are absent entirely</text>
  <text x="414.0" y="254.0" fill="#8a8a8a" font-size="12">SELECTED (Heckman)</text>
  <text x="414.0" y="272.0" fill="#8a8a8a" font-size="10.5">a separate rule decides who is observed;</text>
  <text x="414.0" y="288.0" fill="#8a8a8a" font-size="10.5">correct with the inverse Mills ratio</text>
  <text x="414.0" y="320.0" fill="#8a8a8a" font-size="11">Different problems, different corrections.</text>
</svg>
