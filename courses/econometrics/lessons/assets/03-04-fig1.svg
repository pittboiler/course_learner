<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">The sign of omitted-variable bias is the product of two signs, and only that.</text>
  <text x="360.0" y="84.0" fill="#8a8a8a" font-size="12.5" text-anchor="middle">bias  =  (effect of omitted W on y)  x  (slope of W on D)</text>
  <rect x="160.0" y="110.0" width="200.0" height="80.0" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <rect x="360.0" y="110.0" width="200.0" height="80.0" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <rect x="160.0" y="190.0" width="200.0" height="80.0" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <rect x="360.0" y="190.0" width="200.0" height="80.0" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="260.0" y="140.0" fill="#8a8a8a" font-size="12" text-anchor="middle">delta &gt; 0, pi &gt; 0</text>
  <text x="260.0" y="166.0" fill="#e0645c" font-size="13" text-anchor="middle" font-weight="bold">bias UP</text>
  <text x="460.0" y="140.0" fill="#8a8a8a" font-size="12" text-anchor="middle">delta &gt; 0, pi &lt; 0</text>
  <text x="460.0" y="166.0" fill="#4a90d9" font-size="13" text-anchor="middle" font-weight="bold">bias DOWN</text>
  <text x="260.0" y="220.0" fill="#8a8a8a" font-size="12" text-anchor="middle">delta &lt; 0, pi &gt; 0</text>
  <text x="260.0" y="246.0" fill="#4a90d9" font-size="13" text-anchor="middle" font-weight="bold">bias DOWN</text>
  <text x="460.0" y="220.0" fill="#8a8a8a" font-size="12" text-anchor="middle">delta &lt; 0, pi &lt; 0</text>
  <text x="460.0" y="246.0" fill="#e0645c" font-size="13" text-anchor="middle" font-weight="bold">bias UP</text>
  <text x="150.0" y="152.0" fill="#8a8a8a" font-size="11.5" text-anchor="end">effect of</text>
  <text x="150.0" y="168.0" fill="#8a8a8a" font-size="11.5" text-anchor="end">W on y</text>
  <text x="360.0" y="104.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">how W moves with D</text>
  <text x="360.0" y="300.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">Either factor being zero kills the bias — which is why randomising D (making pi = 0)</text>
  <text x="360.0" y="318.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">works no matter how strongly the omitted variable affects the outcome.</text>
</svg>
