  <line x1="70.0" y1="260.0" x2="400.0" y2="260.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="360.4" y="252.0" fill="#8a8a8a" font-size="11" text-anchor="end">the 5% you thought you had</text>
  <circle cx="86.5" cy="224.8" r="4.5" fill="#4a90d9"/>
  <text x="93.5" y="227.8" fill="#4a90d9" font-size="11.5">m=5: 23%</text>
  <circle cx="136.0" cy="141.7" r="4.5" fill="#4a90d9"/>
  <text x="143.0" y="144.7" fill="#4a90d9" font-size="11.5">m=20: 64%</text>
  <text x="555.0" y="80.0" fill="#8a8a8a" font-size="12.5" text-anchor="middle">two ways to take it back</text>
  <text x="440.0" y="112.0" fill="#4a90d9" font-size="12">Bonferroni (FWER)</text>
  <text x="440.0" y="132.0" fill="#8a8a8a" font-size="11.5">test each at 0.05 / m</text>
  <text x="440.0" y="152.0" fill="#8a8a8a" font-size="11.5">controls P(any false positive)</text>
  <text x="440.0" y="172.0" fill="#8a8a8a" font-size="11.5">strict; loses power fast</text>
  <line x1="436.0" y1="190.0" x2="690.0" y2="190.0" stroke="#8a8a8a" stroke-width="1"/>
  <text x="440.0" y="214.0" fill="#e0645c" font-size="12">Benjamini-Hochberg (FDR)</text>
  <text x="440.0" y="234.0" fill="#8a8a8a" font-size="11.5">sort p, keep p(i) &lt;= i q / m</text>
  <text x="440.0" y="254.0" fill="#8a8a8a" font-size="11.5">controls the false share AMONG</text>
  <text x="440.0" y="274.0" fill="#8a8a8a" font-size="11.5">rejections; far more power</text>
  <text x="350.0" y="316.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">Neither helps if you never wrote down how many tests you ran.</text>
</svg>
