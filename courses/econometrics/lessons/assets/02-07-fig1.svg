<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">Run twenty tests on pure noise and one comes back significant. That is the design working.</text>
  <line x1="70.0" y1="270.0" x2="408.0" y2="270.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="408.0,270.0 397.0,265.0 397.0,275.0" fill="#8a8a8a"/>
  <line x1="70.0" y1="282.0" x2="70.0" y2="62.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70.0,62.0 65.0,73.0 75.0,73.0" fill="#8a8a8a"/>
  <text x="235.0" y="296.0" fill="#8a8a8a" font-size="12" text-anchor="middle">number of independent tests</text>
  <text x="66.0" y="58.0" fill="#8a8a8a" font-size="11.5">P(at least one false positive)</text>
