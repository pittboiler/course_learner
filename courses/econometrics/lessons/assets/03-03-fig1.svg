<svg viewBox="0 0 720 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40.0" y="24.0" fill="#8a8a8a" font-style="italic">OLS weights each stratum by Var(D | X), not by its size — so it is neither the ATE nor the ATT.</text>
  <line x1="80.0" y1="272.0" x2="340.0" y2="272.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="210.0" y="300.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">weight = p(1 - p)</text>
  <rect x="106.0" y="111.3" width="68.0" height="160.7" fill="#4a90d9" stroke="None" stroke-width="1.5" opacity="0.55"/>
  <text x="140.0" y="101.3" fill="#8a8a8a" font-size="11.5" text-anchor="middle">0.1250</text>
  <text x="140.0" y="290.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">stratum A</text>
  <text x="140.0" y="133.3" fill="#8a8a8a" font-size="11" text-anchor="middle">p = 0.5</text>
  <text x="140.0" y="149.3" fill="#8a8a8a" font-size="11" text-anchor="middle">effect 1</text>
  <rect x="216.0" y="214.1" width="68.0" height="57.9" fill="#e0645c" stroke="None" stroke-width="1.5" opacity="0.55"/>
  <text x="250.0" y="204.1" fill="#8a8a8a" font-size="11.5" text-anchor="middle">0.0450</text>
  <text x="250.0" y="290.0" fill="#8a8a8a" font-size="11.5" text-anchor="middle">stratum B</text>
  <text x="250.0" y="236.1" fill="#8a8a8a" font-size="11" text-anchor="middle">p = 0.1</text>
  <text x="250.0" y="252.1" fill="#8a8a8a" font-size="11" text-anchor="middle">effect 5</text>
  <text x="210.0" y="88.0" fill="#8a8a8a" font-size="12.5" text-anchor="middle">the weights</text>
  <line x1="370.0" y1="82.0" x2="370.0" y2="318.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="396.0" y="112.0" fill="#8a8a8a" font-size="12">Same data, three estimands:</text>
  <line x1="396.0" y1="152.0" x2="469.3" y2="152.0" stroke="#8a8a8a" stroke-width="8"/>
  <circle cx="469.3" cy="152.0" r="5" fill="#8a8a8a"/>
  <text x="478.3" y="156.0" fill="#8a8a8a" font-size="12">ATT = 1.667</text>
  <line x1="396.0" y1="196.0" x2="486.6" y2="196.0" stroke="#4a90d9" stroke-width="8"/>
  <circle cx="486.6" cy="196.0" r="5" fill="#4a90d9"/>
  <text x="495.6" y="200.0" fill="#4a90d9" font-size="12">OLS (saturated) = 2.059</text>
  <line x1="396.0" y1="240.0" x2="528.0" y2="240.0" stroke="#e0645c" stroke-width="8"/>
  <circle cx="528.0" cy="240.0" r="5" fill="#e0645c"/>
  <text x="537.0" y="244.0" fill="#e0645c" font-size="12">ATE = 3.000</text>
  <text x="396.0" y="300.0" fill="#8a8a8a" font-size="11">A and B are equally common and have effects 1 and 5,</text>
  <text x="396.0" y="317.0" fill="#8a8a8a" font-size="11">but B is only 10% treated, so OLS nearly ignores it.</text>
</svg>
