<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360" role="img" aria-label="Two lines intersecting at one point, the solution">
  <rect x="0" y="0" width="420" height="360" fill="#ffffff"/>

  <!-- grid -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="60" y1="40" x2="60" y2="320"/>
    <line x1="120" y1="40" x2="120" y2="320"/>
    <line x1="180" y1="40" x2="180" y2="320"/>
    <line x1="240" y1="40" x2="240" y2="320"/>
    <line x1="300" y1="40" x2="300" y2="320"/>
    <line x1="360" y1="40" x2="360" y2="320"/>
    <line x1="60" y1="80" x2="360" y2="80"/>
    <line x1="60" y1="140" x2="360" y2="140"/>
    <line x1="60" y1="200" x2="360" y2="200"/>
    <line x1="60" y1="260" x2="360" y2="260"/>
  </g>

  <!-- axes -->
  <g stroke="#374151" stroke-width="2">
    <line x1="60" y1="40" x2="60" y2="320"/>
    <line x1="60" y1="320" x2="360" y2="320"/>
  </g>
  <text x="352" y="338" font-family="sans-serif" font-size="15" fill="#374151">x</text>
  <text x="40" y="52" font-family="sans-serif" font-size="15" fill="#374151">y</text>

  <!-- Line A: y = x + 1 (steep-ish), drawn across the box -->
  <line x1="60" y1="290" x2="360" y2="50" stroke="#2563eb" stroke-width="3"/>
  <text x="300" y="66" font-family="sans-serif" font-size="15" fill="#2563eb">Condition A</text>

  <!-- Line B: y = -x + 7 (falling) -->
  <line x1="60" y1="80" x2="360" y2="300" stroke="#dc2626" stroke-width="3"/>
  <text x="70" y="76" font-family="sans-serif" font-size="15" fill="#dc2626">Condition B</text>

  <!-- Intersection point at (210, 185) -->
  <circle cx="210" cy="185" r="7" fill="#111827"/>
  <line x1="210" y1="185" x2="210" y2="320" stroke="#111827" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="210" y1="185" x2="60" y2="185" stroke="#111827" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="222" y="178" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111827">the solution</text>
  <text x="222" y="196" font-family="sans-serif" font-size="13" fill="#374151">(both true at once)</text>
</svg>
