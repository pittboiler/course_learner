<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- light gridlines -->
  <g stroke="#dcdcdc" stroke-width="1">
    <line x1="105" y1="40" x2="105" y2="300"/>
    <line x1="140" y1="40" x2="140" y2="300"/>
    <line x1="175" y1="40" x2="175" y2="300"/>
    <line x1="210" y1="40" x2="210" y2="300"/>
    <line x1="245" y1="40" x2="245" y2="300"/>
    <line x1="280" y1="40" x2="280" y2="300"/>
    <line x1="315" y1="40" x2="315" y2="300"/>
    <line x1="350" y1="40" x2="350" y2="300"/>
    <line x1="30" y1="255" x2="440" y2="255"/>
    <line x1="30" y1="220" x2="440" y2="220"/>
    <line x1="30" y1="185" x2="440" y2="185"/>
    <line x1="30" y1="150" x2="440" y2="150"/>
    <line x1="30" y1="115" x2="440" y2="115"/>
  </g>

  <!-- axes -->
  <line x1="30" y1="290" x2="445" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="70" y1="40" x2="70" y2="320" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="445,290 435,285 435,295" fill="#8a8a8a"/>
  <polygon points="70,40 65,50 75,50" fill="#8a8a8a"/>
  <text x="450" y="295" fill="#8a8a8a">x</text>
  <text x="60" y="38" fill="#8a8a8a">y</text>
  <text x="56" y="305" fill="#8a8a8a">0</text>

  <!-- x ticks -->
  <text x="136" y="308" fill="#8a8a8a">2</text>
  <text x="206" y="308" fill="#8a8a8a">4</text>
  <text x="276" y="308" fill="#8a8a8a">6</text>
  <!-- y ticks -->
  <text x="52" y="260" fill="#8a8a8a">1</text>
  <text x="52" y="225" fill="#8a8a8a">2</text>
  <text x="52" y="155" fill="#8a8a8a">4</text>

  <!-- the line y = (1/2)x + 1 -->
  <line x1="35" y1="272.5" x2="385" y2="97.5" stroke="#4a90d9" stroke-width="3"/>
  <text x="300" y="108" fill="#4a90d9">y = ½x + 1</text>

  <!-- slope triangle: run then rise -->
  <line x1="140" y1="220" x2="280" y2="220" stroke="#e0645c" stroke-width="2"/>
  <line x1="280" y1="220" x2="280" y2="150" stroke="#e0645c" stroke-width="2"/>
  <text x="168" y="238" fill="#e0645c">run Δx = 4</text>
  <text x="288" y="190" fill="#e0645c">rise Δy = 2</text>
  <circle cx="140" cy="220" r="4" fill="#e0645c"/>
  <circle cx="280" cy="150" r="4" fill="#e0645c"/>

  <!-- y-intercept -->
  <circle cx="70" cy="255" r="5.5" fill="#7bb662"/>
  <text x="80" y="248" fill="#7bb662">y-intercept (0, 1) = b</text>

  <!-- caption -->
  <text x="150" y="332" fill="#8a8a8a" font-style="italic">slope m = rise / run = 2 / 4 = ½</text>
</svg>
