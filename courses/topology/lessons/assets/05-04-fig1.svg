<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- ===== abstract space X (left) ===== -->
  <path d="M 40 120 C 30 60, 120 40, 150 70 C 190 45, 210 120, 175 160 C 200 210, 120 240, 80 205 C 35 210, 30 155, 40 120 Z"
        fill="#4a90d9" opacity="0.10" stroke="#4a90d9" stroke-width="2"/>
  <text x="60" y="55" fill="#4a90d9" font-style="italic">X  (abstract topology)</text>
  <!-- two points to be separated -->
  <circle cx="95" cy="120" r="4" fill="#333"/>
  <text x="72" y="118" fill="#333">x</text>
  <circle cx="150" cy="150" r="4" fill="#333"/>
  <text x="158" y="153" fill="#333">y</text>

  <!-- ===== coordinate arrows ===== -->
  <line x1="205" y1="130" x2="300" y2="90"  stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="205" y1="140" x2="300" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="205" y1="150" x2="300" y2="210" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="300,90 289,90 294,99"   fill="#8a8a8a"/>
  <polygon points="300,150 290,146 290,156" fill="#8a8a8a"/>
  <polygon points="300,210 291,203 289,213" fill="#8a8a8a"/>
  <text x="222" y="98"  fill="#8a8a8a">f₁</text>
  <text x="230" y="135" fill="#8a8a8a">f₂</text>
  <text x="222" y="205" fill="#8a8a8a">f₃ …</text>

  <!-- ===== Hilbert cube: nested shrinking [0,1] factors (right) ===== -->
  <!-- factor 1 -->
  <line x1="320" y1="80" x2="590" y2="80" stroke="#e0645c" stroke-width="3"/>
  <line x1="320" y1="76" x2="320" y2="84" stroke="#e0645c" stroke-width="2"/>
  <line x1="590" y1="76" x2="590" y2="84" stroke="#e0645c" stroke-width="2"/>
  <text x="596" y="85" fill="#e0645c">[0,1]</text>
  <circle cx="410" cy="80" r="4" fill="#e0645c"/>
  <text x="400" y="70" fill="#e0645c">f₁(x)</text>

  <!-- factor 2 (half length) -->
  <line x1="320" y1="120" x2="455" y2="120" stroke="#e0645c" stroke-width="3" opacity="0.85"/>
  <line x1="320" y1="116" x2="320" y2="124" stroke="#e0645c" stroke-width="2" opacity="0.85"/>
  <line x1="455" y1="116" x2="455" y2="124" stroke="#e0645c" stroke-width="2" opacity="0.85"/>
  <text x="461" y="125" fill="#e0645c" opacity="0.85">×[0,1]</text>

  <!-- factor 3 (quarter length) -->
  <line x1="320" y1="155" x2="388" y2="155" stroke="#e0645c" stroke-width="3" opacity="0.7"/>
  <line x1="320" y1="151" x2="320" y2="159" stroke="#e0645c" stroke-width="2" opacity="0.7"/>
  <line x1="388" y1="151" x2="388" y2="159" stroke="#e0645c" stroke-width="2" opacity="0.7"/>
  <text x="394" y="160" fill="#e0645c" opacity="0.7">×[0,1]</text>

  <!-- factor 4 (eighth) -->
  <line x1="320" y1="185" x2="354" y2="185" stroke="#e0645c" stroke-width="3" opacity="0.55"/>
  <text x="360" y="190" fill="#e0645c" opacity="0.55">×[0,1]</text>

  <!-- factor 5 (sixteenth) -->
  <line x1="320" y1="210" x2="337" y2="210" stroke="#e0645c" stroke-width="3" opacity="0.4"/>
  <text x="343" y="215" fill="#e0645c" opacity="0.4">× ⋯</text>

  <!-- label + point image -->
  <text x="360" y="245" fill="#e0645c" font-style="italic">Hilbert cube  [0,1]ᵂ</text>
  <text x="360" y="263" fill="#8a8a8a">F(x) = (f₁(x), f₂(x), f₃(x), …)</text>
  <text x="360" y="288" fill="#8a8a8a">d(F(x),F(y)) = Σ 2⁻ⁿ|fₙ(x)−fₙ(y)|</text>

  <!-- caption -->
  <text x="40" y="320" fill="#8a8a8a" font-style="italic">Countably many Urysohn functions become coordinates: the embedding turns X into points of a metric space.</text>
</svg>
