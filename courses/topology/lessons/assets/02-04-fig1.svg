<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- ===================== MAIN: the torus gluing square ===================== -->
  <!-- square [0,1]^2, corners at (60,70) top-left to (260,270) bottom-right -->
  <rect x="60" y="70" width="200" height="200" fill="#4a90d9" opacity="0.06"/>

  <!-- bottom edge (x,0): blue, single arrow pointing right -->
  <line x1="60" y1="270" x2="260" y2="270" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="170,270 158,263 158,277" fill="#4a90d9"/>

  <!-- top edge (x,1): blue, single arrow pointing right  -> glued to bottom, same orientation -->
  <line x1="60" y1="70" x2="260" y2="70" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="170,70 158,63 158,77" fill="#4a90d9"/>

  <!-- left edge (0,y): red, DOUBLE arrow pointing up -->
  <line x1="60" y1="270" x2="60" y2="70" stroke="#e0645c" stroke-width="3"/>
  <polygon points="60,158 53,170 67,170" fill="#e0645c"/>
  <polygon points="60,178 53,190 67,190" fill="#e0645c"/>

  <!-- right edge (1,y): red, DOUBLE arrow pointing up -> glued to left, same orientation -->
  <line x1="260" y1="270" x2="260" y2="70" stroke="#e0645c" stroke-width="3"/>
  <polygon points="260,158 253,170 267,170" fill="#e0645c"/>
  <polygon points="260,178 253,190 267,190" fill="#e0645c"/>

  <!-- corner dots: all four corners collapse to ONE point on the torus -->
  <circle cx="60" cy="70" r="4" fill="#8a8a8a"/>
  <circle cx="260" cy="70" r="4" fill="#8a8a8a"/>
  <circle cx="60" cy="270" r="4" fill="#8a8a8a"/>
  <circle cx="260" cy="270" r="4" fill="#8a8a8a"/>

  <!-- edge / corner labels -->
  <text x="150" y="292" fill="#4a90d9">(x,0) ~ (x,1)</text>
  <text x="8"  y="175" fill="#e0645c">(0,y)</text>
  <text x="270" y="175" fill="#e0645c">(1,y)</text>
  <text x="150" y="60" fill="#4a90d9" text-anchor="middle">glue top→bottom</text>
  <text x="160" y="315" fill="#8a8a8a" font-style="italic" text-anchor="middle">square with both edge-pairs glued  =  torus</text>

  <!-- ===================== INSET: [0,1] with 0 ~ 1  =  circle ===================== -->
  <!-- interval -->
  <line x1="380" y1="120" x2="500" y2="120" stroke="#8a8a8a" stroke-width="3"/>
  <circle cx="380" cy="120" r="6" fill="#e0645c"/>
  <circle cx="500" cy="120" r="6" fill="#e0645c"/>
  <text x="372" y="108" fill="#8a8a8a">0</text>
  <text x="494" y="108" fill="#8a8a8a">1</text>
  <text x="360" y="150" fill="#8a8a8a" font-style="italic">glue endpoints  0 ~ 1</text>

  <!-- arrow to circle -->
  <line x1="440" y1="170" x2="440" y2="205" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="440,214 434,204 446,204" fill="#8a8a8a"/>

  <!-- resulting circle S^1 with the single glued point marked -->
  <circle cx="440" cy="265" r="42" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <circle cx="482" cy="265" r="6" fill="#e0645c"/>
  <text x="492" y="270" fill="#8a8a8a">0 = 1</text>
  <text x="440" y="325" fill="#4a90d9" text-anchor="middle">circle  S¹</text>
</svg>
