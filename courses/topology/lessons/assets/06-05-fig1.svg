<svg viewBox="0 0 460 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- the disk D^2 -->
  <circle cx="200" cy="190" r="140" fill="#4a90d9" fill-opacity="0.08" stroke="#4a90d9" stroke-width="3"/>

  <!-- the ray from f(x) through x, hitting the boundary at r(x) -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#e0645c"/>
    </marker>
  </defs>
  <line x1="110" y1="270" x2="299" y2="91" stroke="#e0645c" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- points -->
  <circle cx="110" cy="270" r="5" fill="#4a90d9"/>
  <circle cx="204" cy="181" r="5" fill="#3a3a3a"/>
  <circle cx="299" cy="91" r="6" fill="#e0645c"/>

  <!-- labels -->
  <text x="86" y="292" fill="#4a90d9">f(x)</text>
  <text x="212" y="178" fill="#3a3a3a">x</text>
  <text x="305" y="86" fill="#e0645c">r(x)</text>

  <!-- boundary label -->
  <text x="60" y="70" fill="#4a90d9" font-style="italic">boundary S¹</text>
  <line x1="95" y1="76" x2="118" y2="104" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- caption -->
  <text x="40" y="360" fill="#8a8a8a" font-style="italic">If f(x) ≠ x, aim the ray from f(x) through x — where it leaves the disk is r(x).</text>
</svg>
