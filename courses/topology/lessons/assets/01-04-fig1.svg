<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- TOP: an open set U in the plane, covered by basis disks whose union is U -->

  <!-- the open set U: a soft blob outline -->
  <path d="M 70 60 C 40 90, 45 150, 90 165 C 110 205, 190 210, 220 175 C 270 185, 300 130, 265 100 C 275 60, 210 35, 175 60 C 140 35, 90 40, 70 60 Z"
        fill="#4a90d9" opacity="0.10" stroke="#4a90d9" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="230" y="55" fill="#4a90d9" font-style="italic">open set U</text>

  <!-- basis disks (open balls) tiling U; their union is U -->
  <circle cx="105" cy="95"  r="42" fill="#e0645c" opacity="0.14" stroke="#e0645c" stroke-width="1.5"/>
  <circle cx="160" cy="120" r="48" fill="#e0645c" opacity="0.14" stroke="#e0645c" stroke-width="1.5"/>
  <circle cx="215" cy="130" r="40" fill="#e0645c" opacity="0.14" stroke="#e0645c" stroke-width="1.5"/>
  <circle cx="120" cy="150" r="34" fill="#e0645c" opacity="0.14" stroke="#e0645c" stroke-width="1.5"/>
  <circle cx="185" cy="80"  r="34" fill="#e0645c" opacity="0.14" stroke="#e0645c" stroke-width="1.5"/>

  <!-- a highlighted point x and the basis ball trapping it inside U (axiom in action) -->
  <circle cx="160" cy="120" r="4" fill="#333333"/>
  <text x="167" y="118" fill="#333333">x</text>
  <text x="300" y="118" fill="#e0645c">each disk B ⊆ U ; every x sits in one</text>
  <text x="300" y="138" fill="#8a8a8a" font-style="italic">U = union of its basis disks</text>

  <!-- BOTTOM: half-open basis element [a,b) on a number line -->
  <line x1="40" y1="300" x2="520" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="520,300 510,295 510,305" fill="#8a8a8a"/>
  <text x="524" y="305" fill="#8a8a8a">ℝ</text>

  <!-- interval [a,b): filled dot at a (included), open dot at b (excluded) -->
  <line x1="180" y1="300" x2="340" y2="300" stroke="#4a90d9" stroke-width="4"/>
  <circle cx="180" cy="300" r="6" fill="#4a90d9"/>
  <circle cx="340" cy="300" r="6" fill="#ffffff" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="172" y="325" fill="#4a90d9">a</text>
  <text x="333" y="325" fill="#4a90d9">b</text>
  <text x="200" y="285" fill="#4a90d9">[a, b)  — a Sorgenfrey basis element</text>
  <text x="40" y="352" fill="#8a8a8a" font-style="italic">Includes its left endpoint, excludes its right: finer than the standard topology.</text>
</svg>
