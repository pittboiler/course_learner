<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- ============ LEFT PANEL: Hausdorff (T2) — disjoint neighborhoods ============ -->
  <rect x="20" y="40" width="270" height="260" rx="10" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="30" y="30" fill="#8a8a8a" font-style="italic">Hausdorff (T₂): disjoint opens</text>

  <!-- open neighborhood U of x -->
  <ellipse cx="105" cy="150" rx="62" ry="52" fill="#4a90d9" opacity="0.15"/>
  <ellipse cx="105" cy="150" rx="62" ry="52" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <!-- open neighborhood V of y -->
  <ellipse cx="215" cy="215" rx="58" ry="48" fill="#e0645c" opacity="0.15"/>
  <ellipse cx="215" cy="215" rx="58" ry="48" fill="none" stroke="#e0645c" stroke-width="2"/>

  <!-- points -->
  <circle cx="105" cy="150" r="5" fill="#4a90d9"/>
  <text x="93" y="145" fill="#4a90d9">x</text>
  <circle cx="215" cy="215" r="5" fill="#e0645c"/>
  <text x="224" y="220" fill="#e0645c">y</text>

  <text x="60" y="110" fill="#4a90d9">U</text>
  <text x="250" y="200" fill="#e0645c">V</text>
  <text x="150" y="290" fill="#8a8a8a" font-size="13">U ∩ V = ∅</text>

  <!-- ============ RIGHT PANEL: cofinite (T1, not T2) — opens must overlap ============ -->
  <rect x="350" y="40" width="270" height="260" rx="10" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="360" y="30" fill="#8a8a8a" font-style="italic">Cofinite (T₁, not T₂): opens must meet</text>

  <!-- a cofinite open U: whole box minus a few dots -->
  <ellipse cx="455" cy="170" rx="95" ry="105" fill="#4a90d9" opacity="0.15"/>
  <ellipse cx="455" cy="170" rx="95" ry="105" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <!-- a cofinite open V: overlapping huge region -->
  <ellipse cx="515" cy="170" rx="95" ry="105" fill="#e0645c" opacity="0.15"/>
  <ellipse cx="515" cy="170" rx="95" ry="105" fill="none" stroke="#e0645c" stroke-width="2"/>

  <!-- points -->
  <circle cx="420" cy="170" r="5" fill="#4a90d9"/>
  <text x="408" y="165" fill="#4a90d9">x</text>
  <circle cx="550" cy="170" r="5" fill="#e0645c"/>
  <text x="558" y="165" fill="#e0645c">y</text>

  <!-- the forced overlap, shaded darker -->
  <path d="M 485 78 A 95 105 0 0 1 485 262 A 95 105 0 0 0 485 78 Z" fill="#8a8a8a" opacity="0.22"/>
  <text x="405" y="300" fill="#8a8a8a" font-size="13">every U ∩ V ≠ ∅ (both cofinite)</text>

  <!-- the finitely-many excluded points, scattered -->
  <circle cx="470" cy="120" r="2.5" fill="#8a8a8a"/>
  <circle cx="500" cy="215" r="2.5" fill="#8a8a8a"/>
  <circle cx="480" cy="190" r="2.5" fill="#8a8a8a"/>
</svg>
