  <line x1="363" y1="120" x2="373" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="378" y="280" fill="#8a8a8a">0</text>
  <text x="378" y="228" fill="#8a8a8a">1</text>
  <text x="378" y="176" fill="#e0645c">2</text>
  <text x="378" y="124" fill="#8a8a8a">3</text>
  <text x="316" y="316" fill="#8a8a8a" font-style="italic">p&#8315;&#185;(x&#8320;) &#8801; &#8484;</text>

  <!-- dashed connectors: lift endpoints to their integer heights -->
