  <line x1="203.7" y1="172.5" x2="363" y2="172" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- projection map p pointing down to the circle -->
  <line x1="78" y1="150" x2="78" y2="300" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="78,308 72,296 84,296" fill="#8a8a8a"/>
  <text x="40" y="222" fill="#8a8a8a" font-weight="bold">p</text>
  <text x="20" y="240" fill="#8a8a8a" font-size="12">e</text>
  <text x="28" y="235" fill="#8a8a8a" font-size="10">2&#960;it</text>

  <!-- S1 : the circle (blue ellipse in perspective) -->
