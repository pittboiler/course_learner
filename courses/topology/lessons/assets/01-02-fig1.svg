<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- ================= LEFT: a point with wiggle room inside an open set U ================= -->
  <text x="30" y="30" fill="#8a8a8a" font-style="italic">Open set: every point has a ball inside.</text>

  <!-- blobby open set U -->
  <path d="M 60 120 C 50 70, 120 55, 160 75 C 210 60, 250 95, 235 140 C 260 175, 220 220, 170 210 C 130 235, 65 215, 70 170 C 45 155, 55 135, 60 120 Z"
        fill="#4a90d9" opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="205" y="105" fill="#4a90d9">U</text>

  <!-- the ball B(x,r) fully inside U -->
  <circle cx="150" cy="145" r="42" fill="#e0645c" opacity="0.14" stroke="#e0645c" stroke-width="2"/>
  <!-- radius -->
  <line x1="150" y1="145" x2="192" y2="145" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="163" y="139" fill="#e0645c">r</text>
  <!-- the point x -->
  <circle cx="150" cy="145" r="4" fill="#8a8a8a"/>
  <text x="140" y="140" fill="#8a8a8a">x</text>
  <text x="118" y="205" fill="#e0645c">B(x, r)</text>

  <!-- ================= RIGHT: a ball fits inside a ball — d1, d2, d-inf equivalent ================= -->
  <text x="360" y="30" fill="#8a8a8a" font-style="italic">Diamond ⊂ circle ⊂ square: each fits the next.</text>

  <!-- center of the nested figure -->
  <!-- outer square: sup-metric ball d_inf (radius 90 in Chebyshev) -->
  <rect x="410" y="110" width="180" height="180" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="595" y="205" fill="#8a8a8a">d∞</text>

  <!-- circle: Euclidean ball d_2 inscribed in the square, radius 90 -->
  <circle cx="500" cy="200" r="90" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="500" y="128" fill="#4a90d9" text-anchor="middle">d₂</text>

  <!-- diamond: taxicab ball d_1 inscribed in the circle, "radius" 90/sqrt2 ≈ 63.6 -->
  <polygon points="500,136.4 563.6,200 500,263.6 436.4,200" fill="#e0645c" opacity="0.12" stroke="#e0645c" stroke-width="2"/>
  <text x="500" y="204" fill="#e0645c" text-anchor="middle">d₁</text>

  <!-- shared center -->
  <circle cx="500" cy="200" r="3.5" fill="#8a8a8a"/>
</svg>
