<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- ===================== LEFT PANEL: finite subcover ===================== -->
  <text x="30" y="28" fill="#8a8a8a" font-style="italic">Compact: some finite subcollection already covers X</text>

  <!-- the space X -->
  <ellipse cx="165" cy="185" rx="130" ry="95" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="248" y="110" fill="#8a8a8a">X</text>

  <!-- the full (infinite) cover: many thin grey open sets -->
  <circle cx="95"  cy="160" r="55" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="150" cy="140" r="52" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="215" cy="150" r="55" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="110" cy="225" r="55" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="185" cy="235" r="58" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="245" cy="215" r="50" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- the finite subcover: three highlighted open sets that still cover X -->
  <circle cx="105" cy="175" r="72" fill="#4a90d9" opacity="0.16"/>
  <circle cx="225" cy="165" r="72" fill="#4a90d9" opacity="0.16"/>
  <circle cx="170" cy="240" r="72" fill="#4a90d9" opacity="0.16"/>
  <circle cx="105" cy="175" r="72" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="225" cy="165" r="72" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <circle cx="170" cy="240" r="72" fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <text x="30" y="335" fill="#4a90d9">3 open sets (blue) out of the whole cover — enough</text>

  <!-- divider -->
  <line x1="320" y1="45" x2="320" y2="330" stroke="#d0d0d0" stroke-width="1"/>

  <!-- ===================== RIGHT PANEL: (0,1) not compact ===================== -->
  <text x="352" y="28" fill="#8a8a8a" font-style="italic">Not compact: (0,1) with the cover (1/n, 1)</text>

  <!-- number line for (0,1) -->
  <line x1="380" y1="255" x2="620" y2="255" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="380" cy="255" r="4.5" fill="white" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="620" cy="255" r="4.5" fill="white" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="372" y="278" fill="#8a8a8a">0</text>
  <text x="614" y="278" fill="#8a8a8a">1</text>

  <!-- intervals (1/n,1): right end at x=620 (=1), left end at 380 + 240/n -->
  <!-- n=2  left=500 -->
  <line x1="500" y1="225" x2="620" y2="225" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="500" y1="219" x2="500" y2="231" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="470" y="216" fill="#4a90d9" font-size="12">(½,1)</text>
  <!-- n=3  left=460 -->
  <line x1="460" y1="205" x2="620" y2="205" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="460" y1="199" x2="460" y2="211" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- n=4  left=440 -->
  <line x1="440" y1="185" x2="620" y2="185" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="440" y1="179" x2="440" y2="191" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- n=6  left=420 -->
  <line x1="420" y1="165" x2="620" y2="165" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="420" y1="159" x2="420" y2="171" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- n large left ticks marching toward 0 -->
  <line x1="406" y1="149" x2="620" y2="149" stroke="#4a90d9" stroke-width="2"/>
  <line x1="406" y1="144" x2="406" y2="154" stroke="#4a90d9" stroke-width="2"/>
  <line x1="396" y1="135" x2="620" y2="135" stroke="#4a90d9" stroke-width="1.5"/>

  <!-- the gap that no finite subfamily can close -->
  <line x1="380" y1="300" x2="500" y2="300" stroke="#e0645c" stroke-width="2"/>
  <line x1="380" y1="294" x2="380" y2="306" stroke="#e0645c" stroke-width="2"/>
  <line x1="500" y1="294" x2="500" y2="306" stroke="#e0645c" stroke-width="2"/>
  <text x="352" y="335" fill="#e0645c" font-size="12">any finite family stops at some 1/N — misses (0, 1/N]</text>

  <!-- arrow: left ends march toward 0 but never arrive -->
  <path d="M 500 118 L 392 118" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <polygon points="392,118 400,114 400,122" fill="#8a8a8a"/>
  <text x="452" y="112" fill="#8a8a8a" font-size="12">left ends → 0</text>
</svg>
