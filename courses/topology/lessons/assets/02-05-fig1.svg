<svg viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- ============ TOP ROW: delete a point ============ -->

  <!-- Panel A: interval minus a point -> 2 pieces -->
  <text x="40" y="40" fill="#8a8a8a" font-style="italic">Delete an interior point:</text>
  <!-- blue left half -->
  <line x1="40" y1="90" x2="146" y2="90" stroke="#4a90d9" stroke-width="5"/>
  <!-- red right half -->
  <line x1="154" y1="90" x2="260" y2="90" stroke="#e0645c" stroke-width="5"/>
  <!-- the removed point (open hole) -->
  <circle cx="150" cy="90" r="5" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="70" y="120" fill="#4a90d9">interval</text>
  <text x="150" y="120" fill="#8a8a8a">&#8722; 1 pt</text>
  <text x="205" y="120" fill="#e0645c">&#8594; 2 pieces</text>

  <!-- Panel B: circle minus a point -> still 1 piece -->
  <!-- near-full circle with a gap at the top; drawn in one colour = still connected -->
  <path d="M 459.5 55.8 A 55 55 0 1 1 440.5 55.8" fill="none" stroke="#4a90d9" stroke-width="5"/>
  <circle cx="450" cy="55.8" r="5" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="360" y="150" fill="#4a90d9">circle</text>
  <text x="415" y="150" fill="#8a8a8a">&#8722; 1 pt</text>
  <text x="470" y="150" fill="#4a90d9">&#8594; still 1 piece</text>

  <!-- divider -->
  <line x1="30" y1="185" x2="570" y2="185" stroke="#d0d0d0" stroke-width="1"/>

  <!-- ============ BOTTOM ROW: the R vs R^2 punchline ============ -->

  <!-- Panel C: R minus a point -> two rays -->
  <text x="40" y="225" fill="#8a8a8a" font-style="italic">Puncture the line vs. the plane:</text>
  <line x1="35" y1="300" x2="146" y2="300" stroke="#4a90d9" stroke-width="4"/>
  <line x1="154" y1="300" x2="265" y2="300" stroke="#e0645c" stroke-width="4"/>
  <polygon points="30,300 42,295 42,305" fill="#4a90d9"/>
  <polygon points="270,300 258,295 258,305" fill="#e0645c"/>
  <circle cx="150" cy="300" r="5" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="80" y="335" fill="#8a8a8a">&#8477; &#8722; 1 pt</text>
  <text x="80" y="353" fill="#e0645c">= two rays (disconnected)</text>

  <!-- Panel D: R^2 minus a point -> still connected -->
  <rect x="360" y="238" width="200" height="120" fill="#4a90d9" opacity="0.10"/>
  <circle cx="460" cy="300" r="5" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- a path detouring around the hole: two points still joined -->
  <path d="M 385 300 Q 460 250 535 300" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="385" cy="300" r="3.5" fill="#8a8a8a"/>
  <circle cx="535" cy="300" r="3.5" fill="#8a8a8a"/>
  <text x="372" y="335" fill="#8a8a8a">&#8477;&#178; &#8722; 1 pt</text>
  <text x="372" y="353" fill="#4a90d9">= still connected (walk around)</text>
</svg>
