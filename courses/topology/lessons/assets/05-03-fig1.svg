<svg viewBox="0 0 620 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- title -->
  <text x="20" y="28" fill="#8a8a8a" font-style="italic">Who implies whom (and where the arrows break)</text>

  <!-- second countable node -->
  <rect x="215" y="52" width="190" height="46" rx="6" fill="#4a90d9" opacity="0.14" stroke="#4a90d9" stroke-width="2"/>
  <text x="310" y="74" fill="#4a90d9" text-anchor="middle" font-weight="bold">second countable</text>
  <text x="310" y="90" fill="#8a8a8a" text-anchor="middle" font-size="12">countable basis for all of X</text>

  <!-- three consequence nodes -->
  <rect x="30" y="200" width="160" height="46" rx="6" fill="#8a8a8a" opacity="0.10" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="110" y="222" fill="#333" text-anchor="middle" font-weight="bold">first countable</text>
  <text x="110" y="238" fill="#8a8a8a" text-anchor="middle" font-size="12">sequences suffice</text>

  <rect x="230" y="200" width="160" height="46" rx="6" fill="#8a8a8a" opacity="0.10" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="310" y="222" fill="#333" text-anchor="middle" font-weight="bold">separable</text>
  <text x="310" y="238" fill="#8a8a8a" text-anchor="middle" font-size="12">countable dense set</text>

  <rect x="430" y="200" width="160" height="46" rx="6" fill="#8a8a8a" opacity="0.10" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="510" y="222" fill="#333" text-anchor="middle" font-weight="bold">Lindelöf</text>
  <text x="510" y="238" fill="#8a8a8a" text-anchor="middle" font-size="12">countable subcover</text>

  <!-- arrowhead marker -->
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#4a90d9"/>
    </marker>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#e0645c"/>
    </marker>
  </defs>

  <!-- downward implication arrows (always valid) -->
  <line x1="255" y1="98" x2="120" y2="196" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="310" y1="98" x2="310" y2="196" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="365" y1="98" x2="500" y2="196" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- broken reverse arrow: separable -/-> second countable -->
  <line x1="310" y1="196" x2="310" y2="104" stroke="#e0645c" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowR)" opacity="0.9"/>
  <text x="322" y="150" fill="#e0645c" font-size="12">✗ Sorgenfrey line</text>
  <text x="322" y="166" fill="#e0645c" font-size="12">breaks this</text>

  <!-- metric collapse note -->
  <rect x="120" y="300" width="380" height="58" rx="6" fill="#e0645c" opacity="0.10" stroke="#e0645c" stroke-width="1.5"/>
  <text x="310" y="322" fill="#333" text-anchor="middle" font-weight="bold">In a METRIC space, all three collapse:</text>
  <text x="310" y="342" fill="#333" text-anchor="middle">second countable ⟺ separable ⟺ Lindelöf</text>
</svg>
