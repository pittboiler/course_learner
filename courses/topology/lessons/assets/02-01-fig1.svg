<svg viewBox="0 0 600 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- ===================== TOP: preimage of open is open ===================== -->
  <text x="24" y="28" fill="#8a8a8a" font-style="italic">Continuity: pull an open set back and it stays open.</text>

  <!-- ambient space X (solid) -->
  <ellipse cx="150" cy="130" rx="100" ry="82" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="70" y="70" fill="#8a8a8a">X</text>

  <!-- open preimage in X (dashed = open) -->
  <ellipse cx="150" cy="145" rx="52" ry="40" fill="#4a90d9" opacity="0.16"/>
  <ellipse cx="150" cy="145" rx="52" ry="40" fill="none" stroke="#4a90d9" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="112" y="150" fill="#4a90d9">f⁻¹(V)</text>

  <!-- ambient space Y (solid) -->
  <ellipse cx="450" cy="130" rx="100" ry="82" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="520" y="70" fill="#8a8a8a">Y</text>

  <!-- open V in Y (dashed = open) -->
  <ellipse cx="458" cy="130" rx="46" ry="34" fill="#e0645c" opacity="0.16"/>
  <ellipse cx="458" cy="130" rx="46" ry="34" fill="none" stroke="#e0645c" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="446" y="135" fill="#e0645c">V</text>

  <!-- map arrow f -->
  <line x1="258" y1="120" x2="342" y2="120" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="342,120 332,115 332,125" fill="#8a8a8a"/>
  <text x="292" y="110" fill="#8a8a8a" font-style="italic">f</text>
  <text x="150" y="238" fill="#8a8a8a" text-anchor="middle" font-size="12">open</text>
  <text x="458" y="238" fill="#8a8a8a" text-anchor="middle" font-size="12">open</text>

  <!-- divider -->
  <line x1="40" y1="268" x2="560" y2="268" stroke="#cccccc" stroke-width="1"/>

  <!-- ===================== BOTTOM: (a,b) ≅ ℝ ===================== -->
  <text x="24" y="300" fill="#8a8a8a" font-style="italic">Homeomorphism: h bends the finite interval (a,b) onto all of ℝ.</text>

  <!-- horizontal axis = the interval (a,b) -->
  <line x1="330" y1="390" x2="540" y2="390" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- vertical axis = ℝ -->
  <line x1="435" y1="318" x2="435" y2="430" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="435,314 430,324 440,324" fill="#8a8a8a"/>
  <polygon points="435,432 430,422 440,422" fill="#8a8a8a"/>
  <text x="444" y="326" fill="#8a8a8a">ℝ</text>

  <!-- open-interval asymptotes at a and b (dashed) -->
  <line x1="360" y1="316" x2="360" y2="430" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="520" y1="316" x2="520" y2="430" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="356" y="426" fill="#8a8a8a">a</text>
  <text x="516" y="426" fill="#8a8a8a">b</text>
  <circle cx="360" cy="390" r="4" fill="white" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="520" cy="390" r="4" fill="white" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- the tan-like homeomorphism curve -->
  <path d="M 366 428 L 386 405 L 406 385 L 423 373 L 435 366 L 448 358 L 466 346 L 490 328 L 514 320"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="470" y="360" fill="#4a90d9" font-style="italic">h</text>
</svg>
