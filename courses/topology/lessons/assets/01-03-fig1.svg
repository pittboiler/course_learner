<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- ===================== LEFT PANEL: a valid topology ===================== -->
  <text x="40" y="30" fill="#4a90d9" font-weight="bold">Is a topology</text>
  <text x="40" y="50" fill="#8a8a8a" font-size="13">&#964; = { &#8709;, {a}, {a,b}, X }</text>

  <!-- X: outer open set around all three points -->
  <ellipse cx="150" cy="200" rx="120" ry="95" fill="#4a90d9" opacity="0.06" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="60" y="130" fill="#4a90d9" font-size="13">X</text>

  <!-- {a,b}: open set around the top pair -->
  <ellipse cx="150" cy="163" rx="82" ry="42" fill="#4a90d9" opacity="0.10" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="228" y="150" fill="#4a90d9" font-size="13">{a,b}</text>

  <!-- {a}: singleton open set -->
  <circle cx="105" cy="163" r="26" fill="#4a90d9" opacity="0.16" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="70" y="150" fill="#4a90d9" font-size="13">{a}</text>

  <!-- points -->
  <circle cx="105" cy="168" r="5" fill="#3a3a3a"/>
  <text x="98" y="192" fill="#3a3a3a">a</text>
  <circle cx="195" cy="168" r="5" fill="#3a3a3a"/>
  <text x="200" y="192" fill="#3a3a3a">b</text>
  <circle cx="150" cy="245" r="5" fill="#3a3a3a"/>
  <text x="143" y="270" fill="#3a3a3a">c</text>

  <!-- check: unions & intersections stay inside -->
  <text x="40" y="315" fill="#8a8a8a" font-size="12" font-style="italic">{a}&#8746;{a,b}={a,b} &#10003;   {a}&#8745;{a,b}={a} &#10003;</text>

  <!-- divider -->
  <line x1="330" y1="20" x2="330" y2="320" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- ===================== RIGHT PANEL: NOT a topology ===================== -->
  <text x="380" y="30" fill="#e0645c" font-weight="bold">Not a topology</text>
  <text x="380" y="50" fill="#8a8a8a" font-size="13">{ &#8709;, {a,b}, {b,c}, X }</text>

  <!-- {a,b} -->
  <ellipse cx="450" cy="168" rx="60" ry="40" fill="#e0645c" opacity="0.10" stroke="#e0645c" stroke-width="1.5"/>
  <text x="388" y="150" fill="#e0645c" font-size="13">{a,b}</text>

  <!-- {b,c} -->
  <ellipse cx="530" cy="205" rx="60" ry="40" fill="#e0645c" opacity="0.10" stroke="#e0645c" stroke-width="1.5"/>
  <text x="560" y="245" fill="#e0645c" font-size="13">{b,c}</text>

  <!-- points -->
  <circle cx="410" cy="168" r="5" fill="#3a3a3a"/>
  <text x="396" y="172" fill="#3a3a3a">a</text>
  <circle cx="490" cy="188" r="6" fill="#e0645c"/>
  <text x="484" y="212" fill="#e0645c">b</text>
  <circle cx="570" cy="205" r="5" fill="#3a3a3a"/>
  <text x="580" y="209" fill="#3a3a3a">c</text>

  <!-- highlight the offending intersection {b} -->
  <circle cx="490" cy="188" r="16" fill="none" stroke="#e0645c" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="490" y1="240" x2="490" y2="215" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="420" y="300" fill="#e0645c" font-size="12" font-style="italic">{a,b}&#8745;{b,c}={b} is missing &#8594; (T3) fails</text>
</svg>
