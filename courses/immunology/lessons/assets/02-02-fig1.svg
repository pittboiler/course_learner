<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" width="820" height="410" role="img" aria-label="Left panel: fractional occupancy plotted against free antigen concentration on a log axis. A single IgG Fab arm with a dissociation constant of one micromolar and a single IgM Fab arm at one hundred micromolar both bind only at high concentration, but either antibody engaged multivalently shifts left to an apparent constant near three nanomolar, so valency erases the hundred-fold difference between the two arms. Right panel: a schematic of two membrane immunoglobulin receptors bridged by a single repetitive multivalent antigen, with Ig-alpha and Ig-beta chains carrying ITAMs below the membrane, and a CD19 CD21 coreceptor engaging a C3d tag on the same antigen, both feeding one intracellular signalling pathway.">
