<line x1="20" y1="392" x2="800" y2="392" stroke="#8fa8c0" stroke-width="1"/>
<text x="20" y="414" font-size="10.5" fill="#333">All somatic diversity sits in the V domains; the C domains are germline &#8212; so class switching swaps Fc without touching specificity.</text>

