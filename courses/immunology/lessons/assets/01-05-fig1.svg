<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="The complement cascade: three activation pathways converge on C3 convertase, which amplifies and branches to three outputs, with host regulators acting as brakes.">
  <rect width="800" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#333333"/>
    </marker>
    <marker id="arb" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#1a6fb5"/>
    </marker>
  </defs>

  <text x="400" y="20" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#111111">Three inputs &#8594; one shared step &#8594; three outputs &#8212; and one set of brakes</text>

  <!-- INPUT BOXES -->
  <rect x="10" y="45" width="178" height="72" rx="4" fill="#f5f7fa" stroke="#8fa8c0"/>
  <text x="19" y="63" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a6fb5">CLASSICAL</text>
  <text x="19" y="79" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">clustered antibody Fc</text>
  <text x="19" y="93" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">&#8594; C1q, C1r, C1s &#8594; C4, C2</text>
  <text x="19" y="108" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-style="italic" fill="#666666">adaptive trigger</text>

  <rect x="10" y="145" width="178" height="72" rx="4" fill="#f5f7fa" stroke="#8fa8c0"/>
  <text x="19" y="163" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#2e8b57">LECTIN</text>
  <text x="19" y="179" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">MBL / ficolin on microbial</text>
  <text x="19" y="193" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">sugars &#8594; MASP-1, MASP-2</text>
  <text x="19" y="208" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-style="italic" fill="#666666">a soluble PRR</text>

  <rect x="10" y="245" width="178" height="72" rx="4" fill="#f5f7fa" stroke="#8fa8c0"/>
  <text x="19" y="263" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b">ALTERNATIVE</text>
  <text x="19" y="279" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">spontaneous C3 tickover,</text>
  <text x="19" y="293" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">&#8776;1% of plasma C3 per hour</text>
  <text x="19" y="308" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-style="italic" fill="#666666">always on, samples everything</text>

  <path d="M188,81 L221,140" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M188,181 L221,181" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M188,281 L221,222" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- CONVERTASE PANEL -->
  <rect x="225" y="115" width="170" height="150" rx="5" fill="#eef3f9" stroke="#1a6fb5" stroke-width="2"/>
  <text x="310" y="137" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#111111">C3 CONVERTASE</text>
  <text x="310" y="151" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-style="italic" fill="#666666">the one shared step</text>
  <line x1="238" y1="160" x2="382" y2="160" stroke="#8fa8c0"/>
  <text x="310" y="178" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#111111">C4b2a</text>
  <text x="310" y="197" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#111111">C3bBb</text>
  <line x1="238" y1="208" x2="382" y2="208" stroke="#8fa8c0"/>
  <text x="310" y="225" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">cleaves C3 &#8594; C3a + C3b</text>
  <text x="310" y="239" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">at &#8776;1 per second, for &#8776;30 min</text>
  <text x="310" y="255" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#d1495b">&#8776;2000 C3b per convertase</text>

  <!-- C3b node -->
  <path d="M395,166 L426,166" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="430" y="140" width="90" height="52" rx="4" fill="#f5f7fa" stroke="#8fa8c0"/>
  <text x="475" y="163" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">C3b</text>
  <text x="475" y="180" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">bound to surface</text>

  <!-- amplification loop -->
  <path d="M470,138 C430,95 355,95 312,111" fill="none" stroke="#1a6fb5" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arb)"/>
  <text x="392" y="72" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#1a6fb5">AMPLIFICATION LOOP</text>
  <text x="392" y="86" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#1a6fb5">about 1 in 100 deposited C3b seeds a new convertase</text>

  <!-- C5 convertase -->
  <path d="M455,192 L455,246" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="430" y="250" width="105" height="50" rx="4" fill="#f5f7fa" stroke="#8fa8c0"/>
  <text x="482" y="270" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111111">C5 convertase</text>
  <text x="482" y="286" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">= C3 convertase + C3b</text>

  <!-- OUTPUT BOXES -->
  <rect x="575" y="40" width="212" height="90" rx="4" fill="#f5f7fa" stroke="#2e8b57" stroke-width="1.6"/>
  <text x="585" y="59" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#2e8b57">1. OPSONIZATION</text>
  <text x="585" y="75" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">C3b and iC3b coat the surface;</text>
  <text x="585" y="89" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">read by CR1 / CR3 on phagocytes</text>
  <text x="585" y="103" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">&#8594; engulfment</text>
  <text x="585" y="121" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-style="italic" fill="#666666">the workhorse output</text>

  <rect x="575" y="155" width="212" height="90" rx="4" fill="#f5f7fa" stroke="#2e8b57" stroke-width="1.6"/>
  <text x="585" y="174" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#2e8b57">2. RECRUITMENT</text>
  <text x="585" y="190" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">C3a and C5a diffuse away as</text>
  <text x="585" y="204" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">anaphylatoxins; C5a is a potent</text>
  <text x="585" y="218" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">neutrophil chemoattractant</text>
  <text x="585" y="236" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-style="italic" fill="#666666">the soluble output</text>

  <rect x="575" y="270" width="212" height="105" rx="4" fill="#f5f7fa" stroke="#2e8b57" stroke-width="1.6"/>
  <text x="585" y="289" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#2e8b57">3. LYSIS &#8212; the MAC</text>
  <text x="585" y="305" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">C5b + C6 + C7 + C8 + many C9</text>
  <text x="585" y="319" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">form a pore roughly 10 nm wide</text>
  <text x="585" y="333" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">in an exposed lipid bilayer</text>
  <text x="585" y="351" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-style="italic" fill="#666666">narrow use: mostly Gram-negatives</text>
  <text x="585" y="366" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-style="italic" fill="#666666">that resist being eaten</text>

  <path d="M520,155 L570,90" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M535,268 L570,205" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="536" y="232" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">C3a, C5a</text>
  <path d="M535,290 L570,305" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="536" y="322" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">C5b</text>

  <!-- INHIBITORY MARKS -->
  <line x1="292" y1="270" x2="328" y2="270" stroke="#d1495b" stroke-width="3"/>
  <line x1="310" y1="270" x2="310" y2="330" stroke="#d1495b" stroke-width="1.6" stroke-dasharray="4,3"/>
  <line x1="546" y1="288" x2="562" y2="312" stroke="#d1495b" stroke-width="3"/>
  <text x="500" y="330" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-weight="bold" fill="#d1495b">CD59</text>

  <!-- REGULATOR PANEL -->
  <rect x="195" y="330" width="340" height="98" rx="5" fill="#fdf1f3" stroke="#d1495b" stroke-width="1.6"/>
  <text x="205" y="348" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#d1495b">HOST REGULATORS &#8212; on your cells, absent on microbes</text>
  <text x="205" y="365" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">DAF/CD55 + factor H (docked by host sialic acid):</text>
  <text x="205" y="378" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">accelerate convertase decay, 30 min &#8594; seconds</text>
  <text x="205" y="395" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">MCP/CD46 + factor I: cleave C3b to inert iC3b</text>
  <text x="205" y="410" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">CD59: blocks C9 polymerization, aborting the MAC</text>
  <text x="205" y="423" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333333">C1-INH: caps classical and lectin initiation</text>

  <!-- NET GAIN CALLOUT -->
  <rect x="548" y="390" width="240" height="78" rx="5" fill="#f5f7fa" stroke="#8fa8c0"/>
  <text x="558" y="408" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#111111">NET GAIN from one seed convertase</text>
  <text x="558" y="425" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#d1495b">unprotected surface: 100,000 C3b</text>
  <text x="558" y="438" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#d1495b">in about 12 minutes</text>
  <text x="558" y="452" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#2e8b57">host surface: about 10 C3b,</text>
  <text x="558" y="465" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#2e8b57">then it dies out</text>

  <text x="200" y="452" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#d1495b">Self and non-self are decided by regulation, not recognition.</text>
</svg>
