<line x1="771" y1="40" x2="771" y2="372" stroke="#eef2f6" stroke-width="1"/>

<text x="14" y="60" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b">TYPE I</text>
<text x="14" y="74" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">IgE + mast cell</text>
<circle cx="140" cy="82" r="18" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.2"/>
<circle cx="134" cy="78" r="3.5" fill="#d1495b"/>
<circle cx="146" cy="80" r="3.5" fill="#d1495b"/>
<circle cx="139" cy="89" r="3.5" fill="#d1495b"/>
<line x1="130" y1="65" x2="130" y2="57" stroke="#111" stroke-width="1.4"/>
<line x1="130" y1="57" x2="124" y2="50" stroke="#111" stroke-width="1.4"/>
<line x1="130" y1="57" x2="136" y2="50" stroke="#111" stroke-width="1.4"/>
<line x1="150" y1="65" x2="150" y2="57" stroke="#111" stroke-width="1.4"/>
<line x1="150" y1="57" x2="144" y2="50" stroke="#111" stroke-width="1.4"/>
<line x1="150" y1="57" x2="156" y2="50" stroke="#111" stroke-width="1.4"/>
<circle cx="140" cy="45" r="5.5" fill="#d1495b" stroke="#111" stroke-width="1"/>
<line x1="136" y1="50" x2="137" y2="47" stroke="#111" stroke-width="1"/>
<line x1="144" y1="50" x2="143" y2="47" stroke="#111" stroke-width="1"/>
<path d="M 162 82 L 186 82" stroke="#d1495b" stroke-width="1.6"/>
<path d="M 186 82 l -6 -3 l 0 6 z" fill="#d1495b"/>
<text x="190" y="79" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">histamine,</text>
<text x="190" y="91" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">tryptase</text>
<text x="104" y="107" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">allergen bridges two IgE on Fc&#949;RI</text>
<text x="308" y="70" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">granules preloaded, so no</text>
<text x="308" y="84" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">synthesis is needed:</text>
<text x="308" y="98" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">&#8594; leak, spasm, itch</text>
<rect x="496" y="71" width="89" height="9" rx="3" fill="#d1495b"/>
<rect x="690" y="71" width="24" height="9" rx="3" fill="#d1495b" opacity="0.45"/>
<text x="676" y="66" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">late phase</text>

<text x="14" y="140" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a6fb5">TYPE II</text>
<text x="14" y="154" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">IgG vs. surface</text>
<ellipse cx="148" cy="158" rx="34" ry="17" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.2"/>
<rect x="132" y="139" width="7" height="5" fill="#1a6fb5"/>
<rect x="158" y="139" width="7" height="5" fill="#1a6fb5"/>
<line x1="135" y1="139" x2="135" y2="132" stroke="#111" stroke-width="1.4"/>
<line x1="135" y1="132" x2="129" y2="125" stroke="#111" stroke-width="1.4"/>
<line x1="135" y1="132" x2="141" y2="125" stroke="#111" stroke-width="1.4"/>
<line x1="161" y1="139" x2="161" y2="132" stroke="#111" stroke-width="1.4"/>
<line x1="161" y1="132" x2="155" y2="125" stroke="#111" stroke-width="1.4"/>
<line x1="161" y1="132" x2="167" y2="125" stroke="#111" stroke-width="1.4"/>
<path d="M 186 152 L 204 152" stroke="#1a6fb5" stroke-width="1.6"/>
<path d="M 204 152 l -6 -3 l 0 6 z" fill="#1a6fb5"/>
<text x="208" y="149" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">complement</text>
<text x="208" y="161" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">+ ADCC</text>
<text x="104" y="185" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">IgG on a fixed cell-surface target</text>
<text x="308" y="148" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">lysis or opsonized killing,</text>
<text x="308" y="162" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">or the antibody blocks or</text>
<text x="308" y="176" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">stimulates the receptor</text>
<rect x="631" y="149" width="145" height="9" rx="3" fill="#1a6fb5"/>

<text x="14" y="218" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#2e8b57">TYPE III</text>
<text x="14" y="232" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">immune complex</text>
<circle cx="138" cy="214" r="4.5" fill="#1a6fb5"/>
<circle cx="168" cy="222" r="4.5" fill="#1a6fb5"/>
<circle cx="198" cy="211" r="4.5" fill="#1a6fb5"/>
<line x1="138" y1="214" x2="153" y2="212" stroke="#2e8b57" stroke-width="1.8"/>
<line x1="153" y1="212" x2="168" y2="222" stroke="#2e8b57" stroke-width="1.8"/>
<line x1="168" y1="222" x2="184" y2="222" stroke="#2e8b57" stroke-width="1.8"/>
<line x1="184" y1="222" x2="198" y2="211" stroke="#2e8b57" stroke-width="1.8"/>
<rect x="106" y="248" width="188" height="8" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.2"/>
<path d="M 168 230 L 168 244" stroke="#333" stroke-width="1.4"/>
<path d="M 168 246 l -3 -6 l 6 0 z" fill="#333"/>
<circle cx="146" cy="244" r="3.5" fill="#1a6fb5"/>
<line x1="142" y1="241" x2="152" y2="246" stroke="#2e8b57" stroke-width="1.6"/>
<circle cx="222" cy="244" r="3.5" fill="#1a6fb5"/>
<line x1="218" y1="241" x2="228" y2="246" stroke="#2e8b57" stroke-width="1.6"/>
<text x="238" y="240" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">deposits</text>
<text x="104" y="264" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">soluble antigen plus IgG, no fixed cell</text>
<text x="308" y="226" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">complexes lodge in filtering</text>
<text x="308" y="240" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">beds, then C5a pulls in</text>
<text x="308" y="254" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">neutrophils that wreck them</text>
<rect x="676" y="227" width="100" height="9" rx="3" fill="#2e8b57"/>

<text x="14" y="296" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111">TYPE IV</text>
<text x="14" y="310" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">T cell, no Ab</text>
<rect x="106" y="292" width="26" height="26" rx="4" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.2"/>
<rect x="132" y="300" width="6" height="4" fill="#1a6fb5"/>
<path d="M 140 305 L 152 305" stroke="#333" stroke-width="1.4"/>
<path d="M 152 305 l -6 -3 l 0 6 z" fill="#333"/>
<circle cx="168" cy="305" r="14" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.2"/>
<text x="164" y="309" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">T</text>
<path d="M 184 305 L 200 305" stroke="#111" stroke-width="1.4"/>
<path d="M 200 305 l -6 -3 l 0 6 z" fill="#111"/>
<text x="180" y="292" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">IFN-&#947;</text>
<circle cx="218" cy="305" r="16" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.6"/>
<circle cx="212" cy="301" r="3" fill="#333"/>
<circle cx="224" cy="303" r="3" fill="#333"/>
<circle cx="217" cy="311" r="3" fill="#333"/>
<circle cx="242" cy="292" r="2.5" fill="#8fa8c0"/>
<circle cx="248" cy="304" r="2.5" fill="#8fa8c0"/>
<circle cx="240" cy="316" r="2.5" fill="#8fa8c0"/>
<text x="104" y="342" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">T cell recruits and arms macrophages</text>
<text x="308" y="298" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">cells must be called in and</text>
<text x="308" y="312" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">activated, so damage is a</text>
<text x="308" y="326" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">firm infiltrate, not fluid</text>
<rect x="735" y="305" width="41" height="9" rx="3" fill="#111"/>

