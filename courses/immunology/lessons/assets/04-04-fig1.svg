<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-label="The four hypersensitivity types laid out as four rows sharing one logarithmic time axis. Each row shows the effector molecule, a schematic of what binds what, how the tissue is damaged, and a bar marking when damage appears after re-exposure. The bars shift steadily rightward from minutes for the IgE mast-cell type to one to three days for the T-cell type.">
<rect width="800" height="430" fill="#ffffff"/>

<text x="14" y="24" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#111">MECHANISM CLASS</text>
<text x="104" y="24" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#111">WHAT BINDS WHAT</text>
<text x="308" y="24" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#111">HOW TISSUE IS HURT</text>
<text x="496" y="24" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#111">WHEN, AFTER RE-EXPOSURE</text>

<line x1="12" y1="32" x2="788" y2="32" stroke="#111" stroke-width="1"/>
<line x1="12" y1="114" x2="788" y2="114" stroke="#e3e8ee" stroke-width="1"/>
