<text x="600" y="300" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111">5&#215; longer dwell buys 2.1&#215; signal at N = 1,</text>
<text x="600" y="313" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111">but 45&#215; at N = 5.</text>

<text x="16" y="378" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">Coral CDR3&#945; and CDR3&#946; loops sit over the peptide; blue CDR1 and CDR2 loops sit over the MHC helices, so the ligand is a composite surface.</text>
<text x="16" y="394" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">CD8 grips the non-polymorphic &#945;3 domain &#8212; it reads the MHC class, not the peptide &#8212; and delivers Lck to the ITAMs. CD4 does the same on class II.</text>
<text x="16" y="410" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">The TCR&#8217;s own tails are about five residues long and cannot signal: all 10 ITAMs live on the associated CD3 &#947;&#949;, &#948;&#949; and &#950;&#950; chains.</text>
</svg>
