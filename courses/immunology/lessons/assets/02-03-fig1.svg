<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-label="Left panel: a T-cell receptor facing a peptide-MHC class I molecule across the gap between two cells, with CDR3 loops drawn over the peptide and CDR1 and CDR2 loops over the MHC helices, the CD8 coreceptor gripping the non-polymorphic alpha-3 domain and carrying Lck on its cytoplasmic tail, and the CD3 and zeta chains carrying ITAMs below the T-cell membrane; an inset shows the top view with the receptor footprint lying diagonally across the groove. Right panel: signalling probability plotted against receptor dwell time for one proofreading step and for five, showing that five steps turn a fivefold difference in dwell time into a forty-fivefold difference in signal.">
