<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="Side-by-side comparison of MHC class I and class II. Class I is one alpha chain plus beta-2 microglobulin with a groove formed by alpha-1 and alpha-2, closed at both ends, holding a nine-residue peptide anchored at pockets P2 and P9. Class II is an alpha and a beta chain with a groove formed by alpha-1 and beta-1, open at both ends, holding a longer peptide that overhangs at both ends with a nine-residue core anchored at P1, P4, P6 and P9. Polymorphic peptide-contact residues are marked along both grooves.">
