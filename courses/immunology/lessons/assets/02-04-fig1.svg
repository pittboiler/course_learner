  <text x="200" y="45" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#55636f" text-anchor="middle">HLA-A, -B, -C &#183; one &#945; chain + &#946;&#8322;m</text>
  <text x="600" y="26" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">MHC class II</text>
  <text x="600" y="45" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#55636f" text-anchor="middle">HLA-DP, -DQ, -DR &#183; &#945; chain + &#946; chain</text>

