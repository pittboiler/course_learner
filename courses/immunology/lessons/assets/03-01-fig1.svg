<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="Three panels: the germline immunoglobulin heavy-chain locus as arrays of V, D and J gene segments with 12 and 23 recognition signal sequences; a rearranged VDJ gene with one junction magnified to show trimming, P nucleotides and templateless N nucleotides; and a horizontal bar chart ranking the base-10 logarithm of each diversity source.">
<rect width="760" height="560" fill="#ffffff"/>
<g font-family="Helvetica,Arial,sans-serif" fill="#111">

<text x="20" y="24" font-size="14" font-weight="bold">A. The germline locus stores parts, not products</text>

<rect x="20" y="46" width="30" height="22" fill="#e8f0f8" stroke="#1a6fb5" stroke-width="1.5"/>
<rect x="54" y="46" width="30" height="22" fill="#e8f0f8" stroke="#1a6fb5" stroke-width="1.5"/>
<rect x="88" y="46" width="30" height="22" fill="#e8f0f8" stroke="#1a6fb5" stroke-width="1.5"/>
<rect x="122" y="46" width="30" height="22" fill="#e8f0f8" stroke="#1a6fb5" stroke-width="1.5"/>
<rect x="156" y="46" width="30" height="22" fill="#e8f0f8" stroke="#1a6fb5" stroke-width="1.5"/>
<polygon points="190,46 204,46 197,59" fill="#333"/>
<text x="188" y="72" font-size="10.5">23</text>

<line x1="206" y1="57" x2="232" y2="57" stroke="#8fa8c0" stroke-width="1.5" stroke-dasharray="3,3"/>

<polygon points="234,46 248,46 241,59" fill="#333"/>
<text x="232" y="72" font-size="10.5">12</text>
<rect x="250" y="46" width="18" height="22" fill="#eef6f1" stroke="#2e8b57" stroke-width="1.5"/>
<rect x="272" y="46" width="18" height="22" fill="#eef6f1" stroke="#2e8b57" stroke-width="1.5"/>
<rect x="294" y="46" width="18" height="22" fill="#eef6f1" stroke="#2e8b57" stroke-width="1.5"/>
<rect x="316" y="46" width="18" height="22" fill="#eef6f1" stroke="#2e8b57" stroke-width="1.5"/>
<polygon points="336,46 350,46 343,59" fill="#333"/>
<text x="334" y="72" font-size="10.5">12</text>

<line x1="352" y1="57" x2="378" y2="57" stroke="#8fa8c0" stroke-width="1.5" stroke-dasharray="3,3"/>

<polygon points="380,46 394,46 387,59" fill="#333"/>
<text x="378" y="72" font-size="10.5">23</text>
<rect x="400" y="46" width="22" height="22" fill="#fdeef0" stroke="#d1495b" stroke-width="1.5"/>
<rect x="426" y="46" width="22" height="22" fill="#fdeef0" stroke="#d1495b" stroke-width="1.5"/>
<rect x="452" y="46" width="22" height="22" fill="#fdeef0" stroke="#d1495b" stroke-width="1.5"/>
<rect x="478" y="46" width="22" height="22" fill="#fdeef0" stroke="#d1495b" stroke-width="1.5"/>

<line x1="502" y1="57" x2="576" y2="57" stroke="#8fa8c0" stroke-width="1.5" stroke-dasharray="3,3"/>
<rect x="580" y="46" width="120" height="22" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.5"/>
<text x="600" y="61" font-size="11">C region</text>

<text x="20" y="88" font-size="11.5" font-weight="bold">V &#215; 40</text>
<text x="250" y="88" font-size="11.5" font-weight="bold">D &#215; 25</text>
<text x="400" y="88" font-size="11.5" font-weight="bold">J &#215; 6</text>
<text x="580" y="88" font-size="11.5">isotype, not specificity</text>
<text x="20" y="110" font-size="10.5" fill="#333">RAG joins a 12-spacer RSS to a 23-spacer RSS only, so V cannot join J directly &#8212; the D segment is obligatory.</text>

<text x="20" y="140" font-size="14" font-weight="bold">B. RAG cuts precisely; the repair is sloppy &#8212; the sloppiness is the point</text>

<rect x="60" y="156" width="110" height="20" fill="#e8f0f8" stroke="#1a6fb5" stroke-width="1.5"/>
<text x="103" y="170" font-size="11">V</text>
<rect x="176" y="156" width="40" height="20" fill="#eef6f1" stroke="#2e8b57" stroke-width="1.5"/>
<text x="192" y="170" font-size="11">D</text>
<rect x="222" y="156" width="80" height="20" fill="#fdeef0" stroke="#d1495b" stroke-width="1.5"/>
<text x="256" y="170" font-size="11">J</text>
<rect x="310" y="156" width="110" height="20" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.5"/>
<text x="348" y="170" font-size="11">C region</text>
<text x="436" y="170" font-size="11" fill="#333">rearranged VDJ: one cell, one specificity</text>

<line x1="173" y1="178" x2="120" y2="196" stroke="#8fa8c0" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="173" y1="178" x2="520" y2="196" stroke="#8fa8c0" stroke-width="1.2" stroke-dasharray="3,3"/>

<rect x="60" y="196" width="640" height="98" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.5"/>
<rect x="80" y="226" width="130" height="26" fill="#ffffff" stroke="#1a6fb5" stroke-width="1.5"/>
<text x="122" y="244" font-size="11">V end</text>
<rect x="210" y="226" width="26" height="26" fill="#dbe9f6" stroke="#1a6fb5" stroke-width="1.5"/>
<text x="219" y="244" font-size="11">P</text>
<rect x="236" y="226" width="160" height="26" fill="#fdeef0" stroke="#d1495b" stroke-width="2"/>
<text x="308" y="244" font-size="11" font-weight="bold">N</text>
<rect x="396" y="226" width="26" height="26" fill="#dbe9f6" stroke="#1a6fb5" stroke-width="1.5"/>
<text x="405" y="244" font-size="11">P</text>
<rect x="422" y="226" width="130" height="26" fill="#ffffff" stroke="#2e8b57" stroke-width="1.5"/>
<text x="464" y="244" font-size="11">D end</text>

<text x="80" y="220" font-size="10" fill="#d1495b">trim 0&#8211;5 nt</text>
<text x="422" y="220" font-size="10" fill="#d1495b">trim 0&#8211;5 nt</text>
<text x="80" y="270" font-size="10" fill="#333">germline-encoded</text>
<text x="196" y="270" font-size="10" fill="#333">hairpin palindromes</text>
<text x="330" y="270" font-size="10" fill="#333">0&#8211;15 templateless nt (TdT)</text>
<text x="80" y="286" font-size="10.5" font-weight="bold" fill="#111">this junction is CDR3 &#8212; the loop at the centre of the antigen contact</text>

<text x="566" y="216" font-size="10">&#215; 2 junctions</text>
<text x="566" y="230" font-size="10">per heavy chain</text>
<text x="566" y="252" font-size="10">light chain:</text>
<text x="566" y="266" font-size="10">1 junction,</text>
<text x="566" y="280" font-size="10">little N (TdT off)</text>

<text x="20" y="322" font-size="14" font-weight="bold">C. Ranking the sources of diversity</text>

<text x="244" y="362" font-size="11" text-anchor="end">heavy junctional (2 junctions)</text>
<rect x="250" y="348" width="360" height="20" fill="#d1495b"/>
<text x="618" y="363" font-size="12" font-weight="bold">8.0</text>

<text x="244" y="392" font-size="11" text-anchor="end">heavy V &#215; D &#215; J</text>
<rect x="250" y="378" width="171" height="20" fill="#1a6fb5"/>
<text x="429" y="393" font-size="12" font-weight="bold">3.8</text>

<text x="244" y="422" font-size="11" text-anchor="end">light V &#215; J (both loci)</text>
<rect x="250" y="408" width="113" height="20" fill="#1a6fb5"/>
<text x="371" y="423" font-size="12" font-weight="bold">2.5</text>

<text x="244" y="452" font-size="11" text-anchor="end">light junctional (1 junction)</text>
<rect x="250" y="438" width="77" height="20" fill="#d1495b"/>
<text x="335" y="453" font-size="12" font-weight="bold">1.7</text>

<line x1="250" y1="468" x2="700" y2="468" stroke="#333" stroke-width="1.5"/>
<line x1="250" y1="468" x2="250" y2="474" stroke="#333" stroke-width="1.5"/>
<line x1="340" y1="468" x2="340" y2="474" stroke="#333" stroke-width="1.5"/>
<line x1="430" y1="468" x2="430" y2="474" stroke="#333" stroke-width="1.5"/>
<line x1="520" y1="468" x2="520" y2="474" stroke="#333" stroke-width="1.5"/>
<line x1="610" y1="468" x2="610" y2="474" stroke="#333" stroke-width="1.5"/>
<line x1="700" y1="468" x2="700" y2="474" stroke="#333" stroke-width="1.5"/>
<text x="250" y="487" font-size="10.5" text-anchor="middle">0</text>
<text x="340" y="487" font-size="10.5" text-anchor="middle">2</text>
<text x="430" y="487" font-size="10.5" text-anchor="middle">4</text>
<text x="520" y="487" font-size="10.5" text-anchor="middle">6</text>
<text x="610" y="487" font-size="10.5" text-anchor="middle">8</text>
<text x="700" y="487" font-size="10.5" text-anchor="middle">10</text>
<text x="475" y="504" font-size="11" text-anchor="middle">orders of magnitude contributed (base-10 log)</text>

<text x="20" y="528" font-size="11">Total &#8776; 3.8 + 8.0 + 2.5 + 1.7 = 16 orders of magnitude, from about 150 gene segments.</text>
<text x="20" y="546" font-size="11" font-weight="bold" fill="#d1495b">Junctional diversity beats all segment combinatorics by more than three orders of magnitude.</text>

</g>
</svg>
