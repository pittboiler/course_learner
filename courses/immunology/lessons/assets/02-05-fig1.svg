<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" role="img" aria-label="One cell in cross-section showing the class I cytosolic pathway on the left, the class II endocytic pathway on the right, and a dashed cross-presentation shortcut running from the endosomal compartment back into the cytosolic pool.">
  <rect width="820" height="540" fill="#ffffff"/>
  <defs>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d1495b"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6fb5"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8b57"/></marker>
    <marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/></marker>
  </defs>
  <g font-family="Helvetica,Arial,sans-serif" fill="#111111">

    <rect x="20" y="110" width="780" height="400" rx="20" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="2"/>
    <line x1="42" y1="110" x2="778" y2="110" stroke="#333333" stroke-width="3.5"/>
    <text x="410" y="104" text-anchor="middle" font-size="9.5" fill="#555555">plasma membrane</text>

    <rect x="70" y="14" width="210" height="60" rx="8" fill="#ffffff" stroke="#d1495b" stroke-width="2"/>
    <text x="175" y="38" text-anchor="middle" font-size="13" font-weight="bold" fill="#d1495b">CD8 T cell</text>
    <text x="175" y="57" text-anchor="middle" font-size="10.5">kills the cell it is reading</text>
    <line x1="175" y1="74" x2="175" y2="90" stroke="#d1495b" stroke-width="2"/>
    <circle cx="175" cy="87" r="3.5" fill="#d1495b"/>
    <rect x="157" y="92" width="36" height="9" fill="#ffffff" stroke="#d1495b" stroke-width="1.6"/>
    <line x1="175" y1="101" x2="175" y2="110" stroke="#d1495b" stroke-width="1.6"/>
    <text x="200" y="104" font-size="9.5" fill="#333333">peptide&#8211;MHC I</text>
    <text x="292" y="42" font-size="9.5" fill="#555555">3&#8211;10 peptide&#8211;MHC I</text>
    <text x="292" y="56" font-size="9.5" fill="#555555">complexes are enough</text>

    <rect x="470" y="14" width="215" height="60" rx="8" fill="#ffffff" stroke="#1a6fb5" stroke-width="2"/>
    <text x="577" y="38" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a6fb5">CD4 T cell</text>
    <text x="577" y="57" text-anchor="middle" font-size="10.5">decides what response happens</text>
    <line x1="575" y1="74" x2="575" y2="90" stroke="#1a6fb5" stroke-width="2"/>
    <circle cx="575" cy="87" r="3.5" fill="#1a6fb5"/>
    <rect x="557" y="92" width="36" height="9" fill="#ffffff" stroke="#1a6fb5" stroke-width="1.6"/>
    <line x1="575" y1="101" x2="575" y2="110" stroke="#1a6fb5" stroke-width="1.6"/>
    <text x="600" y="104" font-size="9.5" fill="#333333">peptide&#8211;MHC II</text>

    <rect x="705" y="14" width="95" height="52" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
    <text x="752" y="34" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e8b57">Exogenous</text>
    <text x="752" y="50" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e8b57">protein</text>
    <line x1="752" y1="68" x2="752" y2="318" stroke="#2e8b57" stroke-width="2" marker-end="url(#aG)"/>
    <text x="744" y="150" text-anchor="end" font-size="9.5" fill="#2e8b57">endocytosis /</text>
    <text x="744" y="164" text-anchor="end" font-size="9.5" fill="#2e8b57">phagocytosis</text>

    <text x="45" y="132" font-size="10.5" font-weight="bold" fill="#d1495b">cytosolic route</text>
    <text x="600" y="132" font-size="10.5" font-weight="bold" fill="#1a6fb5">endocytic route</text>

    <rect x="45" y="428" width="255" height="52" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
    <text x="172" y="450" text-anchor="middle" font-size="11" font-weight="bold">Cytosolic protein pool</text>
    <text x="172" y="467" text-anchor="middle" font-size="10">self &#183; viral &#183; DRiPs (10&#8211;30 percent of new)</text>
    <line x1="172" y1="428" x2="172" y2="406" stroke="#333333" stroke-width="2" marker-end="url(#aD)"/>

    <rect x="45" y="352" width="255" height="50" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
    <text x="172" y="373" text-anchor="middle" font-size="11" font-weight="bold">Proteasome / immunoproteasome</text>
    <text x="172" y="390" text-anchor="middle" font-size="10">cuts to 8&#8211;10-mers; IFN-&#947; shifts cleavage</text>
    <line x1="172" y1="352" x2="172" y2="316" stroke="#333333" stroke-width="2" marker-end="url(#aD)"/>
    <text x="182" y="338" font-size="9.5" fill="#555555">ERAP1 trims the N-terminus</text>

    <rect x="45" y="200" width="505" height="100" rx="8" fill="#e8eef5" stroke="#8fa8c0" stroke-width="1.8"/>
    <text x="55" y="216" font-size="10" font-style="italic" fill="#555555">ER lumen</text>
    <line x1="300" y1="204" x2="300" y2="296" stroke="#8fa8c0" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="172" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#d1495b">Peptide-loading complex</text>
    <text x="172" y="259" text-anchor="middle" font-size="10">tapasin &#183; calreticulin &#183; ERp57</text>
    <text x="172" y="276" text-anchor="middle" font-size="10">MHC I + &#946;2-microglobulin</text>
    <text x="425" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a6fb5">MHC II + invariant chain</text>
    <text x="425" y="259" text-anchor="middle" font-size="10">Ii blocks the groove, so no</text>
    <text x="425" y="276" text-anchor="middle" font-size="10">cytosolic peptide can bind</text>
    <rect x="140" y="290" width="64" height="22" rx="4" fill="#ffffff" stroke="#d1495b" stroke-width="1.8"/>
    <text x="172" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#d1495b">TAP</text>

    <line x1="172" y1="200" x2="172" y2="116" stroke="#d1495b" stroke-width="2" marker-end="url(#aR)"/>
    <text x="182" y="160" font-size="9.5" fill="#333333">class I to surface</text>
    <text x="182" y="176" font-size="9.5" fill="#555555">&#8776;10&#8309; per cell, &#8776;10&#8308; peptides</text>

    <rect x="600" y="326" width="190" height="46" rx="6" fill="#ffffff" stroke="#1a6fb5" stroke-width="1.6"/>
    <text x="695" y="346" text-anchor="middle" font-size="11" font-weight="bold">Early endosome</text>
    <text x="695" y="363" text-anchor="middle" font-size="10">pH &#8776; 6 &#183; antigen unfolds</text>
    <line x1="695" y1="372" x2="695" y2="392" stroke="#1a6fb5" stroke-width="2" marker-end="url(#aB)"/>

    <rect x="600" y="396" width="190" height="70" rx="6" fill="#ffffff" stroke="#1a6fb5" stroke-width="1.6"/>
    <text x="695" y="416" text-anchor="middle" font-size="11" font-weight="bold">MIIC &#183; pH &#8776; 5</text>
    <text x="695" y="433" text-anchor="middle" font-size="10">cathepsins chew Ii &#8594; CLIP</text>
    <text x="695" y="450" text-anchor="middle" font-size="10">HLA-DM swaps CLIP out</text>

    <path d="M 500 300 L 500 478 L 690 478 L 690 470" fill="none" stroke="#1a6fb5" stroke-width="2" marker-end="url(#aB)"/>
    <text x="508" y="318" font-size="9.5" fill="#1a6fb5">Ii routes class II</text>
    <text x="508" y="332" font-size="9.5" fill="#1a6fb5">to the endosome</text>

    <path d="M 600 410 L 575 410 L 575 116" fill="none" stroke="#1a6fb5" stroke-width="2" marker-end="url(#aB)"/>
    <text x="567" y="160" text-anchor="end" font-size="9.5" fill="#333333">class II to surface</text>

    <path d="M 600 452 L 590 452 L 590 500 L 175 500 L 175 486" fill="none" stroke="#2e8b57" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aG)"/>
    <text x="390" y="494" text-anchor="middle" font-size="10" fill="#2e8b57">cross-presentation (dendritic cells only)</text>

  </g>
</svg>
