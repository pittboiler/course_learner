<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" width="820" height="450" role="img" aria-label="A cytotoxic T cell forming an immunological synapse with an infected target cell, with the adhesion ring, central TCR cluster and secretory domain marked, granules travelling along microtubules to a reoriented centrosome, an untouched bystander cell alongside, and a table showing that lowering MHC-I hides the cell from the CTL but exposes it to NK cells.">
  <rect width="820" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#d1495b"/>
    </marker>
    <marker id="ahg" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <text x="16" y="22" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">A. The immunological synapse in cross-section</text>
  <text x="558" y="22" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">B. The MHC-I pincer</text>

  <!-- cytotoxic T cell, flat face at x=225 -->
  <path d="M225,90 C150,66 46,80 30,170 C14,268 128,332 225,300 Z" fill="#eaf2fa" stroke="#1a6fb5" stroke-width="2"/>
  <!-- infected target cell, flat face at x=275 -->
  <path d="M275,72 C345,52 434,68 450,148 C466,228 364,286 275,258 Z" fill="#fdeef0" stroke="#d1495b" stroke-width="2"/>
  <!-- bystander cell -->
  <path d="M275,272 C344,256 438,268 452,326 C464,384 358,410 275,392 Z" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="2"/>

  <!-- synapse bands across the cleft -->
  <rect x="225" y="112" width="50" height="24" fill="#e3f2e9" stroke="#2e8b57" stroke-width="1.6"/>
  <rect x="225" y="144" width="50" height="20" fill="#fbe2e6" stroke="#d1495b" stroke-width="1.6"/>
  <rect x="225" y="172" width="50" height="44" fill="#dceaf6" stroke="#1a6fb5" stroke-width="1.6"/>
  <rect x="225" y="224" width="50" height="24" fill="#e3f2e9" stroke="#2e8b57" stroke-width="1.6"/>
  <circle cx="238" cy="154" r="2.6" fill="#d1495b"/>
  <circle cx="250" cy="154" r="2.6" fill="#d1495b"/>
  <circle cx="262" cy="154" r="2.6" fill="#d1495b"/>

  <!-- centrosome and microtubules -->
  <rect x="197" y="162" width="5" height="15" fill="#333"/>
  <rect x="205" y="166" width="5" height="15" fill="#333"/>
  <path d="M199,170 C152,214 104,234 56,220" fill="none" stroke="#8fa8c0" stroke-width="1.4"/>
  <path d="M199,176 C164,240 116,272 70,262" fill="none" stroke="#8fa8c0" stroke-width="1.4"/>
  <path d="M199,166 C150,188 96,194 48,180" fill="none" stroke="#8fa8c0" stroke-width="1.4"/>
  <circle cx="146" cy="222" r="7" fill="#d1495b" opacity="0.85"/>
  <circle cx="112" cy="256" r="6.5" fill="#d1495b" opacity="0.85"/>
  <circle cx="96" cy="188" r="6" fill="#d1495b" opacity="0.85"/>
  <path d="M170,214 L196,182" fill="none" stroke="#d1495b" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M212,158 L233,152" fill="none" stroke="#d1495b" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- fragmented nucleus in target -->
  <circle cx="356" cy="176" r="9" fill="#f7c9d0" stroke="#d1495b" stroke-width="1.2"/>
  <circle cx="378" cy="188" r="6" fill="#f7c9d0" stroke="#d1495b" stroke-width="1.2"/>
  <circle cx="364" cy="200" r="5" fill="#f7c9d0" stroke="#d1495b" stroke-width="1.2"/>

  <!-- labels -->
  <text x="100" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#1a6fb5">CD8 CTL</text>
  <text x="100" y="134" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">granules on microtubules</text>
  <text x="222" y="196" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">centrosome</text>
  <text x="362" y="112" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#d1495b">infected target</text>
  <text x="362" y="130" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">viral peptide on MHC-I</text>
  <text x="366" y="228" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">apoptosis, not lysis</text>
  <text x="364" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#333">bystander cell</text>
  <text x="364" y="356" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">in contact, untouched</text>
  <text x="250" y="104" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">cleft</text>
  <text x="250" y="264" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">seal</text>

  <!-- legend -->
  <rect x="14" y="410" width="12" height="12" fill="#e3f2e9" stroke="#2e8b57" stroke-width="1.4"/>
  <text x="32" y="420" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111">pSMAC: LFA-1/ICAM-1 adhesion seal</text>
  <rect x="236" y="410" width="12" height="12" fill="#dceaf6" stroke="#1a6fb5" stroke-width="1.4"/>
  <text x="254" y="420" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111">cSMAC: TCR + peptide-MHC I</text>
  <rect x="419" y="410" width="12" height="12" fill="#fbe2e6" stroke="#d1495b" stroke-width="1.4"/>
  <text x="437" y="420" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111">secretory domain: perforin + granzyme</text>

  <!-- panel B table -->
  <rect x="558" y="46" width="248" height="30" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.2"/>
  <rect x="558" y="76" width="248" height="42" fill="#ffffff" stroke="#8fa8c0" stroke-width="1.2"/>
  <rect x="558" y="118" width="248" height="42" fill="#ffffff" stroke="#8fa8c0" stroke-width="1.2"/>
  <line x1="654" y1="46" x2="654" y2="160" stroke="#8fa8c0" stroke-width="1.2"/>
  <line x1="730" y1="46" x2="730" y2="160" stroke="#8fa8c0" stroke-width="1.2"/>
  <text x="606" y="66" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111">MHC-I level</text>
  <text x="692" y="66" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a6fb5">CD8 CTL</text>
  <text x="768" y="66" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#2e8b57">NK cell</text>
  <text x="606" y="102" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">normal</text>
  <text x="692" y="94" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">kills if viral</text>
  <text x="692" y="108" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">peptide shown</text>
  <text x="768" y="102" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">held off</text>
  <text x="606" y="144" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">shut down</text>
  <text x="692" y="144" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">blind</text>
  <text x="768" y="137" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">missing self</text>
  <text x="768" y="151" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">&#8594; kills</text>

  <text x="558" y="182" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111">Any MHC-I level that hides the cell from</text>
  <text x="558" y="197" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111">the CTL exposes it to the NK cell. Escape</text>
  <text x="558" y="212" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111">needs selective loss &#8212; HIV Nef strips</text>
  <text x="558" y="227" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111">HLA-A and -B, sparing HLA-C and -E.</text>

  <!-- panel B, serial killing -->
  <text x="558" y="270" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Serial killing</text>
  <circle cx="592" cy="316" r="18" fill="#eaf2fa" stroke="#1a6fb5" stroke-width="2"/>
  <text x="592" y="320" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#1a6fb5">CTL</text>
  <circle cx="672" cy="290" r="12" fill="#fdeef0" stroke="#d1495b" stroke-width="1.4" stroke-dasharray="3,2"/>
  <circle cx="712" cy="290" r="12" fill="#fdeef0" stroke="#d1495b" stroke-width="1.4" stroke-dasharray="3,2"/>
  <circle cx="672" cy="342" r="12" fill="#fdeef0" stroke="#d1495b" stroke-width="1.4" stroke-dasharray="3,2"/>
  <circle cx="712" cy="342" r="12" fill="#fdeef0" stroke="#d1495b" stroke-width="1.4" stroke-dasharray="3,2"/>
  <path d="M613,306 L654,292" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#ahg)"/>
  <path d="M613,312 L692,278" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#ahg)"/>
  <path d="M613,326 L654,340" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#ahg)"/>
  <path d="M613,320 L692,354" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#ahg)"/>
  <text x="682" y="380" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">&#8776;1 target per hour in a dish,</text>
  <text x="682" y="394" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">a few per day in tissue</text>
</svg>
