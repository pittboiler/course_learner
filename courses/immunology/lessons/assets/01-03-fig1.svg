<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="A cell showing pattern-recognition receptors at three locations, surface, endosome and cytosol, converging on one signalling cascade, with an inset showing the inflammasome two-signal interlock">
  <rect width="800" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#333"/>
    </marker>
    <marker id="ahb" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#1a6fb5"/>
    </marker>
  </defs>

  <text x="14" y="22" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">Pattern receptors: where a sensor sits is half of what it means</text>

  <text x="16" y="46" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#1a6fb5">OUTSIDE the cell</text>

  <rect x="16" y="74" width="498" height="414" rx="18" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="2"/>

  <text x="62" y="62" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333" text-anchor="middle">LPS</text>
  <text x="150" y="62" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333" text-anchor="middle">flagellin</text>
  <text x="245" y="62" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333" text-anchor="middle">lipopeptides</text>
  <text x="350" y="62" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333" text-anchor="middle">fungal glucan</text>

  <rect x="55" y="64" width="14" height="22" rx="3" fill="#1a6fb5"/>
  <rect x="143" y="64" width="14" height="22" rx="3" fill="#1a6fb5"/>
  <rect x="238" y="64" width="14" height="22" rx="3" fill="#1a6fb5"/>
  <rect x="343" y="64" width="14" height="22" rx="3" fill="#1a6fb5"/>

  <text x="62" y="102" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111" text-anchor="middle">TLR4</text>
  <text x="150" y="102" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111" text-anchor="middle">TLR5</text>
  <text x="245" y="102" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111" text-anchor="middle">TLR2 dimers</text>
  <text x="350" y="102" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111" text-anchor="middle">Dectin-1</text>

  <text x="26" y="122" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555">surface &#8594; senses microbes still outside the cell</text>

  <circle cx="90" cy="196" r="46" fill="#ffffff" stroke="#333" stroke-width="1.6"/>
  <circle cx="58" cy="168" r="5.5" fill="#1a6fb5"/>
  <circle cx="90" cy="150" r="5.5" fill="#1a6fb5"/>
  <circle cx="122" cy="168" r="5.5" fill="#1a6fb5"/>
  <text x="90" y="201" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333" text-anchor="middle">endosome</text>

  <text x="152" y="164" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111">Endosomal TLRs</text>
  <text x="152" y="180" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">TLR3 &#8212; double-stranded RNA</text>
  <text x="152" y="195" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">TLR7/8 &#8212; single-stranded RNA</text>
  <text x="152" y="210" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">TLR9 &#8212; unmethylated CpG DNA</text>
  <text x="152" y="228" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555">in a vesicle &#8594; only what the cell swallowed;</text>
  <text x="152" y="241" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555">plasma self-DNA never reaches it</text>

  <circle cx="70" cy="266" r="5.5" fill="#2e8b57"/>
  <circle cx="215" cy="266" r="5.5" fill="#2e8b57"/>
  <circle cx="360" cy="266" r="5.5" fill="#2e8b57"/>
  <text x="70" y="286" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111" text-anchor="middle">RIG-I / MDA5</text>
  <text x="215" y="286" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111" text-anchor="middle">cGAS, AIM2</text>
  <text x="360" y="286" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111" text-anchor="middle">NOD1 / NOD2</text>
  <text x="70" y="301" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333" text-anchor="middle">viral RNA</text>
  <text x="215" y="301" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333" text-anchor="middle">cytosolic DNA</text>
  <text x="360" y="301" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333" text-anchor="middle">peptidoglycan</text>
  <text x="26" y="323" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555">cytosol &#8594; it already got in; the compartment itself is the alarm</text>

  <line x1="400" y1="110" x2="458" y2="316" stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>
  <line x1="392" y1="200" x2="458" y2="318" stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>
  <line x1="400" y1="292" x2="456" y2="320" stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>
  <path d="M466 330 L466 361 L412 361" fill="none" stroke="#1a6fb5" stroke-width="2.4" marker-end="url(#ahb)"/>

  <rect x="120" y="340" width="280" height="42" rx="6" fill="#ffffff" stroke="#1a6fb5" stroke-width="2"/>
  <text x="260" y="358" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111" text-anchor="middle">MyD88 / TRIF &#8594; NF-&#954;B, IRF3/7</text>
  <text x="260" y="374" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555" text-anchor="middle">a few dozen inputs, one shared cascade</text>

  <path d="M260 384 L260 402 L214 422" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>

  <ellipse cx="132" cy="430" rx="62" ry="32" fill="#ffffff" stroke="#333" stroke-width="1.6"/>
  <text x="132" y="434" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333" text-anchor="middle">nucleus</text>

  <text x="240" y="412" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111">Output</text>
  <text x="240" y="428" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">TNF, IL-6, pro-IL-1&#946;, chemokines</text>
  <text x="240" y="443" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">type I interferon (IRF3/7)</text>
  <text x="240" y="458" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#d1495b">B7 and CCR7 up: licenses the adaptive arm</text>

  <rect x="530" y="74" width="258" height="414" rx="10" fill="#ffffff" stroke="#8fa8c0" stroke-width="1.5"/>
  <text x="542" y="98" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b">Inset: the two-signal interlock</text>
  <text x="542" y="114" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555">IL-1&#946; is too dangerous for one input</text>

  <rect x="546" y="126" width="226" height="64" rx="5" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.2"/>
  <text x="558" y="146" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111">Signal 1 &#8212; priming</text>
  <text x="558" y="162" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">any PRR &#8594; NF-&#954;B</text>
  <text x="558" y="177" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">makes pro-IL-1&#946; and NLRP3</text>

  <line x1="659" y1="192" x2="659" y2="206" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="546" y="210" width="226" height="64" rx="5" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.2"/>
  <text x="558" y="230" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111">Signal 2 &#8212; activation</text>
  <text x="558" y="246" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">K efflux, crystals, pore toxins,</text>
  <text x="558" y="261" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">lysosome rupture &#8594; NLRP3 assembles</text>

  <line x1="659" y1="276" x2="659" y2="290" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="596" y="294" width="126" height="30" rx="15" fill="#ffffff" stroke="#d1495b" stroke-width="2"/>
  <text x="659" y="314" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#d1495b" text-anchor="middle">AND</text>

  <line x1="659" y1="326" x2="659" y2="340" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="546" y="344" width="226" height="58" rx="5" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.2"/>
  <text x="558" y="364" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111">caspase-1 fires</text>
  <text x="558" y="380" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">mature IL-1&#946; released; gasdermin D</text>
  <text x="558" y="395" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">pores &#8594; pyroptosis</text>

  <text x="546" y="426" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555">Two independent conditions:</text>
  <text x="546" y="440" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555">if each misfires at 1 in 100,</text>
  <text x="546" y="454" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555">the pair misfires at 1 in 10,000.</text>
</svg>
