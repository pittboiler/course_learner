<svg viewBox="0 0 520 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#e0645c"/>
    </marker>
  </defs>

  <!-- caption -->
  <text x="24" y="26" fill="#8a8a8a" font-style="italic">Passive sign convention: current into the + terminal &#8594; p = vi is the power the element absorbs.</text>

  <!-- element box -->
  <rect x="200" y="110" width="80" height="90" fill="#8a8a8a" opacity="0.12" stroke="#8a8a8a" stroke-width="2"/>
  <text x="216" y="162" fill="#8a8a8a">element</text>

  <!-- wires -->
  <line x1="240" y1="60" x2="240" y2="110" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="240" y1="200" x2="240" y2="252" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="240" cy="110" r="3.5" fill="#8a8a8a"/>
  <circle cx="240" cy="200" r="3.5" fill="#8a8a8a"/>

  <!-- current arrow into the + terminal (coral) -->
  <line x1="205" y1="62" x2="205" y2="103" stroke="#e0645c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="183" y="88" fill="#e0645c" font-style="italic">i</text>

  <!-- voltage polarity (coral) -->
  <text x="250" y="106" fill="#e0645c" font-size="19">+</text>
  <text x="250" y="222" fill="#e0645c" font-size="19">&#8722;</text>

  <!-- voltage bracket (coral) -->
  <line x1="312" y1="116" x2="312" y2="194" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="308" y1="116" x2="316" y2="116" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="308" y1="194" x2="316" y2="194" stroke="#e0645c" stroke-width="1.5"/>
  <text x="320" y="160" fill="#e0645c" font-style="italic">v</text>

  <!-- reading -->
  <text x="372" y="148" fill="#8a8a8a">i enters +</text>
  <text x="372" y="170" fill="#8a8a8a">so p = vi &#8805; 0</text>
  <text x="372" y="192" fill="#8a8a8a">(absorbing)</text>
</svg>
