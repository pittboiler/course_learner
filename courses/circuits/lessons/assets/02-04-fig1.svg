<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0,0 9,3 0,6" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- caption -->
  <text x="24" y="22" fill="#8a8a8a" font-style="italic">Any linear two-terminal network collapses to one source behind one resistor &#8212; delivering its most power when R&#8202;L = R&#8202;th.</text>

  <!-- ===== left: the black-box network ===== -->
  <rect x="30" y="78" width="150" height="112" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="105" y="126" fill="#8a8a8a" text-anchor="middle">linear</text>
  <text x="105" y="144" fill="#8a8a8a" text-anchor="middle">two-terminal</text>
  <text x="105" y="162" fill="#8a8a8a" text-anchor="middle">network</text>

  <!-- terminals a, b out of the box -->
  <line x1="180" y1="106" x2="214" y2="106" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="180" y1="164" x2="214" y2="164" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="214" cy="106" r="3.5" fill="#8a8a8a"/>
  <circle cx="214" cy="164" r="3.5" fill="#8a8a8a"/>
  <text x="222" y="103" fill="#8a8a8a">a</text>
  <text x="222" y="178" fill="#8a8a8a">b</text>

  <!-- equivalence arrow -->
  <text x="272" y="128" fill="#8a8a8a" font-style="italic" text-anchor="middle">same</text>
  <text x="272" y="144" fill="#8a8a8a" font-style="italic" text-anchor="middle">I&#8211;V</text>
  <line x1="244" y1="158" x2="300" y2="158" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== right: Thevenin equivalent + load ===== -->
  <!-- dashed boundary of the equivalent one-port -->
  <rect x="320" y="80" width="150" height="130" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="328" y="72" fill="#8a8a8a" font-style="italic">Th&#233;venin equivalent</text>

  <!-- voltage source Vth -->
  <circle cx="342" cy="150" r="20" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="337" y="146" fill="#4a90d9">+</text>
  <text x="337" y="170" fill="#4a90d9">&#8722;</text>
  <text x="300" y="155" fill="#4a90d9" text-anchor="middle">V&#8202;th</text>
  <line x1="342" y1="130" x2="342" y2="110" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="342" y1="170" x2="342" y2="196" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- series resistor Rth -->
  <line x1="342" y1="110" x2="378" y2="110" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="378" y="97" width="60" height="26" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="408" y="90" fill="#4a90d9" text-anchor="middle">R&#8202;th</text>
  <line x1="438" y1="110" x2="468" y2="110" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- terminals a, b of the equivalent -->
  <circle cx="468" cy="110" r="3.5" fill="#8a8a8a"/>
  <circle cx="468" cy="196" r="3.5" fill="#8a8a8a"/>
  <line x1="342" y1="196" x2="468" y2="196" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="474" y="106" fill="#8a8a8a">a</text>
  <text x="474" y="210" fill="#8a8a8a">b</text>

  <!-- external load RL (coral) -->
  <line x1="468" y1="110" x2="506" y2="110" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="468" y1="196" x2="506" y2="196" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="493" y="130" width="26" height="46" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="528" y="157" fill="#e0645c">R&#8202;L</text>
  <line x1="506" y1="110" x2="506" y2="130" stroke="#e0645c" stroke-width="2"/>
  <line x1="506" y1="176" x2="506" y2="196" stroke="#e0645c" stroke-width="2"/>

  <!-- max-power note -->
  <text x="400" y="252" fill="#e0645c" text-anchor="middle">R&#8202;L = R&#8202;th   &#8594;   P&#8202;max = V&#8202;th&#178; / (4 R&#8202;th)</text>
</svg>
