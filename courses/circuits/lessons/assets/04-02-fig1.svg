<svg viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="24" y="24" fill="#8a8a8a" font-style="italic">Impedance Z = R + jX makes Ohm's law complex; its triangle reads off |Z| and the phase angle.</text>

  <!-- ===== left: series R-L-C loop in the phasor domain ===== -->

  <!-- loop wires (grey) -->
  <line x1="70" y1="90" x2="70" y2="143" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="70" y1="187" x2="70" y2="240" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="70" y1="90" x2="300" y2="90" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="70" y1="240" x2="300" y2="240" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="300" y1="90" x2="300" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="300" y1="162" x2="300" y2="240" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- source: AC circle with sine (blue) -->
  <circle cx="70" cy="165" r="22" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <path d="M 58 165 q 6 -12 12 0 q 6 12 12 0" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="20" y="170" fill="#4a90d9">V</text>
  <text x="31" y="175" fill="#4a90d9" font-size="10">s</text>

  <!-- resistor box R (grey) -->
  <rect x="118" y="78" width="48" height="24" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="137" y="95" fill="#8a8a8a">R</text>

  <!-- inductor coils j&#969;L (grey) -->
  <path d="M 206 90 q 7 -15 14 0 q 7 -15 14 0 q 7 -15 14 0 q 7 -15 14 0" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="220" y="70" fill="#8a8a8a">j&#969;L</text>

  <!-- capacitor plates 1/j&#969;C (grey) -->
  <line x1="283" y1="150" x2="317" y2="150" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="283" y1="162" x2="317" y2="162" stroke="#8a8a8a" stroke-width="2"/>
  <text x="324" y="161" fill="#8a8a8a">1/j&#969;C</text>

  <!-- current arrow I (coral) on top wire, clockwise -->
  <line x1="80" y1="90" x2="108" y2="90" stroke="#e0645c" stroke-width="2"/>
  <polygon points="108,90 99,86 99,94" fill="#e0645c"/>
  <text x="86" y="82" fill="#e0645c">I</text>

  <!-- ===== right: impedance triangle ===== -->

  <!-- R (horizontal, grey) -->
  <line x1="400" y1="250" x2="520" y2="250" stroke="#8a8a8a" stroke-width="2"/>
  <text x="452" y="270" fill="#8a8a8a">R</text>

  <!-- X = &#969;L (vertical, blue) -->
  <line x1="520" y1="250" x2="520" y2="90" stroke="#4a90d9" stroke-width="2"/>
  <text x="528" y="172" fill="#4a90d9">X = &#969;L</text>

  <!-- |Z| (hypotenuse, coral) -->
  <line x1="400" y1="250" x2="520" y2="90" stroke="#e0645c" stroke-width="2.5"/>
  <text x="432" y="150" fill="#e0645c">|Z|</text>

  <!-- angle theta arc (coral) -->
  <path d="M 442 250 A 42 42 0 0 0 425 219" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="448" y="240" fill="#e0645c">&#952;</text>
</svg>
