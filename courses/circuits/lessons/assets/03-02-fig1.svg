<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Flip the switch and the circuit relaxes on an exponential &#8212; 63% of the way there in one time constant &#964;.</text>

  <!-- ===== left: the charging exponential ===== -->

  <!-- axes -->
  <line x1="60" y1="240" x2="368" y2="240" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="368,240 358,235 358,245" fill="#8a8a8a"/>
  <text x="360" y="258" fill="#8a8a8a">t</text>
  <line x1="60" y1="250" x2="60" y2="72" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="60,72 55,82 65,82" fill="#8a8a8a"/>
  <text x="30" y="80" fill="#8a8a8a">x(t)</text>
  <text x="48" y="245" fill="#8a8a8a">0</text>

  <!-- final-value asymptote -->
  <line x1="60" y1="90" x2="360" y2="90" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="300" y="84" fill="#e0645c">x(&#8734;)</text>

  <!-- the exponential curve -->
  <path d="M 60 240 L 75 206.8 L 90 181.0 L 105 160.9 L 120 145.2 L 135 133.0 L 150 123.5 L 165 116.1 L 180 110.3 L 210 102.3 L 240 97.5 L 270 94.5 L 300 92.7 L 330 91.7 L 350 91.2"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- one-tau point: 63% marker -->
  <line x1="120" y1="240" x2="120" y2="145.2" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="60" y1="145.2" x2="120" y2="145.2" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="3 4"/>
  <circle cx="120" cy="145.2" r="4" fill="#e0645c"/>
  <text x="124" y="160" fill="#e0645c">63%</text>
  <text x="112" y="258" fill="#e0645c">&#964;</text>

  <!-- ===== right: RC circuit with a switch ===== -->

  <!-- source (grey), left vertical branch -->
  <circle cx="450" cy="175" r="16" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="445" y="163" fill="#8a8a8a">+</text>
  <text x="445" y="195" fill="#8a8a8a">&#8722;</text>
  <text x="410" y="180" fill="#8a8a8a">V</text>
  <text x="420" y="184" fill="#8a8a8a" font-size="10">s</text>
  <line x1="450" y1="159" x2="450" y2="120" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="450" y1="191" x2="450" y2="230" stroke="#8a8a8a" stroke-width="1.8"/>

  <!-- top wire + switch -->
  <line x1="450" y1="120" x2="482" y2="120" stroke="#8a8a8a" stroke-width="1.8"/>
  <circle cx="482" cy="120" r="2.5" fill="#8a8a8a"/>
  <line x1="482" y1="120" x2="506" y2="106" stroke="#e0645c" stroke-width="1.8"/>
  <circle cx="510" cy="120" r="2.5" fill="#8a8a8a"/>
  <text x="486" y="98" fill="#e0645c">t = 0</text>
  <line x1="510" y1="120" x2="522" y2="120" stroke="#8a8a8a" stroke-width="1.8"/>

  <!-- resistor box -->
  <rect x="522" y="110" width="52" height="20" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="544" y="104" fill="#8a8a8a">R</text>
  <line x1="574" y1="120" x2="612" y2="120" stroke="#8a8a8a" stroke-width="1.8"/>

  <!-- charging current arrow (coral) -->
  <polygon points="600,120 590,115 590,125" fill="#e0645c"/>
  <text x="588" y="112" fill="#e0645c">i</text>

  <!-- right side down to capacitor -->
  <line x1="612" y1="120" x2="612" y2="152" stroke="#8a8a8a" stroke-width="1.8"/>
  <!-- capacitor plates (blue = element under study) -->
  <line x1="598" y1="152" x2="626" y2="152" stroke="#4a90d9" stroke-width="3"/>
  <line x1="598" y1="162" x2="626" y2="162" stroke="#4a90d9" stroke-width="3"/>
  <text x="630" y="160" fill="#4a90d9">C</text>
  <text x="580" y="150" fill="#e0645c">+</text>
  <text x="580" y="172" fill="#e0645c">&#8722;</text>
  <text x="556" y="162" fill="#e0645c">v</text>
  <text x="565" y="166" fill="#e0645c" font-size="10">C</text>
  <line x1="612" y1="162" x2="612" y2="230" stroke="#8a8a8a" stroke-width="1.8"/>

  <!-- bottom rail -->
  <line x1="450" y1="230" x2="612" y2="230" stroke="#8a8a8a" stroke-width="1.8"/>

  <!-- ground -->
  <line x1="531" y1="230" x2="531" y2="244" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="521" y1="244" x2="541" y2="244" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="524" y1="249" x2="538" y2="249" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="527" y1="254" x2="535" y2="254" stroke="#8a8a8a" stroke-width="1.2"/>
</svg>
