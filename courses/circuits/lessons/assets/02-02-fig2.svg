<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <!-- caption -->
  <text x="30" y="26" fill="#8a8a8a" font-style="italic">A current source on the shared branch: enclose both windows as one supermesh (dashed).</text>

  <!-- ===== supermesh boundary (dashed coral) ===== -->
  <rect x="58" y="58" width="464" height="234" rx="14" fill="none" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="52" fill="#e0645c">supermesh (skip the middle branch)</text>

  <!-- ===== wires (grey) ===== -->
  <line x1="90" y1="90" x2="163" y2="90" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="217" y1="90" x2="363" y2="90" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="417" y1="90" x2="490" y2="90" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="90" y1="280" x2="490" y2="280" stroke="#8a8a8a" stroke-width="2"/>
  <!-- left vertical (gap for Vs) -->
  <line x1="90" y1="90" x2="90" y2="172" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="90" y1="208" x2="90" y2="280" stroke="#8a8a8a" stroke-width="2"/>
  <!-- middle vertical (gap for current source) -->
  <line x1="290" y1="90" x2="290" y2="158" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="290" y1="212" x2="290" y2="280" stroke="#8a8a8a" stroke-width="2"/>
  <!-- right vertical (gap for R3 box) -->
  <line x1="490" y1="90" x2="490" y2="158" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="490" y1="212" x2="490" y2="280" stroke="#8a8a8a" stroke-width="2"/>

  <!-- node dots -->
  <circle cx="90" cy="90" r="3.5" fill="#8a8a8a"/>
  <circle cx="290" cy="90" r="3.5" fill="#8a8a8a"/>
  <circle cx="490" cy="90" r="3.5" fill="#8a8a8a"/>
  <circle cx="90" cy="280" r="3.5" fill="#8a8a8a"/>
  <circle cx="290" cy="280" r="3.5" fill="#8a8a8a"/>
  <circle cx="490" cy="280" r="3.5" fill="#8a8a8a"/>

  <!-- ===== voltage source Vs (blue), + up ===== -->
  <circle cx="90" cy="190" r="18" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="86" y="179" fill="#4a90d9">+</text>
  <text x="86" y="207" fill="#4a90d9">&#8722;</text>
  <text x="42" y="195" fill="#4a90d9">V_s</text>

  <!-- ===== current source Is (blue circle, arrow down) ===== -->
  <circle cx="290" cy="185" r="27" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <line x1="290" y1="168" x2="290" y2="202" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="290,204 285,193 295,193" fill="#4a90d9"/>
  <text x="303" y="190" fill="#4a90d9">I_s</text>

  <!-- ===== resistors (grey boxes) ===== -->
  <rect x="163" y="75" width="54" height="30" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="182" y="65" fill="#8a8a8a">R&#8321;</text>
  <rect x="363" y="75" width="54" height="30" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="382" y="65" fill="#8a8a8a">R&#8322;</text>
  <rect x="473" y="158" width="34" height="54" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="513" y="190" fill="#8a8a8a">R&#8323;</text>

  <!-- ===== mesh-current loops (coral) ===== -->
  <circle cx="190" cy="200" r="30" fill="none" stroke="#e0645c" stroke-width="2"/>
  <polygon points="190,170 187,165 187,175" fill="#e0645c"/>
  <polygon points="190,170 198,170 190,175" fill="#e0645c"/>
  <text x="181" y="206" fill="#e0645c">I&#8321;</text>
  <circle cx="390" cy="200" r="30" fill="none" stroke="#e0645c" stroke-width="2"/>
  <polygon points="390,170 387,165 387,175" fill="#e0645c"/>
  <polygon points="390,170 398,170 390,175" fill="#e0645c"/>
  <text x="381" y="206" fill="#e0645c">I&#8322;</text>
</svg>
