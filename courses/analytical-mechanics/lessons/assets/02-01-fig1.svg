<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="28" fill="#8a8a8a" font-style="italic">No θ in L  ⟹  p_θ (angular momentum) conserved: the radius sweeps equal areas in equal times.</text>

  <!-- equal-area swept sectors from the force center (same Δt) -->
  <path d="M 226 175 L 136.2 231.4 L 125 175 L 136.2 118.6 Z" fill="#e0645c" opacity="0.20"/>
  <path d="M 226 175 L 493.6 195 L 495 175 L 493.6 155 Z" fill="#e0645c" opacity="0.20"/>

  <!-- the orbit -->
  <ellipse cx="310" cy="175" rx="185" ry="165" fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- reference axis (fixed direction) from the force center -->
  <line x1="226" y1="175" x2="430" y2="175" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- radius vector to the orbiting mass -->
  <line x1="226" y1="175" x2="416" y2="40" stroke="#8a8a8a" stroke-width="2"/>
  <text x="332" y="98" fill="#8a8a8a">r</text>

  <!-- angle theta between reference axis and radius -->
  <path d="M 271 175 A 45 45 0 0 1 262.7 148.9" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="277" y="160" fill="#8a8a8a">θ</text>

  <!-- force center (attracting body at the focus) -->
  <circle cx="226" cy="175" r="8" fill="#e0645c"/>
  <text x="196" y="196" fill="#8a8a8a">force center</text>

  <!-- orbiting mass -->
  <circle cx="416" cy="40" r="6" fill="#4a90d9"/>
  <text x="426" y="40" fill="#4a90d9">m</text>

  <!-- equal-area labels -->
  <text x="120" y="270" fill="#e0645c">A₁</text>
  <text x="470" y="222" fill="#e0645c">A₂</text>
  <text x="205" y="312" fill="#8a8a8a" font-style="italic">A₁ = A₂  (equal times → equal areas)</text>

  <!-- conserved quantity -->
  <text x="330" y="300" fill="#e0645c" font-size="16">p_θ = m r² θ̇ = const</text>
</svg>
