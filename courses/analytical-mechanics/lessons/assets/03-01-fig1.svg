<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="70" y="26" fill="#8a8a8a" font-style="italic">The tangent of slope p = ∂L/∂q̇ meets the L-axis at −H(p): the Hamiltonian is the intercept.</text>

  <!-- axes: L (vertical) and q̇ (horizontal); vertical axis runs below origin to show a negative intercept -->
  <line x1="50" y1="250" x2="400" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="80" y1="335" x2="80" y2="40" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="400,250 390,245 390,255" fill="#8a8a8a"/>
  <polygon points="80,40 75,50 85,50" fill="#8a8a8a"/>
  <text x="406" y="255" fill="#8a8a8a">q̇</text>
  <text x="68" y="46" fill="#8a8a8a">L</text>

  <!-- convex L(q̇) = ½q̇² -->
  <path d="M 62 248.6 L 80 250 L 110 246.3 L 140 235 L 170 216.3 L 200 190 L 230 156.3 L 260 115 L 272 96.4"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="276" y="100" fill="#4a90d9">L(q̇)</text>

  <!-- tangent line of slope p at q̇* : from L-axis intercept (80,310) through (200,190) up to (290,100) -->
  <line x1="80" y1="310" x2="290" y2="100" stroke="#e0645c" stroke-width="2.5"/>
  <text x="238" y="132" fill="#e0645c">slope = p</text>

  <!-- point of tangency -->
  <circle cx="200" cy="190" r="5" fill="#4a90d9"/>

  <!-- dropline from tangency to the q̇ axis -->
  <line x1="200" y1="190" x2="200" y2="250" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="192" y="268" fill="#8a8a8a" font-style="italic">q̇*(p)</text>

  <!-- the intercept: distance from origin down to the L-axis crossing is H -->
  <circle cx="80" cy="310" r="5" fill="#e0645c"/>
  <line x1="80" y1="250" x2="80" y2="310" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="20" y="314" fill="#e0645c">−H(p)</text>
  <text x="90" y="286" fill="#e0645c" font-style="italic">H</text>
</svg>
