<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M 0 0 L 7 3 L 0 6 Z" fill="#e0645c"/>
    </marker>
  </defs>

  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Surfaces of constant S are wavefronts; particles ride the rays that pierce them at right angles.</text>

  <!-- wavefronts: surfaces of constant S (arcs, centered off-frame at (-260,175)) -->
  <path d="M 101.4 57.6 A 380 380 0 0 1 101.4 292.4" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <path d="M 168 36 A 450 450 0 0 1 168 314" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <path d="M 234.5 14.3 A 520 520 0 0 1 234.5 335.7" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <path d="M 307 12.2 A 590 590 0 0 1 307 337.8" fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- trajectories: radial rays, orthogonal to the wavefronts, p = dS/dq points outward -->
  <line x1="82.4" y1="102.2" x2="341.6" y2="47.1" stroke="#e0645c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="89.2" y1="150.6" x2="353.8" y2="132.1" stroke="#e0645c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="89.2" y1="199.4" x2="353.8" y2="217.9" stroke="#e0645c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="82.4" y1="247.8" x2="341.6" y2="302.9" stroke="#e0645c" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- right-angle mark at one crossing (ray meets wavefront) -->
  <path d="M 180.1 205.8 L 179.5 214.8 L 188.5 215.4" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>

  <!-- labels -->
  <text x="372" y="52" fill="#e0645c">trajectory</text>
  <text x="372" y="222" fill="#e0645c">p = &#8706;S/&#8706;q</text>
  <text x="120" y="330" fill="#4a90d9">S = const</text>
  <text x="200" y="330" fill="#4a90d9">S + &#916;S</text>
  <text x="280" y="330" fill="#4a90d9">S + 2&#916;S</text>
</svg>
