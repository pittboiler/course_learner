<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="60" y="30" fill="#8a8a8a" font-style="italic">A canonical map may bend the region into a new shape — but never changes its area.</text>

  <!-- ===== LEFT frame: (q, p) ===== -->
  <line x1="60" y1="260" x2="250" y2="260" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="70" y1="80"  x2="70" y2="272"  stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="250,260 240,255 240,265" fill="#8a8a8a"/>
  <polygon points="70,80 65,90 75,90" fill="#8a8a8a"/>
  <text x="254" y="265" fill="#8a8a8a">q</text>
  <text x="56" y="78"  fill="#8a8a8a">p</text>

  <!-- blue square patch, area = 60x60 -->
  <rect x="120" y="150" width="60" height="60" fill="#4a90d9" opacity="0.20"/>
  <rect x="120" y="150" width="60" height="60" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="122" y="232" fill="#4a90d9">area A</text>

  <!-- ===== curved arrow ===== -->
  <path d="M 262 150 C 305 120, 345 120, 388 150" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="388,150 377,146 380,157" fill="#8a8a8a"/>
  <text x="278" y="118" fill="#8a8a8a">canonical map</text>

  <!-- ===== RIGHT frame: (Q, P) ===== -->
  <line x1="390" y1="260" x2="590" y2="260" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="400" y1="80"  x2="400" y2="272"  stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="590,260 580,255 580,265" fill="#8a8a8a"/>
  <polygon points="400,80 395,90 405,90" fill="#8a8a8a"/>
  <text x="594" y="265" fill="#8a8a8a">Q</text>
  <text x="386" y="78"  fill="#8a8a8a">P</text>

  <!-- red sheared parallelogram, same area A = base 60 x height 60 -->
  <polygon points="450,210 510,210 540,150 480,150" fill="#e0645c" opacity="0.20"/>
  <polygon points="450,210 510,210 540,150 480,150" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <text x="452" y="232" fill="#e0645c">same area A</text>
</svg>
