<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="Four receptor families and the fractional occupancy curve">
  <rect width="800" height="470" fill="#ffffff"/>
  <g stroke="#c8a165" stroke-width="1.2">
    <rect x="10" y="70" width="780" height="34" fill="#f6e7cd"/>
  </g>
  <text x="14" y="64" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8a6a2f">outside</text>
  <text x="14" y="122" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8a6a2f">cytosol</text>

  <g font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">
    <text x="24" y="34">Ion-channel-coupled</text>
    <text x="222" y="34">GPCR</text>
    <text x="400" y="34">Receptor tyrosine kinase</text>
    <text x="640" y="34">Nuclear receptor</text>
  </g>

  <g>
    <rect x="48" y="66" width="16" height="42" fill="#1a6fb5"/><rect x="90" y="66" width="16" height="42" fill="#1a6fb5"/>
    <circle cx="77" cy="52" r="8" fill="#d1495b"/>
    <g stroke="#1a6fb5" stroke-width="2" fill="none"><path d="M 77 112 L 77 140"/></g>
    <g fill="#1a6fb5"><circle cx="77" cy="126" r="3"/><circle cx="70" cy="146" r="3"/><circle cx="84" cy="150" r="3"/></g>
    <text x="24" y="172" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">pore opens &#8594; ion flux</text>
    <text x="24" y="188" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">microseconds</text>
  </g>

  <g>
    <rect x="228" y="66" width="52" height="42" rx="5" fill="#6a4c93"/>
    <circle cx="254" cy="52" r="8" fill="#d1495b"/>
    <ellipse cx="254" cy="132" rx="34" ry="16" fill="#cbb8e0" stroke="#6a4c93" stroke-width="1.5"/>
    <text x="254" y="137" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#3d2a5c" text-anchor="middle">G&#945; G&#946;&#947;</text>
    <text x="216" y="172" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">G protein activated</text>
    <text x="216" y="188" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">ms&#8211;s &#8594; lesson 2.2</text>
  </g>

  <g>
    <rect x="410" y="66" width="16" height="42" fill="#2e8b57"/><rect x="440" y="66" width="16" height="42" fill="#2e8b57"/>
    <rect x="402" y="108" width="32" height="22" rx="4" fill="#2e8b57"/><rect x="432" y="108" width="32" height="22" rx="4" fill="#2e8b57"/>
    <ellipse cx="433" cy="50" rx="20" ry="9" fill="#d1495b"/>
    <text x="433" y="54" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#fff" text-anchor="middle">ligand</text>
    <g fill="#e8a33d" stroke="#a5701a" stroke-width="1"><circle cx="400" cy="140" r="6"/><circle cx="420" cy="148" r="6"/><circle cx="446" cy="148" r="6"/><circle cx="466" cy="140" r="6"/></g>
    <text x="392" y="166" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#a5701a">P</text>
    <text x="412" y="174" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#a5701a">P</text>
    <text x="438" y="174" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#a5701a">P</text>
    <text x="458" y="166" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#a5701a">P</text>
    <rect x="378" y="182" width="52" height="18" rx="4" fill="#dbeadb" stroke="#2e8b57"/><text x="404" y="195" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#1f5c3a" text-anchor="middle">SH2 prot.</text>
    <rect x="436" y="182" width="52" height="18" rx="4" fill="#dbeadb" stroke="#2e8b57"/><text x="462" y="195" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#1f5c3a" text-anchor="middle">SH2 prot.</text>
    <text x="378" y="218" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">proximity &#8594; trans-autophosphorylation</text>
    <text x="378" y="232" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">each pTyr is a different address</text>
  </g>

  <g>
    <circle cx="680" cy="52" r="8" fill="#d1495b"/>
    <path d="M 680 60 L 680 128" stroke="#d1495b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#nr)"/>
    <circle cx="680" cy="140" r="8" fill="#d1495b"/>
    <rect x="646" y="132" width="68" height="18" rx="4" fill="#f0d4d8" stroke="#d1495b" stroke-width="1.3"/>
    <text x="680" y="145" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#7a2530" text-anchor="middle">receptor</text>
    <ellipse cx="680" cy="192" rx="54" ry="26" fill="#f7f2fb" stroke="#6a4c93" stroke-width="1.6"/>
    <text x="680" y="196" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#3d2a5c" text-anchor="middle">nucleus: acts as TF</text>
    <text x="622" y="234" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">lipophilic ligand crosses</text>
    <text x="622" y="248" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">the bilayer &#8212; hours</text>
  </g>

  <line x1="40" y1="272" x2="760" y2="272" stroke="#ddd" stroke-width="2"/>
  <text x="40" y="298" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">Fractional occupancy: 81-fold from 10% to 90%</text>
  <line x1="90" y1="440" x2="700" y2="440" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="440" x2="90" y2="316" stroke="#333" stroke-width="2"/>
  <text x="395" y="464" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#333" text-anchor="middle">log [ligand] &#8594;</text>
  <text x="66" y="322" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333" text-anchor="end">1.0</text>
  <text x="66" y="382" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333" text-anchor="end">0.5</text>
  <text x="66" y="444" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333" text-anchor="end">0</text>
  <path d="M 100 434 C 200 430 260 412 320 382 C 380 352 450 332 700 322" fill="none" stroke="#1a6fb5" stroke-width="2.8"/>
  <line x1="320" y1="440" x2="320" y2="382" stroke="#1a6fb5" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="90" y1="382" x2="320" y2="382" stroke="#1a6fb5" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="326" y="400" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#1a6fb5">[L] = K_d &#8594; &#952; = 0.5</text>
  <line x1="222" y1="440" x2="222" y2="428" stroke="#d1495b" stroke-width="2"/>
  <line x1="452" y1="440" x2="452" y2="338" stroke="#d1495b" stroke-width="2"/>
  <path d="M 222 452 L 452 452" stroke="#d1495b" stroke-width="1.8" marker-start="url(#lft)" marker-end="url(#rgt)"/>
  <text x="337" y="424" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#d1495b" text-anchor="middle">81&#215;</text>
  <text x="470" y="352" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d1495b">&#952; = 0.9 at 9K_d</text>
  <text x="130" y="424" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d1495b">&#952; = 0.1 at K_d/9</text>
  <defs>
    <marker id="nr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d1495b"/></marker>
    <marker id="rgt" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d1495b"/></marker>
    <marker id="lft" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#d1495b"/></marker>
  </defs>
</svg>
