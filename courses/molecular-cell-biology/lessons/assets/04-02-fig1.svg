<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 475" width="800" height="475" role="img" aria-label="Enhancer-promoter loop within a topological domain, the pre-initiation complex and paused polymerase, and a bursty transcription trace">
  <rect width="800" height="475" fill="#ffffff"/>
  <text x="14" y="22" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">Distance does not matter, because the chromosome loops</text>

  <line x1="40" y1="196" x2="760" y2="196" stroke="#5d6b73" stroke-width="4"/>
  <g fill="#c9871f">
    <rect x="118" y="186" width="10" height="20"/><rect x="486" y="186" width="10" height="20"/>
  </g>
  <text x="123" y="222" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8a5a10" text-anchor="middle">CTCF</text>
  <text x="491" y="222" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#8a5a10" text-anchor="middle">CTCF</text>
  <path d="M 128 196 Q 305 236 486 196" fill="none" stroke="#c9871f" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="305" y="248" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8a5a10" text-anchor="middle">topological domain &#8212; cohesin extrudes, CTCF halts it</text>

  <rect x="176" y="176" width="72" height="20" rx="4" fill="#dbeadb" stroke="#2e8b57" stroke-width="1.6"/>
  <text x="212" y="190" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1f5c3a" text-anchor="middle">ENHANCER</text>
  <g fill="#2e8b57"><circle cx="186" cy="164" r="7"/><circle cx="202" cy="158" r="7"/><circle cx="220" cy="158" r="7"/><circle cx="236" cy="164" r="7"/></g>
  <text x="212" y="142" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#2e8b57" text-anchor="middle">transcription factors</text>
  <ellipse cx="300" cy="126" rx="46" ry="18" fill="#e8dff5" stroke="#6a4c93" stroke-width="1.6"/>
  <text x="300" y="130" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#3d2a5c" text-anchor="middle">Mediator + HAT</text>
  <path d="M 240 156 L 274 136" stroke="#6a4c93" stroke-width="2" marker-end="url(#j)"/>
  <path d="M 248 178 C 300 96 360 96 396 172" fill="none" stroke="#1a6fb5" stroke-width="2.6"/>
  <text x="330" y="98" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1a6fb5" text-anchor="middle">the loop brings them into contact</text>

  <rect x="396" y="176" width="70" height="20" rx="4" fill="#e8f0fb" stroke="#1a6fb5" stroke-width="1.6"/>
  <text x="431" y="190" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#134f80" text-anchor="middle">PROMOTER</text>

  <rect x="540" y="176" width="76" height="20" rx="4" fill="#f0d4d8" stroke="#d1495b" stroke-width="1.6"/>
  <text x="578" y="190" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#7a2530" text-anchor="middle">other gene</text>
  <path d="M 250 254 Q 420 288 578 208" fill="none" stroke="#d1495b" stroke-width="2.2" stroke-dasharray="6 5"/>
  <line x1="470" y1="266" x2="500" y2="290" stroke="#d1495b" stroke-width="3"/>
  <line x1="500" y1="266" x2="470" y2="290" stroke="#d1495b" stroke-width="3"/>
  <text x="330" y="286" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">cannot reach across the boundary &#8212; delete it and it can</text>

  <line x1="14" y1="304" x2="786" y2="304" stroke="#ddd" stroke-width="2"/>
  <text x="14" y="328" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">At the promoter: parked, not absent</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="10.5">
    <rect x="20" y="342" width="94" height="24" rx="5" fill="#e8f0fb" stroke="#1a6fb5" stroke-width="1.4"/><text x="67" y="358" text-anchor="middle" fill="#134f80">TFIID / TBP</text>
    <path d="M 116 354 L 140 354" stroke="#555" stroke-width="2" marker-end="url(#j)"/>
    <rect x="142" y="342" width="112" height="24" rx="5" fill="#e8f0fb" stroke="#1a6fb5" stroke-width="1.4"/><text x="198" y="358" text-anchor="middle" fill="#134f80">GTFs + Pol II</text>
    <path d="M 256 354 L 280 354" stroke="#555" stroke-width="2" marker-end="url(#j)"/>
    <rect x="282" y="342" width="118" height="24" rx="5" fill="#fdeee0" stroke="#c9871f" stroke-width="1.4"/><text x="341" y="358" text-anchor="middle" fill="#8a5a10">TFIIH melts bubble</text>
    <path d="M 402 354 L 426 354" stroke="#555" stroke-width="2" marker-end="url(#j)"/>
    <rect x="428" y="342" width="120" height="24" rx="5" fill="#f0d4d8" stroke="#d1495b" stroke-width="1.8"/><text x="488" y="358" text-anchor="middle" fill="#7a2530">PAUSE at +40 nt</text>
    <path d="M 550 354 L 574 354" stroke="#555" stroke-width="2" marker-end="url(#j)"/>
    <rect x="576" y="342" width="130" height="24" rx="5" fill="#dbeadb" stroke="#2e8b57" stroke-width="1.8"/><text x="641" y="358" text-anchor="middle" fill="#1f5c3a">P-TEFb &#8594; Ser2-P &#8594; GO</text>
    <text x="20" y="386" fill="#333">The regulated step is <tspan font-weight="bold">pause release</tspan> &#8212; the polymerase is parked with the engine running.</text>
    <text x="20" y="402" fill="#333">The Pol II C-terminal tail changes phosphorylation as it goes, recruiting capping, splicing, then polyadenylation in order.</text>
  </g>

  <line x1="14" y1="414" x2="786" y2="414" stroke="#ddd" stroke-width="2"/>
  <text x="14" y="434" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">Transcription is bursty</text>
  <line x1="150" y1="462" x2="600" y2="462" stroke="#333" stroke-width="1.6"/>
  <g stroke="#1a6fb5" stroke-width="2.4">
    <path d="M 160 462 L 160 440 L 186 440 L 186 462"/>
    <path d="M 250 462 L 250 428 L 268 428 L 268 462"/>
    <path d="M 390 462 L 390 446 L 424 446 L 424 462"/>
    <path d="M 520 462 L 520 432 L 542 432 L 542 462"/>
  </g>
  <path d="M 186 470 L 250 470" stroke="#d1495b" stroke-width="1.6" marker-start="url(#lf)" marker-end="url(#rt)"/>
  <text x="620" y="440" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1a6fb5">burst size &#8776; k_tx / k_off</text>
  <text x="620" y="456" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">burst frequency &#8776; k_on</text>
  <text x="620" y="470" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">Fano &#8776; 1 + burst size</text>
  <defs>
    <marker id="j" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker>
    <marker id="rt" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d1495b"/></marker>
    <marker id="lf" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#d1495b"/></marker>
  </defs>
</svg>
