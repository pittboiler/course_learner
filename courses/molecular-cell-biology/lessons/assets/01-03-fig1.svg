<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" role="img" aria-label="Radial microtubule array with kinesin outward, dynein inward, handoff to myosin V on cortical actin, and one motor with three adaptors">
  <rect width="780" height="360" fill="#ffffff"/>
  <circle cx="250" cy="180" r="158" fill="#fbfcfd" stroke="#37474f" stroke-width="3"/>
  <circle cx="250" cy="180" r="150" fill="none" stroke="#e0a458" stroke-width="6" stroke-dasharray="9 7" opacity="0.7"/>
  <text x="250" y="352" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#b07a2f" text-anchor="middle">cortical actin (myosin V territory)</text>

  <circle cx="250" cy="180" r="14" fill="#6a4c93"/>
  <text x="250" y="212" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#6a4c93" text-anchor="middle">centrosome (all minus ends)</text>

  <g stroke="#5d6b73" stroke-width="4" stroke-linecap="round">
    <line x1="250" y1="180" x2="250" y2="42"/>
    <line x1="250" y1="180" x2="382" y2="112"/>
    <line x1="250" y1="180" x2="392" y2="238"/>
    <line x1="250" y1="180" x2="266" y2="322"/>
    <line x1="250" y1="180" x2="116" y2="252"/>
    <line x1="250" y1="180" x2="112" y2="118"/>
  </g>
  <text x="256" y="36" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1a6fb5">+</text>
  <text x="388" y="106" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1a6fb5">+</text>
  <text x="398" y="246" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1a6fb5">+</text>
  <text x="268" y="336" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1a6fb5">+</text>
  <text x="104" y="262" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1a6fb5">+</text>
  <text x="102" y="112" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1a6fb5">+</text>

  <circle cx="322" cy="147" r="13" fill="#2e8b57"/>
  <path d="M 336 140 L 366 125" stroke="#2e8b57" stroke-width="3" marker-end="url(#k1)"/>
  <text x="316" y="126" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#2e8b57" text-anchor="middle">kinesin &#8594; plus (out)</text>

  <circle cx="176" cy="216" r="13" fill="#d1495b"/>
  <path d="M 164 210 L 210 187" stroke="#d1495b" stroke-width="3" marker-end="url(#k2)"/>
  <text x="140" y="248" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#d1495b">dynein &#8594; minus (in)</text>

  <circle cx="379" cy="121" r="9" fill="#e0a458"/>
  <path d="M 388 117 q 22 -8 30 -26" fill="none" stroke="#e0a458" stroke-width="3" marker-end="url(#k3)"/>
  <text x="410" y="76" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#b07a2f">handoff to myosin V</text>
  <text x="410" y="92" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#b07a2f">for the last stretch</text>

  <rect x="470" y="150" width="296" height="186" rx="10" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.6"/>
  <text x="486" y="176" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">One motor, three addresses</text>
  <circle cx="510" cy="240" r="16" fill="#2e8b57"/>
  <text x="510" y="272" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#2e8b57" text-anchor="middle">kinesin-1</text>
  <g stroke="#666" stroke-width="2">
    <line x1="528" y1="226" x2="592" y2="204"/>
    <line x1="528" y1="240" x2="592" y2="240"/>
    <line x1="528" y1="254" x2="592" y2="278"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#666">
    <text x="536" y="206">adaptor A</text><text x="536" y="234">adaptor B</text><text x="536" y="284">adaptor C</text>
  </g>
  <rect x="596" y="192" width="150" height="24" rx="5" fill="#dbeadb" stroke="#2e8b57" stroke-width="1.3"/>
  <text x="604" y="209" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1f5c3a">mitochondrion</text>
  <rect x="596" y="228" width="150" height="24" rx="5" fill="#dbeadb" stroke="#2e8b57" stroke-width="1.3"/>
  <text x="604" y="245" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1f5c3a">vesicle precursor</text>
  <rect x="596" y="266" width="150" height="24" rx="5" fill="#dbeadb" stroke="#2e8b57" stroke-width="1.3"/>
  <text x="604" y="283" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1f5c3a">mRNA granule</text>
  <text x="486" y="316" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">break one adaptor &#8594; lose one cargo,</text>
  <text x="486" y="330" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">break the motor &#8594; lose all three</text>

  <defs>
    <marker id="k1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e8b57"/></marker>
    <marker id="k2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d1495b"/></marker>
    <marker id="k3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e0a458"/></marker>
  </defs>
</svg>
