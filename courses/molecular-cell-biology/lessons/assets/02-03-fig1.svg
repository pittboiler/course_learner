  <line x1="386" y1="252" x2="386" y2="112" stroke="#333" stroke-width="2"/>
  <text x="562" y="274" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333" text-anchor="middle">log [input] &#8594;</text>
