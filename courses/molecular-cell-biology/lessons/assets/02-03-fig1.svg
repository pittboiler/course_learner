    <text x="640" y="126" fill="#2e8b57">n = 2 &#8212; 9&#215;</text>
    <text x="530" y="106" fill="#d1495b">n = 5 &#8212; 2.4&#215;</text>
  </g>

  <text x="352" y="316" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">Zero-order ultrasensitivity</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="11">
    <rect x="352" y="330" width="150" height="24" rx="5" fill="#dbeadb" stroke="#2e8b57" stroke-width="1.4"/>
    <text x="427" y="347" text-anchor="middle" fill="#1f5c3a">kinase, saturated (V_K)</text>
    <rect x="352" y="362" width="150" height="24" rx="5" fill="#f0d4d8" stroke="#d1495b" stroke-width="1.4"/>
    <text x="427" y="379" text-anchor="middle" fill="#7a2530">phosphatase, sat. (V_P)</text>
    <text x="352" y="406" fill="#333">both flat out &#8594; output is a comparison, not a balance</text>
    <line x1="560" y1="392" x2="740" y2="392" stroke="#333" stroke-width="1.8"/>
