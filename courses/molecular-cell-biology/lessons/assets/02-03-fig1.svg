<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-label="MAPK cascade with scaffold, Hill dose-response curves, and zero-order ultrasensitivity">
  <rect width="800" height="430" fill="#ffffff"/>
  <text x="14" y="24" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">The cascade</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="11.5">
    <rect x="20" y="36" width="118" height="26" rx="5" fill="#dbeadb" stroke="#2e8b57" stroke-width="1.5"/><text x="79" y="53" text-anchor="middle" fill="#1f5c3a">RTK (pTyr)</text>
    <path d="M 79 62 L 79 80" stroke="#555" stroke-width="2" marker-end="url(#b)"/>
    <rect x="20" y="82" width="118" height="26" rx="5" fill="#e8dff5" stroke="#6a4c93" stroke-width="1.5"/><text x="79" y="99" text-anchor="middle" fill="#3d2a5c">Grb2&#8211;Sos &#8594; Ras</text>
    <path d="M 79 108 L 79 126" stroke="#555" stroke-width="2" marker-end="url(#b)"/>
    <rect x="20" y="128" width="118" height="26" rx="5" fill="#e8f0fb" stroke="#1a6fb5" stroke-width="1.5"/><text x="79" y="145" text-anchor="middle" fill="#134f80">Raf   n&#8321;</text>
    <path d="M 79 154 L 79 172" stroke="#555" stroke-width="2" marker-end="url(#b)"/>
    <rect x="20" y="174" width="118" height="26" rx="5" fill="#e8f0fb" stroke="#1a6fb5" stroke-width="1.5"/><text x="79" y="191" text-anchor="middle" fill="#134f80">MEK   n&#8322;</text>
    <path d="M 79 200 L 79 218" stroke="#555" stroke-width="2" marker-end="url(#b)"/>
    <rect x="20" y="220" width="118" height="26" rx="5" fill="#e8f0fb" stroke="#1a6fb5" stroke-width="1.5"/><text x="79" y="237" text-anchor="middle" fill="#134f80">ERK   n&#8323;</text>
    <path d="M 79 246 L 79 264" stroke="#555" stroke-width="2" marker-end="url(#b)"/>
    <rect x="10" y="266" width="138" height="26" rx="5" fill="#1a6fb5"/><text x="79" y="283" text-anchor="middle" fill="#fff">transcription factors</text>
    <rect x="156" y="120" width="18" height="132" rx="7" fill="#fdeee0" stroke="#c9871f" stroke-width="1.8"/>
    <text x="182" y="150" fill="#8a5a10">scaffold binds</text>
    <text x="182" y="166" fill="#8a5a10">one Raf, one MEK,</text>
    <text x="182" y="182" fill="#8a5a10">one ERK &#8212; a private</text>
    <text x="182" y="198" fill="#8a5a10">circuit. Buys specificity,</text>
    <text x="182" y="214" fill="#8a5a10">costs gain.</text>
    <text x="20" y="316" font-weight="bold" fill="#111">n_eff &#8776; n&#8321; &#215; n&#8322; &#215; n&#8323;</text>
    <text x="20" y="336" fill="#333">1.4 &#215; 1.7 &#215; 2.0 = 4.8</text>
    <text x="20" y="356" fill="#d1495b">81-fold receptor &#8594; 2.5-fold output</text>
  </g>

  <line x1="330" y1="16" x2="330" y2="414" stroke="#ddd" stroke-width="2"/>
  <text x="352" y="24" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">Steepness: span = 81^(1/n)</text>
