<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-label="Treadmilling actin, microtubule dynamic instability, and a non-polar intermediate filament">
  <rect width="780" height="330" fill="#ffffff"/>
  <text x="14" y="24" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111">Actin: treadmilling</text>
  <text x="278" y="24" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111">Microtubule: dynamic instability</text>
  <text x="622" y="24" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111">Intermediate filament</text>

  <g>
    <text x="16" y="70" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8a5a00">&#8722; end (slow)</text>
    <text x="176" y="70" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1a6fb5" text-anchor="end">plus end (fast)</text>
    <g fill="#f0b429" stroke="#8a5a00" stroke-width="1.4">
      <circle cx="34" cy="100" r="10"/><circle cx="52" cy="112" r="10"/><circle cx="70" cy="100" r="10"/><circle cx="88" cy="112" r="10"/>
      <circle cx="106" cy="100" r="10"/><circle cx="124" cy="112" r="10"/><circle cx="142" cy="100" r="10"/><circle cx="160" cy="112" r="10"/>
    </g>
    <path d="M 26 138 L 8 138" stroke="#8a5a00" stroke-width="2.5" marker-end="url(#ar1)"/>
    <path d="M 168 138 L 190 138" stroke="#1a6fb5" stroke-width="2.5" marker-end="url(#ar2)"/>
    <text x="6" y="156" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#8a5a00">loses</text>
    <text x="160" y="156" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#1a6fb5">gains</text>
    <text x="16" y="192" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">flux of subunits runs right to left</text>
    <text x="16" y="212" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">through a filament of fixed length</text>
    <rect x="16" y="228" width="200" height="46" rx="6" fill="#fff8e6" stroke="#c99a20" stroke-width="1.4"/>
    <text x="26" y="248" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#7a5200">window:</text>
    <text x="26" y="266" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#7a5200">C&#8331;(plus) &lt; [S] &lt; C&#8331;(minus)</text>
  </g>

  <line x1="245" y1="45" x2="245" y2="300" stroke="#ddd" stroke-width="2"/>
  <line x1="600" y1="45" x2="600" y2="300" stroke="#ddd" stroke-width="2"/>

  <g>
    <rect x="270" y="88" width="180" height="22" fill="#cfd8dc" stroke="#5d6b73" stroke-width="1.4"/>
    <rect x="450" y="88" width="46" height="22" fill="#4caf50" stroke="#2e6b31" stroke-width="1.4"/>
    <text x="472" y="82" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#2e6b31" text-anchor="middle">GTP cap</text>
    <text x="360" y="104" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#37474f" text-anchor="middle">GDP lattice (strained)</text>
    <path d="M 506 99 L 532 99" stroke="#2e6b31" stroke-width="2.5" marker-end="url(#ar3)"/>
    <text x="516" y="128" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#2e6b31">grow</text>

    <text x="268" y="168" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#d1495b">catastrophe: cap lost</text>
    <rect x="270" y="182" width="120" height="22" fill="#cfd8dc" stroke="#5d6b73" stroke-width="1.4"/>
    <g fill="none" stroke="#d1495b" stroke-width="2.2">
      <path d="M 390 182 q 22 -6 30 -22"/><path d="M 390 190 q 26 2 38 -8"/>
      <path d="M 390 202 q 24 8 32 24"/><path d="M 390 196 q 28 10 44 8"/>
    </g>
    <text x="440" y="196" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#d1495b">peels at</text>
    <text x="440" y="212" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#d1495b">~20 &#181;m/min</text>
    <rect x="268" y="238" width="300" height="46" rx="6" fill="#f4f7f4" stroke="#7aa07c" stroke-width="1.4"/>
    <text x="280" y="258" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#2e6b31">a race: add GTP-tubulin vs. hydrolyse it</text>
    <text x="280" y="276" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#2e6b31">lose the race &#8594; the tube falls apart</text>
  </g>

  <g>
    <path d="M 630 78 q 14 14 0 28 q -14 14 0 28 q 14 14 0 28 q -14 14 0 28 q 14 14 0 28" fill="none" stroke="#6a4c93" stroke-width="5"/>
    <path d="M 646 78 q -14 14 0 28 q 14 14 0 28 q -14 14 0 28 q 14 14 0 28 q -14 14 0 28" fill="none" stroke="#6a4c93" stroke-width="5"/>
    <path d="M 662 78 q 14 14 0 28 q -14 14 0 28 q 14 14 0 28 q -14 14 0 28 q 14 14 0 28" fill="none" stroke="#6a4c93" stroke-width="5"/>
    <path d="M 646 70 L 646 52" stroke="#333" stroke-width="2.5" marker-end="url(#ar4)"/>
    <path d="M 646 226 L 646 244" stroke="#333" stroke-width="2.5" marker-end="url(#ar5)"/>
    <text x="690" y="120" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6a4c93">no polarity</text>
    <text x="690" y="140" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6a4c93">no nucleotide</text>
    <text x="690" y="160" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6a4c93">no motors</text>
    <text x="614" y="278" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">bears tension</text>
  </g>

  <defs>
    <marker id="ar1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a5a00"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a6fb5"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e6b31"/></marker>
    <marker id="ar4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker>
    <marker id="ar5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker>
  </defs>
</svg>
