<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="NHEJ in G1 versus homologous recombination in S and G2, translocation from mis-joining, and the synthetic lethality square">
  <rect width="800" height="500" fill="#ffffff"/>
  <text x="14" y="22" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">G1 &#8212; no sister chromatid, CDK low &#8594; NHEJ</text>
  <text x="410" y="22" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">S / G2 &#8212; sister present, CDK high &#8594; HR</text>

  <g stroke-width="6" stroke-linecap="round">
    <line x1="24" y1="48" x2="150" y2="48" stroke="#1a6fb5"/><line x1="176" y1="48" x2="300" y2="48" stroke="#1a6fb5"/>
    <line x1="24" y1="60" x2="150" y2="60" stroke="#1a6fb5"/><line x1="176" y1="60" x2="300" y2="60" stroke="#1a6fb5"/>
  </g>
  <text x="163" y="40" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d1495b" text-anchor="middle">break</text>
  <circle cx="150" cy="54" r="12" fill="none" stroke="#6a4c93" stroke-width="3"/>
  <circle cx="176" cy="54" r="12" fill="none" stroke="#6a4c93" stroke-width="3"/>
  <text x="163" y="88" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#6a4c93" text-anchor="middle">Ku clamps both ends</text>
  <text x="163" y="103" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#c9871f" text-anchor="middle">53BP1 blocks resection</text>
  <path d="M 163 112 L 163 130" stroke="#555" stroke-width="2" marker-end="url(#f)"/>
  <g stroke-width="6" stroke-linecap="round">
    <line x1="24" y1="146" x2="140" y2="146" stroke="#1a6fb5"/><line x1="186" y1="146" x2="300" y2="146" stroke="#1a6fb5"/>
    <line x1="24" y1="158" x2="140" y2="158" stroke="#1a6fb5"/><line x1="186" y1="158" x2="300" y2="158" stroke="#1a6fb5"/>
  </g>
  <text x="163" y="140" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b" text-anchor="middle">trim ragged ends</text>
  <path d="M 163 172 L 163 190" stroke="#555" stroke-width="2" marker-end="url(#f)"/>
  <g stroke-width="6" stroke-linecap="round">
    <line x1="24" y1="206" x2="300" y2="206" stroke="#1a6fb5"/><line x1="24" y1="218" x2="300" y2="218" stroke="#1a6fb5"/>
  </g>
  <text x="163" y="240" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d1495b" text-anchor="middle">ligated &#8212; a few bp lost, minutes</text>

  <line x1="380" y1="14" x2="380" y2="278" stroke="#ddd" stroke-width="2"/>

  <g stroke-width="6" stroke-linecap="round">
    <line x1="416" y1="48" x2="536" y2="48" stroke="#1a6fb5"/><line x1="562" y1="48" x2="686" y2="48" stroke="#1a6fb5"/>
    <line x1="416" y1="60" x2="500" y2="60" stroke="#1a6fb5"/><line x1="600" y1="60" x2="686" y2="60" stroke="#1a6fb5"/>
  </g>
  <text x="551" y="40" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d1495b" text-anchor="middle">break</text>
  <text x="551" y="80" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#2e8b57" text-anchor="middle">CDK-activated resection &#8594; long 3&#8242; ssDNA tails</text>
  <text x="551" y="95" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#2e8b57" text-anchor="middle">BRCA1 removes 53BP1 &#183; BRCA2 loads RAD51</text>
  <path d="M 551 104 L 551 122" stroke="#555" stroke-width="2" marker-end="url(#f)"/>
  <g stroke-width="6" stroke-linecap="round">
    <line x1="416" y1="140" x2="686" y2="140" stroke="#8fa8c0"/><line x1="416" y1="152" x2="686" y2="152" stroke="#8fa8c0"/>
  </g>
  <text x="700" y="150" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6b73">sister chromatid</text>
  <path d="M 500 62 q 30 46 60 70" fill="none" stroke="#d1495b" stroke-width="2.4" marker-end="url(#g)"/>
  <text x="470" y="122" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">RAD51 invades</text>
  <path d="M 551 166 L 551 184" stroke="#555" stroke-width="2" marker-end="url(#f)"/>
  <g stroke-width="6" stroke-linecap="round">
    <line x1="416" y1="200" x2="686" y2="200" stroke="#1a6fb5"/><line x1="416" y1="212" x2="686" y2="212" stroke="#1a6fb5"/>
  </g>
  <text x="551" y="240" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#2e8b57" text-anchor="middle">copied from the sister &#8212; error-free, hours</text>

  <line x1="14" y1="278" x2="786" y2="278" stroke="#ddd" stroke-width="2"/>
  <text x="14" y="302" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">NHEJ's characteristic failure: four ends, no template</text>
  <g stroke-width="6" stroke-linecap="round">
    <line x1="24" y1="330" x2="120" y2="330" stroke="#1a6fb5"/><line x1="150" y1="330" x2="250" y2="330" stroke="#1a6fb5"/>
    <line x1="24" y1="360" x2="120" y2="360" stroke="#2e8b57"/><line x1="150" y1="360" x2="250" y2="360" stroke="#2e8b57"/>
  </g>
  <text x="262" y="334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a6fb5">chr A</text>
  <text x="262" y="364" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#2e8b57">chr B</text>
  <path d="M 120 332 Q 135 348 150 358" fill="none" stroke="#d1495b" stroke-width="2.6" stroke-dasharray="4 3"/>
  <path d="M 120 358 Q 135 344 150 332" fill="none" stroke="#d1495b" stroke-width="2.6" stroke-dasharray="4 3"/>
  <text x="24" y="392" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d1495b">wrong pair joined &#8594; reciprocal translocation</text>
  <text x="24" y="410" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">mis-join chances grow as pairs, n(n&#8722;1)/2 &#8212; quadratic in dose.</text>
  <text x="24" y="426" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">That quadratic is why radiotherapy is fractionated.</text>
  <text x="24" y="448" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#2e8b57">HR cannot make this error &#8212; the template says what belongs where.</text>

  <line x1="380" y1="288" x2="380" y2="490" stroke="#ddd" stroke-width="2"/>
  <text x="410" y="302" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">Synthetic lethality</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="11">
    <rect x="470" y="312" width="140" height="52" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
    <text x="540" y="336" text-anchor="middle" fill="#1f5c3a">both intact</text><text x="540" y="352" text-anchor="middle" fill="#1f5c3a">LIVES</text>
    <rect x="610" y="312" width="140" height="52" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
    <text x="680" y="336" text-anchor="middle" fill="#1f5c3a">PARP inhibited only</text><text x="680" y="352" text-anchor="middle" fill="#1f5c3a">LIVES (HR fixes it)</text>
    <rect x="470" y="364" width="140" height="52" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
    <text x="540" y="388" text-anchor="middle" fill="#1f5c3a">BRCA-null only</text><text x="540" y="404" text-anchor="middle" fill="#1f5c3a">LIVES (NHEJ copes)</text>
    <rect x="610" y="364" width="140" height="52" fill="#fbe9eb" stroke="#d1495b" stroke-width="2.4"/>
    <text x="680" y="388" text-anchor="middle" fill="#7a2530" font-weight="bold">BOTH</text><text x="680" y="404" text-anchor="middle" fill="#7a2530" font-weight="bold">DIES</text>
    <text x="410" y="444" fill="#333">Patient's normal cells: BRCA heterozygous,</text>
    <text x="410" y="460" fill="#333">HR-proficient &#8212; top-right box, they live.</text>
    <text x="410" y="482" fill="#d1495b" font-weight="bold">The drug is not selective. The genotype is.</text>
  </g>
  <defs>
    <marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d1495b"/></marker>
  </defs>
</svg>
