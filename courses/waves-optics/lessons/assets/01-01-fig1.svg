<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">The spring picks the tempo ω₀; x(t) = A cos(ω₀t + φ) plays it — one shape, forever, amplitude A, period T.</text>

  <!-- ===== left: the x(t) sinusoid ===== -->

  <!-- equilibrium / time axis -->
  <line x1="50" y1="150" x2="398" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="398,150 388,145 388,155" fill="#8a8a8a"/>
  <text x="402" y="155" fill="#8a8a8a">t</text>
  <!-- displacement axis -->
  <line x1="50" y1="230" x2="50" y2="66" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="50,66 45,76 55,76" fill="#8a8a8a"/>
  <text x="40" y="76" fill="#8a8a8a">x</text>
  <text x="30" y="155" fill="#8a8a8a">0</text>

  <!-- the sinusoid: y = 150 - 70 cos(2π(px-215)/180) -->
  <path d="M 50 92.2 L 65 119.9 L 80 155.4 L 95 189.8 L 110 213.1 L 125 219.8 L 140 207.8 L 155 180.1 L 170 144.6 L 185 110.2 L 200 86.9 L 215 80.2 L 230 92.2 L 245 119.9 L 260 155.4 L 275 189.8 L 290 213.1 L 305 219.8 L 320 207.8 L 335 180.1 L 350 144.6 L 365 110.2 L 380 86.9"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- amplitude marker (center up to peak at px=215) -->
  <line x1="215" y1="150" x2="215" y2="80.2" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="215,80.2 211,89 219,89" fill="#e0645c"/>
  <polygon points="215,150 211,141 219,141" fill="#e0645c"/>
  <text x="222" y="118" fill="#e0645c">A</text>

  <!-- period marker (trough to trough, px=125 to px=305) -->
  <line x1="125" y1="219.8" x2="125" y2="248" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="305" y1="219.8" x2="305" y2="248" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="125" y1="244" x2="305" y2="244" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="125,244 134,240 134,248" fill="#e0645c"/>
  <polygon points="305,244 296,240 296,248" fill="#e0645c"/>
  <text x="211" y="264" fill="#e0645c">T</text>

  <!-- ===== right: spring-mass schematic ===== -->

  <!-- wall -->
  <line x1="452" y1="96" x2="452" y2="204" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="452" y1="96" x2="444" y2="106" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="452" y1="112" x2="444" y2="122" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="452" y1="128" x2="444" y2="138" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="452" y1="144" x2="444" y2="154" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="452" y1="160" x2="444" y2="170" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="452" y1="176" x2="444" y2="186" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="452" y1="192" x2="444" y2="202" stroke="#8a8a8a" stroke-width="1"/>

  <!-- spring -->
  <path d="M 452 150 L 466 150 L 472 135 L 484 165 L 496 135 L 508 165 L 520 135 L 526 150 L 534 150"
        fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="480" y="122" fill="#4a90d9">k</text>

  <!-- mass block -->
  <rect x="534" y="128" width="44" height="44" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="551" y="156" fill="#4a90d9">m</text>

  <!-- equilibrium line and +x arrow -->
  <line x1="556" y1="176" x2="556" y2="216" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="548" y="230" fill="#8a8a8a">0</text>
  <line x1="556" y1="196" x2="600" y2="196" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="600,196 591,192 591,200" fill="#e0645c"/>
  <text x="596" y="212" fill="#e0645c">+x</text>
</svg>
