<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Concave mirror, object beyond C: two principal rays cross in front of the mirror at a real, inverted, reduced image.</text>

  <!-- principal axis -->
  <line x1="60" y1="180" x2="612" y2="180" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="612,180 602,175 602,185" fill="#8a8a8a"/>
  <text x="606" y="200" fill="#8a8a8a">axis</text>

  <!-- concave mirror arc (centre of curvature at C = 360,180, radius 200) -->
  <path d="M 543 100 A 200 200 0 0 1 543 260" fill="none" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="566" y="112" fill="#8a8a8a">mirror</text>

  <!-- centre of curvature C, focus F, vertex V -->
  <circle cx="360" cy="180" r="3.5" fill="#8a8a8a"/>
  <text x="353" y="200" fill="#8a8a8a">C</text>
  <circle cx="460" cy="180" r="3.5" fill="#8a8a8a"/>
  <text x="455" y="200" fill="#8a8a8a">F</text>
  <text x="551" y="200" fill="#8a8a8a">V</text>

  <!-- object arrow (blue) at d_o -->
  <line x1="280" y1="180" x2="280" y2="120" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="280,120 275,131 285,131" fill="#4a90d9"/>
  <text x="255" y="115" fill="#4a90d9">object</text>

  <!-- image arrow (coral) at d_i, inverted -->
  <line x1="404" y1="180" x2="404" y2="213" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="404,213 399,203 409,203" fill="#e0645c"/>
  <text x="410" y="228" fill="#e0645c">image</text>

  <!-- Ray A: parallel to axis, reflects through F -->
  <line x1="280" y1="120" x2="551" y2="120" stroke="#e0645c" stroke-width="1.6"/>
  <polygon points="430,120 421,116 421,124" fill="#e0645c"/>
  <line x1="551" y1="120" x2="360" y2="241" stroke="#e0645c" stroke-width="1.6"/>
  <text x="300" y="112" fill="#e0645c" font-style="italic">parallel ray</text>

  <!-- Ray B: through F, reflects parallel to axis -->
  <line x1="280" y1="120" x2="557" y2="213" stroke="#e0645c" stroke-width="1.6"/>
  <polygon points="432,171 421,169 426,178" fill="#e0645c"/>
  <line x1="557" y1="213" x2="330" y2="213" stroke="#e0645c" stroke-width="1.6"/>
  <text x="330" y="252" fill="#e0645c" font-style="italic">focal ray</text>
</svg>
