<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Two slits, one screen: the lower ray travels an extra &#948; = d sin&#952;. Whole-&#955; extra &#8594; bright; half-&#955; &#8594; dark.</text>

  <!-- ===== barrier with two slits (broken vertical line) ===== -->
  <line x1="110" y1="100" x2="110" y2="144" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="110" y1="156" x2="110" y2="204" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="110" y1="216" x2="110" y2="262" stroke="#8a8a8a" stroke-width="2"/>

  <!-- slits -->
  <circle cx="110" cy="150" r="3.5" fill="#e0645c"/>
  <circle cx="110" cy="210" r="3.5" fill="#e0645c"/>
  <text x="78" y="146" fill="#8a8a8a">S&#8321;</text>
  <text x="78" y="226" fill="#8a8a8a">S&#8322;</text>

  <!-- slit separation d bracket -->
  <line x1="92" y1="150" x2="92" y2="210" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="92,150 88,159 96,159" fill="#e0645c"/>
  <polygon points="92,210 88,201 96,201" fill="#e0645c"/>
  <text x="72" y="184" fill="#e0645c">d</text>

  <!-- screen -->
  <line x1="540" y1="70" x2="540" y2="270" stroke="#8a8a8a" stroke-width="2"/>
  <text x="516" y="60" fill="#8a8a8a" font-style="italic">screen</text>
  <circle cx="540" cy="95" r="3" fill="#8a8a8a"/>
  <text x="548" y="99" fill="#8a8a8a">P</text>

  <!-- rays from the two slits to point P -->
  <line x1="110" y1="150" x2="540" y2="95" stroke="#4a90d9" stroke-width="2.5"/>
  <line x1="110" y1="210" x2="540" y2="95" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- path-difference triangle: perpendicular from S1 onto lower ray, foot F=(125,206) -->
  <line x1="110" y1="150" x2="125" y2="206" stroke="#8a8a8a" stroke-width="1.3"/>
  <line x1="110" y1="210" x2="125" y2="206" stroke="#e0645c" stroke-width="3"/>
  <!-- right-angle tick at F -->
  <path d="M 121.5 205.1 L 120.5 201.3 L 116.9 202.3" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <text x="128" y="228" fill="#e0645c">&#948; = d sin&#952;</text>

  <!-- angle theta at S1 (between slit line S1->S2 and ray S1->F) -->
  <path d="M 110 165 A 15 15 0 0 0 113.9 164" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="115" y="171" fill="#8a8a8a">&#952;</text>

  <!-- screen distance L -->
  <line x1="110" y1="285" x2="540" y2="285" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <polygon points="110,285 119,281 119,289" fill="#8a8a8a"/>
  <polygon points="540,285 531,281 531,289" fill="#8a8a8a"/>
  <text x="320" y="301" fill="#8a8a8a">L</text>

  <!-- ===== intensity pattern strip ===== -->
  <text x="30" y="326" fill="#8a8a8a" font-style="italic">Intensity on screen:  I = I&#8320; cos&#178;(&#960;d sin&#952; / &#955;)</text>
  <line x1="142" y1="368" x2="538" y2="368" stroke="#8a8a8a" stroke-width="1"/>
  <path d="M 142 328 L 153 338 L 164 358 L 175 368 L 186 358 L 197 338 L 208 328 L 219 338 L 230 358 L 241 368 L 252 358 L 263 338 L 274 328 L 285 338 L 296 358 L 307 368 L 318 358 L 329 338 L 340 328 L 351 338 L 362 358 L 373 368 L 384 358 L 395 338 L 406 328 L 417 338 L 428 358 L 439 368 L 450 358 L 461 338 L 472 328 L 483 338 L 494 358 L 505 368 L 516 358 L 527 338 L 538 328"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <text x="326" y="352" fill="#8a8a8a">m=0</text>
</svg>
