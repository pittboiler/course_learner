<svg viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="26" fill="#8a8a8a" font-style="italic">Converging lens: two principal rays cross on the far side, forming a real, inverted image.</text>

  <!-- optical axis -->
  <line x1="40" y1="170" x2="668" y2="170" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="668,170 658,165 658,175" fill="#8a8a8a"/>
  <text x="650" y="160" fill="#8a8a8a">axis</text>

  <!-- lens (biconvex outline) -->
  <path d="M 330 62 Q 345 170 330 278 Q 315 170 330 62 Z" fill="#8a8a8a" opacity="0.12"/>
  <path d="M 330 62 Q 345 170 330 278 Q 315 170 330 62 Z" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="330" cy="170" r="2.5" fill="#8a8a8a"/>

  <!-- foci -->
  <circle cx="210" cy="170" r="3" fill="#8a8a8a"/>
  <text x="204" y="190" fill="#8a8a8a">F</text>
  <circle cx="450" cy="170" r="3" fill="#8a8a8a"/>
  <text x="443" y="190" fill="#8a8a8a">F&#8242;</text>

  <!-- object (blue arrow, upright) -->
  <line x1="130" y1="170" x2="130" y2="94" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="130,86 125,98 135,98" fill="#4a90d9"/>
  <text x="100" y="188" fill="#4a90d9">object</text>

  <!-- ray 1: parallel then through far focus F' -->
  <polyline points="130,90 330,90 630,290" fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <!-- ray 2: straight through the lens center -->
  <line x1="130" y1="90" x2="630" y2="290" stroke="#e0645c" stroke-width="2.5"/>

  <!-- image (coral arrow, inverted) -->
  <line x1="630" y1="170" x2="630" y2="286" stroke="#e0645c" stroke-width="3"/>
  <polygon points="630,294 625,282 635,282" fill="#e0645c"/>
  <text x="556" y="318" fill="#e0645c">real, inverted image</text>
</svg>
