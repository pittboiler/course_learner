<svg viewBox="0 0 660 270" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Nearly every injected carrier crosses; the few that do not command the many that do.</text>
  <rect x="50" y="90" width="60" height="110" fill="#4a90d9" fill-opacity="0.18" stroke="#4a90d9" stroke-width="1.4"/>
  <rect x="110" y="90" width="28" height="110" fill="#8a8a8a" fill-opacity="0.20" stroke="#8a8a8a" stroke-width="1.4"/>
  <rect x="138" y="90" width="142" height="110" fill="#4a90d9" fill-opacity="0.10" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="64" y="82" fill="#4a90d9" font-size="11">n&#8314; emitter</text>
  <text x="102" y="216" fill="#8a8a8a" font-size="11">p base (thin)</text>
  <text x="180" y="82" fill="#4a90d9" font-size="11">n collector</text>
  <line x1="108" y1="115" x2="200" y2="115" stroke="#4a90d9" stroke-width="1.8"/>
  <polygon points="200,115 191,111 191,119" fill="#4a90d9"/>
  <line x1="108" y1="135" x2="200" y2="135" stroke="#4a90d9" stroke-width="1.8"/>
  <polygon points="200,135 191,131 191,139" fill="#4a90d9"/>
  <line x1="108" y1="155" x2="130" y2="155" stroke="#e0645c" stroke-width="1.8"/>
  <circle cx="132" cy="155" r="3" fill="#e0645c"/>
  <line x1="132" y1="155" x2="132" y2="194" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="108" y1="175" x2="200" y2="175" stroke="#4a90d9" stroke-width="1.8"/>
  <polygon points="200,175 191,171 191,179" fill="#4a90d9"/>
  <text x="146" y="232" fill="#e0645c" font-size="10">the few that recombine are the base current</text>
  <line x1="340" y1="200" x2="550" y2="200" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="340" y1="200" x2="340" y2="76" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="340,90 540,200 340,200" fill="#4a90d9" fill-opacity="0.18" stroke="#4a90d9" stroke-width="2.4"/>
  <text x="344" y="86" fill="#4a90d9" font-size="10">n&#8330;(0) = n&#8330;&#8320;e^(qV/kT)</text>
  <text x="526" y="218" fill="#8a8a8a" font-size="10">W&#8331;</text>
  <text x="334" y="218" fill="#8a8a8a" font-size="10">0</text>
  <text x="380" y="160" fill="#e0645c" font-size="10">slope = I&#8330;</text>
  <text x="374" y="178" fill="#8a8a8a" font-size="10">area = stored charge</text>
  <text x="340" y="240" fill="#8a8a8a" font-size="10">straight, because W&#8331; &#8810; L&#8345; &#8212; almost none are lost</text>
</svg>