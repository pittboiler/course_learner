  <text x="20" y="20" fill="#8a8a8a" font-style="italic">You cannot choose the barrier&#8217;s height &#8212; but you can choose its width, and you can choose the gap.</text>
  <text x="40" y="64" fill="#8a8a8a" font-size="11">Schottky contact on lightly doped n-Si</text>
