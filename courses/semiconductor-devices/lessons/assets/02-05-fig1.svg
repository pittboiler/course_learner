  <text x="402" y="126" fill="#e0645c" font-size="9">E<tspan font-size="8" dy="2">F</tspan></text>
  <line x1="288" y1="76" x2="288" y2="122" stroke="#e0645c" stroke-width="1.3"/>
  <text x="292" y="96" fill="#e0645c" font-size="9">&#966;<tspan font-size="8" dy="2">B</tspan></text>
  <line x1="284" y1="112" x2="300" y2="112" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="300,112 291,108 291,116" fill="#4a90d9"/>
  <text x="304" y="116" fill="#4a90d9" font-size="9">tunnels through</text>
  <text x="284" y="220" fill="#8a8a8a" font-size="9">~3 nm wide &#8212; same height,</text>
  <text x="284" y="232" fill="#8a8a8a" font-size="9">but transparent: <tspan fill="#4a90d9">ohmic</tspan></text>
  <text x="455" y="64" fill="#8a8a8a" font-size="11">type-I double heterostructure</text>
  <path d="M455,84 L513,84 L513,110 L567,110 L567,84 L625,84" fill="none" stroke="#4a90d9" stroke-width="2.2"/>
  <path d="M455,210 L513,210 L513,188 L567,188 L567,210 L625,210" fill="none" stroke="#8a8a8a" stroke-width="2.2"/>
  <rect x="513" y="110" width="54" height="78" fill="#4a90d9" fill-opacity="0.07" stroke="none"/>
  <circle cx="525" cy="117" r="3.4" fill="#4a90d9"/>
  <circle cx="525" cy="181" r="3.4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="539" cy="117" r="3.4" fill="#4a90d9"/>
  <circle cx="539" cy="181" r="3.4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="553" cy="117" r="3.4" fill="#4a90d9"/>
  <circle cx="553" cy="181" r="3.4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="509" y="78" fill="#8a8a8a" font-size="9">&#916;E<tspan font-size="8" dy="2">c</tspan></text>
  <text x="509" y="224" fill="#8a8a8a" font-size="9">&#916;E<tspan font-size="8" dy="2">v</tspan></text>
  <text x="455" y="244" fill="#e0645c" font-size="9">both carriers trapped in the same</text>
  <text x="455" y="256" fill="#e0645c" font-size="9">narrow-gap slab &#8594; they actually meet</text>
  <text x="40" y="330" fill="#8a8a8a" font-size="10">Left and middle differ only in the surface doping. The barrier height &#966;<tspan font-size="9" dy="2">B</tspan><tspan font-size="10" dy="-2"> is set by the metal and by interface states,</tspan></text>
  <text x="40" y="346" fill="#8a8a8a" font-size="10">and is essentially not a design variable in silicon; the depletion width is, and that is the whole trick.</text>
  <text x="40" y="372" fill="#8a8a8a" font-size="10">Right: a band-gap difference does what doping cannot &#8212; it makes a barrier for one carrier type</text>
  <text x="40" y="388" fill="#8a8a8a" font-size="10">without making one for the other. That is what an LED, a laser diode and an HBT are all built on.</text>
</svg>