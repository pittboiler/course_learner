  <line x1="78" y1="76" x2="78" y2="122" stroke="#e0645c" stroke-width="1.3"/>
  <text x="82" y="96" fill="#e0645c" font-size="9">&#966;<tspan font-size="8" dy="2">B</tspan></text>
  <text x="74" y="220" fill="#8a8a8a" font-size="9">~250 nm wide &#8212; carriers must</text>
  <text x="74" y="232" fill="#8a8a8a" font-size="9">go <tspan fill="#e0645c">over</tspan>: rectifying</text>
  <text x="250" y="64" fill="#8a8a8a" font-size="11">ohmic contact: n&#8314; surface</text>
  <rect x="250" y="80" width="34" height="112" fill="#8a8a8a" fill-opacity="0.30" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="256" y="208" fill="#8a8a8a" font-size="9">metal</text>
