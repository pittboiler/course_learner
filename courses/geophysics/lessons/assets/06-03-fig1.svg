<svg viewBox="0 0 700 332" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">Rock does not conduct; the water in it does. And how deep you see is set by frequency, not by power.</text>

  <text x="34" y="44" fill="#8a8a8a">why rock conducts at all</text>
  <rect x="34" y="56" width="230" height="96" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <g fill="#8a8a8a" opacity="0.30">
    <circle cx="66" cy="82" r="16"/><circle cx="104" cy="72" r="14"/><circle cx="140" cy="86" r="18"/>
    <circle cx="182" cy="74" r="15"/><circle cx="220" cy="86" r="16"/>
    <circle cx="60" cy="122" r="15"/><circle cx="100" cy="128" r="17"/><circle cx="146" cy="124" r="14"/>
    <circle cx="186" cy="130" r="16"/><circle cx="226" cy="120" r="15"/>
  </g>
  <path d="M 44,104 Q 84,96 122,106 Q 162,116 200,102 Q 232,94 256,102" fill="none" stroke="#4a90d9" stroke-width="2.6"/>
  <text x="60" y="172" fill="#4a90d9">current follows the brine in the pores</text>
  <text x="34" y="196" fill="#8a8a8a">&#961; = a &#961;&#7615; &#966;&#8315;&#7504; &#8212; Archie&#8217;s law. Resistivity measures</text>
  <text x="34" y="210" fill="#8a8a8a">porosity and pore-water salinity, not the mineral.</text>
  <text x="34" y="232" fill="#8a8a8a">Which is why electrical methods find groundwater,</text>
  <text x="34" y="246" fill="#8a8a8a">contamination plumes and hydrothermal alteration &#8212;</text>
  <text x="34" y="260" fill="#8a8a8a">and why a clay layer stops them dead.</text>
  <text x="34" y="284" fill="#e0645c">Only the product &#963;t of a thin layer is determined: equivalence.</text>

  <line x1="420" y1="248" x2="676" y2="248" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="420" y1="248" x2="420" y2="52" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="500" y="268" fill="#8a8a8a">frequency &#8594;</text>
  <text x="378" y="62" fill="#8a8a8a">depth</text>
  <line x1="416" y1="248" x2="424" y2="248" stroke="#8a8a8a"/><text x="400" y="262" fill="#8a8a8a">0.01 Hz</text>
  <line x1="548" y1="244" x2="548" y2="252" stroke="#8a8a8a"/><text x="530" y="262" fill="#8a8a8a">1 kHz</text>
  <line x1="668" y1="244" x2="668" y2="252" stroke="#8a8a8a"/><text x="642" y="262" fill="#8a8a8a">100 MHz</text>
  <line x1="416" y1="70" x2="424" y2="70" stroke="#8a8a8a"/><text x="382" y="74" fill="#8a8a8a">50 km</text>
  <line x1="416" y1="160" x2="424" y2="160" stroke="#8a8a8a"/><text x="386" y="164" fill="#8a8a8a">500 m</text>
  <line x1="416" y1="230" x2="424" y2="230" stroke="#8a8a8a"/><text x="392" y="234" fill="#8a8a8a">1 m</text>

  <path d="M 428,70 L 548,160 L 668,238" fill="none" stroke="#4a90d9" stroke-width="2.6"/>
  <text x="432" y="94" fill="#4a90d9">&#948; = 503&#8730;(&#961;/f)</text>

  <text x="430" y="122" fill="#e0645c">magnetotellurics:</text>
  <text x="430" y="136" fill="#e0645c">whole crust and mantle</text>
  <text x="512" y="186" fill="#8a8a8a">controlled-source EM</text>
  <text x="590" y="214" fill="#8a8a8a">GPR &#8212; but here</text>
  <text x="590" y="228" fill="#8a8a8a">the rule breaks</text>

  <text x="30" y="314" fill="#8a8a8a">Above the transition frequency GPR propagates as a wave, not a diffusion, and sees much further.</text>
</svg>
