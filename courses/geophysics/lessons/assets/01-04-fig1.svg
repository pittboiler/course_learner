<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">The core casts a shadow, and the shadow&#8217;s edges are the measurement.</text>

  <circle cx="150" cy="170" r="110" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <circle cx="150" cy="170" r="60" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="120" y="174" fill="#8a8a8a">outer core</text>
  <text x="120" y="188" fill="#8a8a8a">v drops to 8 km/s</text>
  <circle cx="150" cy="60" r="4" fill="#e0645c"/>
  <text x="118" y="50" fill="#e0645c">source</text>

  <path d="M 150,60 Q 172,87 205,75" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <path d="M 150,60 Q 175,127 245,115" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <path d="M 150,60 Q 193,135 257,195" fill="none" stroke="#4a90d9" stroke-width="2.2"/>
  <text x="264" y="200" fill="#4a90d9">103&#176;</text>

  <path d="M 150,60 Q 172,92 189,124 L 180,222 Q 184,250 188,273" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="192" y="286" fill="#e0645c">PKP: through the core, out at 143&#176; and beyond</text>

  <path d="M 257,195 A 110,110 0 0 1 216,258" fill="none" stroke="#8a8a8a" stroke-width="7" opacity="0.35"/>
  <text x="272" y="228" fill="#8a8a8a">shadow</text>
  <text x="272" y="242" fill="#8a8a8a">zone</text>
  <text x="272" y="256" fill="#8a8a8a">103&#176;&#8211;143&#176;</text>

  <text x="24" y="298" fill="#8a8a8a">Rays turn ever deeper until one grazes the core. The next</text>
  <text x="24" y="312" fill="#8a8a8a">ray in is refracted sharply down and lost for 40 degrees.</text>

  <line x1="400" y1="280" x2="678" y2="280" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="400" y1="280" x2="400" y2="56" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="530" y="300" fill="#8a8a8a">epicentral distance &#916;</text>
  <text x="358" y="60" fill="#8a8a8a">T</text>
  <line x1="445" y1="276" x2="445" y2="284" stroke="#8a8a8a"/><text x="436" y="296" fill="#8a8a8a">30&#176;</text>
  <line x1="535" y1="276" x2="535" y2="284" stroke="#8a8a8a"/><text x="526" y="296" fill="#8a8a8a">90&#176;</text>
  <line x1="670" y1="276" x2="670" y2="284" stroke="#8a8a8a"/><text x="658" y="296" fill="#8a8a8a">180&#176;</text>
  <line x1="396" y1="180" x2="404" y2="180" stroke="#8a8a8a"/><text x="366" y="184" fill="#8a8a8a">10 min</text>
  <line x1="396" y1="80" x2="404" y2="80" stroke="#8a8a8a"/><text x="366" y="84" fill="#8a8a8a">20 min</text>

  <path d="M 400,280 Q 432,240 445,218 Q 470,192 490,180 Q 515,164 535,155 Q 548,149 555,146" fill="none" stroke="#4a90d9" stroke-width="2.4"/>
  <text x="470" y="212" fill="#4a90d9">P</text>
  <circle cx="555" cy="146" r="3.5" fill="#4a90d9"/>

  <line x1="555" y1="146" x2="555" y2="280" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="615" y1="82" x2="615" y2="280" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <rect x="555" y="60" width="60" height="220" fill="#8a8a8a" opacity="0.13"/>
  <text x="548" y="252" fill="#8a8a8a">no direct P</text>

  <path d="M 615,82 Q 640,79 670,78" fill="none" stroke="#e0645c" stroke-width="2.4"/>
  <circle cx="615" cy="82" r="3.5" fill="#e0645c"/>
  <text x="600" y="70" fill="#e0645c">PKP</text>

  <text x="315" y="40" fill="#8a8a8a">The slope of this curve at any point is the ray parameter p = dT/d&#916;,</text>
  <text x="400" y="52" fill="#8a8a8a">and p fixes the depth that ray bottomed at.</text>
</svg>
