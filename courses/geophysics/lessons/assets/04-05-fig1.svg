<svg viewBox="0 0 700 322" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">A plate has no inertia worth mentioning, so the forces on it sum to zero at every instant.</text>

  <line x1="40" y1="86" x2="420" y2="86" stroke="#8a8a8a" stroke-width="1"/>
  <text x="42" y="78" fill="#8a8a8a">sea level</text>
  <path d="M 40,118 Q 90,110 120,104 L 300,104 Q 340,106 360,118 L 380,150" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <path d="M 360,118 L 400,190 L 420,244" fill="none" stroke="#4a90d9" stroke-width="7" opacity="0.5"/>
  <text x="404" y="256" fill="#4a90d9">slab</text>

  <polygon points="40,104 62,96 62,128" fill="#e0645c" opacity="0.5"/>
  <line x1="66" y1="112" x2="126" y2="112" stroke="#e0645c" stroke-width="2.4"/>
  <polygon points="136,112 122,106 122,118" fill="#e0645c"/>
  <text x="60" y="146" fill="#e0645c">ridge push</text>
  <text x="60" y="160" fill="#e0645c">4 &#215; 10&#185;&#178; N/m</text>

  <line x1="404" y1="196" x2="416" y2="236" stroke="#e0645c" stroke-width="4"/>
  <polygon points="420,248 406,236 416,230" fill="#e0645c"/>
  <text x="366" y="252" fill="#e0645c">slab pull</text>
  <text x="366" y="266" fill="#e0645c">4 &#215; 10&#185;&#179; N/m</text>

  <g stroke="#8a8a8a" stroke-width="1.6">
    <line x1="160" y1="126" x2="196" y2="126"/><polygon points="150,126 164,121 164,131" fill="#8a8a8a"/>
    <line x1="230" y1="126" x2="266" y2="126"/><polygon points="220,126 234,121 234,131" fill="#8a8a8a"/>
    <line x1="300" y1="126" x2="336" y2="126"/><polygon points="290,126 304,121 304,131" fill="#8a8a8a"/>
  </g>
  <text x="176" y="146" fill="#8a8a8a">basal drag &#8212; sign uncertain, can push or resist</text>

  <g stroke="#8a8a8a" stroke-width="1.6" fill="none">
    <path d="M 392,178 L 372,186"/><polygon points="364,190 378,182 380,192" fill="#8a8a8a"/>
    <path d="M 406,214 L 386,222"/><polygon points="378,226 392,218 394,228" fill="#8a8a8a"/>
  </g>
  <text x="292" y="200" fill="#8a8a8a">viscous</text>
  <text x="292" y="214" fill="#8a8a8a">resistance</text>

  <text x="40" y="278" fill="#8a8a8a">Slab pull is ten times ridge push &#8212; and almost all of it is spent overcoming the mantle&#8217;s resistance.</text>

  <line x1="470" y1="230" x2="676" y2="230" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="470" y1="230" x2="470" y2="52" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="512" y="250" fill="#8a8a8a">fraction of boundary subducting</text>
  <text x="440" y="62" fill="#8a8a8a">v</text>
  <text x="436" y="76" fill="#8a8a8a">cm/yr</text>
  <line x1="466" y1="226" x2="474" y2="226" stroke="#8a8a8a"/><text x="458" y="230" fill="#8a8a8a">0</text>
  <line x1="466" y1="82" x2="474" y2="82" stroke="#8a8a8a"/><text x="452" y="86" fill="#8a8a8a">10</text>

  <circle cx="480" cy="214" r="4" fill="#4a90d9"/><text x="486" y="212" fill="#8a8a8a">Eur</text>
  <circle cx="482" cy="212" r="4" fill="#4a90d9"/>
  <circle cx="486" cy="216" r="4" fill="#4a90d9"/><text x="492" y="228" fill="#8a8a8a">Ant</text>
  <circle cx="500" cy="200" r="4" fill="#4a90d9"/><text x="504" y="198" fill="#8a8a8a">N Am</text>
  <circle cx="500" cy="186" r="4" fill="#4a90d9"/><text x="506" y="182" fill="#8a8a8a">Afr</text>
  <circle cx="592" cy="114" r="4" fill="#e0645c"/><text x="560" y="110" fill="#8a8a8a">Pac</text>
  <circle cx="626" cy="122" r="4" fill="#e0645c"/><text x="632" y="118" fill="#8a8a8a">Naz</text>
  <circle cx="646" cy="108" r="4" fill="#e0645c"/><text x="652" y="104" fill="#8a8a8a">Coc</text>

  <line x1="472" y1="222" x2="660" y2="100" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="30" y="304" fill="#8a8a8a">Plate speed tracks how much slab is hanging off it &#8212; not plate area, not ridge length.</text>
</svg>
