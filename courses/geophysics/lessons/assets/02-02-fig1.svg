<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">Each correction removes something you already understand. What is left over is the geology.</text>

  <line x1="60" y1="250" x2="330" y2="250" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="60" y="266" fill="#8a8a8a">the ellipsoid</text>
  <path d="M 60,250 L 110,250 L 150,214 L 190,206 L 218,224 L 250,196 L 290,232 L 330,250" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <rect x="110" y="206" width="180" height="44" fill="#8a8a8a" opacity="0.12"/>
  <circle cx="190" cy="206" r="4" fill="#e0645c"/>
  <text x="196" y="200" fill="#e0645c">station, height h</text>

  <line x1="190" y1="206" x2="190" y2="250" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="150" y="240" fill="#8a8a8a">h</text>

  <path d="M 150,214 L 190,206 L 218,224" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="120" y="290" fill="#4a90d9">the hill above pulls up; the valley beside</text>
  <text x="120" y="304" fill="#4a90d9">is missing mass that would have pulled down &#8212;</text>
  <text x="120" y="318" fill="#4a90d9">so the terrain correction is always positive</text>

  <text x="400" y="42" fill="#8a8a8a">the correction ladder, station at 1500 m, 45&#176;</text>

  <line x1="420" y1="60" x2="420" y2="250" stroke="#8a8a8a" stroke-width="1"/>

  <text x="432" y="72" fill="#8a8a8a">observed g</text>
  <text x="612" y="72" fill="#8a8a8a">980100.0</text>
  <line x1="414" y1="76" x2="426" y2="76" stroke="#8a8a8a" stroke-width="2"/>

  <text x="432" y="106" fill="#e0645c">&#8722; normal gravity &#947;(45&#176;)</text>
  <text x="608" y="106" fill="#e0645c">&#8722;980620.0</text>
  <text x="432" y="120" fill="#8a8a8a">removes latitude and the ellipsoid</text>

  <text x="432" y="152" fill="#4a90d9">+ free air, 0.3086 &#215; 1500</text>
  <text x="616" y="152" fill="#4a90d9">+462.9</text>
  <text x="432" y="166" fill="#8a8a8a">removes being further from the centre</text>

  <line x1="420" y1="180" x2="672" y2="180" stroke="#8a8a8a" stroke-width="1"/>
  <text x="432" y="196" fill="#4a90d9">free-air anomaly</text>
  <text x="620" y="196" fill="#4a90d9">&#8722;57.1</text>

  <text x="432" y="222" fill="#e0645c">&#8722; Bouguer slab, 0.1119 &#215; 1500</text>
  <text x="616" y="222" fill="#e0645c">&#8722;167.9</text>
  <text x="432" y="236" fill="#8a8a8a">removes the rock between you and the ellipsoid</text>

  <line x1="420" y1="248" x2="672" y2="248" stroke="#8a8a8a" stroke-width="1"/>
  <text x="432" y="266" fill="#e0645c">Bouguer anomaly</text>
  <text x="614" y="266" fill="#e0645c">&#8722;225.0 mGal</text>
  <text x="432" y="288" fill="#8a8a8a">Near zero free-air but hugely negative Bouguer</text>
  <text x="432" y="302" fill="#8a8a8a">is the signature of a compensated mountain:</text>
  <text x="432" y="316" fill="#8a8a8a">there is a low-density root down there.</text>
</svg>
