<svg viewBox="0 0 700 346" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">A liquid iron alloy too light to be iron, freezing onto a solid ball that may be younger than the dinosaurs.</text>

  <circle cx="160" cy="160" r="112" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <circle cx="160" cy="160" r="94" fill="#e0645c" opacity="0.14" stroke="#e0645c" stroke-width="1.6"/>
  <circle cx="160" cy="160" r="33" fill="#4a90d9" opacity="0.35" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="132" y="164" fill="#4a90d9">inner</text>
  <text x="134" y="178" fill="#4a90d9">core</text>

  <line x1="160" y1="160" x2="160" y2="66" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="272" y1="160" x2="288" y2="160" stroke="#8a8a8a" stroke-width="1"/>
  <text x="292" y="164" fill="#8a8a8a">2891 km, 136 GPa, 4000 K</text>
  <line x1="254" y1="160" x2="254" y2="146" stroke="#8a8a8a" stroke-width="1"/>
  <text x="188" y="120" fill="#8a8a8a">outer core: liquid</text>
  <text x="188" y="134" fill="#8a8a8a">10,900 kg/m&#179;</text>
  <line x1="193" y1="160" x2="288" y2="216" stroke="#8a8a8a" stroke-width="1"/>
  <text x="292" y="220" fill="#8a8a8a">5150 km, 329 GPa, ~5700 K</text>

  <text x="30" y="290" fill="#8a8a8a">Pure iron at these pressures would be about 10 percent denser than the outer core is.</text>
  <text x="30" y="276" fill="#4a90d9">Roughly a tenth of the core, by mass, is something lighter &#8212; sulphur, oxygen, silicon.</text>

  <text x="416" y="44" fill="#8a8a8a">the new core paradox, in terawatts</text>

  <line x1="430" y1="220" x2="670" y2="220" stroke="#8a8a8a" stroke-width="1.2"/>

  <rect x="446" y="160" width="52" height="60" fill="#8a8a8a" opacity="0.35" stroke="#8a8a8a"/>
  <text x="462" y="196" fill="#8a8a8a">4</text>
  <text x="432" y="238" fill="#8a8a8a">conducted</text>
  <text x="440" y="252" fill="#8a8a8a">(old k = 30)</text>

  <rect x="522" y="80" width="52" height="140" fill="#e0645c" opacity="0.45" stroke="#e0645c"/>
  <text x="538" y="156" fill="#e0645c">13</text>
  <text x="510" y="238" fill="#e0645c">conducted</text>
  <text x="512" y="252" fill="#e0645c">(new k = 100)</text>

  <rect x="598" y="120" width="52" height="100" fill="#4a90d9" opacity="0.45" stroke="#4a90d9"/>
  <text x="614" y="176" fill="#4a90d9">10</text>
  <text x="586" y="238" fill="#4a90d9">total core</text>
  <text x="590" y="252" fill="#4a90d9">heat flow</text>

  <line x1="430" y1="120" x2="670" y2="120" stroke="#4a90d9" stroke-width="1.4" stroke-dasharray="5 4"/>

  <text x="30" y="314" fill="#8a8a8a">If conduction alone can carry more heat than the core supplies, the top of the core</text>
  <text x="30" y="328" fill="#8a8a8a">does not need to convect &#8212; and then what has been running the dynamo for 3.5 Gyr?</text>
</svg>
