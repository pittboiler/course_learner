<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">Spin a self-gravitating fluid and it settles onto an ellipsoidal equipotential. Gravity follows the shape.</text>

  <circle cx="180" cy="160" r="88" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 4"/>
  <ellipse cx="180" cy="160" rx="102" ry="80" fill="none" stroke="#4a90d9" stroke-width="2.4"/>
  <text x="240" y="80" fill="#8a8a8a">sphere of</text>
  <text x="240" y="94" fill="#8a8a8a">equal volume</text>
  <text x="120" y="272" fill="#4a90d9">the reference ellipsoid</text>

  <line x1="180" y1="52" x2="180" y2="268" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 168,60 A 18,18 0 0 1 192,60" fill="none" stroke="#e0645c" stroke-width="1.6"/>
  <polygon points="194,62 184,54 190,68" fill="#e0645c"/>
  <text x="196" y="56" fill="#e0645c">&#969;</text>

  <line x1="180" y1="160" x2="282" y2="160" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="216" y="154" fill="#8a8a8a">a = 6378 km</text>
  <line x1="180" y1="160" x2="180" y2="80" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="130" y="118" fill="#8a8a8a">c = 6357 km</text>

  <line x1="282" y1="160" x2="316" y2="160" stroke="#e0645c" stroke-width="2"/>
  <polygon points="326,160 312,155 312,165" fill="#e0645c"/>
  <text x="290" y="180" fill="#e0645c">centrifugal</text>
  <text x="290" y="194" fill="#e0645c">&#969;&#178;a = 0.034 m/s&#178;</text>

  <text x="26" y="150" fill="#8a8a8a">21 km</text>
  <text x="26" y="164" fill="#8a8a8a">of bulge</text>

  <line x1="380" y1="252" x2="672" y2="252" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="380" y1="252" x2="380" y2="60" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="470" y="272" fill="#8a8a8a">latitude</text>
  <line x1="380" y1="248" x2="380" y2="256" stroke="#8a8a8a"/><text x="374" y="268" fill="#8a8a8a">0&#176;</text>
  <line x1="526" y1="248" x2="526" y2="256" stroke="#8a8a8a"/><text x="516" y="268" fill="#8a8a8a">45&#176;</text>
  <line x1="672" y1="248" x2="672" y2="256" stroke="#8a8a8a"/><text x="662" y="268" fill="#8a8a8a">90&#176;</text>
  <text x="326" y="72" fill="#8a8a8a">&#947; (m/s&#178;)</text>
  <line x1="376" y1="236" x2="384" y2="236" stroke="#8a8a8a"/><text x="330" y="240" fill="#8a8a8a">9.780</text>
  <line x1="376" y1="86" x2="384" y2="86" stroke="#8a8a8a"/><text x="330" y="90" fill="#8a8a8a">9.832</text>

  <path d="M 380,236 Q 430,232 453,220 Q 490,200 526,161 Q 566,118 610,96 Q 642,86 672,86" fill="none" stroke="#4a90d9" stroke-width="2.6"/>
  <circle cx="526" cy="161" r="4" fill="#e0645c"/>
  <text x="480" y="140" fill="#e0645c">9.806 at 45&#176;</text>

  <text x="380" y="46" fill="#8a8a8a">Normal gravity: what the ellipsoid alone predicts.</text>
  <text x="348" y="292" fill="#8a8a8a">Everything a survey measures is the departure from this curve.</text>
</svg>
