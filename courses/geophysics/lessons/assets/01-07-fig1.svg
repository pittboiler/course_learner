<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">Big earthquakes are long, not strong: the stress drop barely changes, so all the growth is in area.</text>

  <text x="30" y="42" fill="#8a8a8a">the displacement spectrum</text>
  <line x1="50" y1="200" x2="290" y2="200" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="50" y1="200" x2="50" y2="60" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="150" y="220" fill="#8a8a8a">log frequency</text>
  <text x="8" y="70" fill="#8a8a8a">log |u|</text>

  <line x1="50" y1="80" x2="150" y2="80" stroke="#4a90d9" stroke-width="2.4"/>
  <line x1="150" y1="80" x2="278" y2="192" stroke="#4a90d9" stroke-width="2.4"/>
  <line x1="150" y1="80" x2="150" y2="200" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="136" y="214" fill="#e0645c">f&#8330;</text>
  <text x="60" y="72" fill="#4a90d9">flat plateau = M&#8320;</text>
  <text x="196" y="122" fill="#4a90d9">falls as f &#8315;&#178;</text>

  <line x1="50" y1="118" x2="106" y2="118" stroke="#4a90d9" stroke-width="1.6" opacity="0.5"/>
  <line x1="106" y1="118" x2="240" y2="234" stroke="#4a90d9" stroke-width="1.6" opacity="0.5"/>
  <text x="60" y="112" fill="#8a8a8a">a smaller event: lower plateau,</text>
  <text x="60" y="132" fill="#8a8a8a">but f&#8330; moves right</text>

  <text x="30" y="252" fill="#8a8a8a">The plateau measures the whole fault; f&#8330; &#8776; 1/duration</text>
  <text x="30" y="266" fill="#8a8a8a">measures its size. A scale that reads amplitude at one</text>
  <text x="30" y="280" fill="#8a8a8a">fixed period is reading the wrong part of this plot,</text>
  <text x="30" y="294" fill="#8a8a8a">which is exactly why M&#8347; saturates.</text>

  <text x="368" y="42" fill="#8a8a8a">directivity: the same earthquake, two stations</text>
  <line x1="400" y1="96" x2="560" y2="96" stroke="#8a8a8a" stroke-width="3"/>
  <polygon points="572,96 556,89 556,103" fill="#8a8a8a"/>
  <text x="440" y="88" fill="#8a8a8a">rupture runs this way at V&#8341;</text>
  <circle cx="400" cy="96" r="4" fill="#e0645c"/>
  <text x="372" y="112" fill="#e0645c">start</text>

  <circle cx="632" cy="96" r="4" fill="#4a90d9"/>
  <text x="612" y="86" fill="#4a90d9">forward</text>
  <circle cx="330" cy="96" r="4" fill="#4a90d9"/>
  <text x="306" y="86" fill="#4a90d9">back</text>

  <text x="596" y="146" fill="#4a90d9">short, tall pulse</text>
  <path d="M 600,190 L 618,190 L 624,146 L 630,190 L 660,190" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="596" y="206" fill="#8a8a8a">19 s</text>

  <text x="316" y="146" fill="#4a90d9">long, low pulse</text>
  <path d="M 300,190 L 316,190 Q 340,168 364,190 L 380,190" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="316" y="206" fill="#8a8a8a">52 s</text>

  <text x="320" y="240" fill="#8a8a8a">The rupture chases its own waves. Ahead of it the arrivals pile up;</text>
  <text x="330" y="254" fill="#8a8a8a">behind, they spread out. Same moment, same magnitude, and</text>
  <text x="330" y="268" fill="#8a8a8a">roughly three times the shaking on one side of the fault.</text>
  <text x="330" y="288" fill="#8a8a8a">This is a Doppler effect, and it is a first-order hazard control.</text>
</svg>
