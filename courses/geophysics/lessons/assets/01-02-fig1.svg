<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">Four waves, four particle motions, four arrival times. The order never changes.</text>

  <text x="20" y="44" fill="#8a8a8a">particle motion (propagation is to the right in every panel)</text>

  <text x="20" y="66" fill="#4a90d9">P</text>
  <text x="34" y="66" fill="#8a8a8a">compression along the ray</text>
  <g stroke="#4a90d9" stroke-width="1.6">
    <line x1="20" y1="76" x2="20" y2="98"/><line x1="27" y1="76" x2="27" y2="98"/><line x1="36" y1="76" x2="36" y2="98"/>
    <line x1="48" y1="76" x2="48" y2="98"/><line x1="64" y1="76" x2="64" y2="98"/><line x1="84" y1="76" x2="84" y2="98"/>
    <line x1="100" y1="76" x2="100" y2="98"/><line x1="112" y1="76" x2="112" y2="98"/><line x1="121" y1="76" x2="121" y2="98"/>
    <line x1="128" y1="76" x2="128" y2="98"/><line x1="140" y1="76" x2="140" y2="98"/><line x1="156" y1="76" x2="156" y2="98"/>
    <line x1="176" y1="76" x2="176" y2="98"/><line x1="192" y1="76" x2="192" y2="98"/><line x1="204" y1="76" x2="204" y2="98"/>
  </g>
  <line x1="20" y1="108" x2="196" y2="108" stroke="#8a8a8a" stroke-width="0.8"/>
  <polygon points="206,108 194,104 194,112" fill="#8a8a8a"/>

  <text x="240" y="66" fill="#e0645c">S</text>
  <text x="254" y="66" fill="#8a8a8a">shear across the ray</text>
  <path d="M 240,88 Q 258,68 276,88 T 312,88 T 348,88 T 384,88 T 420,88" fill="none" stroke="#e0645c" stroke-width="2"/>
  <line x1="240" y1="108" x2="412" y2="108" stroke="#8a8a8a" stroke-width="0.8"/>
  <polygon points="422,108 410,104 410,112" fill="#8a8a8a"/>
  <text x="430" y="92" fill="#8a8a8a">needs &#956; &#8800; 0</text>

  <text x="20" y="146" fill="#4a90d9">Rayleigh</text>
  <text x="76" y="146" fill="#8a8a8a">retrograde ellipse in the vertical plane, trapped at the surface</text>
  <line x1="20" y1="160" x2="300" y2="160" stroke="#8a8a8a" stroke-width="1.2"/>
  <ellipse cx="60" cy="176" rx="9" ry="15" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <polygon points="60,161 55,171 65,171" fill="#4a90d9"/>
  <ellipse cx="130" cy="176" rx="9" ry="15" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <polygon points="130,161 125,171 135,171" fill="#4a90d9"/>
  <ellipse cx="200" cy="176" rx="6" ry="10" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <ellipse cx="200" cy="206" rx="3" ry="5" fill="none" stroke="#4a90d9" stroke-width="1"/>
  <text x="214" y="182" fill="#8a8a8a">amplitude dies within</text>
  <text x="214" y="196" fill="#8a8a8a">about one wavelength of depth &#8212;</text>
  <text x="214" y="210" fill="#8a8a8a">so long periods sample deeper</text>

  <text x="430" y="146" fill="#e0645c">Love</text>
  <text x="464" y="146" fill="#8a8a8a">horizontal, transverse</text>
  <line x1="430" y1="160" x2="660" y2="160" stroke="#8a8a8a" stroke-width="1.2"/>
  <path d="M 440,180 Q 462,166 484,180 T 528,180 T 572,180 T 616,180" fill="none" stroke="#e0645c" stroke-width="2"/>
  <line x1="430" y1="196" x2="660" y2="196" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="430" y="212" fill="#8a8a8a">needs a slow layer over a fast one:</text>
  <text x="430" y="226" fill="#8a8a8a">no Love wave in a uniform half-space</text>

  <text x="20" y="256" fill="#8a8a8a">a seismogram at 300 km, crustal speeds</text>
  <line x1="20" y1="300" x2="660" y2="300" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="20" y1="296" x2="20" y2="304" stroke="#8a8a8a"/><text x="12" y="318" fill="#8a8a8a">0</text>
  <line x1="340" y1="296" x2="340" y2="304" stroke="#8a8a8a"/><text x="330" y="318" fill="#8a8a8a">50 s</text>
  <line x1="660" y1="296" x2="660" y2="304" stroke="#8a8a8a"/><text x="646" y="318" fill="#8a8a8a">100 s</text>

  <path d="M 20,285 L 336,285" stroke="#8a8a8a" stroke-width="1.2"/>
  <path d="M 340,285 l 3,-14 l 4,26 l 4,-20 l 4,12 l 5,-8 l 5,6 l 6,-4 l 8,3 l 10,-2 l 12,1 l 20,0 l 60,0 l 70,0" fill="none" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="326" y="264" fill="#4a90d9">P  50 s</text>
  <path d="M 575,285 l 3,-22 l 4,40 l 5,-32 l 5,22 l 6,-16 l 7,12 l 8,-8" fill="none" stroke="#e0645c" stroke-width="1.6"/>
  <text x="556" y="252" fill="#e0645c">S  87 s</text>
  <path d="M 623,285 q 6,-30 12,0 q 6,32 12,0 q 6,-26 13,0" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="500" y="336" fill="#4a90d9">Rayleigh  94 s &#8212; latest and largest</text>
</svg>
