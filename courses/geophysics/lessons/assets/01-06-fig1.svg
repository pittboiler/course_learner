<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">One slipping fault, four quadrants of first motion, two planes that fit equally well.</text>

  <text x="30" y="42" fill="#8a8a8a">the double couple</text>
  <line x1="50" y1="120" x2="170" y2="120" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="110" y1="60" x2="110" y2="180" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="70" y1="110" x2="140" y2="110" stroke="#e0645c" stroke-width="2"/><polygon points="150,110 136,105 136,115" fill="#e0645c"/>
  <line x1="150" y1="130" x2="80" y2="130" stroke="#e0645c" stroke-width="2"/><polygon points="70,130 84,125 84,135" fill="#e0645c"/>
  <line x1="100" y1="80" x2="100" y2="150" stroke="#4a90d9" stroke-width="2"/><polygon points="100,160 95,146 105,146" fill="#4a90d9"/>
  <line x1="120" y1="160" x2="120" y2="90" stroke="#4a90d9" stroke-width="2"/><polygon points="120,80 115,94 125,94" fill="#4a90d9"/>
  <text x="30" y="204" fill="#8a8a8a">Slip on the solid plane and slip on the</text>
  <text x="30" y="218" fill="#8a8a8a">dashed plane produce identical far-field</text>
  <text x="30" y="232" fill="#8a8a8a">radiation. Seismograms alone cannot</text>
  <text x="30" y="246" fill="#8a8a8a">tell them apart &#8212; the auxiliary-plane</text>
  <text x="30" y="260" fill="#8a8a8a">ambiguity. Aftershocks usually can.</text>

  <text x="270" y="42" fill="#8a8a8a">the beachball: first motion by direction</text>
  <circle cx="345" cy="130" r="70" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <path d="M 345,60 A 70,70 0 0 1 415,130 L 345,130 Z" fill="#4a90d9" opacity="0.55"/>
  <path d="M 345,200 A 70,70 0 0 1 275,130 L 345,130 Z" fill="#4a90d9" opacity="0.55"/>
  <line x1="275" y1="130" x2="415" y2="130" stroke="#8a8a8a" stroke-width="1.4"/>
  <line x1="345" y1="60" x2="345" y2="200" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="368" y="94" fill="#ffffff">up</text>
  <text x="300" y="176" fill="#ffffff">up</text>
  <text x="296" y="94" fill="#8a8a8a">down</text>
  <text x="366" y="176" fill="#8a8a8a">down</text>
  <text x="270" y="222" fill="#8a8a8a">Shaded = compression first (P up).</text>
  <text x="270" y="236" fill="#8a8a8a">The two lines are the fault plane and</text>
  <text x="270" y="250" fill="#8a8a8a">its auxiliary. Their pattern names the</text>
  <text x="270" y="264" fill="#8a8a8a">style: this one is strike-slip.</text>

  <text x="470" y="42" fill="#8a8a8a">why magnitude scales saturate</text>
  <line x1="480" y1="180" x2="670" y2="180" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="480" y1="180" x2="480" y2="62" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="540" y="198" fill="#8a8a8a">true size (log M&#8320;)</text>
  <text x="440" y="70" fill="#8a8a8a">M</text>
  <line x1="480" y1="180" x2="660" y2="70" stroke="#4a90d9" stroke-width="2.4"/>
  <text x="600" y="86" fill="#4a90d9">M&#8345;</text>
  <path d="M 480,180 L 570,125 Q 610,101 660,96" fill="none" stroke="#e0645c" stroke-width="2.4"/>
  <text x="614" y="112" fill="#e0645c">M&#8347;</text>
  <text x="470" y="222" fill="#8a8a8a">A 20-second wave cannot see a rupture</text>
  <text x="470" y="236" fill="#8a8a8a">that lasts 200 seconds, so M&#8347; stops</text>
  <text x="470" y="250" fill="#8a8a8a">growing near 8.3 while the earthquake</text>
  <text x="470" y="264" fill="#8a8a8a">keeps going. M&#8345; never saturates because</text>
  <text x="470" y="278" fill="#8a8a8a">it measures the fault, not the wiggle.</text>
</svg>
