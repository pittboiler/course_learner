<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">Velocity rises with depth, so every ray bends back to the surface. The ray parameter is what stays fixed.</text>

  <line x1="40" y1="46" x2="330" y2="46" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="40" y="38" fill="#8a8a8a">free surface</text>
  <line x1="40" y1="86" x2="330" y2="86" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="40" y1="126" x2="330" y2="126" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="40" y1="166" x2="330" y2="166" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="40" y1="206" x2="330" y2="206" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="336" y="90" fill="#8a8a8a">v&#8321;</text>
  <text x="336" y="130" fill="#8a8a8a">v&#8322; &gt; v&#8321;</text>
  <text x="336" y="170" fill="#8a8a8a">v&#8323; &gt; v&#8322;</text>
  <text x="336" y="210" fill="#8a8a8a">v&#8324; &gt; v&#8323;</text>

  <path d="M 60,46 L 92,86 L 132,126 L 186,166 L 260,206" fill="none" stroke="#4a90d9" stroke-width="2.2"/>
  <path d="M 260,206 L 334,246" fill="none" stroke="#4a90d9" stroke-width="2.2" stroke-dasharray="5 4"/>

  <line x1="92" y1="60" x2="92" y2="112" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="2 2"/>
  <path d="M 92,72 A 12,12 0 0 0 100,78" fill="none" stroke="#e0645c" stroke-width="1.4"/>
  <text x="100" y="70" fill="#e0645c">i&#8321;</text>
  <path d="M 92,100 A 16,16 0 0 0 104,108" fill="none" stroke="#e0645c" stroke-width="1.4"/>
  <text x="104" y="106" fill="#e0645c">i&#8322;</text>

  <text x="48" y="238" fill="#4a90d9">each interface bends the ray</text>
  <text x="48" y="252" fill="#4a90d9">further from the vertical</text>
  <text x="48" y="272" fill="#e0645c">sin i&#8321;/v&#8321; = sin i&#8322;/v&#8322; = &#8230; = p</text>
  <text x="48" y="290" fill="#8a8a8a">Snell&#8217;s law says the ray parameter p never changes,</text>
  <text x="48" y="304" fill="#8a8a8a">so p labels the ray for its whole journey.</text>

  <line x1="392" y1="46" x2="678" y2="46" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="392" y="38" fill="#8a8a8a">the same ray in a smooth gradient</text>

  <path d="M 412,46 Q 470,196 560,196 Q 636,196 664,46" fill="none" stroke="#4a90d9" stroke-width="2.4"/>
  <circle cx="545" cy="197" r="4" fill="#e0645c"/>
  <line x1="500" y1="197" x2="600" y2="197" stroke="#e0645c" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="444" y="216" fill="#e0645c">turning point: i = 90&#176;, the ray is horizontal</text>
  <text x="500" y="230" fill="#e0645c">p = 1/v at this depth</text>

  <path d="M 424,46 Q 462,136 520,136 Q 574,136 596,46" fill="none" stroke="#4a90d9" stroke-width="1.4" opacity="0.55"/>
  <path d="M 436,46 Q 462,96 496,96 Q 528,96 542,46" fill="none" stroke="#4a90d9" stroke-width="1.4" opacity="0.35"/>

  <text x="392" y="256" fill="#8a8a8a">A steeper take-off means a smaller p,</text>
  <text x="392" y="270" fill="#8a8a8a">a deeper turning point, and a longer range.</text>
  <text x="392" y="290" fill="#8a8a8a">Sampling the deep Earth is just a matter of</text>
  <text x="392" y="304" fill="#8a8a8a">recording the same earthquake further away.</text>
</svg>
