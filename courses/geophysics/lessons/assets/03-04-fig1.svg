<svg viewBox="0 0 700 336" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">The seafloor is a tape recorder, and the tape is symmetric about the ridge. That symmetry is the proof.</text>

  <text x="30" y="46" fill="#8a8a8a">magnetic profile across a spreading ridge</text>
  <path d="M 30,90 L 60,90 L 60,72 L 84,72 L 84,90 L 116,90 L 116,68 L 140,68 L 140,90 L 168,90 L 168,64 L 200,64 L 200,90 L 236,90 L 236,64 L 268,64 L 268,90 L 296,90 L 296,68 L 320,68 L 320,90 L 352,90 L 352,72 L 376,72 L 376,90 L 406,90"
        fill="none" stroke="#4a90d9" stroke-width="2"/>
  <line x1="218" y1="52" x2="218" y2="212" stroke="#e0645c" stroke-width="2"/>
  <text x="196" y="46" fill="#e0645c">ridge</text>

  <g stroke="none">
    <rect x="200" y="150" width="36" height="24" fill="#4a90d9" opacity="0.55"/>
    <rect x="168" y="150" width="32" height="24" fill="#4a90d9" opacity="0.12"/>
    <rect x="236" y="150" width="32" height="24" fill="#4a90d9" opacity="0.12"/>
    <rect x="140" y="150" width="28" height="24" fill="#4a90d9" opacity="0.55"/>
    <rect x="268" y="150" width="28" height="24" fill="#4a90d9" opacity="0.55"/>
    <rect x="116" y="150" width="24" height="24" fill="#4a90d9" opacity="0.12"/>
    <rect x="296" y="150" width="24" height="24" fill="#4a90d9" opacity="0.12"/>
    <rect x="84" y="150" width="32" height="24" fill="#4a90d9" opacity="0.55"/>
    <rect x="320" y="150" width="32" height="24" fill="#4a90d9" opacity="0.55"/>
    <rect x="60" y="150" width="24" height="24" fill="#4a90d9" opacity="0.12"/>
    <rect x="352" y="150" width="24" height="24" fill="#4a90d9" opacity="0.12"/>
  </g>
  <rect x="60" y="150" width="316" height="24" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <text x="30" y="166" fill="#8a8a8a">crust</text>
  <text x="60" y="192" fill="#8a8a8a">dark = normal polarity, pale = reversed</text>

  <line x1="200" y1="212" x2="140" y2="212" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="134,212 146,208 146,216" fill="#e0645c"/>
  <line x1="236" y1="212" x2="296" y2="212" stroke="#e0645c" stroke-width="1.4"/>
  <polygon points="302,212 290,208 290,216" fill="#e0645c"/>
  <text x="132" y="230" fill="#e0645c">same widths, both ways</text>

  <text x="30" y="256" fill="#8a8a8a">Any theory of the ocean floor must explain why the pattern is a mirror image.</text>
  <text x="30" y="270" fill="#8a8a8a">Spreading from a central crack, with the field reversing as it goes, explains it exactly.</text>

  <text x="450" y="46" fill="#8a8a8a">reading a spreading rate</text>
  <line x1="452" y1="220" x2="672" y2="220" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="452" y1="220" x2="452" y2="70" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="530" y="240" fill="#8a8a8a">age (Ma)</text>
  <text x="416" y="80" fill="#8a8a8a">distance</text>
  <text x="426" y="94" fill="#8a8a8a">(km)</text>

  <circle cx="470" cy="212" r="3.5" fill="#4a90d9"/>
  <circle cx="492" cy="196" r="3.5" fill="#4a90d9"/>
  <circle cx="516" cy="176" r="3.5" fill="#4a90d9"/>
  <circle cx="556" cy="152" r="3.5" fill="#4a90d9"/>
  <circle cx="656" cy="118" r="3.5" fill="#4a90d9"/>
  <path d="M 470,212 L 556,152" stroke="#4a90d9" stroke-width="2"/>
  <path d="M 556,152 L 656,118" stroke="#e0645c" stroke-width="2"/>
  <text x="474" y="164" fill="#4a90d9">steep = fast</text>
  <text x="580" y="106" fill="#e0645c">shallow = slow</text>
  <line x1="556" y1="152" x2="556" y2="220" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="30" y="304" fill="#8a8a8a">the kink dates a change in spreading rate</text>
  <text x="30" y="318" fill="#8a8a8a">The slope of this plot IS the half-spreading rate.</text>
</svg>
