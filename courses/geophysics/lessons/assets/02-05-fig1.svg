<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">The ground has tides too. They are about a third of a metre, and nobody notices because everything moves together.</text>

  <circle cx="150" cy="150" r="72" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <ellipse cx="150" cy="150" rx="90" ry="62" fill="none" stroke="#e0645c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="118" y="146" fill="#8a8a8a">solid</text>
  <text x="118" y="160" fill="#8a8a8a">Earth</text>
  <text x="72" y="98" fill="#e0645c">body tide</text>
  <text x="72" y="112" fill="#e0645c">&#8776; 33 cm</text>

  <circle cx="292" cy="150" r="7" fill="#8a8a8a"/>
  <text x="278" y="176" fill="#8a8a8a">moon</text>
  <line x1="244" y1="150" x2="276" y2="150" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 2"/>

  <text x="30" y="238" fill="#8a8a8a">The equilibrium tide is what a fluid Earth would do: 54 cm.</text>
  <text x="30" y="252" fill="#8a8a8a">The real Earth is elastic and manages h&#8322; = 0.61 of it.</text>
  <text x="30" y="266" fill="#8a8a8a">Those Love numbers are a direct measurement of the</text>
  <text x="30" y="280" fill="#8a8a8a">whole planet&#8217;s stiffness &#8212; no earthquake required.</text>

  <text x="400" y="42" fill="#8a8a8a">the rotation axis wanders and slows</text>

  <circle cx="470" cy="120" r="46" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <path d="M 470,120 m 0,-4 q 8,2 10,10 q 2,10 -8,14 q -13,4 -18,-8 q -5,-15 9,-21 q 17,-7 25,8 q 8,17 -9,25" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <circle cx="470" cy="120" r="2.5" fill="#e0645c"/>
  <text x="400" y="180" fill="#4a90d9">polar motion: the Chandler wobble</text>
  <text x="400" y="194" fill="#4a90d9">(433 days) beating against an annual</text>
  <text x="400" y="208" fill="#4a90d9">term &#8212; about 9 m of travel at the pole</text>

  <line x1="540" y1="82" x2="540" y2="158" stroke="#8a8a8a" stroke-width="1.4"/>
  <path d="M 528,74 A 16,16 0 0 1 552,74" fill="none" stroke="#e0645c" stroke-width="1.6"/>
  <polygon points="554,76 544,68 550,82" fill="#e0645c"/>
  <text x="558" y="76" fill="#e0645c">&#969;</text>
  <text x="558" y="112" fill="#8a8a8a">tidal friction:</text>
  <text x="558" y="126" fill="#8a8a8a">+2.3 ms/century</text>
  <text x="558" y="144" fill="#8a8a8a">rebound:</text>
  <text x="558" y="158" fill="#8a8a8a">&#8722;0.7 ms/century</text>

  <text x="371" y="240" fill="#8a8a8a">Slowing the spin and moving mass toward the poles pull the</text>
  <text x="365" y="254" fill="#8a8a8a">length of day in opposite directions, and the residual is a</text>
  <text x="400" y="268" fill="#8a8a8a">measurement of how much ice used to sit on Canada.</text>
</svg>
