<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">Conduction builds a geotherm that curves, then straightens, then fails.</text>

  <line x1="70" y1="52" x2="330" y2="52" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="70" y1="52" x2="70" y2="260" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="180" y="40" fill="#8a8a8a">temperature &#8594;</text>
  <text x="16" y="160" fill="#8a8a8a">depth</text>
  <line x1="66" y1="52" x2="74" y2="52" stroke="#8a8a8a"/><text x="42" y="56" fill="#8a8a8a">0</text>
  <line x1="66" y1="108" x2="74" y2="108" stroke="#8a8a8a"/><text x="28" y="112" fill="#8a8a8a">10 km</text>
  <line x1="66" y1="192" x2="74" y2="192" stroke="#8a8a8a"/><text x="28" y="196" fill="#8a8a8a">35 km</text>

  <path d="M 72,52 Q 108,76 130,108" fill="none" stroke="#4a90d9" stroke-width="2.6"/>
  <line x1="130" y1="108" x2="266" y2="192" stroke="#4a90d9" stroke-width="2.6"/>
  <line x1="70" y1="108" x2="330" y2="108" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="70" y1="192" x2="330" y2="192" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 3"/>

  <text x="86" y="88" fill="#4a90d9">curved: radiogenic heat</text>
  <text x="86" y="100" fill="#4a90d9">is being added</text>
  <text x="150" y="150" fill="#4a90d9">straight: no more sources,</text>
  <text x="150" y="162" fill="#4a90d9">so the flux is constant</text>
  <text x="182" y="208" fill="#8a8a8a">210 &#176;C at 10 km, 610 &#176;C at the Moho</text>

  <text x="70" y="238" fill="#8a8a8a">q(z) = q&#8320; &#8722; Az: the flux falls as you</text>
  <text x="70" y="252" fill="#8a8a8a">descend past the heat-producing layer.</text>

  <line x1="410" y1="52" x2="670" y2="52" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="410" y1="52" x2="410" y2="270" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="500" y="40" fill="#8a8a8a">temperature &#8594;</text>
  <line x1="406" y1="140" x2="414" y2="140" stroke="#8a8a8a"/><text x="360" y="144" fill="#8a8a8a">100 km</text>
  <line x1="406" y1="240" x2="414" y2="240" stroke="#8a8a8a"/><text x="360" y="244" fill="#8a8a8a">200 km</text>

  <path d="M 412,52 Q 440,80 456,110 L 520,208" fill="none" stroke="#e0645c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="522" y="216" fill="#e0645c">pure conduction:</text>
  <text x="522" y="230" fill="#e0645c">1650 &#176;C at 100 km,</text>
  <text x="522" y="244" fill="#e0645c">72,000 &#176;C at the core</text>

  <path d="M 412,52 Q 440,80 456,110 L 512,140 Q 552,152 590,166 Q 626,180 656,198" fill="none" stroke="#4a90d9" stroke-width="2.6"/>
  <circle cx="512" cy="140" r="4" fill="#4a90d9"/>
  <text x="518" y="128" fill="#4a90d9">base of the plate: 1300 &#176;C</text>
  <text x="546" y="188" fill="#4a90d9">adiabat, 0.3 &#176;C/km</text>

  <text x="248" y="290" fill="#8a8a8a">The kink is not a fudge. It is where conduction stops and convection takes over.</text>
</svg>
