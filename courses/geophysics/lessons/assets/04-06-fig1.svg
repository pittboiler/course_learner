<svg viewBox="0 0 700 322" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">The same rock is a solid to a seismic wave and a fluid to an ice sheet. The dividing line is 250 years.</text>

  <text x="40" y="48" fill="#8a8a8a">a Maxwell material: spring and dashpot in series</text>
  <line x1="40" y1="86" x2="66" y2="86" stroke="#8a8a8a" stroke-width="1.6"/>
  <path d="M 66,86 l 8,-12 l 12,24 l 12,-24 l 12,24 l 12,-24 l 8,12" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
  <line x1="130" y1="86" x2="156" y2="86" stroke="#8a8a8a" stroke-width="1.6"/>
  <rect x="156" y="72" width="40" height="28" fill="none" stroke="#e0645c" stroke-width="1.8"/>
  <line x1="164" y1="86" x2="188" y2="86" stroke="#e0645c" stroke-width="6"/>
  <line x1="196" y1="86" x2="224" y2="86" stroke="#8a8a8a" stroke-width="1.6"/>
  <polygon points="234,86 220,80 220,92" fill="#8a8a8a"/>
  <text x="78" y="116" fill="#4a90d9">&#956; = 1.4 &#215; 10&#185;&#185; Pa</text>
  <text x="150" y="116" fill="#e0645c">&#951; = 10&#178;&#185; Pa s</text>

  <text x="40" y="150" fill="#8a8a8a">&#964;&#8340; = &#951;/&#956; &#8776; 250 years</text>
  <line x1="40" y1="182" x2="330" y2="182" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="40" y1="176" x2="40" y2="188" stroke="#8a8a8a"/>
  <text x="34" y="202" fill="#8a8a8a">1 s</text>
  <line x1="126" y1="176" x2="126" y2="188" stroke="#8a8a8a"/>
  <text x="106" y="202" fill="#8a8a8a">1 year</text>
  <line x1="186" y1="170" x2="186" y2="194" stroke="#e0645c" stroke-width="2"/>
  <text x="164" y="216" fill="#e0645c">&#964;&#8340;</text>
  <line x1="270" y1="176" x2="270" y2="188" stroke="#8a8a8a"/>
  <text x="242" y="202" fill="#8a8a8a">10,000 yr</text>

  <text x="46" y="166" fill="#4a90d9">elastic</text>
  <text x="270" y="166" fill="#e0645c">viscous</text>
  <text x="40" y="244" fill="#8a8a8a">Seismic waves (seconds) never notice the dashpot. Ice sheets</text>
  <text x="40" y="258" fill="#8a8a8a">(ten thousand years) never notice the spring. Everything in</text>
  <text x="40" y="272" fill="#8a8a8a">geodynamics depends on which side of &#964;&#8340; the problem sits.</text>

  <text x="410" y="48" fill="#8a8a8a">rebound after the ice goes</text>
  <line x1="420" y1="230" x2="676" y2="230" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="420" y1="230" x2="420" y2="66" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="512" y="250" fill="#8a8a8a">time since deglaciation</text>
  <text x="380" y="76" fill="#8a8a8a">uplift</text>

  <path d="M 420,220 Q 470,150 520,116 Q 570,94 620,84 Q 650,80 672,78" fill="none" stroke="#4a90d9" stroke-width="2.6"/>
  <line x1="420" y1="74" x2="672" y2="74" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="546" y="68" fill="#8a8a8a">full recovery: 850 m</text>

  <circle cx="566" cy="94" r="4" fill="#e0645c"/>
  <line x1="566" y1="94" x2="566" y2="74" stroke="#e0645c" stroke-width="1.6"/>
  <text x="574" y="110" fill="#e0645c">today: 750 m done,</text>
  <text x="574" y="124" fill="#e0645c">100 m to go, 9 mm/yr</text>

  <text x="30" y="304" fill="#8a8a8a">&#964; = 4&#960;&#951;/(&#961;g&#955;): fit the curve, read off the viscosity of the mantle.</text>
</svg>
