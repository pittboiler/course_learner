<svg viewBox="0 0 700 346" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">The plates are now watched in real time, and a locked fault announces itself as a smooth arctangent.</text>

  <line x1="40" y1="180" x2="320" y2="180" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="180" y1="60" x2="180" y2="250" stroke="#e0645c" stroke-width="2.4"/>
  <text x="186" y="72" fill="#e0645c">locked fault</text>
  <text x="40" y="200" fill="#8a8a8a">distance from fault</text>
  <line x1="36" y1="104" x2="44" y2="104" stroke="#8a8a8a"/><text x="6" y="108" fill="#8a8a8a">+V/2</text>
  <line x1="36" y1="256" x2="44" y2="256" stroke="#8a8a8a"/><text x="10" y="260" fill="#8a8a8a">&#8722;V/2</text>

  <path d="M 40,254 Q 96,250 130,238 Q 160,224 180,180 Q 200,136 230,122 Q 264,110 320,106" fill="none" stroke="#4a90d9" stroke-width="2.6"/>
  <text x="222" y="152" fill="#4a90d9">v(x) = (V/&#960;) arctan(x/D)</text>

  <line x1="212" y1="146" x2="212" y2="180" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="212" cy="146" r="3.5" fill="#e0645c"/>
  <text x="216" y="200" fill="#e0645c">at x = D, half the far-field rate</text>

  <text x="40" y="228" fill="#8a8a8a">The width of the bend is the locking depth D.</text>
  <text x="40" y="278" fill="#8a8a8a">Twenty GNSS receivers across a fault, ten years of data, and</text>
  <text x="40" y="292" fill="#8a8a8a">you have measured how much of the fault is storing the next earthquake.</text>

  <text x="400" y="42" fill="#8a8a8a">what the satellites add</text>

  <circle cx="424" cy="72" r="4" fill="#4a90d9"/>
  <text x="436" y="76" fill="#4a90d9">GNSS</text>
  <text x="490" y="76" fill="#8a8a8a">points, 1 mm/yr, continuous in time</text>

  <circle cx="424" cy="102" r="4" fill="#4a90d9"/>
  <text x="436" y="106" fill="#4a90d9">InSAR</text>
  <text x="483" y="106" fill="#8a8a8a">images, mm, but one line of sight only</text>

  <circle cx="424" cy="132" r="4" fill="#4a90d9"/>
  <text x="436" y="136" fill="#4a90d9">altimetry</text>
  <text x="30" y="314" fill="#8a8a8a">the marine geoid, hence seafloor gravity</text>

  <circle cx="424" cy="162" r="4" fill="#4a90d9"/>
  <text x="436" y="166" fill="#4a90d9">GRACE</text>
  <text x="477" y="166" fill="#8a8a8a">mass itself, monthly, 300 km resolution</text>

  <g stroke="#e0645c" stroke-width="2.4" fill="none">
    <path d="M 420,206 q 40,-14 80,0 q 40,14 80,0"/>
    <path d="M 420,216 q 40,-14 80,0 q 40,14 80,0" opacity="0.75"/>
    <path d="M 420,226 q 40,-14 80,0 q 40,14 80,0" opacity="0.5"/>
    <path d="M 420,236 q 40,-14 80,0 q 40,14 80,0" opacity="0.3"/>
  </g>
  <text x="596" y="222" fill="#e0645c">fringes</text>
  <text x="348" y="262" fill="#8a8a8a">Each InSAR fringe is half a radar wavelength of range change &#8212;</text>
  <text x="30" y="328" fill="#8a8a8a">2.8 cm for C-band. Counting fringes is counting centimetres.</text>
</svg>
