<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="20" y="18" fill="#8a8a8a" font-style="italic">Buoyancy against diffusion. One dimensionless number decides whether a layer stirs, and how hard.</text>

  <rect x="40" y="60" width="300" height="170" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <rect x="40" y="60" width="300" height="18" fill="#4a90d9" opacity="0.35"/>
  <rect x="40" y="212" width="300" height="18" fill="#e0645c" opacity="0.35"/>
  <text x="346" y="72" fill="#4a90d9">cold top boundary layer</text>
  <text x="346" y="86" fill="#4a90d9">= the lithosphere, 66 km</text>
  <text x="346" y="224" fill="#e0645c">hot bottom boundary layer</text>
  <text x="346" y="238" fill="#e0645c">= D&#8243;, source of plumes</text>

  <g fill="none" stroke="#8a8a8a" stroke-width="1.4">
    <path d="M 90,90 Q 60,145 90,200"/>
    <path d="M 90,200 Q 130,220 170,200"/>
    <path d="M 170,200 Q 200,145 170,90"/>
    <path d="M 170,90 Q 130,72 90,90"/>
    <path d="M 210,90 Q 180,145 210,200"/>
    <path d="M 210,200 Q 250,220 290,200"/>
    <path d="M 290,200 Q 320,145 290,90"/>
    <path d="M 290,90 Q 250,72 210,90"/>
  </g>
  <polygon points="86,140 78,152 94,152" fill="#8a8a8a"/>
  <polygon points="174,150 166,138 182,138" fill="#8a8a8a"/>

  <text x="112" y="150" fill="#8a8a8a">cell width &#8776; layer depth</text>

  <text x="40" y="258" fill="#8a8a8a">Ra = &#945;g&#916;Td&#179;/(&#954;&#957;). Earth&#8217;s whole mantle: Ra &#8776; 1.5 &#215; 10&#8312;,</text>
  <text x="40" y="272" fill="#8a8a8a">against a critical value near 1700. Supercritical by five orders of magnitude.</text>
  <text x="40" y="292" fill="#4a90d9">The lithosphere is not a lid on top of the convection. It IS the convection&#8217;s cold boundary layer.</text>

  <line x1="450" y1="60" x2="450" y2="200" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="462" y="66" fill="#8a8a8a">Ra</text>

  <line x1="444" y1="186" x2="456" y2="186" stroke="#8a8a8a" stroke-width="2"/>
  <text x="466" y="190" fill="#8a8a8a">10&#179;   critical: convection begins</text>
  <line x1="444" y1="146" x2="456" y2="146" stroke="#8a8a8a" stroke-width="2"/>
  <text x="466" y="150" fill="#8a8a8a">10&#8309;   steady rolls</text>
  <line x1="444" y1="106" x2="456" y2="106" stroke="#8a8a8a" stroke-width="2"/>
  <text x="466" y="110" fill="#8a8a8a">10&#8311;   time-dependent, plumes</text>
  <line x1="444" y1="80" x2="456" y2="80" stroke="#e0645c" stroke-width="3"/>
  <text x="466" y="84" fill="#e0645c">10&#8312;   the Earth: hard turbulence</text>

  <text x="450" y="228" fill="#8a8a8a">&#948;/d = (Ra&#8330;/Ra)&#185;&#8341;&#179; and Nu = (Ra/Ra&#8330;)&#185;&#8341;&#179;:</text>
  <text x="450" y="242" fill="#8a8a8a">vigorous convection makes thin boundary</text>
  <text x="450" y="256" fill="#8a8a8a">layers and carries heat far better than</text>
  <text x="450" y="270" fill="#8a8a8a">conduction &#8212; here about forty times better.</text>
</svg>
