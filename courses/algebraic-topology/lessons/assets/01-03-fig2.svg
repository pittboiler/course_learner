<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="330" fill="#ffffff"/>

  <!-- the space X -->
  <ellipse cx="320" cy="150" rx="300" ry="125" fill="#eef2ff" stroke="#111111" stroke-width="1.5"/>
  <text x="55" y="60" fill="#111111" font-size="22" font-style="italic">X</text>

  <!-- path h from x0 to x1 -->
  <path d="M 180 160 C 250 108, 360 108, 428 156" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ah2)"/>
  <text x="304" y="102" fill="#16a34a" font-size="17" text-anchor="middle" font-style="italic">h</text>

  <!-- basepoints -->
  <circle cx="180" cy="160" r="4.5" fill="#111111"/>
  <text x="180" y="184" fill="#111111" font-size="15" text-anchor="middle">x&#8320;</text>
  <circle cx="430" cy="160" r="4.5" fill="#111111"/>
  <text x="418" y="184" fill="#111111" font-size="15" text-anchor="middle">x&#8321;</text>

  <!-- loop gamma at x1 -->
  <ellipse cx="505" cy="155" rx="72" ry="55" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M 499 100 L 499 112 L 513 106 Z" fill="#2563eb"/>
  <text x="540" y="150" fill="#2563eb" font-size="17" text-anchor="middle" font-style="italic">&#947;</text>

  <!-- caption -->
  <text x="320" y="305" fill="#111111" font-size="16" text-anchor="middle">&#946;&#8341;([&#947;]) = [ h &#183; &#947; &#183; h&#772; ] : &#960;&#8321;(X, x&#8321;) &#8594; &#960;&#8321;(X, x&#8320;)</text>
  <text x="320" y="326" fill="#555555" font-size="13" text-anchor="middle">travel h out to x&#8321;, run the loop &#947;, return along h&#772; &#8212; a loop at x&#8320;</text>

  <defs>
    <marker id="ah2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
