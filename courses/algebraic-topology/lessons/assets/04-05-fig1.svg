<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="340" fill="#ffffff"/>

  <defs>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- divider -->
  <line x1="340" y1="24" x2="340" y2="316" stroke="#d0d5da" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- =================== LEFT: n = 1 =================== -->
  <text x="170" y="42" text-anchor="middle" font-size="17" fill="#111">n = 1&#160;&#160;(the line)</text>

  <!-- the real line -->
  <line x1="40" y1="150" x2="300" y2="150" stroke="#111" stroke-width="2.5"/>

  <!-- deformation-retract arrows pushing outward to two points -->
  <line x1="150" y1="150" x2="98" y2="150" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#bl)"/>
  <line x1="190" y1="150" x2="242" y2="150" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#bl)"/>

  <!-- removed point x -->
  <circle cx="170" cy="150" r="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
  <text x="170" y="134" text-anchor="middle" font-size="15" fill="#c0392b">x</text>

  <!-- the two surviving points = S^0 -->
  <circle cx="90"  cy="150" r="5.5" fill="#1d4ed8"/>
  <circle cx="250" cy="150" r="5.5" fill="#1d4ed8"/>

  <text x="170" y="212" text-anchor="middle" font-size="15" fill="#111">&#8477; &#8722; {x}&#160;&#8771;&#160;S&#8304;&#160;(two points)</text>
  <text x="170" y="252" text-anchor="middle" font-size="15.5" fill="#111">H&#8321;(&#8477;, &#8477;&#8722;x) = H&#771;&#8320;(S&#8304;) = &#8484;</text>
  <text x="170" y="276" text-anchor="middle" font-size="13.5" fill="#5a6b7a">and 0 in every other degree</text>

  <!-- =================== RIGHT: n = 2 =================== -->
  <text x="510" y="42" text-anchor="middle" font-size="17" fill="#111">n = 2&#160;&#160;(the plane)</text>

  <!-- local patch of the plane -->
  <circle cx="510" cy="150" r="100" fill="#f3f6fb" stroke="#9fb3c8" stroke-width="1.5"/>

  <!-- radial retract arrows toward the small circle -->
  <line x1="605"   y1="150"   x2="560"   y2="150"   stroke="#1d4ed8" stroke-width="2" marker-end="url(#bl)"/>
  <line x1="557.5" y1="232.3" x2="535"   y2="193.3" stroke="#1d4ed8" stroke-width="2" marker-end="url(#bl)"/>
  <line x1="462.5" y1="232.3" x2="485"   y2="193.3" stroke="#1d4ed8" stroke-width="2" marker-end="url(#bl)"/>
  <line x1="415"   y1="150"   x2="460"   y2="150"   stroke="#1d4ed8" stroke-width="2" marker-end="url(#bl)"/>
  <line x1="462.5" y1="67.7"  x2="485"   y2="106.7" stroke="#1d4ed8" stroke-width="2" marker-end="url(#bl)"/>
  <line x1="557.5" y1="67.7"  x2="535"   y2="106.7" stroke="#1d4ed8" stroke-width="2" marker-end="url(#bl)"/>

  <!-- the surviving circle = S^1 -->
  <circle cx="510" cy="150" r="42" fill="none" stroke="#1a7f37" stroke-width="3"/>

  <!-- removed point x -->
  <circle cx="510" cy="150" r="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
  <text x="524" y="146" font-size="15" fill="#c0392b">x</text>

  <text x="510" y="212" text-anchor="middle" font-size="15" fill="#111">&#8477;&#178; &#8722; {x}&#160;&#8771;&#160;S&#185;&#160;(a circle)</text>
  <text x="510" y="252" text-anchor="middle" font-size="15.5" fill="#111">H&#8322;(&#8477;&#178;, &#8477;&#178;&#8722;x) = H&#771;&#8321;(S&#185;) = &#8484;</text>
  <text x="510" y="276" text-anchor="middle" font-size="13.5" fill="#5a6b7a">and 0 in every other degree</text>

  <!-- caption -->
  <text x="340" y="308" text-anchor="middle" font-size="13" fill="#111">Puncturing &#8477;&#8319; leaves S&#8319;&#8315;&#185;, whose lone reduced class sits in degree n&#8722;1 &#8212; so the &#8484; appears in degree n. Local homology reads off n.</text>
</svg>
