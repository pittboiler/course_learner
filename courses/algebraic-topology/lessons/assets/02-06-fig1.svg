<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>

  <defs>
    <marker id="aRed" markerWidth="10" markerHeight="10" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/>
    </marker>
    <marker id="aBlue" markerWidth="10" markerHeight="10" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="aGreen" markerWidth="10" markerHeight="10" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/>
    </marker>
    <marker id="aPurple" markerWidth="10" markerHeight="10" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9333ea"/>
    </marker>
  </defs>

  <!-- ================= TORUS SQUARE ================= -->
  <text x="170" y="34" fill="#111111" font-size="17" font-weight="bold" text-anchor="middle">Torus  T²</text>

  <!-- faint fill -->
  <rect x="60" y="70" width="200" height="200" fill="#f7f7f7" stroke="none"/>

  <!-- bottom edge a : left to right, red -->
  <line x1="60" y1="270" x2="255" y2="270" stroke="#dc2626" stroke-width="2.6" marker-end="url(#aRed)"/>
  <text x="160" y="292" fill="#dc2626" font-size="16" font-weight="bold" text-anchor="middle">a</text>
  <!-- top edge a : left to right, red -->
  <line x1="60" y1="70" x2="255" y2="70" stroke="#dc2626" stroke-width="2.6" marker-end="url(#aRed)"/>
  <text x="160" y="60" fill="#dc2626" font-size="16" font-weight="bold" text-anchor="middle">a</text>
  <!-- left edge b : bottom to top, blue -->
  <line x1="60" y1="270" x2="60" y2="75" stroke="#2563eb" stroke-width="2.6" marker-end="url(#aBlue)"/>
  <text x="44" y="175" fill="#2563eb" font-size="16" font-weight="bold" text-anchor="middle">b</text>
  <!-- right edge b : bottom to top, blue -->
  <line x1="260" y1="270" x2="260" y2="75" stroke="#2563eb" stroke-width="2.6" marker-end="url(#aBlue)"/>
  <text x="276" y="175" fill="#2563eb" font-size="16" font-weight="bold" text-anchor="middle">b</text>

  <!-- corner vertices (all one point after gluing) -->
  <circle cx="60" cy="70" r="3.5" fill="#111111"/>
  <circle cx="260" cy="70" r="3.5" fill="#111111"/>
  <circle cx="60" cy="270" r="3.5" fill="#111111"/>
  <circle cx="260" cy="270" r="3.5" fill="#111111"/>

  <text x="170" y="330" fill="#111111" font-size="14" text-anchor="middle">boundary word:</text>
  <text x="170" y="352" fill="#111111" font-size="16" text-anchor="middle" font-style="italic">a b a⁻¹ b⁻¹</text>
  <text x="170" y="382" fill="#555555" font-size="13" text-anchor="middle">π₁ = ⟨a, b | aba⁻¹b⁻¹⟩ ≅ Z²</text>

  <!-- divider -->
  <line x1="350" y1="40" x2="350" y2="400" stroke="#dddddd" stroke-width="1"/>

  <!-- ================= GENUS-2 OCTAGON ================= -->
  <text x="555" y="34" fill="#111111" font-size="17" font-weight="bold" text-anchor="middle">Genus-2 surface Σ₂</text>

  <!-- faint fill: octagon polygon -->
  <polygon points="665.9,164.1 600.9,99.1 509.1,99.1 444.1,164.1 444.1,255.9 509.1,320.9 600.9,320.9 665.9,255.9"
           fill="#f7f7f7" stroke="none"/>

  <!-- Edges drawn in GENERATOR direction (arrow = the generator's orientation) -->
  <!-- v0(665.9,164.1) v1(600.9,99.1) v2(509.1,99.1) v3(444.1,164.1) v4(444.1,255.9) v5(509.1,320.9) v6(600.9,320.9) v7(665.9,255.9) -->

  <!-- edge0  a1 : v0 -> v1  (red) -->
  <line x1="665.9" y1="164.1" x2="605" y2="103" stroke="#dc2626" stroke-width="2.6" marker-end="url(#aRed)"/>
  <text x="645" y="122" fill="#dc2626" font-size="15" font-weight="bold">a₁</text>
  <!-- edge1  b1 : v1 -> v2  (blue) -->
  <line x1="600.9" y1="99.1" x2="514" y2="99.1" stroke="#2563eb" stroke-width="2.6" marker-end="url(#aBlue)"/>
  <text x="548" y="88" fill="#2563eb" font-size="15" font-weight="bold">b₁</text>
  <!-- edge2  a1^-1 : reading v2->v3, generator a1 points v3 -> v2  (red) -->
  <line x1="444.1" y1="164.1" x2="505" y2="103" stroke="#dc2626" stroke-width="2.6" marker-end="url(#aRed)"/>
  <text x="452" y="122" fill="#dc2626" font-size="15" font-weight="bold">a₁⁻¹</text>
  <!-- edge3  b1^-1 : reading v3->v4, generator b1 points v4 -> v3  (blue) -->
  <line x1="444.1" y1="255.9" x2="444.1" y2="169" stroke="#2563eb" stroke-width="2.6" marker-end="url(#aBlue)"/>
  <text x="404" y="214" fill="#2563eb" font-size="15" font-weight="bold">b₁⁻¹</text>
  <!-- edge4  a2 : v4 -> v5  (green) -->
  <line x1="444.1" y1="255.9" x2="505" y2="317" stroke="#16a34a" stroke-width="2.6" marker-end="url(#aGreen)"/>
  <text x="452" y="305" fill="#16a34a" font-size="15" font-weight="bold">a₂</text>
  <!-- edge5  b2 : v5 -> v6  (purple) -->
  <line x1="509.1" y1="320.9" x2="596" y2="320.9" stroke="#9333ea" stroke-width="2.6" marker-end="url(#aPurple)"/>
  <text x="548" y="340" fill="#9333ea" font-size="15" font-weight="bold">b₂</text>
  <!-- edge6  a2^-1 : reading v6->v7, generator a2 points v7 -> v6  (green) -->
  <line x1="665.9" y1="255.9" x2="605" y2="317" stroke="#16a34a" stroke-width="2.6" marker-end="url(#aGreen)"/>
  <text x="628" y="305" fill="#16a34a" font-size="15" font-weight="bold">a₂⁻¹</text>
  <!-- edge7  b2^-1 : reading v7->v0, generator b2 points v0 -> v7  (purple) -->
  <line x1="665.9" y1="164.1" x2="665.9" y2="251" stroke="#9333ea" stroke-width="2.6" marker-end="url(#aPurple)"/>
  <text x="672" y="214" fill="#9333ea" font-size="15" font-weight="bold">b₂⁻¹</text>

  <!-- all 8 corners are one vertex after gluing -->
  <circle cx="665.9" cy="164.1" r="3.2" fill="#111111"/>
  <circle cx="600.9" cy="99.1" r="3.2" fill="#111111"/>
  <circle cx="509.1" cy="99.1" r="3.2" fill="#111111"/>
  <circle cx="444.1" cy="164.1" r="3.2" fill="#111111"/>
  <circle cx="444.1" cy="255.9" r="3.2" fill="#111111"/>
  <circle cx="509.1" cy="320.9" r="3.2" fill="#111111"/>
  <circle cx="600.9" cy="320.9" r="3.2" fill="#111111"/>
  <circle cx="665.9" cy="255.9" r="3.2" fill="#111111"/>

  <text x="555" y="382" fill="#555555" font-size="13" text-anchor="middle">π₁ = ⟨a₁,b₁,a₂,b₂ | [a₁,b₁][a₂,b₂]⟩</text>
  <text x="555" y="402" fill="#888888" font-size="12" text-anchor="middle">matching colors glue along the arrow</text>
</svg>
