<svg viewBox="0 0 660 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="660" height="420" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#111111"/>
    </marker>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- ================= THE LINE R, drawn as a rising helix ================= -->
  <text x="210" y="26" fill="#111111" font-size="16" font-style="italic" text-anchor="middle">the line  R  (universal cover)</text>

  <!-- helix coils: back half dashed, front half solid, rising left-to-right in stack -->
  <!-- coil centers rise; rx=85 ry=18 -->
  <!-- coil 4 (top) -->
  <path d="M 125,78 A 85,18 0 0 1 295,78" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="5 4"/>
  <path d="M 125,78 A 85,18 0 0 0 295,78" fill="none" stroke="#111111" stroke-width="1.6"/>
  <!-- coil 3 -->
  <path d="M 125,128 A 85,18 0 0 1 295,128" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="5 4"/>
  <path d="M 125,128 A 85,18 0 0 0 295,128" fill="none" stroke="#111111" stroke-width="1.6"/>
  <!-- coil 2 -->
  <path d="M 125,178 A 85,18 0 0 1 295,178" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="5 4"/>
  <path d="M 125,178 A 85,18 0 0 0 295,178" fill="none" stroke="#111111" stroke-width="1.6"/>
  <!-- coil 1 (bottom) -->
  <path d="M 125,228 A 85,18 0 0 1 295,228" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="5 4"/>
  <path d="M 125,228 A 85,18 0 0 0 295,228" fill="none" stroke="#111111" stroke-width="1.6"/>
  <!-- connectors making it a single spring -->
  <path d="M 295,228 C 305,224 305,182 295,178" fill="none" stroke="#111111" stroke-width="1.6"/>
  <path d="M 295,178 C 305,174 305,132 295,128" fill="none" stroke="#111111" stroke-width="1.6"/>
  <path d="M 295,128 C 305,124 305,82 295,78" fill="none" stroke="#111111" stroke-width="1.6"/>

  <!-- integer tick labels on the fiber over the basepoint (right edge of coils, x=295) -->
  <circle cx="295" cy="228" r="3" fill="#111111"/>
  <circle cx="295" cy="178" r="3" fill="#111111"/>
  <circle cx="295" cy="128" r="3" fill="#111111"/>
  <circle cx="295" cy="78"  r="3" fill="#111111"/>
  <text x="312" y="232" fill="#111111" font-size="13">0</text>
  <text x="312" y="182" fill="#111111" font-size="13">1</text>
  <text x="312" y="132" fill="#111111" font-size="13">2</text>
  <text x="312" y="82"  fill="#111111" font-size="13">3</text>
  <text x="345" y="158" fill="#555555" font-size="12">the fiber</text>
  <text x="345" y="174" fill="#555555" font-size="12">p⁻¹(1) = Z</text>

  <!-- the lift: a blue path climbing the coils from 0 up to 2 (winds twice) -->
  <path d="M 295,228 A 85,18 0 0 0 125,203 A 85,18 0 0 0 295,178 A 85,18 0 0 0 125,153 A 85,18 0 0 0 295,128"
        fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrowB)"/>
  <text x="150" y="112" fill="#2563eb" font-size="13" font-weight="bold">lift γ̃  rises by 2</text>

  <!-- ================= projection p ================= -->
  <line x1="210" y1="252" x2="210" y2="300" stroke="#111111" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="222" y="282" fill="#111111" font-size="15" font-style="italic">p(t) = exp(2πi t)</text>

  <!-- ================= THE CIRCLE S¹ ================= -->
  <text x="210" y="404" fill="#111111" font-size="16" font-style="italic" text-anchor="middle">the circle  S¹</text>
  <ellipse cx="210" cy="350" rx="85" ry="30" fill="none" stroke="#111111" stroke-width="1.8"/>
  <!-- basepoint 1 on the circle -->
  <circle cx="295" cy="350" r="4" fill="#111111"/>
  <text x="303" y="354" fill="#111111" font-size="14">1</text>
  <!-- the loop winding twice (drawn as the same ellipse, red arrow indicating direction) -->
  <path d="M 295,350 A 85,30 0 0 1 125,350" fill="none" stroke="#dc2626" stroke-width="2.4"/>
  <path d="M 125,350 A 85,30 0 0 1 260,375" fill="none" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arrowR)"/>
  <text x="150" y="336" fill="#dc2626" font-size="13" font-weight="bold">loop γ, winds n=2</text>

  <!-- ================= right-hand takeaway ================= -->
  <line x1="420" y1="60" x2="420" y2="380" stroke="#dddddd" stroke-width="1"/>
  <text x="440" y="86"  fill="#111111" font-size="15" font-weight="bold">The dictionary</text>
  <text x="440" y="120" fill="#111111" font-size="14">A loop  γ: S¹ → S¹  based at 1</text>
  <text x="440" y="142" fill="#111111" font-size="14">lifts uniquely to  γ̃: [0,1] → R</text>
  <text x="440" y="164" fill="#111111" font-size="14">with  γ̃(0) = 0.</text>

  <text x="440" y="200" fill="#2563eb" font-size="14" font-weight="bold">deg(γ) = γ̃(1) − γ̃(0) ∈ Z</text>
  <text x="440" y="222" fill="#555555" font-size="13">= how many integers the</text>
  <text x="440" y="240" fill="#555555" font-size="13">lift climbed = winding number.</text>

  <text x="440" y="278" fill="#111111" font-size="14">• surjective:  ωₙ(t) = exp(2πi n t)</text>
  <text x="453" y="298" fill="#555555" font-size="13">has degree n</text>
  <text x="440" y="322" fill="#111111" font-size="14">• injective:  deg 0 ⇒ lift is a</text>
  <text x="453" y="342" fill="#555555" font-size="13">loop in R, contractible</text>
  <text x="440" y="372" fill="#111111" font-size="15" font-weight="bold">⇒  π₁(S¹) ≅ Z</text>
</svg>
