<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="300" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#111"/>
    </marker>
    <marker id="ahR" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#a51d2d"/>
    </marker>
  </defs>

  <text x="390" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">The long exact sequence of the pair (X, A)</text>

  <!-- highlight box behind H_n(X) -->
  <rect x="212" y="132" width="76" height="34" rx="6" fill="#fff3bf" stroke="#e0b000" stroke-width="1.5"/>

  <!-- nodes -->
  <text x="25"  y="160" font-size="20" fill="#111">⋯</text>
  <text x="95"  y="160" text-anchor="middle" font-size="17" fill="#111">Hₙ(A)</text>
  <text x="250" y="160" text-anchor="middle" font-size="17" fill="#111">Hₙ(X)</text>
  <text x="430" y="160" text-anchor="middle" font-size="17" fill="#111">Hₙ(X,A)</text>
  <text x="615" y="160" text-anchor="middle" font-size="17" fill="#111">Hₙ₋₁(A)</text>
  <text x="740" y="160" font-size="20" fill="#111">⋯</text>

  <!-- arrows -->
  <line x1="40"  y1="154" x2="58"  y2="154" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="134" y1="154" x2="210" y2="154" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="290" y1="154" x2="374" y2="154" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="486" y1="154" x2="562" y2="154" stroke="#a51d2d" stroke-width="2.5" marker-end="url(#ahR)"/>
  <line x1="668" y1="154" x2="726" y2="154" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- arrow labels -->
  <text x="172" y="142" text-anchor="middle" font-size="14" fill="#111" font-style="italic">i*</text>
  <text x="332" y="142" text-anchor="middle" font-size="14" fill="#111" font-style="italic">j*</text>
  <text x="524" y="142" text-anchor="middle" font-size="16" fill="#a51d2d" font-weight="bold">∂</text>
  <text x="697" y="142" text-anchor="middle" font-size="14" fill="#111" font-style="italic">i*</text>

  <!-- exactness callout -->
  <line x1="250" y1="168" x2="250" y2="212" stroke="#e0b000" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="250" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">exact at every node:  im(incoming) = ker(outgoing)</text>
  <text x="250" y="256" text-anchor="middle" font-size="14" fill="#111">here  im(i*) = ker(j*)</text>

  <text x="524" y="256" text-anchor="middle" font-size="13" fill="#a51d2d">connecting map:  drop a dimension</text>
  <text x="524" y="274" text-anchor="middle" font-size="13" fill="#a51d2d">relative cycle ↦ its boundary in A</text>
</svg>
