<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#111111"/>
    </marker>
    <marker id="ahc" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- headers -->
  <text x="120" y="46" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Connected covers of S&#185;</text>
  <text x="150" y="46" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111"></text>
  <text x="540" y="46" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Subgroups of &#8484; = &#960;&#8321;(S&#185;)</text>
  <line x1="30" y1="60" x2="690" y2="60" stroke="#111111" stroke-width="1"/>

  <!-- ============ ROW 1 : universal cover R over {0} ============ -->
  <!-- R as a vertical lattice line -->
  <line x1="120" y1="88" x2="120" y2="168" stroke="#111111" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <circle cx="120" cy="102" r="2.6" fill="#111111"/>
  <circle cx="120" cy="118" r="2.6" fill="#111111"/>
  <circle cx="120" cy="134" r="3.4" fill="#c0392b"/>
  <circle cx="120" cy="150" r="2.6" fill="#111111"/>
  <text x="134" y="138" font-size="12" fill="#c0392b">0</text>
  <text x="120" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">&#8477;</text>

  <text x="345" y="132" text-anchor="middle" font-size="24" fill="#111111">&#8596;</text>
  <text x="540" y="132" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">{0}</text>
  <text x="540" y="156" text-anchor="middle" font-size="12" fill="#333333">&#8734; sheets &#183; universal cover</text>

  <line x1="30" y1="200" x2="690" y2="200" stroke="#cccccc" stroke-width="1"/>

  <!-- ============ ROW 2 : 3-fold cover over 3Z ============ -->
  <circle cx="120" cy="260" r="30" fill="none" stroke="#111111" stroke-width="2"/>
  <path d="M120 230 A30 30 0 1 1 96 246" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#ahc)"/>
  <text x="120" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">&#215;3</text>
  <text x="120" y="308" text-anchor="middle" font-size="13" fill="#111111">3-fold cover  z &#8614; z&#179;</text>

  <text x="345" y="262" text-anchor="middle" font-size="24" fill="#111111">&#8596;</text>
  <text x="540" y="262" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">3&#8484;</text>
  <text x="540" y="286" text-anchor="middle" font-size="12" fill="#333333">3 sheets &#183; index 3</text>

  <line x1="30" y1="322" x2="690" y2="322" stroke="#cccccc" stroke-width="1"/>

  <!-- ============ ROW 3 : identity cover over Z ============ -->
  <circle cx="120" cy="372" r="30" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="120" y="416" text-anchor="middle" font-size="13" fill="#111111">S&#185; itself  (identity)</text>

  <text x="345" y="374" text-anchor="middle" font-size="24" fill="#111111">&#8596;</text>
  <text x="540" y="374" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">&#8484;</text>
  <text x="540" y="398" text-anchor="middle" font-size="12" fill="#333333">1 sheet &#183; trivial cover</text>

  <!-- guiding annotation -->
  <text x="670" y="210" text-anchor="end" font-size="11.5" fill="#2c3e50">bigger cover  =  smaller subgroup  =  more sheets</text>
  <line x1="678" y1="90" x2="678" y2="400" stroke="#2c3e50" stroke-width="1.4" marker-start="url(#ah)"/>
</svg>
