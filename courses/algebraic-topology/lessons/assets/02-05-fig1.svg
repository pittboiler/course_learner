<svg viewBox="0 0 660 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="660" height="430" fill="#ffffff"/>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#111111"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="330" y="28" fill="#111111" font-size="17" font-weight="bold" text-anchor="middle">The figure-eight  X = S¹ ∨ S¹,  split into two open sets</text>

  <!-- U : full left circle, highlighted blue -->
  <circle cx="200" cy="230" r="95" fill="none" stroke="#2563eb" stroke-width="8" opacity="0.40"/>
  <!-- blue collar poking onto the right loop near the wedge -->
  <path d="M 300.7 197.5 Q 289 230 300.7 262.5" fill="none" stroke="#2563eb" stroke-width="8" opacity="0.40"/>

  <!-- V : full right circle, highlighted red -->
  <circle cx="390" cy="230" r="95" fill="none" stroke="#dc2626" stroke-width="8" opacity="0.40"/>
  <!-- red collar poking onto the left loop near the wedge -->
  <path d="M 289.3 197.5 Q 301 230 289.3 262.5" fill="none" stroke="#dc2626" stroke-width="8" opacity="0.40"/>

  <!-- the space itself, thin black on top -->
  <circle cx="200" cy="230" r="95" fill="none" stroke="#111111" stroke-width="1.6"/>
  <circle cx="390" cy="230" r="95" fill="none" stroke="#111111" stroke-width="1.6"/>

  <!-- overlap near the wedge point -->
  <circle cx="295" cy="230" r="24" fill="#16a34a" opacity="0.22"/>
  <circle cx="295" cy="230" r="4.5" fill="#111111"/>
  <text x="295" y="222" fill="#111111" font-size="12" text-anchor="middle" font-style="italic">w</text>

  <!-- generator loops with direction -->
  <path d="M 118 195 A 95 95 0 0 0 118 265" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arB)"/>
  <text x="150" y="235" fill="#2563eb" font-size="16" font-weight="bold" text-anchor="middle">a</text>
  <path d="M 472 195 A 95 95 0 0 1 472 265" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arR)"/>
  <text x="440" y="235" fill="#dc2626" font-size="16" font-weight="bold" text-anchor="middle">b</text>

  <!-- labels -->
  <text x="200" y="360" fill="#2563eb" font-size="14" font-weight="bold" text-anchor="middle">U ≃ left loop</text>
  <text x="200" y="378" fill="#2563eb" font-size="13" text-anchor="middle">π₁(U) = ⟨a⟩ ≅ Z</text>
  <text x="390" y="360" fill="#dc2626" font-size="14" font-weight="bold" text-anchor="middle">V ≃ right loop</text>
  <text x="390" y="378" fill="#dc2626" font-size="13" text-anchor="middle">π₁(V) = ⟨b⟩ ≅ Z</text>

  <text x="295" y="400" fill="#16a34a" font-size="13" font-weight="bold" text-anchor="middle">U ∩ V ≃ point  (simply connected)</text>

  <!-- takeaway divider -->
  <line x1="510" y1="70" x2="510" y2="360" stroke="#dddddd" stroke-width="1"/>
  <text x="530" y="150" fill="#111111" font-size="14">no loop in U∩V</text>
  <text x="530" y="170" fill="#111111" font-size="14">to amalgamate ⇒</text>
  <text x="530" y="200" fill="#111111" font-size="15" font-weight="bold">π₁(X) = ⟨a⟩ ∗ ⟨b⟩</text>
  <text x="530" y="228" fill="#111111" font-size="15" font-weight="bold">   = Z ∗ Z = F₂</text>
  <text x="530" y="262" fill="#555555" font-size="12.5">the free group on</text>
  <text x="530" y="280" fill="#555555" font-size="12.5">two generators.</text>
</svg>
