<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="430" fill="#ffffff"/>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111111"/>
    </marker>
    <marker id="ahR" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#dc2626"/>
    </marker>
    <clipPath id="sphere"><circle cx="205" cy="215" r="145"/></clipPath>
  </defs>

  <!-- ============ LEFT: S^2 covered by two overlapping caps ============ -->
  <text x="205" y="34" fill="#111111" font-size="17" font-weight="bold" text-anchor="middle">S²  =  A ∪ B</text>

  <!-- coloured regions, clipped to the sphere disc -->
  <!-- A only (upper cap, above the band) -->
  <rect x="55" y="70" width="300" height="115" fill="#dbe7ff" clip-path="url(#sphere)"/>
  <!-- overlap band A ∩ B (thickened equator) -->
  <rect x="55" y="185" width="300" height="60" fill="#fff2c2" clip-path="url(#sphere)"/>
  <!-- B only (lower cap, below the band) -->
  <rect x="55" y="245" width="300" height="120" fill="#ffdfe4" clip-path="url(#sphere)"/>

  <!-- sphere outline -->
  <circle cx="205" cy="215" r="145" fill="none" stroke="#111111" stroke-width="2"/>

  <!-- band boundary latitudes -->
  <ellipse cx="205" cy="185" rx="133" ry="26" fill="none" stroke="#b8860b" stroke-width="1.6"/>
  <ellipse cx="205" cy="245" rx="133" ry="26" fill="none" stroke="#b8860b" stroke-width="1.6"/>
  <!-- equator = S^1, the retract of the band -->
  <ellipse cx="205" cy="215" rx="141" ry="34" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="7 5"/>

  <!-- labels on the sphere -->
  <text x="205" y="130" fill="#1d4ed8" font-size="16" font-weight="bold" text-anchor="middle">A</text>
  <text x="205" y="320" fill="#be123c" font-size="16" font-weight="bold" text-anchor="middle">B</text>

  <!-- equator callout -->
  <line x1="352" y1="215" x2="392" y2="215" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ahR)"/>
  <text x="398" y="211" fill="#dc2626" font-size="13" font-weight="bold">equator</text>
  <text x="398" y="228" fill="#dc2626" font-size="13" font-weight="bold">≃ S¹</text>

  <text x="205" y="392" fill="#111111" font-size="12.5" text-anchor="middle">A, B = closed caps, each a disc ≃ pt (contractible)</text>
  <text x="205" y="411" fill="#b8860b" font-size="12.5" text-anchor="middle" font-weight="bold">A ∩ B = thickened equator ≃ S¹</text>

  <!-- ============ RIGHT: the engine and its payoff ============ -->
  <line x1="470" y1="55" x2="470" y2="405" stroke="#dddddd" stroke-width="1"/>

  <text x="595" y="90" fill="#111111" font-size="14" font-weight="bold" text-anchor="middle">reduced Mayer–Vietoris,</text>
  <text x="595" y="110" fill="#111111" font-size="14" font-weight="bold" text-anchor="middle">with H̃(A)=H̃(B)=0 :</text>

  <text x="595" y="150" fill="#555555" font-size="13" text-anchor="middle">0 → H̃ₖ(Sⁿ) → H̃ₖ₋₁(A∩B) → 0</text>

  <rect x="500" y="180" width="190" height="46" rx="8" fill="#eef6ee" stroke="#15803d" stroke-width="1.8"/>
  <text x="595" y="200" fill="#15803d" font-size="14" font-weight="bold" text-anchor="middle">H̃ₖ(Sⁿ)  ≅  H̃ₖ₋₁(Sⁿ⁻¹)</text>
  <text x="595" y="219" fill="#15803d" font-size="12" text-anchor="middle">(∂ is an isomorphism)</text>

  <text x="595" y="258" fill="#111111" font-size="13" text-anchor="middle">iterate down to the base case S⁰:</text>

  <text x="595" y="292" fill="#111111" font-size="13.5" text-anchor="middle">H̃ₖ(Sⁿ) ≅ H̃ₖ₋₁(Sⁿ⁻¹) ≅ ⋯ ≅ H̃ₖ₋ₙ(S⁰)</text>

  <rect x="500" y="315" width="190" height="66" rx="8" fill="#eff4ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="595" y="340" fill="#1d4ed8" font-size="14" font-weight="bold" text-anchor="middle">H̃ₖ(Sⁿ) = ℤ  if k = n,</text>
  <text x="595" y="362" fill="#1d4ed8" font-size="14" font-weight="bold" text-anchor="middle">0  otherwise</text>
</svg>
