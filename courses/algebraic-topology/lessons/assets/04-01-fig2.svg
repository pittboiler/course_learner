<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="320" fill="#ffffff"/>
  <defs>
    <marker id="a2" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#1a5fb4"/>
    </marker>
    <marker id="a2r" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#a51d2d"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">The connecting map ∂ : a relative cycle, its boundary lands in A</text>

  <!-- ===== LEFT PANEL: interval (D^1, S^0) ===== -->
  <text x="180" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">X = D¹ = [0,1],   A = S⁰ = {ends}</text>

  <!-- interval -->
  <line x1="70" y1="150" x2="290" y2="150" stroke="#111" stroke-width="2"/>
  <!-- the 1-simplex sigma, drawn as an arc above pointing right -->
  <path d="M 74 128 Q 180 96 286 128" fill="none" stroke="#1a5fb4" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="180" y="104" text-anchor="middle" font-size="14" fill="#1a5fb4" font-style="italic">σ  (a relative 1-cycle)</text>

  <!-- endpoints in A -->
  <circle cx="70"  cy="150" r="6" fill="#a51d2d"/>
  <circle cx="290" cy="150" r="6" fill="#a51d2d"/>
  <text x="70"  y="176" text-anchor="middle" font-size="14" fill="#a51d2d">[0]</text>
  <text x="290" y="176" text-anchor="middle" font-size="14" fill="#a51d2d">[1]</text>

  <text x="180" y="212" text-anchor="middle" font-size="14" fill="#111">∂σ = [1] − [0]  ∈  A</text>
  <text x="180" y="234" text-anchor="middle" font-size="14" fill="#a51d2d">∂[σ] generates reduced H₀(S⁰) = ℤ</text>

  <!-- divider -->
  <line x1="360" y1="52" x2="360" y2="300" stroke="#ccc" stroke-width="1"/>

  <!-- ===== RIGHT PANEL: disk (D^2, S^1) ===== -->
  <text x="540" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">X = D²,   A = S¹ = boundary circle</text>

  <circle cx="540" cy="150" r="66" fill="#dbe9fb" stroke="#a51d2d" stroke-width="3"/>
  <text x="540" y="146" text-anchor="middle" font-size="14" fill="#1a5fb4" font-style="italic">α = the disk</text>
  <text x="540" y="166" text-anchor="middle" font-size="12" fill="#1a5fb4">(relative 2-cycle)</text>

  <!-- boundary arrow indicating orientation -->
  <path d="M 601 133 A 66 66 0 0 1 601 167" fill="none" stroke="#a51d2d" stroke-width="2.5" marker-end="url(#a2r)"/>

  <text x="540" y="256" text-anchor="middle" font-size="14" fill="#111">∂α = boundary circle  ⊂  A</text>
  <text x="540" y="278" text-anchor="middle" font-size="14" fill="#a51d2d">∂[α] generates reduced H₁(S¹) = ℤ</text>
</svg>
