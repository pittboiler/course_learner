<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="500" height="320" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- fixed endpoints -->
  <circle cx="80" cy="160" r="5" fill="#111111"/>
  <circle cx="420" cy="160" r="5" fill="#111111"/>
  <text x="66" y="182" font-size="15" fill="#111111">x&#8320;</text>
  <text x="428" y="182" font-size="15" fill="#111111">x&#8321;</text>

  <!-- family of intermediate curves (grey) -->
  <path d="M80,160 Q250,88 420,160" fill="none" stroke="#9aa0a6" stroke-width="1.6"/>
  <path d="M80,160 Q250,136 420,160" fill="none" stroke="#9aa0a6" stroke-width="1.6"/>
  <path d="M80,160 Q250,184 420,160" fill="none" stroke="#9aa0a6" stroke-width="1.6"/>
  <path d="M80,160 Q250,232 420,160" fill="none" stroke="#9aa0a6" stroke-width="1.6"/>

  <!-- f at t=0 (blue) -->
  <path d="M80,160 Q250,40 420,160" fill="none" stroke="#1a56db" stroke-width="2.8"/>
  <!-- g at t=1 (red) -->
  <path d="M80,160 Q250,280 420,160" fill="none" stroke="#c0392b" stroke-width="2.8"/>

  <text x="235" y="36" font-size="16" fill="#1a56db">f = H&#8320;</text>
  <text x="232" y="300" font-size="16" fill="#c0392b">g = H&#8321;</text>

  <!-- deformation direction arrow -->
  <path d="M462,70 L462,250" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="470" y="165" font-size="14" fill="#111111">t</text>
  <text x="440" y="62" font-size="12" fill="#111111">0</text>
  <text x="440" y="262" font-size="12" fill="#111111">1</text>
</svg>
