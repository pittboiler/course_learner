<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="480" height="320" fill="#ffffff"/>

  <text x="240" y="28" text-anchor="middle" font-size="15" fill="#111">A path-homotopy sweeping loop &#947; to loop &#948;</text>

  <!-- dashed intermediate loops -->
  <path d="M80,170 C130,150 280,150 330,190 C280,230 130,230 80,170 Z"
        fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M80,170 C130,120 280,120 330,160 C280,200 130,200 80,170 Z"
        fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M80,170 C130,90 280,90 330,130 C280,170 130,170 80,170 Z"
        fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- gamma (bottom, solid blue) -->
  <path d="M80,170 C130,175 280,175 330,215 C280,255 130,255 80,170 Z"
        fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="336" y="238" font-size="15" fill="#1d4ed8">&#947;</text>

  <!-- delta (top, solid green) -->
  <path d="M80,170 C130,70 280,70 330,110 C280,150 130,150 80,170 Z"
        fill="none" stroke="#047857" stroke-width="2.5"/>
  <text x="336" y="108" font-size="15" fill="#047857">&#948;</text>

  <!-- basepoint (pinned) -->
  <circle cx="80" cy="170" r="4.5" fill="#111"/>
  <text x="52" y="174" font-size="15" fill="#111">x&#8320;</text>

  <!-- sweep arrow -->
  <line x1="410" y1="230" x2="410" y2="110" stroke="#111" stroke-width="1.8"/>
  <polygon points="404,120 416,120 410,106" fill="#111"/>
  <text x="422" y="176" font-size="13" fill="#111">t</text>
  <text x="384" y="250" font-size="12" fill="#111">t=0</text>
  <text x="384" y="102" font-size="12" fill="#111">t=1</text>
</svg>
