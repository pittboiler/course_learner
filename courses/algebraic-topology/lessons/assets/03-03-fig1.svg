<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="660" height="300" fill="#ffffff"/>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#111"/>
    </marker>
  </defs>

  <!-- ===== LEFT: standard 2-simplex ===== -->
  <text x="150" y="34" text-anchor="middle" font-size="15" fill="#111">Standard 2-simplex &#916;&#178;</text>

  <polygon points="80,240 250,240 165,100" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>

  <circle cx="80"  cy="240" r="4.5" fill="#111"/>
  <circle cx="250" cy="240" r="4.5" fill="#111"/>
  <circle cx="165" cy="100" r="4.5" fill="#111"/>
  <text x="60"  y="258" font-size="15" fill="#111">v&#8320;</text>
  <text x="256" y="258" font-size="15" fill="#111">v&#8321;</text>
  <text x="158" y="92"  font-size="15" fill="#111">v&#8322;</text>

  <text x="150" y="285" text-anchor="middle" font-size="12" fill="#111">a clean, ordered triangle</text>

  <!-- ===== ARROW ===== -->
  <line x1="285" y1="175" x2="375" y2="175" stroke="#111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="330" y="164" text-anchor="middle" font-size="17" fill="#b91c1c">&#963;</text>
  <text x="330" y="196" text-anchor="middle" font-size="11" fill="#111">continuous</text>

  <!-- ===== RIGHT: blobby space X with crumpled image ===== -->
  <text x="510" y="34" text-anchor="middle" font-size="15" fill="#111">A blobby space X</text>

  <!-- the space -->
  <path d="M410,150 C400,90 470,70 520,95 C575,72 630,120 615,175
           C635,225 575,260 520,240 C465,262 400,225 410,150 Z"
        fill="#f3f4f6" stroke="#111" stroke-width="2"/>

  <!-- the singular 2-simplex: image is allowed to crumple / self-touch -->
  <path d="M455,215 C500,150 470,120 520,120 C560,120 540,175 585,150
           C560,205 505,235 455,215 Z"
        fill="none" stroke="#b91c1c" stroke-width="2.5"/>

  <!-- image vertices (two may collide) -->
  <circle cx="455" cy="215" r="4.5" fill="#b91c1c"/>
  <circle cx="520" cy="120" r="4.5" fill="#b91c1c"/>
  <circle cx="585" cy="150" r="4.5" fill="#b91c1c"/>
  <text x="430" y="230" font-size="13" fill="#b91c1c">&#963;(v&#8320;)</text>
  <text x="500" y="112" font-size="13" fill="#b91c1c">&#963;(v&#8322;)</text>
  <text x="592" y="150" font-size="13" fill="#b91c1c">&#963;(v&#8321;)</text>

  <text x="510" y="285" text-anchor="middle" font-size="12" fill="#111">may fold, pinch, or collapse &#8212; still legal</text>
</svg>
