<svg viewBox="0 0 740 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="740" height="420" fill="#ffffff"/>

  <defs>
    <marker id="mB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="mR" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
    <marker id="mG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111111"/>
    </marker>
  </defs>

  <text x="245" y="40" fill="#111111" font-size="16" font-weight="bold" text-anchor="middle">The torus as two glued triangles</text>

  <!-- square corners: BL(120,340) BR(370,340) TL(120,90) TR(370,90) -->
  <!-- shade the two triangles -->
  <polygon points="120,340 370,340 370,90" fill="#2563eb" fill-opacity="0.06"/>
  <polygon points="120,340 120,90 370,90" fill="#dc2626" fill-opacity="0.06"/>

  <!-- ===== edges ===== -->
  <!-- a : bottom (BL->BR) and top (TL->TR), rightward, BLUE -->
  <line x1="120" y1="340" x2="370" y2="340" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="230" y1="340" x2="262" y2="340" stroke="#2563eb" stroke-width="2.6" marker-end="url(#mB)"/>
  <line x1="120" y1="90"  x2="370" y2="90"  stroke="#2563eb" stroke-width="2.6"/>
  <line x1="230" y1="90"  x2="262" y2="90"  stroke="#2563eb" stroke-width="2.6" marker-end="url(#mB)"/>
  <text x="245" y="362" fill="#2563eb" font-size="15" font-weight="bold" text-anchor="middle">a</text>
  <text x="245" y="80"  fill="#2563eb" font-size="15" font-weight="bold" text-anchor="middle">a</text>

  <!-- b : left (BL->TL) and right (BR->TR), upward, RED -->
  <line x1="120" y1="340" x2="120" y2="90" stroke="#dc2626" stroke-width="2.6"/>
  <line x1="120" y1="230" x2="120" y2="198" stroke="#dc2626" stroke-width="2.6" marker-end="url(#mR)"/>
  <line x1="370" y1="340" x2="370" y2="90" stroke="#dc2626" stroke-width="2.6"/>
  <line x1="370" y1="230" x2="370" y2="198" stroke="#dc2626" stroke-width="2.6" marker-end="url(#mR)"/>
  <text x="104" y="220" fill="#dc2626" font-size="15" font-weight="bold" text-anchor="middle">b</text>
  <text x="386" y="220" fill="#dc2626" font-size="15" font-weight="bold" text-anchor="middle">b</text>

  <!-- c : diagonal BL->TR, BLACK -->
  <line x1="120" y1="340" x2="370" y2="90" stroke="#111111" stroke-width="2.4"/>
  <line x1="228" y1="232" x2="252" y2="208" stroke="#111111" stroke-width="2.4" marker-end="url(#mG)"/>
  <text x="258" y="232" fill="#111111" font-size="15" font-weight="bold">c</text>

  <!-- ===== the single vertex v at all four corners ===== -->
  <circle cx="120" cy="340" r="4.5" fill="#111111"/>
  <circle cx="370" cy="340" r="4.5" fill="#111111"/>
  <circle cx="120" cy="90"  r="4.5" fill="#111111"/>
  <circle cx="370" cy="90"  r="4.5" fill="#111111"/>
  <text x="106" y="360" fill="#111111" font-size="13">v</text>
  <text x="378" y="360" fill="#111111" font-size="13">v</text>
  <text x="106" y="84"  fill="#111111" font-size="13">v</text>
  <text x="378" y="84"  fill="#111111" font-size="13">v</text>

  <!-- triangle labels -->
  <text x="300" y="285" fill="#2563eb" font-size="15" font-weight="bold" text-anchor="middle">U = [v&#8320;,v&#8321;,v&#8322;]</text>
  <text x="185" y="165" fill="#dc2626" font-size="15" font-weight="bold" text-anchor="middle">L = [v&#8320;,v&#8321;,v&#8322;]</text>
  <text x="300" y="303" fill="#555555" font-size="11.5" text-anchor="middle">lower</text>
  <text x="185" y="182" fill="#555555" font-size="11.5" text-anchor="middle">upper</text>

  <!-- ===== side panel: the boundaries ===== -->
  <line x1="440" y1="70" x2="440" y2="380" stroke="#dddddd" stroke-width="1"/>
  <text x="462" y="96"  fill="#111111" font-size="14" font-weight="bold">Read off the pieces</text>
  <text x="462" y="122" fill="#111111" font-size="13.5">1 vertex v</text>
  <text x="462" y="142" fill="#111111" font-size="13.5">3 edges a, b, c</text>
  <text x="462" y="162" fill="#111111" font-size="13.5">2 triangles U, L</text>

  <text x="462" y="204" fill="#111111" font-size="13.5" font-weight="bold">Boundary (signs (&#8722;1)&#8305; on face i):</text>
  <text x="462" y="230" fill="#2563eb" font-size="13.5">&#8706;U = [v&#8321;v&#8322;] &#8722; [v&#8320;v&#8322;] + [v&#8320;v&#8321;]</text>
  <text x="480" y="250" fill="#2563eb" font-size="13.5">= b &#8722; c + a</text>
  <text x="462" y="278" fill="#dc2626" font-size="13.5">&#8706;L = [v&#8321;v&#8322;] &#8722; [v&#8320;v&#8322;] + [v&#8320;v&#8321;]</text>
  <text x="480" y="298" fill="#dc2626" font-size="13.5">= a &#8722; c + b</text>

  <text x="462" y="332" fill="#111111" font-size="13.5">Both equal a + b &#8722; c, so</text>
  <text x="462" y="354" fill="#111111" font-size="14.5" font-weight="bold">&#8706;(U &#8722; L) = 0</text>
  <text x="462" y="374" fill="#555555" font-size="12">the 2-cycle behind H&#8322;(T&#178;) = Z</text>
</svg>
