<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- headers -->
  <text x="170" y="30" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Subgroups of &#960;&#8321;(S&#185;) = &#8484;</text>
  <text x="490" y="30" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Connected covers of S&#185;</text>

  <!-- LEFT lattice: Hasse edges -->
  <path d="M170,80 L120,180" stroke="#111111" stroke-width="1.6" fill="none"/>
  <path d="M170,80 L220,230" stroke="#111111" stroke-width="1.6" fill="none"/>
  <path d="M120,180 L170,330" stroke="#111111" stroke-width="1.6" fill="none"/>
  <path d="M220,230 L170,330" stroke="#111111" stroke-width="1.6" fill="none"/>

  <!-- RIGHT lattice: Hasse edges -->
  <path d="M490,80 L440,180" stroke="#111111" stroke-width="1.6" fill="none"/>
  <path d="M490,80 L540,230" stroke="#111111" stroke-width="1.6" fill="none"/>
  <path d="M440,180 L490,330" stroke="#111111" stroke-width="1.6" fill="none"/>
  <path d="M540,230 L490,330" stroke="#111111" stroke-width="1.6" fill="none"/>

  <!-- correspondence (dashed) -->
  <path d="M170,80 L490,80" stroke="#1a56db" stroke-width="1.5" stroke-dasharray="5,4" fill="none"/>
  <path d="M120,180 L440,180" stroke="#1a56db" stroke-width="1.5" stroke-dasharray="5,4" fill="none"/>
  <path d="M220,230 L540,230" stroke="#1a56db" stroke-width="1.5" stroke-dasharray="5,4" fill="none"/>
  <path d="M170,330 L490,330" stroke="#1a56db" stroke-width="1.5" stroke-dasharray="5,4" fill="none"/>

  <!-- LEFT nodes -->
  <circle cx="170" cy="80" r="5" fill="#111111"/>
  <circle cx="120" cy="180" r="5" fill="#111111"/>
  <circle cx="220" cy="230" r="5" fill="#111111"/>
  <circle cx="170" cy="330" r="5" fill="#111111"/>
  <text x="170" y="68" font-size="14" text-anchor="middle" fill="#111111">&#8484; (index 1)</text>
  <text x="108" y="184" font-size="14" text-anchor="end" fill="#111111">2&#8484;</text>
  <text x="208" y="234" font-size="14" text-anchor="end" fill="#111111">3&#8484;</text>
  <text x="170" y="352" font-size="14" text-anchor="middle" fill="#111111">{0} (index &#8734;)</text>

  <!-- RIGHT nodes -->
  <circle cx="490" cy="80" r="5" fill="#c0392b"/>
  <circle cx="440" cy="180" r="5" fill="#c0392b"/>
  <circle cx="540" cy="230" r="5" fill="#c0392b"/>
  <circle cx="490" cy="330" r="5" fill="#c0392b"/>
  <text x="490" y="68" font-size="14" text-anchor="middle" fill="#111111">S&#185; (1 sheet)</text>
  <text x="452" y="176" font-size="14" text-anchor="start" fill="#111111">2-fold</text>
  <text x="552" y="234" font-size="14" text-anchor="start" fill="#111111">3-fold</text>
  <text x="490" y="352" font-size="14" text-anchor="middle" fill="#111111">&#8477; (universal, &#8734; sheets)</text>

  <!-- outer order arrows -->
  <path d="M52,315 L52,95" stroke="#111111" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="30" y="205" font-size="12" text-anchor="middle" fill="#111111" transform="rotate(-90 30 205)">larger subgroup</text>

  <path d="M608,95 L608,315" stroke="#111111" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="632" y="205" font-size="12" text-anchor="middle" fill="#111111" transform="rotate(90 632 205)">larger cover (more sheets)</text>

  <!-- caption -->
  <text x="330" y="386" font-size="12.5" text-anchor="middle" fill="#1a56db">dashed = Galois correspondence: index of subgroup = number of sheets (order-reversing)</text>
</svg>
