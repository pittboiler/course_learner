<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">The pool-boiling curve: flux climbs the nucleate branch to the CHF peak, then a flux-controlled surface jumps (coral) to film boiling.</text>

  <!-- axes -->
  <line x1="70" y1="330" x2="612" y2="330" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="612,330 602,325 602,335" fill="#8a8a8a"/>
  <line x1="70" y1="330" x2="70" y2="48" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,48 65,58 75,58" fill="#8a8a8a"/>
  <text x="300" y="392" fill="#8a8a8a" text-anchor="middle">wall superheat  &#916;T&#8342; = T&#8347; &#8722; T&#8347;&#8336;&#8348;   (log scale)</text>
  <text x="24" y="190" fill="#8a8a8a" text-anchor="middle" transform="rotate(-90 24 190)">heat flux  q''  (log scale)</text>

  <!-- region separators -->
  <line x1="191" y1="330" x2="191" y2="60" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 4"/>
  <line x1="326" y1="330" x2="326" y2="114" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 4"/>
  <line x1="430" y1="330" x2="430" y2="206" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 4"/>

  <!-- CHF level reference -->
  <line x1="70" y1="114" x2="600" y2="114" stroke="#8a8a8a" stroke-width="0.7" stroke-dasharray="2 5"/>
  <text x="150" y="108" fill="#8a8a8a" font-size="11">q''&#8344;&#8336;&#8339; &#8776; 1 MW/m&#178;</text>

  <!-- the boiling curve -->
  <path d="M 101 314 L 191 238 L 243 173 L 295 130 L 326 114 L 378 168 L 430 206 L 521 152 L 590 114"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- CHF peak marker -->
  <circle cx="326" cy="114" r="4.5" fill="#e0645c"/>
  <text x="332" y="104" fill="#e0645c" font-size="11">CHF peak (max flux)</text>

  <!-- Leidenfrost minimum marker -->
  <circle cx="430" cy="206" r="4.5" fill="#e0645c"/>
  <text x="436" y="224" fill="#e0645c" font-size="11">Leidenfrost min</text>

  <!-- flux-controlled jump arrow -->
  <line x1="332" y1="114" x2="583" y2="114" stroke="#e0645c" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="590,114 579,109 579,119" fill="#e0645c"/>
  <text x="420" y="88" fill="#e0645c" font-size="11" text-anchor="middle">flux held fixed &#8594; T&#8347; leaps hundreds of K &#8594; burnout</text>

  <!-- region labels -->
  <text x="130" y="352" fill="#8a8a8a" font-size="11" text-anchor="middle">natural</text>
  <text x="130" y="365" fill="#8a8a8a" font-size="11" text-anchor="middle">convection</text>
  <text x="258" y="352" fill="#4a90d9" font-size="11" text-anchor="middle">nucleate boiling</text>
  <text x="378" y="352" fill="#8a8a8a" font-size="11" text-anchor="middle">transition</text>
  <text x="512" y="352" fill="#8a8a8a" font-size="11" text-anchor="middle">film boiling</text>
</svg>
