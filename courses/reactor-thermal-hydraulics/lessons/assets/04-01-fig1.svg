<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Buoyancy engine: the light hot column rises, the heavy cold column sinks &#8212; a self-sustaining loop, no pump.</text>

  <!-- ===== the loop rectangle ===== -->
  <!-- left leg: core / riser (hot, rising) -->
  <line x1="200" y1="330" x2="200" y2="100" stroke="#e0645c" stroke-width="4"/>
  <!-- top leg: hot leg to sink -->
  <line x1="200" y1="100" x2="440" y2="100" stroke="#8a8a8a" stroke-width="3"/>
  <!-- right leg: heat sink / downcomer (cold, falling) -->
  <line x1="440" y1="100" x2="440" y2="330" stroke="#4a90d9" stroke-width="4"/>
  <!-- bottom leg: cold leg back to core -->
  <line x1="440" y1="330" x2="200" y2="330" stroke="#8a8a8a" stroke-width="3"/>

  <!-- circulation arrows -->
  <!-- up on left leg -->
  <polygon points="200,196 194,210 206,210" fill="#e0645c"/>
  <!-- right on top -->
  <polygon points="330,100 316,94 316,106" fill="#8a8a8a"/>
  <!-- down on right leg -->
  <polygon points="440,234 434,220 446,220" fill="#4a90d9"/>
  <!-- left on bottom -->
  <polygon points="310,330 324,324 324,336" fill="#8a8a8a"/>

  <!-- ===== core (heat source) ===== -->
  <rect x="176" y="250" width="48" height="80" fill="#e0645c" opacity="0.15" stroke="#e0645c" stroke-width="2"/>
  <text x="184" y="356" fill="#e0645c">core</text>
  <!-- heat in -->
  <line x1="130" y1="290" x2="174" y2="290" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="174,290 162,285 162,295" fill="#e0645c"/>
  <text x="120" y="278" fill="#e0645c">q (decay heat)</text>

  <!-- ===== heat sink ===== -->
  <rect x="416" y="100" width="48" height="80" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="470" y="140" fill="#4a90d9">heat sink</text>
  <!-- heat out -->
  <line x1="466" y1="118" x2="510" y2="118" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="510,118 498,113 498,123" fill="#4a90d9"/>
  <text x="470" y="112" fill="#4a90d9">q out</text>

  <!-- density labels -->
  <text x="150" y="170" fill="#e0645c">&#961;</text>
  <text x="164" y="170" fill="#8a8a8a" font-size="11">hot</text>
  <text x="150" y="188" fill="#8a8a8a" font-size="11">(light, up)</text>
  <text x="452" y="250" fill="#4a90d9">&#961;</text>
  <text x="466" y="250" fill="#8a8a8a" font-size="11">cold</text>
  <text x="452" y="268" fill="#8a8a8a" font-size="11">(heavy, down)</text>

  <!-- loop height H dimension -->
  <line x1="96" y1="100" x2="96" y2="330" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="96,100 91,112 101,112" fill="#8a8a8a"/>
  <polygon points="96,330 91,318 101,318" fill="#8a8a8a"/>
  <line x1="96" y1="100" x2="196" y2="100" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 4"/>
  <line x1="96" y1="330" x2="196" y2="330" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3 4"/>
  <text x="72" y="220" fill="#8a8a8a">H</text>

  <!-- driving-head note -->
  <text x="252" y="216" fill="#8a8a8a" font-size="12">&#916;p</text>
  <text x="272" y="216" fill="#8a8a8a" font-size="12">= (&#961;</text>
  <text x="300" y="216" fill="#8a8a8a" font-size="12">cold</text>
  <text x="326" y="216" fill="#8a8a8a" font-size="12">&#8722; &#961;</text>
  <text x="348" y="216" fill="#8a8a8a" font-size="12">hot</text>
  <text x="370" y="216" fill="#8a8a8a" font-size="12">) g H</text>
</svg>
