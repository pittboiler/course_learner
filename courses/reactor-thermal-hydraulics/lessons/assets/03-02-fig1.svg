<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Wall T_w (coral) crosses T_sat near the midplane and boils; bulk T_b (blue) stays left of T_sat the whole way &#8212; subcooled.</text>

  <!-- ===== Panel A: channel with the subcooled-boiling band ===== -->
  <line x1="70" y1="65" x2="70" y2="330" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="110" y1="65" x2="110" y2="330" stroke="#8a8a8a" stroke-width="2"/>
  <rect x="70" y="65" width="40" height="265" fill="#4a90d9" opacity="0.08"/>

  <!-- subcooled-boiling band -->
  <rect x="70" y="109" width="40" height="92" fill="#e0645c" opacity="0.16"/>
  <circle cx="82" cy="180" r="3" fill="#e0645c" opacity="0.7"/>
  <circle cx="96" cy="165" r="2.4" fill="#e0645c" opacity="0.7"/>
  <circle cx="88" cy="145" r="3.2" fill="#e0645c" opacity="0.7"/>
  <circle cx="99" cy="128" r="2.2" fill="#e0645c" opacity="0.7"/>
  <circle cx="80" cy="120" r="2.6" fill="#e0645c" opacity="0.7"/>

  <!-- flow chevrons -->
  <path d="M 80 312 L 90 303 L 100 312" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <path d="M 80 278 L 90 269 L 100 278" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <path d="M 80 90 L 90 81 L 100 90" fill="none" stroke="#4a90d9" stroke-width="2"/>

  <text x="60" y="348" fill="#4a90d9">inlet</text>
  <text x="58" y="58" fill="#e0645c">outlet</text>
  <text x="118" y="158" fill="#e0645c">subcooled</text>
  <text x="118" y="173" fill="#e0645c">boiling</text>

  <!-- ===== Panel B: T(z) plot ===== -->
  <!-- z axis (vertical, elevation up) -->
  <line x1="197.5" y1="330" x2="197.5" y2="62" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="197.5,62 192.5,72 202.5,72" fill="#8a8a8a"/>
  <text x="185" y="70" fill="#8a8a8a">z</text>

  <!-- T axis (horizontal) -->
  <line x1="197.5" y1="330" x2="600" y2="330" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="600,330 590,325 590,335" fill="#8a8a8a"/>
  <text x="575" y="350" fill="#8a8a8a">T</text>

  <!-- T_sat vertical reference -->
  <line x1="500" y1="330" x2="500" y2="65" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="484" y="60" fill="#8a8a8a">T_sat</text>
  <text x="440" y="352" fill="#8a8a8a">&#916;T_sat,ONB (&#8776;1 K, exaggerated)</text>

  <!-- bulk temperature T_b(z) -->
  <path d="M 197.5 330 L 230.5 263 L 307.5 197.5 L 362.5 153 L 384.5 131 L 401 109 L 417.5 65"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="360" y="86" fill="#4a90d9">T_b(z)</text>

  <!-- wall temperature T_w(z) -->
  <path d="M 197.5 330 L 373.5 263 L 505.5 197.5 L 533 153 L 527.5 131 L 500 109 L 417.5 65"
        fill="none" stroke="#e0645c" stroke-width="3"/>
  <text x="537" y="150" fill="#e0645c">T_w(z)</text>

  <!-- ONB point -->
  <circle cx="500" cy="201" r="4.5" fill="#e0645c"/>
  <line x1="500" y1="201" x2="540" y2="225" stroke="#8a8a8a" stroke-width="1"/>
  <text x="512" y="240" fill="#e0645c">ONB</text>

  <!-- subcooled-boiling elevation bracket -->
  <line x1="186" y1="201" x2="186" y2="109" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="182" y1="201" x2="190" y2="201" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="182" y1="109" x2="190" y2="109" stroke="#e0645c" stroke-width="1.5"/>

  <!-- inlet / outlet markers -->
  <circle cx="197.5" cy="330" r="3.5" fill="#4a90d9"/>
  <text x="150" y="334" fill="#8a8a8a">T_in</text>
  <circle cx="417.5" cy="65" r="3.5" fill="#4a90d9"/>
  <text x="345" y="60" fill="#8a8a8a">bulk never reaches T_sat</text>
</svg>
