<svg viewBox="0 0 620 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#8a8a8a">Pin cross-section and its per-unit-length resistance chain</text>

  <!-- concentric cross-section -->
  <circle cx="150" cy="160" r="112" fill="#8a8a8a" fill-opacity="0.12" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="150" cy="160" r="86" fill="#e0645c" fill-opacity="0.20" stroke="#e0645c" stroke-width="1.5"/>
  <circle cx="150" cy="160" r="74" fill="#4a90d9" fill-opacity="0.16" stroke="#4a90d9" stroke-width="1.5"/>
  <circle cx="150" cy="160" r="2.5" fill="#8a8a8a"/>

  <!-- outward heat-flow arrow -->
  <line x1="150" y1="160" x2="252" y2="160" stroke="#e0645c" stroke-width="1.8"/>
  <polygon points="252,160 244,156 244,164" fill="#e0645c"/>
  <text x="205" y="152" text-anchor="middle" font-size="13" fill="#e0645c">q&#8242; out</text>
  <text x="150" y="181" text-anchor="middle" font-size="12" fill="#8a8a8a">T&#8320;</text>

  <!-- legend -->
  <rect x="300" y="72" width="16" height="16" fill="#4a90d9" fill-opacity="0.16" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="324" y="85" font-size="13" fill="#8a8a8a">Fuel pellet (UO&#8322;), k_f &#8776; 3 W/m&#183;K</text>
  <rect x="300" y="100" width="16" height="16" fill="#e0645c" fill-opacity="0.20" stroke="#e0645c" stroke-width="1.5"/>
  <text x="324" y="113" font-size="13" fill="#8a8a8a">Gap: He + fission gas, h_g</text>
  <rect x="300" y="128" width="16" height="16" fill="#8a8a8a" fill-opacity="0.12" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="324" y="141" font-size="13" fill="#8a8a8a">Cladding (Zircaloy), k_c &#8776; 17 W/m&#183;K</text>

  <!-- radius call-outs -->
  <text x="300" y="188" font-size="12" fill="#8a8a8a">r_g &#8776; pellet surface = gap radius</text>
  <text x="300" y="208" font-size="12" fill="#8a8a8a">r_ci , r_co = clad inner, outer radii</text>
  <text x="300" y="238" font-size="12" fill="#8a8a8a">Series drop: hotter at the centre,</text>
  <text x="300" y="256" font-size="12" fill="#8a8a8a">each layer sheds a share of it.</text>

  <!-- resistance circuit -->
  <line x1="70" y1="360" x2="120" y2="360" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="200" y1="360" x2="250" y2="360" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="330" y1="360" x2="380" y2="360" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="460" y1="360" x2="510" y2="360" stroke="#8a8a8a" stroke-width="1.8"/>

  <!-- nodes -->
  <circle cx="70" cy="360" r="4" fill="#4a90d9"/>
  <circle cx="200" cy="360" r="4" fill="#8a8a8a"/>
  <circle cx="330" cy="360" r="4" fill="#8a8a8a"/>
  <circle cx="510" cy="360" r="4" fill="#8a8a8a"/>

  <!-- resistor boxes -->
  <rect x="120" y="343" width="80" height="34" fill="#4a90d9" fill-opacity="0.14" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="160" y="365" text-anchor="middle" font-size="14" fill="#4a90d9">R&#8242;_f</text>
  <rect x="250" y="343" width="80" height="34" fill="#e0645c" fill-opacity="0.18" stroke="#e0645c" stroke-width="1.5"/>
  <text x="290" y="365" text-anchor="middle" font-size="14" fill="#e0645c">R&#8242;_g</text>
  <rect x="380" y="343" width="80" height="34" fill="#8a8a8a" fill-opacity="0.14" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="420" y="365" text-anchor="middle" font-size="14" fill="#8a8a8a">R&#8242;_c</text>

  <!-- node labels -->
  <text x="70" y="398" text-anchor="middle" font-size="13" fill="#4a90d9">T&#8320;</text>
  <text x="70" y="414" text-anchor="middle" font-size="11" fill="#8a8a8a">centre</text>
  <text x="200" y="398" text-anchor="middle" font-size="13" fill="#8a8a8a">Ts</text>
  <text x="200" y="414" text-anchor="middle" font-size="11" fill="#8a8a8a">pellet surf.</text>
  <text x="330" y="398" text-anchor="middle" font-size="13" fill="#8a8a8a">Tci</text>
  <text x="330" y="414" text-anchor="middle" font-size="11" fill="#8a8a8a">clad inner</text>
  <text x="510" y="398" text-anchor="middle" font-size="13" fill="#8a8a8a">Tco</text>
  <text x="510" y="414" text-anchor="middle" font-size="11" fill="#8a8a8a">clad outer</text>

  <!-- resistor formulas -->
  <text x="160" y="336" text-anchor="middle" font-size="11" fill="#8a8a8a">1/(4&#960;k_f)</text>
  <text x="290" y="336" text-anchor="middle" font-size="11" fill="#8a8a8a">1/(2&#960;r_g h_g)</text>
  <text x="420" y="336" text-anchor="middle" font-size="11" fill="#8a8a8a">ln(r_co/r_ci)/(2&#960;k_c)</text>

  <text x="290" y="446" text-anchor="middle" font-size="13" fill="#8a8a8a">q&#8242; = (T&#8320; &#8722; Tco) / (R&#8242;_f + R&#8242;_g + R&#8242;_c)</text>
</svg>
