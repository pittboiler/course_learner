<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Decay heat P/P&#8320; after scram (Wigner&#8211;Way, log&#8211;log): a straight power law falling from ~6.5% but never reaching zero.</text>

  <!-- plot frame axes -->
  <line x1="70" y1="50" x2="70" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="70" y1="290" x2="560" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- horizontal gridlines: 10%, 1%, 0.1% -->
  <line x1="70" y1="50" x2="560" y2="50" stroke="#8a8a8a" stroke-width="0.7" stroke-dasharray="2 5"/>
  <line x1="70" y1="170" x2="560" y2="170" stroke="#8a8a8a" stroke-width="0.7" stroke-dasharray="2 5"/>
  <line x1="70" y1="290" x2="560" y2="290" stroke="#8a8a8a" stroke-width="0.7" stroke-dasharray="2 5"/>
  <text x="38" y="54" fill="#8a8a8a">10%</text>
  <text x="44" y="174" fill="#8a8a8a">1%</text>
  <text x="36" y="294" fill="#8a8a8a">0.1%</text>

  <!-- vertical decade gridlines and tick labels -->
  <line x1="151.7" y1="50" x2="151.7" y2="290" stroke="#8a8a8a" stroke-width="0.7" stroke-dasharray="2 5"/>
  <line x1="233.3" y1="50" x2="233.3" y2="290" stroke="#8a8a8a" stroke-width="0.7" stroke-dasharray="2 5"/>
  <line x1="315" y1="50" x2="315" y2="290" stroke="#8a8a8a" stroke-width="0.7" stroke-dasharray="2 5"/>
  <line x1="396.7" y1="50" x2="396.7" y2="290" stroke="#8a8a8a" stroke-width="0.7" stroke-dasharray="2 5"/>
  <line x1="478.3" y1="50" x2="478.3" y2="290" stroke="#8a8a8a" stroke-width="0.7" stroke-dasharray="2 5"/>
  <text x="63" y="306" fill="#8a8a8a">1</text>
  <text x="143" y="306" fill="#8a8a8a">10</text>
  <text x="222" y="306" fill="#8a8a8a">100</text>
  <text x="305" y="306" fill="#8a8a8a">1k</text>
  <text x="386" y="306" fill="#8a8a8a">10k</text>
  <text x="466" y="306" fill="#8a8a8a">100k</text>
  <text x="551" y="306" fill="#8a8a8a">1M</text>
  <text x="250" y="328" fill="#8a8a8a">time after shutdown (s)</text>

  <!-- decay-heat power law: log10(P/P0 %) = 0.8195 - 0.2 log10(t), straight in log-log -->
  <line x1="70" y1="71.7" x2="560" y2="215.6" stroke="#4a90d9" stroke-width="3"/>

  <!-- key-time markers -->
  <circle cx="70" cy="71.7" r="4" fill="#e0645c"/>
  <text x="80" y="66" fill="#e0645c">&#8776;6.5% at scram</text>

  <circle cx="233.3" cy="119.7" r="4" fill="#e0645c"/>
  <text x="240" y="113" fill="#e0645c">100 s: ~2.6%</text>

  <circle cx="360.4" cy="157" r="4" fill="#e0645c"/>
  <text x="368" y="150" fill="#e0645c">1 h: ~1.3%</text>

  <circle cx="473" cy="190" r="4" fill="#e0645c"/>
  <text x="392" y="184" fill="#e0645c">1 day: ~0.5%</text>

  <!-- y-axis title -->
  <text x="18" y="44" fill="#8a8a8a">P/P&#8320;</text>
</svg>
