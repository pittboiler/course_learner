<svg viewBox="0 0 660 375" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="40" y="20" fill="#8a8a8a" font-style="italic">All three temperatures meet at the ends (q'=0 there) and fan apart in the core.</text>
  <text x="40" y="37" fill="#8a8a8a" font-style="italic">Each peaks ABOVE the midplane; the smaller the resistance, the further downstream the peak.</text>

  <!-- vertical temperature axis -->
  <line x1="58" y1="330" x2="58" y2="58" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="58,58 53,68 63,68" fill="#8a8a8a"/>
  <text x="46" y="60" fill="#8a8a8a">T</text>

  <!-- horizontal channel (z) axis -->
  <line x1="58" y1="330" x2="620" y2="330" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="620,330 610,325 610,335" fill="#8a8a8a"/>
  <text x="600" y="350" fill="#8a8a8a">z</text>

  <!-- coolant flow arrow -->
  <line x1="90" y1="70" x2="150" y2="70" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="150,70 141,66 141,74" fill="#8a8a8a"/>
  <text x="90" y="64" fill="#8a8a8a">coolant flow up the channel</text>

  <!-- midplane marker -->
  <line x1="330" y1="64" x2="330" y2="330" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="286" y="346" fill="#8a8a8a">midplane 0</text>
  <text x="60" y="346" fill="#8a8a8a">inlet &#8722;L/2</text>
  <text x="556" y="346" fill="#8a8a8a">outlet +L/2</text>

  <!-- faint cosine flux q'(z) -->
  <path d="M 70 322 L 122 316.4 L 174 311.4 L 226 307.4 L 278 304.9 L 330 304 L 356 304.2 L 382 304.9 L 408 306 L 434 307.4 L 486 311.4 L 538 316.4 L 590 322"
        fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.8"/>
  <text x="300" y="320" fill="#8a8a8a" font-size="11">q'(z)</text>

  <!-- coolant bulk T_b (monotonic S-rise) -->
  <path d="M 70 300 L 122 298.5 L 174 294.1 L 226 287.2 L 278 278.6 L 330 269 L 356 264.2 L 382 259.4 L 408 254.9 L 434 250.8 L 486 243.9 L 538 239.5 L 590 238"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- clad surface T_co (dashed blue, peak modestly above midplane) -->
  <path d="M 70 300 L 122 276.5 L 174 252.2 L 226 229.5 L 278 210.8 L 330 197.7 L 356 193.7 L 382 191.6 L 408 191.4 L 434 193.1 L 486 202 L 538 217.5 L 590 238"
        fill="none" stroke="#4a90d9" stroke-width="2" stroke-dasharray="7 4"/>

  <!-- fuel centerline T_0 (coral, tall hump, peak just above midplane) -->
  <path d="M 70 300 L 122 241 L 174 184.7 L 226 136.8 L 278 101.7 L 330 83 L 356 80.4 L 382 82.5 L 408 89.2 L 434 100.3 L 486 134.6 L 538 182 L 590 238"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>

  <!-- peak markers -->
  <line x1="356" y1="80.4" x2="356" y2="330" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="356" cy="80.4" r="3.5" fill="#e0645c"/>
  <line x1="398" y1="191.4" x2="398" y2="330" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="398" cy="191.4" r="3.5" fill="#4a90d9"/>

  <!-- peak elevation labels -->
  <text x="349" y="325" fill="#e0645c" font-size="11">z<tspan dy="3" font-size="9">0</tspan></text>
  <text x="401" y="240" fill="#4a90d9" font-size="11">z<tspan dy="3" font-size="9">co</tspan></text>

  <!-- curve labels -->
  <text x="150" y="150" fill="#e0645c">T<tspan dy="3" font-size="9">0</tspan><tspan dy="-3"> fuel centerline</tspan></text>
  <text x="452" y="205" fill="#4a90d9">T<tspan dy="3" font-size="9">co</tspan><tspan dy="-3"> clad surface</tspan></text>
  <text x="452" y="252" fill="#4a90d9">T<tspan dy="3" font-size="9">b</tspan><tspan dy="-3"> coolant bulk</tspan></text>

  <!-- scale note -->
  <text x="452" y="300" fill="#8a8a8a" font-size="10" font-style="italic">vertical scale schematic:</text>
  <text x="452" y="313" fill="#8a8a8a" font-size="10" font-style="italic">centerline drop compressed</text>
</svg>
