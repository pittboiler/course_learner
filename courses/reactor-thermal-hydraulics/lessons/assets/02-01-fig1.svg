<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Coolant climbs the channel absorbing q' dz per slice; its bulk temperature T_b rises inlet to outlet (m = mass flow rate).</text>

  <!-- ===== Panel A: heated channel with a control-volume slice ===== -->

  <!-- channel walls -->
  <line x1="100" y1="55" x2="100" y2="330" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="158" y1="55" x2="158" y2="330" stroke="#8a8a8a" stroke-width="2"/>
  <rect x="100" y="55" width="58" height="275" fill="#4a90d9" opacity="0.08"/>

  <!-- upward flow chevrons -->
  <path d="M 118 300 L 129 290 L 140 300" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <path d="M 118 258 L 129 248 L 140 258" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <path d="M 118 118 L 129 108 L 140 118" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <path d="M 118 88 L 129 78 L 140 88" fill="none" stroke="#4a90d9" stroke-width="2"/>

  <!-- inlet / outlet labels -->
  <line x1="90" y1="330" x2="168" y2="330" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="88" y="350" fill="#4a90d9">inlet: T_b = T_in</text>
  <line x1="90" y1="55" x2="168" y2="55" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="86" y="46" fill="#e0645c">outlet: T_b = T_out</text>

  <!-- control-volume slice dz -->
  <rect x="100" y="180" width="58" height="30" fill="#e0645c" opacity="0.14" stroke="#e0645c" stroke-width="1.5"/>
  <text x="164" y="199" fill="#8a8a8a">dz</text>

  <!-- q' dz heat into the slice -->
  <line x1="52" y1="195" x2="98" y2="195" stroke="#e0645c" stroke-width="2"/>
  <polygon points="98,195 89,191 89,199" fill="#e0645c"/>
  <text x="30" y="184" fill="#e0645c">q' dz</text>

  <!-- energy streams -->
  <line x1="129" y1="230" x2="129" y2="212" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="129,210 125,219 133,219" fill="#4a90d9"/>
  <text x="138" y="228" fill="#4a90d9">in: m cp T_b</text>
  <line x1="129" y1="178" x2="129" y2="160" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="129,158 125,167 133,167" fill="#4a90d9"/>
  <text x="138" y="152" fill="#4a90d9">out: m cp (T_b + dT_b)</text>

  <!-- ===== Panel B: T_b(z) profile ===== -->

  <!-- z axis (vertical) -->
  <line x1="400" y1="330" x2="400" y2="58" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="400,58 395,68 405,68" fill="#8a8a8a"/>
  <text x="388" y="66" fill="#8a8a8a">z</text>

  <!-- T axis (horizontal) -->
  <line x1="400" y1="330" x2="600" y2="330" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="600,330 590,325 590,335" fill="#8a8a8a"/>
  <text x="580" y="350" fill="#8a8a8a">T_b</text>

  <!-- uniform-power reference: straight line, same total rise -->
  <line x1="400" y1="320" x2="520" y2="60" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="446" y="300" fill="#8a8a8a">uniform</text>

  <!-- cosine-power profile: integrated sine (S-curve) -->
  <path d="M 400 320 L 402.9 294 L 411.5 268 L 424.7 242 L 441.4 216 L 460 190 L 478.6 164 L 495.3 138 L 508.6 112 L 517 86 L 520 60"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="522" y="96" fill="#4a90d9">cosine</text>

  <!-- inlet / outlet markers -->
  <circle cx="400" cy="320" r="3.5" fill="#4a90d9"/>
  <text x="352" y="324" fill="#8a8a8a">T_in</text>
  <circle cx="520" cy="60" r="3.5" fill="#e0645c"/>
  <text x="504" y="52" fill="#e0645c">T_out</text>

  <!-- steepest-slope marker at midplane -->
  <line x1="460" y1="190" x2="486" y2="196" stroke="#e0645c" stroke-width="1.5"/>
  <text x="466" y="212" fill="#e0645c">steepest at midplane</text>
</svg>
