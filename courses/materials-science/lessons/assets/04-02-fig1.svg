<svg viewBox="0 0 420 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mGrey" markerWidth="10" markerHeight="10" refX="8.5" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#8a8a8a"/>
    </marker>
    <marker id="mCoral" markerWidth="10" markerHeight="10" refX="8.5" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#e0645c"/>
    </marker>
    <marker id="mBlue" markerWidth="10" markerHeight="10" refX="8.5" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#4a90d9"/>
    </marker>
  </defs>

  <!-- single-crystal cylinder under tension -->
  <rect x="116" y="70" width="68" height="230" fill="#4a90d9" fill-opacity="0.12" stroke="none"/>
  <line x1="116" y1="70" x2="116" y2="300" stroke="#4a90d9" stroke-width="1.6"/>
  <line x1="184" y1="70" x2="184" y2="300" stroke="#4a90d9" stroke-width="1.6"/>
  <ellipse cx="150" cy="300" rx="34" ry="11" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="1.6"/>
  <ellipse cx="150" cy="70" rx="34" ry="11" fill="#4a90d9" fill-opacity="0.18" stroke="#4a90d9" stroke-width="1.6"/>

  <!-- tensile load -->
  <line x1="150" y1="58" x2="150" y2="26" stroke="#8a8a8a" stroke-width="2" marker-end="url(#mGrey)"/>
  <line x1="150" y1="312" x2="150" y2="344" stroke="#8a8a8a" stroke-width="2" marker-end="url(#mGrey)"/>
  <text x="163" y="40" font-size="15" fill="#8a8a8a">&#963;</text>
  <text x="163" y="336" font-size="15" fill="#8a8a8a">&#963;</text>

  <!-- inclined slip plane (disc), normal perpendicular to it -->
  <ellipse cx="150" cy="190" rx="58" ry="15" fill="#e0645c" fill-opacity="0.13" stroke="#e0645c" stroke-width="1.2" stroke-opacity="0.7" transform="rotate(35 150 190)"/>

  <!-- vertical axis reference through the point -->
  <line x1="150" y1="190" x2="150" y2="112" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="141" y="106" font-size="12" fill="#8a8a8a">axis</text>

  <!-- slip-plane normal n at angle phi from axis -->
  <line x1="150" y1="190" x2="195" y2="126" stroke="#e0645c" stroke-width="2" marker-end="url(#mCoral)"/>
  <text x="198" y="122" font-size="14" fill="#e0645c">n</text>

  <!-- slip direction b in the plane at angle lambda from axis -->
  <line x1="150" y1="190" x2="93" y2="150" stroke="#4a90d9" stroke-width="2" marker-end="url(#mBlue)"/>
  <text x="78" y="146" font-size="14" fill="#4a90d9">b</text>

  <!-- angle arcs -->
  <path d="M150,160 A30,30 0 0 1 167,165" fill="none" stroke="#e0645c" stroke-width="1.2"/>
  <text x="169" y="156" font-size="13" fill="#e0645c">&#966;</text>
  <path d="M150,146 A44,44 0 0 0 114,165" fill="none" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="120" y="150" font-size="13" fill="#4a90d9">&#955;</text>

  <circle cx="150" cy="190" r="2.4" fill="#8a8a8a"/>

  <!-- caption -->
  <text x="210" y="205" font-size="12" fill="#8a8a8a">n = slip-plane normal</text>
  <text x="210" y="222" font-size="12" fill="#8a8a8a">b = slip direction</text>
  <text x="210" y="239" font-size="12" fill="#e0645c">&#966; = axis&#8211;to&#8211;normal angle</text>
  <text x="210" y="256" font-size="12" fill="#4a90d9">&#955; = axis&#8211;to&#8211;slip angle</text>
  <text x="210" y="279" font-size="12" fill="#8a8a8a">&#964;&#8341; = &#963; cos&#966; cos&#955;</text>
  <text x="196" y="313" font-size="11" fill="#8a8a8a" fill-opacity="0.85">shaded disc = slip plane</text>
</svg>
