<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Filled states (blue) fill up to the Fermi level E_F; the coral gap E_g decides whether electrons can move.</text>

  <!-- energy axis -->
  <line x1="24" y1="300" x2="24" y2="86" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="24,86 19,98 29,98" fill="#8a8a8a"/>
  <text x="8" y="70" fill="#8a8a8a">Energy</text>

  <!-- ============ Panel A: METAL ============ -->
  <text x="135" y="70" fill="#8a8a8a" text-anchor="middle" font-weight="bold">METAL</text>
  <!-- one band, partly filled -->
  <rect x="70" y="155" width="130" height="90" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <rect x="70" y="200" width="130" height="45" fill="#4a90d9" opacity="0.30"/>
  <!-- E_F inside the band -->
  <line x1="60" y1="200" x2="210" y2="200" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="212" y="205" fill="#e0645c">E_F</text>
  <text x="135" y="228" fill="#8a8a8a" text-anchor="middle" font-size="12">filled</text>
  <text x="135" y="180" fill="#8a8a8a" text-anchor="middle" font-size="12">empty</text>
  <text x="135" y="312" fill="#8a8a8a" text-anchor="middle" font-size="12">partly-filled band</text>
  <text x="135" y="330" fill="#8a8a8a" text-anchor="middle" font-size="12">(or overlap) &#8212; no gap</text>

  <!-- ============ Panel B: SEMICONDUCTOR ============ -->
  <text x="355" y="70" fill="#8a8a8a" text-anchor="middle" font-weight="bold">SEMICONDUCTOR</text>
  <!-- conduction band (empty) -->
  <rect x="290" y="150" width="130" height="40" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="355" y="145" fill="#8a8a8a" text-anchor="middle" font-size="12">conduction band</text>
  <!-- valence band (filled) -->
  <rect x="290" y="210" width="130" height="40" fill="#4a90d9" opacity="0.30"/>
  <rect x="290" y="210" width="130" height="40" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="355" y="268" fill="#8a8a8a" text-anchor="middle" font-size="12">valence band</text>
  <!-- small gap bracket -->
  <line x1="432" y1="190" x2="432" y2="210" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="432,190 428,199 436,199" fill="#e0645c"/>
  <polygon points="432,210 428,201 436,201" fill="#e0645c"/>
  <text x="440" y="204" fill="#e0645c" font-size="12">E_g small</text>
  <!-- E_F mid-gap -->
  <line x1="280" y1="200" x2="330" y2="200" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="258" y="204" fill="#e0645c">E_F</text>
  <text x="355" y="330" fill="#8a8a8a" text-anchor="middle" font-size="12">~0.1&#8211;3 eV: thermally excitable</text>

  <!-- ============ Panel C: INSULATOR ============ -->
  <text x="565" y="70" fill="#8a8a8a" text-anchor="middle" font-weight="bold">INSULATOR</text>
  <!-- conduction band (empty) -->
  <rect x="500" y="110" width="130" height="40" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="565" y="105" fill="#8a8a8a" text-anchor="middle" font-size="12">conduction band</text>
  <!-- valence band (filled) -->
  <rect x="500" y="250" width="130" height="40" fill="#4a90d9" opacity="0.30"/>
  <rect x="500" y="250" width="130" height="40" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="565" y="308" fill="#8a8a8a" text-anchor="middle" font-size="12">valence band</text>
  <!-- large gap bracket -->
  <line x1="642" y1="150" x2="642" y2="250" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="642,150 638,159 646,159" fill="#e0645c"/>
  <polygon points="642,250 638,241 646,241" fill="#e0645c"/>
  <text x="650" y="204" fill="#e0645c" font-size="12">E_g large</text>
  <!-- E_F mid-gap -->
  <line x1="490" y1="200" x2="540" y2="200" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="468" y="204" fill="#e0645c">E_F</text>
  <text x="565" y="330" fill="#8a8a8a" text-anchor="middle" font-size="12">&#62; ~4 eV: no free carriers</text>
</svg>
