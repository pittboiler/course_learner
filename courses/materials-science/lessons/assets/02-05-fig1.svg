<svg viewBox="0 0 520 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="60" y="20" fill="#8a8a8a" font-style="italic">Same surface source, later and later times: the front eats deeper as &#8730;(Dt).</text>

  <!-- axes -->
  <line x1="70" y1="230" x2="490" y2="230" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="490,230 480,225 480,235" fill="#8a8a8a"/>
  <text x="452" y="250" fill="#8a8a8a">x (depth)</text>
  <line x1="70" y1="240" x2="70" y2="58" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,58 65,68 75,68" fill="#8a8a8a"/>
  <text x="44" y="52" fill="#8a8a8a">C</text>

  <!-- Cs and C0 guide labels -->
  <text x="30" y="74" fill="#8a8a8a">C_s</text>
  <line x1="66" y1="70" x2="74" y2="70" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="34" y="234" fill="#8a8a8a">C_0</text>

  <!-- t1 (shallowest) -->
  <path d="M 70 70 L 82 105.6 L 94 138.5 L 106 166.6 L 118 188.7 L 130 204.8 L 142 215.6 L 160 224.6 L 190 229.2"
        fill="none" stroke="#4a90d9" stroke-width="2.5" opacity="0.4"/>
  <text x="150" y="215" fill="#4a90d9" opacity="0.7">t&#8321;</text>

  <!-- t2 -->
  <path d="M 70 70 L 94 105.6 L 118 138.5 L 142 166.6 L 166 188.7 L 190 204.8 L 214 215.6 L 250 224.6 L 310 229.2"
        fill="none" stroke="#4a90d9" stroke-width="2.5" opacity="0.65"/>
  <text x="256" y="216" fill="#4a90d9">t&#8322;</text>

  <!-- t3 (deepest) -->
  <path d="M 70 70 L 106 105.6 L 142 138.5 L 178 166.6 L 214 188.7 L 250 204.8 L 286 215.6 L 340 224.6 L 430 229.2"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="392" y="220" fill="#4a90d9">t&#8323;</text>

  <!-- target concentration line (coral) at C_norm = 0.4 -->
  <line x1="70" y1="166" x2="470" y2="166" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="474" y="170" fill="#e0645c">C_x</text>

  <!-- case-depth markers where curves cross C_x -->
  <circle cx="105.7" cy="166" r="3.2" fill="#e0645c"/>
  <circle cx="141.4" cy="166" r="3.2" fill="#e0645c"/>
  <circle cx="177.1" cy="166" r="3.2" fill="#e0645c"/>

  <!-- deeper arrow -->
  <line x1="110" y1="150" x2="175" y2="150" stroke="#e0645c" stroke-width="1.2"/>
  <polygon points="175,150 166,146 166,154" fill="#e0645c"/>
  <text x="118" y="143" fill="#e0645c">deeper</text>
</svg>
