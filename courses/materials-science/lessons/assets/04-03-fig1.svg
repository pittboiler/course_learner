<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Hall&#8211;Petch: yield strength climbs in a straight line with 1/&#8730;d &#8212; finer grains sit farther right.</text>

  <!-- axes -->
  <line x1="85" y1="255" x2="560" y2="255" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="560,255 550,250 550,260" fill="#8a8a8a"/>
  <line x1="85" y1="255" x2="85" y2="55" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="85,55 80,65 90,65" fill="#8a8a8a"/>

  <!-- axis labels -->
  <text x="470" y="278" fill="#8a8a8a">1 / &#8730;d</text>
  <text x="30" y="60" fill="#8a8a8a">&#963;y</text>
  <text x="500" y="296" fill="#8a8a8a" font-size="12">(coarse &#8592;&#160;&#160;&#160;&#160;&#8594; finer grain)</text>

  <!-- the Hall-Petch line -->
  <line x1="85" y1="200" x2="520" y2="95" stroke="#4a90d9" stroke-width="3"/>

  <!-- intercept marker -->
  <circle cx="85" cy="200" r="4" fill="#e0645c"/>
  <line x1="85" y1="200" x2="72" y2="200" stroke="#e0645c" stroke-width="1"/>
  <text x="40" y="205" fill="#e0645c">&#963;0</text>

  <!-- slope triangle -->
  <line x1="250" y1="160.2" x2="370" y2="160.2" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="370" y1="160.2" x2="370" y2="131.2" stroke="#e0645c" stroke-width="1.5"/>
  <text x="290" y="176" fill="#8a8a8a" font-size="12">run in 1/&#8730;d</text>
  <text x="380" y="150" fill="#e0645c">slope = ky</text>

  <!-- origin tick -->
  <text x="70" y="272" fill="#8a8a8a">0</text>
</svg>
