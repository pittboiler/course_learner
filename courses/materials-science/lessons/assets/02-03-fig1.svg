<svg viewBox="0 0 620 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">A low-angle tilt boundary is a stacked column of edge dislocations, spaced D = b / (2 sin(&#952;/2)).</text>

  <!-- misorientation angle at the top -->
  <line x1="310" y1="58" x2="286" y2="34" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="310" y1="58" x2="334" y2="34" stroke="#e0645c" stroke-width="1.5"/>
  <path d="M 296 44 Q 310 39 324 44" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="304" y="52" fill="#e0645c">&#952;</text>

  <!-- boundary plane (dashed) -->
  <line x1="310" y1="60" x2="310" y2="300" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ===== left grain (grain A): rows tilt down to the right ===== -->
  <line x1="54" y1="71" x2="306" y2="79" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="54" y1="121" x2="306" y2="129" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="54" y1="171" x2="306" y2="179" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="54" y1="221" x2="306" y2="229" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="54" y1="271" x2="306" y2="279" stroke="#8a8a8a" stroke-width="1"/>
  <!-- extra half-planes inserted from the left, terminating at the boundary -->
  <line x1="150" y1="101" x2="306" y2="104" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="150" y1="151" x2="306" y2="154" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="150" y1="201" x2="306" y2="204" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="150" y1="251" x2="306" y2="254" stroke="#8a8a8a" stroke-width="1"/>

  <!-- ===== right grain (grain B): rows tilt up to the right ===== -->
  <line x1="314" y1="79" x2="566" y2="71" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="314" y1="104" x2="566" y2="96" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="314" y1="129" x2="566" y2="121" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="314" y1="154" x2="566" y2="146" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="314" y1="179" x2="566" y2="171" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="314" y1="204" x2="566" y2="196" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="314" y1="229" x2="566" y2="221" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="314" y1="254" x2="566" y2="246" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="314" y1="279" x2="566" y2="271" stroke="#8a8a8a" stroke-width="1"/>

  <!-- ===== the edge dislocations: vertical array of tee symbols on the boundary ===== -->
  <!-- symbol at y=104 -->
  <line x1="310" y1="90" x2="310" y2="104" stroke="#4a90d9" stroke-width="3"/>
  <line x1="298" y1="104" x2="322" y2="104" stroke="#4a90d9" stroke-width="3"/>
  <!-- symbol at y=154 -->
  <line x1="310" y1="140" x2="310" y2="154" stroke="#4a90d9" stroke-width="3"/>
  <line x1="298" y1="154" x2="322" y2="154" stroke="#4a90d9" stroke-width="3"/>
  <!-- symbol at y=204 -->
  <line x1="310" y1="190" x2="310" y2="204" stroke="#4a90d9" stroke-width="3"/>
  <line x1="298" y1="204" x2="322" y2="204" stroke="#4a90d9" stroke-width="3"/>
  <!-- symbol at y=254 -->
  <line x1="310" y1="240" x2="310" y2="254" stroke="#4a90d9" stroke-width="3"/>
  <line x1="298" y1="254" x2="322" y2="254" stroke="#4a90d9" stroke-width="3"/>

  <!-- spacing D between two neighboring dislocations -->
  <line x1="356" y1="154" x2="356" y2="204" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="356,154 352,163 360,163" fill="#e0645c"/>
  <polygon points="356,204 352,195 360,195" fill="#e0645c"/>
  <text x="362" y="184" fill="#e0645c">D</text>

  <!-- Burgers vector b at the top dislocation -->
  <line x1="310" y1="104" x2="340" y2="104" stroke="#e0645c" stroke-width="2"/>
  <polygon points="340,104 331,100 331,108" fill="#e0645c"/>
  <text x="326" y="98" fill="#e0645c">b</text>

  <!-- grain labels -->
  <text x="110" y="328" fill="#8a8a8a">grain A</text>
  <text x="470" y="328" fill="#8a8a8a">grain B</text>
</svg>
