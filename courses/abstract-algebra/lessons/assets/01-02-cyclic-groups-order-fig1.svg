<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>

  <!-- title -->
  <text x="200" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Z/6Z as a clock</text>
  <text x="200" y="50" text-anchor="middle" font-size="13" fill="#6b7280">generator +1 walks all 6 hours</text>

  <!-- ring -->
  <polygon points="200,90 300,148 300,262 200,320 100,262 100,148"
           fill="none" stroke="#9ca3af" stroke-width="2"/>

  <!-- directed arrow hint on 0 -> 1 edge -->
  <polygon points="252,113 262,119 250,124" fill="#2563eb"/>

  <!-- nodes: 0..5. Generators (gcd(k,6)=1): 1 and 5 highlighted -->
  <!-- 0 -->
  <circle cx="200" cy="90" r="24" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <text x="200" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">0</text>
  <!-- 1 (generator) -->
  <circle cx="300" cy="148" r="24" fill="#2563eb" stroke="#1e3a8a" stroke-width="2"/>
  <text x="300" y="154" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">1</text>
  <!-- 2 -->
  <circle cx="300" cy="262" r="24" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <text x="300" y="268" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">2</text>
  <!-- 3 -->
  <circle cx="200" cy="320" r="24" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <text x="200" y="326" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">3</text>
  <!-- 4 -->
  <circle cx="100" cy="262" r="24" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <text x="100" y="268" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">4</text>
  <!-- 5 (generator) -->
  <circle cx="100" cy="148" r="24" fill="#2563eb" stroke="#1e3a8a" stroke-width="2"/>
  <text x="100" y="154" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">5</text>

  <!-- generator legend -->
  <circle cx="60" cy="360" r="9" fill="#2563eb" stroke="#1e3a8a" stroke-width="2"/>
  <text x="76" y="365" font-size="13" fill="#374151">generators: 1, 5  (gcd with 6 = 1)</text>

  <!-- divider -->
  <line x1="400" y1="70" x2="400" y2="340" stroke="#e5e7eb" stroke-width="2"/>

  <!-- subgroup lattice: one per divisor of 6 -->
  <text x="520" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Subgroups: one per divisor</text>

  <!-- order 6 (top) -->
  <rect x="440" y="70" width="160" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="520" y="92" text-anchor="middle" font-size="13" fill="#1e3a8a">{0,1,2,3,4,5}  order 6</text>

  <!-- order 3 -->
  <rect x="430" y="150" width="120" height="34" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="490" y="172" text-anchor="middle" font-size="13" fill="#3730a3">{0,2,4}  ord 3</text>

  <!-- order 2 -->
  <rect x="570" y="150" width="110" height="34" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="625" y="172" text-anchor="middle" font-size="13" fill="#3730a3">{0,3}  ord 2</text>

  <!-- order 1 (bottom) -->
  <rect x="470" y="290" width="100" height="34" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="520" y="312" text-anchor="middle" font-size="13" fill="#374151">{0}  order 1</text>

  <!-- lattice edges -->
  <line x1="500" y1="104" x2="490" y2="150" stroke="#9ca3af" stroke-width="2"/>
  <line x1="545" y1="104" x2="620" y2="150" stroke="#9ca3af" stroke-width="2"/>
  <line x1="490" y1="184" x2="515" y2="290" stroke="#9ca3af" stroke-width="2"/>
  <line x1="623" y1="184" x2="545" y2="290" stroke="#9ca3af" stroke-width="2"/>
</svg>
