<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="sans-serif">
  <rect x="0" y="0" width="540" height="360" fill="#ffffff"/>

  <!-- reflection axes (dashed) -->
  <g stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5">
    <line x1="170" y1="45"  x2="170" y2="295"/>   <!-- vertical edge-axis -->
    <line x1="45"  y1="170" x2="295" y2="170"/>   <!-- horizontal edge-axis -->
    <line x1="70"  y1="70"  x2="270" y2="270"/>   <!-- diagonal 2-4 -->
    <line x1="270" y1="70"  x2="70"  y2="270"/>   <!-- diagonal 1-3 -->
  </g>

  <!-- the square -->
  <polygon points="90,90 250,90 250,250 90,250" fill="none" stroke="#1a1a1a" stroke-width="3"/>

  <!-- vertices -->
  <g fill="#1a1a1a">
    <circle cx="250" cy="90"  r="5"/>
    <circle cx="90"  cy="90"  r="5"/>
    <circle cx="90"  cy="250" r="5"/>
    <circle cx="250" cy="250" r="5"/>
  </g>
  <g fill="#1a1a1a" font-size="18" font-weight="bold">
    <text x="262" y="86">1</text>
    <text x="66"  y="86">2</text>
    <text x="60"  y="262">3</text>
    <text x="262" y="270">4</text>
  </g>

  <!-- rotation arrow (r = 90 deg CCW) -->
  <path d="M 205 158 A 42 42 0 0 1 158 205" fill="none" stroke="#2471a3" stroke-width="3"
        marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2471a3"/>
    </marker>
  </defs>
  <text x="150" y="150" fill="#2471a3" font-size="18" font-weight="bold">r</text>

  <!-- axis labels -->
  <g fill="#c0392b" font-size="13">
    <text x="176" y="42">edge axis</text>
    <text x="300" y="174">edge axis</text>
    <text x="272" y="66">diag 2–4</text>
    <text x="20"  y="66">diag 1–3</text>
  </g>

  <!-- legend -->
  <g font-size="15" fill="#1a1a1a">
    <text x="360" y="70"  font-weight="bold">The 8 elements of D₄</text>
    <text x="360" y="100" fill="#2471a3">Rotations (order n = 4):</text>
    <text x="372" y="124">e ,  r ,  r² ,  r³</text>
    <text x="360" y="158" fill="#c0392b">Reflections (order 2):</text>
    <text x="372" y="182">s ,  rs ,  r²s ,  r³s</text>
    <text x="360" y="222" font-size="13.5">Each of the 4 dashed lines</text>
    <text x="360" y="242" font-size="13.5">is a reflection axis; the 4</text>
    <text x="360" y="262" font-size="13.5">rotations are 0°, 90°, 180°, 270°.</text>
    <text x="360" y="296" font-size="13.5" font-weight="bold">|D₄| = 2·4 = 8</text>
  </g>
</svg>
