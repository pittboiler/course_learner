<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="sans-serif">
  <rect x="0" y="0" width="560" height="320" fill="#ffffff"/>

  <text x="280" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#111111">Symmetries of an equilateral triangle: 6 in all</text>

  <!-- ===== Rotations panel ===== -->
  <text x="150" y="60" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f4fd8">3 rotations</text>

  <!-- triangle -->
  <polygon points="150,80 90,190 210,190" fill="none" stroke="#111111" stroke-width="2.5"/>
  <text x="150" y="74" font-size="13" text-anchor="middle" fill="#111111">1</text>
  <text x="78" y="200" font-size="13" text-anchor="middle" fill="#111111">2</text>
  <text x="222" y="200" font-size="13" text-anchor="middle" fill="#111111">3</text>

  <!-- rotation arrow -->
  <path d="M 150 150 m 46 0 a 46 46 0 1 1 -23 -40" fill="none" stroke="#1f4fd8" stroke-width="2"/>
  <polygon points="123,110 133,108 128,120" fill="#1f4fd8"/>
  <text x="150" y="245" font-size="12.5" text-anchor="middle" fill="#333333">e (0°),  r (120°),  r² (240°)</text>

  <!-- divider -->
  <line x1="290" y1="50" x2="290" y2="290" stroke="#cccccc" stroke-width="1.5"/>

  <!-- ===== Reflections panel ===== -->
  <text x="425" y="60" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">3 reflections</text>

  <!-- triangle -->
  <polygon points="425,80 365,190 485,190" fill="none" stroke="#111111" stroke-width="2.5"/>
  <text x="425" y="74" font-size="13" text-anchor="middle" fill="#111111">1</text>
  <text x="353" y="200" font-size="13" text-anchor="middle" fill="#111111">2</text>
  <text x="497" y="200" font-size="13" text-anchor="middle" fill="#111111">3</text>

  <!-- three mirror axes (vertex to opposite-edge midpoint) -->
  <line x1="425" y1="80" x2="425" y2="190" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="365" y1="190" x2="455" y2="135" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="485" y1="190" x2="395" y2="135" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4"/>

  <text x="425" y="245" font-size="12.5" text-anchor="middle" fill="#333333">flip across each axis</text>

  <text x="280" y="300" font-size="12.5" text-anchor="middle" fill="#555555">Compose two, get another. Undo any. That closure + reversibility IS a group.</text>
</svg>
