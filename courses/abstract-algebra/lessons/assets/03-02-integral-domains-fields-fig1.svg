<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>

  <!-- Titles -->
  <text x="160" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Z/5Z — a field</text>
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Z/6Z — not even a domain</text>
  <text x="160" y="54" text-anchor="middle" font-size="12" fill="#555">every nonzero row hits 1</text>
  <text x="480" y="54" text-anchor="middle" font-size="12" fill="#555">nonzeros multiply to 0</text>

  <!-- ================= Z/5Z table (nonzero elements 1..4) ================= -->
  <!-- geometry: left grid origin -->
  <!-- header cells -->
  <g font-size="15" fill="#1a1a1a">
    <text x="60"  y="86" text-anchor="middle" font-weight="bold">·</text>
    <text x="100" y="86" text-anchor="middle" font-weight="bold">1</text>
    <text x="140" y="86" text-anchor="middle" font-weight="bold">2</text>
    <text x="180" y="86" text-anchor="middle" font-weight="bold">3</text>
    <text x="220" y="86" text-anchor="middle" font-weight="bold">4</text>
  </g>
  <g font-size="15" fill="#1a1a1a" font-weight="bold">
    <text x="60" y="118" text-anchor="middle">1</text>
    <text x="60" y="150" text-anchor="middle">2</text>
    <text x="60" y="182" text-anchor="middle">3</text>
    <text x="60" y="214" text-anchor="middle">4</text>
  </g>
  <!-- grid lines -->
  <g stroke="#bbb" stroke-width="1">
    <line x1="80" y1="96" x2="240" y2="96"/>
    <line x1="80" y1="128" x2="240" y2="128"/>
    <line x1="80" y1="160" x2="240" y2="160"/>
    <line x1="80" y1="192" x2="240" y2="192"/>
    <line x1="80" y1="224" x2="240" y2="224"/>
    <line x1="80" y1="96" x2="80" y2="224"/>
    <line x1="120" y1="96" x2="120" y2="224"/>
    <line x1="160" y1="96" x2="160" y2="224"/>
    <line x1="200" y1="96" x2="200" y2="224"/>
    <line x1="240" y1="96" x2="240" y2="224"/>
  </g>
  <!-- highlight the 1s (inverses) -->
  <g fill="#cdeccd">
    <rect x="80"  y="96"  width="40" height="32"/> <!-- 1*1 -->
    <rect x="160" y="128" width="40" height="32"/> <!-- 2*3 -->
    <rect x="120" y="160" width="40" height="32"/> <!-- 3*2 -->
    <rect x="200" y="192" width="40" height="32"/> <!-- 4*4 -->
  </g>
  <!-- body values -->
  <g font-size="15" fill="#1a1a1a" text-anchor="middle">
    <!-- row 1 -->
    <text x="100" y="118">1</text><text x="140" y="118">2</text><text x="180" y="118">3</text><text x="220" y="118">4</text>
    <!-- row 2 -->
    <text x="100" y="150">2</text><text x="140" y="150">4</text><text x="180" y="150">1</text><text x="220" y="150">3</text>
    <!-- row 3 -->
    <text x="100" y="182">3</text><text x="140" y="182">1</text><text x="180" y="182">4</text><text x="220" y="182">2</text>
    <!-- row 4 -->
    <text x="100" y="214">4</text><text x="140" y="214">3</text><text x="180" y="214">2</text><text x="220" y="214">1</text>
  </g>

  <!-- ================= Z/6Z table (nonzero elements 1..5) ================= -->
  <g font-size="15" fill="#1a1a1a">
    <text x="360" y="86" text-anchor="middle" font-weight="bold">·</text>
    <text x="392" y="86" text-anchor="middle" font-weight="bold">1</text>
    <text x="424" y="86" text-anchor="middle" font-weight="bold">2</text>
    <text x="456" y="86" text-anchor="middle" font-weight="bold">3</text>
    <text x="488" y="86" text-anchor="middle" font-weight="bold">4</text>
    <text x="520" y="86" text-anchor="middle" font-weight="bold">5</text>
  </g>
  <g font-size="15" fill="#1a1a1a" font-weight="bold">
    <text x="360" y="118" text-anchor="middle">1</text>
    <text x="360" y="150" text-anchor="middle">2</text>
    <text x="360" y="182" text-anchor="middle">3</text>
    <text x="360" y="214" text-anchor="middle">4</text>
    <text x="360" y="246" text-anchor="middle">5</text>
  </g>
  <g stroke="#bbb" stroke-width="1">
    <line x1="376" y1="96"  x2="536" y2="96"/>
    <line x1="376" y1="128" x2="536" y2="128"/>
    <line x1="376" y1="160" x2="536" y2="160"/>
    <line x1="376" y1="192" x2="536" y2="192"/>
    <line x1="376" y1="224" x2="536" y2="224"/>
    <line x1="376" y1="256" x2="536" y2="256"/>
    <line x1="376" y1="96" x2="376" y2="256"/>
    <line x1="408" y1="96" x2="408" y2="256"/>
    <line x1="440" y1="96" x2="440" y2="256"/>
    <line x1="472" y1="96" x2="472" y2="256"/>
    <line x1="504" y1="96" x2="504" y2="256"/>
    <line x1="536" y1="96" x2="536" y2="256"/>
  </g>
  <!-- highlight the zero divisors (all 0 entries among nonzeros) -->
  <g fill="#f6cccc">
    <rect x="440" y="128" width="32" height="32"/> <!-- 2*3 -->
    <rect x="408" y="160" width="32" height="32"/> <!-- 3*2 -->
    <rect x="472" y="160" width="32" height="32"/> <!-- 3*4 -->
    <rect x="440" y="192" width="32" height="32"/> <!-- 4*3 -->
  </g>
  <!-- body values, mod 6 -->
  <g font-size="15" fill="#1a1a1a" text-anchor="middle">
    <!-- row 1: 1 2 3 4 5 -->
    <text x="392" y="118">1</text><text x="424" y="118">2</text><text x="456" y="118">3</text><text x="488" y="118">4</text><text x="520" y="118">5</text>
    <!-- row 2: 2 4 0 2 4 -->
    <text x="392" y="150">2</text><text x="424" y="150">4</text><text x="456" y="150" font-weight="bold" fill="#b00000">0</text><text x="488" y="150">2</text><text x="520" y="150">4</text>
    <!-- row 3: 3 0 3 0 3 -->
    <text x="392" y="182">3</text><text x="424" y="182" font-weight="bold" fill="#b00000">0</text><text x="456" y="182">3</text><text x="488" y="182" font-weight="bold" fill="#b00000">0</text><text x="520" y="182">3</text>
    <!-- row 4: 4 2 0 4 2 -->
    <text x="392" y="214">4</text><text x="424" y="214">2</text><text x="456" y="214" font-weight="bold" fill="#b00000">0</text><text x="488" y="214">4</text><text x="520" y="214">2</text>
    <!-- row 5: 5 4 3 2 1 -->
    <text x="392" y="246">5</text><text x="424" y="246">4</text><text x="456" y="246">3</text><text x="488" y="246">2</text><text x="520" y="246">1</text>
  </g>

  <!-- callout -->
  <text x="456" y="300" text-anchor="middle" font-size="14" fill="#b00000" font-weight="bold">2 · 3 = 0  (neither factor is 0)</text>
  <text x="160" y="300" text-anchor="middle" font-size="14" fill="#158015" font-weight="bold">2 · 3 = 1  (2 and 3 are inverses)</text>
</svg>
