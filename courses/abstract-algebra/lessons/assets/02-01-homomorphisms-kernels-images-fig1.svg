<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340">
  <rect x="0" y="0" width="620" height="340" fill="#ffffff"/>
  <!-- Left: domain G = S_3 -->
  <rect x="20" y="30" width="250" height="280" rx="14" fill="#f4f6fb" stroke="#334155" stroke-width="2"/>
  <text x="145" y="22" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#0f172a">G = S₃</text>

  <!-- coset 1: kernel A_3 -->
  <rect x="40" y="55" width="210" height="105" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="145" y="76" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">ker = A₃  (even)</text>
  <text x="145" y="100" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#14532d">e</text>
  <text x="145" y="124" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#14532d">(1 2 3)</text>
  <text x="145" y="148" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#14532d">(1 3 2)</text>

  <!-- coset 2: transpositions -->
  <rect x="40" y="175" width="210" height="120" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="145" y="196" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#7f1d1d">the other coset  (odd)</text>
  <text x="145" y="220" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#7f1d1d">(1 2)</text>
  <text x="145" y="244" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#7f1d1d">(1 3)</text>
  <text x="145" y="268" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#7f1d1d">(2 3)</text>

  <!-- arrows collapsing each coset to one point -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#334155"/>
    </marker>
  </defs>
  <line x1="255" y1="107" x2="470" y2="120" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="255" y1="235" x2="470" y2="222" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="360" y="100" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#334155">sgn</text>

  <!-- Right: codomain {+1,-1} -->
  <rect x="480" y="80" width="120" height="180" rx="14" fill="#f4f6fb" stroke="#334155" stroke-width="2"/>
  <text x="540" y="72" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">H = {±1}</text>
  <circle cx="540" cy="122" r="22" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="540" y="128" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#14532d">+1</text>
  <circle cx="540" cy="220" r="22" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="540" y="226" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#7f1d1d">−1</text>

  <text x="310" y="330" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#475569">Each coset of the kernel is crushed to a single point — that collapse IS the homomorphism.</text>
</svg>
