<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400" font-family="sans-serif">
  <rect x="0" y="0" width="460" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1b5e20"/>
    </marker>
  </defs>

  <text x="230" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">GF(8)* is cyclic: multiply by &#945; to step around</text>

  <!-- guide circle -->
  <circle cx="230" cy="200" r="150" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- directed edges (multiply by alpha, clockwise) -->
  <line x1="262.4" y1="65.8" x2="314.6" y2="91.2" stroke="#1b5e20" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="355.1" y1="142.1" x2="367.9" y2="197.9" stroke="#1b5e20" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="353.6" y1="261.2" x2="317.4" y2="306.8" stroke="#1b5e20" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="259" y1="335" x2="201" y2="335" stroke="#1b5e20" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="142.6" y1="306.8" x2="106.4" y2="261.2" stroke="#1b5e20" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="92.1" y1="197.9" x2="104.9" y2="142.1" stroke="#1b5e20" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="145.4" y1="91.2" x2="197.6" y2="65.8" stroke="#1b5e20" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- nodes -->
  <g stroke="#111" stroke-width="1.5" fill="#ffffff">
    <circle cx="230" cy="50" r="34"/>
    <circle cx="347" cy="107" r="34"/>
    <circle cx="376" cy="233" r="34"/>
    <circle cx="295" cy="335" r="34"/>
    <circle cx="165" cy="335" r="34"/>
    <circle cx="84" cy="233" r="34"/>
    <circle cx="113" cy="107" r="34"/>
  </g>

  <g text-anchor="middle" fill="#111">
    <text x="230" y="48" font-size="15" font-weight="bold">&#945;&#8311;=1</text>
    <text x="230" y="65" font-size="12" fill="#555">1</text>

    <text x="347" y="105" font-size="15" font-weight="bold">&#945;&#185;</text>
    <text x="347" y="122" font-size="12" fill="#555">&#945;</text>

    <text x="376" y="231" font-size="15" font-weight="bold">&#945;&#178;</text>
    <text x="376" y="248" font-size="12" fill="#555">&#945;&#178;</text>

    <text x="295" y="333" font-size="15" font-weight="bold">&#945;&#179;</text>
    <text x="295" y="350" font-size="12" fill="#555">&#945;+1</text>

    <text x="165" y="333" font-size="15" font-weight="bold">&#945;&#8308;</text>
    <text x="165" y="350" font-size="12" fill="#555">&#945;&#178;+&#945;</text>

    <text x="84" y="231" font-size="15" font-weight="bold">&#945;&#8309;</text>
    <text x="84" y="248" font-size="11" fill="#555">&#945;&#178;+&#945;+1</text>

    <text x="113" y="105" font-size="15" font-weight="bold">&#945;&#8310;</text>
    <text x="113" y="122" font-size="12" fill="#555">&#945;&#178;+1</text>
  </g>
</svg>
