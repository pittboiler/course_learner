<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>

  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">The Galois correspondence for &#8474;(&#8730;2,&#8730;3)/&#8474;</text>
  <text x="380" y="56" text-anchor="middle" font-size="14" fill="#555555">subfields &#8596; subgroups, order-reversing (same height = they correspond)</text>

  <text x="190" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a5276">FIELDS  F &#8838; L &#8838; K</text>
  <text x="570" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#922b21">SUBGROUPS of  Gal(K/&#8474;)</text>

  <!-- ===== LEFT: field lattice, small at bottom, big at top ===== -->
  <!-- edges -->
  <g stroke="#1a5276" stroke-width="2">
    <line x1="190" y1="145" x2="70"  y2="245"/>
    <line x1="190" y1="145" x2="190" y2="245"/>
    <line x1="190" y1="145" x2="310" y2="245"/>
    <line x1="70"  y1="290" x2="190" y2="385"/>
    <line x1="190" y1="290" x2="190" y2="385"/>
    <line x1="310" y1="290" x2="190" y2="385"/>
  </g>
  <!-- nodes -->
  <g>
    <rect x="132" y="120" width="116" height="30" rx="6" fill="#d6eaf8" stroke="#1a5276"/>
    <text x="190" y="140" text-anchor="middle" font-size="15" fill="#1a1a1a">&#8474;(&#8730;2,&#8730;3)</text>

    <rect x="34"  y="252" width="72" height="30" rx="6" fill="#d6eaf8" stroke="#1a5276"/>
    <text x="70"  y="272" text-anchor="middle" font-size="15" fill="#1a1a1a">&#8474;(&#8730;2)</text>
    <rect x="154" y="252" width="72" height="30" rx="6" fill="#d6eaf8" stroke="#1a5276"/>
    <text x="190" y="272" text-anchor="middle" font-size="15" fill="#1a1a1a">&#8474;(&#8730;6)</text>
    <rect x="274" y="252" width="72" height="30" rx="6" fill="#d6eaf8" stroke="#1a5276"/>
    <text x="310" y="272" text-anchor="middle" font-size="15" fill="#1a1a1a">&#8474;(&#8730;3)</text>

    <rect x="168" y="390" width="44" height="30" rx="6" fill="#d6eaf8" stroke="#1a5276"/>
    <text x="190" y="410" text-anchor="middle" font-size="15" fill="#1a1a1a">&#8474;</text>
  </g>

  <!-- ===== RIGHT: subgroup lattice, drawn flipped so it mirrors the fields ===== -->
  <g stroke="#922b21" stroke-width="2">
    <line x1="570" y1="145" x2="450" y2="245"/>
    <line x1="570" y1="145" x2="570" y2="245"/>
    <line x1="570" y1="145" x2="690" y2="245"/>
    <line x1="450" y1="290" x2="570" y2="385"/>
    <line x1="570" y1="290" x2="570" y2="385"/>
    <line x1="690" y1="290" x2="570" y2="385"/>
  </g>
  <g>
    <rect x="542" y="120" width="56" height="30" rx="6" fill="#fadbd8" stroke="#922b21"/>
    <text x="570" y="140" text-anchor="middle" font-size="15" fill="#1a1a1a">{e}</text>

    <rect x="418" y="252" width="64" height="30" rx="6" fill="#fadbd8" stroke="#922b21"/>
    <text x="450" y="272" text-anchor="middle" font-size="15" fill="#1a1a1a">&#10216;&#964;&#10217;</text>
    <rect x="538" y="252" width="64" height="30" rx="6" fill="#fadbd8" stroke="#922b21"/>
    <text x="570" y="272" text-anchor="middle" font-size="15" fill="#1a1a1a">&#10216;&#963;&#964;&#10217;</text>
    <rect x="658" y="252" width="64" height="30" rx="6" fill="#fadbd8" stroke="#922b21"/>
    <text x="690" y="272" text-anchor="middle" font-size="15" fill="#1a1a1a">&#10216;&#963;&#10217;</text>

    <rect x="536" y="390" width="68" height="30" rx="6" fill="#fadbd8" stroke="#922b21"/>
    <text x="570" y="410" text-anchor="middle" font-size="15" fill="#1a1a1a">V&#8324;</text>
  </g>

  <!-- correspondence links (dashed, order-reversing pairs at equal height) -->
  <g stroke="#7f8c8d" stroke-width="1.4" stroke-dasharray="5 5">
    <line x1="212" y1="135" x2="542" y2="135"/>
    <line x1="212" y1="405" x2="536" y2="405"/>
  </g>
  <text x="378" y="130" text-anchor="middle" font-size="12" fill="#7f8c8d">K &#8596; {e}</text>
  <text x="378" y="400" text-anchor="middle" font-size="12" fill="#7f8c8d">&#8474; &#8596; whole group</text>

  <text x="190" y="446" text-anchor="middle" font-size="12" fill="#555555">&#963;: &#8730;2&#8614;&#8722;&#8730;2 &#183; &#964;: &#8730;3&#8614;&#8722;&#8730;3  (fixed field of &#10216;&#964;&#10217; is &#8474;(&#8730;2), etc.)</text>
</svg>
