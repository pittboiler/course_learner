<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<rect x="0" y="0" width="780" height="600" fill="#ffffff"/>
<text x="20" y="26" font-size="14" text-anchor="start" fill="#111111" font-weight="bold">Width = number of people, height = welfare, area = total welfare</text>
<line x1="20" y1="300" x2="760" y2="300" stroke="#111111" stroke-width="1.5"/>
<text x="24" y="294" font-size="11" text-anchor="start" fill="#333333">0</text>
<rect x="60" y="108" width="30" height="192" rx="0" fill="#dbe8f5" stroke="#1a6fb5" stroke-width="1.8"/>
<text x="75" y="64" font-size="15" text-anchor="middle" fill="#1a6fb5" font-weight="bold">A</text>
<text x="75" y="80" font-size="12" text-anchor="middle" fill="#111111">500 at 80</text>
<text x="75" y="96" font-size="12" text-anchor="middle" fill="#333333">total 40,000</text>
<rect x="130" y="204" width="90" height="96" rx="0" fill="#dcefe4" stroke="#2e8b57" stroke-width="1.8"/>
<text x="175" y="160" font-size="15" text-anchor="middle" fill="#2e8b57" font-weight="bold">B</text>
<text x="175" y="176" font-size="12" text-anchor="middle" fill="#111111">1,500 at 40</text>
<text x="175" y="192" font-size="12" text-anchor="middle" fill="#333333">total 60,000</text>
<rect x="260" y="276" width="480" height="24" rx="0" fill="#f6dde1" stroke="#d1495b" stroke-width="1.8"/>
<text x="500" y="232" font-size="15" text-anchor="middle" fill="#d1495b" font-weight="bold">Z</text>
<text x="500" y="248" font-size="12" text-anchor="middle" fill="#111111">8,000 at 10</text>
<text x="500" y="264" font-size="12" text-anchor="middle" fill="#333333">total 80,000</text>
<text x="760" y="324" font-size="13" text-anchor="end" fill="#111111" font-weight="bold">Total view: Z &gt; B &gt; A.   Average view: A &gt; B &gt; Z.</text>
<text x="20" y="366" font-size="14" text-anchor="start" fill="#111111" font-weight="bold">Hell: lives worse than nothing (below the zero line)</text>
<line x1="20" y1="410" x2="760" y2="410" stroke="#111111" stroke-width="1.5"/>
<text x="24" y="404" font-size="11" text-anchor="start" fill="#333333">0</text>
<rect x="60" y="410" width="60" height="120" rx="0" fill="#e6e6e6" stroke="#333333" stroke-width="1.5"/>
<text x="90" y="548" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">H</text>
<text x="90" y="564" font-size="12" text-anchor="middle" fill="#111111">1,000 at -50</text>
<text x="90" y="580" font-size="12" text-anchor="middle" fill="#333333">average -50</text>
<rect x="260" y="410" width="60" height="120" rx="0" fill="#e6e6e6" stroke="#333333" stroke-width="1.5"/>
<rect x="320" y="410" width="60" height="24" rx="0" fill="#f6dde1" stroke="#d1495b" stroke-width="1.8"/>
<text x="320" y="548" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">H plus 1,000 at -10</text>
<text x="320" y="564" font-size="12" text-anchor="middle" fill="#1a6fb5">average -30 (up)</text>
<text x="320" y="580" font-size="12" text-anchor="middle" fill="#333333">total -60,000 (down)</text>
<text x="470" y="450" font-size="13" text-anchor="start" fill="#111111">Adding only lives worse than nothing</text>
<text x="470" y="468" font-size="13" text-anchor="start" fill="#111111">raises the average, because each added</text>
<text x="470" y="486" font-size="13" text-anchor="start" fill="#111111">life is above the existing average -50.</text>
</svg>
