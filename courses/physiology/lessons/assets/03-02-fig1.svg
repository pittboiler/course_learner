<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 830" width="600" height="830" role="img" aria-label="Two panels. Panel a shows a loop of Henle, a collecting duct and the vasa recta drawn against a vertical corticopapillary osmolality axis running from 300 milliosmoles per kilogram in the cortex to 1200 at the papilla, with water leaving the descending limb, sodium chloride pumped out of the thick ascending limb, and water leaving the collecting duct only when ADH is present. Panel b plots tubular fluid osmolality along the nephron from Bowman's capsule to the papilla, with two collecting-duct curves diverging at the same branch point, one for maximal ADH rising to 1200 and one for no ADH falling to about 50.">
<rect width="600" height="830" fill="#ffffff"/>
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6fb5"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d1495b"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8b57"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/></marker>
</defs>
<g font-family="Helvetica,Arial,sans-serif">

<text x="15" y="24" font-size="13" font-weight="bold" fill="#111">(a) The medullary gradient: multiplier, user, exchanger</text>

<rect x="92" y="62" width="493" height="33" fill="#8fa8c0" fill-opacity="0.10"/>
<rect x="92" y="95" width="493" height="65" fill="#8fa8c0" fill-opacity="0.19"/>
<rect x="92" y="160" width="493" height="80" fill="#8fa8c0" fill-opacity="0.29"/>
<rect x="92" y="240" width="493" height="80" fill="#8fa8c0" fill-opacity="0.41"/>
<rect x="92" y="320" width="493" height="80" fill="#8fa8c0" fill-opacity="0.53"/>

<line x1="88" y1="62" x2="88" y2="400" stroke="#333" stroke-width="1.4"/>
<line x1="84" y1="70" x2="88" y2="70" stroke="#333" stroke-width="1.4"/>
<line x1="84" y1="177" x2="88" y2="177" stroke="#333" stroke-width="1.4"/>
<line x1="84" y1="283" x2="88" y2="283" stroke="#333" stroke-width="1.4"/>
<line x1="84" y1="390" x2="88" y2="390" stroke="#333" stroke-width="1.4"/>
<text x="82" y="73.5" font-size="10.5" fill="#333" text-anchor="end">300</text>
<text x="82" y="180.5" font-size="10.5" fill="#333" text-anchor="end">600</text>
<text x="82" y="286.5" font-size="10.5" fill="#333" text-anchor="end">900</text>
<text x="82" y="393.5" font-size="10.5" fill="#333" text-anchor="end">1200</text>
<text x="22" y="230" font-size="10.5" fill="#333" text-anchor="middle" transform="rotate(-90 22 230)">Interstitium (mOsm/kg)</text>

<text x="580" y="79" font-size="10" fill="#333" text-anchor="end">cortex</text>
<text x="580" y="174" font-size="10" fill="#333" text-anchor="end">outer medulla</text>
<text x="580" y="300" font-size="10" fill="#333" text-anchor="end">inner medulla</text>
<text x="580" y="394" font-size="10" fill="#333" text-anchor="end">papilla</text>

<path d="M 175 72 L 175 368 A 24 24 0 0 0 199 392" fill="none" stroke="#1a6fb5" stroke-width="3"/>
<path d="M 199 392 A 24 24 0 0 0 223 368 L 223 72" fill="none" stroke="#d1495b" stroke-width="3"/>

<line x1="170" y1="150" x2="146" y2="150" stroke="#1a6fb5" stroke-width="1.6" marker-end="url(#ab)"/>
<line x1="170" y1="215" x2="146" y2="215" stroke="#1a6fb5" stroke-width="1.6" marker-end="url(#ab)"/>
<line x1="170" y1="280" x2="146" y2="280" stroke="#1a6fb5" stroke-width="1.6" marker-end="url(#ab)"/>
<text x="142" y="140" font-size="10.5" fill="#1a6fb5" text-anchor="end">H&#8322;O</text>

<line x1="228" y1="110" x2="256" y2="110" stroke="#d1495b" stroke-width="1.6" marker-end="url(#ac)"/>
<line x1="228" y1="175" x2="256" y2="175" stroke="#d1495b" stroke-width="1.6" marker-end="url(#ac)"/>
<line x1="228" y1="240" x2="256" y2="240" stroke="#d1495b" stroke-width="1.6" marker-end="url(#ac)"/>
<line x1="228" y1="305" x2="256" y2="305" stroke="#d1495b" stroke-width="1.6" marker-end="url(#ac)"/>
<circle cx="223" cy="175" r="4.5" fill="#d1495b"/>
<text x="262" y="106" font-size="10.5" fill="#d1495b">NaCl</text>
<text x="262" y="179" font-size="10" fill="#d1495b">NKCC2 pump</text>

<line x1="355" y1="72" x2="355" y2="396" stroke="#2e8b57" stroke-width="4"/>
<text x="355" y="57" font-size="10.5" fill="#2e8b57" text-anchor="middle">collecting duct</text>
<line x1="350" y1="245" x2="326" y2="245" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#ag)"/>
<line x1="350" y1="305" x2="326" y2="305" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#ag)"/>
<line x1="350" y1="360" x2="326" y2="360" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="324" y="235" font-size="10" fill="#2e8b57" text-anchor="end">H&#8322;O if ADH</text>

<path d="M 440 72 L 440 336 A 19 19 0 0 0 478 336 L 478 72" fill="none" stroke="#555555" stroke-width="2.4"/>
<text x="459" y="57" font-size="10.5" fill="#333" text-anchor="middle">vasa recta</text>
<line x1="444" y1="200" x2="470" y2="200" stroke="#555555" stroke-width="1.3" marker-end="url(#ak)"/>
<line x1="474" y1="290" x2="448" y2="290" stroke="#555555" stroke-width="1.3" marker-end="url(#ak)"/>
<text x="459" y="385" font-size="10" fill="#333" text-anchor="middle">no pump</text>

<line x1="30" y1="420" x2="58" y2="420" stroke="#1a6fb5" stroke-width="3"/>
<text x="64" y="424" font-size="10.5" fill="#333">descending limb &#8212; water leaves, solute stays</text>
<line x1="30" y1="438" x2="58" y2="438" stroke="#d1495b" stroke-width="3"/>
<text x="64" y="442" font-size="10.5" fill="#333">thick ascending limb &#8212; NaCl pumped out, water cannot follow</text>
<line x1="30" y1="456" x2="58" y2="456" stroke="#2e8b57" stroke-width="3"/>
<text x="64" y="460" font-size="10.5" fill="#333">collecting duct &#8212; water leaves only when ADH is present</text>
<line x1="30" y1="474" x2="58" y2="474" stroke="#555555" stroke-width="2.4"/>
<text x="64" y="478" font-size="10.5" fill="#333">vasa recta &#8212; passive exchanger; preserves, never creates</text>

<text x="15" y="510" font-size="13" font-weight="bold" fill="#111">(b) Tubular fluid osmolality along the nephron</text>

<line x1="105" y1="530" x2="565" y2="530" stroke="#8fa8c0" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="105" y1="590" x2="565" y2="590" stroke="#8fa8c0" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="105" y1="650" x2="565" y2="650" stroke="#8fa8c0" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="105" y1="710" x2="565" y2="710" stroke="#8fa8c0" stroke-width="1.3" stroke-dasharray="5 3"/>
<line x1="190" y1="530" x2="190" y2="770" stroke="#8fa8c0" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="360" y1="530" x2="360" y2="770" stroke="#8fa8c0" stroke-width="1" stroke-dasharray="2 3"/>

<line x1="105" y1="525" x2="105" y2="770" stroke="#333" stroke-width="1.4"/>
<line x1="105" y1="770" x2="565" y2="770" stroke="#333" stroke-width="1.4"/>
<text x="99" y="773.5" font-size="10.5" fill="#333" text-anchor="end">0</text>
<text x="99" y="713.5" font-size="10.5" fill="#333" text-anchor="end">300 (plasma)</text>
<text x="99" y="653.5" font-size="10.5" fill="#333" text-anchor="end">600</text>
<text x="99" y="593.5" font-size="10.5" fill="#333" text-anchor="end">900</text>
<text x="99" y="533.5" font-size="10.5" fill="#333" text-anchor="end">1200</text>
<text x="22" y="650" font-size="10.5" fill="#333" text-anchor="middle" transform="rotate(-90 22 650)">Tubular fluid (mOsm/kg)</text>

<polyline points="115,710 190,710 275,530 360,750" fill="none" stroke="#111" stroke-width="2.5"/>
<polyline points="360,750 435,710 555,530" fill="none" stroke="#d1495b" stroke-width="2.5"/>
<polyline points="360,750 435,757 555,760" fill="none" stroke="#1a6fb5" stroke-width="2.5" stroke-dasharray="6 3"/>
<circle cx="360" cy="750" r="3.5" fill="#111"/>

<text x="448" y="558" font-size="10.5" fill="#d1495b">maximal ADH</text>
<line x1="512" y1="555" x2="533" y2="561" stroke="#d1495b" stroke-width="1"/>
<text x="452" y="740" font-size="10.5" fill="#1a6fb5">no ADH</text>
<text x="348" y="742" font-size="9.5" fill="#333" text-anchor="end">dilute: &#8776;100</text>
<line x1="350" y1="739" x2="357" y2="747" stroke="#333" stroke-width="1"/>

<text x="115" y="788" font-size="9.5" fill="#333">Bowman</text>
<text x="190" y="788" font-size="9.5" fill="#333" text-anchor="middle">prox. tubule</text>
<text x="275" y="788" font-size="9.5" fill="#333" text-anchor="middle">loop of Henle</text>
<text x="470" y="788" font-size="9.5" fill="#333" text-anchor="middle">distal + collecting duct</text>

<text x="15" y="814" font-size="10" fill="#333">Same nephron, same filtrate &#8212; the collecting duct's water permeability alone decides the endpoint.</text>
</g>
</svg>
