<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" role="img" aria-label="Three panels: the canonical negative feedback loop, a plot of a regulated variable after a step disturbance at low gain, high gain, and high gain with delay, and a positive feedback panel showing runaway.">
<rect width="640" height="720" fill="#ffffff"/>
<defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="9.4" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#333333"/></marker>
<marker id="ahc" markerWidth="10" markerHeight="8" refX="9.4" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#d1495b"/></marker>
</defs>
<g font-family="Helvetica,Arial,sans-serif" fill="#111111">

<text x="20" y="32" font-size="14" font-weight="bold">(a) the canonical negative-feedback loop</text>

<text x="498" y="46" font-size="12.5" fill="#d1495b" text-anchor="middle">disturbance</text>
<line x1="498" y1="54" x2="498" y2="94" stroke="#d1495b" stroke-width="1.8" marker-end="url(#ahc)"/>
<text x="510" y="74" font-size="14" fill="#d1495b">+</text>

<text x="20" y="106" font-size="12.5">set point</text>
<text x="20" y="122" font-size="11" fill="#555555">(reference)</text>
<line x1="88" y1="110" x2="126" y2="110" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="118" y="101" font-size="14">+</text>

<circle cx="142" cy="110" r="14" fill="#f5f7fa" stroke="#333333" stroke-width="1.6"/>
<line x1="132" y1="110" x2="152" y2="110" stroke="#333333" stroke-width="1.2"/>
<line x1="142" y1="100" x2="142" y2="120" stroke="#333333" stroke-width="1.2"/>

<line x1="156" y1="110" x2="196" y2="110" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="176" y="100" font-size="11.5" text-anchor="middle">error</text>

<rect x="200" y="86" width="112" height="48" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.4" rx="3"/>
<text x="256" y="105" font-size="12.5" text-anchor="middle">integrating</text>
<text x="256" y="121" font-size="12.5" text-anchor="middle">centre</text>

<line x1="312" y1="110" x2="346" y2="110" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/>

<rect x="350" y="86" width="94" height="48" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.4" rx="3"/>
<text x="397" y="114" font-size="12.5" text-anchor="middle">effector</text>

<line x1="444" y1="110" x2="480" y2="110" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/>

<circle cx="498" cy="110" r="14" fill="#f5f7fa" stroke="#333333" stroke-width="1.6"/>
<line x1="488" y1="110" x2="508" y2="110" stroke="#333333" stroke-width="1.2"/>
<line x1="498" y1="100" x2="498" y2="120" stroke="#333333" stroke-width="1.2"/>

<line x1="512" y1="110" x2="615" y2="110" stroke="#1a6fb5" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="563" y="100" font-size="11.5" fill="#1a6fb5" text-anchor="middle">regulated variable</text>

<polyline points="580,110 580,176 446,176" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="330" y="156" width="114" height="40" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.4" rx="3"/>
<text x="387" y="181" font-size="12.5" text-anchor="middle">sensor</text>
<polyline points="330,176 142,176 142,128" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="132" y="154" font-size="15" text-anchor="end">&#8722;</text>

<text x="320" y="208" font-size="11.5" fill="#555555" font-style="italic" text-anchor="middle">the effector is driven by the error, so the error can never reach zero</text>

<line x1="20" y1="220" x2="620" y2="220" stroke="#dfe5ec" stroke-width="1"/>

<text x="20" y="250" font-size="14" font-weight="bold">(b) the same variable after a step disturbance</text>

<line x1="68" y1="285" x2="68" y2="460" stroke="#333333" stroke-width="1.4"/>
<line x1="68" y1="460" x2="615" y2="460" stroke="#333333" stroke-width="1.4"/>
<line x1="68" y1="420" x2="615" y2="420" stroke="#888888" stroke-width="1.1" stroke-dasharray="5,4"/>
<text x="76" y="436" font-size="11" fill="#555555">set point</text>

<line x1="62" y1="295" x2="68" y2="295" stroke="#333333" stroke-width="1.2"/>
<line x1="62" y1="357.5" x2="68" y2="357.5" stroke="#333333" stroke-width="1.2"/>
<line x1="62" y1="420" x2="68" y2="420" stroke="#333333" stroke-width="1.2"/>
<text x="58" y="299" font-size="11" text-anchor="end">0.5d</text>
<text x="58" y="361.5" font-size="11" text-anchor="end">0.25d</text>
<text x="58" y="424" font-size="11" text-anchor="end">0</text>
<text x="26" y="372" font-size="11.5" text-anchor="middle" transform="rotate(-90 26 372)">deviation from set point</text>

<line x1="110" y1="285" x2="110" y2="460" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="4,3"/>
<text x="114" y="293" font-size="11" fill="#555555">disturbance d applied</text>

<polyline points="68,420 110,420 118.5,405.3 127,392.3 135.5,380.9 144,370.8 161,354.0 178,341.0 195,330.8 212,323.0 246,312.0 280,305.3 314,301.2 382,297.3 484,295.8 600,295.1" fill="none" stroke="#1a6fb5" stroke-width="2"/>
<polyline points="68,420 110,420 118.5,415.5 127,411.8 135.5,408.7 152.5,404.2 178,400.0 212,397.3 263,395.7 348,395.1 600,395.0" fill="none" stroke="#2e8b57" stroke-width="2"/>
<polyline points="68,420 110,420 118.5,380.6 127,347.0 135.5,323.7 144,313.1 152.5,315.6 161,329.5 169.5,351.8 178,378.3 186.5,404.7 195,427.2 203.5,442.8 212,449.9 220.5,448.2 229,438.9 237.5,424.0 246,406.2 254.5,388.5 263,373.4 271.5,363.0 280,358.2 288.5,359.3 297,365.6 305.5,375.6 314,387.5 322.5,399.4 331,409.5 339.5,416.5 348,419.7 365,414.7 382,400.1 399,385.3 416,378.5 433,381.8 450,391.6 467,401.5 484,406.1 501,403.9 518,397.3 535,390.7 552,387.6 569,389.1 586,393.5 600,397.2" fill="none" stroke="#d1495b" stroke-width="2"/>

<rect x="452" y="306" width="166" height="62" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.2" rx="3"/>
<line x1="460" y1="322" x2="482" y2="322" stroke="#1a6fb5" stroke-width="2.4"/>
<text x="488" y="326" font-size="11.5">G = 1 (low gain)</text>
<line x1="460" y1="340" x2="482" y2="340" stroke="#2e8b57" stroke-width="2.4"/>
<text x="488" y="344" font-size="11.5">G = 9 (high gain)</text>
<line x1="460" y1="358" x2="482" y2="358" stroke="#d1495b" stroke-width="2.4"/>
<text x="488" y="362" font-size="11.5">G = 9, with delay</text>

<text x="340" y="482" font-size="11.5" text-anchor="middle">time &#8594;</text>
<text x="340" y="502" font-size="11" fill="#555555" font-style="italic" text-anchor="middle">with no controller at all the deviation would settle at 1.0 d</text>

<line x1="20" y1="521" x2="620" y2="521" stroke="#dfe5ec" stroke-width="1"/>

<text x="20" y="548" font-size="14" font-weight="bold">(c) positive feedback: the same algebra, sign flipped</text>

<rect x="60" y="562" width="140" height="26" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.4" rx="3"/>
<text x="130" y="580" font-size="12" text-anchor="middle">depolarization</text>
<line x1="130" y1="588" x2="130" y2="606" stroke="#d1495b" stroke-width="1.8" marker-end="url(#ahc)"/>
<text x="138" y="602" font-size="13" fill="#d1495b">+</text>

<rect x="60" y="610" width="140" height="26" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.4" rx="3"/>
<text x="130" y="628" font-size="12" text-anchor="middle">Na&#8314; channels open</text>
<line x1="130" y1="636" x2="130" y2="654" stroke="#d1495b" stroke-width="1.8" marker-end="url(#ahc)"/>
<text x="138" y="650" font-size="13" fill="#d1495b">+</text>

<rect x="60" y="658" width="140" height="26" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.4" rx="3"/>
<text x="130" y="676" font-size="12" text-anchor="middle">Na&#8314; current in</text>
<polyline points="200,671 228,671 228,575 204,575" fill="none" stroke="#d1495b" stroke-width="1.8" marker-end="url(#ahc)"/>
<text x="236" y="627" font-size="13" fill="#d1495b">+</text>
<text x="144" y="706" font-size="11" fill="#555555" font-style="italic" text-anchor="middle">each step feeds the next</text>

<line x1="330" y1="558" x2="330" y2="690" stroke="#333333" stroke-width="1.4"/>
<line x1="330" y1="690" x2="615" y2="690" stroke="#333333" stroke-width="1.4"/>
<polyline points="330,690 350,675.8 370,666.6 400,658.6 440,653.6 500,650.9 615,650.1" fill="none" stroke="#2e8b57" stroke-width="2"/>
<polyline points="330,688 380,685.8 430,681.4 470,674.5 510,662.1 540,646.7 565,627.5 585,606.2 600,585.6 615,559.8" fill="none" stroke="#d1495b" stroke-width="2"/>
<text x="520" y="596" font-size="11.5" fill="#d1495b" text-anchor="end">loop gain &gt; 1: runaway</text>
<text x="612" y="672" font-size="11.5" fill="#2e8b57" text-anchor="end">loop gain &lt; 1</text>
<text x="316" y="624" font-size="11.5" text-anchor="middle" transform="rotate(-90 316 624)">deviation</text>
<text x="472" y="708" font-size="11.5" text-anchor="middle">time &#8594;</text>

</g>
</svg>
