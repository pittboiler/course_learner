<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-label="Panel a: the oxygen hemoglobin dissociation curve, saturation against oxygen partial pressure, with a normal curve and a right-shifted curve, arterial and mixed venous points marked, and the flat and steep regions annotated. Panel b: stacked bars comparing total blood oxygen content on room air and on pure oxygen, split into hemoglobin-bound and dissolved contributions.">
  <rect width="820" height="400" fill="#ffffff"/>
  <g font-family="Helvetica,Arial,sans-serif" fill="#111">

    <text x="20" y="28" font-size="13" font-weight="bold">(a) The oxygen&#8211;hemoglobin dissociation curve</text>

    <rect x="62" y="62" width="370" height="240" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>
    <g stroke="#d7e0ea" stroke-width="1">
      <line x1="62" y1="242" x2="432" y2="242"/>
      <line x1="62" y1="182" x2="432" y2="182"/>
      <line x1="62" y1="122" x2="432" y2="122"/>
      <line x1="129.3" y1="62" x2="129.3" y2="302"/>
      <line x1="196.5" y1="62" x2="196.5" y2="302"/>
      <line x1="263.8" y1="62" x2="263.8" y2="302"/>
      <line x1="331.1" y1="62" x2="331.1" y2="302"/>
      <line x1="398.4" y1="62" x2="398.4" y2="302"/>
    </g>

    <g font-size="9.5" fill="#333" text-anchor="end">
      <text x="56" y="306">0</text>
      <text x="56" y="246">25</text>
      <text x="56" y="186">50</text>
      <text x="56" y="126">75</text>
      <text x="56" y="66">100</text>
    </g>
    <g font-size="9.5" fill="#333" text-anchor="middle">
      <text x="62" y="317">0</text>
      <text x="129.3" y="317">20</text>
      <text x="196.5" y="317">40</text>
      <text x="263.8" y="317">60</text>
      <text x="331.1" y="317">80</text>
      <text x="398.4" y="317">100</text>
    </g>
    <text x="247" y="337" font-size="10.5" fill="#333" text-anchor="middle">oxygen partial pressure PO2 (mmHg)</text>
    <text x="26" y="182" font-size="10.5" fill="#333" text-anchor="middle" transform="rotate(-90 26 182)">hemoglobin saturation (%)</text>

    <g stroke="#111" stroke-width="1.2" fill="none">
      <line x1="62" y1="302" x2="432" y2="302"/>
      <line x1="62" y1="62" x2="62" y2="302"/>
    </g>

    <g stroke="#777" stroke-width="1" stroke-dasharray="3,3">
      <line x1="152.8" y1="302" x2="152.8" y2="182"/>
      <line x1="62" y1="182" x2="152.8" y2="182"/>
    </g>
    <text x="158" y="196" font-size="9.5" fill="#555">P50 = 27</text>

    <path fill="none" stroke="#d1495b" stroke-width="2" stroke-dasharray="6,4" d="M 62.0,302.0 L 68.7,301.9 L 75.5,301.3 L 82.2,299.8 L 88.9,297.3 L 95.6,293.5 L 102.4,288.4 L 109.1,282.0 L 115.8,274.3 L 122.5,265.5 L 129.3,255.8 L 136.0,245.4 L 142.7,234.6 L 149.5,223.7 L 156.2,212.8 L 162.9,202.1 L 169.6,191.8 L 176.4,182.0 L 183.1,172.8 L 189.8,164.1 L 196.5,156.1 L 203.3,148.7 L 210.0,141.8 L 216.7,135.6 L 223.5,129.8 L 230.2,124.6 L 236.9,119.8 L 243.6,115.5 L 250.4,111.5 L 257.1,107.9 L 263.8,104.6 L 270.5,101.6 L 277.3,98.8 L 284.0,96.3 L 290.7,94.0 L 297.5,91.9 L 304.2,90.0 L 310.9,88.2 L 317.6,86.6 L 324.4,85.1 L 331.1,83.7 L 337.8,82.4 L 344.5,81.2 L 351.3,80.1 L 358.0,79.1 L 364.7,78.2 L 371.5,77.3 L 378.2,76.5 L 384.9,75.7 L 391.6,75.0 L 398.4,74.4 L 405.1,73.8 L 411.8,73.2 L 418.5,72.6 L 425.3,72.1 L 432.0,71.7"/>
    <path fill="none" stroke="#1a6fb5" stroke-width="2.4" d="M 62.0,302.0 L 68.7,301.8 L 75.5,300.6 L 82.2,297.9 L 88.9,293.3 L 95.6,286.6 L 102.4,277.8 L 109.1,267.2 L 115.8,255.0 L 122.5,241.8 L 129.3,228.1 L 136.0,214.4 L 142.7,200.9 L 149.5,188.1 L 156.2,176.1 L 162.9,165.0 L 169.6,154.9 L 176.4,145.8 L 183.1,137.6 L 189.8,130.3 L 196.5,123.7 L 203.3,117.9 L 210.0,112.7 L 216.7,108.0 L 223.5,103.9 L 230.2,100.2 L 236.9,96.9 L 243.6,94.0 L 250.4,91.4 L 257.1,89.0 L 263.8,86.9 L 270.5,85.0 L 277.3,83.3 L 284.0,81.7 L 290.7,80.3 L 297.5,79.0 L 304.2,77.9 L 310.9,76.8 L 317.6,75.8 L 324.4,74.9 L 331.1,74.1 L 337.8,73.4 L 344.5,72.7 L 351.3,72.1 L 358.0,71.5 L 364.7,71.0 L 371.5,70.5 L 378.2,70.0 L 384.9,69.6 L 391.6,69.2 L 398.4,68.8 L 405.1,68.5 L 411.8,68.1 L 418.5,67.8 L 425.3,67.6 L 432.0,67.3"/>

    <line x1="72" y1="76" x2="94" y2="76" stroke="#1a6fb5" stroke-width="2.4"/>
    <text x="100" y="80" font-size="10" fill="#1a6fb5">normal (P50 = 27 mmHg)</text>
    <line x1="72" y1="92" x2="94" y2="92" stroke="#d1495b" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="100" y="96" font-size="10" fill="#d1495b">right-shifted (P50 = 34)</text>
    <text x="72" y="140" font-size="9.5" fill="#555">right shift: acid, CO2, heat, 2,3-BPG</text>

    <circle cx="381.5" cy="69.8" r="4.5" fill="#2e8b57"/>
    <circle cx="196.5" cy="123.7" r="4.5" fill="#2e8b57"/>
    <text x="374" y="60" font-size="11" font-weight="bold" fill="#2e8b57" text-anchor="middle">a</text>
    <text x="196.5" y="115" font-size="11" font-weight="bold" fill="#2e8b57" text-anchor="middle">v</text>

    <g font-size="10" fill="#111">
      <text x="232" y="186"><tspan font-weight="bold" fill="#2e8b57">a</tspan> arterial 95 mmHg, 96.8%</text>
      <text x="232" y="200"><tspan font-weight="bold" fill="#2e8b57">v</tspan> mixed venous 40 mmHg, 74.3%</text>
      <text x="232" y="226" font-weight="bold">FLAT above 60 mmHg:</text>
      <text x="232" y="239" fill="#333">big pressure drop,</text>
      <text x="232" y="252" fill="#333">tiny loss &#8212; safety margin</text>
      <text x="232" y="274" font-weight="bold">STEEP below 60 mmHg:</text>
      <text x="232" y="287" fill="#333">tiny pressure drop,</text>
      <text x="232" y="300" fill="#333">big unloading &#8212; delivery</text>
    </g>

    <line x1="458" y1="20" x2="458" y2="390" stroke="#d7e0ea" stroke-width="1"/>

    <text x="470" y="28" font-size="13" font-weight="bold">(b) Total oxygen content of arterial blood</text>
    <text x="470" y="45" font-size="9.5" fill="#555">hemoglobin 15 g/dL, sea level, PaCO2 40 mmHg, R = 0.8</text>

    <rect x="470" y="60" width="16" height="10" fill="#1a6fb5"/>
    <text x="492" y="69" font-size="10.5" fill="#333">bound to hemoglobin</text>
    <rect x="620" y="60" width="16" height="10" fill="#d1495b"/>
    <text x="642" y="69" font-size="10.5" fill="#333">dissolved</text>

    <g stroke="#111" stroke-width="1.2" fill="none">
      <line x1="520" y1="88" x2="520" y2="302"/>
      <line x1="520" y1="302" x2="800" y2="302"/>
    </g>
    <g font-size="9.5" fill="#333" text-anchor="end">
      <text x="514" y="306">0</text>
      <text x="514" y="262">5</text>
      <text x="514" y="218">10</text>
      <text x="514" y="174">15</text>
      <text x="514" y="131">20</text>
    </g>
    <text x="492" y="195" font-size="10.5" fill="#333" text-anchor="middle" transform="rotate(-90 492 195)">mL O2 per dL blood</text>

    <rect x="560" y="131.8" width="72" height="170.2" fill="#1a6fb5"/>
    <rect x="560" y="129.3" width="72" height="2.5" fill="#d1495b"/>
    <rect x="680" y="126.1" width="72" height="175.9" fill="#1a6fb5"/>
    <rect x="680" y="108.9" width="72" height="17.3" fill="#d1495b"/>

    <text x="596" y="122" font-size="12" font-weight="bold" text-anchor="middle">19.73</text>
    <text x="716" y="101" font-size="12" font-weight="bold" text-anchor="middle">22.07</text>

    <g font-size="11" fill="#ffffff" text-anchor="middle">
      <text x="596" y="222">19.45</text>
      <text x="716" y="222">20.10</text>
    </g>
    <text x="756" y="122" font-size="10" fill="#d1495b" text-anchor="start">1.97</text>
    <text x="638" y="135" font-size="10" fill="#d1495b" text-anchor="start">0.29</text>

    <g font-size="10.5" text-anchor="middle">
      <text x="596" y="318" font-weight="bold">room air</text>
      <text x="596" y="331" font-size="9.5" fill="#333">PaO2 = 95 mmHg</text>
      <text x="716" y="318" font-weight="bold">100% oxygen</text>
      <text x="716" y="331" font-size="9.5" fill="#333">PaO2 = 658 mmHg</text>
    </g>

    <g font-size="10.5">
      <text x="470" y="360" font-weight="bold" fill="#d1495b">PaO2 rises 6.9&#215;. Content rises 11.9%.</text>
      <text x="470" y="376" fill="#333">The hemoglobin was already 96.8% full, and</text>
      <text x="470" y="390" fill="#333">the dissolved term is tiny at any pressure.</text>
    </g>
  </g>
</svg>
