<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" role="img" aria-label="Three panels: saturating carrier transport versus linear simple diffusion, a membrane cartoon with a channel, the sodium potassium pump and a sodium coupled symporter, and a red cell in hypotonic, isotonic and hypertonic baths">
  <rect width="800" height="490" fill="#ffffff"/>
  <defs>
    <marker id="ahInk" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 z" fill="#333"/></marker>
    <marker id="ahBlue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 z" fill="#1a6fb5"/></marker>
    <marker id="ahCoral" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 z" fill="#d1495b"/></marker>
    <marker id="ahGreen" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 z" fill="#2e8b57"/></marker>
  </defs>

  <text x="14" y="22" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">Which way it moves, how fast, and who pays</text>

  <text x="45" y="52" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111">(a) channels are linear; carriers saturate</text>
  <line x1="75" y1="215" x2="365" y2="215" stroke="#333" stroke-width="1.6" marker-end="url(#ahInk)"/>
  <line x1="75" y1="215" x2="75" y2="64" stroke="#333" stroke-width="1.6" marker-end="url(#ahInk)"/>
  <line x1="75" y1="105" x2="362" y2="105" stroke="#d1495b" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="80" y="100" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#d1495b">T<tspan font-size="8" dy="3">m</tspan><tspan dy="-3"> (transport maximum)</tspan></text>
  <line x1="75" y1="215" x2="355" y2="72" stroke="#1a6fb5" stroke-width="2"/>
  <polyline points="75,215 85,201.3 95,190.6 105,182.0 115,175.0 130,166.6 145,160.0 165,153.1 185,147.8 210,142.6 235,138.5 265,134.6 295,131.6 325,129.1 360,126.7" fill="none" stroke="#d1495b" stroke-width="2"/>
  <text x="352" y="66" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a6fb5">simple diffusion / channel</text>
  <text x="358" y="153" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#d1495b">carrier (saturable)</text>
  <text x="220" y="234" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333">driving gradient  &#916;c</text>
  <text x="66" y="140" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#333" transform="rotate(-90 66 140)">flux  J</text>

  <text x="420" y="52" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111">(c) a red cell in three baths (inside 300 mOsm)</text>

  <rect x="455" y="78" width="70" height="132" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.4"/>
  <text x="490" y="94" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">200 mOsm</text>
  <circle cx="490" cy="152" r="30" fill="#cfe3f2" stroke="#1a6fb5" stroke-width="1.8"/>
  <text x="490" y="156" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a6fb5">1.5&#215;</text>
  <line x1="463" y1="116" x2="477" y2="132" stroke="#1a6fb5" stroke-width="1.8" marker-end="url(#ahBlue)"/>
  <text x="490" y="227" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111">hypotonic</text>
  <text x="490" y="241" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">swells, may lyse</text>

  <rect x="565" y="78" width="70" height="132" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.4"/>
  <text x="600" y="94" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">300 mOsm</text>
  <circle cx="600" cy="152" r="22" fill="#cfe3f2" stroke="#1a6fb5" stroke-width="1.8"/>
  <text x="600" y="156" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a6fb5">1.0&#215;</text>
  <text x="600" y="227" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111">isotonic</text>
  <text x="600" y="241" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">no net flow</text>

  <rect x="675" y="78" width="70" height="132" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.4"/>
  <text x="710" y="94" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">600 mOsm</text>
  <circle cx="710" cy="152" r="15" fill="#cfe3f2" stroke="#1a6fb5" stroke-width="1.8"/>
  <text x="710" y="156" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#1a6fb5">0.5&#215;</text>
  <line x1="702" y1="143" x2="687" y2="127" stroke="#1a6fb5" stroke-width="1.8" marker-end="url(#ahBlue)"/>
  <text x="710" y="227" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111">hypertonic</text>
  <text x="710" y="241" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">shrinks</text>

  <text x="40" y="276" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111">(b) the membrane, up close &#8212; one pump pays for everything downstream</text>
  <rect x="60" y="345" width="710" height="40" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1.4"/>
  <text x="64" y="300" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#333">OUTSIDE</text>
  <text x="64" y="313" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">high Na<tspan font-size="7" dy="-4">+</tspan></text>
  <text x="64" y="412" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#333">INSIDE</text>
  <text x="64" y="425" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">high K<tspan font-size="7" dy="-4">+</tspan></text>

  <rect x="163" y="345" width="12" height="40" fill="#1a6fb5"/>
  <rect x="197" y="345" width="12" height="40" fill="#1a6fb5"/>
  <line x1="186" y1="316" x2="186" y2="414" stroke="#1a6fb5" stroke-width="2" marker-end="url(#ahBlue)"/>
  <text x="186" y="307" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#1a6fb5">Na<tspan font-size="7.5" dy="-4">+</tspan><tspan dy="4"> leaks in</tspan></text>
  <text x="186" y="440" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">channel: a pore, 10^6 to 10^8 ions/s</text>
  <text x="186" y="454" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">gated, flux linear in gradient</text>

  <rect x="398" y="345" width="44" height="40" rx="6" fill="#d1495b"/>
  <text x="420" y="369" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff">ATP</text>
  <line x1="385" y1="414" x2="385" y2="316" stroke="#d1495b" stroke-width="2" marker-end="url(#ahCoral)"/>
  <line x1="455" y1="316" x2="455" y2="414" stroke="#d1495b" stroke-width="2" marker-end="url(#ahCoral)"/>
  <text x="382" y="307" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#d1495b">3 Na<tspan font-size="7.5" dy="-4">+</tspan><tspan dy="4"> out</tspan></text>
  <text x="458" y="307" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#d1495b">2 K<tspan font-size="7.5" dy="-4">+</tspan><tspan dy="4"> in</tspan></text>
  <text x="400" y="440" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">Na/K-ATPase: 3 out, 2 in, net +1 out</text>
  <text x="400" y="454" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">electrogenic &#183; &#8776;100 cycles/s</text>

  <rect x="633" y="345" width="44" height="40" rx="6" fill="#2e8b57"/>
  <text x="655" y="369" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-weight="bold" fill="#ffffff">SGLT</text>
  <line x1="620" y1="316" x2="620" y2="414" stroke="#2e8b57" stroke-width="2" marker-end="url(#ahGreen)"/>
  <line x1="690" y1="316" x2="690" y2="414" stroke="#2e8b57" stroke-width="2" marker-end="url(#ahGreen)"/>
  <text x="617" y="307" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#2e8b57">Na<tspan font-size="7.5" dy="-4">+</tspan><tspan dy="4"> down</tspan></text>
  <text x="693" y="307" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#2e8b57">glucose up</text>
  <text x="655" y="440" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">symporter: spends the Na gradient</text>
  <text x="655" y="454" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">no ATP here &#8212; the pump already paid</text>

  <text x="400" y="478" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-style="italic" fill="#111">Block the pump and every arrow in this panel stops within minutes.</text>
</svg>
