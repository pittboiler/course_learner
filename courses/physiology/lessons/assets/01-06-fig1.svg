<text x="78" y="48" font-size="11" font-weight="bold" fill="#333">(a) filament overlap at three sarcomere lengths</text>

<rect x="664" y="64" width="22" height="9" fill="#d1495b"/>
<text x="692" y="72" font-size="9.5" fill="#333">thick (myosin)</text>
<line x1="664" y1="86" x2="686" y2="86" stroke="#1a6fb5" stroke-width="3.5"/>
<text x="692" y="89" font-size="9.5" fill="#333">thin (actin)</text>

<g stroke-linecap="butt">

<line x1="218.8" y1="113" x2="218.8" y2="127" stroke="#555" stroke-width="1"/>
<line x1="178.0" y1="102" x2="226.0" y2="102" stroke="#1a6fb5" stroke-width="3.5"/>
