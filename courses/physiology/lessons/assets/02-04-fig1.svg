<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 700" width="560" height="700" role="img" aria-label="Three panels: a pressure-volume compliance loop with hysteresis and a stiff-lung curve, a spirogram with lung volumes and capacities and residual volume shaded, and alveolar pressure, intrapleural pressure and airflow traces through one quiet breath">
