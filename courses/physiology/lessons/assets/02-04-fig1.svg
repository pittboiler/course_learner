  <line x1="286" y1="512" x2="286" y2="648" stroke="#8fa8c0" stroke-width="0.8" stroke-dasharray="3,3"/>

  <line x1="70" y1="530" x2="340" y2="530" stroke="#999" stroke-width="0.8"/>
  <polyline points="70,530 85,538 105,541 140,536 178,530 192,522 215,519 250,524 286,530 340,530" fill="none" stroke="#1a6fb5" stroke-width="2"/>
  <text x="64" y="533" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">0</text>
  <text x="348" y="528" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1a6fb5">Alveolar P</text>
  <text x="348" y="540" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555">drives airflow</text>

  <line x1="70" y1="565" x2="340" y2="565" stroke="#999" stroke-width="0.8" stroke-dasharray="3,3"/>
  <polyline points="70,565 100,573 140,583 178,589 215,581 250,572 286,565 340,565" fill="none" stroke="#d1495b" stroke-width="2"/>
  <text x="64" y="568" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">&#8722;5</text>
  <text x="64" y="594" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">&#8722;7.5</text>
  <text x="348" y="572" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">Intrapleural P</text>
  <text x="348" y="584" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555">always negative</text>

  <line x1="70" y1="625" x2="340" y2="625" stroke="#999" stroke-width="0.8"/>
  <polyline points="70,625 90,610 124,606 160,612 178,625 200,640 230,643 265,634 286,625 340,625" fill="none" stroke="#2e8b57" stroke-width="2"/>
