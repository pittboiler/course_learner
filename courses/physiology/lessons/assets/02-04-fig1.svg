  <text x="269" y="347" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111">IRV 3000</text>

  <line x1="262" y1="388" x2="262" y2="403" stroke="#333" stroke-width="1.2"/>
  <line x1="259" y1="403" x2="265" y2="403" stroke="#333" stroke-width="1.2"/>
  <text x="269" y="399" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b">V<tspan font-size="8" dy="2">T</tspan><tspan dy="-2"> 500</tspan></text>

  <line x1="262" y1="403" x2="262" y2="435" stroke="#333" stroke-width="1.2"/>
  <line x1="259" y1="435" x2="265" y2="435" stroke="#333" stroke-width="1.2"/>
  <text x="269" y="423" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#111">ERV 1100</text>

