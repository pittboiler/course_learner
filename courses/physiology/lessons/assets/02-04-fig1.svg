  <text x="61" y="243" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">0</text>
  <text x="61" y="200" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">1</text>
