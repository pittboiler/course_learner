  <polyline points="70,403 82,388 94,403 106,388 118,403 130,388 142,403 158,300 168,300 196,435 206,435 220,403 232,388 244,403 252,392" fill="none" stroke="#1a6fb5" stroke-width="2"/>

  <text x="74" y="457" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#a03040">RV: needs gas dilution, not spirometry</text>

  <line x1="262" y1="300" x2="262" y2="388" stroke="#333" stroke-width="1.2"/>
  <line x1="259" y1="300" x2="265" y2="300" stroke="#333" stroke-width="1.2"/>
