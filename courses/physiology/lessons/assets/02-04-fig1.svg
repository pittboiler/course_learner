  <text x="348" y="622" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#2e8b57">Airflow</text>
  <text x="348" y="634" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555">in above, out below</text>

  <text x="124" y="662" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">inspiration</text>
  <text x="232" y="662" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">expiration</text>
  <text x="313" y="662" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">pause</text>
  <text x="70" y="682" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555">Alveolar P returns to zero at both ends of the breath; volume still changed, because the</text>
  <text x="70" y="694" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555">distending pressure is alveolar minus intrapleural, not alveolar alone.</text>
</svg>
