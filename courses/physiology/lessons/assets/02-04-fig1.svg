  <text x="269" y="456" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#a03040">RV 1200</text>

  <line x1="395" y1="403" x2="395" y2="300" stroke="#1a6fb5" stroke-width="1.2"/>
  <line x1="392" y1="300" x2="398" y2="300" stroke="#1a6fb5" stroke-width="1.2"/>
