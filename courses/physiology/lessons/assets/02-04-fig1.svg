  <text x="14" y="20" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">Breathing: what distends the lung, what fills it, what it costs</text>

  <text x="14" y="42" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">(a) Compliance is the slope of the pressure&#8211;volume curve</text>

