  <text x="256" y="256" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">15</text>
  <text x="318" y="256" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">20</text>
  <text x="380" y="256" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">25</text>
  <text x="230" y="272" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111">Transpulmonary pressure (cm H&#8322;O)</text>

