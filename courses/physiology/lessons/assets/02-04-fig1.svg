  <text x="86" y="100" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#2e8b57">&#8776; 200 mL / cm H&#8322;O</text>

  <line x1="400" y1="78" x2="420" y2="78" stroke="#1a6fb5" stroke-width="2.2"/>
  <text x="426" y="82" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">normal lung</text>
  <line x1="400" y1="100" x2="420" y2="100" stroke="#d1495b" stroke-width="2.2"/>
  <text x="426" y="104" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">stiff lung</text>
  <text x="426" y="116" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111">(fibrosis, low C)</text>
  <text x="400" y="140" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555">the two limbs</text>
  <text x="400" y="152" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555">differ: hysteresis</text>

  <text x="14" y="298" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111">(b) Spirogram: four volumes, four capacities (mL)</text>

  <rect x="70" y="435" width="182" height="35" fill="#f7dfe3"/>

  <line x1="66" y1="300" x2="258" y2="300" stroke="#8fa8c0" stroke-width="0.8" stroke-dasharray="3,3"/>
