<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 645" width="820" height="645" role="img" aria-label="Three panels showing the integrated cardiovascular response to exercise: pump output versus work rate, oxygen uptake versus work rate with a plateau, and regional blood flow at rest versus maximal exercise.">
<rect width="820" height="645" fill="#ffffff"/>
<g font-family="Helvetica,Arial,sans-serif">

