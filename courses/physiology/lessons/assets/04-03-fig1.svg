<polyline points="50,191.3 106.7,162 163.3,135 220,109.1 276.7,84.4 333.3,67.5 390,56.3" fill="none" stroke="#d1495b" stroke-width="2.4"/>
<polyline points="50,190.1 106.7,157.5 163.3,137.3 220,126 276.7,121.5 333.3,121.5 390,121.5" fill="none" stroke="#2e8b57" stroke-width="2.4"/>

