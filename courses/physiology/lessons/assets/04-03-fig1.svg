</g>

<rect x="440" y="382" width="14" height="10" fill="#1a6fb5"/><text x="459" y="391" font-size="10" fill="#333">rest</text>
<rect x="500" y="382" width="14" height="10" fill="#d1495b"/><text x="519" y="391" font-size="10" fill="#333">maximal exercise</text>
<text x="622" y="391" font-size="10" font-weight="bold" fill="#111">Total CO 5.0 &#8594; 25.0 L/min</text>

