<text x="50" y="340" font-size="13" font-weight="bold" fill="#111">(c) Where the blood goes: rest vs maximal exercise (absolute flow)</text>
<rect x="90" y="375" width="690" height="215" fill="#f5f7fa" stroke="#8fa8c0" stroke-width="1"/>
<g stroke="#c9d6e2" stroke-width="0.7">
<line x1="90" y1="543.3" x2="780" y2="543.3"/>
