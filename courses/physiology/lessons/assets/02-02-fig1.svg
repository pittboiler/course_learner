<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Panel a shows aortic, ventricular and atrial pressure traces plus ventricular volume across one heartbeat, with the four valve events marked at the pressure crossings. Panel b replots the same beat as a pressure-volume loop with the four phases, EDV, ESV, stroke volume, the ESPVR line, and a second lighter loop for increased preload.">
