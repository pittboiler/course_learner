<line x1="80" y1="513.9" x2="500" y2="330.9" stroke="#1a6fb5" stroke-width="1.8" stroke-dasharray="6 4"/>
<polyline points="80,447.4 143.2,440.5 206.4,429.7 243.4,421.2 269.6,414.1 290,408.1 353.2,387.1 436.8,355.3 500,329.4" fill="none" stroke="#d1495b" stroke-width="2.2"/>
<circle cx="269.6" cy="414.1" r="3.6" fill="#d1495b"/>
<text x="264" y="405" font-family="Helvetica,Arial,sans-serif" font-size="9.5" font-weight="bold" fill="#d1495b" text-anchor="end">hyperkalemia</text>

<text x="300" y="448" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">low K<tspan font-size="7.5" dy="-4">+</tspan><tspan dy="4">: the Na</tspan><tspan font-size="7.5" dy="-4">+</tspan><tspan dy="4"> leak lifts V</tspan><tspan font-size="7.5" dy="3">m</tspan><tspan dy="-3"> above E</tspan><tspan font-size="7.5" dy="3">K</tspan></text>
<text x="300" y="462" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">high K<tspan font-size="7.5" dy="-4">+</tspan><tspan dy="4">: V</tspan><tspan font-size="7.5" dy="3">m</tspan><tspan dy="-3"> follows E</tspan><tspan font-size="7.5" dy="3">K</tspan><tspan dy="-3"> almost exactly</tspan></text>
<line x1="300" y1="482" x2="330" y2="482" stroke="#1a6fb5" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="336" y="486" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#1a6fb5">E<tspan font-size="8" dy="3">K</tspan><tspan dy="-3"> alone (Nernst)</tspan></text>
<line x1="300" y1="500" x2="330" y2="500" stroke="#d1495b" stroke-width="2.2"/>
<text x="336" y="504" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#d1495b">V<tspan font-size="8" dy="3">m</tspan><tspan dy="-3">, 3 percent Na</tspan><tspan font-size="7.5" dy="-4">+</tspan><tspan dy="4"> leak (Goldman)</tspan></text>
</svg>
