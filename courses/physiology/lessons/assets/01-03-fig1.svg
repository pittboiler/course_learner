<text x="353.2" y="537" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555" text-anchor="middle">20</text>
<text x="436.8" y="537" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555" text-anchor="middle">50</text>
