<line x1="462.5" y1="180" x2="462.5" y2="188" stroke="#333" stroke-width="1"/>
<text x="79.2" y="201" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555" text-anchor="middle">&#8722;100</text>
<text x="175.0" y="201" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555" text-anchor="middle">&#8722;50</text>
<text x="270.8" y="201" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555" text-anchor="middle">0</text>
<text x="366.7" y="201" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555" text-anchor="middle">+50</text>
<text x="462.5" y="201" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555" text-anchor="middle">+100</text>
<text x="295" y="221" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">membrane voltage, inside minus outside (mV)</text>

<text x="20" y="272" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">(b) The resting potential tracks plasma K<tspan font-size="9" dy="-5">+</tspan></text>
<text x="20" y="290" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555">on a log axis a straight line means Nernstian: 61 mV per tenfold change</text>

<rect x="194.3" y="310" width="32.5" height="210" fill="#dde7f0"/>
<text x="210.5" y="305" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#4a6c8c" text-anchor="middle">normal</text>

<line x1="80" y1="317.5" x2="512" y2="317.5" stroke="#ececec" stroke-width="1"/>
<line x1="80" y1="355.0" x2="512" y2="355.0" stroke="#ececec" stroke-width="1"/>
