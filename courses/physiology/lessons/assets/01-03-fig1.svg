<line x1="80" y1="467.5" x2="512" y2="467.5" stroke="#ececec" stroke-width="1"/>
<line x1="80" y1="505.0" x2="512" y2="505.0" stroke="#ececec" stroke-width="1"/>

<line x1="80" y1="310" x2="80" y2="520" stroke="#333" stroke-width="1.5"/>
<line x1="80" y1="520" x2="512" y2="520" stroke="#333" stroke-width="1.5"/>

<text x="74" y="321" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555" text-anchor="end">0</text>
<text x="74" y="358.5" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555" text-anchor="end">&#8722;25</text>
<text x="74" y="396" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555" text-anchor="end">&#8722;50</text>
<text x="74" y="433.5" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555" text-anchor="end">&#8722;75</text>
<text x="74" y="471" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555" text-anchor="end">&#8722;100</text>
<text x="74" y="508.5" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555" text-anchor="end">&#8722;125</text>
<text x="30" y="415" transform="rotate(-90 30 415)" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">membrane voltage (mV)</text>

<line x1="143.2" y1="520" x2="143.2" y2="526" stroke="#333" stroke-width="1"/>
<line x1="206.4" y1="520" x2="206.4" y2="526" stroke="#333" stroke-width="1"/>
<line x1="269.6" y1="520" x2="269.6" y2="526" stroke="#d1495b" stroke-width="1.5"/>
<line x1="290.0" y1="520" x2="290.0" y2="526" stroke="#333" stroke-width="1"/>
<line x1="353.2" y1="520" x2="353.2" y2="526" stroke="#333" stroke-width="1"/>
<line x1="436.8" y1="520" x2="436.8" y2="526" stroke="#333" stroke-width="1"/>
<line x1="500.0" y1="520" x2="500.0" y2="526" stroke="#333" stroke-width="1"/>
<text x="80" y="537" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555" text-anchor="middle">1</text>
<text x="143.2" y="537" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555" text-anchor="middle">2</text>
<text x="206.4" y="537" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555" text-anchor="middle">4</text>
