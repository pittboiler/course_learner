<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 580" width="560" height="580" role="img" aria-label="Panel a shows a horizontal membrane-voltage axis marking the equilibrium potentials of potassium, chloride, sodium and calcium, with the resting potential placed just positive of the potassium equilibrium potential, and arrows whose lengths give each ion's driving force at rest. Panel b plots resting potential against plasma potassium concentration on a logarithmic axis: the Nernst potassium line is straight with a slope of 61 millivolts per tenfold, while the Goldman curve merges with it at high potassium and flattens above it at low potassium where sodium permeability matters.">
<rect width="560" height="580" fill="#ffffff"/>

<text x="20" y="26" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">(a) Equilibrium potentials and driving forces at rest</text>
<text x="20" y="46" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#555">arrow length = driving force V<tspan font-size="8" dy="3">m</tspan><tspan dy="-3"> &#8722; E</tspan><tspan font-size="8" dy="3">ion</tspan><tspan dy="-3">; the arrow points where that ion pushes the membrane</tspan></text>

<line x1="127.5" y1="68" x2="509.2" y2="68" stroke="#d1495b" stroke-width="2"/>
<polygon points="509.2,68 500.2,64 500.2,72" fill="#d1495b"/>
<text x="318" y="60" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b" text-anchor="middle">Ca<tspan font-size="8" dy="-4">2+</tspan><tspan dy="4">: &#8722;199 mV, inward &#8212; huge</tspan></text>

<line x1="127.5" y1="96" x2="386.0" y2="96" stroke="#d1495b" stroke-width="2"/>
<polygon points="386.0,96 377.0,92 377.0,100" fill="#d1495b"/>
<text x="257" y="88" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#d1495b" text-anchor="middle">Na<tspan font-size="8" dy="-4">+</tspan><tspan dy="4">: &#8722;135 mV, inward</tspan></text>

<line x1="127.5" y1="124" x2="90.3" y2="124" stroke="#1a6fb5" stroke-width="2"/>
<polygon points="90.3,124 99.3,120 99.3,128" fill="#1a6fb5"/>
<text x="142" y="128" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1a6fb5">K<tspan font-size="8" dy="-4">+</tspan><tspan dy="4">: +19 mV, outward &#8212; small</tspan></text>
<text x="330" y="128" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#2e8b57">Cl<tspan font-size="8" dy="-4">&#8722;</tspan><tspan dy="4">: &#8722;2 mV, no net drive</tspan></text>

<line x1="127.5" y1="56" x2="127.5" y2="187" stroke="#111" stroke-width="2.5"/>
<line x1="90.3" y1="152" x2="90.3" y2="187" stroke="#1a6fb5" stroke-width="1.6"/>
<line x1="130.9" y1="152" x2="130.9" y2="187" stroke="#2e8b57" stroke-width="1.6"/>
<line x1="386.0" y1="152" x2="386.0" y2="187" stroke="#d1495b" stroke-width="1.6"/>
<line x1="509.2" y1="152" x2="509.2" y2="187" stroke="#d1495b" stroke-width="1.6"/>

<text x="90.3" y="146" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1a6fb5" text-anchor="middle">E<tspan font-size="8.5" dy="3">K</tspan><tspan dy="-3"> = &#8722;94</tspan></text>
<text x="386.0" y="146" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d1495b" text-anchor="middle">E<tspan font-size="8.5" dy="3">Na</tspan><tspan dy="-3"> = +60</tspan></text>
<text x="509.2" y="146" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d1495b" text-anchor="middle">E<tspan font-size="8.5" dy="3">Ca</tspan><tspan dy="-3"> = +124</tspan></text>
<text x="136" y="148" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111">V<tspan font-size="8.5" dy="3">rest</tspan><tspan dy="-3"> = &#8722;75</tspan></text>
<text x="140" y="165" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#2e8b57">E<tspan font-size="8.5" dy="3">Cl</tspan><tspan dy="-3"> = &#8722;73 (passive: it follows V</tspan><tspan font-size="8.5" dy="3">m</tspan><tspan dy="-3">)</tspan></text>

<line x1="55" y1="180" x2="535" y2="180" stroke="#333" stroke-width="1.5"/>
<line x1="79.2" y1="180" x2="79.2" y2="188" stroke="#333" stroke-width="1"/>
<line x1="175.0" y1="180" x2="175.0" y2="188" stroke="#333" stroke-width="1"/>
