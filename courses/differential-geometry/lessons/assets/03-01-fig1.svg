<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="560" height="340" fill="#ffffff"/>
  <defs>
    <marker id="ta" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#111111"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="15" fill="#111">A (1,2)-tensor: a machine with slots, linear in each, returning a number.</text>

  <!-- central machine -->
  <rect x="215" y="140" width="130" height="70" rx="8" fill="#111111" fill-opacity="0.05" stroke="#1a1a1a" stroke-width="2"/>
  <text x="262" y="183" font-size="26" font-style="italic" fill="#111">T</text>

  <!-- top slot: one covector (upper index) -->
  <line x1="280" y1="80" x2="280" y2="138" stroke="#c33" stroke-width="2" marker-end="url(#ta)"/>
  <text x="235" y="72" font-size="14" fill="#c33">covector ω  (1 up-slot)</text>

  <!-- bottom slots: two vectors (lower indices) -->
  <line x1="250" y1="280" x2="250" y2="212" stroke="#0a7" stroke-width="2" marker-end="url(#ta)"/>
  <line x1="310" y1="280" x2="310" y2="212" stroke="#0a7" stroke-width="2" marker-end="url(#ta)"/>
  <text x="150" y="300" font-size="14" fill="#0a7">vectors u, v  (2 down-slots)</text>

  <!-- output -->
  <line x1="345" y1="175" x2="440" y2="175" stroke="#111111" stroke-width="2" marker-end="url(#ta)"/>
  <text x="450" y="181" font-size="18" fill="#111">∈ ℝ</text>

  <!-- component note -->
  <text x="380" y="240" font-size="15" fill="#333">components</text>
  <text x="380" y="262" font-size="17" fill="#111">T<tspan font-size="12" dy="-7">i</tspan><tspan font-size="12" dy="14">jk</tspan></text>
  <text x="60" y="175" font-size="13" fill="#555">linear in</text>
  <text x="60" y="192" font-size="13" fill="#555">every slot</text>
</svg>
