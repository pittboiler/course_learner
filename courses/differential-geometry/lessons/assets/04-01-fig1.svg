<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="560" height="360" fill="#ffffff"/>
  <defs>
    <marker id="er" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#c33"/>
    </marker>
    <marker id="et" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#0a7"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="15" fill="#111">The polar basis eᵣ, e_θ turns from point to point — so ∂V isn't the whole story.</text>

  <!-- origin -->
  <circle cx="90" cy="300" r="3" fill="#333"/>
  <text x="70" y="318" font-size="13" fill="#555">O</text>

  <!-- concentric circle arcs (r = const) -->
  <path d="M 250,300 A 160 160 0 0 0 90,140" fill="none" stroke="#ddd" stroke-width="1"/>
  <path d="M 330,300 A 240 240 0 0 0 90,60" fill="none" stroke="#ddd" stroke-width="1"/>

  <!-- radial lines (theta = const) -->
  <line x1="90" y1="300" x2="330" y2="300" stroke="#eee" stroke-width="1"/>
  <line x1="90" y1="300" x2="290" y2="160" stroke="#eee" stroke-width="1"/>
  <line x1="90" y1="300" x2="180" y2="80" stroke="#eee" stroke-width="1"/>

  <!-- point A (on the horizontal ray) -->
  <circle cx="250" cy="300" r="3.5" fill="#111"/>
  <text x="240" y="322" font-size="13" fill="#111">A</text>
  <!-- e_r at A: radially outward (rightward) -->
  <line x1="250" y1="300" x2="315" y2="300" stroke="#c33" stroke-width="2.6" marker-end="url(#er)"/>
  <text x="320" y="305" font-size="15" font-style="italic" fill="#c33">eᵣ</text>
  <!-- e_theta at A: tangential (upward) -->
  <line x1="250" y1="300" x2="250" y2="235" stroke="#0a7" stroke-width="2.6" marker-end="url(#et)"/>
  <text x="256" y="235" font-size="15" font-style="italic" fill="#0a7">e_θ</text>

  <!-- point B (on the 35-deg ray, farther) -->
  <circle cx="290" cy="160" r="3.5" fill="#111"/>
  <text x="298" y="158" font-size="13" fill="#111">B</text>
  <!-- e_r at B: radially outward (up-right along ray from O) -->
  <line x1="290" y1="160" x2="343" y2="123" stroke="#c33" stroke-width="2.6" marker-end="url(#er)"/>
  <text x="348" y="120" font-size="15" font-style="italic" fill="#c33">eᵣ</text>
  <!-- e_theta at B: tangential, perpendicular to ray -->
  <line x1="290" y1="160" x2="245" y2="100" stroke="#0a7" stroke-width="2.6" marker-end="url(#et)"/>
  <text x="222" y="98" font-size="15" font-style="italic" fill="#0a7">e_θ</text>

  <text x="120" y="348" font-size="13" fill="#333">Same "eᵣ, e_θ", different directions ⟹ correction term Γ.</text>
</svg>
