<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="640" height="380" fill="#ffffff"/>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#111111"/>
    </marker>
    <marker id="ahg" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#1f6fb2"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="24" y="28" fill="#111111" font-size="15">The Gauss map N sends the unit normal at p to a point on the unit sphere S&#178;.</text>

  <!-- ================= LEFT: surface patch S ================= -->
  <!-- u-curves -->
  <polyline points="70,270 118,244 168,236 218,248" fill="none" stroke="#b3b3b3" stroke-width="1.5"/>
  <polyline points="60,222 110,196 162,188 214,200" fill="none" stroke="#b3b3b3" stroke-width="1.5"/>
  <polyline points="66,178 116,154 168,148 220,160" fill="none" stroke="#b3b3b3" stroke-width="1.5"/>
  <!-- v-curves -->
  <polyline points="70,270 60,222 66,178" fill="none" stroke="#b3b3b3" stroke-width="1.5"/>
  <polyline points="118,244 110,196 116,154" fill="none" stroke="#b3b3b3" stroke-width="1.5"/>
  <polyline points="168,236 162,188 168,148" fill="none" stroke="#b3b3b3" stroke-width="1.5"/>
  <polyline points="218,248 214,200 220,160" fill="none" stroke="#b3b3b3" stroke-width="1.5"/>

  <!-- tangent plane at p (dashed parallelogram) -->
  <polygon points="118,214 200,224 214,186 132,176" fill="#4a90d9" opacity="0.14"/>
  <polygon points="118,214 200,224 214,186 132,176" fill="none" stroke="#4a90d9" stroke-width="1.3" stroke-dasharray="5 4"/>

  <!-- unit normal N at p -->
  <line x1="162" y1="196" x2="207" y2="136" stroke="#111111" stroke-width="2.6" marker-end="url(#ah)"/>
  <circle cx="162" cy="196" r="4.5" fill="#111111"/>
  <text x="146" y="212" fill="#111111" font-style="italic">p</text>
  <text x="210" y="132" fill="#111111" font-weight="bold">N(p)</text>
  <text x="120" y="300" fill="#555555" font-style="italic" font-size="13">surface S</text>

  <!-- ================= arrow between ================= -->
  <path d="M 250 190 C 300 160, 360 160, 408 190" fill="none" stroke="#1f6fb2" stroke-width="2.2" marker-end="url(#ahg)"/>
  <text x="270" y="150" fill="#1f6fb2" font-size="14" font-weight="bold">N : S &#8594; S&#178;</text>
  <text x="266" y="212" fill="#1f6fb2" font-size="12">slide N to the origin</text>

  <!-- ================= RIGHT: unit sphere S^2 ================= -->
  <circle cx="500" cy="210" r="90" fill="#4a90d9" opacity="0.08"/>
  <circle cx="500" cy="210" r="90" fill="none" stroke="#111111" stroke-width="2"/>
  <!-- equator ellipse -->
  <ellipse cx="500" cy="210" rx="90" ry="26" fill="none" stroke="#b3b3b3" stroke-width="1.4"/>
  <!-- meridian ellipse -->
  <ellipse cx="500" cy="210" rx="26" ry="90" fill="none" stroke="#b3b3b3" stroke-width="1.4"/>

  <!-- center O -->
  <circle cx="500" cy="210" r="3.5" fill="#111111"/>
  <text x="484" y="228" fill="#111111" font-style="italic">O</text>

  <!-- image of N: from O to point on sphere, same direction as at p -->
  <line x1="500" y1="210" x2="554" y2="138" stroke="#111111" stroke-width="2.6" marker-end="url(#ah)"/>
  <circle cx="554" cy="138" r="4.5" fill="#c0532a"/>
  <text x="560" y="132" fill="#c0532a" font-weight="bold">N(p)</text>

  <text x="470" y="330" fill="#555555" font-style="italic" font-size="13">unit sphere S&#178;</text>
</svg>
