<svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="620" height="400" fill="#ffffff"/>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="3.4" orient="auto">
      <path d="M0,0 L7,3.4 L0,6.8 Z" fill="#c0532a"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="24" y="28" fill="#111111" font-size="15">The flow of &#958; = &#8706;/&#8706;&#966; rotates the sphere; each latitude circle slides onto itself.</text>
  <text x="24" y="48" fill="#555555" font-size="13">No distance changes &#8594; the metric is unchanged &#8594; &#958; is a Killing field.</text>

  <!-- rotation axis -->
  <line x1="310" y1="60" x2="310" y2="380" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="318" y="76" fill="#111111" font-size="13" font-style="italic">rotation axis</text>

  <!-- sphere outline -->
  <circle cx="310" cy="222" r="140" fill="#4a90d9" opacity="0.07"/>
  <circle cx="310" cy="222" r="140" fill="none" stroke="#111111" stroke-width="2"/>

  <!-- latitude circles (ellipses) with front solid / back dashed -->
  <!-- upper latitude -->
  <ellipse cx="310" cy="160" rx="118" ry="20" fill="none" stroke="#b3b3b3" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M 192 160 A 118 20 0 0 0 428 160" fill="none" stroke="#555555" stroke-width="1.6"/>
  <!-- equator -->
  <ellipse cx="310" cy="222" rx="140" ry="30" fill="none" stroke="#b3b3b3" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M 170 222 A 140 30 0 0 0 450 222" fill="none" stroke="#555555" stroke-width="1.8"/>
  <!-- lower latitude -->
  <ellipse cx="310" cy="288" rx="116" ry="19" fill="none" stroke="#b3b3b3" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M 194 288 A 116 19 0 0 0 426 288" fill="none" stroke="#555555" stroke-width="1.6"/>

  <!-- flow arrows along the front of the equator (the Killing flow) -->
  <path d="M 250 244 A 140 30 0 0 0 300 251" fill="none" stroke="#c0532a" stroke-width="2.4" marker-end="url(#ah)"/>
  <path d="M 320 251 A 140 30 0 0 0 372 244" fill="none" stroke="#c0532a" stroke-width="2.4" marker-end="url(#ah)"/>
  <!-- flow arrow on upper latitude -->
  <path d="M 272 174 A 118 20 0 0 0 344 174" fill="none" stroke="#c0532a" stroke-width="2.2" marker-end="url(#ah)"/>
  <!-- flow arrow on lower latitude -->
  <path d="M 272 302 A 116 19 0 0 0 344 302" fill="none" stroke="#c0532a" stroke-width="2.2" marker-end="url(#ah)"/>

  <!-- a sample point carried along -->
  <circle cx="250" cy="244" r="4.5" fill="#111111"/>
  <text x="216" y="242" fill="#111111" font-size="13" font-style="italic">p</text>
  <circle cx="372" cy="244" r="4.5" fill="#c0532a"/>
  <text x="380" y="242" fill="#c0532a" font-size="13" font-style="italic">&#966;_t(p)</text>

  <!-- field label -->
  <text x="452" y="150" fill="#c0532a" font-size="15" font-weight="bold">&#958; = &#8706;&#966;</text>
  <text x="452" y="170" fill="#555555" font-size="12">the flow that</text>
  <text x="452" y="186" fill="#555555" font-size="12">spins the sphere</text>

  <text x="196" y="388" fill="#555555" font-size="13" font-style="italic">latitude circles are the integral curves of &#958;</text>
</svg>
