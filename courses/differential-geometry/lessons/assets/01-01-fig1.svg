<svg viewBox="0 0 520 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="520" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#111111"/>
    </marker>
    <marker id="ahT" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#0b5">
      </path>
    </marker>
  </defs>

  <!-- central axis of the helix -->
  <line x1="210" y1="352" x2="210" y2="96" stroke="#999" stroke-width="1.2" stroke-dasharray="5,5"/>

  <!-- the helix -->
  <path fill="none" stroke="#1a1a1a" stroke-width="2.4"
    d="M 295.0,330.0 L 292.7,320.4 L 285.7,311.1 L 274.6,302.4 L 260.0,294.6 L 242.5,287.8 L 223.3,282.3 L 210.0,279.3 L 196.7,276.9 L 183.7,275.1 L 171.4,273.9 L 160.0,273.2 L 149.9,273.0 L 141.2,273.2 L 134.3,273.7 L 129.2,274.5 L 126.0,275.5 L 125.0,276.6 L 126.0,277.7 L 129.2,278.7 L 134.3,279.5 L 141.2,280.0 L 149.9,280.2 L 160.0,280.0 L 171.4,279.3 L 183.7,278.1 L 196.7,276.3 L 210.0,273.9 L 223.3,270.9 L 236.3,267.4 L 248.6,263.3 L 260.0,258.6 L 270.1,253.5 L 278.8,248.0 L 285.7,242.1 L 290.8,235.9 L 294.0,229.6 L 295.0,223.2 L 294.0,216.8 L 290.8,210.4 L 285.7,204.3 L 278.8,198.4 L 270.1,192.9 L 260.0,187.7 L 248.6,183.1 L 236.3,179.0 L 223.3,175.4 L 210.0,172.5 L 196.7,170.1 L 183.7,168.3 L 171.4,167.1 L 160.0,166.4 L 149.9,166.2 L 141.2,166.4 L 134.3,166.9 L 129.2,167.7 L 126.0,168.7 L 125.0,169.8 L 126.0,170.9 L 129.2,171.9 L 134.3,172.7 L 141.2,173.2 L 149.9,173.4 L 160.0,173.2 L 171.4,172.5 L 183.7,171.2 L 196.7,169.5 L 210.0,167.1 L 223.3,164.1 L 236.3,160.6 L 248.6,156.4 L 260.0,151.8 L 270.1,146.7 L 278.8,141.2 L 285.7,135.3 L 290.8,129.1 L 294.0,122.8 L 295.0,116.4"/>

  <!-- osculating-plane hint (faint) -->
  <path d="M 152,300 L 300,282 L 268,214 L 120,232 Z" fill="#111111" fill-opacity="0.05" stroke="#bbbbbb" stroke-width="0.8"/>

  <!-- base point on the curve -->
  <circle cx="210" cy="273.9" r="4.2" fill="#111111"/>

  <!-- Frenet frame arrows at the point -->
  <!-- T: unit tangent, along the curve -->
  <line x1="210" y1="273.9" x2="150" y2="262" stroke="#0b5" stroke-width="3" marker-end="url(#ahT)"/>
  <text x="132" y="256" font-size="19" font-style="italic" fill="#0b5">T</text>
  <!-- N: principal normal, toward the concave side / axis -->
  <line x1="210" y1="273.9" x2="196" y2="214" stroke="#111111" stroke-width="3" marker-end="url(#ah)"/>
  <text x="200" y="208" font-size="19" font-style="italic" fill="#111111">N</text>
  <!-- B: binormal, out of the osculating plane -->
  <line x1="210" y1="273.9" x2="286" y2="252" stroke="#111111" stroke-width="3" marker-end="url(#ah)"/>
  <text x="290" y="250" font-size="19" font-style="italic" fill="#111111">B</text>

  <!-- labels -->
  <text x="300" y="345" font-size="15" fill="#333333">helix</text>
  <text x="150" y="376" font-size="14" fill="#555555">osculating plane spanned by T and N; B is its normal</text>
</svg>
