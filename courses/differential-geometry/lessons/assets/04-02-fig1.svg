<svg viewBox="0 0 520 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="520" height="400" fill="#ffffff"/>
  <defs>
    <marker id="pt" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#c33"/>
    </marker>
    <marker id="pth" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#0a7"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="15" fill="#111">Parallel transport around a loop on the sphere returns the vector rotated.</text>

  <!-- sphere -->
  <circle cx="250" cy="220" r="150" fill="#111111" fill-opacity="0.04" stroke="#1a1a1a" stroke-width="1.6"/>
  <!-- equator (ellipse) -->
  <ellipse cx="250" cy="220" rx="150" ry="42" fill="none" stroke="#bbb" stroke-width="1"/>

  <!-- north pole -->
  <circle cx="250" cy="70" r="4" fill="#111"/>
  <text x="258" y="66" font-size="13" fill="#111">N (pole)</text>

  <!-- two equator points -->
  <circle cx="130" cy="238" r="4" fill="#111"/>
  <text x="96" y="258" font-size="13" fill="#111">A</text>
  <circle cx="330" cy="252" r="4" fill="#111"/>
  <text x="338" y="258" font-size="13" fill="#111">B</text>

  <!-- geodesic triangle edges (meridians + equator arc) -->
  <path d="M250,70 C 190,110 150,180 130,238" fill="none" stroke="#0a7" stroke-width="2.4"/>
  <path d="M250,70 C 300,110 322,190 330,252" fill="none" stroke="#0a7" stroke-width="2.4"/>
  <path d="M130,238 C 200,272 270,272 330,252" fill="none" stroke="#0a7" stroke-width="2.4"/>

  <!-- transported vectors (red): stays 'south-ish' but frame rotates -->
  <!-- at A, pointing along equator toward B -->
  <line x1="130" y1="238" x2="175" y2="250" stroke="#c33" stroke-width="2.6" marker-end="url(#pt)"/>
  <!-- at B, still pointing along equator (parallel) -->
  <line x1="330" y1="252" x2="330" y2="205" stroke="#c33" stroke-width="2.6" marker-end="url(#pt)"/>
  <!-- back at A after full loop: rotated by the angle deficit -->
  <line x1="130" y1="238" x2="120" y2="193" stroke="#c33" stroke-width="2.6" marker-end="url(#pt)" stroke-dasharray="5,4"/>
  <text x="60" y="185" font-size="12" fill="#c33">returns rotated</text>

  <!-- holonomy angle marker -->
  <path d="M 152,244 A 24 24 0 0 0 143,222" fill="none" stroke="#111" stroke-width="1.4"/>
  <text x="150" y="215" font-size="14" fill="#111">Δθ</text>

  <text x="70" y="392" font-size="13" fill="#333">holonomy angle Δθ = (enclosed solid angle) = ∫∫ K dA</text>
</svg>
