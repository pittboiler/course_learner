<svg viewBox="0 0 580 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="580" height="360" fill="#ffffff"/>

  <text x="24" y="28" fill="#111111" font-size="15">Smoothness of F is checked downstairs, in the coordinate representative.</text>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7.5" refY="3.4" orient="auto">
      <path d="M0,0 L8,3.4 L0,6.8 Z" fill="#111111"/>
    </marker>
  </defs>

  <!-- ===== nodes ===== -->
  <!-- top-left M -->
  <text x="120" y="95" fill="#111111" font-style="italic" font-size="22" font-weight="bold">M</text>
  <!-- top-right N -->
  <text x="430" y="95" fill="#111111" font-style="italic" font-size="22" font-weight="bold">N</text>
  <!-- bottom-left phi(U) in R^m -->
  <text x="70" y="300" fill="#111111" font-size="18">&#966;(U) &#8834; &#8477;<tspan font-size="12" dy="-8">m</tspan></text>
  <!-- bottom-right psi(V) in R^n -->
  <text x="380" y="300" fill="#111111" font-size="18">&#968;(V) &#8834; &#8477;<tspan font-size="12" dy="-8">n</tspan></text>

  <!-- ===== top arrow: M to N via F ===== -->
  <line x1="150" y1="88" x2="425" y2="88" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="280" y="76" fill="#1f6fb2" font-style="italic" font-size="17" font-weight="bold">F</text>

  <!-- ===== left arrow: M to R^m via phi ===== -->
  <line x1="130" y1="108" x2="130" y2="275" stroke="#111111" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="96" y="200" fill="#111111" font-style="italic" font-size="17">&#966;</text>
  <text x="60" y="220" fill="#555555" font-size="12">chart on M</text>

  <!-- ===== right arrow: N to R^n via psi ===== -->
  <line x1="440" y1="108" x2="440" y2="275" stroke="#111111" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="452" y="200" fill="#111111" font-style="italic" font-size="17">&#968;</text>
  <text x="452" y="220" fill="#555555" font-size="12">chart on N</text>

  <!-- ===== bottom arrow: R^m --> R^n (coordinate representative) ===== -->
  <line x1="180" y1="320" x2="370" y2="320" stroke="#c0532a" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="205" y="342" fill="#c0532a" font-style="italic" font-size="15" font-weight="bold">&#968; &#8728; F &#8728; &#966;<tspan font-size="11" dy="-6">-1</tspan></text>

  <!-- dashed 'equals this composite' hint -->
  <text x="240" y="200" fill="#888888" font-size="12" font-style="italic">commutes</text>
</svg>
