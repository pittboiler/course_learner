<svg viewBox="0 0 480 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="480" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ax" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#111111"/>
    </marker>
  </defs>

  <text x="24" y="28" font-size="15" fill="#111">Light cone in 1+1 Minkowski:  ds² = −dt² + dx²</text>

  <!-- axes -->
  <line x1="240" y1="370" x2="240" y2="45" stroke="#111" stroke-width="1.6" marker-end="url(#ax)"/>
  <line x1="70" y1="210" x2="430" y2="210" stroke="#111" stroke-width="1.6" marker-end="url(#ax)"/>
  <text x="248" y="55" font-size="15" font-style="italic" fill="#111">t</text>
  <text x="420" y="230" font-size="15" font-style="italic" fill="#111">x</text>

  <!-- light cone (null lines at 45 deg) -->
  <line x1="90" y1="360" x2="390" y2="60" stroke="#c60" stroke-width="2.4"/>
  <line x1="390" y1="360" x2="90" y2="60" stroke="#c60" stroke-width="2.4"/>

  <!-- shaded timelike region (upper) -->
  <polygon points="240,210 340,110 140,110" fill="#0a7" fill-opacity="0.10" stroke="none"/>
  <polygon points="240,210 340,310 140,310" fill="#0a7" fill-opacity="0.10" stroke="none"/>

  <!-- labels -->
  <text x="196" y="95" font-size="14" fill="#0a7">timelike</text>
  <text x="186" y="135" font-size="12" fill="#0a7">g(v,v) &lt; 0</text>

  <text x="330" y="200" font-size="14" fill="#1f6fb2">spacelike</text>
  <text x="332" y="185" font-size="12" fill="#1f6fb2">g(v,v) &gt; 0</text>

  <text x="360" y="78" font-size="13" fill="#c60">null</text>
  <text x="330" y="95" font-size="11" fill="#c60">g(v,v)=0</text>

  <!-- sample vectors from origin -->
  <line x1="240" y1="210" x2="270" y2="130" stroke="#0a7" stroke-width="2.4"/>
  <line x1="240" y1="210" x2="330" y2="180" stroke="#1f6fb2" stroke-width="2.4"/>
  <circle cx="240" cy="210" r="3" fill="#111"/>

  <text x="60" y="392" font-size="12" fill="#555">inside cone = causally reachable · minus sign creates the split of time from space</text>
</svg>
