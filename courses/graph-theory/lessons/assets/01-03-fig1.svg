<svg viewBox="0 0 500 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect x="0" y="0" width="500" height="380" fill="#ffffff"/>

  <!-- ================= Component 1 (top) ================= -->
  <!-- normal edges -->
  <line x1="60"  y1="70"  x2="60"  y2="170" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="60"  y1="70"  x2="160" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="60"  y1="170" x2="160" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="300" y1="120" x2="400" y2="70"  stroke="#1a1a1a" stroke-width="2"/>
  <line x1="300" y1="120" x2="400" y2="170" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="400" y1="70"  x2="400" y2="170" stroke="#1a1a1a" stroke-width="2"/>

  <!-- the bridge (red) -->
  <line x1="160" y1="120" x2="300" y2="120" stroke="#d64545" stroke-width="4"/>
  <text x="212" y="110" fill="#d64545" font-size="13" font-style="italic">bridge</text>

  <!-- normal vertices -->
  <circle cx="60"  cy="70"  r="14" fill="#eef2f6" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="60"  cy="170" r="14" fill="#eef2f6" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="400" cy="70"  r="14" fill="#eef2f6" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="400" cy="170" r="14" fill="#eef2f6" stroke="#1a1a1a" stroke-width="2"/>

  <!-- cut vertices (orange) -->
  <circle cx="160" cy="120" r="14" fill="#f8d9a0" stroke="#e08a1e" stroke-width="3"/>
  <circle cx="300" cy="120" r="14" fill="#f8d9a0" stroke="#e08a1e" stroke-width="3"/>

  <!-- labels -->
  <text x="60"  y="75"  fill="#1a1a1a" text-anchor="middle">a</text>
  <text x="60"  y="175" fill="#1a1a1a" text-anchor="middle">b</text>
  <text x="160" y="125" fill="#1a1a1a" text-anchor="middle">c</text>
  <text x="300" y="125" fill="#1a1a1a" text-anchor="middle">d</text>
  <text x="400" y="75"  fill="#1a1a1a" text-anchor="middle">e</text>
  <text x="400" y="175" fill="#1a1a1a" text-anchor="middle">f</text>

  <text x="40" y="30" fill="#555555" font-size="13" font-style="italic">Component 1</text>

  <!-- ================= Component 2 (bottom) ================= -->
  <line x1="150" y1="300" x2="250" y2="270" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="250" y1="270" x2="250" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="150" y1="300" x2="250" y2="340" stroke="#1a1a1a" stroke-width="2"/>

  <circle cx="150" cy="300" r="14" fill="#eef2f6" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="250" cy="270" r="14" fill="#eef2f6" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="250" cy="340" r="14" fill="#eef2f6" stroke="#1a1a1a" stroke-width="2"/>

  <text x="150" y="305" fill="#1a1a1a" text-anchor="middle">g</text>
  <text x="250" y="275" fill="#1a1a1a" text-anchor="middle">h</text>
  <text x="250" y="345" fill="#1a1a1a" text-anchor="middle">i</text>

  <text x="70" y="360" fill="#555555" font-size="13" font-style="italic">Component 2 — a triangle: no bridge, no cut vertex</text>

  <!-- ================= legend ================= -->
  <line x1="360" y1="290" x2="392" y2="290" stroke="#d64545" stroke-width="4"/>
  <text x="398" y="294" fill="#1a1a1a" font-size="13">bridge</text>
  <circle cx="376" cy="322" r="9" fill="#f8d9a0" stroke="#e08a1e" stroke-width="3"/>
  <text x="398" y="326" fill="#1a1a1a" font-size="13">cut vertex</text>
</svg>
