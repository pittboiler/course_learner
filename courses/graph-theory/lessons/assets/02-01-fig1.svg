<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="660" height="330" fill="#ffffff"/>

  <!-- ===== LEFT: a tree ===== -->
  <text x="150" y="28" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">A tree</text>
  <text x="150" y="315" font-size="13" fill="#0057b0" text-anchor="middle">6 vertices, 5 edges = |V| - 1</text>

  <!-- tree edges -->
  <line x1="150" y1="55" x2="85" y2="150" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="150" y1="55" x2="215" y2="150" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="85" y1="150" x2="45" y2="245" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="85" y1="150" x2="128" y2="245" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="215" y1="150" x2="215" y2="245" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- internal vertices (blue) -->
  <circle cx="150" cy="55" r="15" fill="#cfe8ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="85" cy="150" r="15" fill="#cfe8ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="215" cy="150" r="15" fill="#cfe8ff" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- leaves (green, degree 1) -->
  <circle cx="45" cy="245" r="15" fill="#bde5c8" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="128" cy="245" r="15" fill="#bde5c8" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="215" cy="245" r="15" fill="#bde5c8" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- tree labels -->
  <text x="150" y="60" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">a</text>
  <text x="85" y="155" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">b</text>
  <text x="215" y="155" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">c</text>
  <text x="45" y="250" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">d</text>
  <text x="128" y="250" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">e</text>
  <text x="215" y="250" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">f</text>

  <!-- leaf callouts -->
  <text x="45" y="282" font-size="12" fill="#1a7d3a" text-anchor="middle">leaf</text>
  <text x="128" y="282" font-size="12" fill="#1a7d3a" text-anchor="middle">leaf</text>
  <text x="248" y="250" font-size="12" fill="#1a7d3a" text-anchor="middle">leaf</text>

  <!-- divider -->
  <line x1="330" y1="40" x2="330" y2="290" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- ===== RIGHT: not a tree ===== -->
  <text x="500" y="28" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Not a tree</text>
  <text x="500" y="315" font-size="13" fill="#b00020" text-anchor="middle">connected, but a cycle p-q-r-p</text>

  <!-- cycle edges (red) -->
  <line x1="500" y1="60" x2="430" y2="160" stroke="#b00020" stroke-width="3"/>
  <line x1="430" y1="160" x2="570" y2="160" stroke="#b00020" stroke-width="3"/>
  <line x1="570" y1="160" x2="500" y2="60" stroke="#b00020" stroke-width="3"/>
  <!-- pendant edge (black) -->
  <line x1="430" y1="160" x2="470" y2="250" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- vertices -->
  <circle cx="500" cy="60" r="15" fill="#cfe8ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="430" cy="160" r="15" fill="#cfe8ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="570" cy="160" r="15" fill="#cfe8ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="470" cy="250" r="15" fill="#cfe8ff" stroke="#1a1a1a" stroke-width="2.5"/>

  <text x="500" y="65" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">p</text>
  <text x="430" y="165" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">q</text>
  <text x="570" y="165" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">r</text>
  <text x="470" y="255" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">s</text>
</svg>
