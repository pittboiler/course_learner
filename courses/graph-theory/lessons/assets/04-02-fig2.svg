<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="480" height="340" fill="#ffffff"/>

  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a7a30"/>
    </marker>
    <marker id="x" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b00020"/>
    </marker>
  </defs>

  <!-- shaded reachable region S = {s,a,b} -->
  <path d="M55,140 C110,60 250,45 250,75 L250,265 C250,300 110,285 55,205 Z"
        fill="#e6f5ea" stroke="#1a7a30" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="95" y="42" font-size="14" fill="#1a7a30" font-weight="bold" text-anchor="middle">reachable from s: S</text>

  <!-- residual edges inside S (green = positive residual, s can travel these) -->
  <!-- s->b forward residual 1 -->
  <line x1="72" y1="180" x2="198" y2="252" stroke="#1a7a30" stroke-width="3" marker-end="url(#g)"/>
  <text x="118" y="235" font-size="13" fill="#1a7a30" text-anchor="middle" font-weight="bold">1</text>
  <!-- b->a backward residual 2 (undo flow on a->b) -->
  <line x1="205" y1="245" x2="205" y2="97" stroke="#1a7a30" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="188" y="174" font-size="13" fill="#1a7a30" text-anchor="end" font-weight="bold">2</text>

  <!-- saturated cut edges: forward residual 0, so t is unreachable -->
  <!-- a->t saturated -->
  <line x1="233" y1="86" x2="398" y2="158" stroke="#b00020" stroke-width="4" marker-end="url(#x)"/>
  <text x="315" y="106" font-size="13" fill="#b00020" text-anchor="middle" font-weight="bold">0</text>
  <!-- b->t saturated -->
  <line x1="233" y1="254" x2="398" y2="182" stroke="#b00020" stroke-width="4" marker-end="url(#x)"/>
  <text x="315" y="240" font-size="13" fill="#b00020" text-anchor="middle" font-weight="bold">0</text>

  <!-- vertices -->
  <circle cx="55" cy="170" r="20" fill="#b6e2c4" stroke="#1a7a30" stroke-width="2.5"/>
  <circle cx="215" cy="75" r="20" fill="#b6e2c4" stroke="#1a7a30" stroke-width="2.5"/>
  <circle cx="215" cy="265" r="20" fill="#b6e2c4" stroke="#1a7a30" stroke-width="2.5"/>
  <circle cx="415" cy="170" r="20" fill="#f6c9c9" stroke="#b00020" stroke-width="2.5"/>

  <text x="55"  y="176" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">s</text>
  <text x="215" y="81"  font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">a</text>
  <text x="215" y="271" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">b</text>
  <text x="415" y="176" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">t</text>
  <text x="415" y="205" font-size="12" fill="#b00020" text-anchor="middle">unreachable</text>
</svg>
