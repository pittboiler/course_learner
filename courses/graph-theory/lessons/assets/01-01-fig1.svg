<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="440" height="340" fill="#ffffff"/>

  <!-- edges (drawn first so vertices sit on top) -->
  <line x1="210" y1="70" x2="95" y2="165" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="210" y1="70" x2="325" y2="165" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="210" y1="70" x2="95" y2="285" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="95" y1="165" x2="325" y2="165" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="325" y1="165" x2="325" y2="285" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- edge labels -->
  <text x="140" y="108" font-size="14" fill="#b00020" font-style="italic">e1</text>
  <text x="278" y="108" font-size="14" fill="#b00020" font-style="italic">e2</text>
  <text x="128" y="205" font-size="14" fill="#b00020" font-style="italic">e3</text>
  <text x="205" y="158" font-size="14" fill="#b00020" font-style="italic">e4</text>
  <text x="333" y="230" font-size="14" fill="#b00020" font-style="italic">e5</text>

  <!-- vertices -->
  <circle cx="210" cy="70" r="16" fill="#cfe8ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="95" cy="165" r="16" fill="#cfe8ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="325" cy="165" r="16" fill="#cfe8ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="95" cy="285" r="16" fill="#cfe8ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="325" cy="285" r="16" fill="#cfe8ff" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- vertex labels -->
  <text x="210" y="75" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">a</text>
  <text x="95" y="170" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">b</text>
  <text x="325" y="170" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">c</text>
  <text x="95" y="290" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">d</text>
  <text x="325" y="290" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">e</text>

  <!-- degree annotations -->
  <text x="210" y="42" font-size="13" fill="#0057b0" text-anchor="middle">deg = 3</text>
  <text x="48" y="150" font-size="13" fill="#0057b0" text-anchor="middle">deg = 2</text>
  <text x="378" y="150" font-size="13" fill="#0057b0" text-anchor="middle">deg = 3</text>
  <text x="95" y="318" font-size="13" fill="#0057b0" text-anchor="middle">deg = 1</text>
  <text x="325" y="318" font-size="13" fill="#0057b0" text-anchor="middle">deg = 1</text>
</svg>
