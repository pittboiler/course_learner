<svg viewBox="0 0 520 250" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="520" height="250" fill="#ffffff"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#111">Same degree sequence (2,2,2,2,2,2) — but NOT isomorphic</text>

  <!-- left: C_6 -->
  <line x1="130" y1="55" x2="199" y2="95" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="199" y1="95" x2="199" y2="175" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="199" y1="175" x2="130" y2="215" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="130" y1="215" x2="61" y2="175" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="61" y1="175" x2="61" y2="95" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="61" y1="95" x2="130" y2="55" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="130" cy="55" r="12" fill="#cfe3ff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="199" cy="95" r="12" fill="#cfe3ff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="199" cy="175" r="12" fill="#cfe3ff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="130" cy="215" r="12" fill="#cfe3ff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="61" cy="175" r="12" fill="#cfe3ff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="61" cy="95" r="12" fill="#cfe3ff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="130" y="150" text-anchor="middle" font-size="13" fill="#333">C_6 — one 6-cycle</text>
  <text x="130" y="240" text-anchor="middle" font-size="12" fill="#a33">0 triangles, connected</text>

  <!-- right: two triangles -->
  <line x1="340" y1="60" x2="305" y2="140" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="305" y1="140" x2="375" y2="140" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="375" y1="140" x2="340" y2="60" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="340" cy="60" r="12" fill="#ffe0b3" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="305" cy="140" r="12" fill="#ffe0b3" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="375" cy="140" r="12" fill="#ffe0b3" stroke="#1a1a1a" stroke-width="2"/>

  <line x1="455" y1="60" x2="420" y2="140" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="420" y1="140" x2="490" y2="140" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="490" y1="140" x2="455" y2="60" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="455" cy="60" r="12" fill="#ffe0b3" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="420" cy="140" r="12" fill="#ffe0b3" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="490" cy="140" r="12" fill="#ffe0b3" stroke="#1a1a1a" stroke-width="2"/>

  <text x="397" y="185" text-anchor="middle" font-size="13" fill="#333">C_3 + C_3 — two triangles</text>
  <text x="397" y="240" text-anchor="middle" font-size="12" fill="#a33">2 triangles, disconnected</text>
</svg>
