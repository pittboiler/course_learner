<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="440" height="360" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- cut labels -->
  <text x="150" y="26" font-size="15" fill="#0057b0" text-anchor="middle" font-weight="bold">S = {s, a, b}</text>
  <text x="360" y="26" font-size="15" fill="#0057b0" text-anchor="middle" font-weight="bold">T = {t}</text>

  <!-- the s-t cut, drawn as a dividing line -->
  <line x1="285" y1="35" x2="285" y2="330" stroke="#0057b0" stroke-width="2.5" stroke-dasharray="8 6"/>

  <!-- directed edges (capacities as labels), trimmed to circle boundaries -->
  <line x1="74"  y1="169" x2="176" y2="91"  stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="74"  y1="191" x2="176" y2="269" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="98"  x2="190" y2="262" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="206" y1="89"  x2="344" y2="171" stroke="#b00020" stroke-width="3"   marker-end="url(#arrow)"/>
  <line x1="206" y1="271" x2="344" y2="189" stroke="#b00020" stroke-width="3"   marker-end="url(#arrow)"/>

  <!-- capacity labels -->
  <text x="114" y="124" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">3</text>
  <text x="114" y="242" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">2</text>
  <text x="201" y="186" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">1</text>
  <text x="258" y="116" font-size="15" fill="#b00020" text-anchor="middle" font-weight="bold">2</text>
  <text x="258" y="250" font-size="15" fill="#b00020" text-anchor="middle" font-weight="bold">3</text>

  <!-- vertices -->
  <circle cx="60"  cy="180" r="18" fill="#d9f2d9" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="190" cy="80"  r="18" fill="#cfe8ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="190" cy="280" r="18" fill="#cfe8ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="360" cy="180" r="18" fill="#d9f2d9" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- vertex labels -->
  <text x="60"  y="185" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">s</text>
  <text x="190" y="85"  font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">a</text>
  <text x="190" y="285" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">b</text>
  <text x="360" y="185" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">t</text>

  <!-- caption -->
  <text x="220" y="350" font-size="13" fill="#1a1a1a" text-anchor="middle">edge labels = capacities;  cut capacity = c(a&#8594;t) + c(b&#8594;t) = 2 + 3 = 5</text>
</svg>
