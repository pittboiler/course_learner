<svg viewBox="0 0 400 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="400" height="380" fill="#ffffff"/>

  <!-- Blue pentagram (inner 5-cycle 0-2-4-1-3-0): no monochromatic triangle -->
  <g stroke="#2c3e80" stroke-width="3.5" fill="none">
    <line x1="200" y1="40"  x2="288" y2="311"/>
    <line x1="288" y1="311" x2="57"  y2="144"/>
    <line x1="57"  y1="144" x2="343" y2="144"/>
    <line x1="343" y1="144" x2="112" y2="311"/>
    <line x1="112" y1="311" x2="200" y2="40"/>
  </g>

  <!-- Red pentagon (outer 5-cycle 0-1-2-3-4-0): no monochromatic triangle -->
  <g stroke="#c0392b" stroke-width="3.5" fill="none">
    <line x1="200" y1="40"  x2="343" y2="144"/>
    <line x1="343" y1="144" x2="288" y2="311"/>
    <line x1="288" y1="311" x2="112" y2="311"/>
    <line x1="112" y1="311" x2="57"  y2="144"/>
    <line x1="57"  y1="144" x2="200" y2="40"/>
  </g>

  <!-- Vertices -->
  <g fill="#111111">
    <circle cx="200" cy="40"  r="7"/>
    <circle cx="343" cy="144" r="7"/>
    <circle cx="288" cy="311" r="7"/>
    <circle cx="112" cy="311" r="7"/>
    <circle cx="57"  cy="144" r="7"/>
  </g>

  <!-- Labels -->
  <g fill="#111111" font-size="18">
    <text x="200" y="24"  text-anchor="middle">1</text>
    <text x="360" y="140" text-anchor="start">2</text>
    <text x="300" y="333" text-anchor="start">3</text>
    <text x="100" y="333" text-anchor="end">4</text>
    <text x="40"  y="140" text-anchor="end">5</text>
  </g>

  <!-- Legend -->
  <g font-size="15">
    <line x1="120" y1="360" x2="150" y2="360" stroke="#c0392b" stroke-width="3.5"/>
    <text x="156" y="365" fill="#111111">red pentagon</text>
    <line x1="255" y1="360" x2="285" y2="360" stroke="#2c3e80" stroke-width="3.5"/>
    <text x="291" y="365" fill="#111111">blue star</text>
  </g>
</svg>
