<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="440" height="360" fill="#ffffff"/>

  <!-- title -->
  <text x="220" y="28" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">A proper 3-coloring of C5</text>

  <!-- cycle edges -->
  <line x1="220" y1="70"  x2="343" y2="160" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="343" y1="160" x2="296" y2="305" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="296" y1="305" x2="144" y2="305" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="144" y1="305" x2="97"  y2="160" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="97"  y1="160" x2="220" y2="70"  stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- vertices: color1 = red, color2 = blue, color3 = green -->
  <circle cx="220" cy="70"  r="20" fill="#ff9d9d" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="343" cy="160" r="20" fill="#9dc3ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="296" cy="305" r="20" fill="#ff9d9d" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="144" cy="305" r="20" fill="#9dc3ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="97"  cy="160" r="20" fill="#8fe08f" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- vertex labels -->
  <text x="220" y="75"  font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">v1</text>
  <text x="343" y="165" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">v2</text>
  <text x="296" y="310" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">v3</text>
  <text x="144" y="310" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">v4</text>
  <text x="97"  y="165" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">v5</text>

  <!-- legend -->
  <circle cx="150" cy="345" r="8" fill="#ff9d9d" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="163" y="350" font-size="12" fill="#1a1a1a">1</text>
  <circle cx="205" cy="345" r="8" fill="#9dc3ff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="218" y="350" font-size="12" fill="#1a1a1a">2</text>
  <circle cx="260" cy="345" r="8" fill="#8fe08f" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="273" y="350" font-size="12" fill="#1a1a1a">3 (forced)</text>
</svg>
