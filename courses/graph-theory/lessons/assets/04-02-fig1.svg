<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="480" height="340" fill="#ffffff"/>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="ahr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b00020"/>
    </marker>
  </defs>

  <!-- edges (shortened to sit outside the r=20 vertices) -->
  <!-- s->a -->
  <line x1="72" y1="160" x2="198" y2="88" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/>
  <!-- s->b -->
  <line x1="72" y1="180" x2="198" y2="252" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/>
  <!-- a->b -->
  <line x1="215" y1="97" x2="215" y2="243" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/>
  <!-- a->t (cut edge, red) -->
  <line x1="233" y1="86" x2="398" y2="158" stroke="#b00020" stroke-width="4" marker-end="url(#ahr)"/>
  <!-- b->t (cut edge, red) -->
  <line x1="233" y1="254" x2="398" y2="182" stroke="#b00020" stroke-width="4" marker-end="url(#ahr)"/>

  <!-- edge labels: flow / capacity -->
  <text x="120" y="112" font-size="14" fill="#1a1a1a" text-anchor="middle">4/4</text>
  <text x="120" y="235" font-size="14" fill="#1a1a1a" text-anchor="middle">1/2</text>
  <text x="228" y="174" font-size="14" fill="#1a1a1a" text-anchor="start">2/3</text>
  <text x="318" y="108" font-size="14" fill="#b00020" text-anchor="middle" font-weight="bold">2/2</text>
  <text x="318" y="238" font-size="14" fill="#b00020" text-anchor="middle" font-weight="bold">3/3</text>

  <!-- min-cut curve separating {s,a,b} from {t} -->
  <path d="M355,28 C330,110 330,230 355,312" stroke="#0057b0" stroke-width="2.5" stroke-dasharray="7 5" fill="none"/>
  <text x="352" y="22" font-size="13" fill="#0057b0" text-anchor="middle" font-weight="bold">min cut</text>
  <text x="300" y="330" font-size="13" fill="#0057b0" text-anchor="middle">S = {s, a, b},  cap = 2 + 3 = 5</text>

  <!-- vertices -->
  <circle cx="55" cy="170" r="20" fill="#cfe8ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="215" cy="75" r="20" fill="#cfe8ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="215" cy="265" r="20" fill="#cfe8ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="415" cy="170" r="20" fill="#ffe3b3" stroke="#1a1a1a" stroke-width="2.5"/>

  <text x="55"  y="176" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">s</text>
  <text x="215" y="81"  font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">a</text>
  <text x="215" y="271" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">b</text>
  <text x="415" y="176" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">t</text>
</svg>
