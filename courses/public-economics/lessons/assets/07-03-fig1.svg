<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<rect x="0" y="0" width="700" height="330" fill="#ffffff"/>
<text x="20" y="24" font-size="14" text-anchor="start" fill="#111111" font-weight="bold">Where a budget of 1,000,000 dollars ends up (thousands of dollars)</text>
<text x="160" y="85" font-size="13" text-anchor="end" fill="#111111">Universal grant</text>
<rect x="170" y="60" width="96" height="40" rx="0" fill="#dcefe4" stroke="#2e8b57" stroke-width="1.5"/>
<text x="218" y="85" font-size="12" text-anchor="middle" fill="#111111">200 to needy</text>
<rect x="266" y="60" width="384" height="40" rx="0" fill="#f6dde1" stroke="#d1495b" stroke-width="1.5"/>
<text x="458" y="85" font-size="12" text-anchor="middle" fill="#111111">800 leaks</text>
<text x="175" y="116" font-size="11" text-anchor="start" fill="#333333">net social value: 0 (g = 2 on needy), 0 (maximin)</text>
<text x="160" y="165" font-size="13" text-anchor="end" fill="#111111">Tagged grant</text>
<rect x="170" y="140" width="360" height="40" rx="0" fill="#dcefe4" stroke="#2e8b57" stroke-width="1.5"/>
<text x="350" y="165" font-size="12" text-anchor="middle" fill="#111111">750 to needy</text>
<rect x="530" y="140" width="120" height="40" rx="0" fill="#f6dde1" stroke="#d1495b" stroke-width="1.5"/>
<text x="590" y="165" font-size="12" text-anchor="middle" fill="#111111">250 leaks</text>
<text x="175" y="196" font-size="11" text-anchor="start" fill="#333333">net social value: 687,500 (g = 2 on needy), 2,750,000 (maximin)</text>
<text x="160" y="245" font-size="13" text-anchor="end" fill="#111111">Ordeal</text>
<rect x="170" y="220" width="384" height="40" rx="0" fill="#dcefe4" stroke="#2e8b57" stroke-width="1.5"/>
<text x="362" y="245" font-size="12" text-anchor="middle" fill="#111111">800 net to needy</text>
<rect x="554" y="220" width="96" height="40" rx="0" fill="#e6e6e6" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="602" y="245" font-size="12" text-anchor="middle" fill="#111111">200 burned</text>
<text x="175" y="276" font-size="11" text-anchor="start" fill="#333333">net social value: 600,000 (g = 2 on needy), 3,000,000 (maximin)</text>
<line x1="170" y1="50" x2="170" y2="280" stroke="#333333" stroke-width="1.2"/>
<text x="20" y="318" font-size="11" text-anchor="start" fill="#333333">Ordeal row: needy receive 1,000 gross but lose 200 in time at the ordeal; nothing reaches the non-needy.</text>
</svg>
