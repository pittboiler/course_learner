<text x="270" y="372" font-size="12" text-anchor="middle" fill="#333333">the front, seen from where you stand</text>
<text x="480" y="110" font-size="13" text-anchor="start" fill="#d1495b" font-weight="bold">Co-intended back side</text>
<text x="480" y="128" font-size="13" text-anchor="start" fill="#333333">rim, handle, inside, underside:</text>
<text x="480" y="146" font-size="13" text-anchor="start" fill="#333333">meant emptily, the inner horizon</text>
<line x1="474" y1="118" x2="340" y2="128" stroke="#d1495b" stroke-width="1.2"/>
<line x1="474" y1="118" x2="306" y2="214" stroke="#d1495b" stroke-width="1.2"/>
<text x="480" y="196" font-size="13" text-anchor="start" fill="#1a6fb5" font-weight="bold">Given profile (Abschattung)</text>
<text x="480" y="214" font-size="13" text-anchor="start" fill="#333333">the side facing you, seen now:</text>
<text x="480" y="232" font-size="13" text-anchor="start" fill="#333333">this part of the intention is fulfilled</text>
<line x1="474" y1="204" x2="330" y2="262" stroke="#1a6fb5" stroke-width="1.2"/>
<text x="480" y="282" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Walk round the mug:</text>
<text x="480" y="300" font-size="13" text-anchor="start" fill="#333333">new profiles fulfil or disappoint</text>
<text x="480" y="318" font-size="13" text-anchor="start" fill="#333333">the empty intentions, and it is</text>
<text x="480" y="336" font-size="13" text-anchor="start" fill="#333333">the same mug throughout</text>
<text x="32" y="400" font-size="12" text-anchor="start" fill="#333333">Solid blue: given. Dashed red: meant but not given. Dashed green: the open field around the thing.</text>
