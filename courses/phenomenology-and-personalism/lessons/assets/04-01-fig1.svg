<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<rect x="0" y="0" width="780" height="470" fill="#ffffff"/>
<text x="390" y="26" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">Scheler's four value modalities (Formalismus, Part I, 1913)</text>
<line x1="60" y1="60" x2="60" y2="420" stroke="#333333" stroke-width="3"/>
<line x1="440" y1="60" x2="440" y2="420" stroke="#333333" stroke-width="3"/>
<rect x="70" y="66" width="360" height="66" rx="5" fill="#ffffff" stroke="#d1495b" stroke-width="2"/>
<text x="250" y="86" font-size="14" text-anchor="middle" fill="#d1495b" font-weight="bold">4  HOLY and unholy</text>
<text x="250" y="104" font-size="12" text-anchor="middle" fill="#111111">given only in objects intended as absolute</text>
<text x="250" y="122" font-size="11" text-anchor="middle" fill="#333333" font-style="italic">consecutive: cult and sacramental values</text>
<rect x="70" y="156" width="360" height="66" rx="5" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
<text x="250" y="176" font-size="14" text-anchor="middle" fill="#2e8b57" font-weight="bold">3  SPIRITUAL values</text>
<text x="250" y="194" font-size="12" text-anchor="middle" fill="#111111">beautiful/ugly, right/wrong, pure knowledge of truth</text>
<text x="250" y="212" font-size="11" text-anchor="middle" fill="#333333" font-style="italic">consecutive: culture values (art treasures, science)</text>
<rect x="70" y="246" width="360" height="66" rx="5" fill="#ffffff" stroke="#1a6fb5" stroke-width="2"/>
<text x="250" y="266" font-size="14" text-anchor="middle" fill="#1a6fb5" font-weight="bold">2  VITAL values</text>
<text x="250" y="284" font-size="12" text-anchor="middle" fill="#111111">noble/vulgar; health, vigour, the feeling of life</text>
<text x="250" y="302" font-size="11" text-anchor="middle" fill="#333333" font-style="italic">consecutive: welfare</text>
<rect x="70" y="336" width="360" height="66" rx="5" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="250" y="356" font-size="14" text-anchor="middle" fill="#333333" font-weight="bold">1  SENSIBLE values</text>
<text x="250" y="374" font-size="12" text-anchor="middle" fill="#111111">pleasant/unpleasant</text>
<text x="250" y="392" font-size="11" text-anchor="middle" fill="#333333" font-style="italic">consecutive: the useful, founded on the pleasant</text>
<line x1="480" y1="400" x2="480" y2="70" stroke="#111111" stroke-width="2" marker-end="url(#arr)"/>
<text x="492" y="76" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">higher</text>
<rect x="505" y="110" width="265" height="238" rx="6" fill="#dbe8f5" stroke="#1a6fb5" stroke-width="1.4"/>
<text x="637" y="134" font-size="14" text-anchor="middle" fill="#1a6fb5" font-weight="bold">marks of height</text>
<text x="637" y="151" font-size="11" text-anchor="middle" fill="#333333" font-style="italic">a value seems higher the more it...</text>
<text x="520" y="180" font-size="12" text-anchor="start" fill="#111111">1. lasts (duration)</text>
<text x="520" y="210" font-size="12" text-anchor="start" fill="#111111">2. resists extension and division</text>
<text x="520" y="240" font-size="12" text-anchor="start" fill="#111111">3. is founding, not founded</text>
<text x="520" y="270" font-size="12" text-anchor="start" fill="#111111">4. satisfies deeply when felt</text>
<text x="520" y="300" font-size="12" text-anchor="start" fill="#111111">5. is less relative to the one feeling it</text>
<text x="637" y="380" font-size="12" text-anchor="middle" fill="#d1495b" font-weight="bold">But height is given in preferring;</text>
<text x="637" y="398" font-size="12" text-anchor="middle" fill="#d1495b" font-weight="bold">the marks are signs, not a proof.</text>
<text x="250" y="448" font-size="12" text-anchor="middle" fill="#333333" font-style="italic">Moral good is not a rung: it appears on the act that realizes the higher value.</text>
</svg>
