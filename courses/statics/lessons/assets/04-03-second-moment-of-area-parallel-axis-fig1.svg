<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="30" y="20" fill="#8a8a8a" font-style="italic">Split the T into rectangles, find the centroidal axis, then sum I&#8321; + A&#8321;d&#8321;&#178; for each piece.</text>

  <!-- ===== the T-section (blue) ===== -->
  <!-- flange: 120 wide x 30 thick, top -->
  <rect x="150" y="58" width="192" height="48" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <!-- web: 40 wide x 90 tall, below -->
  <rect x="214" y="106" width="64" height="144" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <!-- split line between the two rectangles -->
  <line x1="150" y1="106" x2="342" y2="106" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ===== centroidal axis (coral) ===== -->
  <line x1="140" y1="130" x2="392" y2="130" stroke="#e0645c" stroke-width="1.75"/>
  <text x="250" y="124" fill="#e0645c">centroidal axis</text>

  <!-- piece centroids (grey dots) -->
  <circle cx="246" cy="82" r="3" fill="#8a8a8a"/>
  <text x="252" y="99" fill="#8a8a8a">C&#8321;</text>
  <circle cx="246" cy="178" r="3" fill="#8a8a8a"/>
  <text x="252" y="195" fill="#8a8a8a">C&#8322;</text>

  <!-- grey leader lines from each piece centroid out to the d-dimension -->
  <line x1="246" y1="82" x2="372" y2="82" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="246" y1="178" x2="372" y2="178" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- d1 : flange centroid down to axis (coral) -->
  <line x1="360" y1="82" x2="360" y2="130" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="360,82 356,90 364,90" fill="#e0645c"/>
  <polygon points="360,130 356,122 364,122" fill="#e0645c"/>
  <text x="366" y="110" fill="#e0645c">d&#8321;</text>

  <!-- d2 : axis down to web centroid (coral) -->
  <line x1="360" y1="130" x2="360" y2="178" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="360,130 356,138 364,138" fill="#e0645c"/>
  <polygon points="360,178 356,170 364,170" fill="#e0645c"/>
  <text x="366" y="158" fill="#e0645c">d&#8322;</text>

  <!-- ===== dimensions (grey) ===== -->
  <!-- flange width 120 (top) -->
  <line x1="150" y1="44" x2="342" y2="44" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="150,44 158,40 158,48" fill="#8a8a8a"/>
  <polygon points="342,44 334,40 334,48" fill="#8a8a8a"/>
  <text x="237" y="40" fill="#8a8a8a">120</text>

  <!-- left stacked dim: thickness 30 + height 90 -->
  <line x1="120" y1="58" x2="120" y2="106" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="120,58 116,66 124,66" fill="#8a8a8a"/>
  <polygon points="120,106 116,98 124,98" fill="#8a8a8a"/>
  <text x="98" y="86" fill="#8a8a8a">30</text>
  <line x1="120" y1="106" x2="120" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="120,106 116,114 124,114" fill="#8a8a8a"/>
  <polygon points="120,250 116,242 124,242" fill="#8a8a8a"/>
  <text x="98" y="182" fill="#8a8a8a">90</text>
  <!-- tick leaders -->
  <line x1="120" y1="58" x2="150" y2="58" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- web width 40 (bottom) -->
  <line x1="214" y1="264" x2="278" y2="264" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="214,264 222,260 222,268" fill="#8a8a8a"/>
  <polygon points="278,264 270,260 270,268" fill="#8a8a8a"/>
  <text x="238" y="280" fill="#8a8a8a">40</text>

  <!-- ybar dimension (coral) in the empty gap: bottom to axis -->
  <line x1="182" y1="250" x2="214" y2="250" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="182" y1="250" x2="182" y2="130" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="182,250 178,242 186,242" fill="#e0645c"/>
  <polygon points="182,130 178,138 186,138" fill="#e0645c"/>
  <text x="150" y="196" fill="#e0645c">&#563; = 75</text>
</svg>
