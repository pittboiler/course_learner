<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#e0645c"/>
    </marker>
    <marker id="grey" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#8a8a8a"/>
    </marker>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#4a90d9"/>
    </marker>
  </defs>

  <text x="20" y="22" fill="#8a8a8a" font-style="italic">A force at A equals the same force slid to B, plus a couple M = r &#215; F &#8212; the twist it used to make about B.</text>

  <!-- ===== LEFT: force applied at A ===== -->
  <!-- wall -->
  <line x1="70" y1="95" x2="70" y2="205" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="70" y1="100" x2="62" y2="110" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="118" x2="62" y2="128" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="136" x2="62" y2="146" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="154" x2="62" y2="164" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="172" x2="62" y2="182" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="190" x2="62" y2="200" stroke="#8a8a8a" stroke-width="1"/>
  <!-- bracket arm -->
  <rect x="70" y="146" width="132" height="12" fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="1.5"/>
  <!-- B and A markers -->
  <circle cx="78" cy="152" r="3" fill="#4a90d9"/>
  <text x="66" y="176" fill="#4a90d9">B</text>
  <circle cx="198" cy="152" r="3" fill="#4a90d9"/>
  <text x="194" y="140" fill="#4a90d9">A</text>
  <!-- applied force at A -->
  <line x1="198" y1="152" x2="231" y2="185" stroke="#e0645c" stroke-width="2.5" marker-end="url(#coral)"/>
  <text x="236" y="184" fill="#e0645c">F</text>

  <!-- equals sign -->
  <line x1="300" y1="148" x2="324" y2="148" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="300" y1="158" x2="324" y2="158" stroke="#8a8a8a" stroke-width="2"/>

  <!-- ===== RIGHT: force-couple system at B ===== -->
  <!-- wall -->
  <line x1="400" y1="95" x2="400" y2="205" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="400" y1="100" x2="392" y2="110" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="400" y1="118" x2="392" y2="128" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="400" y1="136" x2="392" y2="146" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="400" y1="154" x2="392" y2="164" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="400" y1="172" x2="392" y2="182" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="400" y1="190" x2="392" y2="200" stroke="#8a8a8a" stroke-width="1"/>
  <!-- bracket arm -->
  <rect x="400" y="146" width="132" height="12" fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="1.5"/>
  <!-- offset vector r from B to A -->
  <line x1="410" y1="152" x2="524" y2="152" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#blue)"/>
  <text x="455" y="145" fill="#4a90d9" font-style="italic">r</text>
  <!-- B and A markers -->
  <circle cx="408" cy="152" r="3" fill="#4a90d9"/>
  <text x="396" y="176" fill="#4a90d9">B</text>
  <circle cx="528" cy="152" r="3" fill="#4a90d9"/>
  <text x="524" y="140" fill="#4a90d9">A</text>
  <!-- force moved to B -->
  <line x1="408" y1="152" x2="441" y2="185" stroke="#e0645c" stroke-width="2.5" marker-end="url(#coral)"/>
  <text x="446" y="184" fill="#e0645c">F</text>
  <!-- couple arc at B -->
  <path d="M 391 104 A 18 18 0 1 1 400 128" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#grey)"/>
  <text x="420" y="102" fill="#8a8a8a">M</text>
</svg>
