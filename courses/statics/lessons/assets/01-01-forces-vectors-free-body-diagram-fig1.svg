<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e0645c"/>
    </marker>
    <marker id="grey" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Isolate the ring: every contact becomes one arrow &#8212; two cable tensions and the weight, nothing else.</text>

  <!-- ===== structure (grey): ceiling + anchors + cables ===== -->

  <!-- ceiling line -->
  <line x1="120" y1="52" x2="500" y2="52" stroke="#8a8a8a" stroke-width="2"/>
  <!-- ceiling hatch -->
  <line x1="140" y1="52" x2="130" y2="42" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="170" y1="52" x2="160" y2="42" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="200" y1="52" x2="190" y2="42" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="230" y1="52" x2="220" y2="42" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="260" y1="52" x2="250" y2="42" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="290" y1="52" x2="280" y2="42" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="320" y1="52" x2="310" y2="42" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="350" y1="52" x2="340" y2="42" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="380" y1="52" x2="370" y2="42" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="410" y1="52" x2="400" y2="42" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="440" y1="52" x2="430" y2="42" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="470" y1="52" x2="460" y2="42" stroke="#8a8a8a" stroke-width="1"/>

  <!-- cables (structure context) -->
  <line x1="160" y1="52" x2="295" y2="194" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="460" y1="52" x2="325" y2="194" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- anchors -->
  <circle cx="160" cy="52" r="4" fill="#8a8a8a"/>
  <circle cx="460" cy="52" r="4" fill="#8a8a8a"/>

  <!-- ===== the isolated body (blue): the ring ===== -->
  <circle cx="310" cy="210" r="22" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="3"/>

  <!-- ===== forces on the ring (coral arrows) ===== -->

  <!-- tension toward anchor A (up-left) -->
  <line x1="295" y1="194" x2="224" y2="119" stroke="#e0645c" stroke-width="2.5" marker-end="url(#coral)"/>
  <text x="196" y="112" fill="#e0645c">T<tspan font-size="10" dy="4">A</tspan></text>

  <!-- tension toward anchor B (up-right) -->
  <line x1="325" y1="194" x2="396" y2="119" stroke="#e0645c" stroke-width="2.5" marker-end="url(#coral)"/>
  <text x="402" y="112" fill="#e0645c">T<tspan font-size="10" dy="4">B</tspan></text>

  <!-- weight straight down -->
  <line x1="310" y1="232" x2="310" y2="312" stroke="#e0645c" stroke-width="2.5" marker-end="url(#coral)"/>
  <text x="318" y="292" fill="#e0645c">W</text>

  <!-- angle hints at the ring -->
  <text x="250" y="180" fill="#8a8a8a" font-size="12">&#952;<tspan font-size="9" dy="3">A</tspan></text>
  <text x="356" y="180" fill="#8a8a8a" font-size="12">&#952;<tspan font-size="9" dy="3">B</tspan></text>

  <!-- axes key -->
  <line x1="60" y1="320" x2="100" y2="320" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#grey)"/>
  <text x="104" y="325" fill="#8a8a8a" font-size="12">x</text>
  <line x1="60" y1="320" x2="60" y2="280" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#grey)"/>
  <text x="52" y="276" fill="#8a8a8a" font-size="12">y</text>
</svg>
