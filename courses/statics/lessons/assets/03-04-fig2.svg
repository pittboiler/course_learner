<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="bc" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#e0645c"/></marker>
    <marker id="bg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8a8a8a"/></marker>
  </defs>

  <text x="24" y="22" fill="#8a8a8a" font-style="italic">One belt element over angle d&#952;: tensions T and T+dT, outward push dN, friction dF = &#956;&#160;dN.</text>

  <!-- center O -->
  <circle cx="280" cy="300" r="3" fill="#8a8a8a"/>
  <text x="286" y="304" fill="#8a8a8a">O</text>

  <!-- radii -->
  <line x1="280" y1="300" x2="260" y2="111" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="280" y1="300" x2="300" y2="111" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- d-theta arc near O -->
  <path d="M 276 261 A 40 40 0 0 1 284 261" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="272" y="252" fill="#8a8a8a" font-size="13">d&#952;</text>

  <!-- belt element -->
  <path d="M 260 111 A 190 190 0 0 1 300 111" fill="none" stroke="#4a90d9" stroke-width="6"/>

  <!-- tensions tangent at the ends -->
  <line x1="260" y1="111" x2="205" y2="117" stroke="#e0645c" stroke-width="2.2" marker-end="url(#bc)"/>
  <text x="176" y="122" fill="#e0645c">T</text>
  <line x1="300" y1="111" x2="356" y2="117" stroke="#e0645c" stroke-width="2.6" marker-end="url(#bc)"/>
  <text x="360" y="122" fill="#e0645c">T+dT</text>

  <!-- normal dN, radially outward (up) -->
  <line x1="280" y1="107" x2="280" y2="66" stroke="#e0645c" stroke-width="2.2" marker-end="url(#bc)"/>
  <text x="286" y="82" fill="#e0645c">dN</text>

  <!-- friction dF, tangent along the surface -->
  <line x1="266" y1="128" x2="312" y2="131" stroke="#8a8a8a" stroke-width="2" marker-end="url(#bg)"/>
  <text x="300" y="148" fill="#8a8a8a">dF = &#956;&#160;dN</text>
</svg>
