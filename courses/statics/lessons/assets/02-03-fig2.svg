<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="cA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e0645c"/></marker>
    <marker id="gA" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a8a8a"/></marker>
  </defs>

  <text x="24" y="24" fill="#8a8a8a" font-style="italic">One arm of the pliers as a free body &#8212; moments about the pin give P&#183;b = Q&#183;a.</text>

  <!-- the lever (one handle + jaw) -->
  <line x1="80" y1="150" x2="500" y2="150" stroke="#4a90d9" stroke-width="5"/>
  <text x="250" y="140" fill="#4a90d9">one arm (handle + jaw)</text>

  <!-- pivot pin O -->
  <circle cx="240" cy="150" r="6" fill="#8a8a8a"/>
  <text x="230" y="140" fill="#8a8a8a">O</text>

  <!-- jaw end: workpiece reaction Q (down) -->
  <circle cx="80" cy="150" r="4" fill="#8a8a8a"/>
  <line x1="80" y1="150" x2="80" y2="208" stroke="#e0645c" stroke-width="2" marker-end="url(#cA)"/>
  <text x="58" y="224" fill="#e0645c">Q (jaw)</text>

  <!-- handle end: hand force P (down) -->
  <circle cx="500" cy="150" r="4" fill="#8a8a8a"/>
  <line x1="500" y1="150" x2="500" y2="208" stroke="#e0645c" stroke-width="2" marker-end="url(#cA)"/>
  <text x="482" y="224" fill="#e0645c">P (hand)</text>

  <!-- pin reaction R (up) -->
  <line x1="240" y1="150" x2="240" y2="94" stroke="#e0645c" stroke-width="2" marker-end="url(#cA)"/>
  <text x="246" y="98" fill="#e0645c">R (pin)</text>

  <!-- drop lines -->
  <line x1="80" y1="150" x2="80" y2="256" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="240" y1="150" x2="240" y2="282" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="500" y1="150" x2="500" y2="282" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- dimension a (pin to jaw) -->
  <line x1="80" y1="252" x2="240" y2="252" stroke="#8a8a8a" stroke-width="1.5" marker-start="url(#gA)" marker-end="url(#gA)"/>
  <text x="156" y="246" fill="#8a8a8a">a</text>

  <!-- dimension b (pin to handle) -->
  <line x1="240" y1="278" x2="500" y2="278" stroke="#8a8a8a" stroke-width="1.5" marker-start="url(#gA)" marker-end="url(#gA)"/>
  <text x="366" y="272" fill="#8a8a8a">b</text>
</svg>
