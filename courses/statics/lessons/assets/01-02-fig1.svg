<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="coral" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#e0645c"/>
    </marker>
    <marker id="grey" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Isolate the knot, draw its three forces &#8212; equilibrium means they close into a triangle.</text>

  <!-- ===== left: physical setup + FBD of the knot ===== -->

  <!-- ceiling -->
  <line x1="55" y1="60" x2="315" y2="60" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="70" y1="60" x2="60" y2="70" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="95" y1="60" x2="85" y2="70" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="120" y1="60" x2="110" y2="70" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="215" y1="60" x2="205" y2="70" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="240" y1="60" x2="230" y2="70" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="265" y1="60" x2="255" y2="70" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="290" y1="60" x2="280" y2="70" stroke="#8a8a8a" stroke-width="1"/>

  <!-- cables (physical strings) -->
  <line x1="90" y1="60" x2="185" y2="200" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="280" y1="60" x2="185" y2="200" stroke="#8a8a8a" stroke-width="2"/>

  <!-- hanging weight block -->
  <line x1="185" y1="200" x2="185" y2="238" stroke="#8a8a8a" stroke-width="2"/>
  <rect x="167" y="238" width="36" height="30" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>

  <!-- angle labels at the knot -->
  <text x="118" y="182" fill="#8a8a8a">&#952;<tspan dy="4" font-size="10">A</tspan></text>
  <text x="238" y="182" fill="#8a8a8a">&#952;<tspan dy="4" font-size="10">B</tspan></text>

  <!-- FBD force arrows from the knot -->
  <!-- T_A along cable A, up-left -->
  <line x1="185" y1="200" x2="118" y2="101" stroke="#e0645c" stroke-width="2.5" marker-end="url(#coral)"/>
  <text x="96" y="108" fill="#e0645c">T<tspan dy="4" font-size="10">A</tspan></text>
  <!-- T_B along cable B, up-right -->
  <line x1="185" y1="200" x2="252" y2="101" stroke="#e0645c" stroke-width="2.5" marker-end="url(#coral)"/>
  <text x="256" y="108" fill="#e0645c">T<tspan dy="4" font-size="10">B</tspan></text>
  <!-- W straight down -->
  <line x1="185" y1="200" x2="185" y2="292" stroke="#e0645c" stroke-width="2.5" marker-end="url(#coral)"/>
  <text x="192" y="290" fill="#e0645c">W</text>

  <!-- knot (the isolated body) -->
  <circle cx="185" cy="200" r="5" fill="#4a90d9"/>

  <text x="120" y="308" fill="#8a8a8a" font-style="italic">free-body diagram</text>

  <!-- ===== right: the closed force triangle ===== -->

  <!-- W: top-left corner straight down -->
  <line x1="470" y1="110" x2="470" y2="228" stroke="#e0645c" stroke-width="2.5" marker-end="url(#coral)"/>
  <text x="440" y="176" fill="#e0645c">W</text>
  <!-- T_B: bottom up to the right -->
  <line x1="470" y1="232" x2="562" y2="158" stroke="#e0645c" stroke-width="2.5" marker-end="url(#coral)"/>
  <text x="516" y="212" fill="#e0645c">T<tspan dy="4" font-size="10">B</tspan></text>
  <!-- T_A: right corner up-left, closing the loop -->
  <line x1="566" y1="154" x2="474" y2="112" stroke="#e0645c" stroke-width="2.5" marker-end="url(#coral)"/>
  <text x="520" y="122" fill="#e0645c">T<tspan dy="4" font-size="10">A</tspan></text>

  <text x="452" y="308" fill="#8a8a8a" font-style="italic">closed force triangle: &#8721;F = 0</text>
</svg>
