<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="cA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e0645c"/></marker>
    <marker id="gA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a8a8a"/></marker>
  </defs>

  <text x="24" y="22" fill="#8a8a8a" font-style="italic">Dismember the frame: each member gets its own free body, and the shared pin becomes an equal-and-opposite pair.</text>

  <!-- beam AB : the multi-force member -->
  <line x1="70" y1="140" x2="320" y2="140" stroke="#4a90d9" stroke-width="4"/>
  <text x="150" y="130" fill="#4a90d9">beam AB (multi-force)</text>

  <!-- pin A + support reaction (left and down) -->
  <circle cx="70" cy="140" r="5" fill="#8a8a8a"/>
  <text x="56" y="132" fill="#8a8a8a">A</text>
  <line x1="70" y1="140" x2="28" y2="140" stroke="#e0645c" stroke-width="2" marker-end="url(#cA)"/>
  <text x="26" y="160" fill="#e0645c">A_x</text>
  <line x1="70" y1="140" x2="70" y2="190" stroke="#e0645c" stroke-width="2" marker-end="url(#cA)"/>
  <text x="76" y="184" fill="#e0645c">A_y</text>

  <!-- pin D + link force ON beam (up and to the right) -->
  <circle cx="190" cy="140" r="5" fill="#8a8a8a"/>
  <text x="184" y="160" fill="#8a8a8a">D</text>
  <line x1="190" y1="140" x2="238" y2="76" stroke="#e0645c" stroke-width="2" marker-end="url(#cA)"/>
  <text x="234" y="70" fill="#e0645c">F (link on beam)</text>

  <!-- load W at B -->
  <circle cx="320" cy="140" r="4" fill="#8a8a8a"/>
  <text x="326" y="134" fill="#8a8a8a">B</text>
  <line x1="320" y1="140" x2="320" y2="198" stroke="#e0645c" stroke-width="2" marker-end="url(#cA)"/>
  <text x="326" y="190" fill="#e0645c">W</text>

  <!-- link CD : the two-force member -->
  <line x1="470" y1="300" x2="560" y2="180" stroke="#4a90d9" stroke-width="4"/>
  <text x="566" y="250" fill="#4a90d9">link CD</text>
  <text x="566" y="266" fill="#4a90d9">(two-force)</text>

  <!-- pin C (wall) + reaction along the link -->
  <circle cx="470" cy="300" r="5" fill="#8a8a8a"/>
  <text x="452" y="306" fill="#8a8a8a">C</text>
  <line x1="470" y1="300" x2="518" y2="236" stroke="#e0645c" stroke-width="2" marker-end="url(#cA)"/>

  <!-- pin D on the link + force from beam ON link (down and to the left) -->
  <circle cx="560" cy="180" r="5" fill="#8a8a8a"/>
  <text x="566" y="176" fill="#8a8a8a">D</text>
  <line x1="560" y1="180" x2="512" y2="244" stroke="#e0645c" stroke-width="2" marker-end="url(#cA)"/>
  <text x="404" y="250" fill="#e0645c">F (beam on link)</text>

  <!-- dashed tie: this is one and the same pin -->
  <line x1="190" y1="140" x2="560" y2="180" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 5"/>
  <text x="300" y="152" fill="#8a8a8a">same pin D</text>
</svg>
