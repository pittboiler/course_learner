<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ac" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#e0645c"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8a8a8a"/></marker>
  </defs>

  <text x="24" y="22" fill="#8a8a8a" font-style="italic">Left: a rope over a fixed drum, wrap angle &#946;, tight T&#8322; vs slack T&#8321;. Right: a wedge driven under a load.</text>

  <!-- ===== drum + belt ===== -->
  <circle cx="150" cy="165" r="60" fill="#8a8a8a" fill-opacity="0.15" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="150" cy="165" r="3" fill="#8a8a8a"/>

  <!-- belt over the top -->
  <path d="M 90 165 A 60 60 0 0 1 210 165" fill="none" stroke="#4a90d9" stroke-width="5"/>

  <!-- wrap-angle inner arc + radii -->
  <line x1="150" y1="165" x2="90" y2="165" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="150" y1="165" x2="210" y2="165" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M 120 165 A 30 30 0 0 1 180 165" fill="none" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#ag)"/>
  <text x="143" y="145" fill="#8a8a8a">&#946;</text>

  <!-- slack tension (left, thin) -->
  <line x1="90" y1="165" x2="90" y2="243" stroke="#e0645c" stroke-width="1.6" marker-end="url(#ac)"/>
  <text x="64" y="220" fill="#e0645c">T&#8321;</text>

  <!-- tight tension (right, heavy) -->
  <line x1="210" y1="165" x2="210" y2="262" stroke="#e0645c" stroke-width="3" marker-end="url(#ac)"/>
  <text x="216" y="238" fill="#e0645c">T&#8322;</text>

  <!-- ===== wedge under block ===== -->
  <!-- ground -->
  <line x1="350" y1="252" x2="620" y2="252" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="360" y1="252" x2="352" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="385" y1="252" x2="377" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="410" y1="252" x2="402" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="435" y1="252" x2="427" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="460" y1="252" x2="452" y2="262" stroke="#8a8a8a" stroke-width="1"/>

  <!-- wedge (grey), thin tip at left -->
  <polygon points="370,252 560,252 560,222" fill="#8a8a8a" fill-opacity="0.15" stroke="#8a8a8a" stroke-width="2"/>
  <path d="M 398 252 A 28 28 0 0 0 396 246" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="404" y="249" fill="#8a8a8a" font-size="13">&#945;</text>

  <!-- block (blue) -->
  <rect x="452" y="176" width="64" height="60" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>

  <!-- weight on block -->
  <line x1="484" y1="140" x2="484" y2="174" stroke="#e0645c" stroke-width="2.4" marker-end="url(#ac)"/>
  <text x="490" y="152" fill="#e0645c">W</text>

  <!-- driving force P (push wedge to the left) -->
  <line x1="606" y1="234" x2="564" y2="234" stroke="#e0645c" stroke-width="2.4" marker-end="url(#ac)"/>
  <text x="610" y="239" fill="#e0645c">P</text>
</svg>
