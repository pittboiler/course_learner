<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="sbm1-coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0,0 9,3 0,6" fill="#e0645c"/>
    </marker>
    <marker id="sbm1-grey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0,0 9,3 0,6" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- caption -->
  <text x="26" y="22" fill="#8a8a8a" font-style="italic">One point load: shear jumps through zero under the load, and the moment peaks there &#8212; the critical section.</text>

  <!-- vertical connector: load -> V jump -> M peak -->
  <line x1="370" y1="104" x2="370" y2="430" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- ============ TOP: the beam ============ -->
  <rect x="90" y="88" width="420" height="14" fill="#4a90d9" opacity="0.18" stroke="#4a90d9" stroke-width="2"/>

  <!-- support A: pin -->
  <polygon points="90,102 76,124 104,124" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="72" y1="124" x2="108" y2="124" stroke="#8a8a8a" stroke-width="1.6"/>
  <line x1="74" y1="132" x2="82" y2="124" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="86" y1="132" x2="94" y2="124" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="98" y1="132" x2="106" y2="124" stroke="#8a8a8a" stroke-width="1"/>
  <text x="70" y="150" fill="#8a8a8a">A</text>

  <!-- support B: roller -->
  <polygon points="510,102 496,120 524,120" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
  <circle cx="501" cy="125" r="4" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="519" cy="125" r="4" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="494" y1="131" x2="526" y2="131" stroke="#8a8a8a" stroke-width="1.6"/>
  <text x="504" y="150" fill="#8a8a8a">B</text>

  <!-- point load P (down) at x = 4 m -->
  <line x1="370" y1="44" x2="370" y2="84" stroke="#e0645c" stroke-width="2.4" marker-end="url(#sbm1-coral)"/>
  <text x="377" y="60" fill="#e0645c">P = 12 kN</text>

  <!-- span dimensions -->
  <text x="220" y="80" fill="#8a8a8a" font-size="12">4 m</text>
  <text x="435" y="80" fill="#8a8a8a" font-size="12">2 m</text>

  <!-- ============ MIDDLE: shear diagram V(x) ============ -->
  <text x="20" y="234" fill="#4a90d9" font-size="13">V (kN)</text>
  <!-- zero baseline -->
  <line x1="80" y1="250" x2="546" y2="250" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#sbm1-grey)"/>
  <text x="550" y="255" fill="#8a8a8a" font-size="12">x</text>
  <!-- V curve -->
  <path d="M 90 250 L 90 222 L 370 222 L 370 306 L 510 306 L 510 250" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="200" y="215" fill="#4a90d9">+4</text>
  <text x="430" y="322" fill="#4a90d9">&#8722;8</text>
  <!-- V = 0 crossing -->
  <circle cx="370" cy="250" r="4" fill="#e0645c"/>
  <text x="378" y="244" fill="#e0645c" font-size="12">V = 0 here</text>

  <!-- ============ BOTTOM: moment diagram M(x) ============ -->
  <text x="20" y="392" fill="#e0645c" font-size="13">M (kN&#183;m)</text>
  <!-- zero baseline -->
  <line x1="80" y1="430" x2="546" y2="430" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#sbm1-grey)"/>
  <text x="550" y="435" fill="#8a8a8a" font-size="12">x</text>
  <!-- M curve: piecewise linear, peak under the load -->
  <path d="M 90 430 L 370 334 L 510 430" fill="none" stroke="#e0645c" stroke-width="3"/>
  <circle cx="370" cy="334" r="4" fill="#e0645c"/>
  <text x="300" y="328" fill="#e0645c">M</text>
  <text x="316" y="332" fill="#e0645c" font-size="10">max</text>
  <text x="336" y="328" fill="#e0645c">= 16</text>
</svg>
