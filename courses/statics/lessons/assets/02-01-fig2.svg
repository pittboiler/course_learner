<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="load2" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <polygon points="5,10 1,2 9,2" fill="#e0645c"/>
    </marker>
  </defs>

  <!-- caption -->
  <text x="24" y="24" fill="#8a8a8a" font-style="italic">Coral 0 = zero-force members: they carry nothing under this single load.</text>

  <!-- members -->
  <line x1="80" y1="210" x2="200" y2="210" stroke="#4a90d9" stroke-width="3"/>
  <line x1="200" y1="210" x2="320" y2="210" stroke="#4a90d9" stroke-width="3"/>
  <line x1="80" y1="210" x2="200" y2="90" stroke="#4a90d9" stroke-width="3"/>
  <line x1="200" y1="90" x2="320" y2="210" stroke="#4a90d9" stroke-width="3"/>
  <line x1="200" y1="210" x2="200" y2="90" stroke="#4a90d9" stroke-width="3"/>
  <line x1="200" y1="90" x2="320" y2="90" stroke="#4a90d9" stroke-width="3"/>
  <line x1="320" y1="210" x2="320" y2="90" stroke="#4a90d9" stroke-width="3"/>

  <!-- joints -->
  <circle cx="80" cy="210" r="4" fill="#4a90d9"/>
  <circle cx="200" cy="210" r="4" fill="#4a90d9"/>
  <circle cx="320" cy="210" r="4" fill="#4a90d9"/>
  <circle cx="200" cy="90" r="4" fill="#4a90d9"/>
  <circle cx="320" cy="90" r="4" fill="#4a90d9"/>

  <!-- joint labels -->
  <text x="62" y="206" fill="#8a8a8a">A</text>
  <text x="188" y="230" fill="#8a8a8a">C</text>
  <text x="326" y="230" fill="#8a8a8a">B</text>
  <text x="178" y="88" fill="#8a8a8a">D</text>
  <text x="328" y="88" fill="#8a8a8a">E</text>

  <!-- pin support at A -->
  <polygon points="80,210 66,234 94,234" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="64" y1="234" x2="96" y2="234" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="66" y1="234" x2="60" y2="242" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="74" y1="234" x2="68" y2="242" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="82" y1="234" x2="76" y2="242" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="90" y1="234" x2="84" y2="242" stroke="#8a8a8a" stroke-width="1"/>

  <!-- roller support at B -->
  <polygon points="320,210 306,232 334,232" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="311" cy="237" r="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="329" cy="237" r="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="302" y1="242" x2="338" y2="242" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- applied load at D -->
  <line x1="200" y1="46" x2="200" y2="86" stroke="#e0645c" stroke-width="2" marker-end="url(#load2)"/>
  <text x="208" y="58" fill="#e0645c">P</text>

  <!-- zero-force tags -->
  <text x="206" y="154" fill="#e0645c">0</text>
  <text x="254" y="82" fill="#e0645c">0</text>
  <text x="326" y="154" fill="#e0645c">0</text>
</svg>
