<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="70" y="22" fill="#8a8a8a" font-style="italic">Marko–Siggia force–extension curve: nearly free at first, then diverging as x/L → 1 — the last thermal wrinkles cost the most.</text>

  <!-- y-axis -->
  <line x1="70" y1="290" x2="70" y2="45" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,45 65,55 75,55" fill="#8a8a8a"/>
  <!-- x-axis -->
  <line x1="70" y1="290" x2="500" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="500,290 490,285 490,295" fill="#8a8a8a"/>

  <!-- y ticks (reduced force units k_BT/l_p) -->
  <line x1="66" y1="230" x2="70" y2="230" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="235" fill="#8a8a8a" text-anchor="end">2</text>
  <line x1="66" y1="170" x2="70" y2="170" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="175" fill="#8a8a8a" text-anchor="end">4</text>
  <line x1="66" y1="110" x2="70" y2="110" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="115" fill="#8a8a8a" text-anchor="end">6</text>
  <line x1="66" y1="50" x2="70" y2="50" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="55" fill="#8a8a8a" text-anchor="end">8</text>

  <!-- x ticks -->
  <line x1="270" y1="290" x2="270" y2="294" stroke="#8a8a8a" stroke-width="1"/>
  <text x="270" y="308" fill="#8a8a8a" text-anchor="middle">0.5</text>
  <line x1="470" y1="290" x2="470" y2="294" stroke="#8a8a8a" stroke-width="1"/>
  <text x="470" y="308" fill="#8a8a8a" text-anchor="middle">1</text>
  <text x="70" y="308" fill="#8a8a8a" text-anchor="middle">0</text>

  <!-- axis labels -->
  <text x="285" y="332" fill="#8a8a8a">Extension  x / L</text>
  <text x="18" y="170" fill="#8a8a8a" transform="rotate(-90 18 170)" text-anchor="middle">Force F   (units k_BT / l_p)</text>

  <!-- coral asymptote at x = L -->
  <line x1="470" y1="290" x2="470" y2="45" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="466" y="60" fill="#e0645c" text-anchor="end">x = L</text>
  <text x="466" y="76" fill="#e0645c" text-anchor="end">(contour length)</text>

  <!-- low-force entropic slope guide -->
  <line x1="70" y1="290" x2="210" y2="274.3" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="150" y="270" fill="#8a8a8a">slope = 3k_BT / 2 l_p L</text>
  <text x="150" y="286" fill="#8a8a8a">(entropic spring)</text>

  <!-- the Marko-Siggia curve -->
  <path d="M 70 290 L 110 285.2 L 150 279.8 L 190 273.2 L 230 264.7 L 270 252.5 L 290 244 L 310 232.6 L 330 216.8 L 350 193.2 L 362 172.7 L 370 155 L 378 132.6 L 386 103.7 L 390 86 L 394 65.4 L 399 50"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- divergence annotation -->
  <text x="405" y="70" fill="#4a90d9">F ~ (1 − x/L)⁻²</text>
  <text x="405" y="86" fill="#4a90d9">diverges</text>

  <!-- overstretch note -->
  <text x="150" y="120" fill="#e0645c">Real dsDNA: at ~65 pN it</text>
  <text x="150" y="136" fill="#e0645c">overstretches (+70% length)</text>
  <text x="150" y="152" fill="#e0645c">— a transition beyond the WLC.</text>
</svg>
