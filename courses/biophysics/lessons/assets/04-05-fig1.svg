<svg viewBox="0 0 660 312" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="20" fill="#8a8a8a" font-style="italic">Cross threshold and positive feedback runs away: a coral Na⁺ upstroke toward V_Na, a blue K⁺ downstroke toward V_K. Inset: gating is a two-state sigmoid.</text>

  <!-- ===== main: action-potential trace V(t) ===== -->

  <!-- reference dashed lines -->
  <line x1="72" y1="70"  x2="430" y2="70"  stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="434" y="73"  fill="#e0645c" font-size="12">V_Na ≈ +60 mV</text>
  <line x1="72" y1="212" x2="430" y2="212" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="434" y="210" fill="#8a8a8a" font-size="12">threshold −55</text>
  <line x1="72" y1="230" x2="430" y2="230" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="434" y="234" fill="#8a8a8a" font-size="12">rest −70</text>
  <line x1="72" y1="250" x2="430" y2="250" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="434" y="253" fill="#4a90d9" font-size="12">V_K ≈ −86 mV</text>

  <!-- axes -->
  <line x1="62" y1="60" x2="62" y2="278" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="62,60 57,70 67,70" fill="#8a8a8a"/>
  <text x="30" y="64" fill="#8a8a8a">V (mV)</text>
  <line x1="62" y1="278" x2="430" y2="278" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="430,278 420,273 420,283" fill="#8a8a8a"/>
  <text x="405" y="296" fill="#8a8a8a">t (ms)</text>

  <!-- resting approach to threshold (grey) -->
  <path d="M 72 230 L 120 230 L 130 224 L 138 212" fill="none" stroke="#8a8a8a" stroke-width="2.5"/>
  <!-- Na upstroke (coral) -->
  <path d="M 138 212 L 144 185 L 150 150 L 156 112 L 162 95" fill="none" stroke="#e0645c" stroke-width="3"/>
  <!-- K repolarization + undershoot + recovery (blue) -->
  <path d="M 162 95 L 170 115 L 180 155 L 192 200 L 204 235 L 216 248 L 232 243 L 252 237 L 285 232 L 430 230" fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- threshold crossing dot -->
  <circle cx="138" cy="212" r="3.5" fill="#e0645c"/>

  <!-- phase labels -->
  <text x="120" y="120" fill="#e0645c" font-size="12">① upstroke</text>
  <text x="120" y="134" fill="#e0645c" font-size="12">(Na⁺ in)</text>
  <text x="212" y="150" fill="#4a90d9" font-size="12">② repolarize</text>
  <text x="212" y="164" fill="#4a90d9" font-size="12">(K⁺ out)</text>
  <text x="222" y="262" fill="#4a90d9" font-size="12">③ undershoot</text>

  <!-- refractory bracket -->
  <line x1="162" y1="270" x2="300" y2="270" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="162" y1="266" x2="162" y2="270" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="300" y1="266" x2="300" y2="270" stroke="#8a8a8a" stroke-width="1"/>
  <text x="176" y="284" fill="#8a8a8a" font-size="12">refractory period</text>

  <!-- ===== inset: P_open(V) two-state gating sigmoid ===== -->
  <text x="474" y="112" fill="#8a8a8a" font-size="12" font-style="italic">gating: P_open(V)</text>
  <!-- inset axes -->
  <line x1="480" y1="128" x2="480" y2="230" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="480" y1="230" x2="620" y2="230" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="452" y="142" fill="#8a8a8a" font-size="12">1</text>
  <text x="464" y="234" fill="#8a8a8a" font-size="12">0</text>
  <text x="596" y="248" fill="#8a8a8a" font-size="12">V →</text>
  <!-- P=0.5 guide -->
  <line x1="480" y1="185" x2="545" y2="185" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>
  <!-- sigmoid curve (blue) -->
  <path d="M 480 228.4 L 501.7 224.2 L 512.5 219.3 L 528.8 205.8 L 545 185 L 561.3 164.2 L 577.5 150.7 L 588.3 145.8 L 610 141.6"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <!-- midpoint marker -->
  <circle cx="545" cy="185" r="3.5" fill="#e0645c"/>
  <line x1="545" y1="185" x2="545" y2="230" stroke="#e0645c" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="530" y="246" fill="#e0645c" font-size="12">V₁ᐟ₂</text>
  <text x="556" y="160" fill="#8a8a8a" font-size="12">slope ∝ 1/V_s</text>
</svg>
