<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="60" y="22" fill="#8a8a8a" font-style="italic">Michaelis–Menten: rate v rises linearly, then saturates at V_max. Half-max sits at [S] = K_M.</text>

  <!-- axes -->
  <line x1="70" y1="250" x2="575" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="575,250 565,245 565,255" fill="#8a8a8a"/>
  <text x="556" y="272" fill="#8a8a8a" font-style="italic">[S]</text>
  <line x1="70" y1="250" x2="70" y2="38" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,38 65,48 75,48" fill="#8a8a8a"/>
  <text x="58" y="46" fill="#8a8a8a" font-style="italic">v</text>
  <text x="60" y="266" fill="#8a8a8a">0</text>

  <!-- V_max asymptote (grey dashed) -->
  <line x1="70" y1="50" x2="575" y2="50" stroke="#8a8a8a" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="500" y="44" fill="#8a8a8a">V_max</text>

  <!-- low-[S] tangent, slope V_max/K_M (grey dashed) -->
  <line x1="70" y1="250" x2="128" y2="60" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="132" y="70" fill="#8a8a8a">slope V_max/K_M</text>

  <!-- half-max guides (coral dashed) -->
  <line x1="70" y1="150" x2="131" y2="150" stroke="#e0645c" stroke-width="1.25" stroke-dasharray="4 4"/>
  <line x1="131" y1="250" x2="131" y2="150" stroke="#e0645c" stroke-width="1.25" stroke-dasharray="4 4"/>
  <circle cx="131" cy="150" r="4.5" fill="#e0645c"/>
  <text x="16" y="155" fill="#e0645c">½V_max</text>
  <text x="120" y="268" fill="#e0645c">K_M</text>

  <!-- the Michaelis–Menten hyperbola (blue) -->
  <path d="M 70.0 250.0 L 78.2 226.5 L 86.3 207.9 L 94.5 192.9 L 102.7 180.4 L 110.8 170.0 L 119.0 161.1 L 127.2 153.4 L 135.3 146.8 L 143.5 140.9 L 151.7 135.7 L 159.8 131.1 L 168.0 126.9 L 176.2 123.2 L 184.3 119.8 L 192.5 116.7 L 200.7 113.8 L 208.8 111.2 L 217.0 108.8 L 225.2 106.6 L 233.3 104.5 L 241.5 102.6 L 249.7 100.8 L 257.8 99.2 L 266.0 97.6 L 274.2 96.2 L 282.3 94.8 L 290.5 93.5 L 298.7 92.3 L 306.8 91.1 L 315.0 90.0 L 331.3 88.0 L 347.7 86.1 L 364.0 84.5 L 380.3 83.0 L 396.7 81.6 L 413.0 80.3 L 429.3 79.1 L 445.7 78.0 L 462.0 77.0 L 478.3 76.1 L 494.7 75.2 L 511.0 74.4 L 527.3 73.6 L 543.7 72.9 L 560.0 72.2"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
</svg>
