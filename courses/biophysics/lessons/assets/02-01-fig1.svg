<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">A process runs if it goes downhill in free energy G — and coupling to ATP can pull an uphill step down.</text>

  <!-- ================= Panel 1: a spontaneous reaction ================= -->
  <!-- G axis -->
  <line x1="50" y1="300" x2="50" y2="72" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="50,72 45,84 55,84" fill="#8a8a8a"/>
  <text x="36" y="84" fill="#8a8a8a">G</text>
  <text x="72" y="300" fill="#8a8a8a" font-style="italic">reaction &#8594;</text>

  <!-- landscape: reactant well, barrier, product well -->
  <path d="M 66 135 C 88 140 96 152 110 152 C 132 152 150 102 168 100 C 195 98 215 214 242 215 C 262 216 280 205 292 200"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- level guides -->
  <line x1="110" y1="152" x2="278" y2="152" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="242" y1="215" x2="278" y2="215" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- delta-G drop -->
  <line x1="272" y1="152" x2="272" y2="215" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="272,152 268,161 276,161" fill="#e0645c"/>
  <polygon points="272,215 268,206 276,206" fill="#e0645c"/>
  <text x="200" y="140" fill="#e0645c">&#916;G &lt; 0</text>

  <text x="86" y="176" fill="#8a8a8a">reactant</text>
  <text x="216" y="238" fill="#8a8a8a">product</text>

  <!-- ================= Panel 2: coupling to ATP ================= -->
  <!-- G axis -->
  <line x1="356" y1="300" x2="356" y2="72" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="356,72 351,84 361,84" fill="#8a8a8a"/>
  <text x="342" y="84" fill="#8a8a8a">G</text>

  <!-- uncoupled uphill reaction (dashed grey) -->
  <path d="M 372 190 C 394 194 402 202 414 202 C 436 202 451 132 468 130 C 492 128 508 150 526 151 C 551 152 566 158 580 160"
        fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="500" y="140" fill="#8a8a8a" font-style="italic">alone: &#916;G &gt; 0</text>

  <!-- coupled reaction (blue): same start, product drops -->
  <path d="M 372 190 C 394 194 402 202 414 202 C 436 202 451 132 468 130 C 493 128 510 256 528 257 C 553 258 567 250 581 246"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="500" y="284" fill="#4a90d9">coupled: &#916;G &lt; 0</text>

  <!-- ATP pull-down arrow between the two product wells -->
  <line x1="543" y1="153" x2="543" y2="255" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="543,255 539,246 547,246" fill="#e0645c"/>
  <text x="549" y="210" fill="#e0645c">ATP</text>
</svg>
