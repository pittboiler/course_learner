<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="60" y="24" fill="#8a8a8a" font-style="italic">In salt water a charge's potential is screened: φ ∝ (1/r)·e^(−r/λ_D) (blue) dies far faster than bare Coulomb 1/r (grey).</text>

  <!-- axes -->
  <line x1="70" y1="300" x2="585" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="585,300 575,295 575,305" fill="#8a8a8a"/>
  <text x="560" y="322" fill="#8a8a8a">r (nm)</text>
  <line x1="70" y1="300" x2="70" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,52 65,62 75,62" fill="#8a8a8a"/>
  <text x="40" y="60" fill="#8a8a8a">φ(r)</text>

  <!-- x ticks at r = 1,2,3,4 nm -->
  <line x1="168.3" y1="300" x2="168.3" y2="305" stroke="#8a8a8a" stroke-width="1"/>
  <text x="163" y="318" fill="#8a8a8a">1</text>
  <line x1="299" y1="300" x2="299" y2="305" stroke="#8a8a8a" stroke-width="1"/>
  <text x="294" y="318" fill="#8a8a8a">2</text>
  <line x1="429.7" y1="300" x2="429.7" y2="305" stroke="#8a8a8a" stroke-width="1"/>
  <text x="425" y="318" fill="#8a8a8a">3</text>
  <line x1="560.3" y1="300" x2="560.3" y2="305" stroke="#8a8a8a" stroke-width="1"/>
  <text x="555" y="318" fill="#8a8a8a">4</text>

  <!-- Debye length marker at r = 1 nm = λ_D -->
  <line x1="168.3" y1="300" x2="168.3" y2="120" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="176" y="132" fill="#e0645c">λ_D ≈ 1 nm</text>

  <!-- bare Coulomb 1/r (grey dashed) -->
  <path d="M 90 70 L 103.1 116 L 116.1 146.7 L 129.2 168.6 L 142.2 185 L 168.3 208 L 194.5 223.3 L 233.6 238.7 L 299 254 L 364.4 263.2 L 429.7 269.3 L 495 273.7 L 560.3 277"
        fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="300" y="248" fill="#8a8a8a">bare Coulomb  1/r</text>

  <!-- screened Debye potential (blue solid) -->
  <path d="M 90 145.8 L 103.1 188.4 L 116.1 215.8 L 129.2 234.7 L 142.2 248.3 L 168.3 266.1 L 194.5 276.9 L 233.6 286.3 L 299 293.8 L 364.4 297 L 429.7 298.5 L 495 299.2 L 560.3 299.6"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="150" y="176" fill="#4a90d9">screened  (1/r)e^(−r/λ_D)</text>

  <!-- ===== inset: central charge + counterion cloud ===== -->
  <circle cx="497" cy="100" r="50" fill="#e0645c" opacity="0.15"/>
  <circle cx="497" cy="100" r="10" fill="#e0645c"/>
  <text x="493.5" y="105" fill="#8a8a8a" font-size="13">+</text>
  <!-- surrounding counterions (grey minus signs) -->
  <text x="455" y="80" fill="#8a8a8a" font-size="13">−</text>
  <text x="533" y="82" fill="#8a8a8a" font-size="13">−</text>
  <text x="463" y="132" fill="#8a8a8a" font-size="13">−</text>
  <text x="528" y="130" fill="#8a8a8a" font-size="13">−</text>
  <text x="497" y="58" fill="#8a8a8a" font-size="13">−</text>
  <text x="497" y="150" fill="#8a8a8a" font-size="13">−</text>
  <text x="445" y="106" fill="#8a8a8a" font-size="13">−</text>
  <text x="548" y="106" fill="#8a8a8a" font-size="13">−</text>
  <text x="447" y="170" fill="#8a8a8a" font-style="italic" font-size="13">counterion cloud (radius ~λ_D)</text>
</svg>
