<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Occupancy of the upper state is a sigmoid in the gap: p = 1/(1+e^(ΔE/kBT)). It turns over in a window of a few kBT.</text>

  <!-- turnover window shading: -2 to +2 kBT (x 216.7 to 343.3) -->
  <rect x="216.7" y="70" width="126.6" height="180" fill="#e0645c" opacity="0.15"/>
  <text x="238" y="86" fill="#e0645c" font-size="12">~few kBT</text>

  <!-- axes -->
  <line x1="90" y1="252" x2="484" y2="252" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="484,252 474,247 474,257" fill="#8a8a8a"/>
  <line x1="90" y1="256" x2="90" y2="62" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="90,62 85,72 95,72" fill="#8a8a8a"/>

  <!-- axis labels -->
  <text x="410" y="272" fill="#8a8a8a">ΔE / kBT</text>
  <text x="16" y="66" fill="#8a8a8a">p</text>

  <!-- x ticks -->
  <line x1="90" y1="250" x2="90" y2="256" stroke="#8a8a8a" stroke-width="1"/>
  <text x="80" y="270" fill="#8a8a8a" font-size="12">-6</text>
  <line x1="153.3" y1="250" x2="153.3" y2="256" stroke="#8a8a8a" stroke-width="1"/>
  <text x="144" y="270" fill="#8a8a8a" font-size="12">-4</text>
  <line x1="216.7" y1="250" x2="216.7" y2="256" stroke="#8a8a8a" stroke-width="1"/>
  <text x="208" y="270" fill="#8a8a8a" font-size="12">-2</text>
  <line x1="343.3" y1="250" x2="343.3" y2="256" stroke="#8a8a8a" stroke-width="1"/>
  <text x="338" y="270" fill="#8a8a8a" font-size="12">2</text>
  <line x1="406.7" y1="250" x2="406.7" y2="256" stroke="#8a8a8a" stroke-width="1"/>
  <text x="402" y="270" fill="#8a8a8a" font-size="12">4</text>
  <line x1="470" y1="250" x2="470" y2="256" stroke="#8a8a8a" stroke-width="1"/>
  <text x="466" y="270" fill="#8a8a8a" font-size="12">6</text>

  <!-- y ticks -->
  <line x1="86" y1="250" x2="90" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <text x="72" y="255" fill="#8a8a8a" font-size="12">0</text>
  <line x1="86" y1="160" x2="90" y2="160" stroke="#8a8a8a" stroke-width="1"/>
  <text x="66" y="165" fill="#8a8a8a" font-size="12">½</text>
  <line x1="86" y1="70" x2="90" y2="70" stroke="#8a8a8a" stroke-width="1"/>
  <text x="72" y="75" fill="#8a8a8a" font-size="12">1</text>

  <!-- the sigmoid p = 1/(1+e^(ΔE/kBT)) -->
  <path d="M 90 70.5 L 105.8 70.7 L 121.7 71.2 L 137.5 72.0 L 153.3 73.2 L 169.2 75.3 L 185 78.5 L 200.8 83.7 L 216.7 91.5 L 232.5 102.8 L 248.3 118.4 L 264.2 138.0 L 280 160 L 295.8 182.0 L 311.7 201.6 L 327.5 217.2 L 343.3 228.5 L 359.2 236.4 L 375 241.5 L 390.8 244.7 L 406.7 246.8 L 422.5 248.0 L 438.3 248.8 L 454.2 248.7 L 470 249.6"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- midpoint marker: ΔE=0, p=1/2 -->
  <line x1="90" y1="160" x2="280" y2="160" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="280" y1="252" x2="280" y2="160" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="280" cy="160" r="4.5" fill="#e0645c"/>
  <text x="288" y="152" fill="#e0645c" font-size="12">midpoint: ΔE=0, p=½</text>

  <!-- ===== inset: two-well energy diagram ===== -->
  <text x="512" y="96" fill="#8a8a8a" font-style="italic" font-size="12">energy</text>
  <!-- energy axis -->
  <line x1="512" y1="205" x2="512" y2="102" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="512,102 508,110 516,110" fill="#8a8a8a"/>
  <!-- double well curve: state 0 lower (min y=190), state 1 higher (min y=164) -->
  <path d="M 520 118 Q 534 192 548 190 Q 562 188 570 128 Q 578 166 592 166 Q 606 168 620 116"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- state labels -->
  <text x="540" y="207" fill="#4a90d9" font-size="12">0</text>
  <text x="588" y="207" fill="#4a90d9" font-size="12">1</text>
  <!-- energy levels (dashed) -->
  <line x1="548" y1="190" x2="612" y2="190" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="592" y1="164" x2="628" y2="164" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="2 3"/>
  <!-- gap arrow -->
  <line x1="616" y1="190" x2="616" y2="164" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="616,164 612,172 620,172" fill="#e0645c"/>
  <polygon points="616,190 612,182 620,182" fill="#e0645c"/>
  <text x="621" y="182" fill="#e0645c" font-size="12">ΔE</text>
</svg>
