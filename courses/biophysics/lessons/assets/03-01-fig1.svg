<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">A floppy chain is a random walk: stretching it (raising x) throws away conformations — entropy falls, and the coil pulls back. Entropy makes a spring.</text>

  <!-- ===== left: random-coil polymer + end-to-end vector ===== -->
  <text x="70" y="52" fill="#8a8a8a" font-style="italic">the ideal chain (N segments, length b)</text>

  <!-- Gaussian conformation cloud -->
  <ellipse cx="145" cy="165" rx="95" ry="72" fill="#4a90d9" opacity="0.15"/>

  <!-- the freely-jointed coil (blue), a jagged random walk of Kuhn segments -->
  <path d="M 75 205 L 100 168 L 82 135 L 118 150 L 138 108 L 120 158 L 158 176 L 182 140 L 160 112 L 198 152 L 218 128"
        fill="none" stroke="#4a90d9" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="75" cy="205" r="4" fill="#4a90d9"/>
  <circle cx="218" cy="128" r="4" fill="#4a90d9"/>

  <!-- end-to-end vector R (coral) -->
  <line x1="75" y1="205" x2="218" y2="128" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="218,128 206,129 211,140" fill="#e0645c"/>
  <text x="140" y="182" fill="#e0645c" font-style="italic">R</text>
  <text x="196" y="262" fill="#8a8a8a">typical size √⟨R²⟩ = b√N</text>

  <!-- ===== right: entropic free energy parabola + linear force ===== -->
  <!-- axes -->
  <line x1="360" y1="245" x2="628" y2="245" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="628,245 618,240 618,250" fill="#8a8a8a"/>
  <text x="560" y="264" fill="#8a8a8a">extension x</text>
  <line x1="360" y1="245" x2="360" y2="70" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="360,70 355,80 365,80" fill="#8a8a8a"/>
  <text x="336" y="76" fill="#8a8a8a">F, f</text>

  <!-- free-energy parabola F(x) (blue) -->
  <polyline points="360,245 410,238.6 460,219.4 510,187.4 560,142.6 610,85"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="430" y="108" fill="#4a90d9">F(x) = (3k_BT/2Nb²)x²</text>

  <!-- linear restoring force f = kx (coral) -->
  <line x1="360" y1="245" x2="616" y2="128" stroke="#e0645c" stroke-width="2.5"/>
  <text x="500" y="205" fill="#e0645c">f = (3k_BT/Nb²)x</text>
  <text x="470" y="223" fill="#8a8a8a" font-style="italic">force = slope of F</text>
</svg>
