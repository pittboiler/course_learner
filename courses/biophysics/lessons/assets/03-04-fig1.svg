  <circle cx="58" cy="92" r="6" fill="#8a8a8a"/>
  <line x1="55" y1="97" x2="55" y2="118" stroke="#4a90d9" stroke-width="2"/>
  <line x1="61" y1="97" x2="61" y2="118" stroke="#4a90d9" stroke-width="2"/>
