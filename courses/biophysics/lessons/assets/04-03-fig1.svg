<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">ATP tilts an asymmetric periodic (sawtooth) landscape; the motor rides thermal noise downhill, one step d forward.</text>

  <!-- axes -->
  <line x1="60" y1="315" x2="610" y2="315" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="610,315 600,310 600,320" fill="#8a8a8a"/>
  <text x="500" y="335" fill="#8a8a8a">motor position x &#8594;</text>
  <line x1="60" y1="315" x2="60" y2="70" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="60,70 55,80 65,80" fill="#8a8a8a"/>
  <text x="40" y="64" fill="#8a8a8a">free energy G(x)</text>

  <!-- coral tilt guideline through the well minima (the downhill bias from ATP) -->
  <line x1="95" y1="205" x2="535" y2="285" stroke="#e0645c" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
  <text x="392" y="300" fill="#e0645c" font-style="italic">downhill tilt &#8733; &#916;G_ATP</text>

  <!-- the tilted asymmetric sawtooth landscape -->
  <path d="M 78 160 L 95 205 L 190 165 L 205 225 L 300 185 L 315 245 L 410 205 L 425 265 L 520 225 L 535 285 L 555 268"
        fill="none" stroke="#8a8a8a" stroke-width="2.5"/>

  <!-- thermal-noise wiggle above the motor -->
  <path d="M 176 190 q 6 -9 12 0 q 6 9 12 0 q 6 -9 12 0" fill="none" stroke="#e0645c" stroke-width="2"/>
  <polygon points="176,190 184,186 183,195" fill="#e0645c"/>
  <polygon points="212,190 204,186 205,195" fill="#e0645c"/>
  <text x="150" y="178" fill="#e0645c">thermal kicks</text>

  <!-- motor: blue ball sitting in well 2, sliding forward to well 3 -->
  <path d="M 205 225 Q 260 168 315 245" fill="none" stroke="#4a90d9" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="315,245 306,239 313,234" fill="#4a90d9"/>
  <circle cx="205" cy="225" r="10" fill="#4a90d9"/>
  <circle cx="315" cy="245" r="10" fill="#4a90d9" opacity="0.3"/>
  <text x="252" y="188" fill="#4a90d9">step</text>

  <!-- step d annotation between well 2 and well 3 -->
  <line x1="205" y1="235" x2="205" y2="312" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="315" y1="255" x2="315" y2="312" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="205" y1="308" x2="315" y2="308" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="205,308 214,304 214,312" fill="#e0645c"/>
  <polygon points="315,308 306,304 306,312" fill="#e0645c"/>
  <text x="238" y="303" fill="#e0645c">d &#8776; 8 nm</text>

  <!-- stall note -->
  <text x="360" y="110" fill="#e0645c">a load flattens the tilt;</text>
  <text x="360" y="128" fill="#e0645c">flat &#8594; stall, F_stall = &#916;G/d</text>
</svg>
