<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="70" y="24" fill="#8a8a8a" font-style="italic">Both engines climb the same hill: fusion up from the left, fission down from the right, toward the ⁵⁶Fe peak.</text>

  <!-- ===== axes ===== -->
  <line x1="70" y1="330" x2="70" y2="50" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,50 65,60 75,60" fill="#8a8a8a"/>
  <line x1="70" y1="330" x2="620" y2="330" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="620,330 610,325 610,335" fill="#8a8a8a"/>

  <!-- y ticks -->
  <line x1="66" y1="320" x2="70" y2="320" stroke="#8a8a8a" stroke-width="1"/>
  <text x="52" y="325" fill="#8a8a8a" text-anchor="end">0</text>
  <line x1="66" y1="262.2" x2="70" y2="262.2" stroke="#8a8a8a" stroke-width="1"/>
  <text x="52" y="267" fill="#8a8a8a" text-anchor="end">2</text>
  <line x1="66" y1="204.4" x2="70" y2="204.4" stroke="#8a8a8a" stroke-width="1"/>
  <text x="52" y="209" fill="#8a8a8a" text-anchor="end">4</text>
  <line x1="66" y1="146.7" x2="70" y2="146.7" stroke="#8a8a8a" stroke-width="1"/>
  <text x="52" y="151" fill="#8a8a8a" text-anchor="end">6</text>
  <line x1="66" y1="88.9" x2="70" y2="88.9" stroke="#8a8a8a" stroke-width="1"/>
  <text x="52" y="93" fill="#8a8a8a" text-anchor="end">8</text>
  <text x="26" y="190" fill="#8a8a8a" transform="rotate(-90 26 190)" text-anchor="middle">B/A  (MeV per nucleon)</text>

  <!-- x ticks -->
  <line x1="70" y1="330" x2="70" y2="334" stroke="#8a8a8a" stroke-width="1"/>
  <text x="70" y="349" fill="#8a8a8a" text-anchor="middle">0</text>
  <line x1="182.5" y1="330" x2="182.5" y2="334" stroke="#8a8a8a" stroke-width="1"/>
  <text x="182.5" y="349" fill="#8a8a8a" text-anchor="middle">50</text>
  <line x1="295" y1="330" x2="295" y2="334" stroke="#8a8a8a" stroke-width="1"/>
  <text x="295" y="349" fill="#8a8a8a" text-anchor="middle">100</text>
  <line x1="407.5" y1="330" x2="407.5" y2="334" stroke="#8a8a8a" stroke-width="1"/>
  <text x="407.5" y="349" fill="#8a8a8a" text-anchor="middle">150</text>
  <line x1="520" y1="330" x2="520" y2="334" stroke="#8a8a8a" stroke-width="1"/>
  <text x="520" y="349" fill="#8a8a8a" text-anchor="middle">200</text>
  <text x="345" y="372" fill="#8a8a8a" text-anchor="middle">Mass number  A</text>

  <!-- ===== the B/A curve ===== -->
  <path d="M 74.5 287.9 L 76.8 245.8 L 79.0 115.7 L 83.5 166.0 L 85.8 157.9 L 90.3 133.4 L 97.0 98.1 L 106.0 89.5 L 115.0 88.0 L 124.0 81.3 L 137.5 74.4 L 160.0 71.5 L 196.0 66.1 L 250.0 68.0 L 295.0 70.4 L 340.0 74.4 L 407.5 81.7 L 475.0 88.9 L 520.0 91.8 L 598.8 100.7"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- labelled nuclei -->
  <circle cx="74.5" cy="287.9" r="3" fill="#4a90d9"/>
  <text x="80" y="292" fill="#8a8a8a">²H</text>
  <circle cx="79.0" cy="115.7" r="3" fill="#4a90d9"/>
  <text x="66" y="110" fill="#8a8a8a" text-anchor="end">⁴He</text>
  <circle cx="196.0" cy="66.1" r="5" fill="#e0645c"/>
  <text x="204" y="60" fill="#e0645c">⁵⁶Fe  (peak ≈ 8.8)</text>
  <circle cx="598.8" cy="100.7" r="3" fill="#4a90d9"/>
  <text x="595" y="95" fill="#8a8a8a" text-anchor="end">²³⁵U</text>

  <!-- ===== fusion arrow (climbing from left) ===== -->
  <path d="M 100 210 Q 135 130 173 108" fill="none" stroke="#e0645c" stroke-width="2"/>
  <polygon points="175,105 165.2,113.4 173.4,119.1" fill="#e0645c"/>
  <text x="96" y="228" fill="#e0645c" font-style="italic">fusion</text>

  <!-- ===== fission arrow (descending from right) ===== -->
  <path d="M 555 133 Q 400 96 248 90" fill="none" stroke="#e0645c" stroke-width="2"/>
  <polygon points="245,89.5 255.7,84.6 254.2,94.4" fill="#e0645c"/>
  <text x="500" y="126" fill="#e0645c" font-style="italic">fission</text>

  <!-- ===== inset: D–T reaction ===== -->
  <rect x="355" y="196" width="262" height="122" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="367" y="216" fill="#8a8a8a" font-style="italic">D–T fusion</text>
  <text x="367" y="240" fill="#4a90d9">²H + ³H → ⁴He + n   (Q = 17.6 MeV)</text>
  <circle cx="382" cy="266" r="13" fill="#e0645c" opacity="0.15"/>
  <circle cx="382" cy="266" r="13" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="382" y="271" fill="#e0645c" text-anchor="middle">α</text>
  <text x="404" y="271" fill="#e0645c">⁴He (α): 3.5 MeV</text>
  <circle cx="382" cy="298" r="8" fill="#8a8a8a" opacity="0.15"/>
  <circle cx="382" cy="298" r="8" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="382" y="303" fill="#8a8a8a" text-anchor="middle">n</text>
  <text x="404" y="303" fill="#8a8a8a">n: 14.1 MeV</text>
</svg>
