<svg viewBox="0 0 640 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="26" fill="#8a8a8a" font-style="italic">Nucleons fill levels bottom-up (Pauli). Spin&#8211;orbit coupling drops the j = l + &#189; levels,</text>
  <text x="30" y="44" fill="#8a8a8a" font-style="italic">opening the big gaps (coral) exactly at the magic numbers 2, 8, 20, 28, 50.</text>

  <!-- ===== left: the level ladder ===== -->
  <!-- energy axis -->
  <line x1="60" y1="90" x2="60" y2="515" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="60,84 56,94 64,94" fill="#8a8a8a"/>
  <text x="40" y="80" fill="#8a8a8a" font-style="italic">E</text>

  <!-- column headers -->
  <text x="150" y="72" fill="#8a8a8a" text-anchor="middle" font-size="12">level</text>
  <text x="258" y="72" fill="#8a8a8a" text-anchor="middle" font-size="12">2j+1</text>
  <text x="315" y="72" fill="#8a8a8a" text-anchor="middle" font-size="12">&#931; filled</text>

  <!-- level lines: x 90..215 ; label at 85 (end) ; occ at 258 ; cum at 315 -->
  <!-- 1g9/2 y=100 cum50 MAGIC -->
  <line x1="90" y1="100" x2="215" y2="100" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="85" y="104" fill="#8a8a8a" text-anchor="end">1g&#8329;/&#8322;</text>
  <text x="258" y="104" fill="#8a8a8a" text-anchor="middle">10</text>
  <text x="315" y="104" fill="#e0645c" text-anchor="middle" font-weight="bold">50</text>
  <!-- 2p1/2 y=140 cum40 -->
  <line x1="90" y1="140" x2="215" y2="140" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="85" y="144" fill="#8a8a8a" text-anchor="end">2p&#8321;/&#8322;</text>
  <text x="258" y="144" fill="#8a8a8a" text-anchor="middle">2</text>
  <text x="315" y="144" fill="#8a8a8a" text-anchor="middle">40</text>
  <!-- 1f5/2 y=180 cum38 -->
  <line x1="90" y1="180" x2="215" y2="180" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="85" y="184" fill="#8a8a8a" text-anchor="end">1f&#8325;/&#8322;</text>
  <text x="258" y="184" fill="#8a8a8a" text-anchor="middle">6</text>
  <text x="315" y="184" fill="#8a8a8a" text-anchor="middle">38</text>
  <!-- 2p3/2 y=220 cum32 -->
  <line x1="90" y1="220" x2="215" y2="220" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="85" y="224" fill="#8a8a8a" text-anchor="end">2p&#8323;/&#8322;</text>
  <text x="258" y="224" fill="#8a8a8a" text-anchor="middle">4</text>
  <text x="315" y="224" fill="#8a8a8a" text-anchor="middle">32</text>
  <!-- 1f7/2 y=260 cum28 MAGIC -->
  <line x1="90" y1="260" x2="215" y2="260" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="85" y="264" fill="#8a8a8a" text-anchor="end">1f&#8327;/&#8322;</text>
  <text x="258" y="264" fill="#8a8a8a" text-anchor="middle">8</text>
  <text x="315" y="264" fill="#e0645c" text-anchor="middle" font-weight="bold">28</text>
  <!-- 1d3/2 y=300 cum20 MAGIC -->
  <line x1="90" y1="300" x2="215" y2="300" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="85" y="304" fill="#8a8a8a" text-anchor="end">1d&#8323;/&#8322;</text>
  <text x="258" y="304" fill="#8a8a8a" text-anchor="middle">4</text>
  <text x="315" y="304" fill="#e0645c" text-anchor="middle" font-weight="bold">20</text>
  <!-- 2s1/2 y=340 cum16 -->
  <line x1="90" y1="340" x2="215" y2="340" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="85" y="344" fill="#8a8a8a" text-anchor="end">2s&#8321;/&#8322;</text>
  <text x="258" y="344" fill="#8a8a8a" text-anchor="middle">2</text>
  <text x="315" y="344" fill="#8a8a8a" text-anchor="middle">16</text>
  <!-- 1d5/2 y=380 cum14 -->
  <line x1="90" y1="380" x2="215" y2="380" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="85" y="384" fill="#8a8a8a" text-anchor="end">1d&#8325;/&#8322;</text>
  <text x="258" y="384" fill="#8a8a8a" text-anchor="middle">6</text>
  <text x="315" y="384" fill="#8a8a8a" text-anchor="middle">14</text>
  <!-- 1p1/2 y=420 cum8 MAGIC -->
  <line x1="90" y1="420" x2="215" y2="420" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="85" y="424" fill="#8a8a8a" text-anchor="end">1p&#8321;/&#8322;</text>
  <text x="258" y="424" fill="#8a8a8a" text-anchor="middle">2</text>
  <text x="315" y="424" fill="#e0645c" text-anchor="middle" font-weight="bold">8</text>
  <!-- 1p3/2 y=460 cum6 -->
  <line x1="90" y1="460" x2="215" y2="460" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="85" y="464" fill="#8a8a8a" text-anchor="end">1p&#8323;/&#8322;</text>
  <text x="258" y="464" fill="#8a8a8a" text-anchor="middle">4</text>
  <text x="315" y="464" fill="#8a8a8a" text-anchor="middle">6</text>
  <!-- 1s1/2 y=500 cum2 MAGIC -->
  <line x1="90" y1="500" x2="215" y2="500" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="85" y="504" fill="#8a8a8a" text-anchor="end">1s&#8321;/&#8322;</text>
  <text x="258" y="504" fill="#8a8a8a" text-anchor="middle">2</text>
  <text x="315" y="504" fill="#e0645c" text-anchor="middle" font-weight="bold">2</text>

  <!-- coral gap markers: dashed line + bracket just above each magic level -->
  <!-- gap above 1s1/2 (2): between 500 and 460 -->
  <line x1="90" y1="480" x2="345" y2="480" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- gap above 1p1/2 (8): between 420 and 380 -->
  <line x1="90" y1="400" x2="345" y2="400" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- gap above 1d3/2 (20): between 300 and 260 -->
  <line x1="90" y1="280" x2="345" y2="280" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- gap above 1f7/2 (28): between 260 and 220 -->
  <line x1="90" y1="240" x2="345" y2="240" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- gap above 1g9/2 (50): above 100 -->
  <line x1="90" y1="88" x2="345" y2="88" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="352" y="243" fill="#e0645c" font-size="11" font-style="italic">shell gap</text>

  <!-- ===== right: spin-orbit splitting inset ===== -->
  <text x="490" y="150" fill="#8a8a8a" text-anchor="middle" font-style="italic" font-size="12">spin&#8211;orbit splitting of 1f</text>

  <!-- degenerate 1f (no spin-orbit) -->
  <line x1="435" y1="250" x2="545" y2="250" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="490" y="243" fill="#8a8a8a" text-anchor="middle" font-size="12">1f (l = 3)</text>

  <!-- f5/2 up -->
  <line x1="470" y1="185" x2="560" y2="185" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="565" y="189" fill="#8a8a8a" font-size="12">1f&#8325;/&#8322;  j = l&#8722;&#189;</text>
  <line x1="490" y1="245" x2="500" y2="190" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="500,190 494,196 503,199" fill="#8a8a8a"/>

  <!-- f7/2 down (the one that closes 28) -->
  <line x1="470" y1="315" x2="560" y2="315" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="565" y="319" fill="#4a90d9" font-size="12">1f&#8327;/&#8322;  j = l+&#189;</text>
  <line x1="490" y1="255" x2="500" y2="310" stroke="#4a90d9" stroke-width="1"/>
  <polygon points="500,310 494,301 503,304" fill="#4a90d9"/>
  <text x="428" y="350" fill="#e0645c" font-size="11" font-style="italic">&#8722;C&#10216;l&#183;s&#10217; pushes</text>
  <text x="428" y="365" fill="#e0645c" font-size="11" font-style="italic">j = l+&#189; down &#8594;</text>
  <text x="428" y="380" fill="#e0645c" font-size="11" font-style="italic">closes the gap at 28</text>
</svg>
