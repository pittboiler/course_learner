<svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="70" y="20" fill="#8a8a8a" font-style="italic">The chart of nuclides: every square is a (N, Z) nucleus.</text>
  <text x="70" y="38" fill="#8a8a8a" font-style="italic">Stable ones (blue band) hug N = Z when light, bend to N &gt; Z when heavy.</text>

  <!-- faint grid suggesting one square per nuclide -->
  <g stroke="#8a8a8a" stroke-width="0.75" opacity="0.22">
    <line x1="139.3" y1="350" x2="139.3" y2="45"/>
    <line x1="208.7" y1="350" x2="208.7" y2="45"/>
    <line x1="278.0" y1="350" x2="278.0" y2="45"/>
    <line x1="347.3" y1="350" x2="347.3" y2="45"/>
    <line x1="416.7" y1="350" x2="416.7" y2="45"/>
    <line x1="486.0" y1="350" x2="486.0" y2="45"/>
    <line x1="555.3" y1="350" x2="555.3" y2="45"/>
    <line x1="70" y1="288" x2="600" y2="288"/>
    <line x1="70" y1="226" x2="600" y2="226"/>
    <line x1="70" y1="164" x2="600" y2="164"/>
    <line x1="70" y1="102" x2="600" y2="102"/>
    <line x1="70" y1="40"  x2="600" y2="40"/>
  </g>

  <!-- valley of stability: soft blue band + centerline -->
  <path d="M 105 336 L 139.3 288 L 174 269 L 243 232 L 309.3 195 L 420 130 L 506.8 96 L 565.8 65"
        fill="none" stroke="#4a90d9" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.18"/>
  <path d="M 105 336 L 139.3 288 L 174 269 L 243 232 L 309.3 195 L 420 130 L 506.8 96 L 565.8 65"
        fill="none" stroke="#4a90d9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="430" y="160" fill="#4a90d9">valley of stability</text>

  <!-- N = Z reference line (dashed grey) -->
  <line x1="70" y1="350" x2="416.7" y2="40" stroke="#8a8a8a" stroke-width="1.25" stroke-dasharray="5 5"/>
  <text x="388" y="58" fill="#8a8a8a">N = Z</text>

  <!-- example nuclides (coral markers) -->
  <circle cx="90.8"  cy="331.4" r="5" fill="#e0645c"/>
  <text x="98" y="336" fill="#e0645c">¹²C</text>
  <circle cx="174.0" cy="269.4" r="5" fill="#e0645c"/>
  <text x="182" y="266" fill="#e0645c">⁵⁶Fe</text>
  <circle cx="565.8" cy="64.8"  r="5" fill="#e0645c"/>
  <text x="522" y="60" fill="#e0645c">²³⁵U</text>

  <!-- axes -->
  <line x1="70" y1="350" x2="600" y2="350" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="600,350 590,345 590,355" fill="#8a8a8a"/>
  <line x1="70" y1="350" x2="70" y2="38" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,38 65,48 75,48" fill="#8a8a8a"/>

  <!-- axis labels -->
  <text x="500" y="374" fill="#8a8a8a">N  (neutron number) &#8594;</text>
  <text x="18" y="52" fill="#8a8a8a">Z</text>
  <text x="12" y="200" fill="#8a8a8a" transform="rotate(-90 20 200)">Z  (proton number) &#8594;</text>

  <!-- ticks -->
  <text x="234" y="368" fill="#8a8a8a">50</text>
  <text x="405" y="368" fill="#8a8a8a">100</text>
  <text x="50" y="199" fill="#8a8a8a">50</text>
  <text x="44" y="44" fill="#8a8a8a">100</text>
</svg>
