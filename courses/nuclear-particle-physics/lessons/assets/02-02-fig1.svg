<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="20" fill="#8a8a8a" font-style="italic">α-decay potential: a deep nuclear well, then a Coulomb barrier ∝ 1/r.</text>
  <text x="40" y="38" fill="#8a8a8a" font-style="italic">The α (energy Q) can't clear the ~28 MeV top — it tunnels the shaded wall, R → b.</text>

  <!-- axes -->
  <line x1="75" y1="325" x2="75" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="75,52 70,62 80,62" fill="#8a8a8a"/>
  <text x="82" y="60" fill="#8a8a8a">V(r)</text>
  <line x1="75" y1="210" x2="622" y2="210" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="622,210 612,205 612,215" fill="#8a8a8a"/>
  <text x="612" y="204" fill="#8a8a8a">r</text>
  <text x="58" y="215" fill="#8a8a8a">0</text>

  <!-- shaded classically-forbidden region (between Coulomb curve and Q line, R..b) -->
  <path d="M 160 185 L 160 70 L 175 90 L 190 105 L 210 120 L 230 131 L 260 144 L 300 155 L 350 165 L 410 173 L 490 180 L 574 185 Z"
        fill="#e0645c" opacity="0.15"/>

  <!-- potential: left wall, nuclear well, right wall, Coulomb tail -->
  <path d="M 75 210 L 75 300 L 160 300 L 160 70 L 175 90 L 190 105 L 210 120 L 230 131 L 260 144 L 300 155 L 350 165 L 410 173 L 490 180 L 574 185 L 615 187"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="300" y="112" fill="#4a90d9">Coulomb barrier ∝ 1/r</text>
  <text x="98" y="285" fill="#4a90d9">nuclear well</text>
  <text x="112" y="66" fill="#8a8a8a">≈ 28 MeV</text>

  <!-- alpha energy level Q: solid inside well (allowed), dashed through barrier (tunneling) -->
  <line x1="90" y1="185" x2="160" y2="185" stroke="#e0645c" stroke-width="2"/>
  <line x1="160" y1="185" x2="570" y2="185" stroke="#e0645c" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="574,185 564,180 564,190" fill="#e0645c"/>
  <text x="50" y="190" fill="#e0645c">Q</text>
  <text x="352" y="178" fill="#e0645c">tunnels →</text>

  <!-- alpha before (trapped) and after (escaped) -->
  <circle cx="120" cy="185" r="6" fill="#e0645c"/>
  <circle cx="598" cy="185" r="6" fill="#e0645c"/>
  <text x="590" y="172" fill="#e0645c">α</text>

  <!-- R and b markers -->
  <line x1="160" y1="210" x2="160" y2="225" stroke="#8a8a8a" stroke-width="1"/>
  <text x="155" y="240" fill="#8a8a8a">R</text>
  <line x1="574" y1="185" x2="574" y2="225" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="569" y="240" fill="#8a8a8a">b</text>
  <text x="510" y="258" fill="#8a8a8a" font-style="italic">turning point</text>
</svg>
