<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="26" fill="#8a8a8a" font-style="italic">The mass shell E² = (pc)² + (mc²)²: every allowed (p, E) lives on this hyperbola; the mass is its "height" at p = 0.</text>

  <!-- E axis -->
  <line x1="70" y1="280" x2="70" y2="66" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,54 65,66 75,66" fill="#8a8a8a"/>
  <text x="52" y="66" fill="#8a8a8a">E</text>

  <!-- p axis -->
  <line x1="70" y1="280" x2="556" y2="280" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="568,280 556,275 556,285" fill="#8a8a8a"/>
  <text x="562" y="298" fill="#8a8a8a">p</text>
  <text x="56" y="296" fill="#8a8a8a">0</text>

  <!-- massless asymptote E = pc (grey dashed) -->
  <line x1="70" y1="280" x2="546" y2="69" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="446" y="108" fill="#8a8a8a">E = pc</text>

  <!-- mass-shell hyperbola (blue) -->
  <path d="M 70 218.0 L 126 213.2 L 182 200.6 L 238 183.2 L 294 163.0 L 350 141.4 L 406 118.8 L 462 95.7 L 518 72.1"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="112" y="92" fill="#4a90d9">E² = (pc)² + (mc²)²</text>

  <!-- rest energy at p = 0 (coral) -->
  <circle cx="70" cy="218" r="4.5" fill="#e0645c"/>
  <text x="18" y="222" fill="#e0645c">mc²</text>

  <!-- a particle's (p, E) point (coral) -->
  <line x1="350" y1="141.4" x2="350" y2="280" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="350" y1="141.4" x2="70" y2="141.4" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="350" cy="141.4" r="4.5" fill="#e0645c"/>
  <text x="358" y="137" fill="#e0645c">(p, E)</text>
  <text x="345" y="296" fill="#e0645c">p</text>
  <text x="48" y="146" fill="#e0645c">E</text>
</svg>
