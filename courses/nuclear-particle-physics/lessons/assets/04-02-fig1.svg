<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Tally the conserved quantities on each side, then follow the flow: hard laws decide allowed/forbidden; ΔS picks the force.</text>

  <!-- ===== left: tally panel ===== -->
  <rect x="30" y="42" width="250" height="222" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="45" y="70" fill="#4a90d9" font-size="17">Λ⁰  →  p + π⁻</text>

  <!-- column dividers and headers -->
  <line x1="150" y1="84" x2="150" y2="252" stroke="#8a8a8a" stroke-width="1" opacity="0.5"/>
  <line x1="210" y1="84" x2="210" y2="252" stroke="#8a8a8a" stroke-width="1" opacity="0.5"/>
  <line x1="40" y1="112" x2="270" y2="112" stroke="#8a8a8a" stroke-width="1" opacity="0.5"/>
  <text x="165" y="105" fill="#8a8a8a" font-style="italic">in</text>
  <text x="222" y="105" fill="#8a8a8a" font-style="italic">out</text>

  <!-- rows -->
  <text x="50" y="138" fill="#8a8a8a">Q</text>
  <text x="172" y="138" fill="#8a8a8a">0</text>
  <text x="228" y="138" fill="#8a8a8a">0</text>

  <text x="50" y="166" fill="#8a8a8a">B</text>
  <text x="168" y="166" fill="#8a8a8a">+1</text>
  <text x="224" y="166" fill="#8a8a8a">+1</text>

  <text x="50" y="194" fill="#8a8a8a">L</text>
  <text x="172" y="194" fill="#8a8a8a">0</text>
  <text x="228" y="194" fill="#8a8a8a">0</text>

  <text x="50" y="222" fill="#e0645c">S</text>
  <text x="168" y="222" fill="#e0645c">−1</text>
  <text x="228" y="222" fill="#e0645c">0</text>

  <text x="45" y="250" fill="#e0645c" font-size="13" font-style="italic">ΔS = +1  →  strangeness broken</text>

  <!-- ===== right: decision flow ===== -->

  <!-- node A: hard laws -->
  <rect x="330" y="48" width="190" height="48" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="425" y="78" fill="#8a8a8a" text-anchor="middle">Q, B, L conserved?</text>

  <!-- A -> Forbidden (no) -->
  <line x1="520" y1="72" x2="556" y2="72" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="556,72 547,68 547,76" fill="#e0645c"/>
  <text x="534" y="64" fill="#e0645c" font-size="13">no</text>
  <rect x="560" y="48" width="140" height="48" rx="6" fill="#e0645c" opacity="0.15"/>
  <rect x="560" y="48" width="140" height="48" rx="6" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="630" y="70" fill="#e0645c" text-anchor="middle">FORBIDDEN</text>
  <text x="630" y="87" fill="#8a8a8a" text-anchor="middle" font-size="12">hard law broken</text>

  <!-- A -> B (yes) -->
  <line x1="425" y1="96" x2="425" y2="158" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="425,158 421,149 429,149" fill="#4a90d9"/>
  <text x="433" y="128" fill="#4a90d9" font-size="13">yes</text>

  <!-- node B: strangeness -->
  <rect x="330" y="160" width="190" height="48" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="425" y="190" fill="#8a8a8a" text-anchor="middle">ΔS = 0 ?</text>

  <!-- B -> Strong (yes) -->
  <line x1="520" y1="184" x2="556" y2="184" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="556,184 547,180 547,188" fill="#4a90d9"/>
  <text x="534" y="176" fill="#4a90d9" font-size="13">yes</text>
  <rect x="560" y="160" width="140" height="48" rx="6" fill="#4a90d9" opacity="0.15"/>
  <rect x="560" y="160" width="140" height="48" rx="6" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="630" y="182" fill="#4a90d9" text-anchor="middle">STRONG / EM</text>
  <text x="630" y="199" fill="#8a8a8a" text-anchor="middle" font-size="12">fast, 10⁻²³–10⁻¹⁶ s</text>

  <!-- B -> Weak (no) -->
  <line x1="425" y1="208" x2="425" y2="270" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="425,270 421,261 429,261" fill="#e0645c"/>
  <text x="433" y="240" fill="#e0645c" font-size="13">no</text>

  <!-- node Weak (highlighted verdict) -->
  <rect x="330" y="272" width="190" height="54" rx="6" fill="#e0645c" opacity="0.15"/>
  <rect x="330" y="272" width="190" height="54" rx="6" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="425" y="296" fill="#e0645c" text-anchor="middle">WEAK · slow</text>
  <text x="425" y="315" fill="#8a8a8a" text-anchor="middle" font-size="12">ΔS ≠ 0, ~10⁻¹⁰ s and up</text>

  <text x="530" y="305" fill="#e0645c" font-size="13" font-style="italic">← our Λ⁰ decay</text>
</svg>
