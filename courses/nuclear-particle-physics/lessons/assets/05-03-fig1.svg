<svg viewBox="0 0 660 452" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">The Standard Model: matter (fermions, spin ½) in three generations —</text>
  <text x="30" y="40" fill="#8a8a8a" font-style="italic">quarks (blue) and leptons (coral) — plus force carriers (grey, spin 1) and the Higgs (spin 0).</text>

  <!-- generation headers -->
  <text x="98"  y="62" fill="#8a8a8a" text-anchor="middle" font-style="italic">I</text>
  <text x="200" y="62" fill="#8a8a8a" text-anchor="middle" font-style="italic">II</text>
  <text x="302" y="62" fill="#8a8a8a" text-anchor="middle" font-style="italic">III</text>
  <text x="428" y="62" fill="#8a8a8a" text-anchor="middle" font-style="italic">bosons</text>

  <!-- ===== row 1: up-type quarks ===== -->
  <rect x="50"  y="70" width="96" height="72" rx="4" fill="#4a90d9" opacity="0.15"/>
  <rect x="50"  y="70" width="96" height="72" rx="4" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="98"  y="106" fill="#4a90d9" text-anchor="middle" font-size="24">u</text>
  <text x="98"  y="130" fill="#8a8a8a" text-anchor="middle" font-size="10">2.2 MeV · +⅔</text>

  <rect x="152" y="70" width="96" height="72" rx="4" fill="#4a90d9" opacity="0.15"/>
  <rect x="152" y="70" width="96" height="72" rx="4" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="200" y="106" fill="#4a90d9" text-anchor="middle" font-size="24">c</text>
  <text x="200" y="130" fill="#8a8a8a" text-anchor="middle" font-size="10">1.27 GeV · +⅔</text>

  <rect x="254" y="70" width="96" height="72" rx="4" fill="#4a90d9" opacity="0.15"/>
  <rect x="254" y="70" width="96" height="72" rx="4" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="302" y="106" fill="#4a90d9" text-anchor="middle" font-size="24">t</text>
  <text x="302" y="130" fill="#8a8a8a" text-anchor="middle" font-size="10">173 GeV · +⅔</text>

  <!-- ===== row 2: down-type quarks ===== -->
  <rect x="50"  y="148" width="96" height="72" rx="4" fill="#4a90d9" opacity="0.15"/>
  <rect x="50"  y="148" width="96" height="72" rx="4" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="98"  y="184" fill="#4a90d9" text-anchor="middle" font-size="24">d</text>
  <text x="98"  y="208" fill="#8a8a8a" text-anchor="middle" font-size="10">4.7 MeV · −⅓</text>

  <rect x="152" y="148" width="96" height="72" rx="4" fill="#4a90d9" opacity="0.15"/>
  <rect x="152" y="148" width="96" height="72" rx="4" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="200" y="184" fill="#4a90d9" text-anchor="middle" font-size="24">s</text>
  <text x="200" y="208" fill="#8a8a8a" text-anchor="middle" font-size="10">95 MeV · −⅓</text>

  <rect x="254" y="148" width="96" height="72" rx="4" fill="#4a90d9" opacity="0.15"/>
  <rect x="254" y="148" width="96" height="72" rx="4" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="302" y="184" fill="#4a90d9" text-anchor="middle" font-size="24">b</text>
  <text x="302" y="208" fill="#8a8a8a" text-anchor="middle" font-size="10">4.18 GeV · −⅓</text>

  <!-- quark bracket label -->
  <text x="24" y="149" fill="#4a90d9" text-anchor="middle" transform="rotate(-90 24 149)">quarks</text>

  <!-- ===== row 3: charged leptons ===== -->
  <rect x="50"  y="238" width="96" height="72" rx="4" fill="#e0645c" opacity="0.15"/>
  <rect x="50"  y="238" width="96" height="72" rx="4" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="98"  y="274" fill="#e0645c" text-anchor="middle" font-size="24">e</text>
  <text x="98"  y="298" fill="#8a8a8a" text-anchor="middle" font-size="10">0.511 MeV · −1</text>

  <rect x="152" y="238" width="96" height="72" rx="4" fill="#e0645c" opacity="0.15"/>
  <rect x="152" y="238" width="96" height="72" rx="4" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="200" y="274" fill="#e0645c" text-anchor="middle" font-size="24">μ</text>
  <text x="200" y="298" fill="#8a8a8a" text-anchor="middle" font-size="10">106 MeV · −1</text>

  <rect x="254" y="238" width="96" height="72" rx="4" fill="#e0645c" opacity="0.15"/>
  <rect x="254" y="238" width="96" height="72" rx="4" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="302" y="274" fill="#e0645c" text-anchor="middle" font-size="24">τ</text>
  <text x="302" y="298" fill="#8a8a8a" text-anchor="middle" font-size="10">1.78 GeV · −1</text>

  <!-- ===== row 4: neutrinos ===== -->
  <rect x="50"  y="316" width="96" height="72" rx="4" fill="#e0645c" opacity="0.15"/>
  <rect x="50"  y="316" width="96" height="72" rx="4" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="98"  y="352" fill="#e0645c" text-anchor="middle" font-size="22">ν<tspan font-size="13" dy="5">e</tspan></text>
  <text x="98"  y="376" fill="#8a8a8a" text-anchor="middle" font-size="10">&lt; eV · 0</text>

  <rect x="152" y="316" width="96" height="72" rx="4" fill="#e0645c" opacity="0.15"/>
  <rect x="152" y="316" width="96" height="72" rx="4" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="200" y="352" fill="#e0645c" text-anchor="middle" font-size="22">ν<tspan font-size="13" dy="5">μ</tspan></text>
  <text x="200" y="376" fill="#8a8a8a" text-anchor="middle" font-size="10">&lt; eV · 0</text>

  <rect x="254" y="316" width="96" height="72" rx="4" fill="#e0645c" opacity="0.15"/>
  <rect x="254" y="316" width="96" height="72" rx="4" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="302" y="352" fill="#e0645c" text-anchor="middle" font-size="22">ν<tspan font-size="13" dy="5">τ</tspan></text>
  <text x="302" y="376" fill="#8a8a8a" text-anchor="middle" font-size="10">&lt; eV · 0</text>

  <!-- lepton bracket label -->
  <text x="24" y="327" fill="#e0645c" text-anchor="middle" transform="rotate(-90 24 327)">leptons</text>

  <!-- ===== gauge boson column ===== -->
  <rect x="380" y="70" width="96" height="72" rx="4" fill="#8a8a8a" opacity="0.15"/>
  <rect x="380" y="70" width="96" height="72" rx="4" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="428" y="104" fill="#8a8a8a" text-anchor="middle" font-size="24">g</text>
  <text x="428" y="128" fill="#8a8a8a" text-anchor="middle" font-size="10">strong · ×8</text>

  <rect x="380" y="148" width="96" height="72" rx="4" fill="#8a8a8a" opacity="0.15"/>
  <rect x="380" y="148" width="96" height="72" rx="4" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="428" y="182" fill="#8a8a8a" text-anchor="middle" font-size="24">γ</text>
  <text x="428" y="206" fill="#8a8a8a" text-anchor="middle" font-size="10">EM · 0</text>

  <rect x="380" y="238" width="96" height="72" rx="4" fill="#8a8a8a" opacity="0.15"/>
  <rect x="380" y="238" width="96" height="72" rx="4" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="428" y="272" fill="#8a8a8a" text-anchor="middle" font-size="22">W±</text>
  <text x="428" y="296" fill="#8a8a8a" text-anchor="middle" font-size="10">weak · 80 GeV</text>

  <rect x="380" y="316" width="96" height="72" rx="4" fill="#8a8a8a" opacity="0.15"/>
  <rect x="380" y="316" width="96" height="72" rx="4" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="428" y="350" fill="#8a8a8a" text-anchor="middle" font-size="22">Z⁰</text>
  <text x="428" y="374" fill="#8a8a8a" text-anchor="middle" font-size="10">weak · 91 GeV</text>

  <!-- ===== Higgs ===== -->
  <rect x="500" y="192" width="96" height="74" rx="4" fill="#8a8a8a" opacity="0.15"/>
  <rect x="500" y="192" width="96" height="74" rx="4" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="548" y="228" fill="#8a8a8a" text-anchor="middle" font-size="24">H</text>
  <text x="548" y="252" fill="#8a8a8a" text-anchor="middle" font-size="10">mass · 125 GeV</text>

  <!-- gauge-structure label -->
  <text x="330" y="426" fill="#8a8a8a" text-anchor="middle" font-style="italic">gauge structure:  SU(3)_C × SU(2)_L × U(1)_Y</text>
  <text x="330" y="444" fill="#8a8a8a" text-anchor="middle" font-style="italic">(strong color × weak isospin × hypercharge)</text>
</svg>
