<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">The zoo, sorted: split matter by the strong force, then by spin. Force-carriers live in their own box.</text>

  <!-- ===== top node ===== -->
  <rect x="285" y="38" width="150" height="34" rx="6" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="360" y="60" fill="#4a90d9" text-anchor="middle" font-weight="bold">MATTER (fermions)</text>

  <!-- elbow connectors to the two families -->
  <path d="M 360 72 L 360 96 L 185 96 L 185 118" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M 360 96 L 535 96 L 535 118" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- ===== LEPTONS family header ===== -->
  <rect x="60" y="118" width="250" height="42" rx="6" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="185" y="137" fill="#4a90d9" text-anchor="middle" font-weight="bold">LEPTONS</text>
  <text x="185" y="153" fill="#8a8a8a" text-anchor="middle" font-size="12">no strong force &#183; point-like &#183; spin &#189;</text>

  <!-- ===== HADRONS family header ===== -->
  <rect x="410" y="118" width="250" height="42" rx="6" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="535" y="137" fill="#4a90d9" text-anchor="middle" font-weight="bold">HADRONS</text>
  <text x="535" y="153" fill="#8a8a8a" text-anchor="middle" font-size="12">feel strong force &#183; made of quarks</text>

  <!-- leptons grid box -->
  <line x1="185" y1="160" x2="185" y2="188" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="60" y="188" width="250" height="110" rx="6" fill="none" stroke="#4a90d9" stroke-width="1.5"/>

  <!-- generation column headers -->
  <text x="130" y="208" fill="#8a8a8a" text-anchor="middle" font-size="12" font-style="italic">gen I</text>
  <text x="200" y="208" fill="#8a8a8a" text-anchor="middle" font-size="12" font-style="italic">gen II</text>
  <text x="270" y="208" fill="#8a8a8a" text-anchor="middle" font-size="12" font-style="italic">gen III</text>

  <!-- charged leptons row -->
  <text x="130" y="240" fill="#4a90d9" text-anchor="middle">e&#8315;</text>
  <text x="200" y="240" fill="#4a90d9" text-anchor="middle">&#956;&#8315;</text>
  <text x="270" y="240" fill="#4a90d9" text-anchor="middle">&#964;&#8315;</text>

  <!-- neutrino row -->
  <text x="130" y="270" fill="#4a90d9" text-anchor="middle">&#957;<tspan baseline-shift="sub" font-size="10">e</tspan></text>
  <text x="200" y="270" fill="#4a90d9" text-anchor="middle">&#957;<tspan baseline-shift="sub" font-size="10">&#956;</tspan></text>
  <text x="270" y="270" fill="#4a90d9" text-anchor="middle">&#957;<tspan baseline-shift="sub" font-size="10">&#964;</tspan></text>

  <text x="185" y="290" fill="#8a8a8a" text-anchor="middle" font-size="11" font-style="italic">mass increases &#8594;</text>

  <!-- hadrons split -->
  <path d="M 535 160 L 535 176 L 470 176 L 470 188" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M 535 176 L 600 176 L 600 188" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- mesons box -->
  <rect x="410" y="188" width="120" height="110" rx="6" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="470" y="210" fill="#4a90d9" text-anchor="middle" font-weight="bold">MESONS</text>
  <text x="470" y="232" fill="#8a8a8a" text-anchor="middle" font-size="12">q q&#772;</text>
  <text x="470" y="250" fill="#8a8a8a" text-anchor="middle" font-size="12">integer spin</text>
  <text x="470" y="266" fill="#8a8a8a" text-anchor="middle" font-size="12">(bosons)</text>
  <text x="470" y="288" fill="#4a90d9" text-anchor="middle" font-size="13">&#960;, K, &#8230;</text>

  <!-- baryons box -->
  <rect x="540" y="188" width="120" height="110" rx="6" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="600" y="210" fill="#4a90d9" text-anchor="middle" font-weight="bold">BARYONS</text>
  <text x="600" y="232" fill="#8a8a8a" text-anchor="middle" font-size="12">q q q</text>
  <text x="600" y="250" fill="#8a8a8a" text-anchor="middle" font-size="12">half-integer spin</text>
  <text x="600" y="266" fill="#8a8a8a" text-anchor="middle" font-size="12">(fermions)</text>
  <text x="600" y="288" fill="#4a90d9" text-anchor="middle" font-size="13">p, n, &#923;, &#8230;</text>

  <!-- ===== force carriers box (separate) ===== -->
  <rect x="110" y="350" width="500" height="96" rx="6" fill="#e0645c" opacity="0.15" stroke="#e0645c" stroke-width="2"/>
  <rect x="110" y="350" width="500" height="96" rx="6" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="360" y="372" fill="#e0645c" text-anchor="middle" font-weight="bold">FORCE CARRIERS (gauge bosons, spin 1)</text>

  <text x="200" y="404" fill="#e0645c" text-anchor="middle">&#947;</text>
  <text x="200" y="424" fill="#8a8a8a" text-anchor="middle" font-size="12">photon</text>
  <text x="200" y="438" fill="#8a8a8a" text-anchor="middle" font-size="11" font-style="italic">electromagnetic</text>

  <text x="360" y="404" fill="#e0645c" text-anchor="middle">g</text>
  <text x="360" y="424" fill="#8a8a8a" text-anchor="middle" font-size="12">gluon</text>
  <text x="360" y="438" fill="#8a8a8a" text-anchor="middle" font-size="11" font-style="italic">strong</text>

  <text x="520" y="404" fill="#e0645c" text-anchor="middle">W&#8314;, W&#8315;, Z&#8304;</text>
  <text x="520" y="424" fill="#8a8a8a" text-anchor="middle" font-size="12">weak bosons</text>
  <text x="520" y="438" fill="#8a8a8a" text-anchor="middle" font-size="11" font-style="italic">weak</text>
</svg>
