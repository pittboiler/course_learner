<svg viewBox="0 0 660 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">The Standard Model is a spectacular, tested core — that accounts for only ~5% of the universe. Everything around it is open.</text>

  <!-- ===== cosmic energy budget bar ===== -->
  <text x="60" y="52" fill="#8a8a8a">Energy budget of the universe:</text>

  <!-- ordinary matter 5% : x 60..87 -->
  <rect x="60" y="62" width="27" height="40" fill="#4a90d9" stroke="#4a90d9" stroke-width="1.5"/>
  <!-- dark matter 27% : x 87..232.8 -->
  <rect x="87" y="62" width="145.8" height="40" fill="#e0645c" fill-opacity="0.15" stroke="#e0645c" stroke-width="1.5"/>
  <!-- dark energy 68% : x 232.8..600 -->
  <rect x="232.8" y="62" width="367.2" height="40" fill="#8a8a8a" fill-opacity="0.15" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- ordinary-matter leader (segment too thin to label inside) -->
  <line x1="73" y1="62" x2="73" y2="40" stroke="#4a90d9" stroke-width="1"/>
  <text x="60" y="34" fill="#4a90d9">~5% ordinary matter (all the SM)</text>

  <text x="160" y="86" fill="#e0645c" text-anchor="middle">~27%</text>
  <text x="160" y="120" fill="#e0645c" text-anchor="middle">dark matter</text>
  <text x="416" y="86" fill="#8a8a8a" text-anchor="middle">~68%</text>
  <text x="416" y="120" fill="#8a8a8a" text-anchor="middle">dark energy</text>

  <!-- ===== solved core vs open problems ===== -->
  <text x="60" y="162" fill="#8a8a8a">A solved core, ringed by open problems (leading ideas in grey):</text>

  <!-- SM core box -->
  <rect x="40" y="180" width="170" height="120" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="125" y="212" fill="#4a90d9" text-anchor="middle" font-size="15">STANDARD MODEL</text>
  <text x="125" y="236" fill="#4a90d9" text-anchor="middle" font-size="12">quarks, leptons,</text>
  <text x="125" y="254" fill="#4a90d9" text-anchor="middle" font-size="12">3 forces + Higgs</text>
  <text x="125" y="278" fill="#8a8a8a" text-anchor="middle" font-size="12" font-style="italic">tested to ~12 digits</text>

  <!-- bridge arrow -->
  <line x1="210" y1="240" x2="244" y2="240" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="244,240 234,235 234,245" fill="#8a8a8a"/>

  <!-- open-problem boxes: two columns -->
  <!-- col A x 250..440 (w 190) ; col B x 452..642 -->

  <!-- neutrino mass -->
  <rect x="250" y="180" width="190" height="52" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="260" y="200" fill="#e0645c" font-size="13">Neutrino mass</text>
  <text x="260" y="220" fill="#8a8a8a" font-size="11" font-style="italic">seesaw / Majorana &#183; 0&#957;&#946;&#946;</text>

  <!-- dark matter -->
  <rect x="452" y="180" width="190" height="52" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="462" y="200" fill="#e0645c" font-size="13">Dark matter</text>
  <text x="462" y="220" fill="#8a8a8a" font-size="11" font-style="italic">WIMPs, axions, sterile &#957;</text>

  <!-- matter-antimatter -->
  <rect x="250" y="244" width="190" height="52" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="260" y="264" fill="#e0645c" font-size="13">Matter&#8211;antimatter gap</text>
  <text x="260" y="284" fill="#8a8a8a" font-size="11" font-style="italic">extra CP violation (Sakharov)</text>

  <!-- quantum gravity -->
  <rect x="452" y="244" width="190" height="52" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="462" y="264" fill="#e0645c" font-size="13">Quantum gravity</text>
  <text x="462" y="284" fill="#8a8a8a" font-size="11" font-style="italic">strings / extra dimensions</text>

  <!-- dark energy -->
  <rect x="250" y="308" width="190" height="52" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <text x="260" y="328" fill="#e0645c" font-size="13">Dark energy</text>
  <text x="260" y="348" fill="#8a8a8a" font-size="11" font-style="italic">cause of accelerating expansion</text>

  <!-- unifying ideas -->
  <rect x="452" y="308" width="190" height="52" fill="#8a8a8a" fill-opacity="0.15" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="462" y="328" fill="#8a8a8a" font-size="13">Unifying attempts</text>
  <text x="462" y="348" fill="#8a8a8a" font-size="11" font-style="italic">GUTs &#183; supersymmetry</text>

  <!-- footer -->
  <text x="330" y="392" fill="#8a8a8a" text-anchor="middle" font-style="italic" font-size="12">Frontiers probed at the LHC, in deep-underground detectors, and across the sky.</text>
</svg>
