<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="310" y="24" fill="#8a8a8a" font-style="italic" text-anchor="middle">Hadrons are colorless: a meson pairs color + anticolor; a baryon sums all three colors to white.</text>

  <!-- divider -->
  <line x1="310" y1="52" x2="310" y2="292" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- ===== LEFT: meson = q qbar ===== -->
  <text x="155" y="72" fill="#8a8a8a" text-anchor="middle">Meson = q q&#772;</text>

  <!-- quark -->
  <circle cx="110" cy="160" r="34" fill="#4a90d9" opacity="0.15"/>
  <circle cx="110" cy="160" r="34" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="110" y="166" fill="#4a90d9" text-anchor="middle" font-size="20">u</text>
  <text x="110" y="216" fill="#4a90d9" text-anchor="middle">blue</text>

  <!-- antiquark -->
  <circle cx="205" cy="160" r="34" fill="#e0645c" opacity="0.15"/>
  <circle cx="205" cy="160" r="34" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="205" y="166" fill="#e0645c" text-anchor="middle" font-size="20">d&#772;</text>
  <text x="205" y="216" fill="#e0645c" text-anchor="middle">anti-blue</text>

  <text x="155" y="256" fill="#8a8a8a" text-anchor="middle">&#960;&#8314; = u d&#772;</text>
  <text x="155" y="278" fill="#8a8a8a" text-anchor="middle" font-style="italic">color + anticolor &#8594; colorless</text>

  <!-- ===== RIGHT: baryon = qqq ===== -->
  <text x="465" y="72" fill="#8a8a8a" text-anchor="middle">Baryon = q q q</text>

  <!-- top quark (blue) -->
  <circle cx="465" cy="125" r="30" fill="#4a90d9" opacity="0.15"/>
  <circle cx="465" cy="125" r="30" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="465" y="131" fill="#4a90d9" text-anchor="middle" font-size="18">u</text>
  <text x="465" y="102" fill="#4a90d9" text-anchor="middle" font-size="12">blue</text>

  <!-- bottom-left quark (coral) -->
  <circle cx="425" cy="192" r="30" fill="#e0645c" opacity="0.15"/>
  <circle cx="425" cy="192" r="30" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="425" y="198" fill="#e0645c" text-anchor="middle" font-size="18">u</text>
  <text x="399" y="228" fill="#e0645c" text-anchor="middle" font-size="12">coral</text>

  <!-- bottom-right quark (grey) -->
  <circle cx="505" cy="192" r="30" fill="#8a8a8a" opacity="0.15"/>
  <circle cx="505" cy="192" r="30" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="505" y="198" fill="#8a8a8a" text-anchor="middle" font-size="18">d</text>
  <text x="531" y="228" fill="#8a8a8a" text-anchor="middle" font-size="12">grey</text>

  <text x="465" y="256" fill="#8a8a8a" text-anchor="middle">p = u u d</text>
  <text x="465" y="278" fill="#8a8a8a" text-anchor="middle" font-style="italic">blue + coral + grey &#8594; white</text>
</svg>
