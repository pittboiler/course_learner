<svg viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- unit circle -->
  <circle cx="190" cy="190" r="140" fill="none" stroke="#333333" stroke-width="1.5"/>

  <!-- axes -->
  <line x1="30" y1="190" x2="350" y2="190" stroke="#333333" stroke-width="1.2"/>
  <line x1="190" y1="30" x2="190" y2="350" stroke="#333333" stroke-width="1.2"/>
  <polygon points="350,190 342,186 342,194" fill="#333333"/>
  <polygon points="190,30 186,38 194,38" fill="#333333"/>
  <text x="343" y="207" fill="#333333" font-size="13" font-style="italic">x</text>
  <text x="198" y="43" fill="#333333" font-size="13" font-style="italic">y</text>

  <!-- special-angle tick points -->
  <circle cx="330" cy="190" r="3" fill="#333333"/>
  <text x="320" y="209" fill="#333333" font-size="11">(1, 0)</text>
  <circle cx="190" cy="50" r="3" fill="#333333"/>
  <text x="198" y="55" fill="#333333" font-size="11">(0, 1)</text>
  <text x="222" y="72" fill="#333333" font-size="11">90&#176;</text>

  <!-- reference right triangle: legs = cos, sin -->
  <line x1="260" y1="68.8" x2="260" y2="190" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="190" y1="190" x2="260" y2="190" stroke="#1f6fb2" stroke-width="2"/>
  <!-- little right-angle square at the foot -->
  <path d="M 250 190 L 250 180 L 260 180" fill="none" stroke="#333333" stroke-width="1"/>

  <!-- radius to terminal point -->
  <line x1="190" y1="190" x2="260" y2="68.8" stroke="#1f6fb2" stroke-width="2.4"/>
  <circle cx="260" cy="68.8" r="4.5" fill="#1f6fb2"/>
  <text x="268" y="62" fill="#1f6fb2" font-size="12">(cos&#952;, sin&#952;)</text>

  <!-- leg labels -->
  <text x="205" y="207" fill="#1f6fb2" font-size="12">cos&#952;</text>
  <text x="266" y="135" fill="#1f6fb2" font-size="12">sin&#952;</text>
  <text x="245" y="180" fill="#333333" font-size="11">1</text>

  <!-- angle theta arc -->
  <path d="M 225 190 A 35 35 0 0 0 207.5 159.7" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="214" y="177" fill="#333333" font-size="13">&#952;</text>
</svg>
