<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- x-axis (the y = 0 line) -->
  <line x1="30" y1="275" x2="470" y2="275" stroke="#333333" stroke-width="1.5"/>
  <polygon points="470,275 460,270 460,280" fill="#333333"/>
  <text x="462" y="293" fill="#333333">x</text>
  <!-- y-axis -->
  <line x1="40" y1="60" x2="40" y2="278" stroke="#333333" stroke-width="1.5"/>
  <polygon points="40,60 35,70 45,70" fill="#333333"/>

  <!-- midline (dashed), y = D -->
  <line x1="40" y1="150" x2="466" y2="150" stroke="#555555" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="378" y="145" fill="#555555" font-style="italic">midline  y = D</text>

  <!-- the sinusoid -->
  <polyline fill="none" stroke="#1f6feb" stroke-width="3"
    points="40,202 60,210 80,202 100,180 120,150 140,120 160,98 180,90 200,98 220,120 240,150 260,180 280,202 300,210 320,202 340,180 360,150 380,120 400,98 420,90 440,98 460,120"/>

  <!-- amplitude: midline up to peak -->
  <line x1="180" y1="150" x2="180" y2="90" stroke="#333333" stroke-width="1.4"/>
  <polygon points="180,88 176,97 184,97" fill="#333333"/>
  <polygon points="180,152 176,143 184,143" fill="#333333"/>
  <text x="188" y="124" fill="#333333">A</text>
  <circle cx="180" cy="90" r="4" fill="#1f6feb"/>

  <!-- period: one full cycle span -->
  <line x1="120" y1="248" x2="360" y2="248" stroke="#333333" stroke-width="1.4"/>
  <polygon points="118,248 127,244 127,252" fill="#333333"/>
  <polygon points="362,248 353,244 353,252" fill="#333333"/>
  <text x="178" y="264" fill="#333333">period = 2&#960;/B</text>

  <!-- phase shift: from y-axis to first upward midline crossing -->
  <line x1="40" y1="132" x2="120" y2="132" stroke="#333333" stroke-width="1.4"/>
  <polygon points="38,132 47,128 47,136" fill="#333333"/>
  <polygon points="122,132 113,128 113,136" fill="#333333"/>
  <text x="46" y="124" fill="#333333">phase shift C</text>
  <circle cx="120" cy="150" r="4" fill="#1f6feb"/>

  <!-- caption -->
  <text x="52" y="52" fill="#333333" font-style="italic">y = A sin(B(x &#8722; C)) + D</text>
</svg>
