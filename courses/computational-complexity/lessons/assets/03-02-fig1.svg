  <text x="570.00" y="290.00" font-size="10" fill="#8a8a8a" text-anchor="middle">count multiplied, by a factor that varies</text>
  <text x="20.00" y="344.00" font-size="10.5" fill="#8a8a8a">Both maps are valid Karp reductions: a yes-instance has at least one solution on each side, and a no-instance has</text>
  <text x="20.00" y="360.00" font-size="10.5" fill="#8a8a8a">none on either. For deciding, that is all you need. For counting it is not — the right-hand map turns a question about</text>
  <text x="20.00" y="376.00" font-size="10.5" fill="#8a8a8a">4 into a question about 7, and the factor depends on the instance, so it cannot be divided out afterwards.</text>
  <text x="20.00" y="400.00" font-size="10.5" fill="#8a8a8a" font-style="italic">Measured case: 3SAT to INDEPENDENT SET on a 2-clause formula gives 7 independent sets of size m against 6 models.</text>
