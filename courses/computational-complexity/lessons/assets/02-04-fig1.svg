  <text x="112.00" y="330.00" font-size="10.5" fill="#8a8a8a" text-anchor="end">phi value</text>
  <text x="20.00" y="366.00" font-size="10.5" fill="#8a8a8a">A coral node takes the AND of its children (the opponent picks the worse branch); a blue node takes the OR</text>
  <text x="20.00" y="382.00" font-size="10.5" fill="#8a8a8a">(you pick the better one). Here the root is F, so the formula is false — the opponent has a winning first move.</text>
  <text x="20.00" y="404.00" font-size="10.5" fill="#8a8a8a" font-style="italic">Evaluating needs only one root-to-leaf path in memory at a time, which is why TQBF is in PSPACE and not just EXP.</text>
