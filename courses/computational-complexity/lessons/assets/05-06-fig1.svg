<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="400.00" y="18.00" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="bold">Three barriers, three families of proof ruled out</text>
  <rect x="20.00" y="56.00" width="240.00" height="36.00" rx="3" fill="none" stroke="#e0645c" stroke-width="1.4"/>
  <text x="140.00" y="78.20" font-size="12" fill="#e0645c" text-anchor="middle">Relativization</text>
  <text x="140.00" y="110.00" font-size="10" fill="#8a8a8a" text-anchor="middle">1975 — Baker, Gill &amp; Solovay</text>
  <text x="140.00" y="140.00" font-size="10" fill="#8a8a8a" text-anchor="middle">there are oracles A and B with</text>
  <text x="140.00" y="159.00" font-size="10" fill="#8a8a8a" text-anchor="middle">P^A = NP^A and P^B != NP^B</text>
  <text x="140.00" y="178.00" font-size="10" fill="#e0645c" text-anchor="middle">kills: any proof that still works</text>
  <text x="140.00" y="197.00" font-size="10" fill="#e0645c" text-anchor="middle">when both machines get an oracle</text>
  <text x="140.00" y="216.00" font-size="10" fill="#e0645c" text-anchor="middle">(diagonalization, simulation)</text>
  <rect x="280.00" y="56.00" width="240.00" height="36.00" rx="3" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="400.00" y="78.20" font-size="12" fill="#4a90d9" text-anchor="middle">Natural proofs</text>
  <text x="400.00" y="110.00" font-size="10" fill="#8a8a8a" text-anchor="middle">1994 — Razborov &amp; Rudich</text>
  <text x="400.00" y="140.00" font-size="10" fill="#8a8a8a" text-anchor="middle">a 'natural' circuit lower bound</text>
  <text x="400.00" y="159.00" font-size="10" fill="#8a8a8a" text-anchor="middle">would break every pseudorandom</text>
  <text x="400.00" y="178.00" font-size="10" fill="#4a90d9" text-anchor="middle">generator — so it would refute the</text>
  <text x="400.00" y="197.00" font-size="10" fill="#4a90d9" text-anchor="middle">hardness assumptions the field</text>
  <text x="400.00" y="216.00" font-size="10" fill="#4a90d9" text-anchor="middle">also believes</text>
  <rect x="540.00" y="56.00" width="240.00" height="36.00" rx="3" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="660.00" y="78.20" font-size="12" fill="#8a8a8a" text-anchor="middle">Algebrization</text>
  <text x="660.00" y="110.00" font-size="10" fill="#8a8a8a" text-anchor="middle">2008 — Aaronson &amp; Wigderson</text>
  <text x="660.00" y="140.00" font-size="10" fill="#8a8a8a" text-anchor="middle">extend the oracle to a low-degree</text>
  <text x="660.00" y="159.00" font-size="10" fill="#8a8a8a" text-anchor="middle">polynomial and the separations</text>
  <text x="660.00" y="178.00" font-size="10" fill="#8a8a8a" text-anchor="middle">return — kills arithmetization,</text>
  <text x="660.00" y="197.00" font-size="10" fill="#8a8a8a" text-anchor="middle">the one technique that had</text>
  <text x="660.00" y="216.00" font-size="10" fill="#8a8a8a" text-anchor="middle">escaped relativization</text>
  <line x1="40.00" y1="272.00" x2="760.00" y2="272.00" stroke="#8a8a8a" stroke-width="0.8" stroke-linecap="round"/>
  <text x="400.00" y="296.00" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold">what survives</text>
  <text x="30.00" y="320.00" font-size="10.5" fill="#8a8a8a">arithmetization got past relativization (IP = PSPACE, 1990) by looking inside the formula rather than at a black box;</text>
  <text x="30.00" y="339.00" font-size="10.5" fill="#8a8a8a">monotone and bounded-depth lower bounds got past natural proofs by not being natural — they work on restricted</text>
  <text x="30.00" y="358.00" font-size="10.5" fill="#8a8a8a">circuit classes where the pseudorandom generators the barrier relies on do not exist.</text>
  <text x="30.00" y="377.00" font-size="10.5" fill="#8a8a8a"></text>
  <text x="30.00" y="396.00" font-size="10.5" fill="#8a8a8a" font-style="italic">Every known technique is ruled out by at least one barrier. That is the honest state of the P versus NP problem:</text>
  <text x="30.00" y="415.00" font-size="10.5" fill="#8a8a8a" font-style="italic">not that nobody has been clever enough, but that three separate theorems say the clever things do not work.</text>
</svg>
