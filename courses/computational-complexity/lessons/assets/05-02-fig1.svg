<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="390.00" y="18.00" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="bold">Karp-Lipton: small circuits for NP would flatten the hierarchy</text>
  <rect x="50.00" y="68.00" width="300.00" height="44.00" rx="3" fill="none" stroke="#e0645c" stroke-width="1.4"/>
  <text x="200.00" y="94.20" font-size="12" fill="#e0645c" text-anchor="middle">NP is contained in P/poly</text>
  <line x1="200.00" y1="114.00" x2="200.00" y2="162.00" stroke="#8a8a8a" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="200.00,168.00 197.55,162.52 202.45,162.52" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="214.00" y="146.00" font-size="10.5" fill="#8a8a8a">Karp-Lipton</text>
  <rect x="50.00" y="168.00" width="300.00" height="44.00" rx="3" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="200.00" y="194.20" font-size="12" fill="#4a90d9" text-anchor="middle">PH collapses to Sigma_2</text>
  <line x1="200.00" y1="214.00" x2="200.00" y2="262.00" stroke="#8a8a8a" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="200.00,268.00 197.55,262.52 202.45,262.52" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="214.00" y="246.00" font-size="10.5" fill="#8a8a8a">contrapositive</text>
  <rect x="50.00" y="268.00" width="300.00" height="44.00" rx="3" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="200.00" y="293.85" font-size="11" fill="#8a8a8a" text-anchor="middle">PH is infinite  =&gt;  NP has no small circuits</text>
  <text x="575.00" y="72.00" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold">the lower-bound programme</text>
  <text x="575.00" y="100.00" font-size="10.5" fill="#8a8a8a" text-anchor="middle">prove SAT needs</text>
  <text x="575.00" y="122.00" font-size="10.5" fill="#8a8a8a" text-anchor="middle">superpolynomial circuits</text>
  <text x="575.00" y="144.00" font-size="10.5" fill="#8a8a8a" text-anchor="middle"></text>
  <text x="575.00" y="166.00" font-size="10.5" fill="#4a90d9" text-anchor="middle">then NP is not in P/poly</text>
  <text x="575.00" y="188.00" font-size="10.5" fill="#4a90d9" text-anchor="middle">and since P is in P/poly,</text>
  <text x="575.00" y="210.00" font-size="10.5" fill="#4a90d9" text-anchor="middle">P is not NP</text>
  <line x1="410.00" y1="86.00" x2="410.00" y2="320.00" stroke="#8a8a8a" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="4 4"/>
  <text x="575.00" y="262.00" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold">what is actually proved:</text>
  <text x="575.00" y="282.00" font-size="10" fill="#8a8a8a" text-anchor="middle">parity needs exponential AC^0 circuits;</text>
  <text x="575.00" y="298.00" font-size="10" fill="#8a8a8a" text-anchor="middle">clique needs exponential MONOTONE circuits;</text>
  <text x="575.00" y="314.00" font-size="10" fill="#e0645c" text-anchor="middle">general circuits: no bound above 5n is known</text>
</svg>
