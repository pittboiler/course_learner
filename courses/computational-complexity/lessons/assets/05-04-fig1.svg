  <text x="86.00" y="68.00" font-size="10.5" fill="#8a8a8a" text-anchor="end" font-weight="bold">E = 7m/8</text>
  <text x="86.00" y="152.00" font-size="10" fill="#8a8a8a" text-anchor="end">pick the larger</text>
  <text x="86.00" y="236.00" font-size="10" fill="#8a8a8a" text-anchor="end">and again</text>
  <text x="86.00" y="320.00" font-size="10" fill="#8a8a8a" text-anchor="end">a full assignment</text>
  <text x="20.00" y="336.00" font-size="10.5" fill="#8a8a8a">At each variable, compute the conditional expectation of the number of satisfied clauses under each of the two</text>
  <text x="20.00" y="352.00" font-size="10.5" fill="#8a8a8a">settings — a polynomial-time sum over clauses — and commit to the larger. The average of the two children equals</text>
  <text x="20.00" y="368.00" font-size="10.5" fill="#8a8a8a">the parent, so the larger child is at least the parent: the expectation never falls below its starting value 7m/8.</text>
  <text x="20.00" y="390.00" font-size="10.5" fill="#8a8a8a" font-style="italic">After n steps the 'expectation' is an actual assignment satisfying at least 7m/8 clauses. No randomness is used.</text>
</svg>
