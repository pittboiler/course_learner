  <text x="20.00" y="358.00" font-size="10.5" fill="#8a8a8a">ETH says the blue curve can never become flat: 3-SAT has no 2^(o(n)) algorithm, so no base of 1 is reachable.</text>
  <text x="20.00" y="374.00" font-size="10.5" fill="#8a8a8a">SETH says more — that as the clause width k grows, the best base for k-SAT tends to 2, so the coral curve cannot</text>
  <text x="20.00" y="390.00" font-size="10.5" fill="#8a8a8a" font-style="italic">be beaten by any constant factor in the exponent. Both are strictly stronger than P is not NP.</text>
