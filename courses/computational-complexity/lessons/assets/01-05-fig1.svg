  <text x="20.00" y="426.00" font-size="10.5" fill="#8a8a8a">Formula (x1 v x2 v ~x3) &amp; (~x1 v ~x2 v x3).  A variable column has exactly two 1s, so the target 1</text>
  <text x="20.00" y="442.00" font-size="10.5" fill="#8a8a8a">forces a choice of y or z.  A clause column has at most five 1s, so no column can reach 10 and no digit</text>
  <text x="20.00" y="458.00" font-size="10.5" fill="#8a8a8a" font-style="italic">can carry into its neighbour.  Slack rows g and h let a clause with one or two true literals still reach 3.</text>
