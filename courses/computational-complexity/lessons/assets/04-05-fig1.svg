  <text x="395.00" y="234.00" font-size="10.5" fill="#8a8a8a" text-anchor="middle">reads 3 positions, applies one local test, accepts or rejects</text>
  <rect x="55.00" y="264.00" width="320.00" height="52.00" rx="3" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="215.00" y="282.00" font-size="11" fill="#4a90d9" text-anchor="middle" font-weight="bold">x is in the language</text>
  <text x="215.00" y="302.00" font-size="10" fill="#4a90d9" text-anchor="middle">some proof makes the verifier accept always</text>
  <rect x="415.00" y="264.00" width="320.00" height="52.00" rx="3" fill="none" stroke="#e0645c" stroke-width="1.4"/>
  <text x="575.00" y="282.00" font-size="11" fill="#e0645c" text-anchor="middle" font-weight="bold">x is not in the language</text>
  <text x="575.00" y="302.00" font-size="10" fill="#e0645c" text-anchor="middle">every proof is rejected with prob &gt;= 1/2</text>
  <text x="20.00" y="352.00" font-size="10.5" fill="#8a8a8a">PCP(log n, 1) = NP. Every NP statement has a proof format in which a constant number of randomly chosen bits</text>
  <text x="20.00" y="368.00" font-size="10.5" fill="#8a8a8a">suffices to catch any flaw half the time — the errors in a wrong proof are spread out rather than hidden in one place.</text>
  <text x="20.00" y="390.00" font-size="10.5" fill="#8a8a8a" font-style="italic">Reading three bits of a proof of a theorem is not a metaphor; it is the theorem.</text>
</svg>
