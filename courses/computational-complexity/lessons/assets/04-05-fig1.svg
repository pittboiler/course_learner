  <text x="50.00" y="60.00" font-size="10.5" fill="#8a8a8a">the proof, a string of length 2^(O(log n)) = poly(n) bits</text>
  <text x="750.00" y="120.00" font-size="11" fill="#8a8a8a" text-anchor="end">...</text>
  <rect x="265.00" y="168.00" width="260.00" height="44.00" rx="3" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="395.00" y="193.85" font-size="11" fill="#4a90d9" text-anchor="middle">verifier: O(log n) random bits</text>
