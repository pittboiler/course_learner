<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="380.00" y="18.00" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="bold">Toda: one counting oracle swallows the entire hierarchy</text>
  <rect x="135.00" y="80.00" width="190.00" height="32.00" rx="3" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="230.00" y="99.85" font-size="11" fill="#4a90d9" text-anchor="middle">Sigma_3 / Pi_3</text>
  <rect x="135.00" y="130.00" width="190.00" height="32.00" rx="3" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="230.00" y="149.85" font-size="11" fill="#4a90d9" text-anchor="middle">Sigma_2 / Pi_2</text>
  <rect x="135.00" y="180.00" width="190.00" height="32.00" rx="3" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="230.00" y="199.85" font-size="11" fill="#4a90d9" text-anchor="middle">NP / coNP</text>
  <rect x="135.00" y="230.00" width="190.00" height="32.00" rx="3" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="230.00" y="249.85" font-size="11" fill="#4a90d9" text-anchor="middle">P</text>
  <text x="230.00" y="72.00" font-size="15" fill="#4a90d9" text-anchor="middle">...</text>
  <line x1="230.00" y1="112.00" x2="230.00" y2="130.00" stroke="#8a8a8a" stroke-width="1.0" stroke-linecap="round"/>
  <line x1="230.00" y1="162.00" x2="230.00" y2="180.00" stroke="#8a8a8a" stroke-width="1.0" stroke-linecap="round"/>
  <line x1="230.00" y1="212.00" x2="230.00" y2="230.00" stroke="#8a8a8a" stroke-width="1.0" stroke-linecap="round"/>
  <ellipse cx="230.00" cy="166.00" rx="235.00" ry="132.00" fill="none" stroke="#e0645c" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="230.00" y="36.00" font-size="11.5" fill="#8a8a8a" text-anchor="middle"></text>
  <text x="478.00" y="166.00" font-size="11" fill="#e0645c" font-weight="bold">P with a</text>
  <text x="478.00" y="182.00" font-size="11" fill="#e0645c" font-weight="bold">#P oracle</text>
  <text x="20.00" y="318.00" font-size="10.5" fill="#8a8a8a">Every level of the polynomial hierarchy — all of them at once — is decidable in polynomial time given an oracle that</text>
  <text x="20.00" y="334.00" font-size="10.5" fill="#8a8a8a">returns the NUMBER of satisfying assignments of a formula. One number per query, and a single query suffices.</text>
  <text x="20.00" y="358.00" font-size="10.5" fill="#8a8a8a">The proof goes through parity: PH randomly reduces to the class of problems asking whether a count is odd, and a</text>
  <text x="20.00" y="374.00" font-size="10.5" fill="#8a8a8a" font-style="italic">counting oracle answers parity questions for free. Counting is not one step above deciding; it is above the whole tower.</text>
</svg>
