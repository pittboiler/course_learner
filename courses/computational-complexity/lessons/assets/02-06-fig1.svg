  <text x="300.00" y="216.20" font-size="12" fill="#4a90d9" text-anchor="middle">NP</text>
  <rect x="225.00" y="247.00" width="150.00" height="34.00" rx="3" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="300.00" y="268.20" font-size="12" fill="#4a90d9" text-anchor="middle">P</text>
