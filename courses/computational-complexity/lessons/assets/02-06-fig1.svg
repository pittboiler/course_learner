<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="400.00" y="18.00" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="bold">The map: every containment known, and the three places we know it is strict</text>
