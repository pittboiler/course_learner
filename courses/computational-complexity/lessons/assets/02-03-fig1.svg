  <text x="148.00" y="54.00" font-size="11" fill="#8a8a8a" text-anchor="end" font-weight="bold">a</text>
  <text x="695.00" y="68.00" font-size="11" fill="#8a8a8a" font-weight="bold">b</text>
  <text x="20.00" y="286.00" font-size="10.5" fill="#8a8a8a">Depth of the recursion is k = log2(number of configurations) = O(s). Each frame stores three configuration</text>
  <text x="20.00" y="302.00" font-size="10.5" fill="#8a8a8a">identifiers, O(s) bits each, and the two halves run one after the other so only one path of frames is ever live.</text>
  <text x="20.00" y="322.00" font-size="10.5" fill="#8a8a8a" font-style="italic">Total space O(s) x O(s) = O(s^2) — quadratic, not exponential, which is the whole theorem.</text>
</svg>
