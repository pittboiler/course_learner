<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="390.00" y="18.00" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="bold">The randomized classes differ only in which side may be wrong</text>
  <text x="280.00" y="72.00" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold">on a NO instance</text>
  <text x="550.00" y="72.00" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold">on a YES instance</text>
  <text x="136.00" y="121.00" font-size="12" fill="#e0645c" text-anchor="end" font-weight="bold">RP</text>
  <rect x="150.00" y="88.00" width="260.00" height="48.00" rx="4" fill="none" stroke="#e0645c" stroke-width="1.3"/>
  <rect x="420.00" y="88.00" width="260.00" height="48.00" rx="4" fill="none" stroke="#e0645c" stroke-width="1.3"/>
  <text x="280.00" y="121.00" font-size="10.5" fill="#e0645c" text-anchor="middle">must reject, always</text>
  <text x="550.00" y="121.00" font-size="10.5" fill="#e0645c" text-anchor="middle">accepts with prob &gt;= 1/2</text>
  <text x="136.00" y="179.00" font-size="12" fill="#e0645c" text-anchor="end" font-weight="bold">coRP</text>
  <rect x="150.00" y="146.00" width="260.00" height="48.00" rx="4" fill="none" stroke="#e0645c" stroke-width="1.3"/>
  <rect x="420.00" y="146.00" width="260.00" height="48.00" rx="4" fill="none" stroke="#e0645c" stroke-width="1.3"/>
  <text x="280.00" y="179.00" font-size="10.5" fill="#e0645c" text-anchor="middle">accepts with prob &gt;= 1/2</text>
  <text x="550.00" y="179.00" font-size="10.5" fill="#e0645c" text-anchor="middle">must reject, always</text>
  <text x="136.00" y="237.00" font-size="12" fill="#4a90d9" text-anchor="end" font-weight="bold">BPP</text>
  <rect x="150.00" y="204.00" width="260.00" height="48.00" rx="4" fill="none" stroke="#4a90d9" stroke-width="1.3"/>
  <rect x="420.00" y="204.00" width="260.00" height="48.00" rx="4" fill="none" stroke="#4a90d9" stroke-width="1.3"/>
  <text x="280.00" y="237.00" font-size="10.5" fill="#4a90d9" text-anchor="middle">rejects with prob &gt;= 2/3</text>
  <text x="550.00" y="237.00" font-size="10.5" fill="#4a90d9" text-anchor="middle">accepts with prob &gt;= 2/3</text>
  <text x="136.00" y="295.00" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold">ZPP</text>
  <rect x="150.00" y="262.00" width="260.00" height="48.00" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <rect x="420.00" y="262.00" width="260.00" height="48.00" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="280.00" y="295.00" font-size="10.5" fill="#8a8a8a" text-anchor="middle">must reject, always</text>
  <text x="550.00" y="295.00" font-size="10.5" fill="#8a8a8a" text-anchor="middle">must accept, always</text>
  <text x="700.00" y="121.00" font-size="10" fill="#8a8a8a" text-anchor="middle">one-sided</text>
  <text x="700.00" y="179.00" font-size="10" fill="#8a8a8a" text-anchor="middle">one-sided</text>
  <text x="700.00" y="237.00" font-size="10" fill="#8a8a8a" text-anchor="middle">two-sided</text>
  <text x="700.00" y="288.00" font-size="10" fill="#8a8a8a" text-anchor="middle">zero error,</text>
  <text x="700.00" y="302.00" font-size="10" fill="#8a8a8a" text-anchor="middle">random time</text>
  <text x="20.00" y="348.00" font-size="10.5" fill="#8a8a8a">A class is fixed by the shape of its error, not by its success probability: the constants 1/2 and 2/3 can be pushed</text>
  <text x="20.00" y="364.00" font-size="10.5" fill="#8a8a8a">to 1 - 2^-n by repetition, but a one-sided error can never be turned into a zero-sided one by repeating.</text>
  <text x="20.00" y="386.00" font-size="10.5" fill="#8a8a8a" font-style="italic">ZPP always answers correctly; what is random is how long it takes. ZPP = RP and coRP together.</text>
</svg>
