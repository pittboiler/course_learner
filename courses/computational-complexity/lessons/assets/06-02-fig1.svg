<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <text x="400.00" y="18.00" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="bold">One hypothesis, many quadratic lower bounds</text>
  <rect x="290.00" y="47.00" width="220.00" height="38.00" rx="3" fill="none" stroke="#e0645c" stroke-width="1.4"/>
  <text x="400.00" y="70.38" font-size="12.5" fill="#e0645c" text-anchor="middle">SETH</text>
  <text x="400.00" y="96.00" font-size="10" fill="#8a8a8a" text-anchor="middle">no (2 - delta)^n algorithm for k-SAT, for every k</text>
  <line x1="400.00" y1="88.00" x2="400.00" y2="126.00" stroke="#8a8a8a" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="400.00,132.00 397.55,126.52 402.45,126.52" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="414.00" y="116.00" font-size="10" fill="#8a8a8a">split the variables in half</text>
  <rect x="270.00" y="133.00" width="260.00" height="38.00" rx="3" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="400.00" y="156.20" font-size="12" fill="#4a90d9" text-anchor="middle">Orthogonal Vectors</text>
  <text x="400.00" y="182.00" font-size="10" fill="#8a8a8a" text-anchor="middle">no O(N^(2-eps)) algorithm for N vectors in dimension omega(log N)</text>
  <line x1="400.00" y1="192.00" x2="155.91" y2="234.96" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round"/>
  <polygon points="150.00,236.00 154.97,232.64 155.82,237.46" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="50.00" y="240.00" width="200.00" height="44.00" rx="3" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="150.00" y="256.00" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold">Edit distance</text>
  <text x="150.00" y="274.00" font-size="10" fill="#8a8a8a" text-anchor="middle">no O(n^(2-eps))</text>
  <line x1="400.00" y1="192.00" x2="400.00" y2="230.00" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round"/>
  <polygon points="400.00,236.00 397.55,230.52 402.45,230.52" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="300.00" y="240.00" width="200.00" height="44.00" rx="3" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="400.00" y="256.00" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold">Longest common</text>
  <text x="400.00" y="274.00" font-size="10" fill="#8a8a8a" text-anchor="middle">subsequence</text>
  <line x1="400.00" y1="192.00" x2="644.09" y2="234.96" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round"/>
  <polygon points="650.00,236.00 644.18,237.46 645.03,232.64" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="550.00" y="240.00" width="200.00" height="44.00" rx="3" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <text x="650.00" y="256.00" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold">Frechet distance</text>
  <text x="650.00" y="274.00" font-size="10" fill="#8a8a8a" text-anchor="middle">no O(n^(2-eps))</text>
  <rect x="50.00" y="335.00" width="200.00" height="34.00" rx="3" fill="none" stroke="#e0645c" stroke-width="1.4"/>
  <text x="150.00" y="355.85" font-size="11" fill="#e0645c" text-anchor="middle">3SUM conjecture</text>
  <line x1="250.00" y1="352.00" x2="446.00" y2="352.00" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round"/>
  <polygon points="452.00,352.00 446.52,354.45 446.52,349.55" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="470.00" y="348.00" font-size="10" fill="#8a8a8a">no O(n^(2-eps)) for 3 collinear points,</text>
  <text x="470.00" y="364.00" font-size="10" fill="#8a8a8a">polygon containment, and much of geometry</text>
  <text x="20.00" y="410.00" font-size="10.5" fill="#8a8a8a">Each arrow is a fine-grained reduction: it preserves not just solvability but the EXPONENT, so an improvement</text>
  <text x="20.00" y="426.00" font-size="10.5" fill="#8a8a8a" font-style="italic">anywhere below propagates back up and refutes the hypothesis at the top.</text>
</svg>
