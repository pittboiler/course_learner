  <text x="474.44" y="281.00" font-size="10.5" fill="#e0645c">all Boolean functions: 2^(2^n)</text>
  <text x="352.00" y="208.20" font-size="10.5" fill="#4a90d9">circuits of size 2^n / n</text>
  <text x="20.00" y="352.00" font-size="10.5" fill="#8a8a8a">Both axes are counts of objects, plotted as the log10 of their log2 — so a gap on this chart is a doubly</text>
  <text x="20.00" y="368.00" font-size="10.5" fill="#8a8a8a">exponential gap in reality. Below Shannon's size 2^n/n there are simply not enough circuits to go around,</text>
  <text x="20.00" y="384.00" font-size="10.5" fill="#8a8a8a" font-style="italic">so ALMOST EVERY Boolean function needs a circuit of that size. Not one such function has ever been named.</text>
</svg>
