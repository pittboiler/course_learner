  <text x="30.00" y="52.00" font-size="10.5" fill="#8a8a8a">log2 of the count</text>
  <polyline points="120.00,312.17 152.22,308.26 184.44,304.35 216.67,300.43 248.89,296.52 281.11,292.61 313.33,288.69 345.56,284.78 377.78,280.87 410.00,276.95 442.22,273.04 474.44,269.13 506.67,265.21 538.89,261.30 571.11,257.39 603.33,253.47 635.56,249.56 667.78,245.65 700.00,241.73" fill="none" stroke="#e0645c" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/>
