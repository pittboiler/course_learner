<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#faf9f6"/>

  <!-- title -->
  <text x="200" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Z/15  &#8776;  Z/3  &#215;  Z/5</text>
  <text x="200" y="44" text-anchor="middle" font-size="10" fill="#555555">cell = unique x in {0..14} with (x mod 3, x mod 5)</text>

  <!-- column header label -->
  <text x="220" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">b = x mod 5</text>
  <!-- row header label -->
  <text x="26" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828" transform="rotate(-90 26 176)">a = x mod 3</text>

  <!-- column numbers -->
  <text x="100" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">0</text>
  <text x="160" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">1</text>
  <text x="220" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">2</text>
  <text x="280" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">3</text>
  <text x="340" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">4</text>

  <!-- row numbers -->
  <text x="56" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">0</text>
  <text x="56" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">1</text>
  <text x="56" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">2</text>

  <!-- grid cells: left edge x=70, top edge y=92, cell 60 x 55 -->
  <g fill="none" stroke="#333333" stroke-width="1.5">
    <rect x="70"  y="92"  width="60" height="55"/>
    <rect x="130" y="92"  width="60" height="55"/>
    <rect x="190" y="92"  width="60" height="55"/>
    <rect x="250" y="92"  width="60" height="55"/>
    <rect x="310" y="92"  width="60" height="55"/>

    <rect x="70"  y="147" width="60" height="55"/>
    <rect x="130" y="147" width="60" height="55"/>
    <rect x="190" y="147" width="60" height="55"/>
    <rect x="250" y="147" width="60" height="55"/>
    <rect x="310" y="147" width="60" height="55"/>

    <rect x="70"  y="202" width="60" height="55"/>
    <rect x="130" y="202" width="60" height="55"/>
    <rect x="190" y="202" width="60" height="55"/>
    <rect x="250" y="202" width="60" height="55"/>
    <rect x="310" y="202" width="60" height="55"/>
  </g>

  <!-- cell values, row a, col b -->
  <g font-size="17" font-weight="bold" fill="#333333" text-anchor="middle">
    <!-- a=0 -->
    <text x="100" y="126">0</text>
    <text x="160" y="126">6</text>
    <text x="220" y="126">12</text>
    <text x="280" y="126">3</text>
    <text x="340" y="126">9</text>
    <!-- a=1 -->
    <text x="100" y="181">10</text>
    <text x="160" y="181">1</text>
    <text x="220" y="181">7</text>
    <text x="280" y="181">13</text>
    <text x="340" y="181">4</text>
    <!-- a=2 -->
    <text x="100" y="236">5</text>
    <text x="160" y="236">11</text>
    <text x="220" y="236">2</text>
    <text x="280" y="236">8</text>
    <text x="340" y="236">14</text>
  </g>

  <!-- highlight the x=7 cell (a=1,b=2) as the worked pair -->
  <rect x="190" y="147" width="60" height="55" fill="none" stroke="#2e7d32" stroke-width="3"/>
  <text x="220" y="278" text-anchor="middle" font-size="10" fill="#2e7d32">7 is the only x with (1 mod 3, 2 mod 5)</text>
</svg>
