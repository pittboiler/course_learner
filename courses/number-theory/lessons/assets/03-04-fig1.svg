<svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="360" height="360" fill="#faf9f6"/>

  <defs>
    <marker id="arw" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- faint track -->
  <circle cx="180" cy="180" r="120" fill="none" stroke="#333333" stroke-width="1" opacity="0.15"/>

  <!-- stepping arrows: 3 -> 2 -> 6 -> 4 -> 5 -> 1 -> 3, sweep clockwise -->
  <g fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arw)">
    <path d="M209.0,63.6 A120 120 0 0 1 266.3,96.6"/>
    <path d="M295.4,146.9 A120 120 0 0 1 295.4,213.1"/>
    <path d="M266.3,263.4 A120 120 0 0 1 209.0,296.4"/>
    <path d="M151.0,296.4 A120 120 0 0 1 93.7,263.4"/>
    <path d="M64.6,213.1 A120 120 0 0 1 64.6,146.9"/>
    <path d="M93.7,96.6 A120 120 0 0 1 151.0,63.6"/>
  </g>

  <!-- exponent labels (radius 150) -->
  <g font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">
    <text x="180" y="26">3&#185;</text>
    <text x="313" y="105">3&#178;</text>
    <text x="313" y="259">3&#179;</text>
    <text x="180" y="338">3&#8308;</text>
    <text x="47" y="259">3&#8309;</text>
    <text x="47" y="105">3&#8310;</text>
  </g>

  <!-- nodes: the units {1,2,3,4,5,6} placed as powers of 3 -->
  <g>
    <!-- generator 3 highlighted -->
    <circle cx="180" cy="60"  r="22" fill="#ffffff" stroke="#c0392b" stroke-width="3.5"/>
    <circle cx="283.9" cy="120" r="22" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <circle cx="283.9" cy="240" r="22" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <circle cx="180" cy="300" r="22" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <circle cx="76.1" cy="240" r="22" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <circle cx="76.1" cy="120" r="22" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  </g>
  <g font-size="20" font-weight="bold" fill="#333333" text-anchor="middle">
    <text x="180" y="67">3</text>
    <text x="283.9" y="127">2</text>
    <text x="283.9" y="247">6</text>
    <text x="180" y="307">4</text>
    <text x="76.1" y="247">5</text>
    <text x="76.1" y="127">1</text>
  </g>

  <!-- center caption -->
  <g text-anchor="middle">
    <text x="180" y="172" font-size="14" font-weight="bold" fill="#333333">&#10216;3&#10217; = {1,2,3,4,5,6}</text>
    <text x="180" y="192" font-size="12" fill="#555555">all units mod 7</text>
    <text x="180" y="210" font-size="11" fill="#c0392b">&#215;3 at each step</text>
  </g>
</svg>
