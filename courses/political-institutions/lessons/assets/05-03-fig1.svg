<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<rect x="0" y="0" width="780" height="500" fill="#ffffff"/>
<text x="320" y="30" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">Diffuse</text>
<text x="320" y="50" font-size="13" text-anchor="middle" fill="#333333">any court may review</text>
<text x="620" y="30" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">Concentrated</text>
<text x="620" y="50" font-size="13" text-anchor="middle" fill="#333333">one constitutional court</text>
<text x="10" y="150" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">Abstract</text>
<text x="10" y="170" font-size="13" text-anchor="start" fill="#333333">a petition,</text>
<text x="10" y="188" font-size="13" text-anchor="start" fill="#333333">no live case</text>
<text x="10" y="325" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">Concrete</text>
<text x="10" y="345" font-size="13" text-anchor="start" fill="#333333">arises in a</text>
<text x="10" y="363" font-size="13" text-anchor="start" fill="#333333">real dispute</text>
<rect x="170" y="70" width="300" height="175" rx="0" fill="#f4f4f4" stroke="#333333" stroke-width="1.2"/>
<rect x="470" y="70" width="300" height="175" rx="0" fill="none" stroke="#333333" stroke-width="1.2"/>
<rect x="170" y="245" width="300" height="175" rx="0" fill="none" stroke="#333333" stroke-width="1.2"/>
<rect x="470" y="245" width="300" height="175" rx="0" fill="none" stroke="#333333" stroke-width="1.2"/>
<text x="320" y="150" font-size="13" text-anchor="middle" fill="#333333" font-style="italic">Rarely combined:</text>
<text x="320" y="170" font-size="13" text-anchor="middle" fill="#333333" font-style="italic">diffuse review grows out</text>
<text x="320" y="190" font-size="13" text-anchor="middle" fill="#333333" font-style="italic">of deciding cases</text>
<rect x="485" y="85" width="255" height="62" rx="6" fill="#dbe8f5" stroke="#1a6fb5" stroke-width="1.2"/>
<text x="495" y="108" font-size="13" text-anchor="start" fill="#1a6fb5" font-weight="bold">Germany: abstract review</text>
<text x="495" y="128" font-size="13" text-anchor="start" fill="#111111">government, a Land, or 1/4 of</text>
<text x="495" y="143" font-size="12" text-anchor="start" fill="#111111">the Bundestag (Art. 94(1) no. 2)</text>
<rect x="485" y="160" width="255" height="62" rx="6" fill="#f6dde1" stroke="#d1495b" stroke-width="1.2"/>
<text x="495" y="183" font-size="13" text-anchor="start" fill="#d1495b" font-weight="bold">France: a priori review</text>
<text x="495" y="203" font-size="12" text-anchor="start" fill="#111111">before promulgation; 60 deputies</text>
<text x="495" y="217" font-size="12" text-anchor="start" fill="#111111">or 60 senators since 1974 (Art. 61)</text>
<rect x="185" y="262" width="255" height="62" rx="6" fill="#dcefe4" stroke="#2e8b57" stroke-width="1.2"/>
<text x="195" y="285" font-size="13" text-anchor="start" fill="#2e8b57" font-weight="bold">United States</text>
<text x="195" y="305" font-size="13" text-anchor="start" fill="#111111">any court, in a live case;</text>
<text x="195" y="319" font-size="12" text-anchor="start" fill="#111111">precedent spreads the ruling</text>
<rect x="185" y="337" width="255" height="62" rx="6" fill="#dcefe4" stroke="#2e8b57" stroke-width="1.2"/>
<text x="195" y="360" font-size="13" text-anchor="start" fill="#2e8b57" font-weight="bold">Japan (Art. 81, 1947)</text>
<text x="195" y="380" font-size="13" text-anchor="start" fill="#111111">same design as the US;</text>
<text x="195" y="394" font-size="12" text-anchor="start" fill="#111111">used very rarely</text>
<rect x="485" y="262" width="255" height="62" rx="6" fill="#dbe8f5" stroke="#1a6fb5" stroke-width="1.2"/>
<text x="495" y="285" font-size="12" text-anchor="start" fill="#1a6fb5" font-weight="bold">Germany: referral and complaint</text>
<text x="495" y="305" font-size="12" text-anchor="start" fill="#111111">courts refer (Art. 100); any person</text>
<text x="495" y="319" font-size="12" text-anchor="start" fill="#111111">may file a complaint (Art. 94(1) 4a)</text>
<rect x="485" y="337" width="255" height="62" rx="6" fill="#f6dde1" stroke="#d1495b" stroke-width="1.2"/>
<text x="495" y="360" font-size="13" text-anchor="start" fill="#d1495b" font-weight="bold">France from 2010: the QPC</text>
<text x="495" y="380" font-size="12" text-anchor="start" fill="#111111">a litigant raises it; top courts</text>
<text x="495" y="394" font-size="12" text-anchor="start" fill="#111111">filter it (Art. 61-1)</text>
<line x1="758" y1="222" x2="758" y2="335" stroke="#d1495b" stroke-width="2" marker-end="url(#arr)"/>
<text x="752" y="238" font-size="12" text-anchor="end" fill="#d1495b" font-weight="bold">2008</text>
<text x="10" y="455" font-size="13" text-anchor="start" fill="#111111">Off the grid: the United Kingdom. No court may set aside an Act of Parliament;</text>
<text x="10" y="477" font-size="13" text-anchor="start" fill="#111111">UK judicial review means review of ministers, agencies and secondary legislation.</text>
</svg>
