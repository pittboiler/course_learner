<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
<text x="400" y="22" font-size="14" text-anchor="middle" fill="#111111" font-weight="bold">From the appointment rule to whom the official answers</text>
<text x="238" y="50" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">Appointment rule</text>
<text x="394" y="50" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">Removal rule</text>
<text x="550" y="50" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">Answers to</text>
<text x="706" y="50" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">After an election</text>
<text x="8" y="88" font-size="13" text-anchor="start" fill="#d1495b" font-weight="bold">Patronage post</text>
<text x="8" y="106" font-size="11" text-anchor="start" fill="#333333">US federal posts</text>
<text x="8" y="120" font-size="11" text-anchor="start" fill="#333333">before 1883</text>
<rect x="168" y="64" width="140" height="70" rx="6" fill="#f6dde1" stroke="#d1495b" stroke-width="1.4"/>
<text x="238" y="94" font-size="12" text-anchor="middle" fill="#111111">Party or patron</text>
<text x="238" y="111" font-size="12" text-anchor="middle" fill="#111111">picks freely</text>
<line x1="309" y1="99" x2="322" y2="99" stroke="#333333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="324" y="64" width="140" height="70" rx="6" fill="#f6dde1" stroke="#d1495b" stroke-width="1.4"/>
<text x="394" y="94" font-size="12" text-anchor="middle" fill="#111111">At will, no</text>
<text x="394" y="111" font-size="12" text-anchor="middle" fill="#111111">reason needed</text>
<line x1="465" y1="99" x2="478" y2="99" stroke="#333333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="480" y="64" width="140" height="70" rx="6" fill="#f6dde1" stroke="#d1495b" stroke-width="1.4"/>
<text x="550" y="94" font-size="12" text-anchor="middle" fill="#111111">The patron and</text>
<text x="550" y="111" font-size="12" text-anchor="middle" fill="#111111">the party</text>
<line x1="621" y1="99" x2="634" y2="99" stroke="#333333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="636" y="64" width="140" height="70" rx="6" fill="#f6dde1" stroke="#d1495b" stroke-width="1.4"/>
<text x="706" y="94" font-size="12" text-anchor="middle" fill="#111111">Replaced by the</text>
<text x="706" y="111" font-size="12" text-anchor="middle" fill="#111111">winner's people</text>
<text x="8" y="176" font-size="13" text-anchor="start" fill="#1a6fb5" font-weight="bold">Career merit post</text>
<text x="8" y="194" font-size="11" text-anchor="start" fill="#333333">UK, German, French</text>
<text x="8" y="208" font-size="11" text-anchor="start" fill="#333333">career services</text>
<rect x="168" y="152" width="140" height="70" rx="6" fill="#dbe8f5" stroke="#1a6fb5" stroke-width="1.4"/>
<text x="238" y="182" font-size="12" text-anchor="middle" fill="#111111">Open competition:</text>
<text x="238" y="199" font-size="12" text-anchor="middle" fill="#111111">exam or commission</text>
<line x1="309" y1="187" x2="322" y2="187" stroke="#333333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="324" y="152" width="140" height="70" rx="6" fill="#dbe8f5" stroke="#1a6fb5" stroke-width="1.4"/>
<text x="394" y="182" font-size="12" text-anchor="middle" fill="#111111">Only for cause,</text>
<text x="394" y="199" font-size="12" text-anchor="middle" fill="#111111">by set procedure</text>
<line x1="465" y1="187" x2="478" y2="187" stroke="#333333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="480" y="152" width="140" height="70" rx="6" fill="#dbe8f5" stroke="#1a6fb5" stroke-width="1.4"/>
<text x="550" y="182" font-size="12" text-anchor="middle" fill="#111111">The law, and the</text>
<text x="550" y="199" font-size="12" text-anchor="middle" fill="#111111">government of the day</text>
<line x1="621" y1="187" x2="634" y2="187" stroke="#333333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="636" y="152" width="140" height="70" rx="6" fill="#dbe8f5" stroke="#1a6fb5" stroke-width="1.4"/>
<text x="706" y="182" font-size="12" text-anchor="middle" fill="#111111">Stays and serves</text>
<text x="706" y="199" font-size="12" text-anchor="middle" fill="#111111">the new government</text>
<text x="8" y="264" font-size="13" text-anchor="start" fill="#2e8b57" font-weight="bold">Political layer</text>
<text x="8" y="282" font-size="11" text-anchor="start" fill="#333333">US appointees;</text>
<text x="8" y="296" font-size="11" text-anchor="start" fill="#333333">UK special advisers</text>
<rect x="168" y="240" width="140" height="70" rx="6" fill="#dcefe4" stroke="#2e8b57" stroke-width="1.4"/>
<text x="238" y="270" font-size="12" text-anchor="middle" fill="#111111">Chosen by the</text>
<text x="238" y="287" font-size="12" text-anchor="middle" fill="#111111">minister or president</text>
<line x1="309" y1="275" x2="322" y2="275" stroke="#333333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="324" y="240" width="140" height="70" rx="6" fill="#dcefe4" stroke="#2e8b57" stroke-width="1.4"/>
<text x="394" y="270" font-size="12" text-anchor="middle" fill="#111111">Serves at pleasure;</text>
<text x="394" y="287" font-size="12" text-anchor="middle" fill="#111111">term tied to patron</text>
<line x1="465" y1="275" x2="478" y2="275" stroke="#333333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="480" y="240" width="140" height="70" rx="6" fill="#dcefe4" stroke="#2e8b57" stroke-width="1.4"/>
<text x="550" y="270" font-size="12" text-anchor="middle" fill="#111111">The elected</text>
<text x="550" y="287" font-size="12" text-anchor="middle" fill="#111111">executive</text>
<line x1="621" y1="275" x2="634" y2="275" stroke="#333333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="636" y="240" width="140" height="70" rx="6" fill="#dcefe4" stroke="#2e8b57" stroke-width="1.4"/>
<text x="706" y="270" font-size="12" text-anchor="middle" fill="#111111">Leaves with the</text>
<text x="706" y="287" font-size="12" text-anchor="middle" fill="#111111">outgoing government</text>
<text x="8" y="336" font-size="12" text-anchor="start" fill="#111111">Hybrid: German political civil servants (state secretaries, directors-general) are recruited</text>
<text x="8" y="354" font-size="12" text-anchor="start" fill="#111111">as career officials but can be sent into temporary retirement at any time (BBG s.54).</text>
<text x="8" y="376" font-size="12" text-anchor="start" fill="#333333" font-style="italic">Rules as of 2026. Whom an official answers to is fixed mainly by who can remove them.</text>
</svg>
