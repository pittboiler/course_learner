<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 302" width="760" height="302" font-family="Helvetica, Arial, sans-serif">

  <rect x="280" y="14" width="200" height="32" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
