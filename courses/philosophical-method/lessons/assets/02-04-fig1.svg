  <rect x="70" y="180" width="200" height="32" rx="4" fill="none" stroke="#e0645c" stroke-width="1.4"/>
  <text x="170" y="201" text-anchor="middle" font-size="13" fill="#e0645c">16 flagged</text>

  <rect x="470" y="180" width="200" height="32" rx="4" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="570" y="201" text-anchor="middle" font-size="13" fill="#4a90d9">499 flagged</text>

  <text x="380" y="243" text-anchor="middle" font-size="12" fill="#8a8a8a">Everyone the machine accuses: 515 people</text>

