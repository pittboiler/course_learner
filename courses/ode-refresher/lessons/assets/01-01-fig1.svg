<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- Slope field for y' = y on a grid, with two solution curves y = C e^t threading it. -->
  <!-- Plot window: t in [0, 4], y in [-2, 2]. Axes cross at y = 0 (pixel y = 175). -->

  <!-- axes -->
  <line x1="30" y1="175" x2="540" y2="175" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="60" y1="18" x2="60" y2="322" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="540,175 530,170 530,180" fill="#8a8a8a"/>
  <polygon points="60,18 55,28 65,28" fill="#8a8a8a"/>
  <text x="546" y="180" fill="#8a8a8a">t</text>
  <text x="44" y="30" fill="#8a8a8a">y</text>

  <!-- slope-field segments: at each (t,y) the slope is y. Segment half-length ~14px, centered on the node. -->
  <!-- Row y = +1.5 (pixel 100): slope 1.5 -->
  <g stroke="#8a8a8a" stroke-width="1.5">
    <line x1="86" y1="110" x2="114" y2="90"/>
    <line x1="176" y1="110" x2="204" y2="90"/>
    <line x1="266" y1="110" x2="294" y2="90"/>
    <line x1="356" y1="110" x2="384" y2="90"/>
    <line x1="446" y1="110" x2="474" y2="90"/>
  </g>
  <!-- Row y = +0.75 (pixel 137.5): slope 0.75 -->
  <g stroke="#8a8a8a" stroke-width="1.5">
    <line x1="86" y1="142" x2="114" y2="133"/>
    <line x1="176" y1="142" x2="204" y2="133"/>
    <line x1="266" y1="142" x2="294" y2="133"/>
    <line x1="356" y1="142" x2="384" y2="133"/>
    <line x1="446" y1="142" x2="474" y2="133"/>
  </g>
  <!-- Row y = 0 (pixel 175): slope 0, flat -->
  <g stroke="#8a8a8a" stroke-width="1.5">
    <line x1="86" y1="175" x2="114" y2="175"/>
    <line x1="176" y1="175" x2="204" y2="175"/>
    <line x1="266" y1="175" x2="294" y2="175"/>
    <line x1="356" y1="175" x2="384" y2="175"/>
    <line x1="446" y1="175" x2="474" y2="175"/>
  </g>
  <!-- Row y = -0.75 (pixel 212.5): slope -0.75 -->
  <g stroke="#8a8a8a" stroke-width="1.5">
    <line x1="86" y1="208" x2="114" y2="217"/>
    <line x1="176" y1="208" x2="204" y2="217"/>
    <line x1="266" y1="208" x2="294" y2="217"/>
    <line x1="356" y1="208" x2="384" y2="217"/>
    <line x1="446" y1="208" x2="474" y2="217"/>
  </g>
  <!-- Row y = -1.5 (pixel 250): slope -1.5 -->
  <g stroke="#8a8a8a" stroke-width="1.5">
    <line x1="86" y1="260" x2="114" y2="240"/>
    <line x1="176" y1="260" x2="204" y2="240"/>
    <line x1="266" y1="260" x2="294" y2="240"/>
    <line x1="356" y1="260" x2="384" y2="240"/>
    <line x1="446" y1="260" x2="474" y2="240"/>
  </g>

  <!-- solution curve through (0, 0.5): y = 0.5 e^t. Pixels: x = 60 + t*120, y = 175 - y*50 -->
  <path d="M 60 150 L 90 143.3 L 120 134.6 L 150 123.5 L 180 109.4 L 210 91.2 L 240 68.0 L 270 38.3"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <circle cx="60" cy="150" r="4" fill="#4a90d9"/>

  <!-- solution curve through (0, -0.35): y = -0.35 e^t -->
  <path d="M 60 192.5 L 90 197.2 L 120 203.2 L 150 211.0 L 180 220.9 L 210 233.6 L 240 249.8 L 270 270.6"
        fill="none" stroke="#e0645c" stroke-width="3"/>
  <circle cx="60" cy="192.5" r="4" fill="#e0645c"/>

  <!-- initial-condition guides for the blue curve at (0, 0.5) -->
  <line x1="60" y1="150" x2="60" y2="175" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- labels -->
  <text x="278" y="40" fill="#4a90d9">y(0) = 0.5</text>
  <text x="278" y="276" fill="#e0645c">y(0) = -0.35</text>

  <!-- caption -->
  <text x="80" y="345" fill="#8a8a8a" font-style="italic">Slope field of y' = y: every arrow's slope equals its height. Pick a start point; follow the arrows.</text>
</svg>
