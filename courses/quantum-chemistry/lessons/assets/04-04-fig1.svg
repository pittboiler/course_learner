<svg viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">Two axes to converge: method (down the columns) and basis (across the rows). The exact answer sits in the far corner.</text>

  <!-- ===== axes ===== -->
  <line x1="110" y1="330" x2="520" y2="330" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="520,330 510,325 510,335" fill="#8a8a8a"/>
  <text x="300" y="366" fill="#8a8a8a" font-size="13">larger basis set &#8594; CBS limit</text>

  <line x1="110" y1="330" x2="110" y2="110" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="110,110 105,120 115,120" fill="#8a8a8a"/>
  <text x="18" y="230" fill="#8a8a8a" font-size="13" transform="rotate(-90 18 230)">more correlation &#8594; full</text>

  <!-- method row labels -->
  <text x="52" y="145" fill="#8a8a8a" font-size="13">CCSD(T)</text>
  <text x="72" y="225" fill="#8a8a8a" font-size="13">MP2</text>
  <text x="80" y="305" fill="#8a8a8a" font-size="13">HF</text>

  <!-- basis column labels -->
  <text x="162" y="350" fill="#8a8a8a" font-size="13">DZ</text>
  <text x="262" y="350" fill="#8a8a8a" font-size="13">TZ</text>
  <text x="362" y="350" fill="#8a8a8a" font-size="13">QZ</text>
  <text x="456" y="350" fill="#8a8a8a" font-size="13">CBS</text>

  <!-- faint grid -->
  <g stroke="#8a8a8a" stroke-width="1" opacity="0.28">
    <line x1="170" y1="330" x2="170" y2="130"/>
    <line x1="270" y1="330" x2="270" y2="130"/>
    <line x1="370" y1="330" x2="370" y2="130"/>
    <line x1="470" y1="330" x2="470" y2="130"/>
    <line x1="110" y1="300" x2="490" y2="300"/>
    <line x1="110" y1="220" x2="490" y2="220"/>
    <line x1="110" y1="140" x2="490" y2="140"/>
  </g>

  <!-- grid nodes (grey), corner drawn separately in coral -->
  <g fill="#8a8a8a">
    <circle cx="170" cy="300" r="4"/><circle cx="270" cy="300" r="4"/><circle cx="370" cy="300" r="4"/><circle cx="470" cy="300" r="4"/>
    <circle cx="170" cy="220" r="4"/><circle cx="270" cy="220" r="4"/><circle cx="370" cy="220" r="4"/><circle cx="470" cy="220" r="4"/>
    <circle cx="170" cy="140" r="4"/><circle cx="270" cy="140" r="4"/><circle cx="370" cy="140" r="4"/>
  </g>

  <!-- convergence path (blue): improve both axes together toward the corner -->
  <path d="M 170 300 L 270 220 L 370 175 L 452 150" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="462,144 447,146 454,158" fill="#4a90d9"/>
  <text x="196" y="268" fill="#4a90d9" font-size="13">converge BOTH</text>

  <!-- exact target corner (coral star) -->
  <g>
    <polygon points="470,124 475,138 490,138 478,147 483,161 470,152 457,161 462,147 450,138 465,138" fill="#e0645c"/>
    <text x="486" y="132" fill="#e0645c" font-size="13">exact</text>
    <text x="486" y="148" fill="#e0645c" font-size="12">(CBS + full</text>
    <text x="486" y="162" fill="#e0645c" font-size="12">correlation)</text>
  </g>

  <!-- error-cancellation caution flag near HF/DZ -->
  <g>
    <circle cx="170" cy="300" r="12" fill="none" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="560,250 570,270 550,270" fill="none" stroke="#e0645c" stroke-width="1.5"/>
    <text x="557" y="267" fill="#e0645c" font-size="13">!</text>
    <text x="540" y="292" fill="#e0645c" font-size="12">errors can cancel:</text>
    <text x="540" y="307" fill="#e0645c" font-size="12">right number,</text>
    <text x="540" y="322" fill="#e0645c" font-size="12">wrong reasons</text>
    <line x1="182" y1="296" x2="548" y2="262" stroke="#e0645c" stroke-width="1" stroke-dasharray="2 4"/>
  </g>
</svg>
