<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="26" fill="#8a8a8a" font-style="italic">The SCF loop as linear algebra: density P builds Fock F, diagonalizing FC = SC&#949; gives C, which rebuilds P.</text>

  <!-- ===== P block (top-left, coral) ===== -->
  <rect x="76" y="70" width="72" height="72" rx="4" fill="#e0645c" opacity="0.12" stroke="#e0645c" stroke-width="2"/>
  <line x1="100" y1="70" x2="100" y2="142" stroke="#e0645c" stroke-width="1" opacity="0.6"/>
  <line x1="124" y1="70" x2="124" y2="142" stroke="#e0645c" stroke-width="1" opacity="0.6"/>
  <line x1="76" y1="94" x2="148" y2="94" stroke="#e0645c" stroke-width="1" opacity="0.6"/>
  <line x1="76" y1="118" x2="148" y2="118" stroke="#e0645c" stroke-width="1" opacity="0.6"/>
  <text x="103" y="164" fill="#e0645c" font-size="18" font-weight="bold">P</text>
  <text x="60" y="60" fill="#8a8a8a" font-size="12">density matrix</text>

  <!-- ===== F block (top-right, grey) ===== -->
  <rect x="492" y="70" width="72" height="72" rx="4" fill="#8a8a8a" opacity="0.10" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="516" y1="70" x2="516" y2="142" stroke="#8a8a8a" stroke-width="1" opacity="0.6"/>
  <line x1="540" y1="70" x2="540" y2="142" stroke="#8a8a8a" stroke-width="1" opacity="0.6"/>
  <line x1="492" y1="94" x2="564" y2="94" stroke="#8a8a8a" stroke-width="1" opacity="0.6"/>
  <line x1="492" y1="118" x2="564" y2="118" stroke="#8a8a8a" stroke-width="1" opacity="0.6"/>
  <text x="519" y="164" fill="#8a8a8a" font-size="18" font-weight="bold">F</text>
  <text x="486" y="60" fill="#8a8a8a" font-size="12">Fock matrix</text>

  <!-- ===== solve block (bottom-right, blue) ===== -->
  <rect x="440" y="238" width="176" height="66" rx="6" fill="#4a90d9" opacity="0.14" stroke="#4a90d9" stroke-width="2"/>
  <text x="528" y="268" fill="#4a90d9" text-anchor="middle" font-size="17" font-weight="bold">solve  FC = SC&#949;</text>
  <text x="528" y="290" fill="#4a90d9" text-anchor="middle" font-size="12">generalized eigenproblem</text>

  <!-- ===== C block (bottom-left, grey) ===== -->
  <rect x="76" y="238" width="72" height="72" rx="4" fill="#8a8a8a" opacity="0.10" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="100" y1="238" x2="100" y2="310" stroke="#8a8a8a" stroke-width="1" opacity="0.6"/>
  <line x1="124" y1="238" x2="124" y2="310" stroke="#8a8a8a" stroke-width="1" opacity="0.6"/>
  <line x1="76" y1="262" x2="148" y2="262" stroke="#8a8a8a" stroke-width="1" opacity="0.6"/>
  <line x1="76" y1="286" x2="148" y2="286" stroke="#8a8a8a" stroke-width="1" opacity="0.6"/>
  <text x="103" y="332" fill="#8a8a8a" font-size="18" font-weight="bold">C</text>
  <text x="58" y="228" fill="#8a8a8a" font-size="12">MO coefficients</text>

  <!-- ===== arrows ===== -->
  <!-- P -> F (top) -->
  <line x1="156" y1="106" x2="484" y2="106" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="484,106 474,101 474,111" fill="#8a8a8a"/>
  <text x="320" y="98" fill="#8a8a8a" text-anchor="middle" font-size="12">F = H&#8317;&#7580;&#7523;&#7451; + G(P)</text>

  <!-- F -> solve (right side) -->
  <line x1="528" y1="150" x2="528" y2="230" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="528,230 523,220 533,220" fill="#8a8a8a"/>

  <!-- solve -> C (bottom) -->
  <line x1="436" y1="271" x2="156" y2="271" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="156,271 166,266 166,276" fill="#8a8a8a"/>
  <text x="296" y="290" fill="#8a8a8a" text-anchor="middle" font-size="12">diagonalize &#8594; new C</text>

  <!-- C -> P (left side, coral loop) -->
  <line x1="112" y1="230" x2="112" y2="150" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="112,150 107,160 117,160" fill="#e0645c"/>
  <text x="122" y="196" fill="#e0645c" font-size="12">P = 2&#931;&#7522; C&#7522;C&#7522;</text>
</svg>
