<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Promote an electron across the gap (left); each excited state becomes a stick in the predicted spectrum, height = oscillator strength (right).</text>

  <!-- =========== left: MO energy-level diagram =========== -->
  <!-- energy axis -->
  <line x1="70" y1="290" x2="70" y2="60" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,60 65,72 75,72" fill="#8a8a8a"/>
  <text x="52" y="66" fill="#8a8a8a">E</text>

  <!-- occupied levels (grey lines, blue electrons) -->
  <line x1="120" y1="250" x2="200" y2="250" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="120" y1="215" x2="200" y2="215" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="120" y1="180" x2="200" y2="180" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="206" y="184" fill="#4a90d9">HOMO</text>

  <!-- virtual levels (grey lines, empty) -->
  <line x1="120" y1="120" x2="200" y2="120" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="206" y="124" fill="#8a8a8a">LUMO</text>
  <line x1="120" y1="90" x2="200" y2="90" stroke="#8a8a8a" stroke-width="2"/>

  <!-- electron arrows (paired up/down) on occupied levels -->
  <!-- level 1 -->
  <line x1="140" y1="258" x2="140" y2="242" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="140,242 136,250 144,250" fill="#4a90d9"/>
  <line x1="160" y1="242" x2="160" y2="258" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="160,258 156,250 164,250" fill="#4a90d9"/>
  <!-- level 2 -->
  <line x1="140" y1="223" x2="140" y2="207" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="140,207 136,215 144,215" fill="#4a90d9"/>
  <line x1="160" y1="207" x2="160" y2="223" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="160,223 156,215 164,215" fill="#4a90d9"/>
  <!-- HOMO: one remaining electron (the other was promoted) -->
  <line x1="140" y1="188" x2="140" y2="172" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="140,172 136,180 144,180" fill="#4a90d9"/>

  <!-- promoted electron now in LUMO (coral) -->
  <line x1="160" y1="112" x2="160" y2="128" stroke="#e0645c" stroke-width="2"/>
  <polygon points="160,128 156,120 164,120" fill="#e0645c"/>

  <!-- excitation arrow HOMO -> LUMO -->
  <line x1="180" y1="178" x2="180" y2="124" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="180,120 175,131 185,131" fill="#e0645c"/>
  <text x="188" y="152" fill="#e0645c">h&#957;</text>

  <!-- gap bracket -->
  <line x1="108" y1="180" x2="108" y2="120" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="78" y="153" fill="#8a8a8a">&#916;E</text>

  <!-- =========== right: predicted absorption stick spectrum =========== -->
  <!-- axes -->
  <line x1="380" y1="290" x2="620" y2="290" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="620,290 608,285 608,295" fill="#8a8a8a"/>
  <text x="560" y="312" fill="#8a8a8a">wavelength &#955;</text>
  <line x1="380" y1="290" x2="380" y2="70" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="380,70 375,82 385,82" fill="#8a8a8a"/>
  <text x="392" y="80" fill="#e0645c">f</text>
  <text x="352" y="84" fill="#8a8a8a"> </text>

  <!-- strong allowed stick (from HOMO->LUMO), tall blue -->
  <line x1="450" y1="290" x2="450" y2="105" stroke="#4a90d9" stroke-width="3"/>
  <text x="430" y="100" fill="#4a90d9">allowed</text>
  <!-- oscillator-strength height marker (coral) -->
  <line x1="366" y1="290" x2="366" y2="105" stroke="#e0645c" stroke-width="1" stroke-dasharray="3 4"/>
  <polygon points="366,109 362,120 370,120" fill="#e0645c"/>
  <polygon points="366,286 362,275 370,275" fill="#e0645c"/>
  <text x="342" y="200" fill="#e0645c">f</text>

  <!-- weak forbidden stick, short -->
  <line x1="540" y1="290" x2="540" y2="255" stroke="#4a90d9" stroke-width="3"/>
  <text x="512" y="248" fill="#8a8a8a">forbidden</text>

  <!-- faint broadened envelope over the allowed band (blue, thin) -->
  <path d="M 410 290 Q 450 250 490 290" fill="none" stroke="#4a90d9" stroke-width="1" opacity="0.5"/>
</svg>
