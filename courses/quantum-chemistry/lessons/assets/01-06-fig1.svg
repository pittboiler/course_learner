<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Two 1s orbitals at &#945; split into a bonding &#963; and an antibonding &#963;* &#8212; and the &#963;* rises more than the &#963; drops.</text>

  <!-- energy axis -->
  <line x1="50" y1="250" x2="50" y2="70" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="50,70 45,80 55,80" fill="#8a8a8a"/>
  <text x="42" y="66" fill="#8a8a8a">E</text>

  <!-- alpha reference line -->
  <line x1="95" y1="175" x2="560" y2="175" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="566" y="180" fill="#8a8a8a">&#945;</text>

  <!-- atomic 1s levels -->
  <line x1="110" y1="175" x2="185" y2="175" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="118" y="197" fill="#8a8a8a">1s_A</text>
  <line x1="465" y1="175" x2="540" y2="175" stroke="#8a8a8a" stroke-width="2.5"/>
  <text x="473" y="197" fill="#8a8a8a">1s_B</text>

  <!-- connecting lines -->
  <line x1="185" y1="175" x2="290" y2="105" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="185" y1="175" x2="290" y2="225" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="465" y1="175" x2="375" y2="105" stroke="#8a8a8a" stroke-width="0.8"/>
  <line x1="465" y1="175" x2="375" y2="225" stroke="#8a8a8a" stroke-width="0.8"/>

  <!-- antibonding sigma* (raised more) -->
  <line x1="290" y1="105" x2="375" y2="105" stroke="#e0645c" stroke-width="3"/>
  <text x="298" y="98" fill="#e0645c">&#963;*  (antibonding)</text>

  <!-- bonding sigma (lowered less) -->
  <line x1="290" y1="225" x2="375" y2="225" stroke="#4a90d9" stroke-width="3"/>
  <text x="298" y="244" fill="#4a90d9">&#963;  (bonding)</text>
  <!-- the one H2+ electron -->
  <line x1="332" y1="234" x2="332" y2="216" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="332,216 328,224 336,224" fill="#4a90d9"/>

  <!-- stabilization vs destabilization arrows -->
  <line x1="415" y1="175" x2="415" y2="225" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="415,225 411,217 419,217" fill="#4a90d9"/>
  <text x="422" y="205" fill="#4a90d9">&#945;&#8722;E&#8330;</text>
  <line x1="415" y1="175" x2="415" y2="105" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="415,105 411,113 419,113" fill="#e0645c"/>
  <text x="422" y="140" fill="#e0645c">E&#8331;&#8722;&#945;  (bigger)</text>

  <!-- ===== orbital cartoons ===== -->
  <text x="120" y="300" fill="#8a8a8a">bonding: density piles up between nuclei</text>
  <ellipse cx="230" cy="335" rx="70" ry="20" fill="#4a90d9" opacity="0.22" stroke="#4a90d9" stroke-width="1.5"/>
  <circle cx="200" cy="335" r="3.5" fill="#8a8a8a"/>
  <circle cx="260" cy="335" r="3.5" fill="#8a8a8a"/>

  <text x="400" y="300" fill="#8a8a8a">antibonding: node between nuclei</text>
  <ellipse cx="435" cy="335" rx="26" ry="18" fill="#e0645c" opacity="0.20" stroke="#e0645c" stroke-width="1.5"/>
  <ellipse cx="505" cy="335" rx="26" ry="18" fill="#e0645c" opacity="0.20" stroke="#e0645c" stroke-width="1.5"/>
  <circle cx="445" cy="335" r="3.5" fill="#8a8a8a"/>
  <circle cx="495" cy="335" r="3.5" fill="#8a8a8a"/>
  <line x1="470" y1="308" x2="470" y2="362" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="474" y="378" fill="#8a8a8a">node</text>
</svg>
