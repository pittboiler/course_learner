<svg viewBox="0 0 660 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Left: the same transformer, in ohms and in per-unit.   Right: pick two bases, the rest follow.</text>
  <text x="40.0" y="66.0" fill="#8a8a8a" font-size="11" text-anchor="start">in ohms &#8212; two voltage levels</text>
  <line x1="40.0" y1="114.0" x2="95.0" y2="114.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="95.0" y="102.0" width="28.0" height="24.0" stroke="#8a8a8a" fill="none" fill-opacity="1" stroke-width="1.4" rx="0"/>
  <text x="109.0" y="118.0" fill="#8a8a8a" font-size="9" text-anchor="middle">Z<tspan font-size="0.72em" dy="3">1</tspan><tspan dy="-3"> </tspan></text>
  <line x1="123.0" y1="114.0" x2="142.0" y2="114.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="148.0" y1="98.0" x2="148.0" y2="130.0" stroke="#4a90d9" stroke-width="2.2"/>
  <line x1="156.0" y1="98.0" x2="156.0" y2="130.0" stroke="#4a90d9" stroke-width="2.2"/>
  <text x="152.0" y="92.0" fill="#4a90d9" font-size="10" text-anchor="middle">a = N<tspan font-size="0.72em" dy="3">1</tspan><tspan dy="-3">/N</tspan><tspan font-size="0.72em" dy="3">2</tspan><tspan dy="-3"> </tspan></text>
  <line x1="162.0" y1="114.0" x2="182.0" y2="114.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="182.0" y="102.0" width="28.0" height="24.0" stroke="#8a8a8a" fill="none" fill-opacity="1" stroke-width="1.4" rx="0"/>
  <text x="196.0" y="118.0" fill="#8a8a8a" font-size="9" text-anchor="middle">Z<tspan font-size="0.72em" dy="3">2</tspan><tspan dy="-3"> </tspan></text>
  <line x1="210.0" y1="114.0" x2="264.0" y2="114.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="40.0" y="154.0" fill="#8a8a8a" font-size="10" text-anchor="start">every impedance must be referred:  Z<tspan font-size="0.72em" dy="3">2</tspan><tspan dy="-3">&#8242; = a</tspan><tspan font-size="0.72em" dy="-4">2</tspan><tspan dy="4"> Z</tspan><tspan font-size="0.72em" dy="3">2</tspan><tspan dy="-3"> </tspan></text>
  <line x1="150.0" y1="174.0" x2="150.0" y2="204.0" stroke="#8a8a8a" stroke-width="1.8"/>
  <polygon points="150.0,204.0 147.3,197.6 152.7,197.6" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <text x="160.0" y="194.0" fill="#8a8a8a" font-size="10" text-anchor="start">divide by its base</text>
  <text x="40.0" y="238.0" fill="#e0645c" font-size="11" text-anchor="start">in per-unit &#8212; one network</text>
  <line x1="40.0" y1="280.0" x2="110.0" y2="280.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <rect x="110.0" y="266.0" width="90.0" height="28.0" stroke="#e0645c" fill="none" fill-opacity="1" stroke-width="1.4" rx="0"/>
  <text x="155.0" y="284.0" fill="#e0645c" font-size="10" text-anchor="middle">Z = j0.08 pu</text>
  <line x1="200.0" y1="280.0" x2="270.0" y2="280.0" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="40.0" y="320.0" fill="#e0645c" font-size="10" text-anchor="start">the transformer symbol is gone &#8212; it is a wire</text>
  <rect x="372.0" y="74.0" width="250.0" height="256.0" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="0.04" stroke-width="0.9" rx="6"/>
  <text x="497.0" y="98.0" fill="#8a8a8a" font-size="12" text-anchor="middle">the base chain</text>
  <rect x="394.0" y="114.0" width="94.0" height="28.0" stroke="#4a90d9" fill="none" fill-opacity="1" stroke-width="1.4" rx="0"/>
  <text x="441.0" y="132.0" fill="#4a90d9" font-size="11" text-anchor="middle">S<tspan font-size="0.72em" dy="3">base</tspan><tspan dy="-3"> </tspan></text>
  <rect x="506.0" y="114.0" width="94.0" height="28.0" stroke="#4a90d9" fill="none" fill-opacity="1" stroke-width="1.4" rx="0"/>
  <text x="553.0" y="132.0" fill="#4a90d9" font-size="11" text-anchor="middle">V<tspan font-size="0.72em" dy="3">base</tspan><tspan dy="-3"> </tspan></text>
  <line x1="441.0" y1="146.0" x2="468.0" y2="176.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="468.0,176.0 461.7,173.0 465.7,169.4" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <line x1="553.0" y1="146.0" x2="526.0" y2="176.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="526.0,176.0 528.3,169.4 532.3,173.0" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <rect x="424.0" y="178.0" width="146.0" height="28.0" stroke="#e0645c" fill="none" fill-opacity="1" stroke-width="1.4" rx="0"/>
  <text x="497.0" y="196.0" fill="#e0645c" font-size="9" text-anchor="middle">I<tspan font-size="0.72em" dy="3">base</tspan><tspan dy="-3"> = S</tspan><tspan font-size="0.72em" dy="3">base</tspan><tspan dy="-3">/(&#8730;3 V</tspan><tspan font-size="0.72em" dy="3">base</tspan><tspan dy="-3">)</tspan></text>
  <line x1="497.0" y1="210.0" x2="497.0" y2="234.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="497.0,234.0 494.3,227.6 499.7,227.6" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <rect x="424.0" y="236.0" width="146.0" height="28.0" stroke="#e0645c" fill="none" fill-opacity="1" stroke-width="1.4" rx="0"/>
  <text x="497.0" y="254.0" fill="#e0645c" font-size="9" text-anchor="middle">Z<tspan font-size="0.72em" dy="3">base</tspan><tspan dy="-3"> = V</tspan><tspan font-size="0.72em" dy="3">base</tspan><tspan font-size="0.72em" dy="-7">2</tspan><tspan dy="4">/S</tspan><tspan font-size="0.72em" dy="3">base</tspan><tspan dy="-3"> </tspan></text>
  <text x="497.0" y="288.0" fill="#8a8a8a" font-size="11" text-anchor="middle">choose two, derive two</text>
  <text x="497.0" y="308.0" fill="#8a8a8a" font-size="10" text-anchor="middle">V is line-to-line, S is three-phase</text>
</svg>
