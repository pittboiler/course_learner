<svg viewBox="0 0 660 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Left: three balanced sets that add to any unbalanced one.   Right: zero sequence needs a ground at both ends.</text>
  <line x1="80.0" y1="124.0" x2="120.0" y2="124.0" stroke="#4a90d9" stroke-width="1.8"/>
  <polygon points="120.0,124.0 113.6,126.7 113.6,121.3" stroke="#4a90d9" fill="#4a90d9" fill-opacity="1" stroke-width="0.5"/>
  <text x="131.0" y="128.0" fill="#4a90d9" font-size="9" text-anchor="middle">a</text>
  <line x1="80.0" y1="124.0" x2="60.0" y2="158.6" stroke="#4a90d9" stroke-width="1.8"/>
  <polygon points="60.0,158.6 60.9,151.7 65.6,154.4" stroke="#4a90d9" fill="#4a90d9" fill-opacity="1" stroke-width="0.5"/>
  <text x="54.5" y="172.2" fill="#4a90d9" font-size="9" text-anchor="middle">b</text>
  <line x1="80.0" y1="124.0" x2="60.0" y2="89.4" stroke="#4a90d9" stroke-width="1.8"/>
  <polygon points="60.0,89.4 65.6,93.6 60.9,96.3" stroke="#4a90d9" fill="#4a90d9" fill-opacity="1" stroke-width="0.5"/>
  <text x="54.5" y="83.8" fill="#4a90d9" font-size="9" text-anchor="middle">c</text>
  <text x="80.0" y="192.0" fill="#4a90d9" font-size="10" text-anchor="middle">positive (a&#8211;b&#8211;c)</text>
  <line x1="200.0" y1="124.0" x2="240.0" y2="124.0" stroke="#e0645c" stroke-width="1.8"/>
  <polygon points="240.0,124.0 233.6,126.7 233.6,121.3" stroke="#e0645c" fill="#e0645c" fill-opacity="1" stroke-width="0.5"/>
  <text x="251.0" y="128.0" fill="#e0645c" font-size="9" text-anchor="middle">a</text>
  <line x1="200.0" y1="124.0" x2="180.0" y2="89.4" stroke="#e0645c" stroke-width="1.8"/>
  <polygon points="180.0,89.4 185.6,93.6 180.9,96.3" stroke="#e0645c" fill="#e0645c" fill-opacity="1" stroke-width="0.5"/>
  <text x="174.5" y="83.8" fill="#e0645c" font-size="9" text-anchor="middle">b</text>
  <line x1="200.0" y1="124.0" x2="180.0" y2="158.6" stroke="#e0645c" stroke-width="1.8"/>
  <polygon points="180.0,158.6 180.9,151.7 185.6,154.4" stroke="#e0645c" fill="#e0645c" fill-opacity="1" stroke-width="0.5"/>
  <text x="174.5" y="172.2" fill="#e0645c" font-size="9" text-anchor="middle">c</text>
  <text x="200.0" y="192.0" fill="#e0645c" font-size="10" text-anchor="middle">negative (a&#8211;c&#8211;b)</text>
  <line x1="296.0" y1="128.0" x2="336.0" y2="128.0" stroke="#8a8a8a" stroke-width="1.8"/>
  <polygon points="336.0,128.0 329.6,130.7 329.6,125.3" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <line x1="300.0" y1="124.0" x2="340.0" y2="124.0" stroke="#8a8a8a" stroke-width="1.8"/>
  <polygon points="340.0,124.0 333.6,126.7 333.6,121.3" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <line x1="304.0" y1="120.0" x2="344.0" y2="120.0" stroke="#8a8a8a" stroke-width="1.8"/>
  <polygon points="344.0,120.0 337.6,122.7 337.6,117.3" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <text x="320.0" y="164.0" fill="#8a8a8a" font-size="10" text-anchor="middle">zero (all in phase)</text>
  <text x="184.0" y="232.0" fill="#8a8a8a" font-size="11" text-anchor="middle">any unbalanced set  =  the sum of the three</text>
  <text x="184.0" y="258.0" fill="#8a8a8a" font-size="10" text-anchor="middle">V<tspan font-size="0.72em" dy="3">0</tspan><tspan dy="-3"> = &#8531;(V</tspan><tspan font-size="0.72em" dy="3">a</tspan><tspan dy="-3">+V</tspan><tspan font-size="0.72em" dy="3">b</tspan><tspan dy="-3">+V</tspan><tspan font-size="0.72em" dy="3">c</tspan><tspan dy="-3">)</tspan></text>
  <text x="184.0" y="278.0" fill="#8a8a8a" font-size="10" text-anchor="middle">V<tspan font-size="0.72em" dy="3">1</tspan><tspan dy="-3"> = &#8531;(V</tspan><tspan font-size="0.72em" dy="3">a</tspan><tspan dy="-3">+aV</tspan><tspan font-size="0.72em" dy="3">b</tspan><tspan dy="-3">+a</tspan><tspan font-size="0.72em" dy="-4">2</tspan><tspan dy="4">V</tspan><tspan font-size="0.72em" dy="3">c</tspan><tspan dy="-3">)</tspan></text>
  <text x="184.0" y="298.0" fill="#8a8a8a" font-size="10" text-anchor="middle">V<tspan font-size="0.72em" dy="3">2</tspan><tspan dy="-3"> = &#8531;(V</tspan><tspan font-size="0.72em" dy="3">a</tspan><tspan dy="-3">+a</tspan><tspan font-size="0.72em" dy="-4">2</tspan><tspan dy="4">V</tspan><tspan font-size="0.72em" dy="3">b</tspan><tspan dy="-3">+aV</tspan><tspan font-size="0.72em" dy="3">c</tspan><tspan dy="-3">)</tspan></text>
  <text x="184.0" y="326.0" fill="#e0645c" font-size="11" text-anchor="middle">I<tspan font-size="0.72em" dy="3">n</tspan><tspan dy="-3"> = 3I</tspan><tspan font-size="0.72em" dy="3">0</tspan><tspan dy="-3">  &#8212; what a residual CT connection reads</tspan></text>
  <rect x="396.0" y="80.0" width="232.0" height="196.0" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="0.04" stroke-width="1" rx="6"/>
  <text x="512.0" y="104.0" fill="#8a8a8a" font-size="12" text-anchor="middle">zero-sequence path</text>
  <text x="410.0" y="130.0" fill="#4a90d9" font-size="10" text-anchor="start">Y<tspan font-size="0.72em" dy="3">g</tspan><tspan dy="-3">&#8211;Y</tspan><tspan font-size="0.72em" dy="3">g</tspan><tspan dy="-3"> </tspan></text>
  <text x="614.0" y="130.0" fill="#4a90d9" font-size="9" text-anchor="end">passes through</text>
  <text x="410.0" y="159.0" fill="#e0645c" font-size="10" text-anchor="start">Y<tspan font-size="0.72em" dy="3">g</tspan><tspan dy="-3">&#8211;&#916;</tspan></text>
  <text x="614.0" y="159.0" fill="#e0645c" font-size="9" text-anchor="end">circulates in the &#916;</text>
  <text x="410.0" y="188.0" fill="#8a8a8a" font-size="10" text-anchor="start">Y&#8211;&#916; (ungrounded Y)</text>
  <text x="614.0" y="188.0" fill="#8a8a8a" font-size="9" text-anchor="end">blocked</text>
  <text x="410.0" y="217.0" fill="#8a8a8a" font-size="10" text-anchor="start">&#916;&#8211;&#916;</text>
  <text x="614.0" y="217.0" fill="#8a8a8a" font-size="9" text-anchor="end">blocked</text>
  <text x="410.0" y="246.0" fill="#8a8a8a" font-size="10" text-anchor="start">Y<tspan font-size="0.72em" dy="3">g</tspan><tspan dy="-3">&#8211;Y (one grounded)</tspan></text>
  <text x="614.0" y="246.0" fill="#8a8a8a" font-size="9" text-anchor="end">blocked</text>
  <text x="396.0" y="298.0" fill="#e0645c" font-size="10" text-anchor="start">a neutral impedance Z<tspan font-size="0.72em" dy="3">n</tspan><tspan dy="-3"> appears as 3Z</tspan><tspan font-size="0.72em" dy="3">n</tspan><tspan dy="-3"> </tspan></text>
  <text x="396.0" y="318.0" fill="#8a8a8a" font-size="10" text-anchor="start">a line&#8217;s Z<tspan font-size="0.72em" dy="3">0</tspan><tspan dy="-3"> is 2&#8211;3.5 &#215; its Z</tspan><tspan font-size="0.72em" dy="3">1</tspan><tspan dy="-3"> </tspan></text>
  <text x="396.0" y="338.0" fill="#8a8a8a" font-size="10" text-anchor="start">a generator&#8217;s Z<tspan font-size="0.72em" dy="3">0</tspan><tspan dy="-3"> is small (leakage only)</tspan></text>
  <text x="30.0" y="404.0" fill="#8a8a8a" font-size="10" text-anchor="start">In a symmetric network the three sequences do not interact &#8212; one coupled problem becomes three simple ones.</text>
</svg>
