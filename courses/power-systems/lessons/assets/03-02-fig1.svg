  <text x="428.0" y="312.0" fill="#e0645c" font-size="11" text-anchor="middle">equations</text>
  <text x="232.0" y="334.0" fill="#8a8a8a" font-size="10" text-anchor="middle">&#952; at every non-slack bus:  N&#8722;1</text>
  <text x="232.0" y="354.0" fill="#8a8a8a" font-size="10" text-anchor="middle">|V| at every PQ bus:  N<tspan font-size="0.72em" dy="3">PQ</tspan><tspan dy="-3"> </tspan></text>
  <text x="428.0" y="334.0" fill="#8a8a8a" font-size="10" text-anchor="middle">P at every non-slack bus:  N&#8722;1</text>
  <text x="428.0" y="354.0" fill="#8a8a8a" font-size="10" text-anchor="middle">Q at every PQ bus:  N<tspan font-size="0.72em" dy="3">PQ</tspan><tspan dy="-3"> </tspan></text>
  <text x="330.0" y="340.0" fill="#8a8a8a" font-size="20" text-anchor="middle">=</text>
  <text x="30.0" y="396.0" fill="#8a8a8a" font-size="11" text-anchor="start">S<tspan font-size="0.72em" dy="3">i</tspan><tspan dy="-3"> = V</tspan><tspan font-size="0.72em" dy="3">i</tspan><tspan dy="-3">(&#931;</tspan><tspan font-size="0.72em" dy="3">k</tspan><tspan dy="-3"> Y</tspan><tspan font-size="0.72em" dy="3">ik</tspan><tspan dy="-3">V</tspan><tspan font-size="0.72em" dy="3">k</tspan><tspan dy="-3">)*  &#8212; substituting S = VI* is what makes the problem nonlinear.</tspan></text>
</svg>
