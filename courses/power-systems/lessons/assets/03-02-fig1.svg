  <text x="72.0" y="221.0" fill="#8a8a8a" font-size="9" text-anchor="middle">unknown: P, Q</text>
  <line x1="162.0" y1="126.0" x2="222.0" y2="126.0" stroke="#8a8a8a" stroke-width="3"/>
