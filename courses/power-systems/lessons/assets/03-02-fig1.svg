<svg viewBox="0 0 660 410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Every bus carries the same four quantities; only which pair is specified changes.</text>
