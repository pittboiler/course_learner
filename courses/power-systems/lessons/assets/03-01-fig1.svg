  <rect x="448.0" y="162.0" width="92.0" height="52.0" stroke="#8a8a8a" fill="#4a90d9" fill-opacity="0.15" stroke-width="1" rx="0"/>
  <text x="494.0" y="192.0" fill="#4a90d9" font-size="11" text-anchor="middle">Y<tspan font-size="0.72em" dy="3">22</tspan><tspan dy="-3"> </tspan></text>
  <rect x="540.0" y="162.0" width="92.0" height="52.0" stroke="#8a8a8a" fill="#e0645c" fill-opacity="0.07" stroke-width="1" rx="0"/>
  <text x="586.0" y="192.0" fill="#e0645c" font-size="11" text-anchor="middle">Y<tspan font-size="0.72em" dy="3">23</tspan><tspan dy="-3"> </tspan></text>
  <rect x="356.0" y="214.0" width="92.0" height="52.0" stroke="#8a8a8a" fill="#e0645c" fill-opacity="0.07" stroke-width="1" rx="0"/>
  <text x="402.0" y="244.0" fill="#e0645c" font-size="11" text-anchor="middle">Y<tspan font-size="0.72em" dy="3">31</tspan><tspan dy="-3"> </tspan></text>
  <rect x="448.0" y="214.0" width="92.0" height="52.0" stroke="#8a8a8a" fill="#e0645c" fill-opacity="0.07" stroke-width="1" rx="0"/>
  <text x="494.0" y="244.0" fill="#e0645c" font-size="11" text-anchor="middle">Y<tspan font-size="0.72em" dy="3">32</tspan><tspan dy="-3"> </tspan></text>
  <rect x="540.0" y="214.0" width="92.0" height="52.0" stroke="#8a8a8a" fill="#4a90d9" fill-opacity="0.15" stroke-width="1" rx="0"/>
  <text x="586.0" y="244.0" fill="#4a90d9" font-size="11" text-anchor="middle">Y<tspan font-size="0.72em" dy="3">33</tspan><tspan dy="-3"> </tspan></text>
  <text x="494.0" y="94.0" fill="#8a8a8a" font-size="13" text-anchor="middle">Y<tspan font-size="0.72em" dy="3">bus</tspan><tspan dy="-3"> </tspan></text>
  <text x="356.0" y="294.0" fill="#4a90d9" font-size="10" text-anchor="start">diagonal: sum of everything touching that bus</text>
  <text x="356.0" y="312.0" fill="#e0645c" font-size="10" text-anchor="start">off-diagonal: &#8722; the direct branch admittance</text>
  <text x="356.0" y="330.0" fill="#8a8a8a" font-size="10" text-anchor="start">row sum: the shunt at that bus (a free check)</text>
  <text x="356.0" y="348.0" fill="#8a8a8a" font-size="10" text-anchor="start">zero wherever two buses are not connected</text>
  <text x="30.0" y="388.0" fill="#8a8a8a" font-size="11" text-anchor="start">A line outage changes exactly four entries &#8212; which is why contingency screening is cheap.</text>
</svg>
