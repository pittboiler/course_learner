  <text x="206.0" y="298.0" fill="#8a8a8a" font-size="10" text-anchor="middle">bus 3</text>
  <line x1="130.0" y1="116.0" x2="66.0" y2="258.0" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="82.0" y="191.0" fill="#4a90d9" font-size="10" text-anchor="middle">z<tspan font-size="0.72em" dy="3">12</tspan><tspan dy="-3"> </tspan></text>
  <line x1="66.0" y1="258.0" x2="206.0" y2="258.0" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="136.0" y="278.0" fill="#4a90d9" font-size="10" text-anchor="middle">z<tspan font-size="0.72em" dy="3">23</tspan><tspan dy="-3"> </tspan></text>
  <line x1="130.0" y1="116.0" x2="206.0" y2="258.0" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="184.0" y="191.0" fill="#4a90d9" font-size="10" text-anchor="middle">z<tspan font-size="0.72em" dy="3">13</tspan><tspan dy="-3"> </tspan></text>
  <line x1="114.0" y1="116.0" x2="114.0" y2="94.0" stroke="#e0645c" stroke-width="1.2"/>
