  <line x1="50.0" y1="258.0" x2="50.0" y2="280.0" stroke="#e0645c" stroke-width="1.2"/>
  <line x1="82.0" y1="258.0" x2="82.0" y2="280.0" stroke="#e0645c" stroke-width="1.2"/>
  <text x="66.0" y="320.0" fill="#e0645c" font-size="9" text-anchor="middle">y<tspan font-size="0.72em" dy="3">sh</tspan><tspan dy="-3">/2</tspan></text>
  <line x1="190.0" y1="258.0" x2="190.0" y2="280.0" stroke="#e0645c" stroke-width="1.2"/>
  <line x1="222.0" y1="258.0" x2="222.0" y2="280.0" stroke="#e0645c" stroke-width="1.2"/>
  <text x="206.0" y="320.0" fill="#e0645c" font-size="9" text-anchor="middle">y<tspan font-size="0.72em" dy="3">sh</tspan><tspan dy="-3">/2</tspan></text>
  <text x="136.0" y="350.0" fill="#8a8a8a" font-size="10" text-anchor="middle">half the line charging goes to ground at each end</text>
  <rect x="356.0" y="110.0" width="92.0" height="52.0" stroke="#8a8a8a" fill="#4a90d9" fill-opacity="0.15" stroke-width="1" rx="0"/>
  <text x="402.0" y="140.0" fill="#4a90d9" font-size="11" text-anchor="middle">Y<tspan font-size="0.72em" dy="3">11</tspan><tspan dy="-3"> </tspan></text>
  <rect x="448.0" y="110.0" width="92.0" height="52.0" stroke="#8a8a8a" fill="#e0645c" fill-opacity="0.07" stroke-width="1" rx="0"/>
  <text x="494.0" y="140.0" fill="#e0645c" font-size="11" text-anchor="middle">Y<tspan font-size="0.72em" dy="3">12</tspan><tspan dy="-3"> </tspan></text>
  <rect x="540.0" y="110.0" width="92.0" height="52.0" stroke="#8a8a8a" fill="#e0645c" fill-opacity="0.07" stroke-width="1" rx="0"/>
  <text x="586.0" y="140.0" fill="#e0645c" font-size="11" text-anchor="middle">Y<tspan font-size="0.72em" dy="3">13</tspan><tspan dy="-3"> </tspan></text>
  <rect x="356.0" y="162.0" width="92.0" height="52.0" stroke="#8a8a8a" fill="#e0645c" fill-opacity="0.07" stroke-width="1" rx="0"/>
