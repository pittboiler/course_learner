  <text x="130.0" y="105.0" fill="#8a8a8a" font-size="10" text-anchor="middle">bus 1</text>
  <line x1="38.0" y1="258.0" x2="94.0" y2="258.0" stroke="#8a8a8a" stroke-width="3.2"/>
  <text x="66.0" y="298.0" fill="#8a8a8a" font-size="10" text-anchor="middle">bus 2</text>
