<svg viewBox="0 0 660 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Left: the algorithm.   Right: linear convergence is a straight line on a log plot.</text>
  <rect x="72.0" y="64.0" width="186.0" height="28.0" stroke="#4a90d9" fill="#4a90d9" fill-opacity="0.06" stroke-width="1.3" rx="4"/>
  <text x="165.0" y="82.0" fill="#4a90d9" font-size="10" text-anchor="middle">flat start: V = 1.0&#8736;0&#176;</text>
  <line x1="165.0" y1="92.0" x2="165.0" y2="110.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="165.0,110.0 162.3,103.6 167.7,103.6" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <rect x="72.0" y="110.0" width="186.0" height="26.0" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="0.06" stroke-width="1.3" rx="4"/>
  <text x="165.0" y="127.0" fill="#8a8a8a" font-size="10" text-anchor="middle">for each non-slack bus:</text>
  <line x1="165.0" y1="136.0" x2="165.0" y2="152.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="165.0,152.0 162.3,145.6 167.7,145.6" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <rect x="50.0" y="152.0" width="104.0" height="54.0" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="0.06" stroke-width="1.3" rx="4"/>
  <text x="102.0" y="176.0" fill="#8a8a8a" font-size="10" text-anchor="middle">PQ:</text>
  <text x="102.0" y="190.0" fill="#8a8a8a" font-size="10" text-anchor="middle">one update</text>
  <rect x="174.0" y="152.0" width="110.0" height="54.0" stroke="#e0645c" fill="#e0645c" fill-opacity="0.06" stroke-width="1.3" rx="4"/>
  <text x="229.0" y="169.0" fill="#e0645c" font-size="9" text-anchor="middle">PV: find Q,</text>
  <text x="229.0" y="183.0" fill="#e0645c" font-size="9" text-anchor="middle">check limits,</text>
  <text x="229.0" y="197.0" fill="#e0645c" font-size="9" text-anchor="middle">update, reset |V|</text>
  <line x1="102.0" y1="206.0" x2="165.0" y2="228.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <line x1="229.0" y1="206.0" x2="165.0" y2="228.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <rect x="72.0" y="228.0" width="186.0" height="26.0" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="0.06" stroke-width="1.3" rx="4"/>
  <text x="165.0" y="245.0" fill="#8a8a8a" font-size="10" text-anchor="middle">max mismatch &#60; &#949; ?</text>
  <line x1="60.0" y1="241.0" x2="72.0" y2="241.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <line x1="60.0" y1="241.0" x2="60.0" y2="123.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <line x1="60.0" y1="123.0" x2="72.0" y2="123.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="72.0,123.0 65.6,125.7 65.6,120.3" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <text x="44.0" y="186.0" fill="#8a8a8a" font-size="10" text-anchor="middle">no</text>
  <line x1="165.0" y1="254.0" x2="165.0" y2="276.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="165.0,276.0 162.3,269.6 167.7,269.6" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <text x="174.0" y="270.0" fill="#8a8a8a" font-size="10" text-anchor="start">yes</text>
  <rect x="58.0" y="276.0" width="214.0" height="44.0" stroke="#4a90d9" fill="#4a90d9" fill-opacity="0.06" stroke-width="1.3" rx="4"/>
  <text x="165.0" y="295.0" fill="#4a90d9" font-size="10" text-anchor="middle">slack power, line flows,</text>
  <text x="165.0" y="309.0" fill="#4a90d9" font-size="10" text-anchor="middle">losses</text>
  <text x="165.0" y="346.0" fill="#e0645c" font-size="11" text-anchor="middle">V<tspan font-size="0.72em" dy="3">i</tspan><tspan dy="-3"> = (S</tspan><tspan font-size="0.72em" dy="3">i</tspan><tspan dy="-3">*/V</tspan><tspan font-size="0.72em" dy="3">i</tspan><tspan dy="-3">* &#8722; &#931;</tspan><tspan font-size="0.72em" dy="3">k&#8800;i</tspan><tspan dy="-3"> Y</tspan><tspan font-size="0.72em" dy="3">ik</tspan><tspan dy="-3">V</tspan><tspan font-size="0.72em" dy="3">k</tspan><tspan dy="-3">)/Y</tspan><tspan font-size="0.72em" dy="3">ii</tspan><tspan dy="-3"> </tspan></text>
  <text x="165.0" y="368.0" fill="#8a8a8a" font-size="10" text-anchor="middle">always use the newest V<tspan font-size="0.72em" dy="3">k</tspan><tspan dy="-3"> available</tspan></text>
  <line x1="406.0" y1="330.0" x2="616.0" y2="330.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="406.0" y1="330.0" x2="406.0" y2="90.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="511.0" y="352.0" fill="#8a8a8a" font-size="10" text-anchor="middle">iteration</text>
  <text x="408.0" y="82.0" fill="#8a8a8a" font-size="10" text-anchor="start">max mismatch (log)</text>
  <path d="M 406.00 107.47 L 429.33 131.62 L 452.67 155.76 L 476.00 179.91 L 499.33 204.06 L 522.67 228.20 L 546.00 252.35 L 569.33 276.50 L 592.67 300.64" stroke="#8a8a8a" fill="none" fill-opacity="1" stroke-width="2"/>
  <text x="614.0" y="292.6" fill="#8a8a8a" font-size="10" text-anchor="end">Gauss&#8211;Seidel</text>
  <path d="M 406.00 107.47 L 429.33 134.93 L 452.67 183.93 L 476.00 281.47 L 499.33 322.90" stroke="#4a90d9" fill="none" fill-opacity="1" stroke-width="2.2"/>
  <text x="450.0" y="261.3" fill="#4a90d9" font-size="10" text-anchor="start">Newton&#8211;Raphson</text>
  <line x1="406.0" y1="199.8" x2="616.0" y2="199.8" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="618.0" y="203.8" fill="#e0645c" font-size="9" text-anchor="end">10<tspan font-size="0.72em" dy="-4">&#8722;4</tspan><tspan dy="4"> </tspan></text>
  <text x="406.0" y="342.0" fill="#8a8a8a" font-size="9" text-anchor="middle">0</text>
  <text x="476.0" y="342.0" fill="#8a8a8a" font-size="9" text-anchor="middle">3</text>
  <text x="546.0" y="342.0" fill="#8a8a8a" font-size="9" text-anchor="middle">6</text>
  <text x="616.0" y="342.0" fill="#8a8a8a" font-size="9" text-anchor="middle">9</text>
  <text x="300.0" y="398.0" fill="#8a8a8a" font-size="11" text-anchor="middle">Each GS sweep buys about one digit; each Newton step doubles them.</text>
</svg>
