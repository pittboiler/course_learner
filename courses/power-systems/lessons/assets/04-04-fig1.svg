  <line x1="522.0" y1="160.0" x2="522.0" y2="232.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="390.0" y="264.0" fill="#e0645c" font-size="9" text-anchor="start">with infeed at bus B the apparent Z grows:</text>
  <rect x="390.0" y="272.0" width="88.0" height="11.0" stroke="#e0645c" fill="#e0645c" fill-opacity="0.2" stroke-width="1.2" rx="2"/>
  <text x="486.0" y="281.0" fill="#e0645c" font-size="9" text-anchor="start">Zone 2 now reaches only ~17% of BC</text>
  <text x="390.0" y="312.0" fill="#e0645c" font-size="10" text-anchor="start">Z<tspan font-size="0.72em" dy="3">app</tspan><tspan dy="-3"> = Z</tspan><tspan font-size="0.72em" dy="3">L1</tspan><tspan dy="-3"> + (1 + I</tspan><tspan font-size="0.72em" dy="3">infeed</tspan><tspan dy="-3">/I</tspan><tspan font-size="0.72em" dy="3">relay</tspan><tspan dy="-3">)Z</tspan><tspan font-size="0.72em" dy="3">L2</tspan><tspan dy="-3"> </tspan></text>
  <text x="390.0" y="338.0" fill="#8a8a8a" font-size="9" text-anchor="start">infeed always underreaches &#8212; safe, but</text>
  <text x="390.0" y="354.0" fill="#8a8a8a" font-size="9" text-anchor="start">backup coverage shrinks</text>
  <text x="30.0" y="456.0" fill="#8a8a8a" font-size="10" text-anchor="start">Selectivity by timing makes the source-end relay slowest; selectivity by measurement does not.</text>
