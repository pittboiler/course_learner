  <text x="156.6" y="277.5" fill="#8a8a8a" font-size="9" text-anchor="end">CTI</text>
  <text x="56.0" y="398.0" fill="#8a8a8a" font-size="9" text-anchor="start">the curves converge at high current, which limits</text>
  <text x="56.0" y="414.0" fill="#8a8a8a" font-size="9" text-anchor="start">how many relays can be stacked in series</text>
  <text x="498.0" y="74.0" fill="#8a8a8a" font-size="11" text-anchor="middle">distance zones from bus A</text>
