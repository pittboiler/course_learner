  <line x1="520.0" y1="182.0" x2="498.2" y2="144.3" stroke="#4a90d9" stroke-width="1.6"/>
  <polygon points="498.2,144.3 503.8,148.5 499.1,151.3" stroke="#4a90d9" fill="#4a90d9" fill-opacity="1" stroke-width="0.5"/>
