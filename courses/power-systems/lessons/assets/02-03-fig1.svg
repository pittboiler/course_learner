  <polygon points="310.0,122.0 291.0,155.0 329.0,155.0" stroke="#4a90d9" fill="none" fill-opacity="1" stroke-width="2"/>
  <polygon points="350.0,122.0 331.0,155.0 369.0,155.0" stroke="#e0645c" fill="none" fill-opacity="1" stroke-width="2"/>
  <text x="330.0" y="208.0" fill="#8a8a8a" font-size="8" text-anchor="middle">both sides trap</text>
  <text x="46.0" y="262.0" fill="#8a8a8a" font-size="10" text-anchor="start">Y&#8211;Y is avoided unless a delta tertiary is added.</text>
  <text x="46.0" y="282.0" fill="#8a8a8a" font-size="10" text-anchor="start">&#916;&#8211;Y is the workhorse: it steps up, grounds the HV side,</text>
  <text x="46.0" y="300.0" fill="#8a8a8a" font-size="10" text-anchor="start">and traps triplens in the delta.</text>
