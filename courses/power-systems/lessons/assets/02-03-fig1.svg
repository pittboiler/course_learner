  <path d="M 554 182 A 34 34 0 0 0 549.4 165.0" stroke="#8a8a8a" fill="none" fill-opacity="1" stroke-width="1.2"/>
  <text x="562.0" y="168.0" fill="#8a8a8a" font-size="10" text-anchor="start">30&#176;</text>
  <text x="520.0" y="290.0" fill="#8a8a8a" font-size="10" text-anchor="middle">&#916; side (red) leads Y side (blue) by 30&#176;</text>
  <text x="520.0" y="310.0" fill="#8a8a8a" font-size="10" text-anchor="middle">positive sequence: HV leads LV by 30&#176;</text>
  <text x="520.0" y="328.0" fill="#e0645c" font-size="10" text-anchor="middle">negative sequence: it lags by 30&#176;</text>
  <text x="30.0" y="388.0" fill="#8a8a8a" font-size="11" text-anchor="start">The shift is a convention with teeth: banks in parallel must share the same shift, or circulating current results.</text>
