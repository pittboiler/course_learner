<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="560" height="380" fill="#ffffff"/>

  <!-- title -->
  <text x="280" y="34" fill="#1a1a1a" font-size="18" text-anchor="middle">H = M &#8853; M&#8869;</text>

  <!-- the closed subspace M, drawn as a plane through the origin -->
  <polygon points="120,230 360,190 450,260 210,300"
           fill="#4a90d9" opacity="0.12"/>
  <polygon points="120,230 360,190 450,260 210,300"
           fill="none" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- M-perp: dashed normal line through the origin, perpendicular to the plane -->
  <line x1="130" y1="101" x2="155" y2="290" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 5"/>
  <text x="112" y="98" fill="#8a8a8a">M&#8869;</text>

  <!-- vector x from the origin -->
  <line x1="150" y1="250" x2="312" y2="95" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="312,95 307.5,107.6 299.2,99.0" fill="#4a90d9"/>

  <!-- projection Px: from origin to the foot, in the plane -->
  <line x1="150" y1="250" x2="330" y2="230" stroke="#1a1a1a" stroke-width="3"/>
  <polygon points="330,230 318.8,237.3 317.4,225.3" fill="#1a1a1a"/>

  <!-- residual x - Px, perpendicular to the plane -->
  <line x1="330" y1="230" x2="312" y2="95" stroke="#e0645c" stroke-width="3"/>

  <!-- right-angle mark at the foot Px -->
  <path d="M 330 230 L 328.2 216.1 L 314.3 217.6 L 316.1 231.5 Z"
        fill="none" stroke="#e0645c" stroke-width="1.3"/>

  <!-- origin -->
  <circle cx="150" cy="250" r="4.5" fill="#1a1a1a"/>
  <text x="128" y="262" fill="#1a1a1a">O</text>

  <!-- point x -->
  <circle cx="312" cy="95" r="4.5" fill="#4a90d9"/>
  <text x="320" y="90" fill="#4a90d9" font-style="italic">x</text>

  <!-- foot Px -->
  <circle cx="330" cy="230" r="4.5" fill="#1a1a1a"/>
  <text x="338" y="246" fill="#1a1a1a" font-style="italic">Px</text>

  <!-- residual label -->
  <text x="200" y="150" fill="#e0645c">x &#8722; Px &#8869; M</text>

  <!-- plane label -->
  <text x="360" y="292" fill="#1a1a1a" font-size="17" font-style="italic">M</text>
  <text x="240" y="292" fill="#8a8a8a" font-size="12">(closed subspace)</text>

  <!-- caption -->
  <text x="280" y="366" fill="#8a8a8a" font-style="italic" text-anchor="middle" font-size="13">The residual x &#8722; Px is perpendicular to M; its foot Px is the unique closest point.</text>
</svg>
