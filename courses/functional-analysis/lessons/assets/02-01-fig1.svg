<svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect x="0" y="0" width="620" height="400" fill="#ffffff"/>

  <text x="20" y="28" fill="#8a8a8a" font-style="italic">Cauchy–Schwarz: a shadow is never longer than the stick that casts it</text>

  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#1a1a1a"/>
    </marker>
    <marker id="headB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#4a90d9"/>
    </marker>
    <marker id="headR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#e0645c"/>
    </marker>
  </defs>

  <!-- line of y (extended, faint) -->
  <line x1="110" y1="320" x2="560" y2="274" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- projection segment along y (the shadow) -->
  <line x1="110" y1="320" x2="350" y2="295" stroke="#e0645c" stroke-width="6" opacity="0.35"/>

  <!-- vector y -->
  <line x1="110" y1="320" x2="500" y2="280" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#headB)"/>
  <text x="508" y="278" fill="#4a90d9" font-weight="bold">y</text>

  <!-- vector x -->
  <line x1="110" y1="320" x2="330" y2="100" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#head)"/>
  <text x="316" y="92" fill="#1a1a1a" font-weight="bold">x</text>

  <!-- dropped perpendicular from tip of x to line of y -->
  <line x1="330" y1="100" x2="350" y2="295" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- right-angle marker at the foot -->
  <polyline points="338,296 337,284 349,283" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>

  <!-- foot dot -->
  <circle cx="350" cy="295" r="3" fill="#e0645c"/>

  <!-- angle arc at origin -->
  <path d="M 165,314 A 55 55 0 0 0 149,281" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="150" y="302" fill="#1a1a1a" font-style="italic">θ</text>

  <!-- origin dot -->
  <circle cx="110" cy="320" r="3.5" fill="#1a1a1a"/>
  <text x="86" y="335" fill="#8a8a8a" font-size="12">O</text>

  <!-- shadow-length label -->
  <text x="150" y="360" fill="#e0645c" font-size="13" font-weight="bold">shadow = |⟨x,y⟩| / ‖y‖ = ‖x‖·cos θ</text>

  <!-- the inequality, boxed -->
  <rect x="360" y="326" width="240" height="56" rx="6" fill="#4a90d9" opacity="0.10" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="480" y="349" fill="#1a1a1a" text-anchor="middle" font-weight="bold">|⟨x, y⟩| ≤ ‖x‖ ‖y‖</text>
  <text x="480" y="370" fill="#8a8a8a" text-anchor="middle" font-size="12">equal ⟺ x, y parallel</text>
</svg>
