<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320">
  <rect x="0" y="0" width="460" height="320" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#1a1a1a" stroke="none">
    <!-- axes of the product space H x H -->
    <line x1="55" y1="275" x2="435" y2="275" stroke="#999999" stroke-width="1.5"/>
    <line x1="55" y1="275" x2="55" y2="30" stroke="#999999" stroke-width="1.5"/>
    <text x="425" y="295" font-size="14" font-style="italic" fill="#1a1a1a">H</text>
    <text x="24" y="42" font-size="14" font-style="italic" fill="#1a1a1a">H</text>
    <text x="352" y="293" font-size="11" fill="#888888">(input f)</text>
    <text x="12" y="60" font-size="11" fill="#888888">Af</text>
    <!-- the graph G(A) = {(f, Af)}: a curve that steepens without ceiling -->
    <path d="M 55 275 Q 220 260 300 175 T 340 40" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
    <!-- arrowhead: the graph shoots up unbounded -->
    <path d="M 340 40 l -6 12 l 12 0 z" fill="#1a1a1a"/>
    <text x="205" y="150" font-size="14" font-style="italic" fill="#1a1a1a">G(A) = {(f, Af)}</text>
    <text x="243" y="168" font-size="11" fill="#888888">closed set in H&#215;H</text>
    <!-- unboundedness annotation: bounded f, huge Af -->
    <line x1="320" y1="275" x2="320" y2="95" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3"/>
    <circle cx="320" cy="95" r="4" fill="#1a1a1a"/>
    <text x="330" y="90" font-size="12" font-style="italic" fill="#1a1a1a">||Af|| &#8594; &#8734;</text>
    <text x="330" y="106" font-size="11" fill="#888888">while ||f|| stays bounded</text>
    <!-- domain D(A): a dense but proper subset of the horizontal H -->
    <line x1="55" y1="299" x2="345" y2="299" stroke="#1a1a1a" stroke-width="2.5"/>
    <line x1="345" y1="299" x2="435" y2="299" stroke="#cccccc" stroke-width="2.5" stroke-dasharray="3 4"/>
    <text x="150" y="315" font-size="12" fill="#1a1a1a">D(A) dense, but D(A) &#8842; H</text>
  </g>
</svg>
