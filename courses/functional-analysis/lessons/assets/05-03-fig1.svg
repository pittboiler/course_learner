<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <rect x="0" y="0" width="480" height="300" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#1a1a1a" stroke="none">
    <!-- corner labels of the commuting square -->
    <text x="70" y="60" font-size="15">L&#178;(&#8477;)</text>
    <text x="360" y="60" font-size="15">L&#178;(&#8477;)</text>
    <text x="70" y="255" font-size="15">L&#178;(&#8477;)</text>
    <text x="360" y="255" font-size="15">L&#178;(&#8477;)</text>
    <text x="60" y="42" font-size="11" fill="#888888">position side</text>
    <text x="330" y="42" font-size="11" fill="#888888">position side</text>
    <text x="60" y="278" font-size="11" fill="#888888">momentum (Fourier) side</text>
    <!-- top arrow: P -->
    <line x1="135" y1="52" x2="355" y2="52" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M 355 52 l -12 -5 l 0 10 z" fill="#1a1a1a"/>
    <text x="205" y="42" font-size="14" font-style="italic">P = &#8722;i d/dx</text>
    <!-- bottom arrow: M_xi -->
    <line x1="135" y1="232" x2="355" y2="232" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M 355 232 l -12 -5 l 0 10 z" fill="#1a1a1a"/>
    <text x="205" y="252" font-size="14" font-style="italic">M&#958; : &#968;&#770; &#8614; &#958; &#968;&#770;</text>
    <!-- left vertical: F down -->
    <line x1="90" y1="72" x2="90" y2="232" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M 90 232 l -5 -12 l 10 0 z" fill="#1a1a1a"/>
    <text x="60" y="158" font-size="14" font-style="italic">F</text>
    <text x="42" y="174" font-size="10" fill="#888888">Fourier</text>
    <!-- right vertical: F down -->
    <line x1="390" y1="72" x2="390" y2="232" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M 390 232 l -5 -12 l 10 0 z" fill="#1a1a1a"/>
    <text x="400" y="158" font-size="14" font-style="italic">F</text>
    <!-- caption -->
    <text x="90" y="298" font-size="8" fill="#ffffff">.</text>
  </g>
  <g font-family="sans-serif" fill="#1a1a1a" stroke="none">
    <rect x="120" y="120" width="240" height="46" fill="#f2f2f2" stroke="#cccccc" stroke-width="1"/>
    <text x="140" y="142" font-size="14" font-style="italic">P = F&#8315;&#185; M&#958; F</text>
    <text x="140" y="160" font-size="11" fill="#555555">&#8658; &#963;(P) = &#963;(M&#958;) = &#8477;</text>
  </g>
</svg>
