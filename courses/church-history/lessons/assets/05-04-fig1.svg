<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Helvetica, Arial, sans-serif">
  <text x="400" y="26" font-size="16" text-anchor="middle" fill="#8a8a8a" font-weight="bold">The obediences of the Great Schism, c. 1390 (schematic)</text>
  <rect x="20" y="44" width="370" height="230" rx="8" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="205" y="70" font-size="15" text-anchor="middle" fill="#4a90d9" font-weight="bold">ROME: Urban VI, Boniface IX</text>
  <text x="40" y="100" font-size="13" fill="#8a8a8a">England</text>
  <text x="40" y="124" font-size="13" fill="#8a8a8a">Most of the Empire, with Bohemia</text>
  <text x="40" y="148" font-size="13" fill="#8a8a8a">Hungary and Poland</text>
  <text x="40" y="172" font-size="13" fill="#8a8a8a">Northern and central Italy</text>
  <text x="40" y="196" font-size="13" fill="#8a8a8a">Flanders</text>
  <text x="40" y="220" font-size="13" fill="#e0645c">Portugal (Roman from 1385)</text>
  <text x="40" y="244" font-size="13" fill="#e0645c">Naples (Roman from 1381, contested)</text>
  <rect x="410" y="44" width="370" height="230" rx="8" fill="none" stroke="#e0645c" stroke-width="2"/>
  <text x="595" y="70" font-size="15" text-anchor="middle" fill="#e0645c" font-weight="bold">AVIGNON: Clement VII</text>
  <text x="430" y="100" font-size="13" fill="#8a8a8a">France</text>
  <text x="430" y="124" font-size="13" fill="#8a8a8a">Scotland</text>
  <text x="430" y="148" font-size="13" fill="#8a8a8a">Savoy</text>
  <text x="430" y="172" font-size="13" fill="#8a8a8a">Castile (declared 1381)</text>
  <text x="430" y="196" font-size="13" fill="#8a8a8a">Aragon (declared 1387, after neutrality)</text>
  <text x="430" y="220" font-size="13" fill="#8a8a8a">Navarre (declared 1390)</text>
  <text x="430" y="244" font-size="13" fill="#e0645c">Naples under Joanna I, to 1381</text>
  <rect x="20" y="292" width="760" height="92" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="318" font-size="14" text-anchor="middle" fill="#8a8a8a" font-weight="bold">1409: Pisa adds a third line (Alexander V, then John XXIII)</text>
  <text x="400" y="344" font-size="13" text-anchor="middle" fill="#8a8a8a">Pisa draws France, England and much of the Empire and northern Italy;</text>
  <text x="400" y="366" font-size="13" text-anchor="middle" fill="#8a8a8a">Benedict XIII keeps the Spanish kingdoms and Scotland; Gregory XII keeps pockets.</text>
</svg>
