<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="380" fill="#ffffff"/>

  <!-- title -->
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Water-filling over parallel channels</text>

  <!-- baseline -->
  <line x1="40" y1="320" x2="600" y2="320" stroke="#1a1a1a" stroke-width="2"/>

  <!-- water level line (nu) -->
  <line x1="50" y1="162" x2="590" y2="162" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="600" y="167" text-anchor="start" font-size="15" font-style="italic" fill="#1a1a1a">&#957;</text>
  <text x="600" y="150" text-anchor="start" font-size="11" fill="#1a1a1a">level</text>

  <!-- Bin 1: N=1, water fills -->
  <rect x="60" y="162" width="80" height="113" fill="#cfe3f2" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="60" y="275" width="80" height="45" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="100" y="302" text-anchor="middle" font-size="13" fill="#1a1a1a">N&#8321;</text>
  <text x="100" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">P&#8321;</text>

  <!-- Bin 2: N=2.5, water fills -->
  <rect x="170" y="162" width="80" height="46" fill="#cfe3f2" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="170" y="208" width="80" height="112" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="210" y="270" text-anchor="middle" font-size="13" fill="#1a1a1a">N&#8322;</text>
  <text x="210" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">P&#8322;</text>

  <!-- Bin 3: N=4.5, DRY (floor above nu) -->
  <rect x="280" y="118" width="80" height="202" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="320" y="240" text-anchor="middle" font-size="13" fill="#1a1a1a">N&#8323;</text>
  <text x="320" y="108" text-anchor="middle" font-size="12" font-style="italic" fill="#1a1a1a">dry: P&#8323;=0</text>

  <!-- Bin 4: N=3, water fills a little -->
  <rect x="390" y="162" width="80" height="23" fill="#cfe3f2" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="390" y="185" width="80" height="135" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="430" y="258" text-anchor="middle" font-size="13" fill="#1a1a1a">N&#8324;</text>
  <text x="430" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">P&#8324;</text>

  <!-- Bin 5: N=1.5, water fills -->
  <rect x="500" y="162" width="80" height="90" fill="#cfe3f2" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="500" y="252" width="80" height="68" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="540" y="292" text-anchor="middle" font-size="13" fill="#1a1a1a">N&#8325;</text>
  <text x="540" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">P&#8325;</text>

  <!-- legend -->
  <rect x="150" y="348" width="18" height="14" fill="#cccccc" stroke="#1a1a1a" stroke-width="1"/>
  <text x="174" y="360" text-anchor="start" font-size="12" fill="#1a1a1a">noise floor N&#7522;</text>
  <rect x="320" y="348" width="18" height="14" fill="#cfe3f2" stroke="#1a1a1a" stroke-width="1"/>
  <text x="344" y="360" text-anchor="start" font-size="12" fill="#1a1a1a">power P&#7522; = (&#957; &#8722; N&#7522;)&#8314;</text>
</svg>
