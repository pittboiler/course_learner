<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="350" y="30" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Sphere packing in output space</text>

  <!-- Big box: all typical outputs -->
  <rect x="40" y="50" width="620" height="300" rx="12" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/>
  <text x="55" y="72" font-size="15" fill="#555555">Output typical set:  ~ 2^{n H(Y)} sequences</text>

  <!-- Noise balls: each codeword + its ~2^{nH(Y|X)} likely outputs -->
  <!-- row 1 -->
  <circle cx="130" cy="150" r="42" fill="#c9ddf0" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="130" cy="150" r="4" fill="#1a1a1a"/>
  <circle cx="255" cy="150" r="42" fill="#c9ddf0" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="255" cy="150" r="4" fill="#1a1a1a"/>
  <circle cx="380" cy="150" r="42" fill="#c9ddf0" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="380" cy="150" r="4" fill="#1a1a1a"/>
  <circle cx="505" cy="150" r="42" fill="#c9ddf0" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="505" cy="150" r="4" fill="#1a1a1a"/>
  <!-- row 2 -->
  <circle cx="192" cy="255" r="42" fill="#c9ddf0" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="192" cy="255" r="4" fill="#1a1a1a"/>
  <circle cx="317" cy="255" r="42" fill="#c9ddf0" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="317" cy="255" r="4" fill="#1a1a1a"/>
  <circle cx="442" cy="255" r="42" fill="#c9ddf0" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="442" cy="255" r="4" fill="#1a1a1a"/>
  <circle cx="580" cy="255" r="42" fill="#c9ddf0" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="580" cy="255" r="4" fill="#1a1a1a"/>

  <!-- callout: one codeword -->
  <text x="130" y="205" font-size="12" fill="#1a1a1a" text-anchor="middle">codeword x^n(m)</text>

  <!-- callout: one ball -->
  <line x1="505" y1="150" x2="600" y2="120" stroke="#1a1a1a" stroke-width="1"/>
  <text x="600" y="112" font-size="13" fill="#1a1a1a" text-anchor="middle">noise ball</text>
  <text x="600" y="128" font-size="12" fill="#555555" text-anchor="middle">~ 2^{n H(Y|X)} outputs</text>

  <text x="350" y="335" font-size="13" fill="#666666" text-anchor="middle">2^{nR} balls, one per message — disjoint, so decoding never confuses two messages</text>

  <!-- packing equation -->
  <text x="350" y="392" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold"># disjoint balls  ~  2^{n H(Y)} / 2^{n H(Y|X)}  =  2^{n(H(Y) - H(Y|X))}  =  2^{nC}</text>

  <text x="350" y="428" font-size="16" fill="#1a1a1a" text-anchor="middle">so 2^{nR} messages fit  &#8660;  R &lt; C</text>
</svg>
