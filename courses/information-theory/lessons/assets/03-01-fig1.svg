<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>

  <!-- title -->
  <text x="320" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">A discrete memoryless channel</text>

  <!-- column labels -->
  <text x="120" y="70" text-anchor="middle" font-size="14" fill="#1a1a1a">input  X</text>
  <text x="520" y="70" text-anchor="middle" font-size="14" fill="#1a1a1a">output  Y</text>

  <!-- channel box -->
  <rect x="240" y="95" width="160" height="210" rx="10" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="320" y="192" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">channel</text>
  <text x="320" y="216" text-anchor="middle" font-size="15" fill="#1a1a1a">p(y | x)</text>

  <!-- input nodes -->
  <circle cx="120" cy="140" r="20" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="120" y="146" text-anchor="middle" font-size="16" fill="#1a1a1a">0</text>
  <circle cx="120" cy="260" r="20" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="120" y="266" text-anchor="middle" font-size="16" fill="#1a1a1a">1</text>

  <!-- output nodes -->
  <circle cx="520" cy="140" r="20" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="520" y="146" text-anchor="middle" font-size="16" fill="#1a1a1a">0</text>
  <circle cx="520" cy="260" r="20" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="520" y="266" text-anchor="middle" font-size="16" fill="#1a1a1a">1</text>

  <!-- arrowhead marker -->
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- left stubs into the box -->
  <line x1="140" y1="140" x2="240" y2="140" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="140" y1="260" x2="240" y2="260" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- transition arrows from box edge to outputs -->
  <!-- 0 -> 0 (correct) -->
  <line x1="400" y1="140" x2="500" y2="140" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="450" y="132" text-anchor="middle" font-size="12" fill="#1a1a1a">p(0|0)</text>
  <!-- 0 -> 1 (crossover) -->
  <line x1="400" y1="150" x2="500" y2="250" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="470" y="205" text-anchor="middle" font-size="12" fill="#1a1a1a">p(1|0)</text>
  <!-- 1 -> 0 (crossover) -->
  <line x1="400" y1="250" x2="500" y2="150" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="470" y="240" text-anchor="middle" font-size="12" fill="#1a1a1a">p(0|1)</text>
  <!-- 1 -> 1 (correct) -->
  <line x1="400" y1="260" x2="500" y2="260" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="450" y="282" text-anchor="middle" font-size="12" fill="#1a1a1a">p(1|1)</text>

  <!-- caption -->
  <text x="320" y="340" text-anchor="middle" font-size="13" fill="#1a1a1a">solid = received correctly    dashed = corrupted by noise</text>
</svg>
