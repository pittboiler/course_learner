<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- divider -->
  <line x1="380" y1="70" x2="380" y2="370" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- ============ LEFT: BSC ============ -->
  <text x="190" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Binary Symmetric Channel</text>
  <text x="190" y="58" text-anchor="middle" font-size="14" fill="#555555">flip probability p</text>

  <text x="70" y="100" text-anchor="middle" font-size="13" fill="#555555">input X</text>
  <text x="310" y="100" text-anchor="middle" font-size="13" fill="#555555">output Y</text>

  <!-- straight arrows first (under nodes) -->
  <line x1="96" y1="135" x2="284" y2="135" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="96" y1="270" x2="284" y2="270" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- crossing arrows -->
  <line x1="92" y1="153" x2="286" y2="252" stroke="#b00000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="92" y1="252" x2="286" y2="153" stroke="#b00000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- input nodes -->
  <circle cx="70" cy="135" r="24" fill="#eef4ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="70" y="143" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">0</text>
  <circle cx="70" cy="270" r="24" fill="#eef4ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="70" y="278" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">1</text>
  <!-- output nodes -->
  <circle cx="310" cy="135" r="24" fill="#eef4ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="310" y="143" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">0</text>
  <circle cx="310" cy="270" r="24" fill="#eef4ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="310" y="278" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">1</text>

  <!-- labels -->
  <text x="190" y="127" text-anchor="middle" font-size="13" fill="#1a1a1a">1&#8722;p</text>
  <text x="190" y="288" text-anchor="middle" font-size="13" fill="#1a1a1a">1&#8722;p</text>
  <text x="150" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#b00000">p</text>
  <text x="150" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#b00000">p</text>

  <text x="190" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">C = 1 &#8722; H(p)</text>

  <!-- ============ RIGHT: BEC ============ -->
  <text x="570" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Binary Erasure Channel</text>
  <text x="570" y="58" text-anchor="middle" font-size="14" fill="#555555">erasure probability e</text>

  <text x="450" y="100" text-anchor="middle" font-size="13" fill="#555555">input X</text>
  <text x="690" y="100" text-anchor="middle" font-size="13" fill="#555555">output Y</text>

  <!-- arrows -->
  <line x1="476" y1="128" x2="664" y2="112" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="476" y1="278" x2="664" y2="294" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="476" y1="140" x2="662" y2="192" stroke="#c07800" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="476" y1="266" x2="662" y2="214" stroke="#c07800" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- input nodes -->
  <circle cx="450" cy="130" r="24" fill="#eef4ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="450" y="138" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">0</text>
  <circle cx="450" cy="280" r="24" fill="#eef4ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="450" y="288" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">1</text>
  <!-- output nodes -->
  <circle cx="690" cy="105" r="24" fill="#eef4ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="690" y="113" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">0</text>
  <circle cx="690" cy="203" r="24" fill="#fff3e0" stroke="#c07800" stroke-width="2.5"/>
  <text x="690" y="211" text-anchor="middle" font-size="22" font-weight="bold" fill="#c07800">?</text>
  <circle cx="690" cy="300" r="24" fill="#eef4ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="690" y="308" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">1</text>

  <!-- labels -->
  <text x="558" y="108" text-anchor="middle" font-size="13" fill="#1a1a1a">1&#8722;e</text>
  <text x="558" y="308" text-anchor="middle" font-size="13" fill="#1a1a1a">1&#8722;e</text>
  <text x="548" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#c07800">e</text>
  <text x="548" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#c07800">e</text>

  <text x="570" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">C = 1 &#8722; e</text>
</svg>
