<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">Markov chain: Z depends on X only through Y</text>

  <!-- Nodes -->
  <circle cx="130" cy="120" r="40" fill="#eef4ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="130" y="128" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a">X</text>
  <text x="130" y="182" text-anchor="middle" font-size="13" fill="#555555">source</text>

  <circle cx="360" cy="120" r="40" fill="#eef4ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="360" y="128" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a">Y</text>
  <text x="360" y="182" text-anchor="middle" font-size="13" fill="#555555">measurement</text>

  <circle cx="590" cy="120" r="40" fill="#eef4ff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="590" y="128" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a">Z</text>
  <text x="590" y="182" text-anchor="middle" font-size="13" fill="#555555">processed</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <line x1="172" y1="120" x2="318" y2="120" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="402" y1="120" x2="548" y2="120" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="245" y="108" text-anchor="middle" font-size="13" fill="#555555">p(y|x)</text>
  <text x="475" y="108" text-anchor="middle" font-size="13" fill="#555555">p(z|y)</text>

  <!-- Information funnel: only narrows -->
  <text x="360" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">information about X carried downstream</text>
  <polygon points="90,260 350,260 350,340 130,340" fill="#cfe0ff" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="370,270 630,270 590,330 410,330" fill="#e3edff" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="220" y="305" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">I(X;Y)</text>
  <text x="500" y="305" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">I(X;Z)</text>

  <text x="360" y="368" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">I(X;Y)  &#8805;  I(X;Z)   &#8212;   the funnel can only narrow</text>
</svg>
