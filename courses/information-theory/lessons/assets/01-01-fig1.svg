<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="480" height="360" fill="#ffffff"/>

  <!-- axes -->
  <line x1="60" y1="30" x2="60" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="60" y1="310" x2="455" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- y ticks -->
  <line x1="56" y1="310" x2="60" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="56" y1="170" x2="60" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="56" y1="30" x2="60" y2="30" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="50" y="314" font-size="13" fill="#1a1a1a" text-anchor="end">0</text>
  <text x="50" y="174" font-size="13" fill="#1a1a1a" text-anchor="end">0.5</text>
  <text x="50" y="34" font-size="13" fill="#1a1a1a" text-anchor="end">1</text>

  <!-- x ticks -->
  <line x1="60" y1="310" x2="60" y2="314" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="255" y1="310" x2="255" y2="314" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="450" y1="310" x2="450" y2="314" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="60" y="330" font-size="13" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="255" y="330" font-size="13" fill="#1a1a1a" text-anchor="middle">1/2</text>
  <text x="450" y="330" font-size="13" fill="#1a1a1a" text-anchor="middle">1</text>

  <!-- axis labels -->
  <text x="257" y="352" font-size="14" fill="#1a1a1a" text-anchor="middle">p  (probability of one outcome)</text>
  <text x="18" y="175" font-size="14" fill="#1a1a1a" text-anchor="middle" transform="rotate(-90 18 175)">H(p)  in bits</text>

  <!-- peak guide lines -->
  <line x1="255" y1="30" x2="255" y2="310" stroke="#999999" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="60" y1="30" x2="255" y2="30" stroke="#999999" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- H(p) curve -->
  <path d="M 60,310 L 79.5,229.8 L 99,178.7 L 138,107.9 L 177,63.2 L 216,38.1 L 255,30 L 294,38.1 L 333,63.2 L 372,107.9 L 411,178.7 L 430.5,229.8 L 450,310"
        fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- peak marker -->
  <circle cx="255" cy="30" r="3.5" fill="#1a1a1a"/>
  <text x="263" y="26" font-size="12" fill="#1a1a1a">max = 1 bit at p = 1/2</text>

  <!-- endpoint markers -->
  <circle cx="60" cy="310" r="3" fill="#1a1a1a"/>
  <circle cx="450" cy="310" r="3" fill="#1a1a1a"/>
  <text x="120" y="300" font-size="12" fill="#1a1a1a" text-anchor="middle">H = 0 (certain)</text>
</svg>
