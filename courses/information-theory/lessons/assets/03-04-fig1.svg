<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#1a1a1a" stroke="none">

    <!-- title -->
    <text x="360" y="32" font-size="16" font-weight="bold" text-anchor="middle">The capacity wall: error floor forced by the converse</text>

    <!-- axes -->
    <line x1="90" y1="340" x2="690" y2="340" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="90" y1="60" x2="90" y2="340" stroke="#1a1a1a" stroke-width="2"/>
    <text x="690" y="365" font-size="13" text-anchor="end">rate R  &#8594;</text>
    <text x="60" y="66" font-size="13">P&#8091;</text>
    <text x="60" y="345" font-size="12">0</text>
    <text x="60" y="64" font-size="12">1</text>

    <!-- R = C marker -->
    <line x1="237.5" y1="60" x2="237.5" y2="340" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="237.5" y="358" font-size="13" text-anchor="middle" font-weight="bold">C</text>

    <!-- reliable region (R < C): floor is 0 -->
    <line x1="90" y1="340" x2="237.5" y2="340" stroke="#1a1a1a" stroke-width="4"/>
    <text x="163" y="120" font-size="13" text-anchor="middle">R &lt; C</text>
    <text x="163" y="140" font-size="12" text-anchor="middle" font-style="italic">reliable</text>
    <text x="163" y="158" font-size="11" text-anchor="middle">(achievability, 3.3)</text>

    <!-- forbidden region under the floor curve -->
    <path d="M 237.5,340 L 274.4,284 L 311.25,247 L 348.1,220 L 385,200 L 458.75,172 L 532.5,153 L 680,130 L 680,340 Z"
          fill="#dcdcdc" stroke="none"/>

    <!-- floor curve  P_e >= 1 - C/R -->
    <path d="M 237.5,340 L 274.4,284 L 311.25,247 L 348.1,220 L 385,200 L 458.75,172 L 532.5,153 L 680,130"
          fill="none" stroke="#1a1a1a" stroke-width="3"/>

    <text x="500" y="260" font-size="14" text-anchor="middle" font-weight="bold">forbidden</text>
    <text x="500" y="280" font-size="12" text-anchor="middle" font-style="italic">no code lands here</text>
    <text x="470" y="120" font-size="14" text-anchor="middle">floor: P&#8091; &#8805; 1 &#8722; C/R</text>
    <text x="470" y="140" font-size="11" text-anchor="middle">(as n &#8594; &#8734;)</text>

  </g>
</svg>
