<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#1a1a1a" stroke="none">

    <!-- Left: the space of all sequences -->
    <text x="45" y="45" font-size="16" font-weight="bold">All |X|&#8319; sequences</text>
    <rect x="45" y="60" width="260" height="280" rx="8" fill="none" stroke="#1a1a1a" stroke-width="2"/>

    <!-- typical set blob -->
    <ellipse cx="175" cy="205" rx="100" ry="80" fill="#dcdcdc" stroke="#1a1a1a" stroke-width="2"/>
    <text x="175" y="195" font-size="14" font-weight="bold" text-anchor="middle">typical set A&#603;</text>
    <text x="175" y="215" font-size="13" text-anchor="middle">&#8776; 2^(nH) sequences</text>
    <text x="175" y="234" font-size="13" text-anchor="middle">probability &#8594; 1</text>

    <!-- atypical dots -->
    <circle cx="75" cy="95" r="2.5" fill="#1a1a1a"/>
    <circle cx="270" cy="105" r="2.5" fill="#1a1a1a"/>
    <circle cx="90" cy="320" r="2.5" fill="#1a1a1a"/>
    <circle cx="265" cy="310" r="2.5" fill="#1a1a1a"/>
    <circle cx="285" cy="200" r="2.5" fill="#1a1a1a"/>
    <text x="175" y="330" font-size="12" text-anchor="middle" font-style="italic">atypical rest: probability &#8594; 0</text>

    <!-- arrow -->
    <line x1="315" y1="200" x2="385" y2="200" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="385,200 373,194 373,206" fill="#1a1a1a"/>
    <text x="350" y="190" font-size="12" text-anchor="middle">encode</text>

    <!-- Right: the two-part codeword -->
    <text x="410" y="45" font-size="16" font-weight="bold">Two-part codeword</text>

    <!-- typical branch -->
    <text x="410" y="110" font-size="13" font-weight="bold">if typical:</text>
    <rect x="410" y="120" width="34" height="40" fill="#dcdcdc" stroke="#1a1a1a" stroke-width="2"/>
    <text x="427" y="145" font-size="15" text-anchor="middle">0</text>
    <rect x="444" y="120" width="240" height="40" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <text x="564" y="145" font-size="13" text-anchor="middle">index into A&#603; : &#8776; nH bits</text>
    <text x="427" y="178" font-size="11" text-anchor="middle">flag</text>

    <!-- atypical branch -->
    <text x="410" y="240" font-size="13" font-weight="bold">if atypical:</text>
    <rect x="410" y="250" width="34" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="427" y="275" font-size="15" text-anchor="middle">1</text>
    <rect x="444" y="250" width="240" height="40" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="564" y="275" font-size="13" text-anchor="middle">verbatim : &#8776; n&#183;log|X| bits</text>
    <text x="427" y="308" font-size="11" text-anchor="middle">flag</text>

    <!-- rate summary -->
    <line x1="410" y1="340" x2="684" y2="340" stroke="#1a1a1a" stroke-width="1"/>
    <text x="410" y="368" font-size="14" font-weight="bold">expected bits / symbol &#8594; H</text>
    <text x="410" y="388" font-size="12" font-style="italic">fallback almost never fires</text>
  </g>
</svg>
