<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14"><rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
  <text x="360" y="28" fill="#1a1a1a" text-anchor="middle" font-style="italic">The constraint you impose selects the max-entropy law.</text>

  <!-- ============ Panel 1: support only -> uniform ============ -->
  <line x1="40" y1="230" x2="220" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- uniform box on [a,b] -->
  <path d="M80 230 L80 130 L180 130 L180 230" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="80" y1="230" x2="180" y2="230" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="80" y="248" fill="#1a1a1a" text-anchor="middle" font-size="12">a</text>
  <text x="180" y="248" fill="#1a1a1a" text-anchor="middle" font-size="12">b</text>
  <text x="130" y="272" fill="#1a1a1a" text-anchor="middle" font-size="12">only a range</text>
  <text x="130" y="288" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-size="13">uniform</text>

  <!-- ============ Panel 2: fixed mean on [0,inf) -> exponential ============ -->
  <line x1="280" y1="230" x2="460" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M290 120 C 320 175 360 205 400 218 S 445 227 455 228" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="290" y1="230" x2="290" y2="120" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="290" y="248" fill="#1a1a1a" text-anchor="middle" font-size="12">0</text>
  <text x="370" y="272" fill="#1a1a1a" text-anchor="middle" font-size="12">mean on [0, &#8734;)</text>
  <text x="370" y="288" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-size="13">exponential</text>

  <!-- ============ Panel 3: fixed variance on R -> Gaussian ============ -->
  <line x1="500" y1="230" x2="700" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M510 228 C 560 226 578 135 600 135 C 622 135 640 226 690 228" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="600" y1="230" x2="600" y2="135" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="600" y="248" fill="#1a1a1a" text-anchor="middle" font-size="12">&#956;</text>
  <text x="600" y="272" fill="#1a1a1a" text-anchor="middle" font-size="12">variance on &#8477;</text>
  <text x="600" y="288" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-size="13">Gaussian</text>
</svg>
