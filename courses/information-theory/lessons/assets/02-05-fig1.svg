<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#1a1a1a" stroke="none">

    <text x="60" y="30" font-size="16" font-weight="bold">Encoding "b a c"   ( p(a)=.5, p(b)=.3, p(c)=.2 )</text>

    <!-- ===== Bar 1: [0,1) ===== -->
    <text x="30" y="70" font-size="12" text-anchor="end">0</text>
    <text x="690" y="70" font-size="12" text-anchor="start">1</text>
    <!-- segments -->
    <rect x="60"  y="55" width="310" height="34" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="370" y="55" width="186" height="34" fill="#dcdcdc" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="556" y="55" width="124" height="34" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="215" y="77" font-size="14" text-anchor="middle">a</text>
    <text x="463" y="77" font-size="14" text-anchor="middle" font-weight="bold">b</text>
    <text x="618" y="77" font-size="14" text-anchor="middle">c</text>

    <!-- zoom fan 1 -> 2 -->
    <line x1="370" y1="89" x2="60"  y2="150" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="556" y1="89" x2="680" y2="150" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="600" y="122" font-size="11" font-style="italic">zoom into b</text>

    <!-- ===== Bar 2: [0.5,0.8) ===== -->
    <text x="30" y="180" font-size="12" text-anchor="end">.5</text>
    <text x="690" y="180" font-size="12" text-anchor="start">.8</text>
    <rect x="60"  y="165" width="310" height="34" fill="#dcdcdc" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="370" y="165" width="186" height="34" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="556" y="165" width="124" height="34" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="215" y="187" font-size="14" text-anchor="middle" font-weight="bold">a</text>
    <text x="463" y="187" font-size="14" text-anchor="middle">b</text>
    <text x="618" y="187" font-size="14" text-anchor="middle">c</text>

    <!-- zoom fan 2 -> 3 -->
    <line x1="60"  y1="199" x2="60"  y2="260" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="370" y1="199" x2="680" y2="260" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="600" y="232" font-size="11" font-style="italic">zoom into a</text>

    <!-- ===== Bar 3: [0.5,0.65) ===== -->
    <text x="30" y="290" font-size="12" text-anchor="end">.5</text>
    <text x="690" y="290" font-size="12" text-anchor="start">.65</text>
    <rect x="60"  y="275" width="310" height="34" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="370" y="275" width="186" height="34" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="556" y="275" width="124" height="34" fill="#dcdcdc" stroke="#1a1a1a" stroke-width="2"/>
    <text x="215" y="297" font-size="14" text-anchor="middle">a</text>
    <text x="463" y="297" font-size="14" text-anchor="middle">b</text>
    <text x="618" y="297" font-size="14" text-anchor="middle" font-weight="bold">c</text>

    <!-- final interval callout -->
    <line x1="556" y1="315" x2="556" y2="345" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="680" y1="315" x2="680" y2="345" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="556" y1="345" x2="680" y2="345" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="618" y="365" font-size="12" text-anchor="middle" font-weight="bold">[.62, .65)</text>
    <text x="360" y="360" font-size="13" text-anchor="middle">final width = .3 &#215; .5 &#215; .2 = <tspan font-weight="bold">.03 = p("bac")</tspan></text>
    <text x="360" y="382" font-size="12" text-anchor="middle" font-style="italic">name any point inside &#8776; &#8722;log&#8322;(.03) &#8776; 5.06 bits</text>
  </g>
</svg>
