<svg viewBox="0 0 520 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="520" height="360" fill="#ffffff"/>

  <!-- the two overlapping circles; same tint so the overlap darkens on its own -->
  <circle cx="200" cy="165" r="120" fill="#4a90c2" fill-opacity="0.32" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="320" cy="165" r="120" fill="#4a90c2" fill-opacity="0.32" stroke="#1a1a1a" stroke-width="2"/>

  <!-- circle name tags, along the top of each disc -->
  <text x="150" y="80" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">H(X)</text>
  <text x="370" y="80" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">H(Y)</text>

  <!-- left crescent: only-X information -->
  <text x="135" y="170" font-size="16" fill="#1a1a1a" text-anchor="middle">H(X|Y)</text>
  <!-- right crescent: only-Y information -->
  <text x="385" y="170" font-size="16" fill="#1a1a1a" text-anchor="middle">H(Y|X)</text>

  <!-- overlap: mutual information -->
  <text x="260" y="162" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">I(X;Y)</text>
  <text x="260" y="182" font-size="11" fill="#1a1a1a" text-anchor="middle">(overlap)</text>

  <!-- union caption -->
  <line x1="140" y1="300" x2="160" y2="285" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="380" y1="300" x2="360" y2="285" stroke="#1a1a1a" stroke-width="1"/>
  <text x="260" y="330" font-size="14" fill="#1a1a1a" text-anchor="middle">whole shaded region  =  H(X, Y)</text>
</svg>
