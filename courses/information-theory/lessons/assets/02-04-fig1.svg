<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>

  <text x="380" y="26" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Huffman tree for p = (0.4, 0.2, 0.2, 0.1, 0.1)</text>
  <text x="380" y="46" font-size="13" fill="#666666" text-anchor="middle">built bottom-up by merging; codewords read top-down, root to leaf</text>

  <!-- edges -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <line x1="360" y1="62" x2="200" y2="150"/>
    <line x1="360" y1="62" x2="520" y2="150"/>
    <line x1="200" y1="157" x2="110" y2="262"/>
    <line x1="200" y1="157" x2="290" y2="262"/>
    <line x1="520" y1="157" x2="410" y2="262"/>
    <line x1="520" y1="157" x2="600" y2="237"/>
    <line x1="600" y1="247" x2="540" y2="357"/>
    <line x1="600" y1="247" x2="660" y2="357"/>
  </g>

  <!-- branch bit labels -->
  <g font-size="15" fill="#666666" font-weight="bold">
    <text x="272" y="100">0</text>
    <text x="442" y="100">1</text>
    <text x="146" y="208">0</text>
    <text x="248" y="208">1</text>
    <text x="452" y="208">0</text>
    <text x="566" y="196">1</text>
    <text x="558" y="304">0</text>
    <text x="632" y="304">1</text>
  </g>

  <!-- root (filled) -->
  <circle cx="360" cy="57" r="7" fill="#1a1a1a"/>
  <text x="360" y="42" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">root  1.0</text>

  <!-- internal nodes (hollow) with merged probabilities -->
  <circle cx="200" cy="152" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="200" y="138" font-size="13" fill="#1a1a1a" text-anchor="middle">0.4</text>
  <circle cx="520" cy="152" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="520" y="138" font-size="13" fill="#1a1a1a" text-anchor="middle">0.6</text>
  <circle cx="600" cy="242" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="622" y="234" font-size="13" fill="#1a1a1a" text-anchor="middle">0.2</text>

  <!-- merge-order badges -->
  <g>
    <circle cx="668" cy="242" r="10" fill="#1a1a1a"/>
    <text x="668" y="247" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
    <circle cx="168" cy="152" r="10" fill="#1a1a1a"/>
    <text x="168" y="157" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
    <circle cx="488" cy="152" r="10" fill="#1a1a1a"/>
    <text x="488" y="157" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
    <circle cx="392" cy="57" r="10" fill="#1a1a1a"/>
    <text x="392" y="62" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  </g>

  <!-- leaves = symbols (filled boxes): symbol + prob + codeword -->
  <g fill="#c9ddf0" stroke="#1a1a1a" stroke-width="2">
    <rect x="68" y="262" width="84" height="46" rx="5"/>
    <rect x="248" y="262" width="84" height="46" rx="5"/>
    <rect x="368" y="262" width="84" height="46" rx="5"/>
    <rect x="498" y="357" width="84" height="46" rx="5"/>
    <rect x="618" y="357" width="84" height="46" rx="5"/>
  </g>
  <g font-size="13" fill="#1a1a1a" text-anchor="middle">
    <text x="110" y="281">B  p=0.2</text>
    <text x="290" y="281">C  p=0.2</text>
    <text x="410" y="281">A  p=0.4</text>
    <text x="540" y="376">D  p=0.1</text>
    <text x="660" y="376">E  p=0.1</text>
  </g>
  <g font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">
    <text x="110" y="301">00</text>
    <text x="290" y="301">01</text>
    <text x="410" y="301">10</text>
    <text x="540" y="396">110</text>
    <text x="660" y="396">111</text>
  </g>

  <!-- merge-order legend -->
  <g font-size="13" fill="#1a1a1a">
    <text x="24" y="345" font-weight="bold">Merge order (always the two smallest):</text>
    <text x="24" y="366">1.  D + E = 0.2</text>
    <text x="24" y="384">2.  B + C = 0.4</text>
    <text x="24" y="402">3.  (D,E) + A = 0.6</text>
    <text x="24" y="420">4.  0.4 + 0.6 = 1.0</text>
  </g>
</svg>
