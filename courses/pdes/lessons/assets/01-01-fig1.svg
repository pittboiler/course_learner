<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="barrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a5fb4"/>
    </marker>
  </defs>

  <!-- horizontal guide lines for the two later snapshots -->
  <line x1="70" y1="215" x2="560" y2="215" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="70" y1="70"  x2="560" y2="70"  stroke="#cccccc" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- gray characteristics x - ct = const -->
  <line x1="200" y1="370" x2="330" y2="70" stroke="#9a9a9a" stroke-width="1.5"/>
  <line x1="280" y1="370" x2="410" y2="70" stroke="#9a9a9a" stroke-width="1.5"/>
  <line x1="360" y1="370" x2="490" y2="70" stroke="#9a9a9a" stroke-width="1.5"/>
  <line x1="440" y1="370" x2="570" y2="70" stroke="#9a9a9a" stroke-width="1.5"/>

  <!-- highlighted characteristic through the peak -->
  <line x1="120" y1="370" x2="255" y2="60" stroke="#1a5fb4" stroke-width="2.5" marker-end="url(#barrow)"/>

  <!-- axes -->
  <line x1="70" y1="370" x2="612" y2="370" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="70" y1="370" x2="70"  y2="42"  stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="618" y="375" font-size="18" fill="#1a1a1a" font-style="italic">x</text>
  <text x="56"  y="44"  font-size="18" fill="#1a1a1a" font-style="italic">t</text>

  <!-- t-level labels -->
  <text x="20" y="374" font-size="13" fill="#1a1a1a">t = 0</text>
  <text x="20" y="219" font-size="13" fill="#1a1a1a">t = t₁</text>
  <text x="20" y="74"  font-size="13" fill="#1a1a1a">t = t₂</text>

  <!-- the profile bumps sticking up out of each time-slice -->
  <path d="M78 370 C99 370 99 330 120 330 C141 330 141 370 162 370" fill="none" stroke="#b4321a" stroke-width="2.5"/>
  <path d="M143 215 C164 215 164 175 185 175 C206 175 206 215 227 215" fill="none" stroke="#b4321a" stroke-width="2.5"/>
  <path d="M208 70 C229 70 229 30 250 30 C271 30 271 70 292 70" fill="none" stroke="#b4321a" stroke-width="2.5"/>

  <!-- peak dots on the characteristic -->
  <circle cx="120" cy="370" r="3.5" fill="#1a5fb4"/>
  <circle cx="185" cy="215" r="3.5" fill="#1a5fb4"/>
  <circle cx="250" cy="70"  r="3.5" fill="#1a5fb4"/>

  <!-- labels -->
  <text x="150" y="322" font-size="13" fill="#b4321a">initial profile f(x)</text>
  <text x="300" y="150" font-size="13" fill="#1a5fb4">characteristic:</text>
  <text x="300" y="168" font-size="13" fill="#1a5fb4">x − ct = const</text>
  <text x="300" y="186" font-size="12" fill="#1a5fb4">(u constant along it)</text>
  <text x="196" y="248" font-size="13" fill="#1a1a1a">peak rides at speed c</text>
</svg>
