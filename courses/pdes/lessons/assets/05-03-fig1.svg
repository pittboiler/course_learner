<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="640" height="380" fill="#ffffff"/>

  <!-- unphysical lower half: faint shading -->
  <rect x="40" y="210" width="560" height="120" fill="#f0f0f0"/>

  <!-- the grounded plane (equipotential u = 0) -->
  <line x1="40" y1="210" x2="600" y2="210" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="470" y="230" fill="#1a1a1a" font-style="italic">grounded plane, u = 0</text>

  <!-- region labels -->
  <text x="52" y="60" fill="#1a1a1a" font-weight="bold">physical region (upper half)</text>
  <text x="52" y="264" fill="#8a8a8a" font-style="italic">unphysical: image lives here</text>

  <!-- field lines leaving the + source, meeting the plane at 90 degrees -->
  <g fill="none" stroke="#4a90d9" stroke-width="2">
    <line x1="320" y1="120" x2="320" y2="208"/>
    <path d="M320,120 Q250,150 250,208"/>
    <path d="M320,120 Q390,150 390,208"/>
    <path d="M320,120 Q188,158 188,208"/>
    <path d="M320,120 Q452,158 452,208"/>
  </g>
  <!-- arrowheads (field points into the plane) -->
  <g fill="#4a90d9">
    <polygon points="320,210 315,200 325,200"/>
    <polygon points="250,210 245,200 255,200"/>
    <polygon points="390,210 385,200 395,200"/>
    <polygon points="188,210 183,200 193,200"/>
    <polygon points="452,210 447,200 457,200"/>
  </g>

  <!-- fictitious mirror field lines below (dashed, faint) -->
  <g fill="none" stroke="#c9a9a9" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="320" y1="300" x2="320" y2="210"/>
    <path d="M320,300 Q250,270 250,212"/>
    <path d="M320,300 Q390,270 390,212"/>
  </g>

  <!-- the real source + -->
  <circle cx="320" cy="120" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="320" y="126" fill="#1a1a1a" text-anchor="middle" font-size="18" font-weight="bold">+</text>
  <text x="338" y="115" fill="#1a1a1a">source  +q  at height d</text>

  <!-- the image charge - -->
  <circle cx="320" cy="300" r="12" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="320" y="306" fill="#8a8a8a" text-anchor="middle" font-size="18" font-weight="bold">&#8722;</text>
  <text x="338" y="305" fill="#8a8a8a">image  &#8722;q  (fictitious)</text>

  <!-- distance markers d -->
  <line x1="150" y1="120" x2="150" y2="210" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="145" y1="120" x2="155" y2="120" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="145" y1="210" x2="155" y2="210" stroke="#1a1a1a" stroke-width="1"/>
  <text x="128" y="169" fill="#1a1a1a">d</text>
  <line x1="150" y1="210" x2="150" y2="300" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="145" y1="300" x2="155" y2="300" stroke="#8a8a8a" stroke-width="1"/>
  <text x="128" y="259" fill="#8a8a8a">d</text>

  <!-- caption -->
  <text x="52" y="360" fill="#8a8a8a" font-style="italic">The image is fictitious &#8212; only the upper half is physical. By symmetry the two fields cancel exactly on the plane, so u = 0 there for free.</text>
</svg>
