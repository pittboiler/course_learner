<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="sans-serif">
  <rect x="0" y="0" width="780" height="340" fill="#ffffff"/>
  <defs>
    <marker id="ink" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="acc" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1f5c8a"/>
    </marker>
  </defs>

  <!-- ===================== Panel A: hyperbolic ===================== -->
  <text x="30" y="26" font-size="13" font-weight="bold" fill="#1a1a1a">(a) Hyperbolic: domain of dependence</text>

  <!-- axes -->
  <line x1="45" y1="255" x2="255" y2="255" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ink)"/>
  <line x1="45" y1="255" x2="45" y2="70" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ink)"/>
  <text x="258" y="260" font-size="14" fill="#1a1a1a" font-style="italic">x</text>
  <text x="32" y="74" font-size="14" fill="#1a1a1a" font-style="italic">t</text>

  <!-- domain-of-dependence wedge -->
  <path d="M140,100 L95,255 L185,255 Z" fill="#1f5c8a" fill-opacity="0.12" stroke="none"/>
  <!-- two characteristics -->
  <line x1="140" y1="100" x2="95" y2="255" stroke="#1f5c8a" stroke-width="2.2"/>
  <line x1="140" y1="100" x2="185" y2="255" stroke="#1f5c8a" stroke-width="2.2"/>
  <!-- point P -->
  <circle cx="140" cy="100" r="4.5" fill="#1a1a1a"/>
  <text x="148" y="98" font-size="13" fill="#1a1a1a" font-style="italic">P = (x&#8320;, t&#8320;)</text>
  <!-- initial interval -->
  <line x1="95" y1="255" x2="185" y2="255" stroke="#1a1a1a" stroke-width="5"/>
  <circle cx="95" cy="255" r="3.5" fill="#1a1a1a"/>
  <circle cx="185" cy="255" r="3.5" fill="#1a1a1a"/>
  <text x="70" y="278" font-size="12.5" fill="#1a1a1a">data here (only!) sets</text>
  <text x="70" y="294" font-size="12.5" fill="#1a1a1a" font-style="italic">u at P</text>
  <text x="62" y="315" font-size="12" fill="#1f5c8a">signals travel at finite speed</text>

  <!-- ===================== Panel B: elliptic ===================== -->
  <text x="300" y="26" font-size="13" font-weight="bold" fill="#1a1a1a">(b) Elliptic: whole boundary decides</text>

  <!-- closed boundary -->
  <ellipse cx="400" cy="175" rx="85" ry="78" fill="#1f5c8a" fill-opacity="0.10" stroke="#1a1a1a" stroke-width="2.4"/>
  <text x="352" y="105" font-size="12.5" fill="#1a1a1a">data on all of &#8706;&#937;</text>
  <!-- interior point -->
  <circle cx="400" cy="180" r="4.5" fill="#1a1a1a"/>
  <text x="408" y="184" font-size="12.5" fill="#1a1a1a" font-style="italic">Q</text>
  <!-- inward arrows from boundary to Q -->
  <line x1="400" y1="99" x2="400" y2="168" stroke="#1f5c8a" stroke-width="1.8" marker-end="url(#acc)"/>
  <line x1="485" y1="175" x2="412" y2="179" stroke="#1f5c8a" stroke-width="1.8" marker-end="url(#acc)"/>
  <line x1="315" y1="175" x2="388" y2="179" stroke="#1f5c8a" stroke-width="1.8" marker-end="url(#acc)"/>
  <line x1="400" y1="253" x2="400" y2="192" stroke="#1f5c8a" stroke-width="1.8" marker-end="url(#acc)"/>
  <line x1="345" y1="120" x2="392" y2="171" stroke="#1f5c8a" stroke-width="1.6" marker-end="url(#acc)"/>
  <line x1="455" y1="120" x2="408" y2="171" stroke="#1f5c8a" stroke-width="1.6" marker-end="url(#acc)"/>
  <text x="322" y="300" font-size="12" fill="#1f5c8a">every boundary point influences Q</text>

  <!-- ===================== Panel C: ill-posed ===================== -->
  <text x="540" y="26" font-size="13" font-weight="bold" fill="#1a1a1a">(c) Ill-posed: tiny data explodes</text>

  <!-- axes -->
  <line x1="560" y1="255" x2="765" y2="255" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ink)"/>
  <line x1="670" y1="255" x2="670" y2="70" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ink)"/>
  <text x="757" y="272" font-size="14" fill="#1a1a1a" font-style="italic">x</text>
  <text x="656" y="74" font-size="14" fill="#1a1a1a" font-style="italic">y</text>

  <!-- diverging envelope (dashed) -->
  <path d="M670,255 Q665,180 615,95" fill="none" stroke="#1f5c8a" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M670,255 Q675,180 725,95" fill="none" stroke="#1f5c8a" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- growing oscillation, amplitude rises with y -->
  <polyline points="670,255 675,238 670,222 661,206 670,190 686,174 670,158 645,142 670,126 711,110 670,94"
            fill="none" stroke="#1f5c8a" stroke-width="2.4"/>

  <!-- labels -->
  <text x="600" y="284" font-size="12" fill="#1a1a1a">data at y=0:</text>
  <text x="600" y="300" font-size="12" fill="#1a1a1a" font-style="italic">(1/n) sin nx  &#8776; 0</text>
  <text x="596" y="120" font-size="12.5" fill="#1f5c8a" font-style="italic">grows like e</text>
  <text x="672" y="115" font-size="10" fill="#1f5c8a" font-style="italic">ny</text>
</svg>
