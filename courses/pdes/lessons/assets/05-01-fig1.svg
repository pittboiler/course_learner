<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>

  <!-- ================= LEFT: nascent delta — bumps of unit area narrowing to a spike ================= -->
  <text x="40" y="40" font-size="14" fill="#1a1a1a" font-weight="bold">Unit-area bumps narrow into a spike</text>

  <!-- baseline and axis -->
  <line x1="50" y1="310" x2="350" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="350,310 340,305 340,315" fill="#1a1a1a"/>
  <text x="342" y="330" font-size="14" fill="#1a1a1a">x</text>
  <line x1="200" y1="315" x2="200" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <text x="196" y="330" font-size="13" fill="#1a1a1a">0</text>

  <!-- wide short bump (height 70) -->
  <path d="M 90 310 Q 200 240 310 310" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="5 4"/>
  <!-- medium bump (height 120) -->
  <path d="M 140 310 Q 200 190 260 310" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="3 3"/>
  <!-- narrow tall bump (height 175) -->
  <path d="M 178 310 Q 200 135 222 310" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- limiting spike (the delta) -->
  <line x1="200" y1="310" x2="200" y2="95" stroke="#1a1a1a" stroke-width="3"/>
  <polygon points="200,88 194,104 206,104" fill="#1a1a1a"/>
  <text x="210" y="100" font-size="16" fill="#1a1a1a" font-weight="bold">&#948;(x)</text>

  <!-- each has area 1 -->
  <text x="235" y="200" font-size="12" fill="#1a1a1a">every bump:</text>
  <text x="235" y="218" font-size="12" fill="#1a1a1a">area = 1</text>

  <!-- ================= RIGHT: step function and its derivative ================= -->
  <!-- TOP: Heaviside step H(x) -->
  <text x="430" y="40" font-size="14" fill="#1a1a1a" font-weight="bold">Step H(x) ...</text>
  <line x1="440" y1="150" x2="740" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="740,150 730,145 730,155" fill="#1a1a1a"/>
  <line x1="590" y1="60" x2="590" y2="165" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="596" y="163" font-size="13" fill="#1a1a1a">0</text>
  <!-- H = 0 for x<0, H = 1 for x>0 -->
  <line x1="450" y1="150" x2="590" y2="150" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="590" y1="95" x2="730" y2="95" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="590" y1="150" x2="590" y2="95" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="590" cy="150" r="3.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
  <circle cx="590" cy="95" r="3.5" fill="#1a1a1a"/>
  <text x="470" y="140" font-size="12" fill="#1a1a1a">0</text>
  <text x="700" y="88" font-size="12" fill="#1a1a1a">1</text>

  <!-- arrow: differentiate -->
  <line x1="590" y1="185" x2="590" y2="225" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="590,232 584,216 596,216" fill="#1a1a1a"/>
  <text x="600" y="212" font-size="13" fill="#1a1a1a" font-style="italic">d/dx</text>

  <!-- BOTTOM: derivative = delta spike -->
  <text x="430" y="270" font-size="14" fill="#1a1a1a" font-weight="bold">... has derivative &#948;(x)</text>
  <line x1="440" y1="360" x2="740" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="740,360 730,355 730,365" fill="#1a1a1a"/>
  <text x="596" y="378" font-size="13" fill="#1a1a1a">0</text>
  <!-- flat zero away from origin, spike at 0 -->
  <line x1="590" y1="360" x2="590" y2="285" stroke="#1a1a1a" stroke-width="3"/>
  <polygon points="590,278 584,294 596,294" fill="#1a1a1a"/>
  <text x="600" y="296" font-size="15" fill="#1a1a1a" font-weight="bold">&#948;(x)</text>
  <text x="620" y="330" font-size="12" fill="#1a1a1a">jump of size 1</text>
  <text x="628" y="346" font-size="12" fill="#1a1a1a">&#8594; unit spike</text>
</svg>
