<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>

  <!-- ===== LEFT: region with boundary data + harmonic level curves ===== -->
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#1a1a1a">A harmonic interior, set by its boundary</text>

  <!-- region -->
  <rect x="60" y="70" width="280" height="260" rx="26" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- boundary value labels -->
  <text x="200" y="60" font-size="15" fill="#b00020" text-anchor="middle" font-weight="bold">u = 100 (hot)</text>
  <text x="200" y="352" font-size="15" fill="#0050b0" text-anchor="middle" font-weight="bold">u = 0 (cold)</text>
  <text x="30" y="205" font-size="14" fill="#1a1a1a" text-anchor="middle">u = 50</text>
  <text x="372" y="205" font-size="14" fill="#1a1a1a" text-anchor="middle">u = 50</text>

  <!-- level curves (isotherms): smooth curves bowing with the boundary -->
  <path d="M 60 108 Q 200 96 340 108" fill="none" stroke="#b00020" stroke-width="2"/>
  <path d="M 60 150 Q 200 135 340 150" fill="none" stroke="#c23" stroke-width="2"/>
  <path d="M 60 200 Q 200 200 340 200" fill="none" stroke="#7a3070" stroke-width="2"/>
  <path d="M 60 250 Q 200 265 340 250" fill="none" stroke="#2050a0" stroke-width="2"/>
  <path d="M 60 292 Q 200 304 340 292" fill="none" stroke="#0050b0" stroke-width="2"/>

  <text x="352" y="112" font-size="12" fill="#b00020">80</text>
  <text x="352" y="204" font-size="12" fill="#7a3070">50</text>
  <text x="352" y="296" font-size="12" fill="#0050b0">20</text>

  <text x="200" y="392" font-size="13" fill="#555" text-anchor="middle">no interior peak — value glides smoothly between the fixed edges</text>

  <!-- ===== RIGHT: mean-value property inset ===== -->
  <text x="430" y="34" font-size="18" font-weight="bold" fill="#1a1a1a">Mean-value property</text>

  <!-- circle -->
  <circle cx="545" cy="180" r="90" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- center point -->
  <circle cx="545" cy="180" r="5" fill="#1a1a1a"/>
  <text x="545" y="165" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">P</text>

  <!-- sample boundary points -->
  <circle cx="545" cy="90" r="4" fill="#b00020"/>
  <circle cx="635" cy="180" r="4" fill="#7a3070"/>
  <circle cx="545" cy="270" r="4" fill="#0050b0"/>
  <circle cx="455" cy="180" r="4" fill="#7a3070"/>
  <circle cx="609" cy="116" r="4" fill="#c23"/>
  <circle cx="481" cy="244" r="4" fill="#2050a0"/>

  <!-- radius hint -->
  <line x1="545" y1="180" x2="635" y2="180" stroke="#999" stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="590" y="174" font-size="12" fill="#777" text-anchor="middle">any radius</text>

  <text x="545" y="300" font-size="14" fill="#1a1a1a" text-anchor="middle">u(P) = average of u</text>
  <text x="545" y="320" font-size="14" fill="#1a1a1a" text-anchor="middle">around the circle</text>
  <text x="545" y="346" font-size="12" fill="#555" text-anchor="middle">(true for every circle centered at P,</text>
  <text x="545" y="362" font-size="12" fill="#555" text-anchor="middle">as long as u is harmonic inside)</text>
</svg>
