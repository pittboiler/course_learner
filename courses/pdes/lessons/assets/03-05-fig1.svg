<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="430" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Project the source onto eigenmodes, drive each mode independently, reassemble</text>

  <!-- ===== SOURCE (left) ===== -->
  <text x="80" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Source Q(x,t)</text>
  <!-- source axes -->
  <line x1="30" y1="150" x2="150" y2="150" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="30" y1="80" x2="30" y2="150" stroke="#1a1a1a" stroke-width="1"/>
  <!-- lumpy source curve -->
  <path d="M30,150 C55,90 70,120 90,110 C110,100 120,140 150,130" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="90" y="170" text-anchor="middle" font-size="11" fill="#1a1a1a">a forced, lumpy input</text>

  <!-- projection arrow -->
  <line x1="160" y1="150" x2="215" y2="150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="187" y="142" text-anchor="middle" font-size="10" fill="#1a1a1a">project</text>

  <!-- ===== THREE MODES (middle) ===== -->
  <!-- mode 1 -->
  <g>
    <text x="270" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">mode 1</text>
    <line x1="230" y1="110" x2="310" y2="110" stroke="#1a1a1a" stroke-width="0.8"/>
    <path d="M230,110 C250,80 290,80 310,110" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <text x="322" y="114" font-size="11" fill="#1a1a1a">&#966;&#8321;</text>
    <!-- bar for q1 -->
    <rect x="235" y="128" width="70" height="14" fill="#1a1a1a"/>
    <text x="316" y="139" font-size="10" fill="#1a1a1a">q&#8321;</text>
  </g>
  <!-- mode 2 -->
  <g>
    <text x="270" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">mode 2</text>
    <line x1="230" y1="215" x2="310" y2="215" stroke="#1a1a1a" stroke-width="0.8"/>
    <path d="M230,215 C245,190 255,190 270,215 C285,240 295,240 310,215" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <text x="322" y="219" font-size="11" fill="#1a1a1a">&#966;&#8322;</text>
    <rect x="235" y="233" width="40" height="14" fill="#1a1a1a"/>
    <text x="286" y="244" font-size="10" fill="#1a1a1a">q&#8322;</text>
  </g>
  <!-- mode 3 -->
  <g>
    <text x="270" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">mode 3</text>
    <line x1="230" y1="320" x2="310" y2="320" stroke="#1a1a1a" stroke-width="0.8"/>
    <path d="M230,320 C240,300 248,300 258,320 C266,336 274,304 282,320 C290,336 300,340 310,320" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <text x="322" y="324" font-size="11" fill="#1a1a1a">&#966;&#8323;</text>
    <rect x="235" y="338" width="22" height="14" fill="#1a1a1a"/>
    <text x="268" y="349" font-size="10" fill="#1a1a1a">q&#8323;</text>
  </g>

  <!-- arrows into driven boxes -->
  <line x1="345" y1="120" x2="400" y2="120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="345" y1="220" x2="400" y2="220" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="345" y1="320" x2="400" y2="320" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== DRIVEN-MODE BOXES ===== -->
  <g>
    <rect x="402" y="98" width="150" height="46" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="477" y="118" text-anchor="middle" font-size="11" fill="#1a1a1a">c&#8321;&#8242; = &#8722;k&#955;&#8321; c&#8321; + q&#8321;(t)</text>
    <text x="477" y="134" text-anchor="middle" font-size="10" fill="#1a1a1a">one driven ODE</text>
  </g>
  <g>
    <rect x="402" y="198" width="150" height="46" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="477" y="218" text-anchor="middle" font-size="11" fill="#1a1a1a">c&#8322;&#8242; = &#8722;k&#955;&#8322; c&#8322; + q&#8322;(t)</text>
    <text x="477" y="234" text-anchor="middle" font-size="10" fill="#1a1a1a">independent of the rest</text>
  </g>
  <g>
    <rect x="402" y="298" width="150" height="46" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="477" y="318" text-anchor="middle" font-size="11" fill="#1a1a1a">c&#8323;&#8242; = &#8722;k&#955;&#8323; c&#8323; + q&#8323;(t)</text>
    <text x="477" y="334" text-anchor="middle" font-size="10" fill="#1a1a1a">solve, then move on</text>
  </g>

  <!-- reassemble arrows converging -->
  <line x1="554" y1="120" x2="612" y2="205" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="554" y1="220" x2="614" y2="218" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="554" y1="320" x2="612" y2="235" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="600" y="150" text-anchor="middle" font-size="10" fill="#1a1a1a">&#931; c&#8345;(t)&#966;&#8345;(x)</text>

  <!-- ===== SOLUTION (right) ===== -->
  <text x="665" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">u(x,t)</text>
  <line x1="622" y1="270" x2="712" y2="270" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="622" y1="215" x2="622" y2="270" stroke="#1a1a1a" stroke-width="1"/>
  <path d="M622,270 C645,225 690,235 712,255" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
</svg>
