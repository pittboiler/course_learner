<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>

  <!-- vertical guide lines linking the three panels at the kick times -->
  <line x1="190" y1="45" x2="190" y2="388" stroke="#d9c9e4" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="310" y1="45" x2="310" y2="388" stroke="#d9c9e4" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="430" y1="45" x2="430" y2="388" stroke="#d9c9e4" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ===== PANEL A: the forcing as a train of impulses ===== -->
  <text x="30" y="30" font-size="16" font-weight="bold" fill="#1a1a1a">1. Forcing f(&#183;,&#964;): a train of kicks</text>
  <line x1="70" y1="100" x2="645" y2="100" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="650" y="104" font-size="13" fill="#1a1a1a">t</text>

  <!-- impulse spikes -->
  <line x1="190" y1="100" x2="190" y2="56" stroke="#6f2f9c" stroke-width="2.4"/>
  <polygon points="190,50 185,62 195,62" fill="#6f2f9c"/>
  <line x1="310" y1="100" x2="310" y2="68" stroke="#6f2f9c" stroke-width="2.4"/>
  <polygon points="310,62 305,74 315,74" fill="#6f2f9c"/>
  <line x1="430" y1="100" x2="430" y2="62" stroke="#6f2f9c" stroke-width="2.4"/>
  <polygon points="430,56 425,68 435,68" fill="#6f2f9c"/>

  <text x="190" y="116" font-size="12" fill="#555" text-anchor="middle">&#964;&#8321;</text>
  <text x="310" y="116" font-size="12" fill="#555" text-anchor="middle">&#964;&#8322;</text>
  <text x="430" y="116" font-size="12" fill="#555" text-anchor="middle">&#964;&#8323;</text>

  <text x="352" y="140" font-size="12.5" fill="#555" text-anchor="middle" font-style="italic">release each slice f(&#183;,&#964;)d&#964; as fresh initial data at time &#964;</text>

  <!-- ===== PANEL B: each kick evolved forward by S(t-tau) ===== -->
  <text x="30" y="168" font-size="16" font-weight="bold" fill="#1a1a1a">2. Each evolves forward: S(t&#8722;&#964;) f(&#183;,&#964;)</text>
  <line x1="70" y1="238" x2="645" y2="238" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="650" y="242" font-size="13" fill="#1a1a1a">t</text>

  <!-- decaying/spreading response of each kick, starting at its own tau -->
  <path d="M190,238 L190,176 C 210,200 244,235 292,238" fill="none" stroke="#8a4fb0" stroke-width="2"/>
  <path d="M310,238 L310,188 C 328,208 362,236 408,238" fill="none" stroke="#a97fc0" stroke-width="2"/>
  <path d="M430,238 L430,182 C 449,205 484,236 528,238" fill="none" stroke="#8a4fb0" stroke-width="2"/>

  <text x="250" y="228" font-size="11" fill="#777">t&#8722;&#964;&#8321;</text>
  <text x="360" y="230" font-size="11" fill="#777">t&#8722;&#964;&#8322;</text>

  <text x="352" y="270" font-size="12.5" fill="#555" text-anchor="middle" font-style="italic">sum over all release times &#964; (integrate)</text>

  <!-- ===== PANEL C: the total response ===== -->
  <text x="30" y="298" font-size="16" font-weight="bold" fill="#1a1a1a">3. Total: u(&#183;,t) = &#8747;&#8320;&#7511; S(t&#8722;&#964;) f(&#183;,&#964;) d&#964;</text>
  <line x1="70" y1="382" x2="645" y2="382" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="650" y="386" font-size="13" fill="#1a1a1a">t</text>

  <path d="M70,382 C150,382 168,338 250,324 C 322,311 362,308 422,320 C 500,336 560,376 640,382 L640,382 L70,382 Z" fill="#f0e6f6" stroke="none"/>
  <path d="M70,382 C150,382 168,338 250,324 C 322,311 362,308 422,320 C 500,336 560,376 640,382" fill="none" stroke="#b00020" stroke-width="2.6"/>
</svg>
