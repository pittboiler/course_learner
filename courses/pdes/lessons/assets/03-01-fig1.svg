<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="480" fill="#ffffff"/>

  <!-- ===== Top: the separation pipeline ===== -->
  <text x="360" y="30" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">One PDE splits into two ODEs, then superpose</text>

  <!-- PDE box -->
  <rect x="30" y="55" width="150" height="60" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="105" y="80" font-size="13" fill="#1a1a1a" text-anchor="middle">PDE</text>
  <text x="105" y="100" font-size="13" fill="#1a1a1a" text-anchor="middle">u&#8348; = k u&#8339;&#8339;</text>

  <!-- arrow: guess product -->
  <line x1="180" y1="85" x2="245" y2="85" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ar)"/>
  <text x="212" y="76" font-size="10" fill="#555555" text-anchor="middle">u=X(x)T(t)</text>

  <!-- separated box -->
  <rect x="248" y="55" width="180" height="60" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="338" y="80" font-size="13" fill="#1a1a1a" text-anchor="middle">T&#8242;/(kT) = X&#8243;/X</text>
  <text x="338" y="100" font-size="12" fill="#555555" text-anchor="middle">= &#8722;&#955; (a constant)</text>

  <!-- split arrows -->
  <line x1="428" y1="72" x2="500" y2="55" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="428" y1="98" x2="500" y2="115" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ar)"/>

  <!-- spatial box -->
  <rect x="503" y="35" width="187" height="52" rx="6" fill="#eef4fb" stroke="#1a1a1a" stroke-width="2"/>
  <text x="596" y="55" font-size="12" fill="#1a1a1a" text-anchor="middle">space:  X&#8243; = &#8722;&#955; X, BCs</text>
  <text x="596" y="74" font-size="12" fill="#1a1a1a" text-anchor="middle">&#8594; X&#8345;, discrete &#955;&#8345;</text>

  <!-- temporal box -->
  <rect x="503" y="95" width="187" height="52" rx="6" fill="#fbf1ee" stroke="#1a1a1a" stroke-width="2"/>
  <text x="596" y="115" font-size="12" fill="#1a1a1a" text-anchor="middle">time:  T&#8242; = &#8722;k&#955; T</text>
  <text x="596" y="134" font-size="12" fill="#1a1a1a" text-anchor="middle">&#8594; T&#8345;(t)</text>

  <!-- superpose line -->
  <text x="360" y="172" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">u(x,t) = &#931;&#8345; b&#8345; X&#8345;(x) T&#8345;(t)   &#8592; coefficients b&#8345; from the initial data</text>

  <!-- ===== Bottom: first three spatial modes on [0,L] ===== -->
  <text x="360" y="215" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">The first spatial modes X&#8345;(x) = sin(n&#960;x/L) on [0, L]</text>

  <!-- axes -->
  <!-- baseline y=350, amplitude 70, x from 90 to 630 (L span 540) -->
  <line x1="90" y1="350" x2="640" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="90" y1="270" x2="90" y2="430" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="86" y="266" font-size="11" fill="#1a1a1a" text-anchor="end">X</text>
  <text x="90" y="448" font-size="11" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="630" y="448" font-size="11" fill="#1a1a1a" text-anchor="middle">L</text>
  <text x="648" y="354" font-size="11" fill="#1a1a1a" text-anchor="start">x</text>

  <!-- fixed ends (Dirichlet) -->
  <circle cx="90" cy="350" r="4" fill="#1a1a1a"/>
  <circle cx="630" cy="350" r="4" fill="#1a1a1a"/>

  <!-- n=1: half sine, no interior node -->
  <path d="M90,350 C210,240 510,240 630,350" fill="none" stroke="#1f77b4" stroke-width="2.5"/>
  <text x="360" y="255" font-size="11" fill="#1f77b4" text-anchor="middle">n=1  (fundamental)</text>

  <!-- n=2: full sine, node at L/2 -->
  <path d="M90,350 C150,290 240,290 300,350 C360,410 450,410 510,350 C540,320 600,320 630,350" fill="none" stroke="#d62728" stroke-width="2.5" opacity="0.9"/>
  <circle cx="360" cy="350" r="3" fill="#d62728"/>
  <text x="360" y="372" font-size="10" fill="#d62728" text-anchor="middle">node</text>

  <!-- n=3: nodes at L/3, 2L/3 -->
  <path d="M90,350 C120,315 160,315 190,350 C220,385 260,385 290,350 C325,308 375,308 410,350 C445,392 490,392 520,350 C555,318 600,318 630,350" fill="none" stroke="#2ca02c" stroke-width="2" opacity="0.85"/>

  <text x="470" y="300" font-size="11" fill="#2ca02c" text-anchor="start">n=3</text>
  <text x="255" y="332" font-size="11" fill="#d62728" text-anchor="start">n=2</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
</svg>
