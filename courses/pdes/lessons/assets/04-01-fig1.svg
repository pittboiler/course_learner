<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>

  <!-- ================= TOP ROW: Gaussian <-> Gaussian ================= -->
  <!-- panel labels -->
  <text x="30" y="30" font-size="15" font-weight="bold" fill="#1a1a1a">Position space</text>
  <text x="410" y="30" font-size="15" font-weight="bold" fill="#1a1a1a">Frequency space</text>

  <!-- Top-left axes (u(x)) -->
  <line x1="55" y1="175" x2="325" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="190" y1="185" x2="190" y2="70" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="325,175 317,171 317,179" fill="#1a1a1a"/>
  <polygon points="190,70 186,78 194,78" fill="#1a1a1a"/>
  <text x="330" y="180" font-size="13" fill="#1a1a1a" font-style="italic">x</text>
  <!-- narrow Gaussian -->
  <polyline fill="none" stroke="#1a1a1a" stroke-width="2.5" points="70.0,175.0 121.0,175.0 124.0,174.9 130.0,174.7 136.0,174.1 142.0,172.6 148.0,169.4 154.0,163.1 160.0,152.5 166.0,137.2 172.0,118.4 178.0,99.5 184.0,85.3 190.0,80.0 196.0,85.3 202.0,99.5 208.0,118.4 214.0,137.2 220.0,152.5 226.0,163.1 232.0,169.4 238.0,172.6 244.0,174.1 250.0,174.7 256.0,174.9 259.0,175.0 310.0,175.0"/>
  <text x="120" y="120" font-size="13" fill="#1a1a1a" font-style="italic">u(x) = e</text>
  <text x="178" y="114" font-size="10" fill="#1a1a1a" font-style="italic">-a x²</text>
  <text x="150" y="200" font-size="11" fill="#555555">narrow</text>

  <!-- Top-right axes (u-hat) -->
  <line x1="435" y1="175" x2="705" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="570" y1="185" x2="570" y2="70" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="705,175 697,171 697,179" fill="#1a1a1a"/>
  <polygon points="570,70 566,78 574,78" fill="#1a1a1a"/>
  <text x="710" y="180" font-size="13" fill="#1a1a1a">&#958;</text>
  <!-- wide Gaussian -->
  <polyline fill="none" stroke="#1a1a1a" stroke-width="2.5" points="450.0,174.6 462.0,174.0 474.0,172.6 486.0,169.9 498.0,165.2 510.0,158.0 522.0,148.2 534.0,136.9 546.0,126.0 558.0,117.9 570.0,115.0 582.0,117.9 594.0,126.0 606.0,136.9 618.0,148.2 630.0,158.0 642.0,165.2 654.0,169.9 666.0,172.6 678.0,174.0 690.0,174.6"/>
  <text x="600" y="110" font-size="13" fill="#1a1a1a" font-style="italic">&#251;(&#958;) &#8733; e</text>
  <text x="652" y="104" font-size="10" fill="#1a1a1a" font-style="italic">-&#958;²/4a</text>
  <text x="520" y="200" font-size="11" fill="#555555">wide</text>

  <!-- transform arrow between top panels -->
  <line x1="330" y1="130" x2="428" y2="130" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="428,130 419,125 419,135" fill="#1a1a1a"/>
  <text x="345" y="122" font-size="12" fill="#1a1a1a">Fourier</text>

  <!-- ================= BOTTOM ROW: box <-> sinc ================= -->
  <!-- Bottom-left axes (box) -->
  <line x1="45" y1="355" x2="335" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="190" y1="365" x2="190" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="335,355 327,351 327,359" fill="#1a1a1a"/>
  <polygon points="190,265 186,273 194,273" fill="#1a1a1a"/>
  <text x="340" y="360" font-size="13" fill="#1a1a1a" font-style="italic">x</text>
  <!-- box -->
  <polyline fill="none" stroke="#1a1a1a" stroke-width="2.5" points="50.0,355.0 135.0,355.0 135.0,275.0 245.0,275.0 245.0,355.0 330.0,355.0"/>
  <text x="150" y="268" font-size="12" fill="#1a1a1a">box on [-L, L]</text>
  <text x="128" y="372" font-size="11" fill="#555555">-L</text>
  <text x="240" y="372" font-size="11" fill="#555555">L</text>

  <!-- Bottom-right axes (sinc) -->
  <line x1="435" y1="340" x2="705" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="570" y1="378" x2="570" y2="262" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="705,340 697,336 697,344" fill="#1a1a1a"/>
  <polygon points="570,262 566,270 574,270" fill="#1a1a1a"/>
  <text x="710" y="345" font-size="13" fill="#1a1a1a">&#958;</text>
  <!-- sinc -->
  <polyline fill="none" stroke="#1a1a1a" stroke-width="2.5" points="440.0,339.1 445.2,340.5 449.1,340.8 453.0,338.9 456.9,340.0 460.8,341.2 464.7,339.1 468.6,339.4 472.5,341.4 476.4,339.5 480.3,338.8 484.2,341.4 488.1,340.2 492.0,338.3 495.9,341.1 499.8,341.0 503.7,337.9 507.6,340.5 511.5,342.0 515.4,337.9 519.3,339.4 523.2,343.0 527.1,338.3 531.0,337.8 534.9,343.8 538.8,339.5 542.7,335.5 546.6,344.6 550.5,342.3 554.4,331.0 558.3,345.0 562.2,352.3 566.1,306.7 570.0,270.0 573.9,306.7 577.8,352.3 581.7,345.0 585.6,331.0 589.5,342.3 593.4,344.6 597.3,335.5 601.2,339.5 605.1,343.8 609.0,337.8 612.9,338.3 616.8,343.0 620.7,339.4 624.6,337.9 628.5,342.0 632.4,340.5 636.3,337.9 640.2,341.0 644.1,341.1 648.0,338.3 651.9,340.2 655.8,341.4 659.7,338.8 663.6,339.5 667.5,341.4 671.4,339.4 675.3,339.1 679.2,341.2 683.1,340.0 687.0,338.9 690.9,340.8 694.8,340.5 698.7,338.9 700.0,339.1"/>
  <text x="585" y="285" font-size="12" fill="#1a1a1a">sinc: 2 sin(L&#958;)/&#958;</text>

  <!-- transform arrow between bottom panels -->
  <line x1="340" y1="310" x2="428" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="428,310 419,305 419,315" fill="#1a1a1a"/>
  <text x="345" y="302" font-size="12" fill="#1a1a1a">Fourier</text>

  <!-- bottom caption: the tradeoff -->
  <text x="380" y="396" font-size="12" font-style="italic" fill="#1a1a1a" text-anchor="middle">Narrow in x &#8596; wide in &#958;  (the uncertainty / scaling tradeoff)</text>
</svg>
