<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="13">
  <rect x="0" y="0" width="700" height="380" fill="#ffffff"/>

  <!-- ================= LEFT: space-time grid + FTCS stencil ================= -->
  <text x="30" y="30" fill="#1a1a1a" font-weight="bold">The explicit heat stencil</text>

  <!-- axes -->
  <line x1="55" y1="330" x2="300" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="55" y1="330" x2="55" y2="70" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="285" y="352" fill="#8a8a8a" font-style="italic">space  j</text>
  <text x="18" y="80" fill="#8a8a8a" font-style="italic">time n</text>

  <!-- grid dots: columns x = 90 130 170 210 250, rows y = 300 250 200 150 -->
  <g fill="#b8b8b8">
    <circle cx="90"  cy="300" r="3"/><circle cx="130" cy="300" r="3"/><circle cx="170" cy="300" r="3"/><circle cx="210" cy="300" r="3"/><circle cx="250" cy="300" r="3"/>
    <circle cx="90"  cy="250" r="3"/><circle cx="130" cy="250" r="3"/>                        <circle cx="210" cy="250" r="3"/><circle cx="250" cy="250" r="3"/>
    <circle cx="90"  cy="200" r="3"/><circle cx="130" cy="200" r="3"/>                        <circle cx="210" cy="200" r="3"/><circle cx="250" cy="200" r="3"/>
    <circle cx="90"  cy="150" r="3"/><circle cx="130" cy="150" r="3"/><circle cx="170" cy="150" r="3"/><circle cx="210" cy="150" r="3"/><circle cx="250" cy="150" r="3"/>
  </g>

  <!-- stencil arrows: three level-n points -> new level-(n+1) point -->
  <g stroke="#4a90d9" stroke-width="2" fill="none">
    <path d="M130,250 L166,206"/>
    <path d="M170,250 L170,208"/>
    <path d="M210,250 L174,206"/>
  </g>
  <g stroke="#4a90d9" stroke-width="2" fill="#4a90d9">
    <polygon points="170,200 165,210 175,210"/>
    <polygon points="168,206 160,210 168,214"/>
    <polygon points="172,206 172,214 180,210"/>
  </g>

  <!-- three source points (level n) -->
  <g fill="#e0645c">
    <circle cx="130" cy="250" r="4.5"/><circle cx="170" cy="250" r="4.5"/><circle cx="210" cy="250" r="4.5"/>
  </g>
  <!-- new point (level n+1) -->
  <circle cx="170" cy="200" r="5.5" fill="#4a90d9"/>

  <text x="106" y="272" fill="#e0645c" font-size="12">u&#8319;&#8323;&#8331;&#8321;</text>
  <text x="158" y="272" fill="#e0645c" font-size="12">u&#8319;&#8323;</text>
  <text x="196" y="272" fill="#e0645c" font-size="12">u&#8319;&#8323;&#8330;&#8321;</text>
  <text x="180" y="196" fill="#4a90d9" font-size="12">u&#8319;&#8314;&#185;&#8323;</text>

  <text x="30" y="360" fill="#8a8a8a" font-style="italic" font-size="12">one new value depends on three old neighbors</text>

  <!-- ================= RIGHT: two runs ================= -->
  <line x1="380" y1="40" x2="380" y2="345" stroke="#dddddd" stroke-width="1"/>

  <!-- top: stable -->
  <text x="410" y="30" fill="#1a1a1a" font-weight="bold">Stable:  r &#8804; &#189;</text>
  <line x1="410" y1="150" x2="670" y2="150" stroke="#b8b8b8" stroke-width="1"/>
  <!-- bounded, smoothing bump: decays and flattens -->
  <path d="M410,150 Q470,60 530,60 Q590,60 670,150" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <path d="M410,150 Q470,105 530,105 Q590,105 670,150" fill="none" stroke="#4a90d9" stroke-width="2" opacity="0.6"/>
  <path d="M410,150 Q470,132 530,132 Q590,132 670,150" fill="none" stroke="#4a90d9" stroke-width="1.5" opacity="0.4"/>
  <text x="410" y="172" fill="#8a8a8a" font-style="italic" font-size="12">amplitude stays bounded, spreads out</text>

  <!-- bottom: unstable -->
  <text x="410" y="222" fill="#1a1a1a" font-weight="bold">Unstable:  r &gt; &#189;</text>
  <line x1="410" y1="300" x2="670" y2="300" stroke="#b8b8b8" stroke-width="1"/>
  <!-- growing sawtooth: alternating spikes, growing in amplitude to the right -->
  <path d="M410,300 L430,296 L450,304 L470,290 L490,310 L510,278 L530,322 L550,262 L570,338 L590,244 L610,352 L630,232 L650,360"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <text x="410" y="374" fill="#8a8a8a" font-style="italic" font-size="12">sawtooth mode (&#946;&#916;x=&#960;) blows up: |G|&gt;1</text>
</svg>
