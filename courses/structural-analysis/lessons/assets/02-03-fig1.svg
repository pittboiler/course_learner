<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">One deflection, two systems: real loads give M(x); a virtual unit load at the target gives m(x); their product, integrated, is the deflection.</text>

  <!-- ===== LEFT: REAL system ===== -->
  <text x="30" y="58" fill="#4a90d9">REAL system (actual loads)</text>

  <!-- fixed wall -->
  <line x1="40" y1="66" x2="40" y2="114" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="40" y1="66" x2="31" y2="76" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="40" y1="82" x2="31" y2="92" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="40" y1="98" x2="31" y2="108" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="40" y1="114" x2="31" y2="124" stroke="#8a8a8a" stroke-width="1"/>
  <!-- beam -->
  <line x1="40" y1="90" x2="230" y2="90" stroke="#8a8a8a" stroke-width="3"/>
  <!-- real load P at tip -->
  <line x1="230" y1="54" x2="230" y2="88" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="230,88 226,79 234,79" fill="#4a90d9"/>
  <text x="236" y="66" fill="#4a90d9">P</text>
  <!-- deflected shape + deflection Delta -->
  <path d="M 40 90 Q 150 96 230 112" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="230" y1="90" x2="230" y2="112" stroke="#8a8a8a" stroke-width="1"/>
  <polygon points="230,112 226,103 234,103" fill="#8a8a8a"/>
  <text x="234" y="110" fill="#8a8a8a">&#916;</text>

  <!-- real M diagram -->
  <line x1="40" y1="160" x2="230" y2="160" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="40,160 230,160 40,200" fill="#4a90d9" opacity="0.18"/>
  <line x1="40" y1="160" x2="40" y2="200" stroke="#4a90d9" stroke-width="2"/>
  <line x1="40" y1="200" x2="230" y2="160" stroke="#4a90d9" stroke-width="2"/>
  <text x="70" y="188" fill="#4a90d9">M(x)  real moment</text>

  <!-- ===== RIGHT: VIRTUAL system ===== -->
  <text x="360" y="58" fill="#e0645c">VIRTUAL system (unit load at target)</text>

  <!-- fixed wall -->
  <line x1="370" y1="66" x2="370" y2="114" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="370" y1="66" x2="361" y2="76" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="370" y1="82" x2="361" y2="92" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="370" y1="98" x2="361" y2="108" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="370" y1="114" x2="361" y2="124" stroke="#8a8a8a" stroke-width="1"/>
  <!-- beam -->
  <line x1="370" y1="90" x2="560" y2="90" stroke="#8a8a8a" stroke-width="3"/>
  <!-- virtual unit load at tip -->
  <line x1="560" y1="54" x2="560" y2="88" stroke="#e0645c" stroke-width="2"/>
  <polygon points="560,88 556,79 564,79" fill="#e0645c"/>
  <text x="548" y="50" fill="#e0645c">1 (unit)</text>

  <!-- virtual m diagram -->
  <line x1="370" y1="160" x2="560" y2="160" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="370,160 560,160 370,200" fill="#e0645c" opacity="0.18"/>
  <line x1="370" y1="160" x2="370" y2="200" stroke="#e0645c" stroke-width="2"/>
  <line x1="370" y1="200" x2="560" y2="160" stroke="#e0645c" stroke-width="2"/>
  <text x="400" y="188" fill="#e0645c">m(x)  virtual moment</text>

  <!-- ===== combine ===== -->
  <text x="150" y="252" fill="#8a8a8a">multiply the two moment diagrams, divide by EI, integrate over the length:</text>
  <text x="200" y="292" fill="#8a8a8a" font-size="20">1 &#183; &#916; = &#8747; m(x) M(x) / (EI) dx</text>
</svg>
