<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">A real floor bay (left) is idealized into a loaded line model (right): the slab spreads its area load onto the beam as a UDL, which flows to columns to foundation.</text>

  <!-- ============ LEFT: physical bay, plan view ============ -->
  <text x="60" y="52" fill="#8a8a8a">Physical bay (plan)</text>

  <!-- slab panel 4 m x 6 m -->
  <rect x="70" y="80" width="120" height="132" fill="#4a90d9" opacity="0.06" stroke="#8a8a8a" stroke-width="1"/>

  <!-- girders top and bottom (grey) -->
  <line x1="70" y1="80" x2="190" y2="80" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="70" y1="212" x2="190" y2="212" stroke="#8a8a8a" stroke-width="2"/>

  <!-- edge beams (blue), left one is the one we design -->
  <line x1="70" y1="80" x2="70" y2="212" stroke="#4a90d9" stroke-width="3.5"/>
  <line x1="190" y1="80" x2="190" y2="212" stroke="#4a90d9" stroke-width="2"/>

  <!-- columns at the four corners -->
  <rect x="65" y="75" width="10" height="10" fill="#8a8a8a"/>
  <rect x="185" y="75" width="10" height="10" fill="#8a8a8a"/>
  <rect x="65" y="207" width="10" height="10" fill="#8a8a8a"/>
  <rect x="185" y="207" width="10" height="10" fill="#8a8a8a"/>

  <!-- tributary strip: hatch (2 m of the 4 m panel feeds the left beam) -->
  <line x1="70" y1="100" x2="90" y2="80" stroke="#e0645c" stroke-width="1" opacity="0.7"/>
  <line x1="70" y1="130" x2="120" y2="80" stroke="#e0645c" stroke-width="1" opacity="0.7"/>
  <line x1="70" y1="160" x2="130" y2="100" stroke="#e0645c" stroke-width="1" opacity="0.7"/>
  <line x1="70" y1="190" x2="130" y2="130" stroke="#e0645c" stroke-width="1" opacity="0.7"/>
  <line x1="78" y1="212" x2="130" y2="160" stroke="#e0645c" stroke-width="1" opacity="0.7"/>
  <line x1="108" y1="212" x2="130" y2="190" stroke="#e0645c" stroke-width="1" opacity="0.7"/>

  <!-- tributary boundary (midway to next beam) -->
  <line x1="130" y1="80" x2="130" y2="212" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- dimensions -->
  <text x="120" y="72" fill="#8a8a8a" text-anchor="middle">4 m</text>
  <text x="48" y="150" fill="#8a8a8a" text-anchor="middle" transform="rotate(-90 48 150)">6 m span</text>
  <text x="100" y="232" fill="#e0645c" text-anchor="middle">trib. 2 m</text>
  <text x="82" y="150" fill="#4a90d9" transform="rotate(-90 82 150)">edge beam</text>

  <!-- ============ RIGHT: load path chain ============ -->
  <text x="360" y="52" fill="#8a8a8a">Load path (idealized)</text>

  <!-- stage 1: surface load on slab strip -->
  <text x="380" y="66" fill="#e0645c">surface load q = 5 kPa</text>
  <line x1="400" y1="74" x2="400" y2="88" stroke="#e0645c" stroke-width="1"/>
  <polygon points="400,90 396,82 404,82" fill="#e0645c"/>
  <line x1="430" y1="74" x2="430" y2="88" stroke="#e0645c" stroke-width="1"/>
  <polygon points="430,90 426,82 434,82" fill="#e0645c"/>
  <line x1="460" y1="74" x2="460" y2="88" stroke="#e0645c" stroke-width="1"/>
  <polygon points="460,90 456,82 464,82" fill="#e0645c"/>
  <line x1="490" y1="74" x2="490" y2="88" stroke="#e0645c" stroke-width="1"/>
  <polygon points="490,90 486,82 494,82" fill="#e0645c"/>
  <line x1="520" y1="74" x2="520" y2="88" stroke="#e0645c" stroke-width="1"/>
  <polygon points="520,90 516,82 524,82" fill="#e0645c"/>
  <rect x="376" y="92" width="168" height="14" fill="#8a8a8a" opacity="0.18" stroke="#8a8a8a" stroke-width="1"/>

  <!-- transition arrow slab to beam -->
  <line x1="460" y1="110" x2="460" y2="126" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="460,130 454,120 466,120" fill="#8a8a8a"/>
  <text x="470" y="124" fill="#8a8a8a">collect over 2 m</text>

  <!-- stage 2: UDL on beam -->
  <text x="380" y="150" fill="#e0645c">w = 5 x 2 = 10 kN/m</text>
  <line x1="380" y1="158" x2="540" y2="158" stroke="#e0645c" stroke-width="1.5"/>
  <line x1="392" y1="158" x2="392" y2="178" stroke="#e0645c" stroke-width="1"/>
  <polygon points="392,182 388,172 396,172" fill="#e0645c"/>
  <line x1="416" y1="158" x2="416" y2="178" stroke="#e0645c" stroke-width="1"/>
  <polygon points="416,182 412,172 420,172" fill="#e0645c"/>
  <line x1="440" y1="158" x2="440" y2="178" stroke="#e0645c" stroke-width="1"/>
  <polygon points="440,182 436,172 444,172" fill="#e0645c"/>
  <line x1="464" y1="158" x2="464" y2="178" stroke="#e0645c" stroke-width="1"/>
  <polygon points="464,182 460,172 468,172" fill="#e0645c"/>
  <line x1="488" y1="158" x2="488" y2="178" stroke="#e0645c" stroke-width="1"/>
  <polygon points="488,182 484,172 492,172" fill="#e0645c"/>
  <line x1="512" y1="158" x2="512" y2="178" stroke="#e0645c" stroke-width="1"/>
  <polygon points="512,182 508,172 516,172" fill="#e0645c"/>
  <line x1="528" y1="158" x2="528" y2="178" stroke="#e0645c" stroke-width="1"/>
  <polygon points="528,182 524,172 532,172" fill="#e0645c"/>

  <!-- the beam as a line -->
  <line x1="380" y1="186" x2="540" y2="186" stroke="#4a90d9" stroke-width="3.5"/>

  <!-- pin support at left -->
  <polygon points="380,186 372,202 388,202" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="370" y1="202" x2="390" y2="202" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="360" y="200" fill="#8a8a8a" text-anchor="middle">pin</text>

  <!-- roller support at right -->
  <polygon points="540,186 532,200 548,200" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="536" cy="203" r="3" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <circle cx="544" cy="203" r="3" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="560" y="200" fill="#8a8a8a" text-anchor="middle">roller</text>

  <!-- columns down to foundation -->
  <line x1="380" y1="206" x2="380" y2="250" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="540" y1="208" x2="540" y2="250" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="360" y1="250" x2="560" y2="250" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="368" y1="258" x2="360" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="388" y1="258" x2="380" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="408" y1="258" x2="400" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="428" y1="258" x2="420" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="448" y1="258" x2="440" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="468" y1="258" x2="460" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="488" y1="258" x2="480" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="508" y1="258" x2="500" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="528" y1="258" x2="520" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="548" y1="258" x2="540" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <text x="460" y="278" fill="#8a8a8a" text-anchor="middle">columns to foundation</text>
</svg>
