<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Warren truss: joints balance forces one at a time; one section cut (coral) exposes three members at once.</text>

  <!-- ===== truss members (blue = primary structure) ===== -->
  <!-- diagonals -->
  <line x1="60" y1="200" x2="180" y2="110" stroke="#4a90d9" stroke-width="3"/>
  <line x1="180" y1="110" x2="300" y2="200" stroke="#4a90d9" stroke-width="3"/>
  <line x1="300" y1="200" x2="420" y2="110" stroke="#4a90d9" stroke-width="3"/>
  <line x1="420" y1="110" x2="540" y2="200" stroke="#4a90d9" stroke-width="3"/>
  <!-- top chord -->
  <line x1="180" y1="110" x2="420" y2="110" stroke="#4a90d9" stroke-width="3"/>
  <!-- bottom chord -->
  <line x1="60" y1="200" x2="300" y2="200" stroke="#4a90d9" stroke-width="3"/>
  <line x1="300" y1="200" x2="540" y2="200" stroke="#4a90d9" stroke-width="3"/>

  <!-- joints -->
  <circle cx="60" cy="200" r="4" fill="#8a8a8a"/>
  <circle cx="300" cy="200" r="4" fill="#8a8a8a"/>
  <circle cx="540" cy="200" r="4" fill="#8a8a8a"/>
  <circle cx="180" cy="110" r="4" fill="#8a8a8a"/>
  <circle cx="420" cy="110" r="4" fill="#8a8a8a"/>

  <!-- joint labels -->
  <text x="46" y="192" fill="#8a8a8a">A</text>
  <text x="296" y="222" fill="#8a8a8a">C</text>
  <text x="546" y="192" fill="#8a8a8a">E</text>
  <text x="172" y="102" fill="#8a8a8a">B</text>
  <text x="424" y="102" fill="#8a8a8a">D</text>

  <!-- ===== pin support at A ===== -->
  <polygon points="60,200 48,222 72,222" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="44" y1="222" x2="76" y2="222" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- ===== roller support at E ===== -->
  <polygon points="540,200 528,220 552,220" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="533" cy="225" r="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="547" cy="225" r="4" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="524" y1="231" x2="556" y2="231" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- reaction arrows -->
  <line x1="60" y1="256" x2="60" y2="228" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="60,224 55,234 65,234" fill="#4a90d9"/>
  <text x="40" y="272" fill="#4a90d9">6 kN</text>
  <line x1="540" y1="256" x2="540" y2="238" stroke="#4a90d9" stroke-width="2"/>
  <polygon points="540,234 535,244 545,244" fill="#4a90d9"/>
  <text x="520" y="272" fill="#4a90d9">6 kN</text>

  <!-- load at C -->
  <line x1="300" y1="200" x2="300" y2="244" stroke="#e0645c" stroke-width="2"/>
  <polygon points="300,248 295,238 305,238" fill="#e0645c"/>
  <text x="308" y="240" fill="#e0645c">P = 12 kN</text>

  <!-- ===== section cut (coral dashed) ===== -->
  <line x1="262" y1="92" x2="262" y2="214" stroke="#e0645c" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="228" y="86" fill="#e0645c">section a&#8722;a</text>

  <!-- member force labels (T / C) -->
  <text x="96" y="150" fill="#8a8a8a">10 C</text>
  <text x="160" y="168" fill="#8a8a8a">10 T</text>
  <text x="280" y="130" fill="#8a8a8a">16 C</text>
  <text x="150" y="216" fill="#8a8a8a">8 T</text>
</svg>
