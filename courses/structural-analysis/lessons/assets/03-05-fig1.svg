<svg viewBox="0 0 640 372" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Lock every joint (FEM), release one, DISTRIBUTE its unbalance by stiffness, CARRY OVER half to each far end, total the columns.</text>

  <!-- ====== beam schematic: A fixed, B interior support, C fixed; UDL on span AB only ====== -->

  <!-- load line + UDL arrows over span AB -->
  <line x1="95" y1="70" x2="322" y2="70" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="195" y="63" fill="#4a90d9">w</text>
  <line x1="120" y1="70" x2="120" y2="104" stroke="#4a90d9" stroke-width="1.2"/>
  <polygon points="120,108 116,99 124,99" fill="#4a90d9"/>
  <line x1="165" y1="70" x2="165" y2="104" stroke="#4a90d9" stroke-width="1.2"/>
  <polygon points="165,108 161,99 169,99" fill="#4a90d9"/>
  <line x1="210" y1="70" x2="210" y2="104" stroke="#4a90d9" stroke-width="1.2"/>
  <polygon points="210,108 206,99 214,99" fill="#4a90d9"/>
  <line x1="255" y1="70" x2="255" y2="104" stroke="#4a90d9" stroke-width="1.2"/>
  <polygon points="255,108 251,99 259,99" fill="#4a90d9"/>
  <line x1="300" y1="70" x2="300" y2="104" stroke="#4a90d9" stroke-width="1.2"/>
  <polygon points="300,108 296,99 304,99" fill="#4a90d9"/>

  <!-- beam -->
  <line x1="90" y1="110" x2="560" y2="110" stroke="#8a8a8a" stroke-width="3"/>

  <!-- left fixed wall at A -->
  <line x1="90" y1="92" x2="90" y2="128" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="90" y1="96" x2="82" y2="104" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="90" y1="106" x2="82" y2="114" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="90" y1="116" x2="82" y2="124" stroke="#8a8a8a" stroke-width="1"/>
  <text x="80" y="145" fill="#8a8a8a">A</text>

  <!-- interior support at B -->
  <polygon points="325,110 314,130 336,130" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="308" y1="130" x2="342" y2="130" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="320" y="149" fill="#8a8a8a">B</text>

  <!-- right fixed wall at C -->
  <line x1="560" y1="92" x2="560" y2="128" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="560" y1="96" x2="568" y2="104" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="560" y1="106" x2="568" y2="114" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="560" y1="116" x2="568" y2="124" stroke="#8a8a8a" stroke-width="1"/>
  <text x="556" y="145" fill="#8a8a8a">C</text>

  <!-- ====== the tableau ====== -->

  <!-- final-row highlight -->
  <rect x="90" y="320" width="470" height="26" fill="#4a90d9" opacity="0.12"/>
  <!-- released-joint (B) column highlight in header -->
  <rect x="290" y="190" width="180" height="26" fill="#e0645c" opacity="0.12"/>

  <!-- outer + inner grid -->
  <line x1="90" y1="190" x2="560" y2="190" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="90" y1="216" x2="560" y2="216" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="90" y1="242" x2="560" y2="242" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="90" y1="268" x2="560" y2="268" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="90" y1="294" x2="560" y2="294" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="90" y1="320" x2="560" y2="320" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="90" y1="346" x2="560" y2="346" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="90" y1="190" x2="90" y2="346" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="200" y1="190" x2="200" y2="346" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="290" y1="190" x2="290" y2="346" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="380" y1="190" x2="380" y2="346" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="470" y1="190" x2="470" y2="346" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="560" y1="190" x2="560" y2="346" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- header: member ends -->
  <text x="98" y="208" fill="#8a8a8a">joint</text>
  <text x="228" y="208" fill="#8a8a8a">A</text>
  <text x="325" y="208" fill="#e0645c">B</text>
  <text x="512" y="208" fill="#8a8a8a">C</text>
  <text x="228" y="234" fill="#8a8a8a">AB</text>
  <text x="318" y="234" fill="#8a8a8a">BA</text>
  <text x="408" y="234" fill="#8a8a8a">BC</text>
  <text x="498" y="234" fill="#8a8a8a">CB</text>

  <!-- DF row -->
  <text x="98" y="234" fill="#8a8a8a">end</text>
  <text x="98" y="260" fill="#8a8a8a">DF</text>
  <text x="238" y="260" fill="#8a8a8a">&#8212;</text>
  <text x="320" y="260" fill="#4a90d9">0.5</text>
  <text x="410" y="260" fill="#4a90d9">0.5</text>
  <text x="508" y="260" fill="#8a8a8a">&#8212;</text>

  <!-- FEM row -->
  <text x="98" y="286" fill="#8a8a8a">FEM</text>
  <text x="230" y="286" fill="#8a8a8a">+12</text>
  <text x="318" y="286" fill="#8a8a8a">&#8722;12</text>
  <text x="418" y="286" fill="#8a8a8a">0</text>
  <text x="508" y="286" fill="#8a8a8a">0</text>

  <!-- balance (distribute) row -->
  <text x="98" y="312" fill="#8a8a8a">balance</text>
  <text x="238" y="312" fill="#8a8a8a">0</text>
  <text x="322" y="312" fill="#4a90d9">+6</text>
  <text x="412" y="312" fill="#4a90d9">+6</text>
  <text x="508" y="312" fill="#8a8a8a">0</text>

  <!-- carry-over row -->
  <text x="98" y="338" fill="#8a8a8a">carry-over</text>
  <text x="230" y="338" fill="#e0645c">+3</text>
  <text x="326" y="338" fill="#8a8a8a">0</text>
  <text x="416" y="338" fill="#8a8a8a">0</text>
  <text x="504" y="338" fill="#e0645c">+3</text>

  <!-- final row: use a second table block below is not needed; overlay totals under carry-over? -->

  <!-- carry-over arrows: from B balance cells to far ends -->
  <path d="M 322 306 C 285 300 250 300 236 316" fill="none" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="3 3"/>
  <polygon points="236,316 240,307 231,309" fill="#e0645c"/>
  <path d="M 430 306 C 470 300 500 300 510 316" fill="none" stroke="#e0645c" stroke-width="1.2" stroke-dasharray="3 3"/>
  <polygon points="510,316 511,307 503,311" fill="#e0645c"/>
  <text x="255" y="298" fill="#e0645c" font-size="11">&#215;1/2</text>
  <text x="455" y="298" fill="#e0645c" font-size="11">&#215;1/2</text>

  <!-- final totals shown to the right of the table -->
  <text x="98" y="364" fill="#4a90d9">final =</text>
  <text x="150" y="364" fill="#4a90d9">FEM + balance + carry-over  &#8594;  +15,  &#8722;6,  +6,  +3  kN&#183;m</text>
</svg>
