<svg viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Propped cantilever = the cantilever (primary structure) + the redundant R_B, picked so B does not move.</text>

  <!-- =========================================================== -->
  <!-- ROW 1: the actual, indeterminate propped cantilever -->
  <!-- baseline y = 78 -->

  <!-- fixed wall at A (x=70) -->
  <line x1="70" y1="52" x2="70" y2="104" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="70" y1="56" x2="60" y2="66" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="66" x2="60" y2="76" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="76" x2="60" y2="86" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="86" x2="60" y2="96" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="96" x2="60" y2="106" stroke="#8a8a8a" stroke-width="1"/>

  <!-- beam A to B -->
  <line x1="70" y1="78" x2="300" y2="78" stroke="#8a8a8a" stroke-width="3"/>

  <!-- UDL arrows on top -->
  <line x1="90" y1="50" x2="290" y2="50" stroke="#4a90d9" stroke-width="1.5"/>
  <line x1="100" y1="50" x2="100" y2="72" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="100,72 96,63 104,63" fill="#4a90d9"/>
  <line x1="140" y1="50" x2="140" y2="72" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="140,72 136,63 144,63" fill="#4a90d9"/>
  <line x1="180" y1="50" x2="180" y2="72" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="180,72 176,63 184,63" fill="#4a90d9"/>
  <line x1="220" y1="50" x2="220" y2="72" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="220,72 216,63 224,63" fill="#4a90d9"/>
  <line x1="260" y1="50" x2="260" y2="72" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="260,72 256,63 264,63" fill="#4a90d9"/>
  <text x="185" y="44" fill="#4a90d9">w</text>

  <!-- roller at B -->
  <circle cx="300" cy="85" r="6" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="286" y1="92" x2="314" y2="92" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="290" y1="92" x2="284" y2="100" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="300" y1="92" x2="294" y2="100" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="310" y1="92" x2="304" y2="100" stroke="#8a8a8a" stroke-width="1"/>

  <text x="58" y="120" fill="#8a8a8a">A</text>
  <text x="296" y="120" fill="#8a8a8a">B</text>
  <text x="360" y="82" fill="#8a8a8a">actual: indeterminate</text>

  <!-- =========================================================== -->
  <!-- ROW 2: released cantilever under the real load, droops delta_0 -->
  <!-- baseline y = 178 -->

  <line x1="70" y1="152" x2="70" y2="204" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="70" y1="156" x2="60" y2="166" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="166" x2="60" y2="176" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="176" x2="60" y2="186" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="186" x2="60" y2="196" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="196" x2="60" y2="206" stroke="#8a8a8a" stroke-width="1"/>

  <!-- undeflected reference -->
  <line x1="70" y1="178" x2="300" y2="178" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- deflected cantilever (droops at free end) -->
  <path d="M 70 178 C 170 178 250 188 300 198" fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- light UDL cue -->
  <line x1="100" y1="150" x2="100" y2="172" stroke="#4a90d9" stroke-width="1"/>
  <polygon points="100,172 97,165 103,165" fill="#4a90d9"/>
  <line x1="180" y1="150" x2="180" y2="172" stroke="#4a90d9" stroke-width="1"/>
  <polygon points="180,172 177,165 183,165" fill="#4a90d9"/>
  <line x1="260" y1="150" x2="260" y2="172" stroke="#4a90d9" stroke-width="1"/>
  <polygon points="260,172 257,165 263,165" fill="#4a90d9"/>

  <!-- delta_0 marker -->
  <line x1="300" y1="178" x2="300" y2="198" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="300,198 296,189 304,189" fill="#e0645c"/>
  <text x="308" y="196" fill="#e0645c">&#948;&#8320;</text>

  <text x="360" y="182" fill="#8a8a8a">released + real load</text>

  <!-- =========================================================== -->
  <!-- ROW 3: released cantilever under the redundant R_B, lifts back -->
  <!-- baseline y = 278 -->

  <line x1="70" y1="252" x2="70" y2="304" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="70" y1="256" x2="60" y2="266" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="266" x2="60" y2="276" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="276" x2="60" y2="286" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="286" x2="60" y2="296" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="296" x2="60" y2="306" stroke="#8a8a8a" stroke-width="1"/>

  <!-- undeflected reference -->
  <line x1="70" y1="278" x2="300" y2="278" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- deflected cantilever (lifts at free end) -->
  <path d="M 70 278 C 170 278 250 268 300 258" fill="none" stroke="#e0645c" stroke-width="3"/>

  <!-- redundant force R_B pointing up -->
  <line x1="300" y1="296" x2="300" y2="252" stroke="#e0645c" stroke-width="2"/>
  <polygon points="300,250 295,261 305,261" fill="#e0645c"/>
  <text x="308" y="278" fill="#e0645c">R_B</text>

  <text x="360" y="282" fill="#8a8a8a">released + redundant</text>

  <!-- =========================================================== -->
  <!-- compatibility statement -->
  <text x="70" y="336" fill="#8a8a8a">Compatibility at B:  &#948;&#8320; (down)  &#8722;  f&#8901;R_B (up)  =  0   so   R_B = &#948;&#8320; / f.</text>
</svg>
