<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- caption -->
  <text x="40" y="20" fill="#8a8a8a" font-style="italic">One unit load walks across; each panel is what section C feels as it goes by.</text>

  <!-- ===== panel 1: the beam ===== -->
  <text x="18" y="79" fill="#8a8a8a">beam</text>

  <!-- moving unit load -->
  <line x1="200" y1="44" x2="200" y2="67" stroke="#e0645c" stroke-width="2"/>
  <polygon points="200,70 195,60 205,60" fill="#e0645c"/>
  <text x="194" y="40" fill="#e0645c">1</text>
  <!-- position dimension x -->
  <line x1="80" y1="106" x2="200" y2="106" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="80" y1="101" x2="80" y2="111" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="200" y1="101" x2="200" y2="111" stroke="#8a8a8a" stroke-width="1"/>
  <text x="134" y="120" fill="#8a8a8a">x</text>

  <!-- beam line -->
  <line x1="80" y1="70" x2="520" y2="70" stroke="#8a8a8a" stroke-width="3"/>

  <!-- pin at A -->
  <polygon points="80,70 72,88 88,88" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="68" y1="88" x2="92" y2="88" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="74" y="102" fill="#8a8a8a">A</text>

  <!-- roller at B -->
  <polygon points="520,70 512,86 528,86" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="515" cy="90" r="3" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="525" cy="90" r="3" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="508" y1="95" x2="532" y2="95" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="514" y="109" fill="#8a8a8a">B</text>

  <!-- section C at midspan -->
  <line x1="300" y1="56" x2="300" y2="98" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="296" y="52" fill="#8a8a8a">C</text>

  <!-- ===== panel 2: IL for moment at C ===== -->
  <text x="18" y="188" fill="#4a90d9">IL for</text>
  <text x="18" y="203" fill="#4a90d9">M at C</text>

  <line x1="80" y1="185" x2="520" y2="185" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="300" y1="185" x2="300" y2="145" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <polygon points="80,185 300,140 520,185" fill="#4a90d9" opacity="0.15"/>
  <polyline points="80,185 300,140 520,185" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="308" y="140" fill="#4a90d9">peak = ab/L  (= L/4 at midspan)</text>

  <!-- ===== panel 3: IL for shear at C ===== -->
  <text x="18" y="318" fill="#4a90d9">IL for</text>
  <text x="18" y="333" fill="#4a90d9">V at C</text>

  <line x1="80" y1="315" x2="520" y2="315" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- left branch: 0 at A down to -a/L just left of C -->
  <polygon points="80,315 300,343 300,315" fill="#4a90d9" opacity="0.12"/>
  <line x1="80" y1="315" x2="300" y2="343" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- right branch: +b/L just right of C down to 0 at B -->
  <polygon points="300,287 520,315 300,315" fill="#4a90d9" opacity="0.12"/>
  <line x1="300" y1="287" x2="520" y2="315" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- unit jump at C -->
  <line x1="300" y1="343" x2="300" y2="287" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="300,287 296,297 304,297" fill="#e0645c"/>
  <polygon points="300,343 296,333 304,333" fill="#e0645c"/>
  <text x="308" y="300" fill="#e0645c">jump = 1</text>
  <text x="308" y="283" fill="#8a8a8a">+b/L</text>
  <text x="240" y="358" fill="#8a8a8a">&#8722;a/L</text>
</svg>
