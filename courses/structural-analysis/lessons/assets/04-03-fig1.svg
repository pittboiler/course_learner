<svg viewBox="0 0 640 450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">Two beam elements, six nodal DOFs; each element's 4x4 stiffness overlaps at the shared node 2 to build the global K.</text>

  <!-- ============ PANEL A: two-element beam with numbered DOFs ============ -->
  <text x="30" y="52" fill="#8a8a8a">Structure: 3 nodes, 2 elements, DOFs [v, &#952;] per node</text>

  <!-- element A beam (nodes 1-2), blue -->
  <line x1="110" y1="105" x2="300" y2="105" stroke="#4a90d9" stroke-width="4"/>
  <!-- element B beam (nodes 2-3), coral -->
  <line x1="300" y1="105" x2="490" y2="105" stroke="#e0645c" stroke-width="4"/>

  <!-- element labels -->
  <text x="188" y="128" fill="#4a90d9">element A</text>
  <text x="378" y="128" fill="#e0645c">element B</text>

  <!-- nodes -->
  <circle cx="110" cy="105" r="5" fill="#8a8a8a"/>
  <circle cx="300" cy="105" r="5" fill="#8a8a8a"/>
  <circle cx="490" cy="105" r="5" fill="#8a8a8a"/>
  <text x="104" y="150" fill="#8a8a8a">node 1</text>
  <text x="284" y="150" fill="#8a8a8a">node 2</text>
  <text x="474" y="150" fill="#8a8a8a">node 3</text>

  <!-- transverse displacement DOFs (v), arrows up -->
  <line x1="110" y1="100" x2="110" y2="66" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="110,62 106,72 114,72" fill="#8a8a8a"/>
  <text x="86" y="60" fill="#8a8a8a">v&#8321; &#183; 1</text>
  <line x1="300" y1="100" x2="300" y2="66" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="300,62 296,72 304,72" fill="#8a8a8a"/>
  <text x="276" y="60" fill="#8a8a8a">v&#8322; &#183; 3</text>
  <line x1="490" y1="100" x2="490" y2="66" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="490,62 486,72 494,72" fill="#8a8a8a"/>
  <text x="466" y="60" fill="#8a8a8a">v&#8323; &#183; 5</text>

  <!-- rotation DOFs, curved arrows below -->
  <path d="M 98 170 A 14 14 0 1 1 122 170" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="122,170 114,166 118,175" fill="#8a8a8a"/>
  <text x="128" y="176" fill="#8a8a8a">&#952;&#8321; &#183; 2</text>
  <path d="M 288 170 A 14 14 0 1 1 312 170" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="312,170 304,166 308,175" fill="#8a8a8a"/>
  <text x="318" y="176" fill="#8a8a8a">&#952;&#8322; &#183; 4</text>
  <path d="M 478 170 A 14 14 0 1 1 502 170" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="502,170 494,166 498,175" fill="#8a8a8a"/>
  <text x="508" y="176" fill="#8a8a8a">&#952;&#8323; &#183; 6</text>

  <!-- ============ PANEL B: matrix assembly ============ -->
  <text x="30" y="228" fill="#8a8a8a">Assembly: overlap element blocks into the 6x6 global K</text>

  <!-- 6x6 grid, cell 27, origin (400,250) -->
  <!-- vertical lines -->
  <line x1="400" y1="250" x2="400" y2="412" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="427" y1="250" x2="427" y2="412" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="454" y1="250" x2="454" y2="412" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="481" y1="250" x2="481" y2="412" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="508" y1="250" x2="508" y2="412" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="535" y1="250" x2="535" y2="412" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="562" y1="250" x2="562" y2="412" stroke="#8a8a8a" stroke-width="1"/>
  <!-- horizontal lines -->
  <line x1="400" y1="250" x2="562" y2="250" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="400" y1="277" x2="562" y2="277" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="400" y1="304" x2="562" y2="304" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="400" y1="331" x2="562" y2="331" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="400" y1="358" x2="562" y2="358" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="400" y1="385" x2="562" y2="385" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="400" y1="412" x2="562" y2="412" stroke="#8a8a8a" stroke-width="1"/>

  <!-- overlap 2x2 block (DOFs 3,4) filled highlight -->
  <rect x="454" y="304" width="54" height="54" fill="#8a8a8a" fill-opacity="0.18"/>

  <!-- element A block outline (DOFs 1-4), blue -->
  <rect x="400" y="250" width="108" height="108" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- element B block outline (DOFs 3-6), coral -->
  <rect x="454" y="304" width="108" height="108" fill="none" stroke="#e0645c" stroke-width="2.5"/>

  <!-- DOF index labels across top -->
  <text x="409" y="244" fill="#8a8a8a" font-size="12">1</text>
  <text x="436" y="244" fill="#8a8a8a" font-size="12">2</text>
  <text x="463" y="244" fill="#8a8a8a" font-size="12">3</text>
  <text x="490" y="244" fill="#8a8a8a" font-size="12">4</text>
  <text x="517" y="244" fill="#8a8a8a" font-size="12">5</text>
  <text x="544" y="244" fill="#8a8a8a" font-size="12">6</text>
  <!-- DOF index labels down left -->
  <text x="386" y="268" fill="#8a8a8a" font-size="12">1</text>
  <text x="386" y="295" fill="#8a8a8a" font-size="12">2</text>
  <text x="386" y="322" fill="#8a8a8a" font-size="12">3</text>
  <text x="386" y="349" fill="#8a8a8a" font-size="12">4</text>
  <text x="386" y="376" fill="#8a8a8a" font-size="12">5</text>
  <text x="386" y="403" fill="#8a8a8a" font-size="12">6</text>

  <!-- legend -->
  <line x1="60" y1="268" x2="90" y2="268" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="96" y="273" fill="#8a8a8a">element A: k on DOFs 1-4</text>
  <line x1="60" y1="296" x2="90" y2="296" stroke="#e0645c" stroke-width="2.5"/>
  <text x="96" y="301" fill="#8a8a8a">element B: k on DOFs 3-6</text>
  <rect x="60" y="316" width="30" height="16" fill="#8a8a8a" fill-opacity="0.18"/>
  <text x="96" y="329" fill="#8a8a8a">shared node 2: entries ADD</text>
  <text x="60" y="365" fill="#8a8a8a" font-size="13">Solve K d = F for free d,</text>
  <text x="60" y="385" fill="#8a8a8a" font-size="13">after striking fixed DOFs.</text>
</svg>
