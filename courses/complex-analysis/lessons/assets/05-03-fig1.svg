<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- title -->
  <text x="360" y="24" fill="#8a8a8a" text-anchor="middle" font-style="italic">Each singularity is fingerprinted by how far its negative (principal) powers run.</text>

  <!-- ============ PANEL 1: REMOVABLE ============ -->
  <text x="130" y="58" fill="#4a90d9" text-anchor="middle" font-weight="bold">Removable</text>
  <text x="130" y="76" fill="#8a8a8a" text-anchor="middle">no negative powers</text>

  <!-- baseline -->
  <line x1="30" y1="230" x2="230" y2="230" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- divider between principal (left) and regular (right) parts at power 0 -->
  <line x1="130" y1="90" x2="130" y2="245" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- regular-part bars only (a0, a1, a2 ...) -->
  <rect x="136" y="170" width="16" height="60" fill="#4a90d9" opacity="0.55"/>
  <rect x="158" y="185" width="16" height="45" fill="#4a90d9" opacity="0.55"/>
  <rect x="180" y="200" width="16" height="30" fill="#4a90d9" opacity="0.55"/>
  <rect x="202" y="212" width="16" height="18" fill="#4a90d9" opacity="0.55"/>
  <!-- power labels -->
  <text x="144" y="246" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="166" y="246" fill="#8a8a8a" text-anchor="middle">1</text>
  <text x="188" y="246" fill="#8a8a8a" text-anchor="middle">2</text>
  <!-- verdict -->
  <text x="130" y="276" fill="#8a8a8a" text-anchor="middle">extends holomorphically</text>
  <text x="130" y="296" fill="#8a8a8a" text-anchor="middle" font-style="italic">e.g. sin z / z</text>

  <!-- ============ PANEL 2: POLE of order m ============ -->
  <text x="360" y="58" fill="#e0645c" text-anchor="middle" font-weight="bold">Pole of order m</text>
  <text x="360" y="76" fill="#8a8a8a" text-anchor="middle">finite tail down to −m</text>

  <line x1="260" y1="230" x2="460" y2="230" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="360" y1="90" x2="360" y2="245" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- principal-part bars: a_-3 .. a_-1 (finite), lowest a_-m -->
  <rect x="286" y="150" width="16" height="80" fill="#e0645c" opacity="0.7"/>
  <rect x="308" y="140" width="16" height="90" fill="#e0645c" opacity="0.7"/>
  <rect x="330" y="130" width="16" height="100" fill="#e0645c" opacity="0.7"/>
  <!-- regular-part bars -->
  <rect x="366" y="175" width="16" height="55" fill="#4a90d9" opacity="0.55"/>
  <rect x="388" y="190" width="16" height="40" fill="#4a90d9" opacity="0.55"/>
  <rect x="410" y="203" width="16" height="27" fill="#4a90d9" opacity="0.55"/>
  <!-- power labels -->
  <text x="294" y="246" fill="#e0645c" text-anchor="middle">−m</text>
  <text x="338" y="246" fill="#e0645c" text-anchor="middle">−1</text>
  <text x="374" y="246" fill="#8a8a8a" text-anchor="middle">0</text>
  <!-- brace marker for finite principal part -->
  <text x="316" y="120" fill="#e0645c" text-anchor="middle" font-size="12">stops at −m</text>
  <!-- verdict -->
  <text x="360" y="276" fill="#8a8a8a" text-anchor="middle">| f | → ∞ from every direction</text>
  <text x="360" y="296" fill="#8a8a8a" text-anchor="middle" font-style="italic">e.g. 1 / (z−1)(z−2)</text>

  <!-- ============ PANEL 3: ESSENTIAL ============ -->
  <text x="590" y="58" fill="#e0645c" text-anchor="middle" font-weight="bold">Essential</text>
  <text x="590" y="76" fill="#8a8a8a" text-anchor="middle">infinite tail — never stops</text>

  <line x1="490" y1="230" x2="690" y2="230" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="590" y1="90" x2="590" y2="245" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- principal-part bars running off the left edge -->
  <rect x="516" y="160" width="14" height="70" fill="#e0645c" opacity="0.7"/>
  <rect x="534" y="150" width="14" height="80" fill="#e0645c" opacity="0.7"/>
  <rect x="552" y="140" width="14" height="90" fill="#e0645c" opacity="0.7"/>
  <rect x="570" y="128" width="14" height="102" fill="#e0645c" opacity="0.7"/>
  <!-- ellipsis running off to the left -->
  <text x="500" y="200" fill="#e0645c" text-anchor="middle" font-size="18">···</text>
  <!-- regular-part bars -->
  <rect x="596" y="180" width="14" height="50" fill="#4a90d9" opacity="0.55"/>
  <rect x="616" y="193" width="14" height="37" fill="#4a90d9" opacity="0.55"/>
  <rect x="636" y="205" width="14" height="25" fill="#4a90d9" opacity="0.55"/>
  <!-- power label -->
  <text x="603" y="246" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="577" y="246" fill="#e0645c" text-anchor="middle">−1</text>
  <text x="548" y="118" fill="#e0645c" text-anchor="middle" font-size="12">no lowest power</text>
  <!-- verdict -->
  <text x="590" y="276" fill="#8a8a8a" text-anchor="middle">values dense in ℂ (Casorati–Weierstrass)</text>
  <text x="590" y="296" fill="#8a8a8a" text-anchor="middle" font-style="italic">e.g. e^(1/z)</text>

  <!-- footer legend -->
  <rect x="250" y="315" width="14" height="10" fill="#e0645c" opacity="0.7"/>
  <text x="270" y="324" fill="#8a8a8a">principal part (negative powers)</text>
  <rect x="470" y="315" width="14" height="10" fill="#4a90d9" opacity="0.55"/>
  <text x="490" y="324" fill="#8a8a8a">regular part (powers ≥ 0)</text>
</svg>
