<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- ===================== LEFT: z-plane, unit disk ===================== -->
  <text x="150" y="30" fill="#8a8a8a" text-anchor="middle" font-style="italic">z-plane: the unit disk</text>

  <!-- axes -->
  <line x1="50" y1="180" x2="260" y2="180" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="150" y1="70" x2="150" y2="290" stroke="#8a8a8a" stroke-width="1"/>

  <!-- shaded disk + boundary circle -->
  <circle cx="150" cy="180" r="80" fill="#4a90d9" opacity="0.12"/>
  <circle cx="150" cy="180" r="80" fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- tracked boundary points 1, i, -1 -->
  <circle cx="230" cy="180" r="4.5" fill="#e0645c"/>
  <text x="238" y="198" fill="#e0645c">1</text>
  <circle cx="150" cy="100" r="4.5" fill="#e0645c"/>
  <text x="158" y="96" fill="#e0645c">i</text>
  <circle cx="70" cy="180" r="4.5" fill="#e0645c"/>
  <text x="52" y="198" fill="#e0645c">&#8722;1</text>

  <!-- interior test point: the center 0 -->
  <circle cx="150" cy="180" r="4.5" fill="#4a90d9"/>
  <text x="132" y="198" fill="#4a90d9">0</text>

  <!-- ===================== ARROW ===================== -->
  <line x1="272" y1="180" x2="352" y2="180" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="352,180 342,175 342,185" fill="#8a8a8a"/>
  <text x="312" y="168" fill="#8a8a8a" text-anchor="middle">T</text>
  <text x="312" y="205" fill="#8a8a8a" text-anchor="middle" font-size="12">-i (z-1)/(z+1)</text>

  <!-- ===================== RIGHT: w-plane, upper half-plane ===================== -->
  <text x="490" y="30" fill="#8a8a8a" text-anchor="middle" font-style="italic">w-plane: the upper half-plane</text>

  <!-- shaded upper half-plane (above the real axis) -->
  <rect x="380" y="90" width="220" height="160" fill="#4a90d9" opacity="0.12"/>

  <!-- image of the unit circle = the real axis (a line = circle through infinity) -->
  <line x1="380" y1="250" x2="600" y2="250" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- imaginary axis (light) -->
  <line x1="460" y1="90" x2="460" y2="300" stroke="#8a8a8a" stroke-width="1"/>

  <!-- images: 1 -> 0, i -> 1 -->
  <circle cx="460" cy="250" r="4.5" fill="#e0645c"/>
  <text x="452" y="270" fill="#e0645c">0</text>
  <circle cx="510" cy="250" r="4.5" fill="#e0645c"/>
  <text x="504" y="270" fill="#e0645c">1</text>

  <!-- image: -1 -> infinity, running off along the axis -->
  <line x1="560" y1="250" x2="595" y2="250" stroke="#e0645c" stroke-width="1.5" stroke-dasharray="3 4"/>
  <polygon points="595,250 585,245 585,255" fill="#e0645c"/>
  <text x="566" y="242" fill="#e0645c">&#8734;</text>

  <!-- interior test point image: center 0 -> i -->
  <circle cx="460" cy="200" r="4.5" fill="#4a90d9"/>
  <text x="468" y="196" fill="#4a90d9">i</text>

  <!-- ===================== caption ===================== -->
  <text x="320" y="325" fill="#8a8a8a" text-anchor="middle" font-style="italic">Boundary to boundary (circle to line); the center 0 lands at i, so the inside maps to the upper half.</text>
</svg>
