<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- axes -->
  <line x1="30" y1="180" x2="548" y2="180" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="70" y1="14" x2="70" y2="336" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="548,180 538,175 538,185" fill="#8a8a8a"/>
  <text x="544" y="197" fill="#8a8a8a">x</text>

  <!-- y = 1 and y = -1 guide lines -->
  <line x1="70" y1="118" x2="540" y2="118" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 5"/>
  <line x1="70" y1="242" x2="540" y2="242" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 5"/>
  <text x="52" y="123" fill="#8a8a8a">1</text>
  <text x="46" y="247" fill="#8a8a8a">-1</text>

  <!-- x tick at pi -->
  <line x1="316" y1="176" x2="316" y2="184" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="309" y="200" fill="#8a8a8a" font-style="italic">&#960;</text>

  <!-- S1 = 1 - x^2/2  (peels off downward first) -->
  <path d="M 70.0 118.0 L 90.1 120.0 L 110.3 126.2 L 130.4 136.4 L 150.6 150.8 L 170.7 169.2 L 190.9 191.8 L 211.0 218.4 L 231.1 249.2 L 251.3 284.0 L 268.1 316.2"
        fill="none" stroke="#e0645c" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- S2 = 1 - x^2/2 + x^4/24  (hugs longer, then peels upward) -->
  <path d="M 70.0 118.0 L 100.2 122.6 L 130.4 135.5 L 160.6 154.9 L 190.9 177.2 L 221.1 197.6 L 251.3 209.9 L 281.5 206.7 L 305.0 187.8 L 321.8 162.5 L 335.2 133.9 L 345.3 106.8 L 355.4 74.4 L 362.1 49.7 L 368.8 22.2"
        fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- true cos x -->
  <path d="M 70.0 118.0 L 100.2 122.6 L 130.4 135.6 L 160.6 155.1 L 190.9 178.3 L 221.1 201.7 L 251.3 222.0 L 281.5 236.1 L 311.7 241.9 L 341.9 238.7 L 372.1 226.8 L 402.4 208.1 L 432.6 185.2 L 462.8 161.6 L 493.0 140.6 L 523.2 125.5 L 540.0 120.5"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- labels -->
  <text x="112" y="308" fill="#e0645c">S&#8321; = 1 &#8722; x&#178;/2</text>
  <text x="372" y="40" fill="#8a8a8a">S&#8322; = 1 &#8722; x&#178;/2 + x&#8308;/24</text>
  <text x="430" y="150" fill="#4a90d9">cos x</text>

  <!-- caption -->
  <text x="78" y="30" fill="#8a8a8a" font-style="italic">Each partial sum hugs cos x near 0, then peels away &#8212; more terms, longer grip.</text>
</svg>
