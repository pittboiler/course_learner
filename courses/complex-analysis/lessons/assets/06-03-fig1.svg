  <!-- the origin w = 0 -->
  <circle cx="250" cy="185" r="5" fill="#e0645c"/>
  <text x="256" y="203" fill="#e0645c">0</text>

  <!-- annotations -->
  <text x="150" y="40" fill="#8a8a8a" font-style="italic">The image curve f(&#947;) in the w-plane winds around 0 twice.</text>
  <text x="150" y="345" fill="#4a90d9">winding number = 2  &#8658;  Z &#8722; P = 2 zeros (minus poles) inside &#947;</text>
</svg>
