<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- title -->
  <text x="20" y="26" fill="#8a8a8a" font-style="italic">A hard region and the friendly disk: a conformal map carries the heat problem across.</text>

  <!-- ===================== LEFT: ugly region ===================== -->
  <!-- filled region -->
  <path d="M 80 185 C 95 100, 180 90, 220 165 C 240 220, 120 255, 80 185 Z"
        fill="#8a8a8a" opacity="0.10"/>
  <!-- hot boundary arc (top) -->
  <path d="M 80 185 C 95 100, 180 90, 220 165"
        fill="none" stroke="#e0645c" stroke-width="3.5"/>
  <!-- cold boundary arc (bottom) -->
  <path d="M 220 165 C 240 220, 120 255, 80 185"
        fill="none" stroke="#4a90d9" stroke-width="3.5"/>
  <!-- interior isotherms -->
  <path d="M 92 178 C 120 138, 178 132, 208 160" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4 4"/>
  <path d="M 92 195 C 128 178, 176 178, 210 178" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4 4"/>

  <text x="150" y="80" fill="#e0645c" text-anchor="middle">hot: u = 100°</text>
  <text x="150" y="278" fill="#4a90d9" text-anchor="middle">cold: u = 0°</text>
  <text x="150" y="315" fill="#8a8a8a" text-anchor="middle" font-style="italic">region Ω (∇²u = 0)</text>

  <!-- ===================== ARROW ===================== -->
  <line x1="300" y1="172" x2="378" y2="172" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="378,172 366,166 366,178" fill="#8a8a8a"/>
  <text x="339" y="160" fill="#8a8a8a" text-anchor="middle">φ</text>
  <text x="339" y="192" fill="#8a8a8a" text-anchor="middle" font-size="12">conformal</text>

  <!-- ===================== RIGHT: unit disk ===================== -->
  <circle cx="500" cy="172" r="80" fill="#8a8a8a" opacity="0.10"/>
  <!-- hot upper semicircle -->
  <path d="M 420 172 A 80 80 0 0 1 580 172" fill="none" stroke="#e0645c" stroke-width="3.5"/>
  <!-- cold lower semicircle -->
  <path d="M 580 172 A 80 80 0 0 1 420 172" fill="none" stroke="#4a90d9" stroke-width="3.5"/>
  <!-- interior isotherms (transported) -->
  <line x1="421" y1="157" x2="579" y2="157" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="421" y1="187" x2="579" y2="187" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4 4"/>
  <circle cx="500" cy="172" r="3.5" fill="#8a8a8a"/>

  <text x="500" y="315" fill="#8a8a8a" text-anchor="middle" font-style="italic">unit disk 𝔻 — solve here, pull back</text>
</svg>
