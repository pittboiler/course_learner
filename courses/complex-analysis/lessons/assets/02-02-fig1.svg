<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <text x="18" y="22" fill="#8a8a8a" font-style="italic">Cauchy–Riemann, geometrically: infinitesimally a rotation + scaling, never a reflection.</text>

  <!-- ============ SOURCE CELL ============ -->
  <polygon points="90,190 142,190 142,138 90,138" fill="#8a8a8a" opacity="0.12"/>
  <line x1="90" y1="190" x2="142" y2="190" stroke="#4a90d9" stroke-width="3"/>
  <line x1="90" y1="190" x2="90"  y2="138" stroke="#e0645c" stroke-width="3"/>
  <text x="80"  y="205" fill="#8a8a8a">1</text>
  <text x="147" y="205" fill="#8a8a8a">2</text>
  <text x="147" y="135" fill="#8a8a8a">3</text>
  <text x="44"  y="230" fill="#8a8a8a">an oriented cell (1→2→3)</text>

  <!-- ============ ARROWS ============ -->
  <path d="M150,142 Q 275,70 372,92" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="200" y="86" fill="#4a90d9">f  ·  CR hold</text>

  <path d="M150,182 Q 278,250 384,268" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="196" y="262" fill="#e0645c">z̄  ·  CR fail</text>

  <!-- ============ HOLOMORPHIC IMAGE (rotate + scale) ============ -->
  <polygon points="400,110 450,95 435,45 385,60" fill="#4a90d9" opacity="0.10"/>
  <line x1="400" y1="110" x2="450" y2="95" stroke="#4a90d9" stroke-width="3"/>
  <line x1="400" y1="110" x2="385" y2="60" stroke="#e0645c" stroke-width="3"/>
  <text x="392" y="126" fill="#8a8a8a">1</text>
  <text x="456" y="94"  fill="#8a8a8a">2</text>
  <text x="440" y="42"  fill="#8a8a8a">3</text>
  <text x="356" y="28"  fill="#8a8a8a">square → square, orientation kept</text>

  <!-- ============ CONJUGATE IMAGE (reflection) ============ -->
  <polygon points="400,255 452,255 452,307 400,307" fill="#e0645c" opacity="0.10"/>
  <line x1="400" y1="255" x2="452" y2="255" stroke="#4a90d9" stroke-width="3"/>
  <line x1="400" y1="255" x2="400" y2="307" stroke="#e0645c" stroke-width="3"/>
  <text x="390" y="251" fill="#8a8a8a">1</text>
  <text x="457" y="251" fill="#8a8a8a">2</text>
  <text x="457" y="322" fill="#8a8a8a">3</text>
  <text x="356" y="342" fill="#8a8a8a">square → square, orientation flipped</text>
</svg>
