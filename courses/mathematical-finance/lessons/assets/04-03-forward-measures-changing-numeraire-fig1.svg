<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#111827">Same claim, two units of account — one price</text>

  <!-- Central claim box -->
  <rect x="290" y="66" width="140" height="46" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="360" y="88" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">time-T payoff</text>
  <text x="360" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3a8a">X_T</text>

  <!-- Left branch: money-market numeraire -->
  <line x1="300" y1="112" x2="170" y2="160" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="40" y="162" width="270" height="118" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="175" y="186" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7c2d12">Numéraire B_t = e^(∫r)</text>
  <text x="175" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7c2d12">risk-neutral measure Q</text>
  <text x="175" y="238" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111827">V_0 = E^Q[ e^(−∫r) X_T ]</text>
  <text x="175" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">discount &amp; payoff correlated (stuck inside)</text>

  <!-- Right branch: T-bond numeraire -->
  <line x1="420" y1="112" x2="550" y2="160" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="410" y="162" width="270" height="118" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="545" y="186" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14532d">Numéraire P(t,T)</text>
  <text x="545" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#14532d">T-forward measure Q^T</text>
  <text x="545" y="238" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111827">V_0 = P(0,T) · E^(Q^T)[ X_T ]</text>
  <text x="545" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#166534">discount factored OUT (clean expectation)</text>

  <!-- Equality bar -->
  <line x1="175" y1="300" x2="545" y2="300" stroke="#111827" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="330" y="286" width="60" height="28" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
  <text x="360" y="305" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">=</text>

  <!-- Bottom takeaway -->
  <rect x="90" y="338" width="540" height="58" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="360" y="362" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111827">Price is numéraire-invariant. Pick the numéraire that makes the payoff simplest —</text>
  <text x="360" y="382" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111827">for a time-T claim, the T-bond pulls the stochastic discounting out front.</text>
</svg>
