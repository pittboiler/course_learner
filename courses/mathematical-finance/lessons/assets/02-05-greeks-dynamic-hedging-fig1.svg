<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Delta and Gamma of a call vs. spot price</text>

  <!-- axes -->
  <line x1="70" y1="340" x2="600" y2="340" stroke="#333333" stroke-width="1.5"/>
  <line x1="70" y1="340" x2="70" y2="40" stroke="#333333" stroke-width="1.5"/>

  <!-- delta reference gridlines 0 and 1 -->
  <line x1="70" y1="40" x2="600" y2="40" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="60" y="345" text-anchor="end" font-size="12" fill="#1f5fbf">0</text>
  <text x="60" y="45" text-anchor="end" font-size="12" fill="#1f5fbf">1</text>

  <!-- strike marker -->
  <line x1="335" y1="40" x2="335" y2="340" stroke="#888888" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="335" y="358" text-anchor="middle" font-size="12" fill="#555555">K = 100 (at the money)</text>

  <!-- x axis label -->
  <text x="320" y="384" text-anchor="middle" font-size="13" fill="#333333">Spot price S</text>
  <text x="72" y="382" text-anchor="start" font-size="11" fill="#777777">60</text>
  <text x="600" y="382" text-anchor="end" font-size="11" fill="#777777">140</text>

  <!-- Delta curve (blue): rises 0 -> 1 through the strike -->
  <polyline fill="none" stroke="#1f5fbf" stroke-width="2.5"
    points="70,335.9 136.25,317.2 202.5,273.4 268.75,211 335,149 401.25,101.3 467.5,71.1 533.75,54.5 600,46.3"/>

  <!-- Gamma curve (orange): a bump peaked near the money -->
  <polyline fill="none" stroke="#e07b00" stroke-width="2.5"
    points="70,304.9 136.25,217.5 202.5,116.9 268.75,78.2 335,114.9 401.25,185.4 467.5,250 533.75,293.7 600,318.3"/>

  <!-- curve labels -->
  <text x="546" y="42" font-size="13" fill="#1f5fbf" font-weight="bold">&#916; = N(d&#8321;)</text>
  <text x="250" y="70" font-size="13" fill="#e07b00" font-weight="bold">&#915; (curvature)</text>

  <!-- legend -->
  <line x1="88" y1="402" x2="118" y2="402" stroke="#1f5fbf" stroke-width="2.5"/>
  <text x="124" y="406" font-size="12" fill="#333333">Delta: hedge ratio, 0 &#8594; 1</text>
  <line x1="330" y1="402" x2="360" y2="402" stroke="#e07b00" stroke-width="2.5"/>
  <text x="366" y="406" font-size="12" fill="#333333">Gamma: how fast delta moves, peaks near ATM</text>
</svg>
