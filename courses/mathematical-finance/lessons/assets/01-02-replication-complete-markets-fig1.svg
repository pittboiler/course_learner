<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>

  <!-- title -->
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">One step, two states: the fan of outcomes</text>

  <!-- branches -->
  <line x1="150" y1="180" x2="440" y2="95" stroke="#111111" stroke-width="2"/>
  <line x1="150" y1="180" x2="440" y2="265" stroke="#111111" stroke-width="2"/>

  <!-- node: today -->
  <circle cx="150" cy="180" r="6" fill="#1a5fb4"/>
  <text x="150" y="210" text-anchor="middle" font-size="15" fill="#111111">today</text>
  <text x="150" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a5fb4">S_0 = 100</text>
  <text x="150" y="250" text-anchor="middle" font-size="13" fill="#555555">bond price 1</text>

  <!-- up node -->
  <circle cx="440" cy="95" r="6" fill="#2ec27e"/>
  <text x="460" y="80" font-size="15" fill="#111111">up state</text>
  <text x="460" y="100" font-size="16" font-weight="bold" fill="#1a5fb4">S_u = 120</text>
  <text x="460" y="120" font-size="14" fill="#c01c28">payoff V_u</text>

  <!-- down node -->
  <circle cx="440" cy="265" r="6" fill="#e5a50a"/>
  <text x="460" y="250" font-size="15" fill="#111111">down state</text>
  <text x="460" y="270" font-size="16" font-weight="bold" fill="#1a5fb4">S_d = 90</text>
  <text x="460" y="290" font-size="14" fill="#c01c28">payoff V_d</text>

  <!-- replication box -->
  <rect x="40" y="300" width="560" height="46" fill="#f2f2f2" stroke="#999999" stroke-width="1" rx="6"/>
  <text x="320" y="322" text-anchor="middle" font-size="14" fill="#111111">Hold &#916; shares + B bonds so the portfolio pays V_u up AND V_d down:</text>
  <text x="320" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a5fb4">&#916; S_u + R B = V_u   ,   &#916; S_d + R B = V_d</text>
</svg>
