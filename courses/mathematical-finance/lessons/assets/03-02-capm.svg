<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360">
  <rect x="0" y="0" width="480" height="360" fill="#ffffff"/>
  <!-- axes -->
  <line x1="60" y1="300" x2="450" y2="300" stroke="#222222" stroke-width="2"/>
  <line x1="60" y1="320" x2="60" y2="40" stroke="#222222" stroke-width="2"/>
  <!-- axis labels -->
  <text x="455" y="304" font-family="sans-serif" font-size="16" fill="#222222">β</text>
  <text x="30" y="45" font-family="sans-serif" font-size="15" fill="#222222">E[R]</text>
  <!-- x ticks: beta 0,1,2 at px 60,250,440 -->
  <line x1="250" y1="300" x2="250" y2="306" stroke="#222222" stroke-width="1.5"/>
  <text x="246" y="322" font-family="sans-serif" font-size="13" fill="#222222">1</text>
  <line x1="440" y1="300" x2="440" y2="306" stroke="#222222" stroke-width="1.5"/>
  <text x="436" y="322" font-family="sans-serif" font-size="13" fill="#222222">2</text>
  <!-- Security Market Line: through (0,rf=4%,py235) and (2,16%,py40) -->
  <line x1="60" y1="235" x2="440" y2="40" stroke="#1a5fb4" stroke-width="2.5"/>
  <text x="330" y="70" font-family="sans-serif" font-size="14" fill="#1a5fb4" font-weight="bold">SML</text>
  <!-- r_f intercept -->
  <line x1="55" y1="235" x2="60" y2="235" stroke="#222222" stroke-width="1.5"/>
  <text x="18" y="240" font-family="sans-serif" font-size="13" fill="#222222">r_f</text>
  <!-- market point at beta=1, E=10%, py=137.5 -->
  <circle cx="250" cy="138" r="5" fill="#1a5fb4"/>
  <text x="258" y="134" font-family="sans-serif" font-size="13" fill="#1a5fb4">M</text>
  <!-- E[R_M] guide -->
  <line x1="55" y1="138" x2="60" y2="138" stroke="#222222" stroke-width="1.5"/>
  <text x="6" y="142" font-family="sans-serif" font-size="12" fill="#222222">E[R_M]</text>
  <!-- fairly priced assets on the line -->
  <circle cx="155" cy="186" r="4.5" fill="#222222"/>
  <text x="120" y="182" font-family="sans-serif" font-size="12" fill="#222222">A</text>
  <circle cx="345" cy="89" r="4.5" fill="#222222"/>
  <text x="352" y="86" font-family="sans-serif" font-size="12" fill="#222222">B</text>
  <!-- mispriced asset C off the line: beta=0.8 (px=212), actual E=11% (py=121), SML says 8.8% (py=157) -->
  <line x1="212" y1="157" x2="212" y2="121" stroke="#c01c28" stroke-width="1.6" stroke-dasharray="4 3"/>
  <circle cx="212" cy="157" r="3.5" fill="none" stroke="#1a5fb4" stroke-width="1.6"/>
  <circle cx="212" cy="121" r="5" fill="#c01c28"/>
  <text x="220" y="117" font-family="sans-serif" font-size="12" fill="#c01c28">C</text>
  <text x="220" y="146" font-family="sans-serif" font-size="12" fill="#c01c28">α &gt; 0</text>
</svg>
