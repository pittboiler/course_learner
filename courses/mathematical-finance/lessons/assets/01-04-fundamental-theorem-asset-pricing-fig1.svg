<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" font-family="sans-serif">
  <rect x="0" y="0" width="460" height="360" fill="#ffffff"/>

  <!-- shaded nonnegative orthant (first quadrant) -->
  <rect x="230" y="40" width="200" height="145" fill="#d8f0dc"/>
  <text x="340" y="72" font-size="12" fill="#2f7a3e" text-anchor="middle">nonneg. orthant</text>
  <text x="340" y="88" font-size="11" fill="#2f7a3e" text-anchor="middle">payoff ≥ 0 (a "free lunch")</text>

  <!-- axes -->
  <line x1="40" y1="185" x2="435" y2="185" stroke="#222" stroke-width="1.5"/>
  <line x1="230" y1="345" x2="230" y2="30" stroke="#222" stroke-width="1.5"/>
  <text x="428" y="203" font-size="12" fill="#222">payoff in state 1</text>
  <text x="238" y="42" font-size="12" fill="#222">payoff in state 2</text>

  <!-- zero-cost marketed line M0 (negative slope: only touches orthant at O) -->
  <line x1="110" y1="65" x2="350" y2="305" stroke="#1f5fd0" stroke-width="2.5"/>
  <text x="112" y="58" font-size="12" fill="#1f5fd0">zero-cost payoffs</text>
  <text x="112" y="72" font-size="11" fill="#1f5fd0" font-style="italic">M₀ (no arbitrage)</text>

  <!-- state-price normal psi, into first quadrant -->
  <line x1="230" y1="185" x2="320" y2="95" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="326" y="94" font-size="13" fill="#c0392b" font-weight="bold">ψ &gt; 0</text>
  <text x="326" y="110" font-size="11" fill="#c0392b">state prices → Q</text>

  <!-- origin -->
  <circle cx="230" cy="185" r="3.5" fill="#222"/>
  <text x="212" y="205" font-size="12" fill="#222">O</text>

  <!-- arbitrage-case dashed line -->
  <line x1="120" y1="300" x2="345" y2="70" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="60" y="318" font-size="11" fill="#777">if M₀ tilted this way (+slope),</text>
  <text x="60" y="332" font-size="11" fill="#777">it cuts the orthant ⇒ arbitrage</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
