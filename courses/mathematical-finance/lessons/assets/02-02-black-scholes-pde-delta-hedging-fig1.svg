<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340">
  <rect x="0" y="0" width="480" height="340" fill="#ffffff"/>
  <!-- axes -->
  <line x1="60" y1="290" x2="450" y2="290" stroke="#333333" stroke-width="1.5"/>
  <line x1="60" y1="290" x2="60" y2="40" stroke="#333333" stroke-width="1.5"/>
  <text x="452" y="294" font-family="sans-serif" font-size="13" fill="#333333">S</text>
  <text x="30" y="48" font-family="sans-serif" font-size="13" fill="#333333">V</text>

  <!-- option value curve V(S): convex -->
  <polyline points="60,250 98,248.1 136,242.4 174,232.9 212,219.6 250,202.5 288,181.6 326,156.9 364,128.4 402,96.1 440,60"
            fill="none" stroke="#1a66cc" stroke-width="2.5"/>
  <text x="360" y="80" font-family="sans-serif" font-size="13" fill="#1a66cc">V(t,S)</text>

  <!-- tangent line = delta hedge at S0 -->
  <line x1="140" y1="257.5" x2="390" y2="132.5" stroke="#cc3300" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="150" y="272" font-family="sans-serif" font-size="12" fill="#cc3300">slope = &#916; = V_S  (the hedge)</text>

  <!-- tangency point -->
  <circle cx="250" cy="202.5" r="4" fill="#cc3300"/>
  <line x1="250" y1="202.5" x2="250" y2="290" stroke="#999999" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="238" y="306" font-family="sans-serif" font-size="12" fill="#333333">S&#8320;</text>

  <!-- gamma gap -->
  <line x1="364" y1="128.4" x2="364" y2="145.5" stroke="#009944" stroke-width="3"/>
  <text x="300" y="120" font-family="sans-serif" font-size="12" fill="#009944">&#915; curvature</text>
  <text x="300" y="135" font-family="sans-serif" font-size="12" fill="#009944">the hedge misses</text>

  <text x="70" y="30" font-family="sans-serif" font-size="12" fill="#666666">Locally the tangent (delta) tracks V; the gap it leaves is gamma.</text>
</svg>
