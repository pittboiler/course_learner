<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400">
  <rect x="0" y="0" width="520" height="400" fill="#ffffff"/>

  <!-- axes -->
  <line x1="60" y1="370" x2="500" y2="370" stroke="#111111" stroke-width="2"/>
  <line x1="60" y1="370" x2="60" y2="40" stroke="#111111" stroke-width="2"/>
  <polygon points="500,370 490,365 490,375" fill="#111111"/>
  <polygon points="60,40 55,50 65,50" fill="#111111"/>
  <text x="486" y="392" font-family="sans-serif" font-size="16" fill="#111111">&#963; (risk)</text>
  <text x="30" y="46" font-family="sans-serif" font-size="16" fill="#111111">&#956; (return)</text>

  <!-- risky-asset frontier: lower (inefficient) branch, dashed -->
  <path d="M130,210 Q160,270 200,300 Q248,338 300,358" fill="none" stroke="#1f4e8c" stroke-width="2" stroke-dasharray="5,5"/>
  <!-- risky-asset frontier: upper (efficient) branch, solid heavy -->
  <path d="M130,210 Q160,150 200,120 Q248,82 300,60" fill="none" stroke="#1f4e8c" stroke-width="3.5"/>

  <!-- Capital Market Line, tangent at (200,120) -->
  <line x1="60" y1="225" x2="330" y2="22" stroke="#c0392b" stroke-width="2.5"/>

  <!-- points -->
  <circle cx="130" cy="210" r="4.5" fill="#1f4e8c"/>
  <circle cx="200" cy="120" r="5" fill="#c0392b"/>
  <circle cx="60" cy="225" r="4.5" fill="#111111"/>

  <!-- labels -->
  <text x="86" y="200" font-family="sans-serif" font-size="13" fill="#1f4e8c">GMV</text>
  <text x="212" y="112" font-family="sans-serif" font-size="13" fill="#c0392b">tangency portfolio</text>
  <text x="24" y="229" font-family="sans-serif" font-size="14" fill="#111111">r_f</text>
  <text x="300" y="150" font-family="sans-serif" font-size="14" fill="#c0392b" font-weight="bold">CML</text>
  <text x="250" y="345" font-family="sans-serif" font-size="12" fill="#1f4e8c">inefficient branch</text>
  <text x="300" y="52" font-family="sans-serif" font-size="12" fill="#1f4e8c">efficient frontier</text>
</svg>
