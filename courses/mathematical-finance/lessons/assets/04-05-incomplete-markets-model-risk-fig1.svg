<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>

  <!-- ============ Panel A: interval vs single price ============ -->
  <text x="40" y="30" font-size="15" font-weight="bold" fill="#111111">One claim, how many arbitrage-free prices?</text>

  <!-- price axis -->
  <line x1="55" y1="250" x2="330" y2="250" stroke="#111111" stroke-width="1.5"/>
  <polygon points="330,250 322,246 322,254" fill="#111111"/>
  <text x="300" y="272" font-size="12" fill="#111111">price</text>
  <text x="60" y="272" font-size="11" fill="#666666">0</text>

  <!-- complete market: single dot -->
  <circle cx="150" cy="250" r="5" fill="#111111"/>
  <text x="95" y="300" font-size="11.5" fill="#111111">complete market:</text>
  <text x="112" y="316" font-size="11.5" font-weight="bold" fill="#111111">ONE price</text>
  <line x1="150" y1="250" x2="150" y2="290" stroke="#111111" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- incomplete market: interval band -->
  <line x1="110" y1="140" x2="110" y2="180" stroke="#c0392b" stroke-width="2"/>
  <line x1="300" y1="140" x2="300" y2="180" stroke="#c0392b" stroke-width="2"/>
  <rect x="110" y="152" width="190" height="16" fill="#c0392b" fill-opacity="0.22"/>
  <line x1="110" y1="160" x2="300" y2="160" stroke="#c0392b" stroke-width="2.5"/>
  <text x="120" y="128" font-size="13" font-weight="bold" fill="#c0392b">incomplete market: an INTERVAL</text>
  <text x="40" y="200" font-size="11" fill="#c0392b">sub-repl.</text>
  <text x="42" y="214" font-size="11" fill="#c0392b">(lower)</text>
  <text x="278" y="200" font-size="11" fill="#c0392b">super-repl.</text>
  <text x="284" y="214" font-size="11" fill="#c0392b">(upper)</text>
  <line x1="110" y1="180" x2="110" y2="250" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="300" y1="180" x2="300" y2="250" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="150" y="168" font-size="10.5" fill="#7b241c">every EMM Q gives a point in here</text>

  <!-- ============ Panel B: model risk ============ -->
  <text x="400" y="30" font-size="15" font-weight="bold" fill="#111111">Two models, one calibration, two answers</text>

  <!-- axes -->
  <line x1="415" y1="70" x2="415" y2="300" stroke="#111111" stroke-width="1.5"/>
  <line x1="415" y1="300" x2="700" y2="300" stroke="#111111" stroke-width="1.5"/>
  <text x="360" y="130" font-size="12" fill="#111111" transform="rotate(-90 360 130)">option price</text>
  <text x="500" y="326" font-size="12" fill="#111111">strike / exotic-ness &#8594;</text>

  <!-- model A (solid) and model B (dashed): agree at left, diverge right -->
  <path d="M 430 250 Q 500 210 560 180 Q 620 150 690 128" fill="none" stroke="#111111" stroke-width="2.5"/>
  <path d="M 430 250 Q 500 214 560 195 Q 620 176 690 200" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 5"/>

  <!-- calibration marker -->
  <line x1="440" y1="70" x2="440" y2="300" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="440" cy="245" r="4" fill="#111111"/>
  <text x="446" y="90" font-size="11" fill="#444444">vanilla: both fit</text>
  <text x="446" y="105" font-size="11" fill="#444444">the SAME quote</text>

  <!-- divergence marker -->
  <line x1="690" y1="128" x2="690" y2="200" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="600" y="120" font-size="11" fill="#111111">Model A</text>
  <text x="600" y="214" font-size="11" fill="#c0392b">Model B</text>
  <text x="560" y="285" font-size="11" font-weight="bold" fill="#c0392b">exotic: they disagree</text>
</svg>
