<text x="90" y="52" fill="#e0645c" font-size="12">the sou&#102;fl&#233; problem: stop at k*, or the amplitude rotates straight past the answer</text>
<text x="90" y="72" fill="#8a8a8a" font-size="11">the curve is sin&#178;((2k+1)&#952;) &#8212; periodic, not monotone; more work is not more likely</text>
<text x="90" y="92" fill="#8a8a8a" font-size="11">knowing k* needs M, the number of solutions &#8212; which is what quantum counting supplies</text>
