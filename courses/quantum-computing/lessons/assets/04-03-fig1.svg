<text x="202" y="154" fill="#e0645c" font-size="11" text-anchor="middle">period r = 6</text>
<text x="60" y="200" fill="#8a8a8a" font-size="12.5">1. phase-estimate U&#7488;: |y&#10217; &#8594; |ay mod N&#10217;</text>
<text x="60" y="226" fill="#d98c3f" font-size="12.5">2. its eigenphases are s/r for s = 0,&#8230;,r&#8722;1</text>
<text x="60" y="252" fill="#4a90d9" font-size="12.5">3. measure &#8776; 11/64 = 0.171875</text>
<text x="60" y="278" fill="#3f9e6a" font-size="12.5">4. continued fractions of 11/64: 0, 1/5, 1/6, 5/29, 11/64</text>
<text x="60" y="304" fill="#e0645c" font-size="12.5">5. the convergent with small denominator is 1/6 &#8594; r = 6</text>
<text x="60" y="338" fill="#8a8a8a" font-size="11">check: 2&#8310; = 64 = 3&#215;21 + 1 &#10003;</text>
