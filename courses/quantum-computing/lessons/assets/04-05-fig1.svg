<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
<text x="28" y="22" fill="#8a8a8a" font-style="italic">The hidden subgroup problem: everything in Modules 3 and 4 was one algorithm</text>
<text x="50" y="52" fill="#8a8a8a" font-size="12">one problem, four instances: f is constant on the cosets of a hidden subgroup H &#8804; G</text>
<text x="60" y="90" fill="#8a8a8a" font-size="11.5" font-weight="bold">algorithm</text>
<text x="240" y="90" fill="#8a8a8a" font-size="11.5" font-weight="bold">group G</text>
<text x="330" y="90" fill="#8a8a8a" font-size="11.5" font-weight="bold">hidden subgroup H</text>
<text x="530" y="90" fill="#8a8a8a" font-size="11.5" font-weight="bold">status</text>
<line x1="52" y1="97" x2="640" y2="97" stroke="#8a8a8a" stroke-width="0.9"/>
<text x="60" y="118" fill="#4a90d9" font-size="11.5">Bernstein&#8211;Vazirani</text>
<text x="240" y="118" fill="#8a8a8a" font-size="11.5">&#8484;&#8322;&#8319;</text>
<text x="330" y="118" fill="#8a8a8a" font-size="11.5">ker(x &#8614; s&#183;x), index 2</text>
<text x="530" y="118" fill="#3f9e6a" font-size="11.5">solved</text>
<text x="60" y="144" fill="#4a90d9" font-size="11.5">Simon</text>
<text x="240" y="144" fill="#8a8a8a" font-size="11.5">&#8484;&#8322;&#8319;</text>
<text x="330" y="144" fill="#8a8a8a" font-size="11.5">{0, s}</text>
<text x="530" y="144" fill="#3f9e6a" font-size="11.5">solved</text>
<text x="60" y="170" fill="#4a90d9" font-size="11.5">order-finding / Shor</text>
<text x="240" y="170" fill="#8a8a8a" font-size="11.5">&#8484;</text>
<text x="330" y="170" fill="#8a8a8a" font-size="11.5">r&#8484;</text>
<text x="530" y="170" fill="#3f9e6a" font-size="11.5">solved</text>
<text x="60" y="196" fill="#4a90d9" font-size="11.5">discrete log</text>
<text x="240" y="196" fill="#8a8a8a" font-size="11.5">&#8484;&#8345; &#215; &#8484;&#8345;</text>
<text x="330" y="196" fill="#8a8a8a" font-size="11.5">{(kx, k)}, generated by (x,1)</text>
<text x="530" y="196" fill="#3f9e6a" font-size="11.5">solved</text>
<text x="60" y="222" fill="#4a90d9" font-size="11.5">graph isomorphism</text>
<text x="240" y="222" fill="#8a8a8a" font-size="11.5">S&#8345; (non-abelian)</text>
<text x="330" y="222" fill="#8a8a8a" font-size="11.5">automorphism group</text>
<text x="530" y="222" fill="#e0645c" font-size="11.5">OPEN</text>
<text x="60" y="248" fill="#4a90d9" font-size="11.5">shortest lattice vector</text>
<text x="240" y="248" fill="#8a8a8a" font-size="11.5">dihedral D&#8345;</text>
<text x="330" y="248" fill="#8a8a8a" font-size="11.5">order-2 subgroup</text>
<text x="530" y="248" fill="#e0645c" font-size="11.5">OPEN</text>
<line x1="52" y1="204" x2="640" y2="204" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="4 3"/>
<text x="60" y="286" fill="#3f9e6a" font-size="12">ABELIAN G: efficient, via the Fourier transform of G</text>
<text x="60" y="306" fill="#e0645c" font-size="12">NON-ABELIAN G: no efficient algorithm known &#8212; which is why lattice cryptography survives</text>
</svg>