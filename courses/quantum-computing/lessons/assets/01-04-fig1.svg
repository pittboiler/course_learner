<text x="165.0" y="166.0" fill="#4a90d9" font-size="15" text-anchor="middle">c&#8321;&#8321;</text>
<text x="198" y="177" fill="#8a8a8a" font-size="10" text-anchor="end">|11&#10217;</text>
<text x="48" y="214" fill="#d98c3f" font-size="13" text-anchor="start">product state &#8660; det = c&#8320;&#8320;c&#8321;&#8321; &#8722; c&#8320;&#8321;c&#8321;&#8320; = 0</text>
<text x="48" y="234" fill="#8a8a8a" font-size="11" text-anchor="start">(rank 1: the table is one column times one row)</text>
