<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
<text x="28" y="22" fill="#8a8a8a" font-style="italic">Noise is a map on density matrices: the Bloch ball shrinks, and how it shrinks names the channel</text>
<circle cx="120" cy="140" r="66" fill="none" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="3 3"/>
<ellipse cx="120" cy="140.0" rx="66.0" ry="33.0" fill="#4a90d9" opacity="0.16" stroke="#4a90d9" stroke-width="1.4"/>
<line x1="46" y1="140" x2="194" y2="140" stroke="#8a8a8a" stroke-width="0.7"/>
<line x1="120" y1="214" x2="120" y2="66" stroke="#8a8a8a" stroke-width="0.7"/>
<text x="120" y="238" fill="#4a90d9" font-size="12" text-anchor="middle">bit flip</text>
<text x="120" y="254" fill="#8a8a8a" font-size="10.5" text-anchor="middle">x fixed, y and z shrink by 1&#8722;2p</text>
<circle cx="300" cy="140" r="66" fill="none" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="3 3"/>
<ellipse cx="300" cy="140.0" rx="33.0" ry="66.0" fill="#3f9e6a" opacity="0.16" stroke="#3f9e6a" stroke-width="1.4"/>
<line x1="226" y1="140" x2="374" y2="140" stroke="#8a8a8a" stroke-width="0.7"/>
<line x1="300" y1="214" x2="300" y2="66" stroke="#8a8a8a" stroke-width="0.7"/>
<text x="300" y="238" fill="#3f9e6a" font-size="12" text-anchor="middle">phase flip</text>
<text x="300" y="254" fill="#8a8a8a" font-size="10.5" text-anchor="middle">z fixed, x and y shrink</text>
<circle cx="480" cy="140" r="66" fill="none" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="3 3"/>
<ellipse cx="480" cy="140.0" rx="44.0" ry="44.0" fill="#d98c3f" opacity="0.16" stroke="#d98c3f" stroke-width="1.4"/>
<line x1="406" y1="140" x2="554" y2="140" stroke="#8a8a8a" stroke-width="0.7"/>
<line x1="480" y1="214" x2="480" y2="66" stroke="#8a8a8a" stroke-width="0.7"/>
<text x="480" y="238" fill="#d98c3f" font-size="12" text-anchor="middle">depolarizing</text>
<text x="480" y="254" fill="#8a8a8a" font-size="10.5" text-anchor="middle">uniform shrink by 1&#8722;4p/3</text>
<circle cx="620" cy="140" r="66" fill="none" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="3 3"/>
<ellipse cx="620" cy="154.85" rx="48.9" ry="36.3" fill="#e0645c" opacity="0.16" stroke="#e0645c" stroke-width="1.4"/>
<line x1="546" y1="140" x2="694" y2="140" stroke="#8a8a8a" stroke-width="0.7"/>
<line x1="620" y1="214" x2="620" y2="66" stroke="#8a8a8a" stroke-width="0.7"/>
<text x="620" y="238" fill="#e0645c" font-size="12" text-anchor="middle">amplitude damping</text>
<text x="620" y="254" fill="#8a8a8a" font-size="10.5" text-anchor="middle">shrinks AND drifts to the pole</text>
<text x="40" y="278" fill="#8a8a8a" font-size="12">a channel maps the Bloch ball into an ellipsoid inside itself &#8212; noise is contraction</text>
<text x="40" y="298" fill="#8a8a8a" font-size="12">&#961; &#8614; &#931;&#8342; E&#8342; &#961; E&#8342;&#8224; with &#931;&#8342; E&#8342;&#8224;E&#8342; = I &#183; the Kraus form of every physical process</text>
<text x="60" y="310" fill="#8a8a8a" font-size="11" font-weight="bold">platform</text>
<text x="220" y="310" fill="#8a8a8a" font-size="11" font-weight="bold">T&#8321;</text>
<text x="290" y="310" fill="#8a8a8a" font-size="11" font-weight="bold">T&#8322;</text>
<text x="360" y="310" fill="#8a8a8a" font-size="11" font-weight="bold">gate time</text>
<text x="470" y="310" fill="#8a8a8a" font-size="11" font-weight="bold">gates before decoherence</text>
<text x="60" y="332" fill="#4a90d9" font-size="11">superconducting</text>
<text x="220" y="332" fill="#8a8a8a" font-size="11">~100 &#956;s</text>
<text x="290" y="332" fill="#8a8a8a" font-size="11">~100 &#956;s</text>
<text x="360" y="332" fill="#8a8a8a" font-size="11">20&#8211;400 ns</text>
<text x="470" y="332" fill="#8a8a8a" font-size="11">10&#179;&#8211;10&#8308;</text>
<text x="60" y="354" fill="#4a90d9" font-size="11">trapped ion</text>
<text x="220" y="354" fill="#8a8a8a" font-size="11">~10 s</text>
<text x="290" y="354" fill="#8a8a8a" font-size="11">~1 s</text>
<text x="360" y="354" fill="#8a8a8a" font-size="11">10&#8211;100 &#956;s</text>
<text x="470" y="354" fill="#8a8a8a" font-size="11">10&#8308;&#8211;10&#8309;</text>
<text x="60" y="376" fill="#4a90d9" font-size="11">neutral atom</text>
<text x="220" y="376" fill="#8a8a8a" font-size="11">~1 s</text>
<text x="290" y="376" fill="#8a8a8a" font-size="11">~1 s</text>
<text x="360" y="376" fill="#8a8a8a" font-size="11">~1 &#956;s</text>
<text x="470" y="376" fill="#8a8a8a" font-size="11">10&#8309;</text>
</svg>