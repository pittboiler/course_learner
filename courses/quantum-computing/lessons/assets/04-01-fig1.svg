<text x="180" y="326" fill="#4a90d9" font-size="11.5">55</text>
<text x="360" y="326" fill="#8a8a8a" font-size="11.5">10,240</text>
<text x="60" y="348" fill="#8a8a8a" font-size="11.5">20</text>
<text x="180" y="348" fill="#4a90d9" font-size="11.5">210</text>
<text x="360" y="348" fill="#8a8a8a" font-size="11.5">2.1&#215;10&#8311;</text>
<text x="60" y="370" fill="#8a8a8a" font-size="11.5">2048</text>
<text x="180" y="370" fill="#4a90d9" font-size="11.5">2.1&#215;10&#8310;</text>
<text x="360" y="370" fill="#8a8a8a" font-size="11.5">&#8776;10&#7826;&#8309;&#8304;</text>
<text x="60" y="398" fill="#e0645c" font-size="11.5">but you cannot READ the amplitudes &#8212; the QFT is not a faster FFT</text>
