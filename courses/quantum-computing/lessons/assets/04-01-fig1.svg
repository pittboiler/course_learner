<text x="466" y="212" fill="#8a6fc0" font-size="10.5" text-anchor="middle">bit reversal</text>
<text x="130" y="46" fill="#8a8a8a" font-size="11">n = 3: three H, three controlled phases, one swap</text>
<text x="60" y="252" fill="#8a8a8a" font-size="12">R&#8342; = diag(1, e&#178;&#960;&#8305;&#7387;&#178;&#7495;) &#183; controlled from the k-th qubit down</text>
<text x="60" y="276" fill="#d98c3f" font-size="13">gate count: n Hadamards + n(n+1)/2 controlled phases = O(n&#178;)</text>
<text x="60" y="304" fill="#8a8a8a" font-size="11.5" font-weight="bold">n</text>
<text x="180" y="304" fill="#8a8a8a" font-size="11.5" font-weight="bold">QFT gates &#8776; n&#178;/2</text>
<text x="360" y="304" fill="#8a8a8a" font-size="11.5" font-weight="bold">classical FFT ops &#8776; N log N</text>
