<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
<text x="28" y="22" fill="#8a8a8a" font-style="italic">Simon&#8217;s problem: a hidden XOR period, and the exponential separation that led to Shor</text>
<text x="50" y="52" fill="#8a8a8a" font-size="12">f is 2-to-1 with hidden period s = 110: the pairs x and x&#8853;s collide</text>
<text x="70" y="86" fill="#4a90d9" font-size="12">000</text>
<text x="220" y="86" fill="#d98c3f" font-size="12">000</text>
