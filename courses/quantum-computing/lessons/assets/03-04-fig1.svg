<text x="70" y="70" fill="#4a90d9" font-size="11">x</text>
<text x="220" y="70" fill="#d98c3f" font-size="11">f(x)</text>
<text x="360" y="52" fill="#8a8a8a" font-size="12">measuring the input register returns a random z with z&#183;s = 0:</text>
<text x="380" y="86" fill="#3f9e6a" font-size="13">z = 000</text>
<text x="480" y="86" fill="#8a8a8a" font-size="11">probability &#188;</text>
<text x="380" y="112" fill="#3f9e6a" font-size="13">z = 001</text>
<text x="480" y="112" fill="#8a8a8a" font-size="11">probability &#188;</text>
<text x="380" y="138" fill="#3f9e6a" font-size="13">z = 110</text>
<text x="480" y="138" fill="#8a8a8a" font-size="11">probability &#188;</text>
<text x="380" y="164" fill="#3f9e6a" font-size="13">z = 111</text>
<text x="480" y="164" fill="#8a8a8a" font-size="11">probability &#188;</text>
<text x="360" y="204" fill="#8a8a8a" font-size="12">each z is one linear equation over &#120125;&#8322;.</text>
<text x="360" y="224" fill="#e0645c" font-size="12">n&#8722;1 independent ones pin down s.</text>
<text x="360" y="248" fill="#8a8a8a" font-size="11">quantum: O(n) queries.</text>
<text x="360" y="266" fill="#8a8a8a" font-size="11">classical: &#937;(2&#8319;&#7443;&#178;) &#8212; the birthday bound.</text>
