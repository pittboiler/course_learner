<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
<text x="28" y="22" fill="#8a8a8a" font-style="italic">Shor&#8217;s algorithm is four classical steps around one quantum subroutine</text>
<rect x="60" y="46" width="300" height="44" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="210.0" y="65.0" fill="#8a8a8a" font-size="12" text-anchor="middle">pick random a < N</text>
<text x="210.0" y="82.0" fill="#8a8a8a" font-size="10" text-anchor="middle">classical</text>
<rect x="60" y="106" width="300" height="44" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="210.0" y="125.0" fill="#8a8a8a" font-size="12" text-anchor="middle">gcd(a, N) &gt; 1?</text>
<text x="210.0" y="142.0" fill="#8a8a8a" font-size="10" text-anchor="middle">classical &#183; lucky, done</text>
<rect x="60" y="166" width="300" height="44" rx="4" fill="none" stroke="#e0645c" stroke-width="1.3"/>
<text x="210.0" y="185.0" fill="#e0645c" font-size="12" text-anchor="middle">find the order r of a mod N</text>
<text x="210.0" y="202.0" fill="#8a8a8a" font-size="10" text-anchor="middle">QUANTUM &#183; phase estimation</text>
<rect x="60" y="226" width="300" height="44" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="210.0" y="245.0" fill="#8a8a8a" font-size="12" text-anchor="middle">is r even and a&#7495;&#7013;&#178; &#8802; &#8722;1?</text>
<text x="210.0" y="262.0" fill="#8a8a8a" font-size="10" text-anchor="middle">classical &#183; else retry</text>
<rect x="60" y="286" width="300" height="44" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="210.0" y="305.0" fill="#8a8a8a" font-size="12" text-anchor="middle">gcd(a&#7495;&#7013;&#178; &#177; 1, N) are the factors</text>
<text x="210.0" y="322.0" fill="#8a8a8a" font-size="10" text-anchor="middle">classical &#183; Euclid</text>
<line x1="210" y1="90" x2="210" y2="104" stroke="#8a8a8a" stroke-width="1.1"/>
<path d="M 205 98 L 210 104 L 215 98" fill="#8a8a8a"/>
<line x1="210" y1="150" x2="210" y2="164" stroke="#8a8a8a" stroke-width="1.1"/>
<path d="M 205 158 L 210 164 L 215 158" fill="#8a8a8a"/>
<line x1="210" y1="210" x2="210" y2="224" stroke="#8a8a8a" stroke-width="1.1"/>
<path d="M 205 218 L 210 224 L 215 218" fill="#8a8a8a"/>
<line x1="210" y1="270" x2="210" y2="284" stroke="#8a8a8a" stroke-width="1.1"/>
<path d="M 205 278 L 210 284 L 215 278" fill="#8a8a8a"/>
<text x="400" y="52" fill="#8a8a8a" font-size="12" font-weight="bold">N = 15, a = 7</text>
<text x="400" y="80" fill="#8a8a8a" font-size="12">7&#185; = 7, 7&#178; = 4, 7&#179; = 13, 7&#8308; = 1 (mod 15)</text>
<text x="400" y="106" fill="#8a8a8a" font-size="12">&#8594; r = 4, which is even</text>
<text x="400" y="132" fill="#8a8a8a" font-size="12">7&#178; = 4, and 4 &#8802; &#8722;1 = 14 (mod 15) &#10003;</text>
<text x="400" y="158" fill="#8a8a8a" font-size="12">gcd(4 &#8722; 1, 15) = gcd(3, 15) = 3</text>
<text x="400" y="184" fill="#8a8a8a" font-size="12">gcd(4 + 1, 15) = gcd(5, 15) = 5</text>
<text x="400" y="210" fill="#e0645c" font-size="12">15 = 3 &#215; 5</text>
<text x="400" y="246" fill="#d98c3f" font-size="11">only step 3 is quantum &#8212;</text>
<text x="400" y="262" fill="#d98c3f" font-size="11">and it is the only step</text>
<text x="400" y="278" fill="#d98c3f" font-size="11">nobody can do classically.</text>
</svg>