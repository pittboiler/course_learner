<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
<text x="28" y="22" fill="#8a8a8a" font-style="italic">One circuit both ways: run it forward to make a Bell pair, backward to read which one you have</text>
<line x1="114" y1="72" x2="288" y2="72" stroke="#8a8a8a" stroke-width="1.1"/>
<text x="112" y="76" fill="#8a8a8a" font-size="12" text-anchor="end">|x&#10217;</text>
<line x1="114" y1="122" x2="288" y2="122" stroke="#8a8a8a" stroke-width="1.1"/>
<text x="112" y="126" fill="#8a8a8a" font-size="12" text-anchor="end">|y&#10217;</text>
<rect x="159.0" y="58.0" width="30" height="28" rx="3" fill="#ffffff" stroke="#4a90d9" stroke-width="1.4"/>
<text x="174" y="77.0" fill="#4a90d9" font-size="13" text-anchor="middle">H</text>
<line x1="228" y1="72" x2="228" y2="122" stroke="#e0645c" stroke-width="1.3"/>
<circle cx="228" cy="72" r="4.2" fill="#e0645c"/>
<circle cx="228" cy="122" r="9" fill="#ffffff" stroke="#e0645c" stroke-width="1.3"/>
<line x1="219" y1="122" x2="237" y2="122" stroke="#e0645c" stroke-width="1.3"/>
<line x1="228" y1="113" x2="228" y2="131" stroke="#e0645c" stroke-width="1.3"/>
<text x="120" y="48" fill="#3f9e6a" font-size="12" text-anchor="start">PREPARE</text>
<text x="296" y="102" fill="#8a8a8a" font-size="11" text-anchor="start">&#8594; one of the</text>
<text x="296" y="118" fill="#8a8a8a" font-size="11" text-anchor="start">four Bell states</text>
<line x1="424" y1="72" x2="598" y2="72" stroke="#8a8a8a" stroke-width="1.1"/>
<line x1="424" y1="122" x2="598" y2="122" stroke="#8a8a8a" stroke-width="1.1"/>
<line x1="484" y1="72" x2="484" y2="122" stroke="#e0645c" stroke-width="1.3"/>
<circle cx="484" cy="72" r="4.2" fill="#e0645c"/>
<circle cx="484" cy="122" r="9" fill="#ffffff" stroke="#e0645c" stroke-width="1.3"/>
<line x1="475" y1="122" x2="493" y2="122" stroke="#e0645c" stroke-width="1.3"/>
<line x1="484" y1="113" x2="484" y2="131" stroke="#e0645c" stroke-width="1.3"/>
<rect x="523.0" y="58.0" width="30" height="28" rx="3" fill="#ffffff" stroke="#4a90d9" stroke-width="1.4"/>
<text x="538" y="77.0" fill="#4a90d9" font-size="13" text-anchor="middle">H</text>
<rect x="577" y="58" width="30" height="28" rx="3" fill="#ffffff" stroke="#3f9e6a" stroke-width="1.4"/>
<path d="M 583 79 A 9 9 0 0 1 601 79" fill="none" stroke="#3f9e6a" stroke-width="1.2"/>
<line x1="592" y1="79" x2="600" y2="67" stroke="#3f9e6a" stroke-width="1.2"/>
<rect x="577" y="108" width="30" height="28" rx="3" fill="#ffffff" stroke="#3f9e6a" stroke-width="1.4"/>
<path d="M 583 129 A 9 9 0 0 1 601 129" fill="none" stroke="#3f9e6a" stroke-width="1.2"/>
<line x1="592" y1="129" x2="600" y2="117" stroke="#3f9e6a" stroke-width="1.2"/>
<text x="430" y="48" fill="#3f9e6a" font-size="12" text-anchor="start">MEASURE (the same circuit, reversed)</text>
<text x="614" y="76" fill="#8a8a8a" font-size="11" text-anchor="start">&#8594; x</text>
<text x="614" y="126" fill="#8a8a8a" font-size="11" text-anchor="start">&#8594; y</text>
<text x="60" y="196" fill="#8a8a8a" font-size="12" font-weight="bold">Bell state</text>
<text x="250" y="196" fill="#8a8a8a" font-size="12" font-weight="bold">input x y</text>
<text x="330" y="196" fill="#8a8a8a" font-size="12" font-weight="bold">Z&#8855;Z</text>
<text x="410" y="196" fill="#8a8a8a" font-size="12" font-weight="bold">X&#8855;X</text>
<line x1="50" y1="204" x2="520" y2="204" stroke="#8a8a8a" stroke-width="0.9"/>
<text x="60" y="226" fill="#4a90d9" font-size="12.5">|&#934;&#8314;&#10217; = (|00&#10217;+|11&#10217;)/&#8730;2</text>
<text x="250" y="226" fill="#8a8a8a" font-size="12.5">0 0</text>
<text x="330" y="226" fill="#d98c3f" font-size="12.5">+1</text>
<text x="410" y="226" fill="#d98c3f" font-size="12.5">+1</text>
<text x="60" y="252" fill="#4a90d9" font-size="12.5">|&#934;&#8315;&#10217; = (|00&#10217;&#8722;|11&#10217;)/&#8730;2</text>
<text x="250" y="252" fill="#8a8a8a" font-size="12.5">1 0</text>
<text x="330" y="252" fill="#d98c3f" font-size="12.5">+1</text>
<text x="410" y="252" fill="#d98c3f" font-size="12.5">&#8722;1</text>
<text x="60" y="278" fill="#4a90d9" font-size="12.5">|&#936;&#8314;&#10217; = (|01&#10217;+|10&#10217;)/&#8730;2</text>
<text x="250" y="278" fill="#8a8a8a" font-size="12.5">0 1</text>
<text x="330" y="278" fill="#d98c3f" font-size="12.5">&#8722;1</text>
<text x="410" y="278" fill="#d98c3f" font-size="12.5">+1</text>
<text x="60" y="304" fill="#4a90d9" font-size="12.5">|&#936;&#8315;&#10217; = (|01&#10217;&#8722;|10&#10217;)/&#8730;2</text>
<text x="250" y="304" fill="#8a8a8a" font-size="12.5">1 1</text>
<text x="330" y="304" fill="#d98c3f" font-size="12.5">&#8722;1</text>
<text x="410" y="304" fill="#d98c3f" font-size="12.5">&#8722;1</text>
<text x="470" y="226" fill="#8a8a8a" font-size="11">the two signs</text>
<text x="470" y="242" fill="#8a8a8a" font-size="11">are exactly the</text>
<text x="470" y="258" fill="#8a8a8a" font-size="11">two input bits</text>
</svg>