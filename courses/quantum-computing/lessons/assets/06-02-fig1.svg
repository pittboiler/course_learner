<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
<text x="28" y="22" fill="#8a8a8a" font-style="italic">Hamiltonian simulation: the exponential of a sum, one non-commuting slice at a time</text>
<line x1="90" y1="280" x2="390" y2="280" stroke="#8a8a8a" stroke-width="1.1"/>
<line x1="90" y1="280" x2="90" y2="72" stroke="#8a8a8a" stroke-width="1.1"/>
<path d="M 90.0,83.9 L 135.2,97.7 L 180.3,110.2 L 225.5,122.3 L 270.6,134.4 L 315.8,146.5 L 360.9,158.5" fill="none" stroke="#4a90d9" stroke-width="1.8"/>
<circle cx="90.0" cy="83.9" r="3" fill="#4a90d9"/>
<circle cx="135.2" cy="97.7" r="3" fill="#4a90d9"/>
<circle cx="180.3" cy="110.2" r="3" fill="#4a90d9"/>
<circle cx="225.5" cy="122.3" r="3" fill="#4a90d9"/>
<circle cx="270.6" cy="134.4" r="3" fill="#4a90d9"/>
<circle cx="315.8" cy="146.5" r="3" fill="#4a90d9"/>
<circle cx="360.9" cy="158.5" r="3" fill="#4a90d9"/>
<text x="261" y="175" fill="#4a90d9" font-size="11">first order: error &#8733; 1/r</text>
<path d="M 90.0,100.1 L 135.2,125.9 L 180.3,150.5 L 225.5,174.7 L 270.6,198.8 L 315.8,222.9" fill="none" stroke="#e0645c" stroke-width="1.8"/>
<circle cx="90.0" cy="100.1" r="3" fill="#e0645c"/>
<circle cx="135.2" cy="125.9" r="3" fill="#e0645c"/>
<circle cx="180.3" cy="150.5" r="3" fill="#e0645c"/>
<circle cx="225.5" cy="174.7" r="3" fill="#e0645c"/>
<circle cx="270.6" cy="198.8" r="3" fill="#e0645c"/>
<circle cx="315.8" cy="222.9" r="3" fill="#e0645c"/>
<text x="216" y="239" fill="#e0645c" font-size="11">second order: error &#8733; 1/r&#178;</text>
<line x1="90.0" y1="280" x2="90.0" y2="284" stroke="#8a8a8a" stroke-width="0.8"/>
<text x="90.0" y="298" fill="#8a8a8a" font-size="10" text-anchor="middle">1</text>
<line x1="180.3" y1="280" x2="180.3" y2="284" stroke="#8a8a8a" stroke-width="0.8"/>
<text x="180.3" y="298" fill="#8a8a8a" font-size="10" text-anchor="middle">4</text>
<line x1="270.6" y1="280" x2="270.6" y2="284" stroke="#8a8a8a" stroke-width="0.8"/>
<text x="270.6" y="298" fill="#8a8a8a" font-size="10" text-anchor="middle">16</text>
<line x1="360.9" y1="280" x2="360.9" y2="284" stroke="#8a8a8a" stroke-width="0.8"/>
<text x="360.9" y="298" fill="#8a8a8a" font-size="10" text-anchor="middle">64</text>
<text x="84" y="84.0" fill="#8a8a8a" font-size="10" text-anchor="end">1</text>
<text x="84" y="164.0" fill="#8a8a8a" font-size="10" text-anchor="end">10&#8315;&#178;</text>
<text x="84" y="244.0" fill="#8a8a8a" font-size="10" text-anchor="end">10&#8315;&#8308;</text>
<text x="240" y="316" fill="#8a8a8a" font-size="11" text-anchor="middle">Trotter steps r</text>
<text x="90" y="64" fill="#8a8a8a" font-size="11">operator-norm error in e&#8315;&#8305;&#7480;&#7511; for H = X + Z, t = 1</text>
<text x="430" y="58" fill="#8a8a8a" font-size="12">the problem Feynman actually proposed</text>
<text x="430" y="82" fill="#8a8a8a" font-size="11">simulate e&#8315;&#8305;&#7480;&#7511; for a local Hamiltonian H</text>
<text x="430" y="120" fill="#8a8a8a" font-size="11">H = &#931;&#11002; H&#11002; with L local terms</text>
<text x="430" y="139" fill="#8a8a8a" font-size="11">each e&#8315;&#8305;&#7480;&#11002;&#7511; is a small circuit</text>
<text x="430" y="158" fill="#8a8a8a" font-size="11">but they do not commute, so</text>
<text x="430" y="177" fill="#8a8a8a" font-size="11">e&#8315;&#8305;&#7480;&#7511; &#8800; &#8719;&#11002; e&#8315;&#8305;&#7480;&#11002;&#7511;</text>
<text x="430" y="215" fill="#d98c3f" font-size="11">TROTTER: chop t into r slices</text>
<text x="430" y="234" fill="#8a8a8a" font-size="11">error O(t&#178;/r) first order, O(t&#179;/r&#178;) second</text>
<text x="430" y="272" fill="#e0645c" font-size="11">modern methods (qubitization) reach</text>
<text x="430" y="291" fill="#e0645c" font-size="11">O(t&#8214;H&#8214; + log 1/&#949;) &#8212; optimal in t</text>
</svg>