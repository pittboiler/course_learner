<svg viewBox="0 0 700 390" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
<text x="28" y="22" fill="#8a8a8a" font-style="italic">BQP sits between BPP and PSPACE, overlaps NP, and contains neither &#8212; as far as anyone can prove</text>
<ellipse cx="300" cy="200" rx="260" ry="150" fill="#8a8a8a" opacity="0.08" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="300" y="68" fill="#8a8a8a" font-size="12" text-anchor="middle" font-weight="bold">PSPACE</text>
<ellipse cx="300" cy="205" rx="215" ry="120" fill="#8a6fc0" opacity="0.08" stroke="#8a6fc0" stroke-width="1.4"/>
<text x="300" y="105" fill="#8a6fc0" font-size="12" text-anchor="middle" font-weight="bold">PP</text>
<ellipse cx="270" cy="215" rx="150" ry="92" fill="#e0645c" opacity="0.08" stroke="#e0645c" stroke-width="1.4"/>
<text x="198" y="153" fill="#e0645c" font-size="12" text-anchor="middle" font-weight="bold">BQP</text>
<ellipse cx="220" cy="225" rx="80" ry="58" fill="#4a90d9" opacity="0.08" stroke="#4a90d9" stroke-width="1.4"/>
<text x="176" y="264" fill="#4a90d9" font-size="12" text-anchor="middle" font-weight="bold">BPP</text>
<ellipse cx="205" cy="225" rx="50" ry="36" fill="#3f9e6a" opacity="0.08" stroke="#3f9e6a" stroke-width="1.4"/>
<text x="212" y="229" fill="#3f9e6a" font-size="11" text-anchor="middle" font-weight="bold">P</text>
<ellipse cx="400" cy="215" rx="110" ry="70" fill="#d98c3f" opacity="0.08" stroke="#d98c3f" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="460" y="167" fill="#d98c3f" font-size="12" text-anchor="middle" font-weight="bold">NP</text>
<text x="300" y="370" fill="#8a8a8a" font-size="11.5" text-anchor="middle">BPP &#8838; BQP &#8838; PP &#8838; PSPACE &#183; all inclusions unproven to be strict</text>
<circle cx="340" cy="240" r="4" fill="#e0645c"/>
<text x="348" y="244" fill="#e0645c" font-size="11">factoring</text>
<circle cx="430" cy="250" r="4" fill="#d98c3f"/>
<text x="438" y="254" fill="#d98c3f" font-size="11">3-SAT</text>
<text x="580" y="70" fill="#8a8a8a" font-size="11" font-weight="bold">what is known</text>
<text x="580" y="89" fill="#e0645c" font-size="11">BQP contains factoring</text>
<text x="580" y="108" fill="#e0645c" font-size="11">and discrete log</text>
<text x="580" y="146" fill="#8a8a8a" font-size="11" font-weight="bold">what is OPEN</text>
<text x="580" y="165" fill="#d98c3f" font-size="11">is NP &#8838; BQP?</text>
<text x="580" y="184" fill="#d98c3f" font-size="11">is BQP &#8838; NP?</text>
<text x="580" y="203" fill="#d98c3f" font-size="11">is BQP &#8800; BPP?</text>
<text x="580" y="241" fill="#8a8a8a" font-size="11" font-weight="bold">relative to an oracle:</text>
<text x="580" y="260" fill="#4a90d9" font-size="11">BQP &#8840; NP (Simon)</text>
<text x="580" y="279" fill="#4a90d9" font-size="11">NP &#8840; BQP (BBBV)</text>
<text x="580" y="298" fill="#4a90d9" font-size="11">BQP &#8840; PH (Raz&#8211;Tal)</text>
</svg>