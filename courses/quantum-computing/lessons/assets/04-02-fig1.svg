<text x="60" y="262" fill="#8a8a8a" font-size="12">the ancillas end holding  (1/&#8730;2&#7504;) &#931;&#11002; e&#178;&#960;&#8305;&#7487;&#11002; |j&#10217; &#8212; a plane wave of frequency &#966;</text>
<text x="60" y="284" fill="#d98c3f" font-size="12">exact when &#966; is an m-bit fraction; otherwise the nearest bin wins with p &#8805; 4/&#960;&#178; = 0.405</text>
<text x="80" y="312" fill="#8a8a8a" font-size="11.5">&#966; = 1/4, m = 3</text>
<text x="260" y="312" fill="#8a8a8a" font-size="11.5">j = 2/8</text>
<text x="400" y="312" fill="#4a90d9" font-size="11.5">p = 1.000</text>
<text x="80" y="332" fill="#8a8a8a" font-size="11.5">&#966; = 1/6, m = 6</text>
<text x="260" y="332" fill="#8a8a8a" font-size="11.5">j = 11/64</text>
<text x="400" y="332" fill="#4a90d9" font-size="11.5">p = 0.684</text>
<text x="80" y="352" fill="#8a8a8a" font-size="11.5">&#966; = 1/10, m = 5</text>
<text x="260" y="352" fill="#8a8a8a" font-size="11.5">j = 3/32</text>
<text x="400" y="352" fill="#4a90d9" font-size="11.5">p = 0.875</text>
<text x="60" y="382" fill="#e0645c" font-size="11.5">for n good bits with failure &#8804; &#949;, use m = n + &#8968;log&#8322;(2 + 1/2&#949;)&#8969; ancillas</text>
