<text x="190" y="95.0" fill="#e0645c" font-size="13" text-anchor="middle">U</text>
<text x="230" y="96" fill="#e0645c" font-size="13">|&#968;&#10217;</text>
<text x="230" y="150" fill="#e0645c" font-size="13">|&#968;&#10217;</text>
<text x="90" y="216" fill="#e0645c" font-size="14">no such U exists</text>
<text x="90" y="238" fill="#8a8a8a" font-size="11">for all unknown |&#968;&#10217; at once</text>
<text x="90" y="262" fill="#8a8a8a" font-size="11">it works fine for any FIXED |&#968;&#10217;,</text>
<text x="90" y="278" fill="#8a8a8a" font-size="11">and for any ORTHOGONAL set</text>
