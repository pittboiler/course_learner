<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
<text x="28" y="22" fill="#8a8a8a" font-style="italic">The variational loop: shallow enough for today&#8217;s hardware, and fighting two headwinds</text>
<rect x="60" y="60" width="160" height="42" rx="4" fill="none" stroke="#4a90d9" stroke-width="1.3"/>
<text x="140.0" y="79.0" fill="#4a90d9" font-size="11.5" text-anchor="middle">ansatz |&#968;(&#952;)&#10217;</text>
<text x="140.0" y="94.0" fill="#8a8a8a" font-size="9.5" text-anchor="middle">QUANTUM</text>
<rect x="60" y="150" width="160" height="42" rx="4" fill="none" stroke="#4a90d9" stroke-width="1.3"/>
<text x="140.0" y="169.0" fill="#4a90d9" font-size="11.5" text-anchor="middle">measure &#10216;H&#10217;</text>
<text x="140.0" y="184.0" fill="#8a8a8a" font-size="9.5" text-anchor="middle">QUANTUM &#183; many shots</text>
<rect x="60" y="240" width="160" height="42" rx="4" fill="none" stroke="#3f9e6a" stroke-width="1.3"/>
<text x="140.0" y="259.0" fill="#3f9e6a" font-size="11.5" text-anchor="middle">classical optimizer</text>
<text x="140.0" y="274.0" fill="#8a8a8a" font-size="9.5" text-anchor="middle">CPU: update &#952;</text>
<line x1="140" y1="102" x2="140" y2="148" stroke="#8a8a8a" stroke-width="1.2"/>
<line x1="140" y1="148" x2="136.2" y2="141.0" stroke="#8a8a8a" stroke-width="1.2"/>
<line x1="140" y1="148" x2="143.8" y2="141.0" stroke="#8a8a8a" stroke-width="1.2"/>
<line x1="60" y1="261" x2="40" y2="261" stroke="#8a8a8a" stroke-width="1.2"/>
<line x1="40" y1="261" x2="47.0" y2="257.2" stroke="#8a8a8a" stroke-width="1.2"/>
<line x1="40" y1="261" x2="47.0" y2="264.8" stroke="#8a8a8a" stroke-width="1.2"/>
<line x1="40" y1="261" x2="40" y2="81" stroke="#8a8a8a" stroke-width="1.2"/>
<line x1="40" y1="81" x2="43.8" y2="88.0" stroke="#8a8a8a" stroke-width="1.2"/>
<line x1="40" y1="81" x2="36.2" y2="88.0" stroke="#8a8a8a" stroke-width="1.2"/>
<line x1="40" y1="81" x2="58" y2="81" stroke="#8a8a8a" stroke-width="1.2"/>
<line x1="58" y1="81" x2="51.0" y2="84.8" stroke="#8a8a8a" stroke-width="1.2"/>
<line x1="58" y1="81" x2="51.0" y2="77.2" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="14" y="168" fill="#8a8a8a" font-size="10">new &#952;</text>
<text x="248" y="80" fill="#8a8a8a" font-size="11">shallow circuits, so NISQ-compatible</text>
<text x="248" y="100" fill="#8a8a8a" font-size="11">parameter-shift rule gives exact gradients:</text>
<text x="248" y="122" fill="#d98c3f" font-size="12">&#8706;E/&#8706;&#952; = [E(&#952;+&#960;/2) &#8722; E(&#952;&#8722;&#960;/2)]/2</text>
<text x="248" y="148" fill="#8a8a8a" font-size="11">but the shot cost is brutal:</text>
<text x="248" y="168" fill="#e0645c" font-size="11">M Pauli terms to accuracy &#949; &#8594; ~M/&#949;&#178; shots</text>
<text x="248" y="186" fill="#e0645c" font-size="11">10&#8308; terms at 1.6 mHa &#8594; 4&#215;10&#8313; shots &#8594; ~100 hours</text>
<text x="248" y="214" fill="#8a8a8a" font-size="11" font-weight="bold">BARREN PLATEAUS</text>
<text x="248" y="234" fill="#e0645c" font-size="10.5">for a random deep ansatz, the gradient</text>
<text x="248" y="251" fill="#e0645c" font-size="10.5">variance decays like 2&#8315;&#8319; &#8212; the landscape</text>
<text x="248" y="268" fill="#e0645c" font-size="10.5">is flat almost everywhere, so the optimizer</text>
<text x="248" y="285" fill="#e0645c" font-size="10.5">has nothing to follow.</text>
<text x="248" y="302" fill="#8a8a8a" font-size="10.5">problem-informed ansatzes avoid it</text>
<text x="248" y="319" fill="#8a8a8a" font-size="10.5">only by giving up expressiveness.</text>
</svg>