<text x="70" y="334" fill="#3f9e6a" font-size="11.5">1 0</text>
<text x="180" y="334" fill="#8a8a8a" font-size="11.5">flip on qubit 1</text>
<text x="300" y="334" fill="#d98c3f" font-size="11.5">X&#8321;</text>
<text x="470" y="334" fill="#8a8a8a" font-size="11.5">p(1&#8722;p)&#178;</text>
<text x="70" y="354" fill="#3f9e6a" font-size="11.5">1 1</text>
<text x="180" y="354" fill="#8a8a8a" font-size="11.5">flip on qubit 2</text>
<text x="300" y="354" fill="#d98c3f" font-size="11.5">X&#8322;</text>
<text x="470" y="354" fill="#8a8a8a" font-size="11.5">p(1&#8722;p)&#178;</text>
<text x="70" y="374" fill="#3f9e6a" font-size="11.5">0 1</text>
<text x="180" y="374" fill="#8a8a8a" font-size="11.5">flip on qubit 3</text>
<text x="300" y="374" fill="#d98c3f" font-size="11.5">X&#8323;</text>
<text x="470" y="374" fill="#8a8a8a" font-size="11.5">p(1&#8722;p)&#178;</text>
<text x="70" y="406" fill="#e0645c" font-size="11.5">logical error (two or three flips) = 3p&#178; &#8722; 2p&#179; &#183; better than p whenever p &lt; &#189;</text>
