<text x="150" y="44" fill="#8a8a8a" font-size="11">one query &#183; n = 3</text>
<text x="454" y="114" fill="#3f9e6a" font-size="12">all zeros? &#8594; constant</text>
<text x="454" y="132" fill="#3f9e6a" font-size="12">anything else &#8594; balanced</text>
<text x="60" y="252" fill="#8a8a8a" font-size="12">the amplitude of the all-zeros outcome is the AVERAGE of the signs:</text>
<text x="60" y="278" fill="#d98c3f" font-size="14">&#10216;0&#8319;|&#968;&#10217; = (1/2&#8319;) &#931;&#7584; (&#8722;1)&#7584;&#8317;&#739;&#8318;</text>
<text x="60" y="304" fill="#8a8a8a" font-size="12">constant: all signs agree &#8594; average = &#177;1 &#8594; probability 1</text>
<text x="60" y="324" fill="#8a8a8a" font-size="12">balanced: half +1 and half &#8722;1 &#8594; average = 0 &#8594; probability 0</text>
