<text x="244.4" y="103.60000000000001" fill="#4a90d9" font-size="11">surface: pure</text>
<text x="244.4" y="118.60000000000001" fill="#4a90d9" font-size="11">tr &#961;&#178; = 1</text>
<circle cx="170" cy="190" r="4.6" fill="#e0645c"/>
<text x="179" y="208" fill="#e0645c" font-size="12">I/2 &#183; tr &#961;&#178; = &#189;</text>
<circle cx="170" cy="130.0" r="3.8" fill="#d98c3f"/>
<line x1="170" y1="190" x2="170" y2="130.0" stroke="#d98c3f" stroke-width="1.8"/>
<text x="52" y="134.0" fill="#d98c3f" font-size="11">|r| = &#189;: mixed</text>
<text x="50" y="352" fill="#8a8a8a" font-size="12">the state space is a BALL, not a sphere</text>
<text x="50" y="370" fill="#8a8a8a" font-size="11">radius = purity; center = know nothing</text>
<line x1="474" y1="110" x2="654" y2="110" stroke="#8a8a8a" stroke-width="1.1"/>
