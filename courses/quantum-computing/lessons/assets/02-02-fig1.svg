<line x1="592" y1="153" x2="592" y2="171" stroke="#4a90d9" stroke-width="1.3"/>
<rect x="518" y="92" width="92" height="88" rx="4" fill="none" stroke="#3f9e6a" stroke-width="1.1" stroke-dasharray="5 3"/>
<text x="522" y="86" fill="#3f9e6a" font-size="11">pure: |&#934;&#8314;&#10217;, tr &#961;&#178; = 1</text>
<line x1="440" y1="215" x2="640" y2="215" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="440" y="240" fill="#e0645c" font-size="12">throw away B (trace it out):</text>
<text x="440" y="262" fill="#e0645c" font-size="14">&#961;&#7424; = I/2</text>
<text x="440" y="284" fill="#8a8a8a" font-size="11">a pure pair, each half maximally mixed &#8212;</text>
<text x="440" y="300" fill="#8a8a8a" font-size="11">entanglement is local ignorance</text>
