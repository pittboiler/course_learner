<text x="472" y="166" fill="#8a8a8a" font-size="12" text-anchor="end">B</text>
<rect x="521.0" y="96.0" width="30" height="28" rx="3" fill="#ffffff" stroke="#4a90d9" stroke-width="1.4"/>
<text x="536" y="115.0" fill="#4a90d9" font-size="13" text-anchor="middle">H</text>
<line x1="592" y1="110" x2="592" y2="162" stroke="#4a90d9" stroke-width="1.3"/>
