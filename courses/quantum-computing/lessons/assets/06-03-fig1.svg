<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
<text x="28" y="22" fill="#8a8a8a" font-style="italic">Quantum advantage has been claimed five times and narrowed every time &#8212; and none of it computed anything</text>
<text x="60" y="62" fill="#8a8a8a" font-size="11.5" font-weight="bold">experiment</text>
<text x="290" y="62" fill="#8a8a8a" font-size="11.5" font-weight="bold">claim</text>
<text x="450" y="62" fill="#8a8a8a" font-size="11.5" font-weight="bold">classical rebuttal</text>
<line x1="52" y1="69" x2="660" y2="69" stroke="#8a8a8a" stroke-width="0.9"/>
<text x="60" y="90" fill="#4a90d9" font-size="11">Google 2019 &#183; 53 qubits</text>
<text x="290" y="90" fill="#d98c3f" font-size="11">10,000 years classically</text>
<text x="450" y="90" fill="#e0645c" font-size="11">2.5 days (IBM, tensor network)</text>
<text x="60" y="114" fill="#4a90d9" font-size="11">random circuit sampling</text>
<text x="290" y="114" fill="#d98c3f" font-size="11">fidelity 0.002</text>
<text x="450" y="114" fill="#e0645c" font-size="11">hours&#8211;days (Pan&#8211;Zhang 2021)</text>
<text x="60" y="138" fill="#4a90d9" font-size="11">USTC Jiuzhang 2020 &#183; photons</text>
<text x="290" y="138" fill="#d98c3f" font-size="11">10&#178;&#8308; advantage</text>
<text x="450" y="138" fill="#e0645c" font-size="11">narrowed by better algorithms</text>
<text x="60" y="162" fill="#4a90d9" font-size="11">USTC Zuchongzhi 2021 &#183; 60 qubits</text>
<text x="290" y="162" fill="#d98c3f" font-size="11">harder instance</text>
<text x="450" y="162" fill="#e0645c" font-size="11">partially spoofed</text>
<text x="60" y="186" fill="#4a90d9" font-size="11">Google 2023 &#183; 70 qubits</text>
<text x="290" y="186" fill="#d98c3f" font-size="11">47 years classically</text>
<text x="450" y="186" fill="#e0645c" font-size="11">contested</text>
<text x="52" y="230" fill="#8a8a8a" font-size="12" font-weight="bold">what a sampling experiment shows</text>
<text x="52" y="254" fill="#3f9e6a" font-size="11.5">the device produces samples from a distribution</text>
<text x="52" y="275" fill="#3f9e6a" font-size="11.5">no classical computer can efficiently reproduce &#8212; probably</text>
<text x="52" y="317" fill="#8a8a8a" font-size="11.5" font-weight="bold">what it does NOT show</text>
<text x="52" y="338" fill="#e0645c" font-size="11.5">that the samples are useful for anything</text>
<text x="52" y="359" fill="#e0645c" font-size="11.5">that the result can be verified without classical simulation</text>
<text x="52" y="380" fill="#e0645c" font-size="11.5">that the advantage survives better classical algorithms</text>
<text x="420" y="254" fill="#8a8a8a" font-size="11">verification problem:</text>
<text x="420" y="276" fill="#8a8a8a" font-size="10.5">cross-entropy benchmarking</text>
<text x="420" y="293" fill="#8a8a8a" font-size="10.5">estimates fidelity by</text>
<text x="420" y="310" fill="#8a8a8a" font-size="10.5">comparing observed samples</text>
<text x="420" y="327" fill="#8a8a8a" font-size="10.5">to SIMULATED amplitudes &#8212;</text>
<text x="420" y="344" fill="#d98c3f" font-size="10.5">so verifying the claim needs</text>
<text x="420" y="361" fill="#d98c3f" font-size="10.5">the very simulation it claims</text>
<text x="420" y="378" fill="#d98c3f" font-size="10.5">is impossible</text>
</svg>