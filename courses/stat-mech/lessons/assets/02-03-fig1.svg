<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="sans-serif">
  <defs>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <title>The thermodynamic square: four potentials, corners are natural variables, Legendre arrows swap S with T and V with p</title>

  <!-- outer square connecting the four natural variables -->
  <rect x="160" y="90" width="300" height="300" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <!-- diamond of Legendre-transform arrows (drawn first, boxes cover the ends) -->
  <!-- U -> F : swap S<->T (red) -->
  <line x1="349" y1="129" x2="421" y2="201" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <!-- U -> H : swap V<->p (blue) -->
  <line x1="271" y1="129" x2="199" y2="201" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <!-- F -> G : swap V<->p (blue) -->
  <line x1="421" y1="279" x2="349" y2="351" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <!-- H -> G : swap S<->T (red) -->
  <line x1="199" y1="279" x2="271" y2="351" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>

  <!-- arrow labels -->
  <text x="392" y="160" font-size="13" fill="#dc2626" font-weight="bold">−TS</text>
  <text x="386" y="176" font-size="10" fill="#dc2626">S→T</text>
  <text x="207" y="160" font-size="13" fill="#2563eb" font-weight="bold">+pV</text>
  <text x="205" y="176" font-size="10" fill="#2563eb">V→p</text>
  <text x="392" y="322" font-size="13" fill="#2563eb" font-weight="bold">+pV</text>
  <text x="386" y="338" font-size="10" fill="#2563eb">V→p</text>
  <text x="207" y="322" font-size="13" fill="#dc2626" font-weight="bold">−TS</text>
  <text x="205" y="338" font-size="10" fill="#dc2626">S→T</text>

  <!-- corner variables (natural variables); S,T are one conjugate pair (red), V,p the other (blue) -->
  <circle cx="160" cy="90" r="17" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="160" y="96" font-size="18" fill="#991b1b" font-weight="bold" text-anchor="middle">S</text>
  <circle cx="460" cy="90" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="460" y="96" font-size="18" fill="#1e40af" font-weight="bold" text-anchor="middle">V</text>
  <circle cx="160" cy="390" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="396" font-size="18" fill="#1e40af" font-weight="bold" text-anchor="middle">p</text>
  <circle cx="460" cy="390" r="17" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="460" y="396" font-size="18" fill="#991b1b" font-weight="bold" text-anchor="middle">T</text>

  <!-- potentials at the edge midpoints; natural variables = the two corners the edge touches -->
  <g>
    <rect x="272" y="72" width="76" height="34" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
    <text x="310" y="89" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="middle">U</text>
    <text x="310" y="101" font-size="10" fill="#475569" text-anchor="middle">(S, V)</text>
  </g>
  <g>
    <rect x="422" y="223" width="76" height="34" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
    <text x="460" y="240" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="middle">F</text>
    <text x="460" y="252" font-size="10" fill="#475569" text-anchor="middle">(T, V)</text>
  </g>
  <g>
    <rect x="122" y="223" width="76" height="34" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
    <text x="160" y="240" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="middle">H</text>
    <text x="160" y="252" font-size="10" fill="#475569" text-anchor="middle">(S, p)</text>
  </g>
  <g>
    <rect x="272" y="373" width="76" height="34" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
    <text x="310" y="390" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="middle">G</text>
    <text x="310" y="402" font-size="10" fill="#475569" text-anchor="middle">(T, p)</text>
  </g>

  <!-- narrative caption -->
  <text x="320" y="35" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">The thermodynamic square</text>
  <text x="320" y="55" font-size="11.5" fill="#475569" text-anchor="middle">Descend from U to G: trade hard-to-fix S, V for easy-to-fix T, p</text>

  <!-- legend -->
  <line x1="176" y1="446" x2="206" y2="446" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="214" y="450" font-size="11.5" fill="#334155">−TS : swap entropy S ↔ temperature T</text>
  <line x1="176" y1="470" x2="206" y2="470" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="214" y="474" font-size="11.5" fill="#334155">+pV : swap volume V ↔ pressure p</text>
</svg>
