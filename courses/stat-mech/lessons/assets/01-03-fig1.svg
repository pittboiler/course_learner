<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="380" fill="#ffffff"/>

  <!-- Title band -->
  <text x="320" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Multiplicity multiplies · Entropy adds</text>

  <!-- ===== Top row: multiplicity (multiplicative) ===== -->
  <!-- System 1 -->
  <rect x="40" y="70" width="150" height="90" rx="8" fill="#eef4ff" stroke="#1a4fa0" stroke-width="2"/>
  <text x="115" y="100" text-anchor="middle" font-size="15" fill="#1a4fa0" font-weight="bold">System 1</text>
  <text x="115" y="132" text-anchor="middle" font-size="20" fill="#111111">&#937;&#8321; = 4</text>

  <!-- times -->
  <text x="215" y="122" text-anchor="middle" font-size="26" fill="#333333" font-weight="bold">&#215;</text>

  <!-- System 2 -->
  <rect x="240" y="70" width="150" height="90" rx="8" fill="#eef4ff" stroke="#1a4fa0" stroke-width="2"/>
  <text x="315" y="100" text-anchor="middle" font-size="15" fill="#1a4fa0" font-weight="bold">System 2</text>
  <text x="315" y="132" text-anchor="middle" font-size="20" fill="#111111">&#937;&#8322; = 8</text>

  <!-- equals arrow -->
  <line x1="405" y1="115" x2="455" y2="115" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Combined -->
  <rect x="465" y="70" width="150" height="90" rx="8" fill="#e9f7ee" stroke="#1c7a43" stroke-width="2"/>
  <text x="540" y="100" text-anchor="middle" font-size="15" fill="#1c7a43" font-weight="bold">Combined</text>
  <text x="540" y="132" text-anchor="middle" font-size="20" fill="#111111">&#937; = &#937;&#8321;&#937;&#8322; = 32</text>

  <!-- ===== Bridge: apply k_B ln ===== -->
  <line x1="115" y1="165" x2="115" y2="235" stroke="#999999" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow2)"/>
  <line x1="315" y1="165" x2="315" y2="235" stroke="#999999" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow2)"/>
  <line x1="540" y1="165" x2="540" y2="235" stroke="#999999" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow2)"/>
  <text x="320" y="205" text-anchor="middle" font-size="14" fill="#555555" font-style="italic">take S = k_B ln &#937;  (turns products into sums)</text>

  <!-- ===== Bottom row: entropy (additive) ===== -->
  <!-- S1 -->
  <rect x="40" y="245" width="150" height="90" rx="8" fill="#fff4e8" stroke="#b5651d" stroke-width="2"/>
  <text x="115" y="275" text-anchor="middle" font-size="15" fill="#b5651d" font-weight="bold">S&#8321;</text>
  <text x="115" y="307" text-anchor="middle" font-size="18" fill="#111111">k_B ln 4</text>

  <!-- plus -->
  <text x="215" y="298" text-anchor="middle" font-size="26" fill="#333333" font-weight="bold">+</text>

  <!-- S2 -->
  <rect x="240" y="245" width="150" height="90" rx="8" fill="#fff4e8" stroke="#b5651d" stroke-width="2"/>
  <text x="315" y="275" text-anchor="middle" font-size="15" fill="#b5651d" font-weight="bold">S&#8322;</text>
  <text x="315" y="307" text-anchor="middle" font-size="18" fill="#111111">k_B ln 8</text>

  <!-- equals arrow -->
  <line x1="405" y1="290" x2="455" y2="290" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- S total -->
  <rect x="465" y="245" width="150" height="90" rx="8" fill="#e9f7ee" stroke="#1c7a43" stroke-width="2"/>
  <text x="540" y="272" text-anchor="middle" font-size="15" fill="#1c7a43" font-weight="bold">S = S&#8321; + S&#8322;</text>
  <text x="540" y="300" text-anchor="middle" font-size="16" fill="#111111">= k_B ln 32</text>
  <text x="540" y="322" text-anchor="middle" font-size="13" fill="#555555">(= k_B ln4 + k_B ln8) &#10003;</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#999999"/>
    </marker>
  </defs>
</svg>
