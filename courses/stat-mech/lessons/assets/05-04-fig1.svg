<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="470" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">The correlation length diverges at T_c: fluctuations on every scale</text>

  <!-- ============ TOP: xi(T) divergence ============ -->
  <!-- Axes -->
  <line x1="90" y1="235" x2="665" y2="235" stroke="#333333" stroke-width="2"/>
  <line x1="90" y1="235" x2="90" y2="45" stroke="#333333" stroke-width="2"/>
  <polygon points="665,235 655,230 655,240" fill="#333333"/>
  <polygon points="90,45 85,55 95,55" fill="#333333"/>

  <!-- Axis labels -->
  <text x="672" y="240" font-size="13" fill="#111111">T</text>
  <text x="40" y="140" font-size="14" fill="#111111" transform="rotate(-90 40 140)">correlation length &#958;</text>

  <!-- vertical asymptote at T_c -->
  <line x1="375" y1="235" x2="375" y2="48" stroke="#888888" stroke-width="1.4" stroke-dasharray="5 5"/>
  <text x="375" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">T_c</text>

  <!-- xi curve, T < T_c branch (left) -->
  <path d="M 108 231 L 170 226 L 230 218 L 280 205 L 315 186 L 340 156 L 358 112 L 368 72 L 372 52"
        fill="none" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
  <!-- xi curve, T > T_c branch (right) -->
  <path d="M 378 52 L 382 72 L 392 112 L 410 156 L 435 186 L 470 205 L 520 218 L 580 226 L 642 231"
        fill="none" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- power-law annotation -->
  <text x="150" y="120" font-size="13" fill="#c0392b" font-style="italic">&#958; &#8733; |t|<tspan baseline-shift="super" font-size="10">&#8722;&#957;</tspan></text>
  <text x="470" y="120" font-size="13" fill="#c0392b" font-style="italic">t = (T &#8722; T_c)/T_c</text>

  <!-- ============ BOTTOM: three snapshots ============ -->
  <!-- Panel A: T < T_c, ordered -->
  <rect x="110" y="300" width="100" height="100" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
  <rect x="170" y="320" width="20" height="20" fill="#2c6fb3"/>
  <rect x="130" y="360" width="20" height="20" fill="#2c6fb3"/>
  <text x="160" y="418" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111">T &lt; T_c</text>
  <text x="160" y="434" text-anchor="middle" font-size="11.5" fill="#555555">ordered, &#958; small</text>

  <!-- Panel B: T ~ T_c, scale-invariant -->
  <rect x="310" y="300" width="100" height="100" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
  <rect x="370" y="300" width="20" height="20" fill="#2c6fb3"/>
  <rect x="390" y="300" width="20" height="20" fill="#2c6fb3"/>
  <rect x="350" y="320" width="20" height="20" fill="#2c6fb3"/>
  <rect x="370" y="320" width="20" height="20" fill="#2c6fb3"/>
  <rect x="390" y="320" width="20" height="20" fill="#2c6fb3"/>
  <rect x="350" y="340" width="20" height="20" fill="#2c6fb3"/>
  <rect x="370" y="340" width="20" height="20" fill="#2c6fb3"/>
  <rect x="310" y="360" width="20" height="20" fill="#2c6fb3"/>
  <rect x="330" y="360" width="20" height="20" fill="#2c6fb3"/>
  <rect x="350" y="360" width="20" height="20" fill="#2c6fb3"/>
  <rect x="310" y="380" width="20" height="20" fill="#2c6fb3"/>
  <text x="360" y="418" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111">T &#8776; T_c</text>
  <text x="360" y="434" text-anchor="middle" font-size="11.5" fill="#555555">clusters of every size, &#958; &#8594; &#8734;</text>

  <!-- Panel C: T > T_c, disordered -->
  <rect x="510" y="300" width="100" height="100" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
  <rect x="530" y="300" width="20" height="20" fill="#2c6fb3"/>
  <rect x="570" y="300" width="20" height="20" fill="#2c6fb3"/>
  <rect x="510" y="320" width="20" height="20" fill="#2c6fb3"/>
  <rect x="550" y="320" width="20" height="20" fill="#2c6fb3"/>
  <rect x="590" y="320" width="20" height="20" fill="#2c6fb3"/>
  <rect x="530" y="340" width="20" height="20" fill="#2c6fb3"/>
  <rect x="570" y="340" width="20" height="20" fill="#2c6fb3"/>
  <rect x="510" y="360" width="20" height="20" fill="#2c6fb3"/>
  <rect x="550" y="360" width="20" height="20" fill="#2c6fb3"/>
  <rect x="590" y="360" width="20" height="20" fill="#2c6fb3"/>
  <rect x="530" y="380" width="20" height="20" fill="#2c6fb3"/>
  <rect x="570" y="380" width="20" height="20" fill="#2c6fb3"/>
  <text x="560" y="418" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111">T &gt; T_c</text>
  <text x="560" y="434" text-anchor="middle" font-size="11.5" fill="#555555">disordered, &#958; small</text>

  <!-- guiding brace text -->
  <text x="360" y="278" text-anchor="middle" font-size="11.5" fill="#888888" font-style="italic">At criticality the pattern looks the same at every magnification (scale invariance).</text>
</svg>
