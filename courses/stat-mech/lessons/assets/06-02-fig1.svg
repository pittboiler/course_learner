<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="430" fill="#ffffff"/>

  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Maxwell's demon — and the bill it forgets to pay</text>

  <!-- ================= The box with a trapdoor ================= -->
  <!-- outer box -->
  <rect x="40" y="55" width="440" height="230" rx="6" fill="#fafafa" stroke="#333333" stroke-width="2.5"/>

  <!-- central wall with trapdoor gap -->
  <line x1="260" y1="55" x2="260" y2="150" stroke="#333333" stroke-width="4"/>
  <line x1="260" y1="200" x2="260" y2="285" stroke="#333333" stroke-width="4"/>
  <!-- trapdoor (open flap) -->
  <line x1="260" y1="200" x2="292" y2="178" stroke="#b5651d" stroke-width="4"/>
  <text x="300" y="205" font-size="11" fill="#b5651d">trapdoor</text>

  <!-- labels for the two chambers -->
  <text x="150" y="78" text-anchor="middle" font-size="13" fill="#1a4fa0" font-weight="bold">cold side (slow)</text>
  <text x="372" y="78" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">hot side (fast)</text>

  <!-- SLOW molecules (blue, short arrows) on left -->
  <g stroke="#1a4fa0" stroke-width="2" fill="#1a4fa0">
    <circle cx="95" cy="130" r="7"/><line x1="102" y1="130" x2="118" y2="130" marker-end="url(#av)"/>
    <circle cx="150" cy="190" r="7"/><line x1="157" y1="190" x2="171" y2="185" marker-end="url(#av)"/>
    <circle cx="110" cy="240" r="7"/><line x1="117" y1="240" x2="131" y2="243" marker-end="url(#av)"/>
    <circle cx="195" cy="110" r="7"/><line x1="202" y1="110" x2="216" y2="114" marker-end="url(#av)"/>
  </g>

  <!-- FAST molecules (red, long arrows) on right -->
  <g stroke="#c0392b" stroke-width="2" fill="#c0392b">
    <circle cx="320" cy="120" r="7"/><line x1="327" y1="120" x2="360" y2="120" marker-end="url(#av2)"/>
    <circle cx="410" cy="180" r="7"/><line x1="417" y1="180" x2="450" y2="172" marker-end="url(#av2)"/>
    <circle cx="345" cy="240" r="7"/><line x1="352" y1="240" x2="384" y2="246" marker-end="url(#av2)"/>
    <circle cx="440" cy="110" r="7"/><line x1="447" y1="110" x2="474" y2="104" marker-end="url(#av2)"/>
  </g>

  <!-- one molecule crossing (being sorted) -->
  <g stroke="#c0392b" stroke-width="2" fill="#c0392b" opacity="0.55">
    <circle cx="252" cy="188" r="7"/><line x1="259" y1="188" x2="290" y2="182" marker-end="url(#av2)"/>
  </g>

  <!-- the demon at the door -->
  <circle cx="260" cy="172" r="10" fill="#1c7a43" stroke="#0f4d29" stroke-width="1.5"/>
  <text x="260" y="176" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">D</text>
  <text x="260" y="308" text-anchor="middle" font-size="12" fill="#1c7a43">demon opens the door only for fast molecules going left→right</text>
  <text x="260" y="326" text-anchor="middle" font-size="12" fill="#111111">apparent result: entropy drops, second law seems broken</text>

  <!-- ================= The memory / erasure cost ================= -->
  <text x="605" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">the demon's memory</text>

  <!-- register tape -->
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">
    <rect x="520" y="95" width="34" height="34" fill="#eef4ff" stroke="#1a4fa0" stroke-width="2"/><text x="537" y="118">1</text>
    <rect x="554" y="95" width="34" height="34" fill="#eef4ff" stroke="#1a4fa0" stroke-width="2"/><text x="571" y="118">0</text>
    <rect x="588" y="95" width="34" height="34" fill="#eef4ff" stroke="#1a4fa0" stroke-width="2"/><text x="605" y="118">1</text>
    <rect x="622" y="95" width="34" height="34" fill="#eef4ff" stroke="#1a4fa0" stroke-width="2"/><text x="639" y="118">1</text>
    <rect x="656" y="95" width="34" height="34" fill="#eef4ff" stroke="#1a4fa0" stroke-width="2"/><text x="673" y="118">0</text>
  </g>
  <text x="605" y="150" text-anchor="middle" font-size="11.5" fill="#555555">each measurement writes one bit</text>

  <!-- arrow down to erasure -->
  <line x1="605" y1="160" x2="605" y2="192" stroke="#333333" stroke-width="2" marker-end="url(#dn)"/>
  <text x="605" y="180" text-anchor="middle" font-size="11" fill="#333333" font-style="italic">reset to run again</text>

  <!-- erased tape -->
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#999999">
    <rect x="520" y="200" width="34" height="34" fill="#f5f5f5" stroke="#999999" stroke-width="2"/><text x="537" y="223">0</text>
    <rect x="554" y="200" width="34" height="34" fill="#f5f5f5" stroke="#999999" stroke-width="2"/><text x="571" y="223">0</text>
    <rect x="588" y="200" width="34" height="34" fill="#f5f5f5" stroke="#999999" stroke-width="2"/><text x="605" y="223">0</text>
    <rect x="622" y="200" width="34" height="34" fill="#f5f5f5" stroke="#999999" stroke-width="2"/><text x="639" y="223">0</text>
    <rect x="656" y="200" width="34" height="34" fill="#f5f5f5" stroke="#999999" stroke-width="2"/><text x="673" y="223">0</text>
  </g>

  <!-- Landauer cost box -->
  <rect x="510" y="255" width="190" height="70" rx="8" fill="#fff4e8" stroke="#b5651d" stroke-width="2.5"/>
  <text x="605" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#b5651d">Landauer's principle</text>
  <text x="605" y="304" text-anchor="middle" font-size="14" fill="#111111">erase 1 bit &#8805; k_B T ln2</text>
  <text x="605" y="318" text-anchor="middle" font-size="11" fill="#555555">of heat dumped to the bath</text>

  <!-- bottom verdict -->
  <rect x="40" y="352" width="650" height="52" rx="8" fill="#eef7ef" stroke="#1c7a43" stroke-width="2"/>
  <text x="365" y="374" text-anchor="middle" font-size="13" fill="#0f4d29" font-weight="bold">The entropy the demon removes from the gas is paid back — with interest — when it erases its memory.</text>
  <text x="365" y="394" text-anchor="middle" font-size="12.5" fill="#0f4d29">Information is physical; the second law survives. No free lunch.</text>

  <defs>
    <marker id="av" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1a4fa0"/>
    </marker>
    <marker id="av2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="dn" markerWidth="9" markerHeight="9" refX="4" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,0 L4,7 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
