<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="sans-serif">
  <rect x="0" y="0" width="680" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Mean occupation of a mode of energy &#949;</text>

  <!-- Axes -->
  <line x1="90" y1="370" x2="645" y2="370" stroke="#333333" stroke-width="2"/>
  <line x1="90" y1="370" x2="90" y2="60" stroke="#333333" stroke-width="2"/>

  <!-- Axis labels -->
  <text x="40" y="215" text-anchor="middle" font-size="14" fill="#111111" transform="rotate(-90 40 215)">mean occupation  &#10216;n(&#949;)&#10217;</text>
  <text x="370" y="422" text-anchor="middle" font-size="14" fill="#111111">energy  &#949;   (in units of k_B T about &#956;)</text>

  <!-- Reference gridlines: n = 1 and n = 1/2 -->
  <line x1="90" y1="290" x2="645" y2="290" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="90" y1="330" x2="645" y2="330" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="84" y="294" text-anchor="end" font-size="12" fill="#555555">1</text>
  <text x="84" y="334" text-anchor="end" font-size="12" fill="#999999">&#189;</text>
  <text x="84" y="374" text-anchor="end" font-size="12" fill="#555555">0</text>

  <!-- mu vertical line -->
  <line x1="318" y1="60" x2="318" y2="370" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="318" y="388" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold">&#956;</text>

  <!-- T=0 Fermi step (faint) -->
  <polyline points="90,290 318,290 318,370 645,370" fill="none" stroke="#9bb4d6" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="185" y="282" text-anchor="middle" font-size="11.5" fill="#5b78a8">T = 0 step (filled below &#956;)</text>

  <!-- Fermi-Dirac curve (blue) -->
  <polyline points="90,292.3 131.2,293.8 193.5,299.5 255.9,311.5 287.1,320.2 318,330 349.4,339.8 380.6,348.5 442.9,360.5 505.3,366.2 567.6,368.6 630,369.5"
            fill="none" stroke="#1a4fa0" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Bose-Einstein curve (red) -->
  <polyline points="331,65 333,70 336.9,141.4 343.2,207.4 349.4,246.7 361.9,291.1 380.6,323.4 411.8,347 442.9,357.5 505.3,365.8 567.6,368.5 630,369.5"
            fill="none" stroke="#c0392b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Maxwell-Boltzmann curve (green, dashed) -->
  <polyline points="237.2,76.5 255.9,152.5 287.1,238.1 318,290 349.4,321.5 380.6,340.6 442.9,359.2 505.3,366 567.6,368.6 630,369.5"
            fill="none" stroke="#1c7a43" stroke-width="3" stroke-dasharray="8 5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- FD point at mu = 1/2 -->
  <circle cx="318" cy="330" r="5" fill="#1a4fa0"/>
  <text x="326" y="326" text-anchor="start" font-size="12" fill="#1a4fa0">&#10216;n&#10217; = &#189; at &#949; = &#956;</text>

  <!-- Callouts -->
  <text x="360" y="107" text-anchor="start" font-size="12.5" fill="#c0392b" font-weight="bold">BE diverges as &#949; &#8594; &#956;&#8314;</text>
  <text x="360" y="123" text-anchor="start" font-size="11" fill="#7a4a44">(macroscopic ground-state pileup &#8594; BEC)</text>

  <!-- Legend -->
  <rect x="452" y="150" width="185" height="96" rx="8" fill="#fbfbfb" stroke="#cccccc" stroke-width="1"/>
  <line x1="466" y1="172" x2="500" y2="172" stroke="#c0392b" stroke-width="3.5"/>
  <text x="508" y="177" font-size="12.5" fill="#111111">Bose&#8211;Einstein  (e&#7826;&#8722;1)&#8315;&#185;</text>
  <line x1="466" y1="198" x2="500" y2="198" stroke="#1a4fa0" stroke-width="3.5"/>
  <text x="508" y="203" font-size="12.5" fill="#111111">Fermi&#8211;Dirac  (e&#7826;+1)&#8315;&#185;</text>
  <line x1="466" y1="224" x2="500" y2="224" stroke="#1c7a43" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="508" y="229" font-size="12.5" fill="#111111">Maxwell&#8211;Boltzmann  e&#8315;&#7826;</text>
  <text x="466" y="242" font-size="10.5" fill="#777777">x = &#946;(&#949;&#8722;&#956;);  all merge for x &#8811; 1</text>
</svg>
