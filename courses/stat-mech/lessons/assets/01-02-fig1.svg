<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>
  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Multiplicity sharpens as N grows</text>
  <!-- Axes -->
  <line x1="70" y1="340" x2="610" y2="340" stroke="#111111" stroke-width="2"/>
  <line x1="70" y1="50" x2="70" y2="340" stroke="#111111" stroke-width="2"/>
  <!-- x ticks -->
  <line x1="70" y1="340" x2="70" y2="347" stroke="#111111" stroke-width="2"/>
  <line x1="340" y1="340" x2="340" y2="347" stroke="#111111" stroke-width="2"/>
  <line x1="610" y1="340" x2="610" y2="347" stroke="#111111" stroke-width="2"/>
  <text x="70" y="363" text-anchor="middle" font-size="13" fill="#111111">0</text>
  <text x="340" y="363" text-anchor="middle" font-size="13" fill="#111111">1/2</text>
  <text x="610" y="363" text-anchor="middle" font-size="13" fill="#111111">1</text>
  <text x="340" y="388" text-anchor="middle" font-size="14" fill="#111111">fraction of spins up  x = n/N  (the macrostate)</text>
  <!-- y label -->
  <text x="24" y="200" text-anchor="middle" font-size="14" fill="#111111" transform="rotate(-90 24 200)">P(x) = &#937;(x) / 2&#8319;  (share of microstates)</text>
  <!-- equal-split reference line -->
  <line x1="340" y1="50" x2="340" y2="340" stroke="#999999" stroke-width="1.5" stroke-dasharray="5,5"/>
  <!-- N=20 curve (broad, short) -->
  <polyline fill="none" stroke="#1f77b4" stroke-width="2.5" points="70.0,340.0 108.2,339.9 133.0,339.7 155.5,339.2 175.8,337.8 193.8,335.2 209.5,331.3 223.0,326.2 234.2,320.6 245.5,313.5 254.5,306.9 263.5,299.6 272.5,291.8 281.5,283.6 290.5,275.6 299.5,268.0 308.5,261.3 317.5,255.9 326.5,252.1 333.2,250.4 340.0,249.9 346.8,250.4 353.5,252.1 362.5,255.9 371.5,261.3 380.5,268.0 389.5,275.6 398.5,283.6 407.5,291.8 416.5,299.6 425.5,306.9 434.5,313.5 445.8,320.6 457.0,326.2 470.5,331.3 486.2,335.2 504.2,337.8 524.5,339.2 547.0,339.7 571.8,339.9 610.0,340.0"/>
  <!-- N=200 curve (narrow, tall) -->
  <polyline fill="none" stroke="#d62728" stroke-width="2.5" points="259.0,340.0 268.0,339.8 277.0,338.8 283.8,336.3 290.5,330.1 295.0,322.3 299.5,310.0 304.0,291.8 308.5,266.9 313.0,235.2 317.5,197.7 322.0,157.3 326.5,118.0 331.0,85.0 335.5,62.8 340.0,55.0 344.5,62.8 349.0,85.0 353.5,118.0 358.0,157.3 362.5,197.7 367.0,235.2 371.5,266.9 376.0,291.8 380.5,310.0 385.0,322.3 389.5,330.1 396.2,336.3 403.0,338.8 412.0,339.8 421.0,340.0"/>
  <!-- width brace annotation for N=200 (approx +/- 1 std around 0.5): std_x=0.0354 -> +/-19px -->
  <line x1="321" y1="200" x2="359" y2="200" stroke="#d62728" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="470" y="150" text-anchor="middle" font-size="13" fill="#d62728">width ~ 1/&#8730;N</text>
  <line x1="405" y1="152" x2="360" y2="196" stroke="#d62728" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- legend -->
  <rect x="440" y="70" width="160" height="56" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <line x1="452" y1="88" x2="482" y2="88" stroke="#1f77b4" stroke-width="2.5"/>
  <text x="490" y="93" font-size="13" fill="#111111">N = 20</text>
  <line x1="452" y1="112" x2="482" y2="112" stroke="#d62728" stroke-width="2.5"/>
  <text x="490" y="117" font-size="13" fill="#111111">N = 200</text>
</svg>
