<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Canonical P(E) &#8733; g(E) e&#8722;&#946;E &#8212; sharper as N grows</text>

  <!-- axes -->
  <line x1="60" y1="340" x2="612" y2="340" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="60" y1="60" x2="60" y2="340" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="612,340 602,335 602,345" fill="#8a8a8a"/>
  <polygon points="60,60 55,70 65,70" fill="#8a8a8a"/>
  <text x="606" y="360" fill="#8a8a8a" font-size="13">E / &#10216;E&#10217;</text>
  <text x="16" y="70" fill="#8a8a8a" font-size="13">P(E)</text>

  <!-- peak line at e = 1 (the shared mean = microcanonical energy) -->
  <line x1="340" y1="80" x2="340" y2="340" stroke="#555555" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="340" y="358" text-anchor="middle" fill="#333333" font-size="13">1</text>
  <text x="340" y="374" text-anchor="middle" fill="#555555" font-size="12" font-style="italic">= E&#8342;&#8339;&#8354;&#8341;&#8320;</text>

  <!-- broad curve: N small -->
  <polyline fill="none" stroke="#c0392b" stroke-width="2.5" points="80.0,330.7 106.0,327.2 132.0,322.9 158.0,318.1 184.0,312.7 210.0,307.2 236.0,301.8 262.0,297.0 288.0,293.3 314.0,290.8 340.0,290.0 366.0,290.8 392.0,293.3 418.0,297.0 444.0,301.8 470.0,307.2 496.0,312.7 522.0,318.1 548.0,322.9 574.0,327.2 600.0,330.7"/>

  <!-- medium curve: N larger -->
  <polyline fill="none" stroke="#e08a1e" stroke-width="2.5" points="80.0,339.9 132.0,338.6 176.6,333.0 210.0,321.4 236.0,305.9 258.3,288.5 280.6,269.6 302.9,252.8 321.4,243.4 340.0,240.0 358.6,243.4 380.9,255.3 403.1,272.7 425.4,291.6 447.7,308.5 470.0,321.4 503.4,333.0 548.0,338.6 600.0,339.9"/>

  <!-- narrow curve: N ~ 10^23 -->
  <polyline fill="none" stroke="#1a4fa0" stroke-width="2.5" points="80.0,340.0 221.1,340.0 247.1,338.8 262.0,334.3 273.1,324.5 284.3,303.7 295.4,267.3 306.6,215.2 317.7,156.4 328.9,108.6 336.3,92.1 340.0,90.0 343.7,92.1 351.1,108.6 362.3,156.4 373.4,215.2 384.6,267.3 395.7,303.7 406.9,324.5 418.0,334.3 432.9,338.8 458.9,340.0 600.0,340.0"/>

  <!-- width brackets for the broad curve (relative width ~ 1/sqrt(N)) -->
  <line x1="262" y1="308" x2="418" y2="308" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="464" y="312" fill="#c0392b" font-size="12">width &#8733; 1/&#8730;N</text>

  <!-- legend -->
  <rect x="452" y="86" width="150" height="70" rx="6" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
  <line x1="464" y1="104" x2="486" y2="104" stroke="#c0392b" stroke-width="3"/>
  <text x="492" y="108" font-size="12" fill="#333333">small N</text>
  <line x1="464" y1="122" x2="486" y2="122" stroke="#e08a1e" stroke-width="3"/>
  <text x="492" y="126" font-size="12" fill="#333333">larger N</text>
  <line x1="464" y1="140" x2="486" y2="140" stroke="#1a4fa0" stroke-width="3"/>
  <text x="492" y="144" font-size="12" fill="#333333">N ~ 10&#178;&#179;</text>

  <!-- caption -->
  <text x="60" y="392" fill="#555555" font-size="12" font-style="italic">Rising g(E) times falling e&#8722;&#946;E gives a peak at &#10216;E&#10217;; its relative width shrinks like 1/&#8730;N &#8212; energy becomes effectively sharp.</text>
</svg>
