<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>

  <!-- ================= LEFT PANEL: p-T phase diagram ================= -->
  <text x="250" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Phase diagram in the p–T plane</text>

  <!-- axes -->
  <line x1="80" y1="410" x2="470" y2="410" stroke="#333333" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="80" y1="410" x2="80" y2="55" stroke="#333333" stroke-width="2" marker-end="url(#ar)"/>
  <text x="475" y="432" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">T</text>
  <text x="66" y="52" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">p</text>

  <!-- region fills (light) -->
  <path d="M80 410 L80 90 L215 90 L245 300 Z" fill="#eaf1fb"/>
  <path d="M215 90 L235 60 L470 60 L470 150 L440 150 L245 300 Z" fill="#fdeeea"/>
  <path d="M245 300 L440 150 L470 150 L470 410 L80 410 Z" fill="#eef7ee"/>

  <!-- sublimation curve: origin -> triple point -->
  <path d="M85 405 Q 150 350 245 300" fill="none" stroke="#1a4fa0" stroke-width="2.5"/>
  <!-- fusion curve: triple point -> up, NEGATIVE slope (tilts left) -->
  <path d="M245 300 Q 222 180 210 65" fill="none" stroke="#1a4fa0" stroke-width="2.5"/>
  <!-- vaporization curve: triple point -> critical point -->
  <path d="M245 300 Q 350 205 440 150" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- triple point -->
  <circle cx="245" cy="300" r="6" fill="#111111"/>
  <text x="256" y="322" font-size="12.5" fill="#111111" font-weight="bold">triple point</text>

  <!-- critical point (open circle: line ENDS here) -->
  <circle cx="440" cy="150" r="7" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
  <text x="452" y="145" font-size="12.5" fill="#c0392b" font-weight="bold">critical point</text>
  <text x="452" y="162" font-size="11" fill="#c0392b" font-style="italic">(line stops)</text>

  <!-- region labels -->
  <text x="130" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a4fa0">SOLID</text>
  <text x="315" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#b9541f">LIQUID</text>
  <text x="360" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f7d33">GAS</text>

  <!-- curve annotations -->
  <text x="118" y="368" font-size="11" fill="#1a4fa0" transform="rotate(-24 118 368)">sublimation</text>
  <text x="176" y="150" font-size="11" fill="#1a4fa0" transform="rotate(-80 176 150)">fusion (slope &lt; 0 for water)</text>
  <text x="300" y="238" font-size="11" fill="#c0392b" transform="rotate(-30 300 238)">vaporization</text>

  <!-- ================= RIGHT PANEL: G vs T, first-order kink ================= -->
  <text x="700" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Gibbs free energy G(T) at fixed p</text>

  <!-- axes -->
  <line x1="560" y1="410" x2="860" y2="410" stroke="#333333" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="560" y1="410" x2="560" y2="55" stroke="#333333" stroke-width="2" marker-end="url(#ar)"/>
  <text x="865" y="432" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">T</text>
  <text x="546" y="52" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">G</text>

  <!-- metastable continuations (thin dashed) -->
  <line x1="575" y1="185" x2="855" y2="305" stroke="#b9541f" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="575" y1="120" x2="855" y2="365" stroke="#2f7d33" stroke-width="1.3" stroke-dasharray="4 4"/>

  <!-- physical (lower-envelope) branches, thick -->
  <line x1="575" y1="185" x2="712" y2="243" stroke="#b9541f" stroke-width="3.2"/>
  <line x1="712" y1="243" x2="855" y2="365" stroke="#2f7d33" stroke-width="3.2"/>

  <!-- transition temperature marker -->
  <line x1="712" y1="243" x2="712" y2="410" stroke="#888888" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="712" y="428" text-anchor="middle" font-size="13" fill="#555555">T*</text>

  <!-- kink dot -->
  <circle cx="712" cy="243" r="5.5" fill="#111111"/>
  <text x="702" y="228" text-anchor="end" font-size="12" fill="#111111" font-weight="bold">kink: slope jumps</text>
  <text x="702" y="211" text-anchor="end" font-size="11.5" fill="#111111">−S₁ → −S₂  ⇒  ΔS &gt; 0</text>

  <!-- branch labels -->
  <text x="600" y="176" font-size="12.5" font-weight="bold" fill="#b9541f">liquid</text>
  <text x="812" y="355" font-size="12.5" font-weight="bold" fill="#2f7d33">gas</text>

  <text x="700" y="452" text-anchor="middle" font-size="12" fill="#333333">The physical G is the lower branch; its slope is −S, so a first-order transition = a slope kink = latent heat.</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
