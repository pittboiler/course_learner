<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="320" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">The thermodynamic square</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#555555" font-style="italic">corners = natural variables · edges = potentials · diagonals = conjugate pairs</text>

  <!-- Diagonals (conjugate pairs), drawn first so the square sits on top -->
  <line x1="470" y1="330" x2="182" y2="122" stroke="#b06fc9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowP)"/>
  <line x1="170" y1="330" x2="458" y2="122" stroke="#b06fc9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowP)"/>

  <!-- Square edges (with gaps left for the potential boxes) -->
  <line x1="170" y1="110" x2="470" y2="110" stroke="#333333" stroke-width="2.5"/>
  <line x1="470" y1="110" x2="470" y2="340" stroke="#333333" stroke-width="2.5"/>
  <line x1="470" y1="340" x2="170" y2="340" stroke="#333333" stroke-width="2.5"/>
  <line x1="170" y1="340" x2="170" y2="110" stroke="#333333" stroke-width="2.5"/>

  <!-- Corner variables (natural variables) -->
  <circle cx="170" cy="110" r="20" fill="#eef4ff" stroke="#1a4fa0" stroke-width="2"/>
  <text x="170" y="116" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a4fa0">S</text>

  <circle cx="470" cy="110" r="20" fill="#eef4ff" stroke="#1a4fa0" stroke-width="2"/>
  <text x="470" y="116" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a4fa0">V</text>

  <circle cx="470" cy="340" r="20" fill="#eef4ff" stroke="#1a4fa0" stroke-width="2"/>
  <text x="470" y="346" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a4fa0">T</text>

  <circle cx="170" cy="340" r="20" fill="#eef4ff" stroke="#1a4fa0" stroke-width="2"/>
  <text x="170" y="346" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a4fa0">p</text>

  <!-- Potentials on the edges (white boxes mask the line) -->
  <rect x="298" y="94" width="44" height="32" rx="6" fill="#ffffff"/>
  <text x="320" y="116" text-anchor="middle" font-size="20" font-weight="bold" fill="#1c7a43">U</text>
  <text x="320" y="86" text-anchor="middle" font-size="11" fill="#777777">U(S,V)</text>

  <rect x="448" y="209" width="44" height="32" rx="6" fill="#ffffff"/>
  <text x="470" y="231" text-anchor="middle" font-size="20" font-weight="bold" fill="#1c7a43">F</text>
  <text x="516" y="229" text-anchor="middle" font-size="11" fill="#777777">F(T,V)</text>

  <rect x="298" y="324" width="44" height="32" rx="6" fill="#ffffff"/>
  <text x="320" y="346" text-anchor="middle" font-size="20" font-weight="bold" fill="#1c7a43">G</text>
  <text x="320" y="372" text-anchor="middle" font-size="11" fill="#777777">G(T,p)</text>

  <rect x="148" y="209" width="44" height="32" rx="6" fill="#ffffff"/>
  <text x="170" y="231" text-anchor="middle" font-size="20" font-weight="bold" fill="#1c7a43">H</text>
  <text x="124" y="229" text-anchor="middle" font-size="11" fill="#777777">H(S,p)</text>

  <!-- Conjugate-pair label -->
  <text x="320" y="228" text-anchor="middle" font-size="12" fill="#b06fc9" font-weight="bold">conjugate: (S,T) &amp; (p,V)</text>

  <!-- Reading caption -->
  <text x="320" y="410" text-anchor="middle" font-size="12.5" fill="#333333">Opposite edges pair up: from F and G, the top/bottom edges give</text>
  <text x="320" y="428" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">(&#8706;S/&#8706;V)&#8348; = (&#8706;p/&#8706;T)&#7515;   &#8212;   a Maxwell relation</text>

  <defs>
    <marker id="arrowP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b06fc9"/>
    </marker>
  </defs>
</svg>
