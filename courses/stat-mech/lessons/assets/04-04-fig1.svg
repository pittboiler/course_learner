<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#334155"/>
    </marker>
    <marker id="ahR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <title>Fermi-Dirac occupation: a sharp step at the Fermi energy at T=0, smeared over about k_B T at small T; and the filled Fermi sphere in momentum space</title>

  <!-- ================= LEFT PANEL: occupation vs energy ================= -->
  <text x="205" y="30" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Occupation of levels</text>

  <!-- axes -->
  <line x1="70" y1="90" x2="70" y2="320" stroke="#334155" stroke-width="2"/>
  <line x1="70" y1="320" x2="360" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
  <text x="368" y="325" font-size="14" fill="#334155" font-style="italic">&#949;</text>
  <text x="42" y="96" font-size="14" fill="#334155">1</text>
  <text x="42" y="325" font-size="14" fill="#334155">0</text>
  <text x="30" y="205" font-size="14" fill="#334155" transform="rotate(-90 30 205)" text-anchor="middle">n&#772;(&#949;)</text>

  <!-- dashed gridline at n=1 -->
  <line x1="70" y1="90" x2="360" y2="90" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- T = 0 : sharp step (blue) -->
  <polyline points="70,90 250,90 250,320 360,320" fill="none" stroke="#2563eb" stroke-width="3"/>

  <!-- T > 0 : smeared Fermi function (red dashed) crossing 0.5 at E_F -->
  <path d="M70,92 H214 C238,92 262,318 300,318 H360" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Fermi energy marker -->
  <line x1="250" y1="90" x2="250" y2="320" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="250" y="340" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="middle">E<tspan font-size="10" dy="4">F</tspan></text>

  <!-- half-filling dot -->
  <circle cx="250" cy="205" r="3.5" fill="#dc2626"/>
  <text x="262" y="200" font-size="11" fill="#dc2626">n&#772;=&#189;</text>

  <!-- width ~ k_B T bracket -->
  <line x1="214" y1="255" x2="286" y2="255" stroke="#dc2626" stroke-width="1.5" marker-start="url(#ahR)" marker-end="url(#ahR)"/>
  <text x="250" y="273" font-size="12" fill="#dc2626" text-anchor="middle">~ k<tspan font-size="9" dy="3">B</tspan><tspan dy="-3">T</tspan></text>

  <!-- legend -->
  <line x1="90" y1="372" x2="120" y2="372" stroke="#2563eb" stroke-width="3"/>
  <text x="126" y="376" font-size="12" fill="#334155">T = 0 : filled up to E<tspan font-size="9" dy="3">F</tspan></text>
  <line x1="90" y1="394" x2="120" y2="394" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="126" y="398" font-size="12" fill="#334155">small T : step smeared by ~k<tspan font-size="9" dy="3">B</tspan><tspan dy="-3">T</tspan></text>

  <!-- ================= RIGHT PANEL: Fermi sphere ================= -->
  <text x="560" y="30" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">Momentum space</text>

  <!-- momentum axes -->
  <line x1="560" y1="330" x2="560" y2="80" stroke="#334155" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="430" y1="200" x2="690" y2="200" stroke="#334155" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="698" y="205" font-size="13" fill="#334155" font-style="italic">p<tspan font-size="9" dy="3">x</tspan></text>
  <text x="566" y="78" font-size="13" fill="#334155" font-style="italic">p<tspan font-size="9" dy="3">y</tspan></text>

  <!-- filled Fermi sphere -->
  <circle cx="560" cy="200" r="95" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>

  <!-- scattered occupied states -->
  <g fill="#1e40af">
    <circle cx="540" cy="180" r="3"/><circle cx="580" cy="190" r="3"/><circle cx="560" cy="160" r="3"/>
    <circle cx="525" cy="215" r="3"/><circle cx="595" cy="225" r="3"/><circle cx="555" cy="235" r="3"/>
    <circle cx="600" cy="185" r="3"/><circle cx="520" cy="185" r="3"/><circle cx="575" cy="220" r="3"/>
    <circle cx="545" cy="150" r="3"/><circle cx="565" cy="255" r="3"/><circle cx="510" cy="200" r="3"/>
    <circle cx="610" cy="205" r="3"/><circle cx="535" cy="245" r="3"/><circle cx="588" cy="160" r="3"/>
  </g>

  <!-- Fermi momentum radius -->
  <line x1="560" y1="200" x2="627" y2="133" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ahR)"/>
  <text x="612" y="150" font-size="14" fill="#dc2626" font-weight="bold">p<tspan font-size="10" dy="4">F</tspan></text>

  <text x="560" y="360" font-size="12" fill="#475569" text-anchor="middle">all states with |p| &#8804; p<tspan font-size="9" dy="3">F</tspan><tspan dy="-3"> filled</tspan></text>
  <text x="560" y="392" font-size="12" fill="#475569" text-anchor="middle">radius set by density: p<tspan font-size="9" dy="3">F</tspan><tspan dy="-3"> = &#8463;(3&#960;&#178;n)</tspan><tspan font-size="9" dy="-6">1/3</tspan></text>
</svg>
