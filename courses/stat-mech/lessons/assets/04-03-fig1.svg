<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="sans-serif">
  <rect x="0" y="0" width="680" height="430" fill="#ffffff"/>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">The blackbody spectrum: Planck's law at two temperatures</text>

  <!-- Axes -->
  <line x1="70" y1="360" x2="655" y2="360" stroke="#333333" stroke-width="2"/>
  <line x1="70" y1="360" x2="70" y2="50" stroke="#333333" stroke-width="2"/>

  <!-- Axis labels -->
  <text x="24" y="205" text-anchor="middle" font-size="14" fill="#111111" transform="rotate(-90 24 205)">spectral energy density  u(&#969;)</text>
  <text x="362" y="410" text-anchor="middle" font-size="14" fill="#111111">frequency  &#969;</text>

  <!-- Rayleigh-Jeans curve (classical): tracks the hot curve at low w, then diverges up -->
  <polyline points="70.0,360.0 90.3,351.6 110.6,326.2 130.9,284.0 151.2,224.8 171.5,148.8 191.8,55.8"
            fill="none" stroke="#7f8c8d" stroke-width="2.5" stroke-dasharray="7 5"/>
  <!-- arrow continuing off the top -->
  <line x1="191.8" y1="55.8" x2="200" y2="42" stroke="#7f8c8d" stroke-width="2.5" stroke-dasharray="7 5"/>
  <polygon points="200,42 195.5,49 205.5,50" fill="#7f8c8d"/>
  <text x="210" y="52" text-anchor="start" font-size="12.5" fill="#7f8c8d" font-weight="bold">Rayleigh&#8211;Jeans (classical)</text>
  <text x="210" y="68" text-anchor="start" font-size="12.5" fill="#7f8c8d" font-style="italic">u &#8733; &#969;&#178; &#8594; &#8734;: the ultraviolet catastrophe</text>

  <!-- Hot curve T2 (red) -->
  <polyline points="70.0,360.0 78.7,358.5 88.8,353.4 99.0,345.2 109.2,334.5 119.3,321.8 129.4,307.6 139.6,292.2 149.8,276.1 159.9,259.6 170.1,243.0 180.2,226.5 190.4,210.5 200.5,195.0 210.7,180.3 220.8,166.5 231.0,153.7 241.1,141.9 251.2,131.3 261.4,121.8 271.5,113.5 281.7,106.4 291.9,100.5 302.0,95.8 312.1,92.2 322.3,89.6 332.4,88.2 342.6,87.7 352.8,88.1 362.9,89.4 373.0,91.5 383.2,94.4 393.4,97.9 403.5,102.1 413.7,106.7 423.8,111.9 434.0,117.5 444.1,123.5 454.2,129.7 464.4,136.2 474.5,142.9 484.7,149.8 494.8,156.8 505.0,163.9 515.2,171.0 525.3,178.1 535.5,185.2 545.6,192.2 555.8,199.2 565.9,206.1 576.0,212.8 586.2,219.4 596.4,225.9 606.5,232.2 616.6,238.3 626.8,244.3 637.0,250.0 647.1,255.6"
            fill="none" stroke="#c0392b" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Cool curve T1 (blue) -->
  <polyline points="70.0,360.0 84.5,357.6 99.0,351.6 113.5,343.4 128.0,334.3 142.5,325.2 157.0,316.6 171.5,309.2 186.0,303.1 200.5,298.6 215.0,295.5 229.5,293.9 244.0,293.6 258.5,294.4 273.0,296.2 287.5,298.7 302.0,301.8 316.5,305.4 331.0,309.2 345.5,313.1 360.0,317.1 374.5,321.0 389.0,324.8 403.5,328.4 418.0,331.7 432.5,334.9 447.0,337.8 461.5,340.4 476.0,342.9 490.5,345.0 505.0,347.0 519.5,348.7 534.0,350.2 548.5,351.6 563.0,352.7 577.5,353.8 592.0,354.7 606.5,355.4 621.0,356.1 635.5,356.7 650.0,357.2"
            fill="none" stroke="#1a4fa0" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Peak markers: omega_peak proportional to T -->
  <line x1="240.4" y1="293.5" x2="240.4" y2="360" stroke="#1a4fa0" stroke-width="1.3" stroke-dasharray="3 3"/>
  <circle cx="240.4" cy="293.5" r="4" fill="#1a4fa0"/>
  <line x1="342.7" y1="87.7" x2="342.7" y2="360" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="3 3"/>
  <circle cx="342.7" cy="87.7" r="4" fill="#c0392b"/>

  <!-- Wien displacement arrow between the two peaks -->
  <line x1="248" y1="380" x2="335" y2="380" stroke="#111111" stroke-width="1.5"/>
  <polygon points="342,380 333,376 333,384" fill="#111111"/>
  <text x="295" y="374" text-anchor="middle" font-size="11.5" fill="#111111" font-style="italic">peak shifts &#8733; T (Wien)</text>

  <!-- Curve labels -->
  <text x="410" y="80" text-anchor="start" font-size="14" fill="#c0392b" font-weight="bold">hotter:  T&#8322; = 1.6 T&#8321;</text>
  <text x="500" y="330" text-anchor="start" font-size="14" fill="#1a4fa0" font-weight="bold">cooler:  T&#8321;</text>

  <!-- Wien tail label -->
  <text x="560" y="185" text-anchor="middle" font-size="12" fill="#111111" font-style="italic">Wien tail:</text>
  <text x="560" y="200" text-anchor="middle" font-size="12" fill="#111111" font-style="italic">u &#8733; &#969;&#179; e^(&#8722;&#8463;&#969;/k_BT)</text>

  <!-- Note: total area under each curve grows as T^4 (Stefan-Boltzmann) -->
  <text x="235" y="180" text-anchor="middle" font-size="11.5" fill="#555555" font-style="italic">area under curve</text>
  <text x="235" y="195" text-anchor="middle" font-size="11.5" fill="#555555" font-style="italic">= U/V &#8733; T&#8308;</text>
</svg>
