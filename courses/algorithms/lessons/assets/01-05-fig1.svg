  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="11.5" text-anchor="start" font-style="italic">Closest pair: solve both halves, then the only pairs left to check lie in a strip of width 2&#948; around the split.</text>
  <rect x="60.0" y="52.0" width="640.0" height="236.0" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.0"/>
  <line x1="380.0" y1="52.0" x2="380.0" y2="288.0" stroke="#444444" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="380.0" y="44.0" fill="#444444" font-size="10.5" text-anchor="middle">split at x&#8344;</text>
  <rect x="326.0" y="52.0" width="108.0" height="236.0" rx="0" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="320.0" y="68.0" fill="#4a90d9" font-size="11" text-anchor="end">&#948;</text>
  <text x="440.0" y="68.0" fill="#4a90d9" font-size="11" text-anchor="start">&#948;</text>
  <circle cx="204.7" cy="182.2" r="3.4" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="336.8" cy="163.0" r="3.4" fill="#4a90d9" stroke="#4a90d9" stroke-width="1"/>
