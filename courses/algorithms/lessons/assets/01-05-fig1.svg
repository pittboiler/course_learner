  <text x="220.0" y="306.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">left half solved recursively</text>
  <text x="540.0" y="306.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">right half solved recursively</text>
  <text x="380.0" y="326.0" fill="#4a90d9" font-size="11.5" text-anchor="middle">&#948; = min(left best, right best)</text>
  <line x1="40.0" y1="314.0" x2="720.0" y2="314.0" stroke="#8a8a8a" stroke-width="0.9" stroke-dasharray="4 4"/>
  <text x="380.0" y="338.0" fill="#444444" font-size="12" text-anchor="middle">Sort the strip by y. For each point, only the NEXT 7 in y-order can be closer than &#948;.</text>
  <text x="380.0" y="358.0" fill="#8a8a8a" font-size="11" text-anchor="middle">Why 7: a &#948; &#215; 2&#948; box splits into eight &#948;/2 &#215; &#948;/2 squares, and each already-solved half</text>
  <text x="380.0" y="376.0" fill="#8a8a8a" font-size="11" text-anchor="middle">has no two points within &#948;, so each little square holds at most one point.</text>
  <text x="380.0" y="396.0" fill="#d1495b" font-size="11.5" text-anchor="middle">Combine step is &#920;(n), so T(n) = 2T(n/2) + &#920;(n) = &#920;(n log n).</text>
