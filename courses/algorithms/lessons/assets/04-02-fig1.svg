  <text x="24.0" y="404.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">Black arcs are the clause triangles — at most one vertex per clause can be chosen.</text>
  <text x="24.0" y="420.0" fill="#d1495b" font-size="10.5" text-anchor="start">Red arcs join a literal to its negation — never both.  So an independent set of size 3 is exactly a satisfying assignment.</text>
  <text x="736.0" y="404.0" fill="#4a90d9" font-size="10.5" text-anchor="end">double-circled: the size-3 independent set</text>
  <text x="736.0" y="420.0" fill="#4a90d9" font-size="10.5" text-anchor="end">x₁ = T,  x₂ = T,  x₃ free</text>
