  <text x="24.0" y="410.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">Right: on the standard bad family, the natural max-degree heuristic drifts up like H(k) and passes 2 at about 50 vertices. It has no constant ratio at all.</text>
