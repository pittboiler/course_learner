  <path d="M 470.0,112.8 Q 546.0,150.0 618.0,185.2" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <polygon points="622.0,187.2 617.0,187.4 619.1,183.2" fill="#4a90d9"/>
  <text x="541.2" y="163.9" fill="#4a90d9" font-size="11.5" text-anchor="middle">6</text>
  <path d="M 469.9,281.1 Q 546.0,243.0 618.1,207.0" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="622.1,204.9 619.2,209.0 617.1,204.8" fill="#8a8a8a"/>
  <text x="550.9" y="256.8" fill="#8a8a8a" font-size="11.5" text-anchor="middle">6</text>
  <circle cx="96.0" cy="196.0" r="20.0" fill="#faf9f6" stroke="#444444" stroke-width="1.6"/>
  <text x="96.0" y="200.4" fill="#444444" font-size="13" text-anchor="middle">S</text>
  <text x="96.0" y="231.0" fill="#444444" font-size="10.5" text-anchor="middle">d = 0</text>
  <text x="96.0" y="244.0" fill="#8a8a8a" font-size="10" text-anchor="middle">settled 1st</text>
  <circle cx="268.0" cy="104.0" r="20.0" fill="#faf9f6" stroke="#444444" stroke-width="1.6"/>
  <text x="268.0" y="108.4" fill="#444444" font-size="13" text-anchor="middle">A</text>
  <text x="268.0" y="139.0" fill="#444444" font-size="10.5" text-anchor="middle">d = 3</text>
  <text x="268.0" y="152.0" fill="#8a8a8a" font-size="10" text-anchor="middle">settled 3rd</text>
  <circle cx="268.0" cy="290.0" r="20.0" fill="#faf9f6" stroke="#444444" stroke-width="1.6"/>
  <text x="268.0" y="294.4" fill="#444444" font-size="13" text-anchor="middle">B</text>
  <text x="268.0" y="325.0" fill="#444444" font-size="10.5" text-anchor="middle">d = 2</text>
  <text x="268.0" y="338.0" fill="#8a8a8a" font-size="10" text-anchor="middle">settled 2nd</text>
  <circle cx="452.0" cy="104.0" r="20.0" fill="#faf9f6" stroke="#444444" stroke-width="1.6"/>
  <text x="452.0" y="108.4" fill="#444444" font-size="13" text-anchor="middle">C</text>
  <text x="452.0" y="139.0" fill="#444444" font-size="10.5" text-anchor="middle">d = 8</text>
  <text x="452.0" y="152.0" fill="#8a8a8a" font-size="10" text-anchor="middle">settled 4th</text>
  <circle cx="452.0" cy="290.0" r="20.0" fill="#faf9f6" stroke="#444444" stroke-width="1.6"/>
  <text x="452.0" y="294.4" fill="#444444" font-size="13" text-anchor="middle">D</text>
  <text x="452.0" y="325.0" fill="#444444" font-size="10.5" text-anchor="middle">d = 10</text>
  <text x="452.0" y="338.0" fill="#8a8a8a" font-size="10" text-anchor="middle">settled 5th</text>
  <circle cx="640.0" cy="196.0" r="20.0" fill="#faf9f6" stroke="#444444" stroke-width="1.6"/>
  <text x="640.0" y="200.4" fill="#444444" font-size="13" text-anchor="middle">T</text>
  <text x="640.0" y="231.0" fill="#444444" font-size="10.5" text-anchor="middle">d = 14</text>
  <text x="640.0" y="244.0" fill="#8a8a8a" font-size="10" text-anchor="middle">settled 6th</text>
  <text x="268.0" y="64.0" fill="#d1495b" font-size="10.5" text-anchor="middle">estimate 4, then improved to 3</text>
  <text x="560.0" y="352.0" fill="#d1495b" font-size="10.5" text-anchor="middle">tie: C also offers D a route of 10</text>
  <text x="24.0" y="362.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">S offers A a route of length 4.  B, settled next at 2, offers a better one: 2 + 1 = 3.</text>
  <text x="24.0" y="378.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">A is settled only after every vertex closer to S than it — that is the invariant the whole proof rests on.</text>
  <text x="24.0" y="398.0" fill="#4a90d9" font-size="11" text-anchor="start">Shortest S→T path:  S → B → A → C → T  =  2 + 1 + 5 + 6  =  14.</text>
</svg>
