<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <text x="24.0" y="22.0" fill="#8a8a8a" font-size="12" text-anchor="start" font-style="italic">The landscape, in the two worlds — and what a reduction actually buys you.</text>
  <text x="196.0" y="50.0" fill="#444444" font-size="12" text-anchor="middle">if  P ≠ NP   (believed)</text>
  <ellipse cx="196" cy="152" rx="168" ry="82" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <ellipse cx="132" cy="166" rx="80" ry="54" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
  <ellipse cx="288" cy="134" rx="54" ry="44" fill="none" stroke="#d1495b" stroke-width="1.5"/>
  <text x="196.0" y="80.0" fill="#8a8a8a" font-size="12" text-anchor="middle">NP</text>
  <text x="118.0" y="164.0" fill="#4a90d9" font-size="13" text-anchor="middle">P</text>
  <text x="288.0" y="132.0" fill="#d1495b" font-size="10.5" text-anchor="middle">NP-</text>
  <text x="288.0" y="144.0" fill="#d1495b" font-size="10.5" text-anchor="middle">complete</text>
  <text x="120.0" y="184.0" fill="#8a8a8a" font-size="9.5" text-anchor="middle">sorting, flow,</text>
  <text x="120.0" y="197.0" fill="#8a8a8a" font-size="9.5" text-anchor="middle">shortest paths</text>
  <text x="288.0" y="162.0" fill="#d1495b" font-size="9.5" text-anchor="middle">SAT, clique</text>
  <text x="196.0" y="258.0" fill="#8a8a8a" font-size="9.5" text-anchor="middle">factoring and graph isomorphism live in the gap:</text>
  <text x="196.0" y="271.0" fill="#8a8a8a" font-size="9.5" text-anchor="middle">in NP, not known to be in P or NP-complete</text>
  <text x="576.0" y="50.0" fill="#444444" font-size="12" text-anchor="middle">if  P = NP</text>
  <ellipse cx="576" cy="152" rx="150" ry="82" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="576.0" y="80.0" fill="#8a8a8a" font-size="12" text-anchor="middle">NP</text>
  <text x="576.0" y="146.0" fill="#4a90d9" font-size="12" text-anchor="middle">P  =  NP  =  NP-complete</text>
  <text x="576.0" y="172.0" fill="#8a8a8a" font-size="9.5" text-anchor="middle">everything collapses: one fast</text>
  <text x="576.0" y="185.0" fill="#8a8a8a" font-size="9.5" text-anchor="middle">algorithm would give them all</text>
  <text x="576.0" y="258.0" fill="#8a8a8a" font-size="9.5" text-anchor="middle">nobody believes this, and nobody can rule it out</text>
  <line x1="24.0" y1="292.0" x2="736.0" y2="292.0" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="24.0" y="316.0" fill="#444444" font-size="12" text-anchor="start">A ≤ₚ B  —  “B is at least as hard as A”</text>
  <rect x="40.0" y="346.0" width="140.0" height="44.0" rx="7" fill="none" stroke="#444444" stroke-width="1.4"/>
  <text x="110.0" y="368.0" fill="#444444" font-size="11.5" text-anchor="middle">instance x of A</text>
  <line x1="184.0" y1="368.0" x2="219.8" y2="368.0" stroke="#444444" stroke-width="1.4"/>
  <polygon points="224.0,368.0 219.6,370.3 219.6,365.7" fill="#444444"/>
  <rect x="228.0" y="346.0" width="150.0" height="44.0" rx="7" fill="none" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="303.0" y="364.0" fill="#4a90d9" font-size="11.5" text-anchor="middle">convert</text>
  <text x="303.0" y="379.0" fill="#8a8a8a" font-size="9.5" text-anchor="middle">f(x), polynomial time</text>
  <line x1="382.0" y1="368.0" x2="417.8" y2="368.0" stroke="#444444" stroke-width="1.4"/>
  <polygon points="422.0,368.0 417.6,370.3 417.6,365.7" fill="#444444"/>
  <rect x="426.0" y="346.0" width="150.0" height="44.0" rx="7" fill="none" stroke="#d1495b" stroke-width="1.4"/>
  <text x="501.0" y="368.0" fill="#d1495b" font-size="11.5" text-anchor="middle">any solver for B</text>
  <line x1="580.0" y1="368.0" x2="615.8" y2="368.0" stroke="#444444" stroke-width="1.4"/>
  <polygon points="620.0,368.0 615.6,370.3 615.6,365.7" fill="#444444"/>
  <rect x="624.0" y="346.0" width="100.0" height="44.0" rx="7" fill="none" stroke="#444444" stroke-width="1.4"/>
  <text x="674.0" y="368.0" fill="#444444" font-size="11.5" text-anchor="middle">yes / no</text>
  <text x="24.0" y="422.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">Read it left to right: a fast solver for B becomes a fast solver for A, so B cannot be easier than A.</text>
  <text x="24.0" y="438.0" fill="#d1495b" font-size="10.5" text-anchor="start">To prove a NEW problem hard, the known-hard problem goes on the LEFT. Reducing your problem to SAT proves nothing about its hardness.</text>
  <text x="24.0" y="462.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">Correctness needs both directions:  x ∈ A  ⇔  f(x) ∈ B.  Proving only one of them is the most common broken reduction.</text>
</svg>
