  <text x="380.0" y="290.0" fill="#4a90d9" font-size="11" text-anchor="middle">Answer 7 in the corner. Backtrack: 7 &#8800; 7? row 4 = row 3, so skip item 4; row 3 = row 2, skip item 3;</text>
