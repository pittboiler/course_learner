  <text x="20.0" y="20.0" fill="#8a8a8a" font-size="11.5" text-anchor="start" font-style="italic">Every comparison sort on 3 items is a binary tree of comparisons. It needs 3! = 6 leaves,</text>
  <text x="20.0" y="38.0" fill="#8a8a8a" font-size="11.5" text-anchor="start" font-style="italic">so its height &#8212; the worst-case number of comparisons &#8212; is at least &#8968;log&#8322;6&#8969; = 3.</text>
