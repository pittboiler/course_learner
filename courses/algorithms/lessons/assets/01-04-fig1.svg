  <text x="380.0" y="354.0" fill="#4a90d9" font-size="12" text-anchor="middle">A binary tree of height h has at most 2&#8319; leaves, so 2&#8367; &#8805; n! and h &#8805; log&#8322;(n!) = &#937;(n log n).</text>
  <text x="380.0" y="376.0" fill="#8a8a8a" font-size="11" text-anchor="middle">n=3: &#8968;log&#8322;6&#8969; = 3.   n=10: 22.   n=20: 62.</text>
  <text x="380.0" y="396.0" fill="#d1495b" font-size="11" text-anchor="middle">The bound is about the MODEL, not any one algorithm &#8212; it rules out all of them at once.</text>
