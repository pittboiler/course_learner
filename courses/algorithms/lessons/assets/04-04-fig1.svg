<svg viewBox="0 0 760 450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12.5">
  <text x="24.0" y="22.0" fill="#8a8a8a" font-size="12" text-anchor="start" font-style="italic">One run is almost certainly wrong.  Repetition is what makes it an algorithm.</text>
