  <text x="486.0" y="335.0" fill="#8a8a8a" font-size="9.5" text-anchor="middle">0</text>
  <text x="547.0" y="335.0" fill="#8a8a8a" font-size="9.5" text-anchor="middle">5k</text>
  <text x="608.0" y="335.0" fill="#8a8a8a" font-size="9.5" text-anchor="middle">10k</text>
  <text x="669.0" y="335.0" fill="#8a8a8a" font-size="9.5" text-anchor="middle">15k</text>
  <text x="730.0" y="335.0" fill="#8a8a8a" font-size="9.5" text-anchor="middle">20k</text>
  <text x="608.0" y="352.0" fill="#8a8a8a" font-size="10" text-anchor="middle">independent runs   (n = 50 vertices)</text>
  <text x="730.0" y="96.0" fill="#4a90d9" font-size="10.5" text-anchor="end">chance every run missed the min cut</text>
  <text x="508.9" y="112.5" fill="#d1495b" font-size="9.5" text-anchor="start">1,225 runs → 1/e</text>
  <text x="684.5" y="271.0" fill="#d1495b" font-size="9.5" text-anchor="end">16,925 runs → 1e-6</text>
  <text x="24.0" y="388.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">A single run finds the min cut with probability at least 2/(n(n−1)) = 1/1225.  That is a hopeless algorithm on its own.</text>
  <text x="24.0" y="404.0" fill="#8a8a8a" font-size="10.5" text-anchor="start">Independent repetition drives the failure probability down exponentially, and 17,000 runs of an O(n²) procedure is still polynomial.</text>
  <text x="24.0" y="428.0" fill="#4a90d9" font-size="11" text-anchor="start">That trade — a near-useless single run plus cheap amplification — is the whole idea of a Monte Carlo algorithm.</text>
</svg>
