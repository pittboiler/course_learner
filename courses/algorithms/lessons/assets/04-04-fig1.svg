  <text x="332.0" y="216.2" fill="#444444" font-size="11.5" text-anchor="middle">5</text>
  <text x="202.0" y="158.0" fill="#d1495b" font-size="10" text-anchor="middle">the min cut</text>
  <text x="202.0" y="68.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">Karger: contract a uniformly random edge</text>
  <text x="202.0" y="83.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">until two nodes remain.</text>
  <rect x="40.0" y="250.0" width="150.0" height="52.0" rx="7" fill="none" stroke="#4a90d9" stroke-width="1.3"/>
  <text x="115.0" y="270.0" fill="#4a90d9" font-size="11" text-anchor="middle">bridge survives</text>
  <text x="115.0" y="286.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">→ answers 1  ✓</text>
  <rect x="214.0" y="250.0" width="150.0" height="52.0" rx="7" fill="none" stroke="#d1495b" stroke-width="1.3"/>
  <text x="289.0" y="270.0" fill="#d1495b" font-size="11" text-anchor="middle">bridge contracted</text>
  <text x="289.0" y="286.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">→ answers 3  ✗</text>
  <text x="202.0" y="326.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">Nothing inside a single run detects the bad case —</text>
  <text x="202.0" y="341.0" fill="#8a8a8a" font-size="10.5" text-anchor="middle">which is why the algorithm keeps the smallest answer seen.</text>
