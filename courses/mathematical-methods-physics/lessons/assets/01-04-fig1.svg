<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">A point at (r, θ, φ). The volume element is a little box with edges dr, r dθ, r sinθ dφ.</text>

  <!-- ===== axes ===== -->
  <!-- z axis (up) -->
  <line x1="200" y1="270" x2="200" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="200,52 195,64 205,64" fill="#8a8a8a"/>
  <text x="188" y="48" fill="#8a8a8a">z</text>
  <!-- y axis (right) -->
  <line x1="200" y1="270" x2="472" y2="322" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="472,322 459,320 462,330" fill="#8a8a8a"/>
  <text x="478" y="328" fill="#8a8a8a">y</text>
  <!-- x axis (toward viewer, down-left) -->
  <line x1="200" y1="270" x2="88" y2="342" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="88,342 100,336 96,346" fill="#8a8a8a"/>
  <text x="70" y="352" fill="#8a8a8a">x</text>

  <!-- origin -->
  <circle cx="200" cy="270" r="2.5" fill="#8a8a8a"/>

  <!-- ===== radial line to P ===== -->
  <line x1="200" y1="270" x2="350" y2="130" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="258" y="188" fill="#4a90d9">r</text>
  <circle cx="350" cy="130" r="3" fill="#4a90d9"/>

  <!-- projection of P onto xy-plane -->
  <line x1="200" y1="270" x2="322" y2="232" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="322" y1="232" x2="350" y2="130" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- theta arc (between z axis and r) -->
  <path d="M 200 220 A 50 50 0 0 1 235 235" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="210" y="228" fill="#8a8a8a">θ</text>

  <!-- phi arc (between x axis and projection, in the plane) -->
  <path d="M 168 290 A 38 38 0 0 1 236 259" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="196" y="288" fill="#8a8a8a">φ</text>

  <!-- ===== volume element box at P ===== -->
  <!-- edge directions (small): u_r=(11.2,-11.4) u_theta=(3.2,15.7) u_phi=(15.7,3.2) ; P=(350,130) -->
  <!-- face (r,theta): 000,100,110,010 -->
  <polygon points="350,130 361.2,118.6 364.4,134.3 353.2,145.7" fill="#4a90d9" opacity="0.15"/>
  <!-- face (r,phi): 000,100,101,001 -->
  <polygon points="350,130 361.2,118.6 376.9,121.8 365.7,133.2" fill="#4a90d9" opacity="0.15"/>
  <!-- face (theta,phi) at a=1: 100,110,111,101 -->
  <polygon points="361.2,118.6 364.4,134.3 380.1,137.5 376.9,121.8" fill="#4a90d9" opacity="0.15"/>
  <!-- box edges -->
  <g stroke="#4a90d9" stroke-width="1.3" fill="none">
    <path d="M 350 130 L 361.2 118.6 L 364.4 134.3 L 353.2 145.7 Z"/>
    <path d="M 361.2 118.6 L 376.9 121.8 L 380.1 137.5 L 364.4 134.3"/>
    <path d="M 376.9 121.8 L 365.7 133.2 L 353.2 145.7"/>
    <path d="M 365.7 133.2 L 350 130"/>
  </g>

  <!-- ===== unit vectors from P ===== -->
  <!-- r-hat (radial out) -->
  <line x1="350" y1="130" x2="384" y2="95.5" stroke="#e0645c" stroke-width="2"/>
  <polygon points="384,95.5 373.5,99 379,105 " fill="#e0645c"/>
  <text x="388" y="92" fill="#e0645c">r&#770;</text>
  <!-- theta-hat (down, increasing theta) -->
  <line x1="350" y1="130" x2="358" y2="174" stroke="#e0645c" stroke-width="2"/>
  <polygon points="358,174 351.5,164 361,163" fill="#e0645c"/>
  <text x="362" y="184" fill="#e0645c">θ&#770;</text>
  <!-- phi-hat (right, increasing phi) -->
  <line x1="350" y1="130" x2="394" y2="139" stroke="#e0645c" stroke-width="2"/>
  <polygon points="394,139 383,135 383.5,145" fill="#e0645c"/>
  <text x="398" y="142" fill="#e0645c">φ&#770;</text>

  <!-- volume element formula -->
  <text x="150" y="384" fill="#8a8a8a" font-style="italic">dV = r&#178; sinθ dr dθ dφ</text>
</svg>
