<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Step-forced damped oscillator: a decaying transient (poles s = &#8722;&#947; &#177; i&#969;&#8341;) rides onto the steady state F&#8320;/&#969;&#8320;&#178; (pole s = 0).</text>

  <!-- time axis -->
  <line x1="60" y1="270" x2="600" y2="270" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="600,270 590,265 590,275" fill="#8a8a8a"/>
  <text x="604" y="275" fill="#8a8a8a">t</text>

  <!-- x axis -->
  <line x1="70" y1="290" x2="70" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,52 65,62 75,62" fill="#8a8a8a"/>
  <text x="46" y="60" fill="#8a8a8a">x(t)</text>
  <text x="56" y="286" fill="#8a8a8a">0</text>

  <!-- steady-state level x = F0/w0^2 = 1 (y=110) -->
  <line x1="70" y1="110" x2="590" y2="110" stroke="#e0645c" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="466" y="104" fill="#e0645c" font-style="italic">steady state  F&#8320;/&#969;&#8320;&#178;</text>

  <!-- the response curve x(t) = 1 - e^{-t}(cos2t + 0.5 sin2t) -->
  <path d="M 70 270 L 91.2 249.2 L 112.5 203.3 L 133.8 153.0 L 155.0 112.3 L 176.2 87.0 L 197.5 77.2 L 218.8 79.1 L 240.0 87.7 L 261.2 98.2 L 282.5 107.4 L 303.8 113.6 L 325.0 116.5 L 346.2 116.7 L 367.5 115.2 L 388.8 113.1 L 410.0 111.0 L 431.2 109.5 L 452.5 108.7 L 473.8 108.6 L 495.0 108.8 L 537.5 109.7 L 580.0 110.2"
        fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- overshoot marker -->
  <circle cx="197.5" cy="77.2" r="3.5" fill="#4a90d9"/>
  <text x="205" y="72" fill="#4a90d9">overshoot</text>

  <!-- transient bracket over the early oscillating region -->
  <line x1="80" y1="300" x2="300" y2="300" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="80" y1="296" x2="80" y2="304" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="300" y1="296" x2="300" y2="304" stroke="#8a8a8a" stroke-width="1"/>
  <text x="96" y="320" fill="#8a8a8a" font-style="italic">transient: decaying wobble &#8764; e</text>
  <text x="285" y="314" fill="#8a8a8a" font-style="italic" font-size="11">&#8722;&#947;t</text>

  <!-- settled region label -->
  <line x1="360" y1="300" x2="580" y2="300" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="360" y1="296" x2="360" y2="304" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="580" y1="296" x2="580" y2="304" stroke="#8a8a8a" stroke-width="1"/>
  <text x="418" y="320" fill="#8a8a8a" font-style="italic">settled: x &#8776; F&#8320;/&#969;&#8320;&#178;</text>
</svg>
