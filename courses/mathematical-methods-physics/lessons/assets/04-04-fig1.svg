<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="22" fill="#8a8a8a" font-style="italic">One unit kick rings the system (left); the full response is those rings summed, weighted by the source (right).</text>

  <!-- ===== LEFT: impulse response G(t-t') ===== -->
  <!-- tau axis -->
  <line x1="70" y1="150" x2="312" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="312,150 302,145 302,155" fill="#8a8a8a"/>
  <text x="315" y="155" fill="#8a8a8a">t</text>
  <!-- value axis -->
  <line x1="70" y1="185" x2="70" y2="72" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="70,72 65,82 75,82" fill="#8a8a8a"/>
  <text x="52" y="196" fill="#8a8a8a">t&#8242;</text>

  <!-- unit delta kick at t' -->
  <line x1="70" y1="150" x2="70" y2="96" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="70,90 65,102 75,102" fill="#e0645c"/>
  <text x="76" y="98" fill="#e0645c">&#948;(t&#8722;t&#8242;)</text>

  <!-- Green's function curve  G(tau)=(1/wd)e^{-g tau}sin(wd tau), g=0.5 wd=1 -->
  <path d="M 70.0 150.0 L 72.6 137.1 L 75.1 125.5 L 77.7 115.4 L 80.2 106.6 L 82.8 99.2 L 85.3 93.1 L 87.9 88.2 L 90.4 84.5 L 93.0 82.0 L 95.6 80.5 L 98.1 80.0 L 100.7 80.4 L 103.2 81.5 L 105.8 83.4 L 108.3 85.9 L 110.9 88.9 L 113.4 92.3 L 116.0 96.1 L 118.6 100.2 L 121.1 104.5 L 123.7 108.9 L 126.2 113.4 L 128.8 117.9 L 131.3 122.3 L 133.9 126.7 L 136.4 130.9 L 139.0 134.9 L 141.6 138.8 L 144.1 142.4 L 146.7 145.7 L 149.2 148.8 L 151.8 151.6 L 154.3 154.1 L 156.9 156.4 L 159.4 158.3 L 162.0 160.0 L 164.6 161.3 L 167.1 162.5 L 169.7 163.3 L 172.2 163.9 L 174.8 164.3 L 177.3 164.5 L 179.9 164.5 L 182.4 164.4 L 185.0 164.0 L 187.6 163.6 L 190.1 163.0 L 192.7 162.3 L 195.2 161.5 L 197.8 160.7 L 200.3 159.8 L 202.9 158.9 L 205.4 158.0 L 208.0 157.1 L 210.6 156.1 L 213.1 155.2 L 215.7 154.3 L 218.2 153.5 L 220.8 152.7 L 223.3 151.9 L 225.9 151.2 L 228.4 150.5 L 231.0 149.9 L 233.6 149.4 L 236.1 148.9 L 238.7 148.4 L 241.2 148.1 L 243.8 147.8 L 246.3 147.5 L 248.9 147.3 L 251.4 147.1 L 254.0 147.0 L 256.6 147.0 L 259.1 147.0 L 261.7 147.0 L 264.2 147.1 L 266.8 147.1 L 269.3 147.2 L 271.9 147.4 L 274.4 147.5 L 277.0 147.7 L 279.6 147.9 L 282.1 148.1 L 284.7 148.3 L 287.2 148.4 L 289.8 148.6 L 292.3 148.8 L 294.9 149.0 L 297.4 149.2 L 300.0 149.4"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="150" y="76" fill="#4a90d9">G(t&#8722;t&#8242;)</text>
  <text x="120" y="196" fill="#8a8a8a" font-style="italic">decays like e</text>
  <text x="196" y="190" fill="#8a8a8a" font-style="italic" font-size="11">&#8722;&#947;(t&#8722;t&#8242;)</text>

  <!-- divider -->
  <line x1="330" y1="60" x2="330" y2="245" stroke="#8a8a8a" stroke-width="0.75" stroke-dasharray="2 5"/>

  <!-- ===== RIGHT: superposition of weighted kicks ===== -->
  <line x1="360" y1="150" x2="602" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="602,150 592,145 592,155" fill="#8a8a8a"/>
  <text x="605" y="155" fill="#8a8a8a">t</text>

  <!-- weighted source kicks f(t') -->
  <line x1="370.5" y1="150" x2="370.5" y2="105" stroke="#e0645c" stroke-width="2" opacity="0.55"/>
  <polygon points="370.5,101 366,110 375,110" fill="#e0645c" opacity="0.55"/>
  <line x1="401.8" y1="150" x2="401.8" y2="118" stroke="#e0645c" stroke-width="2" opacity="0.55"/>
  <polygon points="401.8,114 397,123 406.6,123" fill="#e0645c" opacity="0.55"/>
  <line x1="433.2" y1="150" x2="433.2" y2="173" stroke="#e0645c" stroke-width="2" opacity="0.55"/>
  <polygon points="433.2,177 428.4,168 438,168" fill="#e0645c" opacity="0.55"/>
  <line x1="464.5" y1="150" x2="464.5" y2="109" stroke="#e0645c" stroke-width="2" opacity="0.55"/>
  <polygon points="464.5,105 460,114 469,114" fill="#e0645c" opacity="0.55"/>
  <text x="368" y="252" fill="#e0645c" font-style="italic">source kicks f(t&#8242;)&#8201;&#916;t&#8242;</text>

  <!-- summed response curve (blue, thick) -->
  <path d="M 360.0 150.0 L 361.6 150.0 L 363.3 150.0 L 364.9 150.0 L 366.6 150.0 L 368.2 150.0 L 369.9 150.0 L 371.5 145.1 L 373.1 137.9 L 374.8 131.3 L 376.4 125.4 L 378.1 120.1 L 379.7 115.4 L 381.4 111.4 L 383.0 107.9 L 384.6 105.0 L 386.3 102.7 L 387.9 100.8 L 389.6 99.5 L 391.2 98.7 L 392.9 98.3 L 394.5 98.3 L 396.1 98.7 L 397.8 99.5 L 399.4 100.5 L 401.1 101.9 L 402.7 100.5 L 404.4 97.3 L 406.0 94.7 L 407.6 92.7 L 409.3 91.3 L 410.9 90.4 L 412.6 90.0 L 414.2 90.1 L 415.9 90.6 L 417.5 91.6 L 419.1 92.9 L 420.8 94.5 L 422.4 96.4 L 424.1 98.6 L 425.7 101.0 L 427.4 103.5 L 429.0 106.2 L 430.6 109.1 L 432.3 112.0 L 433.9 116.8 L 435.6 123.4 L 437.2 129.8 L 438.9 135.8 L 440.5 141.5 L 442.1 146.9 L 443.8 151.8 L 445.4 156.3 L 447.1 160.5 L 448.7 164.3 L 450.4 167.7 L 452.0 170.6 L 453.6 173.3 L 455.3 175.5 L 456.9 177.4 L 458.6 178.9 L 460.2 180.1 L 461.9 181.0 L 463.5 181.6 L 465.1 179.4 L 466.8 172.8 L 468.4 166.6 L 470.1 160.7 L 471.7 155.1 L 473.4 150.0 L 475.0 145.2 L 476.6 140.9 L 478.3 136.9 L 479.9 133.3 L 481.6 130.1 L 483.2 127.4 L 484.9 124.9 L 486.5 122.9 L 488.1 121.2 L 489.8 119.9 L 491.4 118.8 L 493.1 118.1 L 494.7 117.7 L 496.4 117.5 L 498.0 117.6 L 499.6 118.0 L 501.3 118.5 L 502.9 119.3 L 504.6 120.2 L 506.2 121.2 L 507.9 122.4 L 509.5 123.7 L 511.1 125.1 L 512.8 126.6 L 514.4 128.2 L 516.1 129.8 L 517.7 131.4 L 519.4 133.0 L 521.0 134.7 L 522.6 136.3 L 524.3 137.9 L 525.9 139.5 L 527.6 141.0 L 529.2 142.5 L 530.9 143.9 L 532.5 145.3 L 534.1 146.6 L 535.8 147.8 L 537.4 148.9 L 539.1 150.0 L 540.7 151.0 L 542.4 151.9 L 544.0 152.7 L 545.6 153.5 L 547.3 154.1 L 548.9 154.7 L 550.6 155.2 L 552.2 155.6 L 553.9 156.0 L 555.5 156.3 L 557.1 156.5 L 558.8 156.6 L 560.4 156.7 L 562.1 156.7 L 563.7 156.7 L 565.4 156.7 L 567.0 156.5 L 568.6 156.4 L 570.3 156.2 L 571.9 156.0 L 573.6 155.7 L 575.2 155.5 L 576.9 155.2 L 578.5 154.9 L 580.1 154.5 L 581.8 154.2 L 583.4 153.9 L 585.1 153.5 L 586.7 153.2 L 588.4 152.8 L 590.0 152.5"
        fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="470" y="88" fill="#4a90d9">u(t) = &#8747; G(t&#8722;t&#8242;) f(t&#8242;) dt&#8242;</text>
</svg>
