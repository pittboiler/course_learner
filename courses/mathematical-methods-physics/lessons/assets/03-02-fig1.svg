<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="60" y="24" fill="#8a8a8a" font-style="italic">Legendre polynomials P₀…P₃ on [−1, 1]: ℓ zeros, and every one passes through P_ℓ(1) = 1.</text>

  <!-- ===== axes ===== -->
  <!-- x-axis (y = 0) -->
  <line x1="60" y1="180" x2="560" y2="180" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="560,180 550,175 550,185" fill="#8a8a8a"/>
  <text x="564" y="185" fill="#8a8a8a">x</text>
  <!-- y-axis (x = 0) -->
  <line x1="310" y1="318" x2="310" y2="42" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="310,42 305,52 315,52" fill="#8a8a8a"/>
  <text x="316" y="52" fill="#8a8a8a">y</text>

  <!-- x ticks -->
  <line x1="70" y1="176" x2="70" y2="184" stroke="#8a8a8a" stroke-width="1"/>
  <text x="60" y="200" fill="#8a8a8a">−1</text>
  <line x1="550" y1="176" x2="550" y2="184" stroke="#8a8a8a" stroke-width="1"/>
  <text x="545" y="200" fill="#8a8a8a">1</text>
  <text x="296" y="200" fill="#8a8a8a">0</text>
  <!-- y ticks -->
  <line x1="306" y1="60" x2="314" y2="60" stroke="#8a8a8a" stroke-width="1"/>
  <text x="290" y="64" fill="#8a8a8a">1</text>
  <line x1="306" y1="300" x2="314" y2="300" stroke="#8a8a8a" stroke-width="1"/>
  <text x="286" y="304" fill="#8a8a8a">−1</text>

  <!-- ===== curves (blue for even ℓ, coral for odd ℓ) ===== -->
  <!-- P0 = 1 -->
  <line x1="70" y1="60" x2="550" y2="60" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="86" y="53" fill="#4a90d9">P₀</text>

  <!-- P1 = x -->
  <path d="M 70.0 300.0 L 130.0 270.0 L 190.0 240.0 L 250.0 210.0 L 310.0 180.0 L 370.0 150.0 L 430.0 120.0 L 490.0 90.0 L 550.0 60.0"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <text x="437" y="112" fill="#e0645c">P₁</text>

  <!-- P2 = (3x^2 - 1)/2 -->
  <path d="M 70.0 60.0 L 82.0 77.5 L 94.0 94.2 L 106.0 110.0 L 118.0 124.8 L 130.0 138.8 L 142.0 151.8 L 154.0 164.0 L 166.0 175.2 L 178.0 185.5 L 190.0 195.0 L 202.0 203.6 L 214.0 211.2 L 226.0 217.9 L 238.0 223.8 L 250.0 228.8 L 262.0 232.8 L 274.0 235.9 L 286.0 238.2 L 298.0 239.6 L 310.0 240.0 L 322.0 239.6 L 334.0 238.2 L 346.0 235.9 L 358.0 232.8 L 370.0 228.8 L 382.0 223.8 L 394.0 217.9 L 406.0 211.2 L 418.0 203.5 L 430.0 195.0 L 442.0 185.5 L 454.0 175.2 L 466.0 163.9 L 478.0 151.8 L 490.0 138.8 L 502.0 124.8 L 514.0 109.9 L 526.0 94.2 L 538.0 77.5 L 550.0 60.0"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="300" y="258" fill="#4a90d9">P₂</text>

  <!-- P3 = (5x^3 - 3x)/2 -->
  <path d="M 70.0 300.0 L 82.0 266.2 L 94.0 236.7 L 106.0 211.2 L 118.0 189.6 L 130.0 171.6 L 142.0 156.9 L 154.0 145.4 L 166.0 136.8 L 178.0 130.9 L 190.0 127.5 L 202.0 126.3 L 214.0 127.2 L 226.0 129.9 L 238.0 134.1 L 250.0 139.7 L 262.0 146.4 L 274.0 154.0 L 286.0 162.3 L 298.0 171.0 L 310.0 180.0 L 322.0 189.0 L 334.0 197.7 L 346.0 206.0 L 358.0 213.6 L 370.0 220.3 L 382.0 225.9 L 394.0 230.1 L 406.0 232.8 L 418.0 233.7 L 430.0 232.5 L 442.0 229.1 L 454.0 223.2 L 466.0 214.6 L 478.0 203.1 L 490.0 188.4 L 502.0 170.4 L 514.0 148.8 L 526.0 123.3 L 538.0 93.8 L 550.0 60.0"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>
  <text x="176" y="116" fill="#e0645c">P₃</text>
</svg>
