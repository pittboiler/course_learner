<svg viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Oscillator eigenfunctions ψₙ = Nₙ Hₙ(x) e^(−x²/2): stacked by energy, each with exactly n nodes (0, 1, 2).</text>

  <!-- shared x-axis at bottom -->
  <line x1="50" y1="305" x2="570" y2="305" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="570,305 560,300 560,310" fill="#8a8a8a"/>
  <text x="562" y="322" fill="#8a8a8a">x</text>
  <line x1="310" y1="305" x2="310" y2="311" stroke="#8a8a8a" stroke-width="1"/>
  <text x="306" y="324" fill="#8a8a8a">0</text>

  <!-- ===== n=2 (top) ===== -->
  <line x1="50" y1="90" x2="560" y2="90" stroke="#8a8a8a" stroke-width="0.75" stroke-dasharray="2 4"/>
  <text x="20" y="94" fill="#8a8a8a">ψ₂</text>
  <path d="M 60.0 88.8 L 77.9 87.6 L 95.7 85.5 L 113.6 82.3 L 131.4 77.9 L 149.3 72.6 L 167.1 67.4 L 185.0 63.5 L 202.9 62.8 L 220.7 66.7 L 238.6 75.5 L 256.4 87.7 L 274.3 100.5 L 292.1 110.3 L 310.0 113.9 L 327.9 110.3 L 345.7 100.5 L 363.6 87.7 L 381.4 75.5 L 399.3 66.7 L 417.1 62.8 L 435.0 63.5 L 452.9 67.4 L 470.7 72.6 L 488.6 77.9 L 506.4 82.3 L 524.3 85.5 L 542.1 87.6 L 560.0 88.8"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- two nodes at x=±0.707 -->
  <circle cx="259.5" cy="90" r="3" fill="#e0645c"/>
  <circle cx="360.5" cy="90" r="3" fill="#e0645c"/>

  <!-- ===== n=1 (middle) ===== -->
  <line x1="50" y1="190" x2="560" y2="190" stroke="#8a8a8a" stroke-width="0.75" stroke-dasharray="2 4"/>
  <text x="20" y="194" fill="#8a8a8a">ψ₁</text>
  <path d="M 60.0 190.4 L 77.9 190.8 L 95.7 191.6 L 113.6 193.0 L 131.4 195.3 L 149.3 198.6 L 167.1 202.9 L 185.0 208.1 L 202.9 213.3 L 220.7 217.4 L 238.6 219.0 L 256.4 217.1 L 274.3 211.1 L 292.1 201.6 L 310.0 190.0 L 327.9 178.4 L 345.7 168.9 L 363.6 162.9 L 381.4 161.0 L 399.3 162.6 L 417.1 166.7 L 435.0 171.9 L 452.9 177.1 L 470.7 181.4 L 488.6 184.7 L 506.4 187.0 L 524.3 188.4 L 542.1 189.2 L 560.0 189.6"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <!-- one node at x=0 -->
  <circle cx="310.0" cy="190" r="3" fill="#e0645c"/>

  <!-- ===== n=0 (bottom) ===== -->
  <line x1="50" y1="280" x2="560" y2="280" stroke="#8a8a8a" stroke-width="0.75" stroke-dasharray="2 4"/>
  <text x="20" y="284" fill="#8a8a8a">ψ₀</text>
  <path d="M 60.0 279.9 L 77.9 279.8 L 95.7 279.6 L 113.6 279.2 L 131.4 278.5 L 149.3 277.3 L 167.1 275.4 L 185.0 272.7 L 202.9 269.0 L 220.7 264.5 L 238.6 259.5 L 256.4 254.5 L 274.3 250.2 L 292.1 247.2 L 310.0 246.2 L 327.9 247.2 L 345.7 250.2 L 363.6 254.5 L 381.4 259.5 L 399.3 264.5 L 417.1 269.0 L 435.0 272.7 L 452.9 275.4 L 470.7 277.3 L 488.6 278.5 L 506.4 279.2 L 524.3 279.6 L 542.1 279.8 L 560.0 279.9"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- node-count legend -->
  <text x="470" y="128" fill="#e0645c" font-style="italic">2 nodes</text>
  <text x="470" y="176" fill="#e0645c" font-style="italic">1 node</text>
  <text x="470" y="266" fill="#8a8a8a" font-style="italic">0 nodes</text>
</svg>
