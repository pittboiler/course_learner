<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">Close the real integral with a big upper-half-plane semicircle; if the arc dies, only the enclosed pole survives.</text>

  <!-- enclosed half-disk (soft shading) -->
  <path d="M 110 240 L 510 240 A 200 200 0 0 0 110 240 Z" fill="#4a90d9" opacity="0.15"/>

  <!-- axes -->
  <line x1="40" y1="240" x2="588" y2="240" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="588,240 578,235 578,245" fill="#8a8a8a"/>
  <text x="592" y="245" fill="#8a8a8a">Re</text>
  <line x1="310" y1="300" x2="310" y2="34" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="310,34 305,44 315,44" fill="#8a8a8a"/>
  <text x="318" y="44" fill="#8a8a8a">Im</text>
  <text x="296" y="258" fill="#8a8a8a">O</text>

  <!-- contour: real segment [-R, R] -->
  <line x1="110" y1="240" x2="510" y2="240" stroke="#4a90d9" stroke-width="3"/>
  <!-- rightward arrow on real axis -->
  <polygon points="330,240 318,234 318,246" fill="#4a90d9"/>

  <!-- contour: upper semicircular arc -->
  <path d="M 510 240 A 200 200 0 0 0 110 240" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <!-- leftward arrow at top of arc -->
  <polygon points="298,40 310,34 310,46" fill="#4a90d9"/>

  <!-- endpoint labels -->
  <text x="98" y="260" fill="#4a90d9">&#8722;R</text>
  <text x="502" y="260" fill="#4a90d9">+R</text>

  <!-- arc annotation -->
  <text x="150" y="96" fill="#8a8a8a" font-style="italic">arc &#8594; 0 by Jordan's lemma</text>

  <!-- enclosed pole at z = ia -->
  <circle cx="310" cy="140" r="5" fill="#e0645c"/>
  <text x="322" y="145" fill="#e0645c">z = ia  (enclosed pole)</text>
</svg>
