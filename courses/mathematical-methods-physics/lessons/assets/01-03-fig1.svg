<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="24" fill="#8a8a8a" font-style="italic">Left: outward flux = total divergence inside (divergence theorem). Right: rim circulation = curl through the cap (Stokes).</text>

  <!-- ================= LEFT: divergence theorem ================= -->
  <!-- closed surface enclosing a volume -->
  <ellipse cx="160" cy="185" rx="90" ry="70" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="3"/>

  <!-- interior divergence dots (sources) -->
  <circle cx="160" cy="185" r="3" fill="#e0645c"/>
  <circle cx="128" cy="160" r="3" fill="#e0645c"/>
  <circle cx="192" cy="162" r="3" fill="#e0645c"/>
  <circle cx="138" cy="212" r="3" fill="#e0645c"/>
  <circle cx="196" cy="210" r="3" fill="#e0645c"/>

  <!-- outward flux arrows (radial) -->
  <!-- top -->
  <line x1="160" y1="115" x2="160" y2="85" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="160,85 164,95 156,95" fill="#e0645c"/>
  <!-- right -->
  <line x1="250" y1="185" x2="285" y2="185" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="285,185 275,181 275,189" fill="#e0645c"/>
  <!-- left -->
  <line x1="70" y1="185" x2="35" y2="185" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="35,185 45,181 45,189" fill="#e0645c"/>
  <!-- bottom -->
  <line x1="160" y1="255" x2="160" y2="285" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="160,285 156,275 164,275" fill="#e0645c"/>
  <!-- top-right -->
  <line x1="223.6" y1="135.5" x2="250" y2="110" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="250,110 244.9,119.5 239.8,113.3" fill="#e0645c"/>
  <!-- bottom-right -->
  <line x1="223.6" y1="234.5" x2="250" y2="262" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="250,262 239.8,258.5 245,252.4" fill="#e0645c"/>
  <!-- bottom-left -->
  <line x1="96.4" y1="234.5" x2="70" y2="262" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="70,262 80.2,258.5 75,252.4" fill="#e0645c"/>
  <!-- top-left -->
  <line x1="96.4" y1="135.5" x2="70" y2="110" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="70,110 80.2,113.3 75.1,119.5" fill="#e0645c"/>

  <!-- labels -->
  <text x="248" y="150" fill="#e0645c">F·dA</text>
  <text x="168" y="188" fill="#8a8a8a" font-size="12">∇·F</text>
  <text x="205" y="270" fill="#4a90d9" font-size="13">S = ∂V</text>
  <text x="118" y="322" fill="#8a8a8a" font-style="italic">Divergence theorem</text>

  <!-- ================= RIGHT: Stokes' theorem ================= -->
  <!-- open surface (cap) filled -->
  <path d="M 410 178 Q 500 70 590 178 A 90 34 0 0 1 410 178 Z" fill="#4a90d9" fill-opacity="0.15" stroke="none"/>
  <!-- dome top edge -->
  <path d="M 410 178 Q 500 70 590 178" fill="none" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- rim / boundary loop C -->
  <ellipse cx="500" cy="178" rx="90" ry="34" fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- circulation arrowheads along the rim (consistent orientation) -->
  <!-- right side, tangent downward -->
  <polygon points="590,178 585,169 595,169" fill="#e0645c"/>
  <!-- front bottom, tangent leftward -->
  <polygon points="500,212 509,207 509,217" fill="#e0645c"/>
  <!-- left side, tangent upward -->
  <polygon points="410,178 405,187 415,187" fill="#e0645c"/>

  <!-- surface normal (dA) -->
  <line x1="500" y1="150" x2="500" y2="96" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="500,96 496,106 504,106" fill="#8a8a8a"/>
  <text x="506" y="104" fill="#8a8a8a" font-size="12">dA</text>

  <!-- curl indicator on the surface -->
  <path d="M 476 128 A 16 16 0 1 1 474 136" fill="none" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="474,136 470,127 480,129" fill="#e0645c"/>
  <text x="486" y="126" fill="#e0645c" font-size="13">∇×F</text>

  <!-- labels -->
  <text x="596" y="182" fill="#e0645c">C</text>
  <text x="518" y="212" fill="#e0645c" font-size="13">F·dl</text>
  <text x="452" y="322" fill="#8a8a8a" font-style="italic">Stokes' theorem</text>
</svg>
