<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="22" fill="#8a8a8a" font-style="italic">A square wave (blue) rebuilt from sines: one harmonic (grey), then three (coral) closing in.</text>

  <!-- axes -->
  <line x1="60" y1="160" x2="592" y2="160" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="592,160 582,155 582,165" fill="#8a8a8a"/>
  <text x="596" y="165" fill="#8a8a8a">x</text>
  <line x1="320" y1="270" x2="320" y2="52" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="320,52 315,62 325,62" fill="#8a8a8a"/>
  <text x="326" y="62" fill="#8a8a8a">f</text>
  <text x="300" y="180" fill="#8a8a8a">0</text>
  <text x="52" y="180" fill="#8a8a8a" text-anchor="end">&#8722;&#960;</text>
  <text x="588" y="180" fill="#8a8a8a">&#960;</text>
  <text x="300" y="94" fill="#8a8a8a" text-anchor="end">+1</text>
  <text x="300" y="234" fill="#8a8a8a" text-anchor="end">&#8722;1</text>

  <!-- target square wave (period 2pi, amplitude 1) -->
  <path d="M 60 230 L 320 230 L 320 90 L 580 90" fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- S1: single harmonic (4/pi) sin x -->
  <path d="M 60.0 160.0 L 80.0 181.3 L 100.0 201.4 L 120.0 219.1 L 140.0 233.3 L 160.0 243.3 L 180.0 248.5 L 190.0 249.1 L 200.0 248.5 L 220.0 243.3 L 240.0 233.3 L 260.0 219.1 L 280.0 201.4 L 300.0 181.3 L 320.0 160.0 L 340.0 138.7 L 360.0 118.6 L 380.0 100.9 L 400.0 86.7 L 420.0 76.7 L 440.0 71.5 L 450.0 70.9 L 460.0 71.5 L 480.0 76.7 L 500.0 86.7 L 520.0 100.9 L 540.0 118.6 L 560.0 138.7 L 580.0 160.0"
        fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- S5: three harmonics (4/pi)[sin x + sin3x/3 + sin5x/5] -->
  <path d="M 60.0 160.0 L 66.9 182.1 L 73.9 202.4 L 80.8 219.5 L 87.7 232.1 L 94.7 239.9 L 101.6 243.1 L 108.5 242.2 L 115.5 238.5 L 122.4 233.4 L 129.3 228.3 L 136.3 224.2 L 143.2 222.0 L 150.1 222.0 L 157.1 224.0 L 164.0 227.3 L 170.9 231.1 L 177.9 234.5 L 184.8 236.7 L 190.0 237.2 L 195.2 236.7 L 202.1 234.5 L 209.1 231.1 L 216.0 227.3 L 222.9 224.0 L 229.9 222.0 L 236.8 222.0 L 243.7 224.2 L 250.7 228.3 L 257.6 233.4 L 264.5 238.5 L 271.5 242.2 L 278.4 243.1 L 285.3 239.9 L 292.3 232.1 L 299.2 219.5 L 306.1 202.4 L 313.1 182.1 L 320.0 160.0 L 326.9 137.9 L 333.9 117.6 L 340.8 100.5 L 347.7 87.9 L 354.7 80.1 L 361.6 76.9 L 368.5 77.8 L 375.5 81.5 L 382.4 86.6 L 389.3 91.7 L 396.3 95.8 L 403.2 98.0 L 410.1 98.0 L 417.1 96.0 L 424.0 92.7 L 430.9 88.9 L 437.9 85.5 L 444.8 83.3 L 451.7 82.8 L 458.7 84.2 L 465.6 87.1 L 472.5 90.8 L 479.5 94.5 L 486.4 97.2 L 493.3 98.3 L 500.3 97.2 L 507.2 94.0 L 514.1 89.2 L 521.1 83.9 L 528.0 79.4 L 534.9 76.9 L 541.9 77.9 L 548.8 83.4 L 555.7 93.6 L 562.7 108.6 L 569.6 127.4 L 576.5 148.8 L 580.0 160.0"
        fill="none" stroke="#e0645c" stroke-width="2.5"/>
</svg>
