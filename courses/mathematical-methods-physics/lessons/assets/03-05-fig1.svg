<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="22" fill="#8a8a8a" font-style="italic">One idea in two guises: a symmetric matrix has orthogonal eigenvectors; a self-adjoint (Sturm–Liouville) operator has orthogonal eigenfunctions.</text>

  <!-- ===== left: three orthogonal eigenfunctions on [a,b] ===== -->
  <text x="70" y="52" fill="#8a8a8a" font-style="italic">eigenfunctions y_n on [a, b]</text>

  <!-- baselines and endpoints -->
  <line x1="70" y1="95"  x2="320" y2="95"  stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="185" x2="320" y2="185" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="70" y1="275" x2="320" y2="275" stroke="#8a8a8a" stroke-width="1"/>
  <text x="55" y="99"  fill="#8a8a8a">a</text>
  <text x="55" y="189" fill="#8a8a8a">a</text>
  <text x="55" y="279" fill="#8a8a8a">a</text>
  <text x="326" y="99"  fill="#8a8a8a">b</text>
  <text x="326" y="189" fill="#8a8a8a">b</text>
  <text x="326" y="279" fill="#8a8a8a">b</text>

  <!-- mode 1 -->
  <path d="M 70.0 95.0 L 75.2 92.9 L 80.4 90.8 L 85.6 88.8 L 90.8 86.7 L 96.0 84.7 L 101.2 82.8 L 106.5 80.8 L 111.7 79.0 L 116.9 77.2 L 122.1 75.5 L 127.3 73.9 L 132.5 72.4 L 137.7 70.9 L 142.9 69.6 L 148.1 68.4 L 153.3 67.3 L 158.5 66.3 L 163.8 65.4 L 169.0 64.7 L 174.2 64.1 L 179.4 63.6 L 184.6 63.3 L 189.8 63.1 L 195.0 63.0 L 200.2 63.1 L 205.4 63.3 L 210.6 63.6 L 215.8 64.1 L 221.0 64.7 L 226.2 65.4 L 231.5 66.3 L 236.7 67.3 L 241.9 68.4 L 247.1 69.6 L 252.3 70.9 L 257.5 72.4 L 262.7 73.9 L 267.9 75.5 L 273.1 77.2 L 278.3 79.0 L 283.5 80.8 L 288.8 82.8 L 294.0 84.7 L 299.2 86.7 L 304.4 88.8 L 309.6 90.8 L 314.8 92.9 L 320.0 95.0"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="30" y="80" fill="#4a90d9">y_1</text>

  <!-- mode 2 -->
  <path d="M 70.0 185.0 L 75.2 180.8 L 80.4 176.7 L 85.6 172.8 L 90.8 169.0 L 96.0 165.5 L 101.2 162.4 L 106.5 159.6 L 111.7 157.3 L 116.9 155.4 L 122.1 154.1 L 127.3 153.3 L 132.5 153.0 L 137.7 153.3 L 142.9 154.1 L 148.1 155.4 L 153.3 157.3 L 158.5 159.6 L 163.8 162.4 L 169.0 165.5 L 174.2 169.0 L 179.4 172.8 L 184.6 176.7 L 189.8 180.8 L 195.0 185.0 L 200.2 189.2 L 205.4 193.3 L 210.6 197.2 L 215.8 201.0 L 221.0 204.5 L 226.2 207.6 L 231.5 210.4 L 236.7 212.7 L 241.9 214.6 L 247.1 215.9 L 252.3 216.7 L 257.5 217.0 L 262.7 216.7 L 267.9 215.9 L 273.1 214.6 L 278.3 212.7 L 283.5 210.4 L 288.8 207.6 L 294.0 204.5 L 299.2 201.0 L 304.4 197.2 L 309.6 193.3 L 314.8 189.2 L 320.0 185.0"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="30" y="170" fill="#4a90d9">y_2</text>

  <!-- mode 3 -->
  <path d="M 70.0 275.0 L 75.2 268.8 L 80.4 262.8 L 85.6 257.2 L 90.8 252.4 L 96.0 248.4 L 101.2 245.4 L 106.5 243.6 L 111.7 243.0 L 116.9 243.6 L 122.1 245.4 L 127.3 248.4 L 132.5 252.4 L 137.7 257.2 L 142.9 262.8 L 148.1 268.8 L 153.3 275.0 L 158.5 281.2 L 163.8 287.2 L 169.0 292.8 L 174.2 297.6 L 179.4 301.6 L 184.6 304.6 L 189.8 306.4 L 195.0 307.0 L 200.2 306.4 L 205.4 304.6 L 210.6 301.6 L 215.8 297.6 L 221.0 292.8 L 226.2 287.2 L 231.5 281.2 L 236.7 275.0 L 241.9 268.8 L 247.1 262.8 L 252.3 257.2 L 257.5 252.4 L 262.7 248.4 L 267.9 245.4 L 273.1 243.6 L 278.3 243.0 L 283.5 243.6 L 288.8 245.4 L 294.0 248.4 L 299.2 252.4 L 304.4 257.2 L 309.6 262.8 L 314.8 268.8 L 320.0 275.0"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="30" y="260" fill="#4a90d9">y_3</text>

  <!-- weighted-orthogonality note -->
  <text x="70" y="335" fill="#e0645c" font-style="italic">&#8747; y_m y_n w dx = 0   (m &#8800; n)</text>

  <!-- divider -->
  <line x1="380" y1="60" x2="380" y2="320" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- ===== right: projection / coefficient extraction ===== -->
  <text x="410" y="52" fill="#8a8a8a" font-style="italic">expand f, one coefficient at a time</text>

  <!-- f as a stack of components -->
  <text x="410" y="95" fill="#8a8a8a">f =</text>
  <rect x="450" y="80" width="34" height="22" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="455" y="96" fill="#4a90d9">c_1</text>
  <text x="490" y="96" fill="#8a8a8a">y_1</text>
  <text x="516" y="96" fill="#8a8a8a">+</text>
  <rect x="530" y="80" width="34" height="22" fill="#4a90d9" opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="535" y="96" fill="#4a90d9">c_2</text>
  <text x="570" y="96" fill="#8a8a8a">y_2</text>
  <text x="596" y="96" fill="#8a8a8a">+ &#8230;</text>

  <!-- projection arrow -->
  <line x1="470" y1="120" x2="470" y2="152" stroke="#e0645c" stroke-width="1.5"/>
  <polygon points="470,152 466,143 474,143" fill="#e0645c"/>
  <text x="480" y="142" fill="#e0645c" font-style="italic">project onto y_n</text>

  <!-- the coefficient formula -->
  <text x="410" y="180" fill="#e0645c">c_n =</text>
  <line x1="460" y1="172" x2="600" y2="172" stroke="#e0645c" stroke-width="1.5"/>
  <text x="470" y="166" fill="#8a8a8a">&#8747; f y_n w dx</text>
  <text x="470" y="192" fill="#8a8a8a">&#8747; y_n&#178; w dx</text>

  <!-- analogy to finite-dim -->
  <text x="410" y="240" fill="#8a8a8a" font-style="italic">same move in a finite basis:</text>
  <text x="410" y="266" fill="#4a90d9">v = &#931; c_i e_i</text>
  <text x="410" y="292" fill="#e0645c">c_i = (e_i &#183; v) / (e_i &#183; e_i)</text>
  <text x="410" y="316" fill="#8a8a8a" font-style="italic">weight w &#8596; the inner product</text>
</svg>
