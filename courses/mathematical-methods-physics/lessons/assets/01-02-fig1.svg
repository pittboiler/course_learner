<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ah-grey" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8a8a8a"/>
    </marker>
    <marker id="ah-coral" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e0645c"/>
    </marker>
    <marker id="ah-blue" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4a90d9"/>
    </marker>
  </defs>

  <!-- caption -->
  <text x="24" y="22" fill="#8a8a8a" font-style="italic">Left: work = &#8747;F&#183;d&#108; sums F along the tangent. Right: flux = &#8748;F&#183;dA counts F through the oriented patch, dA = n&#770; dA.</text>

  <!-- ============ LEFT: line integral / work ============ -->
  <!-- grey background field arrows -->
  <g stroke="#8a8a8a" stroke-width="1.2">
    <line x1="55" y1="130" x2="68" y2="117" marker-end="url(#ah-grey)"/>
    <line x1="110" y1="130" x2="123" y2="117" marker-end="url(#ah-grey)"/>
    <line x1="165" y1="130" x2="178" y2="117" marker-end="url(#ah-grey)"/>
    <line x1="220" y1="130" x2="233" y2="117" marker-end="url(#ah-grey)"/>
    <line x1="55" y1="185" x2="68" y2="172" marker-end="url(#ah-grey)"/>
    <line x1="110" y1="185" x2="123" y2="172" marker-end="url(#ah-grey)"/>
    <line x1="165" y1="185" x2="178" y2="172" marker-end="url(#ah-grey)"/>
    <line x1="220" y1="185" x2="233" y2="172" marker-end="url(#ah-grey)"/>
    <line x1="55" y1="240" x2="68" y2="227" marker-end="url(#ah-grey)"/>
    <line x1="110" y1="240" x2="123" y2="227" marker-end="url(#ah-grey)"/>
    <line x1="165" y1="240" x2="178" y2="227" marker-end="url(#ah-grey)"/>
    <line x1="220" y1="240" x2="233" y2="227" marker-end="url(#ah-grey)"/>
  </g>

  <!-- the curve C (blue) -->
  <path d="M 55 250 C 95 145 190 235 250 100" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <!-- endpoints -->
  <circle cx="55" cy="250" r="3.5" fill="#4a90d9"/>
  <text x="40" y="262" fill="#4a90d9">A</text>
  <circle cx="250" cy="100" r="3.5" fill="#4a90d9"/>
  <text x="256" y="98" fill="#4a90d9">B</text>
  <text x="86" y="205" fill="#4a90d9" font-style="italic">C</text>

  <!-- point P on curve, with dl (tangent) and F -->
  <circle cx="152" cy="181" r="3" fill="#e0645c"/>
  <!-- tangent element dl, along the curve toward B -->
  <line x1="152" y1="181" x2="192" y2="171" stroke="#e0645c" stroke-width="2.2" marker-end="url(#ah-coral)"/>
  <text x="196" y="170" fill="#e0645c">d&#108;</text>
  <!-- local field vector F at P -->
  <line x1="152" y1="181" x2="180" y2="150" stroke="#e0645c" stroke-width="2.2" marker-end="url(#ah-coral)"/>
  <text x="150" y="145" fill="#e0645c">F</text>

  <!-- ============ RIGHT: surface integral / flux ============ -->
  <!-- oriented surface patch (parallelogram) -->
  <polygon points="385,215 505,195 535,125 415,145" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="430" y="188" fill="#8a8a8a" font-style="italic">dA</text>

  <!-- outward normal n-hat from patch center -->
  <line x1="460" y1="170" x2="497" y2="123" stroke="#e0645c" stroke-width="2.2" marker-end="url(#ah-coral)"/>
  <text x="500" y="120" fill="#e0645c">n&#770;</text>

  <!-- field F piercing the patch (blue) -->
  <line x1="392" y1="188" x2="540" y2="150" stroke="#4a90d9" stroke-width="2.2" marker-end="url(#ah-blue)"/>
  <text x="544" y="150" fill="#4a90d9">F</text>
</svg>
