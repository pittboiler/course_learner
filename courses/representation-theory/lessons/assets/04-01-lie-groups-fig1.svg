<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>

  <!-- ===== Panel 1: U(1) unit circle ===== -->
  <text x="130" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">U(1) = SO(2): the circle</text>

  <!-- axes -->
  <line x1="40" y1="165" x2="220" y2="165" stroke="#bbbbbb" stroke-width="1"/>
  <line x1="130" y1="75" x2="130" y2="255" stroke="#bbbbbb" stroke-width="1"/>

  <!-- circle -->
  <circle cx="130" cy="165" r="75" fill="none" stroke="#1a56b0" stroke-width="2.5"/>

  <!-- identity element -->
  <circle cx="205" cy="165" r="4" fill="#111111"/>
  <text x="213" y="160" font-size="12" fill="#111111">1 = identity</text>

  <!-- moving point e^{i theta} -->
  <line x1="130" y1="165" x2="183" y2="112" stroke="#c0392b" stroke-width="2"/>
  <circle cx="183" cy="112" r="4.5" fill="#c0392b"/>
  <text x="188" y="106" font-size="12" fill="#c0392b">e^{iθ}</text>

  <!-- angle arc -->
  <path d="M 160 165 A 30 30 0 0 0 151 144" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="163" y="152" font-size="11" fill="#c0392b">θ</text>

  <!-- one-parameter subgroup arrow along circle through identity -->
  <path d="M 205 165 A 75 75 0 0 0 190 122" fill="none" stroke="#e67e22" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="150" y="250" text-anchor="middle" font-size="11" fill="#e67e22">flow g(t)=e^{it} through 1</text>

  <!-- ===== Panel 2: SU(2) = S^3 (schematic) ===== -->
  <text x="390" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">SU(2) ≅ S³</text>

  <!-- outer sphere -->
  <circle cx="390" cy="165" r="80" fill="none" stroke="#117a5b" stroke-width="2.5"/>
  <!-- latitude/longitude ellipses to suggest a 3-sphere -->
  <ellipse cx="390" cy="165" rx="80" ry="28" fill="none" stroke="#117a5b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <ellipse cx="390" cy="165" rx="28" ry="80" fill="none" stroke="#117a5b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <ellipse cx="390" cy="165" rx="55" ry="80" fill="none" stroke="#117a5b" stroke-width="1" stroke-dasharray="2 3"/>

  <circle cx="390" cy="85" r="4" fill="#111111"/>
  <text x="398" y="82" font-size="12" fill="#111111">I</text>
  <text x="390" y="278" text-anchor="middle" font-size="11" fill="#117a5b">|a|²+|b|² = 1  (3 params)</text>

  <!-- ===== Panel 3: SO(3) rotation about an axis ===== -->
  <text x="640" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">SO(3): axis rotation</text>

  <!-- axis -->
  <line x1="640" y1="90" x2="640" y2="250" stroke="#111111" stroke-width="2"/>
  <polygon points="640,84 635,96 645,96" fill="#111111"/>
  <text x="648" y="92" font-size="12" fill="#111111">axis n̂</text>

  <!-- rotating disk -->
  <ellipse cx="640" cy="170" rx="70" ry="24" fill="none" stroke="#7d3c98" stroke-width="2"/>
  <!-- rotation arrows -->
  <path d="M 705 165 A 70 24 0 0 1 640 194" fill="none" stroke="#7d3c98" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="700" y="205" font-size="11" fill="#7d3c98">by angle t</text>

  <!-- vector being rotated -->
  <line x1="640" y1="170" x2="705" y2="158" stroke="#c0392b" stroke-width="2"/>
  <circle cx="705" cy="158" r="3.5" fill="#c0392b"/>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#e67e22"/>
    </marker>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#7d3c98"/>
    </marker>
  </defs>
</svg>
