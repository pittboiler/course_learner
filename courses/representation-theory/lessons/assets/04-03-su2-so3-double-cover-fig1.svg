<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#ffffff"/>

  <!-- =========================================================== -->
  <!-- Panel 1: the 2:1 cover  SU(2)=S^3  ->  SO(3)=RP^3           -->
  <!-- =========================================================== -->
  <text x="200" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">The 2:1 cover  SU(2) → SO(3)</text>

  <!-- upstairs: SU(2) = S^3 -->
  <circle cx="200" cy="95" r="62" fill="none" stroke="#117a5b" stroke-width="2.5"/>
  <ellipse cx="200" cy="95" rx="62" ry="22" fill="none" stroke="#117a5b" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="200" y="46" text-anchor="middle" font-size="12" fill="#117a5b">SU(2) ≅ S³  (simply connected)</text>

  <!-- antipodal preimages +U and -U -->
  <circle cx="200" cy="45" r="4.5" fill="#c0392b"/>
  <text x="210" y="42" font-size="12" fill="#c0392b">+U</text>
  <circle cx="200" cy="145" r="4.5" fill="#c0392b"/>
  <text x="210" y="150" font-size="12" fill="#c0392b">−U</text>
  <line x1="200" y1="45" x2="200" y2="145" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- downstairs: SO(3) = RP^3 -->
  <circle cx="200" cy="290" r="52" fill="none" stroke="#7d3c98" stroke-width="2.5"/>
  <ellipse cx="200" cy="290" rx="52" ry="19" fill="none" stroke="#7d3c98" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="200" y="345" text-anchor="middle" font-size="12" fill="#7d3c98">SO(3) ≅ ℝP³  (π₁ = ℤ/2)</text>

  <!-- single image point R -->
  <circle cx="200" cy="290" r="5" fill="#111111"/>
  <text x="210" y="286" font-size="12" fill="#111111">R</text>

  <!-- the two arrows collapsing +U and -U onto one R -->
  <path d="M 195 50 C 150 130, 150 210, 192 285" fill="none" stroke="#1a56b0" stroke-width="2" marker-end="url(#arrowb)"/>
  <path d="M 205 149 C 250 190, 250 240, 208 284" fill="none" stroke="#1a56b0" stroke-width="2" marker-end="url(#arrowb)"/>
  <text x="112" y="205" font-size="11" fill="#1a56b0">both map</text>
  <text x="112" y="219" font-size="11" fill="#1a56b0">to one R</text>
  <text x="300" y="205" font-size="11" fill="#111111">kernel = {±I}</text>

  <!-- =========================================================== -->
  <!-- Panel 2: the spinor sign dial, theta: 0 -> 4pi              -->
  <!-- =========================================================== -->
  <text x="560" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">A spinor needs 4π to return</text>

  <!-- the rotation-angle track -->
  <line x1="430" y1="120" x2="690" y2="120" stroke="#333333" stroke-width="2"/>
  <!-- tick marks -->
  <line x1="430" y1="113" x2="430" y2="127" stroke="#333333" stroke-width="2"/>
  <line x1="560" y1="113" x2="560" y2="127" stroke="#333333" stroke-width="2"/>
  <line x1="690" y1="113" x2="690" y2="127" stroke="#333333" stroke-width="2"/>
  <text x="430" y="145" text-anchor="middle" font-size="12" fill="#333333">θ = 0</text>
  <text x="560" y="145" text-anchor="middle" font-size="12" fill="#333333">θ = 2π</text>
  <text x="690" y="145" text-anchor="middle" font-size="12" fill="#333333">θ = 4π</text>

  <!-- SU(2) element values along the way -->
  <text x="430" y="98" text-anchor="middle" font-size="12" fill="#117a5b">U = +I</text>
  <text x="560" y="98" text-anchor="middle" font-size="12" fill="#c0392b">U = −I</text>
  <text x="690" y="98" text-anchor="middle" font-size="12" fill="#117a5b">U = +I</text>

  <!-- the spinor phase as a rotating little clock hand -->
  <text x="560" y="185" text-anchor="middle" font-size="12" fill="#111111">spinor state  ψ → e^{−iθ/2} ψ</text>

  <!-- three phasors: +, then flipped -, then + again -->
  <circle cx="430" cy="245" r="26" fill="none" stroke="#117a5b" stroke-width="1.5"/>
  <line x1="430" y1="245" x2="430" y2="221" stroke="#117a5b" stroke-width="2.5" marker-end="url(#tip1)"/>
  <text x="430" y="292" text-anchor="middle" font-size="12" fill="#117a5b">ψ (+)</text>

  <circle cx="560" cy="245" r="26" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="560" y1="245" x2="560" y2="269" stroke="#c0392b" stroke-width="2.5" marker-end="url(#tip2)"/>
  <text x="560" y="292" text-anchor="middle" font-size="12" fill="#c0392b">−ψ (sign flip)</text>

  <circle cx="690" cy="245" r="26" fill="none" stroke="#117a5b" stroke-width="1.5"/>
  <line x1="690" y1="245" x2="690" y2="221" stroke="#117a5b" stroke-width="2.5" marker-end="url(#tip1)"/>
  <text x="690" y="292" text-anchor="middle" font-size="12" fill="#117a5b">ψ (+)</text>

  <!-- progress arrows between phasors -->
  <path d="M 460 245 C 495 232, 525 232, 530 245" fill="none" stroke="#888888" stroke-width="1.5" marker-end="url(#arrowg)"/>
  <path d="M 590 245 C 625 232, 655 232, 660 245" fill="none" stroke="#888888" stroke-width="1.5" marker-end="url(#arrowg)"/>

  <defs>
    <marker id="arrowb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#1a56b0"/>
    </marker>
    <marker id="arrowg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#888888"/>
    </marker>
    <marker id="tip1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <circle cx="4" cy="4" r="3" fill="#117a5b"/>
    </marker>
    <marker id="tip2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <circle cx="4" cy="4" r="3" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
