<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <defs>
    <marker id="up" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M4.5 0 L9 9 L0 9 Z" fill="#127a2e"/>
    </marker>
    <marker id="down" markerWidth="9" markerHeight="9" refX="4.5" refY="1" orient="auto">
      <path d="M4.5 9 L0 0 L9 0 Z" fill="#1256b8"/>
    </marker>
    <marker id="dead" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M4.5 0 L9 9 L0 9 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Weight ladders of the spin-$j$ irreducibles</text>
  <text x="360" y="52" text-anchor="middle" font-size="13" fill="#444444">rungs = J_z eigenvalues m ;  green J_+ raises,  blue J_&#8722; lowers ;  top rung killed by J_+</text>

  <!-- ============ j = 1/2  (x=130) ============ -->
  <text x="130" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">j = 1/2  (dim 2)</text>
  <!-- rungs at m = +1/2 (y=180), -1/2 (y=300) -->
  <line x1="90" y1="180" x2="170" y2="180" stroke="#111111" stroke-width="3"/>
  <line x1="90" y1="300" x2="170" y2="300" stroke="#111111" stroke-width="3"/>
  <text x="80" y="185" text-anchor="end" font-size="13" fill="#111111">m=+1/2</text>
  <text x="80" y="305" text-anchor="end" font-size="13" fill="#111111">m=&#8722;1/2</text>
  <!-- J_+ up (right), J_- down (left) -->
  <line x1="150" y1="296" x2="150" y2="188" stroke="#127a2e" stroke-width="2.5" marker-end="url(#up)"/>
  <line x1="110" y1="184" x2="110" y2="292" stroke="#1256b8" stroke-width="2.5" marker-end="url(#down)"/>
  <!-- top annihilated -->
  <line x1="130" y1="176" x2="130" y2="130" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#dead)"/>
  <text x="140" y="150" font-size="12" fill="#c0392b">J_+|j&#10217;=0</text>

  <!-- ============ j = 1  (x=360) ============ -->
  <text x="360" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">j = 1  (dim 3)</text>
  <!-- rungs at m = +1 (150), 0 (240), -1 (330) -->
  <line x1="320" y1="150" x2="400" y2="150" stroke="#111111" stroke-width="3"/>
  <line x1="320" y1="240" x2="400" y2="240" stroke="#111111" stroke-width="3"/>
  <line x1="320" y1="330" x2="400" y2="330" stroke="#111111" stroke-width="3"/>
  <text x="310" y="155" text-anchor="end" font-size="13" fill="#111111">m=+1</text>
  <text x="310" y="245" text-anchor="end" font-size="13" fill="#111111">m=0</text>
  <text x="310" y="335" text-anchor="end" font-size="13" fill="#111111">m=&#8722;1</text>
  <line x1="380" y1="236" x2="380" y2="158" stroke="#127a2e" stroke-width="2.5" marker-end="url(#up)"/>
  <line x1="380" y1="326" x2="380" y2="248" stroke="#127a2e" stroke-width="2.5" marker-end="url(#up)"/>
  <line x1="340" y1="154" x2="340" y2="232" stroke="#1256b8" stroke-width="2.5" marker-end="url(#down)"/>
  <line x1="340" y1="244" x2="340" y2="322" stroke="#1256b8" stroke-width="2.5" marker-end="url(#down)"/>
  <line x1="360" y1="146" x2="360" y2="112" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#dead)"/>
  <text x="370" y="126" font-size="12" fill="#c0392b">J_+|j&#10217;=0</text>

  <!-- ============ j = 3/2  (x=600) ============ -->
  <text x="600" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">j = 3/2  (dim 4)</text>
  <!-- rungs at m = +3/2 (135), +1/2 (215), -1/2 (295), -3/2 (375) -->
  <line x1="560" y1="135" x2="640" y2="135" stroke="#111111" stroke-width="3"/>
  <line x1="560" y1="215" x2="640" y2="215" stroke="#111111" stroke-width="3"/>
  <line x1="560" y1="295" x2="640" y2="295" stroke="#111111" stroke-width="3"/>
  <line x1="560" y1="375" x2="640" y2="375" stroke="#111111" stroke-width="3"/>
  <text x="550" y="140" text-anchor="end" font-size="13" fill="#111111">m=+3/2</text>
  <text x="550" y="220" text-anchor="end" font-size="13" fill="#111111">m=+1/2</text>
  <text x="550" y="300" text-anchor="end" font-size="13" fill="#111111">m=&#8722;1/2</text>
  <text x="550" y="380" text-anchor="end" font-size="13" fill="#111111">m=&#8722;3/2</text>
  <line x1="620" y1="211" x2="620" y2="143" stroke="#127a2e" stroke-width="2.5" marker-end="url(#up)"/>
  <line x1="620" y1="291" x2="620" y2="223" stroke="#127a2e" stroke-width="2.5" marker-end="url(#up)"/>
  <line x1="620" y1="371" x2="620" y2="303" stroke="#127a2e" stroke-width="2.5" marker-end="url(#up)"/>
  <line x1="580" y1="139" x2="580" y2="207" stroke="#1256b8" stroke-width="2.5" marker-end="url(#down)"/>
  <line x1="580" y1="219" x2="580" y2="287" stroke="#1256b8" stroke-width="2.5" marker-end="url(#down)"/>
  <line x1="580" y1="299" x2="580" y2="367" stroke="#1256b8" stroke-width="2.5" marker-end="url(#down)"/>
  <line x1="600" y1="131" x2="600" y2="105" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#dead)"/>
  <text x="610" y="118" font-size="12" fill="#c0392b">J_+|j&#10217;=0</text>

  <!-- legend -->
  <line x1="150" y1="410" x2="180" y2="410" stroke="#127a2e" stroke-width="2.5" marker-end="url(#up)"/>
  <text x="188" y="414" font-size="12" fill="#111111">J_+ (m &#8594; m+1)</text>
  <line x1="330" y1="404" x2="330" y2="416" stroke="#1256b8" stroke-width="2.5" marker-end="url(#down)"/>
  <text x="340" y="414" font-size="12" fill="#111111">J_&#8722; (m &#8594; m&#8722;1)</text>
  <text x="500" y="414" font-size="12" fill="#111111">2j+1 rungs, spaced by 1</text>
</svg>
