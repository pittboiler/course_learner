<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>

  <!-- =============================================================== -->
  <!-- LEFT: four uncoupled product states, placed by total m = m1+m2  -->
  <!-- =============================================================== -->
  <text x="185" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Uncoupled: 4 product states</text>
  <text x="185" y="46" text-anchor="middle" font-size="12" fill="#555555">stack them by total m = m₁ + m₂</text>

  <!-- m-axis ticks (shared height reference) -->
  <line x1="70" y1="90" x2="70" y2="330" stroke="#333333" stroke-width="1.5"/>
  <text x="55" y="120" text-anchor="end" font-size="12" fill="#333333">m=1</text>
  <text x="55" y="215" text-anchor="end" font-size="12" fill="#333333">m=0</text>
  <text x="55" y="310" text-anchor="end" font-size="12" fill="#333333">m=−1</text>
  <line x1="66" y1="115" x2="74" y2="115" stroke="#333333" stroke-width="1.5"/>
  <line x1="66" y1="210" x2="74" y2="210" stroke="#333333" stroke-width="1.5"/>
  <line x1="66" y1="305" x2="74" y2="305" stroke="#333333" stroke-width="1.5"/>

  <!-- m=1: up-up -->
  <circle cx="185" cy="115" r="7" fill="#1a56b0"/>
  <text x="200" y="119" font-size="13" fill="#1a56b0">|↑↑⟩</text>

  <!-- m=0: two states -->
  <circle cx="150" cy="210" r="7" fill="#1a56b0"/>
  <text x="118" y="200" text-anchor="middle" font-size="13" fill="#1a56b0">|↑↓⟩</text>
  <circle cx="230" cy="210" r="7" fill="#1a56b0"/>
  <text x="262" y="200" text-anchor="middle" font-size="13" fill="#1a56b0">|↓↑⟩</text>
  <text x="185" y="248" text-anchor="middle" font-size="11" fill="#7d3c98">m=0 has multiplicity 2</text>

  <!-- m=-1: down-down -->
  <circle cx="185" cy="305" r="7" fill="#1a56b0"/>
  <text x="200" y="309" font-size="13" fill="#1a56b0">|↓↓⟩</text>

  <!-- big arrow to the right -->
  <path d="M 320 210 L 400 210" fill="none" stroke="#111111" stroke-width="2.5" marker-end="url(#bigarr)"/>
  <text x="360" y="198" text-anchor="middle" font-size="12" fill="#111111">re-couple</text>

  <!-- =============================================================== -->
  <!-- RIGHT: triplet ladder (j=1) + singlet (j=0)                     -->
  <!-- =============================================================== -->
  <text x="575" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Coupled: ½ ⊗ ½ = 1 ⊕ 0</text>
  <text x="575" y="46" text-anchor="middle" font-size="12" fill="#555555">triplet (symmetric) + singlet (antisym.)</text>

  <!-- triplet column -->
  <text x="500" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#117a5b">j = 1  (triplet)</text>
  <circle cx="500" cy="115" r="7" fill="#117a5b"/>
  <text x="515" y="119" font-size="12" fill="#117a5b">|1, 1⟩ = |↑↑⟩</text>
  <circle cx="500" cy="210" r="7" fill="#117a5b"/>
  <text x="515" y="214" font-size="12" fill="#117a5b">|1, 0⟩ = (|↑↓⟩+|↓↑⟩)/√2</text>
  <circle cx="500" cy="305" r="7" fill="#117a5b"/>
  <text x="515" y="309" font-size="12" fill="#117a5b">|1,−1⟩ = |↓↓⟩</text>
  <!-- ladder arrows down the triplet -->
  <path d="M 500 124 L 500 201" fill="none" stroke="#117a5b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#greenarr)"/>
  <path d="M 500 219 L 500 296" fill="none" stroke="#117a5b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#greenarr)"/>
  <text x="486" y="168" text-anchor="end" font-size="10" fill="#117a5b">J₋</text>
  <text x="486" y="263" text-anchor="end" font-size="10" fill="#117a5b">J₋</text>

  <!-- singlet, isolated at m=0 -->
  <text x="575" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">j = 0  (singlet)</text>
  <circle cx="500" cy="380" r="7" fill="#c0392b"/>
  <text x="515" y="384" font-size="12" fill="#c0392b">|0, 0⟩ = (|↑↓⟩−|↓↑⟩)/√2</text>

  <text x="575" y="330" text-anchor="middle" font-size="11" fill="#555555">4 = 3 + 1  ✓  (dimensions match)</text>

  <defs>
    <marker id="bigarr" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#111111"/>
    </marker>
    <marker id="greenarr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#117a5b"/>
    </marker>
  </defs>
</svg>
