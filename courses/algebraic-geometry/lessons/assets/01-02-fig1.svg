<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="430" fill="#ffffff"/>

  <!-- column headers -->
  <text x="150" y="42" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">ALGEBRA</text>
  <text x="150" y="62" text-anchor="middle" font-size="13" fill="#555">radical ideals of k[x,y]</text>
  <text x="550" y="42" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">GEOMETRY</text>
  <text x="550" y="62" text-anchor="middle" font-size="13" fill="#555">varieties in the plane</text>

  <!-- crossing correspondence lines (drawn first, behind boxes) -->
  <g stroke="#1f6feb" stroke-width="1.6" stroke-dasharray="6 5">
    <line x1="232" y1="105" x2="468" y2="360"/>
    <line x1="232" y1="190" x2="468" y2="275"/>
    <line x1="232" y1="275" x2="468" y2="190"/>
    <line x1="232" y1="360" x2="468" y2="105"/>
  </g>

  <!-- LEFT column: ideals, top = biggest -->
  <g>
    <rect x="70" y="88" width="160" height="34" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
    <text x="150" y="110" text-anchor="middle" font-size="15" fill="#111">(1) = k[x,y]</text>

    <rect x="70" y="173" width="160" height="34" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
    <text x="150" y="195" text-anchor="middle" font-size="15" fill="#111">(x, y)</text>

    <rect x="70" y="258" width="160" height="34" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
    <text x="150" y="280" text-anchor="middle" font-size="15" fill="#111">(x)</text>

    <rect x="70" y="343" width="160" height="34" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
    <text x="150" y="365" text-anchor="middle" font-size="15" fill="#111">(0)</text>
  </g>

  <!-- RIGHT column: varieties, top = biggest -->
  <g>
    <rect x="470" y="88" width="160" height="34" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
    <text x="550" y="110" text-anchor="middle" font-size="15" fill="#111">the plane A&#178;</text>

    <rect x="470" y="173" width="160" height="34" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
    <text x="550" y="195" text-anchor="middle" font-size="15" fill="#111">the line { x = 0 }</text>

    <rect x="470" y="258" width="160" height="34" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
    <text x="550" y="280" text-anchor="middle" font-size="15" fill="#111">the point (0, 0)</text>

    <rect x="470" y="343" width="160" height="34" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
    <text x="550" y="365" text-anchor="middle" font-size="15" fill="#111">&#8709; (empty)</text>
  </g>

  <!-- order arrows on the outside -->
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>
  <line x1="34" y1="360" x2="34" y2="100" stroke="#555" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="26" y="235" text-anchor="middle" font-size="12" fill="#555" transform="rotate(-90 26 235)">ideal grows (&#8838;)</text>

  <line x1="666" y1="360" x2="666" y2="100" stroke="#555" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="674" y="235" text-anchor="middle" font-size="12" fill="#555" transform="rotate(-90 674 235)">variety grows (&#8838;)</text>

  <!-- caption -->
  <text x="350" y="412" text-anchor="middle" font-size="13" fill="#1f6feb">V and I match the two ladders — but the rungs cross: bigger ideal &#8596; smaller variety</text>
</svg>
