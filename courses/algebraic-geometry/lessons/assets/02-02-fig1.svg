<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="480" height="360" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#111111"/>
    </marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="240" y="28" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Projection of a conic from a point on it</text>

  <!-- target line ell (the y-axis through the center) -->
  <line x1="210" y1="55" x2="210" y2="315" stroke="#2c3e8c" stroke-width="2"/>
  <text x="222" y="70" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c3e8c">&#8467; &#8776; A&#185;</text>

  <!-- the conic (circle x^2+y^2=1), center (210,185), r=95 -->
  <circle cx="210" cy="185" r="95" fill="none" stroke="#111111" stroke-width="2.5"/>
  <text x="300" y="120" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111111">C : x&#178; + y&#178; = 1</text>

  <!-- center of projection O = (-1,0) = (115,185) -->
  <circle cx="115" cy="185" r="4.5" fill="#c0392b"/>
  <text x="86" y="205" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#c0392b">O</text>

  <!-- projecting ray O -> P -> image, P at 55deg -->
  <line x1="115" y1="185" x2="300" y2="88" stroke="#c0392b" stroke-width="2" marker-end="url(#ahr)"/>
  <!-- P on the circle -->
  <circle cx="264.5" cy="107.2" r="4" fill="#111111"/>
  <text x="272" y="102" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111111">P = (x, y)</text>
  <!-- image point on ell -->
  <circle cx="210" cy="135.6" r="4" fill="#2c3e8c"/>
  <text x="150" y="139" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2c3e8c">t = y/(1+x)</text>

  <!-- tangent at O: vertical dashed line, parallel to ell -> no image -->
  <line x1="115" y1="285" x2="115" y2="88" stroke="#111111" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="18" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111">tangent at O</text>
  <text x="18" y="315" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111">(&#8741; &#8467;: no image)</text>
</svg>
