<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>

  <!-- title -->
  <text x="320" y="26" fill="#111111" font-size="17" text-anchor="middle" font-weight="bold">A parabola and its projective closure in &#8473;&#178;</text>

  <!-- line at infinity -->
  <line x1="110" y1="70" x2="530" y2="70" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="118" y="62" fill="#b91c1c" font-size="12">&#8467;&#8734; = V&#8330;(x&#8320;)  &#8212; the line at infinity</text>

  <!-- the point at infinity -->
  <circle cx="320" cy="70" r="5" fill="#111111"/>
  <text x="332" y="66" fill="#111111" font-size="13" font-weight="bold">[0 : 0 : 1]</text>
  <text x="332" y="82" fill="#555555" font-size="11">the vertical direction</text>

  <!-- axes of the affine chart x0 != 0 -->
  <line x1="150" y1="300" x2="500" y2="300" stroke="#111111" stroke-width="1.3"/>
  <line x1="320" y1="300" x2="320" y2="96" stroke="#111111" stroke-width="1.3"/>
  <text x="504" y="304" fill="#555555" font-size="12">x</text>
  <text x="308" y="104" fill="#555555" font-size="12">y</text>
  <circle cx="320" cy="300" r="2.5" fill="#111111"/>

  <!-- parabola y = x^2 -->
  <polyline points="206.6,110.5 219.2,150.2 231.8,185.3 244.4,215.8 257,241.5 269.6,262.6 282.2,278.9 294.8,290.6 307.4,297.7 320,300 332.6,297.7 345.2,290.6 357.8,278.9 370.4,262.6 383,241.5 395.6,215.8 408.2,185.3 420.8,150.2 433.4,110.5"
        fill="none" stroke="#1d4ed8" stroke-width="2.4"/>
  <text x="452" y="126" fill="#1d4ed8" font-size="13" font-weight="bold">y = x&#178;</text>

  <!-- both arms converge at the point at infinity -->
  <path d="M 206.6 110.5 Q 250 78 314 71" fill="none" stroke="#888888" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ah)"/>
  <path d="M 433.4 110.5 Q 390 78 326 71" fill="none" stroke="#888888" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ah)"/>

  <!-- labels -->
  <text x="176" y="330" fill="#555555" font-size="12">affine chart x&#8320; &#8800; 0</text>
  <text x="320" y="356" fill="#111111" font-size="14" text-anchor="middle" font-weight="bold">closure:  Y&#772; = V&#8330;(x&#8320;x&#8322; &#8722; x&#8321;&#178;)  &#8834;  &#8473;&#178;</text>
  <text x="320" y="378" fill="#555555" font-size="12" text-anchor="middle">the affine parabola, plus exactly one point at infinity where both arms meet</text>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#888888"/>
    </marker>
  </defs>
</svg>
