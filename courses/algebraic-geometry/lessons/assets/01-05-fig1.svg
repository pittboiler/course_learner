<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#127a4a"/>
    </marker>
    <marker id="al" markerWidth="9" markerHeight="9" refX="1" refY="3.2" orient="auto">
      <path d="M8,0 L0,3.2 L8,6.4 Z" fill="#127a4a"/>
    </marker>
    <marker id="gray" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#888888"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">The order-reversing dictionary  (over k = k-bar)</text>

  <text x="185" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">ALGEBRA</text>
  <text x="185" y="76" text-anchor="middle" font-size="12" fill="#444444">radical ideals of k[x1,...,xn]</text>
  <text x="535" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">GEOMETRY</text>
  <text x="535" y="76" text-anchor="middle" font-size="12" fill="#444444">affine varieties in A^n</text>

  <!-- rows -->
  <!-- Row 1: (1) <-> empty -->
  <rect x="70" y="98" width="230" height="40" rx="6" fill="#f2f2f2" stroke="#111111" stroke-width="1"/>
  <text x="185" y="123" text-anchor="middle" font-size="14" fill="#111111">unit ideal (1) = k[x]</text>
  <rect x="420" y="98" width="230" height="40" rx="6" fill="#f2f2f2" stroke="#111111" stroke-width="1"/>
  <text x="535" y="123" text-anchor="middle" font-size="14" fill="#111111">empty set  (no points)</text>

  <!-- Row 2: maximal <-> point -->
  <rect x="70" y="168" width="230" height="40" rx="6" fill="#e6f3ec" stroke="#127a4a" stroke-width="1.5"/>
  <text x="185" y="193" text-anchor="middle" font-size="14" fill="#111111">maximal ideal  m_p</text>
  <rect x="420" y="168" width="230" height="40" rx="6" fill="#e6f3ec" stroke="#127a4a" stroke-width="1.5"/>
  <text x="535" y="193" text-anchor="middle" font-size="14" fill="#111111">a single point  p</text>

  <!-- Row 3: prime <-> irreducible -->
  <rect x="70" y="238" width="230" height="40" rx="6" fill="#e6eef7" stroke="#1a5fa8" stroke-width="1.5"/>
  <text x="185" y="263" text-anchor="middle" font-size="14" fill="#111111">prime ideal  p</text>
  <rect x="420" y="238" width="230" height="40" rx="6" fill="#e6eef7" stroke="#1a5fa8" stroke-width="1.5"/>
  <text x="535" y="263" text-anchor="middle" font-size="14" fill="#111111">irreducible variety</text>

  <!-- Row 4: (0) <-> whole space -->
  <rect x="70" y="308" width="230" height="40" rx="6" fill="#f2f2f2" stroke="#111111" stroke-width="1"/>
  <text x="185" y="333" text-anchor="middle" font-size="14" fill="#111111">zero ideal (0)</text>
  <rect x="420" y="308" width="230" height="40" rx="6" fill="#f2f2f2" stroke="#111111" stroke-width="1"/>
  <text x="535" y="333" text-anchor="middle" font-size="14" fill="#111111">whole space  A^n</text>

  <!-- connectors V (left->right) and I (right->left) -->
  <line x1="300" y1="112" x2="420" y2="112" stroke="#127a4a" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="420" y1="126" x2="300" y2="126" stroke="#127a4a" stroke-width="1.4" marker-end="url(#al)"/>
  <text x="360" y="107" text-anchor="middle" font-size="12" fill="#127a4a">V</text>
  <text x="360" y="140" text-anchor="middle" font-size="12" fill="#127a4a">I</text>

  <line x1="300" y1="182" x2="420" y2="182" stroke="#127a4a" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="420" y1="196" x2="300" y2="196" stroke="#127a4a" stroke-width="1.4" marker-end="url(#al)"/>

  <line x1="300" y1="252" x2="420" y2="252" stroke="#127a4a" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="420" y1="266" x2="300" y2="266" stroke="#127a4a" stroke-width="1.4" marker-end="url(#al)"/>

  <line x1="300" y1="322" x2="420" y2="322" stroke="#127a4a" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="420" y1="336" x2="300" y2="336" stroke="#127a4a" stroke-width="1.4" marker-end="url(#al)"/>

  <!-- reversal arrows on the outer edges -->
  <line x1="40" y1="330" x2="40" y2="112" stroke="#888888" stroke-width="1.4" marker-end="url(#gray)"/>
  <text x="30" y="225" text-anchor="middle" font-size="11" fill="#666666" transform="rotate(-90 30 225)">ideal grows (bigger)</text>

  <line x1="680" y1="112" x2="680" y2="330" stroke="#888888" stroke-width="1.4" marker-end="url(#gray)"/>
  <text x="700" y="225" text-anchor="middle" font-size="11" fill="#666666" transform="rotate(-90 700 225)">variety grows (bigger)</text>

  <text x="360" y="392" text-anchor="middle" font-size="12.5" fill="#111111">Going down: ideals shrink, varieties grow. The bijection flips inclusions.</text>
  <text x="360" y="412" text-anchor="middle" font-size="12.5" fill="#111111">I(V(J)) = sqrt(J)  is the only slack:  V and I are inverse on radical ideals.</text>
</svg>
