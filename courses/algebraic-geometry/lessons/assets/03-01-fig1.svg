<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="280" fill="#ffffff"/>

  <!-- title -->
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">A longest chain of irreducible closed subsets in &#8477;&#179;</text>

  <!-- ===================== X0 : a point (dim 0) ===================== -->
  <g>
    <circle cx="90" cy="120" r="5" fill="#b91c1c"/>
    <text x="90" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">X&#8320;</text>
    <text x="90" y="216" text-anchor="middle" font-size="12" fill="#555">a point</text>
    <text x="90" y="238" text-anchor="middle" font-size="13" fill="#b91c1c" font-weight="bold">dim 0</text>
  </g>

  <text x="170" y="126" text-anchor="middle" font-size="22" fill="#111">&#8842;</text>

  <!-- ===================== X1 : a curve (dim 1) ===================== -->
  <g>
    <path d="M 210 160 C 235 90, 255 175, 275 115 C 288 78, 300 150, 310 100"
          fill="none" stroke="#1d4ed8" stroke-width="2.6"/>
    <circle cx="260" cy="140" r="4" fill="#b91c1c"/>
    <text x="260" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">X&#8321;</text>
    <text x="260" y="216" text-anchor="middle" font-size="12" fill="#555">a curve</text>
    <text x="260" y="238" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="bold">dim 1</text>
  </g>

  <text x="345" y="126" text-anchor="middle" font-size="22" fill="#111">&#8842;</text>

  <!-- ===================== X2 : a surface (dim 2) ===================== -->
  <g>
    <polygon points="390,95 500,80 520,150 410,168" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
    <path d="M 405 130 C 430 108, 460 140, 495 112"
          fill="none" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="450" cy="123" r="3.5" fill="#b91c1c"/>
    <text x="455" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">X&#8322;</text>
    <text x="455" y="216" text-anchor="middle" font-size="12" fill="#555">a surface</text>
    <text x="455" y="238" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="bold">dim 2</text>
  </g>

  <text x="548" y="126" text-anchor="middle" font-size="22" fill="#111">&#8842;</text>

  <!-- ===================== X3 = A^3 (dim 3) ===================== -->
  <g>
    <!-- cube wireframe -->
    <g stroke="#111" stroke-width="1.5" fill="none">
      <polygon points="600,150 655,150 655,95 600,95" />
      <polygon points="625,130 680,130 680,75 625,75" />
      <line x1="600" y1="150" x2="625" y2="130"/>
      <line x1="655" y1="150" x2="680" y2="130"/>
      <line x1="655" y1="95" x2="680" y2="75"/>
      <line x1="600" y1="95" x2="625" y2="75"/>
    </g>
    <text x="640" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">X&#8323; = &#8477;&#179;</text>
    <text x="640" y="216" text-anchor="middle" font-size="12" fill="#555">all of affine 3-space</text>
    <text x="640" y="238" text-anchor="middle" font-size="13" fill="#111" font-weight="bold">dim 3</text>
  </g>

  <!-- caption -->
  <text x="360" y="268" text-anchor="middle" font-size="13" fill="#111">length of the chain = number of &#8842; steps = 3, and no chain is longer &#8212; so dim &#8477;&#179; = 3.</text>
</svg>
