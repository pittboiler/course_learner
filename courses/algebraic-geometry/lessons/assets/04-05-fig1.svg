<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="280" fill="#ffffff"/>

  <!-- genus 0: sphere -->
  <ellipse cx="120" cy="110" rx="62" ry="62" fill="none" stroke="#111111" stroke-width="2.5"/>
  <path d="M 62 100 A 62 30 0 0 0 178 100" fill="none" stroke="#111111" stroke-width="1.4" stroke-dasharray="4 4"/>
  <path d="M 62 100 A 62 30 0 0 1 178 100" fill="none" stroke="#111111" stroke-width="1.4"/>
  <text x="120" y="212" text-anchor="middle" font-size="18" fill="#111111">g = 0  (sphere)</text>
  <text x="120" y="238" text-anchor="middle" font-size="18" fill="#b00020">deg K = 2g-2 = -2</text>

  <!-- genus 1: torus -->
  <ellipse cx="360" cy="110" rx="78" ry="52" fill="none" stroke="#111111" stroke-width="2.5"/>
  <path d="M 330 108 A 34 20 0 0 0 390 108" fill="none" stroke="#111111" stroke-width="2"/>
  <path d="M 337 114 A 30 16 0 0 1 383 114" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="360" y="212" text-anchor="middle" font-size="18" fill="#111111">g = 1  (torus)</text>
  <text x="360" y="238" text-anchor="middle" font-size="18" fill="#b00020">deg K = 2g-2 = 0</text>

  <!-- genus 2: two handles -->
  <path d="M 520 110
           C 520 74, 556 62, 600 62
           C 644 62, 680 74, 680 110
           C 680 146, 644 158, 600 158
           C 556 158, 520 146, 520 110 Z"
        fill="none" stroke="#111111" stroke-width="2.5"/>
  <path d="M 546 108 A 20 13 0 0 0 586 108" fill="none" stroke="#111111" stroke-width="2"/>
  <path d="M 551 113 A 17 10 0 0 1 581 113" fill="none" stroke="#111111" stroke-width="2"/>
  <path d="M 614 108 A 20 13 0 0 0 654 108" fill="none" stroke="#111111" stroke-width="2"/>
  <path d="M 619 113 A 17 10 0 0 1 649 113" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="600" y="212" text-anchor="middle" font-size="18" fill="#111111">g = 2  (two handles)</text>
  <text x="600" y="238" text-anchor="middle" font-size="18" fill="#b00020">deg K = 2g-2 = 2</text>
</svg>
