<svg viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>

  <!-- ===== titles ===== -->
  <text x="185" y="26" fill="#111111" font-size="15" text-anchor="middle" font-weight="bold">A point of &#8473;&#178; = a line through 0 in k&#179;</text>
  <text x="505" y="26" fill="#111111" font-size="15" text-anchor="middle" font-weight="bold">Parallel lines meet at infinity</text>

  <!-- ===================== PANEL A ===================== -->
  <!-- chart plane (a tilted quad, not through the origin) -->
  <polygon points="60,150 250,120 300,195 110,225" fill="#eef2ff" stroke="#111111" stroke-width="1.3"/>
  <text x="300" y="140" fill="#555555" font-size="11.5" text-anchor="start">chart U&#8320;: x&#8320;=1</text>
  <text x="300" y="154" fill="#555555" font-size="11.5" text-anchor="start">(a copy of &#120120;&#178;)</text>

  <!-- origin -->
  <circle cx="190" cy="340" r="3.2" fill="#111111"/>
  <text x="200" y="352" fill="#111111" font-size="13">0</text>

  <!-- lines through origin, each hitting the plane in one point -->
  <line x1="190" y1="340" x2="115" y2="146" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="190" y1="340" x2="190" y2="125" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="190" y1="340" x2="265" y2="134" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="130" cy="185" r="3" fill="#b91c1c"/>
  <circle cx="190" cy="168" r="3" fill="#b91c1c"/>
  <circle cx="250" cy="175" r="3" fill="#b91c1c"/>

  <!-- a line PARALLEL to the chart plane: never hits it = a point at infinity -->
  <line x1="70" y1="359" x2="330" y2="318" stroke="#15803d" stroke-width="2" stroke-dasharray="1 0"/>
  <text x="336" y="322" fill="#15803d" font-size="11.5">&#8741; chart</text>
  <text x="336" y="336" fill="#15803d" font-size="11.5">&#8594; point at &#8734;</text>

  <text x="185" y="384" fill="#111111" font-size="12" text-anchor="middle">tilted lines pierce the chart once; horizontal ones escape to &#8734;</text>

  <!-- ===================== PANEL B ===================== -->
  <!-- horizon = line at infinity -->
  <line x1="380" y1="150" x2="630" y2="150" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="384" y="143" fill="#b91c1c" font-size="11.5">line at infinity  &#8801; &#8473;&#185;</text>

  <!-- vanishing point -->
  <circle cx="505" cy="150" r="3.6" fill="#b91c1c"/>
  <text x="512" y="146" fill="#b91c1c" font-size="12">[1 : m : 0]</text>

  <!-- two parallel affine lines (slope m) converging to the vanishing point -->
  <line x1="410" y1="380" x2="505" y2="150" stroke="#1d4ed8" stroke-width="2.2"/>
  <line x1="600" y1="380" x2="505" y2="150" stroke="#1d4ed8" stroke-width="2.2"/>

  <!-- ties, getting closer near the horizon (perspective) -->
  <line x1="430" y1="332" x2="580" y2="332" stroke="#111111" stroke-width="1"/>
  <line x1="447" y1="290" x2="563" y2="290" stroke="#111111" stroke-width="1"/>
  <line x1="461" y1="255" x2="549" y2="255" stroke="#111111" stroke-width="1"/>
  <line x1="472" y1="227" x2="538" y2="227" stroke="#111111" stroke-width="1"/>
  <line x1="481" y1="203" x2="529" y2="203" stroke="#111111" stroke-width="1"/>

  <text x="405" y="375" fill="#1d4ed8" font-size="11.5">y = mx</text>
  <text x="558" y="375" fill="#1d4ed8" font-size="11.5">y = mx + b</text>

  <text x="505" y="384" fill="#111111" font-size="12" text-anchor="middle">same slope m &#8658; same point at &#8734;: they close up in &#8473;&#178;</text>
</svg>
