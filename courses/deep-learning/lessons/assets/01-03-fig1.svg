<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">A branching graph: the gradient at u is the sum over every path that leaves it</text>
  <circle cx="90" cy="200" r="22" fill="none" stroke="#8a8a8a" stroke-width="1.7"/>
  <text x="90" y="205" fill="#8a8a8a" font-size="14" text-anchor="middle">w</text>
  <text x="90" y="170" fill="#4a90d9" font-size="11" text-anchor="middle">w = 2</text>
  <circle cx="230" cy="200" r="22" fill="none" stroke="#8a8a8a" stroke-width="1.7"/>
  <text x="230" y="205" fill="#8a8a8a" font-size="14" text-anchor="middle">u</text>
  <text x="230" y="170" fill="#4a90d9" font-size="11" text-anchor="middle">u = 6</text>
  <circle cx="390" cy="140" r="22" fill="none" stroke="#8a8a8a" stroke-width="1.7"/>
  <text x="390" y="145" fill="#8a8a8a" font-size="14" text-anchor="middle">v</text>
  <text x="390" y="110" fill="#4a90d9" font-size="11" text-anchor="middle">v = 36</text>
  <circle cx="530" cy="200" r="22" fill="none" stroke="#8a8a8a" stroke-width="1.7"/>
  <text x="530" y="205" fill="#8a8a8a" font-size="14" text-anchor="middle">y</text>
  <text x="530" y="170" fill="#4a90d9" font-size="11" text-anchor="middle">y = 42</text>
  <circle cx="650" cy="200" r="22" fill="none" stroke="#e0645c" stroke-width="1.7"/>
  <text x="650" y="205" fill="#e0645c" font-size="14" text-anchor="middle">L</text>
  <text x="650" y="170" fill="#4a90d9" font-size="11" text-anchor="middle">L = 2</text>
  <line x1="112" y1="200" x2="208" y2="200" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="208.0,200.0 199.6,203.3 199.6,196.7" fill="#8a8a8a"/>
  <text x="160" y="192" fill="#8a8a8a" font-size="11" text-anchor="middle">x 3</text>
  <line x1="248" y1="190" x2="372" y2="150" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="372.0,150.0 365.1,155.7 363.0,149.4" fill="#8a8a8a"/>
  <text x="300" y="160" fill="#8a8a8a" font-size="11" text-anchor="middle">square</text>
  <line x1="410" y1="152" x2="512" y2="190" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="512.0,190.0 503.0,190.2 505.3,184.0" fill="#8a8a8a"/>
  <text x="470" y="160" fill="#8a8a8a" font-size="11" text-anchor="middle">add</text>
  <line x1="252" y1="200" x2="508" y2="200" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="508.0,200.0 499.6,203.3 499.6,196.7" fill="#8a8a8a"/>
  <text x="380" y="192" fill="#8a8a8a" font-size="11" text-anchor="middle">identity (the branch)</text>
  <line x1="552" y1="200" x2="628" y2="200" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="628.0,200.0 619.6,203.3 619.6,196.7" fill="#8a8a8a"/>
  <text x="40" y="286" fill="#e0645c" font-size="12">backward sweep, in reverse topological order:</text>
  <text x="60" y="308" fill="#e0645c" font-size="12">dL/dy = y - t = 2</text>
  <text x="280" y="308" fill="#e0645c" font-size="12">dL/dv = 2 . 1 = 2</text>
  <text x="60" y="330" fill="#e0645c" font-size="12">dL/du = 2 . 2u   (through v)   +   2 . 1   (through the branch)   =  24 + 2  =  26</text>
  <text x="60" y="352" fill="#e0645c" font-size="12">dL/dw = 26 . x = 78</text>
  <text x="60" y="384" fill="#8a8a8a" font-size="11">A node with two consumers accumulates: its gradient is the sum of what each consumer sends back.</text>
</svg>
