  <text x="40" y="340" fill="#8a8a8a" font-size="11">At D(G(z)) = 0.01 the slopes are 1/(1 - D) = 1.01 and 1/D = 100: a hundredfold difference in the signal</text>
  <text x="40" y="358" fill="#e0645c" font-size="11">the generator receives exactly when it is doing worst and most needs one.</text>
  <text x="40" y="390" fill="#8a8a8a" font-size="11">Both have the same fixed point and the same direction of improvement. Only the scaling differs,</text>
  <text x="40" y="408" fill="#4a90d9" font-size="11">and the scaling is what decides whether training gets off the ground.</text>
