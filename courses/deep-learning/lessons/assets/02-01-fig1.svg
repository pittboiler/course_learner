  <text x="505.0" y="170.0" fill="#8a8a8a" text-anchor="middle">-2</text>
  <text x="475.0" y="200.0" fill="#8a8a8a" text-anchor="middle">2</text>
  <text x="505.0" y="200.0" fill="#e0645c" text-anchor="middle">-2</text>
  <text x="490" y="138" fill="#8a8a8a" font-size="12" text-anchor="middle">output 2 x 2</text>
  <line x1="390" y1="165.0" x2="450" y2="180" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="450.0,180.0 441.1,181.2 442.7,174.7" fill="#8a8a8a"/>
  <text x="40" y="300" fill="#8a8a8a" font-size="11">A dense layer from a 32 x 32 x 3 image to a 32 x 32 x 16 map needs 50,331,648 weights.</text>
  <text x="40" y="318" fill="#e0645c" font-size="11">A 3 x 3 convolution producing the same map needs 448, including biases - a factor of 112,000.</text>
  <text x="40" y="348" fill="#8a8a8a" font-size="11">Two assumptions buy that: what matters is LOCAL, and a feature worth detecting in one place</text>
  <text x="40" y="366" fill="#8a8a8a" font-size="11">is worth detecting everywhere. Both are true of images and false of, say, a table of unrelated columns.</text>
</svg>
