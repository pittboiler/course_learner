  <text x="365.0" y="140.0" fill="#8a8a8a" text-anchor="middle">-1</text>
  <text x="305.0" y="170.0" fill="#8a8a8a" text-anchor="middle">1</text>
  <text x="335.0" y="170.0" fill="#8a8a8a" text-anchor="middle">0</text>
  <text x="365.0" y="170.0" fill="#8a8a8a" text-anchor="middle">-1</text>
