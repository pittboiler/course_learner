<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="40" y="24" fill="#8a8a8a" font-style="italic">The identity path is a route for the gradient that nothing multiplies</text>
  <text x="40" y="62" fill="#e0645c">plain block</text>
  <rect x="80" y="88" width="140" height="34" fill="none" stroke="#8a8a8a" stroke-width="1.4" rx="4"/>
  <text x="150" y="110" fill="#8a8a8a" font-size="12" text-anchor="middle">weight</text>
  <line x1="150" y1="122" x2="150" y2="140" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="150.0,140.0 146.7,131.6 153.3,131.6" fill="#8a8a8a"/>
  <rect x="80" y="140" width="140" height="34" fill="none" stroke="#8a8a8a" stroke-width="1.4" rx="4"/>
  <text x="150" y="162" fill="#8a8a8a" font-size="12" text-anchor="middle">norm + ReLU</text>
  <line x1="150" y1="174" x2="150" y2="192" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="150.0,192.0 146.7,183.6 153.3,183.6" fill="#8a8a8a"/>
  <rect x="80" y="192" width="140" height="34" fill="none" stroke="#8a8a8a" stroke-width="1.4" rx="4"/>
  <text x="150" y="214" fill="#8a8a8a" font-size="12" text-anchor="middle">weight</text>
  <line x1="150" y1="226" x2="150" y2="244" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="150.0,244.0 146.7,235.6 153.3,235.6" fill="#8a8a8a"/>
  <rect x="80" y="244" width="140" height="34" fill="none" stroke="#8a8a8a" stroke-width="1.4" rx="4"/>
  <text x="150" y="266" fill="#8a8a8a" font-size="12" text-anchor="middle">norm</text>
  <line x1="150" y1="278" x2="150" y2="300" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="150.0,300.0 146.7,291.6 153.3,291.6" fill="#8a8a8a"/>
  <text x="150" y="310" fill="#8a8a8a" font-size="12" text-anchor="middle">ReLU</text>
  <text x="40" y="352" fill="#e0645c" font-size="11">gradient reaching the input is a PRODUCT of four Jacobians;</text>
  <text x="40" y="370" fill="#e0645c" font-size="11">stack fifty blocks and it is a product of two hundred.</text>
  <text x="370" y="62" fill="#4a90d9">residual block</text>
  <rect x="410" y="88" width="140" height="34" fill="none" stroke="#8a8a8a" stroke-width="1.4" rx="4"/>
  <text x="480" y="110" fill="#8a8a8a" font-size="12" text-anchor="middle">weight</text>
  <line x1="480" y1="122" x2="480" y2="140" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="480.0,140.0 476.7,131.6 483.3,131.6" fill="#8a8a8a"/>
  <rect x="410" y="140" width="140" height="34" fill="none" stroke="#8a8a8a" stroke-width="1.4" rx="4"/>
  <text x="480" y="162" fill="#8a8a8a" font-size="12" text-anchor="middle">norm + ReLU</text>
  <line x1="480" y1="174" x2="480" y2="192" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="480.0,192.0 476.7,183.6 483.3,183.6" fill="#8a8a8a"/>
  <rect x="410" y="192" width="140" height="34" fill="none" stroke="#8a8a8a" stroke-width="1.4" rx="4"/>
  <text x="480" y="214" fill="#8a8a8a" font-size="12" text-anchor="middle">weight</text>
  <line x1="480" y1="226" x2="480" y2="244" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="480.0,244.0 476.7,235.6 483.3,235.6" fill="#8a8a8a"/>
  <rect x="410" y="244" width="140" height="34" fill="none" stroke="#8a8a8a" stroke-width="1.4" rx="4"/>
  <text x="480" y="266" fill="#8a8a8a" font-size="12" text-anchor="middle">norm</text>
  <line x1="480" y1="80" x2="590" y2="80" stroke="#4a90d9" stroke-width="2.0"/>
  <line x1="590" y1="80" x2="590" y2="282" stroke="#4a90d9" stroke-width="2.0"/>
  <line x1="590" y1="282" x2="493" y2="282" stroke="#4a90d9" stroke-width="2.0"/>
  <text x="600" y="230" fill="#4a90d9" font-size="12">identity</text>
  <text x="600" y="247" fill="#4a90d9" font-size="12">path</text>
  <circle cx="480" cy="282" r="13" fill="none" stroke="#4a90d9" stroke-width="1.7"/>
  <line x1="472" y1="282" x2="488" y2="282" stroke="#4a90d9" stroke-width="1.4"/>
  <line x1="480" y1="274" x2="480" y2="290" stroke="#4a90d9" stroke-width="1.4"/>
  <line x1="480" y1="278" x2="480" y2="269" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="480.0,269.0 483.3,277.4 476.7,277.4" fill="#8a8a8a"/>
  <line x1="480" y1="295" x2="480" y2="316" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="480.0,316.0 476.7,307.6 483.3,307.6" fill="#8a8a8a"/>
  <text x="480" y="332" fill="#8a8a8a" font-size="12" text-anchor="middle">ReLU</text>
  <text x="370" y="352" fill="#4a90d9" font-size="11">y = x + F(x), so dy/dx = I + dF/dx: one term is the identity,</text>
  <text x="370" y="370" fill="#4a90d9" font-size="11">and the gradient always has a route multiplied by exactly 1.</text>
  <text x="40" y="404" fill="#8a8a8a" font-size="11">Across L blocks the derivative expands into 2^L paths of every length, and the shortest path skips everything.</text>
</svg>
