  <text x="46" y="56" fill="#e0645c" font-size="12">plain gradient descent</text>
  <text x="46" y="73" fill="#e0645c" font-size="11">the step is capped by the steep axis,</text>
  <text x="46" y="89" fill="#e0645c" font-size="11">so progress along the flat axis crawls</text>
  <text x="46" y="336" fill="#4a90d9" font-size="12">with momentum</text>
  <text x="46" y="353" fill="#4a90d9" font-size="11">the up-down components cancel;</text>
  <text x="46" y="369" fill="#4a90d9" font-size="11">the flat direction adds up</text>
  <text x="300" y="352" fill="#8a8a8a" font-size="11">Same 18 steps and the same learning rate; beta = 0.5 here.</text>
  <text x="300" y="368" fill="#8a8a8a" font-size="11">Effective step along a consistent direction is eta / (1 - beta):</text>
  <text x="300" y="384" fill="#8a8a8a" font-size="11">ten times the plain step at beta = 0.9 - which is also why momentum overshoots.</text>
</svg>
