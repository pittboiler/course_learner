  <text x="50.0" y="142.5" fill="#8a8a8a" font-size="11">data lies on a curve</text>
  <text x="40" y="344" fill="#e0645c" font-size="11">A linear code must project onto a line, and here that discards the curvature: 11 percent of the variance,</text>
  <text x="40" y="362" fill="#e0645c" font-size="11">and worse, points far apart along the curve land near each other on the line.</text>
  <text x="40" y="390" fill="#4a90d9" font-size="11">A nonlinear encoder can use arc length as its single coordinate and lose nothing at all.</text>
  <rect x="430" y="60" width="240" height="190" fill="none" stroke="#4a90d9" stroke-width="1.6" rx="6"/>
  <text x="550" y="86" fill="#4a90d9" text-anchor="middle">what the bottleneck does</text>
  <text x="444" y="114" fill="#8a8a8a" font-size="11">Force the code narrower than the input</text>
  <text x="444" y="132" fill="#8a8a8a" font-size="11">and the network cannot copy; it must</text>
  <text x="444" y="150" fill="#8a8a8a" font-size="11">find structure that survives the squeeze.</text>
  <text x="444" y="182" fill="#e0645c" font-size="11">Linear encoder + squared error</text>
  <text x="444" y="200" fill="#e0645c" font-size="11">= PCA exactly (statistical-learning 6.1).</text>
  <text x="444" y="224" fill="#4a90d9" font-size="11">Everything a deep autoencoder adds</text>
  <text x="444" y="242" fill="#4a90d9" font-size="11">comes from dropping the linearity.</text>
</svg>
