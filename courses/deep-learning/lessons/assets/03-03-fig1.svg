  <text x="510" y="111" fill="#8a8a8a" font-size="12" text-anchor="middle">s1</text>
  <line x1="534" y1="106" x2="556" y2="106" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="556.0,106.0 547.6,109.3 547.6,102.7" fill="#8a8a8a"/>
  <rect x="556" y="90" width="48" height="32" fill="none" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
  <text x="580" y="111" fill="#8a8a8a" font-size="12" text-anchor="middle">s2</text>
  <line x1="604" y1="106" x2="626" y2="106" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="626.0,106.0 617.6,109.3 617.6,102.7" fill="#8a8a8a"/>
  <rect x="626" y="90" width="48" height="32" fill="none" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
  <text x="650" y="111" fill="#8a8a8a" font-size="12" text-anchor="middle">s3</text>
  <line x1="460" y1="106" x2="486" y2="106" stroke="#e0645c" stroke-width="1.6"/>
  <polygon points="486.0,106.0 477.6,109.3 477.6,102.7" fill="#e0645c"/>
  <text x="40" y="152" fill="#e0645c" font-size="11">Everything the source said must fit in v. Translation quality falls off as the source gets longer.</text>
  <text x="40" y="214" fill="#4a90d9" font-size="12">with attention</text>
  <rect x="104" y="230" width="52" height="32" fill="none" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
  <text x="130" y="251" fill="#8a8a8a" font-size="12" text-anchor="middle">h1</text>
  <line x1="156" y1="246" x2="174" y2="246" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="174.0,246.0 165.6,249.3 165.6,242.7" fill="#8a8a8a"/>
  <rect x="174" y="230" width="52" height="32" fill="none" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
  <text x="200" y="251" fill="#8a8a8a" font-size="12" text-anchor="middle">h2</text>
  <line x1="226" y1="246" x2="244" y2="246" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="244.0,246.0 235.6,249.3 235.6,242.7" fill="#8a8a8a"/>
  <rect x="244" y="230" width="52" height="32" fill="none" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
  <text x="270" y="251" fill="#8a8a8a" font-size="12" text-anchor="middle">h3</text>
  <line x1="296" y1="246" x2="314" y2="246" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="314.0,246.0 305.6,249.3 305.6,242.7" fill="#8a8a8a"/>
  <rect x="314" y="230" width="52" height="32" fill="none" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
  <text x="340" y="251" fill="#8a8a8a" font-size="12" text-anchor="middle">h4</text>
  <rect x="486" y="316" width="48" height="32" fill="none" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
  <text x="510" y="337" fill="#8a8a8a" font-size="12" text-anchor="middle">s1</text>
  <line x1="534" y1="332" x2="556" y2="332" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="556.0,332.0 547.6,335.3 547.6,328.7" fill="#8a8a8a"/>
  <rect x="556" y="316" width="48" height="32" fill="none" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
  <text x="580" y="337" fill="#8a8a8a" font-size="12" text-anchor="middle">s2</text>
  <line x1="604" y1="332" x2="626" y2="332" stroke="#8a8a8a" stroke-width="1.2"/>
  <polygon points="626.0,332.0 617.6,335.3 617.6,328.7" fill="#8a8a8a"/>
  <rect x="626" y="316" width="48" height="32" fill="none" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
  <text x="650" y="337" fill="#8a8a8a" font-size="12" text-anchor="middle">s3</text>
  <line x1="130" y1="262" x2="574" y2="316" stroke="#4a90d9" stroke-width="2.1950000000000003"/>
  <line x1="200" y1="262" x2="574" y2="316" stroke="#4a90d9" stroke-width="1.655"/>
  <line x1="270" y1="262" x2="574" y2="316" stroke="#4a90d9" stroke-width="3.0949999999999998"/>
  <text x="300" y="292" fill="#4a90d9" font-size="11">weights recomputed for every output step</text>
  <text x="40" y="380" fill="#4a90d9" font-size="11">Each decoder step forms its own weighted average of ALL encoder states, with weights computed from content.</text>
  <text x="40" y="402" fill="#4a90d9" font-size="11">No fixed-size bottleneck, and the gradient path from any output back to any input has length 1 rather than T.</text>
  <text x="40" y="430" fill="#8a8a8a" font-size="11">The weights are also readable: plotted as a matrix they show which source words each output word used.</text>
</svg>
