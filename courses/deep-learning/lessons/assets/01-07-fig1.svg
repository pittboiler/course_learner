  <text x="40" y="344" fill="#8a8a8a" font-size="11">Gap large and training loss low   ->   too much capacity used: weight decay, dropout, more data, augmentation.</text>
  <text x="40" y="362" fill="#e0645c" font-size="11">Gap small and BOTH losses high    ->   underfitting: regularize less, not more; add capacity or train longer.</text>
  <text x="40" y="386" fill="#8a8a8a" font-size="11">Every regularizer trades training fit for the gap. Reaching for one before naming the gap is guesswork.</text>
