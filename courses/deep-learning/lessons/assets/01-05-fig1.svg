  <text x="40" y="354" fill="#8a8a8a" font-size="11">Too small and the signal - and the gradient with it - is gone by layer 25: 2^-25 is about 3e-8.</text>
  <text x="40" y="372" fill="#8a8a8a" font-size="11">Too large and it overflows. He's factor of 2 exactly compensates for ReLU discarding half the units.</text>
