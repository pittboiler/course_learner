  <text x="90" y="298" fill="#8a8a8a" font-size="11">rows are queries, columns are keys</text>
  <text x="90" y="316" fill="#e0645c" font-size="11">Masked entries are set to minus infinity BEFORE the softmax, so they receive exactly zero weight.</text>
  <text x="90" y="334" fill="#e0645c" font-size="11">Setting them to zero after the softmax would leave the row not summing to one.</text>
  <text x="380" y="80" fill="#8a8a8a">three assemblies of the same block</text>
  <rect x="380" y="112" width="290" height="64" fill="none" stroke="#4a90d9" stroke-width="1.5" rx="5"/>
  <text x="392" y="134" fill="#4a90d9" font-size="12">encoder-only</text>
  <text x="392" y="152" fill="#8a8a8a" font-size="11">bidirectional, no mask</text>
  <text x="392" y="168" fill="#8a8a8a" font-size="11">understanding, classification</text>
  <rect x="380" y="194" width="290" height="64" fill="none" stroke="#e0645c" stroke-width="1.5" rx="5"/>
  <text x="392" y="216" fill="#e0645c" font-size="12">decoder-only</text>
  <text x="392" y="234" fill="#8a8a8a" font-size="11">causal mask</text>
  <text x="392" y="250" fill="#8a8a8a" font-size="11">generation - the dominant design</text>
  <rect x="380" y="276" width="290" height="64" fill="none" stroke="#8a8a8a" stroke-width="1.5" rx="5"/>
  <text x="392" y="298" fill="#8a8a8a" font-size="12">encoder-decoder</text>
  <text x="392" y="316" fill="#8a8a8a" font-size="11">encoder bidirectional,</text>
  <text x="392" y="332" fill="#8a8a8a" font-size="11">decoder causal plus cross-attention</text>
  <text x="40" y="394" fill="#8a8a8a" font-size="11">Training runs all positions at once; generation runs one token at a time.</text>
  <text x="40" y="412" fill="#e0645c" font-size="11">That asymmetry is the whole of inference engineering.</text>
</svg>
