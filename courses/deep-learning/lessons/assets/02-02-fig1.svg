  <text x="40" y="386" fill="#8a8a8a" font-size="11">By the last row one unit sees the whole 32-pixel input. Without the two pooling layers,</text>
  <text x="40" y="404" fill="#e0645c" font-size="11">six 3x3 convolutions would reach only 13 pixels: 3, 5, 7, 9, 11, 13.</text>
  <text x="40" y="428" fill="#8a8a8a" font-size="12">r_new = r + (k - 1) . jump      jump_new = jump . stride</text>
