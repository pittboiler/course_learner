<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
<text x="400" y="24" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">Locke, Essay II.viii: what is in the body, and what is in the mind</text>
<rect x="20" y="42" width="380" height="300" rx="6" fill="none" stroke="#111111" stroke-width="1.5"/>
<text x="210" y="64" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">IN THE BODY (porphyry, snow, manna)</text>
<rect x="36" y="76" width="348" height="80" rx="4" fill="#dbe8f5" stroke="#1a6fb5" stroke-width="1.2"/>
<text x="48" y="97" font-size="13" text-anchor="start" fill="#1a6fb5" font-weight="bold">Primary qualities of the insensible parts</text>
<text x="48" y="118" font-size="12" text-anchor="start" fill="#111111">bulk, figure, number, situation,</text>
<text x="48" y="136" font-size="12" text-anchor="start" fill="#111111">motion or rest, solidity</text>
<rect x="36" y="170" width="348" height="78" rx="4" fill="#f6dde1" stroke="#d1495b" stroke-width="1.2"/>
<text x="48" y="191" font-size="13" text-anchor="start" fill="#d1495b" font-weight="bold">Secondary qualities = powers</text>
<text x="48" y="212" font-size="12" text-anchor="start" fill="#111111">a texture of parts apt to produce in us</text>
<text x="48" y="230" font-size="12" text-anchor="start" fill="#111111">ideas of colour, taste, smell, sound, heat</text>
<rect x="36" y="262" width="348" height="66" rx="4" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="5,3"/>
<text x="48" y="283" font-size="13" text-anchor="start" fill="#333333" font-weight="bold">Third sort: powers to change other bodies</text>
<text x="48" y="304" font-size="12" text-anchor="start" fill="#333333">the sun's power to whiten wax (II.viii.23)</text>
<text x="48" y="320" font-size="11" text-anchor="start" fill="#333333" font-style="italic">not resemblances, and not thought to be</text>
<rect x="520" y="42" width="260" height="210" rx="6" fill="none" stroke="#111111" stroke-width="1.5"/>
<text x="650" y="64" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">IN THE MIND: ideas</text>
<rect x="536" y="76" width="228" height="80" rx="4" fill="#dcefe4" stroke="#2e8b57" stroke-width="1.2"/>
<text x="548" y="104" font-size="12" text-anchor="start" fill="#111111">ideas of figure, size,</text>
<text x="548" y="122" font-size="12" text-anchor="start" fill="#111111">motion, number</text>
<rect x="536" y="170" width="228" height="78" rx="4" fill="#ffffff" stroke="#d1495b" stroke-width="1.2"/>
<text x="548" y="198" font-size="12" text-anchor="start" fill="#111111">ideas of red, white,</text>
<text x="548" y="216" font-size="12" text-anchor="start" fill="#111111">sweet, warm</text>
<line x1="386" y1="120" x2="532" y2="120" stroke="#2e8b57" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="459" y="110" font-size="12" text-anchor="middle" fill="#2e8b57" font-weight="bold">resembles</text>
<text x="459" y="140" font-size="11" text-anchor="middle" fill="#2e8b57">(II.viii.15)</text>
<line x1="386" y1="212" x2="532" y2="212" stroke="#d1495b" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arr)"/>
<text x="459" y="202" font-size="12" text-anchor="middle" fill="#d1495b" font-weight="bold">does not resemble</text>
<text x="459" y="232" font-size="11" text-anchor="middle" fill="#d1495b">(II.viii.15)</text>
<rect x="20" y="356" width="380" height="64" rx="4" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="2,3"/>
<text x="32" y="378" font-size="12" text-anchor="start" fill="#333333" font-weight="bold">Underneath, supposed but unknown:</text>
<text x="32" y="396" font-size="12" text-anchor="start" fill="#333333">substance, the support of the qualities (II.xxiii)</text>
<text x="32" y="413" font-size="12" text-anchor="start" fill="#333333">real essence, the inner constitution (III.vi)</text>
<rect x="430" y="280" width="350" height="80" rx="4" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="2,3"/>
<text x="442" y="302" font-size="12" text-anchor="start" fill="#333333">The worry (IV.iv.3): the mind perceives</text>
<text x="442" y="320" font-size="12" text-anchor="start" fill="#333333">only its own ideas, so how can it check</text>
<text x="442" y="338" font-size="12" text-anchor="start" fill="#333333">either arrow against the body?</text>
</svg>
