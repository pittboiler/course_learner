<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="820" height="340" fill="#ffffff"/>
<text x="20" y="30" font-size="15" font-weight="bold" fill="#111">The debts of the parables, in denarii (log scale: each gridline is ten times the last)</text>
<line x1="320" y1="50" x2="320" y2="270" stroke="#bbbbbb" stroke-width="1"/>
<text x="320" y="288" font-size="11" fill="#333" text-anchor="middle">1</text>
<line x1="370" y1="50" x2="370" y2="270" stroke="#bbbbbb" stroke-width="1"/>
<text x="370" y="288" font-size="11" fill="#333" text-anchor="middle">10</text>
<line x1="420" y1="50" x2="420" y2="270" stroke="#bbbbbb" stroke-width="1"/>
<text x="420" y="288" font-size="11" fill="#333" text-anchor="middle">100</text>
<line x1="470" y1="50" x2="470" y2="270" stroke="#bbbbbb" stroke-width="1"/>
<text x="470" y="288" font-size="11" fill="#333" text-anchor="middle">1,000</text>
<line x1="520" y1="50" x2="520" y2="270" stroke="#bbbbbb" stroke-width="1"/>
<text x="520" y="288" font-size="11" fill="#333" text-anchor="middle">10k</text>
<line x1="570" y1="50" x2="570" y2="270" stroke="#bbbbbb" stroke-width="1"/>
<text x="570" y="288" font-size="11" fill="#333" text-anchor="middle">100k</text>
<line x1="620" y1="50" x2="620" y2="270" stroke="#bbbbbb" stroke-width="1"/>
<text x="620" y="288" font-size="11" fill="#333" text-anchor="middle">1M</text>
<line x1="670" y1="50" x2="670" y2="270" stroke="#bbbbbb" stroke-width="1"/>
<text x="670" y="288" font-size="11" fill="#333" text-anchor="middle">10M</text>
<line x1="720" y1="50" x2="720" y2="270" stroke="#bbbbbb" stroke-width="1"/>
<text x="720" y="288" font-size="11" fill="#333" text-anchor="middle">100M</text>
<text x="312" y="79" font-size="13" fill="#111" text-anchor="end">Luke 7:41, the smaller debtor</text>
<rect x="320" y="62" width="84.9" height="26" fill="#2e8b57"/>
<text x="410.9" y="79" font-size="13" fill="#111">50</text>
<text x="312" y="121" font-size="13" fill="#111" text-anchor="end">Matt 18:28, the fellow servant</text>
<rect x="320" y="104" width="100.0" height="26" fill="#1a6fb5"/>
<text x="426.0" y="121" font-size="13" fill="#111">100</text>
<text x="312" y="163" font-size="13" fill="#111" text-anchor="end">Luke 7:41, the larger debtor</text>
<rect x="320" y="146" width="134.9" height="26" fill="#2e8b57"/>
<text x="460.9" y="163" font-size="13" fill="#111">500</text>
<text x="312" y="205" font-size="13" fill="#111" text-anchor="end">490 fellow-servant debts (18:22)</text>
<rect x="320" y="188" width="234.5" height="26" fill="#1a6fb5"/>
<text x="560.5" y="205" font-size="13" fill="#111">49,000</text>
<text x="312" y="247" font-size="13" fill="#111" text-anchor="end">Matt 18:24, ten thousand talents</text>
<rect x="320" y="230" width="388.9" height="26" fill="#d1495b"/>
<text x="714.9" y="247" font-size="13" fill="#111">60,000,000</text>
<text x="20" y="315" font-size="12" fill="#333">1 talent = 6,000 denarii (assumed); a denarius is a day&#8217;s wage (Matt 20:2). The two debts of Matt 18 stand at 600,000 to 1.</text>
</svg>
