<text x="468" y="94" font-size="12" text-anchor="start" fill="#333333">|0&gt; = H, |1&gt; = V</text>
<text x="468" y="114" font-size="12" text-anchor="start" fill="#333333">Stokes vector = Bloch vector</text>
<text x="468" y="134" font-size="12" text-anchor="start" fill="#333333">D = (H+V)/sqrt2 on +x</text>
<text x="468" y="154" font-size="12" text-anchor="start" fill="#333333">R = (H-iV)/sqrt2 on -y</text>
<text x="468" y="174" font-size="12" text-anchor="start" fill="#333333">L = (H+iV)/sqrt2 on +y</text>
<text x="468" y="194" font-size="12" text-anchor="start" fill="#333333">Linear states: x-z circle</text>
<text x="468" y="214" font-size="12" text-anchor="start" fill="#333333">Real angle t sits at 2t on it</text>
<text x="468" y="234" font-size="12" text-anchor="start" fill="#333333">Orthogonal = antipodal</text>
<text x="468" y="254" font-size="12" text-anchor="start" fill="#333333">Equator: D, A, R, L</text>
