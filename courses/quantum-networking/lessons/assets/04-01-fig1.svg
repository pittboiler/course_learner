<text x="450" y="80" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Two probes fix the rotation</text>
<text x="450" y="102" font-size="13" text-anchor="start" fill="#333333">H in and D in are known.</text>
<text x="450" y="124" font-size="13" text-anchor="start" fill="#333333">The fiber turns them to</text>
<text x="450" y="146" font-size="13" text-anchor="start" fill="#333333">H out and D out (blue).</text>
<text x="450" y="190" font-size="13" text-anchor="start" fill="#d1495b" font-weight="bold">One probe is not enough</text>
<text x="450" y="212" font-size="13" text-anchor="start" fill="#333333">Knowing only H out, D out</text>
<text x="450" y="234" font-size="13" text-anchor="start" fill="#333333">could sit anywhere on the</text>
<text x="450" y="256" font-size="13" text-anchor="start" fill="#333333">red circle: every turn about</text>
<text x="450" y="278" font-size="13" text-anchor="start" fill="#333333">the H out axis fits the data.</text>
<text x="450" y="322" font-size="13" text-anchor="start" fill="#333333">Thin dashes: back of sphere.</text>
