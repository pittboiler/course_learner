<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<rect x="0" y="0" width="800" height="390" fill="#ffffff"/>
<line x1="30" y1="240" x2="185" y2="240" stroke="#d1495b" stroke-width="2.5"/>
<text x="30" y="228" font-size="12" text-anchor="start" fill="#d1495b">photon from link 1</text>
<line x1="200" y1="372" x2="200" y2="255" stroke="#d1495b" stroke-width="2.5"/>
<text x="212" y="368" font-size="12" text-anchor="start" fill="#d1495b">photon from link 2</text>
<rect x="185" y="225" width="30" height="30" rx="0" fill="#dbe8f5" stroke="#111111" stroke-width="1.5"/>
<line x1="185" y1="255" x2="215" y2="225" stroke="#111111" stroke-width="1.5"/>
<text x="160" y="280" font-size="12" text-anchor="end" fill="#333333">50:50 BS</text>
<line x1="215" y1="240" x2="315" y2="240" stroke="#1a6fb5" stroke-width="2"/>
<text x="262" y="232" font-size="13" text-anchor="middle" fill="#1a6fb5" font-weight="bold">c</text>
<rect x="315" y="225" width="30" height="30" rx="0" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<line x1="315" y1="255" x2="345" y2="225" stroke="#111111" stroke-width="1.5"/>
<text x="330" y="215" font-size="12" text-anchor="middle" fill="#333333">PBS</text>
<line x1="345" y1="240" x2="400" y2="240" stroke="#1a6fb5" stroke-width="2"/>
<text x="372" y="232" font-size="12" text-anchor="middle" fill="#333333">H</text>
<rect x="400" y="222" width="56" height="36" rx="4" fill="#eeeeee" stroke="#111111" stroke-width="1.5"/>
<text x="428" y="245" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">c_H</text>
<line x1="330" y1="255" x2="330" y2="300" stroke="#1a6fb5" stroke-width="2"/>
<text x="338" y="282" font-size="12" text-anchor="start" fill="#333333">V</text>
<rect x="302" y="300" width="56" height="36" rx="4" fill="#eeeeee" stroke="#111111" stroke-width="1.5"/>
<text x="330" y="323" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">c_V</text>
<line x1="200" y1="225" x2="200" y2="140" stroke="#1a6fb5" stroke-width="2"/>
<text x="190" y="186" font-size="13" text-anchor="end" fill="#1a6fb5" font-weight="bold">d</text>
<rect x="185" y="110" width="30" height="30" rx="0" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<line x1="185" y1="140" x2="215" y2="110" stroke="#111111" stroke-width="1.5"/>
<text x="222" y="130" font-size="12" text-anchor="start" fill="#333333">PBS</text>
<line x1="200" y1="110" x2="200" y2="66" stroke="#1a6fb5" stroke-width="2"/>
<text x="208" y="92" font-size="12" text-anchor="start" fill="#333333">H</text>
<rect x="172" y="30" width="56" height="36" rx="4" fill="#eeeeee" stroke="#111111" stroke-width="1.5"/>
<text x="200" y="53" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">d_H</text>
<line x1="185" y1="125" x2="120" y2="125" stroke="#1a6fb5" stroke-width="2"/>
<text x="152" y="117" font-size="12" text-anchor="middle" fill="#333333">V</text>
<rect x="64" y="107" width="56" height="36" rx="4" fill="#eeeeee" stroke="#111111" stroke-width="1.5"/>
<text x="92" y="130" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">d_V</text>
<text x="490" y="40" font-size="14" text-anchor="start" fill="#111111" font-weight="bold">Two clicks seen</text>
<text x="790" y="40" font-size="14" text-anchor="end" fill="#111111" font-weight="bold">Bell state</text>
<line x1="490" y1="50" x2="790" y2="50" stroke="#333333" stroke-width="1"/>
<rect x="490" y="62" width="300" height="72" rx="4" fill="#dbe8f5" stroke="#1a6fb5" stroke-width="1.2"/>
<text x="500" y="84" font-size="13" text-anchor="start" fill="#111111">c_H + d_V  or  c_V + d_H</text>
<text x="780" y="84" font-size="14" text-anchor="end" fill="#1a6fb5" font-weight="bold">Ψ−</text>
<text x="500" y="106" font-size="12" text-anchor="start" fill="#333333">one photon per output,</text>
<text x="500" y="123" font-size="12" text-anchor="start" fill="#333333">crossed polarizations</text>
<rect x="490" y="146" width="300" height="72" rx="4" fill="#dcefe4" stroke="#2e8b57" stroke-width="1.2"/>
<text x="500" y="168" font-size="13" text-anchor="start" fill="#111111">c_H + c_V  or  d_H + d_V</text>
<text x="780" y="168" font-size="14" text-anchor="end" fill="#2e8b57" font-weight="bold">Ψ+</text>
<text x="500" y="190" font-size="12" text-anchor="start" fill="#333333">both in one output,</text>
<text x="500" y="207" font-size="12" text-anchor="start" fill="#333333">crossed polarizations</text>
<rect x="490" y="230" width="300" height="72" rx="4" fill="#f6dde1" stroke="#d1495b" stroke-width="1.2"/>
<text x="500" y="252" font-size="13" text-anchor="start" fill="#111111">both photons in one detector</text>
<text x="780" y="252" font-size="14" text-anchor="end" fill="#d1495b" font-weight="bold">Φ+ or Φ−</text>
<text x="500" y="274" font-size="12" text-anchor="start" fill="#333333">same output, same polarization:</text>
<text x="500" y="291" font-size="12" text-anchor="start" fill="#333333">the two cannot be told apart</text>
<text x="490" y="332" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">Identified: 2 of the 4 Bell states,</text>
<text x="490" y="352" font-size="13" text-anchor="start" fill="#111111" font-weight="bold">so success is 50% at best</text>
</svg>
