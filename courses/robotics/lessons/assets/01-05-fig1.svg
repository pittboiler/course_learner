<svg viewBox="0 0 660 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Left: a chain of frames, and a point&#8217;s coordinates propagating back to the base.   Right: the block structure.</text>
  <line x1="60.0" y1="250.0" x2="100.0" y2="250.0" stroke="#8a8a8a" stroke-width="1.8"/>
  <polygon points="100.0,250.0 94.5,252.3 94.5,247.7" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <line x1="60.0" y1="250.0" x2="60.0" y2="210.0" stroke="#8a8a8a" stroke-width="1.8"/>
  <polygon points="60.0,210.0 62.3,215.5 57.7,215.5" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <circle cx="60.0" cy="250.0" r="3.0" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="1"/>
  <text x="50.0" y="266.0" fill="#8a8a8a" font-size="11" text-anchor="end">{0}</text>
  <line x1="190.0" y1="180.0" x2="226.3" y2="163.1" stroke="#4a90d9" stroke-width="1.8"/>
  <polygon points="226.3,163.1 222.2,167.5 220.3,163.3" stroke="#4a90d9" fill="#4a90d9" fill-opacity="1" stroke-width="0.5"/>
  <line x1="190.0" y1="180.0" x2="173.1" y2="143.7" stroke="#4a90d9" stroke-width="1.8"/>
  <polygon points="173.1,143.7 177.5,147.8 173.3,149.7" stroke="#4a90d9" fill="#4a90d9" fill-opacity="1" stroke-width="0.5"/>
  <circle cx="190.0" cy="180.0" r="3.0" stroke="#4a90d9" fill="#4a90d9" fill-opacity="1" stroke-width="1"/>
  <text x="180.0" y="196.0" fill="#4a90d9" font-size="11" text-anchor="end">{1}</text>
  <line x1="330.0" y1="240.0" x2="368.6" y2="250.4" stroke="#e0645c" stroke-width="1.8"/>
  <polygon points="368.6,250.4 362.7,251.2 363.9,246.7" stroke="#e0645c" fill="#e0645c" fill-opacity="1" stroke-width="0.5"/>
  <line x1="330.0" y1="240.0" x2="340.4" y2="201.4" stroke="#e0645c" stroke-width="1.8"/>
  <polygon points="340.4,201.4 341.2,207.3 336.7,206.1" stroke="#e0645c" fill="#e0645c" fill-opacity="1" stroke-width="0.5"/>
  <circle cx="330.0" cy="240.0" r="3.0" stroke="#e0645c" fill="#e0645c" fill-opacity="1" stroke-width="1"/>
  <text x="320.0" y="256.0" fill="#e0645c" font-size="11" text-anchor="end">{2}</text>
  <line x1="84.0" y1="242.0" x2="168.0" y2="192.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="168.0,192.0 163.9,197.6 161.1,193.0" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <text x="126.0" y="206.0" fill="#8a8a8a" font-size="10" text-anchor="middle"><tspan font-size="0.72em" dy="-4">0</tspan><tspan font-size="0.72em" dy="7">1</tspan><tspan dy="-3">T</tspan></text>
  <line x1="214.0" y1="178.0" x2="308.0" y2="224.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="308.0,224.0 301.0,223.6 303.4,218.7" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <text x="262.0" y="192.0" fill="#8a8a8a" font-size="10" text-anchor="middle"><tspan font-size="0.72em" dy="-4">1</tspan><tspan font-size="0.72em" dy="7">2</tspan><tspan dy="-3">T</tspan></text>
  <circle cx="400.0" cy="180.0" r="5.0" stroke="#e0645c" fill="#e0645c" fill-opacity="1" stroke-width="1"/>
  <text x="410.0" y="174.0" fill="#e0645c" font-size="11" text-anchor="start">P</text>
  <line x1="400.0" y1="180.0" x2="330.0" y2="240.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="330.0" y1="240.0" x2="190.0" y2="180.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="190.0" y1="180.0" x2="60.0" y2="250.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="230.0" y="296.0" fill="#8a8a8a" font-size="12" text-anchor="middle"><tspan font-size="0.72em" dy="-4">0</tspan><tspan dy="4">P = </tspan><tspan font-size="0.72em" dy="-4">0</tspan><tspan font-size="0.72em" dy="7">1</tspan><tspan dy="-3">T </tspan><tspan font-size="0.72em" dy="-4">1</tspan><tspan font-size="0.72em" dy="7">2</tspan><tspan dy="-3">T </tspan><tspan font-size="0.72em" dy="-4">2</tspan><tspan dy="4">P</tspan></text>
  <text x="230.0" y="318.0" fill="#8a8a8a" font-size="10" text-anchor="middle">adjacent subscripts cancel</text>
  <rect x="430.0" y="90.0" width="132.0" height="132.0" stroke="#4a90d9" fill="#4a90d9" fill-opacity="0.16" stroke-width="1.6" rx="0"/>
  <text x="496.0" y="162.0" fill="#4a90d9" font-size="12" text-anchor="middle">R  (3&#215;3)</text>
  <rect x="562.0" y="90.0" width="50.0" height="132.0" stroke="#e0645c" fill="#e0645c" fill-opacity="0.16" stroke-width="1.6" rx="0"/>
  <text x="587.0" y="162.0" fill="#e0645c" font-size="13" text-anchor="middle">p</text>
  <rect x="430.0" y="222.0" width="132.0" height="32.0" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="0.05" stroke-width="1.6" rx="0"/>
  <text x="496.0" y="243.0" fill="#8a8a8a" font-size="11" text-anchor="middle">0  0  0</text>
  <rect x="562.0" y="222.0" width="50.0" height="32.0" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="0.05" stroke-width="1.6" rx="0"/>
  <text x="587.0" y="243.0" fill="#8a8a8a" font-size="11" text-anchor="middle">1</text>
  <text x="510.0" y="76.0" fill="#8a8a8a" font-size="13" text-anchor="middle"><tspan font-size="0.72em" dy="-4">A</tspan><tspan font-size="0.72em" dy="7">B</tspan><tspan dy="-3">T</tspan></text>
  <text x="426.0" y="340.0" fill="#8a8a8a" font-size="11" text-anchor="start">inverse:</text>
  <text x="426.0" y="366.0" fill="#e0645c" font-size="12" text-anchor="start">R&#8868;  and  &#8722;R&#8868;p</text>
  <text x="426.0" y="390.0" fill="#8a8a8a" font-size="10" text-anchor="start">never a transpose of the whole matrix</text>
  <text x="30.0" y="424.0" fill="#8a8a8a" font-size="11" text-anchor="start">Points carry a fourth coordinate of 1; free vectors carry 0, so they rotate but never translate.</text>
</svg>
