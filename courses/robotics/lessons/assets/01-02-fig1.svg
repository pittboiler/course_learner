  <line x1="510.0" y1="190.0" x2="562.0" y2="190.0" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="528.0" y="224.0" fill="#8a8a8a" font-size="9" text-anchor="middle">R<tspan font-size="0.72em" dy="3">y</tspan><tspan dy="-3"> then R</tspan><tspan font-size="0.72em" dy="3">z</tspan><tspan dy="-3"> </tspan></text>
  <line x1="460.0" y1="112.0" x2="418.0" y2="166.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="418.0,166.0 419.8,159.2 424.1,162.6" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <line x1="480.0" y1="112.0" x2="522.0" y2="166.0" stroke="#8a8a8a" stroke-width="1.4"/>
  <polygon points="522.0,166.0 515.9,162.6 520.2,159.2" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <text x="470.0" y="244.0" fill="#e0645c" font-size="11" text-anchor="middle">different results</text>
  <text x="470.0" y="266.0" fill="#e0645c" font-size="11" text-anchor="middle">R<tspan font-size="0.72em" dy="3">1</tspan><tspan dy="-3">R</tspan><tspan font-size="0.72em" dy="3">2</tspan><tspan dy="-3"> &#8800; R</tspan><tspan font-size="0.72em" dy="3">2</tspan><tspan dy="-3">R</tspan><tspan font-size="0.72em" dy="3">1</tspan><tspan dy="-3"> </tspan></text>
  <text x="470.0" y="296.0" fill="#8a8a8a" font-size="10" text-anchor="middle">rotation is not commutative &#8212;</text>
  <text x="470.0" y="314.0" fill="#8a8a8a" font-size="10" text-anchor="middle">a fact about space, not notation</text>
  <text x="30.0" y="384.0" fill="#8a8a8a" font-size="11" text-anchor="start">R<tspan font-size="0.72em" dy="-4">&#8868;</tspan><tspan dy="4">R = I and det R = +1, so the inverse is the transpose and no matrix is ever inverted.</tspan></text>
</svg>
