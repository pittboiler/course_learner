  <line x1="120.0" y1="190.0" x2="75.3" y2="126.1" stroke="#4a90d9" stroke-width="2.2"/>
  <polygon points="75.3,126.1 81.2,129.8 76.7,133.0" stroke="#4a90d9" fill="#4a90d9" fill-opacity="1" stroke-width="0.5"/>
