<svg viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Left: kinetic energy is a quadratic form assembled from per-link Jacobians.   Right: the recipe.</text>
