  <text x="147.2" y="182.4" fill="#e0645c" font-size="10" text-anchor="start">c<tspan font-size="0.72em" dy="3">1</tspan><tspan dy="-3"> </tspan></text>
  <line x1="135.2" y1="190.4" x2="169.2" y2="172.4" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="169.2,172.4 165.4,177.1 163.3,173.0" stroke="#4a90d9" fill="#4a90d9" fill-opacity="1" stroke-width="0.5"/>
  <text x="175.2" y="170.4" fill="#4a90d9" font-size="9" text-anchor="start">v<tspan font-size="0.72em" dy="3">c1</tspan><tspan dy="-3"> </tspan></text>
  <circle cx="205.2" cy="170.2" r="7.0" stroke="#e0645c" fill="#e0645c" fill-opacity="0.3" stroke-width="1.6"/>
  <text x="217.2" y="162.2" fill="#e0645c" font-size="10" text-anchor="start">c<tspan font-size="0.72em" dy="3">2</tspan><tspan dy="-3"> </tspan></text>
  <line x1="205.2" y1="170.2" x2="239.2" y2="152.2" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="239.2,152.2 235.5,156.8 233.3,152.7" stroke="#4a90d9" fill="#4a90d9" fill-opacity="1" stroke-width="0.5"/>
