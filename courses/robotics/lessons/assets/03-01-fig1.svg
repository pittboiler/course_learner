  <text x="84.0" y="278.0" fill="#8a8a8a" font-size="10" text-anchor="start">each centre of mass has its own Jacobian J<tspan font-size="0.72em" dy="3">v_i</tspan><tspan dy="-3"> </tspan></text>
  <text x="316.0" y="66.0" fill="#8a8a8a" font-size="12" text-anchor="middle">M(q)</text>
  <rect x="250.0" y="80.0" width="66.0" height="40.0" stroke="#8a8a8a" fill="#4a90d9" fill-opacity="0.16" stroke-width="1.2" rx="0"/>
  <rect x="316.0" y="80.0" width="66.0" height="40.0" stroke="#8a8a8a" fill="#e0645c" fill-opacity="0.08" stroke-width="1.2" rx="0"/>
  <rect x="250.0" y="120.0" width="66.0" height="40.0" stroke="#8a8a8a" fill="#e0645c" fill-opacity="0.08" stroke-width="1.2" rx="0"/>
  <rect x="316.0" y="120.0" width="66.0" height="40.0" stroke="#8a8a8a" fill="#4a90d9" fill-opacity="0.16" stroke-width="1.2" rx="0"/>
  <text x="283.0" y="105.0" fill="#4a90d9" font-size="11" text-anchor="middle">M&#8321;&#8321;</text>
  <text x="349.0" y="105.0" fill="#e0645c" font-size="11" text-anchor="middle">M&#8321;&#8322;</text>
  <text x="283.0" y="145.0" fill="#e0645c" font-size="11" text-anchor="middle">M&#8322;&#8321;</text>
  <text x="349.0" y="145.0" fill="#4a90d9" font-size="11" text-anchor="middle">M&#8322;&#8322;</text>
  <text x="390.0" y="102.0" fill="#4a90d9" font-size="9" text-anchor="start">effective inertia</text>
  <text x="390.0" y="148.0" fill="#e0645c" font-size="9" text-anchor="start">inertial coupling</text>
  <text x="220.0" y="192.0" fill="#8a8a8a" font-size="12" text-anchor="start">T = &#189; q&#775;&#8868; M(q) q&#775;</text>
  <text x="220.0" y="214.0" fill="#8a8a8a" font-size="10" text-anchor="start">M = &#931;<tspan font-size="0.72em" dy="3">i</tspan><tspan dy="-3"> [ m</tspan><tspan font-size="0.72em" dy="3">i</tspan><tspan dy="-3"> J</tspan><tspan font-size="0.72em" dy="3">v_i</tspan><tspan dy="-3">&#8868;J</tspan><tspan font-size="0.72em" dy="3">v_i</tspan><tspan dy="-3"> + J</tspan><tspan font-size="0.72em" dy="3">&#969;_i</tspan><tspan dy="-3">&#8868; I</tspan><tspan font-size="0.72em" dy="3">i</tspan><tspan dy="-3"> J</tspan><tspan font-size="0.72em" dy="3">&#969;_i</tspan><tspan dy="-3"> ]</tspan></text>
  <rect x="440.0" y="80.0" width="196.0" height="36.0" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="0.05" stroke-width="1.2" rx="4"/>
  <text x="538.0" y="102.0" fill="#8a8a8a" font-size="10" text-anchor="middle">choose generalized coordinates q</text>
  <line x1="538.0" y1="116.0" x2="538.0" y2="132.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="538.0,132.0 536.1,127.4 539.9,127.4" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <rect x="440.0" y="134.0" width="196.0" height="36.0" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="0.05" stroke-width="1.2" rx="4"/>
  <text x="538.0" y="156.0" fill="#8a8a8a" font-size="10" text-anchor="middle">write T and V</text>
  <line x1="538.0" y1="170.0" x2="538.0" y2="186.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="538.0,186.0 536.1,181.4 539.9,181.4" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <rect x="440.0" y="188.0" width="196.0" height="36.0" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="0.05" stroke-width="1.2" rx="4"/>
  <text x="538.0" y="210.0" fill="#8a8a8a" font-size="10" text-anchor="middle">form L = T &#8722; V</text>
  <line x1="538.0" y1="224.0" x2="538.0" y2="240.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="538.0,240.0 536.1,235.4 539.9,235.4" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <rect x="440.0" y="242.0" width="196.0" height="36.0" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="0.05" stroke-width="1.2" rx="4"/>
  <text x="538.0" y="264.0" fill="#8a8a8a" font-size="10" text-anchor="middle">apply Euler&#8211;Lagrange per joint</text>
  <line x1="538.0" y1="278.0" x2="538.0" y2="298.0" stroke="#8a8a8a" stroke-width="1.3"/>
  <polygon points="538.0,298.0 536.1,293.4 539.9,293.4" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="0.5"/>
  <rect x="426.0" y="300.0" width="224.0" height="44.0" stroke="#e0645c" fill="#e0645c" fill-opacity="0.1" stroke-width="1.4" rx="4"/>
  <text x="538.0" y="326.0" fill="#e0645c" font-size="13" text-anchor="middle">M q&#776; + C q&#775; + g = &#964;</text>
  <text x="538.0" y="368.0" fill="#8a8a8a" font-size="9" text-anchor="middle">inertia   velocity terms   gravity</text>
  <text x="30.0" y="384.0" fill="#8a8a8a" font-size="11" text-anchor="start">No free-body diagrams and no constraint forces &#8212; two scalars in, a vector equation out.</text>
</svg>
