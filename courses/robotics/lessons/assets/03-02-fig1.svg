  <text x="492.4" y="161.2" fill="#4a90d9" font-size="11" text-anchor="start">M&#8321;&#8321;</text>
  <line x1="400.0" y1="276.6" x2="620.0" y2="276.6" stroke="#e0645c" stroke-width="2.2"/>
  <text x="536.4" y="268.6" fill="#e0645c" font-size="10" text-anchor="start">M&#8322;&#8322; (constant)</text>
  <text x="400.0" y="312.0" fill="#8a8a8a" font-size="9" text-anchor="middle">0</text>
  <text x="510.0" y="312.0" fill="#8a8a8a" font-size="9" text-anchor="middle">90</text>
  <text x="620.0" y="312.0" fill="#8a8a8a" font-size="9" text-anchor="middle">180</text>
  <circle cx="400.0" cy="126.8" r="4.0" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="1"/>
  <text x="406.0" y="118.8" fill="#8a8a8a" font-size="9" text-anchor="start">extended</text>
  <circle cx="620.0" cy="243.7" r="4.0" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="1"/>
  <text x="616.0" y="235.7" fill="#8a8a8a" font-size="9" text-anchor="end">folded</text>
  <text x="400.0" y="348.0" fill="#8a8a8a" font-size="10" text-anchor="start">a factor of three &#8212; so a gain tuned at one</text>
  <text x="400.0" y="366.0" fill="#8a8a8a" font-size="10" text-anchor="start">configuration is mistuned at another</text>
  <text x="30.0" y="374.0" fill="#8a8a8a" font-size="10" text-anchor="start">&#7813;M &#8722; 2C skew-symmetric means the Coriolis forces do no net work &#8212; which is what makes passivity proofs possible.</text>
</svg>
