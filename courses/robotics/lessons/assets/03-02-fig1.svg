<svg viewBox="0 0 660 390" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Left: four terms, four physical jobs.   Right: why fixed gains cannot work.</text>
  <rect x="40.0" y="90.0" width="92.0" height="44.0" stroke="#4a90d9" fill="#4a90d9" fill-opacity="0.14" stroke-width="1.5" rx="4"/>
  <text x="86.0" y="118.0" fill="#4a90d9" font-size="13" text-anchor="middle">M(q) q&#776;</text>
  <text x="144.0" y="110.0" fill="#8a8a8a" font-size="10" text-anchor="start">inertia &#8212; off-diagonals couple the joints</text>
  <text x="144.0" y="128.0" fill="#4a90d9" font-size="9" text-anchor="start">symmetric, positive definite</text>
  <rect x="40.0" y="152.0" width="92.0" height="44.0" stroke="#e0645c" fill="#e0645c" fill-opacity="0.14" stroke-width="1.5" rx="4"/>
  <text x="86.0" y="180.0" fill="#e0645c" font-size="13" text-anchor="middle">C(q,q&#775;) q&#775;</text>
  <text x="144.0" y="172.0" fill="#8a8a8a" font-size="10" text-anchor="start">Coriolis and centrifugal &#8212; scales as q&#775;&#178;</text>
  <text x="144.0" y="190.0" fill="#e0645c" font-size="9" text-anchor="start">zero at rest, dominant at speed</text>
  <rect x="40.0" y="214.0" width="92.0" height="44.0" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="0.14" stroke-width="1.5" rx="4"/>
  <text x="86.0" y="242.0" fill="#8a8a8a" font-size="13" text-anchor="middle">g(q)</text>
  <text x="144.0" y="234.0" fill="#8a8a8a" font-size="10" text-anchor="start">gravity &#8212; configuration only</text>
  <text x="144.0" y="252.0" fill="#8a8a8a" font-size="9" text-anchor="start">largest term on a slow arm</text>
  <rect x="40.0" y="276.0" width="92.0" height="44.0" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="0.14" stroke-width="1.5" rx="4"/>
  <text x="86.0" y="304.0" fill="#8a8a8a" font-size="13" text-anchor="middle">&#964;</text>
  <text x="144.0" y="296.0" fill="#8a8a8a" font-size="10" text-anchor="start">applied joint torque</text>
  <text x="144.0" y="314.0" fill="#8a8a8a" font-size="9" text-anchor="start">plus J&#8868;F<tspan font-size="0.72em" dy="3">e</tspan><tspan dy="-3">xt when in contact</tspan></text>
  <line x1="400.0" y1="300.0" x2="620.0" y2="300.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="400.0" y1="300.0" x2="400.0" y2="100.0" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="510.0" y="322.0" fill="#8a8a8a" font-size="10" text-anchor="middle">&#952;&#8322;  (degrees)</text>
  <text x="404.0" y="94.0" fill="#8a8a8a" font-size="10" text-anchor="start">inertia (kg m&#178;)</text>
  <path d="M 400.00 126.81 L 401.22 126.82 L 402.44 126.84 L 403.67 126.89 L 404.89 126.95 L 406.11 127.03 L 407.33 127.13 L 408.56 127.24 L 409.78 127.38 L 411.00 127.53 L 412.22 127.70 L 413.44 127.88 L 414.67 128.09 L 415.89 128.31 L 417.11 128.54 L 418.33 128.80 L 419.56 129.07 L 420.78 129.36 L 422.00 129.67 L 423.22 129.99 L 424.44 130.33 L 425.67 130.69 L 426.89 131.06 L 428.11 131.46 L 429.33 131.86 L 430.56 132.29 L 431.78 132.72 L 433.00 133.18 L 434.22 133.65 L 435.44 134.14 L 436.67 134.64 L 437.89 135.16 L 439.11 135.69 L 440.33 136.24 L 441.56 136.80 L 442.78 137.38 L 444.00 137.97 L 445.22 138.58 L 446.44 139.20 L 447.67 139.84 L 448.89 140.49 L 450.11 141.15 L 451.33 141.82 L 452.56 142.51 L 453.78 143.22 L 455.00 143.93 L 456.22 144.66 L 457.44 145.40 L 458.67 146.15 L 459.89 146.92 L 461.11 147.69 L 462.33 148.48 L 463.56 149.28 L 464.78 150.09 L 466.00 150.91 L 467.22 151.74 L 468.44 152.58 L 469.67 153.43 L 470.89 154.29 L 472.11 155.16 L 473.33 156.04 L 474.56 156.93 L 475.78 157.82 L 477.00 158.73 L 478.22 159.64 L 479.44 160.56 L 480.67 161.49 L 481.89 162.43 L 483.11 163.37 L 484.33 164.32 L 485.56 165.27 L 486.78 166.24 L 488.00 167.20 L 489.22 168.18 L 490.44 169.16 L 491.67 170.14 L 492.89 171.13 L 494.11 172.12 L 495.33 173.11 L 496.56 174.11 L 497.78 175.12 L 499.00 176.12 L 500.22 177.13 L 501.44 178.14 L 502.67 179.16 L 503.89 180.17 L 505.11 181.19 L 506.33 182.21 L 507.56 183.23 L 508.78 184.25 L 510.00 185.27 L 511.22 186.29 L 512.44 187.31 L 513.67 188.33 L 514.89 189.35 L 516.11 190.36 L 517.33 191.38 L 518.56 192.39 L 519.78 193.41 L 521.00 194.41 L 522.22 195.42 L 523.44 196.42 L 524.67 197.42 L 525.89 198.42 L 527.11 199.41 L 528.33 200.40 L 529.56 201.38 L 530.78 202.36 L 532.00 203.33 L 533.22 204.30 L 534.44 205.26 L 535.67 206.22 L 536.89 207.17 L 538.11 208.11 L 539.33 209.05 L 540.56 209.98 L 541.78 210.90 L 543.00 211.81 L 544.22 212.72 L 545.44 213.61 L 546.67 214.50 L 547.89 215.38 L 549.11 216.25 L 550.33 217.11 L 551