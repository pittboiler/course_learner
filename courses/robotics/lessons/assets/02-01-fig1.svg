<svg viewBox="0 0 660 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="20" y="20" fill="#8a8a8a" font-style="italic">Left: two solutions to the same request, and the triangle the cosine law lives on.   Right: decoupling.</text>
  <circle cx="110.0" cy="240.0" r="178.0" stroke="#8a8a8a" fill="none" fill-opacity="5 4" stroke-width="0.8"/>
  <circle cx="110.0" cy="240.0" r="22.0" stroke="#8a8a8a" fill="none" fill-opacity="5 4" stroke-width="0.8"/>
  <line x1="110.0" y1="240.0" x2="203.0" y2="203.2" stroke="#4a90d9" stroke-width="3"/>
  <line x1="203.0" y1="203.2" x2="260.0" y2="150.0" stroke="#4a90d9" stroke-width="3"/>
  <circle cx="203.0" cy="203.2" r="5.0" stroke="#4a90d9" fill="#4a90d9" fill-opacity="1" stroke-width="1"/>
  <text x="217.0" y="219.2" fill="#4a90d9" font-size="9" text-anchor="start">elbow-down</text>
  <line x1="110.0" y1="240.0" x2="186.2" y2="175.2" stroke="#e0645c" stroke-width="3"/>
  <line x1="186.2" y1="175.2" x2="260.0" y2="150.0" stroke="#e0645c" stroke-width="3"/>
  <circle cx="186.2" cy="175.2" r="5.0" stroke="#e0645c" fill="#e0645c" fill-opacity="1" stroke-width="1"/>
  <text x="172.2" y="167.2" fill="#e0645c" font-size="9" text-anchor="end">elbow-up</text>
  <circle cx="110.0" cy="240.0" r="5.0" stroke="#8a8a8a" fill="#8a8a8a" fill-opacity="1" stroke-width="1"/>
  <circle cx="260.0" cy="150.0" r="5.0" stroke="#8a8a8a" fill="none" fill-opacity="1" stroke-width="2"/>
  <line x1="110.0" y1="240.0" x2="260.0" y2="150.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="191.0" y="211.0" fill="#8a8a8a" font-size="10" text-anchor="start">r</text>
  <text x="110.0" y="432.0" fill="#8a8a8a" font-size="10" text-anchor="middle">reachable annulus |L&#8321;&#8722;L&#8322;| &#8804; r &#8804; L&#8321;+L&#8322;</text>
  <text x="30.0" y="392.0" fill="#8a8a8a" font-size="11" text-anchor="start">cos &#952;&#8322; = (x&#178;+y&#178;&#8722;L&#8321;&#178;&#8722;L&#8322;&#178;)/(2L&#8321;L&#8322;)  &#8212;  out of range means unreachable</text>
  <line x1="400.0" y1="260.0" x2="450.0" y2="200.0" stroke="#8a8a8a" stroke-width="3.2"/>
  <circle cx="400.0" cy="260.0" r="6.0" stroke="#4a90d9" fill="#4a90d9" fill-opacity="0.25" stroke-width="1.4"/>
  <line x1="450.0" y1="200.0" x2="510.0" y2="180.0" stroke="#8a8a8a" stroke-width="3.2"/>
  <circle cx="450.0" cy="200.0" r="6.0" stroke="#4a90d9" fill="#4a90d9" fill-opacity="0.25" stroke-width="1.4"/>
  <circle cx="510.0" cy="180.0" r="9.0" stroke="#e0645c" fill="#e0645c" fill-opacity="0.2" stroke-width="2"/>
  <text x="504.0" y="164.0" fill="#e0645c" font-size="10" text-anchor="end">wrist centre</text>
  <line x1="510.0" y1="180.0" x2="572.0" y2="206.0" stroke="#8a8a8a" stroke-width="3"/>
  <circle cx="572.0" cy="206.0" r="5.0" stroke="#8a8a8a" fill="none" fill-opacity="1" stroke-width="2"/>
  <text x="582.0" y="210.0" fill="#8a8a8a" font-size="10" text-anchor="start">tool</text>
  <line x1="572.0" y1="206.0" x2="518.0" y2="184.0" stroke="#e0645c" stroke-width="1.6"/>
  <polygon points="518.0,184.0 524.0,183.9 522.2,188.2" stroke="#e0645c" fill="#e0645c" fill-opacity="1" stroke-width="0.5"/>
  <text x="550.0" y="232.0" fill="#e0645c" font-size="10" text-anchor="middle">&#8722;d&#8326; z&#8326;</text>
  <line x1="550.0" y1="150.0" x2="550.0" y2="320.0" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="462.0" y="338.0" fill="#4a90d9" font-size="10" text-anchor="middle">joints 1&#8211;3:</text>
  <text x="462.0" y="356.0" fill="#4a90d9" font-size="10" text-anchor="middle">position the wrist centre</text>
  <text x="606.0" y="338.0" fill="#e0645c" font-size="10" text-anchor="middle">joints 4&#8211;6:</text>
  <text x="606.0" y="356.0" fill="#e0645c" font-size="10" text-anchor="middle">orient the tool</text>
  <text x="394.0" y="392.0" fill="#8a8a8a" font-size="10" text-anchor="start">p<tspan font-size="0.72em" dy="3">w</tspan><tspan dy="-3"> = p</tspan><tspan font-size="0.72em" dy="3">t</tspan><tspan dy="-3">ool &#8722; d&#8326; </tspan><tspan font-size="0.72em" dy="-4">0</tspan><tspan font-size="0.72em" dy="7">6</tspan><tspan dy="-3">R z&#8326;  &#8212; computable from</tspan></text>
  <text x="394.0" y="408.0" fill="#8a8a8a" font-size="10" text-anchor="start">the desired pose alone, before any joint is known</text>
</svg>
