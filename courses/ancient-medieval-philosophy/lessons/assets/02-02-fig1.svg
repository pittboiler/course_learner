<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img">
  <text x="10" y="20" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#8a8a8a">The Divided Line (Republic VI, 509d-511e), drawn with lengths 1 : 2 : 2 : 4 from the bottom.</text>

  <text x="20" y="175" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a90d9">INTELLIGIBLE</text>
  <text x="20" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a">known by thought</text>
  <path d="M160 62 L150 62 L150 298 L160 298" fill="none" stroke="#4a90d9" stroke-width="1.5"/>

  <text x="20" y="360" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8a8a8a">VISIBLE</text>
  <text x="20" y="377" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a">known by sight</text>
  <path d="M160 302 L150 302 L150 418 L160 418" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>

  <line x1="200" y1="60" x2="200" y2="220" stroke="#4a90d9" stroke-width="8"/>
  <line x1="200" y1="220" x2="200" y2="300" stroke="#4a90d9" stroke-width="5"/>
  <line x1="200" y1="300" x2="200" y2="380" stroke="#8a8a8a" stroke-width="5"/>
  <line x1="200" y1="380" x2="200" y2="420" stroke="#8a8a8a" stroke-width="3"/>
  <line x1="185" y1="60" x2="215" y2="60" stroke="#e0645c" stroke-width="2"/>
  <line x1="185" y1="220" x2="215" y2="220" stroke="#e0645c" stroke-width="2"/>
  <line x1="180" y1="300" x2="220" y2="300" stroke="#e0645c" stroke-width="3"/>
  <line x1="185" y1="380" x2="215" y2="380" stroke="#e0645c" stroke-width="2"/>
  <line x1="185" y1="420" x2="215" y2="420" stroke="#e0645c" stroke-width="2"/>

  <text x="240" y="126" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a90d9">noesis - understanding (4 units)</text>
  <text x="240" y="145" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a">Forms alone, no images; treats hypotheses as starting points</text>
  <text x="240" y="161" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a">and climbs to an unhypothetical first principle (dialectic)</text>

  <text x="240" y="252" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a90d9">dianoia - thought (2 units)</text>
  <text x="240" y="271" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a">reasons down from unexamined hypotheses, using visible</text>
  <text x="240" y="287" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a">things as images (mathematics)</text>

  <text x="240" y="334" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a">pistis - belief, trust (2 units)</text>
  <text x="240" y="353" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a">animals, plants, artefacts: the originals of the images below</text>

  <text x="240" y="398" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a8a">eikasia - imagining (1 unit)</text>
  <text x="240" y="416" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8a8a">shadows and reflections</text>

  <line x1="10" y1="444" x2="710" y2="444" stroke="#8a8a8a" stroke-width="1"/>
  <text x="10" y="466" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a">Cut the whole in some ratio, then cut each part in the same ratio: the two middle segments always come out equal.</text>
</svg>
