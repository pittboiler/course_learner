<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="26" fill="#8a8a8a" font-style="italic">Kepler's second law: the Sun–planet line sweeps equal areas in equal times —</text>
  <text x="30" y="44" fill="#8a8a8a" font-style="italic">so the planet races near the Sun and dawdles far away. Both shaded wedges have equal area.</text>

  <!-- orbit ellipse: center (280,190), rx 200, ry 130 -->
  <ellipse cx="280" cy="190" rx="200" ry="130" fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- far (aphelion) swept sector: narrow wide wedge, Sun apex -->
  <path d="M 423 190 L 82 209.5 L 80 190 L 82 170.5 Z" fill="#e0645c" opacity="0.22"/>
  <!-- near (perihelion) swept sector: fat short wedge, Sun apex -->
  <path d="M 423 190 L 433.2 100 L 468 142.1 L 480 190 L 468 237.9 L 433.2 280 Z" fill="#e0645c" opacity="0.22"/>

  <!-- Sun at right focus (c = 143) -->
  <circle cx="423" cy="190" r="9" fill="#e0a03c" stroke="#c07e1c" stroke-width="1.5"/>
  <text x="405" y="216" fill="#8a8a8a">Sun (focus)</text>

  <!-- empty focus marker -->
  <circle cx="137" cy="190" r="2.5" fill="#8a8a8a"/>
  <text x="118" y="214" fill="#8a8a8a">focus</text>

  <!-- planet at perihelion (fast, near) -->
  <circle cx="480" cy="190" r="6" fill="#4a90d9"/>
  <text x="452" y="182" fill="#4a90d9">fast</text>
  <text x="440" y="316" fill="#8a8a8a">perihelion</text>

  <!-- planet at aphelion (slow, far) -->
  <circle cx="80" cy="190" r="6" fill="#4a90d9"/>
  <text x="82" y="150" fill="#4a90d9">slow</text>
  <text x="52" y="316" fill="#8a8a8a">aphelion</text>
</svg>
