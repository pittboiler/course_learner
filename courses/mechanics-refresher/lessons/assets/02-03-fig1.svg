<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="30" y="26" fill="#8a8a8a" font-style="italic">Perfectly inelastic collision: the carts stick, but the total momentum arrow is the same length before and after.</text>

  <!-- ================= BEFORE ================= -->
  <text x="34" y="86" fill="#8a8a8a" font-style="italic">Before</text>

  <!-- track -->
  <line x1="70" y1="150" x2="430" y2="150" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- Cart A (moving) -->
  <rect x="95" y="120" width="55" height="30" fill="#4a90d9" opacity="0.16" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="105" y="140" fill="#4a90d9">2 kg</text>
  <!-- momentum arrow of A -->
  <line x1="152" y1="135" x2="237" y2="135" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="247,135 231,127 231,143" fill="#4a90d9"/>
  <text x="150" y="112" fill="#4a90d9">p = 6 kg·m/s  (3 m/s)</text>

  <!-- Cart B (at rest) -->
  <rect x="310" y="120" width="45" height="30" fill="#8a8a8a" opacity="0.16" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="320" y="140" fill="#8a8a8a">1 kg</text>
  <text x="300" y="176" fill="#8a8a8a">at rest,  p = 0</text>

  <text x="440" y="140" fill="#8a8a8a">total p = 6</text>

  <!-- separator -->
  <line x1="30" y1="205" x2="530" y2="205" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ================= AFTER ================= -->
  <text x="34" y="246" fill="#8a8a8a" font-style="italic">After</text>

  <!-- track -->
  <line x1="70" y1="315" x2="430" y2="315" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- Combined cart -->
  <rect x="250" y="285" width="80" height="30" fill="#4a90d9" opacity="0.16" stroke="#4a90d9" stroke-width="1.5"/>
  <rect x="250" y="285" width="80" height="30" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="272" y="305" fill="#4a90d9">3 kg</text>
  <!-- momentum arrow of combined mass: SAME length (95px) -->
  <line x1="332" y1="300" x2="417" y2="300" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="427,300 411,292 411,308" fill="#4a90d9"/>
  <text x="330" y="277" fill="#4a90d9">p = 6 kg·m/s  (2 m/s)</text>

  <text x="440" y="305" fill="#8a8a8a">total p = 6</text>
</svg>
