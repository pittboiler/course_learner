<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="30" fill="#8a8a8a" font-style="italic">One body, isolated: draw every force acting ON it as a labeled arrow, then apply ΣF = ma.</text>

  <!-- ground with hatching -->
  <line x1="150" y1="252" x2="410" y2="252" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="160" y1="252" x2="150" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="184" y1="252" x2="174" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="208" y1="252" x2="198" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="232" y1="252" x2="222" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="256" y1="252" x2="246" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="280" y1="252" x2="270" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="304" y1="252" x2="294" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="328" y1="252" x2="318" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="352" y1="252" x2="342" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="376" y1="252" x2="366" y2="262" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="400" y1="252" x2="390" y2="262" stroke="#8a8a8a" stroke-width="1"/>

  <!-- the isolated body -->
  <rect x="240" y="192" width="80" height="60" fill="#8a8a8a" opacity="0.14" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle cx="280" cy="222" r="4" fill="#8a8a8a"/>

  <!-- Normal force N: up (blue) -->
  <line x1="280" y1="222" x2="280" y2="110" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="280,100 272,116 288,116" fill="#4a90d9"/>
  <text x="290" y="124" fill="#4a90d9">N  (normal)</text>

  <!-- Weight mg: down (red) -->
  <line x1="280" y1="222" x2="280" y2="312" stroke="#e0645c" stroke-width="3"/>
  <polygon points="280,322 272,306 288,306" fill="#e0645c"/>
  <text x="290" y="308" fill="#e0645c">mg  (weight)</text>

  <!-- Applied force F: right (blue) -->
  <line x1="280" y1="222" x2="398" y2="222" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="408,222 392,214 392,230" fill="#4a90d9"/>
  <text x="352" y="212" fill="#4a90d9">F  (applied push)</text>

  <!-- Friction f: left (gray) -->
  <line x1="280" y1="222" x2="172" y2="222" stroke="#8a8a8a" stroke-width="3"/>
  <polygon points="162,222 178,214 178,230" fill="#8a8a8a"/>
  <text x="120" y="212" fill="#8a8a8a">f  (friction)</text>
</svg>
