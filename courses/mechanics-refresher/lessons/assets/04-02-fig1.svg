<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ah-blue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4a90d9"/>
    </marker>
    <marker id="ah-red" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#e0645c"/>
    </marker>
  </defs>

  <!-- ground -->
  <line x1="30" y1="250" x2="540" y2="250" stroke="#8a8a8a" stroke-width="1.5"/>
  <!-- ground hatching -->
  <g stroke="#8a8a8a" stroke-width="1">
    <line x1="40" y1="250" x2="30" y2="260"/>
    <line x1="70" y1="250" x2="60" y2="260"/>
    <line x1="100" y1="250" x2="90" y2="260"/>
    <line x1="130" y1="250" x2="120" y2="260"/>
    <line x1="160" y1="250" x2="150" y2="260"/>
    <line x1="190" y1="250" x2="180" y2="260"/>
    <line x1="220" y1="250" x2="210" y2="260"/>
    <line x1="250" y1="250" x2="240" y2="260"/>
    <line x1="280" y1="250" x2="270" y2="260"/>
    <line x1="310" y1="250" x2="300" y2="260"/>
    <line x1="340" y1="250" x2="330" y2="260"/>
    <line x1="370" y1="250" x2="360" y2="260"/>
    <line x1="400" y1="250" x2="390" y2="260"/>
    <line x1="430" y1="250" x2="420" y2="260"/>
    <line x1="460" y1="250" x2="450" y2="260"/>
    <line x1="490" y1="250" x2="480" y2="260"/>
    <line x1="520" y1="250" x2="510" y2="260"/>
  </g>

  <!-- wheel -->
  <circle cx="230" cy="160" r="90" fill="#4a90d9" opacity="0.10"/>
  <circle cx="230" cy="160" r="90" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <!-- spokes -->
  <g stroke="#4a90d9" stroke-width="1" opacity="0.5">
    <line x1="230" y1="160" x2="230" y2="70"/>
    <line x1="230" y1="160" x2="320" y2="160"/>
    <line x1="230" y1="160" x2="230" y2="250"/>
    <line x1="230" y1="160" x2="140" y2="160"/>
  </g>

  <!-- rotation arc (omega), red -->
  <path d="M 278 118 A 60 60 0 0 1 278 202" fill="none" stroke="#e0645c" stroke-width="2" marker-end="url(#ah-red)"/>
  <text x="292" y="164" fill="#e0645c">&#969;</text>

  <!-- radius label -->
  <line x1="230" y1="160" x2="185" y2="238" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="196" y="212" fill="#8a8a8a">R</text>

  <!-- center velocity: v -->
  <circle cx="230" cy="160" r="4" fill="#8a8a8a"/>
  <line x1="230" y1="160" x2="300" y2="160" stroke="#4a90d9" stroke-width="3" marker-end="url(#ah-blue)"/>
  <text x="250" y="152" fill="#4a90d9">v = R&#969;</text>

  <!-- top velocity: 2v -->
  <circle cx="230" cy="70" r="4" fill="#8a8a8a"/>
  <line x1="230" y1="70" x2="370" y2="70" stroke="#4a90d9" stroke-width="3" marker-end="url(#ah-blue)"/>
  <text x="300" y="62" fill="#4a90d9">2v (fastest)</text>

  <!-- contact point at rest -->
  <circle cx="230" cy="250" r="5" fill="#e0645c"/>
  <text x="244" y="242" fill="#e0645c">contact point: v = 0</text>

  <!-- caption -->
  <text x="70" y="300" fill="#8a8a8a" font-style="italic">Rolling without slipping: the bottom point is instantaneously at rest, so v = R&#969; ties spin to travel.</text>
</svg>
