<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="40" y="28" fill="#8a8a8a" font-style="italic">Horizontal velocity vₓ never changes; gravity only turns vᵧ around — two independent 1-D motions.</text>

  <!-- ground -->
  <line x1="40" y1="300" x2="540" y2="300" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="540,300 530,295 530,305" fill="#8a8a8a"/>
  <text x="546" y="305" fill="#8a8a8a">x</text>

  <!-- trajectory (velocity is tangent to it) -->
  <path d="M 60 300 L 95 241 L 130 191.6 L 175 142.5 L 232 103.4 L 290 90 L 348 103.4 L 405 142.5 L 450 191.6 L 485 241 L 520 300"
        fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- gravity acts only vertically, at the peak -->
  <line x1="290" y1="104" x2="290" y2="140" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="290,144 286,136 294,136" fill="#8a8a8a"/>
  <text x="296" y="130" fill="#8a8a8a" font-style="italic">g</text>

  <!-- ===== Point A: ascending ===== -->
  <!-- component rectangle guides -->
  <line x1="185" y1="192" x2="185" y2="142" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="130" y1="142" x2="185" y2="142" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- vx (constant) -->
  <line x1="130" y1="192" x2="185" y2="192" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="185,192 178,188 178,196" fill="#e0645c"/>
  <!-- vy (changing) -->
  <line x1="130" y1="192" x2="130" y2="142" stroke="#8a8a8a" stroke-width="2.5"/>
  <polygon points="130,142 126,149 134,149" fill="#8a8a8a"/>
  <!-- v resultant (tangent) -->
  <line x1="130" y1="192" x2="185" y2="142" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="185,142 180.3,151.7 174.9,145.7" fill="#4a90d9"/>
  <circle cx="130" cy="192" r="3.5" fill="#4a90d9"/>
  <text x="188" y="140" fill="#4a90d9">v</text>
  <text x="150" y="210" fill="#e0645c">vₓ</text>
  <text x="106" y="168" fill="#8a8a8a">vᵧ</text>

  <!-- ===== Point B: descending ===== -->
  <line x1="460" y1="142" x2="460" y2="192" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="405" y1="192" x2="460" y2="192" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- vx (constant, same length) -->
  <line x1="405" y1="142" x2="460" y2="142" stroke="#e0645c" stroke-width="2.5"/>
  <polygon points="460,142 453,138 453,146" fill="#e0645c"/>
  <!-- vy (now downward) -->
  <line x1="405" y1="142" x2="405" y2="192" stroke="#8a8a8a" stroke-width="2.5"/>
  <polygon points="405,192 401,185 409,185" fill="#8a8a8a"/>
  <!-- v resultant -->
  <line x1="405" y1="142" x2="460" y2="192" stroke="#4a90d9" stroke-width="2.5"/>
  <polygon points="460,192 449.9,188.3 455.3,182.3" fill="#4a90d9"/>
  <circle cx="405" cy="142" r="3.5" fill="#4a90d9"/>
  <text x="412" y="138" fill="#e0645c">vₓ</text>
  <text x="382" y="176" fill="#8a8a8a">vᵧ</text>
  <text x="463" y="196" fill="#4a90d9">v</text>
</svg>
