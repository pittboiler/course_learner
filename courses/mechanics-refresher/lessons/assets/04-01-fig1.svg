<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- caption -->
  <text x="20" y="26" fill="#8a8a8a" font-style="italic">Torque = force × its perpendicular lever arm: only the push acting across the wrench twists the bolt.</text>

  <!-- ===== wrench + torque diagram (left) ===== -->

  <!-- line of action of F (dashed vertical through the tip) -->
  <line x1="120" y1="150" x2="120" y2="315" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- perpendicular lever arm r_perp (horizontal, from pivot to the line of action) -->
  <line x1="120" y1="290" x2="380" y2="290" stroke="#e0645c" stroke-width="2.5" stroke-dasharray="6 4"/>
  <!-- right-angle marker where r_perp meets the line of action -->
  <path d="M 120 275 L 135 275 L 135 290" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <text x="235" y="308" fill="#e0645c">r&#8869; = r sin&#952;</text>

  <!-- the wrench handle = the position vector r from pivot to tip -->
  <line x1="380" y1="290" x2="120" y2="150" stroke="#8a8a8a" stroke-width="9" stroke-linecap="round"/>
  <text x="255" y="205" fill="#555555">r</text>

  <!-- pivot: the bolt -->
  <polygon points="380,278 391,284 391,296 380,302 369,296 369,284" fill="#cccccc" stroke="#8a8a8a" stroke-width="1.5"/>
  <circle cx="380" cy="290" r="4" fill="#8a8a8a"/>

  <!-- twist direction (curved arrow around the pivot) -->
  <path d="M 405 275 A 26 26 0 0 1 405 305" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="405,305 400,296 411,298" fill="#8a8a8a"/>

  <!-- the applied force F at the tip -->
  <line x1="120" y1="150" x2="120" y2="248" stroke="#4a90d9" stroke-width="3"/>
  <polygon points="120,256 114,244 126,244" fill="#4a90d9"/>
  <text x="130" y="210" fill="#4a90d9">F</text>

  <!-- angle theta between the handle (r) and the force at the tip -->
  <path d="M 147 163 A 30 30 0 0 1 120 180" fill="none" stroke="#555555" stroke-width="1.2"/>
  <text x="150" y="182" fill="#555555">&#952;</text>

  <!-- ===== linear <-> angular dictionary (right inset) ===== -->
  <rect x="410" y="52" width="210" height="252" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="515" y="78" fill="#555555" font-weight="bold" text-anchor="middle">linear &#8596; angular</text>
  <line x1="424" y1="90" x2="606" y2="90" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="515" y1="96" x2="515" y2="294" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 4"/>

  <text x="470" y="118" fill="#4a90d9" text-anchor="middle">x</text>
  <text x="560" y="118" fill="#e0645c" text-anchor="middle">&#952;</text>

  <text x="470" y="146" fill="#4a90d9" text-anchor="middle">v</text>
  <text x="560" y="146" fill="#e0645c" text-anchor="middle">&#969;</text>

  <text x="470" y="174" fill="#4a90d9" text-anchor="middle">a</text>
  <text x="560" y="174" fill="#e0645c" text-anchor="middle">&#945;</text>

  <text x="470" y="202" fill="#4a90d9" text-anchor="middle">m</text>
  <text x="560" y="202" fill="#e0645c" text-anchor="middle">I</text>

  <text x="470" y="230" fill="#4a90d9" text-anchor="middle">F</text>
  <text x="560" y="230" fill="#e0645c" text-anchor="middle">&#964;</text>

  <text x="470" y="260" fill="#4a90d9" text-anchor="middle">F = ma</text>
  <text x="560" y="260" fill="#e0645c" text-anchor="middle">&#964; = I&#945;</text>

  <text x="470" y="288" fill="#4a90d9" text-anchor="middle">&#189;mv&#178;</text>
  <text x="560" y="288" fill="#e0645c" text-anchor="middle">&#189;I&#969;&#178;</text>
</svg>
