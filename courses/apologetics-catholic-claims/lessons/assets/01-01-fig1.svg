<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="530" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="110" y1="425" x2="770" y2="425" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="110" y1="425" x2="110" y2="45" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- region divider: scripture alone / scripture with or within Tradition -->
  <line x1="490" y1="55" x2="490" y2="420" stroke="#333" stroke-width="1.2" stroke-dasharray="6,5"/>
  <text x="300" y="413" font-size="13" fill="#1a6fb5" text-anchor="middle" font-style="italic">scripture alone</text>
  <text x="630" y="413" font-size="13" fill="#333" text-anchor="middle" font-style="italic">scripture with or within Tradition</text>

  <!-- x-axis end labels -->
  <text x="112" y="450" font-size="12" fill="#333">Scripture the sole infallible rule;</text>
  <text x="112" y="466" font-size="12" fill="#333">creeds, confessions, synods real but fallible</text>
  <text x="755" y="450" font-size="12" fill="#333" text-anchor="end">Scripture and Tradition as one deposit,</text>
  <text x="755" y="466" font-size="12" fill="#333" text-anchor="end">or scripture within one living Tradition</text>
  <text x="440" y="505" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">Axis 1 &#8212; where final authority sits</text>

  <!-- y-axis labels -->
  <text x="34" y="240" font-size="15" fill="#111" text-anchor="middle" font-weight="bold" transform="rotate(-90 34 240)">Axis 2 &#8212; who settles a disputed reading</text>
  <text x="62" y="420" font-size="12" fill="#333" text-anchor="start" transform="rotate(-90 62 420)">dispersed judgment</text>
  <text x="62" y="55" font-size="12" fill="#333" text-anchor="end" transform="rotate(-90 62 55)">an organ that can define</text>

  <!-- Baptist / free church -->
  <circle cx="160" cy="368" r="7" fill="#1a6fb5"/>
  <text x="173" y="365" font-size="13" fill="#111" font-weight="bold">Baptist, free church</text>
  <text x="173" y="381" font-size="12" fill="#333">(New Hampshire I)</text>

  <!-- Reformed -->
  <circle cx="215" cy="300" r="7" fill="#1a6fb5"/>
  <text x="228" y="297" font-size="13" fill="#111" font-weight="bold">Reformed</text>
  <text x="228" y="313" font-size="12" fill="#333">(Westminster I.10, XXXI.3)</text>

  <!-- Lutheran -->
  <circle cx="300" cy="250" r="7" fill="#1a6fb5"/>
  <text x="313" y="247" font-size="13" fill="#111" font-weight="bold">Lutheran</text>
  <text x="313" y="263" font-size="12" fill="#333">(Formula, Rule and Norm)</text>

  <!-- Anglican -->
  <circle cx="400" cy="200" r="7" fill="#1a6fb5"/>
  <text x="387" y="197" font-size="13" fill="#111" font-weight="bold" text-anchor="end">Anglican</text>
  <text x="387" y="213" font-size="12" fill="#333" text-anchor="end">(Article XX; Canon A5)</text>

  <!-- Orthodox -->
  <circle cx="600" cy="160" r="7" fill="#2e8b57"/>
  <text x="613" y="157" font-size="13" fill="#111" font-weight="bold">Orthodox</text>
  <text x="613" y="173" font-size="12" fill="#333">(councils, as received)</text>

  <!-- Catholic -->
  <circle cx="705" cy="80" r="7" fill="#d1495b"/>
  <text x="692" y="77" font-size="13" fill="#111" font-weight="bold" text-anchor="end">Catholic</text>
  <text x="692" y="93" font-size="12" fill="#333" text-anchor="end">(Dei Verbum 10; Pastor Aeternus 4)</text>
</svg>
