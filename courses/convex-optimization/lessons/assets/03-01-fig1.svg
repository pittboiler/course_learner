<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>

  <text x="360" y="30" font-size="17" font-weight="bold" fill="#111111" text-anchor="middle">The dual function lies below p&#8902; &#8212; and here it touches</text>

  <!-- axes -->
  <line x1="90" y1="180" x2="90" y2="400" stroke="#111111" stroke-width="1.5"/>
  <line x1="90" y1="300" x2="640" y2="300" stroke="#111111" stroke-width="1.5"/>
  <text x="655" y="305" font-size="14" fill="#111111" font-style="italic">&#955; &#8805; 0</text>
  <text x="98" y="192" font-size="13" fill="#111111">lower bound on p&#8902;</text>

  <!-- p* horizontal line -->
  <line x1="90" y1="220" x2="600" y2="220" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="2 0"/>
  <text x="605" y="225" font-size="15" fill="#b91c1c" font-style="italic">p&#8902; = 1</text>

  <!-- concave dual curve g(lambda) = -lambda^2/4 + lambda -->
  <polyline fill="none" stroke="#1d4ed8" stroke-width="3"
    points="90,300 126,271.2 162,248.8 198,232.8 234,223.2 270,220 306,223.2 342,232.8 378,248.8 414,271.2 450,300 486,335.2 522,376.8"/>
  <text x="150" y="345" font-size="16" fill="#1d4ed8" font-style="italic">g(&#955;)</text>

  <!-- touching point at lambda* = 2 -->
  <circle cx="270" cy="220" r="5" fill="#111111"/>
  <line x1="270" y1="220" x2="270" y2="300" stroke="#111111" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="270" y="318" font-size="13" fill="#111111" text-anchor="middle" font-style="italic">&#955;&#8902; = 2</text>
  <text x="286" y="212" font-size="12.5" fill="#111111">g(&#955;&#8902;) = p&#8902;  (zero gap)</text>

  <!-- duality gap at a suboptimal lambda = 4 (g = 0) -->
  <line x1="450" y1="220" x2="450" y2="300" stroke="#059669" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="446" y1="222" x2="454" y2="222" stroke="#059669" stroke-width="2"/>
  <line x1="446" y1="298" x2="454" y2="298" stroke="#059669" stroke-width="2"/>
  <text x="462" y="264" font-size="12.5" fill="#047857">duality gap</text>
  <text x="462" y="280" font-size="12.5" fill="#047857">p&#8902; &#8722; g(&#955;)</text>

  <!-- origin tick -->
  <text x="86" y="316" font-size="12" fill="#111111" text-anchor="end">0</text>
</svg>
