<svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="360" height="360" fill="#ffffff"/>

  <!-- axes -->
  <line x1="20" y1="180" x2="340" y2="180" stroke="#111111" stroke-width="1"/>
  <line x1="180" y1="20" x2="180" y2="340" stroke="#111111" stroke-width="1"/>
  <polygon points="340,180 331,176 331,184" fill="#111111"/>
  <polygon points="180,20 176,29 184,29" fill="#111111"/>
  <text x="345" y="184" font-size="13" fill="#111111">x₁</text>
  <text x="186" y="24" font-size="13" fill="#111111">x₂</text>

  <!-- unit ticks -->
  <line x1="300" y1="176" x2="300" y2="184" stroke="#111111" stroke-width="1"/>
  <text x="294" y="198" font-size="11" fill="#444444">1</text>
  <line x1="176" y1="60" x2="184" y2="60" stroke="#111111" stroke-width="1"/>
  <text x="160" y="64" font-size="11" fill="#444444">1</text>

  <!-- l-infinity ball: square -->
  <rect x="60" y="60" width="240" height="240" fill="#f59e0b" fill-opacity="0.14" stroke="#b45309" stroke-width="2"/>
  <!-- l2 ball: disk -->
  <circle cx="180" cy="180" r="120" fill="#3b82f6" fill-opacity="0.16" stroke="#1d4ed8" stroke-width="2"/>
  <!-- l1 ball: diamond -->
  <polygon points="300,180 180,60 60,180 180,300" fill="#10b981" fill-opacity="0.28" stroke="#047857" stroke-width="2"/>

  <!-- labels -->
  <text x="66" y="52" font-size="14" fill="#b45309" font-weight="bold">ℓ∞ (square)</text>
  <text x="238" y="316" font-size="14" fill="#1d4ed8" font-weight="bold">ℓ₂ (disk)</text>
  <text x="150" y="186" font-size="14" fill="#047857" font-weight="bold">ℓ₁</text>
</svg>
