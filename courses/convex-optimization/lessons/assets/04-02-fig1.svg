<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>

  <text x="360" y="30" font-size="17" font-weight="bold" fill="#111111" text-anchor="middle">One Newton step: minimize the fitted quadratic</text>

  <!-- x-axis -->
  <line x1="70" y1="380" x2="685" y2="380" stroke="#111111" stroke-width="1.5"/>

  <!-- true function f (dark curve) -->
  <polyline fill="none" stroke="#111111" stroke-width="3"
    points="90,211 135,272 180,315 225,346 270,365 315,376 360,380 405,376 450,365 495,345 540,315 562,295 585,275 600,254 630,211 645,187"/>
  <text x="112" y="200" font-size="15" fill="#111111" font-style="italic">f</text>

  <!-- quadratic model (lighter blue), tangent + same curvature at x_k -->
  <polyline fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="1 0"
    points="390,318 420,333 445,340 462,341 480,340 510,331 540,317 562,295 585,274 600,254 630,212 645,187"/>
  <text x="418" y="356" font-size="14" fill="#2563eb" font-style="italic">model  m(x)</text>

  <!-- tangency / current point on both curves -->
  <circle cx="600" cy="254" r="5" fill="#111111"/>
  <text x="610" y="248" font-size="13.5" fill="#111111">shared value, slope &amp; curvature</text>

  <!-- current iterate drop line -->
  <line x1="600" y1="254" x2="600" y2="380" stroke="#111111" stroke-width="1.3" stroke-dasharray="5 4"/>
  <circle cx="600" cy="380" r="3.5" fill="#111111"/>
  <text x="600" y="400" font-size="14" fill="#111111" text-anchor="middle" font-style="italic">x&#8342;</text>

  <!-- model minimizer -> next iterate -->
  <circle cx="462" cy="341" r="4.5" fill="#2563eb"/>
  <line x1="462" y1="341" x2="462" y2="380" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="5 4"/>
  <circle cx="462" cy="380" r="3.5" fill="#2563eb"/>
  <text x="462" y="400" font-size="14" fill="#2563eb" text-anchor="middle" font-style="italic">x&#8342;&#8330;&#8321;</text>

  <!-- true minimizer -->
  <circle cx="360" cy="380" r="4" fill="#059669"/>
  <text x="360" y="400" font-size="14" fill="#059669" text-anchor="middle" font-style="italic">x&#8902;</text>
  <text x="300" y="368" font-size="12.5" fill="#059669" text-anchor="end">true min</text>

  <!-- arrow showing the step -->
  <line x1="588" y1="365" x2="474" y2="365" stroke="#b45309" stroke-width="2" marker-end="url(#arr)"/>
  <text x="531" y="358" font-size="12.5" fill="#b45309" text-anchor="middle">Newton step &#916;x</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
