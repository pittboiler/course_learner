<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="660" height="500" fill="#ffffff"/>

  <text x="330" y="34" font-size="18" font-weight="bold" fill="#111111" text-anchor="middle">The optimum is where a level set supports the feasible set</text>

  <!-- level sets of f0 (concentric circles centred at unconstrained min c) -->
  <circle cx="200" cy="290" r="60"  fill="none" stroke="#2563eb" stroke-width="1.6" stroke-opacity="0.55"/>
  <circle cx="200" cy="290" r="120" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-opacity="0.55"/>
  <circle cx="200" cy="290" r="180" fill="none" stroke="#2563eb" stroke-width="2.6"/>

  <!-- centre = unconstrained minimiser -->
  <circle cx="200" cy="290" r="3.5" fill="#1d4ed8"/>
  <text x="176" y="286" font-size="13" fill="#1d4ed8" text-anchor="end">unconstrained</text>
  <text x="176" y="302" font-size="13" fill="#1d4ed8" text-anchor="end">min of f&#8320;</text>

  <!-- increasing-f0 hint -->
  <text x="200" y="140" font-size="12.5" fill="#2563eb" text-anchor="middle">level sets f&#8320;(x) = const, rising outward</text>

  <!-- feasible set X (convex quadrilateral), left edge is the supporting line -->
  <polygon points="300,85 560,150 555,300 424,337" fill="#059669" fill-opacity="0.18" stroke="#047857" stroke-width="2"/>
  <text x="475" y="235" font-size="20" fill="#047857" text-anchor="middle" font-style="italic">X</text>
  <text x="475" y="255" font-size="12.5" fill="#047857" text-anchor="middle">feasible set</text>

  <!-- supporting hyperplane at x* : the left edge line, extended -->
  <line x1="290" y1="63" x2="434" y2="357" stroke="#111111" stroke-width="2.4" stroke-dasharray="6 4"/>
  <text x="300" y="392" font-size="12.5" fill="#111111" text-anchor="middle">supporting hyperplane at x&#8727;</text>

  <!-- optimum x* : tangency point -->
  <circle cx="362" cy="211" r="5" fill="#111111"/>
  <text x="352" y="205" font-size="15" fill="#111111" text-anchor="end" font-style="italic">x&#8727;</text>

  <!-- gradient of f0 at x* : points outward, into the feasible side -->
  <line x1="362" y1="211" x2="428" y2="179" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="436" y="176" font-size="14" fill="#dc2626">&#8711;f&#8320;(x&#8727;)</text>

  <!-- the certificate note -->
  <text x="330" y="460" font-size="14" fill="#111111" text-anchor="middle">every feasible y satisfies  &#8711;f&#8320;(x&#8727;)&#8868;(y &#8722; x&#8727;) &#8805; 0</text>
  <text x="330" y="480" font-size="12.5" fill="#555555" text-anchor="middle">no feasible direction goes downhill &#8212; so x&#8727; is optimal</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
