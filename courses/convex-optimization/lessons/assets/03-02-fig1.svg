<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 375" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="480" height="375" fill="#ffffff"/>

  <!-- shaded region A: everything on/above the convex frontier -->
  <path d="M100,72 L120,98 L140,120 L160,140 L170,148 L185,161 L205,177 L230,192 L260,206 L300,221 L350,234 L400,244 L440,251 L440,48 L100,48 Z"
        fill="#3b82f6" fill-opacity="0.16" stroke="none"/>

  <!-- convex frontier t = p*(u) -->
  <path d="M100,72 L120,98 L140,120 L160,140 L170,148 L185,161 L205,177 L230,192 L260,206 L300,221 L350,234 L400,244 L440,251"
        fill="none" stroke="#1a1a1a" stroke-width="2.2"/>

  <!-- axes -->
  <line x1="60" y1="300" x2="458" y2="300" stroke="#111111" stroke-width="1.6"/>
  <polygon points="458,300 449,296 449,304" fill="#111111"/>
  <line x1="170" y1="322" x2="170" y2="42" stroke="#111111" stroke-width="1.6"/>
  <polygon points="170,42 166,51 174,51" fill="#111111"/>

  <!-- nonvertical supporting hyperplane, tangent at (0,p*), slope -lambda* -->
  <line x1="72" y1="81" x2="416" y2="315" stroke="#c0392b" stroke-width="2.2"/>

  <!-- touch point (0, p*) -->
  <circle cx="170" cy="148" r="4.2" fill="#111111"/>
  <line x1="164" y1="148" x2="176" y2="148" stroke="#111111" stroke-width="1.4"/>

  <!-- labels -->
  <text x="156" y="40" font-size="16" font-style="italic" fill="#111111">t</text>
  <text x="452" y="296" font-size="16" font-style="italic" fill="#111111">u</text>
  <text x="156" y="316" font-size="13" fill="#111111">0</text>
  <text x="140" y="153" font-size="14" fill="#111111">p*</text>
  <text x="182" y="140" font-size="13" fill="#111111">(0, p*)</text>
  <text x="330" y="108" font-size="17" font-style="italic" fill="#1d4ed8">A</text>
  <text x="345" y="128" font-size="12" fill="#1d4ed8">achievable (u, t)</text>
  <text x="238" y="352" font-size="12.5" fill="#c0392b">nonvertical supporting hyperplane</text>
  <text x="238" y="368" font-size="12.5" fill="#c0392b">slope = &#8722;&#955;* , hits t-axis at p* = d*</text>
</svg>
