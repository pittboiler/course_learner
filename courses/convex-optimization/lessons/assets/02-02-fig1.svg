<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="420" fill="#ffffff"/>

  <text x="280" y="30" font-size="17" font-weight="bold" fill="#111111" text-anchor="middle">An LP: level lines sweep across a polygon</text>

  <!-- feasible polygon: vertices (0,0)(4,0)(3,1)(0,2) -->
  <polygon points="90,350 338,350 276,288 90,226" fill="#2563eb" fill-opacity="0.18" stroke="#1d4ed8" stroke-width="2"/>

  <!-- axes -->
  <line x1="90" y1="350" x2="440" y2="350" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="90" y1="350" x2="90" y2="175" stroke="#111111" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="446" y="355" font-size="14" fill="#111111" font-style="italic">x&#8321;</text>
  <text x="78" y="172" font-size="14" fill="#111111" font-style="italic">x&#8322;</text>

  <!-- level lines c^T x = x1 + 2 x2 = k -->
  <line x1="90" y1="288" x2="214" y2="350" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="120" y="308" font-size="11.5" fill="#6b7280">k = 2</text>
  <line x1="90" y1="226" x2="338" y2="350" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="196" y="272" font-size="11.5" fill="#6b7280">k = 4</text>
  <line x1="90" y1="195" x2="400" y2="350" stroke="#111111" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="356" y="238" font-size="12.5" fill="#111111" font-weight="bold">c&#8868;x = 5</text>

  <!-- gradient (direction of increase) -->
  <line x1="150" y1="322" x2="196" y2="230" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#arrred)"/>
  <text x="150" y="216" font-size="12.5" fill="#b91c1c">increasing c&#8868;x</text>

  <!-- vertices -->
  <circle cx="90" cy="350" r="4" fill="#1d4ed8"/>
  <text x="72" y="368" font-size="11.5" fill="#1d4ed8">0</text>
  <circle cx="338" cy="350" r="4" fill="#1d4ed8"/>
  <text x="330" y="368" font-size="11.5" fill="#1d4ed8">4</text>
  <circle cx="90" cy="226" r="4" fill="#1d4ed8"/>
  <text x="66" y="222" font-size="11.5" fill="#1d4ed8">4</text>

  <!-- optimal vertex (3,1) -->
  <circle cx="276" cy="288" r="7" fill="#059669" stroke="#065f46" stroke-width="1.5"/>
  <text x="288" y="284" font-size="13" fill="#065f46" font-weight="bold">x&#8902; = (3, 1),  c&#8868;x = 5</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#111111"/>
    </marker>
    <marker id="arrred" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#b91c1c"/>
    </marker>
  </defs>
</svg>
