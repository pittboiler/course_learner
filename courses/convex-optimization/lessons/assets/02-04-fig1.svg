<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="430" fill="#ffffff"/>

  <text x="360" y="34" font-size="18" font-weight="bold" fill="#111111" text-anchor="middle">The conic ladder: LP &#8834; SOCP &#8834; SDP</text>

  <!-- SDP outer -->
  <rect x="90" y="60" width="540" height="300" rx="18" fill="#7c3aed" fill-opacity="0.12" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="360" y="86" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">SDP</text>
  <text x="360" y="105" font-size="12.5" fill="#6d28d9" text-anchor="middle">cone = PSD matrices  S&#8319;&#8330;  ( X &#8829; 0 )</text>

  <!-- SOCP middle -->
  <rect x="150" y="120" width="420" height="215" rx="16" fill="#2563eb" fill-opacity="0.14" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="360" y="146" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">SOCP</text>
  <text x="360" y="165" font-size="12.5" fill="#1d4ed8" text-anchor="middle">cone = ice-cream cones  ( &#8214;u&#8214;&#8322; &#8804; t )</text>

  <!-- LP inner -->
  <rect x="230" y="185" width="260" height="130" rx="14" fill="#059669" fill-opacity="0.18" stroke="#047857" stroke-width="2.5"/>
  <text x="360" y="242" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">LP  (and QP)</text>
  <text x="360" y="263" font-size="12.5" fill="#047857" text-anchor="middle">cone = orthant  ( x &#8805; 0 )</text>

  <!-- direction arrows -->
  <line x1="120" y1="395" x2="600" y2="395" stroke="#111111" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="150" y="415" font-size="12.5" fill="#111111">more expressive &#8594;</text>
  <text x="470" y="415" font-size="12.5" fill="#111111">more expensive to solve &#8594;</text>

  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#111111"/>
    </marker>
  </defs>
</svg>
