<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="480" height="300" fill="#ffffff"/>

  <!-- shaded epigraph: region above the graph -->
  <polygon points="60,90 80,123.6 100,153.2 120,178.9 140,200.6 160,218.4 180,232.2 200,242.1 220,248 240,250 260,248 280,242.1 300,232.2 320,218.4 340,200.6 360,178.9 380,153.2 400,123.6 420,90 420,48 60,48"
           fill="#3b82f6" fill-opacity="0.13"/>

  <!-- axes -->
  <line x1="48" y1="45" x2="48" y2="278" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="42" y1="270" x2="448" y2="270" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- the convex graph -->
  <polyline points="60,90 80,123.6 100,153.2 120,178.9 140,200.6 160,218.4 180,232.2 200,242.1 220,248 240,250 260,248 280,242.1 300,232.2 320,218.4 340,200.6 360,178.9 380,153.2 400,123.6 420,90"
            fill="none" stroke="#1a1a1a" stroke-width="2.6"/>

  <!-- chord: lies ABOVE the graph -->
  <line x1="100" y1="153.2" x2="360" y2="178.9" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="100" cy="153.2" r="3.4" fill="#c0392b"/>
  <circle cx="360" cy="178.9" r="3.4" fill="#c0392b"/>

  <!-- tangent: lies BELOW the graph -->
  <line x1="125" y1="199.6" x2="240" y2="267.8" stroke="#1e8449" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="180" cy="232.2" r="3.4" fill="#1e8449"/>

  <!-- guide drops to axis -->
  <line x1="100" y1="153.2" x2="100" y2="270" stroke="#999999" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="360" y1="178.9" x2="360" y2="270" stroke="#999999" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="180" y1="232.2" x2="180" y2="270" stroke="#999999" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- labels -->
  <text x="332" y="86" font-size="15" font-style="italic" fill="#2c5aa0">epi f</text>
  <text x="66" y="112" font-size="15" font-style="italic" fill="#1a1a1a">f</text>
  <text x="238" y="150" font-size="13" fill="#c0392b">chord (above)</text>
  <text x="86" y="196" font-size="13" fill="#1e8449">tangent (below)</text>
  <text x="93" y="285" font-size="13" font-style="italic" fill="#1a1a1a">x</text>
  <text x="353" y="285" font-size="13" font-style="italic" fill="#1a1a1a">y</text>
  <text x="163" y="285" font-size="12" fill="#555555">z</text>
</svg>
