<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 430" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="480" height="430" fill="#ffffff"/>

  <text x="240" y="30" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">The PSD cone S&#178;&#8330;</text>
  <text x="240" y="50" font-size="13" fill="#111111" text-anchor="middle">matrices [[x, y],[y, z]] &#8829; 0</text>

  <!-- apex at origin -->
  <!-- cone: apex bottom, opening upward -->
  <path d="M 240 360 L 120 120 A 120 34 0 0 0 360 120 Z" fill="#7c3aed" fill-opacity="0.18" stroke="#6d28d9" stroke-width="2"/>
  <!-- top ellipse rim (front) -->
  <path d="M 120 120 A 120 34 0 0 0 360 120" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <ellipse cx="240" cy="120" rx="120" ry="34" fill="#7c3aed" fill-opacity="0.10" stroke="#6d28d9" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- axes -->
  <line x1="240" y1="360" x2="240" y2="80" stroke="#111111" stroke-width="1.6" marker-end="url(#ar2)"/>
  <text x="250" y="90" font-size="13" fill="#111111" font-style="italic">y</text>
  <line x1="240" y1="360" x2="410" y2="395" stroke="#111111" stroke-width="1.6" marker-end="url(#ar2)"/>
  <text x="415" y="400" font-size="13" fill="#111111" font-style="italic">z</text>
  <line x1="240" y1="360" x2="70" y2="395" stroke="#111111" stroke-width="1.6" marker-end="url(#ar2)"/>
  <text x="55" y="400" font-size="13" fill="#111111" font-style="italic">x</text>

  <!-- apex dot -->
  <circle cx="240" cy="360" r="4" fill="#111111"/>
  <text x="252" y="360" font-size="12.5" fill="#111111">0 (apex)</text>

  <!-- conditions -->
  <text x="240" y="185" font-size="13" fill="#6d28d9" text-anchor="middle">x &#8805; 0,  z &#8805; 0,</text>
  <text x="240" y="205" font-size="13" fill="#6d28d9" text-anchor="middle">xz &#8805; y&#178;</text>

  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#111111"/>
    </marker>
  </defs>
</svg>
