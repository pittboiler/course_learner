<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="430" fill="#ffffff"/>

  <text x="280" y="30" font-size="17" font-weight="bold" fill="#111111" text-anchor="middle">The maximum-margin classifier</text>

  <!-- margin slab (shaded region between the two margin lines) -->
  <polygon points="64,292 384,52 456,148 136,388" fill="#94a3b8" fill-opacity="0.18"/>

  <!-- margin lines (dashed) -->
  <line x1="64" y1="292" x2="384" y2="52" stroke="#555555" stroke-width="1.6" stroke-dasharray="6 5"/>
  <line x1="136" y1="388" x2="456" y2="148" stroke="#555555" stroke-width="1.6" stroke-dasharray="6 5"/>

  <!-- decision boundary (solid) -->
  <line x1="100" y1="340" x2="420" y2="100" stroke="#111111" stroke-width="2.6"/>
  <text x="98" y="356" font-size="13" fill="#111111">w&#8868;x + b = 0</text>
  <text x="392" y="46" font-size="12" fill="#555555">w&#8868;x + b = +1</text>
  <text x="460" y="156" font-size="12" fill="#555555">w&#8868;x + b = &#8722;1</text>

  <!-- weight-vector normal arrow -->
  <line x1="260" y1="220" x2="233" y2="184" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="216" y="180" font-size="14" fill="#111111" font-style="italic">w</text>

  <!-- margin-width double arrow -->
  <line x1="208" y1="184" x2="280" y2="280" stroke="#0f766e" stroke-width="1.6" marker-start="url(#tealarrow)" marker-end="url(#tealarrow)"/>
  <text x="288" y="242" font-size="13" fill="#0f766e">2 / &#8214;w&#8214;</text>

  <!-- positive class y=+1 (blue circles) -->
  <circle cx="120" cy="140" r="7" fill="#2563eb"/>
  <circle cx="200" cy="100" r="7" fill="#2563eb"/>
  <circle cx="90" cy="215" r="7" fill="#2563eb"/>
  <!-- positive support vectors (on the +1 margin line), ringed -->
  <circle cx="208" cy="184" r="7" fill="#2563eb"/>
  <circle cx="208" cy="184" r="12.5" fill="none" stroke="#111111" stroke-width="1.8"/>
  <circle cx="136" cy="238" r="7" fill="#2563eb"/>
  <circle cx="136" cy="238" r="12.5" fill="none" stroke="#111111" stroke-width="1.8"/>

  <!-- negative class y=-1 (red squares) -->
  <rect x="403" y="308" width="13" height="13" fill="#dc2626"/>
  <rect x="443" y="268" width="13" height="13" fill="#dc2626"/>
  <rect x="338" y="353" width="13" height="13" fill="#dc2626"/>
  <!-- negative support vectors (on the -1 margin line), ringed -->
  <rect x="249" y="291" width="13" height="13" fill="#dc2626"/>
  <circle cx="256" cy="298" r="13" fill="none" stroke="#111111" stroke-width="1.8"/>
  <rect x="369" y="201" width="13" height="13" fill="#dc2626"/>
  <circle cx="376" cy="208" r="13" fill="none" stroke="#111111" stroke-width="1.8"/>

  <!-- legend -->
  <circle cx="70" cy="400" r="7" fill="#2563eb"/>
  <text x="82" y="405" font-size="12.5" fill="#111111">y = +1</text>
  <rect x="163" y="393" width="13" height="13" fill="#dc2626"/>
  <text x="182" y="405" font-size="12.5" fill="#111111">y = &#8722;1</text>
  <circle cx="290" cy="400" r="7" fill="none" stroke="#111111" stroke-width="1.8"/>
  <text x="303" y="405" font-size="12.5" fill="#111111">support vector (&#945;&#7522; &gt; 0)</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#111111"/>
    </marker>
    <marker id="tealarrow" markerWidth="9" markerHeight="9" refX="4" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
