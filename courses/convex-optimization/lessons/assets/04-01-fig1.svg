<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="400" fill="#ffffff"/>

  <!-- axes -->
  <line x1="40" y1="360" x2="530" y2="360" stroke="#111111" stroke-width="1.5"/>
  <line x1="40" y1="360" x2="40" y2="30" stroke="#111111" stroke-width="1.5"/>
  <text x="524" y="382" font-size="16" fill="#111111" font-style="italic">x₁</text>
  <text x="20" y="40" font-size="16" fill="#111111" font-style="italic">x₂</text>

  <!-- elongated concentric contours (ill-conditioned quadratic): wide valley along x1 -->
  <g fill="none" stroke="#2a6bd4" stroke-width="1.4" opacity="0.55">
    <ellipse cx="300" cy="200" rx="235" ry="88"/>
    <ellipse cx="300" cy="200" rx="188" ry="70"/>
    <ellipse cx="300" cy="200" rx="141" ry="53"/>
    <ellipse cx="300" cy="200" rx="94"  ry="35"/>
    <ellipse cx="300" cy="200" rx="47"  ry="18"/>
  </g>

  <!-- zig-zag gradient-descent path: steps roughly perpendicular to contours, bouncing across the narrow valley -->
  <polyline points="85,128 372,258 244,171 336,220 282,190 313,207 300,200"
            fill="none" stroke="#c0392b" stroke-width="2.4"
            stroke-linejoin="round" stroke-linecap="round"/>

  <!-- iterate dots -->
  <g fill="#c0392b">
    <circle cx="85"  cy="128" r="4.5"/>
    <circle cx="372" cy="258" r="4"/>
    <circle cx="244" cy="171" r="4"/>
    <circle cx="336" cy="220" r="4"/>
    <circle cx="282" cy="190" r="3.5"/>
    <circle cx="313" cy="207" r="3.5"/>
  </g>

  <!-- minimizer -->
  <circle cx="300" cy="200" r="5.5" fill="#111111"/>

  <!-- labels -->
  <text x="66"  y="118" font-size="15" fill="#c0392b" font-style="italic">x₀</text>
  <text x="308" y="196" font-size="15" fill="#111111" font-style="italic">x★</text>
  <text x="150" y="66" font-size="14" fill="#1a1a1a">steps ⟂ contours → zig-zag when κ = L/m is large</text>
</svg>
